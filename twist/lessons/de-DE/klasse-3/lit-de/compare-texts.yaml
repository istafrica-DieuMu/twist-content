# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.compare-texts
skill: lit-de.texts-media.compare-texts
curriculum: de-DE
language: de
title:
  de: Zwei Fassungen vergleichen
  en: Comparing two versions
summary: >
  Comparing two versions of a story. Lesson 1 reads two short versions of
  the same Märchen, written for Twist, and finds what stays the same and
  what changes (Figuren, Ort, Ende); lesson 2 compares a story as a book,
  a film and a Hörspiel, says what each one can show, and ends with the
  skill check. Watching a real film clip waits for video in the bank; the
  film versions here are described in words.
metadata:
  year: klasse-3
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.texts-media.fairy-tales, lit-de.texts-media.story-elements]
  also_practises: [lit-de.texts-media.story-elements, lit-de.texts-media.fairy-tales]
  vocabulary: { de: [Fassung, vergleichen, gleich, anders, Buch, Film, Hörspiel, Geräusch, Musik] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: same, what: { de: "sagen, was in zwei Fassungen gleich bleibt", en: saying what stays the same in two versions } }
    - { id: changes, what: { de: "sagen, was sich ändert (Figur, Ort, Zeit, Ende)", en: "saying what changes (character, place, time, ending)" } }
    - { id: media, what: { de: "Buch, Film und Hörspiel vergleichen", en: "comparing a book, a film and an audio play" } }
  misconceptions:
    - id: all-different
      what: Thinks two versions are different stories as soon as any detail changes
      addressed: "lesson 1 sorts into in beiden, nur in A and nur in B (l1-f4, l1-s4, l1-n4); l1-f1 and l1-s1 ask what stays the same, with feedback on l1-f1"
    - id: film-only-pictures
      what: Thinks a film just shows the book in pictures and adds nothing of its own
      addressed: "lesson 2 Learn names what each medium adds (music, sounds, voices); l2-f2, l2-s2 and l2-n2 ask which medium can do what"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Gleich oder anders?", en: "Same or different?" }
    goal:
      de: "Lies zwei Fassungen eines Märchens und finde, was gleich bleibt und was anders ist, so wie der Ort."
      en: "Read two versions of a fairy tale and find what stays the same and what changes, like the place."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Woran erkennst du ein Märchen?"
            say: "Woran erkennst du ein Märchen?"
            options: ["an Zauberei und dem Anfang „Es war einmal“", "an einer Überschrift und Zahlen", "an Reimen am Zeilenende"]
            answer: "an Zauberei und dem Anfang „Es war einmal“"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Frage passt zur Zeit einer Geschichte?"
            say: "Welche Frage passt zur Zeit einer Geschichte?"
            options: ["Wann?", "Wo?", "Wer?"]
            answer: "Wann?"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Fassung A\nEs war einmal ein Müllerssohn namens Jakob. Im Wald traf er einen alten Fuchs. Der Fuchs schenkte ihm eine Zauberflöte. Wer die Flöte hörte, musste tanzen. So entkam Jakob einem Räuber und wurde reich."
            say: "Hier ist ein kurzes Märchen. Lies Fassung A. Achte auf die Figuren, den Ort und das Ende."
          - text: "Fassung B\nVor langer Zeit lebte ein Müllerssohn namens Jakob. An einem Fluss traf er einen alten Fuchs. Der Fuchs schenkte ihm eine Zauberflöte. Mit ihrer Musik brachte Jakob einen Räuber zum Tanzen. Am Ende teilte Jakob sein Gold mit dem Fuchs."
            say: "Das ist eine andere Fassung desselben Märchens. Vieles ist gleich, manches ist anders."
          - text: "gleich: Jakob, Fuchs, Zauberflöte, Räuber | anders: Wald oder Fluss, das Ende"
            say: "Beim Vergleichen fragst du: Was ist in beiden Fassungen gleich? Was ist anders? Prüfe Figuren, Ort, Zeit und Handlung."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "A: Die Prinzessin fand im Garten einen goldenen Schlüssel.\nB: Die Prinzessin fand im Turm einen goldenen Schlüssel.\n\nWas ist in beiden Fassungen gleich?"
                say: "Lies beide Fassungen. Was ist in beiden gleich?"
                options: ["der goldene Schlüssel", "der Ort", "nichts"]
                answer: "der goldene Schlüssel"
                feedback:
                  "nichts": "Fast alles ist gleich. Nur ein Wort ist anders."
                hints:
                  - "Lies beide Sätze Wort für Wort."
                  - "Nur Garten und Turm sind verschieden."
                  - "Der goldene Schlüssel ist gleich."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "A: Der Bär wohnte in einer Höhle.\nB: Der Bär wohnte in einem hohlen Baum.\n\nWas ist anders?"
                say: "Lies beide Fassungen. Was ist anders?"
                options: ["der Ort", "die Figur", "die Zeit"]
                answer: "der Ort"
                hints:
                  - "Frag: Wer? Wo? Wann?"
                  - "Der Bär ist in beiden da. Wo wohnt er?"
                  - "Der Ort ist anders."
              - id: l1-f3
                type: true_false
                text: "A: Am Ende heiratet der Schneider die Königstochter.\nB: Am Ende wird der Schneider König.\n\nIst das Ende in beiden Fassungen gleich?"
                say: "Lies beide Fassungen. Ist das Ende in beiden gleich?"
                answer: false
                hints:
                  - "Lies beide Enden genau."
                  - "Heiraten und König werden ist nicht dasselbe."
                  - "Nein, das Ende ist anders."
              - id: l1-f4
                type: sorting
                text: "A: Es war einmal ein Mädchen. Im Winter ging es in den Wald. Dort fand es ein Reh.\nB: Es war einmal ein Mädchen. Im Sommer ging es in den Wald. Dort fand es einen Hasen.\n\nSortiere."
                say: "Lies beide Fassungen. Sortiere: Kommt es in beiden vor, nur in A oder nur in B?"
                bins:
                  - { id: both, show: { text: "in beiden" }, say: "in beiden" }
                  - { id: a, show: { text: "nur in A" }, say: "nur in A" }
                  - { id: b, show: { text: "nur in B" }, say: "nur in B" }
                options:
                  - { text: "das Mädchen", bin: both }
                  - { text: "der Wald", bin: both }
                  - { text: "das Reh", bin: a }
                  - { text: "der Sommer", bin: b }
                hints:
                  - "Such jedes Wort in A und in B."
                  - "Mädchen und Wald stehen in beiden."
                  - "Reh nur in A, Sommer nur in B."
              - id: l1-f5
                type: multiple_choice
                text: "A: Der Drache war böse und spuckte Feuer.\nB: Der Drache war freundlich und hatte nur Angst vor Menschen.\n\nWas hat sich in Fassung B verändert?"
                say: "Lies beide Fassungen. Was hat sich in Fassung B verändert?"
                options: ["wie der Drache ist", "wo der Drache wohnt", "wann die Geschichte spielt"]
                answer: "wie der Drache ist"
                hints:
                  - "Lies, was über den Drachen gesagt wird."
                  - "Böse oder freundlich?"
                  - "Wie der Drache ist."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "A: Der Hase und der Igel liefen um die Wette über den Acker.\nB: Der Hase und der Igel liefen um die Wette durch den Wald.\n\nWas ist in beiden Fassungen gleich?"
                say: "Lies beide Fassungen. Was ist in beiden gleich?"
                options: ["die Figuren", "der Ort", "nichts"]
                answer: "die Figuren"
                hints: ["Wer läuft in A, wer in B?"]
              - id: l1-s2
                type: multiple_choice
                text: "A: Früh am Morgen klopfte es an der Tür.\nB: Spät in der Nacht klopfte es an der Tür.\n\nWas ist anders?"
                say: "Lies beide Fassungen. Was ist anders?"
                options: ["die Zeit", "der Ort", "die Figur"]
                answer: "die Zeit"
                hints: ["Frag: Wann?"]
              - id: l1-s3
                type: true_false
                text: "A: Die Hexe verwandelte den Prinzen in einen Frosch.\nB: Die Hexe verwandelte den Prinzen in einen Frosch.\n\nSind die beiden Sätze gleich?"
                say: "Lies beide Fassungen genau. Sind die beiden Sätze gleich?"
                answer: true
                hints: ["Vergleiche Wort für Wort."]
              - id: l1-s4
                type: sorting
                text: "A: Ein Junge fand eine Kiste mit Gold. Er gab sie dem König.\nB: Ein Junge fand eine Kiste mit Gold. Er behielt sie und kaufte eine Kuh.\n\nSortiere."
                say: "Lies beide Fassungen. Sortiere: Kommt es in beiden vor, nur in A oder nur in B?"
                bins:
                  - { id: both, show: { text: "in beiden" }, say: "in beiden" }
                  - { id: a, show: { text: "nur in A" }, say: "nur in A" }
                  - { id: b, show: { text: "nur in B" }, say: "nur in B" }
                options:
                  - { text: "die Kiste mit Gold", bin: both }
                  - { text: "der König", bin: a }
                  - { text: "die Kuh", bin: b }
                hints: ["Such jedes Wort in A und in B."]
              - id: l1-s5
                type: multiple_choice
                text: "A: Am Ende bekommt der Wolf Bauchschmerzen und läuft weg.\nB: Am Ende wird der Wolf ein Freund der Geißlein.\n\nWelcher Teil der Handlung ist anders?"
                say: "Lies beide Fassungen. Welcher Teil der Handlung ist anders?"
                options: ["der Schluss", "die Einleitung", "der Ort"]
                answer: "der Schluss"
                hints: ["Beide Sätze beginnen mit „Am Ende“."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "A: Drei Brüder zogen in die Welt hinaus.\nB: Drei Brüder zogen über die Berge.\n\nWas ist in beiden Fassungen gleich?"
                say: "Lies beide Fassungen. Was ist in beiden gleich?"
                options: ["die drei Brüder", "der Weg über die Berge", "nichts"]
                answer: "die drei Brüder"
              - id: l1-n2
                type: multiple_choice
                text: "A: Die Müllerstochter musste Stroh zu Gold spinnen.\nB: Die Bauerntochter musste Stroh zu Gold spinnen.\n\nWas ist anders?"
                say: "Lies beide Fassungen. Was ist anders?"
                options: ["die Figur", "die Aufgabe", "nichts"]
                answer: "die Figur"
              - id: l1-n3
                type: true_false
                text: "A: Der Riese schlief in seinem Schloss.\nB: Der Riese schlief in seiner Höhle.\n\nSpielen beide Fassungen am gleichen Ort?"
                say: "Lies beide Fassungen. Spielen beide am gleichen Ort?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "A: Eine Fee schenkte dem Kind einen Ring. Damit konnte es fliegen.\nB: Eine Fee schenkte dem Kind einen Ring. Damit konnte es mit Tieren sprechen.\n\nSortiere."
                say: "Lies beide Fassungen. Sortiere: Kommt es in beiden vor, nur in A oder nur in B?"
                bins:
                  - { id: both, show: { text: "in beiden" }, say: "in beiden" }
                  - { id: a, show: { text: "nur in A" }, say: "nur in A" }
                  - { id: b, show: { text: "nur in B" }, say: "nur in B" }
                options:
                  - { text: "die Fee", bin: both }
                  - { text: "der Ring", bin: both }
                  - { text: "fliegen", bin: a }
                  - { text: "mit Tieren sprechen", bin: b }
              - id: l1-n5
                type: multiple_choice
                text: "A: Die Kinder verirrten sich im Wald.\nB: Die Kinder verirrten sich in einer großen Stadt.\n\nWas hat sich in Fassung B verändert?"
                say: "Lies beide Fassungen. Was hat sich in Fassung B verändert?"
                options: ["der Ort", "die Figuren", "dass sie sich verirren"]
                answer: "der Ort"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "A: Die Katze fing im Stall eine Maus.\nB: Die Katze fing im Keller eine Maus.\n\nWas ist anders?"
            say: "Lies beide Fassungen. Was ist anders?"
            options: ["der Ort", "die Figuren", "die Zeit"]
            answer: "der Ort"
          - id: l1-c2
            type: true_false
            text: "A: Am Abend kam der König nach Hause.\nB: Am Abend kam die Königin nach Hause.\n\nSind die Figuren in beiden Fassungen gleich?"
            say: "Lies beide Fassungen. Sind die Figuren in beiden gleich?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "A: Der Fischer fing einen goldenen Fisch und ließ ihn frei.\nB: Der Fischer fing einen goldenen Fisch und brachte ihn nach Hause.\n\nWas ist in beiden Fassungen gleich?"
            say: "Lies beide Fassungen. Was ist in beiden gleich?"
            options: ["der goldene Fisch", "was der Fischer mit ihm macht", "nichts"]
            answer: "der goldene Fisch"
          - id: l1-c4
            type: multiple_choice
            text: "A: Ein armer Hirte fand im Schnee einen kleinen Vogel. Er nahm ihn mit nach Hause.\nB: Ein armer Hirte fand im Schnee einen kleinen Vogel. Er pflegte ihn, bis er wieder fliegen konnte.\n\nWas ist anders?"
            say: "Lies beide Fassungen. Was ist anders?"
            options: ["was der Hirte mit dem Vogel macht", "wo der Hirte den Vogel findet", "wer den Vogel findet"]
            answer: "was der Hirte mit dem Vogel macht"
          - id: l1-c5
            type: true_false
            text: "A: Der Riese hatte einen großen Garten voller Rosen.\nB: Der Riese hatte einen großen Garten voller Kirschbäume.\n\nIst der Garten in beiden Fassungen gleich?"
            say: "Lies beide Fassungen. Ist der Garten in beiden gleich?"
            answer: false
          - id: l1-c6
            type: sorting
            text: "A: Zwei Schwestern gingen zum Brunnen. Die jüngere fand dort einen Frosch.\nB: Zwei Schwestern gingen zum Brunnen. Die jüngere fand dort eine goldene Kugel.\n\nSortiere."
            say: "Lies beide Fassungen. Sortiere: Kommt es in beiden vor, nur in A oder nur in B?"
            bins:
              - { id: both, show: { text: "in beiden" }, say: "in beiden" }
              - { id: a, show: { text: "nur in A" }, say: "nur in A" }
              - { id: b, show: { text: "nur in B" }, say: "nur in B" }
            options:
              - { text: "die zwei Schwestern", bin: both }
              - { text: "der Brunnen", bin: both }
              - { text: "der Frosch", bin: a }
              - { text: "die goldene Kugel", bin: b }

  - n: 2
    title: { de: "Buch, Film und Hörspiel", en: "Book, film and audio play" }
    goal:
      de: "Vergleiche eine Geschichte als Buch, Film und Hörspiel. Im Hörspiel zeigen Geräusche, was passiert."
      en: "Compare a story as a book, a film and an audio play. In an audio play, sounds show what happens."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "A: Der Junge ritt auf einem weißen Pferd.\nB: Der Junge ritt auf einem schwarzen Pferd.\n\nWas ist anders?"
            say: "Lies beide Fassungen. Was ist anders?"
            options: ["die Farbe des Pferdes", "die Figur", "nichts"]
            answer: "die Farbe des Pferdes"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Zwei Fassungen einer Geschichte können dieselben Figuren und ein anderes Ende haben. Stimmt das?"
            say: "Zwei Fassungen einer Geschichte können dieselben Figuren und ein anderes Ende haben. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Buch: Wörter und manchmal Bilder"
            say: "Viele Geschichten gibt es als Buch, als Film und als Hörspiel. Im Buch erzählen Wörter. Wie die Figuren aussehen, stellst du dir oft selbst vor."
          - text: "Film: bewegte Bilder, Stimmen, Musik, Geräusche"
            say: "Im Film siehst du die Figuren und hörst ihre Stimmen. Musik macht eine Stelle spannend oder lustig."
          - text: "Hörspiel: Stimmen, Musik, Geräusche, keine Bilder"
            say: "Im Hörspiel hörst du nur. Geräusche wie Schritte oder Donner zeigen dir, was passiert. Oft lässt ein Film oder Hörspiel etwas weg oder erfindet etwas dazu. Vergleiche dann wieder: Was ist gleich, was ist anders?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Im Buch steht: „Es war eine dunkle, stürmische Nacht.“\n\nWie zeigt ein Hörspiel diese Stelle?"
                say: "Lies die Stelle aus dem Buch. Wie zeigt ein Hörspiel diese Stelle?"
                options: ["mit Geräuschen von Wind und Regen", "mit einem Bild vom Mond", "gar nicht"]
                answer: "mit Geräuschen von Wind und Regen"
                hints:
                  - "Ein Hörspiel hat keine Bilder."
                  - "Was hörst du in einer stürmischen Nacht?"
                  - "mit Geräuschen von Wind und Regen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was kann ein Film, aber ein Hörspiel nicht?"
                say: "Was kann ein Film, aber ein Hörspiel nicht?"
                options: ["zeigen, wie die Figuren aussehen", "Musik spielen", "Stimmen hören lassen"]
                answer: "zeigen, wie die Figuren aussehen"
                feedback:
                  "Musik spielen": "Musik gibt es im Film und auch im Hörspiel."
                hints:
                  - "Was hat ein Hörspiel nicht?"
                  - "Im Hörspiel gibt es keine Bilder."
                  - "zeigen, wie die Figuren aussehen."
              - id: l2-f3
                type: true_false
                text: "Im Buch hat die Hexe Rosa eine Katze. Im Film hat sie einen Raben.\n\nIst das ein Unterschied zwischen Buch und Film?"
                say: "Lies den Text. Ist das ein Unterschied zwischen Buch und Film?"
                answer: true
                hints:
                  - "Vergleiche das Tier im Buch und im Film."
                  - "Katze und Rabe sind verschieden."
                  - "Ja, das ist ein Unterschied."
              - id: l2-f4
                type: sorting
                text: "Buch: Ella findet einen sprechenden Stein. Sie zeigt ihn niemandem.\nFilm: Ella findet einen sprechenden Stein. Sie zeigt ihn ihrem Bruder. Dazu läuft lustige Musik.\n\nSortiere."
                say: "Lies, wie die Geschichte im Buch und im Film erzählt wird. Sortiere: in beiden, nur im Buch, nur im Film?"
                bins:
                  - { id: both, show: { text: "in beiden" }, say: "in beiden" }
                  - { id: book, show: { text: "nur im Buch" }, say: "nur im Buch" }
                  - { id: film, show: { text: "nur im Film" }, say: "nur im Film" }
                options:
                  - { text: "der sprechende Stein", bin: both }
                  - { text: "Ella zeigt den Stein niemandem.", bin: book }
                  - { text: "der Bruder", bin: film }
                  - { text: "lustige Musik", bin: film }
                hints:
                  - "Such jedes Kärtchen im Buch und im Film."
                  - "Der Stein ist in beiden. Wem zeigt Ella ihn?"
                  - "Stein: beide. Niemandem zeigen: Buch. Bruder und Musik: Film."
              - id: l2-f5
                type: multiple_choice
                text: "Wie zeigt ein Film, dass gleich etwas Spannendes passiert?"
                say: "Wie zeigt ein Film, dass gleich etwas Spannendes passiert?"
                options: ["mit leiser, unheimlicher Musik", "mit einer Seitenzahl", "mit einer Überschrift"]
                answer: "mit leiser, unheimlicher Musik"
                hints:
                  - "Was hörst du im Film, bevor etwas Spannendes passiert?"
                  - "Seitenzahlen gibt es nur im Buch."
                  - "mit leiser, unheimlicher Musik."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Buch steht: „Die Tür knarrte.“\n\nWie zeigt ein Hörspiel diese Stelle?"
                say: "Lies die Stelle aus dem Buch. Wie zeigt ein Hörspiel diese Stelle?"
                options: ["mit einem Knarrgeräusch", "mit einem Bild der Tür", "mit einer Überschrift"]
                answer: "mit einem Knarrgeräusch"
                hints: ["Ein Hörspiel hat nur Töne."]
              - id: l2-s2
                type: multiple_choice
                text: "Wo musst du dir am meisten selbst vorstellen, wie die Figuren aussehen?"
                say: "Wo musst du dir am meisten selbst vorstellen, wie die Figuren aussehen?"
                options: ["in einem Buch ohne Bilder", "im Film", "in einem Bilderbuch"]
                answer: "in einem Buch ohne Bilder"
                hints: ["Wo siehst du die Figuren nicht?"]
              - id: l2-s3
                type: true_false
                text: "Im Buch und im Film heißt der Hund Struppi. In beiden findet er den verlorenen Schlüssel.\n\nGibt es hier einen Unterschied?"
                say: "Lies den Text. Gibt es hier einen Unterschied zwischen Buch und Film?"
                answer: false
                hints: ["Vergleiche Name und Handlung."]
              - id: l2-s4
                type: sorting
                text: "Buch: Der Ritter kämpft gegen einen Drachen. Am Ende gewinnt er.\nHörspiel: Der Ritter kämpft gegen einen Drachen. Man hört Schwerter klirren. Am Ende werden sie Freunde.\n\nSortiere."
                say: "Lies, wie die Geschichte im Buch und im Hörspiel erzählt wird. Sortiere: in beiden, nur im Buch, nur im Hörspiel?"
                bins:
                  - { id: both, show: { text: "in beiden" }, say: "in beiden" }
                  - { id: book, show: { text: "nur im Buch" }, say: "nur im Buch" }
                  - { id: audio, show: { text: "nur im Hörspiel" }, say: "nur im Hörspiel" }
                options:
                  - { text: "der Kampf gegen den Drachen", bin: both }
                  - { text: "Der Ritter gewinnt.", bin: book }
                  - { text: "klirrende Schwerter", bin: audio }
                  - { text: "Sie werden Freunde.", bin: audio }
                hints: ["Wie endet es im Buch, wie im Hörspiel?"]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Film dauert eine Stunde. Das Buch hat 200 Seiten. Was passiert deshalb oft im Film?"
                say: "Ein Film dauert eine Stunde, das Buch hat 200 Seiten. Was passiert deshalb oft im Film?"
                options: ["Manche Stellen werden weggelassen.", "Es kommen mehr Seiten dazu.", "Der Film hat keine Figuren."]
                answer: "Manche Stellen werden weggelassen."
                hints: ["Passt alles aus einem langen Buch in eine Stunde?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Im Buch steht: „Ein Pferd galoppierte heran.“\n\nWie zeigt ein Hörspiel diese Stelle?"
                say: "Lies die Stelle aus dem Buch. Wie zeigt ein Hörspiel diese Stelle?"
                options: ["mit dem Geräusch von Hufen", "mit einem Foto vom Pferd", "mit fetter Schrift"]
                answer: "mit dem Geräusch von Hufen"
              - id: l2-n2
                type: multiple_choice
                text: "Was gibt es im Hörspiel und im Film, aber nicht in einem Buch?"
                say: "Was gibt es im Hörspiel und im Film, aber nicht in einem Buch?"
                options: ["Musik und Geräusche", "Wörter", "Figuren"]
                answer: "Musik und Geräusche"
              - id: l2-n3
                type: true_false
                text: "Im Buch spielt die Geschichte im Winter. Im Film spielt sie im Sommer.\n\nIst die Zeit in Buch und Film gleich?"
                say: "Lies den Text. Ist die Zeit in Buch und Film gleich?"
                answer: false
