# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.double-consonants
skill: lit-de.spelling.double-consonants
curriculum: de-DE
language: de
title:
  de: Doppelte Mitlaute
  en: Double consonants
summary: >
  After a short Selbstlaut the one Mitlaut you hear is often written
  twice. Lesson 1 hears it in Sonne, Teller and Ball and sorts words with
  and without a double letter; lesson 2 learns when not to double (two
  different Mitlaute as in Kante and Hund, or a long Selbstlaut as in
  Hose), and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.short-long-vowels]
  also_practises: [lit-de.spelling.short-long-vowels, lit-de.spelling-strategies.syllable-swinging]
  vocabulary: { de: [doppelter Mitlaut, kurzer Selbstlaut, langer Selbstlaut, verdoppeln] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: forget-double
      what: Writes one letter after a short vowel (Muter, Bet, Schif)
      addressed: lesson 1 Learn hears the short vowel and swings Tel-ler; a double-letter gap in every stage of lesson 1, and l1-s3 and l1-n3 show Kete and Schif
    - id: double-everything
      what: Doubles after a long vowel or before a second Mitlaut (Hosse, Hemmd, Gabbel, Hunnd)
      addressed: lesson 2 Learn contrasts Kanne and Kante, Hose and Sonne; every stage of lesson 2 has a "Wird verdoppelt?" task, a no-double gap and a wrongly doubled card
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Sonne, Teller, Ball", en: "Sonne, Teller, Ball" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Ist das o kurz oder lang?"
            say: "Hör zu. Ist das o kurz oder lang?"
            audio: { de: "Topf." }
            options: ["kurz", "lang"]
            keep_order: true
            answer: "kurz"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie schwingst du Koffer?"
            say: "Wie schwingst du das Wort Koffer?"
            options: ["Kof-fer", "Ko-ffer", "Koff-er"]
            answer: "Kof-fer"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Son-ne"
            say: "Hör genau hin: Sonne. Das o ist kurz. Nach dem kurzen o hörst du nur einen Mitlaut, das n. Darum schreibst du ihn doppelt."
            show: { object: sun }
          - text: "Tel-ler"
            say: "Beim Schwingen merkst du es auch: Tel, ler. Das l gehört zu beiden Silben. Darum steht dort ll."
          - text: "Ball | Bett | Kamm"
            show: { object: ball }
            say: "Auch am Wortende steht nach einem kurzen Selbstlaut oft ein doppelter Mitlaut: Ball, Bett, Kamm."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "n oder nn?"
                say: "Die Tanne. Was fehlt?"
                show: { object: fir-tree }
                frame: "Ta_e"
                options: ["nn", "n"]
                answer: ["nn"]
                hints:
                  - "Ist das a kurz oder lang?"
                  - "Es ist kurz, und danach hörst du nur das n. Schwinge: Tan, ne."
                  - "Du schreibst nn: Tanne."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Die Mutter. Welches Wort ist richtig geschrieben?"
                options: ["Mutter", "Muter", "Muhter"]
                answer: "Mutter"
                option_audio: false
                hints:
                  - "Ist das u kurz oder lang?"
                  - "Es ist kurz. Schwinge: Mut, ter."
                  - "Mutter mit tt."
              - id: l1-f3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Puppe. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Puppe" }
                answer: true
                hints:
                  - "Ist das u kurz?"
                  - "Ja, und danach hörst du nur das p."
                  - "Ja, Puppe mit pp ist richtig."
              - id: l1-f4
                type: fill_in_blank
                text: "l oder ll?"
                say: "Die Brille. Was fehlt?"
                frame: "Bri_e"
                options: ["ll", "l"]
                answer: ["ll"]
                hints:
                  - "Ist das i kurz oder lang?"
                  - "Es ist kurz. Schwinge: Bril, le."
                  - "Du schreibst ll: Brille."
              - id: l1-f5
                type: sorting
                text: "Mit oder ohne doppelten Mitlaut?"
                say: "Hör dir jedes Wort an. Hat es einen doppelten Mitlaut wie Sonne oder nicht, wie Rose? Sortiere die Bilder."
                bins:
                  - { id: doppelt, show: { object: sun }, say: "Mit doppeltem Mitlaut, wie Sonne." }
                  - { id: einfach, show: { object: rose }, say: "Ohne doppelten Mitlaut, wie Rose." }
                options:
                  - { object: cup, bin: doppelt }
                  - { object: nose, bin: einfach }
                  - { object: jug, bin: doppelt }
                  - { object: oven, bin: einfach }
                hints:
                  - "Hör bei jedem Wort: Ist der Selbstlaut kurz?"
                  - "Tasse und Kanne haben einen kurzen Selbstlaut, Nase und Ofen einen langen."
                  - "Doppelt: Tasse, Kanne. Nicht doppelt: Nase, Ofen."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "m oder mm?"
                say: "Der Himmel. Was fehlt?"
                frame: "Hi_el"
                options: ["mm", "m"]
                answer: ["mm"]
                hints: ["Schwinge: Him, mel."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Löffel. Welches Wort ist richtig geschrieben?"
                show: { object: spoon }
                options: ["Löffel", "Löfel", "Löhfel"]
                answer: "Löffel"
                option_audio: false
                hints: ["Schwinge: Löf, fel."]
              - id: l1-s3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Kette. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Kete" }
                answer: false
                hints: ["Ist das e kurz? Wie viele Mitlaute hörst du danach?"]
              - id: l1-s4
                type: fill_in_blank
                text: "p oder pp?"
                say: "Die Suppe. Was fehlt?"
                frame: "Su_e"
                options: ["pp", "p"]
                answer: ["pp"]
                hints: ["Schwinge: Sup, pe."]
              - id: l1-s5
                type: sorting
                text: "Mit oder ohne doppelten Mitlaut?"
                say: "Hat das Wort einen doppelten Mitlaut wie Sonne oder nicht, wie Rose? Sortiere die Bilder."
                bins:
                  - { id: doppelt, show: { object: sun }, say: "Mit doppeltem Mitlaut, wie Sonne." }
                  - { id: einfach, show: { object: rose }, say: "Ohne doppelten Mitlaut, wie Rose." }
                options:
                  - { object: monkey, bin: doppelt }
                  - { object: rabbit, bin: einfach }
                  - { object: bin, bin: doppelt }
                  - { object: trousers, bin: einfach }
                hints: ["Hör bei jedem Wort, ob der Selbstlaut kurz ist."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "m oder mm?"
                say: "Das Zimmer. Was fehlt?"
                frame: "Zi_er"
                options: ["mm", "m"]
                answer: ["mm"]
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Schwamm. Welches Wort ist richtig geschrieben?"
                options: ["Schwamm", "Schwam", "Schwahm"]
                answer: "Schwamm"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Das Schiff. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Schif" }
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "t oder tt?"
                say: "Die Butter. Was fehlt?"
                frame: "Bu_er"
                options: ["tt", "t"]
                answer: ["tt"]
              - id: l1-n5
                type: sorting
                text: "Mit oder ohne doppelten Mitlaut?"
                say: "Hat das Wort einen doppelten Mitlaut wie Sonne oder nicht, wie Rose? Sortiere die Bilder."
                bins:
                  - { id: doppelt, show: { object: sun }, say: "Mit doppeltem Mitlaut, wie Sonne." }
                  - { id: einfach, show: { object: rose }, say: "Ohne doppelten Mitlaut, wie Rose." }
                options:
                  - { object: scissors, bin: einfach }
                  - { object: knife, bin: doppelt }
                  - { object: cheese, bin: einfach }
                  - { object: water, bin: doppelt }

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "l oder ll?"
            say: "Die Wolle. Was fehlt?"
            frame: "Wo_e"
            options: ["ll", "l"]
            answer: ["ll"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Die Hütte. Welches Wort ist richtig geschrieben?"
            options: ["Hütte", "Hühte", "Hüthe"]
            answer: "Hütte"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Affe. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Affe" }
            answer: true

  - n: 2
    title: { de: "Wann wird verdoppelt?", en: "When to double" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "s oder ss?"
            say: "Die Tasse. Was fehlt?"
            show: { object: cup }
            frame: "Ta_e"
            options: ["ss", "s"]
            answer: ["ss"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort hat einen doppelten Mitlaut?"
            say: "Welches Wort hat einen doppelten Mitlaut?"
            options: ["Wanne", "Wagen", "Wal"]
            answer: "Wanne"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Kanne | Kante"
            say: "Hör genau hin: Kanne, Kante. In beiden Wörtern ist das a kurz. Bei Kanne hörst du danach nur das n, darum steht nn. Bei Kante hörst du n und t, zwei verschiedene Mitlaute. Dann wird nicht verdoppelt."
          - text: "Hose | Sonne"
            say: "Nach einem langen Selbstlaut wird nicht verdoppelt. Hose hat ein langes o, Sonne ein kurzes."
            show: { object: trousers }
          - text: "kurz + nur ein Mitlaut = doppelt"
            say: "Die Regel heißt: Ist der Selbstlaut kurz und hörst du danach nur einen Mitlaut, dann verdoppelst du ihn. Nur k und z verdoppelst du nicht. Dafür gibt es ck und tz, die lernst du bald."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lampe: Wird der Mitlaut verdoppelt?"
                say: "Lampe. Wird hier ein Mitlaut verdoppelt?"
                show: { object: lamp }
                options: ["Nein, man hört m und p.", "Ja, das a ist kurz."]
                keep_order: true
                answer: "Nein, man hört m und p."
                hints:
                  - "Ist das a kurz oder lang?"
                  - "Es ist kurz. Hörst du danach einen Mitlaut oder zwei?"
                  - "Nein. Man hört m und p, also wird nicht verdoppelt."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "n oder nn?"
                say: "Der Hund. Was fehlt?"
                show: { object: dog }
                frame: "Hu_d"
                options: ["n", "nn"]
                answer: ["n"]
                hints:
                  - "Wie viele Mitlaute hörst du nach dem u?"
                  - "Du hörst n und d, zwei verschiedene."
                  - "Nur ein n: Hund."
              - id: l2-f3
                type: fill_in_blank
                text: "s oder ss?"
                say: "Die Kiste. Was fehlt?"
                show: { object: box }
                frame: "Ki_te"
                options: ["s", "ss"]
                answer: ["s"]
                hints:
                  - "Wie viele Mitlaute hörst du nach dem i?"
                  - "Du hörst s und t."
                  - "Nur ein s: Kiste."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Schule. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Schulle" }
                answer: false
                hints:
                  - "Ist das u lang oder kurz?"
                  - "Sprich langsam: Schu, le. Was gilt nach einem langen Selbstlaut?"
                  - "Nein. Nach einem langen Selbstlaut wird nicht verdoppelt. Richtig ist Schule."
              - id: l2-f5
                type: sorting
                text: "Mit oder ohne doppelten Mitlaut?"
                say: "Hat das Wort einen doppelten Mitlaut wie Sonne oder nicht, wie Rose? Sortiere die Bilder."
                bins:
                  - { id: doppelt, show: { object: sun }, say: "Mit doppeltem Mitlaut, wie Sonne." }
                  - { id: einfach, show: { object: rose }, say: "Ohne doppelten Mitlaut, wie Rose." }
                options:
                  - { object: lamp, bin: einfach }
                  - { object: spoon, bin: doppelt }
                  - { object: dog, bin: einfach }
                  - { object: cup, bin: doppelt }
                hints:
                  - "Frag dich: Ist der Selbstlaut kurz, und hörst du danach nur einen Mitlaut?"
                  - "Bei Lampe und Hund hörst du zwei verschiedene Mitlaute."
                  - "Doppelt: Löffel, Tasse. Nicht doppelt: Lampe, Hund."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wolke: Wird der Mitlaut verdoppelt?"
                say: "Wolke. Wird hier ein Mitlaut verdoppelt?"
                show: { object: cloud }
                options: ["Nein, man hört l und k.", "Ja, das o ist kurz."]
                keep_order: true
                answer: "Nein, man hört l und k."
                hints: ["Wie viele Mitlaute hörst du nach dem o?"]
              - id: l2-s2
                type: fill_in_blank
                text: "n oder nn?"
                say: "Der Wind. Was fehlt?"
                frame: "Wi_d"
                options: ["n", "nn"]
                answer: ["n"]
                hints: ["Du hörst n und d."]
              - id: l2-s3
                type: fill_in_blank
                text: "l oder ll?"
                say: "Der Roller. Was fehlt?"
                frame: "Ro_er"
                options: ["ll", "l"]
                answer: ["ll"]
                hints: ["Schwinge: Rol, ler."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Das Hemd. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Hemmd" }
                answer: false
                hints: ["Hörst du nach dem e einen Mitlaut oder zwei?"]
              - id: l2-s5
                type: sorting
                text: "Mit oder ohne doppelten Mitlaut?"
                say: "Hat das Wort einen doppelten Mitlaut wie Sonne oder nicht, wie Rose? Sortiere die Bilder."
                bins:
                  - { id: doppelt, show: { object: sun }, say: "Mit doppeltem Mitlaut, wie Sonne." }
                  - { id: einfach, show: { object: rose }, say: "Ohne doppelten Mitlaut, wie Rose." }
                options:
                  - { object: bed, bin: doppelt }
                  - { object: goat, bin: einfach }
                  - { object: knife, bin: doppelt }
                  - { object: mouth, bin: einfach }
                hints: ["Ist der Selbstlaut kurz, und hörst du danach nur einen Mitlaut?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Pfanne: Wird der Mitlaut verdoppelt?"
                say: "Pfanne. Wird hier ein Mitlaut verdoppelt?"
                options: ["Ja, das a ist kurz und man hört nur n.", "Nein, das a ist lang."]
                keep_order: true
                answer: "Ja, das a ist kurz und man hört nur n."
              - id: l2-n2
                type: fill_in_blank
                text: "r oder rr?"
                say: "Die Kerze. Was fehlt?"
                frame: "Ke_ze"
                options: ["r", "rr"]
                answer: ["r"]
              - id: l2-n3
                type: fill_in_blank
                text: "l oder ll?"
                say: "Das Fell. Was fehlt?"
                frame: "Fe_"
                options: ["ll", "l"]
                answer: ["ll"]
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Gabel. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Gabbel" }
                answer: false
              - id: l2-n5
                type: sorting
                text: "Mit oder ohne doppelten Mitlaut?"
                say: "Hat das Wort einen doppelten Mitlaut wie Sonne oder nicht, wie Rose? Sortiere die Bilder."
                bins:
                  - { id: doppelt, show: { object: sun }, say: "Mit doppeltem Mitlaut, wie Sonne." }
                  - { id: einfach, show: { object: rose }, say: "Ohne doppelten Mitlaut, wie Rose." }
                options:
                  - { object: leaf, bin: doppelt }
                  - { object: arm, bin: einfach }
                  - { object: fir-tree, bin: doppelt }
                  - { object: lion, bin: einfach }

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "m oder mm?"
            say: "Der Sommer. Was fehlt?"
            frame: "So_er"
            options: ["mm", "m"]
            answer: ["mm"]
          - id: l2-c2
            type: fill_in_blank
            text: "n oder nn?"
            say: "Die Gans. Was fehlt?"
            frame: "Ga_s"
            options: ["n", "nn"]
            answer: ["n"]
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Das Wetter. Welches Wort ist richtig geschrieben?"
            options: ["Wetter", "Weter", "Wehter"]
            answer: "Wetter"
            option_audio: false
          - id: l2-c4
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Ofen. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Ofen" }
            answer: true
          - id: l2-c5
            type: multiple_choice
            text: "Mantel: Wird der Mitlaut verdoppelt?"
            say: "Mantel. Wird hier ein Mitlaut verdoppelt?"
            options: ["Nein, man hört n und t.", "Ja, das a ist kurz."]
            keep_order: true
            answer: "Nein, man hört n und t."
