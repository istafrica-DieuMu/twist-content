# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.keyboard
skill: lit-de.handwriting.keyboard
curriculum: de-DE
language: de
title:
  de: Schreiben auf der Tastatur
  en: Typing on a keyboard
summary: >
  Typing a short text on a German keyboard and putting it right on the
  screen. Lesson 1 types words and sentences: the Umschalttaste for a
  capital, one press of the Leertaste between words, and the keys for
  ä, ö, ü and ß; lesson 2 adds the Satzzeichen (Punkt and Komma on their
  own keys, Fragezeichen and Ausrufezeichen with the Umschalttaste),
  corrects with the Rücktaste and the cursor, reads the red wavy line as
  a hint and not as the last word, and ends with the skill check. The
  child chooses keys, orders key presses and finds typing mistakes in
  short texts; a typing field in the app would let the child type for
  real.
metadata:
  year: klasse-3
  topic: { de: Texte gestalten, en: Laying out text }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.handwriting.copy-sentences]
  also_practises: [lit-de.spelling.capital-nouns]
  vocabulary: { de: [Tastatur, Taste, Umschalttaste, Feststelltaste, Leertaste, Eingabetaste, Rücktaste, Cursor, Umlaut, Satzzeichen, Rechtschreibprüfung] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: caps-lock-for-capitals
      what: Switches on the Feststelltaste for one capital, or types every word in small letters because the keys show capitals
      addressed: "lesson 1 Learn shows that the keys show capitals but type small letters, and that the Umschalttaste is held for one capital; l1-f2 (with feedback), l1-s2, l1-n2, l1-n4 and l2-c1 choose the key or check it; l1-f5 judges text typed with the Feststelltaste"
    - id: space-errors
      what: Presses the Leertaste twice or not at all, or puts a space before the Punkt
      addressed: "lesson 1 Learn says one space after each word and none before a Satzzeichen; l1-f4 (with feedback), l1-s4, l1-n5, l2-f5 and l2-c3 find the spacing mistake"
    - id: trust-spellcheck
      what: Thinks a text with no red line has no mistakes, or takes the first suggestion without reading it
      addressed: "lesson 2 Learn shows a mistake the red line misses (Wal for Wald); l2-f4 (with feedback), l2-s4, l2-n4 and l2-c5"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Buchstaben und Leertaste", en: "Letters and the space bar" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was gehört an den Anfang eines Satzes?"
            options: ["ein großer Buchstabe", "ein Punkt", "eine Lücke"]
            answer: "ein großer Buchstabe"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Satz ist richtig abgeschrieben?"
            say: "Die Vorlage heißt: Wir gehen in den Park. Welcher Satz ist richtig abgeschrieben?"
            options: ["Wir gehen in den Park.", "Wir gehen inden Park.", "wir gehen in den Park."]
            answer: "Wir gehen in den Park."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Umschalttaste ⇧ + h = H"
            say: "Auf den Tasten stehen große Buchstaben. Drückst du nur die Taste, kommt ein kleiner Buchstabe. Für einen großen hältst du die Umschalttaste fest und drückst dann den Buchstaben. Sie hat einen Pfeil nach oben. Es gibt sie zweimal, links und rechts."
          - text: "Ich_mag_Kekse."
            say: "Nach jedem Wort drückst du einmal die Leertaste. Das ist die lange Taste unten. Vor dem Punkt kommt keine Lücke. Der Punkt steht direkt hinter dem letzten Wort."
          - text: "ä ö ü ß"
            say: "Eine deutsche Tastatur hat eigene Tasten für ä, ö und ü. Sie liegen rechts, gleich neben dem P und dem L. Auch das ß hat eine eigene Taste, oben rechts neben der Null."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Taste ist das?"
                say: "Du willst zwischen zwei Wörtern eine Lücke machen. Welche Taste drückst du?"
                options: ["die Leertaste", "die Umschalttaste", "die Eingabetaste"]
                answer: "die Leertaste"
                hints:
                  - "Es ist die längste Taste der Tastatur."
                  - "Sie macht einen leeren Platz."
                  - "Die Leertaste."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie schreibst du ein großes H?"
                options: ["die Umschalttaste festhalten und h drücken", "die Feststelltaste drücken und das ganze Wort tippen", "zweimal h drücken"]
                answer: "die Umschalttaste festhalten und h drücken"
                feedback:
                  "die Feststelltaste drücken und das ganze Wort tippen": "Dann wird das ganze Wort groß: HUND. Du willst aber nur den ersten Buchstaben groß haben."
                  "zweimal h drücken": "Dann steht da hh. Für einen großen Buchstaben brauchst du eine zweite Taste."
                hints:
                  - "Du brauchst zwei Tasten gleichzeitig."
                  - "Eine davon hat einen Pfeil nach oben."
                  - "Umschalttaste festhalten, dann h."
              - id: l1-f3
                type: ordering
                text: "Bring die Tasten in die richtige Reihenfolge."
                say: "Du tippst das Wort Oma. Bring die Tasten in die richtige Reihenfolge."
                options: ["m", "Umschalttaste + o", "a"]
                slot_count: 3
                answer: ["Umschalttaste + o", "m", "a"]
                option_audio: false
                hints:
                  - "Oma fängt mit einem großen O an."
                  - "Für das große O brauchst du die Umschalttaste."
                  - "Umschalttaste und o, dann m, dann a."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Satz ist richtig getippt?"
                say: "Welcher Satz ist richtig getippt? Achte auf die Lücken."
                options: ["Ich mag Kekse.", "Ich mag Kekse .", "IchmagKekse."]
                answer: "Ich mag Kekse."
                option_audio: false
                feedback:
                  "Ich mag Kekse .": "Vor dem Punkt ist eine Lücke. Der Punkt steht direkt hinter dem letzten Wort."
                  "IchmagKekse.": "Hier fehlen die Lücken. Nach jedem Wort drückst du einmal die Leertaste."
                hints:
                  - "Nach jedem Wort kommt eine Lücke."
                  - "Vor dem Punkt kommt keine Lücke."
                  - "Ich mag Kekse."
              - id: l1-f5
                type: true_false
                text: "Lea tippt: MEIN HUND HEISST BELLO. Ist das richtig getippt?"
                say: "Lea hat die Feststelltaste angelassen. Jetzt steht da: MEIN HUND HEISST BELLO. Ist das richtig getippt?"
                answer: false
                hints:
                  - "Welche Wörter schreibst du groß?"
                  - "Groß schreibst du nur am Satzanfang und bei Nomen und Namen."
                  - "Nein. Lea muss die Feststelltaste wieder ausschalten."
              - id: l1-f6
                type: multiple_choice
                text: "Wo findest du das ü?"
                say: "Du tippst das Wort Tür. Wo findest du das ü?"
                options: ["Es hat eine eigene Taste.", "Ich tippe u und einen Punkt.", "Ich tippe zweimal u."]
                answer: "Es hat eine eigene Taste."
                hints:
                  - "Eine deutsche Tastatur hat Tasten für ä, ö und ü."
                  - "Sie liegen rechts, neben dem P und dem L."
                  - "Das ü hat eine eigene Taste."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie oft drückst du die Leertaste zwischen zwei Wörtern?"
                options: ["einmal", "dreimal", "gar nicht"]
                answer: "einmal"
                hints: ["Eine Lücke reicht."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie schreibst du ein großes B?"
                options: ["die Umschalttaste festhalten und b drücken", "b ganz fest drücken", "die Leertaste und b drücken"]
                answer: "die Umschalttaste festhalten und b drücken"
                hints: ["Welche Taste hat den Pfeil nach oben?"]
              - id: l1-s3
                type: ordering
                text: "Bring die Tasten in die richtige Reihenfolge."
                say: "Du tippst Ali malt. Bring die Tasten in die richtige Reihenfolge."
                options: ["malt", "Umschalttaste + a", "Leertaste", "li"]
                slot_count: 4
                answer: ["Umschalttaste + a", "li", "Leertaste", "malt"]
                option_audio: false
                hints: ["Ali ist ein Name. Zwischen den Wörtern kommt eine Lücke."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Satz ist richtig getippt?"
                say: "Welcher Satz ist richtig getippt? Achte auf die Lücken."
                options: ["Der Ball ist rot.", "Der Ball istrot.", "Der Ball ist rot ."]
                answer: "Der Ball ist rot."
                option_audio: false
                hints: ["Einmal Leertaste nach jedem Wort, keine Lücke vor dem Punkt."]
              - id: l1-s5
                type: multiple_choice
                text: "Wo findest du das ß?"
                say: "Du tippst das Wort Fuß. Wo findest du das ß?"
                options: ["Es hat eine eigene Taste.", "Ich tippe ein großes B.", "Es gibt kein ß auf der Tastatur."]
                answer: "Es hat eine eigene Taste."
                hints: ["Schau oben rechts, neben der Null."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Taste macht eine Lücke?"
                options: ["die Leertaste", "die Rücktaste", "die Feststelltaste"]
                answer: "die Leertaste"
              - id: l1-n2
                type: multiple_choice
                text: "Was passiert, wenn du nur die Taste K drückst?"
                options: ["Es erscheint ein kleines k.", "Es erscheint ein großes K.", "Es passiert nichts."]
                answer: "Es erscheint ein kleines k."
              - id: l1-n3
                type: ordering
                text: "Bring die Tasten in die richtige Reihenfolge."
                say: "Du tippst das Wort Bär. Bring die Tasten in die richtige Reihenfolge."
                options: ["r", "ä", "Umschalttaste + b"]
                slot_count: 3
                answer: ["Umschalttaste + b", "ä", "r"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Für ein großes A hältst du die Umschalttaste fest und drückst a."
                say: "Für ein großes A am Satzanfang hältst du die Umschalttaste fest und drückst a. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Welcher Satz ist richtig getippt?"
                say: "Welcher Satz ist richtig getippt?"
                options: ["Mia trinkt Saft.", "mia trinkt saft.", "Mia trinkt Saft ."]
                answer: "Mia trinkt Saft."
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie schreibst du ein großes T?"
            options: ["die Umschalttaste festhalten und t drücken", "zweimal t drücken", "die Leertaste und t drücken"]
            answer: "die Umschalttaste festhalten und t drücken"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Vor einem Punkt drückst du die Leertaste."
            say: "Vor einem Punkt drückst du die Leertaste. Stimmt das?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Wo findest du das ö?"
            say: "Du tippst das Wort schön. Wo findest du das ö?"
            options: ["Es hat eine eigene Taste.", "Ich tippe zweimal o.", "Ich tippe o und e."]
            answer: "Es hat eine eigene Taste."

  - n: 2
    title: { de: "Satzzeichen und verbessern", en: "Punctuation and corrections" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie schreibst du ein großes M?"
            options: ["die Umschalttaste festhalten und m drücken", "die Feststelltaste für immer anlassen", "m und n drücken"]
            answer: "die Umschalttaste festhalten und m drücken"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Satz ist richtig getippt?"
            say: "Welcher Satz ist richtig getippt?"
            options: ["Opa liest.", "Opaliest.", "Opa liest ."]
            answer: "Opa liest."
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: ".  ,  ?  !"
            say: "Punkt und Komma haben eigene Tasten, unten gleich rechts neben dem M. Das Fragezeichen findest du auf der ß-Taste, das Ausrufezeichen auf der Taste mit der 1. Für beide hältst du die Umschalttaste fest."
          - text: "Rücktaste ⌫"
            say: "Hast du dich vertippt, drückst du die Rücktaste. Sie löscht den Buchstaben links vom Cursor. Der Cursor ist der kleine blinkende Strich. Klickst du an eine andere Stelle im Text, springt der Cursor dorthin."
          - text: "Im Wal wohnen Rehe."
            say: "Eine rote Wellenlinie zeigt: Hier ist vielleicht ein Fehler. Aber das Programm findet nicht alles. In diesem Satz fehlt ein d. Es muss Wald heißen. Eine rote Linie gibt es hier nicht, denn das Wort Wal gibt es auch. Lies deinen Text darum immer selbst noch einmal durch."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie tippst du ein Fragezeichen?"
                say: "Du tippst: Kommst du mit. Am Ende fehlt das Fragezeichen. Wie tippst du es?"
                options: ["die Umschalttaste festhalten und die ß-Taste drücken", "zweimal den Punkt drücken", "die Leertaste drücken"]
                answer: "die Umschalttaste festhalten und die ß-Taste drücken"
                hints:
                  - "Das Fragezeichen steht oben auf einer Taste."
                  - "Für das obere Zeichen brauchst du die Umschalttaste."
                  - "Umschalttaste und ß-Taste."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Taste löscht einen Buchstaben?"
                say: "Du hast Hunf getippt statt Hund. Der Cursor steht hinter dem f. Welche Taste drückst du, damit das f verschwindet?"
                options: ["die Rücktaste", "die Leertaste", "die Eingabetaste"]
                answer: "die Rücktaste"
                hints:
                  - "Die Taste löscht, was links vom Cursor steht."
                  - "Sie hat einen Pfeil nach links."
                  - "Die Rücktaste."
              - id: l2-f3
                type: ordering
                text: "Kazte → Katze\nBring die Schritte in die richtige Reihenfolge."
                say: "In diesem Wort sind zwei Buchstaben vertauscht. Es soll Katze heißen. Bring die Schritte zum Verbessern in die richtige Reihenfolge."
                options: ["erst t, dann z tippen", "hinter das t klicken", "zweimal die Rücktaste drücken"]
                slot_count: 3
                answer: ["hinter das t klicken", "zweimal die Rücktaste drücken", "erst t, dann z tippen"]
                hints:
                  - "Zuerst muss der Cursor an die richtige Stelle."
                  - "Die Rücktaste löscht links vom Cursor."
                  - "Klicken, zweimal löschen, neu tippen."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Keine rote Wellenlinie, also kein Fehler."
                say: "In Bens Text gibt es keine rote Wellenlinie. Dann hat er bestimmt keinen Fehler gemacht. Stimmt das?"
                answer: false
                hints:
                  - "Findet das Programm alle Fehler?"
                  - "Denk an den Wal, der eigentlich ein Wald sein sollte."
                  - "Nein. Ben muss den Text selbst durchlesen."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Satz ist richtig getippt?"
                say: "Welcher Satz ist richtig getippt? Achte auf das Komma."
                options: ["Ich esse Äpfel, Birnen und Trauben.", "Ich esse Äpfel , Birnen und Trauben.", "Ich esse Äpfel,Birnen und Trauben."]
                answer: "Ich esse Äpfel, Birnen und Trauben."
                option_audio: false
                feedback:
                  "Ich esse Äpfel , Birnen und Trauben.": "Vor dem Komma kommt keine Lücke. Es steht direkt hinter dem Wort."
                  "Ich esse Äpfel,Birnen und Trauben.": "Nach dem Komma fehlt die Lücke."
                hints:
                  - "Satzzeichen stehen direkt hinter dem Wort."
                  - "Nach dem Komma kommt eine Lücke."
                  - "Äpfel, dann Komma, dann Leertaste."
              - id: l2-f6
                type: multiple_choice
                text: "Wie tippst du ein Ausrufezeichen?"
                options: ["die Umschalttaste festhalten und die 1 drücken", "die 1 alleine drücken", "die Feststelltaste drücken"]
                answer: "die Umschalttaste festhalten und die 1 drücken"
                hints:
                  - "Das Ausrufezeichen steht oben auf einer Zahlentaste."
                  - "Für das obere Zeichen brauchst du die Umschalttaste."
                  - "Umschalttaste und 1."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Taste brauchst du am Satzende?"
                say: "Du tippst: Das Wetter ist schön. Welche Taste brauchst du am Ende?"
                options: ["den Punkt", "die Rücktaste", "die Umschalttaste"]
                answer: "den Punkt"
                hints: ["Welches Satzzeichen steht hinter einem Aussagesatz?"]
              - id: l2-s2
                type: multiple_choice
                text: "Was löscht die Rücktaste?"
                options: ["den Buchstaben links vom Cursor", "den ganzen Text", "das Wort rechts vom Cursor"]
                answer: "den Buchstaben links vom Cursor"
                hints: ["Die Taste hat einen Pfeil nach links."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf jedes Wort mit einem Tippfehler."
                say: "Lina hat schnell getippt. Tippe auf jedes Wort mit einem Tippfehler."
                show: { drawn: letter-card, text: "Morgen gehe ich mit Mama ins Kion. Wir sehen einen Flim." }
                spans: ["Kion", "Flim"]
                hints: ["Lies jedes Wort genau. Bei zwei Wörtern sind Buchstaben vertauscht."]
              - id: l2-s4
                type: multiple_choice
                text: "Was bedeutet die rote Wellenlinie?"
                options: ["Hier ist vielleicht ein Fehler.", "Das Wort ist besonders wichtig.", "Hier fängt ein neuer Absatz an."]
                answer: "Hier ist vielleicht ein Fehler."
                hints: ["Das Programm prüft die Rechtschreibung."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Satz ist richtig getippt?"
                say: "Welcher Satz ist richtig getippt?"
                options: ["Wo ist mein Schal?", "Wo ist mein Schal ?", "wo ist mein Schal?"]
                answer: "Wo ist mein Schal?"
                option_audio: false
                hints: ["Groß am Anfang, keine Lücke vor dem Fragezeichen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie tippst du ein Fragezeichen?"
                say: "Du tippst: Wie heißt du. Wie tippst du das Fragezeichen am Ende?"
                options: ["die Umschalttaste festhalten und die ß-Taste drücken", "den Punkt zweimal drücken", "die 1 alleine drücken"]
                answer: "die Umschalttaste festhalten und die ß-Taste drücken"
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf jedes Wort mit einem Tippfehler."
                say: "Tim hat schnell getippt. Tippe auf jedes Wort mit einem Tippfehler."
                show: { drawn: letter-card, text: "Mein Bruder spielt gerne Fußbal. Er ist ein guter Torwrat." }
                spans: ["Fußbal", "Torwrat"]
              - id: l2-n3
                type: ordering
                text: "Hsoe → Hose\nBring die Schritte in die richtige Reihenfolge."
                say: "In diesem Wort sind zwei Buchstaben vertauscht. Es soll Hose heißen. Bring die Schritte zum Verbessern in die richtige Reihenfolge."
                options: ["zweimal die Rücktaste drücken", "erst o, dann s tippen", "hinter das o klicken"]
                slot_count: 3
                answer: ["hinter das o klicken", "zweimal die Rücktaste drücken", "erst o, dann s tippen"]
              - id: l2-n4
                type: true_false
                text: "Mia liest den Vorschlag, bevor sie darauf klickt. Macht sie das richtig?"
                say: "Das Programm schlägt für ein rot markiertes Wort etwas vor. Mia liest den Vorschlag, bevor sie darauf klickt. Macht Mia das richtig?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Satz ist richtig getippt?"
                say: "Welcher Satz ist richtig getippt?"
                options: ["Pass auf!", "Pass auf !", "pass auf!"]
                answer: "Pass auf!"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie tippst du den Namen Ida?"
            options: ["Umschalttaste festhalten und i, dann d und a", "Feststelltaste an, dann i, d und a", "i, d und a, dann die Umschalttaste"]
            answer: "Umschalttaste festhalten und i, dann d und a"
          - id: l2-c2
            type: multiple_choice
            text: "Wie tippst du ein Ausrufezeichen?"
            say: "Du tippst: Komm schnell. Wie tippst du das Ausrufezeichen am Ende?"
            options: ["die Umschalttaste festhalten und die 1 drücken", "die ß-Taste alleine drücken", "die Leertaste drücken"]
            answer: "die Umschalttaste festhalten und die 1 drücken"
          - id: l2-c3
            type: multiple_choice
            text: "Welcher Satz ist richtig getippt?"
            say: "Welcher Satz ist richtig getippt?"
            options: ["Heute ist Montag.", "Heute ist Montag .", "HeuteistMontag."]
            answer: "Heute ist Montag."
            option_audio: false
          - id: l2-c4
            type: highlight_in_text
            text: "Tippe auf jedes Wort mit einem Tippfehler."
            say: "Can hat schnell getippt. Tippe auf jedes Wort mit einem Tippfehler."
            show: { drawn: letter-card, text: "Am Sonntag fahren wir zu Oam. Sie wohnt am Meer und hat eine Ktaze." }
            spans: ["Oam", "Ktaze"]
          - id: l2-c5
            type: true_false
            text: "Stimmt das? Die Rechtschreibprüfung findet jeden Fehler."
            say: "Die Rechtschreibprüfung findet jeden Fehler. Wer sie benutzt, muss den Text nicht mehr selbst lesen. Stimmt das?"
            answer: false
