            part: noun
            type: multiple_choice
            text: "Das _ hat einen hohen Turm. Welches Wort ist richtig geschrieben?"
            say: "Das Schloss hat einen hohen Turm. Welches Wort ist richtig geschrieben?"
            options: ["Schloss", "Schlos", "Schlohs"]
            answer: "Schloss"
            option_audio: false
          - id: l2-c10
            part: adjective
            type: fill_in_blank
            text: "Verlängere das Adjektiv: m oder mm?"
            say: "Der Ast ist krumm. Was fehlt am Ende von krumm? Verlängere das Adjektiv."
            frame: "Der Ast ist kru_."
            options: ["mm", "m"]
