# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.verbs-simple-past
skill: lit-de.verbs.simple-past
curriculum: de-DE
language: de
title:
  de: Die Vergangenheit im Präteritum
  en: The simple past
summary: >
  The Präteritum tells what happened, mostly in written stories. Lesson 1
  forms it for schwache Verben with -te (spielen, er spielte; malen, wir
  malten); lesson 2 adds starke Verben that change their vowel and take no
  -te (gehen, ging; sehen, sah; kommen, kam; finden, fand), and ends with
  the skill check.
metadata:
  year: klasse-3
  topic: { de: Zeitformen, en: Tenses }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.verbs.present]
  also_practises: [lit-de.verbs.base-form]
  vocabulary: { de: [Präteritum, Vergangenheit, schwaches Verb, starkes Verb, Grundform, Selbstlaut] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: te-on-strong-verbs
      what: Adds -te to starke Verben (er gehte, sie sehte)
      addressed: lesson 2 Learn sets gehen beside spielen; feedback on "gehte" and "kommte" options in the full stage
    - id: ending-for-person
      what: Forgets the person ending in the Präteritum (wir spielte, du spieltest wrongly as du spielte)
      addressed: lesson 1 matching and fill-in tasks pair each person with its form; Learn shows ich spielte, du spieltest, wir spielten
    - id: past-is-only-perfect
      what: Uses only the Perfekt for the past and does not recognise Präteritum forms in a story
      addressed: lesson 1 Learn says stories in books are written in the Präteritum; highlight tasks find Präteritum verbs in story sentences
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Verben mit -te, en: Verbs with -te }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Du _ den Ball. (werfen)"
            say: "Welche Form von werfen passt? Du ... den Ball."
            options: ["wirfst", "werfst", "wirft"]
            answer: "wirfst"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Der Satz „Tim kocht Nudeln.“ steht im Präsens."
            say: "Tim kocht Nudeln. Steht dieser Satz im Präsens?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Heute spiele ich. Gestern spielte ich."
            say: "Was schon vorbei ist, erzählen wir in der Vergangenheit. Eine Zeitform der Vergangenheit heißt Präteritum. In Büchern und Geschichten steht fast immer das Präteritum."
          - text: "spielen → spiel + te"
            say: "Bei vielen Verben hängst du te an den Wortstamm: spielen, ich spielte. Diese Verben heißen schwache Verben."
          - text: "ich spielte · du spieltest · wir spielten"
            say: "Je nach Person kommt noch eine Endung dazu: ich spielte, du spieltest, er spielte, wir spielten, ihr spieltet."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Gestern _ Ben ein Bild. (malen)"
                say: "Welche Form von malen passt? Gestern ... Ben ein Bild."
                options: ["malt", "malte", "malen"]
                answer: "malte"
                feedback:
                  "malt": "Malt ist Präsens. Gestern ist schon vorbei, also hängst du te an."
                hints:
                  - "Gestern ist vorbei. Du brauchst das Präteritum."
                  - "Häng te an den Wortstamm mal an."
                  - "Gestern malte Ben ein Bild."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung im Präteritum: Wir kauf... Brötchen."
                frame: "Wir kauf_ Brötchen."
                options: ["te", "ten", "test", "tet"]
                answer: ["ten"]
                hints:
                  - "Erst te für die Vergangenheit."
                  - "Bei wir kommt noch n dazu."
                  - "Wir kauften Brötchen."
              - id: l1-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von lachen im Präteritum."
                option_audio: false
                pairs:
                  - { left: { text: "ich" }, right: { text: "lachte" } }
                  - { left: { text: "du" }, right: { text: "lachtest" } }
                  - { left: { text: "wir" }, right: { text: "lachten" } }
                  - { left: { text: "ihr" }, right: { text: "lachtet" } }
                hints:
                  - "Alle Formen haben te."
                  - "Bei du kommt st dazu, bei wir n, bei ihr t."
                  - "ich lachte, du lachtest, wir lachten, ihr lachtet."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf das Verb im Präteritum."
                say: "Der Satz kommt aus einer Geschichte. Tippe auf das Verb im Präteritum."
                show: { drawn: letter-card, text: "Am Abend suchte der Fuchs sein Futter." }
                spans: ["suchte"]
                hints:
                  - "Welches Wort sagt, was der Fuchs tat?"
                  - "In dem Wort steckt te."
                  - "Das Verb ist suchte."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? Der Satz „Lena turnte im Garten.“ steht im Präteritum."
                say: "Lena turnte im Garten. Steht dieser Satz im Präteritum?"
                answer: true
                hints:
                  - "Ist das jetzt oder vorbei?"
                  - "Turnte hat te."
                  - "Ja, der Satz steht im Präteritum."
              - id: l1-f6
                type: multiple_choice
                text: "Wie heißt die Grundform von „sie holten“?"
                say: "Wie heißt die Grundform von sie holten?"
                options: ["holen", "holten", "holte"]
                answer: "holen"
                hints:
                  - "Die Grundform endet auf en."
                  - "Nimm ten weg. Übrig bleibt hol."
                  - "Die Grundform ist holen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Letzte Woche _ wir im See. (baden)"
                say: "Welche Form von baden passt? Letzte Woche ... wir im See."
                options: ["baden", "badeten", "badete"]
                answer: "badeten"
                hints: ["Letzte Woche ist vorbei, und bei wir kommt n dazu."]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung im Präteritum: Du hör... Musik."
                frame: "Du hör_ Musik."
                options: ["te", "ten", "test", "tet"]
                answer: ["test"]
                hints: ["Welche Endung gehört zu du?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf das Verb im Präteritum."
                say: "Tippe auf das Verb im Präteritum."
                show: { drawn: letter-card, text: "Die Kinder bauten eine Sandburg." }
                spans: ["bauten"]
                hints: ["Welches Wort sagt, was die Kinder taten?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? Der Satz „Oma strickt einen Schal.“ steht im Präteritum."
                say: "Oma strickt einen Schal. Steht dieser Satz im Präteritum?"
                answer: false
                hints: ["Hat das Verb te?"]
              - id: l1-s5
                type: multiple_choice
                text: "Wie heißt die Grundform von „er wohnte“?"
                say: "Wie heißt die Grundform von er wohnte?"
                options: ["wohnen", "wohnte", "wohnt"]
                answer: "wohnen"
                hints: ["Nimm te weg und hänge en an."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Damals _ Opa auf einem Bauernhof. (leben)"
                say: "Welche Form von leben passt? Damals ... Opa auf einem Bauernhof."
                options: ["lebt", "lebte", "lebten"]
                answer: "lebte"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung im Präteritum: Ihr frag... den Lehrer."
                frame: "Ihr frag_ den Lehrer."
                options: ["te", "ten", "test", "tet"]
                answer: ["tet"]
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf das Verb im Präteritum."
                say: "Tippe auf das Verb im Präteritum."
                show: { drawn: letter-card, text: "Gestern putzte Papa das Fenster." }
                spans: ["putzte"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Der Satz „Wir zeichneten Tiere.“ steht im Präteritum."
                say: "Wir zeichneten Tiere. Steht dieser Satz im Präteritum?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie heißt die Grundform von „du tanztest“?"
                say: "Wie heißt die Grundform von du tanztest?"
                options: ["tanzen", "tanzten", "tanzt"]
                answer: "tanzen"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Gestern _ es den ganzen Tag. (regnen)"
            say: "Welche Form von regnen passt? Gestern ... es den ganzen Tag."
            options: ["regnet", "regnete", "regneten"]
            answer: "regnete"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung im Präteritum: Wir pack... die Koffer."
            frame: "Wir pack_ die Koffer."
            options: ["te", "ten", "test", "tet"]
            answer: ["ten"]
          - id: l1-c3
            type: highlight_in_text
            text: "Tippe auf das Verb im Präteritum."
            say: "Tippe auf das Verb im Präteritum."
            show: { drawn: letter-card, text: "Der Bäcker knetete den Teig." }
            spans: ["knetete"]

  - n: 2
    title: { de: Starke Verben, en: Strong verbs }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Gestern _ ich Klavier. (üben)"
            say: "Welche Form von üben passt? Gestern ... ich Klavier."
            options: ["übe", "übte", "übten"]
            answer: "übte"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Satz „Ihr klebtet Bilder ins Heft.“ steht im Präteritum."
            say: "Ihr klebtet Bilder ins Heft. Steht dieser Satz im Präteritum?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "spielen → spielte · gehen → ging"
            say: "Manche Verben bekommen kein te. Sie ändern ihren Selbstlaut: gehen, ich ging. Diese Verben heißen starke Verben."
          - text: "sehen → sah · kommen → kam · finden → fand"
            say: "Ich sah einen Stern. Er kam zu spät. Wir fanden den Schlüssel. Starke Verben musst du dir merken."
          - text: "ich ging · du gingst · wir gingen"
            say: "Bei ich und er, sie, es hat das starke Verb keine Endung: ich ging, sie ging. Bei du kommt st dazu, bei wir en."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Gestern _ Tom zur Schule. (gehen)"
                say: "Welche Form von gehen passt? Gestern ... Tom zur Schule."
                options: ["gehte", "ging", "geht"]
                answer: "ging"
                feedback:
                  "gehte": "Gehen ist ein starkes Verb. Es bekommt kein te, sondern einen neuen Selbstlaut: ging."
                  "geht": "Geht ist Präsens. Gestern ist schon vorbei."
                hints:
                  - "Gehen ist ein starkes Verb."
                  - "Es ändert den Selbstlaut und bekommt kein te."
                  - "Gestern ging Tom zur Schule."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Am Montag _ Mia einen Igel. (sehen)"
                say: "Welche Form von sehen passt? Am Montag ... Mia einen Igel."
                options: ["sehte", "sah", "sieht"]
                answer: "sah"
                feedback:
                  "sehte": "Sehen ist ein starkes Verb: kein te, aus e wird a."
                hints:
                  - "Sehen ist ein starkes Verb."
                  - "Kein te: Aus sehen wird sah."
                  - "Am Montag sah Mia einen Igel."
              - id: l2-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Grundform mit ihrer Form im Präteritum."
                option_audio: false
                pairs:
                  - { left: { text: "kommen" }, right: { text: "kam" } }
                  - { left: { text: "finden" }, right: { text: "fand" } }
                  - { left: { text: "trinken" }, right: { text: "trank" } }
                  - { left: { text: "schreiben" }, right: { text: "schrieb" } }
                hints:
                  - "Alle Verben hier sind stark."
                  - "Sag: Heute komme ich, gestern ..."
                  - "Aus kommen wird kam, aus finden fand, aus trinken trank, aus schreiben schrieb."
              - id: l2-f4
                type: sorting
                text: "Mit te oder ohne te?"
                say: "Sortiere die Formen im Präteritum. Haben sie te oder einen neuen Selbstlaut?"
                option_audio: false
                bins:
                  - { id: weak, show: { text: "mit te" }, say: "mit te" }
                  - { id: strong, show: { text: "neuer Selbstlaut" }, say: "neuer Selbstlaut" }
                options:
                  - { text: "sagte", bin: weak }
                  - { text: "lief", bin: strong }
                  - { text: "zeigte", bin: weak }
                  - { text: "flog", bin: strong }
                hints:
                  - "Schau, ob te im Wort steckt."
                  - "Sagte und zeigte haben te."
                  - "Lief und flog haben einen neuen Selbstlaut."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? „Er kommte zu spät.“"
                say: "Er kommte zu spät. Ist das Verb richtig?"
                answer: false
                feedback:
                  "true": "Kommen ist ein starkes Verb: Er kam zu spät."
                hints:
                  - "Ist kommen ein starkes Verb?"
                  - "Ja. Darum bekommt es kein te."
                  - "Nein. Richtig ist: Er kam zu spät."
              - id: l2-f6
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: Wir ging... nach Hause."
                frame: "Wir ging_ nach Hause."
                options: ["en", "st", "t", "te"]
                answer: ["en"]
                hints:
                  - "Starke Verben bekommen kein te."
                  - "Bei wir kommt en dazu."
                  - "Wir gingen nach Hause."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Urlaub _ wir viel. (schwimmen)"
                say: "Welche Form von schwimmen passt? Im Urlaub ... wir viel."
                options: ["schwammen", "schwimmten", "schwimmen"]
                answer: "schwammen"
                hints: ["Schwimmen ist ein starkes Verb."]
              - id: l2-s2
                type: multiple_choice
                text: "Der Vogel _ auf das Dach. (fliegen)"
                say: "Welche Form von fliegen passt? Der Vogel ... auf das Dach."
                options: ["fliegte", "flog", "fliegt"]
                answer: "flog"
                hints: ["Bekommt fliegen te?"]
              - id: l2-s3
                type: sorting
                text: "Mit te oder ohne te?"
                say: "Sortiere die Formen im Präteritum. Haben sie te oder einen neuen Selbstlaut?"
                option_audio: false
                bins:
                  - { id: weak, show: { text: "mit te" }, say: "mit te" }
                  - { id: strong, show: { text: "neuer Selbstlaut" }, say: "neuer Selbstlaut" }
                options:
                  - { text: "rief", bin: strong }
                  - { text: "kochte", bin: weak }
                  - { text: "las", bin: strong }
                  - { text: "wartete", bin: weak }
                hints: ["Such te im Wort."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? „Sie trank einen Kakao.“"
                say: "Sie trank einen Kakao. Ist das Verb richtig?"
                answer: true
                hints: ["Wie heißt die Grundform, und ist sie stark?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: Du kam... mit dem Bus."
                frame: "Du kam_ mit dem Bus."
                options: ["en", "st", "t", "te"]
                answer: ["st"]
                hints: ["Welche Endung gehört zu du?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Lisa _ einen Brief an Oma. (schreiben)"
                say: "Welche Form von schreiben passt? Lisa ... einen Brief an Oma."
                options: ["schreibte", "schrieb", "schreibt"]
                answer: "schrieb"
              - id: l2-n2
                type: multiple_choice
                text: "Plötzlich _ das Telefon. (klingeln)"
                say: "Welche Form von klingeln passt? Plötzlich ... das Telefon."
                options: ["klingelte", "klingte", "klingelt"]
                answer: "klingelte"
              - id: l2-n3
                type: sorting
                text: "Mit te oder ohne te?"
                say: "Sortiere die Formen im Präteritum. Haben sie te oder einen neuen Selbstlaut?"
                option_audio: false
                bins:
                  - { id: weak, show: { text: "mit te" }, say: "mit te" }
                  - { id: strong, show: { text: "neuer Selbstlaut" }, say: "neuer Selbstlaut" }
                options:
                  - { text: "sang", bin: strong }
                  - { text: "lernte", bin: weak }
                  - { text: "stand", bin: strong }
                  - { text: "tanzte", bin: weak }
              - id: l2-n4
                type: true_false
                text: "Stimmt das? „Wir findeten den Weg.“"
                say: "Wir findeten den Weg. Ist das Verb richtig?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: Die Kinder sah... einen Regenbogen."
                frame: "Die Kinder sah_ einen Regenbogen."
                options: ["en", "st", "t", "te"]
                answer: ["en"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Am Sonntag _ wir in den Zoo. (fahren)"
            say: "Welche Form von fahren passt? Am Sonntag ... wir in den Zoo."
            options: ["fuhren", "fahrten", "fahren"]
            answer: "fuhren"
          - id: l2-c2
            type: multiple_choice
            text: "Der Hund _ laut, als es klingelte. (bellen)"
            say: "Welche Form von bellen passt? Der Hund ... laut, als es klingelte."
            options: ["bellte", "boll", "bellt"]
            answer: "bellte"
          - id: l2-c3
            type: matching
            text: "Grundform und Präteritum"
            say: "Ordne jeder Grundform ihre Form im Präteritum zu."
            option_audio: false
            pairs:
              - { left: { text: "geben" }, right: { text: "gab" } }
              - { left: { text: "liegen" }, right: { text: "lag" } }
              - { left: { text: "springen" }, right: { text: "sprang" } }
              - { left: { text: "nähen" }, right: { text: "nähte" } }
          - id: l2-c4
            type: highlight_in_text
            text: "Tippe auf das Verb im Präteritum."
            say: "Tippe auf das Verb im Präteritum."
            show: { drawn: letter-card, text: "Nach dem Essen schlief das Baby lange." }
            spans: ["schlief"]
          - id: l2-c5
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Ergänze die Endung: Ihr lief... sehr schnell."
            frame: "Ihr lief_ sehr schnell."
            options: ["en", "st", "t", "te"]
            answer: ["t"]
