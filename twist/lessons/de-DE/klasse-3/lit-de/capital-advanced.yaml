                options: ["Die Elbe ist ein Fluss.", "Die elbe ist ein Fluss."]
                answer: "Die Elbe ist ein Fluss."
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Groß oder klein?"
