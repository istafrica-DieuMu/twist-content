                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich turne Dienstags." }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: verb-noun
            type: fill_in_blank
            text: "Groß oder klein?"
