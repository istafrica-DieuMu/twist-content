    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Groß oder klein?"
            say: "Beim Kochen hilft Tom. Welcher Buchstabe fehlt?"
            frame: "Beim _ochen hilft Tom."
            options: ["K", "k"]
            option_audio: false
            answer: ["K"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Das Klettern ist toll." }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lena | Berlin | der Rhein"
            say: "Namen von Menschen, Städten, Flüssen und Ländern sind Eigennamen. Sie werden großgeschrieben: Lena, Berlin, der Rhein."
          - text: "am Montag | heute Abend"
            say: "Wochentage und Tageszeiten sind Nomen. Nach am, heute, gestern oder morgen schreibst du sie groß: am Montag, heute Abend, gestern Morgen."
          - text: "montags | abends"
            say: "Endet die Zeitangabe mit s, schreibst du klein: montags, abends, morgens. Dann passiert etwas immer wieder."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Am Dienstag haben wir Sport. Welcher Buchstabe fehlt?"
                frame: "Am _ienstag haben wir Sport."
                options: ["D", "d"]
                option_audio: false
                answer: ["D"]
                hints:
                  - "Was steht vor dem Wochentag?"
                  - "Davor steht am. Am heißt an dem. Was kommt nach einem Artikel?"
                  - "Groß: am Dienstag."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Wir treffen uns heute Abend.", "Wir treffen uns heute abend."]
                answer: "Wir treffen uns heute Abend."
                option_audio: false
                hints:
                  - "Was steht vor Abend?"
                  - "Davor steht heute. Was weißt du über Tageszeiten nach heute?"
                  - "Nach heute schreibst du die Tageszeit groß: heute Abend."
              - id: l2-f3
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Ich gehe montags zum Turnen. Welcher Buchstabe fehlt?"
                frame: "Ich gehe _ontags zum Turnen."
                options: ["M", "m"]
                option_audio: false
                answer: ["m"]
                hints:
                  - "Wie endet das Wort?"
                  - "Das Wort endet mit s. Es heißt: an jedem Montag."
                  - "Klein: montags."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf das Wort, das großgeschrieben werden muss."
                say: "Lies den Satz. Ein Wort muss großgeschrieben werden. Tippe es an."
                show: { drawn: letter-card, text: "Wir fahren nach hamburg." }
                spans: ["hamburg"]
                hints:
                  - "Namen schreibst du groß. Such einen Namen."
                  - "Wohin fahren wir? Das ist der Name einer Stadt."
                  - "Tippe auf hamburg. Richtig ist Hamburg."
              - id: l2-f5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich lese abends ein Buch." }
                answer: true
                hints:
                  - "Wie endet abends?"
                  - "Das Wort endet mit s. Es heißt: an jedem Abend."
                  - "Ja, richtig: abends schreibst du klein."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Gestern Morgen hat es geregnet. Welcher Buchstabe fehlt?"
                frame: "Gestern _orgen hat es geregnet."
                options: ["M", "m"]
                option_audio: false
                answer: ["M"]
                hints: ["Was steht vor der Tageszeit?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Am Freitag kommt Oma.", "Am freitag kommt Oma."]
                answer: "Am Freitag kommt Oma."
                option_audio: false
                hints: ["Was steht vor dem Wochentag?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Wir essen mittags in der Schule. Welcher Buchstabe fehlt?"
                frame: "Wir essen _ittags in der Schule."
                options: ["M", "m"]
                option_audio: false
                answer: ["m"]
                hints: ["Wie endet das Wort?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf das Wort, das großgeschrieben werden muss."
                say: "Lies den Satz. Ein Wort muss großgeschrieben werden. Tippe es an."
                show: { drawn: letter-card, text: "Mein Freund heißt tim." }
                spans: ["tim"]
                hints: ["Such einen Namen."]
              - id: l2-s5
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Wir spielen sonntags Fußball." }
                answer: true
                hints: ["Wie endet sonntags?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Heute Nachmittag gehe ich schwimmen. Welcher Buchstabe fehlt?"
                frame: "Heute _achmittag gehe ich schwimmen."
                options: ["N", "n"]
                option_audio: false
