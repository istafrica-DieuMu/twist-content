# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.capital-advanced
skill: lit-de.spelling.capital-advanced
curriculum: de-DE
language: de
title:
  de: Groß oder klein?
  en: Capital or small letter?
summary: >
  Capital letters beyond the plain Nomen. Lesson 1 takes Verben that
  become Nomen after das, beim, zum, vom or im (das Lachen, beim
  Spielen); lesson 2 takes Eigennamen (Lena, Berlin, der Rhein) and
  Zeitangaben (am Montag, heute Abend against montags, abends), and ends
  with the skill check.
metadata:
  year: klasse-3
  topic: { de: Groß- und Kleinschreibung, en: Capital letters }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.spelling.capital-nouns, lit-de.nouns.endings]
  also_practises: [lit-de.spelling.capital-nouns, lit-de.verbs.recognise]
  vocabulary: { de: [großschreiben, kleinschreiben, Signalwort, Eigenname, Zeitangabe] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: verb-noun, what: { de: "Verben nach das, beim, zum, vom oder im großschreiben, ohne Signalwort klein", en: "writing verbs with a capital after das, beim, zum, vom or im, and small without a signal word" } }
    - { id: names, what: { de: "Eigennamen großschreiben (Lena, Berlin, der Rhein)", en: "writing proper names with a capital (Lena, Berlin, der Rhein)" } }
    - { id: times, what: { de: "Zeitangaben richtig schreiben (am Montag, heute Abend; montags, abends)", en: "spelling times right (am Montag, heute Abend; montags, abends)" } }
  misconceptions:
    - id: verb-always-small
      what: Writes a Verb small even after das, beim or zum (beim malen, zum schwimmen)
      addressed: lesson 1 Learn shows the hidden article in beim and zum; every stage of lesson 1 has a sentence with a signal word and a capital gap, and a lower-case error to find
    - id: capital-everywhere
      what: Then writes every Verb big (Ich möchte Malen, Wir Spielen)
      addressed: l1-f4, l1-s2, l1-s5, l1-n4, l1-n5 and l1-c3 have Verben without a signal word
    - id: days-with-s
      what: Writes montags or abends big, or am Montag small
      addressed: lesson 2 Learn sets am Montag against montags; every stage of lesson 2 has both kinds, and l2-n5 shows Dienstags
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Das Lachen, beim Spielen", en: "Verbs used as nouns" }
    goal:
      de: "Schreib Verben groß, wenn sie zu Nomen werden, so wie das Lachen und beim Spielen."
      en: "Give verbs a capital when they become nouns, like das Lachen and beim Spielen."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["der Ball", "laufen", "schnell"]
            answer: "der Ball"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf alle Nomen."
            say: "Lies den Satz. Tippe auf alle Nomen."
            show: { drawn: letter-card, text: "Der Hund holt den Ball." }
            spans: ["Hund", "Ball"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "laufen | das Laufen"
            say: "Laufen ist ein Verb. Steht ein Artikel davor, wird es zum Nomen: das Laufen. Dann schreibst du es groß."
          - text: "beim Spielen | zum Malen"
            say: "Oft versteckt sich der Artikel. Beim heißt bei dem, zum heißt zu dem. Auch dann schreibst du groß: beim Spielen, zum Malen."
          - text: "das | beim | zum | vom | im"
            say: "Achte auf diese Signalwörter. Sie zeigen dir: Jetzt kommt ein Nomen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Das Lachen tut gut. Welcher Buchstabe fehlt?"
                frame: "Das _achen tut gut."
                options: ["L", "l"]
                option_audio: false
                answer: ["L"]
                hints:
                  - "Steht vor dem Wort ein Artikel?"
                  - "Davor steht das. Was wird aus einem Verb, wenn ein Artikel davorsteht?"
                  - "Es wird ein Nomen. Also groß: Das Lachen tut gut."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Beim Malen bin ich still.", "Beim malen bin ich still."]
                answer: "Beim Malen bin ich still."
                option_audio: false
                hints:
                  - "Such ein Signalwort."
                  - "Beim heißt bei dem. Danach kommt ein Nomen."
                  - "Beim Malen bin ich still."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf das Wort, das großgeschrieben werden muss."
                say: "Lies den Satz. Ein Wort muss großgeschrieben werden. Tippe es an."
                show: { drawn: letter-card, text: "Wir gehen zum schwimmen." }
                spans: ["schwimmen"]
                hints:
                  - "Such ein verstecktes Signalwort."
                  - "Zum heißt zu dem. Was kommt danach?"
                  - "Tippe auf schwimmen. Richtig ist zum Schwimmen."
              - id: l1-f4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich gehe gern laufen." }
                answer: true
                hints:
                  - "Steht vor laufen ein Artikel oder ein Signalwort?"
                  - "Davor steht gern. Ist gern ein Artikel oder ein Signalwort?"
                  - "Ja. Ohne Signalwort ist laufen ein Verb und bleibt klein."
              - id: l1-f5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Ich brauche Ruhe zum Lesen. Welcher Buchstabe fehlt?"
                frame: "Ich brauche Ruhe zum _esen."
                options: ["L", "l"]
                option_audio: false
                answer: ["L"]
                hints:
                  - "Such ein Signalwort vor dem Wort."
                  - "Zum heißt zu dem. Was kommt nach einem Artikel?"
                  - "Ein Nomen. Also groß: zum Lesen."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Das Singen macht Spaß. Welcher Buchstabe fehlt?"
                frame: "Das _ingen macht Spaß."
                options: ["S", "s"]
                option_audio: false
                answer: ["S"]
                hints: ["Steht ein Artikel davor?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Wir spielen im Garten.", "Wir Spielen im Garten."]
                answer: "Wir spielen im Garten."
                option_audio: false
                hints: ["Steht vor spielen ein Signalwort?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf das Wort, das großgeschrieben werden muss."
                say: "Lies den Satz. Ein Wort muss großgeschrieben werden. Tippe es an."
                show: { drawn: letter-card, text: "Beim essen redet man nicht." }
                spans: ["essen"]
                hints: ["Such das Signalwort."]
              - id: l1-s4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Vom Rennen bin ich müde." }
                answer: true
                hints: ["Vom heißt von dem."]
              - id: l1-s5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Wir gehen morgen schwimmen. Welcher Buchstabe fehlt?"
                frame: "Wir gehen morgen _chwimmen."
                options: ["S", "s"]
                option_audio: false
                answer: ["s"]
                hints: ["Steht vor dem Wort ein Signalwort?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Beim Tanzen lache ich. Welcher Buchstabe fehlt?"
                frame: "Beim _anzen lache ich."
                options: ["T", "t"]
                option_audio: false
                answer: ["T"]
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Ich übe das Schreiben.", "Ich übe das schreiben."]
                answer: "Ich übe das Schreiben."
                option_audio: false
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf das Wort, das großgeschrieben werden muss."
                say: "Lies den Satz. Ein Wort muss großgeschrieben werden. Tippe es an."
                show: { drawn: letter-card, text: "Das lesen fällt mir leicht." }
                spans: ["lesen"]
              - id: l1-n4
                type: true_false
                text: "Ist der Satz richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: letter-card, text: "Ich möchte Malen." }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Lena will heute spielen. Welcher Buchstabe fehlt?"
                frame: "Lena will heute _pielen."
                options: ["S", "s"]
                option_audio: false
                answer: ["s"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Groß oder klein?"
            say: "Zum Spielen gehen wir raus. Welcher Buchstabe fehlt?"
            frame: "Zum _pielen gehen wir raus."
            options: ["S", "s"]
            option_audio: false
            answer: ["S"]
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf das Wort, das großgeschrieben werden muss."
            say: "Lies den Satz. Ein Wort muss großgeschrieben werden. Tippe es an."
            show: { drawn: letter-card, text: "Das turnen macht Spaß." }
            spans: ["turnen"]
          - id: l1-c3
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Wir gehen heute baden." }
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Groß oder klein?"
            say: "Beim Zähneputzen summe ich. Welcher Buchstabe fehlt?"
            frame: "Beim _ähneputzen summe ich."
            options: ["Z", "z"]
            option_audio: false
            answer: ["Z"]
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Satz ist richtig geschrieben?"
            say: "Welcher Satz ist richtig geschrieben?"
            options: ["Kannst du mir beim tragen helfen?", "Kannst du mir beim Tragen helfen?"]
            answer: "Kannst du mir beim Tragen helfen?"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Ist der Satz richtig geschrieben?"
            say: "Lies den Satz. Ist er richtig geschrieben?"
            show: { drawn: letter-card, text: "Wir wollen heute Rodeln." }
            answer: false

  - n: 2
    title: { de: "Namen und Zeitangaben", en: "Names and times" }
    goal:
      de: "Schreib Namen und Zeitangaben richtig, so wie am Montag groß und montags klein."
