# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.sentences-direct-speech-positions
skill: lit-de.sentences.direct-speech-positions
curriculum: de-DE
language: de
title:
  de: Der Begleitsatz hinten und in der Mitte
  en: The reporting clause at the end and in the middle
summary: >
  Punctuating direct speech when the Begleitsatz comes after or inside
  the spoken words. Lesson 1 puts the Begleitsatz at the end („Ich komme
  mit“, sagt Lea.), where the Punkt of a statement is dropped, a question
  or exclamation keeps its mark, and a Komma always follows; lesson 2 puts the Begleitsatz
  in the middle („Morgen“, sagt Lea, „komme ich mit.“), and ends with the
  skill check.
metadata:
  year: klasse-3
  topic: { de: Wörtliche Rede, en: Direct speech }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.direct-speech]
  also_practises: [lit-de.sentences.direct-speech]
  vocabulary: { de: [wörtliche Rede, Begleitsatz, Anführungszeichen, Komma, nachgestellt, eingeschoben] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: keep-full-stop
      what: Keeps the Punkt of the spoken sentence when the Begleitsatz follows („Ich komme mit.“, sagt Lea.)
      addressed: lesson 1 Learn drops the Punkt and sets the Komma; a "Welcher Satz ist richtig?" task with the extra Punkt in every stage of lesson 1 (l1-f1, l1-s1, l1-n1) and in the skill check, with feedback in l1-f1
    - id: drop-question-mark
      what: Replaces the Fragezeichen or Ausrufezeichen by a Komma alone
      addressed: lesson 1 Learn keeps the Fragezeichen and the Ausrufezeichen and adds the Komma after the Anführungszeichen; a question without its Fragezeichen in every stage of lesson 1 (l1-f4, l1-s3, l1-n4), with feedback in l1-f4
    - id: middle-quotes
      what: Forgets the second pair of Anführungszeichen when the Begleitsatz is in the middle
      addressed: lesson 2 Learn shows both parts in Anführungszeichen; every stage of lesson 2 and the skill check offer a wrong option where the second part lacks its own Anführungszeichen (l2-f1, l2-s1, l2-n1, l2-c3), with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

