# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.abstract-nouns
skill: lit-de.nouns.abstract
curriculum: de-DE
language: de
title:
  de: Nomen, die man nicht anfassen kann
  en: Nouns you cannot touch
summary: >
  Feelings, ideas and times are nouns too (die Freude, das Glück, der
  Mut), even though you cannot touch them. Lesson 1 sorts concrete and
  abstract nouns and uses the article test (can der, die or das go in
  front?); lesson 2 finds abstract nouns in sentences written all in small
  letters and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Nomen, en: Nouns }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.nouns.endings]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Nomen, Gefühl, anfassen, Artikelprobe, großschreiben] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: recognise, what: { de: "Nomen erkennen, die man nicht anfassen kann (Gefühle, Gedanken, Zeiten)", en: "recognising nouns you cannot touch (feelings, ideas, times)" } }
    - { id: article, what: { de: "die Artikelprobe machen: der, die oder das davorsetzen", en: "using the article test: putting der, die or das in front" } }
    - { id: in-sentence, what: { de: solche Nomen im Satz finden und großschreiben, en: finding these nouns in a sentence and writing them with a capital } }
  misconceptions:
    - id: touch-only
      what: Thinks only things you can touch are nouns, so writes die angst
      addressed: Learn shows feelings as nouns and teaches the article test; check feedback on angst names it
    - id: verb-or-adjective
      what: Writes the verb or adjective with a capital too (Freuen, Mutig)
      addressed: lesson 1 pairs nouns with words of the same family (die Freude, sich freuen; die Angst, ängstlich)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
