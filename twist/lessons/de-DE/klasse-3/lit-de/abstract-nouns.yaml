    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Ergänze die Endung."
            say: "Mach aus frei ein Nomen. Welche Endung passt?"
            frame: "die Frei_"
            options: ["heit", "keit", "ung"]
            answer: ["heit"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Alle Wörter sind klein geschrieben. Welches Wort ist ein Nomen? Mach die Artikelprobe."
            options: ["laufen", "tisch", "schnell"]
            answer: "tisch"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der Tisch, die Freude"
            say: "Einen Tisch kann man anfassen. Freude kann man nicht anfassen, man fühlt sie. Trotzdem sind beide Nomen."
            show: { object: table }
          - text: "die Freude, das Glück, der Mut"
            say: "Gefühle und Gedanken sind auch Nomen: die Freude, das Glück, der Mut, die Angst. Man schreibt sie groß."
          - text: "Artikelprobe: die ... Angst"
            say: "So prüfst du es: Kannst du der, die oder das davorsetzen? Die Angst, das geht. Also ist Angst ein Nomen. Die ängstlich geht nicht, also ist ängstlich kein Nomen."

