# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.read-aloud
skill: lit-de.fluency.read-aloud
curriculum: de-DE
language: de
title:
  de: Gut vorlesen
  en: Reading aloud well
summary: >
  Reading a practised text aloud with expression and at a good pace.
  Lesson 1 chooses the voice that fits a sentence (laut, leise, fröhlich,
  traurig, ängstlich) and the word to stress; lesson 2 prepares a text for
  reading aloud step by step, picks a good pace and reads short passages
  aloud for practice, and ends with the skill check. The speak tasks run
  as the record-and-compare fallback and are never scored.
metadata:
  year: klasse-3
  topic: { de: Vorlesen, en: Reading aloud }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.fluency.punctuation-reading]
  also_practises: [lit-de.fluency.punctuation-reading, lit-de.speaking.record-voice]
  vocabulary: { de: [vorlesen, betonen, Betonung, Tempo, Pause, Stimme, üben] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: fast-is-good
      what: Thinks reading aloud well means reading as fast as possible
      addressed: "lesson 2 Learn and l2-f2, l2-s2 and l2-n2 choose a pace the listeners can follow; feedback on l2-f2 names the fast option"
    - id: one-voice
      what: Reads every sentence in the same voice, whatever the character feels
      addressed: "lesson 1 matches the voice to the feeling in every stage (l1-f1, l1-f3, l1-s1, l1-n1, l1-n4) and stresses the important word (l1-f4, l1-s4, l1-n3)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit der Stimme malen", en: "Painting with your voice" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "„Kommst du morgen zu meinem Fest?“ Was macht deine Stimme am Ende?"
            say: "Lies den Satz leise. Was macht deine Stimme am Ende?"
            options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie bleibt gleich."]
            answer: "Sie geht nach oben."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Der Igel rollt sich zu einer\nKugel zusammen. Jetzt sieht man\nnur noch Stacheln.\n\nMit welchem Wort endet der erste Satz?"
            say: "Lies den Text. Mit welchem Wort endet der erste Satz?"
            options: ["zusammen", "einer", "Stacheln"]
            answer: "zusammen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "„Juhu, wir haben gewonnen!“, rief Ella."
            say: "Beim Vorlesen zeigt deine Stimme, wie sich jemand fühlt. Ella freut sich. Darum klingt es fröhlich: Juhu, wir haben gewonnen!"
          - text: "„Psst, das Baby schläft“, flüsterte Papa."
            say: "Das Wort flüsterte sagt dir, wie du lesen sollst: ganz leise. Psst, das Baby schläft."
          - text: "Ich will den ROTEN Ball, nicht den blauen."
            say: "Ein wichtiges Wort betonst du: Du sprichst es etwas lauter und deutlicher. Ich will den roten Ball, nicht den blauen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "„Mein Hamster ist weg“, schluchzte Mia. Wie liest du Mias Satz?"
                say: "Lies den Satz leise. Wie liest du, was Mia sagt?"
                options: ["traurig und leise", "fröhlich und laut", "wütend und schnell"]
                answer: "traurig und leise"
                feedback:
                  "fröhlich und laut": "Lies das Wort nach dem Satz. Wie fühlt sich jemand, der schluchzt?"
                hints:
                  - "Achte auf das Wort nach den Anführungszeichen."
                  - "Schluchzen heißt weinen. Wie fühlt sich Mia?"
                  - "Traurig und leise."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort sagt dir, dass du laut lesen sollst?"
                say: "Lies die Wörter. Welches Wort sagt dir, dass du laut lesen sollst?"
                options: ["brüllte", "flüsterte", "murmelte"]
                answer: "brüllte"
                hints:
                  - "Stell dir vor, wie die Leute sprechen."
                  - "Wer flüstert oder murmelt, ist leise."
                  - "brüllte."
              - id: l1-f3
                type: multiple_choice
                text: "„Wer ist da im Dunkeln?“, fragte Tim mit zitternder Stimme. Wie liest du Tims Frage?"
                say: "Lies den Satz leise. Wie liest du Tims Frage?"
                options: ["ängstlich und leise", "fröhlich und laut", "gelangweilt"]
                answer: "ängstlich und leise"
                hints:
                  - "Wo ist Tim? Wie spricht er?"
                  - "Mit zitternder Stimme spricht man, wenn man Angst hat."
                  - "Ängstlich und leise."
              - id: l1-f4
                type: multiple_choice
                text: "„Ich wollte Saft, nicht Milch!“ Welches Wort betonst du am stärksten?"
                say: "Lies den Satz leise. Welches Wort betonst du am stärksten?"
                options: ["Saft", "wollte", "Ich"]
                answer: "Saft"
                hints:
                  - "Was ist in dem Satz wichtig? Was wollte das Kind?"
                  - "Saft steht im Gegensatz zu Milch. Darauf kommt es an."
                  - "Du betonst Saft."
              - id: l1-f5
                type: speak
                text: "„Juhu, morgen sind Ferien!“, jubelte Paul."
                say: "Lies den Satz laut und fröhlich vor, so wie Paul sich fühlt. Dann hörst du dich und das Vorbild."
                expected_text: "„Juhu, morgen sind Ferien!“, jubelte Paul."
                hints:
                  - "Paul jubelt. Er freut sich sehr."
                  - "Lies Juhu laut und mit Schwung."
                  - "Hör das Vorbild an und lies noch einmal."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "„Das ist ungerecht!“, schimpfte Lena und stampfte mit dem Fuß. Wie liest du Lenas Satz?"
                say: "Lies den Satz leise. Wie liest du, was Lena sagt?"
                options: ["wütend und laut", "leise und müde", "fröhlich und hüpfend"]
                answer: "wütend und laut"
                hints: ["Achte auf schimpfte und stampfte."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort sagt dir, dass du leise lesen sollst?"
                say: "Lies die Wörter. Welches Wort sagt dir, dass du leise lesen sollst?"
                options: ["wisperte", "rief", "schrie"]
                answer: "wisperte"
                hints: ["Welches Wort klingt wie Flüstern?"]
              - id: l1-s3
                type: speak
                text: "„Psst, sonst wacht der Drache auf“, flüsterte die Prinzessin."
                say: "Lies den Satz ganz leise vor, so wie die Prinzessin. Dann hörst du dich und das Vorbild."
                expected_text: "„Psst, sonst wacht der Drache auf“, flüsterte die Prinzessin."
                hints: ["Flüstern heißt: ganz leise, aber deutlich."]
              - id: l1-s4
                type: multiple_choice
                text: "„Nicht der kleine Hund hat gebellt, sondern der große.“ Welches Wort betonst du am stärksten?"
                say: "Lies den Satz leise. Welches Wort betonst du am stärksten?"
                options: ["große", "Hund", "gebellt"]
                answer: "große"
                hints: ["Welches Wort steht im Gegensatz zu klein?"]
              - id: l1-s5
                type: true_false
                text: "„Ich bin so müde“, gähnte Opa. Liest du Opas Satz laut und schnell?"
                say: "Lies den Satz leise. Liest du Opas Satz laut und schnell?"
                answer: false
                hints: ["Wie spricht jemand, der gähnt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "„Toll, ein Geschenk für mich!“, staunte Jana. Wie liest du Janas Satz?"
                say: "Lies den Satz leise. Wie liest du, was Jana sagt?"
                options: ["überrascht und fröhlich", "traurig und leise", "ängstlich"]
                answer: "überrascht und fröhlich"
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort sagt dir, dass jemand Angst hat?"
                say: "Lies die Wörter. Welches Wort sagt dir, dass jemand Angst hat?"
                options: ["stotterte", "lachte", "jubelte"]
                answer: "stotterte"
              - id: l1-n3
                type: multiple_choice
                text: "„Heute gehen wir nicht ins Kino, sondern in den Zoo.“ Welches Wort betonst du am stärksten?"
                say: "Lies den Satz leise. Welches Wort betonst du am stärksten?"
                options: ["Zoo", "Heute", "gehen"]
                answer: "Zoo"
              - id: l1-n4
                type: true_false
                text: "„Hurra, es schneit!“, rief Emil. Liest du Emils Satz fröhlich?"
                say: "Lies den Satz leise. Liest du Emils Satz fröhlich?"
                answer: true
              - id: l1-n5
                type: speak
                text: "„Wer hat meinen Kuchen gegessen?“, brummte der Bär böse."
                say: "Lies den Satz mit einer tiefen, bösen Bärenstimme vor. Dann hörst du dich und das Vorbild."
                expected_text: "„Wer hat meinen Kuchen gegessen?“, brummte der Bär böse."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "„Ich habe mich verlaufen“, sagte der kleine Junge und weinte. Wie liest du seinen Satz?"
            say: "Lies den Satz leise. Wie liest du, was der Junge sagt?"
            options: ["traurig und leise", "wütend und laut", "fröhlich"]
            answer: "traurig und leise"
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort sagt dir, dass du laut lesen sollst?"
            say: "Lies die Wörter. Welches Wort sagt dir, dass du laut lesen sollst?"
            options: ["schrie", "hauchte", "flüsterte"]
            answer: "schrie"
          - id: l1-c3
            type: multiple_choice
            text: "„Ich mag Erdbeeren, nicht Bananen.“ Welches Wort betonst du am stärksten?"
            say: "Lies den Satz leise. Welches Wort betonst du am stärksten?"
            options: ["Erdbeeren", "mag", "Ich"]
            answer: "Erdbeeren"

  - n: 2
    title: { de: "Einen Text vorbereiten", en: "Preparing a text" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Endlich bist du da!“, freute sich Oma. Wie liest du Omas Satz?"
            say: "Lies den Satz leise. Wie liest du, was Oma sagt?"
            options: ["fröhlich", "ängstlich", "müde"]
            answer: "fröhlich"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort sagt dir, dass du leise lesen sollst?"
            say: "Lies die Wörter. Welches Wort sagt dir, dass du leise lesen sollst?"
            options: ["flüsterte", "rief", "brüllte"]
            answer: "flüsterte"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. leise lesen | 2. schwierige Wörter üben | 3. Pausen und Betonung markieren | 4. laut üben"
            say: "Gutes Vorlesen beginnt mit Üben. Lies den Text zuerst leise. Übe schwierige Wörter. Markiere Pausen und wichtige Wörter. Dann lies ihn ein paarmal laut."
          - text: "nicht zu schnell | nicht zu langsam"
            say: "Lies so schnell, dass es nicht langweilig wird, und so langsam, dass alle mitkommen. An spannenden Stellen darfst du langsamer werden."
          - text: "Plötzlich ... knackte es im Gebüsch."
            say: "Vor einer spannenden Stelle machst du eine kleine Pause. Plötzlich, Pause, knackte es im Gebüsch. Schau zwischendurch kurz zu deinen Zuhörern."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Du willst morgen eine Geschichte vorlesen. Was machst du in welcher Reihenfolge?"
                say: "Du willst morgen eine Geschichte vorlesen. Leg die Schritte in die richtige Reihenfolge."
                options: ["den Text vorlesen", "den Text leise lesen", "den Text laut üben", "schwierige Wörter üben"]
                slot_count: 4
                answer: ["den Text leise lesen", "schwierige Wörter üben", "den Text laut üben", "den Text vorlesen"]
                hints:
                  - "Bevor du übst, musst du den Text kennen."
                  - "Erst leise lesen, dann die schweren Wörter, dann alles laut."
                  - "Leise lesen, Wörter üben, laut üben, vorlesen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie schnell liest du einer Gruppe vor?"
                say: "Wie schnell liest du einer Gruppe vor?"
                options: ["so, dass alle gut mitkommen", "so schnell ich kann", "jedes Wort mit langer Pause"]
                answer: "so, dass alle gut mitkommen"
                feedback:
                  "so schnell ich kann": "Wer zu schnell liest, den verstehen die Zuhörer nicht."
                hints:
                  - "Denk an die Zuhörer."
                  - "Zu schnell versteht man nicht, zu langsam ist langweilig."
                  - "So, dass alle gut mitkommen."
              - id: l2-f3
                type: multiple_choice
                text: "Leise öffnete Ben die Tür. Plötzlich sprang ihm etwas Weiches entgegen.\n\nWo machst du eine kleine Spannungspause?"
                say: "Lies den Text leise. Wo machst du eine kleine Pause, damit es spannend wird?"
                options: ["nach „Plötzlich“", "nach „Leise“", "nach „Tür“"]
                answer: "nach „Plötzlich“"
                hints:
                  - "An welchem Wort merkt man: Jetzt passiert etwas?"
                  - "Plötzlich kündigt eine Überraschung an."
                  - "Nach „Plötzlich“."
              - id: l2-f4
                type: speak
                text: "Leise öffnete Ben die Tür. Plötzlich sprang ihm etwas Weiches entgegen. Es war die Katze!"
                say: "Lies die drei Sätze laut vor. Mach nach Plötzlich eine kleine Pause. Dann hörst du dich und das Vorbild."
                expected_text: "Leise öffnete Ben die Tür. Plötzlich sprang ihm etwas Weiches entgegen. Es war die Katze!"
                hints:
                  - "Lies den Anfang leise und langsam."
                  - "Nach Plötzlich kurz warten, dann weiterlesen."
                  - "Den letzten Satz liest du erleichtert und fröhlich."
              - id: l2-f5
                type: true_false
                text: "Beim Vorlesen schaust du ab und zu deine Zuhörer an. Ist das gut?"
                say: "Beim Vorlesen schaust du ab und zu deine Zuhörer an. Ist das gut?"
                answer: true
                hints:
                  - "Wie merken die Zuhörer, dass du für sie liest?"
                  - "Ein kurzer Blick zeigt: Ich lese für euch."
                  - "Ja, das ist gut."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Text steht ein schweres Wort: Schornsteinfeger. Was machst du vor dem Vorlesen?"
                say: "Im Text steht ein schweres Wort. Was machst du, bevor du vorliest?"
                options: ["Ich übe das Wort ein paarmal laut.", "Ich lasse das Wort einfach weg.", "Ich lese an der Stelle ganz schnell."]
                answer: "Ich übe das Wort ein paarmal laut."
                hints: ["Schwierige Wörter übst du vorher."]
              - id: l2-s2
                type: multiple_choice
                text: "Nele liest so schnell vor, dass ihre Freunde nichts verstehen. Was soll sie ändern?"
                say: "Nele liest so schnell vor, dass ihre Freunde nichts verstehen. Was soll sie ändern?"
                options: ["langsamer lesen", "leiser lesen", "schneller lesen"]
                answer: "langsamer lesen"
                hints: ["Was ist das Problem: die Lautstärke oder das Tempo?"]
              - id: l2-s3
                type: multiple_choice
                text: "Der Wolf schlich näher und näher. Auf einmal stand er direkt vor dem Haus.\n\nWo machst du eine kleine Spannungspause?"
                say: "Lies den Text leise. Wo machst du eine kleine Pause, damit es spannend wird?"
                options: ["nach „Auf einmal“", "nach „Wolf“", "nach „Haus“"]
                answer: "nach „Auf einmal“"
                hints: ["Welche Wörter kündigen eine Überraschung an?"]
              - id: l2-s4
                type: speak
                text: "Der Wolf schlich näher und näher. Auf einmal stand er direkt vor dem Haus."
                say: "Lies die zwei Sätze laut und spannend vor. Dann hörst du dich und das Vorbild."
                expected_text: "Der Wolf schlich näher und näher. Auf einmal stand er direkt vor dem Haus."
                hints: ["Werde bei näher und näher etwas langsamer."]
              - id: l2-s5
                type: true_false
                text: "Du liest den Text zum ersten Mal und gleich laut vor der Klasse. Ist das gut?"
                say: "Du liest den Text zum ersten Mal und gleich laut vor der ganzen Klasse. Ist das gut?"
                answer: false
                hints: ["Was machst du vor dem Vorlesen?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Du bereitest einen Text zum Vorlesen vor. Was machst du in welcher Reihenfolge?"
                say: "Du bereitest einen Text zum Vorlesen vor. Leg die Schritte in die richtige Reihenfolge."
                options: ["Pausen und wichtige Wörter markieren", "den Text vorlesen", "den Text leise lesen"]
                slot_count: 3
                answer: ["den Text leise lesen", "Pausen und wichtige Wörter markieren", "den Text vorlesen"]
              - id: l2-n2
                type: multiple_choice
                text: "Jonas liest jedes Wort einzeln und mit langer Pause. Was soll er ändern?"
                say: "Jonas liest jedes Wort einzeln und macht danach eine lange Pause. Was soll er ändern?"
                options: ["flüssiger lesen, in Wortgruppen", "lauter lesen", "noch langsamer lesen"]
                answer: "flüssiger lesen, in Wortgruppen"
              - id: l2-n3
                type: multiple_choice
                text: "Langsam drehte sich der Schlüssel im Schloss. Mit einem Quietschen ging die Tür auf.\n\nWie liest du den ersten Satz?"
                say: "Lies den Text leise. Wie liest du den ersten Satz?"
                options: ["langsam und gespannt", "schnell und fröhlich", "laut und wütend"]
                answer: "langsam und gespannt"
              - id: l2-n4
                type: speak
                text: "Langsam drehte sich der Schlüssel im Schloss. Mit einem Quietschen ging die Tür auf."
                say: "Lies die zwei Sätze laut und spannend vor. Dann hörst du dich und das Vorbild."
                expected_text: "Langsam drehte sich der Schlüssel im Schloss. Mit einem Quietschen ging die Tür auf."
              - id: l2-n5
                type: true_false
                text: "Beim Vorlesen hältst du das Buch so, dass es dein Gesicht ganz verdeckt. Ist das gut?"
                say: "Beim Vorlesen hältst du das Buch so, dass es dein Gesicht ganz verdeckt. Ist das gut?"
                answer: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "„Ich habe Angst vor dem Gewitter“, sagte Lotta leise. Wie liest du Lottas Satz?"
            say: "Lies den Satz leise. Wie liest du, was Lotta sagt?"
            options: ["ängstlich und leise", "fröhlich und laut", "wütend"]
            answer: "ängstlich und leise"
          - id: l2-c2
            type: multiple_choice
            text: "Ali liest so leise, dass die Kinder hinten nichts hören. Was soll er ändern?"
            say: "Ali liest so leise, dass die Kinder hinten nichts hören. Was soll er ändern?"
            options: ["lauter lesen", "schneller lesen", "langsamer lesen"]
            answer: "lauter lesen"
          - id: l2-c3
            type: multiple_choice
            text: "„Ich will heute nicht ins Bett, sondern noch spielen!“ Welches Wort betonst du am stärksten?"
            say: "Lies den Satz leise. Welches Wort betonst du am stärksten?"
            options: ["spielen", "will", "heute"]
            answer: "spielen"
          - id: l2-c4
            type: ordering
            text: "Du willst einem jüngeren Kind ein Buch vorlesen. Was machst du in welcher Reihenfolge?"
            say: "Du willst einem jüngeren Kind ein Buch vorlesen. Leg die Schritte in die richtige Reihenfolge."
            options: ["die Geschichte vorlesen", "die Geschichte laut üben", "die Geschichte leise lesen"]
            slot_count: 3
            answer: ["die Geschichte leise lesen", "die Geschichte laut üben", "die Geschichte vorlesen"]
          - id: l2-c5
            type: multiple_choice
            text: "Die Tür ging auf. Und dann stand ein Pferd in der Küche!\n\nWo machst du eine kleine Spannungspause?"
            say: "Lies den Text leise. Wo machst du eine kleine Pause, damit es spannend wird?"
            options: ["nach „Und dann“", "nach „Tür“", "nach „Pferd“"]
            answer: "nach „Und dann“"
