# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.fairy-tales
skill: lit-de.texts-media.fairy-tales
curriculum: de-DE
language: de
title:
  de: Märchen erkennen und nacherzählen
  en: Recognising and retelling fairy tales
summary: >
  What makes a Märchen. Lesson 1 finds the typical features (Es war
  einmal, Zauberei, Gut und Böse, magic numbers, the happy ending) in a
  short Märchen written for Twist and tells a Märchen from other texts;
  lesson 2 retells well-known Märchen (Rotkäppchen, Hänsel und Gretel, Der
  Froschkönig) in the right order, in Twist's own words, and ends with the
  skill check. Telling a Märchen freely waits for a free text task type.
  The skill check marks what a screen can mark (telling a Märchen from
  other texts, its features, the order of a retelling); retelling aloud
  or in writing is practised, not marked.
metadata:
  year: klasse-3
  topic: { de: "Märchen, Fabeln, Sagen", en: "Fairy tales, fables, legends" }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.texts-media.text-types]
  also_practises: [lit-de.texts-media.text-types, lit-de.comprehension.order-story]
  vocabulary: { de: [Märchen, Märchenmerkmal, Zauberei, Gut und Böse, Märchenanfang, Märchenschluss, nacherzählen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: recognise, what: { de: ein Märchen von anderen Texten unterscheiden, en: telling a fairy tale from other texts } }
    - { id: features, what: { de: "Märchenmerkmale nennen (Es war einmal, Zauberei, Gut und Böse)", en: "naming the features of a fairy tale (once upon a time, magic, good and evil)" } }
    - { id: retell, what: { de: ein bekanntes Märchen der Reihe nach nacherzählen, en: retelling a well-known fairy tale in order } }
  misconceptions:
    - id: any-story-is-a-fairy-tale
      what: Calls every story with a child or an animal a Märchen
      addressed: "lesson 1 sorts features of a Märchen from features of other stories (l1-f4, l1-s4, l1-n4) and asks which text is a Märchen (l1-f1, l1-n1, l2-c1), with an everyday story as the key distractor"
    - id: retell-out-of-order
      what: Retells the parts of a Märchen they remember best, not in the order they happen
      addressed: "lesson 2 orders the steps of three Märchen (l2-f1, l2-f4, l2-s1, l2-n1, l2-c3); hints point at what has to happen first"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Woran erkenne ich ein Märchen?", en: "How do I know it is a fairy tale?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Igel fressen Käfer und Würmer. Im Winter halten sie Winterschlaf.\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["ein Sachtext", "ein Gedicht", "eine Einladung"]
            answer: "ein Sachtext"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wozu ist ein Gedicht da?"
            say: "Wozu ist ein Gedicht da?"
            options: ["Es spielt mit Klang und Reimen.", "Es erklärt, wie man etwas baut.", "Es lädt zu einem Fest ein."]
            answer: "Es spielt mit Klang und Reimen."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Es war einmal ein armes Mädchen namens Lina. Es lebte mit seiner bösen Tante in einer kleinen Hütte am Waldrand."
            say: "Dieser Text beginnt mit Es war einmal. So fangen viele Märchen an. Die Zeit und der Ort bleiben ungenau: irgendwann, irgendwo."
          - text: "Eines Tages fand Lina im Wald einen sprechenden Raben. „Hilf mir, dann helfe ich dir“, krächzte er. Er schenkte ihr drei goldene Federn. Mit jeder Feder hatte sie einen Wunsch frei."
            say: "In Märchen gibt es Zauberei: Tiere sprechen, Dinge haben Zauberkraft. Oft kommen die Zahlen drei, sieben oder zwölf vor. Und es gibt Gute und Böse."
          - text: "Am Ende wünschte sich Lina ein Haus voller Bücher und Freunde. Die böse Tante aber musste allein im Wald wohnen. Und wenn sie nicht gestorben sind, dann leben sie noch heute."
            say: "Das Gute gewinnt, das Böse wird bestraft. Viele Märchen enden mit einem festen Satz: Und wenn sie nicht gestorben sind, dann leben sie noch heute."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Anfang gehört zu einem Märchen?"
                say: "Lies die drei Anfänge. Welcher gehört zu einem Märchen?"
                options: ["Vor langer, langer Zeit lebte ein König, der hatte drei Söhne.", "Am Montag hatte Ben in der Schule Sport.", "Bienen leben in einem großen Volk."]
                answer: "Vor langer, langer Zeit lebte ein König, der hatte drei Söhne."
                option_audio: false
                feedback:
                  "Am Montag hatte Ben in der Schule Sport.": "Das ist eine Geschichte aus dem Alltag. Ein Märchen spielt vor langer Zeit, ohne genauen Tag."
                hints:
                  - "Märchen spielen irgendwann, vor langer Zeit."
                  - "Welche Figur kommt oft in Märchen vor?"
                  - "Vor langer, langer Zeit lebte ein König ..."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Figur ist typisch für Märchen?"
                say: "Welche Figur ist typisch für Märchen?"
                options: ["eine Hexe", "ein Busfahrer", "eine Ärztin im Krankenhaus"]
                answer: "eine Hexe"
                hints:
                  - "Denk an Märchen, die du kennst."
                  - "Wer kann in Märchen zaubern?"
                  - "eine Hexe."
              - id: l1-f3
                type: true_false
                text: "„Und wenn sie nicht gestorben sind, dann leben sie noch heute.“ Ist das ein typischer Märchenschluss?"
                say: "Lies den Satz. Ist das ein typischer Märchenschluss?"
                answer: true
                hints:
                  - "Wie enden viele Märchen?"
                  - "Dieser Satz steht oft ganz am Ende."
                  - "Ja, das ist ein typischer Märchenschluss."
              - id: l1-f4
                type: sorting
                text: "Ist das typisch für ein Märchen?"
                say: "Sortiere: Was ist typisch für ein Märchen, und was nicht?"
                bins:
                  - { id: yes, show: { text: "typisch für Märchen" }, say: "typisch für Märchen" }
                  - { id: no, show: { text: "nicht typisch" }, say: "nicht typisch" }
                options:
                  - { text: "ein sprechender Frosch", bin: yes }
                  - { text: "drei Wünsche", bin: yes }
                  - { text: "ein Handy", bin: no }
                  - { text: "ein genaues Datum", bin: no }
                hints:
                  - "Gibt es das in alten Märchen?"
                  - "Zauberei und die Zahl drei sind typisch."
                  - "Frosch und drei Wünsche: typisch. Handy und Datum: nicht typisch."
              - id: l1-f5
                type: multiple_choice
                text: "Es war einmal ein Müller, der hatte nichts als eine Mühle und einen klugen Kater. Der Kater konnte sprechen und versprach: „Ich mache dich reich.“\n\nWelches Märchenmerkmal findest du?"
                say: "Lies den Text. Welches Märchenmerkmal findest du?"
                options: ["ein sprechendes Tier", "ein genauer Ort", "ein Computer"]
                answer: "ein sprechendes Tier"
                hints:
                  - "Was ist an dem Kater besonders?"
                  - "Können echte Kater sprechen?"
                  - "ein sprechendes Tier."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Anfang gehört zu einem Märchen?"
                say: "Lies die drei Anfänge. Welcher gehört zu einem Märchen?"
                options: ["Es war einmal eine Königin, die wünschte sich ein Kind.", "Gestern war ich mit Papa im Zoo.", "Man nehme zwei Eier und 200 Gramm Mehl."]
                answer: "Es war einmal eine Königin, die wünschte sich ein Kind."
                option_audio: false
                hints: ["Wie fangen viele Märchen an?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Zahl kommt in Märchen besonders oft vor?"
                say: "Welche Zahl kommt in Märchen besonders oft vor?"
                options: ["drei", "vier", "zehn"]
                answer: "drei"
                hints: ["Denk an drei Brüder, drei Wünsche, drei Aufgaben."]
              - id: l1-s3
                type: true_false
                text: "Im Märchen gewinnt am Ende meistens das Böse. Stimmt das?"
                say: "Im Märchen gewinnt am Ende meistens das Böse. Stimmt das?"
                answer: false
                hints: ["Wie endet es für die Hexe bei Hänsel und Gretel?"]
              - id: l1-s4
                type: sorting
                text: "Ist das typisch für ein Märchen?"
                say: "Sortiere: Was ist typisch für ein Märchen, und was nicht?"
                bins:
                  - { id: yes, show: { text: "typisch für Märchen" }, say: "typisch für Märchen" }
                  - { id: no, show: { text: "nicht typisch" }, say: "nicht typisch" }
                options:
                  - { text: "eine gute Fee", bin: yes }
                  - { text: "ein Zauberspruch", bin: yes }
                  - { text: "ein Fußballspiel", bin: no }
                  - { text: "eine Straße in Berlin", bin: no }
                hints: ["Gibt es Zauberei? Ist der Ort genau bekannt?"]
              - id: l1-s5
                type: multiple_choice
                text: "Ein armer Junge musste für einen bösen Riesen drei schwere Aufgaben lösen. Ein kleiner Zwerg half ihm dabei mit einem Zauberstab.\n\nWer ist in diesem Märchen böse?"
                say: "Lies den Text. Wer ist in diesem Märchen böse?"
                options: ["der Riese", "der Zwerg", "der Junge"]
                answer: "der Riese"
                hints: ["Wer hilft, wer macht es dem Jungen schwer?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welcher Text ist ein Märchen?"
                say: "Lies die drei Texte. Welcher ist ein Märchen?"
                options: ["Es war einmal ein Schneider, der fand einen Zauberfaden. Alles, was er damit nähte, wurde aus Gold.", "Mia hat einen Hund. Jeden Tag geht sie nach der Schule mit ihm in den Park.", "Der Elefant ist das größte Landtier. Er wiegt mehrere Tonnen."]
                answer: "Es war einmal ein Schneider, der fand einen Zauberfaden. Alles, was er damit nähte, wurde aus Gold."
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Welche Figur ist in Märchen meistens böse?"
                say: "Welche Figur ist in Märchen meistens böse?"
                options: ["die Stiefmutter", "der jüngste Sohn", "die Königstochter"]
                answer: "die Stiefmutter"
              - id: l1-n3
                type: true_false
                text: "Märchen spielen meistens an einem genauen Ort mit Straße und Hausnummer. Stimmt das?"
                say: "Märchen spielen meistens an einem genauen Ort mit Straße und Hausnummer. Stimmt das?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "Ist das typisch für ein Märchen?"
                say: "Sortiere: Was ist typisch für ein Märchen, und was nicht?"
                bins:
                  - { id: yes, show: { text: "typisch für Märchen" }, say: "typisch für Märchen" }
                  - { id: no, show: { text: "nicht typisch" }, say: "nicht typisch" }
                options:
                  - { text: "sieben Zwerge", bin: yes }
                  - { text: "ein verzaubertes Schloss", bin: yes }
                  - { text: "ein Bus mit Fahrplan", bin: no }
                  - { text: "ein Wetterbericht", bin: no }
              - id: l1-n5
                type: multiple_choice
                text: "Die Prinzessin musste hundert Jahre schlafen, weil eine böse Fee sie verzaubert hatte. Dann kam ein Prinz und weckte sie.\n\nWelches Märchenmerkmal findest du?"
                say: "Lies den Text. Welches Märchenmerkmal findest du?"
                options: ["Zauberei", "ein genaues Datum", "eine Anleitung"]
                answer: "Zauberei"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Satz ist ein typischer Märchenanfang?"
            say: "Welcher Satz ist ein typischer Märchenanfang?"
            options: ["Es war einmal ...", "Liebe Oma, ...", "Zuerst brauchst du ..."]
            answer: "Es war einmal ..."
          - id: l1-c2
            type: true_false
            text: "In Märchen können Tiere sprechen. Stimmt das?"
            say: "In Märchen können Tiere sprechen. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Ein Fischer fing einen goldenen Fisch. Der Fisch sagte: „Lass mich frei, dann erfülle ich dir drei Wünsche.“\n\nWelche zwei Märchenmerkmale findest du?"
            say: "Lies den Text. Welche zwei Märchenmerkmale findest du?"
            options: ["ein sprechendes Tier und die Zahl drei", "ein genauer Ort und ein Datum", "ein Reim und eine Überschrift"]
            answer: "ein sprechendes Tier und die Zahl drei"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Ein Märchen spielt an einem genauen Tag, zum Beispiel am 3. Mai 2024."
            say: "Stimmt das? Ein Märchen spielt an einem genauen Tag, zum Beispiel am dritten Mai zweitausendvierundzwanzig."
            answer: false
          - id: l1-c5
            type: sorting
            text: "Was gehört in ein Märchen? Sortiere."
            say: "Sortiere: Was ist typisch für ein Märchen, und was nicht?"
            bins:
              - { id: fairy, show: { text: "typisch für Märchen" }, say: "typisch für Märchen" }
              - { id: other, show: { text: "nicht typisch" }, say: "nicht typisch" }
            options:
              - { text: "ein Riese", bin: fairy }
              - { text: "ein Zauberstab", bin: fairy }
              - { text: "ein Fahrrad", bin: other }
              - { text: "eine Zeitung", bin: other }
          - id: l1-c6
            type: multiple_choice
            text: "Es war einmal ein Mädchen, das hatte sieben Brüder. Eines Tages wurden die Brüder in Raben verwandelt.\n\nWas ist in diesem Text Zauberei?"
            say: "Lies den Text. Was ist in diesem Text Zauberei?"
            options: ["Die Brüder werden zu Raben.", "Das Mädchen hat sieben Brüder.", "Es war einmal ein Mädchen."]
            answer: "Die Brüder werden zu Raben."
            option_audio: false

  - n: 2
    title: { de: "Märchen nacherzählen", en: "Retelling fairy tales" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Figur ist typisch für Märchen?"
            say: "Welche Figur ist typisch für Märchen?"
            options: ["ein König", "ein Polizist", "eine Lehrerin"]
            answer: "ein König"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "„Und wenn sie nicht gestorben sind ...“ steht meistens am Anfang eines Märchens. Stimmt das?"
            say: "Und wenn sie nicht gestorben sind: Dieser Satz steht meistens am Anfang eines Märchens. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Anfang: Wer? Wo? | Mitte: Was passiert? | Ende: Wie geht es aus?"
            say: "Wenn du ein Märchen nacherzählst, erzählst du es in deinen eigenen Worten. Du hältst dich an die Reihenfolge: Anfang, Mitte, Ende."
          - text: "Rotkäppchen soll der kranken Großmutter Kuchen und Wein bringen. Im Wald trifft es den Wolf."
            say: "Bei Rotkäppchen ist das der Anfang: Rotkäppchen geht zur Großmutter und trifft im Wald den Wolf."
          - text: "Der Wolf frisst die Großmutter und Rotkäppchen. Der Jäger rettet die beiden."
            say: "In der Mitte frisst der Wolf zuerst die Großmutter und dann Rotkäppchen. Am Ende rettet der Jäger beide. Wenn du nacherzählst, nimmst du die Vergangenheit: Rotkäppchen ging in den Wald und traf den Wolf. Der Jäger rettete beide."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Rotkäppchen: Leg die Teile in die richtige Reihenfolge."
                say: "Erzähl das Märchen vom Rotkäppchen nach. Leg die Teile in die richtige Reihenfolge."
                options: ["Der Jäger befreit Rotkäppchen und die Großmutter.", "Rotkäppchen trifft im Wald den Wolf.", "Der Wolf frisst die Großmutter.", "Die Mutter schickt Rotkäppchen zur Großmutter."]
                slot_count: 4
                answer: ["Die Mutter schickt Rotkäppchen zur Großmutter.", "Rotkäppchen trifft im Wald den Wolf.", "Der Wolf frisst die Großmutter.", "Der Jäger befreit Rotkäppchen und die Großmutter."]
                option_audio: false
                hints:
                  - "Womit fängt das Märchen an?"
                  - "Bevor Rotkäppchen den Wolf trifft, muss es losgehen."
                  - "Mutter schickt los, Wolf im Wald, Wolf frisst Großmutter, Jäger befreit."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Hänsel und Gretel finden im Wald ein Haus. Woraus ist es gemacht?"
                say: "Hänsel und Gretel finden im Wald ein Haus. Woraus ist es gemacht?"
                options: ["aus Brot, Kuchen und Zucker", "aus Gold und Silber", "aus Eis und Schnee"]
                answer: "aus Brot, Kuchen und Zucker"
                hints:
                  - "Die Kinder haben großen Hunger und knabbern am Haus."
                  - "Man sagt dazu auch Knusperhäuschen."
                  - "aus Brot, Kuchen und Zucker."
              - id: l2-f3
                type: multiple_choice
                text: "Im Märchen vom Froschkönig fällt der Königstochter etwas in den Brunnen. Was ist es?"
                say: "Im Märchen vom Froschkönig fällt der Königstochter etwas in den Brunnen. Was ist es?"
                options: ["ihre goldene Kugel", "ihr Schuh", "ihr Spiegel"]
                answer: "ihre goldene Kugel"
                hints:
                  - "Sie spielt am Brunnen damit."
                  - "Sie wirft es hoch und fängt es wieder auf."
                  - "ihre goldene Kugel."
              - id: l2-f4
                type: ordering
                text: "Hänsel und Gretel: Leg die Teile in die richtige Reihenfolge."
                say: "Erzähl das Märchen von Hänsel und Gretel nach. Leg die Teile in die richtige Reihenfolge."
                options: ["Die Hexe sperrt Hänsel in einen Stall.", "Die Kinder verirren sich im Wald.", "Gretel stößt die Hexe in den Ofen.", "Sie finden ein Haus aus Kuchen."]
                slot_count: 4
                answer: ["Die Kinder verirren sich im Wald.", "Sie finden ein Haus aus Kuchen.", "Die Hexe sperrt Hänsel in einen Stall.", "Gretel stößt die Hexe in den Ofen."]
                option_audio: false
                hints:
                  - "Wo sind die Kinder ganz am Anfang?"
                  - "Die Hexe wohnt in dem Kuchenhaus. Das finden sie zuerst."
                  - "Verirren, Kuchenhaus, Hänsel im Stall, Hexe im Ofen."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Satz erzählt den Schluss vom Froschkönig in eigenen Worten?"
                say: "Welcher Satz erzählt den Schluss vom Froschkönig in eigenen Worten?"
                options: ["Die Königstochter wirft den Frosch an die Wand, und er wird zu einem Prinzen.", "Der Frosch springt in den Brunnen und bleibt für immer dort.", "Die Königstochter schenkt dem Frosch ihren Spiegel."]
                answer: "Die Königstochter wirft den Frosch an die Wand, und er wird zu einem Prinzen."
                option_audio: false
                hints:
                  - "Am Ende eines Märchens wird oft ein Zauber gelöst."
                  - "Wer war der Frosch in Wirklichkeit?"
                  - "Er wird zu einem Prinzen."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Der Froschkönig: Leg die Teile in die richtige Reihenfolge."
                say: "Erzähl das Märchen vom Froschkönig nach. Leg die Teile in die richtige Reihenfolge."
                options: ["Der Frosch holt die Kugel herauf.", "Die goldene Kugel fällt in den Brunnen.", "Der Frosch wird zu einem Prinzen."]
                slot_count: 3
                answer: ["Die goldene Kugel fällt in den Brunnen.", "Der Frosch holt die Kugel herauf.", "Der Frosch wird zu einem Prinzen."]
                option_audio: false
                hints: ["Was muss zuerst passieren, damit der Frosch helfen kann?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wer rettet im Märchen vom Rotkäppchen die Großmutter?"
                say: "Wer rettet im Märchen vom Rotkäppchen die Großmutter?"
                options: ["der Jäger", "der Wolf", "die Mutter"]
                answer: "der Jäger"
                hints: ["Er hört das laute Schnarchen und kommt ins Haus."]
              - id: l2-s3
                type: true_false
                text: "Bei Hänsel und Gretel ist die Hexe am Ende die Gewinnerin. Stimmt das?"
                say: "Bei Hänsel und Gretel ist die Hexe am Ende die Gewinnerin. Stimmt das?"
                answer: false
                hints: ["Wer landet im Ofen?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Satz erzählt den Anfang vom Rotkäppchen in eigenen Worten?"
                say: "Welcher Satz erzählt den Anfang vom Rotkäppchen in eigenen Worten?"
                options: ["Ein Mädchen mit roter Kappe soll seiner kranken Oma Kuchen bringen.", "Ein Jäger geht im Wald spazieren.", "Ein Wolf wohnt bei der Großmutter."]
                answer: "Ein Mädchen mit roter Kappe soll seiner kranken Oma Kuchen bringen."
                option_audio: false
                hints: ["Wer ist die Hauptfigur, und wohin geht sie?"]
              - id: l2-s5
                type: multiple_choice
                text: "Du erzählst ein Märchen nach. Welche Zeitform nimmst du?"
                say: "Du erzählst ein Märchen nach. Welche Zeitform nimmst du?"
                options: ["die Vergangenheit: Es lebte einmal ...", "die Zukunft: Es wird leben ...", "nur Befehle: Lebe!"]
                answer: "die Vergangenheit: Es lebte einmal ..."
                option_audio: false
                hints: ["Märchen sind vor langer Zeit passiert."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Rotkäppchen: Leg die Teile in die richtige Reihenfolge."
                say: "Erzähl das Ende vom Rotkäppchen nach. Leg die Teile in die richtige Reihenfolge."
                options: ["Der Jäger hört das laute Schnarchen.", "Der Wolf frisst Rotkäppchen und schläft ein.", "Der Jäger schneidet den Bauch des Wolfes auf."]
                slot_count: 3
                answer: ["Der Wolf frisst Rotkäppchen und schläft ein.", "Der Jäger hört das laute Schnarchen.", "Der Jäger schneidet den Bauch des Wolfes auf."]
                option_audio: false
              - id: l2-n2
                type: multiple_choice
