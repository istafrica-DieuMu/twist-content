# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.sentences-move-parts
skill: lit-de.sentences.move-parts
curriculum: de-DE
language: de
title:
  de: Satzglieder umstellen
  en: Moving parts of a sentence
summary: >
  The Umstellprobe: words that move together are one Satzglied, and in a
  statement the verb stays in second place. Lesson 1 moves Satzglieder to
  the front and finds which words stay together; lesson 2 counts
  Satzglieder, spots sentences where the verb has left second place, and
  ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Satzglieder, en: Parts of a sentence }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.sentences.subject-predicate]
  also_practises: [lit-de.sentences.subject-predicate]
  vocabulary: { de: [Satzglied, Umstellprobe, umstellen, an zweiter Stelle] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: move, what: { de: einen Satz umstellen und das Verb an zweiter Stelle lassen, en: rearranging a sentence and keeping the verb in second place } }
    - { id: find-parts, what: { de: Satzglieder durch Umstellen finden und zählen, en: finding and counting the parts of a sentence by moving them } }
    - { id: verb-second, what: { de: "prüfen, ob das Verb an zweiter Stelle steht", en: checking whether the verb is in second place } }
  misconceptions:
    - id: verb-moves
      what: Moves the verb along with the other words (Im Garten der Hund spielt.)
      addressed: lesson 1 Learn shows the verb staying in place; every stage of lesson 1 has a true/false or "which sentence" task with the verb in third place, and lesson 2 has them in the some and none stages and the skill check
    - id: word-not-part
      what: Treats every word as its own Satzglied (im and Garten separately)
      addressed: lesson 1 has a "which words stay together" task in every stage; lesson 2 counts Satzglieder with groups of two and three words
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Die Umstellprobe", en: "Moving parts around" }
    goal:
      de: "Stell Sätze um und finde die Wörter, die zusammenbleiben, so wie Im Bett liest Lena ein Buch."
      en: "Move sentence parts around and find the words that stay together, like in bed Lena reads a book."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Prädikat."
            say: "Lies den Satz. Tippe auf das Prädikat."
            show: { drawn: letter-card, text: "Der Igel sucht Futter." }
            spans: ["sucht"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "„Morgen fliegt Tante Uta nach Rom.“ Wer oder was fliegt?"
            say: "Morgen fliegt Tante Uta nach Rom. Wer oder was fliegt?"
            options: ["Tante Uta", "Morgen", "nach Rom"]
            answer: "Tante Uta"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lena | liest | im Bett | ein Buch."
            say: "Du kannst einen Satz umstellen. Lena liest im Bett ein Buch. Im Bett liest Lena ein Buch. Ein Buch liest Lena im Bett. Der Satz sagt immer dasselbe."
          - text: "Im Bett | liest | Lena | ein Buch."
            say: "Die Wörter, die beim Umstellen zusammenbleiben, sind ein Satzglied. Im Bett bleibt zusammen, ein Buch bleibt zusammen. Das ist die Umstellprobe."
          - text: "Ein Buch | liest | Lena | im Bett."
            say: "Pass beim Umstellen auf das Verb auf. Liest steht immer an zweiter Stelle. In einem Aussagesatz ist das immer so, egal, welches Satzglied vorn steht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "„Opa trinkt am Morgen einen Kaffee.“ Stell den Satz um. Beginne mit „Am Morgen“."
                say: "Opa trinkt am Morgen einen Kaffee. Stell den Satz um und beginne mit am Morgen."
                options: ["trinkt", "Am Morgen", "Opa", "einen Kaffee"]
                slot_count: 4
                answer: ["Am Morgen", "trinkt", "Opa", "einen Kaffee"]
                option_audio: false
                hints:
                  - "Am Morgen stellst du nach vorn."
                  - "Das Verb steht an zweiter Stelle."
                  - "Am Morgen trinkt Opa einen Kaffee."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "„Die Kinder spielen im Garten.“ Welche Wörter bleiben beim Umstellen zusammen?"
                say: "Die Kinder spielen im Garten. Welche Wörter bleiben beim Umstellen zusammen?"
                options: ["im Garten", "spielen im", "Kinder spielen"]
                answer: "im Garten"
                feedback:
                  "spielen im": "Stell um: Im Garten spielen die Kinder. Im und Garten bleiben zusammen, spielen geht nicht mit."
                hints:
                  - "Stell den Satz um und beginne anders."
                  - "Im Garten spielen die Kinder."
                  - "im Garten."
              - id: l1-f3
                type: true_false
                text: "Der Satz heißt: „Der Hund spielt im Garten.“ Ist er richtig umgestellt?"
                say: "Der Satz heißt: Der Hund spielt im Garten. Lies, wie er umgestellt wurde. Ist das richtig?"
                show: { drawn: letter-card, text: "Im Garten der Hund spielt." }
                answer: false
                hints:
                  - "Wo steht das Verb?"
                  - "Das Verb muss an zweiter Stelle stehen."
                  - "Nein. Richtig ist: Im Garten spielt der Hund."
              - id: l1-f4
                type: multiple_choice
                text: "„Mama kauft heute Brot.“ Welcher Satz ist richtig umgestellt?"
                say: "Mama kauft heute Brot. Welcher Satz ist richtig umgestellt?"
                options: ["Heute kauft Mama Brot.", "Heute Mama kauft Brot.", "Kauft heute Mama Brot."]
                answer: "Heute kauft Mama Brot."
                option_audio: false
                hints:
                  - "Es soll ein Aussagesatz bleiben."
                  - "Wo steht das Verb?"
                  - "Heute kauft Mama Brot."
              - id: l1-f5
                type: ordering
                text: "„Jonas wirft den Ball über den Zaun.“ Stell den Satz um. Beginne mit „Den Ball“."
                say: "Jonas wirft den Ball über den Zaun. Stell den Satz um und beginne mit den Ball."
                options: ["wirft", "Jonas", "über den Zaun", "Den Ball"]
                slot_count: 4
                answer: ["Den Ball", "wirft", "Jonas", "über den Zaun"]
                option_audio: false
                hints:
                  - "Den Ball stellst du nach vorn."
                  - "Was kommt an die zweite Stelle?"
                  - "Den Ball wirft Jonas über den Zaun."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "„Ich mache nach der Schule meine Hausaufgaben.“ Stell den Satz um. Beginne mit „Nach der Schule“."
                say: "Ich mache nach der Schule meine Hausaufgaben. Stell den Satz um und beginne mit nach der Schule."
                options: ["mache", "Nach der Schule", "meine Hausaufgaben", "ich"]
                slot_count: 4
                answer: ["Nach der Schule", "mache", "ich", "meine Hausaufgaben"]
                option_audio: false
                hints: ["Denk an das Verb."]
              - id: l1-s2
                type: multiple_choice
                text: "„Mein Bruder fährt mit dem Rad.“ Welche Wörter bleiben beim Umstellen zusammen?"
                say: "Mein Bruder fährt mit dem Rad. Welche Wörter bleiben beim Umstellen zusammen?"
                options: ["Bruder fährt", "mit dem Rad", "fährt mit"]
                answer: "mit dem Rad"
                hints: ["Stell um und beginne mit einem anderen Teil."]
              - id: l1-s3
                type: true_false
                text: "Der Satz heißt: „Wir gehen am Sonntag ins Kino.“ Ist er richtig umgestellt?"
                say: "Der Satz heißt: Wir gehen am Sonntag ins Kino. Lies, wie er umgestellt wurde. Ist das richtig?"
                show: { drawn: letter-card, text: "Am Sonntag gehen wir ins Kino." }
                answer: true
                hints: ["Wo steht das Verb?"]
              - id: l1-s4
                type: multiple_choice
                text: "„Die Katze schläft auf dem Sofa.“ Welcher Satz ist richtig umgestellt?"
                say: "Die Katze schläft auf dem Sofa. Welcher Satz ist richtig umgestellt?"
                options: ["Auf dem Sofa die Katze schläft.", "Auf dem Sofa schläft die Katze.", "Schläft die Katze auf dem Sofa."]
                answer: "Auf dem Sofa schläft die Katze."
                option_audio: false
                hints: ["Prüf bei jedem Satz, an welcher Stelle das Verb steht."]
              - id: l1-s5
                type: ordering
                text: "„Die Bären fressen im Herbst viele Beeren.“ Stell den Satz um. Beginne mit „Im Herbst“."
                say: "Die Bären fressen im Herbst viele Beeren. Stell den Satz um und beginne mit im Herbst."
                options: ["viele Beeren", "Im Herbst", "fressen", "die Bären"]
                slot_count: 4
                answer: ["Im Herbst", "fressen", "die Bären", "viele Beeren"]
                option_audio: false
                hints: ["Nach dem ersten Satzglied kommt das Verb."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "„Der Bauer füttert jeden Tag seine Hühner.“ Stell den Satz um. Beginne mit „Jeden Tag“."
                say: "Der Bauer füttert jeden Tag seine Hühner. Stell den Satz um und beginne mit jeden Tag."
                options: ["seine Hühner", "füttert", "Jeden Tag", "der Bauer"]
                slot_count: 4
                answer: ["Jeden Tag", "füttert", "der Bauer", "seine Hühner"]
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "„Die Ente schwimmt auf dem Teich.“ Welche Wörter bleiben beim Umstellen zusammen?"
                say: "Die Ente schwimmt auf dem Teich. Welche Wörter bleiben beim Umstellen zusammen?"
                options: ["schwimmt auf", "Ente schwimmt", "auf dem Teich"]
                answer: "auf dem Teich"
              - id: l1-n3
                type: true_false
                text: "Der Satz heißt: „Wir sehen im Zoo einen Elefanten.“ Ist er richtig umgestellt?"
                say: "Der Satz heißt: Wir sehen im Zoo einen Elefanten. Lies, wie er umgestellt wurde. Ist das richtig?"
                show: { drawn: letter-card, text: "Im Zoo wir sehen einen Elefanten." }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "„Paula malt in der Pause ein Bild.“ Welcher Satz ist richtig umgestellt?"
                say: "Paula malt in der Pause ein Bild. Welcher Satz ist richtig umgestellt?"
                options: ["In der Pause Paula malt ein Bild.", "Ein Bild Paula malt in der Pause.", "In der Pause malt Paula ein Bild."]
                answer: "In der Pause malt Paula ein Bild."
                option_audio: false
              - id: l1-n5
                type: ordering
                text: "„Oma schreibt ihrer Freundin einen Brief.“ Stell den Satz um. Beginne mit „Einen Brief“."
                say: "Oma schreibt ihrer Freundin einen Brief. Stell den Satz um und beginne mit einen Brief."
                options: ["schreibt", "ihrer Freundin", "Einen Brief", "Oma"]
                slot_count: 4
                answer: ["Einen Brief", "schreibt", "Oma", "ihrer Freundin"]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "„Wir spielen am Abend ein Spiel.“ Stell den Satz um. Beginne mit „Am Abend“."
            say: "Wir spielen am Abend ein Spiel. Stell den Satz um und beginne mit am Abend."
            options: ["ein Spiel", "spielen", "Am Abend", "wir"]
            slot_count: 4
            answer: ["Am Abend", "spielen", "wir", "ein Spiel"]
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "„Der Vogel sitzt auf dem Dach.“ Welche Wörter bleiben beim Umstellen zusammen?"
            say: "Der Vogel sitzt auf dem Dach. Welche Wörter bleiben beim Umstellen zusammen?"
            options: ["auf dem Dach", "sitzt auf", "Vogel sitzt"]
            answer: "auf dem Dach"
          - id: l1-c3
            type: true_false
            text: "Der Satz heißt: „Die Blätter fallen im Herbst.“ Ist er richtig umgestellt?"
            say: "Der Satz heißt: Die Blätter fallen im Herbst. Lies, wie er umgestellt wurde. Ist das richtig?"
            show: { drawn: letter-card, text: "Im Herbst fallen die Blätter." }
            answer: true
          - id: l1-c4
            type: ordering
            text: "„Die Kinder singen im Chor ein Lied.“ Stell den Satz um. Beginne mit „Im Chor“."
            say: "Die Kinder singen im Chor ein Lied. Stell den Satz um und beginne mit im Chor."
            options: ["ein Lied", "Im Chor", "die Kinder", "singen"]
            slot_count: 4
            answer: ["Im Chor", "singen", "die Kinder", "ein Lied"]
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "„Papa kocht in der Küche.“ Welche Wörter bleiben beim Umstellen zusammen?"
            say: "Papa kocht in der Küche. Welche Wörter bleiben beim Umstellen zusammen?"
            options: ["Papa kocht", "in der Küche", "kocht in der"]
            answer: "in der Küche"
          - id: l1-c6
            type: true_false
            text: "Der Satz heißt: „Der Zug hält am Bahnhof.“ Ist er richtig umgestellt?"
            say: "Der Satz heißt: Der Zug hält am Bahnhof. Lies, wie er umgestellt wurde. Ist das richtig?"
            show: { drawn: letter-card, text: "Am Bahnhof der Zug hält." }
            answer: false

  - n: 2
    title: { de: "Satzglieder zählen", en: "Counting the parts" }
    goal:
      de: "Zähl die Satzglieder in einem Satz und achte darauf, dass das Verb an zweiter Stelle bleibt."
      en: "Count the parts of a sentence and check that the verb stays in second place."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "„Ben isst mittags eine Suppe.“ Welcher Satz ist richtig umgestellt?"
            say: "Ben isst mittags eine Suppe. Welcher Satz ist richtig umgestellt?"
            options: ["Mittags isst Ben eine Suppe.", "Mittags Ben isst eine Suppe.", "Eine Suppe Ben isst mittags."]
            answer: "Mittags isst Ben eine Suppe."
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "„Die Maus läuft in ihr Loch.“ Welche Wörter bleiben beim Umstellen zusammen?"
            say: "Die Maus läuft in ihr Loch. Welche Wörter bleiben beim Umstellen zusammen?"
            options: ["in ihr Loch", "läuft in", "Maus läuft"]
            answer: "in ihr Loch"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Der kleine Junge | spielt | im Sand."
            say: "Wie viele Satzglieder hat ein Satz? Stell ihn um: Im Sand spielt der kleine Junge. Der kleine Junge bleibt zusammen, im Sand bleibt zusammen. Mit spielt sind es drei Satzglieder."
          - text: "Morgen | besuchen | wir | den Zoo."
            say: "Morgen besuchen wir den Zoo. Den Zoo besuchen wir morgen. Wir besuchen morgen den Zoo. Vier Satzglieder, und das Verb bleibt immer an zweiter Stelle."
          - text: "Gestern | hat | Tim | Fußball | gespielt."
            say: "Gestern hat Tim Fußball gespielt. Hat das Prädikat zwei Teile, steht der erste Teil an zweiter Stelle und der zweite Teil ganz am Ende. Hat und gespielt sind zusammen ein Satzglied, das Prädikat. Der Satz hat also vier Satzglieder."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Satzglieder hat der Satz? „Mein Opa liest die Zeitung.“"
                say: "Mein Opa liest die Zeitung. Wie viele Satzglieder hat der Satz?"
                options: ["3", "4", "5"]
                answer: "3"
                feedback:
                  "5": "Du hast die Wörter gezählt. Stell um: Die Zeitung liest mein Opa. Mein Opa und die Zeitung bleiben zusammen."
                hints:
                  - "Stell den Satz um. Welche Wörter bleiben zusammen?"
                  - "Die Zeitung liest mein Opa."
                  - "Drei: mein Opa, liest, die Zeitung."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Steht das Verb an zweiter Stelle?"
                say: "Nach dem Regen scheint die Sonne. Steht das Verb an zweiter Stelle?"
                show: { drawn: letter-card, text: "Nach dem Regen scheint die Sonne." }
                answer: true
                hints:
                  - "Zähl Satzglieder, nicht Wörter."
                  - "Nach dem Regen ist ein Satzglied."
                  - "Ja, scheint steht an zweiter Stelle."
              - id: l2-f3
                type: ordering
                text: "„Die Kinder haben im Park Verstecken gespielt.“ Stell den Satz um. Beginne mit „Im Park“."
                say: "Die Kinder haben im Park Verstecken gespielt. Stell den Satz um und beginne mit im Park."
                options: ["gespielt", "Im Park", "die Kinder", "haben", "Verstecken"]
                slot_count: 5
                answer: ["Im Park", "haben", "die Kinder", "Verstecken", "gespielt"]
                option_audio: false
                hints:
                  - "Der erste Teil des Prädikats kommt an die zweite Stelle."
                  - "Gespielt steht ganz am Ende."
                  - "Im Park haben die Kinder Verstecken gespielt."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viele Satzglieder hat der Satz? „Am Wochenende fahren wir zu Oma.“"
                say: "Am Wochenende fahren wir zu Oma. Wie viele Satzglieder hat der Satz?"
                options: ["4", "3", "6"]
                answer: "4"
                hints:
                  - "Stell den Satz um."
                  - "Wir fahren am Wochenende zu Oma."
                  - "Vier: am Wochenende, fahren, wir, zu Oma."
              - id: l2-f5
                type: multiple_choice
                text: "Wo steht das Verb in einem Aussagesatz?"
                say: "Wo steht das Verb in einem Aussagesatz?"
                options: ["an zweiter Stelle", "an erster Stelle", "immer am Ende"]
                answer: "an zweiter Stelle"
                hints:
                  - "Denk an: Heute kauft Mama Brot."
                  - "Was kommt nach heute?"
                  - "an zweiter Stelle."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Satzglieder hat der Satz? „Die alte Dame füttert die Tauben.“"
                say: "Die alte Dame füttert die Tauben. Wie viele Satzglieder hat der Satz?"
                options: ["5", "3", "4"]
                answer: "3"
                hints: ["Zähl Satzglieder, nicht Wörter."]
              - id: l2-s2
                type: true_false
                text: "Steht das Verb an zweiter Stelle?"
                say: "Im Sommer wir baden im See. Steht das Verb an zweiter Stelle?"
                show: { drawn: letter-card, text: "Im Sommer wir baden im See." }
                answer: false
                hints: ["Welches Satzglied steht an erster Stelle, welches an zweiter?"]
              - id: l2-s3
                type: ordering
                text: "„Lukas ist gestern auf einen Baum geklettert.“ Stell den Satz um. Beginne mit „Gestern“."
                say: "Lukas ist gestern auf einen Baum geklettert. Stell den Satz um und beginne mit gestern."
                options: ["auf einen Baum", "ist", "Gestern", "geklettert", "Lukas"]
                slot_count: 5
                answer: ["Gestern", "ist", "Lukas", "auf einen Baum", "geklettert"]
                option_audio: false
                hints: ["Wo stehen die zwei Teile des Prädikats?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wie viele Satzglieder hat der Satz? „Meine Schwester schenkt mir ein Buch.“"
                say: "Meine Schwester schenkt mir ein Buch. Wie viele Satzglieder hat der Satz?"
                options: ["6", "3", "4"]
                answer: "4"
                hints: ["Stell den Satz um und schau, was zusammenbleibt."]
              - id: l2-s5
                type: multiple_choice
                text: "„Die Klasse macht im Mai einen Ausflug.“ Welcher Satz ist richtig umgestellt?"
                say: "Die Klasse macht im Mai einen Ausflug. Welcher Satz ist richtig umgestellt?"
                options: ["Im Mai die Klasse macht einen Ausflug.", "Einen Ausflug macht die Klasse im Mai.", "Im Mai einen Ausflug macht die Klasse."]
                answer: "Einen Ausflug macht die Klasse im Mai."
                option_audio: false
                hints: ["Schau, ob das Verb an zweiter Stelle steht."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Satzglieder hat der Satz? „Der Hund gräbt im Garten ein Loch.“"
                say: "Der Hund gräbt im Garten ein Loch. Wie viele Satzglieder hat der Satz?"
                options: ["4", "7", "3"]
                answer: "4"
              - id: l2-n2
                type: true_false
                text: "Steht das Verb an zweiter Stelle?"
                say: "Zum Frühstück esse ich ein Brötchen. Steht das Verb an zweiter Stelle?"
                show: { drawn: letter-card, text: "Zum Frühstück esse ich ein Brötchen." }
                answer: true
              - id: l2-n3
                type: ordering
                text: "„Wir haben am Montag einen Test geschrieben.“ Stell den Satz um. Beginne mit „Am Montag“."
                say: "Wir haben am Montag einen Test geschrieben. Stell den Satz um und beginne mit am Montag."
                options: ["geschrieben", "wir", "Am Montag", "einen Test", "haben"]
                slot_count: 5
                answer: ["Am Montag", "haben", "wir", "einen Test", "geschrieben"]
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Wie viele Satzglieder hat der Satz? „Die Sonne scheint.“"
                say: "Die Sonne scheint. Wie viele Satzglieder hat der Satz?"
                options: ["2", "3", "1"]
                answer: "2"
              - id: l2-n5
                type: multiple_choice
                text: "„Der Clown zeigt den Kindern einen Trick.“ Welcher Satz ist richtig umgestellt?"
                say: "Der Clown zeigt den Kindern einen Trick. Welcher Satz ist richtig umgestellt?"
                options: ["Den Kindern der Clown zeigt einen Trick.", "Einen Trick zeigt der Clown den Kindern.", "Einen Trick der Clown den Kindern zeigt."]
                answer: "Einen Trick zeigt der Clown den Kindern."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: move
            type: ordering
            text: "„Emma besucht am Nachmittag ihren Opa.“ Stell den Satz um. Beginne mit „Am Nachmittag“."
            say: "Emma besucht am Nachmittag ihren Opa. Stell den Satz um und beginne mit am Nachmittag."
            options: ["ihren Opa", "Am Nachmittag", "Emma", "besucht"]
            slot_count: 4
            answer: ["Am Nachmittag", "besucht", "Emma", "ihren Opa"]
            option_audio: false
          - id: l2-c2
            part: find-parts
            type: multiple_choice
            text: "„Der Bäcker backt in der Nacht.“ Welche Wörter bleiben beim Umstellen zusammen?"
            say: "Der Bäcker backt in der Nacht. Welche Wörter bleiben beim Umstellen zusammen?"
            options: ["backt in", "in der Nacht", "Bäcker backt"]
            answer: "in der Nacht"
          - id: l2-c3
            part: verb-second
            type: true_false
