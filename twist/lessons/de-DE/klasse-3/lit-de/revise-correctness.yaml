# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.revise-correctness
skill: lit-de.writing.revise-correctness
curriculum: de-DE
language: de
title:
  de: Texte auf Fehler prüfen
  en: Checking a text for mistakes
summary: >
  Checking a finished text for spelling, punctuation and grammar. Lesson 1
  works through a checklist (capital at the start, capital nouns, a mark
  at the end, a verb that fits) on short sentences; lesson 2 checks on the
  computer, chooses the right suggestion of the spell checker, finds the
  mistakes it cannot see (real words in the wrong place, commas,
  Redezeichen), and ends with the skill check. Correcting a whole text of
  the child's own waits for a free text task type; here the child finds,
  chooses and fills.
metadata:
  year: klasse-3
  topic: { de: Texte überarbeiten, en: Revising writing }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [lit-de.spelling-strategies.correct-errors, lit-de.writing.revise]
  also_practises: [lit-de.spelling-strategies.correct-errors, lit-de.sentences.end-punctuation, lit-de.spelling.capital-nouns, lit-de.sentences.list-commas]
  vocabulary: { de: [prüfen, berichtigen, Checkliste, Satzschlusszeichen, Rechtschreibprüfung, Wellenlinie, Vorschlag] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: spelling, what: { de: Rechtschreibfehler und kleine Nomen finden und berichtigen, en: finding and correcting spelling mistakes and nouns without a capital } }
    - { id: grammar, what: { de: Verbformen und Satzzeichen prüfen und berichtigen, en: checking and correcting verb forms and punctuation } }
    - { id: computer, what: { de: "am Computer prüfen: den passenden Vorschlag wählen und Fehler finden, die das Programm nicht sieht", en: "checking on a computer: choosing the right suggestion and finding mistakes the program misses" } }
  misconceptions:
    - id: spelling-only
      what: Checks only the spelling of words and overlooks missing marks, small capitals and verbs that do not fit
      addressed: "lesson 1 Learn goes through a four-point checklist; every stage of lesson 1 has a punctuation gap and a verb form, l1-f5 and l1-s5 ask about a sentence whose only mistake is not a spelling one, and l1-n5 about a sentence with no mistake"
    - id: trust-computer
      what: Thinks the computer finds every mistake, so a text without red lines is correct
      addressed: "lesson 2 Learn shows a real word in the wrong place (viel for fiel); l2-f2, l2-s2, l2-n2 and l2-c4 ask whether the spell checker finds such a mistake, with feedback on l2-f3 for a suggestion that does not fit the sentence"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit der Checkliste prüfen", en: "Checking with a checklist" }
    goal:
      de: "Prüf Sätze mit einer Checkliste, Punkt für Punkt, so wie Am Sonntag spielten wir im Park."
      en: "Check sentences with a checklist, point by point, like on Sunday we played in the park."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz Wort für Wort. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Der Zug färt um acht Uhr ab." }
            spans: ["färt"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Strategie hilft bei „Zwerg“?"
            say: "Zwerg. Welche Strategie hilft dir, das Wort richtig zu schreiben?"
            options: ["Verlängern", "Ableiten", "Schwingen"]
            answer: "Verlängern"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "am Sonntag spielten wir im park"
            say: "Lies den Satz. Was glaubst du: Wie viele Fehler stecken darin?"
          - text: "1. Satzanfang groß?\n2. Nomen groß?\n3. Satzzeichen am Ende?\n4. Passt das Verb?"
            say: "Es sind drei Fehler. Mit einer Checkliste findest du sie alle. Bevor du einen Text abgibst, prüfst du ihn mit einer Checkliste. Du gehst Punkt für Punkt durch und liest dafür den Text mehrmals."
          - text: "am Sonntag spielten wir im park\n\nAm Sonntag spielten wir im Park."
            say: "Hier fehlt einiges. Das erste Wort im Satz schreibst du groß: Am. Park ist ein Nomen, also auch groß. Und am Ende fehlt der Punkt."
          - text: "Die Kinder rennt zum Bus.\n\nDie Kinder rennen zum Bus."
            say: "Prüfe auch das Verb. Wer rennt? Die Kinder, also viele. Darum heißt es: Die Kinder rennen."
          - text: "Wusstest du? Der erste Duden kam 1880 heraus. Darin standen etwa 27 000 Wörter."
            say: "Wusstest du? Der erste Duden kam achtzehnhundertachtzig heraus. Darin standen etwa siebenundzwanzigtausend Wörter. Konrad Duden wollte, dass alle die Wörter gleich schreiben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Ein Nomen ist kleingeschrieben. Tippe es an."
                say: "Prüfe die Nomen. Ein Nomen ist kleingeschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Im Sommer essen wir viel eis." }
                spans: ["eis"]
                hints:
                  - "Mach bei jedem Wort die Artikelprobe."
                  - "Sommer ist schon groß. Vor welches andere Wort passt der, die oder das?"
                  - "das Eis. Eis ist ein Nomen."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welches Satzzeichen fehlt am Ende?"
                say: "Lies den Satz. Welches Satzzeichen fehlt am Ende?"
                frame: "Wann beginnt das Fußballspiel_"
                options: ["?", ".", "!"]
                answer: ["?"]
                hints:
                  - "Ist das eine Aussage, eine Frage oder ein Ausruf?"
                  - "Der Satz beginnt mit Wann. Damit fragt man."
                  - "Ein Fragezeichen."
              - id: l1-f3
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Prüfe das Verb. Welche Form passt?"
                frame: "Meine Freunde _ heute zu mir."
                options: ["kommen", "kommt", "kommst"]
                answer: ["kommen"]
                feedback:
                  "kommt": "Wer kommt? Meine Freunde. Das sind mehrere."
                hints:
                  - "Frag: Wer kommt?"
                  - "Meine Freunde sind mehrere. Sie ..."
                  - "Meine Freunde kommen."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Satz ist ganz richtig geschrieben?"
                say: "Prüfe jeden Satz mit der Checkliste. Welcher ist ganz richtig?"
                options: ["Mein Opa hat einen Garten.", "mein Opa hat einen Garten.", "Mein Opa hat einen garten."]
                answer: "Mein Opa hat einen Garten."
                option_audio: false
                hints:
                  - "Prüfe den Satzanfang und die Nomen."
                  - "Opa und Garten sind Nomen. Das erste Wort im Satz ist auch groß."
                  - "Mein Opa hat einen Garten."
              - id: l1-f5
                type: true_false
                text: "Ist der Satz richtig?"
                say: "Prüfe den Satz mit der Checkliste. Ist alles richtig?"
                show: { drawn: letter-card, text: "Der Hund bellen laut." }
                answer: false
                hints:
                  - "Alle Wörter sind richtig geschrieben. Prüfe Punkt 4: das Verb."
                  - "Wer bellt? Der Hund. Das ist einer."
                  - "Nein. Richtig ist: Der Hund bellt laut."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Ein Nomen ist kleingeschrieben. Tippe es an."
                say: "Prüfe die Nomen. Ein Nomen ist kleingeschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Lisa trägt eine rote mütze." }
                spans: ["mütze"]
                hints: ["Mach die Artikelprobe: der, die oder das?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Satzzeichen fehlt am Ende?"
                say: "Lies den Satz. Welches Satzzeichen fehlt am Ende?"
                frame: "Pass auf, die Herdplatte ist heiß_"
                options: ["!", "?", ","]
                answer: ["!"]
                hints: ["Hier warnt jemand. Das ist ein Ausruf."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Prüfe das Verb. Welche Form passt?"
                frame: "Am Abend _ ich ein Buch."
                options: ["lese", "liest", "lesen"]
                answer: ["lese"]
                hints: ["Wer liest? Ich."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Satz ist ganz richtig geschrieben?"
                say: "Prüfe jeden Satz mit der Checkliste. Welcher ist ganz richtig?"
                options: ["Im Herbst fallen die Blätter.", "Im Herbst fallen die Blätter", "im Herbst fallen die blätter."]
                answer: "Im Herbst fallen die Blätter."
                option_audio: false
                hints: ["Schau auch ans Ende des Satzes."]
              - id: l1-s5
                type: true_false
                text: "Ist der Satz richtig?"
                say: "Prüfe den Satz mit der Checkliste. Ist alles richtig?"
                show: { drawn: letter-card, text: "Wir fahren morgen zu Oma" }
                answer: false
                hints: ["Geh alle vier Punkte durch. Was steht am Ende?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Ein Nomen ist kleingeschrieben. Tippe es an."
                say: "Prüfe die Nomen. Ein Nomen ist kleingeschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Nach der Schule füttert Ben seine katze." }
                spans: ["katze"]
              - id: l1-n2
                type: fill_in_blank
                text: "Welches Satzzeichen fehlt am Ende?"
                say: "Lies den Satz. Welches Satzzeichen fehlt am Ende?"
                frame: "Unser Lehrer heißt Herr Wolf_"
                options: [".", "?", "!"]
                answer: ["."]
              - id: l1-n3
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Prüfe das Verb. Welche Form passt?"
                frame: "Du _ aber schnell!"
                options: ["läufst", "laufen", "läuft"]
                answer: ["läufst"]
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Satz ist ganz richtig geschrieben?"
                say: "Prüfe jeden Satz mit der Checkliste. Welcher ist ganz richtig?"
                options: ["Hast du meinen Schal gesehen?", "Hast du meinen Schal gesehen.", "hast du meinen schal gesehen?"]
                answer: "Hast du meinen Schal gesehen?"
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Ist der Satz richtig?"
                say: "Prüfe den Satz mit der Checkliste. Ist alles richtig?"
                show: { drawn: letter-card, text: "Die Vögel singen im Baum." }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Ein Nomen ist kleingeschrieben. Tippe es an."
            say: "Prüfe die Nomen. Ein Nomen ist kleingeschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Die Kinder bauen eine hütte im Wald." }
            spans: ["hütte"]
          - id: l1-c2
            type: fill_in_blank
            text: "Welches Verb passt?"
            say: "Prüfe das Verb. Welche Form passt?"
            frame: "Mama und Papa _ im Garten."
            options: ["arbeiten", "arbeitet", "arbeite"]
            answer: ["arbeiten"]
          - id: l1-c3
            type: fill_in_blank
            text: "Welches Satzzeichen fehlt am Ende?"
            say: "Lies den Satz. Welches Satzzeichen fehlt am Ende?"
            frame: "Hast du heute Zeit_"
            options: ["?", ".", "!"]
            answer: ["?"]
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Satz ist ganz richtig geschrieben?"
            say: "Prüfe jeden Satz mit der Checkliste. Welcher ist ganz richtig?"
            options: ["Der Bäcker backt frische Brötchen.", "der Bäcker backt frische Brötchen.", "Der Bäcker backt frische brötchen."]
            answer: "Der Bäcker backt frische Brötchen."
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Ist der Satz richtig?"
            say: "Prüfe den Satz mit der Checkliste. Ist alles richtig?"
            show: { drawn: letter-card, text: "Die Kinder lacht über den Witz." }
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Ein Nomen ist kleingeschrieben. Tippe es an."
            say: "Prüfe die Nomen. Ein Nomen ist kleingeschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Unsere Lehrerin liest eine spannende geschichte vor." }
            spans: ["geschichte"]

  - n: 2
    title: { de: "Am Computer prüfen", en: "Checking on the computer" }
    goal:
      de: "Prüf deinen Text am Computer und finde auch Fehler ohne rote Linie, so wie viel statt fiel."
      en: "Check your text on the computer and find mistakes without a red line too, like viel instead of fiel."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ist der Satz richtig?"
            say: "Prüfe den Satz mit der Checkliste. Ist alles richtig?"
            show: { drawn: letter-card, text: "Die Sonne scheint heute." }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Ein Nomen ist kleingeschrieben. Tippe es an."
            say: "Prüfe die Nomen. Ein Nomen ist kleingeschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Ich trinke ein Glas milch." }
            spans: ["milch"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wir gehen in die Schuhle."
            say: "Du tippst diesen Satz am Computer. Was glaubst du: Merkt der Computer, dass hier etwas falsch ist?"
          - text: "Wir gehen in die Schuhle.\nVorschläge: Schule, Schuhe, Schulen"
            say: "Ja, hier merkt er es. Am Computer hilft dir die Rechtschreibprüfung. Ein Wort, das sie nicht kennt, bekommt eine rote Wellenlinie. Dann zeigt sie dir Vorschläge. Du wählst den Vorschlag, der in deinen Satz passt: Schule. Der erste Vorschlag ist nicht immer der richtige."
          - text: "Der Apfel viel vom Baum."
            say: "Aber Vorsicht: Das Programm kennt das Wort viel. Darum bekommt es keine rote Linie, obwohl es hier falsch ist. Richtig ist: Der Apfel fiel vom Baum. Fiel kommt von fallen. Solche Fehler findest nur du."
          - text: "Ich kaufe Brot, Butter und Käse.\nLea ruft: „Komm schnell!“"
            say: "Auch Kommas und Redezeichen prüft das Programm oft nicht. Lies deinen Text darum immer noch einmal selbst mit der Checkliste."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ich habe ein neues Fahrad.\n\nDas Wort Fahrad hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                say: "Das Wort Fahrad hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                options: ["Fahrrad", "Fahrt", "Fahrer"]
                answer: "Fahrrad"
                option_audio: false
                hints:
                  - "Lies den Satz mit jedem Vorschlag."
                  - "Was ist neu? Ein Ding, auf dem man fährt."
                  - "Fahrrad, aus fahren und Rad."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Unser Rat hat einen Platten.\nGemeint ist das Fahrrad.\n\nFindet die Rechtschreibprüfung diesen Fehler?"
                say: "Lies den Satz. Gemeint ist das Fahrrad. Findet die Rechtschreibprüfung diesen Fehler?"
                answer: false
                hints:
                  - "Gibt es das Wort Rat?"
                  - "Ein Rat ist ein Tipp. Das Programm kennt das Wort und unterstreicht es nicht."
                  - "Nein. Den Fehler musst du selbst finden. Richtig ist Rad, denn es heißt die Räder."
              - id: l2-f3
                type: multiple_choice
                text: "Morgen gehen wir in den Zoh.\n\nDas Wort Zoh hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                say: "Das Wort Zoh hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                options: ["Zoo", "Zoff", "Zoll"]
                answer: "Zoo"
                option_audio: false
                feedback:
                  "Zoff": "Zoff heißt Streit. In den Streit gehen? Das passt nicht in den Satz."
                  "Zoll": "Den Zoll gibt es an der Grenze. Wohin geht ihr, um Tiere zu sehen?"
                hints:
                  - "Lies den Satz mit jedem Vorschlag."
                  - "Wohin geht man, um Tiere zu sehen?"
                  - "Zoo, mit zwei o."
              - id: l2-f4
                type: highlight_in_text
                text: "Kein Wort hat eine rote Linie. Trotzdem ist eins falsch. Tippe es an."
                say: "Das Programm hat nichts unterstrichen. Trotzdem ist ein Wort falsch. Tippe es an."
                show: { drawn: letter-card, text: "Im Mehr schwimmen viele Fische." }
                spans: ["Mehr"]
                hints:
                  - "Lies Wort für Wort und denk an die Bedeutung."
                  - "Wo schwimmen Fische? Mehr heißt: noch dazu."
                  - "Mehr. Richtig ist Meer."
              - id: l2-f5
                type: fill_in_blank
                text: "Setze die Kommas."
                say: "Das Programm prüft die Kommas nicht. Setze sie selbst."
                frame: "Ich packe Socken_ Hosen_ Pullis und Mützen ein."
                options: [",", ".", "!"]
                answer: [",", ","]
                hints:
                  - "Hier werden Dinge aufgezählt."
                  - "Zwischen die Dinge einer Aufzählung kommt ein Komma, aber nicht vor „und“."
                  - "Socken, Hosen, Pullis und Mützen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die Katze schläft auf dem Sofer.\n\nDas Wort Sofer hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                say: "Das Wort Sofer hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                options: ["Sofa", "Sofas", "Sofort"]
                answer: "Sofa"
                option_audio: false
                hints: ["Lies den Satz mit jedem Vorschlag. Worauf schläft die Katze?"]
              - id: l2-s2
                type: true_false
                text: "Ich habe viel Spaß beim Malen.\n\nIst hier ein Fehler, den das Programm nicht findet?"
                say: "Lies den Satz genau. Ist hier ein Fehler, den das Programm nicht findet?"
                answer: false
                hints: ["Viel oder fiel? Fiel kommt von fallen. Hier ist eine Menge Spaß gemeint."]
              - id: l2-s3
                type: highlight_in_text
                text: "Kein Wort hat eine rote Linie. Trotzdem ist eins falsch. Tippe es an."
                say: "Das Programm hat nichts unterstrichen. Trotzdem ist ein Wort falsch. Tippe es an."
                show: { drawn: letter-card, text: "Der Ball viel ins Wasser." }
                spans: ["viel"]
                hints: ["Welches Wort gehört zu fallen?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wo stehen die Redezeichen richtig?"
                say: "Das Programm prüft die Redezeichen nicht. Prüfe sie selbst. Wo stehen sie richtig?"
                options: ["Tim fragt: „Spielst du mit?“", "Tim fragt: „Spielst du mit?", "„Tim fragt: Spielst du mit?“"]
                answer: "Tim fragt: „Spielst du mit?“"
                option_audio: false
                hints: ["Die Redezeichen stehen nur um das, was Tim sagt: unten davor, oben danach."]
              - id: l2-s5
                type: true_false
                text: "Das Programm hat keine rote Linie gezeigt. Ist der Text dann sicher richtig?"
                say: "Das Programm hat keine rote Linie gezeigt. Ist der Text dann sicher richtig?"
                answer: false
                hints: ["Denk an den Apfel: viel statt fiel. Das Programm hat den Fehler nicht gefunden."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mein Bruder spielt Gittare.\n\nDas Wort Gittare hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                say: "Das Wort Gittare hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
                options: ["Gitarre", "Gitter", "Gitarren"]
                answer: "Gitarre"
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Ich male ein Bilt für Oma.\n\nFindet die Rechtschreibprüfung diesen Fehler?"
                say: "Lies den Satz. Findet die Rechtschreibprüfung diesen Fehler?"
                answer: true
              - id: l2-n3
                type: highlight_in_text
                text: "Kein Wort hat eine rote Linie. Trotzdem ist eins falsch. Tippe es an."
                say: "Das Programm hat nichts unterstrichen. Trotzdem ist ein Wort falsch. Tippe es an."
                show: { drawn: letter-card, text: "Wir warten seid einer Stunde auf den Bus." }
                spans: ["seid"]
              - id: l2-n4
                type: fill_in_blank
                text: "Setze die Kommas."
                say: "Das Programm prüft die Kommas nicht. Setze sie selbst."
                frame: "Im Zoo sahen wir Affen_ Löwen_ Zebras und Giraffen."
                options: [",", ".", "?"]
                answer: [",", ","]
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Satz ist ganz richtig?"
                say: "Prüfe jeden Satz genau. Welcher ist ganz richtig?"
                options: ["Mia ruft: „Ich bin schon da!“", "Mia ruft: Ich bin schon da!", "mia ruft: „Ich bin schon da!“"]
                answer: "Mia ruft: „Ich bin schon da!“"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: spelling
            type: highlight_in_text
            text: "Tippe auf das Wort mit dem Fehler."
            say: "Lies den Satz. Ein Wort ist falsch. Tippe es an."
            show: { drawn: letter-card, text: "Am Wochenende besuchen wir die oma." }
            spans: ["oma"]
          - id: l2-c2
            part: grammar
            type: fill_in_blank
            text: "Welches Wort fehlt?"
            say: "Lies den Satz. Welches Wort passt in die Lücke?"
            frame: "Die Schüler _ ein Lied."
            options: ["singen", "singt", "singst"]
            answer: ["singen"]
          - id: l2-c3
            part: computer
            type: multiple_choice
            text: "Heute regnet es. Ich nehme meinen Regenschrim mit.\n\nDas Wort Regenschrim hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
            say: "Das Wort Regenschrim hat eine rote Wellenlinie. Welchen Vorschlag wählst du?"
            options: ["Regenschirm", "Regenschirme", "Regenwurm"]
            answer: "Regenschirm"
            option_audio: false
          - id: l2-c4
            part: computer
            type: highlight_in_text
            text: "Das Programm hat nichts unterstrichen. Welches Wort ist trotzdem falsch?"
            say: "Lies genau. Welches Wort ist trotzdem falsch? Tippe es an."
            show: { drawn: letter-card, text: "Am Samstag fahren wir in die Statt." }
            spans: ["Statt"]
          - id: l2-c5
            part: grammar
