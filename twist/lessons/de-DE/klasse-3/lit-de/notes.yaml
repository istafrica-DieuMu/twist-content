# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.notes
skill: lit-de.comprehension.notes
curriculum: de-DE
language: de
title:
  de: Stichwörter notieren
  en: Taking notes
summary: >
  Noting key points from an information text and retelling it from the
  notes. Lesson 1 finds the words worth noting in a sentence and tells a
  Stichwort from a whole sentence; lesson 2 fills a note sheet under
  headings, puts notes in order, retells a text from its notes, and ends
  with the skill check. The short Sachtexte about animals and plants are
  written for Twist and use well-established facts. Writing notes freely
  waits for a free text task type; here the child chooses and places notes.
metadata:
  year: klasse-3
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.comprehension.key-words]
  also_practises: [lit-de.comprehension.key-words, lit-de.comprehension.find-information]
  vocabulary: { de: [Stichwort, Notiz, Sachtext, Schlüsselwort, wiedergeben, Überschrift] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: key-words, what: { de: die wichtigen Wörter für eine Notiz finden, en: finding the words worth noting } }
    - { id: note-sheet, what: { de: Stichwörter unter Überschriften ordnen, en: placing notes under headings } }
    - { id: retell, what: { de: "den Inhalt mit Stichwörtern wiedergeben, auch in der richtigen Reihenfolge", en: "retelling the content from notes, in the right order" } }
  misconceptions:
    - id: copy-sentence
      what: Copies whole sentences instead of noting a few key words
      addressed: "lesson 1 Learn shrinks a sentence to Stichwörter; l1-f1, l1-s1, l1-n1 and l2-c1 offer the whole sentence as a distractor, with feedback on l1-f1"
    - id: note-small-words
      what: Notes small words (und, sie, im) or details that do not answer the question
      addressed: "highlight tasks (l1-f2, l1-s3, l1-n3, l2-c2) find only the words that carry the fact; l1-f4 and l1-n4 ask which note is not useful"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was schreibe ich auf?", en: "What do I write down?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Die Frage ist: Wo wohnen Eichhörnchen?\n\nWelches Schlüsselwort suchst du im Text?"
            say: "Lies die Frage. Welches Schlüsselwort suchst du im Text?"
            options: ["wohnen", "sind", "auch"]
            answer: "wohnen"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Eichhörnchen wohnen in einem Nest hoch im Baum. Das Nest heißt Kobel.\n\nWie heißt das Nest?"
            say: "Lies den Text. Wie heißt das Nest der Eichhörnchen?"
            options: ["Kobel", "Baum", "Höhle"]
            answer: "Kobel"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Igel schlafen am Tag und suchen in der Nacht nach Futter."
            say: "Wenn du dir einen Sachtext merken willst, schreibst du nicht alles ab. Du notierst nur die wichtigsten Wörter. Das sind Stichwörter."
          - text: "Igel: tagsüber schlafen, nachts Futter suchen"
            say: "Aus dem ganzen Satz werden wenige Wörter: tagsüber schlafen, nachts Futter suchen. Kleine Wörter wie und, am oder in lässt du weg."
          - text: "Igel\nWohnort: Garten, Hecke\nFutter: Käfer, Würmer, Schnecken\nWinter: Winterschlaf"
            say: "Ordne deine Stichwörter unter Überschriften. Mit diesem Zettel kannst du den Text später in eigenen Worten erzählen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Maulwürfe graben mit ihren breiten Vorderpfoten lange Gänge unter der Erde.\n\nWelche Notiz ist am besten?"
                say: "Lies den Satz. Welche Notiz ist am besten?"
                options: ["gräbt Gänge mit Vorderpfoten", "Maulwürfe graben mit ihren breiten Vorderpfoten lange Gänge unter der Erde", "mit ihren unter der"]
                answer: "gräbt Gänge mit Vorderpfoten"
                feedback:
                  "Maulwürfe graben mit ihren breiten Vorderpfoten lange Gänge unter der Erde": "Das ist der ganze Satz. Eine Notiz hat nur die wichtigsten Wörter."
                hints:
                  - "Eine Notiz ist kurz. Sie hat nur die wichtigen Wörter."
                  - "Was macht der Maulwurf, und womit?"
                  - "gräbt Gänge mit Vorderpfoten."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Was fressen Igel? Tippe auf die Wörter, die du notierst."
                say: "Lies den Satz. Was fressen Igel? Tippe nur auf die Wörter, die du dir notierst."
                show: { drawn: letter-card, text: "Igel fressen am liebsten Käfer, Würmer und Schnecken." }
                spans: ["Käfer,", "Würmer", "Schnecken."]
                hints:
                  - "Frag: Was fressen sie? Kleine Wörter lässt du weg."
                  - "Es sind drei Tiere."
                  - "Käfer, Würmer, Schnecken."
              - id: l1-f3
                type: multiple_choice
                text: "Bienen sammeln Nektar und Pollen von den Blüten. Aus dem Nektar machen sie Honig.\n\nWelche Notiz passt zum Text?"
                say: "Lies den Text. Welche Notiz passt?"
                options: ["sammeln Nektar, Pollen; aus Nektar wird Honig", "sammeln Honig von Blüten", "machen Pollen aus Honig"]
                answer: "sammeln Nektar, Pollen; aus Nektar wird Honig"
                hints:
                  - "Lies jede Notiz und vergleiche sie mit dem Text."
                  - "Was sammeln Bienen, und was machen sie daraus?"
                  - "sammeln Nektar, Pollen; aus Nektar wird Honig."
              - id: l1-f4
                type: multiple_choice
                text: "Text: Fledermäuse jagen nachts Insekten. Am Tag schlafen sie kopfüber.\nFrage: Wann und was jagen Fledermäuse?\n\nWelche Notiz brauchst du für die Frage nicht?"
                say: "Lies den Text und die Frage. Welche Notiz brauchst du für die Frage nicht?"
                options: ["kopfüber schlafen", "nachts", "Insekten"]
                answer: "kopfüber schlafen"
                hints:
                  - "Die Frage ist: Wann jagen sie, und was?"
                  - "Wie sie schlafen, sagt nichts über die Jagd."
                  - "kopfüber schlafen brauchst du nicht."
              - id: l1-f5
                type: true_false
                text: "Text: Der Löwenzahn blüht im Frühling gelb.\nNotiz: Löwenzahn, Frühling, gelbe Blüte\n\nPasst die Notiz zum Text?"
                say: "Lies den Text und die Notiz. Passt die Notiz zum Text?"
                answer: true
                hints:
                  - "Vergleiche Wort für Wort."
                  - "Wann blüht er, und welche Farbe hat er?"
                  - "Ja, die Notiz passt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Kaulquappen leben im Wasser und atmen mit Kiemen.\n\nWelche Notiz ist am besten?"
                say: "Lies den Satz. Welche Notiz ist am besten?"
                options: ["im Wasser, Kiemen", "Kaulquappen leben im Wasser und atmen mit Kiemen", "und mit leben"]
                answer: "im Wasser, Kiemen"
                hints: ["Eine Notiz ist kürzer als der Satz."]
              - id: l1-s2
                type: true_false
                text: "Text: Eichhörnchen vergraben im Herbst Nüsse für den Winter.\nNotiz: Eichhörnchen, Winterschlaf\n\nPasst die Notiz zum Text?"
                say: "Lies den Text und die Notiz. Passt die Notiz zum Text?"
                answer: false
                hints: ["Steht Winterschlaf im Text?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Wo leben Maulwürfe? Tippe auf die Wörter, die du notierst."
                say: "Lies den Satz. Wo leben Maulwürfe? Tippe nur auf die Wörter, die du dir notierst."
                show: { drawn: letter-card, text: "Der Maulwurf lebt fast immer unter der Erde." }
                spans: ["unter", "Erde."]
                hints: ["Frag: Wo? Lass kleine Wörter wie der weg."]
              - id: l1-s4
                type: multiple_choice
                text: "Jedes Bienenvolk hat eine Königin. Sie legt die Eier.\n\nWelche Notiz passt zum Text?"
                say: "Lies den Text. Welche Notiz passt?"
                options: ["Königin legt Eier", "Königin sammelt Honig", "viele Königinnen"]
                answer: "Königin legt Eier"
                hints: ["Was macht die Königin?"]
              - id: l1-s5
                type: multiple_choice
                text: "Text: Der Maulwurf sieht sehr schlecht. Er riecht und fühlt aber sehr gut.\nFrage: Wie findet der Maulwurf sein Futter?\n\nWelche Notiz brauchst du für die Frage?"
                say: "Lies den Text und die Frage. Welche Notiz brauchst du für die Frage?"
                options: ["riecht und fühlt gut", "Maulwurf", "aber"]
                answer: "riecht und fühlt gut"
                hints: ["Wenn er schlecht sieht, womit findet er dann sein Futter?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Wind trägt die Samen des Löwenzahns mit kleinen Schirmchen weit weg.\n\nWelche Notiz ist am besten?"
                say: "Lies den Satz. Welche Notiz ist am besten?"
                options: ["Wind trägt Samen weit weg", "Der Wind trägt die Samen des Löwenzahns mit kleinen Schirmchen weit weg", "die des mit"]
                answer: "Wind trägt Samen weit weg"
              - id: l1-n2
                type: true_false
                text: "Text: Fledermäuse sind Säugetiere, die fliegen können.\nNotiz: Fledermaus, Vogel\n\nPasst die Notiz zum Text?"
                say: "Lies den Text und die Notiz. Passt die Notiz zum Text?"
                answer: false
              - id: l1-n3
                type: highlight_in_text
                text: "Was fressen Eichhörnchen? Tippe auf die Wörter, die du notierst."
                say: "Lies den Satz. Was fressen Eichhörnchen? Tippe nur auf die Wörter, die du dir notierst."
                show: { drawn: letter-card, text: "Eichhörnchen fressen gern Nüsse, Samen und Beeren." }
                spans: ["Nüsse,", "Samen", "Beeren."]
              - id: l1-n4
                type: multiple_choice
                text: "Text: Frösche legen ihren Laich ins Wasser. Viele Frösche sind grün.\nFrage: Wo legen Frösche ihren Laich ab?\n\nWelche Notiz brauchst du für die Frage nicht?"
                say: "Lies den Text und die Frage. Welche Notiz brauchst du für die Frage nicht?"
                options: ["oft grün", "Laich", "ins Wasser"]
                answer: "oft grün"
              - id: l1-n5
                type: multiple_choice
                text: "Igel halten von November bis März Winterschlaf.\n\nWelche Notiz passt zum Text?"
                say: "Lies den Text. Welche Notiz passt?"
                options: ["Winterschlaf: November bis März", "Winterschlaf: März bis November", "Sommerschlaf im November"]
                answer: "Winterschlaf: November bis März"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Bienen tanzen, um den anderen Bienen zu zeigen, wo es Blüten gibt.\n\nWelche Notiz ist am besten?"
            say: "Lies den Satz. Welche Notiz ist am besten?"
            options: ["Tanz zeigt Weg zu Blüten", "Bienen tanzen, um den anderen Bienen zu zeigen, wo es Blüten gibt", "um den wo es"]
            answer: "Tanz zeigt Weg zu Blüten"
          - id: l1-c2
            type: highlight_in_text
            text: "Wann jagen Fledermäuse? Tippe auf das Wort, das du notierst."
            say: "Lies den Satz. Wann jagen Fledermäuse? Tippe nur auf das Wort, das du dir notierst."
            show: { drawn: letter-card, text: "Fledermäuse fliegen erst nachts los und jagen Mücken." }
            spans: ["nachts"]
          - id: l1-c3
            type: true_false
            text: "Text: Der Maulwurf frisst vor allem Regenwürmer.\nNotiz: Futter: Regenwürmer\n\nPasst die Notiz zum Text?"
            say: "Lies den Text und die Notiz. Passt die Notiz zum Text?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Störche bauen ihr großes Nest oft auf Dächern oder hohen Masten.\n\nWelche Notiz ist am besten?"
            say: "Lies den Satz. Welche Notiz ist am besten?"
            options: ["Nest auf Dächern, Masten", "Nest unter der Erde", "ihr oft auf oder"]
            answer: "Nest auf Dächern, Masten"
          - id: l1-c5
            type: highlight_in_text
            text: "Wo überwintern Kröten? Tippe auf die Wörter, die du notierst."
            say: "Lies den Satz. Wo überwintern Kröten? Tippe nur auf die Wörter, die du dir notierst."
            show: { drawn: letter-card, text: "Kröten überwintern im Boden oder unter Laubhaufen." }
            spans: ["Boden", "Laubhaufen"]
          - id: l1-c6
            type: multiple_choice
            text: "Text: Biber haben einen flachen Schwanz. Ihre Burgen bauen sie aus Ästen und Schlamm.\nFrage: Woraus bauen Biber ihre Burgen?\n\nWelche Notiz brauchst du für die Frage nicht?"
            say: "Lies den Text und die Frage. Welche Notiz brauchst du für die Frage nicht?"
            options: ["flacher Schwanz", "Äste", "Schlamm"]
            answer: "flacher Schwanz"

  - n: 2
    title: { de: "Mit Notizen erzählen", en: "Retelling from notes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Eichhörnchen bauen ihr Nest aus Zweigen und Moos.\n\nWelche Notiz ist am besten?"
            say: "Lies den Satz. Welche Notiz ist am besten?"
            options: ["Nest: Zweige, Moos", "Eichhörnchen bauen ihr Nest aus Zweigen und Moos", "ihr aus und"]
            answer: "Nest: Zweige, Moos"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Text: Kaulquappen schlüpfen aus dem Laich.\nNotiz: Kaulquappen schlüpfen aus Laich\n\nPasst die Notiz zum Text?"
            say: "Lies den Text und die Notiz. Passt die Notiz zum Text?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Maulwurf\nDer Maulwurf lebt unter der Erde. Mit seinen breiten Vorderpfoten gräbt er lange Gänge. Er sieht sehr schlecht, aber er riecht und fühlt sehr gut. Er frisst vor allem Regenwürmer."
            say: "Hier ist ein kurzer Sachtext über den Maulwurf. Lies ihn einmal ganz."
          - text: "Wohnort: unter der Erde\nKörper: breite Vorderpfoten, sieht schlecht, riecht gut\nFutter: Regenwürmer"
            say: "Jetzt sortierst du deine Stichwörter auf einen Zettel mit Überschriften: Wohnort, Körper, Futter."
          - text: "Der Maulwurf wohnt unter der Erde. Er hat breite Vorderpfoten. Er sieht schlecht, aber er riecht gut. Am liebsten frisst er Regenwürmer."
            say: "Mit dem Zettel erzählst du in eigenen Worten, was im Text steht. Du brauchst den Text dafür nicht mehr."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Die Fledermaus\nFledermäuse schlafen am Tag in Höhlen oder auf Dachböden. Nachts jagen sie Insekten.\n\nFülle den Notizzettel aus."
                say: "Lies den Text. Fülle den Notizzettel aus."
                frame: "Schlafplatz: _   Futter: _"
                options: ["Höhlen, Dachböden", "Insekten", "Nüsse", "Wasser"]
                answer: ["Höhlen, Dachböden", "Insekten"]
                hints:
                  - "Wo schlafen sie? Was jagen sie?"
                  - "Der Schlafplatz steht im ersten Satz."
                  - "Schlafplatz: Höhlen, Dachböden. Futter: Insekten."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Vom Laich zum Frosch: Leg die Notizen in die richtige Reihenfolge."
                say: "Leg die Notizen in die Reihenfolge, wie aus dem Laich ein Frosch wird."
                options: ["Kaulquappen schlüpfen", "Laich im Wasser", "kleiner Frosch", "Beine wachsen"]
                slot_count: 4
                answer: ["Laich im Wasser", "Kaulquappen schlüpfen", "Beine wachsen", "kleiner Frosch"]
                hints:
                  - "Was ist ganz am Anfang?"
                  - "Aus dem Laich schlüpfen zuerst die Kaulquappen."
                  - "Laich, Kaulquappen, Beine, kleiner Frosch."
              - id: l2-f3
                type: multiple_choice
                text: "Notizen:\nIgel: Garten, Hecke\nnachts aktiv\nfrisst Käfer, Schnecken\n\nWelcher Satz gibt die Notizen richtig wieder?"
                say: "Lies die Notizen. Welcher Satz gibt sie richtig wieder?"
                options: ["Igel leben in Gärten und Hecken. Sie sind nachts unterwegs und fressen Käfer und Schnecken.", "Igel leben im Wasser. Sie sind am Tag unterwegs und fressen Käfer.", "Igel fressen Gärten und Hecken in der Nacht."]
                answer: "Igel leben in Gärten und Hecken. Sie sind nachts unterwegs und fressen Käfer und Schnecken."
                option_audio: false
                hints:
                  - "Prüfe jede Notiz: Garten, nachts, Käfer."
                  - "Stimmt in der zweiten Antwort der Ort? Ergibt die dritte Antwort Sinn?"
                  - "Die erste Antwort passt zu allen Notizen."
              - id: l2-f4
                type: sorting
                text: "Bienen leben in einem Volk mit einer Königin. Die Arbeiterinnen sammeln Nektar und Pollen. Aus Nektar machen sie Honig.\n\nUnter welche Überschrift gehört jede Notiz?"
                say: "Lies den Text. Unter welche Überschrift gehört jede Notiz?"
                bins:
                  - { id: life, show: { text: "Zusammenleben" }, say: "Zusammenleben" }
                  - { id: food, show: { text: "Nahrung" }, say: "Nahrung" }
                options:
                  - { text: "Volk", bin: life }
                  - { text: "Königin", bin: life }
                  - { text: "Nektar", bin: food }
                  - { text: "Pollen", bin: food }
                hints:
                  - "Was gehört zum Leben in der Gruppe, was zum Futter?"
                  - "Nektar und Pollen sammeln die Bienen als Nahrung."
                  - "Volk und Königin: Zusammenleben. Nektar und Pollen: Nahrung."
              - id: l2-f5
                type: true_false
                text: "Notizen: Löwenzahn, gelb, Pusteblume, Samen fliegen\n\nTom erzählt: „Der Löwenzahn hat eine gelbe Blüte. Später wird er zur Pusteblume, und die Samen fliegen weg.“\n\nPasst Toms Erzählung zu den Notizen?"
                say: "Lies die Notizen und was Tom erzählt. Passt seine Erzählung zu den Notizen?"
                answer: true
                hints:
                  - "Findest du jede Notiz in Toms Sätzen?"
                  - "gelb, Pusteblume, Samen fliegen: Sind alle drin?"
                  - "Ja, es passt."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Das Eichhörnchen\nEichhörnchen wohnen in einem Kobel hoch im Baum. Sie fressen Nüsse und Samen.\n\nFülle den Notizzettel aus."
                say: "Lies den Text. Fülle den Notizzettel aus."
                frame: "Wohnort: _   Futter: _"
                options: ["Kobel im Baum", "Nüsse, Samen", "unter der Erde", "Insekten"]
                answer: ["Kobel im Baum", "Nüsse, Samen"]
                hints: ["Wo wohnen sie? Was fressen sie?"]
              - id: l2-s2
                type: ordering
                text: "Vom Löwenzahn zur Pusteblume: Leg die Notizen in die richtige Reihenfolge."
                say: "Leg die Notizen in die richtige Reihenfolge: vom Löwenzahn zur Pusteblume."
                options: ["Samen fliegen weg", "gelbe Blüte", "Pusteblume"]
                slot_count: 3
                answer: ["gelbe Blüte", "Pusteblume", "Samen fliegen weg"]
                hints: ["Zuerst blüht der Löwenzahn."]
              - id: l2-s3
                type: multiple_choice
                text: "Notizen:\nMaulwurf: unter der Erde\nsieht schlecht\nfrisst Regenwürmer\n\nWelcher Satz gibt die Notizen richtig wieder?"
                say: "Lies die Notizen. Welcher Satz gibt sie richtig wieder?"
                options: ["Der Maulwurf lebt unter der Erde. Er sieht schlecht und frisst Regenwürmer.", "Der Maulwurf lebt unter der Erde. Er sieht sehr gut und frisst Nüsse.", "Die Regenwürmer leben unter dem Maulwurf."]
                answer: "Der Maulwurf lebt unter der Erde. Er sieht schlecht und frisst Regenwürmer."
                option_audio: false
                hints: ["Prüfe jede Notiz in jedem Satz."]
              - id: l2-s4
                type: sorting
                text: "Fledermäuse jagen nachts Mücken und Motten. Im Winter schlafen viele in Höhlen.\n\nUnter welche Überschrift gehört jede Notiz?"
                say: "Lies den Text. Unter welche Überschrift gehört jede Notiz?"
                bins:
                  - { id: food, show: { text: "Nahrung" }, say: "Nahrung" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { text: "Mücken", bin: food }
                  - { text: "Motten", bin: food }
                  - { text: "Winterschlaf", bin: winter }
                  - { text: "Höhle", bin: winter }
                hints: ["Was fressen sie? Was machen sie im Winter?"]
              - id: l2-s5
                type: true_false
                text: "Notizen: Bienenvolk, Königin legt Eier, Honig aus Nektar\n\nLina erzählt: „Bienen leben allein. Sie machen Honig aus Wasser.“\n\nPasst Linas Erzählung zu den Notizen?"
                say: "Lies die Notizen und was Lina erzählt. Passt ihre Erzählung zu den Notizen?"
                answer: false
                hints: ["Leben Bienen allein? Woraus machen sie Honig?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Der Igel\nIgel haben etwa 7000 Stacheln. Wenn Gefahr droht, rollen sie sich zu einer Kugel zusammen.\n\nFülle den Notizzettel aus."
                say: "Lies den Text. Fülle den Notizzettel aus."
                frame: "Stacheln: _   bei Gefahr: _"
                options: ["etwa 7000", "rollt sich zusammen", "etwa 70", "läuft weg"]
                answer: ["etwa 7000", "rollt sich zusammen"]
              - id: l2-n2
                type: ordering
                text: "Im Frühling gräbt das Eichhörnchen die letzten Nüsse aus. Die hat es im Herbst vergraben. Dazwischen, im Winter, ruht es viel im Kobel.\n\nLeg die Notizen in die Reihenfolge, wie es im Jahr passiert."
                say: "Lies den Text. Leg die Notizen in die Reihenfolge, wie es im Jahr passiert."
                options: ["Frühling: letzte Nüsse ausgraben", "Herbst: Nüsse vergraben", "Winter: ruht im Kobel"]
                slot_count: 3
                answer: ["Herbst: Nüsse vergraben", "Winter: ruht im Kobel", "Frühling: letzte Nüsse ausgraben"]
              - id: l2-n3
