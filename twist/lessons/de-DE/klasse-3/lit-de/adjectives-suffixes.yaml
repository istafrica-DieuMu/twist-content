          - text: "trinken → trinkbar"
            say: "Mit -bar baust du Adjektive aus Verben. Man kann das Wasser trinken. Es ist trinkbar."
          - text: "-ig · -lich · -isch · -bar"
            say: "Das sind vier Endungen für Adjektive: -ig, -lich, -isch und -bar."

      - activity: practise
