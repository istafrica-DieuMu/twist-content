                  - "Ein Tag mit viel Sturm ist …"
                  - "lesen gehört zu lesbar, Sturm zu stürmisch, Spaß zu spaßig."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Man kann die Pilze essen. Sie sind essbar."
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "Man kann die Pilze essen. Sie sind essbar." }
                answer: true
                hints:
                  - "Was bedeutet -bar?"
                  - "Essbar heißt: man kann es essen."
                  - "Ja, das stimmt."

          - support: some
