# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.write-stories
skill: lit-de.writing.stories
curriculum: de-DE
language: de
title:
  de: Spannend erzählen
  en: Telling a story well
summary: >
  The craft of writing a story, practised by choosing, ordering and
  filling gaps. Lesson 1 tells Erlebnis from Fantasie, builds a story in
  Einleitung, Hauptteil and Schluss and makes the Höhepunkt exciting;
  lesson 2 chooses precise verbs and adjectives, varies sentence
  beginnings, keeps the Präteritum, and ends with the skill check. Writing
  a whole story freely waits for the write_text task type. The skill check
  marks what a screen can mark (the kind of story, its order, a gripping
  Höhepunkt, the right word, beginning and tense); writing a story of
  one's own stays with Practise.
metadata:
  year: klasse-3
  topic: { de: Erzählen, en: Telling stories }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [lit-de.writing.story-pictures, lit-de.verbs.simple-past]
  also_practises: [lit-de.verbs.simple-past, lit-de.texts-media.story-elements, lit-de.adjectives.describe]
  vocabulary: { de: [Erlebnisgeschichte, Fantasiegeschichte, Einleitung, Hauptteil, Höhepunkt, Schluss, Satzanfang, Wortfeld] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: kind, what: { de: Erlebnisgeschichte und Fantasiegeschichte unterscheiden, en: telling a true-life story from a fantasy story } }
    - { id: structure, what: { de: "eine Geschichte aufbauen: Einleitung, Hauptteil, Schluss", en: "building a story: opening, middle, ending" } }
    - { id: suspense, what: { de: den Höhepunkt spannend erzählen, en: telling the high point with suspense } }
    - { id: words, what: { de: "treffende Wörter, neue Satzanfänge und das Präteritum wählen", en: "choosing precise words, varied sentence openings and the simple past" } }
  misconceptions:
    - id: and-then
      what: Starts every sentence with und dann or dann
      addressed: "lesson 2 Learn replaces dann with varied beginnings; l2-f3, l2-s3, l2-n3 and l2-c3 choose a different Satzanfang, with feedback on l2-f3 for another dann"
    - id: flat-climax
      what: Tells the most exciting moment in one plain sentence, with no feelings or tension
      addressed: "lesson 1 chooses the exciting version of a Höhepunkt in every stage (l1-f3, l1-s3, l1-n3, l2-c2), with feedback on l1-f3 for the plain version"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Aufbau und Spannung", en: "Structure and suspense" }
    goal:
      de: "Bau eine Geschichte mit Einleitung, Hauptteil und Schluss und mach den Höhepunkt spannend, so wie Plötzlich kippte das Kanu."
      en: "Build a story with a beginning, middle and end and make the high point exciting, like suddenly the canoe tipped over."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Setze das Verb in die Vergangenheit."
            say: "Erzähl in der Vergangenheit. Welche Form passt?"
            frame: "Gestern _ wir ins Kino."
            options: ["gingen", "gehen", "geht"]
            answer: ["gingen"]
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Setze das Verb in die Vergangenheit."
            say: "Erzähl in der Vergangenheit. Welche Form passt?"
            frame: "Der Hund _ laut."
            options: ["bellte", "bellt", "bellen"]
            answer: ["bellte"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Erlebnisgeschichte: Am Wochenende fuhr ich mit Papa zum ersten Mal Kanu.\nFantasiegeschichte: Eines Morgens konnte mein Kanu plötzlich sprechen."
            say: "Eine Erlebnisgeschichte erzählt etwas, das du wirklich erlebt hast. In einer Fantasiegeschichte passiert etwas, das es in Wirklichkeit nicht gibt."
          - text: "Einleitung: wer, wo, wann | Hauptteil: das Problem, der Höhepunkt | Schluss: die Lösung"
            say: "Jede Geschichte hat einen Aufbau. Im Hauptteil steigt die Spannung bis zum Höhepunkt. Dort ist die Geschichte am spannendsten."
          - text: "Plötzlich kippte das Kanu. Mein Herz klopfte wie wild. Eiskaltes Wasser spritzte mir ins Gesicht."
            say: "Am Höhepunkt erzählst du langsam und genau: was du siehst, hörst und fühlst. Wörter wie plötzlich oder auf einmal machen es spannend."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Erlebnis oder Fantasie?"
                say: "Sortiere die Anfänge: Erlebnisgeschichte oder Fantasiegeschichte?"
                bins:
                  - { id: real, show: { text: "Erlebnisgeschichte" }, say: "Erlebnisgeschichte" }
                  - { id: fantasy, show: { text: "Fantasiegeschichte" }, say: "Fantasiegeschichte" }
                options:
                  - { text: "Letzten Sommer lernte ich schwimmen.", bin: real }
                  - { text: "Mein Teddy wurde über Nacht riesengroß.", bin: fantasy }
                  - { text: "Gestern brach ich mir beim Turnen den Arm.", bin: real }
                  - { text: "Ein Drache landete auf unserem Schuldach.", bin: fantasy }
                option_audio: false
                hints:
                  - "Kann das wirklich passieren?"
                  - "Teddys wachsen nicht, und Drachen gibt es nicht."
                  - "Schwimmen und Arm: Erlebnis. Teddy und Drache: Fantasie."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Leg die Teile der Geschichte in die richtige Reihenfolge."
                say: "Leg die Teile in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
                options: ["Zum Glück hielt ein Busfahrer an und brachte mich nach Hause.", "Am Freitag fuhr ich allein mit dem Rad zu meinem Freund.", "Auf halbem Weg wurde es dunkel, und mein Licht ging nicht."]
                slot_count: 3
                answer: ["Am Freitag fuhr ich allein mit dem Rad zu meinem Freund.", "Auf halbem Weg wurde es dunkel, und mein Licht ging nicht.", "Zum Glück hielt ein Busfahrer an und brachte mich nach Hause."]
                option_audio: false
                hints:
                  - "Welcher Satz sagt, wer, wann und wo?"
                  - "Wo ist das Problem, wo die Lösung?"
                  - "Losfahren, dunkel und kein Licht, der Busfahrer hilft."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Höhepunkt ist spannender erzählt?"
                say: "Lies beide Höhepunkte. Welcher ist spannender erzählt?"
                options: ["Plötzlich hörte ich ein Knurren hinter mir. Ich hielt die Luft an und drehte mich ganz langsam um.", "Dann war da ein Hund."]
                answer: "Plötzlich hörte ich ein Knurren hinter mir. Ich hielt die Luft an und drehte mich ganz langsam um."
                option_audio: false
                feedback:
                  "Dann war da ein Hund.": "Das ist zu kurz. Am Höhepunkt erzählst du langsam, was du hörst und fühlst."
                hints:
                  - "Wo erfährst du, was die Figur hört und fühlt?"
                  - "Achte auf „Plötzlich“ und auf „Ich hielt die Luft an“."
                  - "Der erste ist spannender."
              - id: l1-f4
                type: fill_in_blank
                text: "Welches Wort macht den Satz spannender?"
                say: "Welches Wort macht den Satz spannender?"
                frame: "_ ging das Licht aus."
                options: ["Plötzlich", "Dann", "Und"]
                answer: ["Plötzlich"]
                hints:
                  - "Welches Wort zeigt: Jetzt passiert etwas Unerwartetes?"
                  - "Dann und Und klingen ganz normal."
                  - "Plötzlich."
              - id: l1-f5
                type: true_false
                text: "„Mein Hamster konnte auf einmal sprechen und lud mich zu einer Reise zum Mond ein.“ Ist das der Anfang einer Erlebnisgeschichte?"
                say: "Lies den Satz. Ist das der Anfang einer Erlebnisgeschichte?"
                answer: false
                hints:
                  - "Kann das wirklich passieren?"
                  - "Hamster sprechen nicht."
                  - "Nein, das ist eine Fantasiegeschichte."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Erlebnis oder Fantasie?"
                say: "Sortiere die Anfänge: Erlebnisgeschichte oder Fantasiegeschichte?"
                bins:
                  - { id: real, show: { text: "Erlebnisgeschichte" }, say: "Erlebnisgeschichte" }
                  - { id: fantasy, show: { text: "Fantasiegeschichte" }, say: "Fantasiegeschichte" }
                options:
                  - { text: "An meinem Geburtstag gingen wir in den Kletterpark.", bin: real }
                  - { text: "Unser Haus flog mitten in der Nacht davon.", bin: fantasy }
                  - { text: "In den Ferien besuchten wir Oma am See.", bin: real }
                  - { text: "Der Mond klopfte an mein Fenster.", bin: fantasy }
                option_audio: false
                hints: ["Kann das wirklich passieren?"]
              - id: l1-s2
                type: ordering
                text: "Leg die Teile der Geschichte in die richtige Reihenfolge."
                say: "Leg die Teile in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
                options: ["Am Ende fanden wir ihn schlafend im Wäschekorb.", "Am Sonntag spielten wir mit unserem Kater Moritz.", "Auf einmal war Moritz verschwunden. Wir suchten überall."]
                slot_count: 3
                answer: ["Am Sonntag spielten wir mit unserem Kater Moritz.", "Auf einmal war Moritz verschwunden. Wir suchten überall.", "Am Ende fanden wir ihn schlafend im Wäschekorb."]
                option_audio: false
                hints: ["Wo ist das Problem?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Höhepunkt ist spannender erzählt?"
                say: "Lies beide Höhepunkte. Welcher ist spannender erzählt?"
                options: ["Ich stand ganz oben auf dem Sprungturm. Meine Knie zitterten. Tief unter mir glitzerte das Wasser.", "Ich sprang vom Turm."]
                answer: "Ich stand ganz oben auf dem Sprungturm. Meine Knie zitterten. Tief unter mir glitzerte das Wasser."
                option_audio: false
                hints: ["Wo erfährst du, was die Figur sieht und fühlt?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort macht den Satz spannender?"
                say: "Welches Wort macht den Satz spannender?"
                frame: "_ knackte es hinter dem Busch."
                options: ["Auf einmal", "Dann", "Danach"]
                answer: ["Auf einmal"]
                hints: ["Welches Wort zeigt eine Überraschung?"]
              - id: l1-s5
                type: true_false
                text: "Im Schluss einer Geschichte wird das Problem gelöst. Stimmt das?"
                say: "Im Schluss einer Geschichte wird das Problem gelöst. Stimmt das?"
                answer: true
                hints: ["Was passiert am Ende mit dem Problem?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Erlebnis oder Fantasie?"
                say: "Sortiere die Anfänge: Erlebnisgeschichte oder Fantasiegeschichte?"
                bins:
                  - { id: real, show: { text: "Erlebnisgeschichte" }, say: "Erlebnisgeschichte" }
                  - { id: fantasy, show: { text: "Fantasiegeschichte" }, say: "Fantasiegeschichte" }
                options:
                  - { text: "Beim Fußballspiel schoss ich mein erstes Tor.", bin: real }
                  - { text: "Meine Schuhe liefen allein zur Schule.", bin: fantasy }
                  - { text: "Im Zoo sah ich ein Nashorn mit seinem Baby.", bin: real }
                  - { text: "Ein Zwerg wohnte in unserem Briefkasten.", bin: fantasy }
                option_audio: false
              - id: l1-n2
                type: ordering
                text: "Leg die Teile der Geschichte in die richtige Reihenfolge."
                say: "Leg die Teile in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
                options: ["Ein Fischer zog uns mit seinem Boot zurück ans Ufer.", "Mitten auf dem See zog ein Sturm auf. Die Wellen wurden riesig.", "In den Ferien paddelte ich mit meiner Schwester auf dem See."]
                slot_count: 3
                answer: ["In den Ferien paddelte ich mit meiner Schwester auf dem See.", "Mitten auf dem See zog ein Sturm auf. Die Wellen wurden riesig.", "Ein Fischer zog uns mit seinem Boot zurück ans Ufer."]
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Höhepunkt ist spannender erzählt?"
                say: "Lies beide Höhepunkte. Welcher ist spannender erzählt?"
                options: ["Der Ball rollte auf die Straße. Ein Auto raste heran. Ich schrie, so laut ich konnte.", "Der Ball war auf der Straße."]
                answer: "Der Ball rollte auf die Straße. Ein Auto raste heran. Ich schrie, so laut ich konnte."
                option_audio: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort macht den Satz spannender?"
                say: "Welches Wort macht den Satz spannender?"
                frame: "_ stand ein Fremder vor der Tür."
                options: ["Mit einem Mal", "Dann", "Und"]
                answer: ["Mit einem Mal"]
              - id: l1-n5
                type: true_false
                text: "„Letzten Winter fuhr ich mit meinem Bruder Schlitten und fiel in einen Schneehaufen.“ Ist das der Anfang einer Erlebnisgeschichte?"
                say: "Lies den Satz. Ist das der Anfang einer Erlebnisgeschichte?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "Leg die Teile der Geschichte in die richtige Reihenfolge."
            say: "Leg die Teile in die richtige Reihenfolge: Einleitung, Hauptteil, Schluss."
            options: ["Zum Glück fand Mama den Schlüssel unter der Fußmatte.", "Nach der Schule wollte ich die Haustür aufschließen.", "Mein Schlüssel war weg. Ich suchte in allen Taschen."]
            slot_count: 3
            answer: ["Nach der Schule wollte ich die Haustür aufschließen.", "Mein Schlüssel war weg. Ich suchte in allen Taschen.", "Zum Glück fand Mama den Schlüssel unter der Fußmatte."]
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Welches Wort macht den Satz spannender?"
            say: "Welches Wort macht den Satz spannender?"
            frame: "_ bewegte sich der Vorhang."
            options: ["Plötzlich", "Danach", "Und"]
            answer: ["Plötzlich"]
          - id: l1-c3
            type: true_false
            text: "„Ein sprechender Fisch erfüllte mir drei Wünsche.“ Ist das der Anfang einer Fantasiegeschichte?"
            say: "Lies den Satz. Ist das der Anfang einer Fantasiegeschichte?"
            answer: true
          - id: l1-c4
            type: sorting
            text: "Erlebnis oder Fantasie? Sortiere die Sätze."
            say: "Lies die Sätze. Gehören sie zu einer Erlebnisgeschichte oder zu einer Fantasiegeschichte? Sortiere."
            bins:
              - { id: real, show: { text: "Erlebnisgeschichte" }, say: "Erlebnisgeschichte" }
              - { id: fantasy, show: { text: "Fantasiegeschichte" }, say: "Fantasiegeschichte" }
            options:
              - { text: "Meine Katze flog auf einem Besen davon.", bin: fantasy }
              - { text: "Beim Laternenumzug ging meine Laterne aus.", bin: real }
              - { text: "Ein Riese trank unseren Teich leer.", bin: fantasy }
              - { text: "Im Urlaub sah ich zum ersten Mal das Meer.", bin: real }
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Höhepunkt ist spannender erzählt?"
            say: "Lies beide Höhepunkte. Welcher ist spannender erzählt?"
            options: ["Der Aufzug hielt an.", "Der Aufzug blieb mit einem Ruck stehen. Das Licht flackerte. Ich drückte immer wieder auf den Notknopf."]
            answer: "Der Aufzug blieb mit einem Ruck stehen. Das Licht flackerte. Ich drückte immer wieder auf den Notknopf."
            option_audio: false
          - id: l1-c6
            type: multiple_choice
            text: "„Mitten im Fußballspiel fing es an zu hageln.“\n\nZu welchem Teil der Geschichte gehört dieser Satz?"
            say: "Lies den Satz. Zu welchem Teil der Geschichte gehört er?"
            options: ["Einleitung", "Hauptteil", "Schluss"]
            answer: "Hauptteil"
            keep_order: true

  - n: 2
    title: { de: "Treffende Wörter", en: "Choosing good words" }
    goal:
      de: "Wähl treffende Wörter, so wie schleichen statt gehen, und fang nicht jeden Satz mit Dann an."
      en: "Choose words that fit exactly, like creep instead of walk, and do not start every sentence with then."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welches Wort macht den Satz spannender?"
            say: "Welches Wort macht den Satz spannender?"
            frame: "_ flog die Tür auf."
            options: ["Auf einmal", "Dann", "Und"]
            answer: ["Auf einmal"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wo ist eine Geschichte am spannendsten?"
            say: "Wo ist eine Geschichte am spannendsten?"
            options: ["am Höhepunkt", "in der Einleitung", "im Schluss"]
            answer: "am Höhepunkt"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "sagen: flüstern, rufen, fragen, antworten, schreien\ngehen: schleichen, rennen, stapfen, hüpfen"
            say: "Statt immer sagen oder gehen zu schreiben, kannst du treffendere Wörter nehmen. Wer schleicht, ist leise. Wer stapft, geht schwer. So sieht der Leser alles genau vor sich."
          - text: "Dann ging ich in den Keller. Dann hörte ich etwas. Dann rannte ich weg.\n\nVorsichtig ging ich in den Keller. Auf einmal hörte ich etwas. Schnell rannte ich weg."
            say: "Fang nicht jeden Satz mit Dann an. Wechsle ab: Vorsichtig, Auf einmal, Schnell, Kurz darauf, Am Ende."
          - text: "Ich öffnete die Tür. Ein kalter Wind wehte herein."
            say: "Erzähl die ganze Geschichte in der Vergangenheit, im Präteritum: ich öffnete, es wehte, wir liefen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Verb passt am besten?"
                say: "Welches Verb passt am besten? Es soll leise klingen."
                frame: "„Psst, das Baby schläft“, _ Mama."
                options: ["flüsterte", "sagte", "brüllte"]
                answer: ["flüsterte"]
                hints:
                  - "Wie spricht man, wenn ein Baby schläft?"
                  - "Sagte ist richtig, aber nicht genau."
                  - "flüsterte."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Verb passt am besten?"
                say: "Welches Verb passt am besten? Der Dieb will nicht gehört werden."
                frame: "Der Dieb _ auf Zehenspitzen durch den Flur."
                options: ["schlich", "ging", "stampfte"]
                answer: ["schlich"]
                hints:
                  - "Auf Zehenspitzen ist man leise."
                  - "Ging stimmt, sagt aber nicht, wie."
                  - "schlich."
              - id: l2-f3
                type: multiple_choice
                text: "Dann packte ich meinen Rucksack. Dann ging ich los. _ kam ich an der Hütte an.\n\nWelcher Satzanfang passt in die Lücke?"
                say: "Lies den Text. Welcher Satzanfang passt in die Lücke?"
                options: ["Nach einer Stunde", "Dann", "Und dann"]
                answer: "Nach einer Stunde"
                feedback:
                  "Dann": "Zweimal Dann steht schon da. Wechsle ab."
                hints:
                  - "Wie fangen die ersten Sätze an?"
                  - "Ein neuer Anfang sagt, wie viel Zeit vergangen ist."
                  - "Nach einer Stunde."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Satz beschreibt den Hund am genauesten?"
                say: "Welcher Satz beschreibt den Hund am genauesten?"
                options: ["Ein riesiger, zotteliger Hund mit nassem Fell stand vor mir.", "Ein Hund stand vor mir.", "Ein schöner Hund stand vor mir."]
                answer: "Ein riesiger, zotteliger Hund mit nassem Fell stand vor mir."
                option_audio: false
                hints:
                  - "Bei welchem Satz siehst du den Hund vor dir?"
                  - "Schön ist ungenau. Wie groß ist er, wie sieht sein Fell aus?"
                  - "Ein riesiger, zotteliger Hund mit nassem Fell."
              - id: l2-f5
                type: fill_in_blank
                text: "Erzähl in der Vergangenheit."
                say: "Die Geschichte steht in der Vergangenheit. Welche Form passt?"
                frame: "Wir rannten zum Strand und _ ins Wasser."
                options: ["sprangen", "springen", "springt"]
                answer: ["sprangen"]
                hints:
                  - "Rannten ist Vergangenheit."
                  - "Springen in der Vergangenheit: wir ..."
                  - "sprangen."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Lena ist sehr wütend. Welches Verb passt am besten?"
                say: "Welches Verb passt am besten? Lena ist sehr wütend."
                frame: "„Gib mir sofort mein Buch zurück!“, _ Lena."
                options: ["schimpfte", "flüsterte", "sagte"]
                answer: ["schimpfte"]
                hints: ["Wie spricht jemand, der wütend ist?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Verb passt am besten?"
                say: "Welches Verb passt am besten? Die Kinder haben es sehr eilig."
                frame: "Die Kinder _ zum Bus, weil er gleich abfuhr."
                options: ["rannten", "gingen", "schlenderten"]
                answer: ["rannten"]
                hints: ["Wer es eilig hat, geht nicht langsam."]
              - id: l2-s3
                type: multiple_choice
                text: "Dann aßen wir Kuchen. Dann spielten wir Verstecken. _ holten uns die Eltern ab.\n\nWelcher Satzanfang passt in die Lücke?"
                say: "Lies den Text. Welcher Satzanfang passt in die Lücke?"
                options: ["Am Abend", "Dann", "Und dann"]
                answer: "Am Abend"
                hints: ["Fang nicht noch einmal mit Dann an."]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Satz beschreibt das Haus am genauesten?"
                say: "Welcher Satz beschreibt das Haus am genauesten?"
                options: ["Am Ende der Straße stand ein altes Haus mit zerbrochenen Fenstern.", "Da war ein Haus.", "Da war ein tolles Haus."]
                answer: "Am Ende der Straße stand ein altes Haus mit zerbrochenen Fenstern."
                option_audio: false
                hints: ["Bei welchem Satz siehst du das Haus vor dir?"]
              - id: l2-s5
                type: true_false
                text: "„Ich öffne die Kiste und fand einen Brief.“ Steht der Satz ganz in der Vergangenheit?"
                say: "Lies den Satz. Steht er ganz in der Vergangenheit?"
                answer: false
                hints: ["Prüfe beide Verben: öffne und fand."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Verb passt am besten?"
                say: "Welches Verb passt am besten? Tim will etwas wissen."
                frame: "„Wann fährt der Zug?“, _ Tim."
                options: ["fragte", "antwortete", "rief"]
                answer: ["fragte"]
              - id: l2-n2
                type: fill_in_blank
                text: "Welches Verb passt am besten?"
