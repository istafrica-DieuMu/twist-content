# Lesson set: Deutsch, Klasse 3. Hand-authored draft.
id: de-DE.lit-de.adjectives-compare
skill: lit-de.adjectives.compare
curriculum: de-DE
language: de
title:
  de: Vergleichen mit Adjektiven
  en: Comparing with adjectives
summary: >
  The three steps of comparison (groß, größer, am größten) and when to
  say "so … wie" and "als". Lesson 1 forms the steps, also with umlaut
  (alt, älter, am ältesten); lesson 2 uses "als" for different and "so …
  wie" for the same, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Adjektive, en: Adjectives }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [lit-de.adjectives.agreement]
  also_practises: [lit-de.adjectives.recognise]
  vocabulary: { de: [Grundstufe, Vergleichsstufe, Höchststufe, vergleichen, als, so … wie] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: steps, what: { de: "die drei Vergleichsstufen bilden (Grundstufe, Vergleichsstufe, Höchststufe)", en: "forming the three steps of comparison (base, comparative, superlative)" } }
    - { id: special, what: { de: "Vergleichsstufen mit Umlaut und besondere Formen (alt, älter; gut, besser)", en: "steps with an umlaut and irregular forms (alt, älter; gut, besser)" } }
    - { id: als-wie, what: { de: "„als“ oder „so … wie“ im Vergleich wählen", en: "choosing als or so … wie in a comparison" } }
  misconceptions:
    - id: wie-for-als
      what: Says "größer wie" instead of "größer als"
      addressed: lesson 2 Learn sets "größer als" against "so groß wie"; options include "wie" after a comparative in every stage, with feedback in the full stage
    - id: no-umlaut
      what: Forms "alter, am altesten" without the umlaut
      addressed: lesson 1 Learn shows alt, älter, am ältesten; umlaut forms appear in every stage of lesson 1, with the form without umlaut as a distractor
    - id: irregular-forms
      what: Forms "guter" and "am gutesten"
      addressed: gut, besser, am besten is taught on its own Learn screen and practised once in each stage of lesson 1; the full stage shows "guter, am gutesten" as wrong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "groß, größer, am größten", en: "big, bigger, biggest" }
    goal:
      de: "Vergleiche mit Adjektiven in drei Stufen, so wie schnell, schneller, am schnellsten."
      en: "Compare with adjectives in three steps, like schnell, schneller, am schnellsten, fast, faster, fastest."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der Turm ist hoch." }
            spans: ["hoch"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "der _ Hund"
            say: "Welches Wort passt? Der … Hund."
            options: ["kleine", "kleines", "kleinen"]
            answer: "kleine"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hund, Pferd oder Gepard?"
            say: "Ein Hund, ein Pferd und ein Gepard machen ein Wettrennen. Was glaubst du: Wer ist am schnellsten?"
          - text: "schnell · schneller · am schnellsten"
            say: "Der Gepard gewinnt! Mit Adjektiven kann man vergleichen. Der Hund ist schnell. Das Pferd ist schneller. Der Gepard ist am schnellsten. Das sind die drei Vergleichsstufen."
          - text: "Grundstufe · Vergleichsstufe · Höchststufe"
            say: "Schnell ist die Grundstufe. Schneller ist die Vergleichsstufe, sie endet auf -er. Am schnellsten ist die Höchststufe, mit am und -sten."
          - text: "alt · älter · am ältesten"
            say: "Bei manchen Adjektiven wird aus a ein ä, aus o ein ö und aus u ein ü: alt, älter, am ältesten. Groß, größer, am größten."
          - text: "gut · besser · am besten"
            say: "Und ein paar Adjektive verändern sich ganz: gut, besser, am besten. Viel, mehr, am meisten."
          - text: "Wusstest du? Die Giraffe ist das höchste Tier der Welt. Sie ist sogar höher als ein Elefant."
            say: "Wusstest du? Der Elefant ist das schwerste Tier an Land. Aber die Giraffe ist höher als er. Sie ist das höchste Tier der Welt: hoch, höher, am höchsten!"
            show: { objects: [giraffe, elephant] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "klein · _ · am kleinsten"
                say: "Welche Vergleichsstufe fehlt? Klein, …, am kleinsten."
                options: ["kleiner", "kleinster", "mehr klein"]
                answer: "kleiner"
                feedback:
                  "mehr klein": "Die Vergleichsstufe bildest du mit -er: kleiner."
                hints:
                  - "Die Vergleichsstufe endet auf -er."
                  - "klein und -er."
                  - "kleiner."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Höchststufe."
                say: "Ergänze die Höchststufe: laut, lauter, am …"
                frame: "laut · lauter · am _"
                options: ["lautesten", "lauter", "lautsten"]
                answer: ["lautesten"]
                hints:
                  - "Die Höchststufe hat am und -sten."
                  - "Nach t kommt ein e dazu, damit man es gut sprechen kann."
                  - "am lautesten."
              - id: l1-f3
                type: multiple_choice
                text: "jung · _ · am jüngsten"
                say: "Welche Vergleichsstufe fehlt? Jung, …, am jüngsten."
                options: ["jünger", "junger", "jüngster"]
                answer: "jünger"
                feedback:
                  "junger": "Hier kommen zwei Pünktchen dazu, wie bei am jüngsten: jünger."
                hints:
                  - "Schau auf die Höchststufe: am jüngsten."
                  - "Auch die Vergleichsstufe hat ü."
                  - "jünger."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? gut · guter · am gutesten"
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "gut · guter · am gutesten" }
                answer: false
                feedback:
                  "true": "Am gutesten? So spricht vielleicht ein kleiner Drache, der gerade Deutsch lernt! Gut verändert sich ganz: gut, besser, am besten."
                hints:
                  - "Gut verändert sich ganz."
                  - "Denk an „besser“."
                  - "Nein, richtig ist: gut, besser, am besten."
              - id: l1-f5
                type: matching
                text: "Verbinde jede Grundstufe mit ihrer Vergleichsstufe."
                say: "Verbinde jede Grundstufe mit ihrer Vergleichsstufe."
                pairs:
                  - { left: { text: "warm" }, right: { text: "wärmer" } }
                  - { left: { text: "hell" }, right: { text: "heller" } }
                  - { left: { text: "viel" }, right: { text: "mehr" } }
                hints:
                  - "Die Vergleichsstufe endet meist auf -er."
                  - "Bei warm wird aus a ein ä."
                  - "warm gehört zu wärmer, hell zu heller, viel zu mehr."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "leise · _ · am leisesten"
                say: "Welche Vergleichsstufe fehlt? Leise, …, am leisesten."
                options: ["leiser", "leisester", "mehr leise"]
                answer: "leiser"
                hints: ["Welche Endung hat die Vergleichsstufe?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze die Höchststufe."
                say: "Ergänze die Höchststufe: klug, klüger, am …"
                frame: "klug · klüger · am _"
                options: ["klügsten", "klugsten", "klüger"]
                answer: ["klügsten"]
                hints: ["Schau auf die Vergleichsstufe. Wie schreibt man sie?"]
              - id: l1-s3
                type: multiple_choice
                text: "lang · _ · am längsten"
                say: "Welche Vergleichsstufe fehlt? Lang, …, am längsten."
                options: ["länger", "langer", "längster"]
                answer: "länger"
                hints: ["Schau auf die Höchststufe."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? viel · mehr · am meisten"
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "viel · mehr · am meisten" }
                answer: true
                hints: ["Denk an die Adjektive, die sich ganz verändern."]
              - id: l1-s5
                type: matching
                text: "Verbinde jede Grundstufe mit ihrer Höchststufe."
                say: "Verbinde jede Grundstufe mit ihrer Höchststufe."
                pairs:
                  - { left: { text: "kalt" }, right: { text: "am kältesten" } }
                  - { left: { text: "schön" }, right: { text: "am schönsten" } }
                  - { left: { text: "gut" }, right: { text: "am besten" } }
                hints: ["Die Höchststufe hat am und -sten."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "dick · _ · am dicksten"
                say: "Welche Vergleichsstufe fehlt? Dick, …, am dicksten."
                options: ["dicker", "dickster", "mehr dick"]
                answer: "dicker"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze die Höchststufe."
                say: "Ergänze die Höchststufe: hart, härter, am …"
                frame: "hart · härter · am _"
                options: ["härtesten", "hartesten", "härter"]
                answer: ["härtesten"]
              - id: l1-n3
                type: multiple_choice
                text: "kurz · _ · am kürzesten"
                say: "Welche Vergleichsstufe fehlt? Kurz, …, am kürzesten."
                options: ["kürzer", "kurzer", "kürzester"]
                answer: "kürzer"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? scharf · scharfer · am scharfesten"
                say: "Lies die Karte. Stimmt das?"
                show: { drawn: letter-card, text: "scharf · scharfer · am scharfesten" }
                answer: false
              - id: l1-n5
                type: matching
                text: "Verbinde jede Grundstufe mit ihrer Vergleichsstufe."
                say: "Verbinde jede Grundstufe mit ihrer Vergleichsstufe."
                pairs:
                  - { left: { text: "nett" }, right: { text: "netter" } }
                  - { left: { text: "arm" }, right: { text: "ärmer" } }
                  - { left: { text: "gut" }, right: { text: "besser" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "stark · _ · am stärksten"
            say: "Welche Vergleichsstufe fehlt? Stark, …, am stärksten."
            options: ["stärker", "starker", "stärkster"]
            answer: "stärker"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze die Höchststufe."
            say: "Ergänze die Höchststufe: weich, weicher, am …"
            frame: "weich · weicher · am _"
            options: ["weichsten", "weicher", "weichesten"]
            answer: ["weichsten"]
          - id: l1-c3
            type: true_false
            text: "Stimmt das? gut · besser · am besten"
            say: "Lies die Karte. Stimmt das?"
            show: { drawn: letter-card, text: "gut · besser · am besten" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "eng · _ · am engsten"
            say: "Welche Vergleichsstufe fehlt? Eng, …, am engsten."
            options: ["enger", "engster", "mehr eng"]
            answer: "enger"
          - id: l1-c5
            type: fill_in_blank
            text: "Ergänze die Höchststufe."
            say: "Ergänze die Höchststufe: glücklich, glücklicher, am …"
            frame: "glücklich · glücklicher · am _"
            options: ["glücklichsten", "glücklichesten", "glücklicher"]
            answer: ["glücklichsten"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? jung · jünger · am jungsten"
            say: "Lies die Karte. Stimmt das?"
            show: { drawn: letter-card, text: "jung · jünger · am jungsten" }
            answer: false

  - n: 2
    title: { de: "größer als, so groß wie", en: "bigger than, as big as" }
    goal:
      de: "Sag als, wenn zwei Dinge verschieden sind, und so wie, wenn sie gleich sind. Ein Wal ist größer als ein Fisch."
      en: "Say als when two things are different and so wie when they are the same, like bigger than and as big as."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "bunt · _ · am buntesten"
            say: "Welche Vergleichsstufe fehlt? Bunt, …, am buntesten."
            options: ["bunter", "bünter", "buntester"]
            answer: "bunter"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "gut · _ · am besten"
            say: "Welche Vergleichsstufe fehlt? Gut, …, am besten."
            options: ["besser", "guter", "mehr gut"]
            answer: "besser"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "größer als oder größer wie?"
            say: "Der Wal und der Fisch. Was glaubst du: Heißt es: Ein Wal ist größer als ein Fisch? Oder: Ein Wal ist größer wie ein Fisch?"
            show: { objects: [whale, fish] }
          - text: "Ein Wal ist größer als ein Fisch."
            say: "Größer als! Sind zwei Dinge verschieden, sagst du „als“: Ein Wal ist größer als ein Fisch. Nach der Vergleichsstufe kommt immer „als“."
            show: { object: whale }
          - text: "Tim ist so groß wie Lea."
            say: "Sind zwei Dinge gleich, sagst du „so … wie“: Tim ist so groß wie Lea. Dazwischen steht die Grundstufe."
          - text: "größer als ✓ · größer wie ✗"
            say: "Man hört oft „größer wie“. Richtig ist aber „größer als“. Merk dir: Vergleichsstufe mit -er, dann „als“."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Elefant ist schwerer _ eine Maus."
                say: "Welches Wort passt? Ein Elefant ist schwerer … eine Maus."
                show: { objects: [elephant, mouse] }
                options: ["als", "wie", "so"]
                answer: "als"
                feedback:
                  "wie": "„Schwerer“ ist die Vergleichsstufe. Danach kommt „als“: schwerer als."
                hints:
                  - "Schwerer ist die Vergleichsstufe."
                  - "Nach der Vergleichsstufe kommt immer dasselbe Wort."
                  - "als."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Die Bücher sind gleich dick. Ergänze den Satz."
                say: "Die beiden Bücher sind gleich dick. Ergänze: Mein Buch ist so dick … dein Buch."
                frame: "Mein Buch ist so dick _ dein Buch."
                options: ["wie", "als", "am"]
                answer: ["wie"]
                hints:
                  - "Die Bücher sind gleich dick."
                  - "Sind zwei Dinge gleich, sagst du so … und dann?"
                  - "so dick wie."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Mein Ball ist kleiner wie dein Ball."
                say: "Ist der Satz richtig?"
                show: { drawn: letter-card, text: "Mein Ball ist kleiner wie dein Ball." }
                answer: false
                hints:
                  - "Kleiner ist die Vergleichsstufe."
                  - "Danach kommt „als“."
                  - "Nein, richtig ist: kleiner als."
              - id: l2-f4
                type: multiple_choice
                text: "Der Pulli und die Jacke sind gleich warm. Welcher Satz passt?"
                say: "Der Pulli und die Jacke sind gleich warm. Welcher Satz passt?"
                options: ["Der Pulli ist so warm wie die Jacke.", "Der Pulli ist wärmer als die Jacke.", "Der Pulli ist so wärmer wie die Jacke."]
                answer: "Der Pulli ist so warm wie die Jacke."
                hints:
                  - "Beide sind gleich warm."
                  - "Gleich: so … wie mit der Grundstufe."
                  - "so warm wie."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze die Vergleichsstufe von langsam."
                say: "Ergänze: Das Fahrrad ist … als das Auto. Das Adjektiv heißt langsam."
                frame: "Das Fahrrad ist _ als das Auto."
                show: { objects: [bike, car] }
                options: ["langsamer", "langsam", "am langsamsten"]
                answer: ["langsamer"]
                feedback:
                  "am langsamsten": "Am langsamsten von allen? Da hätte die Schnecke etwas dagegen! Hier vergleichst du zwei Dinge. Vor „als“ steht die Vergleichsstufe: langsamer."
                hints:
                  - "Vor „als“ steht die Vergleichsstufe."
                  - "langsam und -er."
                  - "langsamer."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die Sonne ist heller _ der Mond."
                say: "Welches Wort passt? Die Sonne ist heller … der Mond."
                show: { objects: [sun, moon] }
                options: ["als", "wie", "so"]
                answer: "als"
                hints: ["Was kommt nach der Vergleichsstufe?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Beide Taschen wiegen gleich viel. Ergänze den Satz."
                say: "Beide Taschen wiegen gleich viel. Ergänze: Meine Tasche ist so schwer … deine."
                frame: "Meine Tasche ist so schwer _ deine."
                options: ["wie", "als", "am"]
                answer: ["wie"]
                hints: ["Gleich schwer: so … ?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Eine Flöte ist leiser als eine Trommel."
                say: "Ist der Satz richtig gebaut?"
                show: { drawn: letter-card, text: "Eine Flöte ist leiser als eine Trommel." }
                answer: true
                hints: ["Vergleichsstufe, dann …?"]
              - id: l2-s4
                type: multiple_choice
                text: "Der Turm ist höher als das Haus. Welcher Satz sagt dasselbe?"
                say: "Der Turm ist höher als das Haus. Welcher Satz sagt dasselbe?"
                options: ["Das Haus ist niedriger als der Turm.", "Das Haus ist so hoch wie der Turm.", "Das Haus ist höher als der Turm."]
                answer: "Das Haus ist niedriger als der Turm."
                hints: ["Ist das Haus höher oder niedriger?"]
                difficulty: stretch
              - id: l2-s5
                type: fill_in_blank
                text: "Ergänze die Vergleichsstufe von breit."
                say: "Ergänze: Ein Fluss ist … als ein Bach. Das Adjektiv heißt breit."
                frame: "Ein Fluss ist _ als ein Bach."
                options: ["breiter", "breit", "am breitesten"]
                answer: ["breiter"]
                hints: ["Vor „als“ steht die Vergleichsstufe."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Löwe ist stärker _ eine Katze."
                say: "Welches Wort passt? Ein Löwe ist stärker … eine Katze."
                show: { objects: [lion, cat] }
                options: ["als", "wie", "so"]
                answer: "als"
              - id: l2-n2
                type: fill_in_blank
                text: "Beide Stifte sind gleich lang. Ergänze den Satz."
                say: "Beide Stifte sind gleich lang. Ergänze: Mein Stift ist so lang … dein Stift."
                frame: "Mein Stift ist so lang _ dein Stift."
                options: ["wie", "als", "am"]
                answer: ["wie"]
              - id: l2-n3
                type: true_false
                text: "Stimmt das? Der Hund ist lauter wie die Katze."
                say: "Ist der Satz richtig?"
                show: { drawn: letter-card, text: "Der Hund ist lauter wie die Katze." }
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Lena und Tom sind gleich stark. Welcher Satz passt?"
                say: "Lena und Tom sind gleich stark. Welcher Satz passt?"
                options: ["Lena ist so stark wie Tom.", "Lena ist stärker als Tom.", "Lena ist so stärker wie Tom."]
                answer: "Lena ist so stark wie Tom."
              - id: l2-n5
                type: fill_in_blank
                text: "Ergänze die Vergleichsstufe von kalt."
                say: "Ergänze: Im Winter ist es … als im Sommer. Das Adjektiv heißt kalt."
                frame: "Im Winter ist es _ als im Sommer."
                options: ["kälter", "kalter", "am kältesten"]
                answer: ["kälter"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: special
            type: multiple_choice
            text: "nah · _ · am nächsten"
            say: "Welche Vergleichsstufe fehlt? Nah, …, am nächsten."
            options: ["näher", "naher", "nächster"]
            answer: "näher"
          - id: l2-c2
            part: als-wie
            type: multiple_choice
            text: "Ein Auto ist teurer _ ein Fahrrad."
            say: "Welches Wort passt? Ein Auto ist teurer … ein Fahrrad."
            options: ["als", "wie", "so"]
            answer: "als"
          - id: l2-c3
            part: als-wie
            type: fill_in_blank
            text: "Ali und Sara springen gleich weit. Ergänze den Satz."
            say: "Beide Kinder springen gleich weit. Ergänze: Ali springt so weit … Sara."
            frame: "Ali springt so weit _ Sara."
            options: ["wie", "als", "am"]
            answer: ["wie"]
          - id: l2-c4
            part: special
            type: true_false
            text: "Stimmt das? schwach · schwächer · am schwächsten"
            say: "Lies die Karte. Stimmt das?"
            show: { drawn: letter-card, text: "schwach · schwächer · am schwächsten" }
            answer: true
          - id: l2-c5
            part: special
            type: fill_in_blank
            text: "Ergänze die Vergleichsstufe von hoch."
            say: "Ergänze: Ein Berg ist … als ein Hügel. Das Adjektiv heißt hoch."
            frame: "Ein Berg ist _ als ein Hügel."
            options: ["höher", "hocher", "am höchsten"]
            answer: ["höher"]
          - id: l2-c6
            part: steps
            type: fill_in_blank
            text: "Ergänze die Höchststufe."
            say: "Ergänze die Höchststufe: leicht, leichter, am …"
            frame: "leicht · leichter · am _"
            options: ["leichtesten", "leichtsten", "leichter"]
            answer: ["leichtesten"]
          - id: l2-c7
            part: steps
