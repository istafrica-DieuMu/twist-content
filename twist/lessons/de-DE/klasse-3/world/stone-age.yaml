# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.stone-age
skill: world.time.stone-age
curriculum: de-DE
language: de
title:
  de: Zeitreise in die Steinzeit
  en: Time travel to the Stone Age
summary: >
  A time trip with a guide child from each part of the Stone Age. Lesson 1
  visits Tuk in the Altsteinzeit: hunters and gatherers who follow the
  animals, live in tents of poles and furs (not always in caves), make
  tools from stone, wood, bone and antler (Faustkeil, bone needles), make
  fire with flint and Schwefelkies; the Ice Age about 20 000 years ago
  with mammoths; dinosaurs died out about 66 million years ago and never
  met people. Lesson 2 visits Ena in a village of the Jungsteinzeit:
  people became settled in Germany about 7500 years ago, grew grain, kept
  cattle, sheep, goats and pigs, built long houses of wood, clay and
  straw, made clay pots and cloth from flax and felled trees with ground
  stone axes; the change was slow, over many centuries; Ötzi lived about
  5300 years ago; the Stone Age here ended more than 4000 years ago. It
  compares with today (tap, stove, shop; farmers still keep sheep) and
  ends with the skill check. Every date is a rounded "vor etwa" figure
  that stays true; no task names the current year.
metadata:
  year: klasse-3
  topic: { de: Geschichte entdecken, en: Exploring history }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [world.time.timeline]
  also_practises: []
  vocabulary: { de: [Steinzeit, Altsteinzeit, Jungsteinzeit, Eiszeit, Jäger und Sammler, sesshaft, Faustkeil, Feuerstein, Mammut, Langhaus, Ton, Getreide, Ackerbau, Viehzucht] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: hunters, what: { de: "beschreiben, wie Jäger und Sammler in der Altsteinzeit lebten", en: "describing how hunter-gatherers lived in the Old Stone Age" } }
    - { id: farmers, what: { de: "beschreiben, wie die ersten Bauern in der Jungsteinzeit lebten", en: "describing how the first farmers lived in the New Stone Age" } }
    - { id: compare, what: { de: "das Leben in der Steinzeit mit heute vergleichen", en: "comparing life in the Stone Age with today" } }
    - { id: when, what: { de: "die Steinzeit zeitlich einordnen", en: "placing the Stone Age in time" } }
  misconceptions:
    - id: dinosaurs-and-people
      what: Thinks Stone Age people lived alongside dinosaurs or hunted them
      addressed: "lesson 1 Learn has a screen on dinosaurs; l1-f2, l1-n4, l1-c2, l2-s6, l2-c16 and l2-c18"
    - id: all-in-caves
      what: Thinks Stone Age people all lived deep in caves
      addressed: "lesson 1 Learn on Tuk's tent; l1-s5, l2-n1 and l2-c2"
    - id: only-stone
      what: Thinks Stone Age people used only stone, or lived in stone houses
      addressed: "lesson 1 Learn on tools of stone, wood and bone; l1-s6, l2-n1, l2-c3 and l2-c9"
    - id: sudden-change
      what: Thinks people became farmers all at once
      addressed: "lesson 2 Learn says it took many centuries; l2-s2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Bei Tuk, dem Jäger", en: "With Tuk the hunter" }
    goal:
      de: "Entdecke, wie Jäger und Sammler in der Altsteinzeit lebten. Sie jagten Tiere und machten Werkzeuge aus Stein."
      en: "Discover how hunters and gatherers lived in the Old Stone Age. They hunted animals and made tools from stone."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Jahre hat ein Jahrtausend?"
            options: ["1000", "100", "10"]
            answer: "1000"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Auf der Zeitleiste steht, was am längsten her ist, ganz links."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Woher bekommt Tuk sein Essen?"
            say: "Steig ein in die Zeitmaschine! Wir reisen viele Jahrtausende zurück, in die Steinzeit. Dort triffst du Tuk. Er ist so alt wie du. Einen Supermarkt gibt es hier nicht. Was glaubst du: Woher bekommen Tuk und seine Familie ihr Essen?"
            show: { object: supermarket, crossed: true }
          - text: "Sie jagen und sammeln."
            say: "Tuks Familie jagt Tiere, zum Beispiel Rentiere und Wildpferde. Und sie sammelt, was sie findet: Beeren, Nüsse, Pilze und Wurzeln. Darum nennt man sie Jäger und Sammler. In der Altsteinzeit, dem ältesten und längsten Teil der Steinzeit, lebten alle Menschen so."
            show: { object: horse }
          - text: "Immer unterwegs, mit Zelten aus Fell"
            say: "Wenn die Tiere weiterziehen, zieht Tuks Gruppe mit. Sie wohnt in Zelten aus Holzstangen und Tierfellen. Manchmal rastet sie am Eingang einer Höhle oder unter einem Felsdach. Die Menschen wohnten also nicht immer in Höhlen, wie viele glauben."
            show: { object: fur-tent }
          - text: "Werkzeuge aus Stein, Holz und Knochen"
            say: "Die Steinzeit heißt so, weil die Menschen viele Werkzeuge aus Stein machten. Aus Feuerstein schlugen sie scharfe Klingen und den Faustkeil. Sie benutzten aber auch Holz, Knochen und Geweih. Aus Knochen machten sie sogar Nähnadeln, um Kleidung aus Fell und Leder zu nähen."
            show: { object: stone }
          - text: "Feuer gibt Wärme und Licht."
            say: "Feuer wärmt, macht Licht, brät das Fleisch und hält wilde Tiere fern. Um Feuer zu machen, schlug Tuks Vater einen Feuerstein gegen einen anderen Stein, den Schwefelkies. Die Funken fielen auf trockenen Zunder, und er pustete vorsichtig, bis eine Flamme kam."
            show: { object: campfire }
          - text: "Vor etwa 20 000 Jahren war Eiszeit."
            say: "Vor etwa zwanzigtausend Jahren war es in Deutschland viel kälter als heute. Es war Eiszeit. Hier lebten Mammuts, Wollnashörner und Rentiere. Solche Tiere malten die Menschen auch an Höhlenwände."
            show: { object: mammoth }
          - text: "Wusstest du? Schon vor etwa 40 000 Jahren schnitzten Menschen Flöten aus Vogelknochen."
            say: "Wusstest du? Schon vor etwa vierzigtausend Jahren schnitzten Menschen Flöten aus Vogelknochen. Man hat sie in Höhlen auf der Schwäbischen Alb gefunden. Sie gehören zu den ältesten Musikinstrumenten, die man kennt."
            show: { object: bone-flute }
          - text: "Und die Dinosaurier? Die gab es längst nicht mehr."
            say: "Und die Dinosaurier? Die gab es in der Steinzeit nicht mehr. Sie sind schon vor etwa 66 Millionen Jahren ausgestorben, lange bevor es Menschen gab. Kein Mensch hat je einen lebenden Dinosaurier gesehen."
            show: { object: dinosaur }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Woher bekam Tuks Familie ihr Essen?"
                options: ["Sie jagte Tiere und sammelte Beeren, Nüsse und Pilze.", "Sie kaufte es im Supermarkt.", "Sie bestellte es beim Lieferdienst."]
                answer: "Sie jagte Tiere und sammelte Beeren, Nüsse und Pilze."
                feedback:
                  "Sie bestellte es beim Lieferdienst.": "Ein Lieferdienst in der Steinzeit? Da hätte der Bote sehr weit laufen müssen! Tuks Familie jagte und sammelte."
                hints:
                  - "Gab es in der Steinzeit schon Läden?"
                  - "Tuks Familie heißt Jäger und Sammler."
                  - "Sie jagte Tiere und sammelte Beeren, Nüsse und Pilze."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? In der Steinzeit lebten Menschen und Dinosaurier zusammen."
                show: { object: dinosaur }
                answer: false
                feedback:
                  "true": "Die Dinosaurier sind vor etwa 66 Millionen Jahren ausgestorben, lange bevor es Menschen gab."
                hints:
                  - "Wann sind die Dinosaurier ausgestorben?"
                  - "Das war vor etwa 66 Millionen Jahren. Die Steinzeit ist viel, viel später."
                  - "Nein, Menschen und Dinosaurier haben sich nie getroffen."
              - id: l1-f3
                type: sorting
                text: "Was gab es bei Tuk, was noch nicht?"
                say: "Was gab es bei Tuk in der Steinzeit, und was gab es noch nicht? Sortiere."
                bins:
                  - { id: yes, show: { text: "gab es bei Tuk" }, say: "gab es bei Tuk" }
                  - { id: no, show: { text: "gab es noch nicht" }, say: "gab es noch nicht" }
                options:
                  - { object: hand-axe, bin: yes }
                  - { object: campfire, bin: yes }
                  - { object: supermarket, bin: no }
                  - { object: fur-tent, bin: yes }
                  - { object: car, bin: no }
                  - { object: bone-needle, bin: yes }
                hints:
                  - "Frag dich: Brauchte man dafür Strom, Motoren oder Läden?"
                  - "Auto und Supermarkt gibt es erst seit kurzer Zeit."
                  - "Bei Tuk: Faustkeil, Feuer, Zelt, Nadel. Noch nicht: Auto, Supermarkt."
              - id: l1-f4
                type: multiple_choice
                text: "Warum zog Tuks Gruppe immer weiter?"
                options: ["Sie folgte den Tieren, die sie jagte.", "Sie machte Urlaub.", "Ihr Haus war zu klein."]
                answer: "Sie folgte den Tieren, die sie jagte."
                hints:
                  - "Wovon lebte Tuks Gruppe?"
                  - "Die Tiere zogen weiter, und die Jäger brauchten sie."
                  - "Sie folgte den Tieren, die sie jagte."
              - id: l1-f5
                type: matching
                text: "Wozu brauchte Tuk das? Verbinde."
                pairs:
                  - { left: { object: campfire }, right: { text: "Wärme und Licht" } }
                  - { left: { object: hand-axe }, right: { text: "schneiden und schaben" } }
                  - { left: { object: bone-needle }, right: { text: "Kleidung nähen" } }
                hints:
                  - "Denk daran, was Tuk in der Kälte braucht."
                  - "Mit einer Nadel näht man."
                  - "Feuer: Wärme und Licht. Faustkeil: schneiden und schaben. Nadel: nähen."
              - id: l1-f6
                type: multiple_choice
                text: "Wie machte Tuks Vater Feuer?"
                show: { object: flint }
                options: ["Er schlug Feuerstein gegen Schwefelkies, und die Funken fielen auf Zunder.", "Mit einem Feuerzeug.", "Mit Streichhölzern."]
                answer: "Er schlug Feuerstein gegen Schwefelkies, und die Funken fielen auf Zunder."
                hints:
                  - "Feuerzeug und Streichhölzer gibt es erst seit Kurzem."
                  - "Er brauchte zwei besondere Steine."
                  - "Feuerstein gegen Schwefelkies: Die Funken fallen auf Zunder."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Vor etwa 20 000 Jahren war es in Deutschland viel kälter als heute."
                say: "Stimmt das? Vor etwa zwanzigtausend Jahren war es in Deutschland viel kälter als heute."
                answer: true
                hints: ["Wie hieß diese Zeit?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Tier jagte Tuks Familie?"
                options:
                  - { object: horse }
                  - { object: giraffe }
                  - { object: crocodile }
                answer: horse
                feedback:
                  giraffe: "Giraffen leben in Afrika, nicht im kalten Deutschland der Eiszeit."
                hints: ["Denk an die Wildpferde."]
              - id: l1-s3
                type: multiple_choice
                text: "Woraus machten die Menschen der Steinzeit ihre Werkzeuge?"
                show: { object: hand-axe }
                options: ["aus Stein, Holz und Knochen", "aus Plastik", "aus Eisen und Stahl"]
                answer: "aus Stein, Holz und Knochen"
                hints: ["Woraus war Tuks Nähnadel?"]
              - id: l1-s4
                type: sorting
                text: "Bei Tuk oder noch nicht?"
                bins:
                  - { id: yes, show: { text: "gab es bei Tuk" }, say: "gab es bei Tuk" }
                  - { id: no, show: { text: "gab es noch nicht" }, say: "gab es noch nicht" }
                options:
                  - { object: spear, bin: yes }
                  - { object: telephone, bin: no }
                  - { text: "Kleidung aus Leder", bin: yes }
                  - { object: bike, bin: no }
                  - { object: mammoth, bin: yes }
                hints: ["Was davon braucht Metall, Strom oder eine Fabrik?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Die Menschen der Steinzeit wohnten alle tief in dunklen Höhlen."
                answer: false
                feedback:
                  "true": "Tuks Gruppe wohnte meist in Zelten aus Holzstangen und Fellen. Höhlen nutzte sie manchmal am Eingang."
                hints: ["Wo wohnte Tuks Gruppe meistens?"]
              - id: l1-s6
                type: multiple_choice
                text: "Warum heißt die Steinzeit Steinzeit?"
                show: { object: hand-axe }
                options: ["Weil die Menschen viele Werkzeuge aus Stein machten.", "Weil alle Häuser aus Stein waren.", "Weil es damals Steine regnete."]
                answer: "Weil die Menschen viele Werkzeuge aus Stein machten."
                feedback:
                  "Weil es damals Steine regnete.": "Zum Glück nicht! Die Steinzeit heißt so wegen der Werkzeuge aus Stein."
                hints: ["Woraus war der Faustkeil?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Tuk friert. Was hilft ihm in der Eiszeit?"
                show: { object: campfire }
                options: ["ein Feuer und Kleidung aus Fell", "eine Jacke aus dem Laden", "eine Heizung"]
                answer: "ein Feuer und Kleidung aus Fell"
              - id: l1-n2
                type: true_false
                text: "Tuk erzählt: „Meine Mutter näht mit einer Nadel aus Knochen.“ Stimmt das?"
                show: { object: bone-needle }
                answer: true
              - id: l1-n3
                type: ordering
                text: "Tuk zeigt dir, wie man Feuer macht. Ordne die Schritte."
                options: ["vorsichtig pusten", "Feuerstein gegen Schwefelkies schlagen", "Holz auflegen", "Funken fallen auf den Zunder"]
                slot_count: 4
                answer: ["Feuerstein gegen Schwefelkies schlagen", "Funken fallen auf den Zunder", "vorsichtig pusten", "Holz auflegen"]
              - id: l1-n4
                type: image_multiple_choice
                text: "Tuk zeigt dir ein Bild an der Höhlenwand. Welches Tier ist darauf wohl gemalt?"
                options:
                  - { object: mammoth }
                  - { object: dinosaur }
                  - { object: penguin }
                answer: mammoth
              - id: l1-n5
                type: true_false
                text: "Stimmt das? Tuk und seine Familie wohnen immer am selben Ort."
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie nennt man Menschen, die jagen und Pflanzen sammeln?"
            options: ["Jäger und Sammler", "Bauern", "Händler"]
            answer: "Jäger und Sammler"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Die Dinosaurier waren schon ausgestorben, als es die ersten Menschen gab."
            show: { object: dinosaur }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was gab das Feuer den Menschen in der Steinzeit?"
            show: { object: campfire }
            options: ["Wärme und Licht", "Strom", "Internet"]
            answer: "Wärme und Licht"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Die Menschen der Steinzeit machten Werkzeuge auch aus Knochen."
            show: { object: bone-needle }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Welches Tier lebte in der Eiszeit in Deutschland?"
            options:
              - { object: mammoth }
              - { object: dinosaur }
              - { object: giraffe }
            answer: mammoth
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Jäger und Sammler bauten feste Häuser aus Stein."
            answer: false

  - n: 2
    title: { de: "Bei Ena im Dorf", en: "In Ena's village" }
    goal:
      de: "Entdecke, wie die ersten Bauern lebten, und vergleiche mit heute. Sie bauten Getreide an und wohnten in Langhäusern."
      en: "Discover how the first farmers lived and compare it with today. They grew grain and lived in long houses."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wovon lebten Tuk und seine Familie?"
            options: ["vom Jagen und Sammeln", "vom Einkaufen im Laden", "vom Pizzabacken"]
            answer: "vom Jagen und Sammeln"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Tuks Gruppe zog den Tieren hinterher."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Warum bleibt Enas Familie an einem Ort?"
            say: "Die Zeitmaschine bringt dich viele Jahrtausende nach Tuk wieder in die Steinzeit, aber in einen späteren Teil, die Jungsteinzeit. Dort triffst du Ena. Ihre Familie zieht nicht mehr umher. Sie wohnt in einem Dorf. Was glaubst du: Warum bleibt Enas Familie an einem Ort?"
            show: { object: house }
          - text: "Sie bauen Getreide an und halten Tiere."
            say: "Enas Familie sät Getreide auf einem Feld und wartet, bis es reif ist. Sie hält Rinder, Schafe, Ziegen und Schweine. Wer ein Feld hat, muss in der Nähe bleiben. Man sagt: Die Menschen wurden sesshaft. In Deutschland begann das vor etwa 7500 Jahren."
            show: { objects: [wheat, cow] }
          - text: "Langhäuser aus Holz, Lehm und Stroh"
            say: "Ena wohnt in einem Langhaus. Es steht auf dicken Holzpfosten. Die Wände sind aus Ästen geflochten und mit Lehm verschmiert, das Dach ist aus Schilf oder Stroh. Viele Langhäuser waren mehr als 20 Meter lang."
            show: { object: straw }
          - text: "Töpfe aus Ton, Stoff aus Flachs, Beile aus geschliffenem Stein"
            say: "Enas Mutter formt Töpfe aus Ton und brennt sie im Feuer, damit sie hart werden. Darin kocht sie Brei aus Getreide. Aus den Fasern der Flachspflanze weben die Menschen Stoff. Und mit geschliffenen Steinbeilen fällen sie Bäume für ihre Häuser."
            show: { object: porridge-bowl }
          - text: "Das ging ganz langsam."
            say: "Das alles kam nicht auf einmal. Es dauerte viele Jahrhunderte, bis überall Menschen in Dörfern lebten. Die Steinzeit endete bei uns vor mehr als 4000 Jahren, als die Menschen lernten, Werkzeuge aus Metall zu machen."
          - text: "Wusstest du? Ötzi, der Mann aus dem Eis, hatte 61 Tattoos."
            say: "Wusstest du? Ötzi, der Mann aus dem Eis, hatte 61 Tattoos. Er lebte vor etwa 5300 Jahren, am Ende der Steinzeit, und wurde im Eis der Alpen gefunden. Sein Messer hatte eine Klinge aus Feuerstein."
          - text: "Früher und heute: manches anders, manches gleich"
            say: "Vergleiche mit heute: Ena holt Wasser aus dem Bach, du drehst den Wasserhahn auf. Ena kocht über dem Feuer, du kochst auf dem Herd. Aber manches ist gleich geblieben: Auch heute bauen Bauern Getreide an und halten Kühe und Schafe."
            show: { objects: [cow, sheep] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum blieb Enas Familie an einem Ort?"
                options: ["Sie hatte Felder und Tiere, um die sie sich kümmern musste.", "Sie hatte keine Lust mehr zu laufen.", "Es gab keine Tiere mehr."]
                answer: "Sie hatte Felder und Tiere, um die sie sich kümmern musste."
                feedback:
                  "Sie hatte keine Lust mehr zu laufen.": "Vielleicht auch ein bisschen! Aber der echte Grund waren die Felder und die Tiere."
                hints:
                  - "Was machte Enas Familie anders als Tuks Familie?"
                  - "Ein Feld kann man nicht mitnehmen."
                  - "Sie hatte Felder und Tiere, also blieb sie."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Tuk oder Ena?"
                say: "Wer macht das, Tuk der Jäger oder Ena im Dorf? Sortiere."
                bins:
                  - { id: tuk, show: { text: "Tuk, Jäger und Sammler" }, say: "Tuk, Jäger und Sammler" }
                  - { id: ena, show: { text: "Ena, Bauernfamilie" }, say: "Ena, Bauernfamilie" }
                options:
                  - { text: "zieht den Tieren hinterher", bin: tuk }
                  - { text: "sät Getreide", bin: ena }
                  - { text: "wohnt in einem Zelt aus Fellen", bin: tuk }
                  - { text: "wohnt in einem Langhaus", bin: ena }
                  - { text: "hält Kühe und Schafe", bin: ena }
                  - { text: "jagt Mammuts in der Eiszeit", bin: tuk }
                hints:
                  - "Wer zieht umher, wer bleibt an einem Ort?"
                  - "Felder, Tiere im Stall und feste Häuser gehören zum Dorf."
                  - "Tuk: umherziehen, Zelt, Mammuts. Ena: Getreide, Langhaus, Kühe und Schafe."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Ena kocht Brei in einem Topf aus Ton."
                show: { object: clay-pot }
                answer: true
                hints:
                  - "Was formt Enas Mutter?"
                  - "Sie formt Töpfe aus Ton und kocht darin."
                  - "Ja, Ena kocht Brei in einem Tontopf."
              - id: l2-f4
                type: multiple_choice
                text: "Was bedeutet sesshaft?"
                options: ["an einem Ort wohnen bleiben", "immer weiterziehen", "gut sitzen können"]
                answer: "an einem Ort wohnen bleiben"
                feedback:
                  "gut sitzen können": "Das klingt so, aber sesshaft heißt: an einem Ort wohnen bleiben."
                hints:
                  - "Denk an Enas Dorf."
                  - "Enas Familie zieht nicht mehr umher."
                  - "Sesshaft heißt: an einem Ort wohnen bleiben."
              - id: l2-f5
                type: matching
                text: "Woraus war das? Verbinde."
                pairs:
                  - { left: { object: longhouse }, right: { text: "Holz, Lehm und Stroh" } }
                  - { left: { object: clay-pot }, right: { text: "Ton" } }
                  - { left: { text: "Stoff" }, right: { text: "Flachs" } }
                hints:
                  - "Denk an Enas Haus, ihren Topf und ihre Kleidung."
                  - "Den Topf formt Enas Mutter aus Ton."
                  - "Langhaus: Holz, Lehm, Stroh. Topf: Ton. Stoff: Flachs."
              - id: l2-f6
                type: multiple_choice
                text: "Wann wurden die Menschen in Deutschland sesshaft?"
                options: ["vor etwa 7500 Jahren", "vor etwa 75 Jahren", "vor etwa 66 Millionen Jahren"]
                answer: "vor etwa 7500 Jahren"
                feedback:
                  "vor etwa 66 Millionen Jahren": "Da starben die Dinosaurier aus. Menschen gab es noch lange nicht."
                hints:
                  - "Es ist Jahrtausende her, aber nicht Millionen Jahre."
                  - "Vor 75 Jahren gab es schon Autos."
                  - "Vor etwa 7500 Jahren."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Steinzeit oder heute?"
                say: "Ist das in der Steinzeit oder heute? Sortiere."
                bins:
                  - { id: then, show: { text: "Steinzeit" }, say: "Steinzeit" }
                  - { id: now, show: { text: "heute" }, say: "heute" }
                options:
                  - { text: "Wasser aus dem Bach holen", bin: then }
                  - { text: "den Wasserhahn aufdrehen", bin: now }
