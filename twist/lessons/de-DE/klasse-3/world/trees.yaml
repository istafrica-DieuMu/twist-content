# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.trees
skill: world.nature.trees
curriculum: de-DE
language: de
title:
  de: Laubbäume und Nadelbäume
  en: Broadleaf trees and conifers
summary: >
  Trees as found in Germany. Broadleaf trees have broad, flat leaves and
  are mostly bare in winter; conifers have needles, which are narrow, hard
  leaves, keep most of them all year and carry their seeds in cones. The
  larch is the conifer that drops its needles. Common trees are told
  apart by leaf and fruit: Eiche (Eichel), Buche (Bucheckern),
  Rosskastanie (Kastanie), Ahorn (winged seeds), Birke (white bark),
  Fichte, Tanne and Kiefer by their needles. People use wood and plant new
  trees. The story: Paul and his Oma Hilde make a leaf book. Lesson 1:
  broadleaf or conifer, and tree rings. Lesson 2: leaf and fruit, people
  and trees, and the skill check. Only a leafy tree, a fir and a leaf exist
  as pictures, so the single species, fruits and needles are text cards.
metadata:
  year: klasse-3
  topic: { de: Der Wald, en: The forest }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.plant-parts]
  also_practises: []
  vocabulary: { de: [Laubbaum, Nadelbaum, Nadel, Zapfen, Krone, Stamm, Rinde, Jahresring, Eiche, Eichel, Buche, Buchecker, Rosskastanie, Kastanie, Ahorn, Birke, Fichte, Tanne, Kiefer, Lärche, Förster] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: kinds, what: { de: Laubbäume und Nadelbäume unterscheiden, en: telling broadleaf trees from conifers } }
    - { id: leaf, what: { de: "häufige Bäume am Blatt oder an den Nadeln erkennen", en: recognising common trees by their leaves or needles } }
    - { id: fruit, what: { de: häufige Bäume an ihrer Frucht erkennen, en: recognising common trees by their fruit } }
    - { id: people, what: { de: "sagen, wie Menschen Bäume nutzen und neue pflanzen", en: saying how people use trees and plant new ones } }
  misconceptions:
    - id: needles-not-leaves
      what: Thinks needles are not leaves
      addressed: lesson 1 opens with the guess "Sind Nadeln auch Blätter?"; l1-f2 and l1-c2
    - id: all-conifers-evergreen
      what: Thinks every conifer stays green in winter
      addressed: the "Wusstest du?" screen on the larch; l1-s1, l1-n2 and l1-c5
    - id: fir-spruce-same
      what: Calls every conifer a Tanne
      addressed: the screen "Die Fichte sticht, die Tanne nicht"; l1-f5, l1-f6, l1-n3 and l1-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Blätter oder Nadeln?", en: "Leaves or needles?" }
    goal:
      de: "Unterscheide Laubbäume und Nadelbäume. Die Buche zum Beispiel hat breite Blätter, die Fichte hat Nadeln."
      en: "Tell broadleaf trees from conifers. The beech, for example, has broad leaves, and the spruce has needles."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Teil einer Pflanze holt Wasser aus dem Boden?"
            options: ["die Wurzel", "die Blüte", "das Blatt"]
            answer: "die Wurzel"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Auch ein Baum hat Wurzeln, einen Stamm und Blätter."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Sind Nadeln auch Blätter?"
            say: "Paul und Oma Hilde machen ein Blätterbuch. Sie kleben Blätter von vielen Bäumen hinein. Paul will auch einen Zweig mit Nadeln einkleben. Oma fragt: Gehört der überhaupt hinein? Was glaubst du: Sind Nadeln auch Blätter?"
            show: { object: fir-tree }
          - text: "Ja! Nadeln sind schmale, harte Blätter."
            say: "Ja, Nadeln sind Blätter. Sie sind nur sehr schmal und hart und haben außen eine Schicht aus Wachs. Bäume mit Nadeln heißen Nadelbäume. Bäume mit breiten, flachen Blättern heißen Laubbäume."
            show: { object: fir-tree }
          - text: "Laubbäume: breite, flache Blätter, im Winter meist kahl"
            say: "Eiche, Buche, Ahorn, Birke und Kastanie sind Laubbäume. Im Herbst färben sich ihre Blätter bunt und fallen ab. Im Winter sind die Laubbäume kahl, im Frühling wachsen neue Blätter."
            show: { object: tree }
          - text: "Nadelbäume: Nadeln und Zapfen, meist das ganze Jahr grün"
            say: "Fichte, Tanne und Kiefer sind Nadelbäume. Sie verlieren auch Nadeln, aber immer nur ein paar, nie alle auf einmal. Darum sind sie das ganze Jahr grün. Ihre Samen sitzen in Zapfen."
            show: { object: fir-tree }
          - text: "Die Fichte sticht, die Tanne nicht."
            say: "Fichte oder Tanne? Fass die Nadeln an. Die Nadeln der Fichte sind spitz und stechen. Die Nadeln der Tanne sind weich und flach, und unten haben sie zwei weiße Streifen. Die Kiefer hat lange Nadeln, die immer zu zweit wachsen."
            show: { object: spruce }
          - text: "Wusstest du? Die Lärche ist ein Nadelbaum, der im Herbst alle Nadeln verliert."
            say: "Wusstest du? Die Lärche ist ein Nadelbaum, der im Herbst alle Nadeln verliert. Vorher werden ihre Nadeln goldgelb. Im Frühling wachsen neue. Nicht jeder Nadelbaum ist also im Winter grün."
            show: { object: larch }
          - text: "Jedes Jahr ein Ring"
            say: "Im Stamm eines gefällten Baums siehst du Ringe. Jedes Jahr wächst ein neuer Ring dazu. Zählst du die Ringe, weißt du ungefähr, wie alt der Baum war."
            show: { object: tree-stump }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welcher Baum ist ein Nadelbaum?"
                options:
                  - { object: fir-tree }
                  - { object: tree }
                  - { object: flower }
                answer: fir-tree
                hints:
                  - "Schau auf die Blätter. Sind sie breit oder schmal wie Nadeln?"
                  - "Die Blume ist gar kein Baum."
                  - "Die Tanne hat Nadeln, sie ist ein Nadelbaum."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was sind Nadeln?"
                options: ["schmale, harte Blätter", "kleine Äste", "die Früchte des Baums"]
                answer: "schmale, harte Blätter"
                hints:
                  - "Paul darf den Zweig ins Blätterbuch kleben."
                  - "Nadeln machen am Baum das Gleiche wie Blätter."
                  - "Nadeln sind schmale, harte Blätter."
              - id: l1-f3
                type: sorting
                text: "Laubbaum oder Nadelbaum?"
                say: "Paul ordnet sein Blätterbuch. Laubbaum oder Nadelbaum?"
                bins:
                  - { id: broad, show: { text: "Laubbäume" }, say: "Laubbäume" }
                  - { id: conifer, show: { text: "Nadelbäume" }, say: "Nadelbäume" }
                options:
                  - { object: oak, bin: broad }
                  - { object: spruce, bin: conifer }
                  - { object: beech, bin: broad }
                  - { object: pine, bin: conifer }
                  - { object: maple, bin: broad }
                  - { object: fir-tree, bin: conifer }
                hints:
                  - "Hat der Baum breite Blätter oder Nadeln?"
                  - "Fichte, Tanne und Kiefer haben Nadeln."
                  - "Laubbäume: Eiche, Buche, Ahorn. Nadelbäume: Fichte, Kiefer, Tanne."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Laubbäume verlieren im Herbst ihre Blätter."
                answer: true
                hints:
                  - "Wie sieht eine Buche im Winter aus?"
                  - "Im Herbst liegt viel buntes Laub auf dem Boden."
                  - "Ja, im Winter sind Laubbäume meist kahl."
              - id: l1-f5
                type: image_multiple_choice
                text: "Paul fasst einen Zweig an. Die Nadeln stechen. Von welchem Baum ist er?"
                options:
                  - { object: spruce }
                  - { object: fir-tree }
                  - { object: beech }
                answer: spruce
                hints:
                  - "Die Buche hat keine Nadeln."
                  - "Welcher Nadelbaum hat spitze Nadeln?"
                  - "Die Fichte sticht, die Tanne nicht."
              - id: l1-f6
                type: matching
                text: "Verbinde jeden Nadelbaum mit seinen Nadeln."
                pairs:
                  - { left: { object: spruce }, right: { text: "spitz, sie stechen" } }
                  - { left: { object: fir-tree }, right: { text: "weich, unten zwei weiße Streifen" } }
                  - { left: { object: pine }, right: { text: "lang, immer zu zweit" } }
                hints:
                  - "Fang mit dem Spruch an: Die Fichte sticht, die Tanne nicht."
                  - "Die Kiefer hat die längsten Nadeln."
                  - "Fichte: spitz. Tanne: weich mit Streifen. Kiefer: lang, zu zweit."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Alle Nadelbäume sind im Winter grün."
                answer: false
                feedback:
                  "true": "Die Lärche ist ein Nadelbaum und verliert im Herbst alle Nadeln."
                hints: ["Denk an den Nadelbaum mit den goldgelben Nadeln im Herbst."]
              - id: l1-s2
                type: multiple_choice
                text: "Wo sitzen die Samen der Nadelbäume?"
                options: ["in Zapfen", "in Kastanien", "in bunten Blüten am Stamm"]
                answer: "in Zapfen"
                hints: ["Was liegt unter einer Fichte auf dem Boden?"]
              - id: l1-s3
                type: sorting
                text: "Was passt zum Laubbaum, was zum Nadelbaum?"
                bins:
                  - { id: broad, show: { text: "Laubbaum" }, say: "Laubbaum" }
                  - { id: conifer, show: { text: "Nadelbaum" }, say: "Nadelbaum" }
                options:
                  - { text: "breite, flache Blätter", bin: broad }
                  - { text: "Zapfen", bin: conifer }
                  - { text: "im Winter meist kahl", bin: broad }
                  - { text: "schmale, harte Blätter", bin: conifer }
                hints: ["Nadeln sind schmale, harte Blätter."]
              - id: l1-s4
                type: multiple_choice
                text: "Ein Baumstumpf hat 30 Ringe. Wie alt war der Baum ungefähr?"
                show: { object: tree-stump }
                options: ["30 Jahre", "3 Jahre", "300 Jahre"]
                answer: "30 Jahre"
                hints: ["Für jedes Jahr wächst ein Ring."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Die Tanne sticht, die Fichte nicht."
                answer: false
                feedback:
                  "true": "Andersherum: Die Fichte sticht, die Tanne nicht."
                hints: ["Welche Nadeln sind spitz?"]
              - id: l1-s6
                type: image_multiple_choice
                text: "Welcher Baum ist ein Laubbaum?"
                options:
                  - { object: tree }
                  - { object: fir-tree }
                answer: tree
                hints: ["Welcher Baum hat breite Blätter?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Im Dezember zeigt Oma Hilde auf einen Baum ohne Blätter. Was für ein Baum ist es?"
                options: ["ein Laubbaum", "eine Fichte", "eine Tanne"]
                answer: "ein Laubbaum"
              - id: l1-n2
                type: sorting
                text: "Auf welche Seite im Blätterbuch kommt der Baum?"
                say: "Paul hat neue Bäume gefunden. Auf welche Seite im Blätterbuch kommen sie?"
                bins:
                  - { id: broad, show: { text: "Laubbäume" }, say: "Laubbäume" }
                  - { id: conifer, show: { text: "Nadelbäume" }, say: "Nadelbäume" }
                options:
                  - { object: birch, bin: broad }
                  - { object: larch, bin: conifer }
                  - { object: pine, bin: conifer }
                  - { object: horse-chestnut, bin: broad }
                  - { object: fir-tree, bin: conifer }
              - id: l1-n3
                type: fill_in_blank
                text: "Oma Hildes Spruch"
                say: "Oma Hilde kennt einen Spruch. Setz die passenden Bäume ein."
                frame: "Die _ sticht, die _ nicht."
                options: ["Fichte", "Tanne", "Kiefer"]
                answer: ["Fichte", "Tanne"]
              - id: l1-n4
                type: true_false
                text: "Paul zählt 12 Ringe im Baumstumpf. Er sagt: „Der Baum war ungefähr 12 Jahre alt.“ Stimmt das?"
                show: { object: tree-stump }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Im November liegen unter einem Nadelbaum viele goldgelbe Nadeln, und der Baum ist kahl. Welcher Baum ist es?"
                options: ["die Lärche", "die Fichte", "die Tanne"]
                answer: "die Lärche"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welcher Baum ist ein Laubbaum?"
            options:
              - { object: beech }
              - { object: spruce }
              - { object: pine }
            answer: beech
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Nadeln sind auch Blätter."
            answer: true
          - id: l1-c3
            type: sorting
            text: "Sortiere die Bäume."
            bins:
              - { id: broad, show: { text: "Laubbäume" }, say: "Laubbäume" }
              - { id: conifer, show: { text: "Nadelbäume" }, say: "Nadelbäume" }
            options:
              - { object: maple, bin: broad }
              - { object: fir-tree, bin: conifer }
              - { object: birch, bin: broad }
              - { object: spruce, bin: conifer }
          - id: l1-c4
            type: multiple_choice
            text: "Woran erkennst du die Tanne?"
            options: ["weiche Nadeln mit zwei weißen Streifen", "spitze Nadeln, die stechen", "lange Nadeln, immer zu zweit"]
            answer: "weiche Nadeln mit zwei weißen Streifen"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Die Lärche bleibt im Winter grün."
            show: { object: larch }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Wo siehst du einen Nadelbaum?"
            options:
              - { object: tree }
              - { object: fir-tree }
              - { object: flower }
            answer: fir-tree

  - n: 2
    title: { de: "Blatt und Frucht", en: "Leaf and fruit" }
    goal:
      de: "Erkenne Bäume an ihren Blättern und Früchten. Die Eiche zum Beispiel erkennst du an ihren Eicheln."
      en: "Recognise trees by their leaves and fruit. You can tell the oak, for example, by its acorns."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was hat ein Nadelbaum?"
            options: ["Nadeln und Zapfen", "breite Blätter und Eicheln", "Blüten am Stamm"]
            answer: "Nadeln und Zapfen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Die Fichte hat spitze Nadeln."
            show: { object: spruce }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Kannst du einen Baum an seiner Frucht erkennen?"
            say: "Im Herbst sammeln Paul und Oma Hilde im Park Blätter und Früchte. Unter einem großen Baum liegen braune, glänzende Kugeln, manche noch in einer stacheligen grünen Schale. Was glaubst du: Kannst du an der Frucht erkennen, welcher Baum das ist?"
            show: { object: tree }
          - text: "Ja! Das sind Kastanien von der Rosskastanie."
            say: "Ja. Die braunen Kugeln sind Kastanien, die Früchte der Rosskastanie. Auch ihr Blatt erkennst du leicht: Es besteht aus fünf bis sieben einzelnen Blättchen, die an einem Punkt sitzen, wie die Finger an einer Hand."
            show: { object: conker }
          - text: "Eiche: Blätter mit runden Buchten und Eicheln"
            say: "Das Blatt der Eiche hat am Rand runde Buchten, es sieht wellig aus. Ihre Frucht ist die Eichel. Sie sitzt in einem kleinen Becher, wie in einem Hütchen."
            show: { object: oak-leaf }
          - text: "Buche: glatter Rand und Bucheckern"
            say: "Das Blatt der Buche ist oval und hat einen glatten, nur leicht welligen Rand. Ihre Früchte heißen Bucheckern. Das sind kleine dreieckige Nüsschen, meist zu zweit in einer Hülle mit weichen Stacheln. Die Rinde der Buche ist glatt und grau."
            show: { object: beechnut }
          - text: "Ahorn: Blatt mit spitzen Zipfeln und Samen mit Flügeln"
            say: "Das Ahornblatt ist ein einziges Blatt mit spitzen Zipfeln. Seine Samen haben Flügel. Wenn sie vom Baum fallen, drehen sie sich wie ein kleiner Propeller."
            show: { object: maple-leaf }
          - text: "Birke: weißer Stamm mit schwarzen Stellen"
            say: "Die Birke erkennst du schon von Weitem an ihrem weißen Stamm mit schwarzen Stellen. Ihre Blätter sind klein und fast dreieckig, mit einem gezackten Rand."
            show: { object: birch }
          - text: "Menschen nutzen Bäume und pflanzen neue."
            say: "Aus Holz macht man Möbel, Papier, Spielzeug und Häuser. Im Wald fällen Förster Bäume und pflanzen junge Bäume nach, damit der Wald bleibt. Viele Fichtenwälder haben Menschen gepflanzt, weil Fichten schnell wachsen und man ihr Holz braucht."
            show: { object: saw }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Ein Blatt hat am Rand runde Buchten. Von welchem Baum ist es?"
                options:
                  - { object: oak }
                  - { object: birch }
                  - { object: spruce }
                answer: oak
                hints:
                  - "Die Fichte hat Nadeln, also bleiben zwei Bäume."
                  - "Das Birkenblatt ist klein und gezackt."
                  - "Runde Buchten hat das Eichenblatt."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Verbinde jeden Baum mit seiner Frucht."
                pairs:
                  - { left: { object: oak }, right: { object: acorn } }
                  - { left: { object: beech }, right: { object: beechnut } }
                  - { left: { object: maple }, right: { object: maple-seed } }
                hints:
                  - "Bei zwei Bäumen steckt der Baum im Namen der Frucht."
                  - "Eiche und Eichel klingen ähnlich, Buche und Bucheckern auch."
                  - "Eiche: Eichel. Buche: Bucheckern. Ahorn: Samen mit Flügeln."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Das Blatt der Rosskastanie besteht aus mehreren Blättchen, wie Finger an einer Hand."
                show: { object: horse-chestnut }
                answer: true
                hints:
                  - "Wie viele Blättchen hat das Kastanienblatt?"
                  - "Es sind fünf bis sieben, an einem Punkt."
                  - "Ja, wie die Finger an einer Hand."
              - id: l2-f4
                type: sorting
                text: "Blatt oder Frucht?"
                say: "Paul legt seine Fundstücke auf zwei Haufen. Blatt oder Frucht?"
                bins:
                  - { id: leaf, show: { text: "Blatt" }, say: "Blatt" }
                  - { id: fruit, show: { text: "Frucht" }, say: "Frucht" }
                options:
                  - { object: acorn, bin: fruit }
                  - { object: maple-leaf, bin: leaf }
                  - { object: conker, bin: fruit }
                  - { text: "Tannennadel", bin: leaf }
                  - { object: beechnut, bin: fruit }
                  - { object: oak-leaf, bin: leaf }
                hints:
                  - "Aus einer Frucht kann ein neuer Baum wachsen."
                  - "Nadeln sind auch Blätter."
                  - "Früchte: Eichel, Kastanie, Buchecker. Blätter: Ahornblatt, Tannennadel, Eichenblatt."
              - id: l2-f5
                type: image_multiple_choice
                text: "Ein Baum hat einen weißen Stamm mit schwarzen Stellen. Welcher ist es?"
                options:
                  - { object: birch }
                  - { object: beech }
                  - { object: oak }
                answer: birch
                hints:
                  - "Schau auf die Farbe des Stamms."
                  - "Die Buche hat eine graue Rinde."
                  - "Weiß mit schwarzen Stellen: die Birke."
              - id: l2-f6
                type: multiple_choice
                text: "Woraus macht man Papier?"
                options: ["aus Holz", "aus Sand", "aus Wolken"]
                answer: "aus Holz"
                feedback:
                  "aus Wolken": "Papier aus Wolken wäre schön weich! Aber man macht es aus Holz."
                hints:
                  - "Es kommt von Bäumen."
                  - "Förster fällen Bäume, und aus dem Stamm macht man vieles."
                  - "Papier macht man aus Holz."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welche Frucht sitzt in einem kleinen Becher?"
                options:
                  - { object: acorn }
                  - { object: conker }
                  - { object: beechnut }
                answer: acorn
                hints: ["Sie trägt den Becher wie ein Hütchen."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Das Ahornblatt besteht aus vielen einzelnen Blättchen."
                show: { object: maple-leaf }
                answer: false
                feedback:
                  "true": "Das ist das Blatt der Rosskastanie. Das Ahornblatt ist ein einziges Blatt mit spitzen Zipfeln."
                hints: ["Denk an die Kastanie und an den Ahorn."]
              - id: l2-s3
                type: matching
                text: "Welches Blatt gehört zu welchem Baum?"
                pairs:
                  - { left: { object: oak }, right: { text: "runde Buchten am Rand" } }
                  - { left: { object: beech }, right: { text: "oval mit glattem Rand" } }
                  - { left: { object: maple }, right: { text: "ein Blatt mit spitzen Zipfeln" } }
                hints: ["Das Eichenblatt sieht wellig aus."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Die Samen dieses Baums haben Flügel und drehen sich beim Fallen. Welcher Baum ist es?"
                options:
                  - { object: maple }
                  - { object: oak }
                  - { object: horse-chestnut }
                answer: maple
                hints: ["Welche Samen drehen sich wie ein Propeller?"]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Viele Fichtenwälder haben Menschen gepflanzt."
                show: { object: spruce }
                answer: true
                hints: ["Warum pflanzen Menschen gern Fichten?"]
              - id: l2-s6
                type: multiple_choice
                text: "Woran erkennst du die Buche?"
                options: ["an glatter grauer Rinde und Bucheckern", "an weißer Rinde mit schwarzen Stellen", "an Nadeln und Zapfen"]
                answer: "an glatter grauer Rinde und Bucheckern"
                hints: ["Die weiße Rinde gehört zur Birke."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Paul findet kleine dreieckige Nüsschen in einer Hülle mit weichen Stacheln. Unter welchem Baum steht er?"
                options:
                  - { object: beech }
                  - { object: oak }
                  - { object: horse-chestnut }
                answer: beech
              - id: l2-n2
                type: sorting
                text: "Pauls Fundstücke: Zu welchem Baum gehören sie?"
                bins:
