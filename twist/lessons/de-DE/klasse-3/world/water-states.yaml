# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.water-states
skill: world.nature.water-states
curriculum: de-DE
language: de
title:
  de: Eis, Wasser, Wasserdampf
  en: Ice, water, water vapour
summary: >
  Water can be solid (Eis), liquid (Wasser) or a gas (Wasserdampf). It
  freezes at 0 °C, melts when it is warmer than 0 °C, boils at 100 °C and
  evaporates at any warmth, faster when it is warm and windy; on a cold
  surface water vapour turns back into drops (kondensieren). The story:
  Ben makes juice lollies with his Oma and later wonders where the puddle
  in front of her house has gone. Lesson 1 teaches the three forms,
  freezing and melting; lesson 2 evaporating, boiling and condensing and
  ends with the skill check. Experiments are predicted in the app and seen
  as a result; the real ones stay in class or at home with an adult.
metadata:
  year: klasse-3
  topic: { de: Wasser, en: Water }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.weather]
  also_practises: []
  vocabulary: { de: [fest, flüssig, gasförmig, Eis, Wasser, Wasserdampf, gefrieren, schmelzen, verdunsten, kochen, kondensieren, Grad Celsius, Thermometer, Gefrierfach, beschlagen] }
  forms: [text, audio, picture, drawn]
  drawn: [thermometer]
  facets: []
  parts:
    - { id: states, what: { de: "fest, flüssig und gasförmig beim Wasser erkennen", en: "recognising solid, liquid and gas in water" } }
    - { id: changes, what: { de: "gefrieren, schmelzen, verdunsten und kondensieren benennen", en: "naming freezing, melting, evaporating and condensing" } }
    - { id: when, what: { de: "sagen, wann Wasser gefriert, schmilzt, kocht und verdunstet", en: "saying when water freezes, melts, boils and evaporates" } }
  misconceptions:
    - id: evaporated-is-gone
      what: Thinks water that evaporates is gone for good, not in the air as water vapour
      addressed: lesson 2 opens with the guess about the puddle and answers it with water vapour in the air; l2-f1, l2-s5 and the check task l2-c11
    - id: evaporates-only-boiling
      what: Thinks water only turns to vapour when it boils
      addressed: the lesson 2 screen on the puddle and the washing; l2-f2, l2-s1, l2-c16 and l2-c17
    - id: steam-is-visible
      what: Thinks the white cloud over a kettle is water vapour; the vapour is invisible and the cloud is tiny drops
      addressed: the lesson 1 screen on the three forms and the lesson 2 screen on the kettle; l1-c5, l2-s2
    - id: drops-through-glass
      what: Thinks the drops on a cold glass come through the glass
      addressed: the lesson 2 screen on the mirror and the cold glass; l2-s4, l2-n4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Fest oder flüssig?", en: "Solid or liquid?" }
    goal:
      de: "Erkenne, ob Wasser fest, flüssig oder gasförmig ist. Du lernst, wann Wasser zu Eis gefriert und wann Eis schmilzt."
      en: "Tell whether water is solid, liquid or a gas. You learn when water freezes into ice and when ice melts."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Bei welchem Wetter fallen weiße Flocken vom Himmel?"
            options:
              - { object: rain }
              - { object: snow }
              - { object: sun }
            answer: snow
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Wenn es schneit, ist es draußen kalt."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was passiert mit Saft im Gefrierfach?"
            say: "Ben macht mit seiner Oma Saft-Eis. Sie füllen Orangensaft in kleine Formen und stecken Stiele hinein. Dann stellen sie die Formen ins Gefrierfach. Was glaubst du: Was passiert mit dem Saft?"
            show: { object: juice }
          - text: "Am nächsten Morgen ist der Saft fest. Er ist gefroren."
            say: "Am nächsten Morgen ist der Saft hart und fest. Im Gefrierfach ist es kälter als null Grad Celsius. Dort wird Saft fest, und Wasser auch. Das nennt man gefrieren. Wasser gefriert bei null Grad Celsius."
            show: { drawn: thermometer, from: -10, to: 30, step: 5, value: 0 }
          - text: "Wasser gibt es in drei Formen: fest, flüssig und gasförmig."
            say: "Wasser gibt es in drei Formen. Eis ist fest: Es hat seine eigene Form, und du kannst es in die Hand nehmen. Wasser im Glas ist flüssig: Es fließt und nimmt die Form des Glases an. Wasserdampf ist gasförmig: Er verteilt sich in der Luft, und du kannst ihn nicht sehen."
            show: { object: water }
          - text: "Eis schmilzt, wenn es wärmer als 0 °C ist."
            say: "Ben nimmt sein Saft-Eis mit in den Garten. In der Sonne wird es weich und tropft. Das Eis schmilzt: Es wird wieder flüssig. Auch Schnee und ein Schneemann schmelzen, wenn es wärmer als null Grad wird."
            show: { object: snowman }
          - text: "Wusstest du? Wasser braucht mehr Platz, wenn es gefriert."
            say: "Wusstest du? Wenn Wasser gefriert, braucht es mehr Platz als vorher. Eine ganz volle Glasflasche im Gefrierfach kann darum platzen. Deshalb füllt Oma die Eisformen nie bis ganz oben."
          - text: "Gefrieren: flüssig wird fest.\nSchmelzen: fest wird flüssig."
            say: "Merk dir zwei Wörter. Gefrieren: Flüssiges Wasser wird fest, zu Eis. Schmelzen: Festes Eis wird wieder flüssig. Das Thermometer zeigt dir, was passiert: Unter null Grad gefriert Wasser, über null Grad schmilzt Eis."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Eis ist Wasser in welcher Form?"
                options: ["fest", "flüssig", "gasförmig"]
                answer: "fest"
                hints:
                  - "Kannst du einen Eiswürfel in die Hand nehmen?"
                  - "Was seine eigene Form behält, ist fest."
                  - "Eis ist fest."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo ist das Wasser fest?"
                options:
                  - { object: snowman }
                  - { object: water }
                  - { object: bath }
                answer: snowman
                hints:
                  - "Wo kannst du das Wasser in die Hand nehmen, ohne dass es wegfließt?"
                  - "Im Glas und in der Badewanne fließt das Wasser."
                  - "Der Schneemann ist aus Schnee, und Schnee ist festes Wasser."
                difficulty: easy
              - id: l1-f3
                type: sorting
                text: "Fest oder flüssig?"
                say: "Hier ist überall Wasser. Ist es fest oder flüssig? Sortiere."
                bins:
                  - { id: solid, show: { text: "fest" }, say: "fest" }
                  - { id: liquid, show: { text: "flüssig" }, say: "flüssig" }
                options:
                  - { object: snowflake, bin: solid }
                  - { object: puddle, bin: liquid }
                  - { object: rain, bin: liquid }
                  - { object: snowman, bin: solid }
                  - { text: "Eiswürfel", bin: solid }
                  - { object: bath, bin: liquid }
                hints:
                  - "Fließt das Wasser, oder behält es seine Form?"
                  - "Schnee und Eis behalten ihre Form."
                  - "Fest: Schneeflocke, Schneemann, Eiswürfel. Flüssig: Pfütze, Regen, Badewanne."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Wasser gefriert bei 0 °C."
                answer: true
                hints:
                  - "Wie kalt ist es im Gefrierfach?"
                  - "Unter null Grad wird Wasser zu Eis."
                  - "Ja, Wasser gefriert bei 0 °C."
              - id: l1-f5
                type: matching
                text: "Verbinde jede Form des Wassers mit ihrem Namen."
                pairs:
                  - { left: { text: "Eis" }, right: { text: "fest" } }
                  - { left: { text: "Wasser im Glas" }, right: { text: "flüssig" } }
                  - { left: { text: "Wasserdampf" }, right: { text: "gasförmig" } }
                hints:
                  - "Welche Form kannst du nicht sehen?"
                  - "Wasser im Glas fließt, Eis behält seine Form."
                  - "Eis: fest. Wasser im Glas: flüssig. Wasserdampf: gasförmig."
              - id: l1-f6
                type: multiple_choice
                text: "So warm ist es heute im Garten. Was passiert mit Bens Saft-Eis?"
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: 25 }
                options: ["Es schmilzt.", "Es bleibt hart und fest.", "Es wird zu Stein."]
                answer: "Es schmilzt."
                feedback:
                  "Es wird zu Stein.": "Ein Eis aus Stein? Das wäre schwer zu lecken! Schau auf das Thermometer."
                hints:
                  - "Lies das Thermometer ab: Ist es wärmer oder kälter als 0 °C?"
                  - "Es sind 25 °C, viel wärmer als 0 °C."
                  - "Über 0 °C schmilzt Eis."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Im Gefrierfach schmilzt das Eis."
                answer: false
                feedback:
                  "true": "Im Gefrierfach ist es kälter als 0 °C. Dort bleibt Eis fest, und Wasser gefriert."
                hints: ["Ist es im Gefrierfach wärmer oder kälter als 0 °C?"]
              - id: l1-s2
                type: multiple_choice
                text: "Der Schneemann wird kleiner und kleiner. Was passiert mit dem Schnee?"
                show: { object: snowman }
                options: ["Er schmilzt.", "Er gefriert.", "Er wird härter."]
                answer: "Er schmilzt."
                hints: ["Aus dem Schnee wird Wasser. Wie heißt das?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was ist flüssig?"
                options:
                  - { object: snowflake }
                  - { object: juice }
                  - { object: dice }
                answer: juice
                hints: ["Was fließt und nimmt die Form des Glases an?"]
              - id: l1-s4
                type: sorting
                text: "Gefriert es, oder schmilzt es?"
                bins:
                  - { id: freeze, show: { text: "gefriert" }, say: "gefriert" }
                  - { id: melt, show: { text: "schmilzt" }, say: "schmilzt" }
                options:
                  - { text: "Wasser im Gefrierfach", bin: freeze }
                  - { text: "Schnee in der Sonne", bin: melt }
                  - { text: "ein Eiswürfel im warmen Tee", bin: melt }
                  - { text: "eine Pfütze in einer kalten Winternacht", bin: freeze }
                  - { text: "ein Eiszapfen im Frühling", bin: melt }
                hints: ["Ist es dort kälter oder wärmer als 0 °C?"]
              - id: l1-s5
                type: multiple_choice
                text: "So kalt ist es heute Nacht. Was passiert mit der Pfütze vor Omas Haus?"
                show: { drawn: thermometer, from: -10, to: 30, step: 5, value: -5 }
                options: ["Sie gefriert zu Eis.", "Sie wird warm.", "Sie fängt an zu kochen."]
                answer: "Sie gefriert zu Eis."
                hints: ["Das Thermometer zeigt weniger als 0 °C."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Flüssiges Wasser nimmt die Form des Gefäßes an."
                answer: true
                hints: ["Gieß Wasser in einen Becher und dann in eine Schale. Was passiert?"]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "In welcher Form ist das Wasser? Verbinde."
                pairs:
                  - { left: { object: snowman }, right: { text: "fest" } }
                  - { left: { object: puddle }, right: { text: "flüssig" } }
                  - { left: { text: "unsichtbar in der Luft" }, right: { text: "gasförmig" } }
              - id: l1-n2
                type: multiple_choice
                text: "Bei welcher Temperatur gefriert Wasser?"
                options: ["0 °C", "10 °C", "100 °C"]
                answer: "0 °C"
              - id: l1-n3
                type: true_false
                text: "Stimmt das? Ein Eiswürfel ist kein Wasser, sondern etwas ganz anderes."
                answer: false
                feedback:
                  "true": "Ein Eiswürfel ist Wasser in fester Form. Wenn er schmilzt, hast du wieder flüssiges Wasser."
              - id: l1-n4
                type: sorting
                text: "Fest, flüssig oder gasförmig?"
                bins:
                  - { id: solid, show: { text: "fest" }, say: "fest" }
                  - { id: liquid, show: { text: "flüssig" }, say: "flüssig" }
                  - { id: gas, show: { text: "gasförmig" }, say: "gasförmig" }
                options:
                  - { text: "Eiszapfen", bin: solid }
                  - { text: "Regentropfen", bin: liquid }
                  - { text: "Wasserdampf", bin: gas }
                  - { text: "Hagelkorn", bin: solid }
                  - { text: "Wasser im Fluss", bin: liquid }
              - id: l1-n5
                type: multiple_choice
                text: "Bens Saft-Eis tropft auf den Teller. Was ist passiert?"
                options: ["Es schmilzt, weil es wärmer als 0 °C ist.", "Es gefriert, weil es kälter als 0 °C ist.", "Es kocht, weil es 100 °C hat."]
                answer: "Es schmilzt, weil es wärmer als 0 °C ist."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wasser im Glas ist ..."
            options: ["flüssig", "fest", "gasförmig"]
            answer: "flüssig"
          - id: l1-c2
            type: image_multiple_choice
            text: "Wo ist das Wasser fest?"
            options:
              - { object: juice }
              - { object: snowflake }
              - { object: bath }
            answer: snowflake
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Schnee schmilzt, wenn es wärmer als 0 °C wird."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Flüssiges Wasser wird zu Eis. Wie heißt das?"
            options: ["gefrieren", "schmelzen", "kochen"]
            answer: "gefrieren"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Wasserdampf kannst du gut sehen."
            answer: false
            feedback:
              "true": "Wasserdampf ist unsichtbar. Er verteilt sich in der Luft."
          - id: l1-c6
            type: matching
            text: "Was passiert dabei? Verbinde."
            pairs:
              - { left: { text: "gefrieren" }, right: { text: "flüssig wird fest" } }
              - { left: { text: "schmelzen" }, right: { text: "fest wird flüssig" } }

  - n: 2
    title: { de: "Wohin ist die Pfütze verschwunden?", en: "Where has the puddle gone?" }
    goal:
      de: "Finde heraus, wie Wasser zu Wasserdampf wird und wieder zu Tropfen. Eine Pfütze verdunstet zum Beispiel in der Sonne."
      en: "Find out how water turns into water vapour and back into drops. A puddle, for example, evaporates in the sun."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was passiert mit Eis, wenn es wärmer als 0 °C ist?"
            options: ["Es schmilzt.", "Es gefriert.", "Es wird noch härter."]
            answer: "Es schmilzt."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Wasser gefriert bei 100 °C."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wohin ist die Pfütze verschwunden?"
            say: "Nach dem Regen war vor Omas Haus eine große Pfütze. Am Nachmittag scheint die Sonne, und am Abend ist die Pfütze weg. Ben wundert sich. Was glaubst du: Wohin ist das Wasser verschwunden?"
            show: { object: puddle }
          - text: "Das Wasser ist verdunstet. Es ist jetzt Wasserdampf in der Luft."
            say: "Ein bisschen Wasser ist im Boden versickert. Aber viel Wasser ist verdunstet. Es ist zu Wasserdampf geworden und unsichtbar in die Luft gestiegen. Weg ist es also nicht. Wasser verdunstet auch, wenn es nicht heiß ist. Bei Wärme und Wind geht es schneller. So trocknet auch die Wäsche auf der Leine."
            show: { object: sun }
          - text: "Bei 100 °C kocht Wasser."
            say: "Oma macht Tee. Im Wasserkocher wird das Wasser immer heißer. Bei hundert Grad Celsius kocht es: Es sprudelt, und ganz schnell wird viel Wasser zu Wasserdampf. Der Wasserdampf selbst ist unsichtbar. Die weiße Wolke über dem Wasserkocher sind schon wieder winzige Wassertröpfchen. Vorsicht: Heißer Dampf verbrüht die Haut. Den Wasserkocher bedient nur ein Erwachsener."
            show: { object: kettle }
          - text: "Am kalten Spiegel wird Wasserdampf wieder zu Tropfen."
            say: "Nach dem Baden ist der Spiegel im Bad beschlagen. Der warme Wasserdampf in der Luft trifft auf den kalten Spiegel. Er kühlt ab und wird wieder zu winzigen Tropfen. Das heißt kondensieren. Darum ist auch ein Glas mit kaltem Saft außen nass. Die Tropfen kommen aus der Luft, nicht durch das Glas."
            show: { object: mirror }
          - text: "Wusstest du? Auf der Zugspitze kocht Wasser schon bei ungefähr 90 °C."
            say: "Wusstest du? Bei uns kocht Wasser bei hundert Grad. Auf der Zugspitze, dem höchsten Berg Deutschlands, kocht es schon bei ungefähr neunzig Grad. Hoch oben drückt weniger Luft auf das Wasser. Darum braucht man dort länger, bis Nudeln gar sind."
          - text: "Gefrieren, schmelzen, verdunsten, kondensieren"
            say: "Jetzt kennst du vier Wörter. Gefrieren: Flüssiges Wasser wird fest. Schmelzen: Festes Eis wird flüssig. Verdunsten: Flüssiges Wasser wird zu Wasserdampf. Kondensieren: Wasserdampf wird wieder zu flüssigen Tropfen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wohin ist das Wasser der Pfütze gegangen?"
                options: ["Es ist verdunstet und als Wasserdampf in der Luft.", "Ein Vogel hat alles ausgetrunken.", "Es ist zu Eis geworden."]
                answer: "Es ist verdunstet und als Wasserdampf in der Luft."
                feedback:
                  "Ein Vogel hat alles ausgetrunken.": "Das wäre ein sehr durstiger Vogel! Die Sonne hat das Wasser erwärmt. Was passiert dann?"
                hints:
                  - "Die Sonne hat geschienen, es war warm."
                  - "Bei Wärme wird Wasser zu unsichtbarem Wasserdampf."
                  - "Das Wasser ist verdunstet. Es ist jetzt in der Luft."
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Wasser verdunstet nur, wenn es kocht."
                answer: false
                feedback:
                  "true": "Die Pfütze hat nicht gekocht, und trotzdem ist das Wasser verdunstet. Wasser verdunstet auch, wenn es nicht heiß ist."
                hints:
                  - "Denk an die Wäsche auf der Leine."
                  - "Die Wäsche kocht nicht, und trotzdem wird sie trocken."
                  - "Nein, Wasser verdunstet auch ohne zu kochen."
              - id: l2-f3
                type: sorting
                text: "Verdunstet hier Wasser, oder kondensiert es?"
                bins:
                  - { id: evap, show: { text: "verdunsten" }, say: "verdunsten" }
                  - { id: cond, show: { text: "kondensieren" }, say: "kondensieren" }
                options:
                  - { text: "Die Wäsche trocknet auf der Leine.", bin: evap }
                  - { text: "Der Spiegel im Bad beschlägt.", bin: cond }
                  - { text: "Eine Pfütze trocknet in der Sonne.", bin: evap }
                  - { text: "Ein kaltes Glas wird außen nass.", bin: cond }
                  - { text: "Nasse Haare werden trocken.", bin: evap }
                  - { text: "Am Topfdeckel hängen Tropfen.", bin: cond }
                hints:
                  - "Wird etwas trocken, oder wird es nass?"
                  - "Wird etwas trocken, geht Wasser in die Luft. Wird es nass, kommt Wasser aus der Luft."
                  - "Trocken werden: verdunsten. Nass werden, wo es kalt ist: kondensieren."
              - id: l2-f4
                type: image_multiple_choice
                text: "Wo wird gerade ganz schnell viel Wasser zu Wasserdampf?"
                options:
                  - { object: glass }
                  - { object: kettle }
                  - { object: bucket }
                answer: kettle
                hints:
                  - "Wo ist das Wasser am heißesten?"
                  - "Im Wasserkocher kocht das Wasser."
                  - "Kochendes Wasser im Wasserkocher wird schnell zu Wasserdampf."
              - id: l2-f5
                type: matching
                text: "Verbinde jedes Wort mit dem, was passiert."
                pairs:
                  - { left: { text: "gefrieren" }, right: { text: "flüssig wird fest" } }
                  - { left: { text: "schmelzen" }, right: { text: "fest wird flüssig" } }
                  - { left: { text: "verdunsten" }, right: { text: "flüssig wird gasförmig" } }
                  - { left: { text: "kondensieren" }, right: { text: "gasförmig wird flüssig" } }
                hints:
                  - "Fang mit den zwei Wörtern an, die du schon kennst."
                  - "Beim Verdunsten geht Wasser in die Luft, beim Kondensieren kommt es als Tropfen zurück."
                  - "Verdunsten: flüssig wird gasförmig. Kondensieren: gasförmig wird flüssig."
              - id: l2-f6
                type: multiple_choice
                text: "Bei welcher Temperatur kocht Wasser bei uns?"
                options: ["0 °C", "50 °C", "100 °C"]
                answer: "100 °C"
                hints:
                  - "Es ist eine sehr hohe Temperatur."
                  - "Bei 0 °C gefriert Wasser. Kochen ist das Gegenteil von kalt."
                  - "Wasser kocht bei 100 °C."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wann trocknet die Wäsche auf der Leine am schnellsten?"
                options: ["an einem warmen, windigen Tag", "an einem kalten, nassen Tag", "in einer nebligen Nacht"]
                answer: "an einem warmen, windigen Tag"
                hints: ["Was hilft dem Wasser beim Verdunsten?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Die weiße Wolke über dem Wasserkocher sind winzige Wassertröpfchen."
                answer: true
                hints: ["Kann man Wasserdampf sehen?"]
              - id: l2-s3
                type: ordering
                text: "Ein Eiswürfel liegt lange in der heißen Sonne. In welcher Reihenfolge ist er was?"
                say: "Ein Eiswürfel liegt lange in der heißen Sonne. In welcher Reihenfolge ist das Wasser was? Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Wasserdampf", "Eis", "Wasser"]
                slot_count: 3
                answer: ["Eis", "Wasser", "Wasserdampf"]
                hints: ["Zuerst schmilzt das Eis, dann verdunstet das Wasser."]
              - id: l2-s4
                type: multiple_choice
                text: "Ein Glas mit kalter Limo ist außen nass. Woher kommen die Tropfen?"
                options: ["aus dem Wasserdampf in der Luft", "Die Limo ist durch das Glas gesickert.", "Das Glas hat geweint."]
                answer: "aus dem Wasserdampf in der Luft"
                feedback:
                  "Die Limo ist durch das Glas gesickert.": "Durch Glas kommt keine Limo. Probier es mit kaltem Wasser: Die Tropfen außen schmecken nicht süß."
                  "Das Glas hat geweint.": "Gläser weinen nicht! Die Tropfen kommen von woanders."
                hints: ["Der Wasserdampf in der Luft trifft auf das kalte Glas."]
              - id: l2-s5
                type: true_false
