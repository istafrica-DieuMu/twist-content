# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.float-sink
skill: world.nature.float-sink
curriculum: de-DE
language: de
title:
  de: Schwimmt es oder sinkt es?
  en: Does it float or sink?
summary: >
  Whether a thing floats is not a question of big or small: a big apple
  floats, a small marble sinks. The material matters (wood, cork and wax
  float; metal, stone and glass sink), and so does air inside (a ball, a
  beach ball, a balloon). Shape matters too: a ball of modelling clay
  sinks, a boat of the same clay floats until water runs in, and a steel
  ship floats because it is hollow and full of air. Ice floats on water.
  The child predicts, gives a reason ("weil es aus Metall ist"), then sees
  the result; the real test stays in class or at home with an adult. The
  story: Jonas and Aylin hold a float-or-sink contest and then a bathtub
  boat race. Lesson 1 predicts by material and air; lesson 2 by shape and
  ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Wasser, en: Water }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.materials-sort]
  also_practises: [world.nature.materials-sort]
  vocabulary: { de: [schwimmen, sinken, vorhersagen, Vermutung, begründen, Stoff, Holz, Metall, Glas, Stein, Wachs, Kork, Luft, hohl, Form, Knete, Eis, Eisberg] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: predict, what: { de: "vorhersagen, ob ein Ding schwimmt oder sinkt", en: "predicting whether a thing floats or sinks" } }
    - { id: reason, what: { de: "die Vorhersage mit dem Stoff oder der Luft im Inneren begründen", en: "giving the material or the air inside as the reason" } }
    - { id: shape, what: { de: "erklären, wie die Form und das Eis das Schwimmen verändern", en: "explaining how shape changes floating, and why ice floats" } }
  misconceptions:
    - id: big-sinks-small-floats
      what: Thinks big or heavy things sink and small or light things float
      addressed: lesson 1 opens with the guess about the big apple and the small marble; l1-f3, l1-s1, l1-s6, l1-c5 and l2-c12
    - id: metal-never-floats
      what: Thinks nothing made of metal can float, so a steel ship is a puzzle
      addressed: lesson 2 opens with the guess about the ship and answers it with the hollow hull full of air; l2-f1, l2-f4, l2-n1, l2-c15 and l2-c20
    - id: same-material-same-result
      what: Thinks a material always floats or always sinks whatever its shape
      addressed: the lesson 2 screens on the clay ball and the clay boat; l2-f2, l2-s2, l2-c16
    - id: colour-as-reason
      what: Gives a reason that does not decide floating (colour, roundness)
      addressed: the lesson 1 screen on predicting with a reason; l1-f4, l1-s4, l1-n5, l2-c8 and l2-c11
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Groß, klein, schwimmt, sinkt", en: "Big, small, floats, sinks" }
    goal:
      de: "Sag vorher, ob ein Ding schwimmt oder sinkt, und begründe es. Ein Löffel sinkt zum Beispiel, weil er aus Metall ist."
      en: "Predict whether a thing floats or sinks, and say why. A spoon, for example, sinks because it is made of metal."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Woraus ist dieser Löffel?"
            show: { object: spoon }
            options: ["aus Metall", "aus Holz", "aus Papier"]
            answer: "aus Metall"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Was ist aus Holz?"
            options:
              - { object: marble }
              - { object: boat }
              - { object: spoon }
            answer: boat
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was schwimmt, der große Apfel oder die kleine Murmel?"
            say: "Jonas und Aylin machen einen Wettbewerb: Schwimmt es, oder sinkt es? Sie haben eine große Schüssel mit Wasser. Zuerst kommen ein großer Apfel und eine kleine Murmel dran. Was glaubst du: Was schwimmt, was sinkt?"
            show: { objects: [apple, marble] }
          - text: "Der große Apfel schwimmt. Die kleine Murmel sinkt."
            say: "Platsch! Der große Apfel schwimmt oben. Die kleine Murmel sinkt sofort auf den Boden. Groß oder klein, schwer oder leicht: Daran allein erkennst du es nicht. Ein riesiger Baumstamm schwimmt, und eine kleine Münze sinkt."
            show: { objects: [apple, marble] }
          - text: "Es kommt auf den Stoff an."
            say: "Wichtig ist, woraus ein Ding ist. Dinge aus Holz, Kork oder Wachs schwimmen meistens, so wie ein Bleistift, ein Korken oder eine Kerze. Auch Federn und Blätter schwimmen. Dinge aus Metall, Stein oder Glas sinken, so wie ein Löffel, ein Stein, ein Ring oder eine Murmel."
            show: { object: pencil }
          - text: "Luft im Inneren hilft beim Schwimmen."
            say: "Ein Ball, ein Wasserball und ein Luftballon sind voller Luft. Darum schwimmen sie oben. Auch im Apfel steckt Luft."
            show: { object: beach-ball }
          - text: "Wusstest du? Ein Apfel besteht zu ungefähr einem Viertel aus Luft."
            say: "Wusstest du? Ein Apfel besteht zu ungefähr einem Viertel aus Luft. Die Luft steckt in winzigen Räumen zwischen seinen Zellen. Darum schwimmt er, und darum kann man auf Kinderfesten nach Äpfeln tauchen, die oben im Wasser treiben."
            show: { object: apple }
          - text: "Sag vorher und begründe: „Ich glaube, es sinkt, weil es aus Metall ist.“"
            say: "Jetzt machst du es wie eine Forscherin oder ein Forscher. Du sagst vorher, ob ein Ding schwimmt oder sinkt, und du begründest es: Ich glaube, es sinkt, weil es aus Metall ist. Dann schaust du nach. Die Farbe oder ob etwas rund ist, sagt dir dabei nichts. Ausprobieren kannst du es mit einem Erwachsenen in einer Schüssel Wasser."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was schwimmt?"
                options:
                  - { object: marble }
                  - { object: stone }
                  - { object: pencil }
                answer: pencil
                hints:
                  - "Woraus ist jedes Ding?"
                  - "Glas und Stein sinken."
                  - "Der Bleistift ist aus Holz. Er schwimmt."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Schwimmt es, oder sinkt es?"
                say: "Jonas und Aylin testen weiter. Schwimmt es, oder sinkt es? Sortiere."
                bins:
                  - { id: float, show: { text: "schwimmt" }, say: "schwimmt" }
                  - { id: sink, show: { text: "sinkt" }, say: "sinkt" }
                options:
                  - { object: apple, bin: float }
                  - { object: ring, bin: sink }
                  - { object: candle, bin: float }
                  - { object: spoon, bin: sink }
                  - { object: beach-ball, bin: float }
                  - { object: stone, bin: sink }
                hints:
                  - "Frag bei jedem Ding: Woraus ist es? Ist Luft drin?"
                  - "Metall und Stein sinken. Wachs schwimmt, Luft hilft beim Schwimmen."
                  - "Schwimmt: Apfel, Kerze, Wasserball. Sinkt: Ring, Löffel, Stein."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Große Dinge sinken immer, kleine Dinge schwimmen immer."
                answer: false
                feedback:
                  "true": "Der große Apfel schwimmt, die kleine Murmel sinkt. Die Größe entscheidet nicht."
                hints:
                  - "Denk an den Apfel und die Murmel."
                  - "Der große Apfel ist oben geblieben."
                  - "Nein, groß oder klein entscheidet nicht."
              - id: l1-f4
                type: multiple_choice
                text: "Aylin sagt: „Ich glaube, der Löffel sinkt.“ Welche Begründung passt?"
                show: { object: spoon }
                options: ["weil er aus Metall ist", "weil er glänzt", "weil man damit Suppe isst"]
                answer: "weil er aus Metall ist"
                feedback:
                  "weil man damit Suppe isst": "Mit Suppe hat das nichts zu tun! Schau, woraus der Löffel ist."
                hints:
                  - "Was entscheidet: die Farbe, der Glanz oder der Stoff?"
                  - "Es kommt auf den Stoff an."
                  - "Der Löffel ist aus Metall, und Metall sinkt."
              - id: l1-f5
                type: matching
                text: "Warum schwimmt oder sinkt es? Verbinde."
                pairs:
                  - { left: { object: pencil }, right: { text: "aus Holz" } }
                  - { left: { object: spoon }, right: { text: "aus Metall" } }
                  - { left: { object: beach-ball }, right: { text: "voller Luft" } }
                hints:
                  - "Woraus ist jedes Ding gemacht?"
                  - "Im Wasserball ist etwas, das du nicht siehst."
                  - "Bleistift: Holz. Löffel: Metall. Wasserball: Luft."
              - id: l1-f6
                type: multiple_choice
                text: "Ein Holzklotz kommt ins Wasser. Was sagst du vorher?"
                options: ["Er schwimmt, weil er aus Holz ist.", "Er sinkt, weil er hart ist.", "Er sinkt, weil er eckig ist."]
                answer: "Er schwimmt, weil er aus Holz ist."
                hints:
                  - "Was macht Holz im Wasser meistens?"
                  - "Hart oder eckig entscheidet nicht, der Stoff entscheidet."
                  - "Holz schwimmt meistens. Der Holzklotz schwimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Die Murmel ist klein und leicht, also schwimmt sie."
                answer: false
                feedback:
                  "true": "Die Murmel ist aus Glas, und Glas sinkt, auch wenn das Ding klein ist."
                hints: ["Woraus ist die Murmel?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Was sinkt?"
                options:
                  - { object: feather }
                  - { object: ball }
                  - { object: anchor }
                answer: anchor
                hints: ["Welches Ding ist aus Metall?"]
              - id: l1-s3
                type: sorting
                text: "Schwimmt es, oder sinkt es? Sortiere."
                bins:
                  - { id: float, show: { text: "schwimmt" }, say: "schwimmt" }
                  - { id: sink, show: { text: "sinkt" }, say: "sinkt" }
                options:
                  - { text: "Korken", bin: float }
                  - { text: "Schlüssel", bin: sink }
                  - { object: leaf, bin: float }
                  - { object: ring, bin: sink }
                  - { object: balloon, bin: float }
                hints: ["Kork, Blätter und Luft schwimmen, Metall sinkt."]
              - id: l1-s4
                type: multiple_choice
                text: "Warum schwimmt der Wasserball?"
                show: { object: beach-ball }
                options: ["Er ist voller Luft.", "Er ist bunt.", "Er ist rund."]
                answer: "Er ist voller Luft."
                hints: ["Eine Murmel ist auch rund und sinkt. Was ist im Wasserball drin?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Eine Kerze aus Wachs schwimmt."
                answer: true
                hints: ["Was weißt du über Wachs im Wasser?"]
              - id: l1-s6
                type: multiple_choice
                text: "Jonas testet eine kleine Münze und einen dicken Holzast. Was sagst du vorher?"
                options: ["Die Münze sinkt, der Ast schwimmt.", "Beide sinken, weil der Ast schwer ist.", "Die Münze schwimmt, weil sie klein ist."]
                answer: "Die Münze sinkt, der Ast schwimmt."
                hints: ["Schau auf den Stoff: Metall und Holz."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: sorting
                text: "Aylins Wettbewerbs-Kiste: Was schwimmt, was sinkt?"
                bins:
                  - { id: float, show: { text: "schwimmt" }, say: "schwimmt" }
                  - { id: sink, show: { text: "sinkt" }, say: "sinkt" }
                options:
                  - { text: "Holzlöffel", bin: float }
                  - { text: "Metallschraube", bin: sink }
                  - { text: "Kieselstein", bin: sink }
                  - { text: "Tischtennisball", bin: float }
                  - { object: feather, bin: float }
              - id: l1-n2
                type: multiple_choice
                text: "Aylin legt eine Glasmurmel ins Wasser. Was passiert, und warum?"
                options: ["Sie sinkt, weil sie aus Glas ist.", "Sie schwimmt, weil sie klein ist.", "Sie schwimmt, weil sie rund ist."]
                answer: "Sie sinkt, weil sie aus Glas ist."
              - id: l1-n3
                type: true_false
                text: "Jonas sagt: „Ein Ball voller Luft schwimmt oben.“ Stimmt das?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Welches Ding sinkt auf den Boden der Schüssel?"
                options:
                  - { object: apple }
                  - { object: leaf }
                  - { object: ring }
                answer: ring
              - id: l1-n5
                type: multiple_choice
                text: "Welche Vorhersage ist gut begründet?"
                options: ["Die Kerze schwimmt, weil sie aus Wachs ist.", "Die Kerze sinkt, weil sie weiß ist.", "Die Kerze schwimmt, weil sie lang ist."]
                answer: "Die Kerze schwimmt, weil sie aus Wachs ist."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was schwimmt?"
            options:
              - { object: spoon }
              - { object: apple }
              - { object: stone }
            answer: apple
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Löffel aus Metall sinkt."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Warum schwimmt der Bleistift?"
            options: ["Er ist aus Holz.", "Er ist lang.", "Er ist spitz."]
            answer: "Er ist aus Holz."
          - id: l1-c4
            type: sorting
            text: "Schwimmt es oder sinkt es?"
            bins:
              - { id: float, show: { text: "schwimmt" }, say: "schwimmt" }
              - { id: sink, show: { text: "sinkt" }, say: "sinkt" }
            options:
              - { object: candle, bin: float }
              - { object: marble, bin: sink }
              - { object: ball, bin: float }
              - { object: anchor, bin: sink }
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Ein großer Baumstamm ist schwer, darum sinkt er."
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Was hilft einem Ball, oben zu schwimmen?"
            options: ["die Luft in ihm", "seine Farbe", "sein Name"]
            answer: "die Luft in ihm"

  - n: 2
    title: { de: "Ein Schiff aus Metall?", en: "A ship made of metal?" }
    goal:
      de: "Finde heraus, wie die Form das Schwimmen verändert. Eine Kugel aus Knete sinkt zum Beispiel, ein Boot aus Knete schwimmt."
      en: "Find out how shape changes floating. A ball of modelling clay, for example, sinks, and a boat of clay floats."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was sinkt im Wasser?"
            options:
              - { object: pencil }
              - { object: marble }
              - { object: beach-ball }
            answer: marble
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Ein Apfel schwimmt."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wie kann ein riesiges Schiff aus Metall schwimmen?"
            say: "Jonas und Aylin sehen im Hafen ein riesiges Schiff. Es ist aus Stahl, und Stahl ist ein Metall. Aber ein Löffel aus Metall sinkt doch! Was glaubst du: Wie kann das Schiff schwimmen?"
            show: { object: ship }
          - text: "Das Schiff ist innen hohl und voller Luft."
            say: "Das Schiff ist kein fester Klotz aus Metall. Es ist innen hohl, wie eine riesige Schüssel, und voller Luft. So drückt es viel Wasser zur Seite, und das Wasser trägt es. Darum schwimmt es."
            show: { object: ship }
          - text: "Was glaubst du: Schwimmt eine Kugel aus Knete?"
            say: "Jetzt testen Aylin und Jonas selbst, für ihr Bootsrennen in der Badewanne. Aylin rollt Knete zu einer festen Kugel und legt sie ins Wasser. Was glaubst du: Schwimmt sie?"
            show: { object: bath }
          - text: "Die Kugel sinkt. Ein Boot aus derselben Knete schwimmt."
            say: "Die Knetkugel sinkt. Dann formt Aylin aus derselben Knete ein flaches Boot mit hohem Rand. Das Knetboot schwimmt! Es ist dieselbe Knete, nur die Form ist anders. Im Boot ist Luft, und es drückt mehr Wasser zur Seite. Läuft aber Wasser hinein, sinkt es. Auch die Form entscheidet also."
          - text: "Eis schwimmt auf dem Wasser."
            say: "Die Eiswürfel in Jonas' Saft schwimmen oben. Eis ist leichter als die gleiche Menge Wasser. Darum friert ein See von oben zu, und die Fische können unten im Wasser den Winter überstehen."
          - text: "Wusstest du? Von einem Eisberg siehst du nur ungefähr ein Zehntel."
            say: "Wusstest du? Ein Eisberg schwimmt im Meer, aber nur ungefähr ein Zehntel von ihm schaut aus dem Wasser. Der viel größere Teil ist unter Wasser versteckt. Darum müssen Schiffe einen großen Bogen um Eisberge machen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum schwimmt ein Schiff aus Metall?"
                options: ["Es ist innen hohl und voller Luft.", "Metall schwimmt immer.", "Der Kapitän hält es fest."]
                answer: "Es ist innen hohl und voller Luft."
                feedback:
                  "Der Kapitän hält es fest.": "Ein ganzes Schiff festhalten? So stark ist kein Kapitän! Schau, was im Schiff ist."
                  "Metall schwimmt immer.": "Ein Löffel aus Metall sinkt. Beim Schiff ist etwas anders."
                hints:
                  - "Ist das Schiff innen voll Metall?"
                  - "Das Schiff ist hohl wie eine Schüssel."
                  - "Es ist hohl und voller Luft, darum schwimmt es."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Eine Kugel aus Knete sinkt. Ein Boot aus derselben Knete kann schwimmen."
                answer: true
                hints:
                  - "Was hat Aylin mit der Knete gemacht?"
                  - "Die Form ist anders, und im Boot ist Luft."
                  - "Ja, das Knetboot schwimmt."
              - id: l2-f3
                type: sorting
                text: "Schwimmt es, oder sinkt es?"
                say: "Neue Tests für das Bootsrennen. Schwimmt es, oder sinkt es?"
                bins:
                  - { id: float, show: { text: "schwimmt" }, say: "schwimmt" }
                  - { id: sink, show: { text: "sinkt" }, say: "sinkt" }
                options:
                  - { text: "Knetkugel", bin: sink }
                  - { text: "Knetboot", bin: float }
                  - { text: "Eiswürfel", bin: float }
                  - { object: spoon, bin: sink }
                  - { object: ship, bin: float }
                  - { object: anchor, bin: sink }
                hints:
                  - "Ist das Ding hohl und voller Luft, oder ist es ein fester Klotz?"
                  - "Knetboot und Schiff sind hohl. Eis ist leichter als Wasser."
                  - "Schwimmt: Knetboot, Eiswürfel, Schiff. Sinkt: Knetkugel, Löffel, Anker."
              - id: l2-f4
                type: image_multiple_choice
                text: "Was schwimmt, obwohl es aus Metall ist?"
                options:
                  - { object: spoon }
                  - { object: anchor }
                  - { object: ship }
                answer: ship
                hints:
                  - "Welches Ding ist innen hohl?"
                  - "Löffel und Anker sind feste Metallstücke."
                  - "Das Schiff ist hohl und schwimmt."
              - id: l2-f5
                type: multiple_choice
                text: "In Aylins Knetboot läuft Wasser. Was passiert?"
                options: ["Es sinkt.", "Es schwimmt schneller.", "Es wird größer."]
                answer: "Es sinkt."
                hints:
                  - "Was war im Boot, bevor das Wasser kam?"
                  - "Das Wasser verdrängt die Luft aus dem Boot."
                  - "Ohne die Luft sinkt das Boot."
              - id: l2-f6
                type: matching
                text: "Warum schwimmt es? Verbinde."
                pairs:
                  - { left: { object: ship }, right: { text: "hohl und voller Luft" } }
                  - { left: { text: "Eiswürfel" }, right: { text: "leichter als die gleiche Menge Wasser" } }
                  - { left: { object: pencil }, right: { text: "aus Holz" } }
                hints:
                  - "Bei jedem Ding gibt es einen anderen Grund."
                  - "Das Schiff ist aus Metall, aber hohl."
                  - "Schiff: hohl. Eis: leichter als Wasser. Bleistift: Holz."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Eiswürfel sinken im Saft auf den Boden."
                answer: false
                feedback:
                  "true": "Eis ist leichter als die gleiche Menge Wasser. Die Eiswürfel schwimmen oben."
                hints: ["Schau in ein Glas mit Eiswürfeln: Wo sind sie?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie bekommt Jonas seine Knetkugel zum Schwimmen?"
                options: ["Er formt ein Boot mit hohem Rand.", "Er drückt die Kugel noch fester.", "Er malt sie blau an."]
                answer: "Er formt ein Boot mit hohem Rand."
                hints: ["Nicht der Stoff ändert sich, sondern die Form."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Was schwimmt wegen der Luft in ihm?"
                options:
                  - { object: marble }
                  - { object: balloon }
                  - { object: ring }
                answer: balloon
                hints: ["Welches Ding ist aufgeblasen?"]
              - id: l2-s4
                type: sorting
                text: "Warum schwimmt es?"
                say: "Warum schwimmt es? Wegen seines Stoffs, oder wegen der Luft in ihm?"
                bins:
                  - { id: material, show: { text: "wegen des Stoffs" }, say: "wegen des Stoffs" }
                  - { id: air, show: { text: "wegen der Luft" }, say: "wegen der Luft" }
                options:
                  - { object: pencil, bin: material }
                  - { object: candle, bin: material }
                  - { object: beach-ball, bin: air }
                  - { object: ship, bin: air }
                  - { object: balloon, bin: air }
                hints: ["Holz und Wachs schwimmen von selbst. Was ist hohl oder aufgeblasen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Warum friert ein See im Winter von oben zu?"
                options: ["Weil Eis auf dem Wasser schwimmt.", "Weil die Fische unten heizen.", "Weil Eis schwerer ist als Wasser."]
                answer: "Weil Eis auf dem Wasser schwimmt."
                hints: ["Wo sind die Eiswürfel im Saft?"]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? Ob etwas schwimmt, hängt nur davon ab, wie schwer es ist."
                answer: false
                feedback:
                  "true": "Das schwere Schiff schwimmt, die leichte Murmel sinkt. Stoff, Luft und Form entscheiden."
                hints: ["Denk an das schwere Schiff."]

          - support: none
            setting: in-context
            tasks:
