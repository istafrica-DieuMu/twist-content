# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.bridges
skill: world.technology.bridges
curriculum: de-DE
language: de
title:
  de: Brücken
  en: Bridges
summary: >
  Bridges come in a few forms, and each is strong for its own reason. The
  story: Can's class holds a bridge contest with paper bridges between two
  piles of books, and their teacher Frau Yilmaz shows photos of real
  bridges. Lesson 1 is the beam bridge: a beam bends most in the middle,
  the longer the more; piers (Pfeiler) shorten each span; a board on its
  edge and folded paper carry more with the same material. Lesson 2
  compares the arch (the load presses the stones together and goes into
  the banks), the truss of triangles, and the suspension bridge (the deck
  hangs from cables over towers, the longest reach), says which form fits
  which place, and ends with the skill check. Building and testing models
  stays in class; Twist teaches the idea and the prediction.
metadata:
  year: klasse-3
  topic: { de: Wie Technik funktioniert, en: How things work }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.technology.stable-building]
  also_practises: []
  vocabulary: { de: [Brücke, Balken, Balkenbrücke, Pfeiler, Ufer, durchbiegen, hochkant, Ziehharmonika, Bogen, Bogenbrücke, Fachwerk, Fachwerkbrücke, Hängebrücke, Seil, Turm, Dreieck, Strebe, stabil] }
  forms: [text, audio, picture, drawn]
  drawn: [shape, grid]
  facets: []
  parts:
    - { id: beam, what: { de: "sagen, wo und warum sich eine Balkenbrücke durchbiegt und wie Pfeiler helfen", en: "saying where and why a beam bridge bends and how piers help" } }
    - { id: shape, what: { de: "erklären, dass eine gute Form stabiler macht als mehr Material (falten, hochkant, Dreiecke)", en: "explaining that a good shape makes things stronger than more material (folding, on edge, triangles)" } }
    - { id: forms, what: { de: "Balken-, Bogen-, Fachwerk- und Hängebrücke erkennen", en: "recognising beam, arch, truss and suspension bridges" } }
    - { id: why, what: { de: "sagen, warum eine Brückenform stabil ist und wofür sie passt", en: "saying why a bridge form is strong and what it suits" } }
  misconceptions:
    - id: more-material
      what: Thinks only more or thicker material makes a bridge stronger, not its shape
      addressed: lesson 1 opens with the guess about the flat and the folded paper bridge; l1-f2, l1-s3, l1-n4, l1-c5, l2-c6, l2-c9
    - id: arch-falls
      what: Thinks the stones of an arch fall out under a heavy load
      addressed: lesson 2 opens with the guess about the stone arch and answers it with the stones pressed together; l2-f2, l2-s4, l2-n3, l2-c16
    - id: long-is-strong
      what: Thinks a longer beam is as strong as a short one
      addressed: the beam bridge screen in lesson 1; l1-f5, l1-s2, l1-n5, l2-c4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Die Balkenbrücke", en: "The beam bridge" }
    goal:
      de: "Finde heraus, warum sich eine Brücke durchbiegt und was sie stabiler macht. Ein gefaltetes Blatt Papier trägt zum Beispiel viel mehr als ein flaches."
      en: "Find out why a bridge bends and what makes it stronger. A folded sheet of paper, for example, carries much more than a flat one."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wann steht ein Turm aus Klötzen besonders fest?"
            options: ["wenn er unten breit ist", "wenn er unten schmal ist", "wenn die schweren Klötze oben liegen"]
            answer: "wenn er unten breit ist"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Ein Dreieck aus Stäben wird schief, wenn man auf eine Ecke drückt."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Welche Papierbrücke trägt mehr Münzen?"
            say: "Cans Klasse macht einen Brückenwettbewerb. Jede Gruppe legt ein Blatt Papier als Brücke über eine Lücke zwischen zwei Bücherstapeln. Gruppe A legt ihr Blatt flach hin. Gruppe B faltet ihr Blatt vorher wie eine Ziehharmonika. Was glaubst du: Welche Brücke trägt mehr Münzen?"
            show: { object: book }
          - text: "Die gefaltete Brücke trägt viel mehr."
            say: "Das flache Blatt biegt sich schon bei einer Münze durch. Das gefaltete Blatt trägt viele Münzen. Es ist dasselbe Papier, nur die Form ist anders. Eine gute Form macht ein Bauteil stabil, ohne dass man mehr Material braucht."
          - text: "Die Balkenbrücke biegt sich in der Mitte durch."
            say: "Die einfachste Brücke ist ein Balken, der auf beiden Ufern aufliegt. Das ist eine Balkenbrücke, wie ein Baumstamm über einem Bach. Fährt etwas Schweres darüber, biegt sich der Balken in der Mitte nach unten. Je länger der Balken ist, desto mehr biegt er sich durch."
            show: { object: beam-bridge }
          - text: "Pfeiler stützen die Brücke von unten."
            say: "Darum stehen unter langen Balkenbrücken Pfeiler. Ein Pfeiler ist eine dicke Stütze, die die Brücke von unten trägt. Mit Pfeilern ist jedes Stück der Brücke kürzer, und es biegt sich weniger."
            show: { object: pier-bridge }
          - text: "Hochkant trägt ein Brett mehr als flach."
            say: "Leg ein Brett flach über eine Lücke, und es biegt sich leicht. Stell dasselbe Brett hochkant, also auf seine schmale Kante, und es biegt sich kaum. Auch ein Blatt Papier mit hochgefalteten Rändern trägt mehr als ein flaches. Wieder macht die Form den Unterschied."
            show: { object: plank }
          - text: "Wusstest du? Die längste Brücke der Welt ist mehr als 160 Kilometer lang."
            say: "Wusstest du? Die längste Brücke der Welt ist mehr als 160 Kilometer lang. Sie steht in China, auf ihr fahren Züge, und sie ruht auf sehr vielen Pfeilern."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein Lastwagen fährt über eine lange Balkenbrücke. Was passiert mit dem Balken?"
                show: { object: lorry }
                options: ["Er biegt sich in der Mitte durch.", "Er wird länger.", "Er wird leichter."]
                answer: "Er biegt sich in der Mitte durch."
                hints:
                  - "Denk an das flache Blatt Papier mit der Münze darauf."
                  - "Der Balken liegt nur an den Ufern auf. In der Mitte stützt ihn nichts."
                  - "Er biegt sich in der Mitte nach unten durch."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Eine gute Form kann ein Bauteil stabiler machen, ohne dass man mehr Material braucht."
                answer: true
                hints:
                  - "Denk an die zwei Papierbrücken aus Cans Klasse."
                  - "Beide Gruppen hatten ein einziges Blatt."
                  - "Ja, das gefaltete Blatt trug mehr, nur durch die Form."
              - id: l1-f3
                type: sorting
                text: "Stabiler oder wackeliger?"
                say: "Sortiere. Was macht eine Balkenbrücke stabiler, was macht sie wackeliger?"
                bins:
                  - { id: stronger, show: { text: "stabiler" }, say: "stabiler" }
                  - { id: weaker, show: { text: "wackeliger" }, say: "wackeliger" }
                options:
                  - { text: "ein Pfeiler in der Mitte", bin: stronger }
                  - { text: "ein längerer Balken ohne Stütze", bin: weaker }
                  - { text: "das Brett hochkant stellen", bin: stronger }
                  - { text: "ein dünneres Brett", bin: weaker }
                  - { text: "Papier mit gefalteten Rändern", bin: stronger }
                  - { text: "ein flaches Blatt", bin: weaker }
                hints:
                  - "Biegt sich die Brücke dadurch mehr oder weniger durch?"
                  - "Pfeiler und eine gute Form helfen. Lange, dünne Teile biegen sich."
                  - "Stabiler: Pfeiler, hochkant, gefaltete Ränder. Wackeliger: langer Balken, dünnes Brett, flaches Blatt."
              - id: l1-f4
                type: multiple_choice
                text: "Wie heißt die dicke Stütze unter einer Brücke?"
                options: ["der Pfeiler", "der Balken", "das Ufer"]
                answer: "der Pfeiler"
                hints:
                  - "Sie trägt die Brücke von unten."
                  - "Der Balken liegt oben, das Ufer ist das Land am Rand des Wassers."
                  - "Die Stütze heißt Pfeiler."
              - id: l1-f5
                type: fill_in_blank
                text: "Die Balken-Regel"
                say: "Setz das passende Wort ein."
                frame: "Je _ der Balken ist, desto mehr biegt er sich durch."
                options: ["länger", "kürzer"]
                answer: ["länger"]
                hints:
                  - "Stell dir einen Baumstamm über einem schmalen und einem breiten Bach vor."
                  - "Über dem breiten Bach ist der Stamm länger und biegt sich mehr."
                  - "Je länger, desto mehr."
              - id: l1-f6
                type: matching
                text: "Was ist was an einer Brücke? Verbinde."
                pairs:
                  - { left: { text: "Balken" }, right: { text: "liegt auf beiden Ufern auf" } }
                  - { left: { text: "Pfeiler" }, right: { text: "stützt die Brücke von unten" } }
                  - { left: { text: "Ufer" }, right: { text: "das Land am Rand des Wassers" } }
                hints:
                  - "Denk an einen Baumstamm über einem Bach."
                  - "Der Stamm ist der Balken. Er liegt auf dem Land links und rechts."
                  - "Balken: liegt auf. Pfeiler: stützt. Ufer: Land am Wasser."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Can legt ein Holzbrett über die Lücke. Wie trägt es mehr?"
                show: { object: plank }
                options: ["hochkant gestellt", "flach hingelegt", "Das ist egal."]
                answer: "hochkant gestellt"
                hints: ["Auf welcher Seite biegt sich ein Brett kaum?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Ein langer Balken ohne Pfeiler biegt sich weniger als ein kurzer."
                answer: false
                feedback:
                  "true": "Es ist umgekehrt: Je länger der Balken, desto mehr biegt er sich."
                hints: ["Je länger, desto ...?"]
              - id: l1-s3
                type: multiple_choice
                text: "Gruppe C legt zwei flache Blätter übereinander. Gruppe B faltet ein einziges Blatt wie eine Ziehharmonika. Welche Brücke trägt mehr?"
                options: ["die gefaltete von Gruppe B", "die zwei flachen Blätter von Gruppe C", "Beide tragen gleich viel."]
                answer: "die gefaltete von Gruppe B"
                feedback:
                  "die zwei flachen Blätter von Gruppe C": "Mehr Papier allein hilft wenig. Auch zwei flache Blätter biegen sich schnell durch."
                hints: ["Was hilft mehr: mehr Papier oder eine bessere Form?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? Pfeiler machen die Stücke einer Brücke kürzer."
                answer: true
                hints: ["Ein Pfeiler in der Mitte teilt die Brücke."]
              - id: l1-s5
                type: fill_in_blank
                text: "Warum hat die Brücke Pfeiler?"
                say: "Setz die passenden Wörter ein."
                frame: "Unter langen Brücken stehen _, damit sie sich nicht so stark _."
                options: ["Pfeiler", "Häuser", "durchbiegen", "drehen"]
                answer: ["Pfeiler", "durchbiegen"]
                hints: ["Was tut ein langer Balken, wenn etwas Schweres darüberfährt?"]
              - id: l1-s6
                type: sorting
                text: "Biegt sich stark oder kaum?"
                say: "Sortiere. Was biegt sich stark durch, was kaum?"
                bins:
                  - { id: much, show: { text: "biegt sich stark" }, say: "biegt sich stark" }
                  - { id: little, show: { text: "biegt sich kaum" }, say: "biegt sich kaum" }
                options:
                  - { text: "ein dünnes Brett, flach", bin: much }
                  - { text: "dasselbe Brett, hochkant", bin: little }
                  - { text: "ein flaches Blatt Papier", bin: much }
                  - { text: "ein Blatt, gefaltet wie eine Ziehharmonika", bin: little }
                hints: ["Wo hilft die Form?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Gruppe D hat nur ein Blatt Papier. Ihre Brücke soll über eine breite Lücke reichen. Was rätst du ihr?"
                options: ["Falte das Blatt wie eine Ziehharmonika.", "Leg das Blatt flach hin.", "Schneide das Blatt in der Mitte durch."]
                answer: "Falte das Blatt wie eine Ziehharmonika."
                feedback:
                  "Schneide das Blatt in der Mitte durch.": "Dann reicht die Brücke nur noch bis zur Mitte. Platsch!"
              - id: l1-n2
                type: true_false
                text: "Can sagt: „Unsere Brücke biegt sich in der Mitte durch. Ein Stapel Bücher als Stütze in der Mitte hilft.“ Stimmt das?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Frau Yilmaz zeigt ein Foto: Eine lange Brücke führt über ein breites Tal. Darunter stehen viele hohe Stützen. Wie heißen sie?"
                show: { object: pier-bridge }
                options: ["Pfeiler", "Balken", "Ufer"]
                answer: "Pfeiler"
              - id: l1-n4
                type: fill_in_blank
                text: "Die Regel der Siegergruppe"
                say: "Setz das passende Wort ein."
                frame: "Nicht mehr Papier, sondern eine bessere _ macht die Brücke stabil."
                options: ["Form", "Farbe"]
                answer: ["Form"]
              - id: l1-n5
                type: multiple_choice
                text: "Welche Brücke biegt sich am stärksten durch?"
                options: ["ein langer, dünner Balken ohne Pfeiler", "ein kurzer, dicker Balken", "ein langer Balken auf vielen Pfeilern"]
                answer: "ein langer, dünner Balken ohne Pfeiler"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Stimmt das? Ein Blatt Papier trägt flach mehr als gefaltet."
            answer: false
          - id: l1-c2
            type: multiple_choice
            text: "Was stützt eine lange Balkenbrücke von unten?"
            show: { object: pier-bridge }
            options: ["Pfeiler", "Wolken", "Fahnen"]
            answer: "Pfeiler"
          - id: l1-c3
            type: multiple_choice
            text: "Wo biegt sich ein Balken über einem Bach am stärksten durch?"
            options: ["in der Mitte", "an den Ufern", "nirgends"]
            answer: "in der Mitte"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Ein Brett hochkant biegt sich weniger als flach."
            show: { object: plank }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Was macht eine Papierbrücke stabiler, ohne dass man mehr Papier braucht?"
            options: ["eine bessere Form", "eine bunte Farbe", "ein längeres Blatt"]
            answer: "eine bessere Form"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Ein Baumstamm, der auf beiden Ufern eines Bachs aufliegt, ist eine Balkenbrücke."
            answer: true

  - n: 2
    title: { de: "Bogen, Dreiecke und Seile", en: "Arches, triangles and cables" }
    goal:
      de: "Vergleiche Bogenbrücke, Fachwerkbrücke und Hängebrücke und sag, warum jede stabil ist. Bei der Hängebrücke hängt die Straße zum Beispiel an dicken Seilen."
      en: "Compare arch, truss and suspension bridges and say why each one is strong. On a suspension bridge, for example, the road hangs from thick cables."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was macht eine lange Balkenbrücke stabiler?"
            show: { object: beam-bridge }
            options: ["ein Pfeiler in der Mitte", "ein noch längerer Balken", "ein dünneres Brett"]
            answer: "ein Pfeiler in der Mitte"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Ein langer Balken biegt sich in der Mitte durch."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Fallen die Steine aus dem Bogen?"
            say: "Frau Yilmaz zeigt ein Foto einer alten Brücke aus Steinen. Die Steine liegen in einem runden Bogen über dem Fluss. Was glaubst du: Fallen die Steine heraus, wenn ein schwerer Wagen über die Brücke fährt?"
            show: { object: bridge }
          - text: "Nein! Das Gewicht drückt die Steine fest zusammen."
            say: "Nein. Jeder Stein im Bogen ist oben etwas breiter als unten, wie ein Keil. Drückt das Gewicht von oben, pressen sich die Steine fest aneinander. Der Bogen leitet das Gewicht zur Seite und nach unten in die Ufer. Darum braucht eine Bogenbrücke feste Ufer, die nicht nachgeben."
            show: { object: bridge }
          - text: "Wusstest du? In Rom gibt es eine Steinbrücke, die mehr als 2000 Jahre alt ist."
            say: "Wusstest du? In Rom gibt es eine Bogenbrücke aus Stein, die mehr als 2000 Jahre alt ist. Die Römer haben sie gebaut, und noch heute gehen Menschen über sie."
            show: { object: bridge }
          - text: "Die Fachwerkbrücke: viele Dreiecke"
            say: "Viele Eisenbahnbrücken sind aus Stahlstäben gebaut, die zusammen viele Dreiecke bilden. Das heißt Fachwerk. Du weißt schon: Ein Dreieck verschiebt sich nicht, wenn man auf eine Ecke drückt. Darum ist eine Fachwerkbrücke leicht und trotzdem sehr stabil."
            show: { drawn: grid, cols: 6, rows: 2, dots: true, lines: [[0, 2, 6, 2], [1, 0, 5, 0], [0, 2, 1, 0], [1, 0, 2, 2], [2, 2, 3, 0], [3, 0, 4, 2], [4, 2, 5, 0], [5, 0, 6, 2]] }
          - text: "Die Hängebrücke: Die Fahrbahn hängt an Seilen."
            say: "Bei einer Hängebrücke stehen zwei hohe Türme. Über die Türme laufen dicke Seile, und ihre Enden sind fest im Boden verankert. An diesen Seilen hängt die Fahrbahn. Bei großen Hängebrücken besteht jedes dicke Seil aus Tausenden dünnen Drähten. Hängebrücken reichen besonders weit, auch über breite Flüsse und Meeresbuchten."
            show: { object: suspension-bridge }
          - text: "Jede Brückenform hat ihre Stärke."
            say: "Eine Balkenbrücke ist einfach zu bauen und passt für kurze Strecken. Ein Bogen trägt schwere Lasten, wenn die Ufer fest sind. Ein Fachwerk aus Dreiecken ist leicht und fest. Und eine Hängebrücke reicht am weitesten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Form macht eine Fachwerkbrücke stabil?"
                options:
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: triangle
                hints:
                  - "Welche Form verschiebt sich nicht, wenn man auf eine Ecke drückt?"
                  - "Ein Viereck aus Stäben wird schief."
                  - "Das Dreieck."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ein schwerer Wagen fährt über eine Bogenbrücke aus Steinen. Was passiert mit den Steinen?"
                show: { object: bridge }
                options: ["Sie werden fest zusammengedrückt.", "Sie fallen heraus.", "Sie werden weich."]
                answer: "Sie werden fest zusammengedrückt."
                hints:
                  - "Die Steine sind oben breiter als unten, wie Keile."
                  - "Das Gewicht drückt von oben auf die Keile."
                  - "Die Steine pressen sich fest aneinander."
              - id: l2-f3
                type: matching
                text: "Verbinde jede Brücke mit ihrem Merkmal."
                pairs:
                  - { left: { object: beam-bridge }, right: { text: "liegt auf den Ufern auf" } }
                  - { left: { object: bridge }, right: { text: "Steine in einem runden Bogen" } }
                  - { left: { object: truss-bridge }, right: { text: "Stäbe in vielen Dreiecken" } }
                  - { left: { object: suspension-bridge }, right: { text: "Fahrbahn hängt an Seilen" } }
                hints:
                  - "Der Name sagt schon viel: Bogen, Fachwerk, hängen."
                  - "Fachwerk heißt: viele Dreiecke aus Stäben."
                  - "Balken: liegt auf. Bogen: Steine im Bogen. Fachwerk: Dreiecke. Hänge: Seile."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Bei einer Hängebrücke hängt die Fahrbahn an dicken Seilen."
                show: { object: suspension-bridge }
                answer: true
                hints:
                  - "Der Name sagt es schon."
                  - "Über hohe Türme laufen Seile, und daran hängt etwas."
                  - "Ja, die Fahrbahn hängt an den Seilen."
              - id: l2-f5
                type: fill_in_blank
                text: "So trägt der Bogen."
                say: "Setz die passenden Wörter ein."
                frame: "Ein Bogen leitet das Gewicht in die _. Darum müssen sie _ sein."
                options: ["Ufer", "Wolken", "fest", "weich"]
                answer: ["Ufer", "fest"]
                hints:
                  - "Wohin drückt der Bogen an seinen Enden?"
                  - "Die Enden des Bogens stehen auf dem Land links und rechts."
                  - "In die Ufer, und die müssen fest sein."
              - id: l2-f6
                type: multiple_choice
                text: "Mit welcher Brückenform kann man am weitesten über breites Wasser bauen?"
                options: ["mit einer Hängebrücke", "mit einer Balkenbrücke ohne Pfeiler", "mit einer Brücke aus Papier"]
                answer: "mit einer Hängebrücke"
                hints:
                  - "Ein langer Balken ohne Pfeiler biegt sich stark durch."
                  - "Die Fahrbahn kann an Seilen von hohen Türmen hängen."
                  - "Die Hängebrücke reicht am weitesten."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum ist ein Fachwerk aus Dreiecken so stabil?"
                show: { object: truss-bridge }
                options: ["Ein Dreieck verschiebt sich nicht.", "Dreiecke sind besonders schwer.", "Dreiecke sehen spitz aus."]
                answer: "Ein Dreieck verschiebt sich nicht."
                hints: ["Was passiert, wenn du auf die Ecke eines Dreiecks aus Stäben drückst?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Eine Bogenbrücke braucht feste Ufer."
                show: { object: bridge }
                answer: true
                hints: ["Wohin leitet der Bogen das Gewicht?"]
              - id: l2-s3
                type: sorting
                text: "Welche Brücke ist gemeint?"
                say: "Sortiere. Zu welcher Brücke passt jede Karte?"
                bins:
                  - { id: suspension, show: { object: suspension-bridge }, say: "Hängebrücke" }
                  - { id: arch, show: { object: bridge }, say: "Bogenbrücke" }
                  - { id: truss, show: { object: truss-bridge }, say: "Fachwerkbrücke" }
                options:
                  - { text: "hohe Türme mit dicken Seilen", bin: suspension }
                  - { text: "Steine, die sich gegenseitig festdrücken", bin: arch }
                  - { text: "Stahlstäbe in Dreiecken", bin: truss }
                  - { text: "Seile, im Boden verankert", bin: suspension }
                  - { text: "das Gewicht geht zur Seite in die Ufer", bin: arch }
                  - { text: "leicht und fest durch Dreiecke", bin: truss }
                hints: ["Seile, Steine im Bogen oder Dreiecke?"]
