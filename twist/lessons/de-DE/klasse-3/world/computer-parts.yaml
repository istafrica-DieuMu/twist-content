# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.computer-parts
skill: world.technology.computer-parts
curriculum: de-DE
language: de
title:
  de: Teile eines Computers
  en: Parts of a computer
summary: >
  Every computer works by input, processing and output (EVA: Eingabe,
  Verarbeitung, Ausgabe), and keeps data in a store. The story: Oma Rosi
  has been given a computer, and her granddaughter Lina shows her how it
  works. Lesson 1 names the input devices (keyboard, mouse, microphone,
  camera), the processor inside that does the work, and the output
  devices (screen, speakers, printer), and follows a key press through
  EVA. Lesson 2 adds storage (hard disk, USB stick, memory card; saved
  data stays when the power is off) and finds EVA in everyday devices: the
  calculator, the phone with its touchscreen (input and output at once)
  and the supermarket till with its scanner. It ends with the skill check.
  No brands.
metadata:
  year: klasse-3
  topic: { de: Wie Technik funktioniert, en: How things work }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.technology.tools-household]
  also_practises: []
  vocabulary: { de: [Computer, Tastatur, Computermaus, Mikrofon, Kamera, Bildschirm, Lautsprecher, Drucker, Prozessor, Eingabe, Verarbeitung, Ausgabe, EVA, Speicher, Festplatte, USB-Stick, Speicherkarte, Touchscreen, Scanner, Strichcode] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: io, what: { de: "Eingabe- und Ausgabegeräte unterscheiden", en: "telling input devices from output devices" } }
    - { id: process, what: { de: "sagen, was der Prozessor tut, und EVA in der richtigen Reihenfolge erklären", en: "saying what the processor does and explaining EVA in order" } }
    - { id: storage, what: { de: "Speicher nennen und sagen, wozu man speichert", en: "naming storage and saying why we save" } }
    - { id: devices, what: { de: "EVA in Geräten aus dem Alltag finden", en: "finding EVA in everyday devices" } }
  misconceptions:
    - id: screen-is-computer
      what: Thinks the screen is the computer and does the work
      addressed: lesson 1 opens with Oma's question whether the screen is the computer; l1-f3, l1-c3, l2-c6, l2-c10
    - id: off-means-gone
      what: Thinks saved photos and texts are lost when the computer is switched off
      addressed: lesson 2 opens with the guess about Oma's photo; l2-f1, l2-s2, l2-c11, l2-c14
    - id: touchscreen-one-way
      what: Thinks a touchscreen is only an output device
      addressed: the phone screen in lesson 2; l2-f3, l2-n1, l2-c18
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Eingabe, Verarbeitung, Ausgabe", en: "Input, processing, output" }
    goal:
      de: "Finde heraus, welche Teile etwas in den Computer hineinbringen und welche etwas herausbringen. Die Tastatur zum Beispiel ist ein Eingabegerät."
      en: "Find out which parts put something into the computer and which bring something out. The keyboard, for example, is an input device."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was hat einen Akku, den man mit Strom auflädt?"
            options:
              - { object: mobile-phone }
              - { object: scissors }
              - { object: spoon }
            answer: mobile-phone
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Einen Stecker fasst man nur mit trockenen Händen an."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Welcher Teil des Computers rechnet?"
            say: "Oma Rosi hat einen Computer geschenkt bekommen. Ihre Enkelin Lina zeigt ihr, wie er funktioniert. Oma tippt auf der Tastatur, und auf dem Bildschirm erscheinen Buchstaben. „Ist der Bildschirm der Computer?“, fragt Oma. Was glaubst du: Welcher Teil rechnet? Die Tastatur, der Bildschirm oder ein Teil, den man gar nicht sieht?"
          - text: "Ein Teil im Inneren: der Prozessor."
            say: "Gerechnet wird in einem kleinen Bauteil im Inneren, dem Prozessor. Er verarbeitet alles, was in den Computer hineinkommt, nach genauen Anweisungen. Das heißt Verarbeitung. Der Prozessor ist klein, aber er schafft in jeder Sekunde Milliarden Rechenschritte."
          - text: "Eingabe: Etwas kommt hinein."
            say: "Mit der Tastatur tippt Oma Buchstaben ein. Mit der Computermaus zeigt und klickt sie. Ins Mikrofon kann sie sprechen, und die Kamera nimmt ihr Bild auf. Diese Teile heißen Eingabegeräte. Durch sie kommen Daten in den Computer hinein."
          - text: "Ausgabe: Das Ergebnis kommt heraus."
            say: "Der Bildschirm zeigt Bilder und Text. Die Lautsprecher spielen Töne und Musik, und der Drucker druckt auf Papier. Das sind Ausgabegeräte. Durch sie kommt das Ergebnis heraus, damit wir es sehen oder hören."
          - text: "Eingabe, Verarbeitung, Ausgabe: EVA"
            say: "Lina erklärt es Oma an einem Beispiel. Oma drückt die Taste A. Das ist die Eingabe. Der Prozessor erkennt, welche Taste es war. Das ist die Verarbeitung. Auf dem Bildschirm erscheint ein A. Das ist die Ausgabe. Eingabe, Verarbeitung, Ausgabe, kurz EVA. So arbeitet jeder Computer."
          - text: "Wusstest du? Einer der ersten Computer füllte einen ganzen Saal."
            say: "Wusstest du? Einer der ersten Computer füllte einen ganzen Saal und wog so viel wie mehrere Elefanten. Heute steckt ein viel schnellerer Computer in jedem Handy."
            show: { object: elephant }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Womit tippt Oma Buchstaben ein?"
                options: ["mit der Tastatur", "mit dem Bildschirm", "mit dem Drucker"]
                answer: "mit der Tastatur"
                hints:
                  - "Das Teil hat viele Tasten."
                  - "Der Bildschirm und der Drucker zeigen etwas, sie nehmen nichts auf."
                  - "Mit der Tastatur."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Eingabe oder Ausgabe?"
                say: "Sortiere. Welches Teil bringt etwas in den Computer hinein, welches bringt etwas heraus?"
                bins:
                  - { id: input, show: { text: "Eingabe" }, say: "Eingabe" }
                  - { id: output, show: { text: "Ausgabe" }, say: "Ausgabe" }
                options:
                  - { text: "Tastatur", bin: input }
                  - { text: "Bildschirm", bin: output }
                  - { text: "Mikrofon", bin: input }
                  - { text: "Lautsprecher", bin: output }
                  - { text: "Computermaus", bin: input }
                  - { text: "Drucker", bin: output }
                hints:
                  - "Frag bei jedem Teil: Kommt etwas hinein oder heraus?"
                  - "Ins Mikrofon sprichst du hinein. Aus dem Lautsprecher kommt ein Ton heraus."
                  - "Eingabe: Tastatur, Mikrofon, Computermaus. Ausgabe: Bildschirm, Lautsprecher, Drucker."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Der Bildschirm ist das Teil, das rechnet."
                answer: false
                feedback:
                  "true": "Der Bildschirm zeigt nur das Ergebnis. Gerechnet wird im Prozessor im Inneren."
                hints:
                  - "Was macht der Bildschirm?"
                  - "Er zeigt Bilder und Text. Er ist ein Ausgabegerät."
                  - "Gerechnet wird im Prozessor. Der Satz stimmt nicht."
              - id: l1-f4
                type: matching
                text: "Was heißt das? Verbinde."
                pairs:
                  - { left: { text: "Eingabe" }, right: { text: "Etwas kommt hinein." } }
                  - { left: { text: "Verarbeitung" }, right: { text: "Der Computer rechnet." } }
                  - { left: { text: "Ausgabe" }, right: { text: "Das Ergebnis kommt heraus." } }
                hints:
                  - "Denk an Oma und die Taste A."
                  - "Erst drückt Oma die Taste, dann rechnet der Prozessor."
                  - "Eingabe: hinein. Verarbeitung: rechnen. Ausgabe: heraus."
              - id: l1-f5
                type: ordering
                text: "Oma drückt die Taste B. Was passiert nacheinander?"
                say: "Oma drückt die Taste B. Was passiert nacheinander? Leg die Karten in die richtige Reihenfolge."
                options: ["Auf dem Bildschirm erscheint ein B.", "Oma drückt die Taste B.", "Der Prozessor erkennt die Taste."]
                slot_count: 3
                answer: ["Oma drückt die Taste B.", "Der Prozessor erkennt die Taste.", "Auf dem Bildschirm erscheint ein B."]
                hints:
                  - "EVA: Eingabe, Verarbeitung, Ausgabe."
                  - "Zuerst kommt etwas hinein."
                  - "Taste drücken, Prozessor erkennt, Bildschirm zeigt."
              - id: l1-f6
                type: multiple_choice
                text: "Welches Teil ist ein Ausgabegerät?"
                options: ["der Lautsprecher", "die Tastatur", "das Mikrofon"]
                answer: "der Lautsprecher"
                hints:
                  - "Aus einem Ausgabegerät kommt etwas heraus."
                  - "In die Tastatur und ins Mikrofon gibst du etwas hinein."
                  - "Aus dem Lautsprecher kommen Töne heraus."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie heißt das Teil im Inneren, das rechnet?"
                options: ["der Prozessor", "der Drucker", "die Kamera"]
                answer: "der Prozessor"
                hints: ["Es verarbeitet alles, was hineinkommt."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Ein Mikrofon ist ein Eingabegerät."
                answer: true
                hints: ["Sprichst du in das Mikrofon hinein, oder kommt etwas heraus?"]
              - id: l1-s3
                type: sorting
                text: "Eingabe, Verarbeitung oder Ausgabe?"
                say: "Sortiere jedes Teil: Eingabe, Verarbeitung oder Ausgabe?"
                bins:
                  - { id: input, show: { text: "Eingabe" }, say: "Eingabe" }
                  - { id: process, show: { text: "Verarbeitung" }, say: "Verarbeitung" }
                  - { id: output, show: { text: "Ausgabe" }, say: "Ausgabe" }
                options:
                  - { text: "Kamera", bin: input }
                  - { text: "Prozessor", bin: process }
                  - { text: "Lautsprecher", bin: output }
                  - { text: "Tastatur", bin: input }
                  - { text: "Bildschirm", bin: output }
                hints: ["Nur ein Teil rechnet. Die anderen bringen etwas hinein oder heraus."]
              - id: l1-s4
                type: multiple_choice
                text: "Oma will ihren Brief auf Papier haben. Welches Gerät braucht sie?"
                options: ["den Drucker", "die Kamera", "das Mikrofon"]
                answer: "den Drucker"
                hints: ["Welches Gerät bringt etwas auf Papier heraus?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Was heißt EVA?"
                say: "Setz die passenden Wörter ein."
                frame: "EVA heißt: _, Verarbeitung, _."
                options: ["Eingabe", "Ausgabe", "Aufgabe"]
                answer: ["Eingabe", "Ausgabe"]
                hints: ["Erst kommt etwas hinein, am Ende kommt etwas heraus."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Lautsprecher bringen Töne in den Computer hinein."
                answer: false
                feedback:
                  "true": "Aus dem Lautsprecher kommen Töne heraus. Hinein kommen sie durch das Mikrofon."
                hints: ["Hörst du etwas aus dem Lautsprecher, oder sprichst du hinein?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Oma macht einen Videoanruf mit ihrem Enkel Tim. Welche zwei Teile nehmen Omas Gesicht und Omas Stimme auf?"
                options: ["Kamera und Mikrofon", "Bildschirm und Lautsprecher", "Drucker und Tastatur"]
                answer: "Kamera und Mikrofon"
              - id: l1-n2
                type: multiple_choice
                text: "Oma hört Tims Stimme. Durch welches Teil kommt sie heraus?"
                options: ["durch den Lautsprecher", "durch das Mikrofon", "durch die Tastatur"]
                answer: "durch den Lautsprecher"
              - id: l1-n3
                type: true_false
                text: "Oma fragt: „Muss ich die Computermaus füttern?“ Lina lacht: „Nein, die Computermaus ist ein Eingabegerät.“ Stimmt, was Lina sagt?"
                answer: true
              - id: l1-n4
                type: sorting
                text: "Beim Videoanruf: Eingabe oder Ausgabe?"
                say: "Oma macht einen Videoanruf. Sortiere: Eingabe oder Ausgabe?"
                bins:
                  - { id: input, show: { text: "Eingabe" }, say: "Eingabe" }
                  - { id: output, show: { text: "Ausgabe" }, say: "Ausgabe" }
                options:
                  - { text: "Die Kamera filmt Oma.", bin: input }
                  - { text: "Der Bildschirm zeigt Tim.", bin: output }
                  - { text: "Das Mikrofon nimmt Omas Stimme auf.", bin: input }
                  - { text: "Der Lautsprecher spielt Tims Stimme.", bin: output }
              - id: l1-n5
                type: fill_in_blank
                text: "Oma tippt ihren Namen."
                say: "Oma tippt ihren Namen. Setz die passenden Wörter ein."
                frame: "Die Tastatur ist die _. Der Bildschirm ist die _."
                options: ["Eingabe", "Ausgabe"]
                answer: ["Eingabe", "Ausgabe"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Teil ist ein Eingabegerät?"
            options: ["die Tastatur", "der Bildschirm", "der Drucker"]
            answer: "die Tastatur"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Der Drucker ist ein Ausgabegerät."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was macht der Prozessor?"
            options: ["Er verarbeitet und rechnet.", "Er druckt Bilder.", "Er nimmt Töne auf."]
            answer: "Er verarbeitet und rechnet."
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Die Kamera ist ein Ausgabegerät."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Wofür steht das A in EVA?"
            options: ["für Ausgabe", "für Anfang", "für Antwort"]
            answer: "für Ausgabe"
          - id: l1-c6
            type: multiple_choice
            text: "Was kommt aus dem Lautsprecher heraus?"
            options: ["Töne", "Bilder auf Papier", "Buchstaben von der Tastatur"]
            answer: "Töne"

  - n: 2
    title: { de: "Speicher und EVA überall", en: "Storage and EVA everywhere" }
    goal:
      de: "Lerne, wo ein Computer Fotos und Texte aufbewahrt, und finde EVA in Geräten aus deinem Alltag. Auch ein Taschenrechner arbeitet mit Eingabe, Verarbeitung und Ausgabe."
      en: "Learn where a computer keeps photos and texts, and find EVA in devices you use every day. A calculator also works with input, processing and output."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wofür steht das E in EVA?"
            options: ["für Eingabe", "für Ende", "für Ergebnis"]
            answer: "für Eingabe"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Bildschirm zeigt das Ergebnis. Er ist ein Ausgabegerät."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Ist Omas Foto morgen noch da?"
            say: "Oma Rosi hat ein Foto von ihrer Katze auf den Computer geladen, und Lina hat es gespeichert. Dann schaltet Oma den Computer aus. „Jetzt ist mein Foto weg!“, ruft sie. Was glaubst du: Ist das Foto morgen noch da, wenn sie den Computer wieder einschaltet?"
            show: { object: cat }
          - text: "Ja! Es liegt im Speicher."
            say: "Ja, das Foto ist noch da. Im Computer gibt es einen Speicher, zum Beispiel eine Festplatte. Dort bleiben Fotos, Texte und Spiele, auch wenn der Strom aus ist. Auch ein USB-Stick und die Speicherkarte in einer Kamera sind Speicher. Was du aber nicht gespeichert hast, kann beim Ausschalten verloren gehen."
            show: { object: cat }
          - text: "EVA im Taschenrechner: 3 + 4 = 7"
            say: "Nicht nur der große Computer arbeitet nach EVA. Beim Taschenrechner tippst du drei plus vier ein. Das ist die Eingabe. Ein kleiner Chip rechnet. Das ist die Verarbeitung. Die Anzeige zeigt sieben. Das ist die Ausgabe."
          - text: "Das Handy ist auch ein Computer."
            say: "Auch ein Handy ist ein Computer. Sein Bildschirm ist etwas Besonderes: ein Touchscreen. Du tippst darauf, das ist Eingabe. Und er zeigt dir Bilder, das ist Ausgabe. Der Touchscreen ist beides zugleich."
            show: { object: mobile-phone }
          - text: "EVA an der Kasse im Supermarkt"
            say: "An der Kasse im Supermarkt zieht die Kassiererin jede Ware über einen Scanner. Er liest den Strichcode. Das ist die Eingabe. Der Computer der Kasse sucht den Preis heraus. Das ist die Verarbeitung. Die Anzeige zeigt den Preis, und ein kleiner Drucker druckt den Kassenbon. Das ist die Ausgabe."
            show: { object: supermarket }
          - text: "Wusstest du? Für einen Computer ist alles Nullen und Einsen."
            say: "Wusstest du? Ein Computer speichert alles als Nullen und Einsen, auch Fotos, Musik und Spiele. Omas Katzenfoto ist im Speicher eine riesig lange Reihe aus Nullen und Einsen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wo bleibt Omas gespeichertes Foto, wenn der Computer aus ist?"
                options: ["im Speicher", "im Lautsprecher", "in der Tastatur"]
                answer: "im Speicher"
                hints:
                  - "Lina hat das Foto gespeichert."
                  - "Gespeichertes bleibt, auch ohne Strom."
                  - "Im Speicher, zum Beispiel auf der Festplatte."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Eingabe, Verarbeitung, Ausgabe oder Speicher?"
                say: "Sortiere jedes Teil in sein Fach: Eingabe, Verarbeitung, Ausgabe oder Speicher."
                bins:
                  - { id: input, show: { text: "Eingabe" }, say: "Eingabe" }
                  - { id: process, show: { text: "Verarbeitung" }, say: "Verarbeitung" }
                  - { id: output, show: { text: "Ausgabe" }, say: "Ausgabe" }
                  - { id: storage, show: { text: "Speicher" }, say: "Speicher" }
                options:
                  - { text: "Tastatur", bin: input }
                  - { text: "Prozessor", bin: process }
                  - { text: "Drucker", bin: output }
                  - { text: "USB-Stick", bin: storage }
                  - { text: "Mikrofon", bin: input }
                  - { text: "Festplatte", bin: storage }
                hints:
                  - "Frag: Kommt es hinein, wird gerechnet, kommt es heraus, oder bleibt es aufbewahrt?"
                  - "Auf dem USB-Stick und der Festplatte bleiben Fotos und Texte."
                  - "Eingabe: Tastatur, Mikrofon. Verarbeitung: Prozessor. Ausgabe: Drucker. Speicher: USB-Stick, Festplatte."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Ein Touchscreen ist Eingabe und Ausgabe zugleich."
                answer: true
                hints:
                  - "Was machst du mit dem Bildschirm eines Handys?"
                  - "Du tippst darauf, und er zeigt dir Bilder."
                  - "Ja, er ist beides."
              - id: l2-f4
                type: matching
                text: "EVA im Taschenrechner: Verbinde."
                pairs:
                  - { left: { text: "Tasten drücken" }, right: { text: "Eingabe" } }
                  - { left: { text: "Der Chip rechnet." }, right: { text: "Verarbeitung" } }
                  - { left: { text: "Die Anzeige zeigt das Ergebnis." }, right: { text: "Ausgabe" } }
                hints:
                  - "Was kommt zuerst, was zuletzt?"
                  - "Mit den Tasten gibst du die Aufgabe ein."
                  - "Tasten: Eingabe. Chip: Verarbeitung. Anzeige: Ausgabe."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Teil ist ein Speicher?"
                options: ["der USB-Stick", "der Lautsprecher", "die Kamera"]
                answer: "der USB-Stick"
                hints:
                  - "Ein Speicher bewahrt Fotos und Texte auf."
                  - "Den Stick kannst du mitnehmen, und die Fotos bleiben darauf."
                  - "Der USB-Stick ist ein Speicher."
              - id: l2-f6
                type: fill_in_blank
                text: "Die Sprache des Computers"
                say: "Setz das passende Wort ein."
                frame: "Ein Computer speichert Fotos und Musik als Nullen und _."
                options: ["Einsen", "Zweien", "Buchstaben"]
                answer: ["Einsen"]
                hints:
                  - "Der Computer kennt nur zwei Zeichen."
                  - "Das eine ist die Null."
                  - "Nullen und Einsen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "An der Supermarktkasse liest ein Scanner den Strichcode. Was ist das?"
                options: ["Eingabe", "Ausgabe", "Speicher"]
                answer: "Eingabe"
                hints: ["Kommt der Strichcode in die Kasse hinein, oder kommt etwas heraus?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Wenn der Computer aus ist, sind alle gespeicherten Fotos weg."
                answer: false
                feedback:
                  "true": "Gespeicherte Fotos bleiben im Speicher, auch ohne Strom."
                hints: ["Was war mit Omas Katzenfoto am nächsten Tag?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welches Ding ist auch ein Computer?"
                options:
                  - { object: mobile-phone }
                  - { object: scissors }
                  - { object: bucket }
                answer: mobile-phone
                hints: ["Welches Ding hat einen Touchscreen?"]
              - id: l2-s4
                type: sorting
                text: "Was passiert an der Supermarktkasse?"
                say: "Was passiert an der Supermarktkasse? Sortiere: Eingabe, Verarbeitung oder Ausgabe?"
                bins:
                  - { id: input, show: { text: "Eingabe" }, say: "Eingabe" }
                  - { id: process, show: { text: "Verarbeitung" }, say: "Verarbeitung" }
                  - { id: output, show: { text: "Ausgabe" }, say: "Ausgabe" }
                options:
                  - { text: "Der Scanner liest den Strichcode.", bin: input }
                  - { text: "Der Kassencomputer sucht den Preis.", bin: process }
                  - { text: "Der Drucker druckt den Kassenbon.", bin: output }
                  - { text: "Die Anzeige zeigt den Preis.", bin: output }
                hints: ["Was kommt hinein, wo wird gesucht, was kommt heraus?"]
              - id: l2-s5
                type: multiple_choice
                text: "Lina will Omas Fotos zu Opa Karl mitnehmen. Worauf kann sie die Fotos speichern?"
                options: ["auf einen USB-Stick", "auf den Lautsprecher", "auf das Mikrofon"]
                answer: "auf einen USB-Stick"
                hints: ["Welcher Speicher passt in die Hosentasche?"]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? Auch ein Taschenrechner arbeitet nach dem EVA-Prinzip."
                answer: true
                hints: ["Tasten, Chip, Anzeige: Was ist was?"]

          - support: none
            setting: in-context
            tasks:
