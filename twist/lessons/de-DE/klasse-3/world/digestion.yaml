# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.digestion
skill: world.body.digestion
curriculum: de-DE
language: de
title:
  de: Die Reise des Essens
  en: The journey of food
summary: >
  Food travels from the mouth through the oesophagus into the stomach, then
  through the small and the large intestine. In the mouth the teeth chew
  and saliva makes the food soft; the oesophagus is a tube of muscles that
  pushes it down, while a small lid closes the windpipe; the stomach
  kneads it with acid stomach juice into a mush. The small intestine takes
  the nutrients into the blood, the large intestine takes the water out,
  and what the body does not need leaves as faeces on the toilet. Chewing
  well, water and fibre help. The story: Emma eats an apple at break and
  explains to her little brother Ben where it goes. Lesson 1 is mouth to
  stomach; lesson 2 the gut and the whole path, and ends with the skill
  check. Factual and child-friendly; organs are named in text cards, no
  body pictures.
metadata:
  year: klasse-3
  topic: { de: Im Inneren des Körpers, en: Inside the body }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.body.body-parts, world.body.healthy-eating]
  also_practises: []
  vocabulary: { de: [Verdauung, Zähne, Spucke, Speichel, Zunge, Speiseröhre, Luftröhre, Magen, Magensaft, Dünndarm, Dickdarm, Nährstoffe, Ballaststoffe, Kot] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: path, what: { de: den Weg der Nahrung in der richtigen Reihenfolge nennen, en: naming the path of food in the right order } }
    - { id: mouth-stomach, what: { de: "sagen, was im Mund, in der Speiseröhre und im Magen passiert", en: "saying what happens in the mouth, the oesophagus and the stomach" } }
    - { id: gut, what: { de: "sagen, was im Dünndarm und im Dickdarm passiert", en: saying what happens in the small and the large intestine } }
    - { id: care, what: { de: "wissen, was der Verdauung hilft", en: knowing what helps digestion } }
  misconceptions:
    - id: straight-to-belly
      what: Thinks swallowed food falls straight into the belly or straight into the gut
      addressed: lesson 1 opens with the guess about Ben's question and shows the whole path; l1-f3, l1-c3, l2-s5, l2-c3
    - id: body-uses-all
      what: Thinks the body uses everything we eat, or that everything we eat turns into faeces
      addressed: lesson 2 opens with the guess and teaches nutrients into the blood, water out, the rest leaves; l2-f6, l2-s4, l2-c14
    - id: air-food-same-way
      what: Thinks food and air go down the same tube
      addressed: lesson 1 Learn screen on the oesophagus and the lid over the windpipe; l1-s3, l1-s5, l1-n4, l2-c10
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Vom Mund in den Magen", en: "From the mouth to the stomach" }
    goal:
      de: "Verfolge, wie ein Apfelstück vom Mund durch die Speiseröhre in den Magen kommt."
      en: "Follow a piece of apple from the mouth through the oesophagus into the stomach."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Womit beißt du in einen Apfel?"
            options:
              - { object: tooth }
              - { object: ear }
              - { object: nose }
            answer: tooth
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Obst und Gemüse sind gut für deinen Körper."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wohin geht der Apfel, wenn du ihn schluckst?"
            say: "Emma beißt in der Pause in einen Apfel. Ihr kleiner Bruder Ben fragt: Wo geht der Apfel eigentlich hin, wenn du ihn schluckst? Fällt er einfach in den Bauch? Was glaubst du?"
            show: { object: apple }
          - text: "Das Essen macht eine lange Reise: die Verdauung."
            say: "Das Apfelstück fällt nicht einfach in den Bauch. Es macht eine lange Reise durch deinen Körper. Vom Mund geht es durch die Speiseröhre in den Magen, dann durch den Dünndarm und den Dickdarm. Diese Reise heißt Verdauung."
          - text: "Im Mund: kauen und Spucke"
            say: "Die Reise beginnt im Mund. Die Zähne beißen und kauen das Apfelstück klein. Die Spucke macht es weich und rutschig. Sie heißt auch Speichel. Die Zunge schiebt den Brei nach hinten, und du schluckst."
            show: { object: mouth }
          - text: "Die Speiseröhre: ein Schlauch aus Muskeln"
            say: "Nach dem Schlucken geht es in die Speiseröhre. Sie ist ein Schlauch aus Muskeln. Die Muskeln drücken den Brei Stück für Stück nach unten in den Magen. Gleich daneben liegt die Luftröhre, durch die du atmest. Beim Schlucken klappt ein kleiner Deckel die Luftröhre zu. Wenn du mit vollem Mund redest oder lachst, kann trotzdem ein Krümel in die Luftröhre geraten. Dann musst du husten."
          - text: "Der Magen knetet das Essen zu Brei."
            say: "Der Magen ist wie ein dehnbarer Sack aus Muskeln. Er liegt oben im Bauch, etwas links, unter den Rippen. Ein paar Stunden lang knetet er das Essen und mischt es mit Magensaft. Der Magensaft ist sauer und macht viele Keime unschädlich. Am Ende ist das Essen ein dünner Brei."
          - text: "Wusstest du? Astronauten können auch im Weltall schlucken."
            say: "Wusstest du? Astronauten können auch im Weltall schlucken, wo nichts nach unten fällt. Die Muskeln der Speiseröhre schieben das Essen trotzdem bis in den Magen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was machen die Zähne mit dem Essen?"
                options: ["Sie beißen und kauen es klein.", "Sie machen es sauer.", "Sie schicken es in die Lunge."]
                answer: "Sie beißen und kauen es klein."
                hints:
                  - "Die Reise beginnt im Mund."
                  - "Was tust du mit einem Apfelstück, bevor du es schluckst?"
                  - "Die Zähne beißen und kauen das Essen klein."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Die Spucke macht das Essen weich und rutschig."
                answer: true
                hints:
                  - "Versuch einmal, einen trockenen Keks ohne Spucke zu schlucken. Wie wäre das?"
                  - "Mit Spucke rutscht der Brei besser."
                  - "Ja, die Spucke macht das Essen weich und rutschig."
                difficulty: easy
              - id: l1-f3
                type: ordering
                text: "Wohin geht das Apfelstück? Ordne."
                say: "Wohin geht das Apfelstück? Leg die Karten in die richtige Reihenfolge."
                options: ["Magen", "Mund", "Speiseröhre"]
                slot_count: 3
                answer: ["Mund", "Speiseröhre", "Magen"]
                hints:
                  - "Wo beißt Emma in den Apfel?"
                  - "Vom Mund geht ein Schlauch nach unten."
                  - "Mund, dann Speiseröhre, dann Magen."
              - id: l1-f4
                type: matching
                text: "Wer macht was? Verbinde."
                pairs:
                  - { left: { text: "Zähne" }, right: { text: "beißen und kauen" } }
                  - { left: { text: "Spucke" }, right: { text: "macht den Brei rutschig" } }
                  - { left: { text: "Speiseröhre" }, right: { text: "drückt den Brei zum Magen" } }
                hints:
                  - "Fang mit dem an, was du sicher weißt: Was machen die Zähne?"
                  - "Die Speiseröhre ist ein Schlauch aus Muskeln."
                  - "Zähne: kauen. Spucke: rutschig. Speiseröhre: zum Magen."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist die Speiseröhre?"
                options: ["ein Schlauch vom Mund zum Magen", "ein Knochen im Hals", "ein Zahn ganz hinten"]
                answer: "ein Schlauch vom Mund zum Magen"
                hints:
                  - "Hör auf das Wort: Speise heißt Essen."
                  - "Das Essen muss vom Mund nach unten kommen."
                  - "Die Speiseröhre ist ein Schlauch vom Mund zum Magen."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Der Magen ist ein harter Knochen."
                answer: false
                feedback:
                  "true": "Der Magen ist ein dehnbarer Sack aus Muskeln. Nur so kann er das Essen kneten."
                hints:
                  - "Was muss der Magen mit dem Essen machen?"
                  - "Zum Kneten muss er sich bewegen können."
                  - "Der Magen ist ein Sack aus Muskeln."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo beginnt die Reise des Essens?"
                options:
                  - { object: mouth }
                  - { object: ear }
                  - { object: foot }
                answer: mouth
                feedback:
                  foot: "Mit dem Fuß essen? Das wäre ein Kunststück! Die Reise beginnt im Mund."
                hints: ["Wo kommt der Apfel zuerst hinein?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was passiert im Magen?"
                options: ["Er knetet das Essen und mischt es mit Magensaft.", "Er kaut das Essen mit Zähnen.", "Er macht aus dem Essen Luft."]
                answer: "Er knetet das Essen und mischt es mit Magensaft."
                hints: ["Der Magen ist ein Sack aus Muskeln. Was kann er damit tun?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Beim Schlucken klappt ein kleiner Deckel die Luftröhre zu."
                answer: true
                hints: ["Das Essen soll in die Speiseröhre, nicht in die Luftröhre."]
              - id: l1-s4
                type: sorting
                text: "Wo passiert das: im Mund, in der Speiseröhre oder im Magen?"
                say: "Wo passiert das: im Mund, in der Speiseröhre oder im Magen? Sortiere."
                bins:
                  - { id: mouth, show: { text: "Mund" }, say: "Mund" }
                  - { id: tube, show: { text: "Speiseröhre" }, say: "Speiseröhre" }
                  - { id: stomach, show: { text: "Magen" }, say: "Magen" }
                options:
                  - { text: "Die Zähne kauen.", bin: mouth }
                  - { text: "Muskeln drücken den Brei nach unten.", bin: tube }
                  - { text: "Saurer Saft mischt sich mit dem Brei.", bin: stomach }
                  - { text: "Die Spucke macht das Essen weich.", bin: mouth }
                  - { text: "Der Brei rutscht durch einen Schlauch.", bin: tube }
                  - { text: "Der Brei wird stundenlang geknetet.", bin: stomach }
                hints: ["Geh die Reise der Reihe nach: erst kauen, dann schlucken, dann kneten."]
              - id: l1-s5
                type: multiple_choice
                text: "Warum sollst du nicht mit vollem Mund reden?"
                options: ["Sonst kann Essen in die Luftröhre geraten.", "Sonst werden die Zähne müde.", "Sonst wird der Magen sauer."]
                answer: "Sonst kann Essen in die Luftröhre geraten."
                hints: ["Was passiert, wenn du dich verschluckst?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Der Magensaft ist süß wie Honig."
                answer: false
                feedback:
                  "true": "Der Magensaft ist sauer. So macht er viele Keime unschädlich."
                hints: ["Was macht der Magensaft mit den Keimen?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ben schluckt ein Stück Brot. Wo kommt es nach der Speiseröhre an?"
                options: ["im Magen", "in der Lunge", "im Mund"]
                answer: "im Magen"
                show: { object: bread }
              - id: l1-n2
                type: true_false
                text: "Emma sagt: „Wenn ich gut kaue, hat mein Magen weniger Arbeit.“ Stimmt das?"
                say: "Emma sagt: Wenn ich gut kaue, hat mein Magen weniger Arbeit. Stimmt das?"
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Emma erklärt Ben die Reise."
                say: "Emma erklärt Ben die Reise. Setz die passenden Wörter ein."
                frame: "Erst kauen die _ den Apfel klein. Dann rutscht er durch die _ in den _."
                options: ["Zähne", "Speiseröhre", "Magen", "Luftröhre"]
                answer: ["Zähne", "Speiseröhre", "Magen"]
              - id: l1-n4
                type: multiple_choice
                text: "Ben lacht beim Essen, verschluckt sich und hustet. Wohin ist ein Krümel geraten?"
                options: ["in die Luftröhre", "in den Magen", "in die Speiseröhre"]
                answer: "in die Luftröhre"
              - id: l1-n5
                type: matching
                text: "Emma macht Schilder für die Reise. Verbinde."
                pairs:
                  - { left: { text: "Mund" }, right: { text: "Hier beginnt die Reise." } }
                  - { left: { text: "Speiseröhre" }, right: { text: "Hier geht es nach unten." } }
                  - { left: { text: "Magen" }, right: { text: "Hier wird das Essen zu Brei geknetet." } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt der Schlauch vom Mund zum Magen?"
            options: ["die Speiseröhre", "die Luftröhre", "der Darm"]
            answer: "die Speiseröhre"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Im Mund wird das Essen gekaut."
            answer: true
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Das Essen fällt vom Mund direkt in den Darm."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Was macht die Spucke?"
            options: ["Sie macht das Essen weich und rutschig.", "Sie kaut das Essen.", "Sie putzt die Zähne."]
            answer: "Sie macht das Essen weich und rutschig."
          - id: l1-c5
            type: ordering
            text: "Bring die Reise in die richtige Reihenfolge."
            options: ["Speiseröhre", "Magen", "Mund"]
            slot_count: 3
            answer: ["Mund", "Speiseröhre", "Magen"]
          - id: l1-c6
            type: multiple_choice
            text: "Wo liegt der Magen?"
            options: ["oben im Bauch, unter den Rippen", "im Kopf", "im Bein"]
            answer: "oben im Bauch, unter den Rippen"

  - n: 2
    title: { de: "Durch den Darm", en: "Through the gut" }
    goal:
      de: "Finde heraus, was im Dünndarm und im Dickdarm passiert. Dann kennst du die ganze Reise vom Mund bis zum Darm."
      en: "Find out what happens in the small and the large intestine. Then you know the whole journey from the mouth to the gut."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wohin kommt das Essen nach der Speiseröhre?"
            options: ["in den Magen", "in die Lunge", "in den Mund"]
            answer: "in den Magen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Magen knetet das Essen zu einem Brei."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Braucht dein Körper alles, was du isst?"
            say: "Der Apfelbrei verlässt den Magen. Ben fragt: Braucht mein Körper eigentlich alles, was ich esse? Was glaubst du?"
          - text: "Nein! Der Dünndarm holt die Nährstoffe heraus."
            say: "Nein, der Körper nimmt sich nur, was er braucht. Nach dem Magen kommt der Brei in den Dünndarm. Dort holt sich der Körper die Nährstoffe heraus. Nährstoffe sind die Stoffe im Essen, die dir Kraft geben und dich wachsen lassen. Sie gehen durch die Wand des Darms ins Blut, und das Blut bringt sie in den ganzen Körper."
          - text: "Der Dickdarm holt das Wasser heraus."
            say: "Was der Körper nicht braucht, wandert weiter in den Dickdarm. Dort holt sich der Körper noch Wasser aus dem Rest. So wird der Rest fester. Was am Ende übrig bleibt, heißt Kot. Er kommt heraus, wenn du auf die Toilette gehst."
          - text: "Die ganze Reise: Mund, Speiseröhre, Magen, Dünndarm, Dickdarm"
            say: "Jetzt kennst du die ganze Reise. Mund, Speiseröhre, Magen, Dünndarm, Dickdarm. Jede Station hat ihre eigene Aufgabe."
          - text: "So hilfst du deiner Verdauung."
            say: "Du kannst deiner Verdauung helfen. Iss in Ruhe und kau gut. Trink genug Wasser. Und iss Obst, Gemüse und Vollkornbrot. Darin stecken Ballaststoffe. Sie halten den Darm in Bewegung."
            show: { object: carrot }
          - text: "Wusstest du? Dein Darm ist viel länger, als du groß bist."
            say: "Wusstest du? Dein Darm ist viel länger, als du groß bist. Bei einem Erwachsenen ist er mehrere Meter lang. Er liegt in vielen Schlingen gefaltet im Bauch."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was holt sich der Körper im Dünndarm aus dem Brei?"
                options: ["die Nährstoffe", "die Zähne", "die Luft"]
                answer: "die Nährstoffe"
                hints:
                  - "Was gibt dir Kraft und lässt dich wachsen?"
                  - "Die guten Stoffe im Essen gehen ins Blut."
                  - "Im Dünndarm holt sich der Körper die Nährstoffe."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Im Dickdarm holt sich der Körper Wasser aus dem Rest."
                answer: true
                hints:
                  - "Der Rest wird im Dickdarm fester."
                  - "Was muss man aus einem Brei herausholen, damit er fester wird?"
                  - "Ja, im Dickdarm holt sich der Körper Wasser."
              - id: l2-f3
                type: ordering
                text: "Wohin wandert der Brei? Ordne."
                say: "Wohin wandert der Brei? Leg die Karten in die richtige Reihenfolge."
                options: ["Dünndarm", "Magen", "Dickdarm", "Speiseröhre"]
                slot_count: 4
                answer: ["Speiseröhre", "Magen", "Dünndarm", "Dickdarm"]
                hints:
                  - "Den Anfang kennst du schon: nach dem Schlucken in die Speiseröhre."
                  - "Nach dem Magen kommt zuerst der Darm, in dem die Nährstoffe ins Blut gehen."
                  - "Speiseröhre, Magen, Dünndarm, Dickdarm."
              - id: l2-f4
                type: multiple_choice
                text: "Wohin gehen die Nährstoffe aus dem Dünndarm?"
                options: ["ins Blut", "in die Lunge", "in die Haare"]
                answer: "ins Blut"
                hints:
                  - "Die Nährstoffe müssen in den ganzen Körper kommen."
                  - "Was fließt durch den ganzen Körper?"
                  - "Die Nährstoffe gehen ins Blut."
              - id: l2-f5
                type: sorting
                text: "Hilft das deiner Verdauung?"
                say: "Hilft das deiner Verdauung oder nicht? Sortiere."
                bins:
                  - { id: helps, show: { text: "hilft" }, say: "hilft" }
                  - { id: not, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "gut kauen", bin: helps }
                  - { text: "das Essen hinunterschlingen", bin: not }
                  - { text: "Wasser trinken", bin: helps }
                  - { text: "nur Süßigkeiten essen", bin: not }
                  - { text: "Obst und Gemüse essen", bin: helps }
                hints:
                  - "Denk an Kauen, Trinken und Ballaststoffe."
                  - "Schlingen heißt: schnell schlucken, ohne zu kauen."
                  - "Hilft: kauen, Wasser, Obst und Gemüse. Hilft nicht: schlingen, nur Süßes."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Der Körper braucht alles, was du isst. Nichts bleibt übrig."
                answer: false
                feedback:
                  "true": "Der Körper nimmt sich die Nährstoffe und Wasser. Der Rest bleibt übrig und kommt auf der Toilette heraus."
                hints:
                  - "Warum musst du auf die Toilette?"
                  - "Was der Körper nicht braucht, wandert in den Dickdarm."
                  - "Nein, ein Rest bleibt übrig."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was passiert wo? Verbinde."
                pairs:
                  - { left: { text: "Magen" }, right: { text: "knetet das Essen zu Brei" } }
                  - { left: { text: "Dünndarm" }, right: { text: "holt die Nährstoffe heraus" } }
                  - { left: { text: "Dickdarm" }, right: { text: "holt das Wasser heraus" } }
                hints: ["Die Nährstoffe kommen vor dem Wasser dran."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Was hat viele Ballaststoffe?"
                options:
                  - { object: carrot }
                  - { object: ice-cream }
                  - { object: milk }
                answer: carrot
                hints: ["Ballaststoffe stecken in Obst, Gemüse und Vollkorn."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Dein Darm ist kürzer als dein Arm."
                answer: false
                feedback:
                  "true": "Der Darm ist viel länger, als du groß bist. Er liegt gefaltet im Bauch."
                hints: ["Wie liegt der Darm im Bauch?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was ist Kot?"
                options: ["der Rest, den der Körper nicht braucht", "die Nährstoffe aus dem Essen", "gekautes Essen im Mund"]
                answer: "der Rest, den der Körper nicht braucht"
                hints: ["Was bleibt übrig, wenn der Körper Nährstoffe und Wasser herausgeholt hat?"]
              - id: l2-s5
                type: ordering
                text: "Die ganze Reise: Ordne alle fünf Stationen."
                say: "Die ganze Reise. Leg alle fünf Stationen in die richtige Reihenfolge."
                options: ["Dickdarm", "Mund", "Magen", "Dünndarm", "Speiseröhre"]
                slot_count: 5
                answer: ["Mund", "Speiseröhre", "Magen", "Dünndarm", "Dickdarm"]
                hints: ["Die zwei Därme kommen erst nach dem Magen."]
              - id: l2-s6
                type: multiple_choice
                text: "Warum sind Ballaststoffe gut für dich?"
                options: ["Sie halten den Darm in Bewegung.", "Sie machen die Zähne weiß.", "Sie lassen die Haare wachsen."]
                answer: "Sie halten den Darm in Bewegung."
                hints: ["Ballaststoffe helfen bei der Verdauung."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: true_false
                text: "Ben sagt: „Im Dünndarm kommen die Nährstoffe ins Blut.“ Stimmt das?"
                say: "Ben sagt: Im Dünndarm kommen die Nährstoffe ins Blut. Stimmt das?"
                answer: true
              - id: l2-n2
                type: multiple_choice
                text: "Emma isst zum Frühstück Vollkornbrot und eine Möhre. Was davon hilft ihrem Darm besonders?"
                options: ["die Ballaststoffe", "die orange Farbe der Möhre", "das Knacken beim Kauen"]
                answer: "die Ballaststoffe"
                feedback:
                  "das Knacken beim Kauen": "Das Knacken klingt lustig, aber dem Darm helfen die Ballaststoffe."
              - id: l2-n3
                type: sorting
