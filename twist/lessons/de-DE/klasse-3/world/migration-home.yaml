# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.migration-home
skill: world.society.migration-home
curriculum: de-DE
language: de
title:
  de: Umziehen und Heimat
  en: Moving and home
summary: >
  Daria is new in the Klasse 3a, and the class makes a moving map: every
  child asks at home whether the family has ever moved. Lesson 1 finds
  that almost every family has, some to the next street, some to another
  country, and why: work (Lea's mum has a new job in Köln; Kemal's Opa came
  from Turkey more than 50 years ago to work in a factory, when Germany
  looked for workers abroad), family and love (Mateo's dad came from
  Spain), and safety (Daria's family fled a war, with one suitcase each).
  People also left Germany: more than 100 years ago many emigrated to
  America. Moving can be exciting and sad at once. Lesson 2 asks what
  Heimat is: where you feel at home, which can be more than one place, and
  also people, a language, food and sounds; Heimweh is normal, and a new
  place can become Heimat too. People bring their language, festivals and
  recipes (pizza; words such as Joghurt and Tomate travelled too), and the
  class welcomes Daria. Factual and kind; no politics, no country at war
  named. It ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechte und Vielfalt, en: Rights and diversity }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.society.families, world.society.living-diversity]
  also_practises: []
  vocabulary: { de: [umziehen, Umzug, auswandern, fliehen, Geflüchtete, Arbeit, Sicherheit, Heimat, Heimweh, willkommen, vermissen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: reasons, what: { de: "Gründe nennen, warum Menschen umziehen", en: naming reasons why people move } }
    - { id: heimat, what: { de: "erklären, was Heimat für jemanden sein kann", en: explaining what home can mean to someone } }
    - { id: feelings, what: { de: Gefühle beim Umziehen verstehen und neue Kinder willkommen heißen, en: understanding feelings about moving and welcoming new children } }
    - { id: bring, what: { de: "wissen, dass Menschen Sprache, Feste und Essen mitbringen", en: "knowing that people bring their language, festivals and food" } }
  misconceptions:
    - id: moving-only-abroad
      what: Thinks moving means only coming from another country, and that nobody leaves Germany
      addressed: lesson 1 opens with the moving map and Lea's move within Germany; l1-f3, l1-s1, l1-s5, l1-c6 and the check tasks l2-c3 and l2-c5
    - id: one-heimat
      what: Thinks a person can have only one Heimat, the place where they were born
      addressed: lesson 2 opens with Mateo's two places; l2-f1, l2-f2, l2-s4, l2-s5 and l2-c7, l2-c8, l2-c9
    - id: refugees-on-holiday
      what: Thinks people who come from another country come for a holiday
      addressed: lesson 1 Learn on Daria's family; l1-f6, l1-n4 and l2-c4
    - id: moving-only-fun
      what: Thinks moving is only exciting and that missing the old home is wrong
      addressed: lesson 1 Learn on feelings and lesson 2 on Heimweh; l1-s2, l1-c4, l2-s1, l2-n2 and l2-c13
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Warum Menschen umziehen", en: "Why people move" }
    goal:
      de: "Finde heraus, warum Menschen in eine andere Stadt oder ein anderes Land ziehen. Leas Mama zum Beispiel hat in Köln eine neue Arbeit gefunden."
      en: "Find out why people move to another town or country. Lea's mum, for example, found a new job in Köln."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was gehört zu jeder Familie?"
            options: ["Menschen, die füreinander sorgen", "ein Haus mit Garten", "genau zwei Kinder"]
            answer: "Menschen, die füreinander sorgen"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Wenn jemand anders lebt als ich, ist das nicht falsch."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wie viele Familien der 3a sind schon einmal umgezogen?"
            say: "Daria ist neu in der Klasse 3a. Die Klasse macht eine Umzugskarte. Jedes Kind fragt zu Hause: Ist unsere Familie schon einmal umgezogen? Was glaubst du: Wie viele Familien sind schon einmal umgezogen?"
            show: { object: map }
          - text: "Fast alle! Manche in die Nachbarstraße, manche in ein anderes Land."
            say: "Fast alle Familien sind schon einmal umgezogen. Manche nur in die Nachbarstraße, manche in eine andere Stadt, und manche in ein anderes Land. Wer in ein anderes Land zieht, um dort zu leben, wandert aus. Aber warum ziehen Menschen um?"
          - text: "Grund 1: Arbeit"
            say: "Lea ist mit ihrer Familie von Hamburg nach Köln gezogen, weil ihre Mama dort eine neue Arbeit gefunden hat. Kemals Opa kam vor mehr als 50 Jahren aus der Türkei nach Deutschland. Damals hat Deutschland in anderen Ländern Arbeitskräfte gesucht, und Kemals Opa hat in einer Fabrik gearbeitet."
          - text: "Grund 2: Familie und Liebe"
            say: "Mateos Papa kommt aus Spanien. Er hat Mateos Mama kennengelernt und ist zu ihr nach Köln gezogen. Manche Großeltern ziehen in die Nähe ihrer Enkel. Viele Menschen ziehen um, um bei ihrer Familie zu sein."
          - text: "Grund 3: Sicherheit"
            say: "Daria kommt aus einem Land, in dem Krieg ist. Ihre Familie musste schnell fliehen, und jeder konnte nur einen Koffer mitnehmen. Menschen, die vor Krieg oder großer Gefahr fliehen, nennt man Geflüchtete. Sie suchen einen Ort, an dem sie sicher sind."
            show: { object: suitcase }
          - text: "Auch aus Deutschland sind Menschen ausgewandert."
            say: "Auch aus Deutschland ziehen Menschen weg. Vor mehr als 100 Jahren sind sehr viele Menschen aus Deutschland nach Amerika ausgewandert. Sie haben dort Arbeit und Land gesucht."
          - text: "Umziehen kann spannend und traurig sein."
            say: "Ein Umzug kann spannend sein: eine neue Stadt, neue Freunde. Er kann auch traurig sein: Man vermisst die alten Freunde, und manchmal muss man eine neue Sprache lernen. Wer sein altes Zuhause vermisst, hat Heimweh. Beides kann man gleichzeitig fühlen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Leas Mama hat in Köln eine neue Arbeit gefunden. Warum zieht Lea um?"
                options: ["wegen der Arbeit", "wegen eines Krieges", "wegen der Ferien"]
                answer: "wegen der Arbeit"
                hints:
                  - "Was hat Leas Mama in Köln gefunden?"
                  - "Arbeit, Familie oder Sicherheit: Welcher Grund passt?"
                  - "Lea zieht wegen der Arbeit ihrer Mama um."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Warum ziehen sie um? Sortiere."
                say: "Warum ziehen diese Menschen um? Sortiere nach Arbeit, Familie und Sicherheit."
                bins:
                  - { id: arbeit, show: { text: "Arbeit" }, say: "Arbeit" }
                  - { id: familie, show: { text: "Familie" }, say: "Familie" }
                  - { id: sicherheit, show: { text: "Sicherheit" }, say: "Sicherheit" }
                options:
                  - { text: "Mama bekommt eine neue Stelle in einer anderen Stadt.", bin: arbeit }
                  - { text: "Oma zieht in die Nähe ihrer Enkel.", bin: familie }
                  - { text: "Im Land ist Krieg.", bin: sicherheit }
                  - { text: "Opa findet in einer Fabrik Arbeit.", bin: arbeit }
                  - { text: "Papa zieht zu der Frau, die er liebt.", bin: familie }
                  - { text: "Ein Sturm hat das ganze Dorf zerstört.", bin: sicherheit }
                hints:
                  - "Frag bei jeder Karte: Geht es um Arbeit, um Menschen, die man liebt, oder um Gefahr?"
                  - "Krieg und ein zerstörtes Dorf sind gefährlich."
                  - "Arbeit: neue Stelle, Fabrik. Familie: Oma, Papa. Sicherheit: Krieg, Sturm."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Auch innerhalb von Deutschland ziehen Menschen um."
                answer: true
                hints:
                  - "Woher kommt Lea?"
                  - "Hamburg und Köln liegen beide in Deutschland."
                  - "Ja. Lea ist innerhalb von Deutschland umgezogen."
              - id: l1-f4
                type: image_multiple_choice
                text: "Darias Familie musste schnell fliehen. Was konnte jeder mitnehmen?"
                options:
                  - { object: suitcase }
                  - { object: sofa }
                  - { object: fridge }
                answer: suitcase
                feedback:
                  fridge: "Einen Kühlschrank kann man nicht schnell mitnehmen! Jeder hatte nur einen Koffer."
                hints:
                  - "Was kann man tragen, wenn man schnell losmuss?"
                  - "Ein Sofa und ein Kühlschrank sind viel zu schwer."
                  - "Jeder konnte einen Koffer mitnehmen."
              - id: l1-f5
                type: matching
                text: "Warum kamen sie nach Köln? Verbinde."
                pairs:
                  - { left: { text: "Kemals Opa" }, right: { text: "Arbeit in einer Fabrik" } }
                  - { left: { text: "Mateos Papa" }, right: { text: "Liebe und Familie" } }
                  - { left: { text: "Darias Familie" }, right: { text: "Schutz vor Krieg" } }
                hints:
                  - "Fang mit Daria an. Wovor ist ihre Familie geflohen?"
                  - "Mateos Papa hat Mateos Mama kennengelernt."
                  - "Kemals Opa: Arbeit. Mateos Papa: Liebe. Daria: Schutz vor Krieg."
              - id: l1-f6
                type: multiple_choice
                text: "Wie nennt man Menschen, die vor Krieg oder großer Gefahr fliehen?"
                options: ["Geflüchtete", "Touristen", "Urlauber"]
                answer: "Geflüchtete"
                feedback:
                  "Urlauber": "Urlauber fahren zum Spaß weg und kommen wieder. Wer vor Krieg flieht, ist geflüchtet."
                hints:
                  - "Das Wort kommt von „fliehen“."
                  - "Touristen und Urlauber machen Ferien."
                  - "Man nennt sie Geflüchtete."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Aus Deutschland ist noch nie jemand in ein anderes Land gezogen."
                answer: false
                feedback:
                  "true": "Vor mehr als 100 Jahren sind sehr viele Menschen aus Deutschland nach Amerika ausgewandert."
                hints: ["Wohin sind vor mehr als 100 Jahren viele Menschen aus Deutschland gezogen?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wie kann sich ein Kind nach einem Umzug fühlen?"
                options: ["froh und traurig zugleich", "immer nur froh", "es fühlt gar nichts"]
                answer: "froh und traurig zugleich"
                hints: ["Neue Freunde finden, alte Freunde vermissen: Wie fühlt sich das an?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Daria vermisst ihre Freundinnen von früher. Wie fühlt sie sich?"
                options:
                  - { object: sad }
                  - { object: happy }
                  - { object: angry }
                answer: sad
                hints: ["Wer jemanden vermisst, ist oft ...?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Warum ziehen Menschen um?"
                say: "Setz die passenden Wörter ein."
                frame: "Menschen ziehen um, weil sie _ suchen, weil sie zu ihrer _ wollen oder weil sie in _ leben wollen."
                options: ["Arbeit", "Familie", "Sicherheit", "Urlaub"]
                answer: ["Arbeit", "Familie", "Sicherheit"]
                hints: ["Denk an Lea, Mateo und Daria."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Vor mehr als 100 Jahren sind viele Menschen aus Deutschland nach Amerika ausgewandert."
                answer: true
                hints: ["Was haben sie in Amerika gesucht?"]
              - id: l1-s6
                type: multiple_choice
                text: "Was ist Heimweh?"
                options: ["Man vermisst sein altes Zuhause.", "Man hat Bauchweh vom Essen.", "Man will nie wieder nach Hause."]
                answer: "Man vermisst sein altes Zuhause."
                feedback:
                  "Man hat Bauchweh vom Essen.": "Das klingt ähnlich, tut aber woanders weh! Heimweh heißt: Man vermisst sein altes Zuhause."
                hints: ["In Heimweh steckt das Wort „Heim“, also Zuhause."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Auf der Umzugskarte steht: „Finn: von Leipzig nach Köln, weil Papa hier Busfahrer geworden ist.“ Warum ist Finn umgezogen?"
                options: ["wegen Papas Arbeit", "wegen eines Krieges", "wegen der Großeltern"]
                answer: "wegen Papas Arbeit"
              - id: l1-n2
                type: sorting
                text: "Neue Zettel für die Umzugskarte: Warum sind sie umgezogen?"
                bins:
                  - { id: arbeit, show: { text: "Arbeit" }, say: "Arbeit" }
                  - { id: familie, show: { text: "Familie" }, say: "Familie" }
                  - { id: sicherheit, show: { text: "Sicherheit" }, say: "Sicherheit" }
                options:
                  - { text: "Elifs Tante ist Ärztin im Krankenhaus geworden.", bin: arbeit }
                  - { text: "Noahs Oma will näher bei den Enkeln wohnen.", bin: familie }
                  - { text: "In Samirs alter Stadt war Krieg.", bin: sicherheit }
                  - { text: "Ninas Eltern haben geheiratet und eine gemeinsame Wohnung gesucht.", bin: familie }
              - id: l1-n3
                type: true_false
                text: "Daria spricht noch wenig Deutsch. Mia sagt: „Komm, ich zeige dir den Schulhof!“ Ist das eine gute Idee?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Mateo fragt: „Ist Darias Familie hier im Urlaub?“ Was stimmt?"
                options: ["Nein. Sie ist vor einem Krieg geflohen, um in Sicherheit zu sein.", "Ja, sie macht nur Ferien.", "Ja, sie wollte ein größeres Haus."]
                answer: "Nein. Sie ist vor einem Krieg geflohen, um in Sicherheit zu sein."
              - id: l1-n5
                type: image_multiple_choice
                text: "Lea packt für den Umzug ihre Bücher ein. Worin kommen sie?"
                options:
                  - { object: box }
                  - { object: bath }
                  - { object: kite }
                answer: box

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Warum ziehen Menschen um?"
            options: ["zum Beispiel wegen Arbeit, Familie oder Sicherheit", "nur, weil sie Ferien machen wollen", "weil alle mit 10 Jahren umziehen müssen"]
            answer: "zum Beispiel wegen Arbeit, Familie oder Sicherheit"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Wer vor einem Krieg flieht, sucht Sicherheit."
            answer: true
          - id: l1-c3
            type: matching
            text: "Welcher Grund ist das? Verbinde."
            pairs:
              - { left: { text: "Mama hat eine neue Stelle." }, right: { text: "Arbeit" } }
              - { left: { text: "Im Land ist Krieg." }, right: { text: "Sicherheit" } }
              - { left: { text: "Oma will bei der Familie wohnen." }, right: { text: "Familie" } }
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Ein Umzug ist für jedes Kind immer nur lustig."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was heißt auswandern?"
            options: ["in ein anderes Land ziehen, um dort zu leben", "eine lange Wanderung machen", "in die Nachbarstraße ziehen"]
            answer: "in ein anderes Land ziehen, um dort zu leben"
          - id: l1-c6
            type: multiple_choice
            text: "Lea zieht von Hamburg nach Köln. Was stimmt?"
            options: ["Sie zieht innerhalb von Deutschland um.", "Sie wandert aus.", "Sie flieht vor einem Krieg."]
            answer: "Sie zieht innerhalb von Deutschland um."

  - n: 2
    title: { de: "Was ist Heimat?", en: "What is home?" }
    goal:
      de: "Finde heraus, was Heimat für jemanden sein kann. Mateo zum Beispiel hat zwei Heimatorte, Köln und das Dorf seiner Oma in Spanien."
      en: "Find out what home can mean to someone. Mateo, for example, has two home places, Köln and his grandma's village in Spain."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Warum ist Darias Familie nach Deutschland gekommen?"
            options: ["Sie musste vor einem Krieg fliehen.", "Sie wollte Urlaub machen.", "Sie hat sich auf dem Weg verlaufen."]
            answer: "Sie musste vor einem Krieg fliehen."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Auch wegen einer neuen Arbeit ziehen Menschen um."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Kann ein Mensch mehr als eine Heimat haben?"
            say: "Die 3a spricht über das Wort Heimat. Mateo sagt: Meine Heimat ist Köln, aber auch das Dorf in Spanien, wo meine Oma wohnt. Was glaubst du: Kann ein Mensch mehr als eine Heimat haben?"
          - text: "Ja! Heimat kann mehr als ein Ort sein."
            say: "Ja. Heimat ist da, wo man sich zu Hause und wohl fühlt. Das kann der Ort sein, an dem man geboren ist, und der Ort, an dem man jetzt lebt. Viele Menschen haben zwei oder mehr Orte, die für sie Heimat sind."
            show: { object: house }
          - text: "Heimat sind auch Menschen, eine Sprache, ein Essen, ein Klang."
            say: "Heimat ist nicht nur ein Ort. Für Kemal ist es auch das Essen von seiner Oma und die türkischen Lieder, die sein Opa singt. Für Daria ist es ihre Sprache und das Lied, das ihre Mama abends summt. Für Lea ist es das Rauschen am Hafen in Hamburg."
          - text: "Heimweh, und eine neue Heimat"
            say: "Wer sein altes Zuhause vermisst, hat Heimweh. Das ist ganz normal. Mit der Zeit kann ein neuer Ort auch Heimat werden: wenn man dort Freunde hat, die Wege kennt und sich sicher fühlt. Die alte Heimat bleibt trotzdem wichtig."
          - text: "Menschen bringen ihre Sprache, Feste und Rezepte mit."
            say: "Wenn Menschen umziehen, bringen sie viel mit: ihre Sprache, ihre Feste, Lieder und Rezepte. So kommen neue Dinge in ein Land. Menschen aus Italien haben die Pizza bei uns bekannt gemacht, Menschen aus der Türkei den Döner im Brot."
            show: { object: pizza }
          - text: "Wusstest du? Auch Wörter wandern: „Joghurt“ kommt aus dem Türkischen."
            say: "Wusstest du? Auch Wörter wandern. Das Wort Joghurt kommt aus dem Türkischen. Das Wort Tomate kommt aus einer alten Sprache in Mexiko. Und die Tomate selbst kam vor etwa 500 Jahren aus Amerika nach Europa."
            show: { object: tomato }
          - text: "Willkommen heißen"
            say: "Wie fühlt sich Daria in der neuen Klasse wohl? Die Kinder zeigen ihr den Schulhof, fragen, ob sie mitspielen will, und lernen ein Wort in ihrer Sprache. Um freundlich zu sein, muss man keine Sprache können: Lächeln und Zeigen versteht fast jeder."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was ist Heimat?"
                options: ["ein Ort, an dem man sich zu Hause und wohl fühlt", "nur der Ort, an dem man geboren ist", "nur das Land, das im Pass steht"]
                answer: "ein Ort, an dem man sich zu Hause und wohl fühlt"
                hints:
                  - "Denk an Mateo. Er hat zwei Orte."
                  - "Heimat hat mit einem Gefühl zu tun."
                  - "Heimat ist da, wo man sich zu Hause und wohl fühlt."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Ein Mensch kann mehr als eine Heimat haben."
                answer: true
                hints:
                  - "Wie viele Heimatorte hat Mateo?"
                  - "Köln und das Dorf seiner Oma in Spanien."
                  - "Ja. Man kann mehr als eine Heimat haben."
              - id: l2-f3
                type: matching
                text: "Was ist für sie Heimat? Verbinde."
                pairs:
                  - { left: { text: "Kemal" }, right: { text: "das Essen von Oma und Opas Lieder" } }
                  - { left: { text: "Daria" }, right: { text: "ihre Sprache und Mamas Lied am Abend" } }
                  - { left: { text: "Lea" }, right: { text: "das Rauschen am Hafen in Hamburg" } }
                hints:
                  - "Fang mit Lea an. Woher kommt sie?"
                  - "Daria denkt an ihre Mama, Kemal an Oma und Opa."
                  - "Kemal: Essen und Lieder. Daria: Sprache und Mamas Lied. Lea: Hafen."
              - id: l2-f4
                type: multiple_choice
                text: "Daria vermisst ihr altes Zuhause. Wie heißt dieses Gefühl?"
                options: ["Heimweh", "Bauchweh", "Fernweh"]
                answer: "Heimweh"
                feedback:
                  "Fernweh": "Fernweh hat man, wenn man in die Ferne reisen möchte. Wer das Zuhause vermisst, hat Heimweh."
                hints:
                  - "Es geht um das alte Zuhause, das Heim."
                  - "Fernweh zieht in die Ferne. Und was zieht nach Hause?"
                  - "Das Gefühl heißt Heimweh."
              - id: l2-f5
                type: multiple_choice
                text: "Daria steht allein auf dem Schulhof. Was kannst du tun?"
                options: ["Sie fragen, ob sie mitspielen will.", "Sie nicht beachten.", "Über ihre Aussprache lachen."]
                answer: "Sie fragen, ob sie mitspielen will."
                hints:
                  - "Wie fühlt man sich allein an einem neuen Ort?"
                  - "Was haben die Kinder der 3a für Daria getan?"
                  - "Frag sie, ob sie mitspielen will."
              - id: l2-f6
                type: image_multiple_choice
                text: "Welches Essen haben Menschen aus Italien bei uns bekannt gemacht?"
                options:
                  - { object: pizza }
                  - { object: apple }
                  - { object: bread }
                answer: pizza
                hints:
                  - "Es ist rund und flach und hat Belag."
                  - "Äpfel und Brot gab es bei uns schon lange."
                  - "Die Pizza kommt aus Italien."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Heimweh zu haben ist ganz normal."
                answer: true
                hints: ["Darf man sein altes Zuhause vermissen?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wann kann ein neuer Ort Heimat werden?"
                options: ["wenn man dort Freunde hat und sich sicher fühlt", "sobald die Umzugskisten ausgepackt sind", "nie"]
                answer: "wenn man dort Freunde hat und sich sicher fühlt"
                hints: ["Heimat ist ein Gefühl. Was braucht man dafür?"]
              - id: l2-s3
                type: sorting
                text: "Was hilft Daria, sich wohlzufühlen?"
                bins:
                  - { id: hilft, show: { text: "hilft" }, say: "hilft" }
                  - { id: nicht, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "ihr den Schulhof zeigen", bin: hilft }
                  - { text: "sie auslachen", bin: nicht }
                  - { text: "ein Wort in ihrer Sprache lernen", bin: hilft }
                  - { text: "sie nie etwas fragen", bin: nicht }
                hints: ["Frag dich: Würde ich mich an ihrer Stelle darüber freuen?"]
              - id: l2-s4
                type: true_false
