# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.scale
skill: world.space.scale
curriculum: de-DE
language: de
title:
  de: Mit dem Maßstab messen
  en: Measuring with the scale
summary: >
  A map shows the world smaller, and its scale says by how much. The
  story: Jonas and his Oma plan walks and a bike trip with two maps. Lesson
  1 uses one scale, 1 cm on the map is 100 m in real life: the child
  measures a way with the ruler, works out the real distance, works back
  from metres to centimetres and reads a scale bar. Lesson 2 compares maps
  with other scales (1 cm is 1 km on the bike map, 1 cm is 1 m on a room
  plan) and shows that a winding path is longer than the straight line the
  ruler measures. It ends with the skill check. Distances stay within
  1000 m, and whole centimetres only.
metadata:
  year: klasse-3
  topic: { de: Karten lesen, en: Reading maps }
  ages: [8-10]
  lesson_minutes: 14
  builds_on: [world.space.map-symbols, math.length.cm-m, math.length.mm-km]
  also_practises: []
  vocabulary: { de: [Maßstab, Maßstabsleiste, Entfernung, Wirklichkeit, Zentimeter, Meter, Kilometer, Lineal, Luftlinie, Wanderkarte] }
  forms: [text, audio, drawn]
  drawn: [ruler, number-line]
  facets: []
  parts:
    - { id: meaning, what: { de: "wissen, was der Maßstab einer Karte sagt", en: knowing what the scale of a map says } }
    - { id: measure, what: { de: aus einer Strecke auf der Karte die echte Entfernung bestimmen, en: working out the real distance from a length on the map } }
    - { id: back, what: { de: aus der echten Entfernung die Strecke auf der Karte bestimmen, en: working out the length on the map from the real distance } }
    - { id: compare, what: { de: Maßstäbe und Wege vergleichen, en: comparing scales and routes } }
  misconceptions:
    - id: map-equals-real
      what: Takes the length on the map as the real distance (5 cm on the map is 5 cm in real life)
      addressed: lesson 1 opens with the guess about the 5 cm way; l1-s2 with feedback, l1-c4; l2-c3
    - id: times-ten
      what: Multiplies by 10 in place of 100 (4 cm is 40 m)
      addressed: l1-f1 and l1-s1 with feedback, l1-c4; l2-c6
    - id: one-scale-for-all
      what: Thinks every map has the same scale, so 3 cm is always the same distance
      addressed: lesson 2 opens with the guess about the two maps; l2-f2, l2-s3, l2-n3; l2-c4 and l2-c18
    - id: straight-is-route
      what: Thinks the ruler gives the length of a winding path
      addressed: the Learn screen on the straight line; l2-f5, l2-s6, l2-n5; l2-c16 and l2-c20
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "1 cm sind 100 m", en: "1 cm is 100 m" }
    goal:
      de: "Rechne mit dem Maßstab aus, wie weit ein Weg in echt ist. Auf Omas Karte sind 5 Zentimeter in echt 500 Meter."
      en: "Use the scale to work out how far a way really is. On Oma's map 5 centimetres are 500 metres in real life."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie lang ist der rote Streifen?"
            show: { drawn: ruler, to: 10, length: 4 }
            options: ["4 cm", "5 cm", "3 cm"]
            answer: "4 cm"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Meter sind 1 km?"
            options: ["1000 m", "100 m", "10 m"]
            answer: "1000 m"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Auf der Karte ist der Weg 5 cm lang. Ist er in echt auch 5 cm lang?"
            say: "Jonas will mit Oma zum Badesee wandern. Er legt das Lineal auf Omas Wanderkarte. Der Weg zum See ist 5 Zentimeter lang. Was glaubst du: Ist der Weg in echt auch nur 5 Zentimeter lang?"
            show: { drawn: ruler, to: 10, length: 5 }
          - text: "Nein! Die Karte ist viel kleiner als die Wirklichkeit."
            say: "Nein. Dann wäre der See ja gleich neben Jonas' Fuß! Die Karte zeigt alles viel kleiner, als es ist. Wie viel kleiner, das sagt der Maßstab. Er steht am Rand der Karte."
          - text: "Maßstab: 1 cm auf der Karte sind 100 m in Wirklichkeit."
            say: "Auf Omas Karte steht: 1 Zentimeter auf der Karte sind 100 Meter in Wirklichkeit. Jeder Zentimeter auf dem Lineal steht also für 100 Meter, die du gehen musst."
            show: { drawn: ruler, to: 10, length: 1 }
          - text: "5 cm sind 5 mal 100 m. Das sind 500 m."
            say: "Jetzt rechnet Jonas. Der Weg ist 5 Zentimeter lang. Jeder Zentimeter sind 100 Meter. 5 mal 100 Meter sind 500 Meter. Bis zum See sind es also 500 Meter."
            show: { drawn: ruler, to: 10, length: 5 }
          - text: "Die Maßstabsleiste: Jeder Abschnitt ist 1 cm lang und steht für 100 m."
            say: "Manche Karten haben eine Maßstabsleiste. Das ist ein Streifen mit Zahlen. Jeder Abschnitt ist 1 Zentimeter lang und steht für 100 Meter: 0, 100, 200, 300 und so weiter. Du kannst einen Weg auch direkt daneben halten und ablesen."
            show: { drawn: number-line, from: 0, to: 500, step: 100, labels: all }
          - text: "Wusstest du? Bei vielen Modelleisenbahnen ist alles 87-mal kleiner als in echt."
            say: "Wusstest du? Auch Modelle haben einen Maßstab. Bei vielen Modelleisenbahnen ist alles 87-mal kleiner als in echt: die Lok, die Häuser und sogar die kleinen Menschen am Bahnsteig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Weg zum Bäcker ist auf der Karte 2 cm lang. Maßstab: 1 cm sind 100 m. Wie weit ist es in echt?"
                show: { drawn: ruler, to: 10, length: 2 }
                options: ["200 m", "20 m", "2 m"]
                answer: "200 m"
                feedback:
                  "20 m": "Jeder Zentimeter sind 100 m, nicht 10 m. 2 mal 100 m sind 200 m."
                hints:
                  - "Wie viele Meter ist 1 cm auf dieser Karte?"
                  - "Der Weg ist 2 cm lang. Jeder Zentimeter sind 100 m."
                  - "2 mal 100 m sind 200 m."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Auf einer Karte ist alles kleiner als in Wirklichkeit."
                answer: true
                hints:
                  - "Passt der Weg zum See auf ein Blatt Papier?"
                  - "Der Weg ist in echt 500 m, auf der Karte nur 5 cm."
                  - "Ja, das stimmt."
              - id: l1-f3
                type: matching
                text: "Maßstab: 1 cm sind 100 m. Verbinde die Strecke auf der Karte mit der echten Entfernung."
                pairs:
                  - { left: { text: "1 cm" }, right: { text: "100 m" } }
                  - { left: { text: "3 cm" }, right: { text: "300 m" } }
                  - { left: { text: "6 cm" }, right: { text: "600 m" } }
                hints:
                  - "Jeder Zentimeter auf der Karte sind 100 m."
                  - "Für 3 cm nimmst du dreimal 100 m."
                  - "1 cm 100 m, 3 cm 300 m, 6 cm 600 m."
              - id: l1-f4
                type: text_input
                text: "Maßstab: 1 cm sind 100 m. Der Weg ist auf der Karte so lang wie der Streifen. Wie viele Meter sind es in echt? _ m"
                say: "Der Maßstab ist: 1 Zentimeter sind 100 Meter. Der Weg ist auf der Karte so lang wie der rote Streifen. Wie viele Meter sind es in echt?"
                show: { drawn: ruler, to: 10, length: 4 }
                answer: "400"
                hints:
                  - "Lies zuerst am Lineal ab, wie lang der Streifen ist."
                  - "Der Streifen ist 4 cm lang. Jeder Zentimeter sind 100 m."
                  - "4 mal 100 m sind 400 m."
              - id: l1-f5
                type: multiple_choice
                text: "Was sagt der Maßstab einer Karte?"
                options: ["wie viel kleiner die Karte ist als die Wirklichkeit", "wo Norden ist", "was die Kartenzeichen bedeuten"]
                answer: "wie viel kleiner die Karte ist als die Wirklichkeit"
                hints:
                  - "Wofür hat Jonas den Maßstab gebraucht?"
                  - "Die Zeichen erklärt die Legende. Norden zeigt der Kompass."
                  - "Der Maßstab sagt, wie viel kleiner alles auf der Karte ist."
              - id: l1-f6
                type: fill_in_blank
                text: "Maßstab: 1 cm sind 100 m. Setz die echte Entfernung ein."
                say: "Der Maßstab ist: 1 Zentimeter sind 100 Meter. Wie viele Meter sind 7 Zentimeter in Wirklichkeit?"
                frame: "7 cm auf der Karte sind _ m in Wirklichkeit."
                options: ["700", "70", "7"]
                answer: ["700"]
                hints:
                  - "Jeder Zentimeter zählt 100 m."
                  - "Nimm 7 mal 100 m."
                  - "7 mal 100 m sind 700 m."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Jonas misst den Weg zum Spielplatz. Maßstab: 1 cm sind 100 m. Wie weit ist es in echt?"
                show: { drawn: ruler, to: 10, length: 3 }
                options: ["300 m", "30 m", "3 m"]
                answer: "300 m"
                feedback:
                  "30 m": "Jeder Zentimeter sind 100 m. 3 mal 100 m sind 300 m."
                hints: ["Wie lang ist der Streifen? Jeder Zentimeter sind 100 m."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Der Weg ist auf der Karte 5 cm lang. Also ist er in echt auch 5 cm lang."
                answer: false
                feedback:
                  "true": "5 cm wären nur ein kleiner Schritt! Mit dem Maßstab sind es in echt 500 m."
                hints: ["Ist die Karte so groß wie die Wirklichkeit?"]
              - id: l1-s3
                type: text_input
                text: "Maßstab: 1 cm sind 100 m. Wie viele Meter sind es in echt? _ m"
                say: "Der Maßstab ist: 1 Zentimeter sind 100 Meter. Lies den Streifen ab. Wie viele Meter sind es in echt?"
                show: { drawn: ruler, to: 10, length: 6 }
                answer: "600"
                hints: ["Der Streifen ist 6 cm lang."]
              - id: l1-s4
                type: multiple_choice
                text: "Oma sagt: „Bis zur Mühle sind es 800 m.“ Maßstab: 1 cm sind 100 m. Wie lang ist der Weg auf der Karte?"
                options: ["8 cm", "80 cm", "800 cm"]
                answer: "8 cm"
                hints: ["Wie oft passen 100 m in 800 m?"]
              - id: l1-s5
                type: ordering
                text: "Alle Wege sind auf derselben Karte. Ordne sie nach der echten Länge, den kürzesten zuerst."
                options: ["zum See: 5 cm", "zur Schule: 9 cm", "zum Bäcker: 2 cm"]
                slot_count: 3
                answer: ["zum Bäcker: 2 cm", "zum See: 5 cm", "zur Schule: 9 cm"]
                hints: ["Auf derselben Karte ist der kürzere Strich auch der kürzere Weg."]
              - id: l1-s6
                type: multiple_choice
                text: "Was ist das hier am Rand der Karte?"
                say: "Am Rand von Omas Karte ist dieser Streifen mit Zahlen. Was ist das?"
                show: { drawn: number-line, from: 0, to: 500, step: 100, labels: all }
                options: ["eine Maßstabsleiste", "die Legende", "ein Kompass"]
                answer: "eine Maßstabsleiste"
                hints: ["Die Zahlen sagen, wie viele Meter es in echt sind."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Vom See wandern Jonas und Oma weiter zur Eisdiele. Maßstab: 1 cm sind 100 m. Wie weit ist es?"
                show: { drawn: ruler, to: 10, length: 7 }
                options: ["700 m", "70 m", "7 km"]
                answer: "700 m"
              - id: l1-n2
                type: true_false
                text: "Oma sagt: „Bis zum Turm sind es auf der Karte 10 cm. Maßstab: 1 cm sind 100 m. In echt ist das 1 km.“ Stimmt das?"
                answer: true
              - id: l1-n3
                type: text_input
                text: "Der Weg zum Bauernhof ist auf der Karte 9 cm lang. Maßstab: 1 cm sind 100 m. Wie viele Meter sind es in echt? _ m"
                say: "Der Weg zum Bauernhof ist auf der Karte 9 Zentimeter lang. Der Maßstab ist: 1 Zentimeter sind 100 Meter. Wie viele Meter sind es in echt?"
                answer: "900"
              - id: l1-n4
                type: multiple_choice
                text: "Auf der Karte ist der Weg zum Freibad 3 cm lang, der Weg zum Wald 6 cm. Maßstab: 1 cm sind 100 m. Wie viel weiter ist es in echt zum Wald?"
                options: ["300 m", "3 cm", "600 m"]
                answer: "300 m"
                difficulty: stretch
              - id: l1-n5
                type: fill_in_blank
                text: "Jonas misst 2 cm bis zum Kiosk und noch 2 cm vom Kiosk bis nach Hause. Maßstab: 1 cm sind 100 m."
                say: "Jonas misst 2 Zentimeter bis zum Kiosk und noch 2 Zentimeter vom Kiosk bis nach Hause. Der Maßstab ist: 1 Zentimeter sind 100 Meter. Wie weit ist es zusammen?"
                frame: "Zusammen sind es in echt _ m."
                options: ["400", "200", "4"]
                answer: ["400"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Maßstab: 1 cm sind 100 m. Wie weit ist es in echt?"
            show: { drawn: ruler, to: 10, length: 8 }
            options: ["800 m", "80 m", "8 m"]
            answer: "800 m"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Der Maßstab sagt, wie viel kleiner die Karte ist als die Wirklichkeit."
            answer: true
          - id: l1-c3
            type: text_input
            text: "Maßstab: 1 cm sind 100 m. Wie viele Meter sind 2 cm auf der Karte? _ m"
            say: "Der Maßstab ist: 1 Zentimeter sind 100 Meter. Wie viele Meter sind 2 Zentimeter auf der Karte?"
            answer: "200"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Maßstab: 1 cm sind 100 m. Dann sind 4 cm auf der Karte in echt 40 m."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Maßstab: 1 cm sind 100 m. In echt sind es 500 m. Wie lang ist der Weg auf der Karte?"
            options: ["5 cm", "50 cm", "500 cm"]
            answer: "5 cm"
          - id: l1-c6
            type: fill_in_blank
            text: "Maßstab: 1 cm sind 100 m. Setz die echte Entfernung ein."
            say: "Der Maßstab ist: 1 Zentimeter sind 100 Meter. Wie viele Meter sind 3 Zentimeter?"
            frame: "3 cm auf der Karte sind _ m."
            options: ["300", "30", "3"]
            answer: ["300"]

  - n: 2
    title: { de: "Jede Karte hat ihren Maßstab", en: "Every map has its own scale" }
    goal:
      de: "Vergleiche Karten mit verschiedenen Maßstäben. Auf der Radkarte ist 1 Zentimeter in echt 1 Kilometer."
      en: "Compare maps with different scales. On the bike map 1 centimetre is 1 kilometre in real life."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Maßstab: 1 cm sind 100 m. Wie weit ist es in echt?"
            show: { drawn: ruler, to: 10, length: 9 }
            options: ["900 m", "90 m", "9 m"]
            answer: "900 m"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Auf einer Maßstabsleiste steht, wie viele Meter ein Abschnitt in echt ist."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Ist der Weg auf beiden Karten gleich lang gemalt?"
            say: "Oma hat noch eine zweite Karte, eine Radkarte. Jonas sucht darauf den Weg zum Badesee. Auf der Wanderkarte war er 5 Zentimeter lang. Was glaubst du: Ist er auf der Radkarte auch 5 Zentimeter lang?"
          - text: "Nein! Jede Karte hat ihren eigenen Maßstab."
            say: "Nein. Auf der Radkarte steht ein anderer Maßstab: 1 Zentimeter sind 1 Kilometer. Die Radkarte zeigt eine viel größere Gegend auf dem gleichen Blatt. Darum ist alles noch kleiner gemalt. Schau also bei jeder Karte zuerst nach ihrem Maßstab."
          - text: "Radkarte: 1 cm sind 1 km. 3 cm sind 3 km."
            say: "Auf der Radkarte will Jonas zum Schloss. Der Weg ist 3 Zentimeter lang. Jeder Zentimeter ist 1 Kilometer. Also sind es 3 Kilometer."
            show: { drawn: ruler, to: 10, length: 3 }
          - text: "Zimmerplan, Maßstab 1 : 100: 1 cm sind 1 m. Das Bett ist 2 cm lang, in echt 2 m."
            say: "Auch ein Plan hat einen Maßstab. Jonas zeichnet sein Zimmer. Auf seinem Plan ist 1 Zentimeter 1 Meter im Zimmer. Man schreibt das auch so: 1 zu 100, denn 1 Meter sind 100 Zentimeter. Sein Bett ist auf dem Plan 2 Zentimeter lang. In echt ist es 2 Meter lang."
            show: { drawn: ruler, to: 10, length: 2 }
          - text: "Das Lineal misst die gerade Linie. Ein kurviger Weg ist länger."
            say: "Noch ein Trick. Mit dem Lineal misst du die gerade Linie vom Start zum Ziel. Man sagt auch Luftlinie. Ein Weg mit Kurven, zum Beispiel um einen Berg herum, ist in echt länger als die Luftlinie."
          - text: "Wusstest du? Einmal um die ganze Erde sind es ungefähr 40 000 km."
            say: "Wusstest du? Einmal um die ganze Erde herum sind es ungefähr vierzigtausend Kilometer. Mit dem Fahrrad wärst du viele Monate unterwegs."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Radkarte: 1 cm sind 1 km. Wie weit ist es in echt?"
                show: { drawn: ruler, to: 10, length: 4 }
                options: ["4 km", "400 m", "4 m"]
                answer: "4 km"
                feedback:
                  "400 m": "So wäre es auf der Wanderkarte. Auf der Radkarte ist jeder Zentimeter 1 km."
                hints:
                  - "Welcher Maßstab steht auf der Radkarte?"
                  - "Der Streifen ist 4 cm lang. Jeder Zentimeter ist 1 km."
                  - "4 mal 1 km sind 4 km."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Alle Karten haben denselben Maßstab."
                answer: false
                hints:
                  - "Denk an Omas zwei Karten."
                  - "Wanderkarte: 1 cm sind 100 m. Radkarte: 1 cm sind 1 km."
                  - "Jede Karte hat ihren eigenen Maßstab. Das stimmt also nicht."
              - id: l2-f3
                type: multiple_choice
                text: "Zimmerplan: 1 cm sind 1 m. Das Bett ist auf dem Plan 2 cm lang. Wie lang ist das echte Bett?"
                options: ["2 m", "2 cm", "20 m"]
                answer: "2 m"
                feedback:
                  "20 m": "Ein Bett so lang wie ein Schwimmbecken? Jeder Zentimeter ist 1 m, also 2 m."
                hints:
                  - "Wie viel ist 1 cm auf dem Plan im echten Zimmer?"
                  - "Jeder Zentimeter ist 1 m."
                  - "2 cm auf dem Plan sind 2 m."
              - id: l2-f4
                type: matching
                text: "Jedes Mal sind es 3 cm auf der Karte. Wie weit ist es in echt? Verbinde."
                pairs:
                  - { left: { text: "Wanderkarte: 1 cm sind 100 m" }, right: { text: "300 m" } }
                  - { left: { text: "Radkarte: 1 cm sind 1 km" }, right: { text: "3 km" } }
                  - { left: { text: "Zimmerplan: 1 cm sind 1 m" }, right: { text: "3 m" } }
                hints:
                  - "Lies bei jeder Karte zuerst ihren Maßstab."
                  - "Nimm jedes Mal dreimal das, was 1 cm ist."
                  - "Wanderkarte 300 m, Radkarte 3 km, Zimmerplan 3 m."
              - id: l2-f5
                type: multiple_choice
                text: "Der Weg zur Burg geht in Kurven. Jonas misst die gerade Linie: 4 cm, also 400 m. Wie lang ist der echte Weg?"
                options: ["länger als 400 m", "genau 400 m", "kürzer als 400 m"]
                answer: "länger als 400 m"
                keep_order: true
                hints:
                  - "Was misst das Lineal?"
                  - "Das Lineal misst die gerade Linie. Kurven machen den Weg länger."
                  - "Der echte Weg ist länger als 400 m."
              - id: l2-f6
                type: fill_in_blank
                text: "Radkarte: 1 cm sind 1 km. Setz die echte Entfernung ein."
                say: "Auf der Radkarte ist 1 Zentimeter 1 Kilometer. Wie weit sind 6 Zentimeter in echt?"
                frame: "6 cm auf der Radkarte sind in echt _."
                options: ["6 km", "600 m", "6 m"]
                answer: ["6 km"]
                hints:
                  - "Auf der Radkarte rechnest du in Kilometern."
                  - "Jeder Zentimeter ist 1 km."
                  - "6 cm sind 6 km."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Radkarte: 1 cm sind 1 km. Wie viele Kilometer sind es in echt? _ km"
                say: "Auf der Radkarte ist 1 Zentimeter 1 Kilometer. Lies den Streifen ab. Wie viele Kilometer sind es in echt?"
                show: { drawn: ruler, to: 10, length: 7 }
                answer: "7"
                hints: ["Jeder Zentimeter ist 1 km."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Auf der Radkarte, 1 cm sind 1 km, ist ein Weg von 2 km genau 2 cm lang."
                answer: true
                hints: ["Wie viele Zentimeter brauchst du für jeden Kilometer?"]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Weg ist in echt 1 km lang. Auf welcher Karte ist er mit mehr Zentimetern gemalt?"
                options: ["auf der Wanderkarte, 1 cm sind 100 m", "auf der Radkarte, 1 cm sind 1 km"]
                answer: "auf der Wanderkarte, 1 cm sind 100 m"
                keep_order: true
                hints: ["1 km sind 1000 m. Wie viele Zentimeter sind das auf jeder Karte?"]
              - id: l2-s4
                type: multiple_choice
                text: "Zimmerplan: 1 cm sind 1 m. Der Schrank ist in echt 3 m breit. Wie breit ist er auf dem Plan?"
                options: ["3 cm", "30 cm", "300 cm"]
                answer: "3 cm"
                hints: ["Jeder Meter im Zimmer ist 1 cm auf dem Plan."]
              - id: l2-s5
                type: sorting
                text: "Wanderkarte: 1 cm sind 100 m. Ist der Weg kürzer oder länger als 500 m?"
                say: "Auf der Wanderkarte ist 1 Zentimeter 100 Meter. Sortiere die Wege: kürzer als 500 Meter oder länger als 500 Meter?"
                bins:
                  - { id: short, show: { text: "kürzer als 500 m" }, say: "kürzer als 500 Meter" }
                  - { id: long, show: { text: "länger als 500 m" }, say: "länger als 500 Meter" }
                options:
                  - { text: "3 cm", bin: short }
                  - { text: "7 cm", bin: long }
                  - { text: "2 cm", bin: short }
                  - { text: "9 cm", bin: long }
                hints: ["500 m sind auf dieser Karte 5 cm."]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? Ein kurviger Weg ist länger als die gerade Linie zwischen Start und Ziel."
                answer: true
                hints: ["Was misst das Lineal auf der Karte?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Oma und Jonas fahren mit dem Rad zum Schloss. Radkarte: 1 cm sind 1 km. Wie weit fahren sie?"
                show: { drawn: ruler, to: 10, length: 5 }
                options: ["5 km", "500 m", "5 m"]
                answer: "5 km"
              - id: l2-n2
                type: text_input
                text: "Auf der Wanderkarte ist der Weg zur Hütte 8 cm lang. Maßstab: 1 cm sind 100 m. Wie viele Meter sind es? _ m"
                say: "Auf der Wanderkarte ist der Weg zur Hütte 8 Zentimeter lang. Der Maßstab ist: 1 Zentimeter sind 100 Meter. Wie viele Meter sind es?"
                answer: "800"
              - id: l2-n3
                type: true_false
                text: "Jonas sagt: „3 cm auf der Wanderkarte und 3 cm auf der Radkarte sind in echt gleich weit.“ Stimmt das?"
