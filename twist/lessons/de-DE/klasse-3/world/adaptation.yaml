# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.adaptation
skill: world.nature.adaptation
curriculum: de-DE
language: de
title:
  de: Gut angepasst
  en: Well adapted
summary: >
  Animals and plants are adapted to their habitat: their bodies and their
  behaviour suit the place they live. The story: Lina and Jonas make a
  nature film and ask every animal "What helps you live here?". Lesson 1
  looks at bodies: the duck's webbed feet and greased feathers, the fish's
  gills, the polar bear's fur and fat, the camel's eyelashes and broad
  feet, the owl's big eyes and soft feathers, the mole's digging hands.
  Lesson 2 looks at behaviour in winter (hibernation, winter torpor,
  stores, migration) and at plants (cactus, water lily, a broadleaf tree
  dropping its leaves), and ends with the skill check. There are no
  pictures of camel, polar bear, mole, squirrel, bat, stork, swallow,
  cactus or water lily yet, so these are text cards.
metadata:
  year: klasse-3
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.meadow, world.nature.animal-classes]
  also_practises: []
  vocabulary: { de: [Lebensraum, angepasst, Körperbau, Verhalten, Schwimmhaut, Kiemen, Fettschicht, Höcker, Wimpern, Winterschlaf, Winterstarre, Vorrat, Zugvogel, Kaktus, Seerose, Laubbaum] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: body, what: { de: "erklären, wie der Körperbau eines Tiers zu seinem Lebensraum passt", en: explaining how an animal's body suits its habitat } }
    - { id: behaviour, what: { de: "erklären, wie Tiere durch den Winter kommen", en: explaining how animals get through the winter } }
    - { id: plants, what: { de: "erklären, wie Pflanzen an ihren Lebensraum angepasst sind", en: explaining how plants are adapted to their habitat } }
    - { id: habitat, what: { de: "Tiere ihrem Lebensraum zuordnen und begründen", en: matching animals to their habitat with a reason } }
  misconceptions:
    - id: camel-hump-water
      what: Thinks the camel stores water in its hump
      addressed: the desert screen in lesson 1 says the hump holds fat; l1-f4
    - id: animals-choose-body
      what: Thinks adapted means an animal changes its body because it wants to, or that only animals adapt
      addressed: the definition on the duck screen and the plant screens in lesson 2; l1-n5, l2-s6, l2-c15 and l2-c20
    - id: winter-all-sleep
      what: Thinks every animal sleeps through the winter
      addressed: lesson 2 Learn sets hibernation, torpor, staying awake with stores and flying south side by side; l2-f2, l2-s3, l2-n2 and l2-c8
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was hilft dir, hier zu leben?", en: "What helps you live here?" }
    goal:
      de: "Erkläre, wie der Körper eines Tiers zu seinem Lebensraum passt. Die Ente zum Beispiel paddelt mit Schwimmhäuten."
      en: "Explain how an animal's body suits its habitat. The duck, for example, paddles with webbed feet."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Welches Tier findest du auf einer Wiese?"
            options:
              - { object: bee }
              - { object: shark }
              - { object: octopus }
            answer: bee
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ein Tier hat Kiemen und Flossen. Zu welcher Klasse gehört es?"
            options: ["Fische", "Säugetiere", "Vögel"]
            answer: "Fische"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Warum hat die Ente Füße wie Paddel?"
            say: "Lina und Jonas drehen einen Naturfilm. Jedes Tier fragen sie: Was hilft dir, hier zu leben? Zuerst filmen sie eine Ente auf dem Teich. Ihre Füße sehen aus wie kleine Paddel. Was glaubst du: Warum?"
            show: { object: duck }
          - text: "Mit Schwimmhäuten paddelt die Ente gut. Ihr Körper ist angepasst."
            say: "Zwischen den Zehen der Ente ist Haut gespannt, die Schwimmhaut. Damit paddelt sie gut durchs Wasser. Und sie fettet ihre Federn mit dem Schnabel ein, so bleibt sie trocken. Ihr Körper passt zum Leben am Wasser. Das nennt man: Die Ente ist an ihren Lebensraum angepasst. Der Lebensraum ist der Ort, an dem ein Tier lebt, zum Beispiel das Wasser, der Wald, die Wüste oder das Eis."
            show: { object: duck }
          - text: "Im Wasser: Kiemen, Flossen und eine schlanke Form"
            say: "Fische atmen mit Kiemen unter Wasser. Mit den Flossen steuern sie. Ihr schlanker Körper gleitet leicht durchs Wasser."
            show: { object: fish }
          - text: "In der Kälte: dickes Fell und eine Fettschicht"
            say: "Der Eisbär lebt im Eis und Schnee am Nordpol. Sein dickes Fell und eine dicke Fettschicht unter der Haut halten ihn warm. Sogar unter seinen Füßen wächst Fell. So rutscht er auf dem Eis nicht aus und bekommt keine kalten Füße."
          - text: "In der Wüste: lange Wimpern und breite Füße"
            say: "Das Kamel lebt in der Wüste. Dort ist es heiß und trocken. Das Kamel kann lange ohne Trinken auskommen. In seinem Höcker ist Fett, kein Wasser. Lange Wimpern schützen seine Augen vor Sand, und mit seinen breiten Füßen sinkt es im Sand nicht ein."
          - text: "In der Nacht: große Augen und weiche Federn"
            say: "Die Eule jagt nachts. Mit ihren großen Augen sieht sie im Dunkeln gut. Ihre Federn sind weich, darum fliegt sie fast lautlos. Die Maus hört sie nicht kommen."
            show: { object: owl }
          - text: "Wusstest du? Unter seinem weißen Fell hat der Eisbär eine schwarze Haut."
            say: "Wusstest du? Unter seinem weißen Fell hat der Eisbär eine schwarze Haut. Im Schnee sieht man ihn trotzdem kaum, denn sein Fell ist weiß."
          - text: "Frag bei jedem Tier: Was hilft ihm, genau hier zu leben?"
            say: "Das ist der Trick: Frag bei jedem Tier, was ihm in seinem Lebensraum hilft. Der Maulwurf zum Beispiel lebt unter der Erde. Seine Hände sind breit wie Schaufeln, damit gräbt er seine Gänge."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wozu hat die Ente Schwimmhäute zwischen den Zehen?"
                options: ["zum Paddeln im Wasser", "zum Klettern auf Bäume", "zum Graben in der Erde"]
                answer: "zum Paddeln im Wasser"
                hints:
                  - "Wo lebt die Ente?"
                  - "Die Ente schwimmt auf dem Teich. Was braucht sie dafür?"
                  - "Mit Schwimmhäuten paddelt sie durchs Wasser."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Tier hat einen Körper für das Leben unter Wasser?"
                options:
                  - { object: fish }
                  - { object: giraffe }
                  - { object: hedgehog }
                answer: fish
                hints:
                  - "Wer kann unter Wasser atmen?"
                  - "Unter Wasser braucht man Kiemen und Flossen."
                  - "Der Fisch hat Kiemen und Flossen."
                difficulty: easy
              - id: l1-f3
                type: sorting
                text: "Lege jedes Tier in seinen Lebensraum."
                say: "Lina sortiert ihre Filmszenen. Lege jedes Tier in seinen Lebensraum: Wasser, Eis und Schnee oder Wüste."
                bins:
                  - { id: water, show: { text: "Wasser" }, say: "Wasser" }
                  - { id: ice, show: { text: "Eis und Schnee" }, say: "Eis und Schnee" }
                  - { id: desert, show: { text: "Wüste" }, say: "Wüste" }
                options:
                  - { object: whale, bin: water }
                  - { text: "Eisbär", bin: ice }
                  - { text: "Kamel", bin: desert }
                  - { object: octopus, bin: water }
                  - { text: "Polarfuchs", bin: ice }
                  - { text: "Wüstenfuchs", bin: desert }
                hints:
                  - "Frag bei jedem Tier: Wo ist es zu Hause?"
                  - "Der Eisbär lebt am Nordpol, das Kamel in der heißen Wüste."
                  - "Wasser: Wal, Oktopus. Eis und Schnee: Eisbär, Polarfuchs. Wüste: Kamel, Wüstenfuchs."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Im Höcker des Kamels ist Wasser."
                answer: false
                feedback:
                  "true": "Das denken viele! Im Höcker ist aber Fett. Trotzdem kommt das Kamel lange ohne Trinken aus."
                hints:
                  - "Was ist im Höcker gespeichert?"
                  - "Es ist etwas, das dem Kamel Kraft gibt, aber kein Wasser."
                  - "Im Höcker ist Fett, kein Wasser."
              - id: l1-f5
                type: multiple_choice
                text: "Die Eule jagt nachts. Was hilft ihr dabei?"
                options: ["große Augen und weiche Federn", "ein dickes Fell unter den Füßen", "lange Wimpern gegen Sand"]
                answer: "große Augen und weiche Federn"
                hints:
                  - "Was braucht ein Jäger im Dunkeln?"
                  - "Sie muss gut sehen, und die Maus soll sie nicht hören."
                  - "Große Augen sehen im Dunkeln, weiche Federn fliegen leise."
              - id: l1-f6
                type: matching
                text: "Verbinde jedes Merkmal mit dem Lebensraum, zu dem es passt."
                pairs:
                  - { left: { text: "Kiemen und Flossen" }, right: { text: "Wasser" } }
                  - { left: { text: "dickes Fell und Fettschicht" }, right: { text: "Eis und Schnee" } }
                  - { left: { text: "lange Wimpern und breite Füße" }, right: { text: "Wüste" } }
                hints:
                  - "Wo braucht ein Tier Schutz vor Kälte, wo vor Sand?"
                  - "Kiemen braucht man zum Atmen unter Wasser."
                  - "Kiemen: Wasser. Fell und Fett: Eis und Schnee. Wimpern und breite Füße: Wüste."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welches Tier sieht nachts gut und fliegt fast lautlos?"
                options:
                  - { object: owl }
                  - { object: duck }
                  - { object: hen }
                answer: owl
                hints: ["Wer jagt nachts Mäuse?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Der Eisbär hat sogar unter den Füßen Fell."
                answer: true
                hints: ["Worauf läuft der Eisbär den ganzen Tag?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wozu hat der Eisbär eine dicke Fettschicht?"
                options: ["Sie hält ihn warm.", "Sie macht ihn schneller.", "Sie hilft ihm beim Klettern."]
                answer: "Sie hält ihn warm."
                hints: ["Wie ist es am Nordpol?"]
              - id: l1-s4
                type: sorting
                text: "Was hilft im Wasser, was in der Kälte?"
                bins:
                  - { id: water, show: { text: "hilft im Wasser" }, say: "hilft im Wasser" }
                  - { id: cold, show: { text: "hilft in der Kälte" }, say: "hilft in der Kälte" }
                options:
                  - { text: "Kiemen", bin: water }
                  - { text: "dichtes Winterfell", bin: cold }
                  - { text: "Schwimmhäute", bin: water }
                  - { text: "Fell unter den Füßen", bin: cold }
                  - { text: "Flossen", bin: water }
                hints: ["Was braucht ein Tier zum Schwimmen, was zum Warmbleiben?"]
              - id: l1-s5
                type: multiple_choice
                text: "Der Maulwurf lebt unter der Erde. Was passt zu seinem Leben dort?"
                options: ["Hände wie Schaufeln zum Graben", "lange Beine zum Rennen", "Flossen zum Schwimmen"]
                answer: "Hände wie Schaufeln zum Graben"
                hints: ["Was tut er den ganzen Tag unter der Erde?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Ein Fisch könnte genauso gut in der Wüste leben."
                answer: false
                feedback:
                  "true": "Ein Fisch in der Wüste? Er bräuchte einen sehr großen Eimer! Mit Kiemen kann er nur im Wasser atmen."
                hints: ["Womit atmet der Fisch, und was gibt es in der Wüste kaum?"]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "Welches Tier lebt wo? Verbinde."
                pairs:
                  - { left: { text: "Kamel" }, right: { text: "Wüste" } }
                  - { left: { object: whale }, right: { text: "Meer" } }
                  - { left: { text: "Eisbär" }, right: { text: "Eis und Schnee" } }
                  - { left: { text: "Maulwurf" }, right: { text: "unter der Erde" } }
              - id: l1-n2
                type: multiple_choice
                text: "Lina filmt ein Tier mit dickem Fell und einer Fettschicht. Wo dreht sie gerade?"
                options: ["am Nordpol", "in der Wüste", "unter Wasser bei den Fischen"]
                answer: "am Nordpol"
              - id: l1-n3
                type: image_multiple_choice
                text: "Welches Tier hat Schwimmhäute?"
                options:
                  - { object: duck }
                  - { object: owl }
                  - { object: hen }
                answer: duck
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Lange Wimpern schützen die Augen des Kamels vor Sand."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Jonas fragt: „Was heißt angepasst?“ Was antwortest du?"
                options: ["Der Körper eines Tiers passt zu seinem Lebensraum.", "Ein Tier zieht jedes Jahr um.", "Alle Tiere sehen gleich aus."]
                answer: "Der Körper eines Tiers passt zu seinem Lebensraum."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wozu braucht der Fisch Kiemen?"
            options: ["zum Atmen im Wasser", "zum Graben", "zum Fliegen"]
            answer: "zum Atmen im Wasser"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welches Tier ist an das Leben im Meer angepasst?"
            options:
              - { object: whale }
              - { object: horse }
              - { object: fox }
            answer: whale
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Das Kamel kann lange ohne Trinken auskommen."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Was schützt den Eisbären vor der Kälte?"
            options: ["dickes Fell und Fett", "Flossen", "lange Wimpern"]
            answer: "dickes Fell und Fett"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Die Eule fliegt laut, damit die Maus erschrickt."
            answer: false
          - id: l1-c6
            type: matching
            text: "Wer hat was? Verbinde."
            pairs:
              - { left: { object: duck }, right: { text: "Schwimmhäute" } }
              - { left: { text: "Maulwurf" }, right: { text: "Hände wie Schaufeln" } }
              - { left: { text: "Kamel" }, right: { text: "Höcker mit Fett" } }

  - n: 2
    title: { de: "Durch den Winter und durch die Wüste", en: "Through the winter and the desert" }
    goal:
      de: "Erkläre, wie Tiere durch den Winter kommen und wie Pflanzen angepasst sind. Der Igel zum Beispiel hält Winterschlaf."
      en: "Explain how animals get through the winter and how plants are adapted. The hedgehog, for example, hibernates."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was hilft der Ente im Wasser?"
            options: ["Schwimmhäute", "lange Wimpern", "Hände wie Schaufeln"]
            answer: "Schwimmhäute"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Eisbär hat eine dicke Fettschicht."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wo ist der Igel im Winter?"
            say: "Im Herbst haben Lina und Jonas im Garten einen Igel gefilmt. Jetzt ist Januar, und der Igel ist verschwunden. Was glaubst du: Wo ist er?"
            show: { object: hedgehog }
          - text: "Er hält Winterschlaf. Auch Verhalten kann angepasst sein."
            say: "Der Igel schläft unter einem Laubhaufen. Im Winter findet er keine Käfer und Würmer. Darum frisst er sich im Herbst dick und schläft dann den ganzen Winter. Angepasst ist also nicht nur der Körperbau, sondern auch das Verhalten, also das, was ein Tier tut. Wer einen schlafenden Igel findet, lässt ihn in Ruhe."
            show: { object: hedgehog }
          - text: "Schlafen, starr werden oder wach bleiben"
            say: "Tiere kommen auf verschiedene Weise durch den Winter. Igel, Fledermaus und Siebenschläfer halten Winterschlaf. Frosch und Eidechse fallen in Winterstarre: Ihr Körper wird kalt, und sie bewegen sich nicht, bis es wärmer wird. Das Eichhörnchen bleibt wach. Es hat im Herbst Nüsse versteckt und frisst im Winter davon."
            show: { object: frog }
          - text: "Oder wegfliegen: Storch und Schwalbe ziehen nach Süden."
            say: "Storch und Schwalbe fliegen im Herbst weit nach Süden, viele bis nach Afrika. Hier fänden sie im Winter zu wenig Futter. Im Frühling kommen sie zurück. Solche Vögel heißen Zugvögel."
          - text: "Auch Pflanzen sind angepasst: der Kaktus in der Wüste"
            say: "Der Kaktus lebt in der Wüste. In seinem dicken Stamm speichert er Wasser. Statt Blättern hat er Stacheln. So verliert er wenig Wasser, und Tiere fressen ihn nicht so leicht."
          - text: "Die Seerose im Teich: Ihre Blätter schwimmen."
            say: "Die Seerose wächst im Teich. Ihre Wurzeln stecken im Boden unter dem Wasser. Ihre großen Blätter schwimmen oben auf dem Wasser, wo die Sonne hinkommt."
          - text: "Der Laubbaum wirft im Herbst seine Blätter ab."
            say: "Im Winter ist der Boden oft gefroren, und der Baum bekommt wenig Wasser. Über seine Blätter würde er Wasser verlieren. Darum wirft ein Laubbaum im Herbst seine Blätter ab und ruht bis zum Frühling."
            show: { object: tree }
          - text: "Körperbau und Verhalten: Beides hilft beim Überleben."
            say: "Jetzt hat der Film zwei Teile. Körperbau: Schwimmhäute, Fell, große Augen. Verhalten: Winterschlaf, Vorräte verstecken, nach Süden fliegen. Und auch Pflanzen sind angepasst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum hält der Igel Winterschlaf?"
                options: ["Im Winter findet er kein Futter.", "Er mag keinen Schnee sehen.", "Er ist im Winter immer krank."]
                answer: "Im Winter findet er kein Futter."
                hints:
                  - "Was frisst der Igel im Sommer?"
                  - "Käfer und Würmer gibt es im Winter kaum."
                  - "Ohne Futter schläft er, bis es wieder Käfer gibt."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Was macht dieses Tier im Winter?"
                say: "Was macht dieses Tier im Winter? Sortiere."
                bins:
                  - { id: sleep, show: { text: "Winterschlaf" }, say: "Winterschlaf" }
                  - { id: torpor, show: { text: "Winterstarre" }, say: "Winterstarre" }
                  - { id: south, show: { text: "fliegt nach Süden" }, say: "fliegt nach Süden" }
                options:
                  - { object: hedgehog, bin: sleep }
                  - { object: frog, bin: torpor }
                  - { text: "Storch", bin: south }
                  - { text: "Fledermaus", bin: sleep }
                  - { text: "Eidechse", bin: torpor }
                  - { text: "Schwalbe", bin: south }
                hints:
                  - "Wer schläft, wer wird kalt und starr, wer fliegt weg?"
                  - "Frosch und Eidechse werden starr. Storch und Schwalbe sind Zugvögel."
                  - "Winterschlaf: Igel, Fledermaus. Winterstarre: Frosch, Eidechse. Nach Süden: Storch, Schwalbe."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Der Kaktus speichert Wasser in seinem dicken Stamm."
                answer: true
                hints:
                  - "In der Wüste regnet es selten."
                  - "Der Kaktus braucht einen Speicher für die trockene Zeit."
                  - "Ja, sein dicker Stamm ist der Wasserspeicher."
              - id: l2-f4
                type: image_multiple_choice
                text: "Welches Tier hält Winterschlaf?"
                options:
                  - { object: hedgehog }
                  - { object: fox }
                  - { object: duck }
                answer: hedgehog
                hints:
                  - "Wer verschwindet im Winter unter einem Laubhaufen?"
                  - "Fuchs und Ente sind auch im Winter unterwegs."
                  - "Der Igel hält Winterschlaf."
              - id: l2-f5
                type: multiple_choice
                text: "Warum wirft ein Laubbaum im Herbst seine Blätter ab?"
                options: ["So verliert er im Winter weniger Wasser.", "Die Blätter sind ihm zu schwer.", "Er will den Kindern Laub zum Spielen schenken."]
                answer: "So verliert er im Winter weniger Wasser."
                feedback:
                  "Er will den Kindern Laub zum Spielen schenken.": "Das wäre nett von ihm! Aber der Baum hat einen anderen Grund: Er spart Wasser."
                hints:
                  - "Wie ist der Boden im Winter?"
                  - "Aus gefrorenem Boden bekommt der Baum wenig Wasser."
                  - "Ohne Blätter verliert er im Winter weniger Wasser."
              - id: l2-f6
                type: matching
                text: "Verbinde jede Pflanze mit ihrem Trick."
                pairs:
                  - { left: { text: "Kaktus" }, right: { text: "speichert Wasser im Stamm" } }
                  - { left: { text: "Seerose" }, right: { text: "Blätter schwimmen auf dem Wasser" } }
                  - { left: { object: tree }, right: { text: "wirft im Herbst die Blätter ab" } }
                hints:
                  - "Wo wächst jede Pflanze?"
                  - "Der Kaktus wächst in der Wüste, die Seerose im Teich."
                  - "Kaktus: speichert Wasser. Seerose: Blätter schwimmen. Laubbaum: wirft die Blätter ab."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum fliegen Storch und Schwalbe im Herbst nach Süden?"
                options: ["Im Winter finden sie hier zu wenig Futter.", "Sie machen dort Ferien am Strand.", "Ihre Federn sind zu warm."]
                answer: "Im Winter finden sie hier zu wenig Futter."
                hints: ["Was fressen sie, und gibt es das hier im Winter?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Welches Tier fällt im Winter in Winterstarre?"
                options:
                  - { object: frog }
                  - { object: fox }
                  - { object: owl }
                answer: frog
                hints: ["Wessen Körper wird im Winter kalt und starr?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Das Eichhörnchen schläft den ganzen Winter, ohne aufzuwachen."
                answer: false
                feedback:
                  "true": "Das Eichhörnchen bleibt wach. Es frisst von den Nüssen, die es im Herbst versteckt hat."
                hints: ["Wozu hat es im Herbst Nüsse versteckt?"]
              - id: l2-s4
                type: sorting
                text: "Körperbau oder Verhalten?"
                say: "Ist das Körperbau oder Verhalten? Sortiere."
                bins:
                  - { id: body, show: { text: "Körperbau" }, say: "Körperbau" }
                  - { id: behaviour, show: { text: "Verhalten" }, say: "Verhalten" }
