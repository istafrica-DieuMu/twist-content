# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.children-rights
skill: world.society.children-rights
curriculum: de-DE
language: de
title:
  de: Kinderrechte
  en: Children's rights
summary: >
  The Klasse 3c makes a poster for the Tag der Kinderrechte on 20 November.
  Lesson 1 says what children's rights are: the United Nations agreed them
  in 1989 (the UN Convention on the Rights of the Child), and they hold for
  every child under 18, wherever they live, whatever language they speak,
  with or without a disability. It names the rights to health, education,
  play, leisure and rest, protection from violence, protection in war and
  flight, care by parents, and an own opinion, and that no child may be
  treated worse than others. A right is not a wish (a phone is a wish), and
  no child has to earn it or loses it for doing something wrong. Lesson 2
  is about what the rights mean for the child: the right to be heard
  (children's views on a new playground count, but being heard does not
  mean deciding everything), taking part in the Klassenrat and through the
  Klassensprecher, privacy (a diary), that some children elsewhere must
  work instead of going to school, where to get help, and that the others
  have the same rights. It ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Rechte und Vielfalt, en: Rights and diversity }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.society.needs-wants, world.society.class-council]
  also_practises: []
  vocabulary: { de: [Kinderrecht, Recht, Vereinte Nationen, Bildung, Gesundheit, Freizeit, Schutz, Gewalt, Fürsorge, Meinung, mitbestimmen, Privatsphäre, benachteiligen, einhalten, verletzen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: what, what: { de: "sagen, was Kinderrechte sind und für wen sie gelten", en: "saying what children's rights are and who they are for" } }
    - { id: name, what: { de: Kinderrechte nennen und von Wünschen unterscheiden, en: naming children's rights and telling them from wishes } }
    - { id: examples, what: { de: "an Beispielen erkennen, welches Recht gemeint ist und ob es eingehalten wird", en: recognising in examples which right is meant and whether it is kept } }
    - { id: voice, what: { de: "erklären, was das Recht auf Mitbestimmung für mich heißt", en: explaining what the right to have a say means for me } }
  misconceptions:
    - id: rights-are-wishes
      what: Thinks a child has a right to anything they want (a phone, a bike)
      addressed: lesson 1 Learn screen "Ein Recht ist kein Wunsch"; l1-f2, l1-s2, l1-n2, l2-n3 and the check tasks l2-c6 and l2-c9
    - id: rights-must-be-earned
      what: Thinks rights are a reward that can be taken away for bad behaviour
      addressed: lesson 1 Learn says no child has to earn its rights or loses them; l1-f4 and l2-c3
    - id: heard-means-decide
      what: Thinks the right to be heard means children decide everything
      addressed: lesson 2 opens with the playground and says being heard is not always deciding; l2-f2, l2-s1, l2-n1, l2-n2, l2-n4 and l2-c16
    - id: rights-only-some
      what: Thinks the rights hold only for some children (in Germany, without a disability, who speak German)
      addressed: lesson 1 Learn screen 2; l1-f1, l1-s4, l1-n3, l1-n4 and l2-c2, l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Rechte für alle Kinder", en: "Rights for every child" }
    goal:
      de: "Lerne die Kinderrechte kennen und unterscheide ein Recht von einem Wunsch. Zur Schule gehen zum Beispiel ist ein Recht, ein Handy ist ein Wunsch."
      en: "Get to know children's rights and tell a right from a wish. Going to school, for example, is a right; a phone is a wish."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was braucht jeder Mensch zum Leben?"
            options: ["Essen und Wasser", "ein eigenes Pony", "ein neues Handy"]
            answer: "Essen und Wasser"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Im Klassenrat wird abgestimmt. Wie viele Stimmen hat jedes Kind?"
            options: ["eine", "zwei", "so viele, wie es will"]
            answer: "eine"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Gibt es Rechte nur für Erwachsene?"
            say: "Die Klasse 3c macht ein großes Plakat für den Tag der Kinderrechte am 20. November. Emre fragt: Rechte, haben die nicht nur Erwachsene? Was glaubst du: Gibt es Rechte nur für Erwachsene?"
          - text: "Nein! Seit 1989 gibt es Rechte extra für Kinder."
            say: "Nein. Im Jahr 1989 haben die Vereinten Nationen die Kinderrechte beschlossen. In den Vereinten Nationen arbeiten fast alle Länder der Welt zusammen. Die Kinderrechte gelten für alle Kinder unter 18 Jahren, egal wo sie leben, welche Sprache sie sprechen, wie sie aussehen oder ob sie eine Behinderung haben. Auch Deutschland macht mit."
          - text: "Recht auf Gesundheit, auf Bildung, auf Spiel, Freizeit und Ruhe"
            say: "Hier sind einige Kinderrechte. Jedes Kind hat das Recht auf Gesundheit: Wenn es krank ist, bekommt es Hilfe. Es hat das Recht auf Bildung: Es darf zur Schule gehen und lernen. Und es hat das Recht auf Spiel, Freizeit und Ruhe."
            show: { object: school }
          - text: "Recht auf Schutz und auf Fürsorge"
            say: "Jedes Kind hat das Recht, ohne Gewalt aufzuwachsen. Niemand darf es schlagen oder ihm wehtun. Kinder haben ein Recht auf Schutz, auch im Krieg und auf der Flucht. Und sie haben ein Recht auf Fürsorge: Ihre Eltern oder andere Erwachsene sorgen für sie."
          - text: "Recht auf eine eigene Meinung. Kein Kind darf benachteiligt werden."
            say: "Jedes Kind darf seine Meinung sagen. Wenn es um Dinge geht, die Kinder betreffen, müssen Erwachsene ihnen zuhören und ihre Meinung ernst nehmen. Und kein Kind darf benachteiligt werden: Die Rechte gelten für alle Kinder gleich."
          - text: "Ein Recht ist kein Wunsch."
            say: "Lotta fragt: Habe ich auch ein Recht auf ein eigenes Handy? Nein. Kinderrechte sind das, was jedes Kind braucht, um gesund und sicher aufzuwachsen. Ein Handy ist ein Wunsch. Und ein Recht muss man sich nicht verdienen. Kein Kind verliert seine Rechte, wenn es etwas falsch gemacht hat."
          - text: "Wusstest du? Kein Vertrag über Menschenrechte wurde von so vielen Ländern angenommen wie die Kinderrechte."
            say: "Wusstest du? Kein anderer Vertrag über Menschenrechte wurde von so vielen Ländern angenommen wie die Kinderrechte. Fast alle Länder der Welt machen mit."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Für wen gelten die Kinderrechte?"
                options: ["für alle Kinder unter 18 Jahren", "nur für Kinder in Deutschland", "nur für Kinder, die immer brav sind"]
                answer: "für alle Kinder unter 18 Jahren"
                feedback:
                  "nur für Kinder in Deutschland": "Fast alle Länder der Welt machen mit. Die Rechte gelten für Kinder überall."
                hints:
                  - "Denk an Emres Frage. Wer hat die Kinderrechte beschlossen?"
                  - "Fast alle Länder der Welt machen mit, und man muss sich die Rechte nicht verdienen."
                  - "Die Kinderrechte gelten für alle Kinder unter 18 Jahren."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Kinderrecht oder Wunsch?"
                say: "Emre und Lotta sortieren Karten. Ist das ein Kinderrecht oder ein Wunsch?"
                bins:
                  - { id: recht, show: { text: "Kinderrecht" }, say: "Kinderrecht" }
                  - { id: wunsch, show: { text: "Wunsch" }, say: "Wunsch" }
                options:
                  - { text: "zur Schule gehen und lernen", bin: recht }
                  - { text: "ein eigenes Handy", bin: wunsch }
                  - { text: "Hilfe, wenn man krank ist", bin: recht }
                  - { text: "jeden Tag ein Eis", bin: wunsch }
                  - { text: "Zeit zum Spielen", bin: recht }
                  - { text: "ein großes Zimmer", bin: wunsch }
                hints:
                  - "Frag bei jeder Karte: Braucht das jedes Kind, um gesund und sicher aufzuwachsen?"
                  - "Ein Handy oder jeden Tag ein Eis braucht man nicht zum Aufwachsen."
                  - "Kinderrechte: Schule, Hilfe bei Krankheit, Zeit zum Spielen. Die anderen sind Wünsche."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welches Bild passt zum Recht auf Bildung?"
                options:
                  - { object: school }
                  - { object: ice-cream }
                  - { object: sofa }
                answer: school
                hints:
                  - "Bildung heißt: lernen."
                  - "Wo lernen Kinder lesen, schreiben und rechnen?"
                  - "Die Schule passt zum Recht auf Bildung."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Ein Kind, das etwas falsch gemacht hat, verliert seine Kinderrechte."
                answer: false
                feedback:
                  "true": "Kinderrechte muss man sich nicht verdienen. Kein Kind verliert sie, auch nicht nach einem Fehler."
                hints:
                  - "Muss man sich ein Kinderrecht verdienen?"
                  - "Die Rechte gelten für alle Kinder, immer."
                  - "Nein. Kein Kind verliert seine Rechte."
              - id: l1-f5
                type: matching
                text: "Welches Recht ist das? Verbinde."
                pairs:
                  - { left: { text: "Ali ist krank und geht zur Ärztin." }, right: { text: "Recht auf Gesundheit" } }
                  - { left: { text: "Jana lernt in der Schule lesen." }, right: { text: "Recht auf Bildung" } }
                  - { left: { text: "Tim spielt nach der Schule Fußball." }, right: { text: "Recht auf Spiel und Freizeit" } }
                hints:
                  - "Fang mit Ali an. Was braucht ein krankes Kind?"
                  - "Bildung heißt lernen, Freizeit heißt spielen."
                  - "Ali: Gesundheit. Jana: Bildung. Tim: Spiel und Freizeit."
              - id: l1-f6
                type: multiple_choice
                text: "Wer hat die Kinderrechte beschlossen?"
                options: ["die Vereinten Nationen, in denen fast alle Länder zusammenarbeiten", "der Bürgermeister einer Stadt", "Emres Klasse"]
                answer: "die Vereinten Nationen, in denen fast alle Länder zusammenarbeiten"
                feedback:
                  "Emres Klasse": "Die Klasse macht ein Plakat über die Kinderrechte. Beschlossen haben sie die Vereinten Nationen."
                hints:
                  - "Die Kinderrechte gelten auf der ganzen Welt."
                  - "Wer kann etwas für fast alle Länder beschließen?"
                  - "Die Vereinten Nationen haben sie 1989 beschlossen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Niemand darf ein Kind schlagen."
                answer: true
                hints: ["Denk an das Recht auf Schutz vor Gewalt."]
              - id: l1-s2
                type: multiple_choice
                text: "Lotta sagt: „Ich habe ein Recht auf ein neues Fahrrad.“ Was stimmt?"
                show: { object: bike }
                options: ["Ein Fahrrad ist ein Wunsch, kein Kinderrecht.", "Das stimmt, jedes Kind bekommt ein Fahrrad.", "Nur Mädchen haben dieses Recht."]
                answer: "Ein Fahrrad ist ein Wunsch, kein Kinderrecht."
                hints: ["Braucht jedes Kind ein Fahrrad, um gesund und sicher aufzuwachsen?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welches Bild passt zum Recht auf Gesundheit?"
                options:
                  - { object: doctor }
                  - { object: kite }
                  - { object: cake }
                answer: doctor
                hints: ["Wer hilft, wenn du krank bist?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? Die Kinderrechte gelten nur für Kinder ohne Behinderung."
                answer: false
                feedback:
                  "true": "Die Kinderrechte gelten für alle Kinder, mit und ohne Behinderung."
                hints: ["Für wie viele Kinder gelten die Rechte?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Für wen gelten die Kinderrechte?"
                say: "Setz die passenden Wörter ein."
                frame: "Die Kinderrechte gelten für alle Kinder unter _ Jahren, egal wo sie _."
                options: ["18", "leben", "10", "schlafen"]
                answer: ["18", "leben"]
                hints: ["Ab welchem Alter ist man erwachsen?"]
              - id: l1-s6
                type: matching
                text: "Verbinde jedes Recht mit seinem Beispiel."
                pairs:
                  - { left: { text: "Recht auf Schutz" }, right: { text: "Niemand darf dir wehtun." } }
                  - { left: { text: "Recht auf eine eigene Meinung" }, right: { text: "Du darfst sagen, was du denkst." } }
                  - { left: { text: "Recht auf Fürsorge" }, right: { text: "Erwachsene sorgen für dich." } }
                hints: ["Fürsorge kommt von „sorgen“."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Für das Plakat malt Emre ein Kind, das in der Schule rechnet. Zu welchem Recht passt das Bild?"
                options: ["Recht auf Bildung", "Recht auf Gesundheit", "Recht auf Schutz im Krieg"]
                answer: "Recht auf Bildung"
              - id: l1-n2
                type: sorting
                text: "Was kommt aufs Plakat?"
                say: "Emre und Lotta wollen nur Kinderrechte aufs Plakat schreiben. Was ist ein Kinderrecht, was nicht?"
                bins:
                  - { id: recht, show: { text: "Kinderrecht" }, say: "Kinderrecht" }
                  - { id: kein, show: { text: "kein Kinderrecht" }, say: "kein Kinderrecht" }
                options:
                  - { text: "spielen und sich ausruhen", bin: recht }
                  - { text: "jeden Abend fernsehen, so lange man will", bin: kein }
                  - { text: "ohne Gewalt aufwachsen", bin: recht }
                  - { text: "die neuesten Turnschuhe", bin: kein }
              - id: l1-n3
                type: true_false
                text: "Lotta schreibt aufs Plakat: „Die Kinderrechte gelten für alle Kinder, egal welche Sprache sie sprechen.“ Stimmt das?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Ben ist neu in Deutschland und spricht noch wenig Deutsch. Darf er zur Schule gehen?"
                options: ["Ja, jedes Kind hat das Recht auf Bildung.", "Nein, erst wenn er gut Deutsch kann.", "Nur, wenn er dafür bezahlt."]
                answer: "Ja, jedes Kind hat das Recht auf Bildung."
              - id: l1-n5
                type: image_multiple_choice
                text: "Lotta malt das Recht auf Spiel und Freizeit. Welches Bild passt?"
                options:
                  - { object: kite }
                  - { object: toothbrush }
                  - { object: schoolbag }
                answer: kite

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist ein Kinderrecht?"
            options: ["das Recht auf Spiel und Freizeit", "das Recht auf Süßigkeiten jeden Tag", "das Recht auf ein eigenes Tablet"]
            answer: "das Recht auf Spiel und Freizeit"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Die Kinderrechte gelten nur für Jungen."
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Wo nutzt du dein Recht auf Bildung?"
            options:
              - { object: school }
              - { object: swimming-pool }
              - { object: supermarket }
            answer: school
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Kein Kind darf benachteiligt werden."
            answer: true
          - id: l1-c5
            type: matching
            text: "Verbinde jedes Recht mit seinem Beispiel."
            pairs:
              - { left: { text: "Recht auf Gesundheit" }, right: { text: "Ein krankes Kind bekommt Hilfe." } }
              - { left: { text: "Recht auf Bildung" }, right: { text: "Jedes Kind darf lernen." } }
          - id: l1-c6
            type: multiple_choice
            text: "Bis zu welchem Alter gelten die Kinderrechte?"
            options: ["bis man 18 Jahre alt ist", "bis man 6 Jahre alt ist", "bis man 10 Jahre alt ist"]
            answer: "bis man 18 Jahre alt ist"

  - n: 2
    title: { de: "Meine Rechte, meine Stimme", en: "My rights, my say" }
    goal:
      de: "Finde heraus, was die Kinderrechte für dich bedeuten. Wenn deine Stadt einen Spielplatz plant, darfst du zum Beispiel deine Meinung sagen."
      en: "Find out what children's rights mean for you. When your town plans a playground, for example, you may give your opinion."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Jedes Kind hat das Recht auf Spiel und Freizeit."
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist ein Kinderrecht?"
            options: ["Niemand darf einem Kind wehtun.", "Jedes Kind bekommt ein Handy.", "Kinder müssen nie aufräumen."]
            answer: "Niemand darf einem Kind wehtun."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Dürfen Kinder mitreden, wenn ein Spielplatz neu gebaut wird?"
            say: "In Emres Stadt soll der Spielplatz neu gebaut werden. Die Stadt plant ihn. Was glaubst du: Dürfen die Kinder dabei mitreden?"
          - text: "Ja! Kinder haben das Recht, gehört zu werden."
            say: "Ja. Wenn es um Dinge geht, die Kinder betreffen, dürfen sie ihre Meinung sagen, und Erwachsene müssen sie ernst nehmen. Manche Städte fragen deshalb Kinder, was ein Spielplatz haben soll. Emres Klasse malt Bilder und schreibt ihre Ideen auf: eine Seilbahn, eine Kletterwand und Bänke im Schatten."
          - text: "Gehört werden heißt nicht immer bestimmen."
            say: "Die Stadt hört die Kinder an und überlegt. Für die Seilbahn ist kein Platz, aber die Kletterwand wird gebaut. Nicht jeder Wunsch wird erfüllt, aber die Meinung der Kinder zählt mit. So ist es auch zu Hause: Deine Eltern hören dir zu, aber manches entscheiden sie."
          - text: "Mitbestimmen in der Schule"
            say: "Auch in der Schule bestimmen Kinder mit: im Klassenrat, und durch die Klassensprecherin oder den Klassensprecher. Sie sprechen für die ganze Klasse."
            show: { object: school }
          - text: "Recht auf Privatsphäre"
            say: "Ein weiteres Kinderrecht heißt Privatsphäre. Lottas Tagebuch gehört ihr. Niemand darf es einfach ungefragt lesen. Aber ein Geheimnis, bei dem du dich schlecht fühlst, darfst du immer einem Erwachsenen erzählen, dem du vertraust."
          - text: "Nicht überall werden die Kinderrechte eingehalten."
            say: "Die Kinderrechte gelten überall, aber nicht überall werden sie eingehalten. In manchen Ländern müssen Kinder arbeiten, statt zur Schule zu gehen. Wenn deine Rechte verletzt werden, hol dir Hilfe: bei deinen Eltern, bei einer Lehrerin oder einem Lehrer, oder bei der Nummer gegen Kummer."
          - text: "Meine Rechte, deine Rechte"
            say: "Die anderen Kinder haben dieselben Rechte wie du. Wenn du deine Meinung sagst, hörst du auch den anderen zu."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Stadt baut einen neuen Spielplatz. Was dürfen die Kinder?"
                options: ["ihre Ideen sagen, und die Stadt hört zu", "alles allein bestimmen", "gar nichts sagen"]
                answer: "ihre Ideen sagen, und die Stadt hört zu"
                hints:
                  - "Der Spielplatz ist für Kinder. Betrifft er sie also?"
                  - "Kinder werden gehört. Bestimmen sie deshalb alles allein?"
                  - "Die Kinder sagen ihre Ideen, und die Stadt hört zu."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Gehört werden heißt, dass immer passiert, was ich will."
                answer: false
                feedback:
                  "true": "Die Kinder haben sich eine Seilbahn gewünscht, und sie kam nicht. Gehört wurden sie trotzdem."
                hints:
                  - "Denk an die Seilbahn auf dem Spielplatz."
                  - "Die Stadt hat zugehört. Wurde jeder Wunsch erfüllt?"
                  - "Nein. Gehört werden heißt nicht immer bestimmen."
              - id: l2-f3
                type: matching
                text: "Welches Kinderrecht steckt darin? Verbinde."
                pairs:
                  - { left: { text: "Emre sagt im Klassenrat, was er über die Pausenregeln denkt." }, right: { text: "Recht auf eine eigene Meinung" } }
                  - { left: { text: "Niemand liest ungefragt Lottas Tagebuch." }, right: { text: "Recht auf Privatsphäre" } }
                  - { left: { text: "Mia hat nach den Hausaufgaben Zeit zum Spielen." }, right: { text: "Recht auf Spiel und Freizeit" } }
                hints:
                  - "Fang mit dem Tagebuch an. Wem gehört es?"
                  - "Privatsphäre heißt: Manche Dinge gehören nur dir."
                  - "Emre: Meinung. Lotta: Privatsphäre. Mia: Spiel und Freizeit."
              - id: l2-f4
                type: multiple_choice
                text: "Wie heißt das Kind, das für die ganze Klasse spricht?"
                options: ["Klassensprecherin oder Klassensprecher", "Zeitwächter", "Hausmeister"]
                answer: "Klassensprecherin oder Klassensprecher"
                hints:
                  - "Das Wort hat „sprechen“ in sich."
                  - "Der Zeitwächter passt im Klassenrat auf die Zeit auf."
                  - "Es ist die Klassensprecherin oder der Klassensprecher."
              - id: l2-f5
                type: multiple_choice
                text: "Malik fühlt sich wegen eines Geheimnisses schlecht. Was darf er tun?"
                options: ["Er darf es einem Erwachsenen erzählen, dem er vertraut.", "Er muss es für immer für sich behalten.", "Er darf mit niemandem reden."]
                answer: "Er darf es einem Erwachsenen erzählen, dem er vertraut."
                hints:
                  - "Wie fühlt sich Malik mit diesem Geheimnis?"
                  - "Ein Geheimnis, bei dem du dich schlecht fühlst, darfst du immer weitersagen."
                  - "Er darf es einem Erwachsenen erzählen, dem er vertraut."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? In manchen Ländern müssen Kinder arbeiten, statt zur Schule zu gehen."
                answer: true
                hints:
                  - "Gelten die Kinderrechte überall?"
                  - "Sie gelten überall, aber werden sie überall eingehalten?"
                  - "Ja, leider. Dort wird das Recht auf Bildung nicht eingehalten."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was heißt „Kinder werden gehört“?"
                options: ["Erwachsene hören ihre Meinung an und nehmen sie ernst.", "Kinder müssen immer laut sein.", "Kinder bestimmen alles allein."]
                answer: "Erwachsene hören ihre Meinung an und nehmen sie ernst."
                feedback:
                  "Kinder müssen immer laut sein.": "Ganz laut rufen? Das ist nicht gemeint! Gehört werden heißt: Erwachsene nehmen deine Meinung ernst."
                hints: ["Wer hört zu, und was macht er mit der Meinung?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Die anderen Kinder haben dieselben Rechte wie ich."
                answer: true
                hints: ["Für wen gelten die Kinderrechte?"]
              - id: l2-s3
                type: sorting
                text: "Wird hier ein Kinderrecht eingehalten?"
                bins:
                  - { id: ja, show: { text: "eingehalten" }, say: "eingehalten" }
                  - { id: nein, show: { text: "nicht eingehalten" }, say: "nicht eingehalten" }
