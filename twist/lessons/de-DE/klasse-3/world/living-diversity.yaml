# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.living-diversity
skill: world.society.living-diversity
curriculum: de-DE
language: de
title:
  de: Leben in Vielfalt
  en: Living with diversity
summary: >
  The Klasse 3b makes a wall newspaper, "So leben wir", with a profile of
  every child. Lesson 1 compares ways of living: breakfast (a roll with
  jam, flatbread with cheese and olives, muesli, warm rice soup), living in
  a village or a town, languages at home, festivals and free time (Jonas
  uses a wheelchair and plays wheelchair basketball). What we find normal
  we mostly learned at home; different is not wrong or strange, only
  different from me. Comparing asks what is the same and what differs:
  every child needs a home, food, friends and time to play. Lesson 2 is
  about prejudice and fixed role pictures: colours, toys and jobs are for
  everyone; a prejudice judges people before knowing them ("Alle Mädchen
  ..."); there are prejudices about people with a disability too (Jonas
  plays sport; ask before helping); German Sign Language is a language of
  its own. Answer a prejudice with "Woher weißt du das? Stimmt das für
  alle?". It ends with the skill check. Sexual orientation and gender
  identity are out of scope (decided).
metadata:
  year: klasse-3
  topic: { de: Rechte und Vielfalt, en: Rights and diversity }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.society.families]
  also_practises: []
  vocabulary: { de: [Vielfalt, vergleichen, Gemeinsamkeit, Unterschied, Stadt, Dorf, normal, Vorurteil, Rollenbild, Behinderung, Rollstuhl, gehörlos, Gebärdensprache] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: compare, what: { de: "Lebensweisen vergleichen: was gleich ist und was verschieden", en: "comparing ways of life: what is the same and what differs" } }
    - { id: respect, what: { de: "erklären, dass anders nicht falsch ist", en: explaining that different is not wrong } }
    - { id: prejudice, what: { de: Vorurteile erkennen und darauf antworten, en: spotting prejudices and answering them } }
    - { id: roles, what: { de: "feste Rollenbilder erkennen: Farben, Spielzeug und Berufe sind für alle", en: "spotting fixed gender roles: colours, toys and jobs are for everyone" } }
  misconceptions:
    - id: my-way-is-normal
      what: Thinks the way their own family lives is the normal or right way and others are strange
      addressed: lesson 1 opens with the breakfast guess and says what we find normal we learned at home; l1-f1, l1-s2, l1-n3, l1-c6 and the check tasks l2-c6, l2-c7 and l2-c8
    - id: colours-toys-for-one-gender
      what: Thinks some colours, toys or jobs are only for girls or only for boys
      addressed: lesson 2 opens with Ole's "Mädchenfarbe" and answers it; l2-f1, l2-f3, l2-s3, l2-n4 and l2-c16 to l2-c20
    - id: disability-cannot
      what: Thinks people with a disability cannot do sport or much at all
      addressed: Jonas plays wheelchair basketball in lesson 1 and lesson 2 Learn; l2-f6, l2-s4 and l2-c12
    - id: prejudice-is-fact
      what: Takes a sentence about a whole group ("Alle Jungen sind ...") for a fact
      addressed: lesson 2 Learn defines Vorurteil and how to answer it; l2-f2, l2-s2, l2-n3 and l2-c11 to l2-c14
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "So leben wir", en: "How we live" }
    goal:
      de: "Vergleiche, wie Kinder leben: Was ist gleich, was ist verschieden? Can isst Oliven zum Frühstück, Leni ein Marmeladenbrötchen, und beide werden satt."
      en: "Compare how children live: what is the same, what differs? Can eats olives for breakfast, Leni a roll with jam, and both are full."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was haben alle Familien gemeinsam?"
            options: ["Sie sorgen füreinander.", "Sie haben genau zwei Kinder.", "Sie wohnen mit den Großeltern in einem Haus."]
            answer: "Sie sorgen füreinander."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Alle Familien sind gleich groß."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Frühstücken alle Kinder der Klasse 3b das Gleiche?"
            say: "Die Klasse 3b macht eine Wandzeitung. Sie heißt: So leben wir. Jedes Kind schreibt einen Steckbrief über sich. Die erste Frage lautet: Was isst du zum Frühstück? Was glaubst du: Frühstücken alle Kinder das Gleiche?"
          - text: "Nein! Fast jedes Kind frühstückt etwas anderes."
            say: "Nein. Leni isst ein Brötchen mit Marmelade. Can isst Fladenbrot mit Schafskäse, Oliven und Gurke. Jonas isst Müsli, und Mai isst eine warme Reissuppe. Alle werden satt, nur auf verschiedene Weise."
            show: { object: bread }
          - text: "In der Stadt oder auf dem Dorf"
            say: "Leni wohnt auf einem Bauernhof im Dorf und fährt mit dem Schulbus zur Schule. Ringsum sind Felder und Wiesen. Can wohnt in der Stadt im achten Stock eines Hochhauses und fährt mit dem Aufzug nach Hause. Leni hat draußen viel Platz. Can hat den Spielplatz und das Schwimmbad gleich um die Ecke."
            show: { object: house }
          - text: "Sprachen, Feste und Freizeit"
            say: "Bei Can sprechen sie zu Hause Türkisch und Deutsch. Mais Familie feiert jedes Jahr im Januar oder Februar das Neujahrsfest, so wie es in Vietnam gefeiert wird. Jonas fährt Rollstuhl und spielt in seiner Freizeit Rollstuhlbasketball. Leni reitet gern."
          - text: "Anders ist nicht falsch."
            say: "Was wir normal finden, haben wir meistens in unserer Familie gelernt. Für Can sind Oliven zum Frühstück ganz normal, für Leni sind sie neu. In vielen Ländern isst man mit Stäbchen, in anderen mit Messer und Gabel oder mit der Hand. Anders heißt nicht komisch oder falsch. Es heißt nur: anders als bei mir."
          - text: "Vergleichen: Was ist gleich, was ist verschieden?"
            say: "Beim Vergleichen fragst du: Was ist bei uns gleich, und was ist verschieden? Alle Kinder der 3b brauchen ein Zuhause, Essen, Freunde und Zeit zum Spielen. Wie sie das haben, ist verschieden."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Can isst Oliven zum Frühstück. Für Leni ist das neu. Was stimmt?"
                options: ["Es ist anders als bei Leni, aber nicht falsch.", "Oliven zum Frühstück sind falsch.", "Leni muss jetzt auch Oliven essen."]
                answer: "Es ist anders als bei Leni, aber nicht falsch."
                hints:
                  - "Wo hat Can gelernt, was er zum Frühstück isst?"
                  - "Für Can ist das ganz normal, nur Leni kennt es nicht."
                  - "Es ist anders als bei Leni, aber nicht falsch."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Bei allen gleich oder verschieden?"
                say: "Was ist bei allen Kindern der 3b gleich, was ist verschieden? Sortiere."
                bins:
                  - { id: gleich, show: { text: "bei allen gleich" }, say: "bei allen gleich" }
                  - { id: verschieden, show: { text: "verschieden" }, say: "verschieden" }
                options:
                  - { text: "brauchen ein Zuhause", bin: gleich }
                  - { text: "wohnen in der Stadt", bin: verschieden }
                  - { text: "brauchen Freunde", bin: gleich }
                  - { text: "sprechen zu Hause Türkisch", bin: verschieden }
                  - { text: "essen Müsli zum Frühstück", bin: verschieden }
                hints:
                  - "Frag bei jeder Karte: Braucht das jedes Kind?"
                  - "Leni wohnt im Dorf, Can in der Stadt. Ist das bei allen gleich?"
                  - "Gleich: Zuhause und Freunde. Verschieden: Stadt, Türkisch, Müsli."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Was wir normal finden, haben wir oft in unserer Familie gelernt."
                answer: true
                hints:
                  - "Woher weißt du, was man bei euch zum Frühstück isst?"
                  - "Für Can sind Oliven normal, weil es sie bei ihm zu Hause gibt."
                  - "Ja. Was wir normal finden, lernen wir oft in der Familie."
              - id: l1-f4
                type: image_multiple_choice
                text: "Leni wohnt im Dorf. Womit fährt sie zur Schule?"
                options:
                  - { object: bus }
                  - { object: ship }
                  - { object: crocodile }
                answer: bus
                feedback:
                  crocodile: "Mit dem Krokodil zur Schule? Das wäre ein Abenteuer! Leni fährt mit dem Schulbus."
                hints:
                  - "Lenis Hof liegt weit weg von der Schule."
                  - "Viele Kinder auf dem Dorf fahren mit dem Schulbus."
                  - "Leni fährt mit dem Bus."
              - id: l1-f5
                type: matching
                text: "Wer lebt wie? Verbinde."
                pairs:
                  - { left: { text: "Leni" }, right: { text: "Bauernhof im Dorf" } }
                  - { left: { text: "Can" }, right: { text: "Hochhaus in der Stadt" } }
                  - { left: { text: "Jonas" }, right: { text: "Basketball im Rollstuhl" } }
                hints:
                  - "Wer fährt mit dem Aufzug nach Hause?"
                  - "Leni hat draußen viel Platz und reitet gern."
                  - "Leni: Dorf. Can: Hochhaus. Jonas: Rollstuhlbasketball."
              - id: l1-f6
                type: multiple_choice
                text: "Welche Frage passt zum Vergleichen?"
                options: ["Was ist bei uns gleich, was ist verschieden?", "Wer macht es richtig?", "Wessen Frühstück ist das beste?"]
                answer: "Was ist bei uns gleich, was ist verschieden?"
                hints:
                  - "Beim Vergleichen sucht man zwei Dinge."
                  - "Vergleichen heißt nicht, einen Sieger zu suchen."
                  - "Die Frage ist: Was ist gleich, was ist verschieden?"

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? In allen Familien in Deutschland spricht man zu Hause nur Deutsch."
                answer: false
                feedback:
                  "true": "Bei Can spricht man zu Hause Türkisch und Deutsch. In vielen Familien spricht man mehr als eine Sprache."
                hints: ["Was spricht man bei Can zu Hause?"]
              - id: l1-s2
                type: multiple_choice
                text: "Jonas sagt: „Reissuppe zum Frühstück? Igitt!“ Was sagst du ihm?"
                options: ["Für Mai ist das normal. Es ist nur anders als bei dir.", "Du hast recht, Reissuppe ist eklig.", "Mai muss morgen Müsli essen."]
                answer: "Für Mai ist das normal. Es ist nur anders als bei dir."
                hints: ["Ist anders gleich falsch?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was braucht jedes Kind, egal wo es wohnt?"
                options:
                  - { object: house }
                  - { object: crown }
                  - { object: sandcastle }
                answer: house
                feedback:
                  crown: "Eine Krone braucht kein Kind zum Leben, auch wenn sie lustig aussieht. Jedes Kind braucht ein Zuhause."
                hints: ["Wo schläft und wohnt ein Kind?"]
              - id: l1-s4
                type: sorting
                text: "Stadt oder Dorf?"
                say: "Was passt eher zur Stadt, was eher zum Dorf? Sortiere."
                bins:
                  - { id: stadt, show: { text: "Stadt" }, say: "Stadt" }
                  - { id: dorf, show: { text: "Dorf" }, say: "Dorf" }
                options:
                  - { text: "Hochhaus mit vielen Wohnungen", bin: stadt }
                  - { text: "Bauernhof mit Kühen", bin: dorf }
                  - { text: "viel Verkehr und viele Geschäfte", bin: stadt }
                  - { text: "Felder und Wiesen ringsum", bin: dorf }
                hints: ["Denk an Leni und an Can."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Alle Kinder brauchen Essen, aber nicht alle essen das Gleiche."
                answer: true
                hints: ["Denk an das Frühstück der 3b."]
              - id: l1-s6
                type: fill_in_blank
                text: "Was heißt anders?"
                say: "Setz die passenden Wörter ein."
                frame: "Anders ist nicht _. Es ist nur anders als bei _."
                options: ["falsch", "mir", "schön", "morgen"]
                answer: ["falsch", "mir"]
                hints: ["Mit wem vergleichst du, wenn dir etwas neu ist?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Für die Wandzeitung vergleicht Leni sich mit Can. Was schreibt sie?"
                options: ["Wir wohnen verschieden, aber wir spielen beide gern draußen.", "Can wohnt falsch, weil er keinen Hof hat.", "Wir sind in allem gleich."]
                answer: "Wir wohnen verschieden, aber wir spielen beide gern draußen."
              - id: l1-n2
                type: true_false
                text: "Can schreibt in seinen Steckbrief: „In vielen Ländern isst man mit Stäbchen.“ Stimmt das?"
                answer: true
              - id: l1-n3
                type: sorting
                text: "Fair gesagt oder nicht fair gesagt?"
                say: "Die Kinder reden über die Wandzeitung. Was ist fair gesagt, was nicht?"
                bins:
                  - { id: fair, show: { text: "fair gesagt" }, say: "fair gesagt" }
                  - { id: unfair, show: { text: "nicht fair gesagt" }, say: "nicht fair gesagt" }
                options:
                  - { text: "Bei uns gibt es Brötchen, bei Mai Reissuppe.", bin: fair }
                  - { text: "Mais Frühstück ist komisch.", bin: unfair }
                  - { text: "Leni hat mehr Platz, Can hat das Schwimmbad näher.", bin: fair }
                  - { text: "Im Dorf wohnen ist doch langweilig.", bin: unfair }
              - id: l1-n4
                type: multiple_choice
                text: "Leni besucht Can zum ersten Mal. Was ist für sie neu?"
                options: ["mit dem Aufzug in den achten Stock fahren", "ein Zuhause haben", "einen Freund treffen"]
                answer: "mit dem Aufzug in den achten Stock fahren"
              - id: l1-n5
                type: image_multiple_choice
                text: "Jonas spielt in seiner Freizeit Rollstuhlbasketball. Was braucht er dafür?"
                options:
                  - { object: ball }
                  - { object: spoon }
                  - { object: umbrella }
                answer: ball

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was heißt „vergleichen“?"
            options: ["schauen, was gleich und was verschieden ist", "sagen, wer besser ist", "alles gleich machen"]
            answer: "schauen, was gleich und was verschieden ist"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Wenn jemand anders lebt als ich, lebt er falsch."
            answer: false
          - id: l1-c3
            type: sorting
            text: "Bei allen gleich oder verschieden?"
            bins:
              - { id: gleich, show: { text: "bei allen gleich" }, say: "bei allen gleich" }
              - { id: verschieden, show: { text: "verschieden" }, say: "verschieden" }
            options:
              - { text: "brauchen Essen", bin: gleich }
              - { text: "wohnen im Hochhaus", bin: verschieden }
              - { text: "brauchen Zeit zum Spielen", bin: gleich }
              - { text: "frühstücken Reissuppe", bin: verschieden }
          - id: l1-c4
            type: true_false
            text: "Stimmt das? In manchen Familien spricht man zu Hause zwei Sprachen."
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Was haben alle Kinder der 3b gemeinsam?"
            options: ["Sie brauchen Freunde und ein Zuhause.", "Sie essen alle Müsli.", "Sie wohnen alle im Dorf."]
            answer: "Sie brauchen Freunde und ein Zuhause."
          - id: l1-c6
            type: multiple_choice
            text: "Ole findet Mais Neujahrsfest komisch, weil er es nicht kennt. Was stimmt?"
            options: ["Das Fest ist nur neu für ihn.", "Das Fest ist falsch.", "Mai darf es nicht feiern."]
            answer: "Das Fest ist nur neu für ihn."

  - n: 2
    title: { de: "Vorurteile und Rollenbilder", en: "Prejudice and role pictures" }
    goal:
      de: "Erkenne Vorurteile und feste Rollenbilder. Rosa zum Beispiel ist keine Mädchenfarbe, jede Farbe ist für alle da."
      en: "Spot prejudice and fixed role pictures. Pink, for example, is not a girls' colour; every colour is for everyone."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Anders heißt nicht falsch."
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was brauchen alle Kinder, egal wie sie leben?"
            options: ["Essen, ein Zuhause und Freunde", "ein Haus auf dem Dorf", "Müsli zum Frühstück"]
            answer: "Essen, ein Zuhause und Freunde"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Gibt es Mädchenfarben und Jungenfarben?"
            say: "Für die Wandzeitung malt Ole ein Bild. Er sagt: Rosa nehme ich nicht, das ist eine Mädchenfarbe. Was glaubst du: Gibt es Farben nur für Mädchen und Farben nur für Jungen?"
          - text: "Nein! Jede Farbe ist für alle da."
            say: "Nein. Jedes Kind darf jede Farbe mögen. Dass Rosa für Mädchen und Blau für Jungen sein soll, haben sich Menschen ausgedacht. So eine feste Vorstellung davon, wie Mädchen oder Jungen sein sollen, heißt Rollenbild."
          - text: "Spielzeug und Berufe sind für alle."
            say: "Auch Spielzeug ist für alle da: Jungen dürfen mit Puppen spielen, Mädchen mit Baggern. Und jeden Beruf können Frauen und Männer lernen. Es gibt Feuerwehrfrauen und Pilotinnen, Erzieher und Krankenpfleger."
            show: { object: firefighter }
          - text: "Ein Vorurteil: Man urteilt, bevor man jemanden kennt."
            say: "Ole sagt noch: Mädchen können nicht Fußball spielen. Das ist ein Vorurteil. Ein Vorurteil ist eine Meinung über Menschen, die man sich bildet, bevor man sie kennt. Oft fängt es so an: Alle Mädchen sind, alle Jungen sind, alle aus diesem Land sind. Dabei ist jeder Mensch anders. Lotta aus der 3b spielt übrigens im Fußballverein."
            show: { object: play-football }
          - text: "Vorurteile gibt es auch über Menschen mit Behinderung."
            say: "Ein Kind fragt: Kann Jonas im Rollstuhl überhaupt Sport machen? Doch! Jonas spielt Rollstuhlbasketball, und zwar richtig gut. Menschen mit Behinderung können vieles, manches auf ihre eigene Weise. Wenn du helfen willst, frag zuerst, ob die Hilfe gewünscht ist."
          - text: "Wusstest du? Die Deutsche Gebärdensprache ist eine eigene Sprache."
            say: "Wusstest du? Viele gehörlose Menschen sprechen mit den Händen, dem Gesicht und dem Körper. Die Deutsche Gebärdensprache ist eine eigene Sprache mit einer eigenen Grammatik. Seit 2002 ist sie in Deutschland offiziell als Sprache anerkannt."
          - text: "Was tun bei einem Vorurteil?"
            say: "Wenn du ein Vorurteil hörst, kannst du fragen: Woher weißt du das? Stimmt das wirklich für alle? Lerne Menschen kennen, bevor du über sie urteilst. Und du darfst ruhig sagen: Das ist ein Vorurteil."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ole sagt: „Rosa ist eine Mädchenfarbe.“ Was stimmt?"
                options: ["Jede Farbe ist für alle Kinder da.", "Rosa dürfen nur Mädchen mögen.", "Jungen dürfen gar keine Farbe mögen."]
                answer: "Jede Farbe ist für alle Kinder da."
                feedback:
                  "Jungen dürfen gar keine Farbe mögen.": "Dann wären alle Jungenbilder grau! Nein, jede Farbe ist für alle da."
                hints:
                  - "Wer hat sich ausgedacht, dass Rosa für Mädchen ist?"
                  - "Eine feste Vorstellung, wie Mädchen und Jungen sein sollen, heißt Rollenbild."
                  - "Jede Farbe ist für alle Kinder da."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Vorurteil oder kein Vorurteil?"
                bins:
                  - { id: vorurteil, show: { text: "Vorurteil" }, say: "Vorurteil" }
                  - { id: kein, show: { text: "kein Vorurteil" }, say: "kein Vorurteil" }
                options:
                  - { text: "Alle Mädchen sind schlecht im Fußball.", bin: vorurteil }
                  - { text: "Lotta spielt im Fußballverein.", bin: kein }
                  - { text: "Jungen weinen nie.", bin: vorurteil }
                  - { text: "Jonas fährt Rollstuhl.", bin: kein }
                hints:
                  - "Ein Vorurteil sagt etwas über eine ganze Gruppe."
                  - "Achte auf Wörter wie „alle“ oder „nie“."
                  - "Vorurteile: alle Mädchen schlecht im Fußball, Jungen weinen nie."
              - id: l2-f3
                type: multiple_choice
                text: "Wer kann bei der Feuerwehr arbeiten?"
                show: { object: firefighter }
                options: ["Frauen und Männer", "nur Männer", "nur Frauen"]
                answer: "Frauen und Männer"
                hints:
                  - "Gibt es Berufe nur für ein Geschlecht?"
                  - "Denk an die Feuerwehrfrau."
                  - "Frauen und Männer können bei der Feuerwehr arbeiten."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Ein Vorurteil ist eine Meinung über Menschen, die man sich bildet, bevor man sie kennt."
                answer: true
                hints:
                  - "Wann hat Ole über die Mädchen geurteilt?"
                  - "Ole kannte Lotta noch nicht, als er urteilte."
                  - "Ja, genau das ist ein Vorurteil."
              - id: l2-f5
                type: matching
                text: "Was passt zusammen? Verbinde."
                pairs:
                  - { left: { text: "Rollenbild" }, right: { text: "eine feste Vorstellung, wie Mädchen oder Jungen sein sollen" } }
                  - { left: { text: "Vorurteil" }, right: { text: "eine Meinung über Menschen, bevor man sie kennt" } }
                  - { left: { text: "Gebärdensprache" }, right: { text: "eine Sprache mit Händen, Gesicht und Körper" } }
                hints:
                  - "Fang mit der Sprache an."
                  - "In „Vorurteil“ steckt „vor“: vor dem Kennenlernen."
                  - "Rollenbild: Mädchen und Jungen. Vorurteil: bevor man jemanden kennt. Gebärdensprache: Hände."
              - id: l2-f6
                type: multiple_choice
                text: "Jonas sitzt im Rollstuhl vor einer Tür. Ein Kind will ihm helfen. Was macht es zuerst?"
                options: ["Es fragt Jonas, ob er Hilfe möchte.", "Es schiebt ihn einfach los.", "Es macht alles für ihn, ohne zu fragen."]
                answer: "Es fragt Jonas, ob er Hilfe möchte."
                hints:
                  - "Jonas kann vieles selbst."
                  - "Woher weiß das Kind, ob Jonas Hilfe will?"
                  - "Zuerst fragt es Jonas."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Jungen dürfen mit Puppen spielen."
                answer: true
                hints: ["Für wen ist Spielzeug da?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Satz ist ein Vorurteil?"
                options: ["Alle Jungen sind wild.", "Ole spielt gern Fußball.", "Mia hat heute einen roten Pulli an."]
                answer: "Alle Jungen sind wild."
                hints: ["Welcher Satz sagt etwas über eine ganze Gruppe?"]
              - id: l2-s3
                type: sorting
                text: "Rollenbild oder für alle?"
                bins:
                  - { id: rolle, show: { text: "Rollenbild" }, say: "Rollenbild" }
