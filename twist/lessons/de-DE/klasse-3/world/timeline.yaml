# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.timeline
skill: world.time.timeline
curriculum: de-DE
language: de
title:
  de: Die große Zeitleiste
  en: The big timeline
summary: >
  The big timeline in the town museum has fallen off the wall, and Lina
  and her Opa help hang the cards back up. Lesson 1 orders events by their
  year (the smaller year was earlier and goes further left), with events
  whose dates are certain: the first German railway (1835), the Kölner Dom
  finished (1880), the first car by Carl Benz (1886) and the first powered
  flight (1903); it names a Jahrzehnt (10 years), a Jahrhundert (100
  years) and a Jahrtausend (1000 years) and finds decades on a timeline.
  Lesson 2 says how long ago something was (more than a century, a few
  decades, thousands of years), counts decades between two years and
  shows that every decade takes the same space. It ends with the skill
  check. No task names the current year; every "how long ago" claim stays
  true for decades. The timeline is the number line until a timeline
  drawing exists.
metadata:
  year: klasse-3
  topic: { de: Geschichte entdecken, en: Exploring history }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.time.my-life-story]
  also_practises: []
  vocabulary: { de: [Zeitleiste, Jahreszahl, Jahrzehnt, Jahrhundert, Jahrtausend, früher, später, Ereignis, Museum] }
  forms: [text, audio, picture, drawn]
  drawn: [number-line]
  sounds: []
  facets: []
  parts:
    - { id: order, what: { de: "Ereignisse nach ihrer Jahreszahl ordnen", en: "putting events in order by their year" } }
    - { id: units, what: { de: "Jahrzehnt, Jahrhundert und Jahrtausend kennen", en: "knowing decade, century and millennium" } }
    - { id: read, what: { de: "Jahreszahlen auf einer Zeitleiste finden und ablesen", en: "finding and reading years on a timeline" } }
    - { id: how-long, what: { de: "sagen, wie lange etwas her ist oder auseinanderliegt", en: "saying how long ago something was or how far apart two events are" } }
  misconceptions:
    - id: bigger-year-earlier
      what: Thinks a bigger year number was longer ago, or puts it further left
      addressed: "lesson 1 Learn opens with the guess about the railway and the car and ends with the trick; l1-f1, l1-f4, l1-s6, l1-c2, l1-c6, l2-c2 and l2-c15"
    - id: decade-century-mixup
      what: Mixes up Jahrzehnt and Jahrhundert, or thinks a century has 10 years
      addressed: "lesson 1 Learn has one screen for each; l1-f6, l1-s3, l1-s5, l1-n2, l2-n4, l2-c6 and l2-c9"
    - id: uneven-spacing
      what: Gives some decades more space on a timeline than others
      addressed: "lesson 2 Learn says every decade takes the same space; l2-s5"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Jahrzehnt und Jahrhundert", en: "Decade and century" }
    goal:
      de: "Ordne Ereignisse nach ihrer Jahreszahl auf der Zeitleiste. Ein Jahrzehnt hat 10 Jahre, ein Jahrhundert hat 100 Jahre."
      en: "Put events in order on the timeline by their year. A decade has 10 years, a century has 100 years."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wo steht auf einer Zeitleiste heute?"
            options: ["ganz rechts", "ganz links", "in der Mitte"]
            answer: "ganz rechts"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Mit jedem Jahr wird die Jahreszahl um eins größer."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was gab es zuerst, die Eisenbahn oder das Auto?"
            say: "Im Stadtmuseum ist die große Zeitleiste von der Wand gefallen. Lina und ihr Opa helfen, die Karten wieder aufzuhängen. Auf einer Karte ist eine Eisenbahn, auf einer anderen ein Auto. Was glaubst du: Was gab es zuerst?"
            show: { objects: [train, car] }
          - text: "Zuerst die Eisenbahn, 1835. Dann das Auto, 1886."
            say: "Zuerst gab es die Eisenbahn. Die erste Eisenbahn in Deutschland fuhr im Jahr 1835 von Nürnberg nach Fürth. Das erste Auto baute Carl Benz im Jahr 1886. Die kleinere Jahreszahl war früher."
            show: { object: train }
          - text: "Links ist früher, rechts ist später."
            say: "Auf der Zeitleiste im Museum stehen Jahreszahlen. Ganz links steht das Jahr, das am längsten her ist. Nach rechts werden die Jahreszahlen größer. Die Eisenbahn von 1835 kommt also weiter nach links als das Auto von 1886."
            show: { drawn: number-line, from: 1800, to: 2000, step: 10, labels: tens }
          - text: "Ein Jahrzehnt hat 10 Jahre."
            say: "Jeder kleine Strich auf dieser Zeitleiste ist 10 Jahre weiter. 10 Jahre nennt man ein Jahrzehnt. Von 1900 bis 1910 ist ein Jahrzehnt vergangen, von 1950 bis 1960 auch."
            show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }
          - text: "Ein Jahrhundert hat 100 Jahre."
            say: "Zehn Jahrzehnte sind zusammen 100 Jahre. Das nennt man ein Jahrhundert. Von 1800 bis 1900 ist ein Jahrhundert vergangen, von 1900 bis 2000 noch eins. Und zehn Jahrhunderte sind ein Jahrtausend, also 1000 Jahre."
            show: { drawn: number-line, from: 1800, to: 2000, step: 10, labels: tens }
          - text: "Wusstest du? Vom Baubeginn bis zum fertigen Kölner Dom vergingen mehr als 600 Jahre."
            say: "Wusstest du? Vom Baubeginn bis zum fertigen Kölner Dom vergingen mehr als 600 Jahre. Die Arbeiten begannen im Jahr 1248, fertig war der Dom erst 1880. Dazwischen lag die Baustelle sehr lange still. Das sind mehr als sechs Jahrhunderte."
            show: { object: church }
          - text: "Der Trick: Die kleinere Jahreszahl war früher und kommt weiter nach links."
            say: "So ordnest du: Vergleiche die Jahreszahlen. Die kleinere Zahl war früher und kommt weiter nach links. Die größere Zahl war später und kommt weiter nach rechts."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Häng die Karten von früher nach später auf."
                say: "Häng die Karten der Zeitleiste auf, von früher nach später."
                options: ["1903: erster Flug mit einem Motorflugzeug", "1835: erste Eisenbahn in Deutschland", "1886: erstes Auto"]
                slot_count: 3
                answer: ["1835: erste Eisenbahn in Deutschland", "1886: erstes Auto", "1903: erster Flug mit einem Motorflugzeug"]
                hints:
                  - "Vergleiche die Jahreszahlen."
                  - "Die kleinste Jahreszahl war am frühesten. Sie kommt zuerst."
                  - "1835, dann 1886, dann 1903."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Jahre hat ein Jahrzehnt?"
                options: ["10", "100", "1000"]
                answer: "10"
                hints:
                  - "Im Wort Jahrzehnt steckt eine Zahl."
                  - "Jahr und zehn: Jahrzehnt."
                  - "Ein Jahrzehnt hat 10 Jahre."
                difficulty: easy
              - id: l1-f3
                type: point_on_line
                text: "Der Kölner Dom wurde 1880 fertig. Wo ist 1880?"
                show: { drawn: number-line, from: 1800, to: 1900, step: 10, labels: ends }
                answer: 1880
                hints:
                  - "Jeder Strich ist ein Jahrzehnt weiter, also 10 Jahre."
                  - "Zähl von 1800 in Zehnerschritten: 1810, 1820, 1830 und so weiter."
                  - "1880 ist der achte Strich nach 1800."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 1835 steht auf der Zeitleiste weiter links als 1886."
                answer: true
                hints:
                  - "Welche Jahreszahl ist kleiner?"
                  - "Die kleinere Jahreszahl war früher."
                  - "Ja. 1835 war früher, darum steht es weiter links."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Jahre hat ein Jahrhundert?"
                options: ["10", "100", "1000"]
                answer: "100"
                hints:
                  - "Im Wort Jahrhundert steckt eine Zahl."
                  - "Jahr und hundert: Jahrhundert."
                  - "Ein Jahrhundert hat 100 Jahre."
              - id: l1-f6
                type: matching
                text: "Verbinde jedes Wort mit seiner Zeit."
                pairs:
                  - { left: { text: "ein Jahrzehnt" }, right: { text: "10 Jahre" } }
                  - { left: { text: "ein Jahrhundert" }, right: { text: "100 Jahre" } }
                  - { left: { text: "ein Jahrtausend" }, right: { text: "1000 Jahre" } }
                hints:
                  - "Hör genau hin: zehn, hundert, tausend."
                  - "Im Jahrtausend steckt tausend."
                  - "Jahrzehnt: 10 Jahre. Jahrhundert: 100 Jahre. Jahrtausend: 1000 Jahre."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Linas Opa ist 1950 geboren. Wo ist 1950?"
                show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }
                answer: 1950
                hints: ["1950 liegt genau in der Mitte zwischen 1900 und 2000."]
              - id: l1-s2
                type: ordering
                text: "Ordne die Jahreszahlen von früher nach später."
                options: ["1990", "1886", "1969", "1903"]
                slot_count: 4
                answer: ["1886", "1903", "1969", "1990"]
                hints: ["Die kleinste Jahreszahl kommt zuerst."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Ein Jahrzehnt ist länger als ein Jahrhundert."
                answer: false
                feedback:
                  "true": "Ein Jahrzehnt hat 10 Jahre, ein Jahrhundert 100 Jahre. Das Jahrhundert ist viel länger."
                hints: ["Wie viele Jahre hat jedes?"]
              - id: l1-s4
                type: multiple_choice
                text: "Von 1900 bis 2000 vergeht …"
                say: "Von 1900 bis 2000 vergeht wie viel Zeit?"
                options: ["ein Jahrhundert", "ein Jahrzehnt", "ein Jahrtausend"]
                answer: "ein Jahrhundert"
                hints: ["Wie viele Jahre sind es von 1900 bis 2000?"]
              - id: l1-s5
                type: text_input
                text: "Wie viele Jahrzehnte hat ein Jahrhundert?"
                answer: "10"
                hints: ["Ein Jahrhundert hat 100 Jahre. Wie oft passen 10 Jahre hinein?"]
              - id: l1-s6
                type: multiple_choice
                text: "Welches Jahr steht auf der Zeitleiste am weitesten rechts?"
                options: ["1903", "1930", "1913"]
                answer: "1930"
                feedback:
                  "1903": "1903 ist die kleinste Zahl. Sie steht am weitesten links."
                hints: ["Rechts stehen die größeren Jahreszahlen."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Wo ist das Jahr 1930?"
                show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }
                answer: 1930
              - id: l1-n2
                type: true_false
                text: "Stimmt das? Von 1950 bis 1960 vergeht ein Jahrhundert."
                answer: false
                feedback:
                  "true": "Von 1950 bis 1960 sind es 10 Jahre. Das ist ein Jahrzehnt."
              - id: l1-n3
                type: text_input
                text: "Wie viele Jahre sind es von 1880 bis 1980?"
                answer: "100"
              - id: l1-n4
                type: ordering
                text: "Die letzten Karten: Häng sie von früher nach später auf."
                options: ["1886: erstes Auto", "1903: erster Flug mit einem Motorflugzeug", "1835: erste Eisenbahn in Deutschland", "1880: der Kölner Dom ist fertig"]
                slot_count: 4
                answer: ["1835: erste Eisenbahn in Deutschland", "1880: der Kölner Dom ist fertig", "1886: erstes Auto", "1903: erster Flug mit einem Motorflugzeug"]
              - id: l1-n5
                type: multiple_choice
                text: "Zwischen der ersten Eisenbahn 1835 und dem ersten Auto 1886 liegen …"
                say: "Zwischen der ersten Eisenbahn 1835 und dem ersten Auto 1886 liegen wie viele Jahre?"
                options: ["etwa 5 Jahrzehnte", "etwa 5 Jahrhunderte", "etwa 5 Jahre"]
                answer: "etwa 5 Jahrzehnte"
                feedback:
                  "etwa 5 Jahrhunderte": "5 Jahrhunderte wären 500 Jahre. Von 1835 bis 1886 sind es etwa 50 Jahre."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "10 Jahre nennt man …"
            say: "Wie nennt man 10 Jahre?"
            options: ["ein Jahrzehnt", "ein Jahrhundert", "ein Jahrtausend"]
            answer: "ein Jahrzehnt"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Die kleinere Jahreszahl war früher."
            answer: true
          - id: l1-c3
            type: point_on_line
            text: "Wo ist 1850?"
            show: { drawn: number-line, from: 1800, to: 1900, step: 10, labels: ends }
            answer: 1850
          - id: l1-c4
            type: ordering
            text: "Ordne von früher nach später."
            options: ["1950", "1905", "1925"]
            slot_count: 3
            answer: ["1905", "1925", "1950"]
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele Jahre hat ein Jahrtausend?"
            options: ["1000", "100", "10"]
            answer: "1000"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Auf der Zeitleiste steht 1990 links von 1960."
            answer: false
            feedback:
              "true": "1990 ist die größere Zahl. Sie steht rechts von 1960."

  - n: 2
    title: { de: "Wie lange ist das her?", en: "How long ago was it?" }
    goal:
      de: "Sag, wie lange etwas her ist. Das erste Auto fuhr vor mehr als einem Jahrhundert."
      en: "Say how long ago something happened. The first car drove more than a century ago."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Jahrhundert sind …"
            say: "Wie viele Jahre sind ein Jahrhundert?"
            options: ["100 Jahre", "10 Jahre", "1000 Jahre"]
            answer: "100 Jahre"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? 1886 war früher als 1903."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Fuhr das erste Auto vor mehr als 100 Jahren?"
            say: "Lina hängt die Karte mit dem ersten Auto auf. Es fuhr im Jahr 1886. Was glaubst du: Ist das mehr als 100 Jahre her?"
            show: { object: car }
          - text: "Ja! Das ist mehr als ein Jahrhundert her."
            say: "Ja. Von 1886 bis 1986 sind schon 100 Jahre vergangen, und seitdem noch viele mehr. Das erste Auto fuhr also vor mehr als einem Jahrhundert. Je weiter links etwas auf der Zeitleiste steht, desto länger ist es her."
            show: { drawn: number-line, from: 1800, to: 2000, step: 10, labels: tens, mark: 1886 }
          - text: "In Jahrzehnten zählen"
            say: "Linas Opa ist 1955 geboren, ihre Mama 1985. Wie weit liegt das auseinander? Zähl in Jahrzehnten: 1965, 1975, 1985. Das sind 3 Jahrzehnte, also 30 Jahre."
            show: { drawn: number-line, from: 1950, to: 2000, step: 10, labels: all }
          - text: "Jahrzehnte, Jahrhunderte, Jahrtausende"
            say: "Opa wurde vor einigen Jahrzehnten geboren. Das erste Auto fuhr vor mehr als einem Jahrhundert. Und die Steinzeit ist sogar mehrere Jahrtausende her. Je länger etwas her ist, desto größer ist das Wort, mit dem du es beschreibst."
          - text: "Wusstest du? 1969 standen zum ersten Mal Menschen auf dem Mond."
            say: "Wusstest du? 1969 standen zum ersten Mal Menschen auf dem Mond. Die Reise dorthin dauerte ungefähr drei Tage. Das ist mehr als ein halbes Jahrhundert her."
            show: { object: moon }
          - text: "Jedes Jahrzehnt bekommt gleich viel Platz."
            say: "Auf einer richtigen Zeitleiste bekommt jedes Jahrzehnt gleich viel Platz. Darum siehst du sofort: Was weit auseinander steht, liegt auch lange auseinander."
            show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Das erste Auto fuhr 1886. Wann war das?"
                options: ["vor mehr als einem Jahrhundert", "vor einem Jahrzehnt", "vor einem Jahrtausend"]
                answer: "vor mehr als einem Jahrhundert"
                feedback:
                  "vor einem Jahrtausend": "Ein Jahrtausend ist 1000 Jahre her. Damals gab es noch lange keine Autos."
                hints:
                  - "Zähl 100 Jahre zu 1886 dazu."
                  - "1886 und 100 Jahre ist 1986. Das ist auch schon lange her."
                  - "Das erste Auto fuhr vor mehr als einem Jahrhundert."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Opa ist 1955 geboren, Mama 1985. Wie viele Jahrzehnte liegen dazwischen?"
                answer: "3"
                hints:
                  - "Zähl von 1955 in Zehnerschritten bis 1985."
                  - "1965, 1975, 1985. Wie viele Schritte sind das?"
                  - "Es sind 3 Jahrzehnte."
              - id: l2-f3
                type: point_on_line
                text: "Das Stadtmuseum wurde 1920 eröffnet. Wo ist 1920?"
                show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }
                answer: 1920
                hints:
                  - "Jeder Strich ist ein Jahrzehnt."
                  - "Zähl von 1900 aus: 1910, 1920."
                  - "1920 ist der zweite Strich nach 1900."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Was weiter links auf der Zeitleiste steht, ist länger her."
                answer: true
                hints:
                  - "Wo stehen die kleineren Jahreszahlen?"
                  - "Links stehen die kleineren Jahreszahlen. Sie waren früher."
                  - "Ja, was weiter links steht, ist länger her."
              - id: l2-f5
                type: sorting
                text: "Mehr oder weniger als ein Jahrhundert her?"
                say: "Ist das mehr oder weniger als ein Jahrhundert her? Sortiere die Karten."
                bins:
                  - { id: more, show: { text: "mehr als ein Jahrhundert her" }, say: "mehr als ein Jahrhundert her" }
                  - { id: less, show: { text: "weniger als ein Jahrhundert her" }, say: "weniger als ein Jahrhundert her" }
                options:
                  - { text: "1835: erste Eisenbahn in Deutschland", bin: more }
                  - { text: "1955: Opa wird geboren", bin: less }
                  - { text: "1886: erstes Auto", bin: more }
                  - { text: "1969: Menschen auf dem Mond", bin: less }
                hints:
                  - "Zähl 100 Jahre zu jeder Jahreszahl dazu. Ist das auch schon vorbei?"
                  - "1835 und 1886 sind sehr lange her. Opa und die Mondlandung sind näher an heute."
                  - "Mehr als ein Jahrhundert: Eisenbahn und Auto. Weniger: Opa und der Mond."
              - id: l2-f6
                type: matching
                text: "Wie lange ist das her? Verbinde."
                pairs:
                  - { left: { text: "die Steinzeit" }, right: { text: "vor Jahrtausenden" } }
                  - { left: { text: "das erste Auto" }, right: { text: "vor mehr als einem Jahrhundert" } }
                  - { left: { text: "Opas Geburt" }, right: { text: "vor einigen Jahrzehnten" } }
                hints:
                  - "Was ist am längsten her?"
                  - "Die Steinzeit ist viel länger her als das erste Auto."
                  - "Steinzeit: Jahrtausende. Auto: mehr als ein Jahrhundert. Opa: einige Jahrzehnte."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Häng die Karten von früher nach später auf."
                options: ["1955: Opa wird geboren", "1985: Mama wird geboren", "1886: erstes Auto", "1969: Menschen auf dem Mond"]
                slot_count: 4
                answer: ["1886: erstes Auto", "1955: Opa wird geboren", "1969: Menschen auf dem Mond", "1985: Mama wird geboren"]
                hints: ["Schau nur auf die Jahreszahlen. Die kleinste kommt zuerst."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele Jahrzehnte liegen zwischen 1969 und 1999?"
                options: ["3", "30", "300"]
                answer: "3"
                feedback:
                  "30": "Es sind 30 Jahre. Die Frage ist aber: Wie viele Jahrzehnte?"
                hints: ["Zähl in Zehnerschritten: 1979, 1989, 1999."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Die Steinzeit ist nur ein paar Jahrzehnte her."
                answer: false
                feedback:
                  "true": "Die Steinzeit ist viel länger her, sogar mehrere Jahrtausende."
                hints: ["Ist die Steinzeit länger her als das erste Auto?"]
              - id: l2-s4
                type: point_on_line
                text: "Linas Schule wurde 1970 gebaut. Wo ist 1970?"
                show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }
                answer: 1970
                hints: ["Zähl von 2000 zurück: 1990, 1980, 1970."]
              - id: l2-s5
                type: multiple_choice
                text: "Noah malt eine Zeitleiste. Das Jahrzehnt von 1950 bis 1960 ist viel breiter als die anderen. Was ist falsch?"
                options: ["Jedes Jahrzehnt braucht gleich viel Platz.", "Die Jahreszahlen müssen von rechts nach links gehen.", "Nichts, das ist richtig so."]
                answer: "Jedes Jahrzehnt braucht gleich viel Platz."
                hints: ["Sind alle Jahrzehnte gleich lang?"]
              - id: l2-s6
                type: text_input
                text: "Wie viele Jahre sind 4 Jahrzehnte?"
                answer: "40"
                hints: ["Ein Jahrzehnt hat 10 Jahre."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Besucher im Museum sagt: „Die erste Eisenbahn in Deutschland fuhr vor ein paar Jahren.“ Was sagt Lina?"
                options: ["Nein, das ist mehr als ein Jahrhundert her.", "Ja, das stimmt.", "Nein, das war in der Steinzeit."]
                answer: "Nein, das ist mehr als ein Jahrhundert her."
                feedback:
                  "Nein, das war in der Steinzeit.": "In der Steinzeit gab es noch keine Eisenbahn! Sie fuhr 1835."
              - id: l2-n2
                type: point_on_line
                text: "Auf einer Karte steht: „1960: Das Museum bekommt einen Garten.“ Wo hängt Lina sie hin?"
                show: { drawn: number-line, from: 1900, to: 2000, step: 10, labels: ends }
                answer: 1960
              - id: l2-n3
                type: sorting
                text: "Lina sortiert die Karten. Wie lange ist das her?"
                bins:
                  - { id: millennia, show: { text: "vor Jahrtausenden" }, say: "vor Jahrtausenden" }
                  - { id: century, show: { text: "vor mehr als einem Jahrhundert" }, say: "vor mehr als einem Jahrhundert" }
                  - { id: decades, show: { text: "vor einigen Jahrzehnten" }, say: "vor einigen Jahrzehnten" }
                options:
                  - { text: "die Steinzeit", bin: millennia }
                  - { text: "1835: erste Eisenbahn in Deutschland", bin: century }
                  - { text: "1969: Menschen auf dem Mond", bin: decades }
                  - { text: "1886: erstes Auto", bin: century }
                  - { text: "1955: Opa wird geboren", bin: decades }
              - id: l2-n4
                type: true_false
                text: "Lina sagt: „Zwischen 1955 und 1985 liegen 3 Jahrhunderte.“ Stimmt das?"
                answer: false
                feedback:
                  "true": "Es sind 30 Jahre, also 3 Jahrzehnte. 3 Jahrhunderte wären 300 Jahre."
              - id: l2-n5
                type: text_input
                text: "Das Museum wurde 1920 eröffnet. 5 Jahrzehnte später bekam es einen neuen Saal. In welchem Jahr war das?"
