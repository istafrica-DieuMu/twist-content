# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.life-cycles
skill: world.nature.life-cycles
curriculum: de-DE
language: de
title:
  de: Lebenszyklen
  en: Life cycles
summary: >
  A life cycle is a circle: the adult lays eggs and it starts again. The
  butterfly goes egg, caterpillar (eats, grows, sheds its skin), pupa (eats
  nothing, changes inside), butterfly (does not grow any more, lays eggs);
  the ladybird changes the same way. The frog goes frogspawn in water,
  tadpole with gills and a tail, hind legs first, then front legs, the tail
  disappears and lungs grow, then a young frog that can go on land. Not
  every animal changes like this: a chick, a puppy and a human baby just
  grow; plants have a cycle too (seed, seedling, plant in flower, fruit
  with new seeds). The story: Paula and her grandpa keep a nature diary in
  the garden and at the pond. Lesson 1 is the butterfly; lesson 2 the
  frog and the comparison, and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.living-nonliving, world.nature.plant-growth]
  also_practises: []
  vocabulary: { de: [Lebenszyklus, Ei, Raupe, Häutung, Puppe, Schmetterling, Verwandlung, Larve, Laich, Kaulquappe, Kiemen, Lunge, Hinterbeine, Vorderbeine, Küken] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: butterfly, what: { de: den Lebenszyklus des Schmetterlings beschreiben und ordnen, en: describing and ordering the life cycle of the butterfly } }
    - { id: frog, what: { de: den Lebenszyklus des Froschs beschreiben und ordnen, en: describing and ordering the life cycle of the frog } }
    - { id: compare, what: { de: "Verwandlung und Wachsen unterscheiden und Lebenszyklen vergleichen", en: telling change of form from growing and comparing life cycles } }
  misconceptions:
    - id: caterpillar-other-animal
      what: Thinks the caterpillar and the butterfly are two different animals
      addressed: lesson 1 opens with the guess about the butterfly eggs; l1-f6, l1-s1, l1-n1, l2-c14
    - id: small-butterfly-grows
      what: Thinks a small butterfly is a young one that will still grow
      addressed: lesson 1 Learn screen on the butterfly hatching; l1-s2, l1-n4, l2-c12
    - id: tadpole-is-fish
      what: Thinks tadpoles are small fish
      addressed: lesson 2 opens with the guess at the pond; l2-f6, l2-s1, l2-c7
    - id: all-animals-change
      what: Thinks every animal changes its form as it grows, like the frog
      addressed: lesson 2 Learn screen on the chick and the baby; l2-f5, l2-s3, l2-c15, l2-c19
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Vom Ei zum Schmetterling", en: "From egg to butterfly" }
    goal:
      de: "Ordne, wie aus einem winzigen Ei über die Raupe und die Puppe ein Schmetterling wird."
      en: "Put in order how a tiny egg becomes a butterfly, through the caterpillar and the pupa."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Stimmt das? Lebewesen wachsen und brauchen Nahrung."
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was wächst aus einem Samen?"
            options: ["eine neue Pflanze", "ein Stein", "ein Vogel"]
            answer: "eine neue Pflanze"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was schlüpft aus dem Ei eines Schmetterlings?"
            say: "Paula und ihr Opa schreiben ein Naturtagebuch. Auf einem Brennnesselblatt im Garten finden sie winzige Eier von einem Schmetterling. Paula fragt: Schlüpft daraus ein kleiner Schmetterling? Was glaubst du?"
            show: { object: leaf }
          - text: "Nein! Aus dem Ei schlüpft eine Raupe."
            say: "Aus dem Ei schlüpft kein Schmetterling, sondern eine kleine Raupe. Die Raupe frisst und frisst Blätter und wird immer größer. Ihre Haut wächst nicht mit. Darum streift sie die alte Haut mehrmals ab, und darunter ist schon eine neue, größere. Das heißt Häutung."
          - text: "Die Puppe: Hier verwandelt sich die Raupe."
            say: "Wenn die Raupe groß genug ist, wird sie zur Puppe. Die Puppe frisst nichts und bewegt sich kaum. Aber innen verändert sich alles: Aus der Raupe wird ein Schmetterling. Diese große Veränderung heißt Verwandlung."
          - text: "Der Schmetterling schlüpft."
            say: "Dann schlüpft der Schmetterling aus der Puppe. Seine Flügel sind erst weich und zerknittert. Bald sind sie trocken, und er fliegt los. Ein Schmetterling wächst nicht mehr. Ein Schmetterlingsweibchen legt später selbst Eier, und alles beginnt von vorn."
            show: { object: butterfly }
          - text: "Ein Lebenszyklus ist ein Kreis."
            say: "Ei, Raupe, Puppe, Schmetterling, und dann wieder Ei. Das ist ein Kreis. Er heißt Lebenszyklus. Auch der Marienkäfer verwandelt sich so: Aus dem Ei schlüpft eine Larve, die wird zur Puppe, und aus der Puppe kommt der Käfer."
            show: { object: ladybird }
          - text: "Wusstest du? Viele Raupen fressen als Erstes ihre eigene Eierschale."
            say: "Wusstest du? Viele Raupen fressen als Erstes ihre eigene Eierschale. Danach geht es an die Blätter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was schlüpft aus dem Ei eines Schmetterlings?"
                options: ["eine Raupe", "ein kleiner Schmetterling", "ein Küken"]
                answer: "eine Raupe"
                hints:
                  - "Der Schmetterling verwandelt sich. Am Anfang sieht er ganz anders aus."
                  - "Was frisst auf dem Brennnesselblatt?"
                  - "Aus dem Ei schlüpft eine Raupe."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Die Puppe frisst viele Blätter."
                answer: false
                feedback:
                  "true": "Die Puppe frisst nichts. Fressen tut die Raupe. In der Puppe verwandelt sie sich."
                hints:
                  - "Wer frisst und frisst und wird immer größer?"
                  - "Die Puppe bewegt sich kaum."
                  - "Die Puppe frisst nichts."
              - id: l1-f3
                type: ordering
                text: "Ordne den Lebenszyklus des Schmetterlings."
                say: "Leg die Karten in die richtige Reihenfolge, vom Anfang bis zum Schmetterling."
                options: ["Puppe", "Ei", "Schmetterling", "Raupe"]
                slot_count: 4
                answer: ["Ei", "Raupe", "Puppe", "Schmetterling"]
                hints:
                  - "Was hat Paula auf dem Blatt zuerst gefunden?"
                  - "Die Raupe frisst, bevor sie zur Puppe wird."
                  - "Ei, Raupe, Puppe, Schmetterling."
              - id: l1-f4
                type: matching
                text: "Was tut der Schmetterling in jeder Stufe? Verbinde."
                pairs:
                  - { left: { text: "Raupe" }, right: { text: "frisst und wächst" } }
                  - { left: { text: "Puppe" }, right: { text: "verwandelt sich" } }
                  - { left: { text: "Schmetterling" }, right: { text: "fliegt und legt Eier" } }
                hints:
                  - "Nur eine Stufe kann fliegen."
                  - "Die Puppe frisst nichts. Innen verändert sich alles."
                  - "Raupe: fressen. Puppe: verwandeln. Schmetterling: fliegen und Eier legen."
              - id: l1-f5
                type: multiple_choice
                text: "Warum streift die Raupe ihre Haut ab?"
                options: ["Weil die alte Haut zu eng wird.", "Weil ihr zu warm ist.", "Weil sie sich verkleiden will."]
                answer: "Weil die alte Haut zu eng wird."
                feedback:
                  "Weil sie sich verkleiden will.": "Eine Raupe beim Fasching? Lustige Idee! Aber ihre Haut wächst nicht mit und wird zu eng."
                hints:
                  - "Die Raupe wird immer größer."
                  - "Ihre Haut wächst nicht mit."
                  - "Die alte Haut wird zu eng."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Raupe und Schmetterling sind dasselbe Tier, nur in einer anderen Stufe."
                answer: true
                hints:
                  - "Woraus schlüpft der Schmetterling?"
                  - "In der Puppe wird aus der Raupe ein Schmetterling."
                  - "Ja, es ist dasselbe Tier."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welches Tier war früher eine Raupe?"
                options:
                  - { object: butterfly }
                  - { object: snail }
                  - { object: spider }
                answer: butterfly
                hints: ["Welches Tier ist aus einer Puppe geschlüpft?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Ein Schmetterling wird nach dem Schlüpfen noch viel größer."
                answer: false
                feedback:
                  "true": "Ein Schmetterling wächst nicht mehr. Wachsen tut nur die Raupe."
                hints: ["Wer frisst und wächst: die Raupe oder der Schmetterling?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wie heißt der Kreis aus Ei, Raupe, Puppe und Schmetterling?"
                options: ["Lebenszyklus", "Blutkreislauf", "Stundenplan"]
                answer: "Lebenszyklus"
                hints: ["Es geht um das Leben des Schmetterlings, und es beginnt immer von vorn."]
              - id: l1-s4
                type: sorting
                text: "Raupe oder Schmetterling?"
                say: "Passt das zur Raupe oder zum Schmetterling? Sortiere."
                bins:
                  - { id: caterpillar, show: { text: "Raupe" }, say: "Raupe" }
                  - { id: butterfly, show: { text: "Schmetterling" }, say: "Schmetterling" }
                options:
                  - { text: "hat Flügel", bin: butterfly }
                  - { text: "frisst viele Blätter", bin: caterpillar }
                  - { text: "häutet sich", bin: caterpillar }
                  - { text: "legt Eier", bin: butterfly }
                  - { text: "kriecht über das Blatt", bin: caterpillar }
                  - { text: "fliegt von Blüte zu Blüte", bin: butterfly }
                hints: ["Die Raupe frisst und wächst, der Schmetterling fliegt."]
              - id: l1-s5
                type: multiple_choice
                text: "Was passiert in der Puppe?"
                options: ["Aus der Raupe wird ein Schmetterling.", "Die Raupe wird zu einem Ei.", "Die Puppe legt Eier."]
                answer: "Aus der Raupe wird ein Schmetterling."
                hints: ["Was kommt nach der Puppe?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Auch der Marienkäfer ist erst eine Larve und dann eine Puppe."
                answer: true
                hints: ["Verwandelt sich der Marienkäfer wie der Schmetterling?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paula findet an der Brennnessel eine Puppe. Was wird daraus?"
                options: ["ein Schmetterling", "eine Raupe", "ein Ei"]
                answer: "ein Schmetterling"
              - id: l1-n2
                type: true_false
                text: "Opa sagt: „Die Raupe frisst so viel, damit sie wachsen kann.“ Stimmt das?"
                say: "Opa sagt: Die Raupe frisst so viel, damit sie wachsen kann. Stimmt das?"
                answer: true
              - id: l1-n3
                type: ordering
                text: "Paulas Tagebuch: Ordne die Seiten."
                say: "Paulas Tagebuch ist durcheinander. Bring die Seiten in die richtige Reihenfolge."
                options: ["Eine Puppe hängt am Stängel.", "Winzige Eier liegen auf dem Blatt.", "Ein Schmetterling sitzt auf einer Blüte.", "Eine dicke Raupe frisst Blätter."]
                slot_count: 4
                answer: ["Winzige Eier liegen auf dem Blatt.", "Eine dicke Raupe frisst Blätter.", "Eine Puppe hängt am Stängel.", "Ein Schmetterling sitzt auf einer Blüte."]
              - id: l1-n4
                type: multiple_choice
                text: "Paula sieht einen ganz kleinen Schmetterling und sagt: „Das ist ein Schmetterlingsbaby.“ Was sagst du?"
                say: "Paula sieht einen ganz kleinen Schmetterling und sagt: Das ist ein Schmetterlingsbaby. Was sagst du?"
                options: ["Nein, Schmetterlinge wachsen nicht mehr. Es ist eine kleine Schmetterlingsart.", "Ja, er wird noch so groß wie die anderen.", "Nein, das ist eine Raupe mit Flügeln."]
                answer: "Nein, Schmetterlinge wachsen nicht mehr. Es ist eine kleine Schmetterlingsart."
              - id: l1-n5
                type: matching
                text: "Opa schreibt Notizen. Verbinde."
                pairs:
                  - { left: { text: "Ei" }, right: { text: "liegt auf dem Blatt" } }
                  - { left: { text: "Raupe" }, right: { text: "häutet sich mehrmals" } }
                  - { left: { text: "Puppe" }, right: { text: "frisst nichts" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was kommt nach der Raupe?"
            options: ["die Puppe", "das Ei", "der Schmetterling"]
            answer: "die Puppe"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Aus dem Schmetterlingsei schlüpft eine Raupe."
            answer: true
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Aus der Puppe schlüpft eine Raupe."
            answer: false
          - id: l1-c4
            type: ordering
            text: "Bring die Stufen des Schmetterlings in die richtige Reihenfolge."
            options: ["Raupe", "Schmetterling", "Ei", "Puppe"]
            slot_count: 4
            answer: ["Ei", "Raupe", "Puppe", "Schmetterling"]
          - id: l1-c5
            type: multiple_choice
            text: "Was macht die Raupe die meiste Zeit?"
            options: ["Sie frisst.", "Sie fliegt.", "Sie legt Eier."]
            answer: "Sie frisst."
          - id: l1-c6
            type: image_multiple_choice
            text: "Aus wessen Eiern schlüpfen Raupen?"
            options:
              - { object: butterfly }
              - { object: hen }
              - { object: frog }
            answer: butterfly

  - n: 2
    title: { de: "Vom Laich zum Frosch", en: "From frogspawn to frog" }
    goal:
      de: "Ordne, wie aus dem Laich über die Kaulquappe ein Frosch wird, und vergleiche ihn mit anderen Lebenszyklen."
      en: "Put in order how frogspawn becomes a frog through the tadpole, and compare it with other life cycles."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was schlüpft beim Schmetterling aus dem Ei?"
            options: ["die Raupe", "die Puppe", "der Schmetterling"]
            answer: "die Raupe"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? In der Puppe verwandelt sich die Raupe in einen Schmetterling."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Ist eine Kaulquappe ein kleiner Fisch?"
            say: "Im Frühling gehen Paula und Opa an den Teich. Im Wasser schwimmen kleine dunkle Tiere mit einem Schwanz. Opa sagt: Das sind Kaulquappen. Paula fragt: Sind das kleine Fische? Was glaubst du?"
          - text: "Nein! Kaulquappen sind junge Frösche."
            say: "Nein, Kaulquappen sind keine Fische, sondern junge Frösche. Im Frühling legt das Froschweibchen viele Eier ins Wasser. Sie heißen Laich und sehen aus wie ein Klumpen Gelee. Aus dem Laich schlüpfen Kaulquappen. Sie leben im Wasser und atmen mit Kiemen."
          - text: "Erst die Hinterbeine, dann die Vorderbeine"
            say: "Die Kaulquappe wächst. Zuerst wachsen ihr die Hinterbeine, danach die Vorderbeine. Der Schwanz wird immer kürzer, bis er verschwunden ist. Statt der Kiemen bekommt sie eine Lunge. Dann ist sie ein kleiner Frosch und kann an Land gehen."
          - text: "Laich, Kaulquappe, Frosch: Der Kreis beginnt von vorn."
            say: "Der junge Frosch wächst zu einem großen Frosch heran. Im Frühling kommt er zum Teich zurück, und ein Weibchen legt neuen Laich. Laich, Kaulquappe, Frosch und wieder Laich. Auch der Frosch hat einen Lebenszyklus mit einer Verwandlung."
            show: { object: frog }
          - text: "Nicht jedes Tier verwandelt sich."
            say: "Nicht jedes Tier verwandelt sich so. Aus dem Hühnerei schlüpft ein Küken. Es sieht schon fast aus wie ein kleines Huhn und wird einfach größer. Auch ein Welpe wird einfach ein großer Hund. Und du warst ein Baby, bist jetzt ein Kind und wirst einmal erwachsen. Du wächst, aber du verwandelst dich nicht."
            show: { object: hen }
          - text: "Auch Pflanzen haben einen Lebenszyklus."
            say: "Auch Pflanzen haben einen Lebenszyklus. Aus dem Samen wird ein Keimling und dann eine Pflanze mit Blüten. Aus den Blüten werden Früchte mit neuen Samen, und alles beginnt von vorn."
            show: { object: flower }
          - text: "Wusstest du? Ein Maikäfer lebt mehrere Jahre als Larve in der Erde, aber nur wenige Wochen als Käfer."
            say: "Wusstest du? Ein Maikäfer lebt mehrere Jahre als Larve in der Erde. Als fliegender Käfer lebt er danach nur wenige Wochen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie heißen die Eier des Froschs?"
                options: ["Laich", "Puppe", "Raupe"]
                answer: "Laich"
                hints:
                  - "Die Eier liegen wie ein Klumpen Gelee im Wasser."
                  - "Puppe und Raupe gehören zum Schmetterling."
                  - "Die Eier des Froschs heißen Laich."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Kaulquappen leben im Wasser und atmen mit Kiemen."
                answer: true
                hints:
                  - "Wo hat Paula die Kaulquappen gesehen?"
                  - "Wer ganz im Wasser lebt, braucht Kiemen."
                  - "Ja, Kaulquappen atmen mit Kiemen."
                difficulty: easy
              - id: l2-f3
                type: ordering
                text: "Ordne den Lebenszyklus des Froschs."
                say: "Leg die Karten in die richtige Reihenfolge, vom Laich bis zum Frosch."
                options: ["Frosch", "Kaulquappe mit Beinen", "Laich", "Kaulquappe"]
                slot_count: 4
                answer: ["Laich", "Kaulquappe", "Kaulquappe mit Beinen", "Frosch"]
                hints:
                  - "Was legt das Froschweibchen ins Wasser?"
                  - "Die Beine wachsen erst später."
                  - "Laich, Kaulquappe, Kaulquappe mit Beinen, Frosch."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Beine wachsen der Kaulquappe zuerst?"
                options: ["die Hinterbeine", "die Vorderbeine", "alle vier auf einmal"]
                answer: "die Hinterbeine"
                hints:
                  - "Es wachsen nicht alle Beine auf einmal."
                  - "Die Beine hinten, nah am Schwanz, kommen zuerst."
                  - "Zuerst wachsen die Hinterbeine."
              - id: l2-f5
                type: sorting
                text: "Verwandelt sich das Tier oder wächst es nur?"
                say: "Verwandelt sich das Tier, oder wird es einfach nur größer? Sortiere."
                bins:
                  - { id: change, show: { text: "verwandelt sich" }, say: "verwandelt sich" }
                  - { id: grow, show: { text: "wächst nur" }, say: "wächst nur" }
                options:
                  - { object: frog, bin: change }
                  - { object: hen, bin: grow }
                  - { object: butterfly, bin: change }
                  - { object: dog, bin: grow }
                  - { object: ladybird, bin: change }
                  - { object: cat, bin: grow }
                hints:
                  - "Sieht das Junge schon aus wie das erwachsene Tier?"
                  - "Ein Küken sieht aus wie ein kleines Huhn. Eine Kaulquappe sieht nicht aus wie ein Frosch."
                  - "Verwandeln: Frosch, Schmetterling, Marienkäfer. Nur wachsen: Huhn, Hund, Katze."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Eine Kaulquappe ist ein kleiner Fisch."
                answer: false
                feedback:
                  "true": "Die Kaulquappe lebt im Wasser wie ein Fisch, aber sie ist ein junger Frosch."
                hints:
                  - "Was wird aus einer Kaulquappe?"
                  - "Aus einem Fisch wird nie ein Frosch."
                  - "Die Kaulquappe ist ein junger Frosch."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was wird aus einer Kaulquappe?"
                options:
                  - { object: frog }
                  - { object: fish }
                  - { object: butterfly }
                answer: frog
                hints: ["Woraus schlüpft die Kaulquappe, und wer legt den Laich?"]
              - id: l2-s2
                type: multiple_choice
                text: "Was passiert mit dem Schwanz der Kaulquappe?"
                options: ["Er wird kürzer, bis er verschwunden ist.", "Er wird zu einem Vorderbein.", "Er fällt ab und wird ein neuer Frosch."]
                answer: "Er wird kürzer, bis er verschwunden ist."
                feedback:
                  "Er fällt ab und wird ein neuer Frosch.": "Ein Frosch aus einem Schwanz? Das wäre ein Zaubertrick! Der Schwanz wird einfach immer kürzer."
                hints: ["Hat ein großer Frosch einen Schwanz?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Ein Küken verwandelt sich wie eine Raupe in ein ganz anderes Tier."
                answer: false
                feedback:
                  "true": "Das Küken sieht schon fast aus wie ein Huhn. Es wird nur größer."
                hints: ["Sieht ein Küken aus wie ein kleines Huhn?"]
              - id: l2-s4
                type: matching
                text: "Welche Stufe des Froschs ist das? Verbinde."
                pairs:
                  - { left: { text: "Laich" }, right: { text: "Eier im Wasser" } }
                  - { left: { text: "Kaulquappe" }, right: { text: "schwimmt mit einem Schwanz" } }
                  - { left: { text: "Frosch" }, right: { text: "kann an Land gehen" } }
                hints: ["Nur eine Stufe hat eine Lunge und kann an Land."]
              - id: l2-s5
                type: ordering
                text: "Ordne den Lebenszyklus einer Pflanze."
                say: "Leg die Karten in die richtige Reihenfolge, vom Samen bis zu neuen Samen."
                options: ["Pflanze mit Blüten", "Samen", "Frucht mit neuen Samen", "Keimling"]
                slot_count: 4
                answer: ["Samen", "Keimling", "Pflanze mit Blüten", "Frucht mit neuen Samen"]
                hints: ["Aus den Blüten werden die Früchte."]
              - id: l2-s6
                type: multiple_choice
                text: "Warum ist ein Lebenszyklus ein Kreis?"
                options: ["Weil es am Ende wieder von vorn beginnt.", "Weil das Tier im Kreis läuft.", "Weil es genau ein Jahr dauert."]
                answer: "Weil es am Ende wieder von vorn beginnt."
                hints: ["Was macht der Frosch im Frühling am Teich?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
