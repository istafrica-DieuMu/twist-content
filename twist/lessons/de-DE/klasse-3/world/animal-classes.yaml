# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.animal-classes
skill: world.nature.animal-classes
curriculum: de-DE
language: de
title:
  de: Die fünf Tierklassen
  en: The five animal classes
summary: >
  Animals with a backbone fall into five classes, told apart by their
  features, not by where they live or how they move: Säugetiere (the young
  drink milk), Vögel (feathers), Fische (gills and fins), Lurche (moist skin
  without scales) and Kriechtiere (dry skin with scales). The story: Mia's
  animal book has five chapters, and the wind has blown its pages about.
  Lesson 1 sorts mammals, birds and fish, with the whale, dolphin, bat and
  penguin as traps; lesson 2 tells frog from lizard, sorts into all five
  classes and ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.farm-animals, world.nature.pets]
  also_practises: []
  vocabulary: { de: [Säugetier, Vogel, Fisch, Lurch, Amphibie, Kriechtier, Reptil, Merkmal, Fell, Federn, Schnabel, Schuppen, Kiemen, Flossen, Lunge, Laich, Kaulquappe] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: features, what: { de: die Merkmale jeder Klasse nennen, en: naming the features of each class } }
    - { id: classify, what: { de: ein Tier seiner Klasse zuordnen, en: putting an animal into its class } }
    - { id: frog-lizard, what: { de: Lurche und Kriechtiere unterscheiden, en: telling amphibians from reptiles } }
    - { id: tricky, what: { de: "Tiere ordnen, die täuschen (Wal, Delfin, Fledermaus, Pinguin)", en: "sorting animals that mislead (whale, dolphin, bat, penguin)" } }
  misconceptions:
    - id: water-means-fish
      what: Thinks every animal that lives in the sea is a fish (Wal, Delfin)
      addressed: lesson 1 opens with the guess about the whale and answers it with lungs and milk; l1-f5, l1-n2 and the check tasks l2-c17 and l2-c19
    - id: flying-means-bird
      what: Thinks every animal that flies is a bird and one that cannot fly is not (Fledermaus, Pinguin, Strauß)
      addressed: the "Wusstest du?" screen on the bat and the bird screen on the penguin; l1-s2, l1-s5, l1-c3, l2-c16, l2-c18
    - id: frog-is-reptile
      what: Puts frog and lizard, or newt and lizard, in the same class because they look alike
      addressed: lesson 2 opens with the guess about frog and lizard and teaches skin as the test; l2-s3, l2-n5, l2-c11
    - id: water-means-amphibian
      what: Thinks the crocodile is a Lurch because it lives in water
      addressed: the Kriechtiere screen says the crocodile breathes with lungs and has scales; l2-f4
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Fell, Federn, Flossen", en: "Fur, feathers, fins" }
    goal:
      de: "Ordne Tiere nach ihren Merkmalen in Säugetiere, Vögel und Fische. Der Wal zum Beispiel ist ein Säugetier."
      en: "Sort animals by their features into mammals, birds and fish. The whale, for example, is a mammal."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was bekommen wir vom Schaf?"
            show: { object: sheep }
            options: ["Wolle", "Eier", "Honig"]
            answer: "Wolle"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welches Haustier wohnt in einem Aquarium?"
            options:
              - { object: fish }
              - { object: cat }
              - { object: dog }
            answer: fish
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Ist der Wal ein Fisch?"
            say: "Mia macht ein Tierbuch mit fünf Kapiteln. Der Wind hat die Seiten durcheinandergeweht, und du hilfst ihr beim Ordnen. Die erste Seite zeigt einen Wal. Er lebt im Meer und schwimmt. Was glaubst du: Ist der Wal ein Fisch?"
            show: { object: whale }
          - text: "Nein! Der Wal ist ein Säugetier."
            say: "Nein, der Wal ist kein Fisch. Er atmet mit einer Lunge, darum muss er zum Atmen auftauchen. Und sein Junges trinkt Milch bei der Mutter. Das sind Merkmale der Säugetiere. Auch der Delfin ist ein Säugetier."
            show: { object: whale }
          - text: "Säugetiere: Die Jungen trinken Milch. Die meisten haben ein Fell."
            say: "Bei den Säugetieren trinken die Jungen Milch bei ihrer Mutter. Die meisten Säugetiere haben ein Fell. Hund, Kuh, Maus und Pferd sind Säugetiere, auch der Igel mit seinen Stacheln. Und du bist auch eins: Der Mensch ist ein Säugetier."
            show: { object: dog }
          - text: "Vögel: Federn, ein Schnabel und Eier mit harter Schale"
            say: "Alle Vögel haben Federn und einen Schnabel. Sie legen Eier mit einer harten Schale. Die meisten Vögel können fliegen, aber nicht alle. Der Pinguin und der Strauß können nicht fliegen. Sie haben Federn und legen Eier, also sind sie Vögel."
            show: { object: owl }
          - text: "Fische: Kiemen und Flossen"
            say: "Fische atmen mit Kiemen. So holen sie die Luft aus dem Wasser. Sie schwimmen mit Flossen, und die meisten haben Schuppen. Der Hai ist ein Fisch, und das Seepferdchen auch. Der Wal hat keine Kiemen, er hat eine Lunge."
            show: { object: shark }
          - text: "Wusstest du? Die Fledermaus ist das einzige Säugetier, das richtig fliegen kann."
            say: "Wusstest du? Die Fledermaus ist das einzige Säugetier, das richtig fliegen kann. Sie hat keine Federn, sondern ein Fell, und ihre Jungen trinken Milch. Ein Flughörnchen kann nur durch die Luft gleiten."
            show: { object: bat }
          - text: "Schau auf die Merkmale, nicht darauf, wo ein Tier lebt."
            say: "Das ist der Trick: Frag nicht, wo ein Tier lebt oder wie es sich bewegt. Frag nach seinen Merkmalen. Hat es Fell, Federn oder Kiemen? Trinken seine Jungen Milch?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein Tier hat Federn. Zu welcher Klasse gehört es?"
                options: ["Säugetiere", "Vögel", "Fische"]
                answer: "Vögel"
                hints:
                  - "Welche Tiere haben Federn?"
                  - "Fell haben die Säugetiere, Kiemen die Fische."
                  - "Federn haben nur die Vögel."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Tier ist ein Säugetier?"
                options:
                  - { object: duck }
                  - { object: horse }
                  - { object: fish }
                answer: horse
                hints:
                  - "Welches Tier hat ein Fell?"
                  - "Die Ente hat Federn, der Fisch hat Flossen."
                  - "Das Fohlen trinkt Milch bei seiner Mutter: Das Pferd ist ein Säugetier."
                difficulty: easy
              - id: l1-f3
                type: sorting
                text: "Lege jedes Tier ins richtige Kapitel."
                say: "Lege jedes Tier ins richtige Kapitel von Mias Tierbuch: Säugetiere, Vögel oder Fische."
                bins:
                  - { id: mammal, show: { text: "Säugetiere" }, say: "Säugetiere" }
                  - { id: bird, show: { text: "Vögel" }, say: "Vögel" }
                  - { id: fish, show: { text: "Fische" }, say: "Fische" }
                options:
                  - { object: cow, bin: mammal }
                  - { object: owl, bin: bird }
                  - { object: fish, bin: fish }
                  - { object: hen, bin: bird }
                  - { object: cat, bin: mammal }
                  - { object: shark, bin: fish }
                hints:
                  - "Schau bei jedem Tier: Fell, Federn oder Flossen?"
                  - "Die Eule und das Huhn haben Federn."
                  - "Säugetiere: Kuh, Katze. Vögel: Eule, Huhn. Fische: Fisch, Hai."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Der Hai ist ein Fisch, denn er atmet mit Kiemen."
                show: { object: shark }
                answer: true
                hints:
                  - "Womit atmet der Hai?"
                  - "Wer mit Kiemen atmet, ist ein Fisch."
                  - "Ja, der Hai ist ein Fisch."
              - id: l1-f5
                type: multiple_choice
                text: "Der Wal lebt im Meer. Warum ist er trotzdem kein Fisch?"
                show: { object: whale }
                options: ["Er atmet mit einer Lunge, und sein Junges trinkt Milch.", "Er ist zu groß für einen Fisch.", "Er hat keine Flossen."]
                answer: "Er atmet mit einer Lunge, und sein Junges trinkt Milch."
                feedback:
                  "Er ist zu groß für einen Fisch.": "Der Walhai ist auch riesig, und er ist ein Fisch! Die Größe sagt nichts über die Klasse."
                  "Er hat keine Flossen.": "Doch, der Wal hat Flossen. Schau, womit er atmet."
                hints:
                  - "Schau auf die Merkmale, nicht auf die Größe."
                  - "Womit atmet der Wal, und was trinkt sein Junges?"
                  - "Lunge und Milch: Das sind Merkmale der Säugetiere."
              - id: l1-f6
                type: matching
                text: "Verbinde jedes Merkmal mit seiner Klasse."
                pairs:
                  - { left: { text: "Fell" }, right: { text: "Säugetiere" } }
                  - { left: { text: "Federn" }, right: { text: "Vögel" } }
                  - { left: { text: "Kiemen" }, right: { text: "Fische" } }
                hints:
                  - "Denk an ein Tier: Wer hat Federn?"
                  - "Die Katze hat ein Fell, der Fisch hat Kiemen."
                  - "Fell: Säugetiere. Federn: Vögel. Kiemen: Fische."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welches Tier ist ein Vogel?"
                options:
                  - { object: duck }
                  - { object: mouse }
                  - { object: whale }
                answer: duck
                hints: ["Welches Tier hat Federn und einen Schnabel?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Der Pinguin kann nicht fliegen. Also ist er kein Vogel."
                show: { object: penguin }
                answer: false
                feedback:
                  "true": "Der Pinguin hat Federn und legt Eier. Er ist ein Vogel, der schwimmt statt fliegt."
                hints: ["Hat der Pinguin Federn?"]
              - id: l1-s3
                type: multiple_choice
                text: "Was haben alle Vögel?"
                options: ["Federn und einen Schnabel", "Flügel, mit denen sie fliegen", "ein Fell"]
                answer: "Federn und einen Schnabel"
                feedback:
                  "Flügel, mit denen sie fliegen": "Der Strauß hat Flügel, aber er fliegt nicht. Federn hat er trotzdem."
                hints: ["Denk an den Pinguin. Was hat er, auch wenn er nicht fliegt?"]
              - id: l1-s4
                type: sorting
                text: "Säugetier, Vogel oder Fisch?"
                say: "Neue Seiten für Mias Buch. Säugetier, Vogel oder Fisch? Sortiere."
                bins:
                  - { id: mammal, show: { text: "Säugetiere" }, say: "Säugetiere" }
                  - { id: bird, show: { text: "Vögel" }, say: "Vögel" }
                  - { id: fish, show: { text: "Fische" }, say: "Fische" }
                options:
                  - { object: dog, bin: mammal }
                  - { object: duck, bin: bird }
                  - { object: shark, bin: fish }
                  - { object: elephant, bin: mammal }
                  - { object: bird, bin: bird }
                  - { object: fish, bin: fish }
                hints: ["Fell, Federn oder Flossen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Die Fledermaus fliegt. Zu welcher Klasse gehört sie?"
                show: { object: bat }
                options: ["Vögel", "Säugetiere", "Fische"]
                answer: "Säugetiere"
                feedback:
                  "Vögel": "Die Fledermaus hat keine Federn, sondern ein Fell. Ihre Jungen trinken Milch."
                hints: ["Hat die Fledermaus Federn oder ein Fell?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Auch der Mensch ist ein Säugetier."
                answer: true
                hints: ["Was hast du als Baby getrunken?"]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "Verbinde jedes Tier mit seiner Klasse."
                pairs:
                  - { left: { object: whale }, right: { text: "Säugetiere" } }
                  - { left: { object: owl }, right: { text: "Vögel" } }
                  - { left: { object: shark }, right: { text: "Fische" } }
              - id: l1-n2
                type: multiple_choice
                text: "Der Delfin springt aus dem Wasser und holt Luft. Sein Junges trinkt Milch. Was ist er?"
                show: { object: dolphin }
                options: ["ein Fisch", "ein Säugetier", "ein Vogel"]
                answer: "ein Säugetier"
                feedback:
                  "ein Fisch": "Der Delfin lebt im Wasser, aber er atmet mit einer Lunge, und sein Junges trinkt Milch."
              - id: l1-n3
                type: image_multiple_choice
                text: "Ich habe Kiemen und Flossen. Welches Tier bin ich?"
                options:
                  - { object: whale }
                  - { object: shark }
                  - { object: duck }
                answer: shark
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Die Kuh, die Maus und der Igel sind Säugetiere."
                answer: true
              - id: l1-n5
                type: sorting
                text: "Wohin gehören diese Seiten?"
                say: "Diese Seiten haben kein Bild, nur den Namen des Tiers. Wohin gehören sie?"
                bins:
                  - { id: mammal, show: { text: "Säugetiere" }, say: "Säugetiere" }
                  - { id: bird, show: { text: "Vögel" }, say: "Vögel" }
                  - { id: fish, show: { text: "Fische" }, say: "Fische" }
                options:
                  - { text: "Pinguin", bin: bird }
                  - { text: "Fledermaus", bin: mammal }
                  - { text: "Delfin", bin: mammal }
                  - { text: "Strauß", bin: bird }
                  - { text: "Seepferdchen", bin: fish }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Tier hat Kiemen. Zu welcher Klasse gehört es?"
            options: ["Säugetiere", "Vögel", "Fische"]
            answer: "Fische"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welches Tier ist kein Säugetier?"
            options:
              - { object: cow }
              - { object: owl }
              - { object: dog }
            answer: owl
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Jedes Tier, das fliegen kann, ist ein Vogel."
            answer: false
            feedback:
              "true": "Die Fledermaus fliegt auch, und sie ist ein Säugetier."
          - id: l1-c4
            type: multiple_choice
            text: "Das Junge trinkt Milch bei seiner Mutter. Was für ein Tier ist es?"
            options: ["ein Säugetier", "ein Vogel", "ein Fisch"]
            answer: "ein Säugetier"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Die Ente hat Federn und legt Eier. Sie ist ein Vogel."
            show: { object: duck }
            answer: true
          - id: l1-c6
            type: matching
            text: "Welche Klasse hat dieses Merkmal? Verbinde."
            pairs:
              - { left: { text: "Schnabel" }, right: { text: "Vögel" } }
              - { left: { text: "Flossen" }, right: { text: "Fische" } }
              - { left: { text: "Junge trinken Milch" }, right: { text: "Säugetiere" } }

  - n: 2
    title: { de: "Frosch oder Eidechse?", en: "Frog or lizard?" }
    goal:
      de: "Unterscheide Lurche und Kriechtiere, so wie den Frosch und die Eidechse. Dann ordnest du Tiere in alle fünf Klassen."
      en: "Tell amphibians from reptiles, like the frog and the lizard. Then you sort animals into all five classes."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Welches Tier ist ein Fisch?"
            options:
              - { object: whale }
              - { object: horse }
              - { object: fish }
            answer: fish
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Wal ist ein Säugetier."
            show: { object: whale }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Gehören Frosch und Eidechse in dieselbe Klasse?"
            say: "Mias Tierbuch hat noch zwei Kapitel: Lurche und Kriechtiere. Auf zwei Seiten sind ein Frosch und eine Eidechse. Beide haben vier Beine und leben gern in der Sonne am Wasser. Was glaubst du: Gehören sie in dieselbe Klasse?"
            show: { object: frog }
          - text: "Nein! Der Frosch ist ein Lurch, die Eidechse ein Kriechtier."
            say: "Nein. Der Frosch ist ein Lurch, die Eidechse ist ein Kriechtier. Den Unterschied siehst du an der Haut. Die Haut des Froschs ist feucht und glatt. Die Haut der Eidechse ist trocken und hat Schuppen."
            show: { object: frog }
          - text: "Lurche: feuchte, glatte Haut ohne Schuppen"
            say: "Lurche heißen auch Amphibien. Frosch, Kröte, Molch und Salamander sind Lurche. Ihre Haut ist feucht und glatt, ohne Schuppen. Der Molch sieht aus wie eine Eidechse, aber seine Haut ist feucht. Darum ist er ein Lurch."
            show: { object: frog }
          - text: "Aus dem Laich schlüpfen Kaulquappen."
            say: "Frösche und Kröten legen ihre Eier ins Wasser. Diese Eier heißen Laich. Daraus schlüpfen Kaulquappen. Die Kaulquappen atmen mit Kiemen, wie Fische. Später wachsen ihnen Beine und eine Lunge, und sie können an Land gehen."
            show: { object: tadpole }
          - text: "Kriechtiere: trockene Haut mit Schuppen"
            say: "Kriechtiere heißen auch Reptilien. Schlange, Eidechse, Krokodil und Schildkröte sind Kriechtiere. Ihre Haut ist trocken und hat Schuppen. Sie atmen mit einer Lunge, auch das Krokodil, das viel im Wasser ist. Die Schildkröte hat dazu einen Panzer. Auch die Blindschleiche ist ein Kriechtier. Sie sieht aus wie eine Schlange, ist aber eine Eidechse ohne Beine."
            show: { object: snake }
          - text: "Die fünf Klassen: Säugetiere, Vögel, Fische, Lurche, Kriechtiere"
            say: "Jetzt hat Mias Buch alle fünf Kapitel. Säugetiere: Die Jungen trinken Milch. Vögel: Federn. Fische: Kiemen und Flossen. Lurche: feuchte Haut ohne Schuppen. Kriechtiere: trockene Haut mit Schuppen. Eier legen übrigens nicht nur Vögel, sondern auch viele Fische, Lurche und Kriechtiere."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Tier hat eine feuchte, glatte Haut ohne Schuppen. Was ist es?"
                options: ["ein Lurch", "ein Kriechtier", "ein Vogel"]
                answer: "ein Lurch"
                hints:
                  - "Schau auf die Haut."
                  - "Kriechtiere haben Schuppen, Vögel Federn."
                  - "Feuchte Haut ohne Schuppen: ein Lurch."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Welches Tier ist ein Kriechtier?"
                options:
                  - { object: frog }
                  - { object: crocodile }
                  - { object: fish }
                answer: crocodile
                hints:
                  - "Welches Tier hat trockene Haut mit Schuppen?"
                  - "Der Frosch hat feuchte Haut, der Fisch hat Kiemen."
                  - "Das Krokodil ist ein Kriechtier."
                difficulty: easy
              - id: l2-f3
                type: sorting
                text: "Lurch oder Kriechtier?"
                say: "Lurch oder Kriechtier? Lege jedes Tier in sein Kapitel."
                bins:
                  - { id: amphibian, show: { text: "Lurche" }, say: "Lurche" }
                  - { id: reptile, show: { text: "Kriechtiere" }, say: "Kriechtiere" }
                options:
                  - { object: frog, bin: amphibian }
                  - { object: snake, bin: reptile }
                  - { object: crocodile, bin: reptile }
                  - { object: toad, bin: amphibian }
                  - { object: tortoise, bin: reptile }
                  - { object: newt, bin: amphibian }
                hints:
                  - "Feuchte Haut oder trockene Haut mit Schuppen?"
                  - "Kröte und Molch sind mit dem Frosch verwandt."
                  - "Lurche: Frosch, Kröte, Molch. Kriechtiere: Schlange, Krokodil, Schildkröte."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Das Krokodil ist viel im Wasser. Darum ist es ein Lurch."
                show: { object: crocodile }
                answer: false
                feedback:
                  "true": "Das Krokodil hat trockene Haut mit Schuppen und atmet mit einer Lunge. Es ist ein Kriechtier."
                hints:
                  - "Wo ein Tier lebt, sagt nichts über seine Klasse."
                  - "Wie ist die Haut des Krokodils?"
                  - "Trocken und mit Schuppen: Das Krokodil ist ein Kriechtier."
              - id: l2-f5
                type: matching
                text: "Verbinde jedes Merkmal mit seiner Klasse."
                say: "Verbinde jedes Merkmal mit der Klasse, die es hat."
                pairs:
                  - { left: { text: "trockene Haut mit Schuppen" }, right: { text: "Kriechtiere" } }
                  - { left: { text: "feuchte Haut ohne Schuppen" }, right: { text: "Lurche" } }
                  - { left: { text: "Federn" }, right: { text: "Vögel" } }
                hints:
                  - "Denk an den Frosch und an die Eidechse."
                  - "Die Haut des Froschs ist feucht."
                  - "Trocken mit Schuppen: Kriechtiere. Feucht ohne Schuppen: Lurche. Federn: Vögel."
              - id: l2-f6
                type: multiple_choice
                text: "Womit atmen Kaulquappen im Wasser?"
                show: { object: tadpole }
                options: ["mit Kiemen", "mit einer Lunge", "mit einem Schnorchel"]
                answer: "mit Kiemen"
                feedback:
                  "mit einem Schnorchel": "Das wäre lustig! Aber Kaulquappen brauchen keinen Schnorchel. Sie haben Kiemen wie ein Fisch."
                hints:
                  - "Kaulquappen leben ganz im Wasser, wie Fische."
                  - "Die Lunge wächst erst später."
                  - "Kaulquappen atmen mit Kiemen."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Alle fünf Kapitel: Wohin gehört jedes Tier?"
                say: "Jetzt hat Mias Buch alle fünf Kapitel. Wohin gehört jedes Tier?"
                bins:
                  - { id: mammal, show: { text: "Säugetiere" }, say: "Säugetiere" }
                  - { id: bird, show: { text: "Vögel" }, say: "Vögel" }
                  - { id: fish, show: { text: "Fische" }, say: "Fische" }
                  - { id: amphibian, show: { text: "Lurche" }, say: "Lurche" }
                  - { id: reptile, show: { text: "Kriechtiere" }, say: "Kriechtiere" }
                options:
                  - { object: cow, bin: mammal }
                  - { object: owl, bin: bird }
                  - { object: fish, bin: fish }
                  - { object: frog, bin: amphibian }
