# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.dissolving
skill: world.nature.dissolving
curriculum: de-DE
language: de
title:
  de: Was löst sich in Wasser?
  en: What dissolves in water?
summary: >
  Sugar, salt, Brausepulver and honey dissolve in water: you no longer see
  them, the water stays clear, but you can still taste them. Sand, pebbles,
  rice and marbles sink to the bottom, and oil floats on top, however long
  you stir. Warm water, stirring and fine grains make sugar dissolve
  faster; a glass of water takes only so much. A filter catches sand but
  not dissolved salt; letting the water evaporate gives the salt back. The
  story: Lea and Tim run a lemonade stand at the school fair. Lesson 1
  predicts what dissolves and how to tell; lesson 2 dissolves faster, gets
  the salt back and ends with the skill check. The experiments are
  predicted in the app and seen as a result; the real ones stay in class
  or at home with an adult.
metadata:
  year: klasse-3
  topic: { de: Wasser, en: Water }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.materials-sort, world.nature.water-states]
  also_practises: [world.nature.water-states]
  vocabulary: { de: [lösen, sich lösen, gelöst, Stoff, Zucker, Salz, Sand, Öl, Brausepulver, Schicht, rühren, Filter, Kristall, Salzwasser, Meersalz, verdunsten] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: predict, what: { de: "vorhersagen, was sich in Wasser löst und was nicht", en: "predicting what dissolves in water and what does not" } }
    - { id: signs, what: { de: "erkennen, ob sich ein Stoff gelöst hat", en: "telling whether a material has dissolved" } }
    - { id: faster-back, what: { de: "schneller lösen und gelöste Stoffe zurückholen", en: "dissolving faster and getting dissolved materials back" } }
  misconceptions:
    - id: dissolved-is-gone
      what: Thinks sugar or salt that dissolves is gone
      addressed: lesson 1 opens with the guess about the sugar and answers it with the sweet taste; l1-s1, l1-c4, l2-w2 and l2-c9
    - id: dissolving-is-melting
      what: Says sugar melts in water
      addressed: the lesson 1 screen on the sugar says Lösen is not Schmelzen; l1-f1, l1-n2 and l2-c13
    - id: stirring-dissolves-all
      what: Thinks everything dissolves if you stir long enough (oil, sand)
      addressed: the lesson 1 screen on sand and oil; l1-s5, l2-c4
    - id: filter-catches-salt
      what: Thinks a filter takes dissolved salt out of the water
      addressed: lesson 2 opens the salt question with the filter that lets salt water through; l2-f5, l2-s2 and l2-c16
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wohin verschwindet der Zucker?", en: "Where does the sugar go?" }
    goal:
      de: "Sag vorher, was sich in Wasser löst. Zucker löst sich zum Beispiel, Sand nicht."
      en: "Predict what dissolves in water. Sugar dissolves, for example, and sand does not."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Woraus ist diese Murmel?"
            show: { object: marble }
            options: ["aus Glas", "aus Holz", "aus Papier"]
            answer: "aus Glas"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Wasser im Glas ist flüssig."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wohin verschwindet der Zucker im Wasser?"
            say: "Lea und Tim machen Limonade für ihren Stand beim Schulfest. Lea rührt einen Löffel Zucker in einen Krug mit Wasser. Nach kurzer Zeit siehst du keinen Zucker mehr. Was glaubst du: Ist der Zucker weg?"
            show: { object: bag-of-sugar }
          - text: "Der Zucker hat sich gelöst. Er ist noch im Wasser."
            say: "Tim probiert: Das Wasser schmeckt süß! Der Zucker ist also noch da. Er hat sich im Wasser gelöst. Er ist in so winzige Teilchen zerfallen, dass du sie nicht mehr sehen kannst. Das Wasser bleibt klar. Geschmolzen ist der Zucker nicht. Schmelzen heißt, dass etwas durch Wärme flüssig wird, wie Eis. Der Zucker hat sich im kalten Wasser gelöst."
            show: { object: water }
          - text: "Salz, Brausepulver und Honig lösen sich auch."
            say: "Auch Salz löst sich in Wasser. Darum schmeckt das Nudelwasser salzig, obwohl du kein Salz mehr siehst. Brausepulver und Honig lösen sich auch. Aber Vorsicht: Probier bei einem Versuch nur dann etwas, wenn ein Erwachsener sagt, dass es Essen ist."
          - text: "Sand und Öl lösen sich nicht."
            say: "Tim hat Sand in der Hosentasche, und ein bisschen fällt in ein Glas Wasser. Lea rührt. Der Sand wirbelt herum und sinkt dann auf den Boden. Er löst sich nicht. Auch Öl löst sich nicht. Es schwimmt als Schicht oben auf dem Wasser, auch wenn du lange rührst."
            show: { object: sandcastle }
          - text: "Wusstest du? In einem Liter Meerwasser sind ungefähr 35 Gramm Salz gelöst."
            say: "Wusstest du? Das Meer schmeckt salzig, weil darin Salz gelöst ist. In einem Liter Meerwasser sind ungefähr fünfunddreißig Gramm Salz. Das sind etwa zwei Esslöffel voll. Sehen kannst du davon nichts: Das Meerwasser ist trotzdem klar."
          - text: "Gelöst: Du siehst es nicht mehr, aber du schmeckst es.\nNicht gelöst: Es liegt unten oder schwimmt oben."
            say: "So erkennst du es. Hat sich ein Stoff gelöst, siehst du ihn nicht mehr, und das Wasser bleibt klar. Aber er ist noch da: Du kannst ihn schmecken. Hat er sich nicht gelöst, liegt er unten im Glas, wie Sand, oder er schwimmt oben, wie Öl."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lea rührt Salz in Wasser. Nach einer Weile siehst du kein Salz mehr. Was ist passiert?"
                options: ["Das Salz hat sich gelöst.", "Das Salz ist geschmolzen.", "Das Salz ist ganz weg."]
                answer: "Das Salz hat sich gelöst."
                feedback:
                  "Das Salz ist geschmolzen.": "Schmelzen braucht Wärme, wie beim Eis. Das Salz ist im kalten Wasser in winzige Teilchen zerfallen."
                  "Das Salz ist ganz weg.": "Probier das Wasser: Es schmeckt salzig. Das Salz ist also noch da."
                hints:
                  - "Wie schmeckt das Wasser jetzt?"
                  - "Das Wasser schmeckt salzig, also ist das Salz noch da."
                  - "Das Salz hat sich gelöst."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Löst es sich in Wasser oder nicht?"
                say: "Lea und Tim testen. Löst es sich in Wasser oder nicht? Sortiere."
                bins:
                  - { id: dis, show: { text: "löst sich" }, say: "löst sich" }
                  - { id: undis, show: { text: "löst sich nicht" }, say: "löst sich nicht" }
                options:
                  - { object: bag-of-sugar, bin: dis }
                  - { text: "Salz", bin: dis }
                  - { text: "Sand", bin: undis }
                  - { text: "Öl", bin: undis }
                  - { object: stone, bin: undis }
                  - { text: "Brausepulver", bin: dis }
                hints:
                  - "Was siehst du nach dem Rühren nicht mehr?"
                  - "Sand und Steine sinken nach unten, Öl schwimmt oben."
                  - "Löst sich: Zucker, Salz, Brausepulver. Löst sich nicht: Sand, Öl, Stein."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Zuckerwasser schmeckt süß, obwohl du den Zucker nicht mehr siehst."
                answer: true
                hints:
                  - "Ist der Zucker noch im Wasser?"
                  - "Gelöster Zucker ist in winzige Teilchen zerfallen, aber er ist noch da."
                  - "Ja, darum schmeckt das Wasser süß."
              - id: l1-f4
                type: image_multiple_choice
                text: "Was löst sich in Wasser?"
                options:
                  - { object: stone }
                  - { object: marble }
                  - { object: bag-of-sugar }
                answer: bag-of-sugar
                hints:
                  - "Was kannst du nach dem Rühren nicht mehr sehen?"
                  - "Ein Stein und eine Murmel liegen unten im Glas."
                  - "Zucker löst sich in Wasser."
              - id: l1-f5
                type: multiple_choice
                text: "Tim rührt Öl in Wasser. Was siehst du nach einer Weile?"
                options: ["Das Öl schwimmt als Schicht oben.", "Das Öl ist nicht mehr zu sehen.", "Das Wasser wird süß."]
                answer: "Das Öl schwimmt als Schicht oben."
                hints:
                  - "Löst sich Öl in Wasser?"
                  - "Öl löst sich nicht, auch wenn du rührst."
                  - "Es schwimmt oben auf dem Wasser."
              - id: l1-f6
                type: matching
                text: "Was passiert im Wasser? Verbinde."
                pairs:
                  - { left: { text: "Zucker" }, right: { text: "löst sich, das Wasser bleibt klar" } }
                  - { left: { text: "Sand" }, right: { text: "sinkt auf den Boden" } }
                  - { left: { text: "Öl" }, right: { text: "schwimmt oben" } }
                hints:
                  - "Nur einer der drei Stoffe löst sich."
                  - "Was schwer und körnig ist, sinkt nach unten."
                  - "Zucker löst sich. Sand sinkt. Öl schwimmt oben."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Wenn sich Zucker im Wasser löst, ist er weg."
                answer: false
                feedback:
                  "true": "Der Zucker ist noch da. Das Wasser schmeckt ja süß."
                hints: ["Wie schmeckt das Wasser?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was löst sich nicht in Wasser?"
                options: ["Sand", "Salz", "Zucker"]
                answer: "Sand"
                hints: ["Was liegt nach dem Rühren unten im Glas?"]
              - id: l1-s3
                type: sorting
                text: "Was passiert im Glas Wasser?"
                say: "Lea rührt jeden Stoff in ein Glas Wasser. Was passiert? Sortiere."
                bins:
                  - { id: dissolve, show: { text: "löst sich" }, say: "löst sich" }
                  - { id: bottom, show: { text: "sinkt auf den Boden" }, say: "sinkt auf den Boden" }
                  - { id: top, show: { text: "schwimmt oben" }, say: "schwimmt oben" }
                options:
                  - { text: "Salz", bin: dissolve }
                  - { text: "Sand", bin: bottom }
                  - { text: "Öl", bin: top }
                  - { text: "Kieselsteine", bin: bottom }
                  - { text: "Brausepulver", bin: dissolve }
                hints: ["Was löst sich nicht, liegt unten oder schwimmt oben."]
              - id: l1-s4
                type: multiple_choice
                text: "Woran erkennst du, dass sich Salz im Wasser gelöst hat?"
                options: ["Du siehst es nicht mehr, aber das Wasser schmeckt salzig.", "Das Wasser wird bunt.", "Das Salz liegt unten im Glas."]
                answer: "Du siehst es nicht mehr, aber das Wasser schmeckt salzig."
                hints: ["Gelöst heißt: nicht mehr zu sehen, aber noch da."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Öl löst sich in Wasser, wenn du nur lange genug rührst."
                answer: false
                feedback:
                  "true": "Rühr, so lange du willst: Das Öl schwimmt danach wieder oben."
                hints: ["Was passiert, wenn du aufhörst zu rühren?"]
              - id: l1-s6
                type: matching
                text: "Was passiert damit im Wasser? Verbinde."
                pairs:
                  - { left: { object: bag-of-sugar }, right: { text: "löst sich" } }
                  - { left: { object: stone }, right: { text: "sinkt auf den Boden" } }
                  - { left: { text: "Öl" }, right: { text: "schwimmt oben" } }
                hints: ["Nur der Zucker verschwindet aus dem Blick."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: sorting
                text: "Lea testet für den Stand. Was löst sich?"
                bins:
                  - { id: dis, show: { text: "löst sich" }, say: "löst sich" }
                  - { id: undis, show: { text: "löst sich nicht" }, say: "löst sich nicht" }
                options:
                  - { text: "Traubenzucker", bin: dis }
                  - { text: "Salz", bin: dis }
                  - { object: marble, bin: undis }
                  - { text: "Reis", bin: undis }
                  - { text: "Sand", bin: undis }
              - id: l1-n2
                type: multiple_choice
                text: "Tim sagt: „Der Zucker ist im Wasser geschmolzen.“ Was sagst du ihm?"
                options: ["Er hat sich gelöst. Zum Schmelzen braucht es Wärme, und das Wasser ist kalt.", "Stimmt, Zucker schmilzt in Wasser wie Eis.", "Nein, der Zucker ist verdunstet."]
                answer: "Er hat sich gelöst. Zum Schmelzen braucht es Wärme, und das Wasser ist kalt."
              - id: l1-n3
                type: true_false
                text: "Stimmt das? Sand sinkt im Wasser auf den Boden und bleibt Sand."
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Was macht Leas Limonade süß, ohne dass man es im Glas sieht?"
                options:
                  - { object: shell }
                  - { object: bag-of-sugar }
                  - { object: dice }
                answer: bag-of-sugar
              - id: l1-n5
                type: multiple_choice
                text: "Lea rührt je einen Löffel Zucker, Salz und Sand in ein Glas Wasser. In einem Glas liegen auch nach langem Rühren noch Körnchen unten. Was war darin?"
                options: ["Sand", "Zucker", "Salz"]
                answer: "Sand"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was löst sich in Wasser?"
            options: ["Salz", "Sand", "Kieselsteine"]
            answer: "Salz"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Öl schwimmt oben auf dem Wasser."
            answer: true
          - id: l1-c3
            type: sorting
            text: "Löst es sich, oder löst es sich nicht?"
            bins:
              - { id: dis, show: { text: "löst sich" }, say: "löst sich" }
              - { id: undis, show: { text: "löst sich nicht" }, say: "löst sich nicht" }
            options:
              - { text: "Zucker", bin: dis }
              - { text: "Sand", bin: undis }
              - { text: "Salz", bin: dis }
              - { text: "Öl", bin: undis }
          - id: l1-c4
            type: multiple_choice
            text: "Das Zuckerwasser ist klar. Wo ist der Zucker?"
            options: ["Er ist gelöst und noch im Wasser.", "Er ist verdunstet.", "Er ist ganz weg."]
            answer: "Er ist gelöst und noch im Wasser."
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Sand löst sich in Wasser."
            answer: false
          - id: l1-c6
            type: matching
            text: "Was passiert mit dem Stoff im Wasser? Verbinde."
            pairs:
              - { left: { text: "Salz" }, right: { text: "löst sich" } }
              - { left: { text: "Sand" }, right: { text: "sinkt auf den Boden" } }
              - { left: { text: "Öl" }, right: { text: "schwimmt oben" } }

  - n: 2
    title: { de: "Schneller lösen, Salz zurückholen", en: "Dissolving faster, getting the salt back" }
    goal:
      de: "Finde heraus, wie sich Zucker schneller löst und wie du gelöstes Salz zurückbekommst. In warmem Wasser löst sich Zucker zum Beispiel schneller."
      en: "Find out how sugar dissolves faster and how you get dissolved salt back. In warm water, for example, sugar dissolves faster."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was schwimmt als Schicht oben auf dem Wasser?"
            options: ["Öl", "Zucker", "Salz"]
            answer: "Öl"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Gelöster Zucker ist noch im Wasser."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Löst sich Zucker in warmem oder in kaltem Tee schneller?"
            say: "Lea und Tim wollen auch Eistee verkaufen. Der Tee ist schon kalt. Tim schüttet Zucker hinein, aber der Zucker liegt lange unten. Oma sagt: Mit warmem Tee wäre das schneller gegangen. Was glaubst du: Hat Oma recht?"
            show: { object: cup }
          - text: "In warmem Wasser und beim Rühren löst sich Zucker schneller."
            say: "Oma hat recht. In warmem Wasser löst sich Zucker schneller als in kaltem. Rühren hilft auch. Und feiner Zucker löst sich schneller als ein ganzes Zuckerstück."
            show: { object: spoon }
          - text: "Zu viel Zucker löst sich nicht mehr."
            say: "Tim schüttet noch mehr Zucker in sein Glas, Löffel um Löffel. Irgendwann bleibt der Zucker unten liegen, auch wenn er rührt. In einem Glas Wasser kann sich nur eine bestimmte Menge lösen. Was zu viel ist, bleibt liegen."
            show: { object: bag-of-sugar }
          - text: "Was glaubst du: Wie bekommt Lea das Salz aus dem Salzwasser zurück?"
            say: "Lea hat Salzwasser gemacht und will das Salz zurück. Sie gießt das Salzwasser durch einen Kaffeefilter. Aber das Salzwasser läuft einfach durch, und es schmeckt immer noch salzig. Was glaubst du: Wie bekommt sie das Salz zurück?"
            show: { object: dish }
          - text: "Das Wasser verdunstet, das Salz bleibt übrig."
            say: "Lea gießt das Salzwasser in eine flache Schale und stellt sie ein paar Tage an einen warmen, sonnigen Platz. Das Wasser verdunstet, das Salz nicht. Am Ende liegen weiße Salzkristalle in der Schale. So gewinnen Menschen auch Meersalz: Sie lassen Meerwasser in flachen Becken in der Sonne verdunsten. Sand dagegen holst du mit einem Filter heraus. Er bleibt im Filter hängen."
            show: { object: sun }
          - text: "Wusstest du? Im Toten Meer kannst du auf dem Wasser liegen, ohne unterzugehen."
            say: "Wusstest du? Im Toten Meer ist so viel Salz gelöst, dass das Wasser Menschen ganz besonders gut trägt. Du kannst dich auf den Rücken legen und eine Zeitung lesen, ohne unterzugehen. Fische können in diesem salzigen Wasser nicht leben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "In welchem Tee löst sich ein Löffel Zucker am schnellsten?"
                options: ["in warmem Tee", "in kaltem Eistee", "in Tee mit Eiswürfeln"]
                answer: "in warmem Tee"
                hints:
                  - "Denk an Oma und den Eistee."
                  - "Kälte macht das Lösen langsamer."
                  - "In warmem Tee löst sich Zucker am schnellsten."
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Wenn du rührst, löst sich Zucker schneller."
                answer: true
                hints:
                  - "Was macht Lea mit dem Löffel?"
                  - "Rühren bringt den Zucker überall ans Wasser."
                  - "Ja, Rühren hilft beim Lösen."
              - id: l2-f3
                type: ordering
                text: "Wie holt Lea das Salz zurück? Bring die Schritte in die richtige Reihenfolge."
                say: "Wie holt Lea das Salz zurück? Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Das Wasser verdunstet nach und nach.", "Lea gießt das Salzwasser in eine flache Schale.", "Unten in der Schale liegen Salzkristalle.", "Lea stellt die Schale in die Sonne."]
                slot_count: 4
                answer: ["Lea gießt das Salzwasser in eine flache Schale.", "Lea stellt die Schale in die Sonne.", "Das Wasser verdunstet nach und nach.", "Unten in der Schale liegen Salzkristalle."]
                hints:
                  - "Was muss Lea zuerst tun, bevor die Sonne helfen kann?"
                  - "Erst kommt das Salzwasser in die Schale, dann in die Sonne."
                  - "Gießen, in die Sonne stellen, verdunsten, Salzkristalle."
              - id: l2-f4
                type: multiple_choice
                text: "Tim schüttet sehr viel Zucker in ein Glas Wasser. Was passiert?"
                options: ["Ein Teil löst sich, der Rest bleibt unten liegen.", "Aller Zucker löst sich, egal wie viel.", "Das Wasser wird zu Zucker."]
                answer: "Ein Teil löst sich, der Rest bleibt unten liegen."
                feedback:
                  "Das Wasser wird zu Zucker.": "Das wäre ein süßer Zaubertrick! Aber das Wasser bleibt Wasser."
                hints:
                  - "Kann sich in einem Glas unendlich viel lösen?"
                  - "In einem Glas Wasser löst sich nur eine bestimmte Menge."
                  - "Was zu viel ist, bleibt unten liegen."
              - id: l2-f5
                type: sorting
                text: "Bleibt es im Filter, oder läuft es durch?"
                say: "Lea gießt das Wasser durch einen Filter. Bleibt es im Filter hängen, oder läuft es durch?"
                bins:
                  - { id: stays, show: { text: "bleibt im Filter" }, say: "bleibt im Filter" }
                  - { id: through, show: { text: "läuft durch" }, say: "läuft durch" }
                options:
                  - { text: "Sand", bin: stays }
                  - { text: "gelöstes Salz", bin: through }
                  - { text: "Kieselsteine", bin: stays }
                  - { text: "gelöster Zucker", bin: through }
                  - { text: "Reis", bin: stays }
                hints:
                  - "Was hat sich gelöst, was nicht?"
                  - "Gelöste Stoffe sind in winzige Teilchen zerfallen. Sie passen durch den Filter."
                  - "Im Filter: Sand, Kieselsteine, Reis. Durch: gelöstes Salz und gelöster Zucker."
              - id: l2-f6
                type: image_multiple_choice
                text: "Was hilft, damit das Wasser aus Leas Salzwasser verdunstet?"
                options:
                  - { object: fridge }
                  - { object: sun }
                  - { object: snowflake }
                answer: sun
                hints:
                  - "Wasser verdunstet schneller, wenn es warm ist."
                  - "Im Kühlschrank und im Schnee ist es kalt."
                  - "Die Sonne wärmt das Wasser."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was willst du tun, und wie geht es? Verbinde."
                pairs:
                  - { left: { text: "Zucker schneller lösen" }, right: { text: "warmes Wasser und rühren" } }
                  - { left: { text: "Sand herausholen" }, right: { text: "durch einen Filter gießen" } }
                  - { left: { text: "Salz zurückholen" }, right: { text: "das Wasser verdunsten lassen" } }
                hints: ["Gelöstes Salz läuft durch den Filter."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Mit einem Kaffeefilter holst du gelöstes Salz aus dem Wasser."
                answer: false
                feedback:
                  "true": "Gelöstes Salz läuft durch den Filter. Das Wasser schmeckt danach immer noch salzig."
                hints: ["Was passiert, als Lea ihr Salzwasser durch den Filter gießt?"]
              - id: l2-s3
                type: multiple_choice
                text: "Was löst sich in Wasser am schnellsten?"
                options: ["ein Löffel feiner Zucker", "ein ganzes Zuckerstück", "ein Kieselstein"]
                answer: "ein Löffel feiner Zucker"
                feedback:
                  "ein Kieselstein": "Auf den Kieselstein kannst du lange warten. Er löst sich gar nicht!"
                hints: ["Kleine Körnchen lösen sich schneller als ein großes Stück."]
              - id: l2-s4
