# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.forest
skill: world.nature.forest
curriculum: de-DE
language: de
title:
  de: Der Wald als Lebensraum
  en: The forest as a habitat
summary: >
  The forest is built in five layers, from the root layer up to the tree
  crowns, and each layer gives different animals and plants food and
  shelter. Fallen leaves become new soil through earthworms, woodlice and
  fungi; the forest gives oxygen, stores water, gives wood and a home to
  many animals, and needs protecting. The story: class 3b has a forest day
  with the forester Frau Kaya. Lesson 1: the layers and who lives in
  them, with the early spring flowers. Lesson 2: the leaf cycle, why the
  forest matters, the forest rules (no fire, take litter home, be quiet,
  never eat a mushroom you found, leave a fawn alone) and the skill check.
  There are no pictures of squirrel, woodpecker, mole, moss, fern,
  mushroom or fawn yet, so these are text cards.
metadata:
  year: klasse-3
  topic: { de: Der Wald, en: The forest }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.trees, world.nature.adaptation]
  also_practises: []
  vocabulary: { de: [Stockwerk, Wurzelschicht, Moosschicht, Krautschicht, Strauchschicht, Baumschicht, Baumkrone, Frühblüher, Buschwindröschen, Laub, Humus, Pilz, Assel, Försterin, Rehkitz, Sauerstoff] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: layers, what: { de: die Stockwerke des Waldes nennen und ordnen, en: naming and ordering the layers of the forest } }
    - { id: living, what: { de: "Tiere und Pflanzen ihrem Stockwerk zuordnen", en: placing animals and plants in their layer } }
    - { id: cycle, what: { de: "erklären, wie aus Laub neue Erde wird", en: explaining how fallen leaves become new soil } }
    - { id: protect, what: { de: "sagen, warum der Wald wichtig ist und wie man ihn schützt", en: saying why the forest matters and how to protect it } }
  misconceptions:
    - id: forest-is-just-trees
      what: Thinks a forest is only trees and that animals live anywhere in it
      addressed: lesson 1 opens with the guess about storeys; l1-f5, l1-n2, l1-n5, l2-c7 and l2-c8
    - id: leaves-are-rubbish
      what: Thinks fallen leaves are waste that someone clears away, or that litter in the forest rots like leaves
      addressed: lesson 2 opens with the guess about where the leaves go; l2-f1, l2-n2, l2-n3 and l2-c20
    - id: fungi-are-plants
      what: Thinks mushrooms are plants
      addressed: the "Wusstest du?" screen in lesson 2; l2-f3 and l2-c12
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Ein Haus mit fünf Stockwerken", en: "A house with five storeys" }
    goal:
      de: "Lerne die Stockwerke des Waldes kennen und wer dort wohnt. Der Specht zum Beispiel wohnt oben in der Baumschicht."
      en: "Get to know the layers of the forest and who lives in them. The woodpecker, for example, lives up in the tree layer."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Welcher Baum ist ein Nadelbaum?"
            options:
              - { object: spruce }
              - { object: beech }
              - { object: oak }
            answer: spruce
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welches Tier hält Winterschlaf?"
            options:
              - { object: hedgehog }
              - { object: fox }
              - { object: bird }
            answer: hedgehog
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Hat ein Wald Stockwerke wie ein Haus?"
            say: "Die Klasse 3b hat heute einen Waldtag mit der Försterin Frau Kaya. Sie sagt: Der Wald ist gebaut wie ein hohes Haus. Was glaubst du: Hat ein Wald Stockwerke?"
            show: { object: tree }
          - text: "Ja! Der Wald hat fünf Stockwerke."
            say: "Ja. Von unten nach oben heißen sie: Wurzelschicht, Moosschicht, Krautschicht, Strauchschicht und Baumschicht. In jedem Stockwerk leben andere Tiere und Pflanzen, denn jedes hat anderes Futter und andere Verstecke."
          - text: "Ganz unten: Wurzelschicht und Moosschicht"
            say: "In der Wurzelschicht unter der Erde wachsen die Wurzeln. Dort leben Regenwurm und Maulwurf, und der Fuchs gräbt dort seinen Bau. Darüber, direkt am Boden, ist die Moosschicht. Hier wachsen Moos und Pilze, und hier krabbeln Käfer, Schnecken und Ameisen."
            show: { object: worm }
          - text: "In der Mitte: Krautschicht und Strauchschicht"
            say: "In der Krautschicht wachsen Farne, Gräser und Blumen. Darüber kommt die Strauchschicht mit Sträuchern wie Haselnuss und Brombeere und mit jungen Bäumen. Hier finden Rehe Futter und ein Versteck."
            show: { object: fern }
          - text: "Ganz oben: die Baumschicht mit den Baumkronen"
            say: "Ganz oben sind die Kronen der Bäume. Hier baut das Eichhörnchen sein Nest, und im Herbst versteckt es Nüsse für den Winter. Der Specht zimmert eine Höhle in den Stamm. Die Eule schläft am Tag oft in einer Baumhöhle, und viele Vögel bauen hier ihre Nester."
            show: { object: owl }
          - text: "Frühblüher: Sie blühen, bevor die Bäume Blätter haben."
            say: "Im März und April ist es am Waldboden noch hell, denn die Laubbäume haben noch keine Blätter. Dann blühen schnell Blumen wie das Buschwindröschen. Im Sommer ist es unter dem dichten Laub zu dunkel dafür. Auch das ist eine Anpassung an den Lebensraum."
            show: { object: flower }
          - text: "Frag: In welchem Stockwerk findet das Tier Futter und ein Versteck?"
            say: "So findest du das Stockwerk eines Tiers: Frag, wo es frisst und wo es sich versteckt. Der Regenwurm gräbt in der Erde, der Specht klopft am Stamm."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Lege die Stockwerke von unten nach oben."
                options: ["Krautschicht", "Baumschicht", "Wurzelschicht", "Strauchschicht", "Moosschicht"]
                slot_count: 5
                answer: ["Wurzelschicht", "Moosschicht", "Krautschicht", "Strauchschicht", "Baumschicht"]
                hints:
                  - "Fang ganz unten an, unter der Erde."
                  - "Unter der Erde sind die Wurzeln, direkt am Boden wächst Moos."
                  - "Wurzelschicht, Moosschicht, Krautschicht, Strauchschicht, Baumschicht."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Tier lebt in der Wurzelschicht?"
                options:
                  - { object: worm }
                  - { object: owl }
                  - { object: butterfly }
                answer: worm
                hints:
                  - "Die Wurzelschicht ist unter der Erde."
                  - "Wer gräbt Gänge in der Erde?"
                  - "Der Regenwurm lebt in der Erde."
              - id: l1-f3
                type: multiple_choice
                text: "Wo baut das Eichhörnchen sein Nest?"
                show: { object: squirrel }
                options: ["in der Baumschicht", "in der Wurzelschicht", "in der Moosschicht"]
                answer: "in der Baumschicht"
                hints:
                  - "Das Eichhörnchen klettert gern."
                  - "Es wohnt hoch oben in den Kronen."
                  - "Sein Nest ist in der Baumschicht."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Farne und Blumen wachsen in der Krautschicht."
                show: { object: fern }
                answer: true
                hints:
                  - "Was wächst über dem Moos, aber unter den Sträuchern?"
                  - "Das Stockwerk heißt nach dem Kraut, also nach Pflanzen wie Farnen und Blumen."
                  - "Ja, Farne und Blumen wachsen in der Krautschicht."
              - id: l1-f5
                type: sorting
                text: "Wer wohnt unten, wer oben?"
                say: "Frau Kaya hat Karten mitgebracht. Wer wohnt unten am Boden, wer oben in den Baumkronen?"
                bins:
                  - { id: low, show: { text: "am Boden und darunter" }, say: "am Boden und darunter" }
                  - { id: high, show: { text: "in den Baumkronen" }, say: "in den Baumkronen" }
                options:
                  - { object: worm, bin: low }
                  - { object: owl, bin: high }
                  - { object: snail, bin: low }
                  - { object: woodpecker, bin: high }
                  - { object: ant, bin: low }
                  - { object: squirrel, bin: high }
                hints:
                  - "Wer kriecht, wer klettert oder fliegt?"
                  - "Wurm, Schnecke und Ameise sind am Boden."
                  - "Unten: Wurm, Schnecke, Ameise. Oben: Eule, Specht, Eichhörnchen."
              - id: l1-f6
                type: multiple_choice
                text: "Warum blüht das Buschwindröschen schon im März?"
                show: { object: wood-anemone }
                options: ["Dann ist es am Waldboden noch hell.", "Dann ist es im Wald am wärmsten.", "Dann schlafen alle Tiere."]
                answer: "Dann ist es am Waldboden noch hell."
                hints:
                  - "Was brauchen Pflanzen zum Wachsen?"
                  - "Haben die Laubbäume im März schon Blätter?"
                  - "Ohne Laub oben ist es unten hell: Darum blüht es früh."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Verbinde jedes Lebewesen mit seinem Stockwerk."
                pairs:
                  - { left: { object: hazelnut }, right: { text: "Strauchschicht" } }
                  - { left: { object: moss }, right: { text: "Moosschicht" } }
                  - { left: { object: mole }, right: { text: "Wurzelschicht" } }
                  - { left: { object: woodpecker }, right: { text: "Baumschicht" } }
                hints: ["Die Haselnuss ist ein Strauch."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Die Strauchschicht ist das oberste Stockwerk."
                answer: false
                feedback:
                  "true": "Über den Sträuchern sind noch die Baumkronen. Die Baumschicht ist ganz oben."
                hints: ["Was ist höher: ein Strauch oder ein Baum?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welches Tier gräbt seinen Bau unter der Erde?"
                options:
                  - { object: fox }
                  - { object: owl }
                  - { object: butterfly }
                answer: fox
                hints: ["Wer wohnt in einem Bau?"]
              - id: l1-s4
                type: multiple_choice
                text: "Was wächst in der Strauchschicht?"
                options: ["Haselnuss und Brombeere", "Moos und Pilze", "die Kronen der Bäume"]
                answer: "Haselnuss und Brombeere"
                hints: ["Welche Pflanzen sind Sträucher?"]
              - id: l1-s5
                type: ordering
                text: "Diesmal von oben nach unten: Ordne."
                options: ["Moosschicht", "Baumschicht", "Krautschicht"]
                slot_count: 3
                answer: ["Baumschicht", "Krautschicht", "Moosschicht"]
                hints: ["Fang ganz oben bei den Kronen an."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Die Eule schläft am Tag oft in einer Baumhöhle."
                show: { object: owl }
                answer: true
                hints: ["Wann jagt die Eule, und wann ruht sie?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Mila kniet am Waldboden zwischen Moos und Pilzen. Eine Schnecke kriecht vorbei. In welchem Stockwerk ist Mila?"
                show: { object: snail }
                options: ["in der Moosschicht", "in der Baumschicht", "in der Strauchschicht"]
                answer: "in der Moosschicht"
              - id: l1-n2
                type: sorting
                text: "Bens Karten: In welches Stockwerk gehören sie?"
                say: "Ben hat beim Waldtag Karten gemalt. In welches Stockwerk gehört jede Karte?"
                bins:
                  - { id: root, show: { text: "Wurzelschicht" }, say: "Wurzelschicht" }
                  - { id: moss, show: { text: "Moosschicht" }, say: "Moosschicht" }
                  - { id: herb, show: { text: "Krautschicht" }, say: "Krautschicht" }
                  - { id: shrub, show: { text: "Strauchschicht" }, say: "Strauchschicht" }
                  - { id: tree, show: { text: "Baumschicht" }, say: "Baumschicht" }
                options:
                  - { object: worm, bin: root }
                  - { object: mushroom, bin: moss }
                  - { object: fern, bin: herb }
                  - { object: blackberry, bin: shrub }
                  - { object: woodpecker, bin: tree }
              - id: l1-n3
                type: true_false
                text: "Frau Kaya fragt: „Ist es am Waldboden im Sommer heller als im Frühling?“ Ben sagt Ja. Hat er recht?"
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Mila sieht hoch oben in der Krone einer Eiche ein Tier. Welches kann es sein?"
                options:
                  - { object: owl }
                  - { object: worm }
                  - { object: shark }
                answer: owl
                feedback:
                  shark: "Ein Hai im Baum? Da hat Mila wohl geträumt! Haie leben im Meer."
              - id: l1-n5
                type: multiple_choice
                text: "Frau Kaya fragt: „Warum leben im Wald so viele verschiedene Tiere?“ Was antwortest du?"
                options: ["Jedes Stockwerk hat anderes Futter und andere Verstecke.", "Im Wald ist es immer warm.", "Die Försterin füttert alle Tiere."]
                answer: "Jedes Stockwerk hat anderes Futter und andere Verstecke."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt das unterste Stockwerk des Waldes?"
            options: ["die Wurzelschicht", "die Baumschicht", "die Krautschicht"]
            answer: "die Wurzelschicht"
          - id: l1-c2
            type: image_multiple_choice
            text: "Wer krabbelt in der Moosschicht?"
            options:
              - { object: snail }
              - { object: owl }
              - { object: whale }
            answer: snail
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Der Specht baut seine Höhle in der Wurzelschicht."
            show: { object: woodpecker }
            answer: false
          - id: l1-c4
            type: matching
            text: "Wer wohnt wo? Verbinde."
            pairs:
              - { left: { object: worm }, right: { text: "Wurzelschicht" } }
              - { left: { object: fern }, right: { text: "Krautschicht" } }
              - { left: { object: squirrel }, right: { text: "Baumschicht" } }
          - id: l1-c5
            type: multiple_choice
            text: "In welchem Stockwerk wachsen Sträucher und junge Bäume?"
            options: ["in der Strauchschicht", "in der Moosschicht", "in der Wurzelschicht"]
            answer: "in der Strauchschicht"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Der Wald hat fünf Stockwerke."
            answer: true

  - n: 2
    title: { de: "Den Wald verstehen und schützen", en: "Understanding and protecting the forest" }
    goal:
      de: "Finde heraus, wie aus Laub neue Erde wird und wie du den Wald schützt. Im Wald machst du zum Beispiel nie ein Feuer."
      en: "Find out how leaves become new soil and how you protect the forest. In the forest, for example, you never light a fire."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "In welchem Stockwerk wachsen Moos und Pilze?"
            options: ["in der Moosschicht", "in der Baumschicht", "in der Strauchschicht"]
            answer: "in der Moosschicht"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Das Eichhörnchen wohnt in der Baumschicht."
            show: { object: squirrel }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wohin verschwindet das viele Laub im Wald?"
            say: "Jeden Herbst fallen im Wald Millionen Blätter. Niemand fegt sie weg. Trotzdem steckt der Wald nicht nach ein paar Jahren bis zum Bauch im Laub. Was glaubst du: Wohin verschwindet es?"
            show: { object: leaf }
          - text: "Tiere und Pilze machen daraus neue Erde."
            say: "Regenwürmer, Asseln und viele winzige Lebewesen fressen das Laub. Auch Pilze zersetzen es. Daraus wird dunkle, lockere Erde, der Humus. In ihm wachsen neue Pflanzen. So geht im Wald nichts verloren."
            show: { object: worm }
          - text: "Wusstest du? Pilze sind keine Pflanzen."
            say: "Wusstest du? Pilze sind weder Pflanzen noch Tiere. Sie sind eine eigene Gruppe von Lebewesen. Was wir im Wald sehen, ist nur ein kleiner Teil des Pilzes. Der größte Teil wächst als feines Geflecht unsichtbar im Boden."
            show: { object: mushroom }
          - text: "Der Wald ist wichtig für Tiere und Menschen."
            say: "Bäume machen Sauerstoff, den wir zum Atmen brauchen. Sie halten Staub aus der Luft fest. Der Waldboden speichert Regenwasser wie ein Schwamm. Wir bekommen Holz aus dem Wald, und viele Tiere finden hier Futter und ein Zuhause."
            show: { object: tree }
          - text: "Die Waldregeln"
            say: "Frau Kaya erklärt die Waldregeln. Mach im Wald nie ein Feuer, denn der Wald kann brennen. Nimm deinen Müll wieder mit, denn Tiere können sich daran verletzen, und Plastik verrottet nicht wie Laub. Sei leise, damit die Tiere nicht erschrecken. Reiß keine Pflanzen aus, und bleib auf den Wegen."
          - text: "Pilze nie selbst essen. Ein Rehkitz nie anfassen."
            say: "Manche Pilze sind sehr giftig. Iss nie einen Pilz, den du im Wald findest. Im Frühling liegen junge Rehe, die Kitze, oft allein im Versteck. Sie sind nicht verlassen, die Mutter kommt zum Säugen zurück. Fass ein Kitz nicht an und geh leise weiter."
            show: { object: fawn }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was wird aus dem Laub, das im Herbst auf den Waldboden fällt?"
                show: { object: leaf }
                options: ["neue Erde, der Humus", "Müll, den jemand wegbringen muss", "Schnee"]
                answer: "neue Erde, der Humus"
                hints:
                  - "Niemand fegt im Wald das Laub weg."
                  - "Würmer, Asseln und Pilze fressen und zersetzen es."
                  - "Daraus wird neue Erde, der Humus."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Welches Tier hilft, aus Laub neue Erde zu machen?"
                options:
                  - { object: worm }
                  - { object: owl }
                  - { object: fox }
                answer: worm
                hints:
                  - "Wer frisst Laub am Waldboden?"
                  - "Eule und Fuchs fressen kein Laub."
                  - "Der Regenwurm frisst Laub und macht Erde daraus."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Pilze sind Pflanzen."
                show: { object: mushroom }
                answer: false
                feedback:
                  "true": "Pilze sind weder Pflanzen noch Tiere. Sie sind eine eigene Gruppe von Lebewesen."
                hints:
                  - "Pilze sind etwas ganz Eigenes."
                  - "Sie gehören weder zu den Pflanzen noch zu den Tieren."
                  - "Nein, Pilze sind keine Pflanzen."
              - id: l2-f4
                type: sorting
                text: "Gut für den Wald oder schlecht?"
                say: "Was ist gut für den Wald, was ist schlecht? Sortiere."
                bins:
                  - { id: good, show: { text: "gut für den Wald" }, say: "gut für den Wald" }
                  - { id: bad, show: { text: "schlecht für den Wald" }, say: "schlecht für den Wald" }
                options:
                  - { text: "Müll wieder mitnehmen", bin: good }
                  - { text: "ein Feuer machen", bin: bad }
                  - { text: "leise sein", bin: good }
                  - { text: "Pflanzen ausreißen", bin: bad }
                  - { text: "auf den Wegen bleiben", bin: good }
                  - { text: "laut Musik hören", bin: bad }
                hints:
                  - "Was stört die Tiere, was schadet den Pflanzen?"
                  - "Feuer kann den Wald abbrennen, Lärm erschreckt die Tiere."
                  - "Gut: Müll mitnehmen, leise sein, auf den Wegen bleiben. Schlecht: Feuer, Pflanzen ausreißen, laute Musik."
              - id: l2-f5
                type: multiple_choice
                text: "Warum ist der Wald für uns Menschen wichtig?"
                options: ["Bäume machen Sauerstoff zum Atmen.", "Im Wald gibt es Supermärkte.", "Im Wald regnet es nie."]
                answer: "Bäume machen Sauerstoff zum Atmen."
                hints:
                  - "Was brauchst du jede Sekunde zum Leben?"
                  - "Bäume geben etwas an die Luft ab."
                  - "Bäume machen Sauerstoff, den wir atmen."
              - id: l2-f6
                type: matching
                text: "Wer macht was im Wald? Verbinde."
                pairs:
                  - { left: { object: worm }, right: { text: "frisst Laub und macht Erde" } }
                  - { left: { object: woodpecker }, right: { text: "zimmert Höhlen in Stämme" } }
                  - { left: { object: squirrel }, right: { text: "versteckt Nüsse für den Winter" } }
                hints:
                  - "Wer wohnt in der Erde, wer klopft, wer sammelt?"
                  - "Der Specht klopft mit dem Schnabel ins Holz."
                  - "Regenwurm: Erde. Specht: Höhlen. Eichhörnchen: Nüsse."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Der Waldboden speichert Regenwasser wie ein Schwamm."
                answer: true
                hints: ["Was passiert mit dem Regen im weichen Waldboden?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie heißt die dunkle Erde, die aus Laub entsteht?"
                options: ["Humus", "Sand", "Ton"]
                answer: "Humus"
                hints: ["Das Wort fängt mit H an."]
              - id: l2-s3
                type: matching
                text: "Warum gibt es diese Waldregel? Verbinde."
                pairs:
                  - { left: { text: "Mach kein Feuer." }, right: { text: "Der Wald kann brennen." } }
                  - { left: { text: "Sei leise." }, right: { text: "Die Tiere erschrecken nicht." } }
                  - { left: { text: "Nimm deinen Müll mit." }, right: { text: "Tiere können sich daran verletzen." } }
                hints: ["Frag bei jeder Regel: Wem hilft sie?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wo wächst der größte Teil eines Pilzes?"
                show: { object: mushroom }
                options: ["unsichtbar im Boden", "oben im Hut", "in den Baumkronen"]
                answer: "unsichtbar im Boden"
                hints: ["Was wir sehen, ist nur ein kleiner Teil."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Im Wald darf man ein kleines Lagerfeuer machen, wenn kein Wind weht."
                answer: false
                feedback:
                  "true": "Im Wald ist jedes Feuer verboten, auch ein kleines. Ein Funke reicht, und der Wald brennt."
                hints: ["Was sagt Frau Kaya zu Feuer im Wald?"]
              - id: l2-s6
                type: image_multiple_choice
                text: "Welches Tier lebt bei uns im Wald?"
                options:
                  - { object: fox }
                  - { object: shark }
                  - { object: giraffe }
                answer: fox
