# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.map-symbols
skill: world.space.map-symbols
curriculum: de-DE
language: de
title:
  de: Kartenzeichen und Legende
  en: Map symbols and the key
summary: >
  A map shows a place from above, much smaller and simpler than it is, so
  it uses colours and small signs that the key (Legende) explains. The
  story: Emil and his Tante Ida plan a bike tour around the village of
  Wiesental. Lesson 1 reads the colours (blue water, green forest) and the
  signs for church, bus stop, car park and information on a first map.
  Lesson 2 rides the tour on a second map with a river and a bridge:
  a sign can appear more than once, a map leaves things out, and every map
  needs its own key. It ends with the skill check on a third map.
metadata:
  year: klasse-3
  topic: { de: Karten lesen, en: Reading maps }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [world.space.room-plan]
  also_practises: []
  vocabulary: { de: [Karte, Kartenzeichen, Legende, Fläche, Haltestelle, Parkplatz, Information, Brücke, Wirklichkeit] }
  forms: [text, audio, picture, drawn]
  drawn: [grid, colour-swatch]
  facets: []
  parts:
    - { id: colours, what: { de: die Farben einer Karte lesen, en: reading the colours of a map } }
    - { id: signs, what: { de: Kartenzeichen mit der Legende lesen, en: reading map signs with the key } }
    - { id: find, what: { de: Orte auf einer Karte finden, en: finding places on a map } }
    - { id: reality, what: { de: Karte und Wirklichkeit vergleichen, en: comparing a map with the real place } }
  misconceptions:
    - id: map-real-size
      what: Thinks a map shows things as big as they are, or that a sign looks like the real thing
      addressed: lesson 2 opens with the guess about the trees and says a map is smaller and simpler; l1-s2, l2-f2, l2-f4; l2-c16 to l2-c19 in the skill check
    - id: sign-same-everywhere
      what: Thinks a sign means the same on every map, so the key can be skipped
      addressed: the Learn screens on the key in both lessons; l1-n3, l2-s2, l2-n5; l2-c9
    - id: colour-real
      what: Thinks map colours are the real colours of the place (a green lake, a white road)
      addressed: the Learn screen on colours; l1-f1, l1-f6, l1-c2; l2-c1 and l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was heißt das P?", en: "What does the P mean?" }
    goal:
      de: "Lies die Zeichen und Farben einer Karte mit der Legende. Das P zum Beispiel heißt Parkplatz."
      en: "Read the signs and colours of a map with its key. The P, for example, means car park."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "B = Bett, S = Schrank, T = Tisch, K = Kiste. Was steht rechts oben?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
            options: ["der Schrank", "das Bett", "der Tisch"]
            answer: "der Schrank"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Ein Plan zeigt ein Zimmer von vorne."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was bedeutet das P auf der Karte?"
            say: "Emil und Tante Ida planen eine Radtour durch Wiesental. Tante Ida hat eine Karte. Unten auf der Karte steht zweimal ein P. Was glaubst du: Was bedeutet das P?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
          - text: "P heißt Parkplatz. Solche Zeichen heißen Kartenzeichen."
            say: "P heißt Parkplatz. Dort kann Tante Ida ihr Auto abstellen. Eine Karte zeigt einen ganzen Ort von oben, viel kleiner als in echt. Man kann nicht alles so malen, wie es aussieht. Darum gibt es kleine Zeichen. Sie heißen Kartenzeichen."
            show: { object: map }
          - text: "Blau ist Wasser. Grün ist Wald."
            say: "Auch Farben sind Kartenzeichen. Auf den meisten Karten ist Wasser blau, egal welche Farbe der echte See hat. Wald ist grün. Auf Tante Idas Karte ist oben links ein See und oben rechts ein Wald."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
          - text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, i Information"
            say: "Am Rand der Karte steht eine Liste. Sie heißt Legende. Die Legende erklärt jedes Zeichen. Blau heißt Wasser, grün heißt Wald. Das kleine Kreuz ist eine Kirche, H ist eine Haltestelle für den Bus, P ein Parkplatz und das kleine i eine Information für Besucher."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
          - text: "Erst die Legende lesen, dann die Karte."
            say: "Jede Karte hat ihre eigene Legende. Auf einer anderen Karte kann ein Zeichen etwas anderes bedeuten. Darum schaust du immer zuerst in die Legende."
          - text: "Wusstest du? Der älteste Globus, den es noch gibt, wurde vor mehr als 500 Jahren in Nürnberg gebaut."
            say: "Wusstest du? Der älteste Globus, den es noch gibt, wurde vor mehr als 500 Jahren in Nürnberg gebaut. Amerika fehlt darauf. Die Menschen in Europa kannten es damals noch nicht."
            show: { object: globe }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, i Information. Was ist oben links auf der Karte?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
                options: ["Wasser", "Wald", "ein Parkplatz"]
                answer: "Wasser"
                hints:
                  - "Welche Farbe hat das Feld oben links?"
                  - "Schau in die Legende: Was heißt blau?"
                  - "Blau heißt Wasser. Oben links ist ein See."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Verbinde jedes Zeichen mit seiner Bedeutung."
                option_audio: false
                pairs:
                  - { left: { text: "+" }, right: { text: "Kirche" } }
                  - { left: { text: "H" }, right: { text: "Haltestelle" } }
                  - { left: { text: "P" }, right: { text: "Parkplatz" } }
                  - { left: { text: "i" }, right: { text: "Information" } }
                hints:
                  - "Lies die Legende Zeichen für Zeichen."
                  - "P ist der Anfang von Parkplatz, H von Haltestelle."
                  - "+ Kirche, H Haltestelle, P Parkplatz, i Information."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Die Legende erklärt, was die Zeichen auf der Karte bedeuten."
                answer: true
                hints:
                  - "Wo hat Tante Ida nachgeschaut, was das Kreuz bedeutet?"
                  - "Die Legende ist die Liste am Rand der Karte."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Farbe hat der Wald auf den meisten Karten?"
                options: ["grün", "blau", "rot"]
                answer: "grün"
                hints:
                  - "Denk an Tante Idas Karte, oben rechts."
                  - "Blau ist schon das Wasser."
                  - "Wald ist grün."
              - id: l1-f5
                type: multiple_choice
                text: "Emil will mit dem Bus fahren. Welches Zeichen sucht er auf der Karte?"
                show: { object: bus }
                options: ["H", "P", "i"]
                answer: "H"
                hints:
                  - "Wo hält der Bus?"
                  - "Der Bus hält an der Haltestelle."
                  - "H heißt Haltestelle."
              - id: l1-f6
                type: sorting
                text: "Blau oder grün? Wie zeigt die Karte diese Dinge?"
                say: "Blau oder grün? Sortiere, wie die Karte diese Dinge zeigt."
                bins:
                  - { id: blue, show: { text: "blau" }, say: "blau" }
                  - { id: green, show: { text: "grün" }, say: "grün" }
                options:
                  - { text: "See", bin: blue }
                  - { text: "Tannenwald", bin: green }
                  - { text: "Fluss", bin: blue }
                  - { text: "Buchenwald", bin: green }
                  - { text: "Teich", bin: blue }
                hints:
                  - "Frag bei jedem: Ist es Wasser oder Wald?"
                  - "See, Fluss und Teich sind Wasser."
                  - "Blau: See, Fluss, Teich. Grün: Tannenwald, Buchenwald."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, i Information. Was ist in der Mitte der Karte?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
                options: ["eine Kirche", "eine Haltestelle", "ein Parkplatz"]
                answer: "eine Kirche"
                hints: ["Welches Zeichen steht in der Mitte? Such es in der Legende."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Auf einer Karte ist alles so groß wie in echt."
                answer: false
                feedback:
                  "true": "Dann wäre die Karte so groß wie das ganze Dorf! Auf der Karte ist alles viel kleiner."
                hints: ["Passt ein ganzes Dorf auf ein Blatt Papier?"]
              - id: l1-s3
                type: multiple_choice
                text: "Emil sucht die Kirche. Welches Zeichen steht in der Legende für die Kirche?"
                show: { object: church }
                options: ["+", "i", "P"]
                answer: "+"
                option_audio: false
                hints: ["Das Zeichen ist ein kleines Kreuz."]
              - id: l1-s4
                type: matching
                text: "Was bedeutet jede Farbe auf der Karte? Verbinde."
                pairs:
                  - { left: { drawn: colour-swatch, colour: blue }, right: { text: "Wasser" } }
                  - { left: { drawn: colour-swatch, colour: green }, right: { text: "Wald" } }
                hints: ["Denk an den See oben links."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Ein i auf der Karte zeigt, wo Besucher Informationen bekommen."
                answer: true
                hints: ["Schau in die Legende: Wofür steht das i?"]
              - id: l1-s6
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, i Information. Was ist oben rechts auf der Karte?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
                options: ["ein Wald", "ein See", "ein Parkplatz"]
                answer: "ein Wald"
                hints: ["Welche Farbe hat das Feld oben rechts?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, i Information. Emil steht an der Haltestelle. Was liegt rechts davon, in derselben Reihe?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
                options: ["die Information", "die Kirche", "der See"]
                answer: "die Information"
              - id: l1-n2
                type: true_false
                text: "Tante Ida sagt: „Die Haltestelle liegt unter dem See.“ Stimmt das?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Auf einer anderen Karte findet Emil ein Zeichen, das er nicht kennt. Was macht er?"
                options: ["Er schaut in die Legende.", "Er rät einfach.", "Er dreht die Karte um und schüttelt sie."]
                answer: "Er schaut in die Legende."
                feedback:
                  "Er dreht die Karte um und schüttelt sie.": "Da fällt nur die Brezel aus Emils Rucksack heraus. Die Erklärung steht in der Legende."
              - id: l1-n4
                type: fill_in_blank
                text: "Emil erklärt seiner Freundin die Karte."
                say: "Emil erklärt seiner Freundin die Karte. Setz das passende Wort ein."
                frame: "Die Liste, die alle Zeichen erklärt, heißt _."
                options: ["Legende", "Kompass", "Lineal"]
                answer: ["Legende"]
              - id: l1-n5
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, i Information. Wie viele Parkplätze zeigt die Karte?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [1, 0, blue], [0, 1, blue], [4, 0, green], [5, 0, green], [4, 1, green], [5, 1, green]], labels: [[2, 2, "+"], [1, 3, "H"], [4, 3, "i"], [3, 4, "P"], [5, 4, "P"]] }
                options: ["1", "2", "3"]
                answer: "2"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was erklärt die Legende einer Karte?"
            options: ["was die Zeichen bedeuten", "wie das Wetter wird", "wie spät es ist"]
            answer: "was die Zeichen bedeuten"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Auf den meisten Karten ist Wasser grün."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Welches Zeichen steht in Tante Idas Legende für die Information?"
            options: ["i", "H", "P"]
            answer: "i"
          - id: l1-c4
            type: matching
            text: "Verbinde jedes Zeichen mit seiner Bedeutung."
            option_audio: false
            pairs:
              - { left: { text: "P" }, right: { text: "Parkplatz" } }
              - { left: { text: "+" }, right: { text: "Kirche" } }
              - { left: { text: "H" }, right: { text: "Haltestelle" } }
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Kartenzeichen sind kleine Zeichen für echte Dinge."
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Was zeigt eine grüne Fläche auf Tante Idas Karte?"
            options: ["einen Wald", "einen See", "eine Kirche"]
            answer: "einen Wald"

  - n: 2
    title: { de: "Radtour mit der Karte", en: "A bike tour with the map" }
    goal:
      de: "Finde Orte auf einer Karte mit Hilfe der Legende. Über den Fluss kommst du an der Brücke."
      en: "Find places on a map with the help of the key. You cross the river at the bridge."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was bedeutet ein P auf Tante Idas Karte?"
            options: ["Parkplatz", "Post", "Polizei"]
            answer: "Parkplatz"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Auf den meisten Karten ist der Wald blau."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Ist auf der Karte jeder Baum vom Wald gemalt?"
            say: "Heute fahren Emil und Tante Ida los. Sie haben eine neue Karte für die Radtour. Links ist ein Wald. Was glaubst du: Ist auf der Karte jeder einzelne Baum gemalt?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [3, 0, blue], [3, 1, blue], [3, 2, blue], [3, 3, blue], [3, 4, blue]], labels: [[3, 2, "B"], [1, 3, "+"], [5, 0, "H"], [0, 4, "H"], [5, 3, "S"], [4, 4, "P"]] }
          - text: "Nein! Eine Karte ist kleiner und einfacher als die Wirklichkeit."
            say: "Nein. Der ganze Wald ist nur eine grüne Fläche. Eine Karte zeigt die Wirklichkeit viel kleiner und viel einfacher. Sie lässt vieles weg, zum Beispiel einzelne Bäume, Autos und Menschen. Sonst wäre sie zu voll, und niemand könnte sie lesen."
          - text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, B Brücke, S Schwimmbad"
            say: "Das ist die Legende der neuen Karte. Der Fluss ist ein langes blaues Band. Über den Fluss führt eine Brücke, das ist das B. S ist ein Schwimmbad. Die Zeichen für Kirche, Haltestelle und Parkplatz kennst du schon."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [3, 0, blue], [3, 1, blue], [3, 2, blue], [3, 3, blue], [3, 4, blue]], labels: [[3, 2, "B"], [1, 3, "+"], [5, 0, "H"], [0, 4, "H"], [5, 3, "S"], [4, 4, "P"]] }
          - text: "Ein Zeichen kann mehrmals auf der Karte sein."
            say: "Schau genau hin. Das H steht zweimal auf der Karte, oben rechts und unten links. Es gibt also zwei Haltestellen. Jedes Zeichen steht für ein echtes Ding an genau dieser Stelle."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [3, 0, blue], [3, 1, blue], [3, 2, blue], [3, 3, blue], [3, 4, blue]], labels: [[3, 2, "B"], [1, 3, "+"], [5, 0, "H"], [0, 4, "H"], [5, 3, "S"], [4, 4, "P"]] }
          - text: "Auf einer anderen Karte kann B etwas anderes heißen."
            say: "Auf dieser Karte heißt B Brücke. Auf einer anderen Karte kann B für einen Bäcker oder einen Bahnhof stehen. Darum schaust du bei jeder neuen Karte zuerst in ihre Legende."
          - text: "Wusstest du? Das Wort Legende kommt aus dem Lateinischen."
            say: "Wusstest du? Das Wort Legende kommt aus der alten Sprache Latein. Es heißt: das, was gelesen werden soll. Das passt, denn die Legende liest du immer zuerst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, B Brücke, S Schwimmbad. Was ist das B auf dieser Karte?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [3, 0, blue], [3, 1, blue], [3, 2, blue], [3, 3, blue], [3, 4, blue]], labels: [[3, 2, "B"], [1, 3, "+"], [5, 0, "H"], [0, 4, "H"], [5, 3, "S"], [4, 4, "P"]] }
                options: ["eine Brücke", "ein Bäcker", "ein Bahnhof"]
                answer: "eine Brücke"
                hints:
                  - "Auf jeder Karte kann B etwas anderes heißen. Wo steht es?"
                  - "Schau in die Legende dieser Karte."
                  - "Hier heißt B Brücke."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Auf einer Karte ist jeder einzelne Baum gemalt."
                answer: false
                hints:
                  - "Wie sieht der Wald auf der Karte aus?"
                  - "Der Wald ist eine grüne Fläche."
                  - "Eine Karte lässt einzelne Bäume weg. Das stimmt also nicht."
              - id: l2-f3
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, B Brücke, S Schwimmbad. Wie viele Haltestellen zeigt die Karte?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [3, 0, blue], [3, 1, blue], [3, 2, blue], [3, 3, blue], [3, 4, blue]], labels: [[3, 2, "B"], [1, 3, "+"], [5, 0, "H"], [0, 4, "H"], [5, 3, "S"], [4, 4, "P"]] }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Welches Zeichen steht für die Haltestelle?"
                  - "Such jedes H auf der Karte."
                  - "Ein H steht oben rechts, eins unten links: zwei."
              - id: l2-f4
                type: matching
                text: "Wie zeigt die Karte diese echten Dinge? Verbinde."
                pairs:
                  - { left: { object: river }, right: { text: "ein langes blaues Band" } }
                  - { left: { object: forest }, right: { text: "eine grüne Fläche" } }
                  - { left: { object: church }, right: { text: "ein kleines Kreuz" } }
                hints:
                  - "Denk an die Farben und an die Legende."
                  - "Wasser ist blau, Wald ist grün."
                  - "Fluss: blaues Band. Wald: grüne Fläche. Kirche: kleines Kreuz."
              - id: l2-f5
                type: multiple_choice
                text: "Legende: blau Wasser, grün Wald, + Kirche, H Haltestelle, P Parkplatz, B Brücke, S Schwimmbad. Emil will mit dem Rad über den Fluss. Wo kommt er hinüber?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, green], [1, 0, green], [0, 1, green], [1, 1, green], [3, 0, blue], [3, 1, blue], [3, 2, blue], [3, 3, blue], [3, 4, blue]], labels: [[3, 2, "B"], [1, 3, "+"], [5, 0, "H"], [0, 4, "H"], [5, 3, "S"], [4, 4, "P"]] }
                options: ["an der Brücke", "am Parkplatz", "an der Kirche"]
                answer: "an der Brücke"
                hints:
                  - "Mit dem Rad kann Emil nicht durchs Wasser fahren."
                  - "Was führt über einen Fluss?"
