# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.heart-lungs
skill: world.body.heart-lungs
curriculum: de-DE
language: de
title:
  de: Herz und Lunge
  en: Heart and lungs
summary: >
  The heart is a muscle in the chest, almost in the middle and a little to
  the left, protected by the ribs. Each time it squeezes it pumps blood
  through the blood vessels (Adern) into the whole body; the blood brings
  oxygen and nutrients everywhere and always comes back to the heart, so
  it is a Kreislauf. The pulse can be felt at the wrist. Air goes in
  through the nose or mouth and the windpipe into the lungs (two
  Lungenflügel); there oxygen goes into the blood, and used air is
  breathed out; the chest widens when breathing in, helped by the
  Zwerchfell. When running, the muscles need more oxygen, so breathing and
  heartbeat get faster. The story: Mila and Can play football. Lesson 1 is
  the heart and the blood; lesson 2 the lungs, heart and lungs working
  together, and ends with the skill check. No body pictures: the organs
  are named in text cards.
metadata:
  year: klasse-3
  topic: { de: Im Inneren des Körpers, en: Inside the body }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.body.body-parts, world.body.exercise-rest]
  also_practises: []
  vocabulary: { de: [Herz, Herzschlag, Blut, Adern, Blutkreislauf, Puls, Sauerstoff, Lunge, Lungenflügel, Luftröhre, einatmen, ausatmen, verbrauchte Luft, Zwerchfell] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: heart, what: { de: "sagen, wo das Herz liegt und wie es pumpt", en: saying where the heart is and how it pumps } }
    - { id: blood, what: { de: "erklären, wie das Blut im Kreislauf fließt und was es bringt", en: explaining how blood flows round and what it carries } }
    - { id: lungs, what: { de: "den Weg der Luft und das Atmen beschreiben", en: describing the path of air and breathing } }
    - { id: together, what: { de: "erklären, wie Herz und Lunge bei Bewegung zusammenarbeiten", en: explaining how heart and lungs work together during exercise } }
  misconceptions:
    - id: heart-in-belly
      what: Thinks the heart sits far to the left or in the belly
      addressed: lesson 1 Learn screen on where the heart lies; l1-s2, l1-c2, l2-c1
    - id: blood-used-up
      what: Thinks blood flows out into the body once and is used up there
      addressed: lesson 1 Learn screen on the Kreislauf; l1-f6, l1-s5, l2-c7, l2-c9
    - id: air-to-belly
      what: Thinks the air we breathe goes into the belly or the stomach
      addressed: lesson 2 opens with the guess and follows the air into the lungs; l2-f1, l2-f3, l2-c11
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Das Herz pumpt", en: "The heart pumps" }
    goal:
      de: "Finde heraus, wie dein Herz das Blut durch den Körper pumpt und wo du deinen Puls fühlen kannst."
      en: "Find out how your heart pumps blood around your body and where you can feel your pulse."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Stimmt das? Nach dem Rennen atmest du schneller als vorher."
            answer: true
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Durch welchen Körperteil kannst du atmen?"
            options:
              - { object: nose }
              - { object: ear }
              - { object: foot }
            answer: nose
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was klopft da in deiner Brust?"
            say: "Mila hat beim Fußball ein Tor geschossen. Sie legt die Hand auf die Brust und spürt ein Klopfen. Ihr Freund Can fragt: Was klopft denn da? Was glaubst du?"
            show: { object: play-football }
          - text: "Das ist dein Herz. Es ist ein Muskel."
            say: "Das Klopfen ist dein Herz. Es liegt in der Brust, fast in der Mitte und etwas nach links. Die Rippen schützen es. Das Herz ist ein Muskel. Es zieht sich immer wieder zusammen und pumpt so das Blut in den Körper. Jedes Zusammenziehen ist ein Herzschlag."
          - text: "Das Blut fließt in Adern durch den ganzen Körper."
            say: "Das Blut fließt durch Röhren, die Adern heißen. Sie gehen bis in die Zehen und in jeden Finger. Das Blut bringt Sauerstoff aus der Luft und Nährstoffe aus dem Essen zu allen Teilen des Körpers."
          - text: "Ein Kreislauf: Das Blut kommt immer zum Herzen zurück."
            say: "Das Blut fließt nicht einfach weg. Es kommt immer wieder zum Herzen zurück und wird wieder losgeschickt. Darum heißt das Blutkreislauf. Auf seinem Weg fließt das Blut auch durch die Lunge und holt dort frischen Sauerstoff."
          - text: "Den Puls kannst du fühlen."
            say: "Jeder Herzschlag drückt das Blut durch die Adern. Das kannst du fühlen. Leg zwei Finger innen an dein Handgelenk, unter den Daumen. Das Pochen dort heißt Puls. Zählst du die Schläge in einer Minute, weißt du, wie schnell dein Herz schlägt."
            show: { object: hand }
          - text: "Beim Rennen schlägt das Herz schneller."
            say: "Beim Fußball brauchen Milas Muskeln mehr Sauerstoff. Darum pumpt ihr Herz schneller, und ihr Puls steigt. In der Pause wird er wieder langsamer."
          - text: "Wusstest du? Das Herz eines Kindes schlägt schneller als das Herz eines Erwachsenen."
            say: "Wusstest du? Das Herz eines Kindes schlägt schneller als das Herz eines Erwachsenen. Bei einem Baby schlägt es sogar noch schneller."
            show: { object: baby }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was macht das Herz?"
                options: ["Es pumpt Blut durch den Körper.", "Es kaut das Essen.", "Es macht die Luft sauber."]
                answer: "Es pumpt Blut durch den Körper."
                hints:
                  - "Das Herz ist ein Muskel, der sich zusammenzieht."
                  - "Was wird bei jedem Herzschlag durch die Adern gedrückt?"
                  - "Das Herz pumpt das Blut."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Das Herz ist ein Muskel."
                answer: true
                hints:
                  - "Was muss das Herz bei jedem Schlag tun?"
                  - "Es zieht sich zusammen, wie ein Muskel am Arm."
                  - "Ja, das Herz ist ein Muskel."
                difficulty: easy
              - id: l1-f3
                type: matching
                text: "Was ist was? Verbinde."
                pairs:
                  - { left: { text: "Herz" }, right: { text: "pumpt das Blut" } }
                  - { left: { text: "Adern" }, right: { text: "Röhren für das Blut" } }
                  - { left: { text: "Puls" }, right: { text: "das Pochen am Handgelenk" } }
                hints:
                  - "Fang mit dem Herz an."
                  - "Das Blut fließt durch Röhren. Wie heißen sie?"
                  - "Herz: pumpt. Adern: Röhren. Puls: Pochen am Handgelenk."
              - id: l1-f4
                type: multiple_choice
                text: "Was bringt das Blut zu allen Teilen des Körpers?"
                options: ["Sauerstoff und Nährstoffe", "Haare und Nägel", "Knochen und Zähne"]
                answer: "Sauerstoff und Nährstoffe"
                feedback:
                  "Haare und Nägel": "Haare im Blut? Zum Glück nicht! Das Blut bringt Sauerstoff und Nährstoffe."
                hints:
                  - "Was braucht dein Körper aus der Luft und aus dem Essen?"
                  - "Aus der Luft kommt der Sauerstoff, aus dem Essen die Nährstoffe."
                  - "Das Blut bringt Sauerstoff und Nährstoffe."
              - id: l1-f5
                type: sorting
                text: "Schlägt dein Herz dabei eher schnell oder eher langsam?"
                say: "Schlägt dein Herz dabei eher schnell oder eher langsam? Sortiere."
                bins:
                  - { id: fast, show: { text: "eher schnell" }, say: "eher schnell" }
                  - { id: slow, show: { text: "eher langsam" }, say: "eher langsam" }
                options:
                  - { text: "Fußball spielen", bin: fast }
                  - { text: "ein Buch lesen", bin: slow }
                  - { text: "die Treppe hochrennen", bin: fast }
                  - { text: "schlafen", bin: slow }
                  - { text: "um die Wette schwimmen", bin: fast }
                  - { text: "ruhig sitzen", bin: slow }
                hints:
                  - "Wann brauchen deine Muskeln viel Sauerstoff?"
                  - "Wenn du dich viel bewegst, muss das Herz schneller pumpen."
                  - "Schnell: Fußball, Treppe, Wettschwimmen. Langsam: lesen, schlafen, sitzen."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Das Blut fließt einmal durch den Körper und ist dann verbraucht."
                answer: false
                feedback:
                  "true": "Das Blut kommt immer wieder zum Herzen zurück. Darum heißt es Blutkreislauf."
                hints:
                  - "Warum heißt es Blutkreislauf?"
                  - "Ein Kreis hat kein Ende."
                  - "Das Blut kommt immer wieder zum Herzen zurück."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Bei welchem Bild schlägt das Herz am schnellsten?"
                options:
                  - { object: play-football }
                  - { object: read }
                  - { object: paint }
                answer: play-football
                hints: ["Bei welchem Bild bewegt sich das Kind am meisten?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wo liegt dein Herz?"
                options: ["in der Brust, fast in der Mitte", "im Bauch neben dem Magen", "im Kopf"]
                answer: "in der Brust, fast in der Mitte"
                hints: ["Wo hat Mila das Klopfen gespürt?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Den Puls kannst du am Handgelenk fühlen."
                answer: true
                hints: ["Wo legst du zwei Finger hin, um den Puls zu fühlen?"]
              - id: l1-s4
                type: ordering
                text: "Was passiert beim Fußball nacheinander?"
                say: "Was passiert beim Fußball nacheinander? Leg die Karten in die richtige Reihenfolge."
                options: ["Das Herz schlägt schneller.", "Mila rennt los.", "Die Muskeln brauchen mehr Sauerstoff."]
                slot_count: 3
                answer: ["Mila rennt los.", "Die Muskeln brauchen mehr Sauerstoff.", "Das Herz schlägt schneller."]
                hints: ["Warum muss das Herz schneller schlagen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Warum heißt es Blutkreislauf?"
                options: ["Weil das Blut immer wieder zum Herzen zurückkommt.", "Weil das Herz rund ist.", "Weil das Blut im Kreis um den Bauch fließt."]
                answer: "Weil das Blut immer wieder zum Herzen zurückkommt."
                hints: ["Wohin fließt das Blut am Ende immer?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Ein Kinderherz schlägt langsamer als das Herz eines Erwachsenen."
                answer: false
                feedback:
                  "true": "Es ist umgekehrt: Ein Kinderherz schlägt schneller."
                hints: ["Ein kleineres Herz muss öfter schlagen."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Can setzt sich nach dem Spiel auf die Bank und ruht sich aus. Was passiert mit seinem Puls?"
                options: ["Er wird langsamer.", "Er wird immer schneller.", "Er hört ganz auf."]
                answer: "Er wird langsamer."
              - id: l1-n2
                type: true_false
                text: "Mila sagt: „Das Blut fließt in Adern bis in meine Zehen.“ Stimmt das?"
                say: "Mila sagt: Das Blut fließt in Adern bis in meine Zehen. Stimmt das?"
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Mila erklärt Can, was sie gelernt hat."
                say: "Mila erklärt Can, was sie gelernt hat. Setz die passenden Wörter ein."
                frame: "Das _ pumpt das Blut. Das Blut fließt durch die _. Am Handgelenk fühle ich den _."
                options: ["Herz", "Adern", "Puls", "Magen"]
                answer: ["Herz", "Adern", "Puls"]
              - id: l1-n4
                type: multiple_choice
                text: "Vor dem Spiel zählt Mila 80 Herzschläge in einer Minute, nach dem Rennen 120. Warum?"
                options: ["Ihre Muskeln brauchen mehr Sauerstoff.", "Ihr Herz ist kaputt.", "Sie hat sich verzählt."]
                answer: "Ihre Muskeln brauchen mehr Sauerstoff."
              - id: l1-n5
                type: matching
                text: "Can fragt nach. Verbinde."
                pairs:
                  - { left: { text: "Sauerstoff" }, right: { text: "kommt aus der Luft" } }
                  - { left: { text: "Nährstoffe" }, right: { text: "kommen aus dem Essen" } }
                  - { left: { text: "Herzschlag" }, right: { text: "Das Herz zieht sich einmal zusammen." } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißen die Röhren, durch die das Blut fließt?"
            options: ["Adern", "Sehnen", "Rippen"]
            answer: "Adern"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Das Herz liegt im Bauch."
            answer: false
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Beim Rennen schlägt dein Herz schneller."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Was fühlst du innen am Handgelenk?"
            options: ["den Puls", "den Magen", "die Lunge"]
            answer: "den Puls"
          - id: l1-c5
            type: multiple_choice
            text: "Was ist das Herz?"
            options: ["ein Muskel", "ein Knochen", "ein Gelenk"]
            answer: "ein Muskel"
          - id: l1-c6
            type: image_multiple_choice
            text: "Bei welchem Bild schlägt das Herz eher langsam?"
            options:
              - { object: read }
              - { object: play-football }
              - { object: jump }
            answer: read

  - n: 2
    title: { de: "Atmen mit der Lunge", en: "Breathing with the lungs" }
    goal:
      de: "Verfolge den Weg der Luft durch die Nase bis in die Lunge und finde heraus, wie Herz und Lunge zusammenarbeiten."
      en: "Follow the air through the nose into the lungs and find out how the heart and lungs work together."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was pumpt das Blut durch den Körper?"
            options: ["das Herz", "der Magen", "die Zähne"]
            answer: "das Herz"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Das Blut kommt immer wieder zum Herzen zurück."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wohin geht die Luft, wenn du einatmest?"
            say: "Nach dem Spiel ist Mila ganz außer Atem. Can fragt: Wo geht die Luft eigentlich hin, wenn du so tief einatmest? In den Bauch? Was glaubst du?"
          - text: "In die Lunge!"
            say: "Die Luft geht nicht in den Bauch, sondern in die Lunge. Du atmest durch die Nase oder den Mund ein. Dann strömt die Luft durch die Luftröhre in die Lunge. Die Lunge hat zwei Teile, den linken und den rechten Lungenflügel. Sie liegen in der Brust, und die Rippen schützen sie."
          - text: "Die Nase macht die Luft sauber und warm."
            say: "Atme am besten durch die Nase. Die Härchen und der Schleim in der Nase fangen Staub auf. Und die Luft wird auf ihrem Weg angewärmt."
            show: { object: nose }
          - text: "Einatmen: Sauerstoff ins Blut. Ausatmen: verbrauchte Luft hinaus."
            say: "In der Lunge geht der Sauerstoff aus der Luft ins Blut. Das Herz pumpt das Blut dann in den ganzen Körper. Der Körper braucht den Sauerstoff, damit er Kraft hat. Dabei entsteht verbrauchte Luft. Das Blut bringt sie zurück in die Lunge, und du atmest sie aus."
          - text: "Beim Einatmen wird die Brust weiter."
            say: "Leg die Hände auf deine Rippen und atme tief ein. Spürst du, wie die Brust weiter wird? Unter der Lunge liegt ein flacher Muskel, das Zwerchfell. Es hilft beim Atmen. Beim Ausatmen wird die Brust wieder schmaler."
          - text: "Herz und Lunge arbeiten zusammen."
            say: "Beim Rennen brauchen die Muskeln mehr Sauerstoff. Darum atmest du schneller und tiefer, und dein Herz schlägt schneller. So kommt mehr Sauerstoff ins Blut und schneller zu den Muskeln. Viel Bewegung macht Herz und Lunge stark. Rauch dagegen schadet der Lunge."
            show: { object: ride-bike }
          - text: "Wusstest du? Dein linker Lungenflügel ist etwas kleiner als der rechte."
            say: "Wusstest du? Dein linker Lungenflügel ist etwas kleiner als der rechte. Er lässt dem Herzen Platz."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wohin kommt die Luft, wenn du einatmest?"
                options: ["in die Lunge", "in den Magen", "in die Beine"]
                answer: "in die Lunge"
                feedback:
                  "in die Beine": "Dann hättest du ja Luftballons in den Beinen! Die Luft geht in die Lunge."
                hints:
                  - "Die Luft geht durch die Luftröhre."
                  - "Wo liegt etwas mit zwei Flügeln in der Brust?"
                  - "Die Luft geht in die Lunge."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Die Luft kommt durch die Luftröhre in die Lunge."
                answer: true
                hints:
                  - "Hör auf das Wort Luftröhre."
                  - "Durch die Speiseröhre geht das Essen, durch die Luftröhre die Luft."
                  - "Ja, die Luft kommt durch die Luftröhre."
                difficulty: easy
              - id: l2-f3
                type: ordering
                text: "Welchen Weg nimmt die Luft? Ordne."
                say: "Welchen Weg nimmt die Luft? Leg die Karten in die richtige Reihenfolge."
                options: ["Lunge", "Nase", "Luftröhre"]
                slot_count: 3
                answer: ["Nase", "Luftröhre", "Lunge"]
                hints:
                  - "Wo kommt die Luft zuerst hinein?"
                  - "Von der Nase führt eine Röhre nach unten."
                  - "Nase, Luftröhre, Lunge."
              - id: l2-f4
                type: multiple_choice
                text: "Was geht in der Lunge aus der Luft ins Blut?"
                options: ["der Sauerstoff", "das Essen", "die Spucke"]
                answer: "der Sauerstoff"
                hints:
                  - "Was brauchen deine Muskeln aus der Luft?"
                  - "Das Blut holt in der Lunge etwas Frisches."
                  - "Der Sauerstoff geht ins Blut."
              - id: l2-f5
                type: matching
                text: "Was passiert dabei? Verbinde."
                pairs:
                  - { left: { text: "einatmen" }, right: { text: "frische Luft strömt in die Lunge" } }
                  - { left: { text: "ausatmen" }, right: { text: "verbrauchte Luft geht hinaus" } }
                  - { left: { text: "Zwerchfell" }, right: { text: "ein Muskel, der beim Atmen hilft" } }
                hints:
                  - "Ein heißt hinein, aus heißt hinaus."
                  - "Das Zwerchfell liegt unter der Lunge."
                  - "Einatmen: frische Luft hinein. Ausatmen: verbrauchte Luft hinaus. Zwerchfell: Muskel."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Beim Einatmen wird die Brust schmaler."
                answer: false
                feedback:
                  "true": "Beim Einatmen strömt Luft in die Lunge. Darum wird die Brust weiter."
                hints:
                  - "Leg die Hände auf die Rippen und atme tief ein."
                  - "Wenn Luft hineinkommt, braucht sie Platz."
                  - "Beim Einatmen wird die Brust weiter."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum ist es gut, durch die Nase zu atmen?"
                options: ["Die Nase macht die Luft sauber und warm.", "Die Nase macht die Luft süß.", "Durch die Nase passt mehr Essen hinein."]
                answer: "Die Nase macht die Luft sauber und warm."
                hints: ["Was fangen die Härchen in der Nase auf?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Die Lunge hat zwei Lungenflügel."
                answer: true
                hints: ["Denk an links und rechts in deiner Brust."]
              - id: l2-s3
                type: sorting
                text: "Gut für Herz und Lunge oder nicht?"
                say: "Ist das gut für Herz und Lunge oder nicht? Sortiere."
                bins:
                  - { id: good, show: { text: "gut" }, say: "gut" }
                  - { id: bad, show: { text: "nicht gut" }, say: "nicht gut" }
                options:
                  - { text: "Fahrrad fahren", bin: good }
                  - { text: "Rauch einatmen", bin: bad }
                  - { text: "schwimmen", bin: good }
                  - { text: "den ganzen Tag sitzen", bin: bad }
                  - { text: "draußen toben", bin: good }
                hints: ["Bewegung macht Herz und Lunge stark."]
              - id: l2-s4
                type: multiple_choice
                text: "Warum atmest du beim Rennen schneller?"
                options: ["Die Muskeln brauchen mehr Sauerstoff.", "Die Lunge ist zu klein.", "Du hast Hunger."]
                answer: "Die Muskeln brauchen mehr Sauerstoff."
                hints: ["Was holt die Lunge aus der Luft, und wer braucht es beim Rennen?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "Welcher Körperteil macht die Luft beim Einatmen sauber?"
                options:
                  - { object: nose }
                  - { object: ear }
                  - { object: hand }
                answer: nose
                hints: ["Wo sitzen die Härchen, die den Staub auffangen?"]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? Die Rippen schützen die Lunge."
                answer: true
                hints: ["Wo liegt die Lunge, und was ist wie ein Käfig um sie herum?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mila ist nach dem Rennen außer Atem. Was passiert gerade in ihrem Körper?"
                options: ["Sie atmet schnell, und ihr Herz schlägt schnell.", "Ihr Herz bleibt kurz stehen.", "Sie atmet gar nicht mehr."]
                answer: "Sie atmet schnell, und ihr Herz schlägt schnell."
              - id: l2-n2
                type: true_false
                text: "Can sagt: „Beim Ausatmen gebe ich verbrauchte Luft ab.“ Stimmt das?"
                say: "Can sagt: Beim Ausatmen gebe ich verbrauchte Luft ab. Stimmt das?"
                answer: true
              - id: l2-n3
                type: ordering
                text: "Wie kommt der Sauerstoff zu Milas Muskeln? Ordne."
                say: "Wie kommt der Sauerstoff zu Milas Muskeln? Leg die Karten in die richtige Reihenfolge."
                options: ["Das Herz pumpt das Blut zu den Muskeln.", "Mila atmet ein.", "Der Sauerstoff geht in der Lunge ins Blut."]
                slot_count: 3
                answer: ["Mila atmet ein.", "Der Sauerstoff geht in der Lunge ins Blut.", "Das Herz pumpt das Blut zu den Muskeln."]
              - id: l2-n4
