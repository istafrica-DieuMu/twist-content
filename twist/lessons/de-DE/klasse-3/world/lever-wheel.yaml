# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.lever-wheel
skill: world.technology.lever-wheel
curriculum: de-DE
language: de
title:
  de: Hebel, Rolle und Rad
  en: Levers, pulleys and wheels
summary: >
  Lever, pulley and wheel let us move heavy things with less effort. The
  story: Emil helps his aunt Ayla make a garden and build a tree house.
  Lesson 1 is the lever: a bar that turns about a pivot (Drehpunkt), where
  pushing far from the pivot takes little force but a longer push; the
  seesaw (the heavier person sits nearer the middle), scissors, nutcracker,
  door and the forearm. Lesson 2 adds the fixed pulley (it changes the
  direction of the pull), the block and tackle (half the force, twice the
  rope), the wheel on its axle (rolling instead of rubbing) and the
  wheelbarrow as lever and wheel together, and ends with the skill check.
  Trying levers and pulleys with real material stays in class; Twist
  teaches the idea and the prediction.
metadata:
  year: klasse-3
  topic: { de: Wie Technik funktioniert, en: How things work }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.technology.tools-household]
  also_practises: []
  vocabulary: { de: [Hebel, Drehpunkt, Last, Kraft, Wippe, Nussknacker, Türangeln, Rolle, Flaschenzug, Rad, Achse, Schubkarre, Bollerwagen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: lever, what: { de: "den Hebel mit Drehpunkt erklären und sagen, wo man am leichtesten drückt", en: "explaining the lever and its pivot and saying where pushing is easiest" } }
    - { id: pulley, what: { de: "sagen, was eine feste Rolle und ein Flaschenzug tun", en: "saying what a fixed pulley and a block and tackle do" } }
    - { id: wheel, what: { de: "erklären, warum Räder Kraft sparen", en: "explaining why wheels save effort" } }
    - { id: spot, what: { de: "Hebel, Rolle und Rad in Dingen aus dem Alltag finden", en: "finding levers, pulleys and wheels in everyday things" } }
  misconceptions:
    - id: push-near-pivot
      what: Thinks it does not matter where you push on a lever, or that pushing near the pivot is easier
      addressed: lesson 1 opens with the guess about where Emil pushes the bar; l1-f2, l1-s3, l1-n3, l1-n5, l1-c3 and the check tasks l2-c1, l2-c2 and l2-c5
    - id: heavier-sits-far
      what: Thinks the heavier person on a seesaw also sits right at the end
      addressed: the seesaw screen in lesson 1; l1-f4, l1-s4, l1-n4, l1-c4, l2-c3
    - id: machine-makes-lighter
      what: Thinks a lever or pulley makes the load itself lighter, or saves effort for nothing
      addressed: the lever screen in lesson 1 (a longer push) and the block and tackle screen in lesson 2 (more rope); l1-s2, l1-s6, l2-f5, l2-s3, l2-s5, l2-c6, l2-c9
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Der Hebel", en: "The lever" }
    goal:
      de: "Finde heraus, wie ein Hebel Kraft spart. Wer weit weg vom Drehpunkt drückt, braucht nur wenig Kraft."
      en: "Find out how a lever saves effort. If you push far from the pivot, you need only a little force."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was macht man mit einer Säge?"
            show: { object: saw }
            options: ["Holz sägen", "Suppe essen", "Blumen gießen"]
            answer: "Holz sägen"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welches Gerät braucht Strom?"
            options:
              - { object: kettle }
              - { object: scissors }
              - { object: bucket }
            answer: kettle
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wo drückt Emil am leichtesten?"
            say: "Emil hilft Tante Ayla, einen Garten anzulegen. Mitten im Beet liegt ein großer Stein. Emil schiebt mit den Händen, aber der Stein rührt sich nicht. Tante Ayla schiebt eine lange Stange unter den Stein und legt einen Holzklotz darunter, nah am Stein. Was glaubst du: Wo drückt Emil am leichtesten auf die Stange? Nah am Klotz oder ganz am Ende?"
            show: { object: stone }
          - text: "Ganz am Ende! Dort braucht Emil wenig Kraft."
            say: "Ganz am Ende! Die Stange liegt auf dem Klotz und dreht sich an dieser Stelle. Diese Stelle heißt Drehpunkt. Drückt Emil weit weg vom Drehpunkt, hebt sich der Stein mit wenig Kraft. Drückt er nah am Drehpunkt, bewegt sich der Stein kaum."
            show: { object: stone }
          - text: "Ein Hebel: eine Stange, ein Drehpunkt und eine Last"
            say: "Eine feste Stange, die sich um einen Drehpunkt dreht, heißt Hebel. Das Schwere, das du bewegen willst, heißt Last. Je weiter weg vom Drehpunkt du drückst, desto weniger Kraft brauchst du. Aber nichts ist geschenkt: Dein Ende der Stange musst du dafür ein langes Stück hinunterdrücken, und der Stein hebt sich nur ein kleines Stück. Der Stein selbst wird nicht leichter."
          - text: "Auf der Wippe sitzt der Schwerere näher an der Mitte."
            say: "Auf dem Spielplatz setzt sich Emil auf die Wippe, Tante Ayla auf die andere Seite. Auch die Wippe ist ein Hebel. Ihr Drehpunkt ist das Gestell in der Mitte. Tante Ayla ist viel schwerer als Emil, und ihre Seite geht sofort nach unten. Damit die Wippe gerade wird, rutscht sie nah an die Mitte. Der Schwerere sitzt näher am Drehpunkt, der Leichtere weiter außen."
          - text: "Hebel im Alltag: Schere, Nussknacker, Tür"
            say: "Hebel findest du überall. Die Schere besteht aus zwei Hebeln. Ihr Drehpunkt ist die Schraube in der Mitte. Auch der Nussknacker ist ein Hebel, sein Drehpunkt ist das Gelenk. Und eine Tür dreht sich an den Türangeln. Darum sitzt die Klinke weit weg von den Angeln: So geht die Tür leicht auf."
            show: { object: scissors }
          - text: "Dicke Pappe: nah an der Schraube schneiden"
            say: "Tante Ayla schneidet ein Schild aus dicker Pappe. Sie schiebt die Pappe ganz nach hinten, nah an die Schraube der Schere. So geht es leichter, denn die Pappe ist nah am Drehpunkt und ihre Hände sind weit weg davon."
            show: { object: scissors }
          - text: "Wusstest du? Dein Unterarm ist auch ein Hebel."
            say: "Wusstest du? Dein Unterarm ist auch ein Hebel. Sein Drehpunkt ist der Ellenbogen. Wenn du etwas anhebst, zieht ein Muskel im Oberarm den Unterarm nach oben."
            show: { object: arm }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt die Stelle, an der sich ein Hebel dreht?"
                options: ["der Drehpunkt", "die Last", "der Griff"]
                answer: "der Drehpunkt"
                hints:
                  - "An dieser Stelle dreht sich die Stange."
                  - "Die Last ist das Schwere, das du bewegen willst."
                  - "Die Stelle heißt Drehpunkt."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Mit einer langen Stange will Emil eine schwere Kiste anheben. Der Klotz liegt nah an der Kiste. Wo drückt er am leichtesten?"
                options: ["ganz am Ende der Stange", "nah am Klotz", "direkt auf die Kiste"]
                answer: "ganz am Ende der Stange"
                feedback:
                  "nah am Klotz": "Nah am Klotz ist nah am Drehpunkt. Dort brauchst du sehr viel Kraft."
                  "direkt auf die Kiste": "Dann drückt er die Kiste nach unten statt nach oben!"
                hints:
                  - "Der Klotz ist der Drehpunkt."
                  - "Je weiter weg vom Drehpunkt, desto weniger Kraft."
                  - "Am Ende der Stange ist Emil am weitesten vom Klotz weg."
              - id: l1-f3
                type: sorting
                text: "Hebel oder kein Hebel?"
                say: "Sortiere. Welche Dinge sind Hebel, welche nicht?"
                bins:
                  - { id: lever, show: { text: "Hebel" }, say: "Hebel" }
                  - { id: none, show: { text: "kein Hebel" }, say: "kein Hebel" }
                options:
                  - { object: scissors, bin: lever }
                  - { object: ball, bin: none }
                  - { text: "Wippe", bin: lever }
                  - { object: candle, bin: none }
                  - { text: "Nussknacker", bin: lever }
                  - { object: sock, bin: none }
                hints:
                  - "Ein Hebel ist eine feste Stange mit einem Drehpunkt."
                  - "Die Schere dreht sich um ihre Schraube, die Wippe um ihr Gestell."
                  - "Hebel: Schere, Wippe, Nussknacker. Kein Hebel: Ball, Kerze, Socke."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Auf der Wippe sitzt der Schwerere näher an der Mitte."
                answer: true
                hints:
                  - "Die Mitte der Wippe ist ihr Drehpunkt."
                  - "Nah am Drehpunkt wirkt ein Gewicht weniger stark."
                  - "Ja, der Schwerere rutscht nach innen."
              - id: l1-f5
                type: fill_in_blank
                text: "Die Hebel-Regel"
                say: "Setz die passenden Wörter ein."
                frame: "Drückst du weit weg vom _, brauchst du _ Kraft."
                options: ["Drehpunkt", "Ende", "weniger", "mehr"]
                answer: ["Drehpunkt", "weniger"]
                hints:
                  - "Lies den ganzen Satz, bevor du einsetzt."
                  - "Emil drückte am Ende der Stange, weit weg vom Klotz."
                  - "Weit weg vom Drehpunkt brauchst du weniger Kraft."
              - id: l1-f6
                type: matching
                text: "Wo ist der Drehpunkt? Verbinde."
                pairs:
                  - { left: { text: "Schere" }, right: { text: "die Schraube in der Mitte" } }
                  - { left: { text: "Wippe" }, right: { text: "das Gestell in der Mitte" } }
                  - { left: { text: "Unterarm" }, right: { text: "der Ellenbogen" } }
                hints:
                  - "Der Drehpunkt ist die Stelle, an der sich etwas dreht."
                  - "Beuge deinen Arm. Wo dreht er sich?"
                  - "Schere: Schraube. Wippe: Gestell. Unterarm: Ellenbogen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tante Ayla schneidet dicke Pappe. Wo schneidet die Schere am leichtesten?"
                options: ["nah an der Schraube", "ganz vorne an der Spitze", "Das ist überall gleich."]
                answer: "nah an der Schraube"
                feedback:
                  "ganz vorne an der Spitze": "Vorne ist die Pappe weit weg vom Drehpunkt. Da brauchst du viel Kraft."
                hints: ["Wo ist der Drehpunkt der Schere?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Mit einem Hebel wird der Stein leichter."
                answer: false
                feedback:
                  "true": "Der Stein wiegt genauso viel wie vorher. Der Hebel hilft dir nur, ihn mit weniger Kraft zu heben."
                hints: ["Wiegt der Stein weniger, wenn eine Stange darunter liegt?"]
              - id: l1-s3
                type: sorting
                text: "Wenig Kraft oder viel Kraft?"
                say: "Sortiere. Wobei brauchst du wenig Kraft, wobei viel?"
                bins:
                  - { id: little, show: { text: "wenig Kraft" }, say: "wenig Kraft" }
                  - { id: much, show: { text: "viel Kraft" }, say: "viel Kraft" }
                options:
                  - { text: "die Tür an der Klinke aufdrücken", bin: little }
                  - { text: "die Tür nah an den Angeln aufdrücken", bin: much }
                  - { text: "die Stange ganz am Ende drücken", bin: little }
                  - { text: "die Stange nah am Drehpunkt drücken", bin: much }
                hints: ["Ist die Hand weit weg vom Drehpunkt oder nah dran?"]
              - id: l1-s4
                type: multiple_choice
                text: "Jan ist schwerer als seine kleine Schwester Mia. Wer sitzt auf der Wippe näher an der Mitte?"
                options: ["Jan", "Mia", "Beide sitzen ganz außen."]
                answer: "Jan"
                feedback:
                  "Beide sitzen ganz außen.": "Dann geht Jans Seite nach unten, und Mia hängt oben in der Luft."
                hints: ["Wer schwerer ist, rutscht zum Drehpunkt."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Ding ist ein Hebel?"
                options:
                  - { object: scissors }
                  - { object: ball }
                  - { object: sock }
                answer: scissors
                hints: ["Welches Ding dreht sich um einen Drehpunkt?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Mit einem langen Hebel brauchst du weniger Kraft, aber du musst dein Ende weiter bewegen."
                answer: true
                hints: ["Emil drückte die Stange ein langes Stück hinunter, und der Stein hob sich nur ein wenig."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Deckel der Farbdose klemmt. Emil hat einen kurzen und einen langen Schraubenzieher. Womit hebelt er den Deckel leichter auf?"
                options: ["mit dem langen", "mit dem kurzen", "Beide gehen gleich leicht."]
                answer: "mit dem langen"
                feedback:
                  "Beide gehen gleich leicht.": "Beim langen ist Emils Hand weiter weg vom Drehpunkt am Rand der Dose. Das spart Kraft."
              - id: l1-n2
                type: matching
                text: "Was ist hier der Drehpunkt?"
                say: "Verbinde jedes Ding mit seinem Drehpunkt."
                pairs:
                  - { left: { text: "Tür" }, right: { text: "die Türangeln" } }
                  - { left: { text: "Nussknacker" }, right: { text: "das Gelenk" } }
                  - { left: { text: "Wippe" }, right: { text: "das Gestell in der Mitte" } }
              - id: l1-n3
                type: true_false
                text: "Opa drückt die Gartentür ganz nah an den Angeln auf. Stimmt das: So geht es besonders leicht?"
                answer: false
                feedback:
                  "true": "Nah an den Angeln ist nah am Drehpunkt. Dort braucht Opa viel Kraft."
              - id: l1-n4
                type: fill_in_blank
                text: "Emils Wippen-Regel"
                say: "Setz das passende Wort ein."
                frame: "Auf der Wippe sitzt der _ näher am Drehpunkt."
                options: ["Schwerere", "Leichtere"]
                answer: ["Schwerere"]
              - id: l1-n5
                type: multiple_choice
                text: "Emil hebt einen schweren Blumentopf mit einer Stange an. Es ist immer noch zu schwer. Was hilft?"
                options: ["Er drückt noch weiter hinten an der Stange.", "Er drückt näher am Klotz.", "Er nimmt eine kürzere Stange."]
                answer: "Er drückt noch weiter hinten an der Stange."
                feedback:
                  "Er nimmt eine kürzere Stange.": "Mit einer kürzeren Stange kommt Emil nicht so weit weg vom Drehpunkt. Er braucht dann mehr Kraft."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt das Schwere, das du mit einem Hebel bewegst?"
            options: ["die Last", "der Drehpunkt", "der Griff"]
            answer: "die Last"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Die Schere besteht aus zwei Hebeln."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wo drückst du eine schwere Tür am leichtesten auf?"
            options: ["weit weg von den Angeln", "nah an den Angeln", "direkt an den Angeln"]
            answer: "weit weg von den Angeln"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Auf der Wippe sitzt der Schwerere ganz außen."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Du hebst deinen Unterarm. Wo ist der Drehpunkt?"
            options: ["am Ellenbogen", "an der Schulter", "an den Fingern"]
            answer: "am Ellenbogen"
          - id: l1-c6
            type: multiple_choice
            text: "Was ist kein Hebel?"
            options: ["der Ball", "der Nussknacker", "die Wippe"]
            answer: "der Ball"

  - n: 2
    title: { de: "Rolle und Rad", en: "Pulley and wheel" }
    goal:
      de: "Lerne, wie Rolle und Rad Kraft sparen. Auf Rädern rollt eine schwere Kiste viel leichter."
      en: "Learn how pulleys and wheels save effort. On wheels, a heavy box rolls much more easily."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo ist der Drehpunkt der Wippe?"
            options: ["in der Mitte", "ganz außen", "unter dem Sitz"]
            answer: "in der Mitte"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Je weiter weg vom Drehpunkt du drückst, desto weniger Kraft brauchst du."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: In welche Richtung zieht Emil am Seil?"
            say: "Emil und Tante Ayla bauen ein Baumhaus. Emil will einen Eimer mit Werkzeug hinaufbringen. Tante Ayla hängt eine Rolle an einen dicken Ast und legt ein Seil darüber. Ein Ende ist am Eimer festgebunden. Was glaubst du: In welche Richtung muss Emil am anderen Ende ziehen, damit der Eimer nach oben geht?"
            show: { object: bucket }
          - text: "Nach unten! Die feste Rolle ändert die Richtung."
            say: "Nach unten! Emil zieht das Seil nach unten, und der Eimer geht nach oben. Eine Rolle ist ein kleines Rad mit einer Rille, in der das Seil läuft. Hängt sie fest am Ast, ändert sie die Richtung, in die du ziehst. Nach unten ziehen ist bequem, denn Emil kann sein eigenes Gewicht mit einsetzen. Leichter wird der Eimer dadurch nicht. So eine feste Rolle sitzt auch oben am Fahnenmast."
            show: { object: bucket }
          - text: "Mehrere Rollen zusammen: der Flaschenzug"
            say: "Für sehr schwere Lasten nimmt man mehrere Rollen zusammen. Das heißt Flaschenzug. Mit zwei Rollen brauchst du nur ungefähr die halbe Kraft. Dafür musst du doppelt so viel Seil ziehen. Auch Kräne auf der Baustelle heben schwere Lasten mit einem Flaschenzug."
          - text: "Rollen geht leichter als schieben."
            say: "Jetzt muss eine schwere Kiste mit Erde durch den Garten. Schiebt Emil sie über den Boden, reibt sie am Boden, und er braucht viel Kraft. Stellt er sie in den Bollerwagen, rollen die Räder, und es geht viel leichter."
            show: { object: box }
          - text: "Das Rad dreht sich um die Achse."
            say: "Ein Rad dreht sich um eine Stange in seiner Mitte. Diese Stange heißt Achse. Das Rad rollt über den Boden, statt daran entlangzureiben. Darum haben Koffer, Kinderwagen, Bollerwagen und Fahrrad Räder."
            show: { object: suitcase }
          - text: "Die Schubkarre: Rad und Hebel zusammen"
            say: "Die Schubkarre ist besonders schlau gebaut. Vorne hat sie ein Rad, und ihre langen Griffe sind ein Hebel. Der Drehpunkt ist das Rad. Die Last liegt nah am Rad, deine Hände sind weit weg davon. So trägst du nur einen Teil des Gewichts, und das Rad rollt den Rest."
          - text: "Wusstest du? Eines der ältesten Räder der Welt ist mehr als 5000 Jahre alt."
            say: "Wusstest du? Eines der ältesten Räder der Welt ist mehr als 5000 Jahre alt. Es ist aus Holz, und man hat es in einem Moor in Slowenien gefunden."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Am Fahnenmast zieht Lea das Seil über die Rolle nach unten. Was macht die Fahne?"
                options: ["Sie geht nach oben.", "Sie geht nach unten.", "Sie bleibt stehen."]
                answer: "Sie geht nach oben."
                hints:
                  - "Die feste Rolle ändert die Richtung."
                  - "Denk an Emil und den Eimer am Baumhaus."
                  - "Lea zieht nach unten, die Fahne geht nach oben."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Eine Kiste über den Boden zu schieben ist leichter, als sie auf Rädern zu rollen."
                answer: false
                feedback:
                  "true": "Über den Boden reibt die Kiste. Auf Rädern rollt sie, und das braucht viel weniger Kraft."
                hints:
                  - "Was passiert, wenn die Kiste über den Boden rutscht?"
                  - "Sie reibt am Boden. Räder rollen stattdessen."
                  - "Rollen geht leichter. Der Satz stimmt nicht."
              - id: l2-f3
                type: sorting
                text: "Welcher Kraftsparer steckt darin?"
                say: "Sortiere. Steckt darin ein Hebel, eine Rolle oder ein Rad?"
                bins:
                  - { id: lever, show: { text: "Hebel" }, say: "Hebel" }
                  - { id: pulley, show: { text: "Rolle" }, say: "Rolle" }
                  - { id: wheel, show: { text: "Rad" }, say: "Rad" }
                options:
                  - { text: "Wippe", bin: lever }
                  - { text: "Fahnenmast", bin: pulley }
                  - { text: "Kinderwagen", bin: wheel }
                  - { object: scissors, bin: lever }
                  - { text: "Flaschenzug am Kran", bin: pulley }
                  - { text: "Bollerwagen", bin: wheel }
                hints:
                  - "Dreht sich etwas um einen Drehpunkt, läuft ein Seil, oder rollt etwas?"
                  - "Am Fahnenmast und am Kran läuft ein Seil über Rollen."
                  - "Hebel: Wippe, Schere. Rolle: Fahnenmast, Kran. Rad: Kinderwagen, Bollerwagen."
              - id: l2-f4
                type: multiple_choice
                text: "Wie heißt die Stange in der Mitte eines Rades?"
                options: ["die Achse", "die Rille", "das Seil"]
                answer: "die Achse"
                hints:
                  - "Um diese Stange dreht sich das Rad."
                  - "Die Rille hat die Rolle, damit das Seil nicht herausspringt."
                  - "Die Stange heißt Achse."
              - id: l2-f5
                type: fill_in_blank
                text: "So arbeitet der Flaschenzug."
                say: "Setz die passenden Wörter ein."
                frame: "Mit einem Flaschenzug brauchst du _ Kraft, aber du musst _ Seil ziehen."
                options: ["weniger", "mehr"]
                answer: ["weniger", "mehr"]
                hints:
                  - "Auch beim Flaschenzug ist nichts geschenkt."
                  - "Mit zwei Rollen ziehst du doppelt so viel Seil."
                  - "Weniger Kraft, mehr Seil."
              - id: l2-f6
                type: matching
                text: "Was tut es? Verbinde."
                pairs:
                  - { left: { text: "feste Rolle" }, right: { text: "ändert die Richtung" } }
                  - { left: { text: "Flaschenzug" }, right: { text: "halbiert ungefähr die Kraft" } }
                  - { left: { text: "Rad" }, right: { text: "rollt, statt zu reiben" } }
                hints:
                  - "Denk an den Eimer, den Kran und den Bollerwagen."
                  - "Mit der festen Rolle zieht Emil nach unten statt nach oben."
                  - "Feste Rolle: Richtung. Flaschenzug: Kraft. Rad: rollen."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was kannst du am leichtesten durch den Bahnhof ziehen?"
                options:
                  - { object: suitcase }
                  - { object: box }
                  - { object: sack }
                answer: suitcase
                hints: ["Was hat Räder?"]
              - id: l2-s2
                type: multiple_choice
                text: "Warum hat die Schubkarre vorne ein Rad und hinten lange Griffe?"
