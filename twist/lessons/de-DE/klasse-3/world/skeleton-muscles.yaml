# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.skeleton-muscles
skill: world.body.skeleton-muscles
curriculum: de-DE
language: de
title:
  de: Knochen, Gelenke und Muskeln
  en: Bones, joints and muscles
summary: >
  The skeleton holds the body up and protects what lies inside (the skull
  the brain, the ribs heart and lungs, the spine keeps us upright); bones
  are alive, grow and can heal. Joints are where the body bends: knee and
  elbow bend one way like a hinge, shoulder and hip are ball joints.
  Muscles move the bones: they are fixed to them by tendons, can only
  pull, and so work in pairs (the Beuger bends the arm, the Strecker
  straightens it). The story: Jonas practises for his school's circus
  show, and his trainer Frau Demir explains what happens inside him.
  Lesson 1 is the skeleton and the joints; lesson 2 the muscles, all three
  working together, and ends with the skill check. No body pictures: bones
  and muscles are named in text cards.
metadata:
  year: klasse-3
  topic: { de: Im Inneren des Körpers, en: Inside the body }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.body.body-parts, world.body.exercise-rest]
  also_practises: []
  vocabulary: { de: [Skelett, Knochen, Schädel, Rippen, Wirbelsäule, Wirbel, Gelenk, Scharniergelenk, Kugelgelenk, Muskel, Sehne, Beuger, Strecker, stützen, schützen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: skeleton, what: { de: "sagen, wie das Skelett den Körper stützt und schützt", en: saying how the skeleton holds up and protects the body } }
    - { id: joints, what: { de: "Gelenke nennen und sagen, wie sie sich bewegen", en: naming joints and saying how they move } }
    - { id: muscles, what: { de: "erklären, wie Muskeln die Knochen bewegen", en: explaining how muscles move the bones } }
  misconceptions:
    - id: bones-dead
      what: Thinks bones are dead like a stick and do not grow or heal
      addressed: lesson 1 Learn screen on living bones; l1-f6, l1-s5, l2-n4; check task l2-c4
    - id: muscles-push
      what: Thinks a muscle can push a bone as well as pull it, so one muscle is enough
      addressed: lesson 2 Learn on pulling in pairs; l2-f2, l2-s2, l2-c15, l2-c18, l2-c19
    - id: muscles-only-arms
      what: Thinks muscles are only in the arms and legs
      addressed: lesson 2 Learn screen on muscles everywhere; l2-f6, l2-n2
    - id: spine-one-bone
      what: Thinks the spine is one long bone
      addressed: lesson 1 Learn on the Wirbel; l1-s6, l1-c5, l2-c3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Das Skelett und die Gelenke", en: "The skeleton and the joints" }
    goal:
      de: "Finde heraus, wie dein Skelett dich hält und schützt und wo sich dein Körper biegt, zum Beispiel im Knie."
      en: "Find out how your skeleton holds and protects you and where your body bends, for example at the knee."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Welches Bild zeigt ein Bein?"
            options:
              - { object: leg }
              - { object: hand }
              - { object: nose }
            answer: leg
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Wenn du rennst, schlägt dein Herz schneller."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was hält deinen Körper aufrecht?"
            say: "Jonas übt für die Zirkusvorstellung seiner Schule. Er springt, macht eine Rolle und balanciert auf einem Bein. Seine Trainerin, Frau Demir, fragt ihn: Was hält deinen Körper eigentlich aufrecht? Was glaubst du?"
            show: { object: jump }
          - text: "Ein Gerüst aus Knochen: das Skelett"
            say: "In deinem Körper steckt ein Gerüst aus Knochen. Es heißt Skelett. Ohne Skelett würdest du zusammensacken wie ein leerer Sack. Ein Erwachsener hat über 200 Knochen."
          - text: "Knochen stützen und schützen."
            say: "Die Knochen stützen deinen Körper, und sie schützen, was innen liegt. Der Schädel ist wie ein Helm für dein Gehirn. Die Rippen liegen wie ein Käfig um Herz und Lunge. Die Wirbelsäule im Rücken hält dich aufrecht. Sie ist kein einzelner Knochen, sondern aus vielen kleinen Knochen gebaut, den Wirbeln."
          - text: "Knochen leben und wachsen."
            say: "Knochen sind nicht tot wie ein Stock. Sie leben und wachsen mit dir mit. Ein gebrochener Knochen kann wieder zusammenwachsen. Oft bekommt er dafür einen Gips, damit er gerade heilt."
          - text: "Gelenke: Hier biegt sich dein Körper."
            say: "Wo zwei Knochen aneinanderstoßen, sitzt oft ein Gelenk. Dort kann sich dein Körper biegen. Gelenke sind zum Beispiel das Knie, der Ellenbogen, die Schulter und die Hüfte. Auch deine Finger haben viele kleine Gelenke. Ohne Gelenke könnte Jonas weder springen noch einen Ball fangen."
            show: { object: hand }
          - text: "Scharniergelenk und Kugelgelenk"
            say: "Das Knie und der Ellenbogen biegen sich wie eine Tür im Scharnier, nur in eine Richtung. Sie heißen Scharniergelenke. Die Schulter und die Hüfte sind Kugelgelenke. Mit ihnen kannst du Arm und Bein in viele Richtungen bewegen, sogar im Kreis."
          - text: "Wusstest du? Bei Erwachsenen steckt mehr als die Hälfte aller Knochen in den Händen und Füßen."
            say: "Wusstest du? Bei Erwachsenen steckt mehr als die Hälfte aller Knochen in den Händen und Füßen. Darum können wir mit den Fingern so feine Dinge tun."
            show: { object: foot }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt das Gerüst aus Knochen in deinem Körper?"
                options: ["das Skelett", "der Muskel", "das Gelenk"]
                answer: "das Skelett"
                hints:
                  - "Es ist aus über 200 Knochen gebaut."
                  - "Ein Gelenk ist nur die Stelle, an der sich der Körper biegt."
                  - "Alle Knochen zusammen heißen Skelett."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Der Schädel schützt dein Gehirn wie ein Helm."
                answer: true
                hints:
                  - "Wo liegt dein Gehirn?"
                  - "Das Gehirn liegt im Kopf, und um den Kopf liegt ein harter Knochen."
                  - "Ja, der Schädel ist wie ein Helm für das Gehirn."
                difficulty: easy
              - id: l1-f3
                type: matching
                text: "Was macht dieser Knochen? Verbinde."
                pairs:
                  - { left: { text: "Schädel" }, right: { text: "schützt das Gehirn" } }
                  - { left: { text: "Rippen" }, right: { text: "schützen Herz und Lunge" } }
                  - { left: { text: "Wirbelsäule" }, right: { text: "hält dich aufrecht" } }
                hints:
                  - "Denk daran, wo jeder Knochen sitzt: im Kopf, in der Brust oder im Rücken."
                  - "Die Rippen liegen wie ein Käfig in der Brust."
                  - "Schädel: Gehirn. Rippen: Herz und Lunge. Wirbelsäule: aufrecht."
              - id: l1-f4
                type: multiple_choice
                text: "Wo kann sich dein Arm biegen?"
                options: ["am Ellenbogen", "in der Mitte vom Oberarm", "am Fingernagel"]
                answer: "am Ellenbogen"
                feedback:
                  "am Fingernagel": "Ein Fingernagel kann sich gar nicht biegen. Dort ist kein Gelenk."
                  "in der Mitte vom Oberarm": "Dort ist ein langer Knochen und kein Gelenk. Ein Knochen biegt sich nicht."
                hints:
                  - "Ein Körper biegt sich nur an einem Gelenk."
                  - "Beuge deinen Arm. Wo knickt er ab?"
                  - "Der Arm biegt sich am Ellenbogen."
              - id: l1-f5
                type: sorting
                text: "Gelenk oder Knochen?"
                say: "Frau Demir hat Karten gemacht. Ist das ein Gelenk oder ein Knochen? Sortiere."
                bins:
                  - { id: joint, show: { text: "Gelenk" }, say: "Gelenk" }
                  - { id: bone, show: { text: "Knochen" }, say: "Knochen" }
                options:
                  - { text: "Knie", bin: joint }
                  - { text: "Rippe", bin: bone }
                  - { text: "Ellenbogen", bin: joint }
                  - { text: "Schädel", bin: bone }
                  - { text: "Schulter", bin: joint }
                  - { text: "Wirbel", bin: bone }
                hints:
                  - "An einem Gelenk biegt sich der Körper."
                  - "Kannst du dich an der Rippe biegen? Und am Knie?"
                  - "Gelenke: Knie, Ellenbogen, Schulter. Knochen: Rippe, Schädel, Wirbel."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Knochen sind tot und wachsen nicht."
                answer: false
                feedback:
                  "true": "Knochen leben! Sie wachsen mit dir, und ein gebrochener Knochen kann heilen."
                hints:
                  - "Bist du größer als vor einem Jahr?"
                  - "Wenn du wächst, müssen auch deine Knochen länger werden."
                  - "Knochen leben und wachsen mit dir."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was schützen die Rippen?"
                options: ["Herz und Lunge", "das Gehirn", "die Füße"]
                answer: "Herz und Lunge"
                hints: ["Die Rippen liegen wie ein Käfig in deiner Brust."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Das Knie biegt sich nur in eine Richtung, wie eine Tür im Scharnier."
                answer: true
                hints: ["Kannst du dein Knie nach vorne biegen?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Wo sitzt das Knie?"
                options:
                  - { object: leg }
                  - { object: arm }
                  - { object: hand }
                answer: leg
                hints: ["Das Knie biegt sich, wenn du in die Hocke gehst."]
              - id: l1-s4
                type: sorting
                text: "Scharniergelenk oder Kugelgelenk?"
                say: "Scharniergelenk oder Kugelgelenk? Sortiere die Gelenke."
                bins:
                  - { id: hinge, show: { text: "Scharniergelenk" }, say: "Scharniergelenk" }
                  - { id: ball, show: { text: "Kugelgelenk" }, say: "Kugelgelenk" }
                options:
                  - { text: "Knie", bin: hinge }
                  - { text: "Schulter", bin: ball }
                  - { text: "Ellenbogen", bin: hinge }
                  - { text: "Hüfte", bin: ball }
                hints: ["Mit welchen Gelenken kannst du Arm oder Bein im Kreis bewegen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was passiert mit einem gebrochenen Knochen?"
                options: ["Er kann wieder zusammenwachsen.", "Er bleibt für immer kaputt.", "Er wird zu einem Gelenk."]
                answer: "Er kann wieder zusammenwachsen."
                feedback:
                  "Er wird zu einem Gelenk.": "Dann hättest du ja bald überall Gelenke! Nein, der Knochen wächst wieder zusammen."
                hints: ["Knochen leben. Was kann Lebendiges, wenn es verletzt ist?"]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Die Wirbelsäule ist ein einziger langer Knochen."
                answer: false
                feedback:
                  "true": "Die Wirbelsäule ist aus vielen kleinen Knochen gebaut, den Wirbeln. Darum kannst du deinen Rücken krumm machen."
                hints: ["Kannst du deinen Rücken krumm machen?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Jonas macht eine Rolle vorwärts. Welcher Knochen schützt dabei sein Gehirn?"
                options: ["der Schädel", "die Rippen", "die Hüfte"]
                answer: "der Schädel"
              - id: l1-n2
                type: matching
                text: "Frau Demir erklärt drei Wörter. Verbinde."
                pairs:
                  - { left: { text: "Gelenk" }, right: { text: "Hier biegt sich der Körper." } }
                  - { left: { text: "Skelett" }, right: { text: "alle Knochen zusammen" } }
                  - { left: { text: "Wirbel" }, right: { text: "kleiner Knochen im Rücken" } }
              - id: l1-n3
                type: true_false
                text: "Jonas sagt: „Ohne Knochen könnte ich nicht aufrecht stehen.“ Stimmt das?"
                say: "Jonas sagt: Ohne Knochen könnte ich nicht aufrecht stehen. Stimmt das?"
                answer: true
              - id: l1-n4
                type: ordering
                text: "Jonas steht gerade. Ordne die Knochen und Gelenke von oben nach unten."
                say: "Jonas steht gerade. Ordne die Knochen und Gelenke von oben nach unten."
                options: ["Hüfte", "Schädel", "Knie", "Rippen"]
                slot_count: 4
                answer: ["Schädel", "Rippen", "Hüfte", "Knie"]
              - id: l1-n5
                type: multiple_choice
                text: "Jonas schwingt den Arm im Kreis wie eine Windmühle. Welches Gelenk macht das möglich?"
                options: ["die Schulter", "der Ellenbogen", "das Knie"]
                answer: "die Schulter"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wofür hast du ein Skelett?"
            options: ["Es stützt und schützt den Körper.", "Es macht dich müde.", "Es macht deine Haare lang."]
            answer: "Es stützt und schützt den Körper."
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Der Ellenbogen ist ein Gelenk."
            answer: true
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Die Rippen schützen das Gehirn."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Welches Gelenk ist ein Kugelgelenk?"
            options: ["die Hüfte", "das Knie", "der Ellenbogen"]
            answer: "die Hüfte"
          - id: l1-c5
            type: multiple_choice
            text: "Woraus ist die Wirbelsäule gebaut?"
            options: ["aus vielen Wirbeln", "aus einem langen Knochen", "aus Rippen"]
            answer: "aus vielen Wirbeln"
          - id: l1-c6
            type: image_multiple_choice
            text: "Welcher Körperteil hat einen Ellenbogen?"
            options:
              - { object: arm }
              - { object: leg }
              - { object: foot }
            answer: arm

  - n: 2
    title: { de: "Muskeln ziehen", en: "Muscles pull" }
    goal:
      de: "Finde heraus, wie Muskeln deine Knochen bewegen. Zum Beispiel beugt ein Muskel vorne am Oberarm deinen Arm."
      en: "Find out how muscles move your bones. For example, a muscle at the front of your upper arm bends your arm."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was liegt wie ein Käfig um dein Herz und deine Lunge?"
            options: ["die Rippen", "der Schädel", "das Knie"]
            answer: "die Rippen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Das Knie ist ein Gelenk."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Können sich Knochen von allein bewegen?"
            say: "Bei der Probe hebt Jonas einen Ring hoch über den Kopf. Frau Demir fragt: Deine Knochen bewegen sich. Aber können sie das von allein? Was glaubst du?"
          - text: "Nein! Muskeln bewegen die Knochen."
            say: "Nein, Knochen bewegen sich nicht von allein. Das machen die Muskeln. Sie sind mit festen Bändern an den Knochen angewachsen, den Sehnen. Wenn ein Muskel sich zusammenzieht, wird er kürzer und dicker. Dann zieht er am Knochen, und du bewegst dich."
          - text: "Muskeln können nur ziehen. Darum arbeiten sie zu zweit."
            say: "Ein Muskel kann nur ziehen, er kann nicht schieben. Darum arbeiten Muskeln oft zu zweit. Vorne am Oberarm sitzt der Beuger. Er zieht den Unterarm hoch, und der Arm beugt sich. Hinten am Oberarm sitzt der Strecker. Er zieht den Arm wieder gerade."
          - text: "Spür es selbst!"
            say: "Leg eine Hand vorne auf deinen Oberarm und beuge den anderen Arm langsam. Spürst du, wie der Beuger dick und fest wird? Wenn du den Arm streckst, wird er wieder weich."
            show: { object: arm }
          - text: "Muskeln hast du überall."
            say: "Muskeln hast du nicht nur in Armen und Beinen. Du hast sie auch im Bauch, im Rücken und sogar im Gesicht. Wenn du lachst, ziehen kleine Muskeln an deinen Mundwinkeln."
            show: { object: happy }
          - text: "Knochen, Gelenke und Muskeln arbeiten zusammen."
            say: "Wenn Jonas springt, arbeiten alle zusammen. Die Knochen geben Halt, die Gelenke biegen sich, und die Muskeln ziehen. Wenn du dich viel bewegst, werden deine Muskeln und Knochen stark."
            show: { object: jump }
          - text: "Wusstest du? Ein Baby hat mehr Knochen als ein Erwachsener."
            say: "Wusstest du? Ein Baby hat mehr Knochen als ein Erwachsener. Beim Wachsen wachsen manche Knochen zusammen, zum Beispiel am Schädel."
            show: { object: baby }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was bewegt deine Knochen?"
                options: ["die Muskeln", "die Rippen", "die Haare"]
                answer: "die Muskeln"
                feedback:
                  "die Haare": "Haare können keinen Knochen bewegen, auch keine ganz starken!"
                hints:
                  - "Knochen bewegen sich nicht von allein. Etwas zieht an ihnen."
                  - "Die Rippen sind selbst Knochen."
                  - "Die Muskeln ziehen an den Knochen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Ein Muskel kann ziehen und schieben."
                answer: false
                feedback:
                  "true": "Ein Muskel kann nur ziehen. Darum braucht der Arm zwei Muskeln: einen zum Beugen und einen zum Strecken."
                hints:
                  - "Was macht ein Muskel, wenn er sich zusammenzieht?"
                  - "Er wird kürzer und zieht am Knochen. Wegschieben kann er ihn nicht."
                  - "Muskeln können nur ziehen."
              - id: l2-f3
                type: matching
                text: "Was macht wer? Verbinde."
                pairs:
                  - { left: { text: "Beuger" }, right: { text: "beugt den Arm" } }
                  - { left: { text: "Strecker" }, right: { text: "streckt den Arm" } }
                  - { left: { text: "Sehne" }, right: { text: "hält den Muskel am Knochen fest" } }
                hints:
                  - "Hör auf die Namen: Beuger und Strecker sagen, was sie tun."
                  - "Die Sehne ist ein festes Band zwischen Muskel und Knochen."
                  - "Beuger: beugen. Strecker: strecken. Sehne: festhalten."
              - id: l2-f4
                type: multiple_choice
                text: "Jonas beugt den Arm. Wie wird der Beuger dabei?"
                options: ["kürzer und dicker", "länger und dünner", "ganz weich"]
                answer: "kürzer und dicker"
                hints:
                  - "Ein Muskel, der zieht, zieht sich zusammen."
                  - "Leg die Hand auf den Oberarm und beuge den Arm. Was spürst du?"
                  - "Der Beuger wird kürzer und dicker."
              - id: l2-f5
                type: sorting
                text: "Knochen, Gelenk oder Muskel?"
                say: "Knochen, Gelenk oder Muskel? Lege jede Karte in die richtige Kiste."
                bins:
                  - { id: bone, show: { text: "Knochen" }, say: "Knochen" }
                  - { id: joint, show: { text: "Gelenk" }, say: "Gelenk" }
                  - { id: muscle, show: { text: "Muskel" }, say: "Muskel" }
                options:
                  - { text: "Schädel", bin: bone }
                  - { text: "Beuger", bin: muscle }
                  - { text: "Hüfte", bin: joint }
                  - { text: "Rippe", bin: bone }
                  - { text: "Strecker", bin: muscle }
                  - { text: "Knie", bin: joint }
                hints:
                  - "Frag bei jeder Karte: Gibt sie Halt, biegt sie sich oder zieht sie?"
                  - "Beuger und Strecker ziehen am Arm."
                  - "Knochen: Schädel, Rippe. Gelenk: Hüfte, Knie. Muskel: Beuger, Strecker."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Auch in deinem Gesicht sind Muskeln."
                answer: true
                hints:
                  - "Wie bewegst du deinen Mund, wenn du lachst?"
                  - "Etwas muss an deinen Mundwinkeln ziehen."
                  - "Ja, auch im Gesicht hast du Muskeln."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Bei welchem Bild arbeiten die Muskeln in den Beinen besonders hart?"
                options:
                  - { object: jump }
                  - { object: read }
                  - { object: paint }
                answer: jump
                hints: ["Bei welchem Bild drücken sich die Beine vom Boden ab?"]
              - id: l2-s2
                type: multiple_choice
                text: "Warum arbeiten Muskeln oft zu zweit?"
                options: ["Weil ein Muskel nur ziehen kann.", "Weil ein Muskel sich allein langweilt.", "Weil Knochen zu schwer sind."]
                answer: "Weil ein Muskel nur ziehen kann."
                feedback:
                  "Weil ein Muskel sich allein langweilt.": "Muskeln langweilen sich nicht! Einer zieht in die eine Richtung, der andere zurück."
                hints: ["Kann ein Muskel einen Knochen wegschieben?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Wenn Jonas den Arm streckt, zieht der Strecker hinten am Oberarm."
                answer: true
                hints: ["Wo sitzt der Strecker?"]
              - id: l2-s4
                type: ordering
                text: "Jonas beugt den Arm. Was passiert zuerst?"
                say: "Jonas beugt den Arm. Leg die Karten in die richtige Reihenfolge."
                options: ["Der Arm biegt sich im Ellenbogen.", "Der Beuger zieht sich zusammen.", "Der Beuger zieht am Unterarm."]
                slot_count: 3
                answer: ["Der Beuger zieht sich zusammen.", "Der Beuger zieht am Unterarm.", "Der Arm biegt sich im Ellenbogen."]
                hints: ["Zuerst muss der Muskel etwas tun, dann bewegt sich der Knochen."]
              - id: l2-s5
                type: multiple_choice
                text: "Was macht deine Muskeln und Knochen stark?"
                options: ["viel Bewegung", "viel Fernsehen", "viele Süßigkeiten"]
                answer: "viel Bewegung"
                hints: ["Was macht Jonas jeden Tag für die Zirkusvorstellung?"]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? Ein Baby hat weniger Knochen als ein Erwachsener."
                answer: false
                feedback:
                  "true": "Es ist umgekehrt: Ein Baby hat mehr Knochen. Beim Wachsen wachsen manche zusammen."
                hints: ["Was passiert mit manchen Knochen beim Wachsen?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Jonas springt durch einen Reifen. Welche Gelenke biegen sich dabei in seinen Beinen?"
                options: ["die Knie", "die Rippen", "die Ellenbogen"]
                answer: "die Knie"
              - id: l2-n2
                type: true_false
                text: "Lea sagt: „Muskeln gibt es nur in den Armen.“ Stimmt das?"
