# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.compass
skill: world.space.compass
curriculum: de-DE
language: de
title:
  de: Die Himmelsrichtungen
  en: The compass directions
summary: >
  The four compass directions, found with a compass and with the sun. The
  story: Lina and Can are at a summer camp, and the leader Frau Berg has
  hidden a treasure; every clue names a direction. Lesson 1 teaches
  Norden, Osten, Süden and Westen on the Windrose (Nie Ohne Seife
  Waschen), how the compass needle always points north, which directions
  are opposite and that north is at the top of most maps. Lesson 2 finds
  the directions without a compass: the sun rises in the east, stands in
  the south at midday and sets in the west, and a midday shadow points
  north. It ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Karten lesen, en: Reading maps }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [world.space.left-right-position]
  also_practises: []
  vocabulary: { de: [Himmelsrichtung, Norden, Osten, Süden, Westen, Windrose, Kompass, Kompassnadel, gegenüber, Uhrzeigersinn, Sonnenaufgang, Sonnenuntergang, Schatten] }
  forms: [text, audio, picture, drawn]
  drawn: [grid, shape]
  facets: []
  parts:
    - { id: rose, what: { de: die vier Himmelsrichtungen und ihre Lage auf der Windrose nennen, en: naming the four directions and where they sit on the compass rose } }
    - { id: compass, what: { de: mit dem Kompass Norden finden, en: finding north with a compass } }
    - { id: sun, what: { de: die Himmelsrichtungen mit dem Stand der Sonne bestimmen, en: finding the directions from the position of the sun } }
    - { id: map, what: { de: "auf einer Karte sagen, in welcher Richtung etwas liegt", en: saying in which direction something lies on a map } }
  misconceptions:
    - id: needle-turns
      what: Thinks the compass needle turns with the compass and points wherever the child is facing
      addressed: lesson 1 opens with the guess about the turning compass; l1-f2, l1-s6, l1-c4; l2-c7 and l2-c9 in the skill check
    - id: north-is-up
      what: Thinks north means up (towards the sky) rather than a direction, or that north is at the top of a map because it is above us
      addressed: the Learn screen on maps says north is at the top only by agreement; l1-s2, l1-s5, l2-n5
    - id: opposites
      what: Mixes up which directions lie opposite (Norden and Westen)
      addressed: the Learn screen on opposites; l1-f5, l1-s3, l1-n3, l1-n4, l1-c1; l2-c1
    - id: shadow-to-sun
      what: Thinks a shadow points towards the sun, so a midday shadow points south
      addressed: the Learn screen on the shadow; l2-f5, l2-n2, l2-n4; l2-c15
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Nie Ohne Seife Waschen", en: "Never Eat Shredded Wheat" }
    goal:
      de: "Lerne die vier Himmelsrichtungen und finde Norden mit dem Kompass. Auf den meisten Karten ist Norden oben."
      en: "Learn the four compass directions and find north with a compass. On most maps north is at the top."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Form ist ganz links?"
            show: { drawn: shape, row: [circle, square, triangle], colours: [red, blue, green] }
            options: ["der Kreis", "das Quadrat", "das Dreieck"]
            answer: "der Kreis"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Das Quadrat ist zwischen dem Kreis und dem Dreieck."
            show: { drawn: shape, row: [circle, square, triangle], colours: [red, blue, green] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Dreht sich die Kompassnadel mit, wenn Lina den Kompass dreht?"
            say: "Lina und Can sind im Ferienlager. Frau Berg hat einen Schatz versteckt. Sie gibt den beiden einen Kompass und den ersten Hinweis: Geht vom Zelt nach Norden. Lina dreht den Kompass in ihrer Hand hin und her. Was glaubst du: Dreht sich die Nadel mit?"
          - text: "Nein! Die Nadel zeigt immer nach Norden."
            say: "Nein. Lina kann den Kompass drehen, wie sie will. Die farbige Spitze der Nadel zeigt immer in dieselbe Richtung: nach Norden. Meistens ist diese Spitze rot."
          - text: "So hältst du den Kompass: flach, still, und dann drehen, bis die Nadel auf N liegt."
            say: "So geht es. Halte den Kompass flach in der Hand. Warte, bis die Nadel still steht. Dann drehe den Kompass, bis die farbige Spitze genau auf dem N liegt. Jetzt weißt du, wo Norden ist."
          - text: "Die vier Himmelsrichtungen: Norden, Osten, Süden, Westen"
            say: "Es gibt vier Himmelsrichtungen. Norden, Osten, Süden und Westen. Man kürzt sie ab mit N, O, S und W. Das Bild mit den vier Richtungen heißt Windrose."
            show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "O"], [1, 2, "S"], [0, 1, "W"]] }
          - text: "Merksatz: Nie Ohne Seife Waschen"
            say: "Mit einem Merksatz behältst du die Reihenfolge: Nie Ohne Seife Waschen. N wie Norden, O wie Osten, S wie Süden, W wie Westen. So gehen die Richtungen herum wie der Zeiger einer Uhr. Das heißt im Uhrzeigersinn."
            show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "O"], [1, 2, "S"], [0, 1, "W"]] }
          - text: "Norden liegt gegenüber von Süden, Osten gegenüber von Westen."
            say: "Auf der Windrose liegen sich immer zwei Richtungen gegenüber. Norden liegt gegenüber von Süden. Osten liegt gegenüber von Westen. Wenn du nach Norden schaust, ist Süden hinter dir. Osten ist dann rechts von dir und Westen links."
            show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "O"], [1, 2, "S"], [0, 1, "W"]] }
          - text: "Z = Zelt, E = Eiche, T = Teich, F = Feuerstelle, H = Hütte. Norden ist oben."
            say: "Das ist die Karte vom Ferienlager. Auf den meisten Karten ist Norden oben, Süden unten, Osten rechts und Westen links. Das haben die Kartenmacher so abgemacht. Die Eiche liegt oben, also im Norden vom Zelt. Der Teich liegt im Süden vom Zelt."
            show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
          - text: "Wusstest du? Die Nadel im Kompass ist ein kleiner Magnet."
            say: "Wusstest du? Die Nadel im Kompass ist ein kleiner Magnet. Die ganze Erde wirkt wie ein riesiger Magnet. Darum dreht sich die Nadel immer wieder nach Norden."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Himmelsrichtung fehlt oben?"
                show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "?"], [2, 1, "O"], [1, 2, "S"], [0, 1, "W"]] }
                options: ["Norden", "Süden", "Westen"]
                answer: "Norden"
                hints:
                  - "Denk an den Merksatz: Nie Ohne Seife Waschen."
                  - "Der Merksatz fängt oben an und geht wie der Uhrzeiger herum."
                  - "Oben steht N wie Norden."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Die Kompassnadel zeigt immer nach Norden, auch wenn du den Kompass drehst."
                answer: true
                hints:
                  - "Was hat Lina gesehen, als sie den Kompass gedreht hat?"
                  - "Der Kompass dreht sich, aber die Nadel bleibt in ihrer Richtung."
                  - "Ja, die farbige Spitze zeigt immer nach Norden."
              - id: l1-f3
                type: matching
                text: "Verbinde jeden Buchstaben mit seiner Himmelsrichtung."
                pairs:
                  - { left: { text: "N" }, right: { text: "Norden" } }
                  - { left: { text: "O" }, right: { text: "Osten" } }
                  - { left: { text: "S" }, right: { text: "Süden" } }
                  - { left: { text: "W" }, right: { text: "Westen" } }
                hints:
                  - "Jeder Buchstabe ist der Anfang einer Himmelsrichtung."
                  - "O ist nicht oben, O steht für eine Richtung."
                  - "N Norden, O Osten, S Süden, W Westen."
              - id: l1-f4
                type: ordering
                text: "Lege die Himmelsrichtungen wie der Uhrzeiger, Norden zuerst."
                say: "Lege die Himmelsrichtungen in die Reihenfolge, in der sie wie der Zeiger einer Uhr herumgehen. Fang mit Norden an."
                options: ["Westen", "Osten", "Norden", "Süden"]
                slot_count: 4
                answer: ["Norden", "Osten", "Süden", "Westen"]
                hints:
                  - "Denk an den Merksatz."
                  - "Nie Ohne Seife Waschen: Welcher Buchstabe kommt nach N?"
                  - "Norden, Osten, Süden, Westen."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Himmelsrichtung liegt gegenüber von Osten?"
                show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "O"], [1, 2, "S"], [0, 1, "W"]] }
                options: ["Westen", "Norden", "Süden"]
                answer: "Westen"
                hints:
                  - "Such das O auf der Windrose."
                  - "Geh vom O quer durch die Mitte auf die andere Seite."
                  - "Gegenüber von Osten liegt Westen."
              - id: l1-f6
                type: multiple_choice
                text: "Z = Zelt, E = Eiche, T = Teich, F = Feuerstelle, H = Hütte. Was liegt im Norden vom Zelt?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
                options: ["die Eiche", "der Teich", "die Hütte"]
                answer: "die Eiche"
                hints:
                  - "Wo ist Norden auf der Karte?"
                  - "Norden ist oben. Geh vom Zelt nach oben."
                  - "Oben vom Zelt steht E wie Eiche."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Z = Zelt, E = Eiche, T = Teich, F = Feuerstelle, H = Hütte. Was liegt im Osten vom Zelt?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
                options: ["die Feuerstelle", "die Hütte", "der Teich"]
                answer: "die Feuerstelle"
                feedback:
                  "die Hütte": "Die Hütte liegt links, also im Westen. Osten ist auf der Karte rechts."
                hints: ["Osten ist auf der Karte rechts."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Auf den meisten Karten ist Süden oben."
                answer: false
                feedback:
                  "true": "Auf den meisten Karten ist Norden oben. Süden ist unten."
                hints: ["Wo lag die Eiche im Norden vom Zelt?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Was liegt gegenüber?"
                say: "Setz die passende Himmelsrichtung ein."
                frame: "Norden liegt gegenüber von _."
                options: ["Süden", "Osten", "Westen"]
                answer: ["Süden"]
                hints: ["Wenn du nach Norden schaust, was ist dann hinter dir?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Himmelsrichtung fehlt links?"
                show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "O"], [1, 2, "S"], [0, 1, "?"]] }
                options: ["Westen", "Osten", "Norden"]
                answer: "Westen"
                hints: ["Nie Ohne Seife Waschen: Was kommt nach dem S?"]
              - id: l1-s5
                type: matching
                text: "Wo liegt jede Himmelsrichtung auf einer Karte?"
                say: "Wo liegt jede Himmelsrichtung auf den meisten Karten? Verbinde."
                pairs:
                  - { left: { text: "Norden" }, right: { text: "oben" } }
                  - { left: { text: "Süden" }, right: { text: "unten" } }
                  - { left: { text: "Osten" }, right: { text: "rechts" } }
                  - { left: { text: "Westen" }, right: { text: "links" } }
                hints: ["Norden ist oben. Die anderen gehen wie der Uhrzeiger herum."]
              - id: l1-s6
                type: multiple_choice
                text: "Lina hält den Kompass flach. Die farbige Spitze der Nadel zeigt genau nach vorn. In welche Richtung schaut Lina?"
                options: ["nach Norden", "nach Süden", "nach Westen"]
                answer: "nach Norden"
                hints: ["Wohin zeigt die farbige Spitze immer?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Z = Zelt, E = Eiche, T = Teich, F = Feuerstelle, H = Hütte. Can steht am Zelt und geht nach Westen. Wo kommt er an?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
                options: ["an der Hütte", "an der Feuerstelle", "an der Eiche"]
                answer: "an der Hütte"
              - id: l1-n2
                type: true_false
                text: "Lina sagt: „Der Teich liegt im Süden vom Zelt.“ Stimmt das?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Z = Zelt, E = Eiche, T = Teich, F = Feuerstelle, H = Hütte. Lina steht am Teich. In welche Richtung geht sie zurück zum Zelt?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
                options: ["nach Norden", "nach Süden", "nach Osten"]
                answer: "nach Norden"
                feedback:
                  "nach Süden": "Der Teich liegt im Süden vom Zelt. Zurück geht es in die Gegenrichtung, nach Norden."
              - id: l1-n4
                type: fill_in_blank
                text: "Can schaut nach Norden. Was ist hinter ihm?"
                say: "Can schaut nach Norden. Setz die Himmelsrichtung ein, die hinter ihm ist."
                frame: "Hinter Can ist _."
                options: ["Süden", "Westen", "Osten"]
                answer: ["Süden"]
              - id: l1-n5
                type: multiple_choice
                text: "Can schaut nach Norden. Welche Himmelsrichtung ist rechts von ihm?"
                options: ["Osten", "Westen", "Süden"]
                answer: "Osten"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Himmelsrichtung liegt gegenüber von Süden?"
            options: ["Norden", "Osten", "Westen"]
            answer: "Norden"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Auf den meisten Karten ist Osten rechts."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welche Himmelsrichtung fehlt rechts?"
            show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "?"], [1, 2, "S"], [0, 1, "W"]] }
            options: ["Osten", "Westen", "Süden"]
            answer: "Osten"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Die farbige Spitze der Kompassnadel zeigt nach Süden."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Z = Zelt, E = Eiche, T = Teich, F = Feuerstelle, H = Hütte. Was liegt im Westen vom Zelt?"
            show: { drawn: grid, cols: 5, rows: 5, cells: [[2, 2, yellow], [2, 0, green], [1, 4, blue], [2, 4, blue], [3, 4, blue], [4, 2, orange], [0, 2, brown]], labels: [[2, 2, "Z"], [2, 0, "E"], [2, 4, "T"], [4, 2, "F"], [0, 2, "H"]] }
            options: ["die Hütte", "die Feuerstelle", "die Eiche"]
            answer: "die Hütte"
          - id: l1-c6
            type: fill_in_blank
            text: "Wie heißt der Merksatz?"
            say: "Wie heißt der Merksatz für die Himmelsrichtungen? Setz das fehlende Wort ein."
            frame: "Nie Ohne Seife _."
            options: ["Waschen", "Wandern", "Winken"]
            answer: ["Waschen"]

  - n: 2
    title: { de: "Die Sonne zeigt den Weg", en: "The sun shows the way" }
    goal:
      de: "Finde die Himmelsrichtungen auch ohne Kompass. Morgens steht die Sonne im Osten, mittags im Süden und abends im Westen."
      en: "Find the compass directions without a compass too. The sun is in the east in the morning, in the south at midday and in the west in the evening."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Himmelsrichtung fehlt unten?"
            show: { drawn: grid, cols: 3, rows: 3, cells: [[1, 1, red]], labels: [[1, 0, "N"], [2, 1, "O"], [1, 2, "?"], [0, 1, "W"]] }
            options: ["Süden", "Norden", "Osten"]
            answer: "Süden"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Osten liegt gegenüber von Westen."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: In welcher Himmelsrichtung geht die Sonne auf?"
            say: "Am nächsten Morgen ist der Kompass weg. Can hat ihn im Zelt verloren. Lina sagt: Kein Problem, die Sonne zeigt uns den Weg. Was glaubst du: In welcher Himmelsrichtung geht die Sonne am Morgen auf?"
            show: { object: sun }
          - text: "Im Osten! Morgens steht die Sonne im Osten."
            say: "Im Osten. Morgens geht die Sonne ungefähr im Osten auf. Wenn Can am Morgen zur Sonne schaut, schaut er nach Osten. Dann ist Westen hinter ihm, Norden links und Süden rechts."
            show: { object: sun }
          - text: "Mittags steht die Sonne im Süden. Abends geht sie im Westen unter."
            say: "Über den Tag wandert die Sonne über den Himmel. Bei uns in Deutschland steht sie mittags im Süden, am höchsten am Himmel. Abends geht sie ungefähr im Westen unter."
            show: { object: sun }
          - text: "Im Norden ist die Sonne nie zu sehen."
            say: "Ein alter Spruch hilft dir: Im Osten geht die Sonne auf, im Süden nimmt sie ihren Lauf, im Westen will sie untergehn, im Norden ist sie nie zu sehn."
          - text: "Mittags zeigt dein Schatten nach Norden."
            say: "Auch dein Schatten hilft. Ein Schatten fällt immer auf die Seite, die von der Sonne weg zeigt. Mittags steht die Sonne im Süden. Darum zeigt dein Schatten mittags nach Norden."
          - text: "Wusstest du? In Neuseeland steht die Sonne mittags im Norden."
            say: "Wusstest du? Neuseeland liegt auf der anderen Seite der Erde, weit im Süden. Dort steht die Sonne mittags nicht im Süden, sondern im Norden."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "In welcher Himmelsrichtung geht die Sonne auf?"
                show: { object: sun }
                options: ["im Osten", "im Westen", "im Norden"]
                answer: "im Osten"
                hints:
                  - "Denk an den Spruch über die Sonne."
                  - "Im Osten geht die Sonne ..."
                  - "Die Sonne geht im Osten auf."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Wo steht die Sonne? Lege die Richtungen vom Morgen bis zum Abend."
                say: "Die Sonne wandert über den Himmel. Lege die Himmelsrichtungen in die richtige Reihenfolge, vom Morgen bis zum Abend."
                options: ["Westen", "Süden", "Osten"]
                slot_count: 3
                answer: ["Osten", "Süden", "Westen"]
                hints:
                  - "Wo geht die Sonne auf, wo geht sie unter?"
                  - "Morgens im Osten, abends im Westen. Was liegt dazwischen?"
                  - "Osten, Süden, Westen."
              - id: l2-f3
                type: matching
                text: "Wo steht die Sonne bei uns? Verbinde."
                pairs:
                  - { left: { text: "morgens" }, right: { text: "im Osten" } }
                  - { left: { text: "mittags" }, right: { text: "im Süden" } }
                  - { left: { text: "abends" }, right: { text: "im Westen" } }
                hints:
                  - "Fang mit dem Morgen an: Wo geht die Sonne auf?"
                  - "Mittags steht die Sonne am höchsten, gegenüber von Norden."
                  - "Morgens Osten, mittags Süden, abends Westen."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Bei uns steht die Sonne mittags im Norden."
                answer: false
                feedback:
                  "true": "Im Norden ist die Sonne bei uns nie zu sehen. Mittags steht sie im Süden."
                hints:
                  - "Denk an das Ende vom Spruch."
                  - "Im Norden ist sie nie zu sehn."
                  - "Mittags steht die Sonne im Süden. Das stimmt also nicht."
              - id: l2-f5
                type: multiple_choice
                text: "Es ist mittags. Lina steht in der Sonne. In welche Richtung zeigt ihr Schatten?"
                options: ["nach Norden", "nach Süden", "nach Osten"]
                answer: "nach Norden"
                feedback:
                  "nach Süden": "Im Süden steht die Sonne. Der Schatten zeigt von der Sonne weg."
                hints:
                  - "Wo steht die Sonne mittags?"
                  - "Ein Schatten zeigt von der Sonne weg, auf die andere Seite."
                  - "Gegenüber von Süden liegt Norden."
              - id: l2-f6
                type: multiple_choice
                text: "Can schaut morgens genau zur Sonne. In welche Richtung schaut er?"
                options: ["nach Osten", "nach Westen", "nach Süden"]
                answer: "nach Osten"
                hints:
                  - "Wo steht die Sonne am Morgen?"
                  - "Morgens geht die Sonne auf."
                  - "Die Sonne geht im Osten auf. Can schaut nach Osten."

          - support: some
            tasks:
