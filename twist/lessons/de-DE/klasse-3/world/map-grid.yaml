                options: ["C3", "B3", "C2"]
                answer: "C3"
                hints: ["Such das H. Was steht darüber, was steht links davon?"]
              - id: l1-s4
                type: multiple_choice
                text: "Aylin legt einen Finger auf das B oben und einen auf die 1 links. In welchem Planquadrat treffen sich die Finger?"
                options: ["B1", "A1", "B2"]
                answer: "B1"
                hints: ["Der Buchstabe kommt zuerst, die Zahl danach."]
              - id: l1-s5
                type: fill_in_blank
                text: "Aylin schreibt für die Rallye auf, wo die Kirche liegt."
                say: "Aylin schreibt für die Rallye auf, wo die Kirche liegt. Setz den Buchstaben und die Zahl ein."
