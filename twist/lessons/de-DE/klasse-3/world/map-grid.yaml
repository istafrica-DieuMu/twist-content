            show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
