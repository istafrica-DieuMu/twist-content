# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.map-grid
skill: world.space.map-grid
curriculum: de-DE
language: de
title:
  de: Orte mit dem Planquadrat finden
  en: Finding places with grid squares
summary: >
  A town map is cut into squares with letters along the top and numbers
  down the side; every square has a name like C3, letter first. The story:
  class 3b runs a town rally (Stadtrallye) in Lindenau, and Aylin and Finn
  follow the clues on their map. Lesson 1 names the square of a place and
  finds what lies in a named square. Lesson 2 adds a map index
  (Verzeichnis), large things that cover several squares, and moving from
  square to square. It ends with the skill check.
metadata:
  year: klasse-3
  topic: { de: Karten lesen, en: Reading maps }
  ages: [8-10]
  lesson_minutes: 13
  builds_on: [world.space.map-symbols, math.space.plans-maps]
  also_practises: []
  vocabulary: { de: [Planquadrat, Stadtplan, Buchstabe, Zahl, Spalte, Reihe, Verzeichnis, Legende] }
  forms: [text, audio, drawn]
  drawn: [grid, table]
  facets: []
  parts:
    - { id: name, what: { de: das Planquadrat eines Ortes angeben, en: giving the grid square of a place } }
    - { id: find, what: { de: "finden, was in einem Planquadrat liegt", en: finding what lies in a grid square } }
    - { id: rules, what: { de: "wissen, wie man ein Planquadrat liest und schreibt", en: knowing how to read and write a grid square } }
    - { id: move, what: { de: von Planquadrat zu Planquadrat weitergehen, en: moving from one grid square to the next } }
  misconceptions:
    - id: number-first
      what: Writes the number before the letter (3C) or reads the row before the column
      addressed: the Learn screen "Erst der Buchstabe, dann die Zahl"; l1-f1 with feedback, l1-f2, l1-s2, l1-c5, l2-w2; l2-c2, l2-c11 and l2-c12 in the skill check
    - id: one-square-only
      what: Thinks every place lies in exactly one square, even a park or a lake
      addressed: lesson 2 opens with the guess about the lake; l1-s6, l2-f3, l2-s2, l2-s5; l2-c4 and l2-c8
    - id: rows-columns-mixed
      what: Moves to the next number when going right, or to the next letter when going down
      addressed: the Learn screen on moving one square; l2-f4, l2-f5, l2-s1, l2-n3; l2-c16 to l2-c20
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Erst der Buchstabe, dann die Zahl", en: "Letter first, then number" }
    goal:
      de: "Finde Orte auf dem Stadtplan mit dem Planquadrat. Die Kirche zum Beispiel liegt in A2."
      en: "Find places on the town map with grid squares. The church, for example, is in A2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was bedeutet ein kleines Kreuz auf vielen Karten?"
            options: ["eine Kirche", "eine Haltestelle", "einen Parkplatz"]
            answer: "eine Kirche"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was steht im Feld B2?"
            show: { drawn: table, rows: [["", A, B, C], ["1", Schule, Park, Kiosk], ["2", Bank, Brunnen, Kino]] }
            options: ["der Brunnen", "der Park", "die Bank"]
            answer: "der Brunnen"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was heißt „Die Kirche liegt in A2“?"
            say: "Die Klasse 3b macht eine Stadtrallye in Lindenau. Aylin und Finn bekommen einen Stadtplan. Auf ihrem Zettel steht: Die Kirche liegt in A2. Was glaubst du: Was heißt A2?"
            show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
          - text: "Der Plan ist in Kästchen geteilt. Jedes Kästchen heißt Planquadrat."
            say: "Der Stadtplan ist in gleich große Kästchen geteilt. Jedes Kästchen heißt Planquadrat. Oben am Rand stehen Buchstaben: A, B, C, D. Links am Rand stehen Zahlen: 1, 2, 3, 4. So hat jedes Planquadrat einen eigenen Namen."
            show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
          - text: "Erst der Buchstabe, dann die Zahl: A2"
            say: "So findest du A2. Erst der Buchstabe: Leg einen Finger auf das A oben. Dann die Zahl: Leg einen Finger der anderen Hand auf die 2 links. Fahr mit beiden Fingern ins Feld, bis sie sich treffen. Dort ist das kleine Kreuz. Die Kirche liegt in A2."
            show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
          - text: "Die Haltestelle liegt in C3. Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information"
            say: "Es geht auch andersherum. Finn sieht das H für die Haltestelle. Er schaut nach oben: Dort steht C. Er schaut nach links: Dort steht 3. Die Haltestelle liegt also in C3. Man sagt immer zuerst den Buchstaben und dann die Zahl."
            show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
          - text: "Wusstest du? Beim Schach hat jedes Feld einen Namen wie ein Planquadrat."
            say: "Wusstest du? Auch beim Schach hat jedes Feld einen Namen aus einem Buchstaben und einer Zahl, zum Beispiel e4. So können Schachspieler jeden Zug aufschreiben und ein Spiel noch nach vielen Jahren nachspielen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. In welchem Planquadrat liegt der Parkplatz?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
                options: ["A4", "4A", "B4"]
                answer: "A4"
                feedback:
                  "4A": "Das Feld stimmt, aber erst kommt der Buchstabe, dann die Zahl: A4."
                hints:
                  - "Such das P. Schau dann nach oben und nach links."
                  - "Über dem P steht A, links davon steht 4."
                  - "Erst der Buchstabe, dann die Zahl: A4."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Beim Planquadrat nennst du zuerst den Buchstaben und dann die Zahl."
                answer: true
                hints:
                  - "Wie heißt das Planquadrat der Kirche?"
                  - "Die Kirche liegt in A2. Was kommt zuerst?"
                  - "Ja, zuerst der Buchstabe, dann die Zahl."
              - id: l1-f3
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Was liegt in D1?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
                options: ["die Information", "der See", "der Park"]
                answer: "die Information"
                hints:
                  - "Ein Finger auf das D oben, einer auf die 1 links."
                  - "Fahr mit beiden Fingern ins Feld, bis sie sich treffen."
                  - "In D1 steht das i: die Information."
              - id: l1-f4
                type: fill_in_blank
                text: "Wo stehen die Buchstaben und die Zahlen?"
                say: "Wo stehen auf Aylins Stadtplan die Buchstaben und die Zahlen? Setz die passenden Wörter ein."
                frame: "Die Buchstaben stehen _, die Zahlen stehen _."
                options: ["oben", "links", "unten"]
                answer: ["oben", "links"]
                hints:
                  - "Schau auf den gelben Rand des Plans."
                  - "A, B, C und D stehen über dem Plan."
                  - "Die Buchstaben stehen oben, die Zahlen links."
              - id: l1-f5
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Was liegt in C1?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
                options: ["ein Park", "die Haltestelle", "ein See"]
                answer: "ein Park"
                hints:
                  - "Erst das C oben, dann die 1 links."
                  - "Das Feld in C1 ist grün. Was heißt grün in der Legende?"
                  - "Grün heißt Park."
              - id: l1-f6
                type: matching
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Verbinde jeden Ort mit seinem Planquadrat."
