                frame: "Die Kirche liegt in _ _."
                options: ["A", "B", "2", "3"]
                answer: ["A", "2"]
                hints: ["Das Kreuz ist die Kirche. Lies erst oben, dann links ab."]
              - id: l1-s6
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Was liegt in B1 und in C1?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
                options: ["der Park", "der See", "die Kirche"]
                answer: "der Park"
                hints: ["Welche Farbe haben die beiden Felder?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ein neuer Plan. Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Auf der Rallye-Karte steht: „Geht zum Planquadrat C1.“ Was ist dort?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, blue], [2, 2, blue], [2, 3, blue], [2, 4, blue], [4, 4, green]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [3, 1, "+"], [1, 3, "H"], [4, 2, "P"], [1, 1, "i"]] }
                options: ["die Kirche", "der Fluss", "die Information"]
                answer: "die Kirche"
              - id: l1-n2
                type: true_false
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Finn sagt: „Der Parkplatz liegt in D2.“ Stimmt das?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, blue], [2, 2, blue], [2, 3, blue], [2, 4, blue], [4, 4, green]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [3, 1, "+"], [1, 3, "H"], [4, 2, "P"], [1, 1, "i"]] }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Aylin wartet an der Haltestelle. In welchem Planquadrat ist sie?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, blue], [2, 2, blue], [2, 3, blue], [2, 4, blue], [4, 4, green]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [3, 1, "+"], [1, 3, "H"], [4, 2, "P"], [1, 1, "i"]] }
