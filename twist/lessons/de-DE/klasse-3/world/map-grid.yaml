                pairs:
                  - { left: { text: "Kirche" }, right: { text: "A2" } }
                  - { left: { text: "Haltestelle" }, right: { text: "C3" } }
                  - { left: { text: "Information" }, right: { text: "D1" } }
                hints:
                  - "Such jedes Zeichen und lies oben und links ab."
                  - "Das Kreuz ist die Kirche, das H die Haltestelle."
                  - "Kirche A2, Haltestelle C3, Information D1."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Was liegt in A4?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, green], [3, 1, green], [4, 3, blue], [4, 4, blue]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [4, 1, "i"], [1, 2, "+"], [3, 3, "H"], [1, 4, "P"]] }
                options: ["der Parkplatz", "die Kirche", "die Information"]
                answer: "der Parkplatz"
                hints: ["Ein Finger auf das A, einer auf die 4."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Finn schreibt das Planquadrat so: 2A. Das ist richtig."
                answer: false
                feedback:
                  "true": "Erst kommt der Buchstabe, dann die Zahl. Richtig heißt es A2."
                hints: ["Was kommt beim Planquadrat zuerst?"]
              - id: l1-s3
                type: multiple_choice
                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. In welchem Planquadrat liegt die Haltestelle?"
