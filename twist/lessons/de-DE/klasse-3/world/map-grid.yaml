                text: "Legende: blau Wasser, grün Park, + Kirche, H Haltestelle, P Parkplatz, i Information. Die letzte Station ist der Park. In welchem Planquadrat liegt er?"
                show: { drawn: grid, cols: 5, rows: 5, cells: [[1, 0, yellow], [2, 0, yellow], [3, 0, yellow], [4, 0, yellow], [0, 1, yellow], [0, 2, yellow], [0, 3, yellow], [0, 4, yellow], [2, 1, blue], [2, 2, blue], [2, 3, blue], [2, 4, blue], [4, 4, green]], labels: [[1, 0, "A"], [2, 0, "B"], [3, 0, "C"], [4, 0, "D"], [0, 1, "1"], [0, 2, "2"], [0, 3, "3"], [0, 4, "4"], [3, 1, "+"], [1, 3, "H"], [4, 2, "P"], [1, 1, "i"]] }
