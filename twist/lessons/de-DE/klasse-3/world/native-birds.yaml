# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.native-birds
skill: world.nature.native-birds
curriculum: de-DE
language: de
title:
  de: Vögel bei uns
  en: Our local birds
summary: >
  Common birds in Germany, recognised by how they look, and how they get
  through the winter. The story: Emil and his Oma Ruth watch the bird
  feeder from the kitchen window and keep a bird list. Lesson 1 tells
  apart Amsel, Kohlmeise, Blaumeise, Rotkehlchen, Spatz, Buntspecht and
  Elster by colour, beak, size and tail. Lesson 2 sorts migrants (Storch,
  Schwalbe, Kuckuck) from birds that stay (Meisen, Spatz, Buntspecht,
  Elster), and shows how the birds that stay keep warm and what to feed
  them; it ends with the skill check. There are no bird-call recordings
  yet, so the set has no listening tasks, and no pictures of the single
  species, so the birds are named on text cards and described in words.
metadata:
  year: klasse-3
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.animal-classes, world.nature.adaptation]
  also_practises: []
  vocabulary: { de: [Amsel, Kohlmeise, Blaumeise, Rotkehlchen, Spatz, Buntspecht, Elster, Storch, Schwalbe, Kuckuck, Männchen, Weibchen, Zugvogel, Standvogel, aufplustern, Körnerfresser, Futterhaus, Nistkasten] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: recognise, what: { de: "häufige heimische Vögel am Aussehen erkennen", en: recognising common local birds by how they look } }
    - { id: stay-go, what: { de: "Zugvögel und Standvögel unterscheiden und sagen, warum Zugvögel wegfliegen", en: telling migrants from birds that stay and saying why migrants leave } }
    - { id: winter, what: { de: "erklären, wie Vögel im Winter warm bleiben und was man ihnen füttert", en: explaining how birds keep warm in winter and what to feed them } }
  misconceptions:
    - id: black-bird-is-crow
      what: Thinks every black bird is a crow or raven, and every Amsel is black
      addressed: lesson 1 opens with the guess about the black bird with the yellow beak; l1-s2, l1-n1 and l2-c6
    - id: migrate-because-cold
      what: Thinks migrants fly south because they are cold, not because food runs out
      addressed: lesson 2 Learn on the stork and the swallow; l2-f1, l2-n1 and l2-c11
    - id: bread-for-birds
      what: Thinks bread is good bird food
      addressed: the feeding screen in lesson 2; l2-s1, l2-n4 and l2-c18
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wer sitzt am Futterhaus?", en: "Who is at the bird feeder?" }
    goal:
      de: "Erkenne Vögel an Farbe, Schnabel und Schwanz. Die Kohlmeise zum Beispiel hat einen schwarzen Streifen auf dem gelben Bauch."
      en: "Recognise birds by colour, beak and tail. The great tit, for example, has a black stripe on its yellow belly."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ein Tier hat Federn und einen Schnabel. Zu welcher Klasse gehört es?"
            options: ["Vögel", "Säugetiere", "Kriechtiere"]
            answer: "Vögel"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Die Eule hat große Augen, damit sie nachts jagen kann."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Ist ein schwarzer Vogel mit gelbem Schnabel ein Rabe?"
            say: "Emil sitzt mit Oma Ruth am Küchenfenster. Draußen hängt ein Futterhaus, und die beiden schreiben eine Vogelliste. Auf dem Rasen hüpft ein schwarzer Vogel mit einem gelben Schnabel. Emil ruft: Ein Rabe! Was glaubst du: Hat Emil recht?"
          - text: "Nein! Das ist eine Amsel."
            say: "Nein, das ist eine Amsel. Raben und Krähen haben einen schwarzen Schnabel. Die Amsel ist das Männchen. Das Amselweibchen ist braun. Amseln hüpfen über den Rasen und ziehen Regenwürmer aus der Erde."
          - text: "Kohlmeise: gelber Bauch mit schwarzem Streifen"
            say: "Die Kohlmeise hat einen gelben Bauch mit einem schwarzen Streifen in der Mitte, wie eine Krawatte. Ihr Kopf ist schwarz, die Wangen sind weiß."
          - text: "Blaumeise: blaue Kappe und gelber Bauch"
            say: "Die Blaumeise ist etwas kleiner als die Kohlmeise. Oben auf dem Kopf trägt sie eine blaue Kappe. Ihr Bauch ist auch gelb, aber ohne breiten Streifen."
          - text: "Rotkehlchen: orangerote Brust. Spatz: braun und grau."
            say: "Das Rotkehlchen ist klein und rund. Brust und Gesicht sind orangerot, der Rücken ist braun. Der Spatz ist braun und grau. Spatzen leben oft in Gruppen nah bei den Häusern und tschilpen laut."
          - text: "Buntspecht und Elster: beide schwarz-weiß"
            say: "Der Buntspecht ist schwarz-weiß und hat einen roten Fleck unter dem Schwanz. Er klettert am Baumstamm hoch und stützt sich dabei mit seinem Schwanz ab. Mit dem Schnabel klopft er Löcher ins Holz. Die Elster ist auch schwarz-weiß, aber größer, und sie hat einen sehr langen Schwanz."
          - text: "Schau zuerst auf die Farben. Dann auf Schnabel, Größe und Schwanz."
            say: "So erkennst du einen Vogel: Schau zuerst auf die Farben, vor allem an Kopf, Brust und Bauch. Dann auf den Schnabel, die Größe und den Schwanz. Und schau, was er tut: hüpfen, klettern oder klopfen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein kleiner, runder Vogel hat eine orangerote Brust und einen braunen Rücken. Wer ist das?"
                options: ["das Rotkehlchen", "die Amsel", "der Spatz"]
                answer: "das Rotkehlchen"
                hints:
                  - "Schau auf die Farbe der Brust."
                  - "Welcher Vogel hat Rot schon im Namen?"
                  - "Die orangerote Brust hat das Rotkehlchen."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Verbinde jeden Vogel mit seinem Merkmal."
                pairs:
                  - { left: { text: "Amsel" }, right: { text: "schwarz mit gelbem Schnabel" } }
                  - { left: { text: "Kohlmeise" }, right: { text: "gelber Bauch mit schwarzem Streifen" } }
                  - { left: { text: "Buntspecht" }, right: { text: "schwarz-weiß, rot unter dem Schwanz" } }
                hints:
                  - "Fang mit dem Vogel an, den du sicher kennst."
                  - "Die Meise hat einen gelben Bauch, der Specht ist schwarz-weiß."
                  - "Amsel: schwarz mit gelbem Schnabel. Kohlmeise: Streifen. Buntspecht: rot unter dem Schwanz."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Die Blaumeise hat eine blaue Kappe und einen gelben Bauch."
                answer: true
                hints:
                  - "Welche Farbe steckt im Namen?"
                  - "Die Kappe sitzt oben auf dem Kopf."
                  - "Ja: blaue Kappe, gelber Bauch."
              - id: l1-f4
                type: fill_in_blank
                text: "Was sucht die Amsel?"
                say: "Setz das passende Wort ein."
                frame: "Die Amsel zieht auf dem Rasen _ aus der Erde."
                options: ["Regenwürmer", "Nüsse", "Fische"]
                answer: ["Regenwürmer"]
                hints:
                  - "Was lebt im Rasen unter der Erde?"
                  - "Es ist lang, dünn und kriecht."
                  - "Die Amsel zieht Regenwürmer aus der Erde."
              - id: l1-f5
                type: sorting
                text: "Kohlmeise oder Blaumeise?"
                say: "Kohlmeise oder Blaumeise? Ordne jedes Merkmal zu."
                bins:
                  - { id: great, show: { text: "Kohlmeise" }, say: "Kohlmeise" }
                  - { id: blue, show: { text: "Blaumeise" }, say: "Blaumeise" }
                options:
                  - { text: "schwarzer Kopf mit weißen Wangen", bin: great }
                  - { text: "blaue Kappe", bin: blue }
                  - { text: "schwarzer Streifen auf dem Bauch", bin: great }
                  - { text: "die kleinere der beiden", bin: blue }
                hints:
                  - "Beide haben einen gelben Bauch. Schau auf Kopf und Streifen."
                  - "Die Blaumeise hat Blau auf dem Kopf."
                  - "Kohlmeise: schwarzer Kopf, Streifen. Blaumeise: blaue Kappe, kleiner."
              - id: l1-f6
                type: multiple_choice
                text: "Ein schwarz-weißer Vogel klettert am Baumstamm hoch und klopft. Wer ist das?"
                options: ["der Buntspecht", "die Elster", "die Amsel"]
                answer: "der Buntspecht"
                hints:
                  - "Welcher Vogel klopft Löcher ins Holz?"
                  - "Die Elster ist auch schwarz-weiß, aber sie klettert nicht am Stamm."
                  - "Klettern und klopfen: der Buntspecht."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Ein großer schwarz-weißer Vogel hat einen sehr langen Schwanz. Wer ist das?"
                options: ["die Elster", "der Buntspecht", "die Kohlmeise"]
                answer: "die Elster"
                hints: ["Schau auf den Schwanz."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Jede Amsel ist schwarz."
                answer: false
                feedback:
                  "true": "Nur das Amselmännchen ist schwarz. Das Weibchen ist braun."
                hints: ["Denk an Männchen und Weibchen."]
              - id: l1-s3
                type: matching
                text: "Wer ist es? Verbinde."
                pairs:
                  - { left: { text: "Rotkehlchen" }, right: { text: "orangerote Brust" } }
                  - { left: { text: "Spatz" }, right: { text: "braun und grau, oft in Gruppen" } }
                  - { left: { text: "Blaumeise" }, right: { text: "blaue Kappe" } }
                hints: ["Bei zwei Vögeln steckt die Farbe im Namen."]
              - id: l1-s4
                type: multiple_choice
                text: "Woran erkennst du die Kohlmeise?"
                options: ["am schwarzen Streifen auf dem gelben Bauch", "am roten Fleck unter dem Schwanz", "an der orangeroten Brust"]
                answer: "am schwarzen Streifen auf dem gelben Bauch"
                hints: ["Sie trägt etwas wie eine Krawatte."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Der Buntspecht stützt sich beim Klettern mit dem Schwanz ab."
                answer: true
                hints: ["Wie hält er sich am Stamm fest, wenn er klopft?"]
              - id: l1-s6
                type: fill_in_blank
                text: "Welche Farbe fehlt?"
                say: "Setz die passende Farbe ein."
                frame: "Das Rotkehlchen hat eine _ Brust."
                options: ["orangerote", "blaue", "schwarze"]
                answer: ["orangerote"]
                hints: ["Der Name verrät es."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ein brauner Vogel hüpft über den Rasen und zieht einen Wurm heraus. Oma Ruth sagt: „Ihr Mann ist schwarz.“ Wer ist das?"
                options: ["ein Amselweibchen", "ein Rotkehlchen", "eine Elster"]
                answer: "ein Amselweibchen"
              - id: l1-n2
                type: matching
                text: "Emils Vogelliste: Verbinde jeden Namen mit dem, was er gesehen hat."
                pairs:
                  - { left: { text: "Kohlmeise" }, right: { text: "schwarzer Kopf, weiße Wangen" } }
                  - { left: { text: "Blaumeise" }, right: { text: "klein, mit blauer Kappe" } }
                  - { left: { text: "Elster" }, right: { text: "schwarz-weiß, langer Schwanz" } }
                  - { left: { text: "Rotkehlchen" }, right: { text: "rund, orangerote Brust" } }
              - id: l1-n3
                type: true_false
                text: "Emil schreibt: „Blaue Kappe, gelber Bauch: eine Kohlmeise.“ Stimmt das?"
                answer: false
                feedback:
                  "true": "Die blaue Kappe hat die Blaumeise. Die Kohlmeise hat einen schwarzen Kopf."
              - id: l1-n4
                type: multiple_choice
                text: "Auf dem Dach tschilpen viele kleine braune und graue Vögel. Wer ist das?"
                options: ["Spatzen", "Buntspechte", "Rotkehlchen"]
                answer: "Spatzen"
              - id: l1-n5
                type: fill_in_blank
                text: "Was schreibt Emil?"
                say: "Emil schreibt den Buntspecht auf die Liste. Setz das passende Wort ein."
                frame: "Der Buntspecht ist schwarz-weiß mit einem _ Fleck unter dem Schwanz."
                options: ["roten", "blauen", "gelben"]
                answer: ["roten"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Vogel ist ganz schwarz und hat einen gelben Schnabel?"
            options: ["die Amsel", "die Elster", "der Spatz"]
            answer: "die Amsel"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Das Rotkehlchen hat eine blaue Brust."
            answer: false
          - id: l1-c3
            type: matching
            text: "Welcher Vogel hat dieses Merkmal? Verbinde."
            pairs:
              - { left: { text: "langer Schwanz, schwarz-weiß" }, right: { text: "Elster" } }
              - { left: { text: "blaue Kappe" }, right: { text: "Blaumeise" } }
              - { left: { text: "braun und grau" }, right: { text: "Spatz" } }
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Vogel klopft Löcher ins Holz?"
            options: ["der Buntspecht", "die Amsel", "die Blaumeise"]
            answer: "der Buntspecht"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Die Kohlmeise hat einen schwarzen Kopf mit weißen Wangen."
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Welche Farbe fehlt?"
            say: "Setz die passende Farbe ein."
            frame: "Der Spatz ist _ und grau."
            options: ["braun", "rot", "blau"]
            answer: ["braun"]

  - n: 2
    title: { de: "Wer bleibt im Winter?", en: "Who stays for the winter?" }
    goal:
      de: "Finde heraus, welche Vögel im Winter wegfliegen und wie die anderen warm bleiben. Der Storch zum Beispiel fliegt nach Süden."
      en: "Find out which birds fly away in winter and how the others keep warm. The stork, for example, flies south."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Woran erkennst du die Blaumeise?"
            options: ["an der blauen Kappe", "am langen Schwanz", "an der orangeroten Brust"]
            answer: "an der blauen Kappe"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Die Elster ist schwarz-weiß und hat einen langen Schwanz."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wo ist der Storch im Winter?"
            say: "Im Sommer hat Emil auf dem Kirchturm ein Storchennest gesehen. Jetzt ist Januar, und das Nest ist leer. Was glaubst du: Wo ist der Storch?"
            show: { object: church }
          - text: "Er ist nach Süden geflogen, viele Störche bis nach Afrika."
            say: "Der Storch fliegt im Herbst weit nach Süden, viele Störche bis nach Afrika. Hier fände er im Winter zu wenig Futter, denn Frösche, Mäuse und Insekten sind dann kaum zu finden. Im Frühling kommt er zurück zu seinem Nest. Vögel, die im Herbst wegfliegen, heißen Zugvögel."
          - text: "Zugvögel: Storch, Schwalbe, Kuckuck"
            say: "Auch die Schwalbe ist ein Zugvogel. Sie fängt Insekten in der Luft, und im Winter fliegen hier kaum Insekten. Der Kuckuck fliegt ebenfalls bis nach Afrika. Seinen Namen ruft er selbst: Kuckuck!"
          - text: "Standvögel bleiben: Meisen, Spatz, Buntspecht, Elster"
            say: "Andere Vögel bleiben das ganze Jahr hier. Sie heißen Standvögel. Meisen und Spatzen fressen im Winter Samen und Körner. Der Buntspecht klemmt Zapfen in eine Ritze am Baum und holt die Samen heraus."
          - text: "Bei Kälte plustern sich Vögel auf."
            say: "Wenn es kalt ist, plustern sich die Vögel auf. Dann sehen sie dick und rund aus. Zwischen den Federn ist viel Luft, und die Luft hält warm wie eine Daunenjacke. Nachts suchen sie Schutz in Hecken, Baumhöhlen oder Nistkästen."
          - text: "Winterfutter: Körner, Haferflocken, Äpfel. Kein Brot!"
            say: "Oma Ruth füttert im Winter. Körnerfresser wie Meisen und Spatzen mögen Sonnenblumenkerne. Amsel und Rotkehlchen fressen lieber weiches Futter, zum Beispiel Haferflocken und Äpfel. Brot ist nicht gut für Vögel, es quillt im Magen auf."
          - text: "Wusstest du? Der Kuckuck legt seine Eier in die Nester anderer Vögel."
            say: "Wusstest du? Der Kuckuck legt seine Eier in die Nester anderer Vögel. Die fremden Vogeleltern brüten das Ei aus und füttern das Kuckucksküken, obwohl es bald viel größer ist als sie selbst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum fliegt die Schwalbe im Herbst nach Süden?"
                options: ["Im Winter gibt es hier kaum Insekten für sie.", "Ihr ist der Schnee zu hell.", "Sie macht Ferien am Strand."]
                answer: "Im Winter gibt es hier kaum Insekten für sie."
                feedback:
                  "Sie macht Ferien am Strand.": "Mit Sonnenbrille? Lustige Idee! Aber sie fliegt weg, weil sie Futter braucht."
                hints:
                  - "Was frisst die Schwalbe?"
                  - "Sie fängt Insekten in der Luft. Fliegen im Winter hier Insekten?"
                  - "Im Winter gibt es kaum Insekten, darum fliegt sie weg."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Zugvogel oder Standvogel?"
                say: "Emil sortiert seine Liste. Zugvogel oder Standvogel?"
                bins:
                  - { id: go, show: { text: "Zugvogel: fliegt weg" }, say: "Zugvogel, fliegt weg" }
                  - { id: stay, show: { text: "Standvogel: bleibt hier" }, say: "Standvogel, bleibt hier" }
                options:
                  - { text: "Storch", bin: go }
                  - { text: "Kohlmeise", bin: stay }
                  - { text: "Schwalbe", bin: go }
                  - { text: "Spatz", bin: stay }
                  - { text: "Kuckuck", bin: go }
                  - { text: "Buntspecht", bin: stay }
                hints:
                  - "Wer frisst Insekten oder Frösche, wer findet im Winter Körner und Samen?"
                  - "Storch, Schwalbe und Kuckuck fliegen bis nach Afrika."
                  - "Zugvögel: Storch, Schwalbe, Kuckuck. Standvögel: Kohlmeise, Spatz, Buntspecht."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Wenn ein Vogel sich aufplustert, hält ihn die Luft zwischen den Federn warm."
                answer: true
                hints:
                  - "Denk an eine Daunenjacke."
                  - "Zwischen den Federn ist dann viel Luft."
                  - "Ja, die Luft hält warm."
              - id: l2-f4
                type: multiple_choice
                text: "Was ist ein gutes Winterfutter für Meisen?"
                options: ["Sonnenblumenkerne", "Brot", "Schokolade"]
                answer: "Sonnenblumenkerne"
                hints:
                  - "Meisen sind Körnerfresser."
                  - "Brot quillt im Magen auf, Schokolade ist für Menschen."
                  - "Sonnenblumenkerne sind gut für Meisen."
              - id: l2-f5
                type: matching
                text: "Wer frisst was im Winter? Verbinde."
                pairs:
                  - { left: { text: "Kohlmeise" }, right: { text: "Sonnenblumenkerne" } }
                  - { left: { text: "Amsel" }, right: { text: "Haferflocken und Äpfel" } }
                  - { left: { text: "Buntspecht" }, right: { text: "Samen aus Zapfen" } }
                hints:
                  - "Wer mag Körner, wer weiches Futter?"
                  - "Der Specht klemmt Zapfen in eine Ritze."
                  - "Kohlmeise: Kerne. Amsel: Haferflocken und Äpfel. Buntspecht: Samen aus Zapfen."
              - id: l2-f6
                type: multiple_choice
                text: "Wohin fliegen viele Störche im Herbst?"
                options: ["bis nach Afrika", "zum Nordpol", "in den Keller"]
                answer: "bis nach Afrika"
                feedback:
                  "zum Nordpol": "Dort ist es im Winter noch kälter, und Frösche gibt es da auch nicht."
                hints:
                  - "Sie fliegen nach Süden."
                  - "Dort ist es warm, und es gibt Futter."
                  - "Viele Störche fliegen bis nach Afrika."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Brot ist ein gutes Futter für Vögel."
                answer: false
                feedback:
                  "true": "Brot quillt im Vogelmagen auf. Besser sind Körner, Haferflocken und Äpfel."
                hints: ["Was passiert mit Brot im Magen eines Vogels?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie heißen Vögel, die das ganze Jahr hier bleiben?"
                options: ["Standvögel", "Zugvögel", "Seevögel"]
                answer: "Standvögel"
                hints: ["Sie bleiben an ihrem Platz stehen."]
              - id: l2-s3
                type: sorting
                text: "Körner oder weiches Futter?"
                bins:
                  - { id: seeds, show: { text: "mag Körner" }, say: "mag Körner" }
                  - { id: soft, show: { text: "mag weiches Futter" }, say: "mag weiches Futter" }
                options:
                  - { text: "Kohlmeise", bin: seeds }
                  - { text: "Amsel", bin: soft }
                  - { text: "Spatz", bin: seeds }
                  - { text: "Rotkehlchen", bin: soft }
                hints: ["Amsel und Rotkehlchen mögen Haferflocken und Äpfel."]
              - id: l2-s4
                type: multiple_choice
                text: "Wo schläft eine Meise in einer kalten Winternacht?"
                options: ["in einer Baumhöhle oder einem Nistkasten", "oben auf dem Futterhaus im Wind", "in Afrika"]
                answer: "in einer Baumhöhle oder einem Nistkasten"
                hints: ["Wo ist sie vor Wind und Kälte geschützt?"]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Der Kuckuck brütet seine Eier selbst aus."
                answer: false
                hints: ["In wessen Nester legt er seine Eier?"]
              - id: l2-s6
                type: multiple_choice
                text: "Was macht der Buntspecht im Winter?"
                options: ["Er holt Samen aus Zapfen.", "Er fliegt nach Afrika.", "Er hält Winterschlaf."]
                answer: "Er holt Samen aus Zapfen."
                hints: ["Er ist ein Standvogel. Was frisst er?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Oma Ruth sagt: „Im Frühling kommt der Storch zurück.“ Warum kommt er erst dann?"
                options: ["Dann findet er hier wieder genug Futter.", "Dann ist sein Urlaub vorbei.", "Dann hat er Geburtstag."]
                answer: "Dann findet er hier wieder genug Futter."
              - id: l2-n2
                type: sorting
                text: "Emil zählt im Januar. Wen kann er sehen?"
