# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.vehicles
skill: world.technology.vehicles
curriculum: de-DE
language: de
title:
  de: Was bewegt Fahrzeuge?
  en: What makes vehicles move?
summary: >
  Vehicles are moved by muscle power, wind, an engine that burns petrol
  or diesel, or an electric motor. The story: Mila and Opa Hans make a
  trip to the lake by tram, bike, rowing boat and past the sailing boats.
  Lesson 1 sorts vehicles by what drives them: the tram takes electricity
  from the overhead wire, the bike runs on your muscles (pedals on cranks
  turn a sprocket, the chain turns the back wheel), the sailing boat on
  wind, the car on petrol or diesel. Lesson 2 adds the electric car with
  its battery and compares the drives: what each needs, exhaust, noise,
  weather, and which vehicle suits which journey; it ends with the skill
  check. Electricity is not free of side effects: it depends on how the
  power station makes it.
metadata:
  year: klasse-3
  topic: { de: Wie Technik funktioniert, en: How things work }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.technology.lever-wheel]
  also_practises: []
  vocabulary: { de: [Fahrzeug, Antrieb, Muskelkraft, Wind, Segel, Motor, Elektromotor, Benzin, Diesel, Tank, Abgase, Strom, Akku, Ladesäule, Oberleitung, Straßenbahn, Pedal, Kurbel, Zahnrad, Kette, Hinterrad] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: drive, what: { de: "sagen, was ein Fahrzeug antreibt", en: "saying what drives a vehicle" } }
    - { id: energy, what: { de: "sagen, was jeder Antrieb braucht (Essen, Wind, Benzin oder Diesel, Strom)", en: "saying what each drive needs (food, wind, petrol or diesel, electricity)" } }
    - { id: compare, what: { de: "Antriebe vergleichen (Abgase, Lärm, Wetter, wofür sie passen)", en: "comparing drives (exhaust, noise, weather, what they suit)" } }
    - { id: bike, what: { de: "erklären, wie die Kraft beim Fahrrad zum Hinterrad kommt", en: "explaining how the force gets to the back wheel of a bike" } }
  misconceptions:
    - id: every-vehicle-has-tank
      what: Thinks every vehicle with a motor runs on petrol, so a tram or train must have a tank
      addressed: lesson 1 opens with the guess about where the tram gets its power; l1-f4, l1-s4, l1-c5, l2-c2, l2-c9
    - id: electric-no-effects
      what: Thinks an electric car causes no exhaust anywhere, whatever makes the electricity
      addressed: the screen on where electricity comes from in lesson 2; l2-s3, l2-n3
    - id: chain-front-wheel
      what: Thinks the pedals turn the front wheel of a bike
      addressed: the bike screen in lesson 1; l1-f5, l1-s5, l1-c4, l2-c16, l2-c20
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Muskeln, Wind, Motor, Strom", en: "Muscles, wind, engine, electricity" }
    goal:
      de: "Finde heraus, was ein Fahrzeug antreibt. Das Segelboot zum Beispiel fährt mit Wind."
      en: "Find out what makes a vehicle move. The sailing boat, for example, runs on wind."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Warum hat ein Bollerwagen Räder?"
            options: ["Räder rollen und sparen Kraft.", "Räder machen ihn schwerer.", "Räder sehen lustig aus."]
            answer: "Räder rollen und sparen Kraft."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Mit einem Hebel brauchst du weniger Kraft, wenn du weit weg vom Drehpunkt drückst."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Woher bekommt die Straßenbahn ihre Kraft?"
            say: "Mila und Opa Hans machen einen Ausflug an den See. Zuerst fahren sie mit der Straßenbahn. Mila sucht den Tank, aber die Straßenbahn hat keinen. Was glaubst du: Woher bekommt die Straßenbahn ihre Kraft?"
            show: { object: tram }
          - text: "Aus der Leitung über ihr: Strom!"
            say: "Über den Schienen hängt ein Draht, die Oberleitung. Ein Bügel auf dem Dach der Straßenbahn berührt den Draht, und so fließt Strom zum Elektromotor. Der Motor dreht die Räder. Auch viele Züge fahren so, mit Strom aus der Oberleitung."
            show: { object: tram }
          - text: "Muskelkraft: Du bist der Antrieb."
            say: "Am See leihen sich Mila und Opa ein Fahrrad und ein Ruderboot. Hier treiben deine Muskeln das Fahrzeug an. Du trittst in die Pedale oder ziehst an den Rudern. Auch eine Kutsche fährt mit Muskelkraft, mit der Kraft der Pferde. Die Energie für die Muskeln kommt aus dem Essen."
            show: { object: bike }
          - text: "Beim Fahrrad bringt die Kette die Kraft zum Hinterrad."
            say: "Beim Fahrrad drückst du mit den Füßen auf die Pedale. Die Pedale sitzen an Kurbeln, und die wirken wie Hebel. Sie drehen ein Zahnrad. Die Kette bringt die Drehung nach hinten zum Hinterrad, und das Fahrrad rollt los."
            show: { object: bike }
          - text: "Wind: Er schiebt das Segelboot."
            say: "Auf dem See fahren Segelboote. Der Wind drückt gegen das Segel und schiebt das Boot. Es braucht keinen Tank und keinen Strom. Aber ohne Wind bleibt es liegen."
            show: { object: boat }
          - text: "Motor: Er verbrennt Benzin oder Diesel."
            say: "Opas Auto hat einen Motor und einen Tank. Im Motor verbrennt Benzin oder Diesel, und das dreht die Räder. Auch Lastwagen, viele Busse und große Schiffe fahren mit Diesel. Beim Verbrennen entstehen Abgase."
            show: { object: car }
          - text: "Wusstest du? Das erste Fahrrad hatte keine Pedale."
            say: "Wusstest du? Das erste Fahrrad hatte keine Pedale. Karl Drais hat es vor mehr als 200 Jahren in Mannheim gebaut. Man stieß sich mit den Füßen vom Boden ab, wie mit einem Laufrad."
            show: { object: balance-bike }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Fahrzeug fährt mit Muskelkraft?"
                options:
                  - { object: bike }
                  - { object: car }
                  - { object: bus }
                answer: bike
                hints:
                  - "Bei welchem Fahrzeug musst du selbst treten?"
                  - "Auto und Bus haben einen Motor."
                  - "Das Fahrrad fährt mit Muskelkraft."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was treibt ein Segelboot an?"
                show: { object: boat }
                options: ["der Wind", "ein Motor mit Benzin", "Strom aus der Oberleitung"]
                answer: "der Wind"
                hints:
                  - "Wogegen drückt etwas beim Segelboot?"
                  - "Es hat ein großes Segel und keinen Tank."
                  - "Der Wind schiebt das Segelboot."
                difficulty: easy
              - id: l1-f3
                type: sorting
                text: "Was treibt es an?"
                say: "Sortiere jedes Fahrzeug nach seinem Antrieb."
                bins:
                  - { id: muscle, show: { text: "Muskelkraft" }, say: "Muskelkraft" }
                  - { id: wind, show: { text: "Wind" }, say: "Wind" }
                  - { id: fuel, show: { text: "Benzin oder Diesel" }, say: "Benzin oder Diesel" }
                  - { id: electric, show: { text: "Strom" }, say: "Strom" }
                options:
                  - { object: bike, bin: muscle }
                  - { object: boat, bin: wind }
                  - { text: "Auto mit Benzintank", bin: fuel }
                  - { object: tram, bin: electric }
                  - { object: rowing-boat, bin: muscle }
                  - { text: "Lastwagen mit Dieseltank", bin: fuel }
                hints:
                  - "Frag bei jedem Fahrzeug: Treten, Segel, Tank oder Leitung?"
                  - "Das Ruderboot ziehst du mit den Armen voran. Die Straßenbahn hat eine Oberleitung."
                  - "Muskelkraft: Fahrrad, Ruderboot. Wind: Segelboot. Benzin oder Diesel: Auto, Lastwagen. Strom: Straßenbahn."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Die Straßenbahn hat einen großen Benzintank."
                show: { object: tram }
                answer: false
                feedback:
                  "true": "Die Straßenbahn hat keinen Tank. Sie bekommt Strom aus der Oberleitung."
                hints:
                  - "Mila hat den Tank gesucht."
                  - "Was hängt über den Schienen?"
                  - "Die Straßenbahn fährt mit Strom, nicht mit Benzin."
              - id: l1-f5
                type: ordering
                text: "Wie kommt die Kraft beim Fahrrad zum Rad?"
                say: "Wie kommt die Kraft beim Fahrrad zum Rad? Leg die Karten in die richtige Reihenfolge."
                options: ["Die Kette dreht das Hinterrad.", "Deine Füße treten die Pedale.", "Das Fahrrad rollt los.", "Die Pedale drehen das Zahnrad."]
                slot_count: 4
                answer: ["Deine Füße treten die Pedale.", "Die Pedale drehen das Zahnrad.", "Die Kette dreht das Hinterrad.", "Das Fahrrad rollt los."]
                hints:
                  - "Alles beginnt bei dir."
                  - "Von den Füßen geht es über die Pedale und das Zahnrad zur Kette."
                  - "Füße, Pedale, Kette, losrollen."
              - id: l1-f6
                type: matching
                text: "Verbinde jedes Fahrzeug mit seinem Antrieb."
                pairs:
                  - { left: { object: rowing-boat }, right: { text: "Muskelkraft" } }
                  - { left: { object: boat }, right: { text: "Wind" } }
                  - { left: { object: tram }, right: { text: "Strom" } }
                  - { left: { text: "Auto mit Benzintank" }, right: { text: "Motor mit Benzin" } }
                hints:
                  - "Wer rudert, wer segelt, wer hat eine Leitung, wer einen Tank?"
                  - "Das Segelboot fährt ohne Tank und ohne Leitung."
                  - "Ruderboot: Muskelkraft. Segelboot: Wind. Straßenbahn: Strom. Auto: Benzin."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was braucht ein Auto mit Benzinmotor, damit es fährt?"
                show: { object: car }
                options: ["Benzin im Tank", "Wind im Segel", "eine Oberleitung"]
                answer: "Benzin im Tank"
                hints: ["Wohin fährt Opa, wenn sein Tank leer ist?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Eine Pferdekutsche fährt mit Muskelkraft."
                show: { object: horse-carriage }
                answer: true
                hints: ["Wer zieht die Kutsche?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welches Fahrzeug bleibt ohne Wind liegen?"
                options:
                  - { object: boat }
                  - { object: car }
                  - { object: bike }
                answer: boat
                hints: ["Welches Fahrzeug hat ein Segel?"]
              - id: l1-s4
                type: multiple_choice
                text: "Woher holt die Straßenbahn ihren Strom?"
                show: { object: tram }
                options: ["aus der Oberleitung über den Schienen", "aus einem Benzintank", "vom Wind"]
                answer: "aus der Oberleitung über den Schienen"
                hints: ["Schau nach oben über die Schienen."]
              - id: l1-s5
                type: fill_in_blank
                text: "So fährt das Fahrrad."
                say: "Setz die passenden Wörter ein."
                frame: "Beim Fahrrad bringt die _ die Kraft von den Pedalen zum _."
                options: ["Kette", "Klingel", "Hinterrad", "Lenker"]
                answer: ["Kette", "Hinterrad"]
                hints: ["Die Kette läuft nach hinten."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? Beim Verbrennen von Benzin entstehen Abgase."
                answer: true
                hints: ["Was kommt hinten aus dem Auspuff?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Heute ist kein Wind am See. Mila will trotzdem aufs Wasser, ohne Motor. Was nimmt sie?"
                options:
                  - { object: rowing-boat }
                  - { object: boat }
                  - { object: motorboat }
                answer: rowing-boat
                feedback:
                  boat: "Ohne Wind bleibt das Segelboot liegen. Mila müsste pusten!"
              - id: l1-n2
                type: sorting
                text: "Mila und Opa zählen die Fahrzeuge am See."
                say: "Mila und Opa zählen die Fahrzeuge am See. Was treibt jedes an? Sortiere."
                bins:
                  - { id: muscle, show: { text: "Muskelkraft" }, say: "Muskelkraft" }
                  - { id: wind, show: { text: "Wind" }, say: "Wind" }
                  - { id: motor, show: { text: "Motor" }, say: "Motor" }
                options:
                  - { object: pedal-boat, bin: muscle }
                  - { object: motorboat, bin: motor }
                  - { object: boat, bin: wind }
                  - { object: bike, bin: muscle }
                  - { object: windsurf-board, bin: wind }
                  - { object: lorry, bin: motor }
              - id: l1-n3
                type: true_false
                text: "Mila sagt: „Das Fahrrad braucht einen Tank, sonst fährt es nicht.“ Stimmt das?"
                show: { object: bike }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Auf dem Heimweg tankt Opa an der Tankstelle. Was für einen Antrieb hat sein Auto?"
                show: { object: petrol-pump }
                options: ["einen Motor mit Benzin oder Diesel", "Muskelkraft", "Wind"]
                answer: "einen Motor mit Benzin oder Diesel"
              - id: l1-n5
                type: fill_in_blank
                text: "Milas Ausflug"
                say: "Setz die passenden Wörter ein."
                frame: "Die Straßenbahn fährt mit _. Das Segelboot fährt mit _."
                options: ["Strom", "Wind", "Benzin"]
                answer: ["Strom", "Wind"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was treibt ein Ruderboot an?"
            show: { object: rowing-boat }
            options: ["Muskelkraft", "Wind", "Strom"]
            answer: "Muskelkraft"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Segelboot braucht Benzin."
            show: { object: boat }
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Welches Fahrzeug hat einen Motor?"
            options:
              - { object: car }
              - { object: bike }
              - { object: boat }
            answer: car
          - id: l1-c4
            type: multiple_choice
            text: "Was bringt beim Fahrrad die Kraft zum Hinterrad?"
            show: { object: bike }
            options: ["die Kette", "die Klingel", "der Sattel"]
            answer: "die Kette"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Viele Züge fahren mit Strom aus der Oberleitung."
            show: { object: train }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Woher kommt die Energie für deine Muskeln?"
            options: ["aus dem Essen", "aus der Steckdose", "aus dem Tank"]
            answer: "aus dem Essen"

  - n: 2
    title: { de: "Antriebe vergleichen", en: "Comparing drives" }
    goal:
      de: "Vergleiche Fahrzeuge: Was brauchen sie, und was kommt heraus? Ein Elektroauto zum Beispiel ist leise und macht beim Fahren keine Abgase."
      en: "Compare vehicles: what do they need, and what comes out? An electric car, for example, is quiet and makes no exhaust while driving."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Welches Fahrzeug fährt mit Wind?"
            options:
              - { object: boat }
              - { object: bus }
              - { object: bike }
            answer: boat
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Womit fährt die Straßenbahn?"
            show: { object: tram }
            options: ["mit Strom aus der Oberleitung", "mit Benzin", "mit Muskelkraft"]
            answer: "mit Strom aus der Oberleitung"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Warum hört Mila dieses Auto kaum?"
            say: "Auf dem Parkplatz am See rollt ein Auto langsam an Mila vorbei. Sie hört kaum etwas, nur ein leises Summen. Was glaubst du: Was für ein Auto ist das?"
            show: { object: car }
          - text: "Ein Elektroauto: Es fährt mit Strom aus einem Akku."
            say: "Es ist ein Elektroauto. Statt eines Tanks hat es einen großen Akku. Der Akku wird an einer Ladesäule mit Strom geladen, so ähnlich wie ein Handy. Der Elektromotor ist leise, und beim Fahren kommen keine Abgase aus dem Auto."
            show: { object: car }
          - text: "Wusstest du? Neue Elektroautos müssen beim langsamen Fahren extra ein Geräusch machen."
            say: "Wusstest du? Neue Elektroautos müssen beim langsamen Fahren extra ein Geräusch machen, damit Menschen auf der Straße sie kommen hören. Das ist besonders für blinde Menschen wichtig. Und für dich heißt das: Bevor du über die Straße gehst, schau immer nach links und rechts. Hören allein reicht nicht."
            show: { object: electric-car }
          - text: "Woher kommt der Strom?"
            say: "Auch Strom muss erst irgendwo gemacht werden. Kommt er aus Wind oder Sonne, entstehen dabei keine Abgase. Kommt er aus einem Kraftwerk, das Kohle verbrennt, entstehen Abgase im Kraftwerk. Darum ist es wichtig, woher der Strom kommt."
            show: { object: sun }
          - text: "Vergleichen: Was braucht es, was kommt heraus?"
            say: "Mila und Opa vergleichen. Fahrrad und Ruderboot brauchen nur deine Muskeln. Sie machen keine Abgase und halten dich fit, aber sie sind langsamer. Das Segelboot braucht nur Wind, aber es hängt vom Wetter ab. Ein Motor mit Benzin oder Diesel ist stark und fährt weit, aber er ist laut und macht Abgase. Ein Elektromotor ist leise und macht beim Fahren keine Abgase, aber sein Akku muss geladen werden."
          - text: "Das passende Fahrzeug für jeden Weg"
            say: "Zum Bäcker um die Ecke nimmst du am besten das Fahrrad, oder du gehst zu Fuß. Für viele schwere Kisten braucht man einen Lastwagen. Für eine weite Reise ist der Zug gut."
            show: { object: lorry }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wo lädt man den Akku eines Elektroautos?"
                show: { object: electric-car }
                options: ["an einer Ladesäule", "an der Zapfsäule für Benzin", "am Segel"]
                answer: "an einer Ladesäule"
                hints:
                  - "Ein Akku braucht Strom."
                  - "An der Zapfsäule gibt es Benzin, kein Strom."
                  - "An einer Ladesäule."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Aus einem Elektroauto kommen beim Fahren keine Abgase."
                show: { object: electric-car }
                answer: true
                hints:
                  - "Verbrennt ein Elektromotor etwas?"
                  - "Abgase entstehen, wenn Benzin oder Diesel verbrennt."
                  - "Ja, beim Fahren kommen keine Abgase heraus."
              - id: l2-f3
                type: sorting
                text: "Abgase beim Fahren oder keine?"
                say: "Sortiere. Welche Fahrzeuge machen beim Fahren Abgase, welche nicht?"
                bins:
                  - { id: exhaust, show: { text: "macht Abgase" }, say: "macht Abgase" }
                  - { id: clean, show: { text: "macht keine Abgase" }, say: "macht keine Abgase" }
                options:
                  - { object: bike, bin: clean }
                  - { text: "Auto mit Benzintank", bin: exhaust }
                  - { object: tram, bin: clean }
                  - { text: "Lastwagen mit Dieseltank", bin: exhaust }
                  - { object: boat, bin: clean }
                  - { object: electric-car, bin: clean }
                hints:
                  - "Abgase entstehen, wenn etwas verbrennt."
                  - "Benzin und Diesel verbrennen. Muskeln, Wind und Strom nicht."
                  - "Abgase: Auto mit Benzintank, Lastwagen. Keine: Fahrrad, Straßenbahn, Segelboot, Elektroauto."
              - id: l2-f4
                type: multiple_choice
                text: "Was ist ein Nachteil vom Segelboot?"
                show: { object: boat }
                options: ["Ohne Wind fährt es nicht.", "Es macht viele Abgase.", "Es braucht Benzin."]
                answer: "Ohne Wind fährt es nicht."
                hints:
                  - "Was braucht das Segelboot?"
                  - "Es braucht nur Wind, aber der weht nicht immer."
                  - "Ohne Wind bleibt es liegen."
              - id: l2-f5
                type: matching
                text: "Was braucht jeder Antrieb? Verbinde."
                pairs:
                  - { left: { text: "Muskelkraft" }, right: { text: "Essen" } }
                  - { left: { text: "Segel" }, right: { text: "Wind" } }
                  - { left: { text: "Benzinmotor" }, right: { text: "Benzin im Tank" } }
                  - { left: { text: "Elektromotor" }, right: { text: "Strom aus Akku oder Leitung" } }
                hints:
                  - "Woher bekommt jeder Antrieb seine Energie?"
                  - "Deine Muskeln bekommen ihre Energie aus dem Essen."
                  - "Muskeln: Essen. Segel: Wind. Benzinmotor: Benzin. Elektromotor: Strom."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? Ein Motor mit Diesel ist leise und macht keine Abgase."
                answer: false
                feedback:
                  "true": "Ein Dieselmotor verbrennt Diesel. Er ist laut, und es entstehen Abgase."
                hints:
                  - "Was passiert im Dieselmotor?"
                  - "Diesel verbrennt."
                  - "Beim Verbrennen entstehen Abgase. Der Satz stimmt nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welches Fahrzeug hält dich beim Fahren fit?"
                options:
                  - { object: bike }
                  - { object: car }
                  - { object: bus }
                answer: bike
                hints: ["Bei welchem Fahrzeug arbeiten deine Muskeln?"]
              - id: l2-s2
                type: multiple_choice
                text: "Mila hört das Elektroauto kaum. Warum?"
                show: { object: electric-car }
                options: ["Der Elektromotor ist leise.", "Das Auto hat keine Räder.", "Mila hat Watte in den Ohren."]
                answer: "Der Elektromotor ist leise."
                feedback:
                  "Mila hat Watte in den Ohren.": "Nein, Mila hört gut. Der Elektromotor ist einfach sehr leise."
                hints: ["Was ist leiser: ein Elektromotor oder ein Benzinmotor?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Strom für Elektroautos kann aus Wind und Sonne kommen."
                show: { object: electric-car }
                answer: true
                hints: ["Woher kann Strom kommen?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Das Elektroauto"
                say: "Setz das passende Wort ein."
                frame: "Ein Elektroauto hat statt eines Tanks einen _."
                options: ["Akku", "Segel", "Ruder"]
                answer: ["Akku"]
                hints: ["Auch ein Handy hat so einen."]
              - id: l2-s5
                type: sorting
                text: "Was ist gut am Fahrrad, was nicht so gut?"
                say: "Was ist gut am Fahrrad, was ist nicht so gut? Sortiere."
                bins:
                  - { id: plus, show: { text: "Vorteil" }, say: "Vorteil" }
                  - { id: minus, show: { text: "Nachteil" }, say: "Nachteil" }
                options:
                  - { text: "macht keine Abgase", bin: plus }
                  - { text: "hält dich fit", bin: plus }
                  - { text: "langsamer als ein Auto", bin: minus }
                  - { text: "wenig Platz für schwere Kisten", bin: minus }
                hints: ["Ist das gut oder eher schlecht, wenn du Fahrrad fährst?"]
              - id: l2-s6
