# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.sources
skill: world.time.sources
curriculum: de-DE
language: de
title:
  de: Die Kiste vom Dachboden
  en: The box from the attic
summary: >
  Emil and his Oma Ruth find an old box in the attic. Lesson 1 says what a
  source (Quelle) is, anything left from the time it tells about, and
  sorts the four kinds the Grundschule uses: Bildquellen (photos,
  paintings), Schriftquellen (letters, diaries, newspapers), Sachquellen
  (objects, even houses) and Zeitzeugen, people who were there and tell
  about it. Lesson 2 asks what each source tells and what it cannot: a
  photo shows one moment and not what people thought (and old photos are
  black and white, the world was not), a letter tells one person's
  thoughts, an object shows how it was made and used, a Zeitzeuge can be
  asked questions but may forget after many years, so sources are
  compared. Something made today about the past (a film, a comic) is not a
  source from back then. It ends with the skill check. Story grandparents
  only; no task assumes the child has a grandparent or a box of old
  things.
metadata:
  year: klasse-3
  topic: { de: Geschichte entdecken, en: Exploring history }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.time.then-now]
  also_practises: []
  vocabulary: { de: [Quelle, Bildquelle, Schriftquelle, Sachquelle, Zeitzeuge, Zeitzeugin, Brief, Tagebuch, Zeitung, Gemälde, Dachboden, erinnern] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: kinds, what: { de: "Bild-, Schrift- und Sachquellen und Zeitzeugen unterscheiden", en: "telling picture, written and object sources and eyewitnesses apart" } }
    - { id: tells, what: { de: "sagen, was eine Quelle verrät und was nicht", en: "saying what a source tells us and what it does not" } }
    - { id: witness, what: { de: "Zeitzeugen befragen und ihre Erinnerung prüfen", en: "asking an eyewitness questions and checking their memory" } }
    - { id: then, what: { de: "eine Quelle von damals von etwas unterscheiden, das heute über früher gemacht wurde", en: "telling a source from back then from something made today about the past" } }
  misconceptions:
    - id: only-books
      what: Thinks only written texts can tell us about the past
      addressed: "lesson 1 Learn shows four kinds of source; l1-s5, l1-n2 and l2-c20"
    - id: black-white-world
      what: Thinks the world was black and white because old photos are
      addressed: "lesson 2 opens with the guess about Oma's photo; l2-f2 and l2-c9"
    - id: memory-perfect
      what: Thinks a Zeitzeuge always remembers exactly how it was
      addressed: "lesson 2 Learn says memories change after many years; l2-f5, l2-s5, l2-n5 and l2-c13"
    - id: new-about-old
      what: Thinks a film or comic made today about the past is a source from that time
      addressed: "lesson 2 Learn on Emil's knight film; l2-f6, l2-s1, l2-n2, l2-c17 and l2-c18"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Vier Arten von Quellen", en: "Four kinds of sources" }
    goal:
      de: "Finde heraus, was eine Quelle ist, und ordne Quellen. Ein alter Brief ist eine Schriftquelle."
      en: "Find out what a source is and sort sources. An old letter is a written source."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was gab es noch nicht, als die Großeltern Kinder waren?"
            options: ["Handys", "Murmeln", "Bälle"]
            answer: "Handys"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Ein Sachbuch zeigt, wie es wirklich war."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wie finden wir heraus, wie Oma als Kind gelebt hat?"
            say: "Emil und seine Oma Ruth finden auf dem Dachboden eine alte Kiste. Oma war vor vielen Jahrzehnten ein Kind. Was glaubst du: Wie können wir herausfinden, wie sie damals gelebt hat?"
            show: { object: grandma }
          - text: "Mit Quellen!"
            say: "Mit Quellen! Alles, was aus einer alten Zeit übrig ist und uns von ihr erzählt, nennt man eine Quelle. In Omas Kiste liegen viele Quellen. Geschichtsforscher arbeiten genauso: Sie suchen Quellen und finden so heraus, wie es früher war."
          - text: "Bildquellen: Fotos und Gemälde"
            say: "Ganz oben liegt ein schwarz-weißes Foto von Omas Schulklasse. Fotos, Gemälde und Zeichnungen von früher sind Bildquellen. Sie zeigen, wie Menschen und Dinge damals aussahen."
          - text: "Schriftquellen: Briefe, Tagebücher, Zeitungen"
            say: "Darunter liegt ein Brief von Omas Brieffreundin. Briefe, Tagebücher, Zeitungen und Zeugnisse von früher sind Schriftquellen. Jemand hat sie damals geschrieben."
          - text: "Sachquellen: Gegenstände von früher"
            say: "Dann findet Emil Omas Jo-Jo aus Holz und ein altes Telefon. Gegenstände von früher sind Sachquellen: Spielzeug, Werkzeug, Geschirr, Kleidung, sogar ganze Häuser."
            show: { objects: [yo-yo, telephone] }
          - text: "Zeitzeugen erzählen, was sie selbst erlebt haben."
            say: "Und dann erzählt Oma, wie sie früher mit ihren Freundinnen Gummitwist gespielt hat. Ein Mensch, der damals selbst dabei war und davon erzählt, heißt Zeitzeuge oder Zeitzeugin. Oma ist eine Zeitzeugin."
            show: { object: grandma }
          - text: "Wusstest du? Für das älteste Foto, das es noch gibt, musste die Kamera viele Stunden lang offen bleiben."
            say: "Wusstest du? Für das älteste Foto, das es noch gibt, musste die Kamera viele Stunden lang offen bleiben. Es wurde um das Jahr 1827 in Frankreich gemacht und zeigt den Blick aus einem Fenster. Heute dauert ein Foto nur einen winzigen Augenblick."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ein Brief von früher ist …"
                say: "Was für eine Quelle ist ein Brief von früher?"
                options: ["eine Schriftquelle", "eine Bildquelle", "eine Sachquelle"]
                answer: "eine Schriftquelle"
                hints:
                  - "Wie ist ein Brief gemacht?"
                  - "Einen Brief hat jemand geschrieben."
                  - "Was geschrieben ist, ist eine Schriftquelle."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Omas altes Jo-Jo ist eine Sachquelle."
                show: { object: yo-yo }
                answer: true
                hints:
                  - "Ist das Jo-Jo ein Bild, ein Text oder ein Gegenstand?"
                  - "Gegenstände von früher sind Sachquellen."
                  - "Ja, das Jo-Jo ist eine Sachquelle."
              - id: l1-f3
                type: sorting
                text: "Was liegt in Omas Kiste? Sortiere."
                say: "Emil räumt Omas Kiste aus. Welche Art von Quelle ist das? Sortiere."
                bins:
                  - { id: picture, show: { text: "Bildquelle" }, say: "Bildquelle" }
                  - { id: written, show: { text: "Schriftquelle" }, say: "Schriftquelle" }
                  - { id: object, show: { text: "Sachquelle" }, say: "Sachquelle" }
                  - { id: witness, show: { text: "Zeitzeuge" }, say: "Zeitzeuge" }
                options:
                  - { text: "Foto von Omas Schulklasse", bin: picture }
                  - { text: "Brief von Omas Brieffreundin", bin: written }
                  - { object: telephone, bin: object }
                  - { text: "Oma erzählt vom Gummitwist", bin: witness }
                  - { text: "Gemälde von einem Dorf", bin: picture }
                  - { text: "Zeitung von früher", bin: written }
                hints:
                  - "Frag bei jedem Ding: Ist es ein Bild, ein Text, ein Gegenstand, oder erzählt jemand?"
                  - "Foto und Gemälde sind Bilder. Brief und Zeitung sind geschrieben."
                  - "Bildquelle: Foto, Gemälde. Schriftquelle: Brief, Zeitung. Sachquelle: Telefon. Zeitzeuge: Oma erzählt."
              - id: l1-f4
                type: multiple_choice
                text: "Wer ist ein Zeitzeuge?"
                options: ["jemand, der damals selbst dabei war und davon erzählt", "jemand, der ein Buch über früher gelesen hat", "jemand, der alte Uhren repariert"]
                answer: "jemand, der damals selbst dabei war und davon erzählt"
                hints:
                  - "Wer kann von etwas erzählen, das er selbst erlebt hat?"
                  - "Oma hat Gummitwist selbst gespielt."
                  - "Ein Zeitzeuge war damals selbst dabei."
              - id: l1-f5
                type: matching
                text: "Verbinde jede Quelle mit ihrer Art."
                pairs:
                  - { left: { text: "Foto" }, right: { text: "Bildquelle" } }
                  - { left: { text: "Tagebuch" }, right: { text: "Schriftquelle" } }
                  - { left: { text: "Spielzeug" }, right: { text: "Sachquelle" } }
                hints:
                  - "Bild, Schrift oder Gegenstand?"
                  - "Ein Tagebuch ist geschrieben."
                  - "Foto: Bildquelle. Tagebuch: Schriftquelle. Spielzeug: Sachquelle."
              - id: l1-f6
                type: multiple_choice
                text: "Was ist eine Quelle?"
                options: ["etwas aus einer alten Zeit, das uns von ihr erzählt", "ein Spiel, das heute erfunden wurde", "nur ein Buch aus der Bücherei"]
                answer: "etwas aus einer alten Zeit, das uns von ihr erzählt"
                hints:
                  - "Denk an Omas Kiste."
                  - "Alles in der Kiste ist von damals übrig."
                  - "Eine Quelle ist etwas aus einer alten Zeit, das uns von ihr erzählt."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Ein Zeitzeuge war selbst dabei."
                answer: true
                hints: ["Was hat Oma vom Gummitwist erzählt?"]
              - id: l1-s2
                type: multiple_choice
                text: "Oma erzählt, wie sie als Kind zur Schule gegangen ist. Was stimmt?"
                options: ["Oma ist eine Zeitzeugin.", "Oma ist eine Sachquelle.", "Oma ist ein Gemälde."]
                answer: "Oma ist eine Zeitzeugin."
                feedback:
                  "Oma ist ein Gemälde.": "Oma hängt nicht an der Wand! Sie erzählt, was sie selbst erlebt hat."
                hints: ["Oma erzählt, was sie selbst erlebt hat."]
              - id: l1-s3
                type: sorting
                text: "Noch mehr Quellen: Sortiere."
                bins:
                  - { id: picture, show: { text: "Bildquelle" }, say: "Bildquelle" }
                  - { id: written, show: { text: "Schriftquelle" }, say: "Schriftquelle" }
                  - { id: object, show: { text: "Sachquelle" }, say: "Sachquelle" }
                  - { id: witness, show: { text: "Zeitzeuge" }, say: "Zeitzeuge" }
                options:
                  - { text: "Gemälde von einem Bauernhof", bin: picture }
                  - { text: "Tagebuch von früher", bin: written }
                  - { object: teddy, bin: object }
                  - { text: "Opa erzählt von seinem ersten Fahrrad", bin: witness }
                  - { object: marble, bin: object }
                hints: ["Bild, Text, Gegenstand, oder erzählt jemand?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Quelle ist geschrieben?"
                options: ["ein Tagebuch", "ein Foto", "ein Jo-Jo"]
                answer: "ein Tagebuch"
                hints: ["In welcher Quelle stehen Wörter und Sätze?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Nur Bücher können uns etwas über früher verraten."
                answer: false
                feedback:
                  "true": "Auch Fotos, Gegenstände und Zeitzeugen erzählen uns von früher."
                hints: ["Was lag alles in Omas Kiste?"]
              - id: l1-s6
                type: matching
                text: "Welche Art von Quelle ist das? Verbinde."
                pairs:
                  - { left: { text: "Brief" }, right: { text: "Schriftquelle" } }
                  - { left: { text: "Gemälde" }, right: { text: "Bildquelle" } }
                  - { left: { object: telephone }, right: { text: "Sachquelle" } }
                  - { left: { text: "Oma erzählt" }, right: { text: "Zeitzeugin" } }
                hints: ["Ein Telefon ist ein Gegenstand."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Emil findet Omas altes Zeugnis. Was für eine Quelle ist das?"
                options: ["eine Schriftquelle", "eine Sachquelle", "eine Bildquelle"]
                answer: "eine Schriftquelle"
              - id: l1-n2
                type: true_false
                text: "Stimmt das? Auch ein altes Haus kann eine Quelle sein."
                answer: true
              - id: l1-n3
                type: sorting
                text: "Ordne die Quellen."
                bins:
                  - { id: picture, show: { text: "Bildquelle" }, say: "Bildquelle" }
                  - { id: written, show: { text: "Schriftquelle" }, say: "Schriftquelle" }
                  - { id: object, show: { text: "Sachquelle" }, say: "Sachquelle" }
                  - { id: witness, show: { text: "Zeitzeuge" }, say: "Zeitzeuge" }
                options:
                  - { text: "Foto von einer Hochzeit", bin: picture }
                  - { text: "Einkaufszettel von früher", bin: written }
                  - { object: clock, bin: object }
                  - { text: "die Nachbarin erzählt von ihrer Kindheit", bin: witness }
              - id: l1-n4
                type: multiple_choice
                text: "Welche Quelle zeigt dir, wie Omas Schulklasse aussah?"
                options: ["das Foto", "das Jo-Jo", "das Telefon"]
                answer: "das Foto"
              - id: l1-n5
                type: multiple_choice
                text: "Opa erzählt vom Tag, an dem er sein erstes Fahrrad bekam. Was ist er?"
                options: ["ein Zeitzeuge", "eine Schriftquelle", "ein Gemälde"]
                answer: "ein Zeitzeuge"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ein Gemälde von früher ist …"
            say: "Was für eine Quelle ist ein Gemälde von früher?"
            options: ["eine Bildquelle", "eine Schriftquelle", "eine Sachquelle"]
            answer: "eine Bildquelle"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Eine alte Zeitung ist eine Sachquelle."
            answer: false
            feedback:
              "true": "Eine Zeitung ist geschrieben. Sie ist eine Schriftquelle."
          - id: l1-c3
            type: multiple_choice
            text: "Welche Quelle ist ein Gegenstand?"
            options: ["ein alter Teddy", "ein Brief", "ein Foto"]
            answer: "ein alter Teddy"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Wer von früher erzählt, was er selbst erlebt hat, ist ein Zeitzeuge."
            answer: true
          - id: l1-c5
            type: matching
            text: "Verbinde."
            say: "Verbinde jede Quelle mit ihrer Art."
            pairs:
              - { left: { text: "Zeitung" }, right: { text: "Schriftquelle" } }
              - { left: { object: yo-yo }, right: { text: "Sachquelle" } }
              - { left: { text: "Foto" }, right: { text: "Bildquelle" } }
          - id: l1-c6
            type: multiple_choice
            text: "Welche Quelle ist eine Schriftquelle?"
            options: ["ein Zeugnis", "ein Gemälde", "eine Murmel"]
            answer: "ein Zeugnis"

  - n: 2
    title: { de: "Was verrät eine Quelle?", en: "What does a source tell us?" }
    goal:
      de: "Finde heraus, was eine Quelle verrät und was nicht. Ein Foto zeigt, wie etwas aussah, aber nicht, was die Menschen gedacht haben."
      en: "Find out what a source tells us and what it does not. A photo shows how something looked, but not what people thought."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Foto von früher ist …"
            say: "Was für eine Quelle ist ein Foto von früher?"
            options: ["eine Bildquelle", "eine Sachquelle", "eine Schriftquelle"]
            answer: "eine Bildquelle"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Ein Zeitzeuge hat selbst erlebt, wovon er erzählt."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: War früher alles schwarz-weiß?"
            say: "Emil schaut das Foto von Omas Schulklasse an. Alles ist schwarz, weiß und grau. Was glaubst du: War die Welt früher schwarz-weiß?"
          - text: "Nein! Nur viele Fotos waren schwarz-weiß."
            say: "Nein. Omas Pullover war rot und der Himmel blau, so wie heute. Viele Fotos wurden damals nur mit schwarz-weißem Film gemacht. Ein Foto zeigt, wie Menschen und Dinge aussahen. Aber es zeigt nur einen einzigen Augenblick, und es verrät nicht, was die Menschen gedacht haben."
          - text: "Ein Brief verrät, was jemand gedacht hat."
            say: "Im Brief schreibt Omas Brieffreundin, dass sie sich auf den Sommer freut und dass ihr Bruder ein Fahrrad bekommen hat. Ein Brief verrät Gedanken, Gefühle und Neuigkeiten. Aber er zeigt nur, was eine einzige Person gedacht hat."
          - text: "Ein Gegenstand zeigt, woraus etwas war und wie man es benutzt hat."
            say: "Am alten Telefon sieht Emil eine runde Scheibe mit Löchern für die Zahlen. Damit hat man früher die Nummer gewählt. Ein Gegenstand zeigt, woraus etwas gemacht war und wie die Menschen es benutzt haben."
            show: { object: telephone }
          - text: "Eine Zeitzeugin kannst du fragen."
            say: "Das Beste an einer Zeitzeugin: Du kannst ihr Fragen stellen. Emil fragt: Womit hast du in der Pause gespielt? Wie bist du zur Schule gekommen? Aber nach vielen Jahren vergisst man manches oder erinnert sich anders. Darum vergleichen Forscher immer mehrere Quellen."
            show: { object: grandma }
          - text: "Was heute gemacht wird, ist keine Quelle von damals."
            say: "Emil hat einen Film über die Ritterzeit gesehen. Der Film wurde erst vor Kurzem gedreht. Er ist keine Quelle aus der Ritterzeit, denn er stammt nicht von damals. Eine Quelle kommt aus der Zeit, von der sie erzählt. Zeitzeugen erzählen zwar heute, aber sie waren damals selbst dabei."
          - text: "Wusstest du? An den Jahresringen eines alten Holzbalkens können Forscher oft ablesen, in welchem Jahr der Baum gefällt wurde."
            say: "Wusstest du? An den Jahresringen eines alten Holzbalkens können Forscher oft ablesen, in welchem Jahr der Baum gefällt wurde. Ein Baum wächst jedes Jahr um einen Ring. In manchen Jahren wird der Ring breiter, in anderen schmaler. Dieses Muster vergleichen die Forscher. So wird sogar ein Balken in einem alten Haus zur Quelle."
            show: { object: tree }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was verrät dir ein Foto von früher?"
                options: ["wie Menschen und Dinge damals aussahen", "was die Menschen gedacht haben", "wie laut es damals war"]
                answer: "wie Menschen und Dinge damals aussahen"
                hints:
                  - "Was kannst du auf einem Foto sehen?"
                  - "Gedanken und Geräusche kann man auf einem Foto nicht sehen."
                  - "Ein Foto zeigt, wie etwas aussah."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Früher war die ganze Welt schwarz-weiß."
                answer: false
                feedback:
                  "true": "Die Welt war bunt wie heute. Nur viele Fotos waren schwarz-weiß."
                hints:
                  - "Welche Farbe hatte Omas Pullover?"
                  - "Nur der Film im Fotoapparat war schwarz-weiß."
                  - "Nein, die Welt war früher genauso bunt wie heute."
              - id: l2-f3
                type: matching
                text: "Was verrät dir diese Quelle? Verbinde."
                pairs:
                  - { left: { text: "ein Foto" }, right: { text: "wie etwas aussah" } }
                  - { left: { text: "ein Brief" }, right: { text: "was jemand gedacht hat" } }
                  - { left: { object: telephone }, right: { text: "wie man etwas benutzt hat" } }
                hints:
                  - "Was zeigt ein Bild, was erzählt ein Text?"
                  - "Im Brief stehen die Gedanken der Brieffreundin."
                  - "Foto: wie etwas aussah. Brief: was jemand gedacht hat. Telefon: wie man es benutzt hat."
              - id: l2-f4
                type: multiple_choice
                text: "Emil will wissen, wie Oma als Kind gespielt hat. Welche Frage passt?"
                options: ["Womit hast du in der Pause gespielt?", "Wie spät ist es?", "Magst du Pizza?"]
                answer: "Womit hast du in der Pause gespielt?"
                hints:
                  - "Die Frage muss nach früher fragen."
                  - "Es geht ums Spielen."
                  - "Womit hast du in der Pause gespielt?"
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Nach vielen Jahren erinnert sich ein Zeitzeuge an manches nicht mehr genau."
                answer: true
                hints:
                  - "Weißt du noch alles aus deiner Kindergartenzeit?"
                  - "Mit der Zeit vergisst man manches."
                  - "Ja. Darum vergleicht man mit anderen Quellen."
              - id: l2-f6
                type: multiple_choice
                text: "Ein Film über die Steinzeit wurde vor Kurzem gedreht. Ist er eine Quelle aus der Steinzeit?"
                options: ["Nein, denn er stammt nicht aus der Steinzeit.", "Ja, denn er zeigt die Steinzeit.", "Ja, denn er ist bunt."]
                answer: "Nein, denn er stammt nicht aus der Steinzeit."
                hints:
                  - "Wann wurde der Film gemacht?"
                  - "Eine Quelle kommt aus der Zeit, von der sie erzählt."
                  - "Der Film ist von heute, also keine Quelle aus der Steinzeit."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Von damals oder erst heute gemacht?"
                say: "Ist das eine Quelle von damals, oder wurde es erst heute gemacht? Sortiere."
                bins:
                  - { id: then, show: { text: "Quelle von damals" }, say: "Quelle von damals" }
                  - { id: now, show: { text: "erst heute gemacht" }, say: "erst heute gemacht" }
                options:
                  - { text: "Brief an Oma von ihrer Brieffreundin", bin: then }
                  - { text: "Comic über Ritter, letztes Jahr gezeichnet", bin: now }
                  - { text: "Foto von Omas Schulklasse", bin: then }
                  - { text: "neuer Film über die Steinzeit", bin: now }
                  - { text: "Omas Jo-Jo aus Holz", bin: then }
                hints: ["Frag: Stammt es aus der Zeit, von der es erzählt?"]
              - id: l2-s2
                type: multiple_choice
                text: "Was kannst du bei einer Zeitzeugin tun, aber nicht bei einem Foto?"
                options: ["ihr Fragen stellen", "sie ansehen", "sie in eine Kiste legen"]
                answer: "ihr Fragen stellen"
                feedback:
                  "sie in eine Kiste legen": "Oma in die Kiste? Lieber nicht! Überleg: Was kann Oma, was ein Foto nicht kann?"
                hints: ["Ein Foto kann nicht antworten."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Ein Brief zeigt, was eine einzige Person gedacht hat."
                answer: true
                hints: ["Wer hat den Brief geschrieben?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Ein Foto zeigt auch, was die Menschen darauf gedacht haben."
