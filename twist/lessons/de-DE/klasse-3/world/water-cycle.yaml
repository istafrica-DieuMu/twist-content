# Lesson set: Sachunterricht, Klasse 3. Hand-authored draft.
id: de-DE.world.water-cycle
skill: world.nature.water-cycle
curriculum: de-DE
language: de
title:
  de: Der Wasserkreislauf
  en: The water cycle
summary: >
  The sun warms the water of seas, lakes, rivers and plants; it evaporates
  and rises as invisible water vapour. High up it is cold, the vapour
  condenses into tiny droplets, and many droplets make a cloud. The
  droplets grow and fall as Niederschlag (rain, snow, hail); the water
  soaks into the ground or runs off into streams and rivers and back to
  the sea. The cycle has no start and no end, and no water is lost. The
  story: Tropfi, a drop from the North Sea, travels up into a cloud over a
  mountain and finds the way home. Lesson 1 follows the way up; lesson 2
  the way down and the whole cycle, puts it in order and ends with the
  skill check. The water-cycle component shows each step on the Learn
  screens; where a task asks for a step's name, that name shows as ?.
metadata:
  year: klasse-3
  topic: { de: Wasser, en: Water }
  ages: [8-10]
  lesson_minutes: 12
  builds_on: [world.nature.water-states, world.nature.weather]
  also_practises: [world.nature.water-states]
  vocabulary: { de: [Wasserkreislauf, verdunsten, Wasserdampf, aufsteigen, kondensieren, Tröpfchen, Wolke, Nebel, Niederschlag, Regen, Schnee, Hagel, versickern, Grundwasser, abfließen, Bach, Fluss, Meer] }
  forms: [text, audio, picture, drawn]
  drawn: [water-cycle]
  facets: []
  parts:
    - { id: steps, what: { de: "die Stationen des Wasserkreislaufs benennen", en: "naming the stages of the water cycle" } }
    - { id: order, what: { de: "die Stationen in die richtige Reihenfolge bringen", en: "putting the stages in order" } }
    - { id: explain, what: { de: "erklären, warum das Wasser immer weiter kreist", en: "explaining why the water keeps going round" } }
  misconceptions:
    - id: higher-is-warmer
      what: Thinks the air gets warmer the higher you go, because it is closer to the sun
      addressed: the lesson 1 screen on the cold air high up; l1-f6, l1-s1 and l1-c2
    - id: cloud-is-smoke
      what: Thinks clouds are smoke, cotton or gas, not tiny drops of water
      addressed: the lesson 1 screen on how a cloud is made; l1-f3, l1-n2, l2-w1 and l2-c16
    - id: water-used-up
      what: Thinks the water cycle uses water up, or that rain comes from somewhere other than evaporated water
      addressed: the lesson 2 screen on the cycle without start or end; l1-n1, l2-f4, l2-c14 and l2-c18
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Tropfis Reise nach oben", en: "Tropfi's journey up" }
    goal:
      de: "Erkläre, wie Wasser aus dem Meer in eine Wolke kommt. Die Sonne lässt es zum Beispiel verdunsten."
      en: "Explain how water from the sea gets into a cloud. The sun, for example, makes it evaporate."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wasser wird zu Wasserdampf. Wie heißt das?"
            options: ["verdunsten", "gefrieren", "schmelzen"]
            answer: "verdunsten"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Bei welchem Wetter fallen Tropfen vom Himmel?"
            options:
              - { object: sun }
              - { object: rain }
              - { object: snow }
            answer: rain
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wie kommt ein Wassertropfen aus dem Meer in eine Wolke?"
            say: "Das ist Tropfi, ein Wassertropfen aus der Nordsee. Eines Tages ist Tropfi in einer Wolke, hoch über einem Berg. Wie ist er da hinaufgekommen? Was glaubst du?"
            show: { object: cloud }
          - text: "Die Sonne erwärmt das Meer. Das Wasser verdunstet."
            say: "Die Sonne scheint auf das Meer und erwärmt das Wasser. Tropfi verdunstet: Er wird zu unsichtbarem Wasserdampf und steigt mit der warmen Luft nach oben. Wasser verdunstet auch aus Seen, Flüssen und Pfützen, und sogar aus den Blättern der Pflanzen."
            show: { drawn: water-cycle, step: evaporation }
          - text: "Oben ist es kalt. Der Wasserdampf kondensiert zu winzigen Tröpfchen."
            say: "Je höher Tropfi steigt, desto kälter wird die Luft. Darum liegt auf hohen Bergen oft Schnee. In der Kälte kondensiert der Wasserdampf: Er wird wieder zu winzigen Wassertröpfchen. Das kennst du vom kalten Spiegel im Bad."
            show: { drawn: water-cycle, step: condensation }
          - text: "Viele winzige Tröpfchen zusammen sind eine Wolke."
            say: "Unzählige winzige Tröpfchen zusammen siehst du als Wolke. Jedes Tröpfchen ist so klein und leicht, dass es in der Luft schwebt. Nebel ist übrigens auch eine Wolke. Sie liegt nur ganz unten am Boden."
            show: { object: cloud }
          - text: "Wusstest du? Eine große Haufenwolke kann so viel Wasser tragen, wie ungefähr 100 Elefanten wiegen."
            say: "Wusstest du? Eine einzige große, weiße Haufenwolke kann so viel Wasser enthalten, wie ungefähr hundert Elefanten wiegen. Sie fällt trotzdem nicht herunter, weil das Wasser in winzige Tröpfchen verteilt ist, über einen riesigen Raum."
          - text: "Verdunsten, aufsteigen, kondensieren: So entsteht eine Wolke."
            say: "So ist Tropfi in die Wolke gekommen. Die Sonne erwärmt das Wasser, und es verdunstet. Der Wasserdampf steigt auf. Oben in der Kälte kondensiert er zu Tröpfchen, und viele Tröpfchen bilden eine Wolke."
            show: { drawn: water-cycle }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was lässt das Wasser im Meer verdunsten?"
                show: { object: sea }
                options: ["die Wärme der Sonne", "das Licht des Mondes", "die Fische, die pusten"]
                answer: "die Wärme der Sonne"
                feedback:
                  "die Fische, die pusten": "Fische, die das Meer wegpusten? Das wäre ein Anblick! Denk an das, was warm macht."
                hints:
                  - "Was braucht Wasser, um schneller zu verdunsten?"
                  - "Wärme lässt Wasser verdunsten. Woher kommt die Wärme am Meer?"
                  - "Die Sonne erwärmt das Meer."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Wie kommt Tropfi in die Wolke? Ordne."
                say: "Wie kommt Tropfi in die Wolke? Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Oben ist es kalt. Der Dampf wird zu Tröpfchen.", "Die Sonne erwärmt das Meer.", "Viele Tröpfchen bilden eine Wolke.", "Tropfi verdunstet und steigt auf."]
                slot_count: 4
                answer: ["Die Sonne erwärmt das Meer.", "Tropfi verdunstet und steigt auf.", "Oben ist es kalt. Der Dampf wird zu Tröpfchen.", "Viele Tröpfchen bilden eine Wolke."]
                hints:
                  - "Was muss passieren, bevor Tropfi aufsteigen kann?"
                  - "Zuerst wärmt die Sonne, ganz am Ende ist die Wolke da."
                  - "Sonne, verdunsten, Tröpfchen, Wolke."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Eine Wolke besteht aus winzigen Wassertröpfchen."
                answer: true
                hints:
                  - "Was wird oben aus dem Wasserdampf?"
                  - "In der Kälte kondensiert der Dampf zu Tröpfchen."
                  - "Ja, viele winzige Tröpfchen zusammen sind eine Wolke."
              - id: l1-f4
                type: image_multiple_choice
                text: "Wo kann Wasser in der Sonne verdunsten?"
                options:
                  - { object: stone }
                  - { object: puddle }
                  - { object: dice }
                answer: puddle
                hints:
                  - "Wo ist hier Wasser?"
                  - "Ein Stein und ein Würfel sind trocken."
                  - "Aus der Pfütze verdunstet Wasser."
              - id: l1-f5
                type: matching
                text: "Verbinde jedes Wort mit seiner Bedeutung."
                pairs:
                  - { left: { text: "verdunsten" }, right: { text: "Wasser wird zu Wasserdampf" } }
                  - { left: { text: "kondensieren" }, right: { text: "Wasserdampf wird zu Tröpfchen" } }
                  - { left: { text: "Wolke" }, right: { text: "viele winzige Tröpfchen zusammen" } }
                hints:
                  - "Fang mit dem Wort an, das du am besten kennst."
                  - "Beim Verdunsten geht das Wasser in die Luft, beim Kondensieren kommt es als Tröpfchen zurück."
                  - "Verdunsten: zu Dampf. Kondensieren: zu Tröpfchen. Wolke: viele Tröpfchen."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? Je höher Tropfi steigt, desto wärmer wird die Luft."
                answer: false
                feedback:
                  "true": "Oben ist es kälter. Darum liegt auf hohen Bergen oft Schnee, auch im Frühling."
                hints:
                  - "Denk an hohe Berge."
                  - "Auf hohen Bergen liegt oft Schnee."
                  - "Nein, oben wird es kälter."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Warum wird der Wasserdampf oben wieder zu Tröpfchen?"
                options: ["Weil es oben kalt ist.", "Weil oben die Sonne näher ist.", "Weil Vögel ihn auffangen."]
                answer: "Weil es oben kalt ist."
                hints: ["Wann wird Wasserdampf am Spiegel zu Tropfen?"]
              - id: l1-s2
                type: sorting
                text: "Verdunstet hier Wasser, oder kondensiert es?"
                bins:
                  - { id: evap, show: { text: "verdunsten" }, say: "verdunsten" }
                  - { id: cond, show: { text: "kondensieren" }, say: "kondensieren" }
                options:
                  - { text: "Wasser steigt aus dem Meer auf.", bin: evap }
                  - { text: "Hoch oben bilden sich Tröpfchen.", bin: cond }
                  - { text: "Eine Pfütze trocknet.", bin: evap }
                  - { text: "Aus Dampf wird eine Wolke.", bin: cond }
                  - { text: "Wasser steigt aus den Blättern der Bäume auf.", bin: evap }
                hints: ["Geht das Wasser in die Luft, oder wird es wieder zu Tropfen?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Wasser verdunstet nur aus dem Meer."
                answer: false
                feedback:
                  "true": "Auch aus Seen, Flüssen, Pfützen und Pflanzen verdunstet Wasser."
                hints: ["Denk an die Pfütze nach dem Regen."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Was entsteht, wenn sich viele winzige Tröpfchen in der Luft sammeln?"
                options:
                  - { object: sun }
                  - { object: snowman }
                  - { object: cloud }
                answer: cloud
                hints: ["Du siehst sie am Himmel, und sie schwebt."]
              - id: l1-s5
                type: multiple_choice
                text: "Tropfi ist gerade Wasserdampf. Kannst du ihn sehen?"
                options: ["Nein, Wasserdampf ist unsichtbar.", "Ja, er ist blau.", "Ja, er ist weiß wie eine Wolke."]
                answer: "Nein, Wasserdampf ist unsichtbar."
                hints: ["Siehst du das Wasser, das aus einer Pfütze verdunstet?"]
              - id: l1-s6
                type: ordering
                text: "Ordne Tropfis Weg nach oben."
                say: "Ordne Tropfis Weg nach oben. Was kommt zuerst?"
                options: ["Wolke", "Meer", "Wasserdampf"]
                slot_count: 3
                answer: ["Meer", "Wasserdampf", "Wolke"]
                hints: ["Tropfi startet unten im Meer."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Emil sieht an einem heißen Tag Wolken über dem See entstehen. Woher kommt ihr Wasser?"
                show: { object: lake }
                options: ["aus dem See, es ist verdunstet", "aus dem Weltall", "aus den Wasserhähnen der Stadt"]
                answer: "aus dem See, es ist verdunstet"
              - id: l1-n2
                type: true_false
                text: "Emil sagt: „Die Wolke schwebt, weil ihre Tröpfchen winzig und leicht sind.“ Stimmt das?"
                answer: true
              - id: l1-n3
                type: ordering
                text: "Emil erklärt seiner Schwester, wie eine Wolke entsteht. Bring seine Sätze in die richtige Reihenfolge."
                say: "Emil erklärt seiner Schwester, wie eine Wolke entsteht. Bring seine Sätze in die richtige Reihenfolge."
                options: ["Der Wasserdampf steigt nach oben.", "Die Tröpfchen bilden eine Wolke.", "Die Sonne lässt Wasser verdunsten.", "Hoch oben kühlt er ab und wird zu Tröpfchen."]
                slot_count: 4
                answer: ["Die Sonne lässt Wasser verdunsten.", "Der Wasserdampf steigt nach oben.", "Hoch oben kühlt er ab und wird zu Tröpfchen.", "Die Tröpfchen bilden eine Wolke."]
              - id: l1-n4
                type: matching
                text: "Was passiert hier? Verbinde."
                pairs:
                  - { left: { object: sun }, right: { text: "erwärmt das Wasser" } }
                  - { left: { object: puddle }, right: { text: "Wasser verdunstet" } }
                  - { left: { object: cloud }, right: { text: "viele winzige Tröpfchen" } }
              - id: l1-n5
                type: multiple_choice
                text: "Am Morgen liegt Nebel über der Wiese. Was ist Nebel?"
                options: ["eine Wolke ganz unten am Boden", "Rauch von einem Feuer", "Wasserdampf, den man nicht sehen kann"]
                answer: "eine Wolke ganz unten am Boden"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Sonne erwärmt das Meer. Was passiert mit dem Wasser?"
            show: { object: sea }
            options: ["Es verdunstet.", "Es gefriert.", "Es wird zu Sand."]
            answer: "Es verdunstet."
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Hoch oben in der Luft ist es wärmer als unten."
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Was besteht aus vielen winzigen Wassertröpfchen?"
            options:
              - { object: cloud }
              - { object: sun }
              - { object: moon }
            answer: cloud
          - id: l1-c4
            type: ordering
            text: "Wie entsteht eine Wolke? Ordne."
            options: ["Tröpfchen", "Wasserdampf", "Wasser im Meer"]
            slot_count: 3
            answer: ["Wasser im Meer", "Wasserdampf", "Tröpfchen"]
          - id: l1-c5
            type: multiple_choice
            text: "Wasserdampf wird zu Tröpfchen. Wie heißt das?"
            show: { drawn: water-cycle, step: condensation, gap: condensation }
            options: ["kondensieren", "verdunsten", "schmelzen"]
            answer: "kondensieren"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Auch aus Seen und Flüssen verdunstet Wasser."
            answer: true

  - n: 2
    title: { de: "Tropfis Weg nach Hause", en: "Tropfi's way home" }
    goal:
      de: "Beschreibe den ganzen Wasserkreislauf, vom Meer in die Wolke und als Regen zurück. Der Regen fließt zum Beispiel über Bäche und Flüsse ins Meer."
      en: "Describe the whole water cycle, from the sea into the cloud and back as rain. The rain, for example, flows through streams and rivers to the sea."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Woraus besteht eine Wolke?"
            options: ["aus winzigen Wassertröpfchen", "aus Watte", "aus Rauch"]
            answer: "aus winzigen Wassertröpfchen"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Wasser verdunstet, wenn die Sonne es erwärmt."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wie kommt Tropfi aus der Wolke zurück ins Meer?"
            say: "Tropfi ist in der Wolke hoch über einem Berg. Er möchte zurück nach Hause in die Nordsee. Aber das Meer ist weit weg. Was glaubst du: Wie kommt er dahin?"
            show: { object: cloud }
          - text: "Die Tröpfchen werden groß und schwer. Sie fallen als Niederschlag."
            say: "In der Wolke stoßen die Tröpfchen zusammen und werden größer und schwerer. Irgendwann kann die Luft sie nicht mehr tragen, und sie fallen als Regen. Ist es kalt, fällt Schnee, und manchmal Hagel. Regen, Schnee und Hagel heißen zusammen Niederschlag."
            show: { drawn: water-cycle, step: precipitation }
          - text: "Das Wasser versickert im Boden oder fließt ab."
            say: "Tropfi landet auf dem Berg. Ein Teil des Regens versickert im Boden und wird zu Grundwasser. Tropfi aber fließt ab, den Berg hinunter in einen Bach. Bäche fließen in Flüsse. Ein großer Fluss, die Elbe, trägt Tropfi bis in die Nordsee."
            show: { drawn: water-cycle, step: collection }
          - text: "Ein Kreislauf ohne Anfang und Ende"
            say: "Im Meer erwärmt die Sonne Tropfi wieder, und die Reise beginnt von vorn. Darum heißt das Wasserkreislauf. Die Sonne hält ihn in Gang. Er hat keinen Anfang und kein Ende, und dabei geht kein Wasser verloren. Das Wasser, das du heute trinkst, war schon viele Male im Meer und in einer Wolke."
            show: { drawn: water-cycle }
          - text: "Wusstest du? Regen ist nicht salzig, obwohl viel davon aus dem Meer kommt."
            say: "Wusstest du? Viel Regenwasser ist aus dem salzigen Meer verdunstet. Trotzdem ist Regen nicht salzig. Beim Verdunsten steigt nur das Wasser auf. Das Salz bleibt im Meer zurück."
          - text: "Meer, Wasserdampf, Wolke, Niederschlag, Fluss, und alles beginnt von vorn."
            say: "Jetzt kennst du den ganzen Kreislauf. Das Wasser im Meer verdunstet. Der Wasserdampf steigt auf und kondensiert zu einer Wolke. Aus der Wolke fällt Niederschlag. Das Wasser fließt über Bäche und Flüsse zurück ins Meer. Und alles beginnt von vorn."
            show: { drawn: water-cycle }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum fallen die Tropfen aus der Wolke?"
                options: ["Sie werden groß und schwer.", "Die Wolke platzt wie ein Luftballon.", "Die Sonne schiebt sie hinunter."]
                answer: "Sie werden groß und schwer."
                feedback:
                  "Die Wolke platzt wie ein Luftballon.": "Peng? Nein, Wolken platzen nicht. Schau, was mit den Tröpfchen passiert."
                hints:
                  - "Was passiert, wenn die Tröpfchen zusammenstoßen?"
                  - "Sie werden größer, und die Luft kann sie nicht mehr tragen."
                  - "Sie werden groß und schwer und fallen."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Ist das Niederschlag?"
                bins:
                  - { id: precip, show: { text: "Niederschlag" }, say: "Niederschlag" }
                  - { id: other, show: { text: "kein Niederschlag" }, say: "kein Niederschlag" }
                options:
                  - { object: rain, bin: precip }
                  - { object: snow, bin: precip }
                  - { object: hail, bin: precip }
                  - { object: sun, bin: other }
                  - { object: wind, bin: other }
                hints:
                  - "Niederschlag fällt aus den Wolken."
                  - "Fällt Wasser vom Himmel, flüssig oder fest?"
                  - "Niederschlag: Regen, Schnee, Hagel. Kein Niederschlag: Sonne, Wind."
              - id: l2-f3
                type: ordering
                text: "Wie kommt Tropfi zurück ins Meer? Ordne."
                say: "Wie kommt Tropfi zurück ins Meer? Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Der Bach fließt in einen Fluss.", "Tropfi fällt als Regen auf den Berg.", "Der Fluss fließt ins Meer.", "Tropfi fließt in einen Bach."]
                slot_count: 4
                answer: ["Tropfi fällt als Regen auf den Berg.", "Tropfi fließt in einen Bach.", "Der Bach fließt in einen Fluss.", "Der Fluss fließt ins Meer."]
                hints:
                  - "Wo landet Tropfi zuerst?"
                  - "Kleine Bäche fließen in große Flüsse."
                  - "Regen, Bach, Fluss, Meer."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Beim Wasserkreislauf geht immer mehr Wasser verloren."
                answer: false
                feedback:
                  "true": "Kein Wasser geht verloren. Es wechselt nur seinen Ort und seine Form."
                hints:
                  - "Wo ist das Wasser, wenn es verdunstet ist?"
                  - "Verdunstetes Wasser ist in der Luft und kommt als Regen zurück."
                  - "Nein, im Kreislauf geht kein Wasser verloren."
              - id: l2-f5
                type: image_multiple_choice
                text: "Es ist Winter. Auch unten am Boden ist es kälter als 0 °C. Wie kommt der Niederschlag unten an?"
                options:
                  - { object: rain }
                  - { object: snow }
                  - { object: sun }
                answer: snow
                hints:
                  - "Was passiert mit Wasser unter 0 °C?"
                  - "Unter 0 °C gefriert Wasser."
                  - "Es fällt als Schnee."
              - id: l2-f6
                type: matching
                text: "Verbinde jedes Wort mit seiner Bedeutung."
                pairs:
                  - { left: { text: "Niederschlag" }, right: { text: "Regen, Schnee oder Hagel fällt" } }
                  - { left: { text: "versickern" }, right: { text: "Wasser läuft in den Boden" } }
                  - { left: { text: "abfließen" }, right: { text: "Wasser fließt in Bäche und Flüsse" } }
                hints:
                  - "Welches Wort hat mit dem Himmel zu tun?"
                  - "Versickern geht nach unten in die Erde."
                  - "Niederschlag fällt, versickern geht in den Boden, abfließen geht in Bäche."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Der Wasserkreislauf hat keinen Anfang und kein Ende."
                answer: true
                hints: ["Was passiert mit Tropfi, wenn er wieder im Meer ist?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wohin fließen die meisten großen Flüsse am Ende?"
                show: { object: river }
                options: ["ins Meer", "in die Wolken", "auf einen Berg"]
                answer: "ins Meer"
                hints: ["Wasser fließt immer bergab."]
              - id: l2-s3
                type: ordering
                text: "Ordne den Wasserkreislauf. Fang beim Meer an."
                say: "Ordne den Wasserkreislauf. Fang beim Meer an. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Wolke", "Fluss", "Regen", "Wasserdampf", "Meer"]
                slot_count: 5
                answer: ["Meer", "Wasserdampf", "Wolke", "Regen", "Fluss"]
                hints: ["Zuerst geht es nach oben, dann wieder nach unten."]
              - id: l2-s4
                type: sorting
                text: "Geht es nach oben oder nach unten?"
                say: "Tropfis Reise: Geht es hier nach oben oder nach unten?"
                bins:
                  - { id: up, show: { text: "nach oben" }, say: "nach oben" }
                  - { id: down, show: { text: "nach unten" }, say: "nach unten" }
                options:
                  - { text: "Wasser verdunstet.", bin: up }
                  - { text: "Regen fällt.", bin: down }
