# Lesson set: DaZ (German as a second language), DaZ Buchstaben. Hand-authored draft.
id: de-DE.daz.de-l-o-a-m
skill: lit-de.letters.l-o-a-m
curriculum: de-DE
track: daz
language: en # language of instructions
target_language: de # language being learnt
title:
  de: L, O, A und M
  en: The letters L, O, A and M
summary: >
  The first four letters of the Klasse 1 course (Fibel order), for a child
  who is new to the Latin script and to German, and may be 6 or 10. Their
  sounds can be held (lll, ooo, aaa, mmm) and they make words at once: Oma,
  Mama, Lama. Lesson 1 brings L and M, lesson 2 O and A, each heard at the
  start of German words, found among other letters and traced. Lesson 3
  joins the letters into syllables and the first words, read from left to
  right, and ends with the skill check. Instructions are short and spoken in
  English; every German word is heard, and the letters are always played as
  their German sounds, never as letter names.
metadata:
  year: daz-letters
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7, 8-10]
  lesson_minutes: 10
  builds_on: [lit-de.letters.sound-chart, lit-de.phonological.initial-sound]
  also_practises: [lit-de.handwriting.print-letters, lit-de.decoding.blend-syllables]
  vocabulary: { de: [Lama, Löwe, Lampe, Mama, Oma, Opa, Affe, Ameise] }
  forms: [audio, drawn, picture, text]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: ["de.l", "de.m", "de.o:", "de.a:", "de.ma", "de.mo", "de.la", "de.lo", "de.al", "de.om"]
  facets: [script]
  parts:
    - { id: l-m, what: { de: die Laute von L und M, en: the sounds of L and M } }
    - { id: o-a, what: { de: die Laute von O und A, en: the sounds of O and A } }
    - { id: syllables, what: { de: "erste Silben hören und lesen: Ma, Mo, La, Lo", en: "hearing and reading first syllables: Ma, Mo, La, Lo" } }
    - { id: words, what: { de: "erste Wörter lesen: Oma, Mama, Lama", en: "reading first words: Oma, Mama, Lama" } }
  misconceptions:
    - id: letter-name
      what: Says a letter name (el, em, from English or another language) instead of the German sound (lll, mmm), which blocks blending
      addressed: Learn always plays the sound with the letter card, never a name; every sound-to-letter task (l1-f1, l2-f1, l3-c1) plays the sound; hints say the sound (lll, mmm)
    - id: o-a-confusion
      what: Mixes up O and A by shape and sound
      addressed: lesson 2 sets O against A in every stage (l2-s1, l2-n2, l2-n3); the skill check asks both (l3-c6 to l3-c10)
    - id: right-to-left
      what: Reads a syllable from right to left, as in Arabic or Persian script (Al for La, Om for Mo)
      addressed: lesson 3 Learn says German is read from left to right, on the syllable arcs; l3-n1 and l3-n4 ask for Al and Om against La and Mo
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-26

lessons:
  - n: 1
    title: { de: L und M, en: L and M }
    goal:
      de: "Lerne die Buchstaben L und M. Hör ihre Laute am Anfang von deutschen Wörtern und schreib sie nach."
      en: "Learn the letters L and M. Hear their sounds at the start of German words, and trace them."
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - say: { en: "Listen to three German words. What do you think: which sound do they all start with?", de: "Lama. Löwe. Lampe." }
            show: { objects: [llama, lion, lamp] }
          - text: "L l"
            say: { en: "They all start with lll. This letter makes that sound. Big L, small l." }
            show: { drawn: letter-card, text: "Ll" }
            sound: de.l
          - text: "Lama"
            say: { de: "Lama.", en: "A llama. Can you hear the lll at the start?" }
            show: { object: llama }
          - text: "M m"
            say: { en: "Now close your lips and hum: mmm. This letter makes that sound. Big M, small m." }
            show: { drawn: letter-card, text: "Mm" }
            sound: de.m
          - text: "Mama"
            say: { de: "Mama.", en: "Mama means mum. Can you hear the mmm at the start?" }
            show: { object: mum }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: { en: "Listen. Which letter makes this sound?" }
                audio: { sound: de.l }
                options: ["L", "M", "S"]
                answer: "L"
                hints:
                  - "Listen again, and make the sound too."
                  - "Lll, like at the start of Lama."
                  - "It is the letter that looks like a corner."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Does this word start with L?"
                say: { en: "Listen. Does this word start with lll?", de: "Leiter." }
                show: { object: ladder }
                answer: true
                hints:
                  - "Say the word with me: Leiter."
                  - "Hold the first sound long: llleiter."
                  - "Yes. Leiter starts with lll."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Does this word start with L?"
                say: { en: "Listen. Does this word start with lll?", de: "Mond." }
                show: { object: moon }
                answer: false
                feedback:
                  "true": "Mond starts with mmm: your lips close. For lll, your tongue goes up behind your teeth."
                hints:
                  - "Say the word with me: Mond."
                  - "At the start, do your lips close?"
                  - "No. Mond starts with mmm."
              - id: l1-f4
                type: highlight_in_text
                text: "Tap every L and l."
                say: { en: "Tap every letter for lll, big and small." }
                show: { drawn: letter-card, text: "L o l M L a" }
                spans: ["L", "l", "L"]
                hints:
                  - "Big L looks like a corner."
                  - "Small l is one long line."
                  - "There are three: two big and one small."
              - id: l1-f5
                type: audio_choice
                text: "Which letter does the word start with?"
                say: { en: "Listen. Which letter does the word start with?" }
                audio: { de: "Maus." }
                show: { object: mouse }
                options: ["L", "M", "O"]
                answer: "M"
                hints:
                  - "Say it slowly: Mmmaus."
                  - "Your lips close at the start. That is mmm."
                  - "Maus starts with M."
              - id: l1-f6
                type: tracing
                text: "Trace the letter."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: { en: "Listen. Which letter makes this sound?" }
                audio: { sound: de.m }
                options: ["M", "L", "A"]
                answer: "M"
                hints: ["Mmm, like at the start of Mama."]
              - id: l1-s2
                type: true_false
                text: "Does this word start with M?"
                say: { en: "Listen. Does this word start with mmm?", de: "Messer." }
                show: { object: knife }
                answer: true
                hints: ["Say it slowly: Mmmesser."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tap every M and m."
                say: { en: "Tap every letter for mmm, big and small." }
                show: { drawn: letter-card, text: "m L M a" }
                spans: ["m", "M"]
                hints: ["There are two."]
              - id: l1-s4
                type: audio_choice
                text: "Which letter does the word start with?"
                say: { en: "Listen. Which letter does the word start with?" }
                audio: { de: "Löffel." }
                show: { object: spoon }
                options: ["M", "L"]
                answer: "L"
                hints: ["Löffel. Llll. Does it hum?"]
              - id: l1-s5
                type: tracing
                text: "Trace the letter."
                show: { drawn: writing-lines, text: "M", mode: trace, arrows: true }
                char: "M"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Does this word start with L?"
                say: { en: "Listen. Does this word start with lll?", de: "Fisch." }
                show: { object: fish }
                answer: false
              - id: l1-n2
                type: audio_choice
                text: "Which letter makes this sound?"
                say: { en: "Listen. Which letter makes this sound?" }
                audio: { sound: de.l }
                options: ["O", "L", "M"]
                answer: "L"
              - id: l1-n3
                type: audio_choice
                text: "Which letter does the word start with?"
                say: { en: "Listen. Which letter does the word start with?" }
                audio: { de: "Mund." }
                show: { object: mouth }
                options: ["L", "M", "A"]
                answer: "M"
              - id: l1-n4
                type: highlight_in_text
                text: "Tap every L and l."
                say: { en: "Tap every letter for lll, big and small." }
                show: { drawn: letter-card, text: "M l L o m" }
                spans: ["l", "L"]
              - id: l1-n5
                type: tracing
                text: "Copy the letter."
                show: { drawn: writing-lines, text: "m", mode: copy, arrows: false }
                char: "m"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Listen. Which letter makes this sound?" }
            audio: { sound: de.m }
            options: ["A", "M", "L"]
            answer: "M"
          - id: l1-c2
            type: true_false
            text: "Does this word start with M?"
            say: { en: "Listen. Does this word start with mmm?", de: "Maus." }
            show: { object: mouse }
            answer: true
          - id: l1-c3
            type: true_false
            text: "Does this word start with L?"
            say: { en: "Listen. Does this word start with lll?", de: "Ei." }
            show: { object: egg }
            answer: false
          - id: l1-c4
            type: audio_choice
            text: "Which letter does the word start with?"
            say: { en: "Listen. Which letter does the word start with?" }
            audio: { de: "Lama." }
            show: { object: llama }
            options: ["M", "L", "O"]
            answer: "L"
          - id: l1-c5
            type: highlight_in_text
            text: "Tap every M and m."
            say: { en: "Tap every letter for mmm, big and small." }
            show: { drawn: letter-card, text: "M o m L M" }
            spans: ["M", "m", "M"]
          - id: l1-c6
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Listen. Which letter makes this sound?" }
            audio: { sound: de.l }
            options: ["L", "M"]
            answer: "L"

  - n: 2
    title: { de: O und A, en: O and A }
    goal:
      de: "Lerne die Buchstaben O und A. Beim O wird dein Mund rund, beim A geht er weit auf."
      en: "Learn the letters O and A. For O your mouth goes round, for A it opens wide."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Do you remember? Which letter makes this sound?" }
            audio: { sound: de.m }
            options: ["M", "O"]
            answer: "M"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Does this word start with L?"
            say: { en: "Do you remember? Does this word start with lll?", de: "Lampe." }
            show: { object: lamp }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - say: { en: "Imagine you see a giant cake. Your mouth goes all round. What do you think: which sound comes out?" }
            show: { object: cake }
          - text: "O o"
            say: { en: "Ooo! This letter makes that sound. Round mouth, round letter. Big O, small o." }
            show: { drawn: letter-card, text: "Oo" }
            sound: "de.o:"
          - text: "Oma"
            say: { de: "Oma.", en: "Oma means grandma. Ooo, Oma." }
            show: { object: grandma }
          - text: "A a"
            say: { en: "Now open your mouth wide, like at the doctor: aaa. This letter makes that sound. Big A, small a." }
            show: { drawn: letter-card, text: "Aa" }
            sound: "de.a:"
          - text: "Ameise"
            say: { de: "Ameise.", en: "Ameise means ant. Can you hear the aaa at the start?" }
            show: { object: ant }
          - text: "Did you know? In German, every noun starts with a capital letter."
            say: { en: "Did you know? In German, the word for every person, animal and thing starts with a big letter. Look: Oma, Lama, Mama, all big at the start!" }
            show: { drawn: word-card, text: "Oma Lama Mama" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: { en: "Listen. Which letter makes this sound?" }
                audio: { sound: "de.o:" }
                options: ["O", "L", "A"]
                answer: "O"
                hints:
                  - "Listen again, and make the sound too."
                  - "Your mouth goes round: ooo."
                  - "Round like the letter: it is O."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Does this word start with O?"
                say: { en: "Listen. Does this word start with ooo?", de: "Ohr." }
                show: { object: ear }
                answer: true
                hints:
                  - "Say the word with me: Ohr."
                  - "Is your mouth round at the start?"
                  - "Yes. Ohr starts with ooo."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Does this word start with A?"
                say: { en: "Listen. Does this word start with aaa?", de: "Affe." }
                show: { object: monkey }
                answer: true
                hints:
                  - "Say the word with me: Affe."
                  - "Does your mouth open wide at the start?"
                  - "Yes. Affe starts with a."
              - id: l2-f4
                type: highlight_in_text
                text: "Tap every O and o."
                say: { en: "Tap every letter for ooo, big and small." }
                show: { drawn: letter-card, text: "O a o L O" }
                spans: ["O", "o", "O"]
                hints:
                  - "O is a circle."
                  - "Big O and small o are both round."
                  - "There are three: two big and one small."
              - id: l2-f5
                type: audio_choice
                text: "Which letter does the word start with?"
                say: { en: "Listen. Which letter does the word start with?" }
                audio: { de: "Ofen." }
                show: { object: oven }
                options: ["A", "O", "M"]
                answer: "O"
                hints:
                  - "Say it slowly: Ooofen."
                  - "Is your mouth round, or wide open?"
                  - "Round: Ofen starts with O."
              - id: l2-f6
                type: tracing
                text: "Trace the letter."
                show: { drawn: writing-lines, text: "O", mode: trace, arrows: true }
                char: "O"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: { en: "Listen. Which letter makes this sound?" }
                audio: { sound: "de.a:" }
                options: ["A", "O"]
                answer: "A"
                hints: ["Wide open mouth: aaa."]
              - id: l2-s2
                type: true_false
                text: "Does this word start with O?"
                say: { en: "Listen. Does this word start with ooo?", de: "Sonne." }
                show: { object: sun }
                answer: false
                hints: ["Does it hiss at the start?"]
              - id: l2-s3
                type: highlight_in_text
                text: "Tap every A and a."
                say: { en: "Tap every letter for aaa, big and small." }
                show: { drawn: letter-card, text: "a O A m a" }
                spans: ["a", "A", "a"]
                hints: ["There are three: one big and two small."]
              - id: l2-s4
                type: audio_choice
                text: "Which letter does the word start with?"
                say: { en: "Listen. Which letter does the word start with?" }
                audio: { de: "Apfel." }
                show: { object: apple }
                options: ["O", "A", "L"]
                answer: "A"
                hints: ["Apfel. Does your mouth open wide?"]
              - id: l2-s5
                type: tracing
                text: "Trace the letter."
                show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
                char: "a"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Which letter makes this sound?"
                say: { en: "Listen. Which letter makes this sound?" }
                audio: { sound: "de.o:" }
                options: ["A", "O", "M"]
                answer: "O"
              - id: l2-n2
                type: true_false
                text: "Does this word start with A?"
                say: { en: "Listen. Does this word start with aaa?", de: "Oma." }
                show: { object: grandma }
                answer: false
              - id: l2-n3
                type: audio_choice
                text: "Which letter does the word start with?"
                say: { en: "Listen. Which letter does the word start with?" }
                audio: { de: "Orange." }
                show: { object: orange }
                options: ["A", "O"]
                answer: "O"
              - id: l2-n4
                type: highlight_in_text
                text: "Tap every O and o."
                say: { en: "Tap every letter for ooo, big and small." }
                show: { drawn: letter-card, text: "o A O a" }
                spans: ["o", "O"]
              - id: l2-n5
                type: tracing
                text: "Copy the letter."
                show: { drawn: writing-lines, text: "A", mode: copy, arrows: false }
                char: "A"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Listen. Which letter makes this sound?" }
            audio: { sound: "de.a:" }
            options: ["O", "A", "M"]
            answer: "A"
          - id: l2-c2
            type: true_false
            text: "Does this word start with O?"
            say: { en: "Listen. Does this word start with ooo?", de: "Oktopus." }
            show: { object: octopus }
            answer: true
          - id: l2-c3
            type: true_false
            text: "Does this word start with A?"
            say: { en: "Listen. Does this word start with aaa?", de: "Mond." }
            show: { object: moon }
            answer: false
          - id: l2-c4
            type: audio_choice
            text: "Which letter does the word start with?"
            say: { en: "Listen. Which letter does the word start with?" }
            audio: { de: "Ameise." }
            show: { object: ant }
            options: ["A", "O", "L"]
            answer: "A"
          - id: l2-c5
            type: highlight_in_text
            text: "Tap every A and a."
            say: { en: "Tap every letter for aaa, big and small." }
            show: { drawn: letter-card, text: "A o a L A" }
            spans: ["A", "a", "A"]
          - id: l2-c6
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Listen. Which letter makes this sound?" }
            audio: { sound: "de.o:" }
            options: ["L", "O"]
            answer: "O"

  - n: 3
    title: { de: Erste Wörter, en: First words }
    goal:
      de: "Setz die Buchstaben zu Silben zusammen und lies deine ersten Wörter: Oma, Mama und Lama."
      en: "Join the letters into syllables and read your first words: Oma, Mama and Lama."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Do you remember? Which letter makes this sound?" }
            audio: { sound: "de.o:" }
            options: ["O", "M"]
            answer: "O"
            difficulty: easy
          - id: l3-w2
            type: audio_choice
            text: "Which letter makes this sound?"
            say: { en: "Do you remember? Which letter makes this sound?" }
            audio: { sound: "de.a:" }
            options: ["L", "A"]
            answer: "A"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - text: "M a"
            say: { en: "Two sounds: mmm and aaa. What do you think: what do they make together?" }
            show: { drawn: letter-card, text: "M a" }
          - text: "Ma"
            say: { en: "Mmm, aaa: Ma! Two letters together make a syllable. In German, you read from left to right, like this arrow: first M, then a." }
            show: { drawn: letter-card, text: "Ma" }
            sound: de.ma
          - text: "Mama"
            say: { en: "Two syllables make a word. Read with me.", de: "Ma ... ma. Mama!" }
            show: { drawn: syllable-arcs, word: "Mama", syllables: ["Ma", "ma"] }
          - text: "Lama"
            say: { en: "And this one?", de: "La ... ma. Lama!" }
            show: { drawn: syllable-arcs, word: "Lama", syllables: ["La", "ma"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: audio_choice
                text: "Which syllable do you hear?"
                say: { en: "Listen. Which syllable do you hear?" }
                audio: { sound: de.la }
                options: ["La", "Lo", "Ma"]
                answer: "La"
                hints:
                  - "Listen for the first sound, then the second."
                  - "Lll, then aaa. Your mouth opens wide."
                  - "La."
              - id: l3-f2
                type: image_multiple_choice
                text: "Read the word. Which picture fits?"
                say: { en: "Read the word. Which picture fits?" }
                show: { drawn: syllable-arcs, word: "Oma", syllables: ["O", "ma"] }
                options: [{ object: grandma }, { object: mum }, { object: llama }]
                answer: grandma
                option_audio: false
                hints:
                  - "Read one arc at a time, from left to right."
                  - "O ... ma."
                  - "Oma: grandma."
                difficulty: easy
              - id: l3-f3
                type: audio_choice
                text: "Which syllable do you hear?"
                say: { en: "Listen. Which syllable do you hear?" }
                audio: { sound: de.mo }
                options: ["Mo", "Ma", "Lo"]
                answer: "Mo"
                hints:
                  - "Does it start with a hum?"
                  - "Mmm, then ooo. Your mouth goes round."
                  - "Mo."
              - id: l3-f4
                type: fill_in_blank
                text: "Which letter is missing?"
                say: { en: "Listen. Which letter is missing?", de: "Lama." }
                show: { object: llama }
                frame: "_ama"
                options: ["L", "M", "O"]
                answer: ["L"]
                hints:
                  - "Say the word slowly."
                  - "Lll ... ama. Which sound is missing at the front?"
                  - "The lll is missing: L."
              - id: l3-f5
                type: image_multiple_choice
                text: "Read the word. Which picture fits?"
                say: { en: "Read the word. Which picture fits?" }
                show: { drawn: syllable-arcs, word: "Mama", syllables: ["Ma", "ma"] }
                options: [{ object: llama }, { object: mum }, { object: grandma }]
                answer: mum
                option_audio: false
                hints:
                  - "Read the first arc. Which sound is at the start?"
                  - "Ma ... ma. The same syllable twice."
                  - "Mama: mum."

          - support: some
            tasks:
              - id: l3-s1
                type: audio_choice
                text: "Which syllable do you hear?"
                say: { en: "Listen. Which syllable do you hear?" }
                audio: { sound: de.ma }
                options: ["La", "Ma", "Mo"]
                answer: "Ma"
                hints: ["Mmm, then aaa."]
              - id: l3-s2
