# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.weather
skill: world.nature.weather
curriculum: de-DE
language: de
title:
  de: Wie ist das Wetter?
  en: What is the weather like?
summary: >
  Mia is the class Wetterkind this week: every morning she looks out of
  the window and sticks a weather symbol on the class weather calendar.
  Lesson 1 names the weather and its symbols (Sonne, Wolken, Regen,
  Schnee, Wind) and warm and kalt, and shows that wind is seen by what it
  moves. Lesson 2 chooses clothes for the weather, shows that the weather
  can change in one day, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Jahreszeiten und Wetter, en: Seasons and weather }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.nature.seasons]
  also_practises: []
  vocabulary: { de: [Wetter, Wetterzeichen, Sonne, Wolke, bewölkt, Regen, Schnee, Wind, windig, warm, kalt, heiß, Gummistiefel, Mütze, Hut] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: name, what: { de: "das Wetter benennen und das passende Wetterzeichen finden", en: "naming the weather and finding its symbol" } }
    - { id: observe, what: { de: "Wetter beobachten: Wind an dem erkennen, was er bewegt, warm und kalt, Wetter ändert sich", en: "observing weather: seeing wind by what it moves, warm and cold, weather changes" } }
    - { id: dress, what: { de: "sich passend zum Wetter anziehen", en: "dressing for the weather" } }
  misconceptions:
    - id: wind-visible
      what: Thinks wind itself can be seen, or does not know how to tell that it is windy
      addressed: "lesson 1 Learn says Den Wind kannst du nicht sehen and shows the kite; l1-f5, l1-s5, l1-n2, l1-c2, l1-c6, l2-w1, l2-c6, l2-c7 and l2-c12"
    - id: weather-stays
      what: Thinks the weather in the morning stays the same all day
      addressed: "lesson 2 Learn shows sun, clouds and rain in one day; l2-f4, l2-s2, l2-s5 and l2-c9"
    - id: clothes-not-weather
      what: Chooses clothes by liking, not by the weather (a thick jumper in the heat)
      addressed: "lesson 2 Learn names clothes for rain, cold and sun; l2-f1, l2-f3, l2-s3, l2-n3, l2-c13 and l2-c15"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wie ist das Wetter?", en: "What is the weather like?" }
    goal:
      de: "Schau aus dem Fenster und sag, wie das Wetter ist. Fallen Tropfen vom Himmel, dann regnet es."
      en: "Look out of the window and say what the weather is like. If drops fall from the sky, it is raining."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "In welcher Jahreszeit schneit es am meisten?"
            options: ["im Sommer", "im Winter"]
            answer: "im Winter"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Im Sommer ist es meistens warm.\n\nStimmt das?"
            say: "Im Sommer ist es meistens warm. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Welches Wetterzeichen passt?"
            say: "Das ist Mia. Diese Woche ist Mia das Wetterkind in ihrer Klasse. Jeden Morgen schaut sie aus dem Fenster und klebt ein Wetterzeichen an den Wetterkalender. Heute ist der Himmel grau, und es tropft auf die Straße. Was glaubst du: Welches Zeichen klebt Mia heute an?"
            show: { objects: [sun, rain, snow] }
          - text: "Es regnet."
            say: "Es regnet! Mia klebt die Wolke mit den Tropfen an. Das ist das Zeichen für Regen. Der Regen fällt aus den Wolken."
            show: { object: rain }
          - text: "Die Sonne scheint."
            say: "Am nächsten Morgen ist der Himmel blau, und alles ist hell. Die Sonne scheint. Das Zeichen dafür ist eine gelbe Sonne."
            show: { object: sun }
          - text: "Es ist bewölkt."
            say: "Manchmal ist der Himmel voller Wolken, und die Sonne ist versteckt. Es regnet aber nicht. Dann sagen wir: Es ist bewölkt. Das Zeichen ist eine Wolke."
            show: { object: cloud }
          - text: "Es schneit."
            say: "Wenn es sehr kalt ist, fallen aus den Wolken weiße Flocken statt Tropfen. Dann schneit es."
            show: { object: snow }
          - text: "Es ist windig."
            say: "Den Wind kannst du nicht sehen. Aber du siehst, was er bewegt: Die Blätter fliegen, die Äste wackeln, und der Drachen steigt hoch. Dann ist es windig."
            show: { objects: [wind, kite] }
          - text: "Warm oder kalt?"
            say: "Mia spürt das Wetter auch auf der Haut. Wenn die Sonne scheint, ist es oft warm. Wenn es schneit, ist es kalt."
            show: { objects: [sun, snowman] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Zeichen passt?"
                say: "Der Himmel ist blau, und es ist hell und warm. Welches Wetterzeichen passt?"
                options: [{ object: sun }, { object: snow }, { object: rain }]
                answer: sun
                feedback:
                  snow: "Brr! Bei Schnee ist es kalt, nicht warm."
                  rain: "Bei Regen ist der Himmel grau, nicht blau."
                hints:
                  - "Was macht den Himmel hell und warm?"
                  - "Bei Regen und Schnee ist der Himmel grau. Hier ist er blau."
                  - "Die Sonne passt."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Was siehst du bei welchem Wetter?"
                say: "Tippe auf ein Wetterzeichen und dann auf das, was du draußen siehst."
                pairs:
                  - left: { object: rain }
                    right: { text: "Tropfen fallen." }
                  - left: { object: snow }
                    right: { text: "Weiße Flocken fallen." }
                  - left: { object: wind }
                    right: { text: "Blätter fliegen." }
                hints:
                  - "Schau dir jedes Zeichen genau an. Was fällt aus der Wolke?"
                  - "Aus der Regenwolke fallen Tropfen, aus der Schneewolke Flocken. Und beim Wind?"
                  - "Regen zu den Tropfen, Schnee zu den Flocken, Wind zu den Blättern."
              - id: l1-f3
                type: true_false
                text: "Bei diesem Wetter ist es warm.\n\nStimmt das?"
                say: "Schau dir das Wetterzeichen an. Bei diesem Wetter ist es warm. Stimmt das?"
                show: { object: snow }
                answer: false
                hints:
                  - "Was fällt hier aus der Wolke?"
                  - "Es schneit. Wann schneit es?"
                  - "Nein. Wenn es schneit, ist es kalt."
              - id: l1-f4
                type: sorting
                text: "Warm oder kalt?"
                say: "Tippe auf ein Bild und hör das Wort. Passt es zu warmem oder zu kaltem Wetter?"
                bins:
                  - { id: warm, show: { text: "warm" }, say: "warm" }
                  - { id: kalt, show: { text: "kalt" }, say: "kalt" }
                options:
                  - { object: sun, bin: warm }
                  - { object: snowman, bin: kalt }
                  - { object: ice-cream, bin: warm }
                  - { object: snowflake, bin: kalt }
                hints:
                  - "Frag bei jedem Bild: Ist es draußen dann warm oder kalt?"
                  - "Ein Schneemann und eine Schneeflocke gibt es nur, wenn es kalt ist."
                  - "Sonne und Eis zu warm, Schneemann und Schneeflocke zu kalt."
              - id: l1-f5
                type: multiple_choice
                text: "Du siehst den Wind nicht. Woran merkst du ihn?"
                options: ["Die Blätter fliegen.", "Die Sonne scheint.", "Die Straße ist nass."]
                answer: "Die Blätter fliegen."
                feedback:
                  "Die Sonne scheint.": "Die Sonne kann auch scheinen, wenn gar kein Wind weht."
                  "Die Straße ist nass.": "Eine nasse Straße zeigt dir Regen, nicht Wind."
                hints:
                  - "Der Wind bewegt Sachen."
                  - "Was bewegt sich, wenn der Wind weht?"
                  - "Die Blätter fliegen."
              - id: l1-f6
                type: image_multiple_choice
                text: "Welches Zeichen passt?"
                say: "Es ist kalt, und weiße Flocken fallen vom Himmel. Welches Wetterzeichen passt?"
                options: [{ object: rain }, { object: snow }, { object: wind }]
                answer: snow
                hints:
                  - "Fallen Tropfen oder Flocken?"
                  - "Weiße Flocken sind Schnee. Such die Wolke mit den Flocken."
                  - "Das Zeichen für Schnee."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Wenn die Sonne scheint, ist der Himmel voller Wolken.\n\nStimmt das?"
                say: "Wenn die Sonne scheint, ist der Himmel voller Wolken. Stimmt das?"
                show: { object: sun }
                answer: false
                hints: ["Wenn der Himmel voller Wolken ist, ist die Sonne versteckt."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Zeichen passt?"
                say: "Der Himmel ist grau. Die Sonne ist hinter den Wolken versteckt. Es regnet nicht. Welches Wetterzeichen passt?"
                options: [{ object: cloud }, { object: rain }, { object: sun }]
                answer: cloud
                feedback:
                  rain: "Es regnet nicht, also fallen keine Tropfen."
                hints: ["Es ist bewölkt. Welches Zeichen hat nur Wolken?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Wenn es sehr kalt ist, fällt _ aus den Wolken."
                options: ["Schnee", "Sand", "Saft"]
                answer: ["Schnee"]
                feedback:
                  Sand: "Sand aus den Wolken? Dann könntest du eine Sandburg auf dem Dach bauen!"
                  Saft: "Lecker, aber aus den Wolken fällt kein Saft."
                hints: ["Was ist weiß und kalt und fällt im Winter?"]
              - id: l1-s4
                type: sorting
                text: "Regen oder Sonne?"
                say: "Tippe auf ein Bild und hör das Wort. Passt es zu Regen oder zu Sonne?"
                bins:
                  - { id: regen, show: { object: rain }, say: "Regen" }
                  - { id: sonne, show: { object: sun }, say: "Sonne" }
                options:
                  - { object: puddle, bin: regen }
                  - { object: umbrella, bin: regen }
                  - { object: ice-cream, bin: sonne }
                  - { object: sandcastle, bin: sonne }
                hints: ["Eine Pfütze bleibt nach dem Regen liegen."]
              - id: l1-s5
                type: multiple_choice
                text: "Der Drachen steigt hoch in die Luft. Was zeigt er dir?"
                show: { object: kite }
                options: ["Es ist windig.", "Es ist kalt.", "Es regnet."]
                answer: "Es ist windig."
                hints: ["Ohne Wind fällt der Drachen herunter."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welches Zeichen passt?"
                say: "Mia sieht Tropfen am Fenster und eine Pfütze auf dem Schulhof. Welches Wetterzeichen klebt sie an?"
                options: [{ object: sun }, { object: rain }, { object: wind }]
                answer: rain
              - id: l1-n2
                type: true_false
                text: "Den Wind kannst du sehen.\n\nStimmt das?"
                say: "Den Wind kannst du sehen. Stimmt das?"
                answer: false
              - id: l1-n3
                type: matching
                text: "Welcher Satz passt zu welchem Zeichen?"
                say: "Tippe auf ein Wetterzeichen und dann auf den Satz, der dazu passt."
                pairs:
                  - left: { object: sun }
                    right: { text: "Die Sonne scheint." }
                  - left: { object: snow }
                    right: { text: "Es schneit." }
                  - left: { object: cloud }
                    right: { text: "Es ist bewölkt." }
                  - left: { object: wind }
                    right: { text: "Es ist windig." }
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Wenn die Sonne scheint, ist es oft _."
                options: ["warm", "kalt", "nass"]
                answer: ["warm"]
              - id: l1-n5
                type: sorting
                text: "Warm oder kalt?"
                say: "Tippe auf ein Bild und hör das Wort. Passt es zu warmem oder zu kaltem Wetter?"
                bins:
                  - { id: warm, show: { text: "warm" }, say: "warm" }
                  - { id: kalt, show: { text: "kalt" }, say: "kalt" }
                options:
                  - { object: swim, bin: warm }
                  - { object: snow, bin: kalt }
                  - { object: sun, bin: warm }
                  - { object: woolly-hat, bin: kalt }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Zeichen passt?"
            say: "Mia geht hinaus und wird nass, ohne in eine Pfütze zu springen. Welches Wetterzeichen passt?"
            options: [{ object: rain }, { object: sun }, { object: cloud }]
            answer: rain
          - id: l1-c2
            type: true_false
            text: "Bei diesem Wetter fliegen Blätter durch die Luft.\n\nStimmt das?"
            say: "Bei diesem Wetter fliegen Blätter durch die Luft. Stimmt das?"
            show: { object: wind }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wann ist es kalt?"
            options: ["wenn es schneit", "wenn im Sommer die Sonne scheint"]
            answer: "wenn es schneit"
          - id: l1-c4
            type: true_false
            text: "Bei diesem Wetter schneit es.\n\nStimmt das?"
            say: "Schau dir das Wetterzeichen an. Bei diesem Wetter schneit es. Stimmt das?"
            show: { object: sun }
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Aus den Wolken fällt _."
            options: ["Regen", "Sonne", "Wind"]
            answer: ["Regen"]
          - id: l1-c6
            type: image_multiple_choice
            text: "Welches Zeichen passt?"
            say: "Der Drachen fliegt hoch, und die Äste wackeln. Welches Wetterzeichen passt?"
            options: [{ object: wind }, { object: snow }, { object: rain }]
            answer: wind

  - n: 2
    title: { de: "Was ziehe ich an?", en: "What shall I wear?" }
    goal:
      de: "Zieh dich passend zum Wetter an. Bei Regen helfen Jacke und Gummistiefel, bei Schnee eine Mütze."
      en: "Dress for the weather. In the rain a jacket and wellies help, in the snow a woolly hat."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was zeigt dir, dass es windig ist?"
            say: "Welches Bild zeigt dir, dass es windig ist?"
            options: [{ object: kite }, { object: snowman }, { object: puddle }]
            answer: kite
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Wenn es schneit, ist es warm.\n\nStimmt das?"
            say: "Wenn es schneit, ist es warm. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was zieht Mia an?"
            say: "Heute klebt Mia die Regenwolke an den Wetterkalender. Gleich gehen alle Kinder hinaus in die Pause. Was glaubst du: Was soll Mia anziehen, nur ein T-Shirt oder eine Jacke und Gummistiefel?"
            show: { objects: [t-shirt, wellies] }
          - text: "Bei Regen: Jacke und Gummistiefel."
            say: "Bei Regen braucht Mia eine Regenjacke und Gummistiefel. Dann bleibt sie trocken, sogar in der Pfütze."
            show: { objects: [jacket, wellies] }
          - text: "Bei Kälte: Mütze und Pullover."
            say: "Wenn es kalt ist oder schneit, zieht Mia eine Mütze, einen dicken Pullover und eine warme Jacke an."
            show: { objects: [woolly-hat, jumper] }
          - text: "Bei Sonne: T-Shirt und Hut."
            say: "Wenn die Sonne heiß scheint, reicht ein T-Shirt. Ein Hut schützt den Kopf vor der Sonne, und Mia trinkt viel Wasser. Schau nie direkt in die Sonne. Das schadet deinen Augen."
            show: { objects: [t-shirt, hat] }
          - text: "Das Wetter ändert sich."
            say: "Am Morgen scheint die Sonne. Am Mittag kommen dunkle Wolken. Am Nachmittag regnet es. Das Wetter kann sich an einem Tag ändern. Darum schaut Mia jeden Tag neu."
            show: { objects: [sun, cloud, rain] }
          - text: "Wusstest du? Fast jede Schneeflocke hat sechs Zacken."
            say: "Wusstest du? Fast jede Schneeflocke hat sechs Zacken. Fang im Winter eine Flocke auf deinem dunklen Handschuh und zähl nach!"
            show: { object: snowflake }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Regen oder Sonne?"
                say: "Hilf Mia packen. Tippe auf ein Bild und hör das Wort. Braucht Mia es bei Regen oder bei Sonne?"
                bins:
                  - { id: regen, show: { object: rain }, say: "Regen" }
                  - { id: sonne, show: { object: sun }, say: "Sonne" }
                options:
                  - { object: wellies, bin: regen }
                  - { object: jacket, bin: regen }
                  - { object: t-shirt, bin: sonne }
                  - { object: hat, bin: sonne }
                hints:
                  - "Frag bei jedem Bild: Hält es mich trocken, oder hilft es mir in der Hitze?"
                  - "Gummistiefel und Jacke halten den Regen ab. Im T-Shirt ist es nicht so heiß."
                  - "Gummistiefel und Jacke zu Regen, T-Shirt und Hut zu Sonne."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Es schneit. Was setzt Mia auf?"
                say: "Es schneit. Was setzt Mia auf den Kopf?"
                options: [{ object: woolly-hat }, { object: hat }, { object: crown }]
                answer: woolly-hat
                feedback:
                  crown: "Eine Krone ist schick, aber sie hält die Ohren nicht warm!"
                  hat: "Der Hut schützt vor der Sonne. Bei Schnee braucht Mia etwas Warmes."
                hints:
                  - "Bei Schnee ist es kalt. Was hält den Kopf warm?"
                  - "Die Mütze ist aus dicker Wolle."
                  - "Die Mütze."
              - id: l2-f3
                type: true_false
                text: "Es ist heiß. Mia zieht ihren dicken Pullover an.\n\nIst das gut?"
                say: "Die Sonne scheint, und es ist heiß. Mia zieht ihren dicken Pullover an. Ist das gut?"
                answer: false
                hints:
                  - "Wann braucht man einen dicken Pullover?"
                  - "Ein dicker Pullover hält warm. Ist es heute kalt?"
                  - "Nein. Bei Hitze reicht ein T-Shirt."
              - id: l2-f4
                type: ordering
                text: "Morgens Sonne, mittags Wolken, nachmittags Regen. Leg die Zeichen in die richtige Reihenfolge."
                say: "So war das Wetter heute: Am Morgen hat die Sonne geschienen. Am Mittag kamen Wolken. Am Nachmittag hat es geregnet. Leg die Wetterzeichen in die richtige Reihenfolge."
                options: [{ object: rain }, { object: sun }, { object: cloud }]
                slot_count: 3
                answer: [sun, cloud, rain]
                hints:
                  - "Was war am Morgen, ganz am Anfang des Tages?"
                  - "Zuerst die Sonne. Was kam am Mittag?"
                  - "Sonne, Wolke, Regen."
              - id: l2-f5
                type: multiple_choice
                text: "Warum trägt Mia bei Regen Gummistiefel?"
                options: ["Damit ihre Füße trocken bleiben.", "Damit sie schneller rennt.", "Weil Gummistiefel gelb sind."]
                answer: "Damit ihre Füße trocken bleiben."
                feedback:
                  "Damit sie schneller rennt.": "Mit Gummistiefeln rennt man eher langsamer!"
                hints:
                  - "Was passiert mit den Füßen in einer Pfütze?"
                  - "Durch Gummi kommt kein Wasser."
                  - "Damit ihre Füße trocken bleiben."
              - id: l2-f6
                type: image_multiple_choice
                text: "Es ist heiß. Was nimmt Mia mit nach draußen?"
                say: "Die Sonne scheint heiß. Was nimmt Mia mit nach draußen?"
                options: [{ object: bottle }, { object: woolly-hat }, { object: jumper }]
                answer: bottle
                hints:
                  - "Was braucht dein Körper, wenn es heiß ist?"
                  - "Mütze und Pullover sind für kaltes Wetter."
                  - "Die Flasche mit Wasser."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Es regnet stark. Was nimmt Mia mit?"
                say: "Es regnet stark. Was nimmt Mia mit?"
                options: [{ object: umbrella }, { object: ice-cream }, { object: kite }]
                answer: umbrella
                feedback:
                  kite: "Ein Drachen braucht Wind. Im Regen wird er nur nass."
                hints: ["Was hält den Regen von deinem Kopf ab?"]
              - id: l2-s2
                type: true_false
                text: "Am Morgen scheint die Sonne. Dann bleibt es den ganzen Tag sonnig.\n\nStimmt das immer?"
                say: "Am Morgen scheint die Sonne. Dann bleibt es den ganzen Tag sonnig. Stimmt das immer?"
                answer: false
                hints: ["Denk an Mias Tag mit Sonne, Wolken und Regen."]
              - id: l2-s3
                type: matching
                text: "Was passt zu welchem Wetter?"
                say: "Tippe auf ein Wetterzeichen und dann auf das, was du dabei anziehst."
                pairs:
                  - left: { object: rain }
                    right: { object: wellies }
                  - left: { object: snow }
                    right: { object: woolly-hat }
                  - left: { object: sun }
                    right: { object: t-shirt }
                hints: ["Gummistiefel halten trocken, die Mütze hält warm."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Schau nie direkt in die _."
                options: ["Sonne", "Pfütze", "Wolke"]
                answer: ["Sonne"]
                hints: ["Was ist so hell, dass es deinen Augen schadet?"]
              - id: l2-s5
                type: multiple_choice
                text: "Mia sieht dunkle Wolken. Was kommt wohl bald?"
                show: { object: cloud }
                options: ["Regen", "ein heißer Sonnentag", "ein blauer Himmel"]
                answer: "Regen"
                hints: ["Aus dunklen Wolken fallen oft Tropfen."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Kalt oder heiß?"
                say: "Tippe auf ein Bild und hör das Wort. Passt es zu kaltem oder zu heißem Wetter?"
                bins:
                  - { id: kalt, show: { text: "kalt" }, say: "kalt" }
                  - { id: heiss, show: { text: "heiß" }, say: "heiß" }
                options:
                  - { object: jumper, bin: kalt }
                  - { object: woolly-hat, bin: kalt }
                  - { object: ice-cream, bin: heiss }
                  - { object: swimming-pool, bin: heiss }
              - id: l2-n2
                type: image_multiple_choice
                text: "Was braucht Wind, damit es fliegt?"
                say: "Was braucht Wind, damit es fliegt?"
                options: [{ object: kite }, { object: ball }, { object: bike }]
                answer: kite
              - id: l2-n3
                type: true_false
                text: "Es schneit. Mia zieht Mütze und warme Jacke an.\n\nIst das gut?"
                say: "Es schneit. Mia zieht Mütze und warme Jacke an. Ist das gut?"
                answer: true
              - id: l2-n4
