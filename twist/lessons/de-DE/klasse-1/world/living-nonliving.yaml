# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.living-nonliving
skill: world.nature.living-nonliving
curriculum: de-DE
language: de
title:
  de: Lebt das?
  en: Is it alive?
summary: >
  The first Sachunterricht lessons on nature. Blip, a small visitor from
  the moon where nothing lives, lands in Lina's garden and keeps asking
  "Lebt das?". Lesson 1 sets Lebewesen (animals and people) apart from
  Dinge and names three signs of life: they grow, need food and water,
  and have young. A teddy looks like a bear but is a Ding, and the child
  is a Lebewesen too. Lesson 2 shows that plants live although they stand
  still, that moving is not a sign of life (car, cloud, balloon), and
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Natur um mich, en: Nature around me }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [Lebewesen, Ding, leben, wachsen, Nahrung, Wasser, Junge, Pflanze, Tier, Mensch, Samen] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: sort, what: { de: Lebewesen und Dinge unterscheiden, en: telling living things from non-living things } }
    - { id: signs, what: { de: "sagen, woran man Lebewesen erkennt (wachsen, Nahrung und Wasser, Junge)", en: "saying how you know something is alive (it grows, needs food and water, has young)" } }
    - { id: tricky, what: { de: "schwierige Fälle: Pflanzen leben, und was sich bewegt, lebt nicht immer", en: "tricky cases: plants are alive, and moving things are not always alive" } }
  misconceptions:
    - id: moves-means-alive
      what: Thinks that whatever moves is alive (the car, a cloud, a balloon, a kite, a train)
      addressed: "lesson 1 Learn opens with the cat and the car; lesson 2 Learn shows the cloud and says Bewegen heißt nicht leben; l1-f2 (feedback), l2-f2, l2-s1, l2-s2, l2-s5, l2-n2, l2-c14, l2-c17 and l2-c20"
    - id: plants-not-alive
      what: Thinks plants are not alive because they do not move, eat or make sounds
      addressed: "lesson 2 Learn opens with the guess Lebt der Baum? and says plants grow, need water and grow from seeds; l2-f1, l2-f3, l2-f5, l2-n4, l2-n5, l2-c15, l2-c18 and l2-c19"
    - id: lookalike-toy
      what: Thinks a toy that looks like an animal (a teddy) is alive
      addressed: "lesson 1 Learn shows the teddy and checks it against the three signs; l1-f3, l1-s3, l1-n4, l2-w2 and l2-c16"
    - id: people-left-out
      what: Does not count people as Lebewesen, only animals
      addressed: "lesson 1 Learn says Du bist auch ein Lebewesen; l1-f4, l1-s2, l1-s3, l2-f4, l2-c5 and l2-c12"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Lebt das?", en: "Is it alive?" }
    goal:
      de: "Find heraus, was lebt. Die Katze wächst, frisst und bekommt Junge, das Auto nicht."
      en: "Find out what is alive. The cat grows, eats and has young, the car does not."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lebt das?"
            say: "Das ist Blip. Blip kommt vom Mond. Auf dem Mond lebt nichts. Jetzt ist Blip in Linas Garten und staunt. Die Katze läuft. Das Auto fährt. Was glaubst du: Leben beide?"
            show: { objects: [cat, car] }
          - text: "Nur die Katze lebt."
            say: "Nur die Katze lebt! Die Katze ist ein Lebewesen. Das Auto fährt, aber es lebt nicht. Das Auto ist ein Ding."
            show: { objects: [cat, car] }
          - text: "Lebewesen wachsen."
            say: "Woran erkennst du ein Lebewesen? Lebewesen wachsen. Aus dem kleinen Welpen wird ein großer Hund."
            show: { objects: [puppy, dog] }
          - text: "Lebewesen brauchen Nahrung und Wasser."
            say: "Lebewesen brauchen Nahrung und Wasser. Der Hase frisst eine Möhre."
            show: { objects: [rabbit, carrot] }
          - text: "Lebewesen bekommen Junge."
            say: "Lebewesen bekommen Junge. Das Schaf bekommt ein Lamm."
            show: { objects: [sheep, lamb] }
          - text: "Du bist auch ein Lebewesen."
            say: "Und du? Du bist auch ein Lebewesen! Du warst einmal ein Baby, und du wächst immer weiter. Menschen sind Lebewesen."
            show: { objects: [baby, child] }
          - text: "Der Teddy lebt nicht."
            say: "Blip zeigt auf den Teddy. Er hat Ohren und Augen wie ein Bär! Aber der Teddy wächst nicht, er isst nichts, und er bekommt keine Jungen. Der Teddy ist ein Ding."
            show: { object: teddy }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Lebewesen oder Ding?"
                say: "Hilf Blip. Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
                bins:
                  - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: dog, bin: lebewesen }
                  - { object: ball, bin: ding }
                  - { object: cow, bin: lebewesen }
                  - { object: stone, bin: ding }
                hints:
                  - "Frag bei jedem Bild: Wächst es? Braucht es Nahrung?"
                  - "Der Hund und die Kuh fressen und wachsen. Der Ball und der Stein nicht."
                  - "Hund und Kuh zu den Lebewesen, Ball und Stein zu den Dingen."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Was lebt?"
                say: "Welches Bild zeigt ein Lebewesen?"
                options: [{ object: car }, { object: horse }, { object: bike }]
                answer: horse
                feedback:
                  car: "Brumm! Das Auto fährt schnell, aber es wächst nicht und frisst nichts."
                  bike: "Das Fahrrad fährt nur, wenn du trittst. Es wächst nicht."
                hints:
                  - "Was davon wächst und frisst?"
                  - "Auto und Fahrrad fahren. Aber werden sie größer?"
                  - "Das Pferd lebt."
              - id: l1-f3
                type: true_false
                text: "Lebt der Teddy?"
                say: "Der Teddy sieht aus wie ein Bär. Lebt der Teddy?"
                show: { object: teddy }
                answer: false
                hints:
                  - "Wächst der Teddy? Isst er etwas?"
                  - "Der Teddy bleibt immer gleich groß und bekommt keine Jungen."
                  - "Nein. Der Teddy ist ein Ding."
              - id: l1-f4
                type: matching
                text: "Wer bekommt welches Junge?"
                say: "Lebewesen bekommen Junge. Tippe auf ein Bild und dann auf sein Junges."
                pairs:
                  - left: { object: dog }
                    right: { object: puppy }
                  - left: { object: sheep }
                    right: { object: lamb }
                  - left: { object: mum }
                    right: { object: baby }
                hints:
                  - "Such zu jedem großen Lebewesen das kleine, das genauso aussieht."
                  - "Aus dem Welpen wird ein Hund. Aus dem Lamm wird ein Schaf."
                  - "Hund und Welpe, Schaf und Lamm, Mama und Baby."
              - id: l1-f5
                type: multiple_choice
                text: "Woran erkennst du ein Lebewesen?"
                options: ["Es wächst.", "Es ist bunt.", "Es fährt."]
                answer: "Es wächst."
                feedback:
                  "Es ist bunt.": "Ein bunter Ball lebt nicht. Und ein grauer Elefant lebt!"
                  "Es fährt.": "Ein Auto fährt, aber es lebt nicht."
                hints:
                  - "Denk an den Welpen und den Hund."
                  - "Der kleine Welpe wird groß. Was macht er?"
                  - "Es wächst."
              - id: l1-f6
                type: image_multiple_choice
                text: "Was ist ein Ding?"
                say: "Welches Bild zeigt ein Ding?"
                options: [{ object: cat }, { object: stone }, { object: duck }]
                answer: stone
                hints:
                  - "Ein Ding wächst nicht und frisst nichts."
                  - "Katze und Ente fressen. Und der Stein?"
                  - "Der Stein ist ein Ding."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was lebt nicht?"
                say: "Welches Bild zeigt etwas, das nicht lebt?"
                options: [{ object: snail }, { object: ball }, { object: bird }]
                answer: ball
                feedback:
                  snail: "Die Schnecke ist langsam, aber sie lebt. Sie frisst Blätter."
                hints: ["Was davon wächst nie?"]
              - id: l1-s2
                type: true_false
                text: "Ist das Baby ein Lebewesen?"
                show: { object: baby }
                answer: true
                hints: ["Das Baby trinkt Milch und wird jeden Tag ein bisschen größer."]
              - id: l1-s3
                type: sorting
                text: "Lebewesen oder Ding?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
                bins:
                  - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: fish, bin: lebewesen }
                  - { object: teddy, bin: ding }
                  - { object: child, bin: lebewesen }
                  - { object: car, bin: ding }
                hints: ["Menschen sind auch Lebewesen. Ein Teddy sieht nur aus wie ein Tier."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Ein Lebewesen braucht _."
                options: ["Wasser", "Batterien", "Farbe"]
                answer: ["Wasser"]
                feedback:
                  Batterien: "Batterien braucht ein Spielzeugauto. Ein Hund braucht keine!"
                hints: ["Was trinken der Hund, die Katze und du jeden Tag?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was wächst?"
                say: "Welches Bild zeigt etwas, das wächst?"
                options: [{ object: teddy }, { object: puppy }, { object: car }]
                answer: puppy
                hints: ["Was wird jeden Tag ein bisschen größer?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Lebewesen oder Ding?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
                bins:
                  - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: pig, bin: lebewesen }
                  - { object: lamp, bin: ding }
                  - { object: spider, bin: lebewesen }
                  - { object: cup, bin: ding }
              - id: l1-n2
                type: true_false
                text: "Lebt der Stein?"
                show: { object: stone }
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Was ist ein Lebewesen?"
                say: "Welches Bild zeigt ein Lebewesen?"
                options: [{ object: clock }, { object: frog }, { object: kite }]
                answer: frog
              - id: l1-n4
                type: multiple_choice
                text: "Warum ist der Teddy kein Lebewesen?"
                show: { object: teddy }
                options: ["Er wächst nicht.", "Er ist braun.", "Er ist weich."]
                answer: "Er wächst nicht."
              - id: l1-n5
                type: true_false
                text: "Die Katze wächst.\n\nStimmt das?"
                say: "Die Katze wächst. Stimmt das?"
                show: { object: cat }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was lebt?"
            say: "Welches Bild zeigt ein Lebewesen?"
            options: [{ object: boat }, { object: hedgehog }, { object: balloon }]
            answer: hedgehog
          - id: l1-c2
            type: sorting
            text: "Lebewesen oder Ding?"
            say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
            bins:
              - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
              - { id: ding, show: { text: "Ding" }, say: "Ding" }
            options:
              - { object: elephant, bin: lebewesen }
              - { object: book, bin: ding }
              - { object: bee, bin: lebewesen }
              - { object: bike, bin: ding }
          - id: l1-c3
            type: true_false
            text: "Lebt der Ball?"
            show: { object: ball }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Woran erkennst du ein Lebewesen?"
            options: ["Es braucht Nahrung.", "Es ist rund.", "Es hat Räder."]
            answer: "Es braucht Nahrung."
          - id: l1-c5
            type: image_multiple_choice
            text: "Was ist ein Ding?"
            say: "Welches Bild zeigt ein Ding?"
            options: [{ object: owl }, { object: teddy }, { object: girl }]
            answer: teddy
          - id: l1-c6
            type: true_false
            text: "Bekommt die Kuh Junge?"
            show: { object: cow }
            answer: true

  - n: 2
    title: { de: Pflanzen leben auch, en: Plants are alive too }
    goal:
      de: "Auch Pflanzen leben, obwohl sie still stehen. Und nicht alles, was sich bewegt, lebt, wie die Wolke."
      en: "Plants are alive too, even though they stand still. And not everything that moves is alive, like a cloud."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was lebt?"
            say: "Welches Bild zeigt ein Lebewesen?"
            options: [{ object: lorry }, { object: giraffe }]
            answer: giraffe
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Wächst der Teddy?"
            show: { object: teddy }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lebt der Baum?"
            say: "Blip ist wieder in Linas Garten. Der Baum steht ganz still. Er läuft nicht weg, er bellt nicht, er frisst nichts. Was glaubst du: Lebt der Baum?"
            show: { object: tree }
          - text: "Ja! Der Baum lebt."
            say: "Ja! Der Baum lebt. Er ist ein Lebewesen. Pflanzen wachsen, auch wenn sie still stehen. Sie brauchen Wasser und Licht."
            show: { objects: [tree, watering-can] }
          - text: "Pflanzen sind Lebewesen."
            say: "Die Blume und die Rose sind auch Pflanzen. Sie wachsen aus einem kleinen Samen. Und aus ihren Samen wachsen wieder neue Pflanzen. So bekommen Pflanzen Junge."
            show: { objects: [flower, rose] }
          - text: "Lebt die Wolke?"
            say: "Blip zeigt nach oben. Die Wolke zieht über den Himmel! Lebt sie? Nein. Der Wind schiebt sie. Die Wolke frisst nichts und bekommt keine Jungen. Sie ist kein Lebewesen."
            show: { object: cloud }
          - text: "Was sich bewegt, lebt nicht immer."
            say: "Das Auto fährt, der Luftballon fliegt. Aber sie leben nicht. Frag immer: Wächst es? Braucht es Nahrung und Wasser? Bekommt es Junge?"
            show: { objects: [car, balloon] }
          - text: "Wusstest du? Manche Bäume sind über 4000 Jahre alt."
            say: "Wusstest du? Manche Bäume sind über viertausend Jahre alt. Sie wachsen schon so lange, dass sie viel älter sind als jeder Mensch."
            show: { object: tree }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Lebewesen oder Ding?"
                say: "Blip sammelt Sachen aus dem Garten. Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
                bins:
                  - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: tree, bin: lebewesen }
                  - { object: bucket, bin: ding }
                  - { object: flower, bin: lebewesen }
                  - { object: stone, bin: ding }
                hints:
                  - "Frag bei jedem Bild: Wächst es?"
                  - "Der Baum und die Blume stehen still, aber sie wachsen. Der Eimer und der Stein wachsen nie."
                  - "Baum und Blume zu den Lebewesen, Eimer und Stein zu den Dingen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Die Wolke bewegt sich. Lebt sie?"
                show: { object: cloud }
                answer: false
                hints:
                  - "Bewegen allein heißt nicht leben."
                  - "Frisst die Wolke etwas? Bekommt sie Junge?"
                  - "Nein. Die Wolke lebt nicht."
              - id: l2-f3
                type: image_multiple_choice
                text: "Was lebt?"
                say: "Blip sieht drei Sachen, die ganz still stehen. Nur eine davon lebt. Welche?"
                options: [{ object: rose }, { object: bench }, { object: fence }]
                answer: rose
                hints:
                  - "Was davon wächst?"
                  - "Die Bank und der Zaun werden nie größer. Und die Rose?"
                  - "Die Rose lebt. Sie ist eine Pflanze."
              - id: l2-f4
                type: ordering
                text: "Vom Jüngsten zum Ältesten"
                say: "Lina zeigt Blip Bilder von ihrer Familie. Menschen wachsen und werden älter. Leg die Bilder vom Jüngsten zum Ältesten."
                options: [{ object: mum }, { object: baby }, { object: grandma }, { object: child }]
                slot_count: 4
                answer: [baby, child, mum, grandma]
                hints:
                  - "Wer ist am kleinsten und jüngsten?"
                  - "Zuerst das Baby. Dann kommt das Kind."
                  - "Baby, Kind, Mama, Oma."
              - id: l2-f5
                type: multiple_choice
                text: "Was braucht die Blume zum Wachsen?"
                say: "Lina will, dass ihre Blume wächst. Was braucht die Blume?"
                show: { object: flower }
                options: ["Wasser", "Batterien", "einen Motor"]
                answer: "Wasser"
                feedback:
                  Batterien: "Eine Blume mit Batterien? Die gibt es nicht! Pflanzen brauchen Wasser und Licht."
                  einen Motor: "Brumm! Eine Blume braucht keinen Motor. Sie wächst ganz leise."
                hints:
                  - "Was hat Lina in der Gießkanne?"
                  - "Pflanzen brauchen Wasser und Licht."
                  - "Wasser."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was bewegt sich, lebt aber nicht?"
                say: "Blip sieht drei Sachen, die sich bewegen. Welche lebt nicht?"
                options: [{ object: car }, { object: cat }, { object: bird }]
                answer: car
                hints: ["Frag: Wächst es? Frisst es?"]
              - id: l2-s2
                type: sorting
                text: "Lebewesen oder Ding?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
                bins:
                  - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: fir-tree, bin: lebewesen }
                  - { object: balloon, bin: ding }
                  - { object: worm, bin: lebewesen }
                  - { object: kite, bin: ding }
                hints: ["Der Drachen und der Luftballon fliegen, aber wachsen sie?"]
              - id: l2-s3
                type: true_false
                text: "Die Sonne ist warm und hell. Lebt sie?"
                show: { object: sun }
                answer: false
                hints: ["Frisst die Sonne etwas? Bekommt sie Junge?"]
              - id: l2-s4
                type: matching
                text: "Wer frisst was?"
                say: "Lebewesen brauchen Nahrung. Tippe auf ein Tier und dann auf sein Futter."
                pairs:
                  - left: { object: rabbit }
                    right: { object: carrot }
                  - left: { object: monkey }
                    right: { object: banana }
                  - left: { object: bird }
                    right: { object: worm }
                hints: ["Der Hase frisst die Möhre. Was frisst der Affe?"]
              - id: l2-s5
                type: multiple_choice
                text: "Warum lebt das Auto nicht?"
                show: { object: car }
                options: ["Es wächst nicht.", "Es ist zu schnell.", "Es ist laut."]
                answer: "Es wächst nicht."
                hints: ["Ein schnelles Pferd lebt. Was macht das Pferd, aber nie das Auto?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was lebt?"
                say: "Blip zeigt auf drei Sachen. Welche lebt?"
                options: [{ object: snowman }, { object: snail }, { object: umbrella }]
                answer: snail
              - id: l2-n2
                type: true_false
                text: "Blip sagt: Alles, was sich bewegt, lebt.\n\nStimmt das?"
                say: "Blip sagt: Alles, was sich bewegt, lebt. Stimmt das?"
                answer: false
              - id: l2-n3
                type: sorting
                text: "Lebewesen oder Ding?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Lebewesen oder zu den Dingen."
                bins:
                  - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: rose, bin: lebewesen }
                  - { object: train, bin: ding }
                  - { object: ant, bin: lebewesen }
                  - { object: clock, bin: ding }
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Der Baum steht still, aber er _."
                options: ["lebt", "fährt", "bellt"]
                answer: ["lebt"]
              - id: l2-n5
                type: true_false
                text: "Aus dem Samen einer Blume wächst eine neue Blume.\n\nStimmt das?"
                say: "Aus dem Samen einer Blume wächst eine neue Blume. Stimmt das?"
                show: { object: flower }
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sort
            type: sorting
            text: "Lebewesen oder Ding?"
            say: "Leg jedes Bild in die richtige Gruppe: Lebewesen oder Ding."
            bins:
              - { id: lebewesen, show: { text: "Lebewesen" }, say: "Lebewesen" }
              - { id: ding, show: { text: "Ding" }, say: "Ding" }
            options:
              - { object: lion, bin: lebewesen }
              - { object: chair, bin: ding }
              - { object: owl, bin: lebewesen }
              - { object: scissors, bin: ding }
          - id: l2-c2
            part: sort
            type: image_multiple_choice
            text: "Was ist ein Lebewesen?"
            say: "Welches Bild zeigt ein Lebewesen?"
            options: [{ object: cup }, { object: crab }, { object: bike }]
            answer: crab
          - id: l2-c3
            part: sort
            type: image_multiple_choice
            text: "Was ist kein Lebewesen?"
            say: "Welches Bild zeigt etwas, das nicht lebt?"
            options: [{ object: ladybird }, { object: lamp }, { object: hen }]
            answer: lamp
          - id: l2-c4
