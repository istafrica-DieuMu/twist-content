# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.seasons
skill: world.nature.seasons
curriculum: de-DE
language: de
title:
  de: Die vier Jahreszeiten
  en: The four seasons
summary: >
  Ella watches the apple tree in her garden through one year. Lesson 1
  names the four seasons in order, Frühling, Sommer, Herbst, Winter, and
  then Frühling again, with the signs of each: flowers and lambs in
  spring, heat, swimming and ice cream in summer, coloured falling leaves,
  ripe apples, wind and kites in autumn, cold, a bare tree and sometimes
  snow in winter. Lesson 2 shows how nature changes through the year: the
  tree from blossom to bare branches, the fir that stays green, the
  hedgehog's Winterschlaf, storks flying south in autumn and back in
  spring, and the clothes for each season. It ends with the skill check.
  Months are left to world.time.months-seasons.
metadata:
  year: klasse-1
  topic: { de: Jahreszeiten und Wetter, en: Seasons and weather }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [Jahreszeit, Frühling, Sommer, Herbst, Winter, blühen, reif, kahl, Winterschlaf, Zugvogel] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: order, what: { de: "die vier Jahreszeiten in der richtigen Reihenfolge nennen", en: naming the four seasons in order } }
    - { id: signs, what: { de: "sagen, was zu jeder Jahreszeit passt (Wetter, Kleidung, Spiele)", en: "saying what belongs to each season (weather, clothes, play)" } }
    - { id: nature, what: { de: "beschreiben, wie sich Pflanzen und Tiere im Jahr verändern", en: describing how plants and animals change through the year } }
  misconceptions:
    - id: year-is-a-line
      what: Thinks the seasons run once and stop with winter, not as a circle that starts again
      addressed: "lesson 1 Learn ends with Und dann? Wieder Frühling!; l1-n1 (starting with Herbst), l1-s2, l2-n2 (starting with Winter), l2-c2 and l2-c4"
    - id: all-trees-bare
      what: Thinks every tree loses its leaves in winter
      addressed: "lesson 2 Learn shows the Tanne that stays green; l2-f4, l2-s2 and l2-c15"
    - id: animals-same-all-year
      what: Thinks animals live the same way all year
      addressed: "lesson 2 Learn opens with the guess about the hedgehog and shows the storks; l2-f1, l2-f6, l2-s1, l2-n1, l2-c16, l2-c17 and l2-c19"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Frühling, Sommer, Herbst und Winter", en: "Spring, summer, autumn and winter" }
    goal:
      de: "Lerne die vier Jahreszeiten in der richtigen Reihenfolge. Nach dem Winter kommt wieder der Frühling."
      en: "Learn the four seasons in the right order. After winter comes spring again."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie viele Jahreszeiten gibt es?"
            say: "Das ist Ella. In ihrem Garten steht ein Apfelbaum. Ella schaut ihn sich ein ganzes Jahr lang an. Er sieht nicht immer gleich aus! Was glaubst du: Wie viele Jahreszeiten gibt es in einem Jahr?"
            show: { object: tree }
          - text: "Vier: Frühling, Sommer, Herbst und Winter."
            say: "Es gibt vier Jahreszeiten: Frühling, Sommer, Herbst und Winter. Sie kommen immer in dieser Reihenfolge."
          - text: "Im Frühling blüht es."
            say: "Im Frühling wird es wärmer. Die Blumen blühen, und an Ellas Apfelbaum sind weiße und rosa Blüten. Auf den Wiesen kommen viele Lämmer auf die Welt."
            show: { objects: [flower, lamb] }
          - text: "Im Sommer ist es heiß."
            say: "Im Sommer ist es oft heiß, und es bleibt lange hell. Ella geht ins Schwimmbad und isst ein Eis. Am Apfelbaum wachsen kleine grüne Äpfel."
            show: { objects: [sun, ice-cream] }
          - text: "Im Herbst werden die Blätter bunt."
            say: "Im Herbst werden die Blätter gelb, rot und braun und fallen herunter. Die Äpfel sind reif. Oft ist es windig, und Ella lässt ihren Drachen steigen."
            show: { objects: [apple, kite] }
          - text: "Im Winter ist es kalt."
            say: "Im Winter ist es kalt. Der Apfelbaum hat keine Blätter mehr, er ist kahl. Manchmal schneit es, und Ella baut einen Schneemann."
            show: { objects: [snowman, woolly-hat] }
          - text: "Und dann? Wieder Frühling!"
            say: "Und nach dem Winter? Kommt wieder der Frühling! Die Jahreszeiten gehen immer im Kreis: Frühling, Sommer, Herbst, Winter, und dann wieder Frühling."
            show: { object: flower }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Beginne mit dem Frühling."
                say: "Leg die Jahreszeiten in die richtige Reihenfolge. Beginne mit dem Frühling. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Herbst", "Frühling", "Winter", "Sommer"]
                slot_count: 4
                answer: ["Frühling", "Sommer", "Herbst", "Winter"]
                hints:
                  - "Nach dem Frühling wird es immer wärmer."
                  - "Nach dem Frühling kommt die heiße Zeit, dann fallen die Blätter, dann wird es kalt."
                  - "Frühling, Sommer, Herbst, Winter."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Was passt zum Winter?"
                say: "Welches Bild passt zum Winter?"
                options: [{ object: ice-cream }, { object: snowman }, { object: sandcastle }]
                answer: snowman
                feedback:
                  sandcastle: "Eine Sandburg im Schnee? Brrr! Sandburgen baut Ella im Sommer."
                hints:
                  - "Im Winter ist es kalt. Manchmal schneit es."
                  - "Was kann man nur bauen, wenn Schnee liegt?"
                  - "Den Schneemann."
              - id: l1-f3
                type: true_false
                text: "Im Herbst werden die Blätter bunt.\n\nStimmt das?"
                say: "Im Herbst werden die Blätter bunt. Stimmt das?"
                show: { object: leaf }
                answer: true
                hints:
                  - "Wann fallen die Blätter vom Baum?"
                  - "Bevor sie fallen, werden sie gelb, rot und braun."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: sorting
                text: "Sommer oder Winter?"
                say: "Tippe auf ein Bild und hör das Wort. Passt es zum Sommer oder zum Winter?"
                bins:
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { object: swimming-pool, bin: sommer }
                  - { object: snowflake, bin: winter }
                  - { object: ice-cream, bin: sommer }
                  - { object: woolly-hat, bin: winter }
                hints:
                  - "Frag bei jedem Bild: Brauche ich das, wenn es heiß ist oder wenn es kalt ist?"
                  - "Ins Schwimmbad gehst du, wenn es heiß ist. Die Mütze ziehst du an, wenn es kalt ist."
                  - "Schwimmbad und Eis zum Sommer, Schneeflocke und Mütze zum Winter."
              - id: l1-f5
                type: multiple_choice
                text: "Was kommt nach dem Sommer?"
                options: ["Herbst", "Winter", "Frühling"]
                answer: "Herbst"
                hints:
                  - "Sag die Jahreszeiten auf: Frühling, Sommer, ..."
                  - "Nach dem Sommer werden die Blätter bunt."
                  - "Der Herbst."
              - id: l1-f6
                type: multiple_choice
                text: "Ellas Apfelbaum hat reife Äpfel und bunte Blätter. Welche Jahreszeit ist es?"
                show: { object: apple }
                options: ["Herbst", "Frühling", "Winter"]
                answer: "Herbst"
                hints:
                  - "Wann sind die Äpfel reif?"
                  - "Bunte Blätter gibt es kurz bevor sie herunterfallen."
                  - "Herbst."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was passt zum Frühling?"
                say: "Welches Bild passt zum Frühling?"
                options: [{ object: snowman }, { object: flower }, { object: woolly-hat }]
                answer: flower
                hints: ["Im Frühling wird es wärmer, und es fängt an zu blühen."]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Nach dem Winter kommt der _."
                options: ["Frühling", "Sommer", "Herbst"]
                answer: ["Frühling"]
                hints: ["Die Jahreszeiten gehen im Kreis. Mit welcher hast du angefangen?"]
              - id: l1-s3
                type: sorting
                text: "Frühling oder Herbst?"
                say: "Tippe auf ein Bild und hör das Wort. Passt es zum Frühling oder zum Herbst?"
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                options:
                  - { object: lamb, bin: fruehling }
                  - { object: kite, bin: herbst }
                  - { object: flower, bin: fruehling }
                  - { object: apple, bin: herbst }
                hints: ["Im Frühling blüht es und Lämmer kommen auf die Welt. Im Herbst sind die Äpfel reif und es ist windig."]
              - id: l1-s4
                type: true_false
                text: "Im Sommer ist es meistens kalt.\n\nStimmt das?"
                say: "Im Sommer ist es meistens kalt. Stimmt das?"
                answer: false
                hints: ["Wann geht Ella ins Schwimmbad?"]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Jahreszeit ist am kältesten?"
                options: ["Winter", "Sommer", "Frühling"]
                answer: "Winter"
                hints: ["In welcher Jahreszeit kann es schneien?"]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Beginne mit dem Herbst."
                say: "Leg die Jahreszeiten in die richtige Reihenfolge. Beginne diesmal mit dem Herbst. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Sommer", "Winter", "Herbst", "Frühling"]
                slot_count: 4
                answer: ["Herbst", "Winter", "Frühling", "Sommer"]
              - id: l1-n2
                type: image_multiple_choice
                text: "Was passt zum Sommer?"
                say: "Welches Bild passt zum Sommer?"
                options: [{ object: snowflake }, { object: woolly-hat }, { object: swimming-pool }]
                answer: swimming-pool
              - id: l1-n3
                type: true_false
                text: "Nach dem Herbst kommt der Winter.\n\nStimmt das?"
                say: "Nach dem Herbst kommt der Winter. Stimmt das?"
                answer: true
              - id: l1-n4
                type: sorting
                text: "Welche Jahreszeit?"
                say: "Tippe auf ein Bild und hör das Wort. Zu welcher Jahreszeit passt es?"
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { object: lamb, bin: fruehling }
                  - { object: sandcastle, bin: sommer }
                  - { object: kite, bin: herbst }
                  - { object: snowman, bin: winter }
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Im _ fallen die bunten Blätter vom Baum."
                options: ["Herbst", "Sommer", "Frühling"]
                answer: ["Herbst"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Jahreszeiten gibt es?"
            options: ["2", "4", "7"]
            answer: "4"
          - id: l1-c2
            type: image_multiple_choice
            text: "Was passt zum Winter?"
            say: "Welches Bild passt zum Winter?"
            options: [{ object: swimming-pool }, { object: flower }, { object: snowflake }]
            answer: snowflake
          - id: l1-c3
            type: true_false
            text: "Nach dem Frühling kommt der Winter.\n\nStimmt das?"
            say: "Nach dem Frühling kommt der Winter. Stimmt das?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Nach dem Frühling kommt der _."
            options: ["Sommer", "Winter", "Herbst"]
            answer: ["Sommer"]
          - id: l1-c5
            type: multiple_choice
            text: "In welcher Jahreszeit isst Ella am liebsten ein Eis im Freibad?"
            show: { object: ice-cream }
            options: ["Sommer", "Winter", "Herbst"]
            answer: "Sommer"
          - id: l1-c6
            type: ordering
            text: "Beginne mit dem Frühling."
            say: "Leg die Jahreszeiten in die richtige Reihenfolge. Beginne mit dem Frühling. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
            options: ["Winter", "Sommer", "Frühling", "Herbst"]
            slot_count: 4
            answer: ["Frühling", "Sommer", "Herbst", "Winter"]

  - n: 2
    title: { de: Die Natur im Jahr, en: Nature through the year }
    goal:
      de: "Finde heraus, wie sich Bäume und Tiere im Jahr verändern. Der Igel hält im Winter Winterschlaf."
      en: "Find out how trees and animals change through the year. The hedgehog sleeps through the winter."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was kommt nach dem Winter?"
            options: ["Frühling", "Herbst"]
            answer: "Frühling"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was passt zum Sommer?"
            say: "Welches Bild passt zum Sommer?"
            options: [{ object: snowman }, { object: ice-cream }]
            answer: ice-cream
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wo ist der Igel im Winter?"
            say: "Im Herbst hat Ella einen Igel im Garten gesehen. Jetzt ist Winter, und der Igel ist weg. Was glaubst du: Wo ist er?"
            show: { object: hedgehog }
          - text: "Der Igel hält Winterschlaf."
            say: "Er schläft! Der Igel hat sich ein Nest aus Laub gebaut. Dort hält er Winterschlaf, den ganzen Winter lang. Im Frühling wacht er wieder auf und sucht Futter."
            show: { objects: [hedgehog, leaf] }
          - text: "Wusstest du? Im Winterschlaf schlägt das Herz des Igels ganz langsam."
            say: "Wusstest du? Im Winterschlaf schlägt das Herz des Igels ganz, ganz langsam, viel langsamer als sonst. So braucht er fast keine Kraft und kommt ohne Fressen durch den Winter."
            show: { objects: [hedgehog, heart] }
          - text: "Störche fliegen im Herbst in den Süden."
            say: "Manche Vögel fliegen im Herbst weg, zum Beispiel die Störche. Sie fliegen in den warmen Süden, manche bis nach Afrika. Im Frühling kommen sie zurück. Solche Vögel heißen Zugvögel."
          - text: "Der Apfelbaum im Jahr."
            say: "Ellas Apfelbaum verändert sich. Im Frühling blüht er. Im Sommer hat er grüne Blätter. Im Herbst werden die Blätter bunt und fallen ab. Im Winter ist er kahl."
            show: { object: tree }
          - text: "Die Tanne bleibt grün."
            say: "Neben dem Apfelbaum steht eine Tanne. Sie hat Nadeln statt Blätter. Die Tanne bleibt auch im Winter grün."
            show: { object: fir-tree }
          - text: "Kleidung für jede Jahreszeit."
            say: "Auch Ella zieht sich in jeder Jahreszeit anders an. Im Sommer reicht ein T-Shirt. Im Winter braucht sie eine warme Jacke und eine Mütze."
            show: { objects: [t-shirt, woolly-hat] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was macht der Igel im Winter?"
                show: { object: hedgehog }
                options: ["Er hält Winterschlaf.", "Er geht schwimmen.", "Er baut einen Schneemann."]
                answer: "Er hält Winterschlaf."
                feedback:
                  "Er geht schwimmen.": "Im eiskalten Wasser? Der Igel bleibt lieber im warmen Nest."
                  "Er baut einen Schneemann.": "Das wäre lustig! Aber der Igel schläft."
                hints:
                  - "Im Winter findet der Igel kaum Futter."
                  - "Er baut sich ein Nest aus Laub und macht die Augen zu."
                  - "Er hält Winterschlaf."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Ellas Apfelbaum im Jahr"
                say: "Leg die Karten in die richtige Reihenfolge. Beginne im Frühling. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Der Baum ist kahl.", "Der Baum blüht.", "Die Blätter werden bunt und fallen.", "Der Baum hat grüne Blätter."]
                slot_count: 4
                answer: ["Der Baum blüht.", "Der Baum hat grüne Blätter.", "Die Blätter werden bunt und fallen.", "Der Baum ist kahl."]
                hints:
                  - "Was macht der Baum im Frühling?"
                  - "Im Frühling blüht er, im Winter ist er kahl. Was ist dazwischen?"
                  - "Blühen, grüne Blätter, bunte Blätter fallen, kahl."
              - id: l2-f3
                type: image_multiple_choice
                text: "Ella geht im Winter raus. Was zieht sie an?"
                say: "Ella geht im Winter raus. Was zieht sie an?"
                options: [{ object: t-shirt }, { object: woolly-hat }, { object: ice-cream }]
                answer: woolly-hat
                feedback:
                  ice-cream: "Ein Eis anziehen? Das geht nicht, und es wäre auch sehr kalt!"
                hints:
                  - "Im Winter ist es kalt."
                  - "Was hält den Kopf warm?"
                  - "Die Mütze."
              - id: l2-f4
                type: true_false
                text: "Die Tanne verliert im Winter alle Nadeln.\n\nStimmt das?"
                say: "Die Tanne verliert im Winter alle Nadeln. Stimmt das?"
                show: { object: fir-tree }
                answer: false
                hints:
                  - "Welche Farbe hat die Tanne im Winter?"
                  - "Die Tanne bleibt auch im Winter grün."
                  - "Nein. Die Tanne behält ihre Nadeln."
              - id: l2-f5
                type: sorting
                text: "Sommer oder Winter?"
                say: "Ella packt ihren Schrank um. Tippe auf ein Bild und hör das Wort. Braucht sie es im Sommer oder im Winter?"
                bins:
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { object: t-shirt, bin: sommer }
                  - { object: jacket, bin: winter }
                  - { object: sandcastle, bin: sommer }
                  - { object: woolly-hat, bin: winter }
                hints:
                  - "Frag bei jedem Bild: Hält es warm, oder ist es für heiße Tage?"
                  - "Jacke und Mütze halten warm. T-Shirt und Sandburg passen zu heißen Tagen."
                  - "T-Shirt und Sandburg zum Sommer, Jacke und Mütze zum Winter."
              - id: l2-f6
                type: multiple_choice
                text: "Wohin fliegen die Störche im Herbst?"
                options: ["in den warmen Süden", "zum Mond", "in den Kühlschrank"]
                answer: "in den warmen Süden"
                feedback:
                  zum Mond: "So weit fliegt kein Vogel! Auf dem Mond gibt es kein Futter."
                  in den Kühlschrank: "Da wäre es ja noch kälter!"
                hints:
                  - "Bei uns wird es im Winter kalt."
                  - "Die Störche fliegen dorthin, wo es warm ist."
                  - "In den warmen Süden."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Im Frühling wacht der Igel auf.\n\nStimmt das?"
                say: "Im Frühling wacht der Igel auf. Stimmt das?"
                show: { object: hedgehog }
                answer: true
                hints: ["Wie lange dauert der Winterschlaf?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Baum ist im Winter grün?"
                options: ["die Tanne", "der Apfelbaum"]
                answer: "die Tanne"
                hints: ["Ein Baum hat Nadeln statt Blätter."]
              - id: l2-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Im Herbst sind die Äpfel _."
                options: ["reif", "blau", "gefroren"]
                answer: ["reif"]
                hints: ["Im Herbst kann Ella die Äpfel pflücken und essen."]
              - id: l2-s4
                type: sorting
                text: "Welche Jahreszeit?"
                say: "Tippe auf ein Bild und hör das Wort. Zu welcher Jahreszeit passt es?"
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { object: snowflake, bin: winter }
                  - { object: lamb, bin: fruehling }
                  - { object: apple, bin: herbst }
                  - { object: swimming-pool, bin: sommer }
                hints: ["Lämmer im Frühling, Schwimmbad im Sommer, reife Äpfel im Herbst, Schnee im Winter."]
              - id: l2-s5
                type: multiple_choice
                text: "Der Apfelbaum blüht, und die Störche kommen zurück. Welche Jahreszeit ist es?"
                options: ["Frühling", "Herbst", "Winter"]
                answer: "Frühling"
                hints: ["Wann blühen die Bäume?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wer hält Winterschlaf?"
                say: "Welches Tier hält Winterschlaf?"
                options: [{ object: cow }, { object: hedgehog }, { object: dog }]
                answer: hedgehog
              - id: l2-n2
                type: ordering
                text: "Beginne mit dem Winter."
                say: "Leg die Jahreszeiten in die richtige Reihenfolge. Beginne mit dem Winter. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Herbst", "Sommer", "Winter", "Frühling"]
                slot_count: 4
                answer: ["Winter", "Frühling", "Sommer", "Herbst"]
              - id: l2-n3
                type: true_false
                text: "Im Winter hat der Apfelbaum keine Blätter.\n\nStimmt das?"
                say: "Im Winter hat der Apfelbaum keine Blätter. Stimmt das?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Es ist heiß, und Ella geht ins Freibad. Welche Jahreszeit ist es?"
                options: ["Sommer", "Winter", "Herbst"]
                answer: "Sommer"
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Im Frühling _ die Apfelbäume."
                options: ["blühen", "schlafen", "frieren"]
                answer: ["blühen"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: order
            type: ordering
            text: "Beginne mit dem Sommer."
            say: "Leg die Jahreszeiten in die richtige Reihenfolge. Beginne mit dem Sommer. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
            options: ["Frühling", "Herbst", "Sommer", "Winter"]
            slot_count: 4
            answer: ["Sommer", "Herbst", "Winter", "Frühling"]
          - id: l2-c2
