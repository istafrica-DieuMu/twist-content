# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.class-rules
skill: world.society.class-rules
curriculum: de-DE
language: de
title:
  de: Regeln in der Klasse
  en: Rules in our class
summary: >
  The Klasse 1b and its rules. Lesson 1 opens on a morning without rules,
  where everyone shouts at once and nobody can learn, and then meets the
  rules of the class: put your hand up and wait, listen when others speak,
  be quiet while others work, hurt nobody and stop when someone says
  Stopp, tidy up. The child decides whether a child keeps a rule. Lesson 2
  asks why: so everyone gets a turn, so all can learn, so everyone feels
  safe. The class makes its rules together (everyone suggests, then they
  vote) and every child takes a Klassendienst such as watering the
  flowers. It ends with the skill check. Builds on naming feelings and
  needs.
metadata:
  year: klasse-1
  topic: { de: Ich und die anderen, en: Me and others }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.society.feelings-needs]
  also_practises: []
  vocabulary: { de: [Regel, Klassenregel, sich melden, zuhören, leise, aufräumen, Stopp, sicher, Grund, abstimmen, Klassendienst, Blumendienst] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: know, what: { de: "Klassenregeln kennen und sagen, ob jemand eine Regel einhält", en: "knowing the class rules and saying whether someone keeps a rule" } }
    - { id: why, what: { de: "begründen, warum es eine Regel gibt", en: "explaining why there is a rule" } }
    - { id: together, what: { de: "wissen, dass die Klasse Regeln und Klassendienste gemeinsam festlegt", en: "knowing that the class agrees its rules and class jobs together" } }
  misconceptions:
    - id: loudest-gets-turn
      what: Thinks whoever shouts loudest gets a turn
      addressed: "lesson 1 Learn opens with the morning without rules and shows putting a hand up; l1-f4, l1-s5, l1-n5, l2-w2, l2-c9 and l2-c14"
    - id: rules-against-children
      what: Thinks rules are there for the teacher, to scold or to stop children playing, not to help everyone
      addressed: "lesson 2 Learn gives each rule its reason; l2-f3, l2-s5, l2-c10 and l2-c13"
    - id: rules-only-given
      what: Thinks rules are only handed down and children have no say
      addressed: "lesson 2 Learn shows the class suggesting and voting on its rules; l2-f6, l2-s3, l2-n3, l2-c16 and l2-c17"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Unsere Klassenregeln", en: "Our class rules" }
    goal:
      de: "Lerne die Regeln deiner Klasse kennen. Wer etwas sagen will, meldet sich und wartet, bis er dran ist."
      en: "Get to know the rules of your class. If you want to say something, put your hand up and wait for your turn."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Paul hat sein Lieblingsauto verloren.\n\nWie fühlt sich Paul?"
            say: "Paul hat sein Lieblingsauto verloren. Wie fühlt sich Paul?"
            options: [{ object: sad }, { object: happy }, { object: tired }]
            answer: sad
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ole ist traurig. Was braucht er?"
            options: ["Trost", "einen Kuchen", "eine Schere"]
            answer: "Trost"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Kann man so lernen?"
            say: "In der Klasse 1b gibt es heute keine Regeln. Alle rufen durcheinander. Zwei Kinder rennen um die Tische. Niemand hört zu. Was glaubst du: Kann man so gut lernen?"
            show: { object: school }
          - text: "Ohne Regeln klappt es nicht."
            say: "Nein! Alle reden gleichzeitig, und keiner versteht etwas. Lea fragt etwas, aber niemand hört sie. Darum gibt es Regeln. Regeln sagen uns, wie wir gut zusammen lernen und spielen."
            show: { object: school }
          - text: "Ich melde mich."
            say: "Eine Regel heißt: Ich melde mich, wenn ich etwas sagen will. Ich hebe die Hand und warte, bis ich dran bin. Wer am lautesten ruft, ist nicht dran."
          - text: "Ich höre zu, wenn andere sprechen."
            say: "Wenn die Lehrerin oder ein anderes Kind spricht, höre ich zu. Ich rede nicht dazwischen."
            show: { object: listen }
          - text: "Ich bin leise, wenn andere arbeiten."
            say: "Wenn alle rechnen, lesen oder schreiben, bin ich leise. Dann kann jeder in Ruhe nachdenken."
            show: { object: quiet }
          - text: "Ich tue niemandem weh."
            say: "Ich schubse nicht, ich haue nicht, und ich sage keine gemeinen Wörter. Wenn jemand Stopp sagt, höre ich sofort auf."
          - text: "Wir räumen auf."
            say: "Nach dem Basteln räumen alle ihre Sachen weg: die Schere, die Stifte und das Mäppchen. Dann ist der Platz wieder frei."
            show: { objects: [scissors, pencil-case] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Hält das Kind die Regel ein?"
                say: "Tippe auf eine Karte und hör zu. Hält das Kind die Regel ein? Leg die Karte zu Ja oder Nein."
                bins:
                  - { id: ja, show: { text: "Ja" }, say: "Ja" }
                  - { id: nein, show: { text: "Nein" }, say: "Nein" }
                options:
                  - { text: "Tom meldet sich.", bin: ja }
                  - { text: "Lea ruft dazwischen.", bin: nein }
                  - { text: "Ben räumt seine Stifte weg.", bin: ja }
                  - { text: "Mia schubst in der Schlange.", bin: nein }
                hints:
                  - "Denk an die Regeln: melden, zuhören, leise sein, niemandem wehtun, aufräumen."
                  - "Wer sich meldet und aufräumt, hält die Regel ein. Dazwischenrufen und Schubsen sind gegen die Regeln."
                  - "Tom und Ben zu Ja. Lea und Mia zu Nein."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Frau Sommer liest eine Geschichte vor.\n\nWas machst du?"
                say: "Frau Sommer liest eine Geschichte vor. Was machst du?"
                options: [{ object: listen }, { object: jump }, { object: sing }]
                answer: listen
                feedback:
                  sing: "Mitsingen ist toll, aber nicht, während Frau Sommer vorliest."
                hints:
                  - "Was ist die Regel, wenn jemand spricht?"
                  - "Wenn jemand spricht, rede ich nicht und springe nicht herum."
                  - "Du hörst zu."
              - id: l1-f3
                type: true_false
                text: "Lea will etwas sagen. Sie ruft einfach laut in die Klasse.\n\nHält Lea die Regel ein?"
                say: "Lea will etwas sagen. Sie ruft einfach laut in die Klasse. Hält Lea die Regel ein?"
                answer: false
                hints:
                  - "Was macht man, wenn man etwas sagen will?"
                  - "Man meldet sich und wartet. Hat Lea das gemacht?"
                  - "Nein. Lea hätte sich melden sollen."
              - id: l1-f4
                type: multiple_choice
                text: "Du willst im Unterricht etwas sagen. Was machst du?"
                options: ["Ich melde mich und warte.", "Ich rufe ganz laut.", "Ich laufe zur Tafel."]
                answer: "Ich melde mich und warte."
                feedback:
                  "Ich rufe ganz laut.": "Wer am lautesten ruft, ist nicht dran. Dann hört dich keiner richtig."
                hints:
                  - "Denk an die Hand."
                  - "Du hebst die Hand und wartest, bis du dran bist."
                  - "Ich melde mich und warte."
              - id: l1-f5
                type: image_multiple_choice
                text: "Alle Kinder rechnen still.\n\nWas passt jetzt?"
                say: "Alle Kinder rechnen still. Was passt jetzt?"
                options: [{ object: quiet }, { object: dance }, { object: play-guitar }]
                answer: quiet
                feedback:
                  play-guitar: "Gitarre spielen beim Rechnen? Da kann keiner nachdenken!"
                hints:
                  - "Was brauchen Kinder, die nachdenken?"
                  - "Wenn andere arbeiten, ist es ruhig in der Klasse."
                  - "Leise sein passt."
              - id: l1-f6
                type: true_false
                text: "Ole sagt: „Stopp, das will ich nicht!“ Ben hört sofort auf.\n\nMacht Ben das richtig?"
                say: "Ole sagt: Stopp, das will ich nicht! Ben hört sofort auf. Macht Ben das richtig?"
                answer: true
                hints:
                  - "Was ist die Regel, wenn jemand Stopp sagt?"
                  - "Wenn jemand Stopp sagt, hört man auf."
                  - "Ja. Ben macht es richtig."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Hält das Kind die Regel ein?"
                say: "Tippe auf eine Karte und hör zu. Hält das Kind die Regel ein?"
                bins:
                  - { id: ja, show: { text: "Ja" }, say: "Ja" }
                  - { id: nein, show: { text: "Nein" }, say: "Nein" }
                options:
                  - { text: "Kim hört zu, wenn Tom erzählt.", bin: ja }
                  - { text: "Paul kritzelt in Leas Heft.", bin: nein }
                  - { text: "Ayla wartet, bis sie dran ist.", bin: ja }
                  - { text: "Finn lässt seinen Müll liegen.", bin: nein }
                hints: ["Frag bei jeder Karte: Ist das gut für alle in der Klasse?"]
              - id: l1-s2
                type: multiple_choice
                text: "Nach dem Basteln liegen Scheren und Stifte überall. Was machst du?"
                options: ["Ich räume meine Sachen auf.", "Ich lasse alles liegen.", "Ich werfe die Stifte auf den Boden."]
                answer: "Ich räume meine Sachen auf."
                hints: ["Was ist die Regel nach dem Basteln?"]
              - id: l1-s3
                type: true_false
                text: "Max haut Jonas, weil er wütend ist.\n\nHält Max die Regel ein?"
                say: "Max haut Jonas, weil er wütend ist. Hält Max die Regel ein?"
                answer: false
                hints: ["Darf man jemandem wehtun, auch wenn man wütend ist?"]
              - id: l1-s4
                type: matching
                text: "Welches Bild passt zur Regel?"
                say: "Tippe auf eine Regel und dann auf das Bild, das dazu passt."
                pairs:
                  - left: { text: "Ich höre zu.", say: "Ich höre zu." }
                    right: { object: listen }
                  - left: { text: "Ich bin leise.", say: "Ich bin leise." }
                    right: { object: quiet }
                  - left: { text: "Wir räumen die Stifte ein.", say: "Wir räumen die Stifte ein." }
                    right: { object: pencil-case }
                hints: ["Wer zuhört, hält die Hand ans Ohr. Wer leise ist, hält den Finger an den Mund."]
              - id: l1-s5
                type: multiple_choice
                text: "Tim ruft dazwischen. Was soll er tun?"
                options: ["sich melden und warten", "noch lauter rufen", "aus dem Fenster schauen"]
                answer: "sich melden und warten"
                hints: ["Wie kommt man in der Klasse dran?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Ayla meldet sich und wartet, bis sie dran ist.\n\nHält Ayla die Regel ein?"
                say: "Ayla meldet sich und wartet, bis sie dran ist. Hält Ayla die Regel ein?"
                answer: true
              - id: l1-n2
                type: sorting
                text: "Hält das Kind die Regel ein?"
                say: "Tippe auf eine Karte und hör zu. Hält das Kind die Regel ein?"
                bins:
                  - { id: ja, show: { text: "Ja" }, say: "Ja" }
                  - { id: nein, show: { text: "Nein" }, say: "Nein" }
                options:
                  - { text: "Lars rennt durch die Klasse.", bin: nein }
                  - { text: "Nora hilft beim Aufräumen.", bin: ja }
                  - { text: "Kai sagt gemeine Wörter.", bin: nein }
                  - { text: "Emma hört zu.", bin: ja }
              - id: l1-n3
                type: image_multiple_choice
                text: "Dein Nachbar schreibt still in sein Heft.\n\nWas passt jetzt?"
                say: "Dein Nachbar schreibt still in sein Heft. Was passt jetzt?"
                options: [{ object: quiet }, { object: sing }, { object: clap }]
                answer: quiet
              - id: l1-n4
                type: multiple_choice
                text: "Mia sagt: „Stopp!“ Was machst du?"
                say: "Mia sagt: Stopp! Was machst du?"
                options: ["Ich höre sofort auf.", "Ich mache weiter.", "Ich lache."]
                answer: "Ich höre sofort auf."
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Wenn ich etwas sagen will, _ ich mich."
                options: ["melde", "verstecke", "freue"]
                answer: ["melde"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Paul schubst Kim in der Schlange.\n\nHält Paul die Regel ein?"
            say: "Paul schubst Kim in der Schlange. Hält Paul die Regel ein?"
            answer: false
          - id: l1-c2
            type: multiple_choice
            text: "Was machst du, wenn andere sprechen?"
            options: ["Ich höre zu.", "Ich rede dazwischen.", "Ich singe laut."]
            answer: "Ich höre zu."
          - id: l1-c3
            type: sorting
            text: "Hält das Kind die Regel ein?"
            say: "Leg jede Karte zu Ja oder Nein."
            bins:
              - { id: ja, show: { text: "Ja" }, say: "Ja" }
              - { id: nein, show: { text: "Nein" }, say: "Nein" }
            options:
              - { text: "Lea räumt ihren Platz auf.", bin: ja }
              - { text: "Ben wirft Papier auf den Boden.", bin: nein }
              - { text: "Tom meldet sich.", bin: ja }
              - { text: "Kim ruft dazwischen.", bin: nein }
          - id: l1-c4
            type: image_multiple_choice
            text: "Alle lesen still.\n\nWas passt jetzt?"
            say: "Alle lesen still. Was passt jetzt?"
            options: [{ object: quiet }, { object: dance }, { object: clap }]
            answer: quiet
          - id: l1-c5
            type: true_false
            text: "Jonas sagt Stopp. Finn hört sofort auf.\n\nMacht Finn das richtig?"
            say: "Jonas sagt Stopp. Finn hört sofort auf. Macht Finn das richtig?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Was ist eine gute Klassenregel?"
            options: ["Wir tun niemandem weh.", "Wer am lautesten ruft, ist dran.", "Jeder darf schubsen."]
            answer: "Wir tun niemandem weh."

  - n: 2
    title: { de: "Warum gibt es Regeln?", en: "Why do we have rules?" }
    goal:
      de: "Sag, warum es eine Regel gibt. Wir melden uns, damit jeder drankommt."
      en: "Say why there is a rule. We put our hands up so that everyone gets a turn."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ben räumt nach dem Malen seine Stifte weg.\n\nHält Ben die Regel ein?"
            say: "Ben räumt nach dem Malen seine Stifte weg. Hält Ben die Regel ein?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Du willst etwas sagen. Was machst du?"
            options: ["Ich melde mich.", "Ich rufe laut."]
            answer: "Ich melde mich."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Warum melden wir uns?"
            say: "Die Klasse 1b malt ein großes Plakat mit ihren Regeln. Ole fragt: Warum müssen wir uns eigentlich melden? Was glaubst du?"
          - text: "Damit jeder drankommt."
            say: "Wenn alle gleichzeitig rufen, hört man nur Lärm. Wer sich meldet, wartet, bis er dran ist. So kommt jeder dran, auch die leisen Kinder."
          - text: "Damit alle lernen können."
            say: "Wir sind leise, wenn andere arbeiten. Dann können alle gut nachdenken und lernen."
            show: { object: quiet }
          - text: "Damit sich alle sicher fühlen."
            say: "Wir tun niemandem weh und hören auf, wenn jemand Stopp sagt. Dann muss in der Klasse niemand Angst haben. Jede Regel hat einen Grund: Sie hilft allen."
          - text: "Wir machen die Regeln zusammen."
            say: "In der Klasse 1b überlegen alle zusammen: Welche Regeln brauchen wir? Jedes Kind darf etwas vorschlagen. Dann stimmen alle ab, und die Regeln kommen auf das Plakat."
          - text: "Jeder hat einen Klassendienst."
            say: "Jedes Kind hat auch eine Aufgabe für die Klasse. Das heißt Klassendienst. Ole hat diese Woche den Blumendienst und gießt die Blumen. Kim teilt die Hefte aus."
            show: { object: watering-can }
          - text: "Wusstest du? In Deutschland müssen alle Kinder zur Schule gehen."
            say: "Wusstest du? In Deutschland müssen alle Kinder zur Schule gehen. Das ist eine Regel für das ganze Land. Sie heißt Schulpflicht. So kann jedes Kind lesen, schreiben und rechnen lernen."
            show: { object: school }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Warum gibt es die Regel?"
                say: "Tippe auf eine Regel und dann auf ihren Grund."
                pairs:
                  - left: { text: "Ich melde mich.", say: "Ich melde mich." }
                    right: { text: "Dann kommt jeder dran.", say: "Dann kommt jeder dran." }
                  - left: { text: "Ich bin leise.", say: "Ich bin leise." }
                    right: { text: "Dann können alle lernen.", say: "Dann können alle lernen." }
                  - left: { text: "Ich tue niemandem weh.", say: "Ich tue niemandem weh." }
                    right: { text: "Dann fühlen sich alle sicher.", say: "Dann fühlen sich alle sicher." }
                hints:
                  - "Frag bei jeder Regel: Wem hilft sie, und wobei?"
                  - "Wer sich meldet, wartet, bis er dran ist. Wer leise ist, stört keinen beim Nachdenken."
                  - "Melden: jeder kommt dran. Leise sein: alle können lernen. Niemandem wehtun: alle fühlen sich sicher."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Warum räumen wir nach dem Basteln auf?"
                options: ["Damit jeder seine Sachen wiederfindet.", "Damit die Schere müde wird.", "Weil Aufräumen laut ist."]
                answer: "Damit jeder seine Sachen wiederfindet."
                feedback:
                  "Damit die Schere müde wird.": "Eine Schere wird nie müde! Aber wenn sie herumliegt, sucht man sie lange."
                hints:
                  - "Was passiert, wenn alles herumliegt?"
                  - "Dann findet keiner seine Stifte und seine Schere."
                  - "Damit jeder seine Sachen wiederfindet."
              - id: l2-f3
                type: true_false
                text: "Regeln gibt es, damit die Lehrerin schimpfen kann.\n\nStimmt das?"
                say: "Regeln gibt es, damit die Lehrerin schimpfen kann. Stimmt das?"
                answer: false
                hints:
                  - "Wem helfen Regeln?"
                  - "Regeln helfen allen in der Klasse, gut zu lernen und sich sicher zu fühlen."
                  - "Nein. Regeln helfen allen."
              - id: l2-f4
                type: image_multiple_choice
                text: "Ole hat diese Woche den Blumendienst.\n\nWas braucht er?"
                say: "Ole hat diese Woche den Blumendienst. Was braucht er?"
                options: [{ object: watering-can }, { object: scissors }, { object: ball }]
                answer: watering-can
                hints:
                  - "Was macht man beim Blumendienst?"
                  - "Beim Blumendienst gießt man die Blumen."
                  - "Ole braucht die Gießkanne."
              - id: l2-f5
                type: sorting
                text: "„Wir rennen nicht in der Klasse.“ Ist das ein guter Grund?"
                say: "Die Regel heißt: Wir rennen nicht in der Klasse. Tippe auf eine Karte und hör zu. Ist das ein guter Grund für die Regel?"
                bins:
                  - { id: gut, show: { text: "guter Grund" }, say: "guter Grund" }
                  - { id: kein, show: { text: "kein guter Grund" }, say: "kein guter Grund" }
                options:
                  - { text: "Sonst fällt jemand hin.", bin: gut }
                  - { text: "Sonst stößt man sich am Tisch.", bin: gut }
                  - { text: "Weil Rennen blau ist.", bin: kein }
                  - { text: "Weil Stühle gern schlafen.", bin: kein }
                hints:
                  - "Frag: Was könnte passieren, wenn jemand in der Klasse rennt?"
                  - "In der Klasse stehen Tische und Stühle. Wer rennt, kann hinfallen oder sich stoßen."
                  - "Hinfallen und Stoßen sind gute Gründe. Rennen ist nicht blau, und Stühle schlafen nicht."
              - id: l2-f6
                type: multiple_choice
                text: "Wer macht in der Klasse 1b die Regeln?"
                options: ["alle zusammen", "nur ein Kind", "niemand"]
                answer: "alle zusammen"
                hints:
                  - "Denk an das Plakat der Klasse 1b."
                  - "Jedes Kind darf etwas vorschlagen, dann stimmen alle ab."
                  - "Alle zusammen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum hören wir zu, wenn jemand spricht?"
                options: ["Damit wir verstehen, was er sagt.", "Damit es lauter wird.", "Weil die Ohren sonst wehtun."]
                answer: "Damit wir verstehen, was er sagt."
                hints: ["Was passiert, wenn alle gleichzeitig reden?"]
              - id: l2-s2
                type: true_false
                text: "Wenn jemand Stopp sagt, hört der andere auf. So fühlen sich alle sicher.\n\nStimmt das?"
                say: "Wenn jemand Stopp sagt, hört der andere auf. So fühlen sich alle sicher. Stimmt das?"
                answer: true
                hints: ["Muss jemand Angst haben, wenn alle bei Stopp aufhören?"]
              - id: l2-s3
                type: multiple_choice
                text: "Die Klasse 1b sucht eine neue Regel. Wie machen sie das am besten?"
                options: ["Alle sagen ihre Ideen, dann stimmen sie ab.", "Das lauteste Kind bestimmt.", "Jeder macht, was er will."]
                answer: "Alle sagen ihre Ideen, dann stimmen sie ab."
                hints: ["Wie ist das Plakat der Klasse 1b entstanden?"]
              - id: l2-s4
                type: matching
                text: "Warum gibt es die Regel?"
                say: "Tippe auf eine Regel und dann auf ihren Grund."
                pairs:
                  - left: { text: "Wir rennen nicht in der Klasse.", say: "Wir rennen nicht in der Klasse." }
                    right: { text: "Dann fällt niemand hin.", say: "Dann fällt niemand hin." }
                  - left: { text: "Wir räumen auf.", say: "Wir räumen auf." }
                    right: { text: "Dann finden alle ihre Sachen.", say: "Dann finden alle ihre Sachen." }
                  - left: { text: "Wir warten in der Schlange.", say: "Wir warten in der Schlange." }
                    right: { text: "Dann kommt jeder dran.", say: "Dann kommt jeder dran." }
                hints: ["Frag bei jeder Regel: Was passiert, wenn keiner sie einhält?"]
              - id: l2-s5
                type: true_false
                text: "Eine Klassenregel hilft nur einem einzigen Kind.\n\nStimmt das?"
                say: "Eine Klassenregel hilft nur einem einzigen Kind. Stimmt das?"
                answer: false
                hints: ["Wer kommt dran, wenn sich alle melden? Wer kann lernen, wenn alle leise sind?"]

          - support: none
            tasks:
              - id: l2-n1
