# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.festivals
skill: world.time.festivals
curriculum: de-DE
language: de
title:
  de: Feste im Jahreskreis
  en: Festivals around the year
summary: >
  The class 1b makes a Festkreis, a year wheel of festivals, and each
  child tells of a festival their family celebrates. Lesson 1 covers
  autumn and winter: Erntedank, Diwali, Sankt Martin, Nikolaus, Chanukka
  and Weihnachten, with who celebrates them and one custom each. Lesson 2
  covers Silvester and Neujahr, Karneval, Ostern (a different Sunday every
  year), the Zuckerfest after Ramadan (it moves through the year with the
  moon) and birthdays, puts the festivals in order across the year, and
  ends with the skill check. Religious festivals are described as what
  Christians, Jews, Muslims and Hindus celebrate, never as what everyone
  does.
metadata:
  year: klasse-1
  topic: { de: Mein Jahr, en: My year }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.time.months-seasons]
  also_practises: []
  vocabulary: { de: [Fest, feiern, Erntedank, Diwali, Sankt Martin, Laterne, Nikolaus, Chanukka, Weihnachten, Silvester, Neujahr, Karneval, Fasching, Ostern, Ramadan, Zuckerfest, Geburtstag, Lichterfest, Christen, Juden, Muslime, Hindus] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: when, what: { de: "ein Fest seinem Monat oder seiner Jahreszeit zuordnen", en: "placing a festival in its month or season" } }
    - { id: order, what: { de: "Feste in der Reihenfolge des Jahres ordnen", en: "putting festivals in the order of the year" } }
    - { id: customs, what: { de: "sagen, wer ein Fest feiert und was dazu gehört", en: "saying who celebrates a festival and what belongs to it" } }
  misconceptions:
    - id: everyone-same
      what: Thinks every family celebrates the same festivals (Weihnachten, Ostern)
      addressed: "lesson 1 Learn opens with the guess Feiern alle Kinder Weihnachten? and shows Diwali and Chanukka; lesson 2 Learn shows the Zuckerfest; l1-f3, l1-f6, l1-s3, l2-s4, l2-n5, l2-c15 and l2-c17"
    - id: fixed-dates
      what: Thinks every festival falls on the same date every year
      addressed: "lesson 2 Learn opens with the guess Ist Ostern jedes Jahr am selben Tag? and says the Zuckerfest moves with the moon; l2-f3, l2-s1 and l2-c7"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: Feste im Herbst und Winter, en: Festivals in autumn and winter }
    goal:
      de: "Lerne Feste im Herbst und Winter kennen. Am Sankt Martinstag gehen Kinder mit Laternen, an Diwali leuchten viele kleine Lichter."
      en: "Get to know festivals in autumn and winter. On St Martin's Day children walk with lanterns, at Diwali many small lights shine."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Mit welchem Monat fängt der Herbst an?"
            options: ["September", "März"]
            answer: "September"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Der Dezember gehört zum Winter.\n\nStimmt das?"
            say: "Der Dezember gehört zum Winter. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Feiern alle Kinder Weihnachten?"
            say: "Die Klasse 1b bastelt einen Festkreis. Das ist ein Jahreskreis mit Festen. Jedes Kind erzählt von einem Fest, das seine Familie feiert. Was glaubst du: Feiern alle Kinder Weihnachten?"
            show: { object: fir-tree }
          - text: "Viele, aber nicht alle."
            say: "Viele Kinder feiern Weihnachten, aber nicht alle. Familien feiern verschiedene Feste, je nach Religion und Kultur. Schau, was die Kinder erzählen."
          - text: "Erntedank im Herbst"
            say: "Im Herbst ist das Erntedankfest. Christen danken dann in der Kirche für die Ernte: für Getreide, Obst und Gemüse."
            show: { objects: [wheat, apple] }
          - text: "Diwali im Oktober oder November"
            say: "Anjalis Familie feiert Diwali, das Lichterfest der Hindus. Diwali ist im Oktober oder im November. Die Familien stellen viele kleine Lichter auf und essen Süßigkeiten."
            show: { object: candle }
          - text: "Sankt Martin am 11. November"
            say: "Am elften November ist Sankt Martin. Kinder gehen mit Laternen durch die Straßen und singen Lieder. Es heißt, Martin hat seinen Mantel mit einem armen Mann geteilt, der fror."
          - text: "Nikolaus am 6. Dezember"
            say: "Am Abend vor dem sechsten Dezember stellen viele Kinder ihre Schuhe oder Stiefel vor die Tür. Am Nikolausmorgen liegen oft Nüsse, Obst oder Süßigkeiten darin."
            show: { object: shoe }
          - text: "Chanukka, meistens im Dezember"
            say: "Davids Familie ist jüdisch. Sie feiert Chanukka, das jüdische Lichterfest. Es ist meistens im Dezember und dauert acht Tage. Jeden Abend zündet die Familie ein Licht mehr an."
            show: { object: candle }
          - text: "Weihnachten am 24. Dezember"
            say: "Lotta erzählt: Christen feiern an Weihnachten die Geburt von Jesus. Am Heiligabend, dem vierundzwanzigsten Dezember, liegen in vielen Familien Geschenke unter dem Weihnachtsbaum."
            show: { objects: [fir-tree, present] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Was gehört zu welchem Fest?"
                say: "Tippe auf ein Fest und dann auf sein Bild."
                pairs:
                  - left: { text: "Weihnachten" }
                    right: { object: fir-tree }
                  - left: { text: "Nikolaus" }
                    right: { object: shoe }
                  - left: { text: "Erntedank" }
                    right: { object: wheat }
                hints:
                  - "Denk an jedes Fest: Was machen die Leute da?"
                  - "Zu Nikolaus stellen Kinder ihre Schuhe vor die Tür. An Erntedank danken Christen für die Ernte."
                  - "Weihnachten zum Weihnachtsbaum, Nikolaus zum Schuh, Erntedank zum Weizen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "In welchem Monat ist Sankt Martin?"
                options: ["im November", "im Juli", "im März"]
                answer: "im November"
                feedback:
                  "im Juli": "Im Juli ist es abends lange hell. Da leuchtet eine Laterne kaum!"
                hints:
                  - "Sankt Martin ist im Herbst, wenn es früh dunkel wird."
                  - "Die Herbstmonate sind September, Oktober und November."
                  - "Im November, am elften."
              - id: l1-f3
                type: true_false
                text: "Alle Kinder feiern dieselben Feste.\n\nStimmt das?"
                say: "Alle Kinder feiern dieselben Feste. Stimmt das?"
                answer: false
                hints:
                  - "Denk an Anjali und David. Was feiern ihre Familien?"
                  - "Anjalis Familie feiert Diwali, Davids Familie feiert Chanukka."
                  - "Nein. Familien feiern verschiedene Feste."
              - id: l1-f4
                type: image_multiple_choice
                text: "Was stellen Kinder vor Nikolaus vor die Tür?"
                say: "Am Abend vor Nikolaus stellen viele Kinder etwas vor die Tür. Was ist es?"
                options: [{ object: umbrella }, { object: shoe }, { object: bucket }]
                answer: shoe
                feedback:
                  umbrella: "Ein Regenschirm vor der Tür? Da passen keine Nüsse hinein!"
                hints:
                  - "Am Morgen liegen Nüsse und Obst darin."
                  - "Es ist etwas, das du an den Füßen trägst."
                  - "Der Schuh."
              - id: l1-f5
                type: ordering
                text: "Ordne die Feste, wie sie im Jahr kommen."
                say: "Ordne die Feste, wie sie im Jahr kommen: Weihnachten, Sankt Martin, Nikolaus."
                options: ["Weihnachten", "Sankt Martin", "Nikolaus"]
                slot_count: 3
                answer: ["Sankt Martin", "Nikolaus", "Weihnachten"]
                hints:
                  - "Welches Fest ist im November, welche im Dezember?"
                  - "Sankt Martin ist im November. Nikolaus ist am sechsten Dezember, Weihnachten am vierundzwanzigsten."
                  - "Sankt Martin, Nikolaus, Weihnachten."
              - id: l1-f6
                type: multiple_choice
                text: "Wie heißt das jüdische Lichterfest?"
                options: ["Chanukka", "Erntedank", "Nikolaus"]
                answer: "Chanukka"
                hints:
                  - "Davids Familie feiert es im Dezember, acht Tage lang."
                  - "Jeden Abend brennt ein Licht mehr."
                  - "Chanukka."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "An Diwali stellen die Familien viele kleine _ auf."
                options: ["Lichter", "Schneemänner", "Stühle"]
                answer: ["Lichter"]
                hints: ["Diwali heißt auch Lichterfest."]
              - id: l1-s2
                type: multiple_choice
                text: "In welchem Monat ist Weihnachten?"
                options: ["im Dezember", "im Juli", "im März"]
                answer: "im Dezember"
                hints: ["Heiligabend ist kurz vor Silvester, am Ende des Jahres."]
              - id: l1-s3
                type: matching
                text: "Was feiert wer?"
                say: "Tippe auf ein Fest und dann auf das, was dazu passt."
                pairs:
                  - left: { text: "Diwali" }
                    right: { text: "Lichterfest der Hindus" }
                  - left: { text: "Chanukka" }
                    right: { text: "Lichterfest der Juden" }
                  - left: { text: "Weihnachten" }
                    right: { text: "Geburt von Jesus" }
                hints: ["Anjalis Familie feiert Diwali, Davids Familie Chanukka, und Christen feiern Weihnachten."]
              - id: l1-s4
                type: true_false
                text: "Nikolaus ist am 6. Dezember.\n\nStimmt das?"
                say: "Nikolaus ist am sechsten Dezember. Stimmt das?"
                show: { object: shoe }
                answer: true
                hints: ["Am Abend davor stellen Kinder ihre Schuhe vor die Tür. Das ist Anfang Dezember."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was gehört zum Erntedankfest?"
                say: "Welches Bild gehört zum Erntedankfest?"
                options: [{ object: snowman }, { object: wheat }, { object: fireworks }]
                answer: wheat
                hints: ["An Erntedank danken Christen für Getreide, Obst und Gemüse."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wann ist Diwali?"
                options: ["im Oktober oder November", "im Juni oder Juli", "im Februar"]
                answer: "im Oktober oder November"
              - id: l1-n2
                type: ordering
                text: "Ordne die Feste, wie sie im Jahr kommen."
                say: "Ordne die Feste, wie sie im Jahr kommen: Nikolaus, Erntedank, Weihnachten, Sankt Martin."
                options: ["Nikolaus", "Erntedank", "Weihnachten", "Sankt Martin"]
                slot_count: 4
                answer: ["Erntedank", "Sankt Martin", "Nikolaus", "Weihnachten"]
              - id: l1-n3
                type: true_false
                text: "Chanukka dauert acht Tage.\n\nStimmt das?"
                say: "Chanukka dauert acht Tage. Stimmt das?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Was gehört zu Weihnachten?"
                say: "Welches Bild gehört zu Weihnachten?"
                options: [{ object: sandcastle }, { object: egg }, { object: fir-tree }]
                answer: fir-tree
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Martin hat seinen _ mit einem armen Mann geteilt."
                options: ["Mantel", "Kuchen", "Fahrrad"]
                answer: ["Mantel"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "In welchem Monat ist Nikolaus?"
            options: ["im Dezember", "im Mai", "im August"]
            answer: "im Dezember"
          - id: l1-c2
            type: true_false
            text: "Diwali ist ein Lichterfest.\n\nStimmt das?"
            say: "Diwali ist ein Lichterfest. Stimmt das?"
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Was liegt an Weihnachten oft unter dem Baum?"
            say: "Was liegt an Weihnachten in vielen Familien unter dem Baum?"
            options: [{ object: bucket }, { object: present }, { object: stone }]
            answer: present
          - id: l1-c4
            type: ordering
            text: "Ordne die Feste, wie sie im Jahr kommen."
            say: "Ordne die Feste, wie sie im Jahr kommen: Sankt Martin, Weihnachten, Erntedank."
            options: ["Sankt Martin", "Weihnachten", "Erntedank"]
            slot_count: 3
            answer: ["Erntedank", "Sankt Martin", "Weihnachten"]
          - id: l1-c5
            type: multiple_choice
            text: "Womit gehen Kinder an Sankt Martin durch die Straßen?"
            options: ["mit Laternen", "mit Badehosen", "mit Schneebällen"]
            answer: "mit Laternen"
          - id: l1-c6
            type: true_false
            text: "Bei uns ist Weihnachten im Sommer.\n\nStimmt das?"
            say: "Bei uns ist Weihnachten im Sommer. Stimmt das?"
            answer: false

  - n: 2
    title: { de: Feste im ganzen Jahr, en: Festivals all year round }
    goal:
      de: "Ordne die Feste im ganzen Jahr. Karneval kommt vor Ostern, und Silvester ist der letzte Tag im Jahr."
      en: "Put the festivals of the whole year in order. Carnival comes before Easter, and New Year's Eve is the last day of the year."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wann ist Sankt Martin?"
            options: ["im November", "im April"]
            answer: "im November"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Chanukka ist das jüdische Lichterfest.\n\nStimmt das?"
            say: "Chanukka ist das jüdische Lichterfest. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ist Ostern jedes Jahr am selben Tag?"
            say: "Die Klasse 1b macht ihren Festkreis fertig. Jetzt kommen die Feste vom Anfang des Jahres dazu. Ben fragt: Ist Ostern jedes Jahr am selben Tag? Was glaubst du?"
            show: { object: egg }
          - text: "Nein! Ostern ist im März oder April."
            say: "Nein! Ostern ist jedes Jahr an einem anderen Sonntag, im März oder im April. Das ist im Frühling. Christen feiern an Ostern, dass Jesus nach seinem Tod wieder lebendig wurde. Viele Kinder suchen bunte Ostereier. Es heißt, der Osterhase hat sie versteckt."
            show: { objects: [egg, rabbit] }
          - text: "Silvester und Neujahr"
            say: "Ganz am Ende des Jahres, am einunddreißigsten Dezember, ist Silvester. Um Mitternacht beginnt das neue Jahr. Viele Menschen schauen dann Feuerwerk an. Der erste Januar heißt Neujahr."
            show: { object: fireworks }
          - text: "Karneval im Februar oder März"
            say: "Ben feiert Karneval. Manche sagen Fasching oder Fastnacht dazu. Viele Kinder verkleiden sich, zum Beispiel als Clown, und es gibt Umzüge. Karneval ist im Februar oder März, immer vor Ostern."
            show: { object: clown }
          - text: "Das Zuckerfest wandert durch das Jahr."
            say: "Elifs Familie ist muslimisch. Im Fastenmonat Ramadan essen und trinken viele erwachsene Muslime tagsüber nichts. Danach feiern sie das Zuckerfest, mit Besuchen, Geschenken und Süßigkeiten. Der Ramadan richtet sich nach dem Mond. Darum ist das Zuckerfest jedes Jahr etwas früher und wandert durch alle Jahreszeiten."
            show: { object: moon }
          - text: "Jeder hat einen Geburtstag."
            say: "Jeder Mensch hat einen Geburtstag. Er kann in jedem Monat sein. Viele feiern ihn mit Kuchen und Kerzen. In welchem Monat hast du Geburtstag?"
            show: { object: cake }
          - text: "Wusstest du? In ungefähr 33 Jahren war das Zuckerfest einmal in jedem Monat."
            say: "Wusstest du? Das Zuckerfest wandert immer weiter durch das Jahr. In ungefähr dreiunddreißig Jahren war es einmal in jedem Monat, im Winter, im Frühling, im Sommer und im Herbst."
            show: { object: moon }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was gehört zu welchem Fest?"
                say: "Die Kinder malen Bilder für den Festkreis. Tippe auf ein Fest und dann auf sein Bild."
                pairs:
                  - left: { text: "Ostern" }
                    right: { object: egg }
                  - left: { text: "Karneval" }
                    right: { object: clown }
                  - left: { text: "Silvester" }
                    right: { object: fireworks }
                  - left: { text: "Geburtstag" }
                    right: { object: cake }
                hints:
                  - "Was machen die Leute an jedem Fest?"
                  - "An Ostern suchen Kinder Eier. An Karneval verkleiden sie sich."
                  - "Ostern zum Ei, Karneval zum Clown, Silvester zum Feuerwerk, Geburtstag zum Kuchen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wann ist Ostern?"
                say: "Ben will Ostern in den Festkreis kleben. Wann ist Ostern?"
                show: { object: egg }
                options: ["im März oder April", "im Juli oder August", "im November"]
                answer: "im März oder April"
                hints:
                  - "Ostern ist im Frühling."
                  - "Die Frühlingsmonate sind März, April und Mai."
                  - "Im März oder April."
              - id: l2-f3
                type: true_false
                text: "Ostern ist jedes Jahr am selben Tag.\n\nStimmt das?"
                say: "Ostern ist jedes Jahr am selben Tag. Stimmt das?"
                answer: false
                hints:
                  - "Was hat Ben herausgefunden?"
                  - "Ostern ist immer an einem Sonntag, aber nicht immer am gleichen."
                  - "Nein. Ostern ist jedes Jahr an einem anderen Tag."
              - id: l2-f4
                type: ordering
                text: "Ordne die Feste. Fang im Januar an."
                say: "Ordne die Feste, wie sie im Jahr kommen. Fang im Januar an: Ostern, Silvester, Karneval."
                options: ["Ostern", "Silvester", "Karneval"]
                slot_count: 3
                answer: ["Karneval", "Ostern", "Silvester"]
                hints:
                  - "Welches Fest ist am letzten Tag im Jahr?"
                  - "Silvester ist ganz am Ende. Karneval ist immer vor Ostern."
                  - "Karneval, Ostern, Silvester."
              - id: l2-f5
                type: image_multiple_choice
                text: "Welches Bild passt zu Karneval?"
                say: "Ben verkleidet sich an Karneval. Welches Bild passt?"
                options: [{ object: wheat }, { object: clown }, { object: snowman }]
                answer: clown
                hints:
                  - "An Karneval verkleiden sich viele Kinder."
                  - "Als was kann man sich lustig verkleiden?"
                  - "Der Clown."
              - id: l2-f6
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Fest passt in die Lücke?"
                frame: "Der erste Januar heißt _."
                options: ["Neujahr", "Ostern", "Nikolaus"]
                answer: ["Neujahr"]
                hints:
                  - "An diesem Tag fängt etwas Neues an."
                  - "Um Mitternacht an Silvester beginnt das neue Jahr."
                  - "Neujahr."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Warum ist das Zuckerfest jedes Jahr etwas früher?"
                options: ["Der Ramadan richtet sich nach dem Mond.", "Im Sommer ist es zu heiß.", "Die Kinder wollen es so."]
                answer: "Der Ramadan richtet sich nach dem Mond."
                hints: ["Elif hat erzählt, wonach sich der Ramadan richtet."]
              - id: l2-s2
                type: sorting
                text: "In welcher Jahreszeit ist das Fest?"
                say: "Tippe auf ein Fest und hör es. Leg es in seine Jahreszeit."
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { text: "Sankt Martin", bin: herbst }
                  - { text: "Weihnachten", bin: winter }
                  - { text: "Ostern", bin: fruehling }
                  - { text: "Erntedank", bin: herbst }
                hints: ["Ostern ist im März oder April. Sankt Martin ist im November, Weihnachten im Dezember."]
              - id: l2-s3
                type: true_false
                text: "Geburtstag feiert man nur im Sommer.\n\nStimmt das?"
                say: "Geburtstag feiert man nur im Sommer. Stimmt das?"
                show: { object: cake }
                answer: false
                hints: ["In welchen Monaten kann ein Geburtstag sein?"]
              - id: l2-s4
                type: matching
                text: "Wer feiert das Fest?"
                say: "Tippe auf ein Fest und dann darauf, wer es feiert."
                pairs:
                  - left: { text: "Zuckerfest" }
                    right: { text: "Muslime" }
                  - left: { text: "Ostern" }
                    right: { text: "Christen" }
                  - left: { text: "Chanukka" }
                    right: { text: "Juden" }
                hints: ["Elifs Familie ist muslimisch, Davids Familie ist jüdisch."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Fest kommt direkt nach Silvester?"
                options: ["Neujahr", "Ostern", "Nikolaus"]
                answer: "Neujahr"
                hints: ["Um Mitternacht an Silvester beginnt das neue Jahr."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was suchen Kinder an Ostern?"
                say: "Was suchen viele Kinder an Ostern?"
                options: [{ object: fireworks }, { object: shoe }, { object: egg }]
                answer: egg
              - id: l2-n2
                type: ordering
                text: "Ordne die Feste. Fang im Januar an."
                say: "Ordne die Feste, wie sie im Jahr kommen. Fang im Januar an: Weihnachten, Karneval, Sankt Martin, Ostern."
                options: ["Weihnachten", "Karneval", "Sankt Martin", "Ostern"]
                slot_count: 4
                answer: ["Karneval", "Ostern", "Sankt Martin", "Weihnachten"]
              - id: l2-n3
                type: true_false
                text: "Karneval kommt im Jahr vor Ostern.\n\nStimmt das?"
                say: "Karneval kommt im Jahr vor Ostern. Stimmt das?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Welches Fest ist am 31. Dezember?"
                say: "Welches Fest ist am einunddreißigsten Dezember?"
                options: ["Silvester", "Ostern", "Erntedank"]
                answer: "Silvester"
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Fest passt in die Lücke?"
                frame: "Nach dem Ramadan feiern Muslime das _."
                options: ["Zuckerfest", "Erntedankfest", "Osterfest"]
                answer: ["Zuckerfest"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
