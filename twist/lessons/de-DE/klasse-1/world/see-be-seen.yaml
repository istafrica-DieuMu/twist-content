                say: "Ein Reflektor leuchtet auch ganz ohne Licht. Stimmt das?"
                answer: false
                hints:
                  - "Hat ein Reflektor eine Batterie?"
                  - "Ein Reflektor blitzt nur auf, wenn Licht darauf fällt."
                  - "Nein, das stimmt nicht."
              - id: l2-f4
                type: multiple_choice
                text: "Es wird dunkel. Jana fährt los. Was macht sie zuerst?"
                say: "Es wird dunkel. Jana fährt los. Was macht sie zuerst?"
                options: ["Sie macht das Licht am Fahrrad an.", "Sie fährt ohne Licht, dann ist sie schneller.", "Sie zieht eine schwarze Jacke an."]
                answer: "Sie macht das Licht am Fahrrad an."
                hints:
                  - "Was braucht ein Fahrrad, wenn es dunkel ist?"
                  - "Vorne leuchtet es weiß, hinten rot. Dafür muss das Licht an sein."
                  - "Sie macht das Licht am Fahrrad an."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Bei Regen und Nebel sehen Autofahrer _."
                options: ["schlechter", "besser", "alles"]
                answer: ["schlechter"]
                hints:
                  - "Kannst du durch Nebel weit schauen?"
                  - "Regen und Nebel machen die Sicht schlecht."
                  - "schlechter"

