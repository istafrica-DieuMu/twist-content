                  - { text: "dunkler Mantel im Nebel", bin: schlecht }
              - id: l2-n4
                type: true_false
                text: "Ein Reflektor hat eine Batterie."
                say: "Ein Reflektor hat eine Batterie. Stimmt das?"
                answer: false
              - id: l2-n5
