      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ziehst du an, wenn es draußen dunkel ist?"
            say: "Was ziehst du an, wenn es draußen dunkel ist?"
            options: ["helle Kleidung", "dunkle Kleidung"]
            answer: "helle Kleidung"
          - id: l1-c2
            type: true_false
            text: "Dunkle Kleidung sieht man im Dunkeln schlecht."
            say: "Dunkle Kleidung sieht man im Dunkeln schlecht. Stimmt das?"
            answer: true
          - id: l1-c3
            type: sorting
            text: "Gut oder schlecht zu sehen?"
            say: "Tippe auf eine Karte und hör zu. Ist das im Dunkeln gut oder schlecht zu sehen?"
            bins:
              - { id: gut, show: { text: "gut zu sehen" }, say: "gut zu sehen" }
              - { id: schlecht, show: { text: "schlecht zu sehen" }, say: "schlecht zu sehen" }
            options:
              - { text: "Reflektor am Schuh", bin: gut }
              - { text: "dunkelblaue Jacke", bin: schlecht }
              - { text: "hellgrüne Mütze", bin: gut }
              - { text: "schwarze Hose", bin: schlecht }
          - id: l1-c4
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Ein Reflektor wirft das Licht _."
            options: ["zurück", "weg", "um"]
            answer: ["zurück"]
          - id: l1-c5
            type: true_false
            text: "Emil sieht das Auto. Also sieht der Fahrer Emil ganz sicher."
            say: "Emil sieht das Auto. Also sieht der Fahrer Emil ganz sicher. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Wann sind helle Kleidung und Reflektoren besonders wichtig?"
            say: "Wann sind helle Kleidung und Reflektoren besonders wichtig?"
            options: ["morgens im Winter, wenn es noch dunkel ist", "mittags im Sommer", "nachts im Bett"]
            answer: "morgens im Winter, wenn es noch dunkel ist"

  - n: 2
    title: { de: "Licht und Reflektoren", en: "Lights and reflectors" }
    goal:
      de: "Finde heraus, wann man dich schlecht sieht. Bei Regen und in der Dämmerung brauchst du helle Kleidung, und das Fahrrad braucht Licht."
      en: "Find out when you are hard to see. In rain and at dusk you need bright clothes, and a bike needs lights."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Jacke sieht man im Dunkeln besser?"
            say: "Welche Jacke sieht man im Dunkeln besser?"
            options: ["die gelbe Jacke", "die schwarze Jacke"]
            answer: "die gelbe Jacke"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Reflektoren werfen Licht zurück."
            say: "Reflektoren werfen Licht zurück. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ist Jana gut zu sehen?"
            say: "Emils große Schwester Jana fährt mit dem Fahrrad vom Sport nach Hause. Es regnet, und es wird schon dunkel. Was glaubst du: Sehen die Autofahrer Jana jetzt gut oder schlecht?"
            show: { object: rain }
          - text: "Bei Regen, Nebel und Dämmerung sieht man schlecht."
            say: "Schlecht! Wenn es dämmert, regnet oder neblig ist, sehen Autofahrer viel weniger. Dann sind helle Kleidung und Reflektoren besonders wichtig."
            show: { object: rain }
          - text: "Fahrradlicht: vorne weiß, hinten rot"
            say: "Janas Fahrrad hat Licht. Vorne leuchtet es weiß, hinten leuchtet es rot. Wenn es dunkel wird, macht Jana das Licht an."
            show: { object: bike }
          - text: "Reflektoren am Fahrrad"
            say: "Auch am Fahrrad sind Reflektoren: vorne ein weißer, hinten ein roter, und gelbe an den Pedalen."
            show: { object: bike }
          - text: "Ein Reflektor leuchtet nicht von selbst."
            say: "Ein Reflektor hat keine Batterie. Er blitzt nur auf, wenn Licht darauf fällt. Darum braucht das Fahrrad im Dunkeln auch ein eigenes Licht."
            show: { object: light-bulb }
          - text: "Wusstest du? Ein Reflektor schickt das Licht genau dorthin zurück, wo es herkommt."
            say: "Wusstest du? Ein Reflektor schickt das Licht genau dorthin zurück, wo es herkommt. Darum blitzt er für den Autofahrer hinter den Scheinwerfern so hell."
            show: { object: car }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wann muss Jana besonders gut zu sehen sein?"
