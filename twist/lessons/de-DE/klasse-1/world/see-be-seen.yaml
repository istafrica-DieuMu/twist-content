                answer: "wenn es regnet und dämmert"
                hints:
                  - "Wann sehen Autofahrer schlecht?"
                  - "Bei Regen und wenn es dunkel wird, sieht man weniger."
                  - "Wenn es regnet und dämmert."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Welche Farbe hat es?"
                say: "Janas Fahrrad hat Lichter und Reflektoren. Tippe links auf ein Teil und dann rechts auf seine Farbe."
                pairs:
                  - left: { text: "Licht vorne" }
                    right: { text: "weiß" }
                  - left: { text: "Licht hinten" }
                    right: { text: "rot" }
                  - left: { text: "Reflektoren an den Pedalen" }
                    right: { text: "gelb" }
                hints:
                  - "Vorne und hinten haben verschiedene Farben."
                  - "Vorne leuchtet es weiß, hinten rot."
                  - "Licht vorne weiß, Licht hinten rot, Pedale gelb."
              - id: l2-f3
                type: true_false
