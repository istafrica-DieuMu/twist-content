# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.see-be-seen
skill: world.space.see-be-seen
curriculum: de-DE
language: de
title:
  de: Gut zu sehen!
  en: Easy to see!
summary: >
  Emil walks to school on a dark winter morning, and his big sister Jana
  rides her bike home at dusk in the rain. Lesson 1 shows that drivers see
  bright and fluorescent clothes much better than dark ones, that
  reflectors flash back the light of car headlights, and that a child who
  sees a car is not always seen by its driver. Lesson 2 names the times
  when being seen matters most (dark, dusk, rain, fog), the lights and
  reflectors on a bike (white at the front, red at the back, yellow on the
  pedals), and that a reflector only shines when light falls on it; it
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Sicher unterwegs, en: Getting around safely }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [hell, dunkel, Leuchtfarbe, Reflektor, Scheinwerfer, Autofahrer, Dämmerung, Nebel, Fahrradlicht, Katzenauge, sichtbar] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: clothes, what: { de: "helle Kleidung und Leuchtfarben im Dunkeln tragen", en: "wearing bright and fluorescent clothes in the dark" } }
    - { id: reflectors, what: { de: "erklären, was Reflektoren tun", en: "explaining what reflectors do" } }
    - { id: light-when, what: { de: "wissen, wann man schlecht zu sehen ist, und Licht am Fahrrad", en: "knowing when you are hard to see, and lights on a bike" } }
  misconceptions:
    - id: i-see-so-seen
      what: Thinks that if they can see a car (its bright headlights), the driver can see them too
      addressed: "lesson 1 Learn, screen Ich sehe das Auto. Sieht das Auto mich?; l1-f4, l1-n4, l1-c5, l2-c7 and l2-c12"
    - id: reflector-glows
      what: Thinks a reflector glows on its own, like a lamp, so a bike needs no light
      addressed: "lesson 2 Learn says a reflector has no battery and only flashes when light falls on it; l2-f3, l2-s4, l2-n4 and l2-c9"
    - id: dark-clothes-fine
      what: Thinks clothes do not matter because the street lamps are on
      addressed: "lesson 1 Learn says a black jacket is almost invisible in the dark; l1-f1, l1-f2, l1-s1, l1-c2, l2-c5 and l2-c7"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Hell angezogen", en: "Dressed brightly" }
    goal:
      de: "Zieh dich hell an, wenn es draußen dunkel ist. In einer gelben Jacke sieht dich ein Autofahrer viel früher als in einer schwarzen."
      en: "Wear bright clothes when it is dark outside. A driver sees you in a yellow jacket much sooner than in a black one."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wer ist besser zu sehen?"
            say: "Das ist Emil. Es ist Winter, und morgens auf dem Schulweg ist es noch dunkel. Emil kann eine schwarze Jacke anziehen oder eine gelbe. Was glaubst du: In welcher Jacke sieht ihn ein Autofahrer besser?"
            show: { object: moon }
          - text: "In der gelben Jacke!"
            say: "In der gelben Jacke! Helle Farben sieht man im Dunkeln viel besser. Eine schwarze Jacke ist im Dunkeln fast unsichtbar."
            show: { object: jacket, colour: yellow }
          - text: "Leuchtfarben: Gelb, Orange, Hellgrün"
            say: "Am besten sind Leuchtfarben wie Knallgelb, Orange und Hellgrün. Sie leuchten am Tag und in der Dämmerung, wenn es langsam dunkel wird, besonders hell."
            show: { object: jacket, colour: yellow }
          - text: "Reflektoren werfen Licht zurück."
            say: "Emils Ranzen hat Reflektoren. Das sind Streifen, die im Licht hell aufblitzen. Leuchten die Scheinwerfer eines Autos darauf, werfen sie das Licht zurück. Dann sieht der Autofahrer Emil schon von weitem."
            show: { objects: [schoolbag, car] }
          - text: "Ich sehe das Auto. Sieht das Auto mich?"
            say: "Emil sieht das Auto, denn seine Scheinwerfer sind hell. Aber sieht der Autofahrer auch Emil? Nur wenn Emil hell angezogen ist und Reflektoren trägt. Darum gilt: Im Dunkeln hell und mit Reflektoren!"
            show: { object: car }
          - text: "Wusstest du? Reflektoren am Fahrrad heißen auch Katzenaugen."
            say: "Wusstest du? Die Reflektoren am Fahrrad heißen auch Katzenaugen. Denn auch die Augen einer Katze blitzen im Dunkeln hell auf, wenn Licht hineinfällt."
            show: { object: cat }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Es ist noch dunkel. Welche Jacke zieht Emil an?"
                say: "Es ist noch dunkel. Welche Jacke zieht Emil an?"
                options: ["die gelbe Jacke", "die schwarze Jacke", "die dunkelbraune Jacke"]
                answer: "die gelbe Jacke"
                feedback:
                  "die schwarze Jacke": "Eine schwarze Jacke ist im Dunkeln fast unsichtbar."
                  "die dunkelbraune Jacke": "Dunkelbraun sieht man im Dunkeln auch ganz schlecht."
                hints:
                  - "Welche Farbe sieht man im Dunkeln gut?"
                  - "Helle Farben sieht man gut, dunkle schlecht. Welche Jacke ist hell?"
                  - "Die gelbe Jacke."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Gut oder schlecht zu sehen?"
                say: "Was sieht ein Autofahrer im Dunkeln gut, was schlecht? Tippe auf eine Karte und hör zu. Leg sie in die richtige Gruppe."
                bins:
                  - { id: gut, show: { text: "gut zu sehen" }, say: "gut zu sehen" }
                  - { id: schlecht, show: { text: "schlecht zu sehen" }, say: "schlecht zu sehen" }
                options:
                  - { text: "gelbe Jacke", bin: gut }
                  - { text: "schwarze Hose", bin: schlecht }
                  - { text: "Reflektor am Ranzen", bin: gut }
                  - { text: "dunkelblaue Mütze", bin: schlecht }
                hints:
                  - "Frag bei jeder Karte: Ist das hell oder dunkel?"
                  - "Gelb ist hell, und ein Reflektor blitzt im Licht auf. Schwarz und Dunkelblau sind dunkel."
                  - "Gelbe Jacke und Reflektor sind gut zu sehen. Schwarze Hose und dunkelblaue Mütze sind schlecht zu sehen."
              - id: l1-f3
                type: true_false
                text: "Reflektoren werfen das Licht von Autoscheinwerfern zurück."
                say: "Reflektoren werfen das Licht von Autoscheinwerfern zurück. Stimmt das?"
                show: { object: schoolbag }
                answer: true
                hints:
                  - "Was passiert, wenn Autolicht auf Emils Ranzen fällt?"
                  - "Die Streifen am Ranzen blitzen hell auf. Sie schicken das Licht zurück."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: true_false
                text: "Emil sieht die Scheinwerfer des Autos. Also sieht der Autofahrer Emil auch."
                say: "Emil sieht die Scheinwerfer des Autos. Also sieht der Autofahrer Emil auch. Stimmt das?"
                show: { object: car }
                answer: false
                hints:
                  - "Die Scheinwerfer sind hell. Ist Emil auch hell?"
                  - "Der Autofahrer sieht Emil nur gut, wenn Emil helle Kleidung und Reflektoren trägt."
                  - "Nein, das stimmt nicht immer."
              - id: l1-f5
                type: multiple_choice
                text: "Wann ist helle Kleidung besonders wichtig?"
                say: "Wann ist helle Kleidung besonders wichtig?"
                options: ["wenn es draußen dunkel ist", "mittags im Klassenzimmer", "nachts im Bett"]
                answer: "wenn es draußen dunkel ist"
                feedback:
                  "nachts im Bett": "Im Bett muss dich kein Autofahrer sehen. Schlaf gut!"
                hints:
                  - "Wo fahren Autos?"
                  - "Autofahrer müssen dich draußen sehen, und im Dunkeln ist das schwer."
                  - "Wenn es draußen dunkel ist."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Im Dunkeln trage ich _ Kleidung."
                options: ["helle", "dunkle", "nasse"]
                answer: ["helle"]
                hints:
                  - "Welche Kleidung sieht der Autofahrer gut?"
                  - "Gelb und Orange sind helle Farben."
                  - "helle"

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Eine schwarze Jacke sieht man im Dunkeln gut."
                say: "Eine schwarze Jacke sieht man im Dunkeln gut. Stimmt das?"
                answer: false
                hints: ["Ist Schwarz hell oder dunkel?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was blitzt im Autolicht hell auf?"
                say: "Was blitzt im Licht eines Autos hell auf?"
                options: ["ein Reflektor", "ein brauner Schal", "ein Butterbrot"]
                answer: "ein Reflektor"
                feedback:
                  "ein Butterbrot": "Ein Butterbrot schmeckt gut, aber es blitzt nicht."
                hints: ["Was hat Emil an seinem Ranzen?"]
              - id: l1-s3
                type: sorting
                text: "Gut oder schlecht zu sehen?"
                say: "Tippe auf eine Karte und hör zu. Ist das im Dunkeln gut oder schlecht zu sehen?"
                bins:
                  - { id: gut, show: { text: "gut zu sehen" }, say: "gut zu sehen" }
                  - { id: schlecht, show: { text: "schlecht zu sehen" }, say: "schlecht zu sehen" }
                options:
                  - { text: "knallgelbe Mütze", bin: gut }
                  - { text: "schwarze Jacke", bin: schlecht }
                  - { text: "Warnweste", bin: gut }
                  - { text: "dunkelbraune Stiefel", bin: schlecht }
                hints: ["Eine Warnweste ist knallgelb oder orange und hat Leuchtstreifen."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Reflektoren werfen das _ zurück."
                options: ["Licht", "Wasser", "Auto"]
                answer: ["Licht"]
                hints: ["Was kommt aus den Scheinwerfern?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was hilft Emil im Dunkeln?"
                say: "Welches Bild zeigt, was Emil im Dunkeln hilft?"
                options: [{ object: jacket, colour: yellow }, { object: teddy }, { object: ice-cream }]
                answer: yellow
                feedback:
                  ice-cream: "Ein Eis im Winter? Brr! Und sehen kann man dich damit auch nicht."
                hints: ["Was ist hell und zieht man an?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Farbe sieht man im Dunkeln am besten?"
                say: "Welche Farbe sieht man im Dunkeln am besten?"
                options: ["Knallgelb", "Schwarz", "Dunkelbraun"]
                answer: "Knallgelb"
              - id: l1-n2
                type: true_false
                text: "Reflektoren blitzen im Licht der Autoscheinwerfer hell auf."
                say: "Reflektoren blitzen im Licht der Autoscheinwerfer hell auf. Stimmt das?"
                show: { object: car }
                answer: true
              - id: l1-n3
                type: sorting
                text: "Gut oder schlecht zu sehen?"
                say: "Tippe auf eine Karte und hör zu. Ist das im Dunkeln gut oder schlecht zu sehen?"
                bins:
                  - { id: gut, show: { text: "gut zu sehen" }, say: "gut zu sehen" }
                  - { id: schlecht, show: { text: "schlecht zu sehen" }, say: "schlecht zu sehen" }
                options:
                  - { text: "Leuchtstreifen an der Jacke", bin: gut }
                  - { text: "schwarze Mütze", bin: schlecht }
                  - { text: "orange Regenjacke", bin: gut }
                  - { text: "dunkelgrauer Mantel", bin: schlecht }
              - id: l1-n4
                type: multiple_choice
                text: "Emil sieht ein Auto mit hellen Scheinwerfern. Was stimmt?"
                say: "Emil sieht ein Auto mit hellen Scheinwerfern. Was stimmt?"
                options: ["Der Fahrer sieht Emil vielleicht nicht.", "Der Fahrer sieht Emil ganz sicher."]
                answer: "Der Fahrer sieht Emil vielleicht nicht."
              - id: l1-n5
