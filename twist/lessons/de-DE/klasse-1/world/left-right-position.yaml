# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.left-right-position
skill: world.space.left-right-position
curriculum: de-DE
language: de
title:
  de: Links, rechts, vor und hinter
  en: Left, right, in front and behind
summary: >
  Paul helps his little sister Lotta, who mixes up links and rechts.
  Lesson 1 finds links and rechts in a row of pictures (links is where
  you start reading), gives the L trick for the left hand, and adds
  neben, zwischen, ganz links and ganz rechts. In lesson 2 Paul, Lotta
  and their dog Bello play hide and seek: hinter means hidden, vor means
  easy to see and first in a queue; the lesson mixes all the position
  words and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: "Wo ist was?", en: Where things are }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.space.position-words]
  also_practises: []
  vocabulary: { de: [links, rechts, neben, zwischen, vor, hinter, ganz links, ganz rechts, versteckt] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: left-right, what: { de: "links und rechts sicher unterscheiden", en: "telling left from right" } }
    - { id: next-between, what: { de: "neben und zwischen", en: "next to and between" } }
    - { id: front-behind, what: { de: "vor und hinter", en: "in front of and behind" } }
  misconceptions:
    - id: left-right-swap
      what: Swaps links and rechts
      addressed: "lesson 1 Learn ties links to the start of reading and gives the L trick; l1-f2, l1-f5, l1-s1, l1-n2, l1-n4, l1-c2, l2-f5, l2-n1, l2-c2, l2-c5 and l2-c7"
    - id: right-of-means-next
      what: Takes rechts von to mean only the picture directly beside, or picks the named picture itself
      addressed: "l1-f1, l1-s2 and l1-c1 ask for the picture on one side of the middle one, with the named picture among the options"
    - id: behind-visible
      what: Does not link hinter with hidden and vor with easy to see or first in a queue
      addressed: "lesson 2 Learn opens with Bello behind the sofa; l2-f1, l2-f4, l2-s2, l2-s3, l2-n3, l2-c14, l2-c15, l2-c17 and l2-c18"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Links und rechts", en: "Left and right" }
    goal:
      de: "Finde heraus, was links und was rechts ist. Die Katze liegt links vom Ball, der Hund rechts."
      en: "Find out what is on the left and what is on the right. The cat is to the left of the ball, the dog to the right."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Der Ball liegt unter dem Tisch. Ist der Ball oben oder unten?"
            show: { object: table }
            options: ["unten", "oben"]
            answer: "unten"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Die Lampe hängt über dem Tisch. Die Lampe ist oben.\n\nStimmt das?"
            say: "Die Lampe hängt über dem Tisch. Die Lampe ist oben. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Links oder rechts?"
            say: "Das ist Paul, und das ist seine kleine Schwester Lotta. Lotta verwechselt oft links und rechts. Schau: eine Katze, ein Ball und ein Hund. Was glaubst du: Ist die Katze links oder rechts vom Ball?"
            show: { objects: [cat, ball, dog] }
          - text: "Die Katze ist links vom Ball."
            say: "Die Katze ist links vom Ball. Links ist die Seite, auf der du beim Lesen anfängst. Der Hund ist rechts vom Ball."
            show: { objects: [cat, ball, dog] }
          - text: "L wie links"
            say: "Paul kennt einen Trick. Streck beide Hände nach vorn, die Handrücken zeigen zu dir. Spreiz die Daumen ab. Bei einer Hand zeigen Daumen und Zeigefinger ein L. Das ist deine linke Hand. L wie links!"
            show: { text: "L" }
          - text: "Die Tasse steht neben dem Buch."
            say: "Die Tasse steht neben dem Buch. Neben heißt: direkt daneben, links oder rechts."
            show: { objects: [book, cup] }
          - text: "Der Käse liegt zwischen der Maus und der Katze."
            say: "Der Käse liegt zwischen der Maus und der Katze. Zwischen heißt: Auf der einen Seite ist die Maus, auf der anderen Seite die Katze. Pass gut auf deinen Käse auf, kleine Maus!"
            show: { objects: [mouse, cheese, cat] }
          - text: "Ganz links und ganz rechts"
            say: "In einer langen Reihe ist die Ente ganz links. Die Schnecke ist ganz rechts. Der Frosch und der Fisch sind dazwischen."
            show: { objects: [duck, frog, fish, snail] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was ist links von der Banane?"
                say: "Schau dir die Reihe an. Was ist links von der Banane?"
                show: { objects: [apple, banana, pear] }
                options: [{ object: apple }, { object: banana }, { object: pear }]
                answer: apple
                feedback:
                  banana: "Das ist die Banane selbst. Was liegt links neben ihr?"
                  pear: "Die Birne liegt rechts von der Banane."
                hints:
                  - "Links ist die Seite, auf der du beim Lesen anfängst."
                  - "Such zuerst die Banane. Dann schau auf die Seite, wo du zu lesen anfängst."
                  - "Der Apfel ist links von der Banane."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Das Auto ist rechts vom Fahrrad.\n\nStimmt das?"
                say: "Das Auto ist rechts vom Fahrrad. Stimmt das?"
                show: { objects: [car, bike] }
                answer: false
                hints:
                  - "Wo fängst du beim Lesen an? Das ist links."
                  - "Das Auto steht auf der Seite, wo du zu lesen anfängst."
                  - "Nein. Das Auto ist links vom Fahrrad."
              - id: l1-f3
                type: multiple_choice
                text: "Was steht zwischen dem Buch und dem Bleistift?"
                show: { objects: [book, cup, pencil] }
                options: ["die Tasse", "das Buch", "der Bleistift"]
                answer: "die Tasse"
                hints:
                  - "Zwischen heißt: auf beiden Seiten ist etwas."
                  - "Auf der einen Seite ist das Buch, auf der anderen der Bleistift. Was ist in der Mitte?"
                  - "Die Tasse."
              - id: l1-f4
                type: ordering
                text: "Ganz links der Hund, in der Mitte die Katze, ganz rechts die Maus."
                say: "Hilf Lotta. Ganz links steht der Hund, in der Mitte die Katze, ganz rechts die Maus. Tippe die Bilder der Reihe nach an, von links nach rechts."
                options: [{ object: mouse }, { object: dog }, { object: cat }]
                slot_count: 3
                answer: [dog, cat, mouse]
                hints:
                  - "Das erste Feld ist ganz links."
                  - "Ganz links kommt der Hund. Wer steht in der Mitte?"
                  - "Hund, Katze, Maus."
              - id: l1-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Schau dir das Bild an. Welches Wort passt in die Lücke?"
                show: { objects: [tree, house] }
                frame: "Der Baum steht _ vom Haus."
                options: ["links", "rechts"]
                answer: ["links"]
                hints:
                  - "Auf welcher Seite fängst du beim Lesen an?"
                  - "Der Baum steht auf der Seite, wo du zu lesen anfängst."
                  - "Links."
              - id: l1-f6
                type: image_multiple_choice
                text: "Was ist ganz rechts?"
                say: "Schau dir die Reihe an. Was ist ganz rechts?"
                show: { objects: [sun, moon, star] }
                options: [{ object: sun }, { object: moon }, { object: star }]
                answer: star
                hints:
                  - "Ganz rechts ist das letzte Bild, ganz am Ende der Reihe."
                  - "Die Sonne steht dort, wo du zu lesen anfängst. Das ist ganz links. Und am anderen Ende?"
                  - "Der Stern."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Bei der linken Hand zeigen Daumen und Zeigefinger ein L.\n\nStimmt das?"
                say: "Die Handrücken zeigen zu dir, die Daumen sind abgespreizt. Bei der linken Hand zeigen Daumen und Zeigefinger ein L. Stimmt das?"
                show: { text: "L" }
                answer: true
                hints: ["L wie links."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Was ist rechts von der Ente?"
                say: "Schau dir die Reihe an. Was ist rechts von der Ente?"
                show: { objects: [frog, duck, fish] }
                options: [{ object: frog }, { object: duck }, { object: fish }]
                answer: fish
                hints: ["Such die Ente. Rechts ist die Seite, wo die Reihe aufhört."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Schau dir das Bild an. Welches Wort passt in die Lücke?"
                show: { objects: [cup, book, pencil] }
                frame: "Das Buch liegt _ der Tasse und dem Bleistift."
                options: ["zwischen", "auf", "unter"]
                answer: ["zwischen"]
                hints: ["Auf beiden Seiten vom Buch liegt etwas."]
              - id: l1-s4
                type: ordering
                text: "Ganz links der Apfel, in der Mitte die Birne, ganz rechts die Banane."
                say: "Ganz links liegt der Apfel, in der Mitte die Birne, ganz rechts die Banane. Tippe die Bilder der Reihe nach an, von links nach rechts."
                options: [{ object: banana }, { object: pear }, { object: apple }]
                slot_count: 3
                answer: [apple, pear, banana]
                hints: ["Das erste Feld ist ganz links. Dort kommt der Apfel hin."]
              - id: l1-s5
                type: multiple_choice
                text: "Wo steht das Auto?"
                show: { objects: [bike, car, lorry] }
                options: ["zwischen dem Fahrrad und dem Lastwagen", "ganz links", "ganz rechts"]
                answer: "zwischen dem Fahrrad und dem Lastwagen"
                hints: ["Steht das Auto am Anfang, am Ende oder in der Mitte der Reihe?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was ist ganz links?"
                say: "Schau dir die Reihe an. Was ist ganz links?"
                show: { objects: [owl, bird, bee, ladybird] }
                options: [{ object: owl }, { object: bee }, { object: ladybird }]
                answer: owl
              - id: l1-n2
                type: true_false
                text: "Der Hund ist links von der Katze.\n\nStimmt das?"
                say: "Der Hund ist links von der Katze. Stimmt das?"
                show: { objects: [dog, cat] }
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Schau dir das Bild an. Welches Wort passt in die Lücke?"
                show: { objects: [rose, flower, tree] }
                frame: "Die Blume steht zwischen der Rose und dem _."
                options: ["Baum", "Haus", "Zaun"]
                answer: ["Baum"]
              - id: l1-n4
                type: multiple_choice
                text: "Wo liegt der Teddy?"
                show: { objects: [ball, teddy] }
                options: ["rechts vom Ball", "links vom Ball"]
                answer: "rechts vom Ball"
              - id: l1-n5
                type: ordering
                text: "Ganz links das Schaf, in der Mitte die Kuh, ganz rechts das Schwein."
                say: "Ganz links steht das Schaf, in der Mitte die Kuh, ganz rechts das Schwein. Tippe die Bilder der Reihe nach an, von links nach rechts."
                options: [{ object: pig }, { object: sheep }, { object: cow }]
                slot_count: 3
                answer: [sheep, cow, pig]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was ist links vom Apfel?"
            say: "Schau dir die Reihe an. Was ist links vom Apfel?"
            show: { objects: [carrot, apple, tomato] }
            options: [{ object: carrot }, { object: apple }, { object: tomato }]
            answer: carrot
          - id: l1-c2
            type: true_false
            text: "Das Schiff ist links vom Boot.\n\nStimmt das?"
            say: "Das Schiff ist links vom Boot. Stimmt das?"
            show: { objects: [boat, ship] }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was liegt zwischen dem Huhn und der Ente?"
            show: { objects: [hen, egg, duck] }
            options: ["das Ei", "das Huhn", "die Ente"]
            answer: "das Ei"
          - id: l1-c4
            type: image_multiple_choice
            text: "Was steht ganz rechts?"
            say: "Schau dir die Reihe an. Was steht ganz rechts?"
            show: { objects: [cup, glass, bottle] }
            options: [{ object: cup }, { object: glass }, { object: bottle }]
            answer: bottle
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Schau dir das Bild an. Welches Wort passt in die Lücke?"
            show: { objects: [chair, table] }
            frame: "Der Stuhl steht _ vom Tisch."
            options: ["links", "rechts"]
            answer: ["links"]
          - id: l1-c6
            type: true_false
            text: "Die Sonne ist zwischen dem Mond und dem Stern.\n\nStimmt das?"
            say: "Die Sonne ist zwischen dem Mond und dem Stern. Stimmt das?"
            show: { objects: [moon, sun, star] }
            answer: true

  - n: 2
    title: { de: "Wo ist Bello?", en: "Where is Bello?" }
    goal:
      de: "Sag, ob etwas vor oder hinter einem Ding ist. Wer hinter dem Sofa sitzt, ist versteckt."
      en: "Say whether something is in front of or behind a thing. Whoever sits behind the sofa is hidden."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was ist ganz links?"
            say: "Schau dir die Reihe an. Was ist ganz links?"
            show: { objects: [giraffe, elephant, lion] }
            options: [{ object: giraffe }, { object: elephant }, { object: lion }]
            answer: giraffe
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Der Ball liegt zwischen dem Jungen und dem Mädchen.\n\nStimmt das?"
            say: "Der Ball liegt zwischen dem Jungen und dem Mädchen. Stimmt das?"
            show: { objects: [ball, boy, girl] }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Vor oder hinter dem Sofa?"
            say: "Paul und Lotta spielen Verstecken mit ihrem Hund Bello. Lotta sucht. Sie sieht nur Bellos Schwanz, der hinten am Sofa hervorschaut. Was glaubst du: Sitzt Bello vor dem Sofa oder hinter dem Sofa?"
            show: { object: sofa }
          - text: "Bello ist hinter dem Sofa."
            say: "Bello sitzt hinter dem Sofa! Was hinter etwas ist, ist versteckt. Lotta kann Bello nicht ganz sehen."
            show: { object: sofa }
          - text: "Jetzt sitzt Bello vor dem Sofa."
            say: "Gefunden! Jetzt setzt sich Bello vor das Sofa. Was vor etwas ist, kannst du gut sehen. Es ist näher bei dir."
            show: { object: dog }
          - text: "Wer vorn steht, ist zuerst dran."
            say: "Vor und hinter gibt es auch in einer Schlange. Lotta steht vor Paul an der Rutsche. Darum rutscht Lotta zuerst. Paul steht hinter ihr und wartet."
            show: { objects: [girl, boy] }
          - text: "Bello liegt zwischen Paul und Lotta."
            say: "Nach dem Spiel kuschelt sich Bello zwischen Paul und Lotta. Paul liegt neben Bello, und Lotta liegt auch neben Bello."
            show: { objects: [boy, dog, girl] }
          - text: "Wusstest du? In England fahren die Autos links."
            say: "Wusstest du? Bei uns fahren die Autos auf der rechten Seite der Straße. In England fahren sie auf der linken Seite!"
            show: { object: car }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lotta kann Bello nicht sehen. Wo ist er?"
                show: { object: cupboard }
                options: ["vor dem Schrank", "hinter dem Schrank"]
                answer: "hinter dem Schrank"
                keep_order: true
                feedback:
                  "vor dem Schrank": "Vor dem Schrank würde Lotta Bello sofort sehen!"
                hints:
                  - "Wer sich versteckt, will nicht gesehen werden."
                  - "Was vor etwas ist, siehst du gut. Was hinter etwas ist, ist versteckt."
                  - "Hinter dem Schrank."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Was liegt zwischen Paul und Lotta?"
                say: "Links steht Paul, rechts steht Lotta. Was liegt zwischen ihnen?"
                show: { objects: [boy, ball, girl] }
                options: [{ object: boy }, { object: ball }, { object: girl }]
                answer: ball
                hints:
                  - "Zwischen heißt: in der Mitte, mit Paul auf der einen und Lotta auf der anderen Seite."
                  - "Schau in die Mitte der Reihe."
                  - "Der Ball."
              - id: l2-f3
                type: true_false
                text: "Bello sitzt vor der Tür. Lotta kann ihn gut sehen.\n\nStimmt das?"
                say: "Bello sitzt vor der Tür. Lotta kann ihn gut sehen. Stimmt das?"
                show: { object: door }
                answer: true
                hints:
                  - "Ist Bello versteckt, oder sitzt er da, wo Lotta hinschaut?"
                  - "Was vor etwas ist, ist näher bei dir und gut zu sehen."
                  - "Ja. Vor der Tür ist Bello gut zu sehen."
              - id: l2-f4
                type: sorting
                text: "Versteckt oder gut zu sehen?"
                say: "Wo kann sich Bello verstecken? Tippe auf eine Karte und hör, was darauf steht. Leg sie zu versteckt oder zu gut zu sehen."
                bins:
                  - { id: versteckt, show: { text: "versteckt" }, say: "versteckt" }
                  - { id: zu-sehen, show: { text: "gut zu sehen" }, say: "gut zu sehen" }
                options:
                  - { text: "hinter dem Baum", bin: versteckt }
                  - { text: "vor dem Baum", bin: zu-sehen }
                  - { text: "hinter der Tür", bin: versteckt }
                  - { text: "vor dem Haus", bin: zu-sehen }
                hints:
                  - "Hör bei jeder Karte auf das erste Wort: vor oder hinter?"
                  - "Hinter etwas bist du versteckt. Vor etwas sieht dich jeder."
                  - "Hinter dem Baum und hinter der Tür zu versteckt, vor dem Baum und vor dem Haus zu gut zu sehen."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Schau dir das Bild an. Welches Wort passt in die Lücke?"
                show: { objects: [cat, dog] }
                frame: "Die Katze sitzt _ vom Hund."
                options: ["links", "rechts"]
                answer: ["links"]
                hints:
                  - "Wo fängst du beim Lesen an?"
                  - "Die Katze sitzt auf der Seite, wo du zu lesen anfängst."
                  - "Links."
              - id: l2-f6
                type: ordering
                text: "Ganz links Lotta, in der Mitte Bello, ganz rechts Paul."
                say: "Die drei stellen sich für ein Foto auf. Ganz links steht Lotta, in der Mitte Bello, ganz rechts Paul. Tippe die Bilder der Reihe nach an, von links nach rechts."
                options: [{ object: boy }, { object: girl }, { object: dog }]
                slot_count: 3
                answer: [girl, dog, boy]
                hints:
                  - "Das erste Feld ist ganz links."
                  - "Ganz links steht Lotta, das Mädchen. Wer steht in der Mitte?"
                  - "Mädchen, Hund, Junge."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was ist links von Bello?"
                say: "Bello steht im Garten. Was ist links von Bello?"
                show: { objects: [tree, dog, house] }
                options: [{ object: tree }, { object: dog }, { object: house }]
                answer: tree
                hints: ["Such Bello, den Hund. Links ist die Seite, wo du zu lesen anfängst."]
              - id: l2-s2
                type: true_false
                text: "Wer hinter dem Sofa sitzt, ist gut zu sehen.\n\nStimmt das?"
                say: "Wer hinter dem Sofa sitzt, ist gut zu sehen. Stimmt das?"
                answer: false
                hints: ["Denk an Bello und seinen Schwanz."]
              - id: l2-s3
                type: multiple_choice
                text: "An der Rutsche steht Paul hinter Lotta. Wer ist zuerst dran?"
                options: ["Lotta", "Paul"]
                answer: "Lotta"
                hints: ["Wer vorn in der Schlange steht, ist zuerst dran."]
              - id: l2-s4
                type: fill_in_blank
                text: "Lotta sieht nur Bellos Pfoten unter dem Vorhang. Welches Wort passt?"
                say: "Lotta sieht nur Bellos Pfoten unter dem Vorhang. Welches Wort passt in die Lücke?"
                frame: "Bello steht _ dem Vorhang."
                options: ["hinter", "vor"]
                answer: ["hinter"]
                hints: ["Bello ist fast ganz versteckt."]
              - id: l2-s5
                type: matching
                text: "Was ist das Gegenteil?"
                say: "Tippe auf ein Wort und dann auf sein Gegenteil."
                pairs:
                  - left: { text: "vor" }
                    right: { text: "hinter" }
                  - left: { text: "links" }
                    right: { text: "rechts" }
                  - left: { text: "oben" }
                    right: { text: "unten" }
                hints: ["Bello sitzt erst hinter dem Sofa, dann vor dem Sofa."]

          - support: none
            tasks:
              - id: l2-n1
                type: true_false
                text: "Lotta steht rechts von Paul.\n\nStimmt das?"
                say: "Das Mädchen ist Lotta, der Junge ist Paul. Lotta steht rechts von Paul. Stimmt das?"
                show: { objects: [girl, boy] }
                answer: false
              - id: l2-n2
                type: multiple_choice
                text: "Bello liegt zwischen Paul und Lotta. Wer liegt neben Bello?"
                options: ["Paul und Lotta", "nur Paul", "niemand"]
                answer: "Paul und Lotta"
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Wer sich _ dem Baum versteckt, ist schwer zu finden."
                options: ["hinter", "vor"]
                answer: ["hinter"]
              - id: l2-n4
                type: image_multiple_choice
                text: "Was ist rechts von der Maus?"
                say: "Schau dir die Reihe an. Was ist rechts von der Maus?"
                show: { objects: [cat, mouse, dog] }
                options: [{ object: cat }, { object: mouse }, { object: dog }]
                answer: dog
              - id: l2-n5
                type: ordering
                text: "Ganz links der Ball, in der Mitte der Teddy, ganz rechts das Buch."
                say: "Lotta räumt ihr Regal ein. Ganz links der Ball, in der Mitte der Teddy, ganz rechts das Buch. Tippe die Bilder der Reihe nach an, von links nach rechts."
                options: [{ object: book }, { object: ball }, { object: teddy }]
                slot_count: 3
                answer: [ball, teddy, book]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: left-right
            type: image_multiple_choice
            text: "Was ist links vom Apfel?"
            say: "Schau dir die Reihe an. Was liegt links vom Apfel?"
            show: { objects: [pear, apple, orange] }
            options: [{ object: pear }, { object: apple }, { object: orange }]
            answer: pear
          - id: l2-c2
            part: left-right
            type: true_false
            text: "Das Fahrrad ist links vom Auto.\n\nStimmt das?"
            say: "Das Fahrrad ist links vom Auto. Stimmt das?"
            show: { objects: [bike, car] }
            answer: true
          - id: l2-c3
            part: left-right
