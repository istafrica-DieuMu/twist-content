# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.day-week
skill: world.time.day-week
curriculum: de-DE
language: de
title:
  de: Mein Tag, meine Woche
  en: My day, my week
summary: >
  Mats makes plans with his Papa. Lesson 1 puts a day into a day plan
  (morgens Schule, nachmittags Fußball, abends Abendessen) and reads a
  week plan with one thing for each school day, building on the order of
  the day and the days of the week from Mathe. Lesson 2 sets the five
  school days (Montag to Freitag) against the weekend (Samstag and
  Sonntag), opening with Mats packing his schoolbag on a Saturday, and
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Mein Jahr, en: My year }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.time.sequence-of-day]
  also_practises: []
  vocabulary: { de: [Tagesplan, Wochenplan, Woche, Wochentag, Schultag, Wochenende, morgens, nachmittags, abends, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag, Sonnabend] }
  forms: [text, audio, drawn, picture]
  drawn: [table]
  sounds: []
  facets: []
  parts:
    - { id: day, what: { de: einen Tag in einem Plan ordnen, en: putting a day in order on a plan } }
    - { id: week, what: { de: "die Wochentage ordnen und einen Wochenplan lesen", en: "putting the days of the week in order and reading a week plan" } }
    - { id: weekend, what: { de: Schultage und Wochenende unterscheiden, en: telling school days from the weekend } }
  misconceptions:
    - id: saturday-school
      what: Thinks Saturday is a school day, or that every day is a school day
      addressed: "lesson 2 Learn opens with Mats packing his schoolbag on a Saturday; l2-f1, l2-f2, l2-s1, l2-n3, l2-c14 and l2-c15"
    - id: weekend-one-day
      what: Thinks the weekend is only Sunday
      addressed: "lesson 2 Learn says Samstag und Sonntag are the weekend; l2-f4, l2-s5, l2-n1 and l2-c16"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Mein Tagesplan, mein Wochenplan", en: "My day plan, my week plan" }
    goal:
      de: "Ordne deinen Tag und deine Woche in einem Plan. Am Dienstag hat Mats Schwimmen, am Donnerstag Fußball."
      en: "Put your day and your week in order on a plan. On Tuesday Mats has swimming, on Thursday football."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Ordne die Tageszeiten."
            say: "Ordne die Tageszeiten: abends, mittags, morgens."
            options: ["abends", "mittags", "morgens"]
            slot_count: 3
            answer: ["morgens", "mittags", "abends"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Tag kommt nach Montag?"
            say: "Welcher Tag kommt nach Montag?"
            options: ["Dienstag", "Mittwoch", "Sonntag"]
            answer: "Dienstag"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was kommt zuerst?"
            say: "Das ist Mats. Mats malt mit Papa einen Plan für seinen Tag. Er hat drei Sachen: Abendessen, Schule und Fußball. Was glaubst du: Was kommt zuerst?"
            show: { object: school }
          - text: "Ein Tagesplan zeigt die Reihenfolge."
            say: "Zuerst ist Schule, am Morgen. Am Nachmittag spielt Mats Fußball. Am Abend gibt es Abendessen. Ein Tagesplan zeigt, was nacheinander passiert."
            show: { drawn: table, rows: [["Wann?", "Was?"], ["morgens", "Schule"], ["nachmittags", "Fußball"], ["abends", "Abendessen"]] }
          - text: "Eine Woche hat sieben Tage."
            say: "Eine Woche hat sieben Tage: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag und Sonntag. Danach fängt eine neue Woche an."
            show: { drawn: table, rows: [["Tage der Woche"], ["Montag"], ["Dienstag"], ["Mittwoch"], ["Donnerstag"], ["Freitag"], ["Samstag"], ["Sonntag"]] }
          - text: "Mats' Wochenplan"
            say: "In einem Wochenplan steht, was an jedem Tag passiert. Mats schaut nach: Am Dienstag hat er Schwimmen. Am Donnerstag spielt er Fußball."
            show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Montag", "Flöte"], ["Dienstag", "Schwimmen"], ["Mittwoch", "Oma besuchen"], ["Donnerstag", "Fußball"], ["Freitag", "Bücherei"]], mark: [[2, 0], [2, 1]] }
          - text: "Wusstest du? Der Sonntag hat seinen Namen von der Sonne, der Montag vom Mond."
            say: "Wusstest du? Der Sonntag hat seinen Namen von der Sonne, und der Montag hat seinen Namen vom Mond. Sonne, Sonntag. Mond, Montag."
            show: { objects: [sun, moon] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Ordne Mats' Tag."
                say: "Bring Mats' Tag in die richtige Reihenfolge: Abendessen, Schule, Fußball."
                options: ["Abendessen", "Schule", "Fußball"]
                slot_count: 3
                answer: ["Schule", "Fußball", "Abendessen"]
                hints:
                  - "Was macht Mats am Morgen?"
                  - "Am Morgen ist Schule, am Nachmittag Fußball."
                  - "Schule, Fußball, Abendessen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wann hat Mats Schwimmen?"
                say: "Schau in Mats' Wochenplan. Wann hat er Schwimmen?"
                show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Montag", "Flöte"], ["Dienstag", "Schwimmen"], ["Mittwoch", "Oma besuchen"], ["Donnerstag", "Fußball"], ["Freitag", "Bücherei"]] }
                options: ["am Dienstag", "am Montag", "am Freitag"]
                answer: "am Dienstag"
                hints:
                  - "Such im Plan das Wort Schwimmen."
                  - "Neben Schwimmen steht ein Tag. Er kommt gleich nach Montag."
                  - "Am Dienstag."
              - id: l1-f3
                type: true_false
                text: "Eine Woche hat sieben Tage."
                say: "Eine Woche hat sieben Tage. Stimmt das?"
                answer: true
                hints:
                  - "Zähl die Tage von Montag bis Sonntag."
                  - "Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: ordering
                text: "Ordne die Wochentage."
                say: "Ordne die Wochentage: Mittwoch, Montag, Dienstag."
                options: ["Mittwoch", "Montag", "Dienstag"]
                slot_count: 3
                answer: ["Montag", "Dienstag", "Mittwoch"]
                hints:
                  - "Mit welchem Tag fängt die Woche an?"
                  - "Die Woche fängt mit Montag an. Dann kommt Dienstag."
                  - "Montag, Dienstag, Mittwoch."
              - id: l1-f5
                type: multiple_choice
                text: "Was macht Mats am Donnerstag?"
                say: "Schau in Mats' Wochenplan. Was macht er am Donnerstag?"
                show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Montag", "Flöte"], ["Dienstag", "Schwimmen"], ["Mittwoch", "Oma besuchen"], ["Donnerstag", "Fußball"], ["Freitag", "Bücherei"]] }
                options: ["Fußball", "Schwimmen", "Flöte"]
                answer: "Fußball"
                hints:
                  - "Such im Plan den Donnerstag."
                  - "Donnerstag steht in der vierten Reihe. Was steht daneben?"
                  - "Fußball."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Nach Freitag kommt _."
                options: ["Samstag", "Donnerstag", "Montag"]
                answer: ["Samstag"]
                hints:
                  - "Sag die Wochentage auf, bis du bei Freitag bist."
                  - "Donnerstag, Freitag, und dann?"
                  - "Samstag"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wann besucht Mats Oma?"
                say: "Schau in Mats' Wochenplan. Wann besucht er Oma?"
                show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Montag", "Flöte"], ["Dienstag", "Schwimmen"], ["Mittwoch", "Oma besuchen"], ["Donnerstag", "Fußball"], ["Freitag", "Bücherei"]] }
                options: ["am Mittwoch", "am Dienstag", "am Sonntag"]
                answer: "am Mittwoch"
                hints: ["Such im Plan die Oma. Welcher Tag steht daneben?"]
              - id: l1-s2
                type: ordering
                text: "Ordne Mats' Essen am Tag."
                say: "Bring Mats' Essen in die richtige Reihenfolge: Abendessen, Mittagessen, Frühstück."
                options: ["Abendessen", "Mittagessen", "Frühstück"]
                slot_count: 3
                answer: ["Frühstück", "Mittagessen", "Abendessen"]
                hints: ["Was isst Mats gleich nach dem Aufstehen?"]
              - id: l1-s3
                type: true_false
                text: "Am Abend geht Mats zur Schule."
                say: "Am Abend geht Mats zur Schule. Stimmt das?"
                answer: false
                hints: ["Wann ist im Tagesplan die Schule?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Der Tag vor Donnerstag ist _."
                options: ["Mittwoch", "Freitag", "Sonntag"]
                answer: ["Mittwoch"]
                hints: ["Vor heißt: Er kommt gleich davor."]
              - id: l1-s5
                type: multiple_choice
                text: "Was steht in einem Wochenplan?"
                say: "Was steht in einem Wochenplan?"
                options: ["was an jedem Tag passiert", "wie das Wetter wird", "wie groß Mats ist"]
                answer: "was an jedem Tag passiert"
                hints: ["Denk an Mats' Plan mit Flöte, Schwimmen und Fußball."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Ordne die Wochentage."
                say: "Ordne die Wochentage: Donnerstag, Freitag, Mittwoch."
                options: ["Donnerstag", "Freitag", "Mittwoch"]
                slot_count: 3
                answer: ["Mittwoch", "Donnerstag", "Freitag"]
              - id: l1-n2
                type: multiple_choice
                text: "Was macht Mats am Montag?"
                say: "Schau in Mats' Wochenplan. Was macht er am Montag?"
                show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Montag", "Flöte"], ["Dienstag", "Schwimmen"], ["Mittwoch", "Oma besuchen"], ["Donnerstag", "Fußball"], ["Freitag", "Bücherei"]] }
                options: ["Flöte", "Fußball", "Schwimmen"]
                answer: "Flöte"
              - id: l1-n3
                type: true_false
                text: "Der Montag hat seinen Namen von der Sonne."
                say: "Der Montag hat seinen Namen von der Sonne. Stimmt das?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Morgens ist Mats in der _."
                options: ["Schule", "Rakete", "Wolke"]
                answer: ["Schule"]
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Tage hat eine Woche?"
                say: "Wie viele Tage hat eine Woche?"
                options: ["7", "5", "12"]
                answer: "7"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: ordering
            text: "Ordne die Wochentage."
            say: "Ordne die Wochentage: Sonntag, Freitag, Samstag."
            options: ["Sonntag", "Freitag", "Samstag"]
            slot_count: 3
            answer: ["Freitag", "Samstag", "Sonntag"]
          - id: l1-c2
            type: true_false
            text: "Nach Sonntag fängt eine neue Woche an."
            say: "Nach Sonntag fängt eine neue Woche an. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wann geht Mats in die Bücherei?"
            say: "Schau in Mats' Wochenplan. Wann geht er in die Bücherei?"
            show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Montag", "Flöte"], ["Dienstag", "Schwimmen"], ["Mittwoch", "Oma besuchen"], ["Donnerstag", "Fußball"], ["Freitag", "Bücherei"]] }
            options: ["am Freitag", "am Montag", "am Mittwoch"]
            answer: "am Freitag"
          - id: l1-c4
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Eine Woche hat _ Tage."
            options: ["7", "10", "3"]
            answer: ["7"]
          - id: l1-c5
            type: multiple_choice
            text: "Was steht im Tagesplan ganz am Ende?"
            say: "Was steht in Mats' Tagesplan ganz am Ende?"
            options: ["Abendessen", "Schule", "Fußball"]
            answer: "Abendessen"
          - id: l1-c6
            type: true_false
            text: "Montag kommt nach Dienstag."
            say: "Montag kommt nach Dienstag. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Schultage und Wochenende", en: "School days and the weekend" }
    goal:
      de: "Finde heraus, wann Schule ist und wann Wochenende. Von Montag bis Freitag gehst du zur Schule, Samstag und Sonntag sind frei."
      en: "Find out when there is school and when it is the weekend. From Monday to Friday you go to school, Saturday and Sunday are free."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Tag kommt nach Mittwoch?"
            say: "Welcher Tag kommt nach Mittwoch?"
            options: ["Donnerstag", "Dienstag", "Samstag"]
            answer: "Donnerstag"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Tagesplan zeigt, was nacheinander passiert."
            say: "Ein Tagesplan zeigt, was nacheinander passiert. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Muss Mats heute zur Schule?"
            say: "Es ist Samstag. Mats wacht auf und packt schnell seinen Ranzen. Papa lacht. Was glaubst du: Muss Mats heute zur Schule?"
            show: { object: schoolbag }
          - text: "Am Samstag ist keine Schule."
            say: "Nein! Samstag und Sonntag sind das Wochenende. Am Wochenende hast du keine Schule."
            show: { drawn: table, rows: [["Tag", "Schule?"], ["Montag", "ja"], ["Dienstag", "ja"], ["Mittwoch", "ja"], ["Donnerstag", "ja"], ["Freitag", "ja"], ["Samstag", "nein"], ["Sonntag", "nein"]], mark: [[6, 0], [6, 1], [7, 0], [7, 1]] }
          - text: "Fünf Schultage, zwei Tage Wochenende"
            say: "Von Montag bis Freitag gehst du zur Schule, wenn keine Ferien sind. Das sind fünf Schultage. Dann kommen zwei Tage Wochenende: Samstag und Sonntag."
            show: { drawn: table, rows: [["Tag", "Schule?"], ["Montag", "ja"], ["Dienstag", "ja"], ["Mittwoch", "ja"], ["Donnerstag", "ja"], ["Freitag", "ja"], ["Samstag", "nein"], ["Sonntag", "nein"]] }
          - text: "Am Wochenende"
            say: "Am Wochenende hat Mats Zeit für seine Familie. Am Samstag machen sie einen Ausflug in den Park. Am Sonntag schläft Mats lange. Und am Montag geht die Schule wieder los."
            show: { object: park }
          - text: "Wusstest du? Im Norden von Deutschland heißt der Samstag oft Sonnabend."
            say: "Wusstest du? Im Norden von Deutschland sagen viele Menschen zum Samstag Sonnabend. Der Name bedeutet: der Abend vor dem Sonntag."
            show: { object: sun }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Schultag oder Wochenende?"
                say: "Hilf Mats. Tippe auf einen Tag und hör zu. Ist er ein Schultag oder gehört er zum Wochenende?"
                bins:
                  - { id: schule, show: { text: "Schultag" }, say: "Schultag" }
                  - { id: wochenende, show: { text: "Wochenende" }, say: "Wochenende" }
                options:
                  - { text: "Montag", bin: schule }
                  - { text: "Samstag", bin: wochenende }
                  - { text: "Mittwoch", bin: schule }
                  - { text: "Sonntag", bin: wochenende }
                hints:
                  - "Welche zwei Tage sind am Ende der Woche?"
                  - "Von Montag bis Freitag ist Schule. Dann kommen Samstag und Sonntag."
                  - "Montag und Mittwoch sind Schultage, Samstag und Sonntag Wochenende."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Am Samstag hat Mats Schule."
                say: "Am Samstag hat Mats Schule. Stimmt das?"
                show: { object: schoolbag }
                answer: false
                hints:
                  - "Warum hat Papa gelacht, als Mats am Samstag seinen Ranzen gepackt hat?"
                  - "Samstag gehört zum Wochenende."
                  - "Nein, das stimmt nicht."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Schultage hat eine Woche?"
                say: "Wie viele Schultage hat eine Woche?"
                options: ["5", "2", "7"]
                answer: "5"
                hints:
                  - "Zähl die Tage von Montag bis Freitag."
                  - "Montag, Dienstag, Mittwoch, Donnerstag, Freitag."
                  - "5"
              - id: l2-f4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Samstag und Sonntag sind das _."
                options: ["Wochenende", "Frühstück", "Schuljahr"]
                answer: ["Wochenende"]
                hints:
                  - "Am Ende der Woche ist frei. Wie heißt das?"
                  - "Das Ende der Woche heißt Wochen..."
                  - "Wochenende"
              - id: l2-f5
                type: ordering
                text: "Ordne die Tage."
                say: "Ordne die Tage: Sonntag, Freitag, Samstag."
                options: ["Sonntag", "Freitag", "Samstag"]
                slot_count: 3
                answer: ["Freitag", "Samstag", "Sonntag"]
                hints:
                  - "Welcher Tag ist der letzte Schultag?"
                  - "Nach Freitag kommt das Wochenende: zuerst Samstag."
                  - "Freitag, Samstag, Sonntag."
              - id: l2-f6
                type: multiple_choice
                text: "Heute ist Freitag. Welcher Tag ist morgen?"
                say: "Heute ist Freitag. Welcher Tag ist morgen?"
                options: ["Samstag", "Donnerstag", "Montag"]
                answer: "Samstag"
                hints:
                  - "Morgen ist der Tag nach heute."
                  - "Nach Freitag kommt das Wochenende."
                  - "Samstag."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Schultag oder Wochenende?"
                say: "Tippe auf einen Tag und hör zu. Ist er ein Schultag oder gehört er zum Wochenende?"
                bins:
                  - { id: schule, show: { text: "Schultag" }, say: "Schultag" }
                  - { id: wochenende, show: { text: "Wochenende" }, say: "Wochenende" }
                options:
                  - { text: "Dienstag", bin: schule }
                  - { text: "Donnerstag", bin: schule }
                  - { text: "Sonntag", bin: wochenende }
                  - { text: "Freitag", bin: schule }
                hints: ["Nur Samstag und Sonntag sind Wochenende."]
              - id: l2-s2
                type: true_false
                text: "Am Montag fängt die Schulwoche an."
                say: "Am Montag fängt die Schulwoche an. Stimmt das?"
                answer: true
                hints: ["Was kommt nach dem Wochenende?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wann geht Mats in den Park?"
                say: "Schau in Mats' Plan. Wann geht er in den Park?"
                show: { drawn: table, rows: [["Tag", "Was macht Mats?"], ["Freitag", "Bücherei"], ["Samstag", "Park"], ["Sonntag", "ausschlafen"]] }
                options: ["am Samstag", "am Freitag", "am Sonntag"]
                answer: "am Samstag"
                hints: ["Such im Plan das Wort Park."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Nach dem Wochenende kommt der _."
                options: ["Montag", "Freitag", "Samstag"]
                answer: ["Montag"]
                hints: ["Nach Sonntag fängt eine neue Woche an."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Tag gehört zum Wochenende?"
                say: "Welcher Tag gehört zum Wochenende?"
                options: ["Sonntag", "Mittwoch", "Dienstag"]
                answer: "Sonntag"
                hints: ["Das Wochenende ist am Ende der Woche."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Tage hat das Wochenende?"
                say: "Wie viele Tage hat das Wochenende?"
                options: ["2", "5", "7"]
                answer: "2"
              - id: l2-n2
                type: true_false
                text: "Freitag ist ein Schultag."
                say: "Freitag ist ein Schultag. Stimmt das?"
                answer: true
              - id: l2-n3
                type: sorting
                text: "Schultag oder Wochenende?"
                say: "Tippe auf einen Tag und hör zu. Ist er ein Schultag oder gehört er zum Wochenende?"
                bins:
                  - { id: schule, show: { text: "Schultag" }, say: "Schultag" }
                  - { id: wochenende, show: { text: "Wochenende" }, say: "Wochenende" }
                options:
                  - { text: "Samstag", bin: wochenende }
                  - { text: "Dienstag", bin: schule }
                  - { text: "Sonntag", bin: wochenende }
                  - { text: "Donnerstag", bin: schule }
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Am Wochenende hat Mats keine _."
                options: ["Schule", "Füße", "Ohren"]
                answer: ["Schule"]
              - id: l2-n5
                type: ordering
                text: "Ordne Mats' Samstag."
                say: "Bring Mats' Samstag in die richtige Reihenfolge: Abendessen, Frühstück, Ausflug in den Park."
                options: ["Abendessen", "Frühstück", "Ausflug in den Park"]
                slot_count: 3
                answer: ["Frühstück", "Ausflug in den Park", "Abendessen"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: day
            type: ordering
            text: "Ordne den Tag."
            say: "Bring den Tag in die richtige Reihenfolge: Mittagessen, aufstehen, ins Bett gehen."
            options: ["Mittagessen", "aufstehen", "ins Bett gehen"]
            slot_count: 3
            answer: ["aufstehen", "Mittagessen", "ins Bett gehen"]
          - id: l2-c2
            part: day
