# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.senses
skill: world.body.senses
curriculum: de-DE
language: de
title:
  de: Meine fünf Sinne
  en: My five senses
summary: >
  Mia has her birthday party and plays a Sinnes-Spiel with her friends:
  eyes closed, what is it? Lesson 1 names the five senses and their
  organs: sehen with the eyes, hören with the ears, riechen with the nose,
  schmecken with the tongue in the mouth and fühlen with the skin, best
  with the fingers. Lesson 2 asks which sense helps in a situation, shows
  that senses work together (an apple tastes weaker with the nose held
  shut), that senses warn us (smoke, a horn, hot water) and how to look
  after eyes and ears. It ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Mein Körper, en: My body }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.body.body-parts]
  also_practises: []
  vocabulary: { de: [Sinn, sehen, hören, riechen, schmecken, fühlen, Auge, Ohr, Nase, Zunge, Haut, warnen] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: organs, what: { de: "die fünf Sinne nennen und sagen, mit welchem Körperteil ich sie nutze", en: naming the five senses and the body part for each } }
    - { id: which-sense, what: { de: "sagen, welcher Sinn mir in einer Situation hilft", en: saying which sense helps in a situation } }
    - { id: care, what: { de: "wissen, dass die Sinne warnen, und Augen und Ohren schützen", en: "knowing that the senses warn us, and looking after eyes and ears" } }
  misconceptions:
    - id: taste-with-mouth-only
      what: Thinks taste comes from the mouth alone and the nose plays no part
      addressed: "lesson 2 Learn opens with the guess about the apple and the nose held shut; l2-s2 and l2-c13"
    - id: touch-only-hands
      what: Thinks only the hands can feel, not the skin all over the body
      addressed: "lesson 1 Learn says the skin is everywhere on the body and the fingers feel best; l1-c4, l2-f3 (cold snow) and l2-c20 (hot bath water)"
    - id: senses-swapped
      what: Mixes up which organ does what (hearing with the eyes, smelling with the ears)
      addressed: "lesson 1 Learn names one organ per screen; l1-f2 (feedback), l1-f3, l1-n2, l2-c7"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Fünf Sinne", en: "Five senses" }
    goal:
      de: "Lerne deine fünf Sinne kennen. Mit den Ohren hörst du, mit der Nase riechst du."
      en: "Get to know your five senses. You hear with your ears and smell with your nose."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wo ist das Auge?"
            say: "Welches Bild zeigt das Auge?"
            options: [{ object: foot }, { object: eye }, { object: arm }]
            answer: eye
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Wo ist die Nase?"
            say: "Welches Bild zeigt die Nase?"
            options: [{ object: nose }, { object: hand }, { object: leg }]
            answer: nose
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie viele Sinne hast du?"
            say: "Mia hat Geburtstag. Ihre Freunde spielen ein Spiel: Augen zu, und dann raten, was das ist! Dafür brauchen sie ihre Sinne. Was glaubst du: Wie viele Sinne hast du?"
            show: { objects: [eye, ear] }
          - text: "Du hast fünf Sinne."
            say: "Du hast fünf Sinne. Du kannst sehen, hören, riechen, schmecken und fühlen. Für jeden Sinn hast du einen Körperteil."
            show: { objects: [eye, ear, nose, mouth, hand] }
          - text: "Mit den Augen siehst du."
            say: "Mit den Augen siehst du. Mia macht die Augen auf und sieht ihren bunten Kuchen."
            show: { object: eye }
          - text: "Mit den Ohren hörst du."
            say: "Mit den Ohren hörst du. Mias Augen sind zu. Aber sie hört die Glocke klingeln."
            show: { objects: [ear, bell] }
          - text: "Mit der Nase riechst du."
            say: "Mit der Nase riechst du. Mia riecht an der Rose. Sie duftet!"
            show: { objects: [nose, rose] }
          - text: "Mit der Zunge schmeckst du."
            say: "Mit der Zunge schmeckst du. Die Zunge ist in deinem Mund. Mia probiert ein Stück Kuchen. Süß!"
            show: { objects: [tongue, cake] }
          - text: "Mit der Haut fühlst du."
            say: "Mit der Haut fühlst du. Die Haut ist überall an deinem Körper. Mit den Fingern fühlst du besonders gut. Mia fühlt mit geschlossenen Augen: Das ist weich, das ist der Teddy!"
            show: { objects: [hand, teddy] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Welcher Körperteil gehört zu welchem Sinn?"
                say: "Tippe auf einen Sinn und dann auf den Körperteil, mit dem du das machst."
                pairs:
                  - left: { text: "sehen" }
                    right: { object: eye }
                  - left: { text: "hören" }
                    right: { object: ear }
                  - left: { text: "riechen" }
                    right: { object: nose }
                hints:
                  - "Frag dich: Was mache ich mit dem Auge, mit dem Ohr, mit der Nase?"
                  - "Wenn du die Augen zumachst, siehst du nichts mehr. Also gehört das Auge zu sehen."
                  - "Sehen zum Auge, hören zum Ohr, riechen zur Nase."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Womit hörst du?"
                say: "Mias Freund Ben ruft: Hallo Mia! Womit hört Mia das?"
                options: [{ object: foot }, { object: ear }, { object: eye }]
                answer: ear
                feedback:
                  foot: "Mit dem Fuß hörst du nichts. Aber du kannst damit zur Tür laufen!"
                  eye: "Mit dem Auge siehst du. Hören geht mit etwas anderem."
                hints:
                  - "Halt dir mal die Ohren zu. Was passiert?"
                  - "Mit zugehaltenen Ohren hörst du fast nichts mehr."
                  - "Mit dem Ohr."
              - id: l1-f3
                type: true_false
                text: "Mit den Augen hörst du.\n\nStimmt das?"
                say: "Mit den Augen hörst du. Stimmt das?"
                show: { object: eye }
                answer: false
                hints:
                  - "Was machst du mit den Augen?"
                  - "Mach die Augen zu. Du hörst trotzdem noch alles."
                  - "Nein. Mit den Augen siehst du."
              - id: l1-f4
                type: multiple_choice
                text: "Mia beißt mit geschlossenen Augen in etwas Süßes. Welcher Sinn hilft ihr?"
                show: { object: cake }
                options: ["schmecken", "hören", "sehen"]
                answer: "schmecken"
                feedback:
                  sehen: "Mias Augen sind zu. Sehen geht gerade nicht."
                hints:
                  - "Süß oder sauer merkst du im Mund."
                  - "Im Mund ist die Zunge. Was macht die Zunge?"
                  - "Schmecken."
              - id: l1-f5
                type: sorting
                text: "Sehen oder hören?"
                say: "Tippe auf eine Karte und hör sie an. Brauchst du dafür die Augen oder die Ohren?"
                bins:
                  - { id: sehen, show: { text: "sehen" }, say: "sehen" }
                  - { id: hoeren, show: { text: "hören" }, say: "hören" }
                options:
                  - { text: "Der Ball ist rot.", bin: sehen }
                  - { text: "Das Telefon klingelt.", bin: hoeren }
                  - { text: "Die Sterne leuchten.", bin: sehen }
                  - { text: "Der Hund bellt.", bin: hoeren }
                hints:
                  - "Frag bei jeder Karte: Merke ich das mit geschlossenen Augen?"
                  - "Klingeln und Bellen hörst du auch mit geschlossenen Augen. Rot und leuchten nicht."
                  - "Ball und Sterne zu sehen, Telefon und Hund zu hören."
              - id: l1-f6
                type: image_multiple_choice
                text: "Womit fühlst du, ob das Wasser warm ist?"
                say: "Womit fühlst du, ob das Wasser warm ist?"
                options: [{ object: ear }, { object: hand }, { object: nose }]
                answer: hand
                hints:
                  - "Fühlen geht mit der Haut."
                  - "Mit den Fingern fühlst du besonders gut. Wo sind die Finger?"
                  - "Mit der Hand."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Womit riechst du die Rose?"
                say: "Womit riechst du die Rose?"
                show: { object: rose }
                options: [{ object: eye }, { object: mouth }, { object: nose }]
                answer: nose
                hints: ["Welcher Körperteil schnuppert?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Mit der Zunge _ ich."
                options: ["schmecke", "höre", "sehe"]
                answer: ["schmecke"]
                hints: ["Die Zunge ist im Mund. Was merkst du da, wenn du Eis isst?"]
              - id: l1-s3
                type: true_false
                text: "Du hast fünf Sinne.\n\nStimmt das?"
                say: "Du hast fünf Sinne. Stimmt das?"
                answer: true
                hints: ["Zähl: sehen, hören, riechen, schmecken, fühlen."]
              - id: l1-s4
                type: matching
                text: "Welcher Körperteil gehört zu welchem Sinn?"
                say: "Tippe auf einen Sinn und dann auf den Körperteil, mit dem du das machst."
                pairs:
                  - left: { text: "schmecken" }
                    right: { object: mouth }
                  - left: { text: "fühlen" }
                    right: { object: hand }
                  - left: { text: "hören" }
                    right: { object: ear }
                hints: ["Die Zunge ist im Mund. Mit den Fingern fühlst du gut."]
              - id: l1-s5
                type: multiple_choice
                text: "Es ist dunkel. Mia sucht ihren Teddy mit den Händen. Welcher Sinn hilft ihr?"
                show: { object: teddy }
                options: ["fühlen", "sehen", "riechen"]
                answer: "fühlen"
                hints: ["Im Dunkeln siehst du nichts. Was machen die Hände?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Womit siehst du?"
                say: "Womit siehst du?"
                options: [{ object: nose }, { object: hand }, { object: eye }]
                answer: eye
              - id: l1-n2
                type: true_false
                text: "Mit den Ohren riechst du.\n\nStimmt das?"
                say: "Mit den Ohren riechst du. Stimmt das?"
                show: { object: ear }
                answer: false
              - id: l1-n3
                type: sorting
                text: "Hören oder riechen?"
                say: "Tippe auf eine Karte und hör sie an. Brauchst du dafür die Ohren oder die Nase?"
                bins:
                  - { id: hoeren, show: { text: "hören" }, say: "hören" }
                  - { id: riechen, show: { text: "riechen" }, say: "riechen" }
                options:
                  - { text: "Die Musik spielt.", bin: hoeren }
                  - { text: "Der Kuchen duftet.", bin: riechen }
                  - { text: "Die Glocke läutet.", bin: hoeren }
                  - { text: "Die Blume duftet.", bin: riechen }
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Mit den Augen _ ich."
                options: ["sehe", "rieche", "höre"]
                answer: ["sehe"]
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Sinne hast du?"
                options: ["3", "5", "10"]
                answer: "5"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Womit hörst du die Musik?"
            say: "Womit hörst du die Musik?"
            options: [{ object: mouth }, { object: eye }, { object: ear }]
            answer: ear
          - id: l1-c2
            type: true_false
            text: "Mit den Augen siehst du.\n\nStimmt das?"
            say: "Mit den Augen siehst du. Stimmt das?"
            show: { object: eye }
            answer: true
          - id: l1-c3
            type: matching
            text: "Welcher Körperteil gehört zu welchem Sinn?"
            say: "Tippe auf einen Sinn und dann auf den Körperteil."
            pairs:
              - left: { text: "riechen" }
                right: { object: nose }
              - left: { text: "sehen" }
                right: { object: eye }
          - id: l1-c4
            type: multiple_choice
            text: "Womit fühlst du?"
            options: ["mit der Haut", "mit den Ohren", "mit der Nase"]
            answer: "mit der Haut"
          - id: l1-c5
            type: image_multiple_choice
            text: "Womit schmeckst du das Eis?"
            say: "Womit schmeckst du das Eis?"
            show: { object: ice-cream }
            options: [{ object: hand }, { object: mouth }, { object: ear }]
            answer: mouth
          - id: l1-c6
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Mit der Nase _ ich."
            options: ["rieche", "höre", "sehe"]
            answer: ["rieche"]

  - n: 2
    title: { de: "Welcher Sinn hilft?", en: "Which sense helps?" }
    goal:
      de: "Finde heraus, welcher Sinn dir hilft und wie deine Sinne dich warnen. Rauch riechst du mit der Nase."
      en: "Find out which sense helps you and how your senses warn you. You smell smoke with your nose."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Womit riechst du?"
            say: "Womit riechst du?"
            options: [{ object: nose }, { object: foot }]
            answer: nose
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was machst du mit den Ohren?"
            options: ["hören", "schmecken"]
            answer: "hören"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Schmeckt der Apfel noch?"
            say: "Nach der Party isst Mia einen Apfel. Dabei hält sie sich die Nase zu. Was glaubst du: Schmeckt der Apfel dann noch genauso gut?"
            show: { objects: [apple, nose] }
          - text: "Nase und Zunge helfen zusammen."
            say: "Nein! Mit zugehaltener Nase schmeckt der Apfel viel schwächer. Beim Essen helfen Nase und Zunge zusammen. Probier es mal aus!"
            show: { objects: [nose, mouth] }
          - text: "Deine Sinne warnen dich."
            say: "Deine Sinne passen auf dich auf. Du riechst Rauch. Du hörst die Feuerwehr kommen. Du fühlst, dass das Wasser viel zu heiß ist. Dann weißt du: Achtung!"
            show: { objects: [nose, fire-engine] }
          - text: "Riechst du Rauch? Sag es sofort einem Erwachsenen."
            say: "Riechst du Rauch? Dann sag es sofort einem Erwachsenen."
            show: { object: smoke }
          - text: "Schau nie direkt in die Sonne."
            say: "Pass gut auf deine Augen auf. Schau nie direkt in die Sonne. Das helle Licht schadet deinen Augen."
            show: { object: sun }
          - text: "Sehr laute Musik schadet den Ohren."
            say: "Pass auch auf deine Ohren auf. Sehr laute Musik schadet ihnen. Mach lieber leiser."
            show: { object: ear }
          - text: "Wusstest du? Ein Hund riecht viel besser als du."
            say: "Wusstest du? Ein Hund riecht viel besser als ein Mensch. Mit seiner Nase findet er Spuren, die du gar nicht riechen kannst."
            show: { objects: [dog, nose] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Draußen fährt die Feuerwehr: Tatütata! Welcher Sinn hilft Mia?"
                show: { object: fire-engine }
                options: ["hören", "riechen", "schmecken"]
                answer: "hören"
                hints:
                  - "Tatütata ist ein Geräusch."
                  - "Geräusche merkst du auch mit geschlossenen Augen. Mit den Ohren."
                  - "Hören."
              - id: l2-f2
                type: image_multiple_choice
                text: "Womit riecht Mia, dass etwas anbrennt?"
                say: "In der Küche riecht es komisch. Etwas brennt an! Womit merkt Mia das?"
                options: [{ object: ear }, { object: nose }, { object: eye }]
                answer: nose
                hints:
                  - "Es riecht komisch."
                  - "Riechen geht mit dem Körperteil in der Mitte deines Gesichts."
                  - "Mit der Nase."
              - id: l2-f3
                type: sorting
                text: "Hören, riechen oder fühlen?"
                say: "Tippe auf eine Karte und hör sie an. Welcher Sinn hilft dir da?"
                bins:
                  - { id: hoeren, show: { text: "hören" }, say: "hören" }
                  - { id: riechen, show: { text: "riechen" }, say: "riechen" }
                  - { id: fuehlen, show: { text: "fühlen" }, say: "fühlen" }
                options:
                  - { text: "Der Wecker klingelt.", bin: hoeren }
                  - { text: "Die Suppe duftet.", bin: riechen }
                  - { text: "Der Schnee ist kalt.", bin: fuehlen }
                hints:
                  - "Frag bei jeder Karte: Merke ich das mit den Ohren, mit der Nase oder mit der Haut?"
                  - "Klingeln hörst du. Duft riechst du. Kälte spürst du auf der Haut."
                  - "Wecker zu hören, Suppe zu riechen, Schnee zu fühlen."
              - id: l2-f4
                type: true_false
                text: "Man darf lange direkt in die Sonne schauen.\n\nStimmt das?"
                say: "Man darf lange direkt in die Sonne schauen. Stimmt das?"
                show: { object: sun }
                answer: false
                hints:
                  - "Die Sonne ist sehr, sehr hell."
                  - "Das helle Licht schadet den Augen."
                  - "Nein. Schau nie direkt in die Sonne."
              - id: l2-f5
                type: multiple_choice
                text: "Bens Musik ist sehr laut. Was ist gut für seine Ohren?"
                show: { object: ear }
                options: ["leiser machen", "noch lauter machen", "die Augen zumachen"]
                answer: "leiser machen"
                feedback:
                  noch lauter machen: "Autsch! Noch lauter tut den Ohren erst recht weh."
                  die Augen zumachen: "Mit geschlossenen Augen hört Ben die Musik genauso laut."
                hints:
                  - "Sehr laute Musik schadet den Ohren."
                  - "Was hilft: lauter oder leiser?"
                  - "Leiser machen."
              - id: l2-f6
                type: image_multiple_choice
                text: "Womit fühlt Mia, dass der Topf heiß ist?"
                say: "Mia hält die Hand nah an den Topf. Huch, heiß! Womit fühlt sie das?"
                options: [{ object: hand }, { object: ear }, { object: mouth }]
                answer: hand
                hints:
                  - "Wärme und Hitze fühlst du."
                  - "Fühlen geht mit der Haut, die Finger fühlen besonders gut."
                  - "Mit der Hand."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Papa ruft Mia aus dem Garten. Welcher Sinn hilft ihr?"
                show: { object: dad }
                options: ["hören", "riechen", "schmecken"]
                answer: "hören"
                hints: ["Rufen ist etwas, das du hörst oder siehst?"]
              - id: l2-s2
                type: true_false
                text: "Mia hält sich die Nase zu. Der Apfel schmeckt jetzt schwächer.\n\nStimmt das?"
                say: "Mia hält sich die Nase zu. Der Apfel schmeckt jetzt schwächer. Stimmt das?"
                show: { object: apple }
                answer: true
                hints: ["Beim Essen helfen Nase und Zunge zusammen."]
              - id: l2-s3
                type: matching
                text: "Welcher Körperteil hilft?"
                say: "Tippe auf eine Karte und dann auf den Körperteil, der dir hilft."
                pairs:
                  - left: { text: "Das Telefon klingelt." }
                    right: { object: ear }
                  - left: { text: "Die Rose duftet." }
                    right: { object: nose }
                  - left: { text: "Der Regenbogen ist bunt." }
                    right: { object: eye }
                hints: ["Klingeln hörst du, Duft riechst du, Farben siehst du."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Ich rieche Rauch. Meine _ warnt mich."
                options: ["Nase", "Zunge", "Haut"]
                answer: ["Nase"]
                hints: ["Womit riechst du?"]
              - id: l2-s5
                type: true_false
                text: "Sehr laute Musik kann deinen Ohren schaden.\n\nStimmt das?"
                say: "Sehr laute Musik kann deinen Ohren schaden. Stimmt das?"
                show: { object: ear }
                answer: true
                hints: ["Was ist besser für die Ohren: laut oder leise?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Lina streichelt die Katze. Das Fell ist weich. Welcher Sinn hilft ihr?"
                show: { object: cat }
                options: ["fühlen", "hören", "riechen"]
                answer: "fühlen"
              - id: l2-n2
                type: image_multiple_choice
                text: "Womit hört Opa die Vögel singen?"
                say: "Opa sitzt im Park. Die Vögel singen. Womit hört er das?"
                options: [{ object: nose }, { object: ear }, { object: hand }]
                answer: ear
              - id: l2-n3
                type: sorting
                text: "Sehen oder schmecken?"
                say: "Tippe auf eine Karte und hör sie an. Brauchst du dafür die Augen oder die Zunge?"
                bins:
                  - { id: sehen, show: { text: "sehen" }, say: "sehen" }
                  - { id: schmecken, show: { text: "schmecken" }, say: "schmecken" }
                options:
                  - { text: "Die Zitrone ist sauer.", bin: schmecken }
                  - { text: "Das Auto ist blau.", bin: sehen }
                  - { text: "Das Eis ist süß.", bin: schmecken }
                  - { text: "Der Mond ist rund.", bin: sehen }
              - id: l2-n4
                type: true_false
                text: "Du riechst Rauch. Das ist egal, du spielst einfach weiter.\n\nStimmt das?"
                say: "Du riechst Rauch. Das ist egal, du spielst einfach weiter. Stimmt das?"
                show: { object: smoke }
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Den Blitz am Himmel sehe ich mit den _."
                options: ["Augen", "Ohren", "Füßen"]
                answer: ["Augen"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: organs
            type: image_multiple_choice
            text: "Womit riechst du?"
            say: "Welches Bild zeigt, womit du riechst?"
            options: [{ object: foot }, { object: eye }, { object: nose }]
            answer: nose
          - id: l2-c2
            part: organs
            type: matching
            text: "Welcher Körperteil gehört zu welchem Sinn?"
            say: "Tippe auf einen Sinn und dann auf den Körperteil."
