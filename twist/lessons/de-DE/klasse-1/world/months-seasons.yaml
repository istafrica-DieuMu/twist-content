# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.months-seasons
skill: world.time.months-seasons
curriculum: de-DE
language: de
title:
  de: Der Jahreskreis
  en: The year wheel
summary: >
  Builds on Mathe (math.time.sequence-of-day), where the child learnt the
  twelve months in order. Emil and his Oma make a Jahreskreis for Emil's
  room, round like a cake. Lesson 1 shows the year as a circle that never
  ends (after Dezember comes Januar again), cut into four seasons of three
  months each, and which months belong to which season. Lesson 2 fills the
  wheel with what happens when (strawberries in June, apples and falling
  leaves in autumn, snow in winter, birthdays), shows that a cold day in
  April is still spring, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Mein Jahr, en: My year }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.time.sequence-of-day]
  also_practises: []
  vocabulary: { de: [Jahr, Monat, Jahreszeit, Jahreskreis, Frühling, Sommer, Herbst, Winter, Frühlingsmonat, Wintermonat] }
  forms: [picture, text, audio, drawn]
  drawn: [pie-chart]
  sounds: []
  facets: []
  parts:
    - { id: circle, what: { de: "die Monate im Jahreskreis: davor, danach, nach Dezember kommt Januar", en: "the months on the year wheel: before, after, January follows December" } }
    - { id: seasons, what: { de: "jeder Jahreszeit ihre drei Monate zuordnen", en: "matching each season with its three months" } }
    - { id: signs, what: { de: "sagen, was in welcher Jahreszeit passiert (Natur, Wetter, Geburtstag)", en: "saying what happens in which season (nature, weather, birthdays)" } }
  misconceptions:
    - id: year-ends
      what: Sees the year as a line that stops in Dezember, not as a circle that starts again with Januar
      addressed: "lesson 1 Learn says the Jahreskreis has no end and the winter runs from Dezember into Januar; l1-f4, l1-f5, l1-n4, l1-c6, l2-s5, l2-n4, l2-c2, l2-c3 and l2-c4"
    - id: season-by-weather
      what: Decides the season from one day's weather (a cold day in April must be winter)
      addressed: "lesson 2 Learn says a cold day in April is still spring; l1-s2, l2-f3 and l2-c17"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: Rund wie ein Kuchen, en: Round like a cake }
    goal:
      de: "Zeig die Monate im Jahreskreis. Jede Jahreszeit hat drei Monate, der Sommer hat Juni, Juli und August."
      en: "Show the months on the year wheel. Each season has three months, summer has June, July and August."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Monat kommt nach Juli?"
            options: ["August", "Juni"]
            answer: "August"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Der Januar ist der erste Monat im Jahr.\n\nStimmt das?"
            say: "Der Januar ist der erste Monat im Jahr. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie viele Monate hat eine Jahreszeit?"
            say: "Emil und seine Oma basteln einen Jahreskreis für Emils Zimmer. Er ist rund wie ein Kuchen. Ein Jahr hat zwölf Monate und vier Jahreszeiten. Was glaubst du: Wie viele Monate gehören zu einer Jahreszeit?"
            show: { object: cake }
          - text: "Drei Monate!"
            say: "Drei! Oma teilt den Kreis in vier gleich große Stücke: Frühling, Sommer, Herbst und Winter. In jedes Stück kommen drei Monate. Drei und drei und drei und drei sind zwölf."
            show: { drawn: pie-chart, parts: [[Frühling, 3], [Sommer, 3], [Herbst, 3], [Winter, 3]] }
          - text: "Frühling: März, April, Mai"
            say: "Der Frühling fängt im März an. März, April und Mai sind die Frühlingsmonate. Jetzt blühen die Blumen."
            show: { object: flower }
          - text: "Sommer: Juni, Juli, August"
            say: "Der Sommer fängt im Juni an. Juni, Juli und August sind die Sommermonate. Es ist warm, und im Sommer sind die großen Ferien."
            show: { object: sun }
          - text: "Herbst: September, Oktober, November"
            say: "Der Herbst fängt im September an. September, Oktober und November sind die Herbstmonate. Die Blätter werden bunt und fallen von den Bäumen."
            show: { object: leaf }
          - text: "Winter: Dezember, Januar, Februar"
            say: "Der Winter fängt im Dezember an. Dezember, Januar und Februar sind die Wintermonate. Der Winter geht über Silvester hinweg bis ins neue Jahr."
            show: { object: snowman }
          - text: "Nach Dezember kommt wieder Januar."
            say: "Emil dreht den Jahreskreis. Er hat kein Ende! Nach Dezember kommt wieder Januar, und alles fängt von vorn an. Darum ist der Jahreskreis rund."
            show: { drawn: pie-chart, parts: [[Frühling, 3], [Sommer, 3], [Herbst, 3], [Winter, 3]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Sommer oder Winter?"
                say: "Hilf Emil. Tippe auf einen Monat und hör ihn. Leg ihn zum Sommer oder zum Winter."
                bins:
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { text: "Juli", bin: sommer }
                  - { text: "Januar", bin: winter }
                  - { text: "August", bin: sommer }
                  - { text: "Februar", bin: winter }
                hints:
                  - "Wann ist es warm, wann ist es kalt?"
                  - "Die Sommermonate sind Juni, Juli und August. Die Wintermonate sind Dezember, Januar und Februar."
                  - "Juli und August zum Sommer, Januar und Februar zum Winter."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Monate hat eine Jahreszeit?"
                show: { drawn: pie-chart, parts: [[Frühling, 3], [Sommer, 3], [Herbst, 3], [Winter, 3]] }
                options: ["3", "12", "4"]
                answer: "3"
                feedback:
                  "12": "Zwölf Monate hat das ganze Jahr. Eine Jahreszeit ist nur ein Stück davon."
                  "4": "Vier Jahreszeiten hat das Jahr. Aber wie viele Monate sind in einem Stück?"
                hints:
                  - "Denk an den Sommer: Juni, Juli, August. Zähl die Monate."
                  - "Juni ist eins, Juli ist zwei, August ist drei."
                  - "Drei Monate."
              - id: l1-f3
                type: image_multiple_choice
                text: "Was passt zum Herbst?"
                say: "Emil malt ein Bild in das Herbststück. Welches Bild passt zum Herbst?"
                options: [{ object: leaf }, { object: snowman }, { object: sandcastle }]
                answer: leaf
                feedback:
                  snowman: "Brrr! Ein Schneemann passt eher in den Winter."
                  sandcastle: "Eine Sandburg baut Emil im Sommer am Strand."
                hints:
                  - "Was passiert im Herbst mit den Bäumen?"
                  - "Im Herbst werden die Blätter bunt und fallen herunter."
                  - "Das Blatt."
              - id: l1-f4
                type: ordering
                text: "Ordne die Wintermonate."
                say: "Ordne die Wintermonate: Januar, Dezember, Februar."
                options: ["Januar", "Dezember", "Februar"]
                slot_count: 3
                answer: ["Dezember", "Januar", "Februar"]
                hints:
                  - "Mit welchem Monat fängt der Winter an?"
                  - "Der Winter fängt im Dezember an. Dann kommt das neue Jahr."
                  - "Dezember, Januar, Februar."
              - id: l1-f5
                type: true_false
                text: "Nach Dezember kommt wieder Januar.\n\nStimmt das?"
                say: "Nach Dezember kommt wieder Januar. Stimmt das?"
                answer: true
                hints:
                  - "Hat der Jahreskreis ein Ende?"
                  - "Dezember ist der letzte Monat. Dann fängt ein neues Jahr an."
                  - "Ja. Nach Dezember kommt wieder Januar."
              - id: l1-f6
                type: multiple_choice
                text: "Mit welchem Monat fängt der Sommer an?"
                options: ["Juni", "Juli", "Mai"]
                answer: "Juni"
                hints:
                  - "Die Sommermonate sind Juni, Juli und August."
                  - "Welcher davon kommt zuerst?"
                  - "Juni."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welcher Monat passt in die Lücke?"
                frame: "Der Herbst fängt im _ an."
                options: ["September", "März", "Juni"]
                answer: ["September"]
                hints: ["Die Herbstmonate sind September, Oktober und November."]
              - id: l1-s2
                type: true_false
                text: "Der März gehört zum Winter.\n\nStimmt das?"
                say: "Der März gehört zum Winter. Stimmt das?"
                answer: false
                feedback:
                  true: "Im März kann es noch kalt sein. Aber der Frühling fängt im März an."
                hints: ["Mit welchem Monat fängt der Frühling an?"]
              - id: l1-s3
                type: sorting
                text: "Frühling oder Herbst?"
                say: "Tippe auf einen Monat und hör ihn. Leg ihn zum Frühling oder zum Herbst."
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                options:
                  - { text: "April", bin: fruehling }
                  - { text: "Oktober", bin: herbst }
                  - { text: "Mai", bin: fruehling }
                  - { text: "November", bin: herbst }
                hints: ["Frühling: März, April, Mai. Herbst: September, Oktober, November."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Monat gehört zum Sommer?"
                options: ["August", "Dezember", "März"]
                answer: "August"
                hints: ["In welchem Monat ist es warm und du hast vielleicht Ferien?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was passt zum Winter?"
                say: "Emil malt ein Bild in das Winterstück. Welches Bild passt zum Winter?"
                options: [{ object: snowman }, { object: flower }, { object: sandcastle }]
                answer: snowman
                hints: ["Im Winter ist es kalt, und manchmal schneit es."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "In welcher Jahreszeit ist der Mai?"
                options: ["im Frühling", "im Sommer", "im Winter"]
                answer: "im Frühling"
              - id: l1-n2
                type: ordering
                text: "Ordne die Herbstmonate."
                say: "Ordne die Herbstmonate: November, September, Oktober."
                options: ["November", "September", "Oktober"]
                slot_count: 3
                answer: ["September", "Oktober", "November"]
              - id: l1-n3
                type: true_false
                text: "Der Juni gehört zum Sommer.\n\nStimmt das?"
                say: "Der Juni gehört zum Sommer. Stimmt das?"
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Was passt in die Lücke?"
                frame: "Nach Dezember kommt _."
                options: ["Januar", "November", "nichts mehr"]
                answer: ["Januar"]
              - id: l1-n5
                type: sorting
                text: "Sommer oder Winter?"
                say: "Tippe auf einen Monat und hör ihn. Leg ihn zum Sommer oder zum Winter."
                bins:
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { text: "Dezember", bin: winter }
                  - { text: "Juni", bin: sommer }
                  - { text: "Februar", bin: winter }
                  - { text: "August", bin: sommer }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Jahreszeiten hat ein Jahr?"
            options: ["4", "3", "12"]
            answer: "4"
          - id: l1-c2
            type: true_false
            text: "Der Oktober gehört zum Herbst.\n\nStimmt das?"
            say: "Der Oktober gehört zum Herbst. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Monat gehört zum Winter?"
            options: ["Januar", "Mai", "August"]
            answer: "Januar"
          - id: l1-c4
            type: ordering
            text: "Ordne die Frühlingsmonate."
            say: "Ordne die Frühlingsmonate: Mai, März, April."
            options: ["Mai", "März", "April"]
            slot_count: 3
            answer: ["März", "April", "Mai"]
          - id: l1-c5
            type: image_multiple_choice
            text: "Was passt zum Sommer?"
            say: "Welches Bild passt zum Sommer?"
            options: [{ object: snowflake }, { object: sandcastle }, { object: snowman }]
            answer: sandcastle
          - id: l1-c6
            type: true_false
            text: "Der Jahreskreis hört im Dezember auf.\n\nStimmt das?"
            say: "Der Jahreskreis hört im Dezember auf. Stimmt das?"
            answer: false

  - n: 2
    title: { de: Was passiert wann, en: What happens when }
    goal:
      de: "Find heraus, was in jeder Jahreszeit passiert. Im Sommer werden die Erdbeeren reif, im Herbst fallen die Blätter."
      en: "Find out what happens in each season. In summer the strawberries ripen, in autumn the leaves fall."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Mit welchem Monat fängt der Winter an?"
            options: ["Dezember", "Januar"]
            answer: "Dezember"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Der August gehört zum Sommer.\n\nStimmt das?"
            say: "Der August gehört zum Sommer. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wann sind die Erdbeeren reif?"
            say: "Emil und Oma kleben Bilder in den Jahreskreis. Oma hat Erdbeeren aus ihrem Garten. Was glaubst du: Wann werden die Erdbeeren im Garten reif, im Januar oder im Juni?"
            show: { object: strawberry }
          - text: "Im Juni, im Sommer."
            say: "Im Juni! Draußen im Garten werden die Erdbeeren im Sommer reif. Im Januar ist es dafür viel zu kalt."
            show: { objects: [strawberry, sun] }
          - text: "Im Herbst gibt es Äpfel."
            say: "Im September und Oktober pflücken die Leute Äpfel. Und die bunten Blätter fallen im Herbst von den Bäumen."
            show: { objects: [apple, leaf] }
          - text: "Im Winter kann es schneien."
            say: "Im Dezember, Januar und Februar ist es oft kalt. Dann kann es schneien, und Emil baut einen Schneemann. Im Frühling wird es wärmer, und die Blumen blühen."
            show: { objects: [snowflake, flower] }
          - text: "Ein kalter Tag im April ist trotzdem Frühling."
            say: "Manchmal ist es im April noch kalt und regnet. Trotzdem ist der April ein Frühlingsmonat. Die Jahreszeit kommt vom Monat, nicht vom Wetter an einem Tag."
            show: { object: umbrella }
          - text: "Jeder Geburtstag hat seinen Platz im Jahreskreis."
            say: "Emil hat im Juli Geburtstag. Das ist im Sommer. Oma hat im Februar Geburtstag. Das ist im Winter. Und du? In welchem Monat hast du Geburtstag?"
            show: { object: cake }
          - text: "Wusstest du? In Australien ist im Dezember Sommer."
            say: "Wusstest du? Auf der anderen Seite der Erde, in Australien, sind die Jahreszeiten umgekehrt. Wenn bei uns Winter ist, ist dort Sommer. Manche Familien feiern Weihnachten dort am Strand!"
            show: { object: sandcastle }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Welches Bild passt in welche Jahreszeit?"
                say: "Emil hat vier Bilder. Tippe auf ein Bild und hör das Wort. Leg es in die richtige Jahreszeit."
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { object: flower, bin: fruehling }
                  - { object: sandcastle, bin: sommer }
                  - { object: leaf, bin: herbst }
                  - { object: snowman, bin: winter }
                hints:
                  - "Frag bei jedem Bild: Ist es da warm oder kalt? Was machen die Pflanzen?"
                  - "Blumen blühen im Frühling. Blätter fallen im Herbst."
                  - "Blume zum Frühling, Sandburg zum Sommer, Blatt zum Herbst, Schneemann zum Winter."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mia hat im Juli Geburtstag. In welcher Jahreszeit feiert sie?"
                show: { object: cake }
                options: ["im Sommer", "im Winter", "im Herbst"]
                answer: "im Sommer"
                hints:
                  - "Welche drei Monate gehören zum Sommer?"
                  - "Juni, Juli und August sind die Sommermonate."
                  - "Im Sommer."
              - id: l2-f3
                type: true_false
                text: "Heute ist ein kalter Tag im April. Ist jetzt Winter?"
                show: { object: umbrella }
                answer: false
                feedback:
                  true: "Auch an einem kalten Tag bleibt der April ein Frühlingsmonat."
                hints:
                  - "Kommt die Jahreszeit vom Wetter oder vom Monat?"
                  - "Zu welcher Jahreszeit gehört der April?"
                  - "Nein. Der April ist im Frühling, auch wenn es kalt ist."
              - id: l2-f4
                type: image_multiple_choice
                text: "Was passt am besten zum Herbst?"
                say: "Emil sucht ein Bild für den Oktober. Welches passt am besten zum Herbst?"
                options: [{ object: snowflake }, { object: apple }, { object: sandcastle }]
                answer: apple
                hints:
                  - "Was pflücken die Leute im September und Oktober?"
                  - "Im Herbst werden die Äpfel reif."
                  - "Der Apfel."
              - id: l2-f5
                type: ordering
                text: "Ordne die Jahreszeiten. Fang mit dem Frühling an."
                say: "Ordne die Jahreszeiten im Jahreskreis. Fang mit dem Frühling an: Herbst, Frühling, Winter, Sommer."
                options: ["Herbst", "Frühling", "Winter", "Sommer"]
                slot_count: 4
                answer: ["Frühling", "Sommer", "Herbst", "Winter"]
                hints:
                  - "Was kommt nach dem Frühling, wenn es warm wird?"
                  - "Nach dem Frühling kommt der Sommer, dann wird es kühler."
                  - "Frühling, Sommer, Herbst, Winter."
              - id: l2-f6
                type: matching
                text: "Welcher Monat gehört zu welcher Jahreszeit?"
                say: "Tippe auf einen Monat und dann auf seine Jahreszeit."
                pairs:
                  - left: { text: "April" }
                    right: { text: "Frühling" }
                  - left: { text: "Juni" }
                    right: { text: "Sommer" }
                  - left: { text: "Oktober" }
                    right: { text: "Herbst" }
                  - left: { text: "Januar" }
                    right: { text: "Winter" }
                hints:
                  - "Jede Jahreszeit hat drei Monate. Wo ist der April?"
                  - "Frühling: März, April, Mai. Sommer: Juni, Juli, August."
                  - "April zum Frühling, Juni zum Sommer, Oktober zum Herbst, Januar zum Winter."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welcher Monat passt in die Lücke?"
                frame: "Im Garten werden die Erdbeeren im _ reif."
                options: ["Juni", "Januar", "November"]
                answer: ["Juni"]
                hints: ["Erdbeeren brauchen Wärme. Welcher Monat ist im Sommer?"]
              - id: l2-s2
                type: multiple_choice
                text: "Oma hat im Februar Geburtstag. Welche Jahreszeit ist dann?"
                options: ["Winter", "Sommer", "Frühling"]
                answer: "Winter"
                hints: ["Die Wintermonate sind Dezember, Januar und Februar."]
              - id: l2-s3
                type: true_false
                text: "Nach dem Winter kommt wieder der Frühling.\n\nStimmt das?"
                say: "Nach dem Winter kommt wieder der Frühling. Stimmt das?"
                answer: true
                hints: ["Der Jahreskreis hat kein Ende."]
              - id: l2-s4
                type: sorting
                text: "Welcher Monat gehört in welche Jahreszeit?"
                say: "Tippe auf einen Monat und hör ihn. Leg ihn in die richtige Jahreszeit."
                bins:
                  - { id: fruehling, show: { text: "Frühling" }, say: "Frühling" }
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                  - { id: winter, show: { text: "Winter" }, say: "Winter" }
                options:
                  - { text: "März", bin: fruehling }
                  - { text: "August", bin: sommer }
                  - { text: "November", bin: herbst }
                  - { text: "Januar", bin: winter }
                hints: ["Jede Jahreszeit fängt mit einem Monat an: März, Juni, September, Dezember."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Monat kommt im Jahreskreis vor Januar?"
                options: ["Dezember", "Februar", "November"]
                answer: "Dezember"
                hints: ["Der Jahreskreis ist rund. Welcher Monat ist der letzte im Jahr?"]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was passt zum Frühling?"
                say: "Emil sucht ein Bild für den April. Welches passt zum Frühling?"
                options: [{ object: snowman }, { object: sandcastle }, { object: flower }]
                answer: flower
              - id: l2-n2
                type: multiple_choice
                text: "Oma pflückt Äpfel. Welcher Monat passt?"
                show: { object: apple }
                options: ["September", "Februar", "Mai"]
                answer: "September"
              - id: l2-n3
                type: true_false
                text: "Der Dezember gehört zum Herbst.\n\nStimmt das?"
                say: "Der Dezember gehört zum Herbst. Stimmt das?"
                answer: false
              - id: l2-n4
                type: ordering
                text: "Ordne die Monate. Fang mit November an."
                say: "Ordne die Monate im Jahreskreis. Fang mit November an: Januar, November, Dezember."
                options: ["Januar", "November", "Dezember"]
                slot_count: 3
                answer: ["November", "Dezember", "Januar"]
              - id: l2-n5
                type: matching
                text: "Was passt zu welcher Jahreszeit?"
                say: "Tippe auf eine Jahreszeit und dann auf ihr Bild."
                pairs:
                  - left: { text: "Winter" }
                    right: { object: snowflake }
                  - left: { text: "Sommer" }
                    right: { object: sun }
                  - left: { text: "Herbst" }
                    right: { object: leaf }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: circle
            type: multiple_choice
            text: "Welcher Monat kommt nach Dezember?"
            options: ["Januar", "November", "Juni"]
            answer: "Januar"
          - id: l2-c2
            part: circle
            type: ordering
