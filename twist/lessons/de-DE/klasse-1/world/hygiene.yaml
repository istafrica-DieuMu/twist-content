                say: "Tippe auf eine Karte und hör sie an. Ist das gut, oder lieber nicht?"
                bins:
                  - { id: gut, show: { text: "gut" }, say: "gut" }
                  - { id: nicht, show: { text: "lieber nicht" }, say: "lieber nicht" }
                options:
