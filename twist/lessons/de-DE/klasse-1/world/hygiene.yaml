lessons:
  - n: 1
    title: { de: "Hände waschen", en: "Washing hands" }
    goal:
      de: "Finde heraus, warum und wann du dir die Hände wäschst. Vor dem Essen wäschst du sie mit Seife."
      en: "Find out why and when you wash your hands. Before eating, you wash them with soap."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Muss Paul die Hände waschen?"
            say: "Paul hat im Sandkasten gespielt und mit dem Hund Bello getobt. Jetzt gibt es Kuchen! Pauls Hände sehen fast sauber aus. Was glaubst du: Muss er sie trotzdem waschen?"
            show: { objects: [hand, cake] }
          - text: "Ja! Auf den Händen sind Keime."
            say: "Ja! Auf den Händen sind Keime. Keime sind so winzig, dass du sie nicht sehen kannst. Manche Keime machen krank, zum Beispiel Bauchweh oder Schnupfen."
            show: { object: hand }
          - text: "Wusstest du? Tausende Keime passen auf einen winzigen Punkt."
            say: "Wusstest du? Keime sind so klein, dass tausende auf einen Punkt passen, der kleiner ist als ein Stecknadelkopf. Sehen kann man sie nur mit einem Mikroskop."
          - text: "Nach dem Klo und vor dem Essen."
            say: "Wann wäschst du dir die Hände? Immer nach der Toilette und immer vor dem Essen."
            show: { objects: [sign-toilet, cake] }
          - text: "Nach dem Spielen, Naseputzen und Tiere streicheln."
            say: "Und auch, wenn du draußen gespielt hast, wenn du dir die Nase geputzt hast und wenn du ein Tier gestreichelt hast."
            show: { object: dog }
          - text: "Mit Wasser und Seife."
            say: "Nur Wasser reicht nicht. Seife hilft, die Keime abzuwaschen. Reib die Hände so lange, wie du zweimal „Zum Geburtstag viel Glück“ singst."
            show: { object: water }
          - text: "Nass machen, einseifen, abspülen, abtrocknen."
            say: "So geht es. Mach die Hände nass. Seif sie ein und reib überall, auch zwischen den Fingern und an den Daumen. Spül die Seife ab. Trockne die Hände gut ab."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Hände, die sauber aussehen, können trotzdem Keime haben.\n\nStimmt das?"
                say: "Hände, die sauber aussehen, können trotzdem Keime haben. Stimmt das?"
                show: { object: hand }
                answer: true
                hints:
                  - "Kannst du Keime mit den Augen sehen?"
                  - "Keime sind winzig. Man sieht sie nicht, auch wenn sie da sind."
                  - "Ja, das stimmt."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Jetzt Hände waschen?"
                say: "Tippe auf eine Karte und hör sie an. Musst du dann die Hände waschen?"
                bins:
                  - { id: waschen, show: { text: "Hände waschen!" }, say: "Hände waschen!" }
                  - { id: nicht, show: { text: "nicht nötig" }, say: "nicht nötig" }
                options:
                  - { text: "nach dem Klo", bin: waschen }
                  - { text: "nach einem schönen Lied", bin: nicht }
                  - { text: "vor dem Essen", bin: waschen }
                  - { text: "nach einem schönen Traum", bin: nicht }
                hints:
                  - "Frag bei jeder Karte: Können da Keime an meine Hände kommen?"
                  - "Beim Klo und beim Essen geht es um Keime. Beim Singen und Träumen fasst du nichts an."
                  - "Klo und Essen zu Hände waschen, Lied und Traum zu nicht nötig."
              - id: l1-f3
                type: image_multiple_choice
                text: "Womit wäschst du die Hände?"
                say: "Womit wäschst du dir die Hände, zusammen mit Seife?"
                options: [{ object: juice }, { object: water }, { object: milk }]
                answer: water
                feedback:
                  juice: "Mit Saft? Dann kleben deine Hände!"
                  milk: "Milch ist zum Trinken. Zum Waschen nimmst du etwas anderes."
                hints:
                  - "Was kommt aus dem Wasserhahn?"
                  - "Saft und Milch trinkst du. Hände waschen geht mit Seife und ..."
                  - "Mit Wasser."
              - id: l1-f4
                type: ordering
                text: "Wie wäschst du die Hände?"
                say: "Leg die Karten in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["abspülen", "abtrocknen", "nass machen", "einseifen und reiben"]
                slot_count: 4
                answer: ["nass machen", "einseifen und reiben", "abspülen", "abtrocknen"]
                hints:
                  - "Was machst du ganz am Anfang am Waschbecken?"
                  - "Zuerst nass, dann kommt die Seife. Die Seife muss wieder ab, bevor du abtrocknest."
                  - "Nass machen, einseifen und reiben, abspülen, abtrocknen."
              - id: l1-f5
                type: multiple_choice
                text: "Warum wäschst du dir die Hände?"
                options: ["damit ich nicht krank werde", "damit die Seife alle wird", "damit die Hände schrumpeln"]
                answer: "damit ich nicht krank werde"
                hints:
                  - "Was kann auf den Händen sein, das man nicht sieht?"
                  - "Manche Keime machen krank."
                  - "Damit ich nicht krank werde."
              - id: l1-f6
                type: multiple_choice
                text: "Wie lange reibst du die Hände mit Seife?"
                options: ["so lange wie zweimal „Zum Geburtstag viel Glück“", "nur ganz kurz: eins, zwei", "eine ganze Stunde"]
                answer: "so lange wie zweimal „Zum Geburtstag viel Glück“"
                feedback:
                  "nur ganz kurz: eins, zwei": "So schnell gehen die Keime nicht ab."
                  eine ganze Stunde: "Eine Stunde am Waschbecken? Dann verpasst du den Kuchen!"
                hints:
                  - "Ganz kurz ist zu wenig, aber zu lang muss es auch nicht sein."
                  - "Paul singt dabei ein Lied, zweimal."
                  - "So lange wie zweimal „Zum Geburtstag viel Glück“."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Paul hat Bello gestreichelt. Gleich gibt es Essen. Was braucht er jetzt?"
                say: "Paul hat Bello gestreichelt. Gleich gibt es Essen. Was braucht Paul jetzt?"
                options: [{ object: ball }, { object: water }, { object: teddy }]
                answer: water
                hints: ["Nach dem Streicheln und vor dem Essen: Hände waschen. Womit?"]
              - id: l1-s2
                type: true_false
                text: "Keime kannst du mit den Augen sehen.\n\nStimmt das?"
                say: "Keime kannst du mit den Augen sehen. Stimmt das?"
                answer: false
                hints: ["Wie groß sind Keime?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Nach der Toilette wasche ich mir die _."
                options: ["Hände", "Haare", "Ohren"]
                answer: ["Hände"]
                hints: ["Womit hast du auf dem Klo alles angefasst?"]
              - id: l1-s4
                type: sorting
                text: "Jetzt Hände waschen?"
                say: "Tippe auf eine Karte und hör sie an. Musst du dann die Hände waschen?"
                bins:
                  - { id: waschen, show: { text: "Hände waschen!" }, say: "Hände waschen!" }
                  - { id: nicht, show: { text: "nicht nötig" }, say: "nicht nötig" }
                options:
                  - { text: "nach dem Naseputzen", bin: waschen }
                  - { text: "nach einem Witz", bin: nicht }
                  - { text: "nach dem Spielen im Sand", bin: waschen }
                  - { text: "nach dem Lachen", bin: nicht }
                hints: ["Beim Naseputzen und im Sand kommen Keime an die Hände."]
              - id: l1-s5
                type: multiple_choice
                text: "Wo reibst du die Seife überall hin?"
                options: ["überall, auch zwischen die Finger", "nur auf den kleinen Finger", "nur auf die Fingernägel"]
                answer: "überall, auch zwischen die Finger"
                hints: ["Keime sitzen auch zwischen den Fingern und an den Daumen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paul war auf dem Klo. Was macht er jetzt?"
                options: ["Hände waschen", "Schuhe putzen", "Haare kämmen"]
                answer: "Hände waschen"
              - id: l1-n2
                type: ordering
                text: "Was macht Paul zuerst?"
                say: "Leg Pauls Nachmittag in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Kuchen essen", "im Sand spielen", "Hände waschen"]
                slot_count: 3
                answer: ["im Sand spielen", "Hände waschen", "Kuchen essen"]
              - id: l1-n3
                type: true_false
                text: "Vor dem Essen wäschst du dir die Hände.\n\nStimmt das?"
                say: "Vor dem Essen wäschst du dir die Hände. Stimmt das?"
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Manche Keime können mich _ machen."
                options: ["krank", "größer", "bunt"]
                answer: ["krank"]
              - id: l1-n5
                type: multiple_choice
                text: "Was hilft gegen Keime an den Händen?"
                options: ["Wasser und Seife", "kräftig pusten", "die Hände schütteln"]
                answer: "Wasser und Seife"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wann wäschst du dir die Hände?"
            options: ["vor dem Essen", "beim Schlafen", "beim Singen"]
            answer: "vor dem Essen"
          - id: l1-c2
            type: true_false
            text: "Pauls Hände sehen sauber aus. Dann hat er bestimmt keine Keime.\n\nStimmt das?"
            say: "Pauls Hände sehen sauber aus. Dann hat er bestimmt keine Keime. Stimmt das?"
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Was brauchst du mit der Seife zum Händewaschen?"
            say: "Was brauchst du mit der Seife zum Händewaschen?"
            options: [{ object: water }, { object: cake }, { object: crayon }]
            answer: water
          - id: l1-c4
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Zum Schluss trockne ich die Hände _."
            options: ["ab", "an", "um"]
            answer: ["ab"]
          - id: l1-c5
            type: ordering
            text: "Wie wäschst du die Hände?"
            say: "Leg die Karten in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
            options: ["abtrocknen", "einseifen", "nass machen"]
            slot_count: 3
            answer: ["nass machen", "einseifen", "abtrocknen"]
          - id: l1-c6
            type: multiple_choice
            text: "Warum sind Keime nicht gut?"
            options: ["Manche machen krank.", "Sie sind laut.", "Sie beißen in den Kuchen."]
            answer: "Manche machen krank."

  - n: 2
    title: { de: Sauber von Kopf bis Fuß, en: Clean from head to toe }
    goal:
      de: "Finde heraus, wie du dich sauber hältst. Du niest in die Armbeuge und putzt morgens und abends die Zähne."
      en: "Find out how to keep yourself clean. You sneeze into your elbow and brush your teeth morning and evening."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Nach dem Klo wäschst du dir die Hände.\n\nStimmt das?"
            say: "Nach dem Klo wäschst du dir die Hände. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Womit wäschst du die Hände?"
            options: ["mit Wasser und Seife", "mit Saft"]
            answer: "mit Wasser und Seife"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hatschi! Wohin niest Paul?"
            say: "Es ist Abend. Paul muss niesen. Hatschi! Was glaubst du: Wohin niest er am besten?"
            show: { object: arm }
          - text: "In die Armbeuge."
            say: "In die Armbeuge, also in den Knick am Ellbogen, oder in ein Taschentuch. Dann fliegen die Keime nicht zu den anderen und landen nicht auf seiner Hand. Beim Husten genauso."
            show: { object: arm }
          - text: "Waschen, baden oder duschen."
            say: "Nach einem langen Tag ist Paul verschwitzt und schmutzig. Er wäscht sich, badet oder duscht. Danach fühlt er sich frisch."
            show: { object: bath }
          - text: "Jeden Tag frische Socken."
            say: "Socken und Unterwäsche zieht Paul jeden Tag frisch an. Schmutzige Sachen kommen in die Wäsche."
            show: { object: sock }
          - text: "Zähne putzen: morgens und abends."
            say: "Und vor dem Schlafen? Zähne putzen! Das macht Paul jeden Tag zweimal, morgens und abends."
            show: { object: toothbrush }
          - text: "So bleibst du gesund."
            say: "Wer sich sauber hält, bleibt eher gesund, steckt andere nicht so leicht an und fühlt sich wohl."
            show: { object: bathroom }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Paul muss niesen. Wohin niest er am besten?"
                options: ["in die Armbeuge", "Lena ins Gesicht", "in die Suppe"]
                answer: "in die Armbeuge"
                feedback:
                  Lena ins Gesicht: "Igitt! Dann fliegen die Keime direkt zu Lena."
                  in die Suppe: "Bäh! Die Suppe will jetzt niemand mehr essen."
                hints:
                  - "Die Keime sollen nicht zu anderen fliegen."
                  - "Paul hält etwas vor das Gesicht, aber nicht die Hand. Den Knick am Ellbogen."
                  - "In die Armbeuge."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Sauber und gesund?"
                say: "Tippe auf eine Karte und hör sie an. Ist das gut, oder lieber nicht?"
                bins:
                  - { id: gut, show: { text: "gut" }, say: "gut" }
                  - { id: nicht, show: { text: "lieber nicht" }, say: "lieber nicht" }
                options:
                  - { text: "Zähne putzen", bin: gut }
                  - { text: "mit schmutzigen Händen essen", bin: nicht }
                  - { text: "jeden Tag frische Socken", bin: gut }
                  - { text: "in die Hand niesen und dann Hände schütteln", bin: nicht }
                hints:
                  - "Frag bei jeder Karte: Kommen da Keime zu mir oder zu anderen?"
                  - "Zähneputzen und frische Socken halten sauber. Schmutzige Hände und Niesen in die Hand bringen Keime weiter."
                  - "Zähne und Socken zu gut, schmutzige Hände und Niesen in die Hand zu lieber nicht."
              - id: l2-f3
                type: image_multiple_choice
                text: "Was braucht Paul zum Zähneputzen?"
                say: "Was braucht Paul zum Zähneputzen?"
                options: [{ object: fork }, { object: toothbrush }, { object: pencil }]
                answer: toothbrush
                hints:
                  - "Mit der Gabel isst du, mit dem Bleistift schreibst du."
                  - "Es hat einen Stiel und viele kleine Borsten."
                  - "Die Zahnbürste."
              - id: l2-f4
                type: true_false
                text: "Paul putzt nur einmal in der Woche die Zähne. Das ist genug.\n\nStimmt das?"
                say: "Paul putzt nur einmal in der Woche die Zähne. Das ist genug. Stimmt das?"
                answer: false
                hints:
                  - "Wie oft am Tag putzt du die Zähne?"
                  - "Zähne putzt du jeden Tag, morgens und abends."
                  - "Nein. Einmal in der Woche ist viel zu selten."
              - id: l2-f5
                type: matching
                text: "Was gehört zusammen?"
                say: "Tippe auf eine Karte und dann auf das passende Bild."
                pairs:
                  - left: { text: "Zähne putzen" }
                    right: { object: toothbrush }
                  - left: { text: "baden" }
                    right: { object: bath }
                  - left: { text: "frisch anziehen" }
                    right: { object: sock }
                hints:
                  - "Such zu jeder Karte das Ding, das du dafür brauchst."
                  - "In der Badewanne badest du. Die Zahnbürste ist für die Zähne."
                  - "Zähne putzen zur Zahnbürste, baden zur Badewanne, frisch anziehen zur Socke."
              - id: l2-f6
                type: multiple_choice
                text: "Wann putzt Paul die Zähne?"
                options: ["morgens und abends", "nur an seinem Geburtstag", "nie"]
                answer: "morgens und abends"
                hints:
                  - "Paul putzt jeden Tag, und zwar zweimal."
                  - "Einmal nach dem Aufstehen, einmal vor dem Schlafen."
                  - "Morgens und abends."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Ich niese in die _."
                options: ["Armbeuge", "Suppe", "Hosentasche"]
                answer: ["Armbeuge"]
                hints: ["Der Knick am Ellbogen hat einen Namen."]
              - id: l2-s2
                type: true_false
                text: "Nach dem Naseputzen wäschst du dir die Hände.\n\nStimmt das?"
                say: "Nach dem Naseputzen wäschst du dir die Hände. Stimmt das?"
                answer: true
                hints: ["Beim Naseputzen kommen Keime an die Finger."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Was zieht Paul jeden Tag frisch an?"
                say: "Was zieht Paul jeden Tag frisch an?"
                options: [{ object: woolly-hat }, { object: sock }, { object: wellies }]
                answer: sock
                hints: ["Es steckt den ganzen Tag im Schuh."]
              - id: l2-s4
                type: multiple_choice
                text: "Warum hält sich Paul sauber?"
                options: ["damit er gesund bleibt", "damit er schneller rennt", "damit seine Haare grün werden"]
                answer: "damit er gesund bleibt"
                hints: ["Sauber sein hilft gegen Keime."]
              - id: l2-s5
                type: ordering
                text: "Pauls Abend"
                say: "Leg Pauls Abend in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["ins Bett gehen", "Abendbrot essen", "Zähne putzen"]
                slot_count: 3
                answer: ["Abendbrot essen", "Zähne putzen", "ins Bett gehen"]
                hints: ["Nach dem Essen sind die Zähne schmutzig."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Paul hat kein Taschentuch und muss husten. Was tut er?"
                options: ["in die Armbeuge husten", "in die Hand husten und Lena die Hand geben", "ganz laut in die Klasse husten"]
