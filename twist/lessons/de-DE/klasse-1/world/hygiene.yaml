# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.hygiene
skill: world.body.hygiene
curriculum: de-DE
language: de
title:
  de: Sauber und gesund
  en: Clean and healthy
summary: >
  Paul has played in the sandpit and with the dog Bello and wants a piece
  of cake. Lesson 1 asks whether hands that look clean need washing:
  yes, because Keime are too small to see and some make us ill. It names
  when to wash hands (after the toilet, before eating, after playing
  outside, after blowing the nose, after touching animals) and how: wet,
  soap, rub everywhere for as long as singing "Zum Geburtstag viel Glück"
  twice, rinse, dry. Lesson 2 follows Paul's evening: sneeze or cough into
  the crook of the arm or a tissue, wash or bath, fresh socks and
  underwear every day, brush teeth morning and evening. It ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Sauber und gesund, en: Clean and healthy }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [Keim, krank, Seife, waschen, abtrocknen, Armbeuge, Taschentuch, niesen, husten, sauber] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: why, what: { de: "erklären, warum ich mich wasche: Keime sind winzig und können krank machen", en: "explaining why we wash: germs are tiny and can make us ill" } }
    - { id: when, what: { de: "sagen, wann ich mir die Hände wasche", en: saying when to wash my hands } }
    - { id: how, what: { de: "sagen, wie ich mich sauber halte (Hände waschen, niesen, Körper, Kleidung, Zähne)", en: "saying how to keep clean (washing hands, sneezing, body, clothes, teeth)" } }
  misconceptions:
    - id: looks-clean-is-clean
      what: Thinks hands that look clean have no germs and need no washing
      addressed: "lesson 1 Learn opens with the guess about Paul's clean-looking hands; l1-f1, l1-s2, l1-c2, l2-c3 and l2-c5"
    - id: water-is-enough
      what: Thinks a quick rinse with water alone is enough
      addressed: "lesson 1 Learn says soap and rubbing for as long as two birthday songs; l1-f6, l1-n5, l2-c14 and l2-c16"
    - id: sneeze-into-hand
      what: Sneezes or coughs into the hand and then touches others
      addressed: "lesson 2 Learn opens with the guess where Paul should sneeze; l2-f1, l2-s1, l2-n1 and l2-c18"
  twist_reuse: []
  status: draft
  version: 1
