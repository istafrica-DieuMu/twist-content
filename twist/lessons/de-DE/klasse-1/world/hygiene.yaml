                type: true_false
                text: "Beim Niesen können Keime zu anderen fliegen.\n\nStimmt das?"
                say: "Beim Niesen können Keime zu anderen fliegen. Stimmt das?"
                answer: true
              - id: l2-n4
                type: image_multiple_choice
                text: "Wo wäscht sich Paul am Abend?"
                say: "In welchem Zimmer wäscht sich Paul am Abend?"
                options: [{ object: kitchen }, { object: bathroom }, { object: living-room }]
                answer: bathroom
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Morgens und _ putze ich die Zähne."
                options: ["abends", "nie", "sonntags"]
                answer: ["abends"]

      - activity: check
        size: skill
