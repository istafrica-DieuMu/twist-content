# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.families
skill: world.society.families
curriculum: de-DE
language: de
title:
  de: Familien sind verschieden
  en: Families are different
summary: >
  The Klasse 1b makes a Familienbuch, one page per child. Lesson 1 asks
  whether all families are the same size and finds they are not: Ole
  lives with his mum, his dad and a baby sister, Ayla with her dad, Paul
  has five siblings and Juna none. It names Eltern, Geschwister and
  Großeltern (the mum of your mum is your Oma). Lesson 2 shows more
  families, all without judgement: Finn has two mums and Mila two dads,
  Lea lives one week with her mum and one with her dad, Jonas lives in a
  Patchworkfamilie, Sara with her grandparents, Malik with Pflegeeltern,
  and Ayla's family speaks Turkish and German. What every family shares:
  people who love each other and care for each other. It ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Ich und die anderen, en: Me and others }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [Familie, Eltern, Geschwister, Bruder, Schwester, Großeltern, Oma, Opa, Einzelkind, zwei Zuhause, Patchworkfamilie, Pflegeeltern, sorgen, füreinander] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: members, what: { de: "Familienmitglieder benennen: Eltern, Geschwister, Großeltern", en: "naming family members: parents, siblings, grandparents" } }
    - { id: kinds, what: { de: "beschreiben, dass Familien ganz verschieden sein können", en: "describing how families can be very different" } }
    - { id: common, what: { de: "sagen, was alle Familien gemeinsam haben", en: "saying what all families have in common" } }
  misconceptions:
    - id: one-kind-only
      what: Thinks only a mum, a dad and their children make a real family
      addressed: "lesson 1 Learn shows Ayla and her dad; lesson 2 Learn shows two mums, two dads, two homes, a Patchworkfamilie, grandparents and Pflegeeltern; l1-f2, l1-c2, l2-f1, l2-f6, l2-s2, l2-n2, l2-n3, l2-c7, l2-c9 and l2-c11"
    - id: size-decides
      what: Thinks a family must be big or have several children
      addressed: "lesson 1 Learn sets Paul's five siblings against Juna, an Einzelkind; l1-f6, l1-s2, l1-n5, l1-c5, l2-c13 and l2-c20"
    - id: two-homes-no-family
      what: Thinks a child whose parents live apart has no family, or belongs to only one parent
      addressed: "lesson 2 Learn shows Lea with two homes; l2-f5, l2-n4 and l2-c8"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wer gehört zur Familie?", en: "Who is in a family?" }
    goal:
      de: "Lerne, wer zu einer Familie gehören kann. Die Mama von deiner Mama ist deine Oma."
      en: "Learn who can belong to a family. Your mum's mum is your grandma."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Sind alle Familien gleich groß?"
            say: "Die Klasse 1b macht ein Familienbuch. Jedes Kind malt eine Seite über seine Familie. Was glaubst du: Sind alle Familien gleich groß?"
            show: { objects: [grandma, mum, baby] }
          - text: "Jede Familie ist anders."
            say: "Nein! Jede Familie ist anders. Bei Ole sind es vier: Mama, Papa, Ole und seine kleine Schwester. Bei Ayla sind es zwei: Ayla und ihr Papa. Beides ist eine Familie."
            show: { objects: [dad, girl] }
          - text: "Eltern und Geschwister"
            say: "Mama und Papa heißen Eltern. Brüder und Schwestern heißen zusammen Geschwister."
            show: { objects: [mum, dad, brother, sister] }
          - text: "Viele Geschwister oder keine"
            say: "Manche Kinder haben viele Geschwister, manche keine. Paul hat zwei Brüder und drei Schwestern, also fünf Geschwister! Juna hat keine Geschwister. Sie ist ein Einzelkind."
            show: { objects: [brother, sister] }
          - text: "Oma und Opa"
            say: "Die Mama von deiner Mama ist deine Oma. Der Papa von deiner Mama ist dein Opa. Auch die Eltern von deinem Papa sind deine Oma und dein Opa. Oma und Opa heißen zusammen Großeltern."
            show: { objects: [grandma, grandpa] }
          - text: "Wer wohnt zusammen?"
            say: "Bei Mia wohnen Oma und Opa mit im Haus. Bei Kim wohnen nur Kim, ihre Mama und ihr großer Bruder. Jede Familie wohnt anders zusammen."
            show: { objects: [grandpa, grandma, girl] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Sie ist die Mama von deiner Mama.\n\nWer ist das?"
                say: "Sie ist die Mama von deiner Mama. Wer ist das?"
                options: [{ object: grandma }, { object: sister }, { object: baby }]
                answer: grandma
                hints:
                  - "Denk an deine Mama. Wer ist ihre Mama?"
                  - "Die Mama von deiner Mama ist älter als deine Mama."
                  - "Das ist die Oma."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Ayla wohnt mit ihrem Papa.\n\nSind Ayla und ihr Papa eine Familie?"
                say: "Ayla wohnt mit ihrem Papa. Sind Ayla und ihr Papa eine Familie?"
                show: { objects: [dad, girl] }
                answer: true
                hints:
                  - "Muss eine Familie groß sein?"
                  - "Bei Ayla sind es zwei. Auch zwei sind eine Familie."
                  - "Ja. Ayla und ihr Papa sind eine Familie."
              - id: l1-f3
                type: sorting
                text: "Eltern, Geschwister oder Großeltern?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Eltern, zu den Geschwistern oder zu den Großeltern."
                bins:
                  - { id: eltern, show: { text: "Eltern" }, say: "Eltern" }
                  - { id: geschwister, show: { text: "Geschwister" }, say: "Geschwister" }
                  - { id: grosseltern, show: { text: "Großeltern" }, say: "Großeltern" }
                options:
                  - { object: mum, bin: eltern }
                  - { object: brother, bin: geschwister }
                  - { object: grandpa, bin: grosseltern }
                  - { object: sister, bin: geschwister }
                  - { object: dad, bin: eltern }
                  - { object: grandma, bin: grosseltern }
                hints:
                  - "Eltern sind Mama und Papa. Geschwister sind Brüder und Schwestern."
                  - "Oma und Opa heißen Großeltern."
                  - "Mama und Papa zu Eltern, Bruder und Schwester zu Geschwister, Oma und Opa zu Großeltern."
              - id: l1-f4
                type: multiple_choice
                text: "Was sind Geschwister?"
                options: ["Brüder und Schwestern", "Oma und Opa", "Freunde aus der Klasse"]
                answer: "Brüder und Schwestern"
                feedback:
                  "Oma und Opa": "Oma und Opa heißen Großeltern."
                hints:
                  - "Denk an Paul und seine fünf Geschwister."
                  - "Paul hat zwei Brüder und drei Schwestern."
                  - "Brüder und Schwestern."
              - id: l1-f5
                type: image_multiple_choice
                text: "Ole hat eine kleine Schwester. Sie ist erst ein halbes Jahr alt und kann noch nicht laufen.\n\nWelches Bild passt?"
                say: "Ole hat eine kleine Schwester. Sie ist erst ein halbes Jahr alt und kann noch nicht laufen. Welches Bild passt?"
                options: [{ object: baby }, { object: grandma }, { object: dad }]
                answer: baby
                hints:
                  - "Wer kann mit einem halben Jahr noch nicht laufen?"
                  - "Ein Kind, das noch so klein ist, ist ein Baby."
                  - "Das Baby passt."
              - id: l1-f6
                type: true_false
                text: "Alle Familien sind gleich groß.\n\nStimmt das?"
                say: "Alle Familien sind gleich groß. Stimmt das?"
                answer: false
                hints:
                  - "Denk an Ole und an Ayla."
                  - "Bei Ole sind es vier, bei Ayla zwei."
                  - "Nein. Familien sind verschieden groß."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Wer ist das?"
                say: "Tippe auf eine Karte und dann auf das Bild, das passt."
                pairs:
                  - left: { text: "Er ist der Papa von deinem Papa.", say: "Er ist der Papa von deinem Papa." }
                    right: { object: grandpa }
                  - left: { text: "Sie ist die Mama von deinem Papa.", say: "Sie ist die Mama von deinem Papa." }
                    right: { object: grandma }
                  - left: { text: "Es ist noch ganz klein und trinkt Milch aus der Flasche.", say: "Es ist noch ganz klein und trinkt Milch aus der Flasche." }
                    right: { object: baby }
                hints: ["Die Eltern von deinem Papa sind deine Großeltern."]
              - id: l1-s2
                type: true_false
                text: "Juna hat keine Geschwister. Sie lebt mit ihrer Mama und ihrem Papa.\n\nIst das eine Familie?"
                say: "Juna hat keine Geschwister. Sie lebt mit ihrer Mama und ihrem Papa. Ist das eine Familie?"
                show: { objects: [mum, dad, girl] }
                answer: true
                hints: ["Braucht eine Familie Geschwister?"]
              - id: l1-s3
                type: multiple_choice
                text: "Paul hat zwei Brüder und drei Schwestern. Wie viele Geschwister hat Paul?"
                options: ["5", "3", "2"]
                answer: "5"
                hints: ["Brüder und Schwestern sind zusammen die Geschwister. Zähl alle."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Bei Mia wohnt der Papa von ihrer Mama mit im Haus.\n\nWer ist das?"
                say: "Bei Mia wohnt der Papa von ihrer Mama mit im Haus. Wer ist das?"
                options: [{ object: grandpa }, { object: brother }, { object: dad }]
                answer: grandpa
                hints: ["Der Papa von der Mama ist schon älter."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Mama und Papa heißen zusammen _."
                options: ["Eltern", "Geschwister", "Großeltern"]
                answer: ["Eltern"]
                hints: ["Geschwister sind Brüder und Schwestern, Großeltern sind Oma und Opa."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Geschwister oder Großeltern?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Geschwistern oder zu den Großeltern."
                bins:
                  - { id: geschwister, show: { text: "Geschwister" }, say: "Geschwister" }
                  - { id: grosseltern, show: { text: "Großeltern" }, say: "Großeltern" }
                options:
                  - { object: sister, bin: geschwister }
                  - { object: grandma, bin: grosseltern }
                  - { object: brother, bin: geschwister }
                  - { object: grandpa, bin: grosseltern }
              - id: l1-n2
                type: true_false
                text: "Ein Kind kann zwei Omas haben.\n\nStimmt das?"
                say: "Ein Kind kann zwei Omas haben. Stimmt das?"
                show: { object: grandma }
                answer: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Wer gehört zu den Großeltern?"
                say: "Welches Bild zeigt jemanden von den Großeltern?"
                options: [{ object: grandpa }, { object: baby }, { object: brother }]
                answer: grandpa
              - id: l1-n4
                type: multiple_choice
                text: "Kim wohnt mit ihrer Mama und ihrem großen Bruder. Wie viele sind sie zusammen?"
                options: ["3", "2", "4"]
                answer: "3"
              - id: l1-n5
                type: true_false
                text: "Nur große Familien sind richtige Familien.\n\nStimmt das?"
                say: "Nur große Familien sind richtige Familien. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Er ist der Papa von deiner Mama.\n\nWer ist das?"
            say: "Er ist der Papa von deiner Mama. Wer ist das?"
            options: [{ object: grandpa }, { object: dad }, { object: brother }]
            answer: grandpa
          - id: l1-c2
            type: true_false
            text: "Lars wohnt mit seiner Oma.\n\nSind Lars und seine Oma eine Familie?"
            say: "Lars wohnt mit seiner Oma. Sind Lars und seine Oma eine Familie?"
            show: { objects: [boy, grandma] }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was sind Großeltern?"
            options: ["Oma und Opa", "Bruder und Schwester", "Mama und Baby"]
            answer: "Oma und Opa"
          - id: l1-c4
            type: sorting
            text: "Eltern oder Geschwister?"
            say: "Leg jedes Bild zu den Eltern oder zu den Geschwistern."
            bins:
              - { id: eltern, show: { text: "Eltern" }, say: "Eltern" }
              - { id: geschwister, show: { text: "Geschwister" }, say: "Geschwister" }
            options:
              - { object: mum, bin: eltern }
              - { object: sister, bin: geschwister }
              - { object: dad, bin: eltern }
              - { object: brother, bin: geschwister }
          - id: l1-c5
            type: true_false
            text: "Jede Familie hat genau zwei Kinder.\n\nStimmt das?"
            say: "Jede Familie hat genau zwei Kinder. Stimmt das?"
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Lenis Bruder ist gerade erst geboren.\n\nWelches Bild passt?"
            say: "Lenis Bruder ist gerade erst geboren. Welches Bild passt?"
            options: [{ object: baby }, { object: grandma }, { object: girl }]
            answer: baby

  - n: 2
    title: { de: "Was alle Familien gemeinsam haben", en: "What all families share" }
    goal:
      de: "Familien sind ganz verschieden. Finn hat zwei Mamas, Lea hat zwei Zuhause, und alle sorgen füreinander."
      en: "Families are very different. Finn has two mums, Lea has two homes, and they all care for each other."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Er ist der Papa von deinem Papa.\n\nWer ist das?"
            say: "Er ist der Papa von deinem Papa. Wer ist das?"
            options: [{ object: grandpa }, { object: brother }, { object: baby }]
            answer: grandpa
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Alle Familien sind gleich.\n\nStimmt das?"
            say: "Alle Familien sind gleich. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was haben alle Familien gemeinsam?"
            say: "Im Familienbuch der Klasse 1b sind viele verschiedene Familien. Was glaubst du: Was haben sie alle gemeinsam? Dass alle gleich viele sind? Oder etwas anderes?"
            show: { object: heart }
          - text: "Sie haben sich lieb und sorgen füreinander."
            say: "Alle Familien haben etwas gemeinsam: Sie haben sich lieb und sorgen füreinander. Sie helfen sich, trösten sich und verbringen Zeit zusammen. Wie viele es sind, ist dabei egal."
            show: { object: heart }
          - text: "Zwei Mamas, zwei Papas"
            say: "Finn lebt mit seinen zwei Mamas. Mila lebt mit ihren zwei Papas. Auch das sind Familien."
          - text: "Zwei Zuhause"
            say: "Die Eltern von Lea wohnen nicht mehr zusammen. Lea wohnt eine Woche bei ihrer Mama und eine Woche bei ihrem Papa. Lea hat zwei Zuhause, und sie gehört zu beiden."
            show: { objects: [mum, dad] }
          - text: "Eine Patchworkfamilie"
            say: "Bei Jonas ist die Familie größer geworden. Seine Mama hat einen neuen Partner. Der hat seine Tochter mitgebracht, und jetzt wohnen alle zusammen. So eine Familie heißt Patchworkfamilie."
          - text: "Bei Oma und Opa, bei Pflegeeltern"
            say: "Sara wohnt bei ihrer Oma und ihrem Opa. Malik wohnt bei Pflegeeltern, weil seine Eltern gerade nicht für ihn sorgen können. Auch dort sind Menschen, die die Kinder lieb haben und für sie sorgen."
            show: { objects: [grandma, grandpa] }
          - text: "Familien leben verschieden."
            say: "Familien sind auch sonst verschieden. In Aylas Familie spricht man zu Hause Türkisch und Deutsch. Manche Familien wohnen in der Stadt, manche auf dem Land. Und jede feiert ihre eigenen Feste."
          - text: "Wusstest du? Auch Elefanten leben in Familien."
            say: "Wusstest du? Auch Elefanten leben in Familien. Die älteste Elefantenmutter führt die Familie an. Sie kennt die Wege zum Wasser, und alle passen zusammen auf die Kleinen auf."
            show: { object: elephant }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: true_false
                text: "Finn lebt mit seinen zwei Mamas.\n\nIst das eine Familie?"
                say: "Finn lebt mit seinen zwei Mamas. Ist das eine Familie?"
                answer: true
                hints:
                  - "Was haben alle Familien gemeinsam?"
                  - "Finns Mamas haben ihn lieb und sorgen für ihn."
                  - "Ja. Finn und seine zwei Mamas sind eine Familie."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was haben alle Familien gemeinsam?"
                options: ["Sie sorgen füreinander.", "Sie haben alle einen Hund.", "Sie sind alle vier Menschen."]
                answer: "Sie sorgen füreinander."
                feedback:
                  "Sie haben alle einen Hund.": "Wuff! Manche Familien haben einen Hund, viele aber nicht."
                hints:
                  - "Denk an das Herz im Familienbuch."
                  - "Familien haben sich lieb und helfen sich."
                  - "Sie sorgen füreinander."
              - id: l2-f3
                type: sorting
                text: "Gleich oder verschieden?"
                say: "Tippe auf eine Karte und hör zu. Ist das bei allen Familien gleich, oder ist es bei jeder Familie anders?"
                bins:
                  - { id: alle, show: { text: "bei allen gleich" }, say: "bei allen gleich" }
                  - { id: anders, show: { text: "bei jeder anders" }, say: "bei jeder anders" }
                options:
                  - { text: "Sie haben sich lieb.", bin: alle }
                  - { text: "wie viele Kinder es gibt", bin: anders }
                  - { text: "welche Sprache sie sprechen", bin: anders }
                  - { text: "Sie helfen einander.", bin: alle }
                hints:
                  - "Denk an Paul und Juna, und an Aylas Familie."
                  - "Paul hat fünf Geschwister, Juna keine. Ayla spricht zu Hause Türkisch und Deutsch."
                  - "Sich lieb haben und helfen ist bei allen gleich. Kinder und Sprache sind bei jeder anders."
              - id: l2-f4
                type: multiple_choice
                text: "Sara wohnt bei der Mama und dem Papa von ihrer Mama. Bei wem wohnt Sara?"
                options: ["bei Oma und Opa", "bei ihrer Schwester", "bei ihrer Lehrerin"]
                answer: "bei Oma und Opa"
                hints:
                  - "Wer ist die Mama von deiner Mama?"
                  - "Die Eltern von deiner Mama sind deine Großeltern."
                  - "Bei Oma und Opa."
              - id: l2-f5
                type: true_false
                text: "Lea wohnt eine Woche bei ihrer Mama und eine Woche bei ihrem Papa.\n\nHat Lea zwei Zuhause?"
                say: "Lea wohnt eine Woche bei ihrer Mama und eine Woche bei ihrem Papa. Hat Lea zwei Zuhause?"
                show: { objects: [mum, dad] }
                answer: true
                hints:
                  - "Wo wohnt Lea?"
                  - "Lea wohnt bei Mama und auch bei Papa."
                  - "Ja. Lea hat zwei Zuhause."
              - id: l2-f6
                type: true_false
                text: "Eine Familie muss immer eine Mama und einen Papa haben.\n\nStimmt das?"
                say: "Eine Familie muss immer eine Mama und einen Papa haben. Stimmt das?"
                answer: false
                hints:
                  - "Denk an Ayla, an Finn und an Sara."
                  - "Ayla lebt mit ihrem Papa, Finn mit zwei Mamas, Sara bei Oma und Opa."
                  - "Nein. Familien sind ganz verschieden."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Jonas' Mama hat einen neuen Partner. Er bringt seine Tochter mit, und alle wohnen zusammen. Wie heißt so eine Familie?"
                options: ["Patchworkfamilie", "Klassenfamilie", "Fußballfamilie"]
                answer: "Patchworkfamilie"
                hints: ["Denk an die Familie von Jonas, die größer geworden ist."]
              - id: l2-s2
                type: true_false
                text: "Mila lebt mit ihren zwei Papas.\n\nIst das eine Familie?"
                say: "Mila lebt mit ihren zwei Papas. Ist das eine Familie?"
                answer: true
                hints: ["Sorgen Milas Papas für sie?"]
              - id: l2-s3
                type: sorting
                text: "Gleich oder verschieden?"
                say: "Tippe auf eine Karte und hör zu. Ist das bei allen Familien gleich, oder ist es bei jeder Familie anders?"
                bins:
                  - { id: alle, show: { text: "bei allen gleich" }, say: "bei allen gleich" }
                  - { id: anders, show: { text: "bei jeder anders" }, say: "bei jeder anders" }
                options:
                  - { text: "Sie sorgen füreinander.", bin: alle }
                  - { text: "wo sie wohnen", bin: anders }
                  - { text: "wie viele Menschen es sind", bin: anders }
                  - { text: "Sie verbringen Zeit zusammen.", bin: alle }
                hints: ["Was steht auf jeder Seite im Familienbuch, egal wie groß die Familie ist?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was braucht jedes Kind in seiner Familie?"
                options: ["Menschen, die es lieb haben", "ein eigenes Pony", "viele Geschwister"]
                answer: "Menschen, die es lieb haben"
                feedback:
                  "ein eigenes Pony": "Ein Pony wäre toll, aber kaum ein Kind hat eins!"
                hints: ["Was haben alle Familien gemeinsam?"]
              - id: l2-s5
                type: true_false
                text: "In jeder Familie spricht man nur Deutsch.\n\nStimmt das?"
                say: "In jeder Familie spricht man nur Deutsch. Stimmt das?"
                answer: false
                hints: ["Denk an Aylas Familie."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Gleich oder verschieden?"
                say: "Tippe auf eine Karte und hör zu. Ist das bei allen Familien gleich, oder ist es bei jeder Familie anders?"
                bins:
                  - { id: alle, show: { text: "bei allen gleich" }, say: "bei allen gleich" }
                  - { id: anders, show: { text: "bei jeder anders" }, say: "bei jeder anders" }
                options:
                  - { text: "Sie trösten sich.", bin: alle }
                  - { text: "welche Feste sie feiern", bin: anders }
                  - { text: "ob es einen Hund gibt", bin: anders }
                  - { text: "Sie haben einander lieb.", bin: alle }
              - id: l2-n2
                type: true_false
                text: "Malik wohnt bei Pflegeeltern. Sie sorgen für ihn.\n\nHat Malik eine Familie?"
                say: "Malik wohnt bei Pflegeeltern. Sie sorgen für ihn. Hat Malik eine Familie?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Was stimmt?"
                options: ["Familien sind verschieden, und jede ist eine Familie.", "Nur große Familien sind Familien.", "Nur Familien mit Oma sind Familien."]
                answer: "Familien sind verschieden, und jede ist eine Familie."
              - id: l2-n4
                type: true_false
                text: "Kinder mit zwei Zuhause haben keine Familie.\n\nStimmt das?"
