# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.pets
skill: world.nature.pets
curriculum: de-DE
language: de
title:
  de: Haustiere
  en: Pets
summary: >
  Ben wishes for a pet. Lesson 1 starts with the hedgehog in his garden:
  a Wildtier lives free and finds its own food, a Haustier lives with
  people who look after it. It names common pets and what every pet
  needs: food, fresh water and a home that suits it. In lesson 2 Ben
  looks after his grandma's cat Minka for a weekend and learns how to
  care for a pet every day and how to treat animals (let them rest, ask
  before stroking a strange dog, wash your hands, the vet helps), and the
  set ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Natur um mich, en: Nature around me }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.nature.living-nonliving]
  also_practises: []
  vocabulary: { de: [Haustier, Wildtier, Futter, Wasser, Aquarium, Käfig, Körbchen, Katzenklo, Gassi gehen, streicheln, Tierarzt, pflegen] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: name, what: { de: "Haustiere nennen und von Wildtieren unterscheiden", en: "naming pets and telling them from wild animals" } }
    - { id: needs, what: { de: "sagen, was ein Haustier zum Leben braucht (Futter, Wasser, ein passendes Zuhause, Bewegung)", en: "saying what a pet needs to live (food, water, a suitable home, exercise)" } }
    - { id: care, what: { de: "ein Haustier richtig pflegen und mit Tieren richtig umgehen", en: "looking after a pet properly and treating animals well" } }
  misconceptions:
    - id: wild-as-pet
      what: Thinks a wild animal found outside (a hedgehog) can be kept as a pet
      addressed: "lesson 1 Learn opens with the hedgehog and says it is a Wildtier that finds its own food; l1-f3, l1-n2, l1-c2 and l2-c3"
    - id: pet-as-toy
      what: Treats a pet like a toy that needs care only when the child feels like it
      addressed: "lesson 2 Learn says sleeping and eating animals need rest and that a pet needs you every day; l2-f1, l2-f5, l2-s2, l2-n4, l2-c15 and l2-c17"
    - id: human-food
      what: Thinks pets can eat what people like (chocolate, cake)
      addressed: "lesson 2 Learn says chocolate is poisonous for dogs and cats; l1-f5 (feedback), l2-f2, l2-s3, l2-n2, l2-c11 and l2-c14"
    - id: stroke-any-dog
      what: Strokes a strange dog without asking its owner
      addressed: "lesson 2 Learn says Erst fragen, dann streicheln; l2-f3, l2-n1 and l2-c16"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Welches Tier ist ein Haustier?", en: "Which animal is a pet?" }
    goal:
      de: "Find heraus, welche Tiere Haustiere sind und was sie brauchen. Der Hund lebt bei uns, der Fuchs lebt frei im Wald."
      en: "Find out which animals are pets and what they need. The dog lives with us, the fox lives free in the forest."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was lebt?"
            say: "Welches Bild zeigt ein Lebewesen?"
            options: [{ object: teddy }, { object: cat }, { object: ball }]
            answer: cat
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ein Hund braucht Nahrung und Wasser.\n\nStimmt das?"
            say: "Ein Hund braucht Nahrung und Wasser. Stimmt das?"
            show: { object: dog }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Darf Ben den Igel behalten?"
            say: "Das ist Ben. Ben wünscht sich so sehr ein Haustier! Heute Abend sitzt ein Igel in seinem Garten. Was glaubst du: Darf Ben den Igel als Haustier behalten?"
            show: { object: hedgehog }
          - text: "Der Igel ist ein Wildtier."
            say: "Nein! Der Igel ist ein Wildtier. Wildtiere leben frei draußen und finden ihr Futter selbst. Der Igel bleibt im Garten, und Ben schaut ihm nur zu."
            show: { object: hedgehog }
          - text: "Haustiere leben bei uns."
            say: "Haustiere leben bei den Menschen. Die Menschen sorgen jeden Tag für sie. Hund und Katze sind Haustiere."
            show: { objects: [dog, cat] }
          - text: "Auch kleine Tiere sind Haustiere."
            say: "Auch ein Goldfisch, ein Wellensittich, eine Schildkröte, ein Hamster, ein Meerschweinchen und ein Kaninchen können Haustiere sein."
            show: { objects: [fish, bird, tortoise] }
          - text: "Jedes Tier braucht Futter und Wasser."
            say: "Jedes Haustier braucht jeden Tag frisches Wasser und sein eigenes Futter. Der Hund frisst Hundefutter, die Katze Katzenfutter und der Wellensittich Körner."
            show: { objects: [dog, dish] }
          - text: "Jedes Tier braucht ein Zuhause."
            say: "Und jedes Tier braucht ein Zuhause, das passt. Der Goldfisch wohnt im Aquarium mit sauberem Wasser. Der Wellensittich wohnt in einem großen Käfig und darf auch im Zimmer fliegen. Der Hund schläft in seinem Körbchen."
            show: { objects: [fish, bird] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Haustier oder Wildtier?"
                say: "Tippe auf ein Bild und hör das Wort. Ist es ein Haustier oder ein Wildtier?"
                bins:
                  - { id: haustier, show: { text: "Haustier" }, say: "Haustier" }
                  - { id: wildtier, show: { text: "Wildtier" }, say: "Wildtier" }
                options:
                  - { object: dog, bin: haustier }
                  - { object: fox, bin: wildtier }
                  - { object: cat, bin: haustier }
                  - { object: lion, bin: wildtier }
                hints:
                  - "Frag bei jedem Tier: Lebt es bei Menschen, oder lebt es frei draußen?"
                  - "Hund und Katze wohnen bei uns zu Hause. Fuchs und Löwe suchen ihr Futter selbst."
                  - "Hund und Katze zu den Haustieren, Fuchs und Löwe zu den Wildtieren."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Tier kann bei Ben wohnen?"
                say: "Welches Tier kann als Haustier bei Ben wohnen?"
                options: [{ object: cat }, { object: lion }, { object: crocodile }]
                answer: cat
                feedback:
                  crocodile: "Ein Krokodil in der Badewanne? Lieber nicht! Es ist ein Wildtier."
                  lion: "Der Löwe ist ein Wildtier. Er lebt frei und jagt sein Futter selbst."
                hints:
                  - "Ein Haustier lebt bei Menschen."
                  - "Löwe und Krokodil leben frei in der Wildnis."
                  - "Die Katze."
              - id: l1-f3
                type: true_false
                text: "Der Igel ist ein Haustier.\n\nStimmt das?"
                say: "Der Igel ist ein Haustier. Stimmt das?"
                show: { object: hedgehog }
                answer: false
                hints:
                  - "Wo lebt der Igel, und wer gibt ihm Futter?"
                  - "Der Igel lebt frei im Garten und findet sein Futter selbst."
                  - "Nein. Der Igel ist ein Wildtier."
              - id: l1-f4
                type: matching
                text: "Wo wohnt welches Tier?"
                say: "Tippe auf ein Tier und dann auf sein Zuhause."
                pairs:
                  - left: { object: fish }
                    right: { text: "Aquarium" }
                  - left: { object: bird }
                    right: { text: "Käfig" }
                  - left: { object: dog }
                    right: { text: "Körbchen" }
                hints:
                  - "Wer braucht Wasser zum Leben, wer will fliegen, wer will kuscheln?"
                  - "Der Fisch lebt im Wasser. Das Aquarium ist voller Wasser."
                  - "Fisch und Aquarium, Vogel und Käfig, Hund und Körbchen."
              - id: l1-f5
                type: multiple_choice
                text: "Was braucht jedes Haustier jeden Tag?"
                options: ["frisches Wasser", "einen Fernseher", "Schokolade"]
                answer: "frisches Wasser"
                feedback:
                  "Schokolade": "Schokolade ist für Hunde und Katzen sogar giftig!"
                  "einen Fernseher": "Ein Hund vor dem Fernseher? Er braucht etwas ganz anderes."
                hints:
                  - "Was brauchst du selbst jeden Tag zum Trinken?"
                  - "Alle Lebewesen brauchen Nahrung und Wasser."
                  - "Frisches Wasser."
              - id: l1-f6
                type: image_multiple_choice
                text: "Welches Tier ist ein Wildtier?"
                say: "Welches Tier lebt frei im Wald und ist ein Wildtier?"
                options: [{ object: dog }, { object: fox }, { object: cat }]
                answer: fox
                hints:
                  - "Welches Tier wohnt nicht bei Menschen?"
                  - "Hund und Katze leben zu Hause. Wer wohnt im Wald?"
                  - "Der Fuchs."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Ein Haustier lebt bei Menschen, und die Menschen sorgen für das Tier.\n\nStimmt das?"
                say: "Ein Haustier lebt bei Menschen, und die Menschen sorgen für das Tier. Stimmt das?"
                show: { object: dog }
                answer: true
                hints: ["Denk an Hund und Katze. Wer gibt ihnen Futter?"]
              - id: l1-s2
                type: sorting
                text: "Haustier oder Wildtier?"
                say: "Tippe auf eine Karte und hör das Wort. Ist es ein Haustier oder ein Wildtier?"
                bins:
                  - { id: haustier, show: { text: "Haustier" }, say: "Haustier" }
                  - { id: wildtier, show: { text: "Wildtier" }, say: "Wildtier" }
                options:
                  - { text: "Meerschweinchen", bin: haustier }
                  - { object: wolf, bin: wildtier }
                  - { text: "Wellensittich", bin: haustier }
                  - { object: giraffe, bin: wildtier }
                hints: ["Der Wolf sieht aus wie ein Hund, aber er lebt frei im Wald."]
              - id: l1-s3
                type: multiple_choice
                text: "Wo wohnt Bens Goldfisch?"
                show: { object: fish }
                options: ["im Aquarium mit sauberem Wasser", "in einer Kiste", "im Bett"]
                answer: "im Aquarium mit sauberem Wasser"
                feedback:
                  "im Bett": "Ein Fisch im Bett? Da wird es aber nass!"
                hints: ["Ein Fisch kann nur im Wasser leben."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Ein Hund braucht jeden Tag Futter und frisches _."
                options: ["Wasser", "Saft", "Kakao"]
                answer: ["Wasser"]
                hints: ["Was ist in der Schale neben dem Futter?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Tier ist ein Wildtier?"
                say: "Welches Tier ist ein Wildtier?"
                options: [{ object: puppy }, { object: elephant }, { object: cat }]
                answer: elephant
                hints: ["Welches Tier passt in keine Wohnung und lebt frei?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welches Tier ist ein Haustier?"
                say: "Welches Tier ist ein Haustier?"
                options: [{ object: wolf }, { object: dog }, { object: fox }]
                answer: dog
              - id: l1-n2
                type: true_false
                text: "Der Igel findet sein Futter selbst.\n\nStimmt das?"
                say: "Der Igel aus Bens Garten findet sein Futter selbst. Stimmt das?"
                show: { object: hedgehog }
                answer: true
              - id: l1-n3
                type: matching
                text: "Wer frisst was?"
                say: "Tippe auf ein Tier und dann auf sein Futter."
                pairs:
                  - left: { object: dog }
                    right: { text: "Hundefutter" }
                  - left: { object: bird }
                    right: { text: "Körner" }
                  - left: { object: cat }
                    right: { text: "Katzenfutter" }
              - id: l1-n4
                type: sorting
                text: "Haustier oder Wildtier?"
                say: "Tippe auf eine Karte und hör das Wort. Ist es ein Haustier oder ein Wildtier?"
                bins:
                  - { id: haustier, show: { text: "Haustier" }, say: "Haustier" }
                  - { id: wildtier, show: { text: "Wildtier" }, say: "Wildtier" }
                options:
                  - { text: "Hamster", bin: haustier }
                  - { object: hedgehog, bin: wildtier }
                  - { text: "Kaninchen", bin: haustier }
                  - { object: zebra, bin: wildtier }
              - id: l1-n5
                type: multiple_choice
                text: "Warum ist der Löwe kein Haustier?"
                show: { object: lion }
                options: ["Er ist ein Wildtier und lebt frei.", "Er ist gelb.", "Er ist zu leise."]
                answer: "Er ist ein Wildtier und lebt frei."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Tier ist ein Haustier?"
            say: "Welches Bild zeigt ein Haustier?"
            options: [{ object: zebra }, { object: cat }, { object: giraffe }]
            answer: cat
          - id: l1-c2
            type: true_false
            text: "Der Fuchs ist ein Haustier.\n\nStimmt das?"
            say: "Der Fuchs ist ein Haustier. Stimmt das?"
            show: { object: fox }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was braucht ein Haustier?"
            options: ["Futter und Wasser", "Spielzeugautos"]
            answer: "Futter und Wasser"
          - id: l1-c4
            type: true_false
            text: "Der Hund ist ein Haustier.\n\nStimmt das?"
            say: "Der Hund ist ein Haustier. Stimmt das?"
            show: { object: dog }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Welches Tier ist ein Wildtier?"
            say: "Welches Bild zeigt ein Wildtier?"
            options: [{ object: dog }, { object: puppy }, { object: wolf }]
            answer: wolf
          - id: l1-c6
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Der Goldfisch wohnt im _."
            options: ["Aquarium", "Käfig", "Körbchen"]
            answer: ["Aquarium"]

  - n: 2
    title: { de: "Ben passt auf Minka auf", en: "Ben looks after Minka" }
    goal:
      de: "Lerne, wie du ein Haustier jeden Tag pflegst. Gib ihm Futter und Wasser und lass es in Ruhe, wenn es schläft."
      en: "Learn how to look after a pet every day. Give it food and water and leave it alone when it sleeps."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Welches Tier ist ein Haustier?"
            say: "Welches Tier kann ein Haustier sein?"
            options: [{ object: owl }, { object: puppy }, { object: crocodile }]
            answer: puppy
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Haustier braucht kein Wasser.\n\nStimmt das?"
            say: "Ein Haustier braucht kein Wasser. Stimmt das?"
            show: { object: water }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Soll Ben Minka wecken?"
            say: "Bens Oma fährt übers Wochenende weg. Ben passt auf ihre Katze Minka auf! Minka schläft auf dem Sofa. Ben möchte so gern mit ihr spielen. Was glaubst du: Soll Ben Minka wecken?"
            show: { object: cat }
          - text: "Lass schlafende Tiere in Ruhe."
            say: "Nein. Tiere brauchen viel Ruhe. Wenn ein Tier schläft oder frisst, lässt du es in Ruhe. Ben wartet, bis Minka aufwacht und zu ihm kommt."
            show: { object: cat }
          - text: "Jeden Tag: Futter, Wasser, sauber machen."
            say: "Jeden Morgen gibt Ben Minka frisches Wasser und Katzenfutter. Er macht auch das Katzenklo sauber. Schokolade und Kuchen bekommt Minka nie. Schokolade ist für Katzen und Hunde giftig."
            show: { objects: [cat, dish] }
          - text: "Ein Hund muss raus."
            say: "Bens Nachbar geht mehrmals am Tag mit seinem Hund Gassi. Hunde brauchen viel Bewegung draußen, bei jedem Wetter."
            show: { object: dog }
          - text: "Erst fragen, dann streicheln."
            say: "Kommt dir ein fremder Hund entgegen? Frag immer zuerst den Menschen, dem er gehört, ob du ihn streicheln darfst. Und nach dem Streicheln wäschst du dir die Hände."
            show: { objects: [dog, hand] }
          - text: "Ist ein Tier krank, hilft der Tierarzt."
            say: "Wenn ein Tier krank ist, bringt man es zum Tierarzt oder zur Tierärztin. Ein Haustier braucht dich jeden Tag, auch in den Ferien und auch, wenn du keine Lust hast."
            show: { objects: [vet, cat] }
          - text: "Wusstest du? Katzen schlafen bis zu 16 Stunden am Tag."
            say: "Wusstest du? Katzen schlafen viel, oft zwölf bis sechzehn Stunden am Tag. Darum findest du Minka so oft auf ihrem Lieblingsplatz."
            show: { object: cat }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Gut für Minka oder nicht gut?"
                say: "Was ist gut für Minka, und was nicht? Tippe auf eine Karte und hör, was darauf steht. Leg sie in die richtige Gruppe."
                bins:
                  - { id: gut, show: { text: "gut" }, say: "gut" }
                  - { id: nicht-gut, show: { text: "nicht gut" }, say: "nicht gut" }
                options:
                  - { text: "frisches Wasser geben", bin: gut }
                  - { text: "am Schwanz ziehen", bin: nicht-gut }
                  - { text: "das Katzenklo sauber machen", bin: gut }
                  - { text: "laut wecken", bin: nicht-gut }
                hints:
                  - "Frag bei jeder Karte: Würde Minka das gefallen, und tut es ihr gut?"
                  - "Am Schwanz ziehen tut weh. Wer schläft, möchte nicht geweckt werden."
                  - "Wasser geben und Katzenklo sauber machen sind gut. Ziehen und wecken sind nicht gut."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Was bekommt Minka jeden Tag frisch?"
                say: "Was gibt Ben Minka jeden Tag frisch in die Schale?"
                options: [{ object: water }, { object: cake }, { object: juice }]
                answer: water
                feedback:
                  cake: "Kuchen für die Katze? Das ist nichts für Minka."
                  juice: "Saft ist für Katzen nicht gut. Sie brauchen etwas anderes."
                hints:
                  - "Was trinken alle Tiere?"
                  - "Minka braucht jeden Tag etwas zum Trinken, ohne Zucker."
                  - "Frisches Wasser."
              - id: l2-f3
                type: true_false
                text: "Ben sieht einen fremden Hund. Er streichelt ihn sofort, ohne zu fragen.\n\nIst das gut?"
                say: "Ben sieht einen fremden Hund. Er streichelt ihn sofort, ohne zu fragen. Ist das gut?"
                show: { object: dog }
                answer: false
                hints:
                  - "Weiß Ben, ob der fremde Hund gestreichelt werden möchte?"
                  - "Bei einem fremden Hund fragst du zuerst den Menschen, dem er gehört."
                  - "Nein. Erst fragen, dann streicheln."
              - id: l2-f4
                type: ordering
                text: "Was macht Ben zuerst?"
                say: "Ben hat Minka gestreichelt. Jetzt hat er Hunger. Leg die Sätze in die richtige Reihenfolge. Tippe die Karten der Reihe nach an."
                options: ["Ben isst sein Brot.", "Ben streichelt Minka.", "Ben wäscht sich die Hände."]
                slot_count: 3
                answer: ["Ben streichelt Minka.", "Ben wäscht sich die Hände.", "Ben isst sein Brot."]
                hints:
                  - "Was hat Ben schon gemacht, ganz am Anfang?"
                  - "Nach dem Streicheln wäschst du dir die Hände, bevor du isst."
                  - "Streicheln, Hände waschen, Brot essen."
              - id: l2-f5
                type: multiple_choice
                text: "Minka frisst gerade. Was macht Ben?"
                show: { object: cat }
                options: ["Er lässt sie in Ruhe fressen.", "Er nimmt ihr die Schale weg.", "Er hebt sie hoch."]
                answer: "Er lässt sie in Ruhe fressen."
                hints:
                  - "Möchtest du beim Essen gestört werden?"
                  - "Wenn ein Tier frisst oder schläft, braucht es Ruhe."
                  - "Er lässt sie in Ruhe fressen."
              - id: l2-f6
                type: matching
                text: "Was braucht welches Tier?"
                say: "Tippe auf ein Tier und dann auf das, was du für dieses Tier tust."
                pairs:
                  - left: { object: dog }
                    right: { text: "Gassi gehen" }
                  - left: { object: fish }
                    right: { text: "das Aquarium sauber halten" }
                  - left: { object: cat }
                    right: { text: "das Katzenklo sauber machen" }
                hints:
                  - "Welches Tier lebt im Wasser, welches muss raus?"
                  - "Der Hund braucht viel Bewegung draußen. Der Fisch braucht sauberes Wasser."
                  - "Hund und Gassi, Fisch und Aquarium, Katze und Katzenklo."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Minka ist krank. Wer hilft ihr?"
                options: ["die Tierärztin", "der Bäcker", "die Busfahrerin"]
                answer: "die Tierärztin"
                hints: ["Für kranke Menschen gibt es den Arzt. Und für kranke Tiere?"]
              - id: l2-s2
                type: true_false
                text: "Ein Haustier braucht Pflege nur, wenn Ben Lust hat.\n\nStimmt das?"
                say: "Ein Haustier braucht Pflege nur, wenn Ben Lust hat. Stimmt das?"
                show: { object: cat }
                answer: false
                hints: ["Minka hat jeden Tag Durst und Hunger."]
              - id: l2-s3
                type: sorting
                text: "Gut für den Hund oder nicht gut?"
                say: "Tippe auf eine Karte und hör, was darauf steht. Ist das gut für den Hund oder nicht gut?"
                bins:
                  - { id: gut, show: { text: "gut" }, say: "gut" }
                  - { id: nicht-gut, show: { text: "nicht gut" }, say: "nicht gut" }
                options:
                  - { text: "mit ihm Gassi gehen", bin: gut }
                  - { text: "ihm Schokolade geben", bin: nicht-gut }
                  - { text: "ihn schlafen lassen", bin: gut }
                  - { text: "ihn am Ohr ziehen", bin: nicht-gut }
                hints: ["Schokolade ist für Hunde giftig."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Nach dem Streicheln wäschst du dir die _."
                options: ["Hände", "Haare", "Socken"]
                answer: ["Hände"]
                hints: ["Womit hast du das Tier gestreichelt?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "Welches Tier muss jeden Tag Gassi gehen?"
                say: "Welches Tier muss jeden Tag Gassi gehen?"
                options: [{ object: fish }, { object: dog }, { object: cat }]
                answer: dog
                hints: ["Mit welchem Tier gehst du an der Leine spazieren?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ben will einen fremden Hund streicheln. Was macht er zuerst?"
                show: { object: dog }
                options: ["Er fragt den Menschen, dem der Hund gehört.", "Er rennt zum Hund.", "Er zieht den Hund am Schwanz."]
                answer: "Er fragt den Menschen, dem der Hund gehört."
              - id: l2-n2
                type: true_false
                text: "Hunde dürfen Schokolade fressen.\n\nStimmt das?"
                say: "Hunde dürfen Schokolade fressen. Stimmt das?"
                show: { object: dog }
                answer: false
