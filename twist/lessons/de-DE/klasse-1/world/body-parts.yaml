# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.body-parts
skill: world.body.body-parts
curriculum: de-DE
language: de
title:
  de: Mein Körper
  en: My body
summary: >
  Everyday body parts and what they are for, in the gym with the Klasse
  1b and its teacher Herr Kaya, who calls out "Fass dir an die Nase!".
  Lesson 1 opens with a guess (do you catch a ball with your ears or your
  hands?) and names the three big parts: the Kopf with the face (Augen,
  Ohren, Nase, Mund) and the Hals that carries it, the Rumpf with Bauch in
  front and Rücken behind, and the Gliedmaßen, arms and legs with hands,
  feet, Ellenbogen and Knie. Lesson 2 says what each part is for: seeing,
  hearing, smelling, tasting with the tongue, biting with the teeth,
  holding with the hands, walking and jumping with the legs, and how they
  work together when you play football. It ends with the skill check.
  No explicit visuals: only single everyday body parts from the picture
  bank and text; no body outline, no undress, no intimate parts.
metadata:
  year: klasse-1
  topic: { de: Mein Körper, en: My body }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [Körper, Kopf, Gesicht, Auge, Ohr, Nase, Mund, Zahn, Zunge, Hals, Rumpf, Bauch, Rücken, Arm, Hand, Finger, Ellenbogen, Bein, Knie, Fuß, Gliedmaßen, sehen, hören, riechen, schmecken, greifen] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: name, what: { de: "Körperteile benennen und sagen, wo sie sind", en: "naming body parts and saying where they are" } }
    - { id: groups, what: { de: "Körperteile dem Kopf, dem Rumpf oder den Gliedmaßen zuordnen", en: "placing body parts on the head, the trunk or the limbs" } }
    - { id: use, what: { de: "sagen, wofür ein Körperteil da ist", en: "saying what a body part is for" } }
  misconceptions:
    - id: no-trunk
      what: Has no word for the trunk, or places the belly and back on the head or the legs
      addressed: "lesson 1 Learn names the Rumpf with Bauch and Rücken; l1-f3, l1-f4, l1-s3, l1-s5, l1-c2, l2-w2, l2-c4, l2-c6 and l2-c9"
    - id: wrong-part-for-job
      what: Mixes up which body part does a job, such as hearing with the eyes
      addressed: "lesson 1 Learn opens with the ball and the ears; lesson 2 Learn gives every part its job; l2-f3, l2-n5 and l2-c16"
    - id: hands-feet-not-limbs
      what: Thinks hands and feet are separate from the arms and legs, not part of the Gliedmaßen
      addressed: "lesson 1 Learn says each arm ends in a hand and each leg in a foot; l1-f5, l1-s3, l1-c3 and l2-c12"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Kopf, Rumpf, Arme und Beine", en: "Head, trunk, arms and legs" }
    goal:
      de: "Lerne die Teile deines Körpers kennen. Oben ist der Kopf, in der Mitte der Rumpf, und dazu kommen Arme und Beine."
      en: "Get to know the parts of your body. At the top is the head, in the middle the trunk, and then come the arms and legs."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Womit fängst du einen Ball?"
            say: "Die Klasse 1b ist in der Turnhalle. Herr Kaya wirft dir einen Ball zu. Was glaubst du: Womit fängst du ihn? Mit den Ohren oder mit den Händen?"
            show: { objects: [ear, hand] }
          - text: "Mit den Händen!"
            say: "Mit den Händen natürlich! Mit den Ohren klappt das nicht. Jeder Teil deines Körpers kann etwas anderes. Heute lernst du die Teile kennen."
            show: { object: hand }
          - text: "Der Kopf"
            say: "Ganz oben ist der Kopf. Vorne am Kopf ist das Gesicht mit den Augen, der Nase und dem Mund. An den Seiten sind die Ohren. Der Hals trägt den Kopf."
            show: { object: head }
          - text: "Der Rumpf"
            say: "Unter dem Hals kommt der Rumpf. Vorne am Rumpf ist der Bauch. Hinten am Rumpf ist der Rücken."
          - text: "Arme und Beine"
            say: "Am Rumpf sind die Arme und die Beine. Jeder Arm endet in einer Hand mit Fingern, jedes Bein in einem Fuß. Arme und Beine mit Händen und Füßen heißen zusammen Gliedmaßen."
            show: { objects: [arm, leg] }
          - text: "Ellenbogen und Knie"
            say: "In der Mitte vom Arm ist der Ellenbogen. In der Mitte vom Bein ist das Knie. Dort kannst du Arm und Bein beugen. Probier es aus!"
            show: { objects: [arm, leg] }
          - text: "Wusstest du? Der kleinste Knochen in deinem Körper sitzt im Ohr."
            say: "Wusstest du? Der kleinste Knochen in deinem Körper sitzt in deinem Ohr. Er ist kleiner als ein Reiskorn und hilft dir beim Hören."
            show: { object: ear }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Herr Kaya ruft: „Fass dir an die Nase!“\n\nWo ist die Nase?"
                say: "Herr Kaya ruft: Fass dir an die Nase! Welches Bild zeigt die Nase?"
                options: [{ object: nose }, { object: ear }, { object: foot }]
                answer: nose
                option_audio: false
                hints:
                  - "Die Nase ist mitten im Gesicht."
                  - "Mit der Nase riechst du. Sie sitzt über dem Mund."
                  - "Tippe auf die Nase in der Mitte vom Gesicht."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Am Kopf oder an Arm und Bein?"
                say: "Tippe auf ein Bild und hör das Wort. Ist das am Kopf, oder ist das an einem Arm oder Bein?"
                bins:
                  - { id: kopf, show: { text: "am Kopf" }, say: "am Kopf" }
                  - { id: glied, show: { text: "an Arm oder Bein" }, say: "an Arm oder Bein" }
                options:
                  - { object: eye, bin: kopf }
                  - { object: hand, bin: glied }
                  - { object: ear, bin: kopf }
                  - { object: foot, bin: glied }
                hints:
                  - "Fass dir an jedes Teil. Wo ist es?"
                  - "Augen und Ohren sind im Gesicht und an der Seite vom Kopf. Hand und Fuß sind am Ende von Arm und Bein."
                  - "Auge und Ohr zum Kopf. Hand und Fuß zu Arm oder Bein."
              - id: l1-f3
                type: true_false
                text: "Der Bauch ist am Kopf.\n\nStimmt das?"
                say: "Der Bauch ist am Kopf. Stimmt das?"
                answer: false
                hints:
                  - "Fass dir an den Bauch. Wo ist er?"
                  - "Der Bauch ist unter dem Hals, vorne am Rumpf."
                  - "Nein. Der Bauch ist am Rumpf."
              - id: l1-f4
                type: multiple_choice
                text: "Wie heißt der Teil zwischen dem Hals und den Beinen?"
                options: ["der Rumpf", "das Knie", "der Fuß"]
                answer: "der Rumpf"
                hints:
                  - "Zu diesem Teil gehören der Bauch und der Rücken."
                  - "Unter dem Hals beginnt ein großer Teil. Daran sind Arme und Beine."
                  - "Der Rumpf."
              - id: l1-f5
                type: matching
                text: "Was gehört zusammen?"
                say: "Tippe auf ein Bild und dann auf den Körperteil, an dem es ist."
                pairs:
                  - left: { object: hand }
                    right: { object: arm }
                  - left: { object: foot }
                    right: { object: leg }
                  - left: { object: nose }
                    right: { object: head }
                hints:
                  - "Wo ist deine Hand? Wo ist dein Fuß?"
                  - "Der Arm endet in der Hand, das Bein im Fuß."
                  - "Hand und Arm, Fuß und Bein, Nase und Kopf."
              - id: l1-f6
                type: true_false
                text: "Ole hat zwei Augen und zwei Ohren, aber nur eine Nase.\n\nStimmt das?"
                say: "Ole hat zwei Augen und zwei Ohren, aber nur eine Nase. Stimmt das?"
                show: { objects: [eye, ear, nose] }
                answer: true
                hints:
                  - "Fass dir ins Gesicht und zähle."
                  - "Ein Auge links, ein Auge rechts. Und die Nase?"
                  - "Ja. Zwei Augen, zwei Ohren, eine Nase."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welcher Körperteil ist am Kopf?"
                say: "Welcher Körperteil ist am Kopf?"
                options: [{ object: ear }, { object: hand }, { object: leg }]
                answer: ear
                hints: ["Fass dir an den Kopf. Was spürst du an den Seiten?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "In der Mitte vom Bein ist das _."
                options: ["Knie", "Ohr", "Auge"]
                answer: ["Knie"]
                hints: ["Wo beugst du dein Bein, wenn du dich hinsetzt?"]
              - id: l1-s3
                type: sorting
                text: "Kopf, Rumpf oder Gliedmaßen?"
                say: "Tippe auf eine Karte und hör das Wort. Leg sie zum Kopf, zum Rumpf oder zu den Gliedmaßen."
                bins:
                  - { id: kopf, show: { text: "Kopf" }, say: "Kopf" }
                  - { id: rumpf, show: { text: "Rumpf" }, say: "Rumpf" }
                  - { id: glied, show: { text: "Gliedmaßen" }, say: "Gliedmaßen" }
                options:
                  - { text: "Bauch", bin: rumpf }
                  - { text: "Nase", bin: kopf }
                  - { text: "Bein", bin: glied }
                  - { text: "Rücken", bin: rumpf }
                  - { text: "Mund", bin: kopf }
                  - { text: "Hand", bin: glied }
                hints: ["Gliedmaßen sind Arme und Beine mit Händen und Füßen. Bauch und Rücken gehören zum Rumpf."]
              - id: l1-s4
                type: true_false
                text: "Der Ellenbogen ist in der Mitte vom Arm.\n\nStimmt das?"
                say: "Der Ellenbogen ist in der Mitte vom Arm. Stimmt das?"
                answer: true
                hints: ["Beug deinen Arm. Wo knickt er?"]
              - id: l1-s5
                type: multiple_choice
                text: "Herr Kaya ruft: „Fass dir an den Rücken!“ Wo ist der Rücken?"
                say: "Herr Kaya ruft: Fass dir an den Rücken! Wo ist der Rücken?"
                options: ["hinten am Rumpf", "vorne im Gesicht", "unten am Fuß"]
                answer: "hinten am Rumpf"
                hints: ["Vorne am Rumpf ist der Bauch. Und hinten?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo ist der Mund?"
                say: "Welches Bild zeigt den Mund?"
                options: [{ object: mouth }, { object: eye }, { object: nose }]
                answer: mouth
                option_audio: false
              - id: l1-n2
                type: true_false
                text: "Arme und Beine heißen zusammen Gliedmaßen.\n\nStimmt das?"
                say: "Arme und Beine heißen zusammen Gliedmaßen. Stimmt das?"
                answer: true
              - id: l1-n3
                type: sorting
                text: "Am Kopf oder an Arm und Bein?"
                say: "Tippe auf ein Bild und hör das Wort. Ist das am Kopf, oder ist das an einem Arm oder Bein?"
                bins:
                  - { id: kopf, show: { text: "am Kopf" }, say: "am Kopf" }
                  - { id: glied, show: { text: "an Arm oder Bein" }, say: "an Arm oder Bein" }
                options:
                  - { object: nose, bin: kopf }
                  - { object: foot, bin: glied }
                  - { object: mouth, bin: kopf }
                  - { object: hand, bin: glied }
              - id: l1-n4
                type: multiple_choice
                text: "Was trägt den Kopf?"
                options: ["der Hals", "der Fuß", "das Knie"]
                answer: "der Hals"
              - id: l1-n5
                type: true_false
                text: "Das Knie ist in der Mitte vom Arm.\n\nStimmt das?"
                say: "Das Knie ist in der Mitte vom Arm. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo ist das Ohr?"
            say: "Welches Bild zeigt das Ohr?"
            options: [{ object: ear }, { object: hand }, { object: foot }]
            answer: ear
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Der Bauch ist vorne am Rumpf.\n\nStimmt das?"
            say: "Der Bauch ist vorne am Rumpf. Stimmt das?"
            answer: true
          - id: l1-c3
            type: sorting
            text: "Kopf, Rumpf oder Gliedmaßen?"
            say: "Leg jede Karte zum Kopf, zum Rumpf oder zu den Gliedmaßen."
            bins:
              - { id: kopf, show: { text: "Kopf" }, say: "Kopf" }
              - { id: rumpf, show: { text: "Rumpf" }, say: "Rumpf" }
              - { id: glied, show: { text: "Gliedmaßen" }, say: "Gliedmaßen" }
            options:
              - { text: "Auge", bin: kopf }
              - { text: "Rücken", bin: rumpf }
              - { text: "Fuß", bin: glied }
          - id: l1-c4
            type: multiple_choice
            text: "Wie heißen Arme und Beine zusammen?"
            options: ["Gliedmaßen", "Gesicht", "Rumpf"]
            answer: "Gliedmaßen"
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "In der Mitte vom Arm ist der _."
            options: ["Ellenbogen", "Bauch", "Hals"]
            answer: ["Ellenbogen"]
          - id: l1-c6
            type: true_false
            text: "Die Nase ist am Fuß.\n\nStimmt das?"
            say: "Die Nase ist am Fuß. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Wofür ist das da?", en: "What is it for?" }
    goal:
      de: "Sag, wofür deine Körperteile da sind. Mit der Nase riechst du, mit den Beinen springst du."
      en: "Say what your body parts are for. You smell with your nose and jump with your legs."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Welcher Körperteil ist am Kopf?"
            say: "Welcher Körperteil ist am Kopf?"
            options: [{ object: nose }, { object: leg }, { object: hand }]
            answer: nose
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Der Rücken ist hinten am Rumpf.\n\nStimmt das?"
            say: "Der Rücken ist hinten am Rumpf. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Womit riechst du?"
            say: "Nach dem Turnen riecht es im Flur nach frischen Waffeln. Mmh! Was glaubst du: Womit riechst du das? Mit den Ohren oder mit der Nase?"
            show: { objects: [ear, nose] }
          - text: "Mit der Nase riechst du."
            say: "Mit der Nase riechst du. Mit den Augen siehst du, und mit den Ohren hörst du."
            show: { objects: [nose, eye, ear] }
          - text: "Mund, Zunge und Zähne"
            say: "Mit dem Mund isst, trinkst und sprichst du. Im Mund ist die Zunge. Mit ihr schmeckst du, ob etwas süß oder sauer ist. Mit den Zähnen beißt und kaust du."
            show: { objects: [mouth, tooth] }
          - text: "Mit den Händen greifst du."
            say: "Mit den Händen kannst du greifen, malen, schreiben, klatschen und winken. Deine Finger sind dabei sehr geschickt."
            show: { object: hand }
          - text: "Mit Beinen und Füßen läufst du."
            say: "Mit den Beinen und Füßen stehst, läufst und springst du. Die Knie helfen dir beim Hinsetzen und Springen, weil du sie beugen kannst."
            show: { objects: [leg, foot] }
          - text: "Alle Teile helfen zusammen."
            say: "Beim Fußball helfen alle Teile zusammen: Die Augen sehen den Ball, die Beine laufen hin, und der Fuß schießt. Tor!"
            show: { objects: [eye, foot] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was machst du damit?"
                say: "Tippe auf ein Bild und dann auf das, was du damit machst."
                pairs:
                  - left: { object: eye }
                    right: { text: "sehen", say: "sehen" }
                  - left: { object: ear }
                    right: { text: "hören", say: "hören" }
                  - left: { object: nose }
                    right: { text: "riechen", say: "riechen" }
                hints:
                  - "Halte dir die Augen zu. Was geht dann nicht mehr?"
                  - "Mit geschlossenen Augen siehst du nichts. Mit zugehaltenen Ohren hörst du kaum etwas."
                  - "Auge und sehen, Ohr und hören, Nase und riechen."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Mia malt ein Bild.\n\nWomit hält sie den Stift?"
                say: "Mia malt ein Bild. Womit hält sie den Stift?"
                options: [{ object: hand }, { object: foot }, { object: ear }]
                answer: hand
                feedback:
                  foot: "Mit dem Fuß malen? Das ist ganz schön schwer!"
                hints:
                  - "Womit greifst du Dinge?"
                  - "Mit den Fingern hältst du den Stift fest."
                  - "Mia hält den Stift mit der Hand."
              - id: l2-f3
                type: true_false
                text: "Mit den Ohren kannst du sehen.\n\nStimmt das?"
                say: "Mit den Ohren kannst du sehen. Stimmt das?"
                answer: false
                hints:
                  - "Halte dir die Augen zu. Kannst du jetzt noch sehen?"
                  - "Mit den Ohren hörst du. Gesehen wird mit den Augen."
                  - "Nein. Mit den Ohren hörst du."
              - id: l2-f4
                type: multiple_choice
                text: "Wofür sind die Beine da?"
                options: ["zum Laufen und Springen", "zum Riechen", "zum Hören"]
                answer: "zum Laufen und Springen"
                feedback:
                  "zum Riechen": "Riechende Beine? Gerochen wird mit der Nase!"
                hints:
                  - "Was machst du in der Turnhalle mit deinen Beinen?"
                  - "Mit den Beinen kommst du von einem Ort zum anderen."
                  - "Zum Laufen und Springen."
              - id: l2-f5
                type: sorting
                text: "Mit dem Mund oder mit den Händen?"
                say: "Tippe auf eine Karte und hör zu. Machst du das mit dem Mund oder mit den Händen?"
                bins:
                  - { id: mund, show: { object: mouth }, say: "mit dem Mund" }
                  - { id: hand, show: { object: hand }, say: "mit den Händen" }
                options:
                  - { text: "essen", bin: mund }
                  - { text: "winken", bin: hand }
                  - { text: "sprechen", bin: mund }
                  - { text: "malen", bin: hand }
                hints:
                  - "Probier jede Karte aus: Was bewegt sich dabei?"
                  - "Beim Essen und Sprechen bewegt sich der Mund. Beim Winken und Malen die Hand."
                  - "Essen und sprechen zum Mund. Winken und malen zu den Händen."
              - id: l2-f6
                type: image_multiple_choice
                text: "Draußen bellt ein Hund.\n\nWomit hörst du ihn?"
                say: "Draußen bellt ein Hund. Womit hörst du ihn?"
                options: [{ object: ear }, { object: nose }, { object: hand }]
                answer: ear
                hints:
                  - "Du siehst den Hund nicht, du hörst ihn nur."
                  - "Gehört wird an den Seiten vom Kopf."
                  - "Mit den Ohren."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Es riecht nach Kuchen.\n\nWomit riechst du ihn?"
                say: "Es riecht nach Kuchen. Womit riechst du ihn?"
                options: [{ object: nose }, { object: eye }, { object: foot }]
                answer: nose
                hints: ["Mit welchem Teil im Gesicht schnupperst du?"]
              - id: l2-s2
                type: true_false
                text: "Mit den Zähnen kaust du dein Brot.\n\nStimmt das?"
                say: "Mit den Zähnen kaust du dein Brot. Stimmt das?"
                answer: true
                hints: ["Was machst du mit dem Brot im Mund?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Mit den Augen kann ich _."
                options: ["sehen", "hören", "riechen"]
                answer: ["sehen"]
                hints: ["Was geht nicht mehr, wenn du die Augen zumachst?"]
              - id: l2-s4
                type: matching
                text: "Was machst du damit?"
                say: "Tippe auf ein Bild und dann auf das, was du damit machst."
                pairs:
                  - left: { object: hand }
                    right: { text: "greifen", say: "greifen" }
                  - left: { object: foot }
                    right: { text: "stehen", say: "stehen" }
                  - left: { object: mouth }
                    right: { text: "sprechen", say: "sprechen" }
                hints: ["Womit nimmst du einen Ball? Worauf stehst du?"]
              - id: l2-s5
                type: multiple_choice
                text: "Ole springt hoch. Was beugt er dabei?"
                options: ["die Knie", "die Ohren", "die Nase"]
                answer: "die Knie"
                hints: ["Spring einmal hoch. Was knickt vorher an deinen Beinen ein?"]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Mit den Augen oder mit den Ohren?"
                say: "Tippe auf eine Karte und hör zu. Merkst du das mit den Augen oder mit den Ohren?"
                bins:
                  - { id: augen, show: { object: eye }, say: "mit den Augen" }
                  - { id: ohren, show: { object: ear }, say: "mit den Ohren" }
                options:
                  - { text: "die Farben eines Bildes", bin: augen }
                  - { text: "ein Vogel singt", bin: ohren }
                  - { text: "ein Regenbogen", bin: augen }
                  - { text: "die Klingel läutet", bin: ohren }
              - id: l2-n2
                type: image_multiple_choice
                text: "Lena isst einen Apfel.\n\nWomit beißt sie ein Stück ab?"
                say: "Lena isst einen Apfel. Womit beißt sie ein Stück ab?"
                options: [{ object: tooth }, { object: hand }, { object: ear }]
                answer: tooth
              - id: l2-n3
                type: true_false
                text: "Mit den Händen kannst du schreiben und winken.\n\nStimmt das?"
                say: "Mit den Händen kannst du schreiben und winken. Stimmt das?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Womit schmeckst du, ob etwas süß ist?"
                options: ["mit der Zunge", "mit dem Knie", "mit dem Rücken"]
                answer: "mit der Zunge"
              - id: l2-n5
                type: true_false
                text: "Die Nase ist zum Laufen da.\n\nStimmt das?"
                say: "Die Nase ist zum Laufen da. Stimmt das?"
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: image_multiple_choice
            text: "Wo ist das Auge?"
            say: "Welches Bild zeigt das Auge?"
            options: [{ object: eye }, { object: mouth }, { object: hand }]
            answer: eye
            option_audio: false
          - id: l2-c2
            part: name
            type: image_multiple_choice
            text: "Wo ist der Fuß?"
            say: "Welches Bild zeigt den Fuß?"
