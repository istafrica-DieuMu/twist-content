  - n: 2
    title: { de: "Mit Strom und ohne Strom", en: "With and without electricity" }
    goal:
      de: "Finde heraus, welche Geräte Strom brauchen. Die Lampe braucht Strom, die Schere nicht. Und mit Strom bist du immer vorsichtig."
      en: "Find out which machines need electricity. The lamp needs it, the scissors do not. And you are always careful with electricity."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Womit gießt du die Blumen?"
            say: "Womit gießt du die Blumen?"
            options: [{ object: watering-can }, { object: fridge }, { object: saw }]
            answer: watering-can
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Säge und Messer sind scharf."
            say: "Säge und Messer sind scharf. Stimmt das?"
            show: { objects: [saw, knife] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was fehlt hier?"
            say: "Plötzlich ist es in Opas Küche dunkel. Die Lampe geht aus, und der Kühlschrank brummt nicht mehr. Was glaubst du: Was fehlt?"
            show: { objects: [lamp, fridge] }
          - text: "Der Strom ist weg!"
            say: "Der Strom ist weg! Lampe, Kühlschrank und Wasserkocher brauchen Strom. Sie haben ein Kabel mit einem Stecker. Der Strom kommt aus der Steckdose."
            show: { objects: [lamp, kettle] }
          - text: "Das Handy hat einen Akku."
            say: "Opas Handy geht noch. Es hat einen Akku. Im Akku ist Strom gespeichert. Ist er leer, lädt Opa ihn an der Steckdose auf."
            show: { object: mobile-phone }
          - text: "Ohne Strom"
            say: "Die Schere, die Säge, der Löffel und die Gießkanne brauchen keinen Strom. Sie arbeiten mit der Kraft deiner Hände."
            show: { objects: [scissors, watering-can] }
          - text: "Strom ist gefährlich."
            say: "Strom kann sehr gefährlich sein. Steck nie etwas in die Steckdose. Fass Stecker und Geräte nie mit nassen Händen an. Und zieh einen Stecker immer am Stecker heraus, nie am Kabel."
            show: { object: kettle }
          - text: "Licht aus, wenn du gehst."
            say: "Der Strom ist wieder da. Lea macht das Licht aus, wenn sie aus dem Zimmer geht. So spart sie Strom."
            show: { object: lamp }
          - text: "Wusstest du? Eine alte Glühbirne macht aus dem meisten Strom Wärme."
            say: "Wusstest du? Eine alte Glühbirne macht aus dem meisten Strom Wärme und nur aus wenig Strom Licht. Darum wird sie so heiß. Neue Lampen brauchen viel weniger Strom."
            show: { object: light-bulb }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Mit Strom oder ohne Strom?"
                say: "Hilf Lea. Tippe auf ein Bild und hör das Wort. Braucht es Strom oder nicht?"
                bins:
                  - { id: strom, show: { text: "mit Strom" }, say: "mit Strom" }
                  - { id: ohne, show: { text: "ohne Strom" }, say: "ohne Strom" }
                options:
                  - { object: lamp, bin: strom }
                  - { object: scissors, bin: ohne }
                  - { object: fridge, bin: strom }
                  - { object: watering-can, bin: ohne }
                hints:
                  - "Frag bei jedem Bild: Hat es ein Kabel?"
                  - "Lampe und Kühlschrank gingen aus, als der Strom weg war. Schere und Gießkanne arbeiten mit deinen Händen."
                  - "Lampe und Kühlschrank mit Strom, Schere und Gießkanne ohne Strom."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Opas Handy hat einen Akku. Den lädt er mit Strom auf."
                say: "Opas Handy hat einen Akku. Den lädt er mit Strom auf. Stimmt das?"
                show: { object: mobile-phone }
                answer: true
                hints:
                  - "Was macht Opa, wenn das Handy leer ist?"
