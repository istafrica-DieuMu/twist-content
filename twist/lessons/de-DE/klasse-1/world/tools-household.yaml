              - id: l1-s3
                type: true_false
                text: "Mit der großen Säge arbeitest du nur, wenn ein Erwachsener dabei ist."
                say: "Mit der großen Säge arbeitest du nur, wenn ein Erwachsener dabei ist. Stimmt das?"
                show: { object: saw }
                answer: true
                hints: ["Ist eine Säge scharf?"]
              - id: l1-s4
                type: multiple_choice
                text: "Lea gibt Opa die Schere. Was hält sie Opa hin?"
                say: "Lea gibt Opa die Schere. Was hält sie Opa hin?"
                show: { object: scissors }
                options: ["den Griff", "die Spitze", "die Klinge"]
                answer: "den Griff"
                hints: ["Die Spitze behält Lea in ihrer Hand."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Im Kühlschrank bleibt das Essen _."
                options: ["kalt", "heiß", "laut"]
                answer: ["kalt"]
                hints: ["Im Kühlschrank ist es kühl."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Womit misst Opa die Milch ab?"
                say: "Opa backt einen Kuchen. Womit misst er ab, wie viel Milch hineinkommt?"
                options: [{ object: ladder }, { object: measuring-jug }, { object: saw }]
                answer: measuring-jug
              - id: l1-n2
                type: true_false
                text: "Eine Schere trägst du mit der Spitze nach oben."
                say: "Eine Schere trägst du mit der Spitze nach oben. Stimmt das?"
                show: { object: scissors }
                answer: false
              - id: l1-n3
                type: matching
                text: "Was macht man damit?"
                say: "Tippe auf ein Bild und dann auf seine Arbeit."
                pairs:
                  - left: { object: ladder }
                    right: { text: "hoch hinaufsteigen" }
                  - left: { object: kettle }
                    right: { text: "Wasser heiß machen" }
                  - left: { object: fridge }
                    right: { text: "Essen kalt halten" }
              - id: l1-n4
                type: image_multiple_choice
                text: "Was ist scharf?"
                say: "Was davon ist scharf?"
                options: [{ object: saw }, { object: spoon }, { object: watering-can }]
                answer: saw
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Auf der Waage _ Opa das Mehl."
                options: ["wiegt", "kocht", "sägt"]
                answer: ["wiegt"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Womit sägt man Holz?"
            say: "Womit sägt man Holz?"
