# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.tools-household
skill: world.technology.tools-household
curriculum: de-DE
language: de
title:
  de: Werkzeuge und Geräte
  en: Tools and machines
summary: >
  Lea spends a Saturday with Opa Karl in his workshop and kitchen. Lesson
  1 names everyday tools and machines and what they are for (the saw cuts
  wood, the watering can waters flowers, the fridge keeps food cold, the
  kettle heats water) and how to handle sharp ones safely (carry scissors
  point down, hand them over handle first, use the big saw only with an
  adult). Lesson 2 starts with a power cut: some machines need
  electricity from the socket or a battery, others work with the strength
  of your hands. It adds the safety rules for electricity (nothing in the
  socket, no wet hands, pull the plug, not the cable) and switching the
  light off to save power, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Werkzeuge und Geräte, en: Tools and machines }
  ages: [6-7]
  lesson_minutes: 10
