lessons:
  - n: 1
    title: { de: "Wofür ist das?", en: "What is it for?" }
    goal:
      de: "Sag, wofür ein Werkzeug oder Gerät da ist. Mit der Säge sägt man Holz, im Kühlschrank bleibt das Essen kalt."
      en: "Say what a tool or machine is for. A saw cuts wood, and a fridge keeps food cold."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was macht man damit?"
            say: "Lea besucht Opa Karl in seiner Werkstatt. Opa zeigt ihr ein Werkzeug mit vielen spitzen Zähnen. Was glaubst du: Was macht man damit?"
            show: { object: saw }
          - text: "Mit der Säge sägt man Holz."
            say: "Mit der Säge sägt man Holz. Ihre spitzen Zähne schneiden durch das Brett. Ein Werkzeug hilft uns bei einer Arbeit."
            show: { object: saw }
          - text: "Jedes Werkzeug hat seine Arbeit."
            say: "Mit der Schere schneidest du Papier. Mit der Gießkanne gießt du die Blumen. Mit dem Messbecher misst du ab, wie viel Milch in den Kuchen kommt."
            show: { objects: [scissors, watering-can] }
          - text: "Geräte in der Küche"
            say: "In Opas Küche gibt es viele Geräte. Im Kühlschrank bleibt das Essen kalt. Der Wasserkocher macht Wasser heiß. Auf der Waage wiegt Opa das Mehl."
            show: { objects: [fridge, kettle] }
          - text: "Scharf und spitz: Vorsicht!"
            say: "Säge, Messer und Schere sind scharf oder spitz. Eine Schere trägst du mit der Spitze nach unten. Gibst du sie jemandem, hältst du die Spitze in deiner Hand und reichst ihm den Griff."
            show: { object: scissors }
          - text: "Die große Säge nur mit Opa"
            say: "Mit der großen Säge oder einem scharfen Messer arbeitet Lea nur, wenn Opa dabei ist. Das gilt für alle Kinder."
            show: { object: saw }
          - text: "Wusstest du? Scheren gibt es schon seit mehr als 3000 Jahren."
            say: "Wusstest du? Schon vor mehr als dreitausend Jahren haben Menschen mit Scheren geschnitten, zum Beispiel die Wolle von Schafen."
            show: { object: sheep }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Was macht man damit?"
                say: "Tippe auf ein Werkzeug und dann auf seine Arbeit."
                pairs:
                  - left: { object: saw }
                    right: { text: "Holz sägen" }
                  - left: { object: scissors }
                    right: { text: "Papier schneiden" }
                  - left: { object: watering-can }
                    right: { text: "Blumen gießen" }
                hints:
                  - "Frag bei jedem Bild: Was macht Opa damit?"
                  - "Die Säge hat Zähne für das Holz. In die Gießkanne kommt Wasser."
                  - "Säge und Holz sägen, Schere und Papier schneiden, Gießkanne und Blumen gießen."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Womit schneidest du Papier?"
                say: "Lea will einen Stern aus Papier ausschneiden. Womit schneidet sie?"
                options: [{ object: spoon }, { object: scissors }, { object: bucket }]
                answer: scissors
                feedback:
                  spoon: "Mit einem Löffel schneiden? Das wird ein sehr zerknitterter Stern!"
                hints:
                  - "Was hat zwei scharfe Klingen?"
                  - "Mit dem Löffel isst man, in den Eimer kommt Wasser."
                  - "Mit der Schere."
              - id: l1-f3
                type: true_false
                text: "Im Kühlschrank wird das Essen heiß."
                say: "Im Kühlschrank wird das Essen heiß. Stimmt das?"
                show: { object: fridge }
                answer: false
                hints:
                  - "Wie fühlt sich Milch aus dem Kühlschrank an?"
                  - "Im Kühlschrank bleibt das Essen kalt. Heiß macht der Wasserkocher das Wasser."
                  - "Nein, das stimmt nicht."
              - id: l1-f4
                type: multiple_choice
                text: "Wie trägst du eine Schere?"
                say: "Lea holt die Schere aus der Schublade. Wie trägt sie die Schere?"
                show: { object: scissors }
                options: ["mit der Spitze nach unten", "mit der Spitze nach oben", "offen in der Hosentasche"]
                answer: "mit der Spitze nach unten"
                hints:
                  - "Wohin zeigt die Spitze, damit niemand sich weh tut?"
                  - "Zeigt die Spitze nach unten, kann sie niemanden pieksen."
                  - "Mit der Spitze nach unten."
              - id: l1-f5
                type: image_multiple_choice
                text: "Womit macht Opa das Wasser heiß?"
                say: "Opa will Tee kochen. Womit macht er das Wasser heiß?"
                options: [{ object: fridge }, { object: kettle }, { object: ladder }]
                answer: kettle
                hints:
                  - "Welches Gerät macht Dampf?"
                  - "Der Kühlschrank macht kalt. Der Wasserkocher macht heiß."
                  - "Mit dem Wasserkocher."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Mit der Säge sägt man _."
                options: ["Holz", "Suppe", "Wasser"]
                answer: ["Holz"]
                hints:
                  - "Was hat Opa in seiner Werkstatt gesägt?"
                  - "Die Säge schneidet durch ein Brett."
                  - "Holz"

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Womit gießt Lea die Blumen?"
                say: "Womit gießt Lea die Blumen?"
                options: [{ object: scissors }, { object: fork }, { object: watering-can }]
                answer: watering-can
                hints: ["In welches Werkzeug passt viel Wasser?"]
              - id: l1-s2
                type: matching
                text: "Was macht man damit?"
                say: "Tippe auf ein Bild und dann auf seine Arbeit."
                pairs:
                  - left: { object: toothbrush }
                    right: { text: "Zähne putzen" }
                  - left: { object: spoon }
                    right: { text: "Suppe essen" }
                  - left: { object: kitchen-scale }
                    right: { text: "Mehl wiegen" }
