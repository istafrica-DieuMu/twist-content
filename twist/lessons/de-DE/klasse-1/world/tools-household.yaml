                options: ["Sie zieht am Stecker.", "Sie zieht am Kabel.", "Sie macht es mit nassen Händen."]
                answer: "Sie zieht am Stecker."
                hints:
                  - "Was kann kaputtgehen, wenn man am Kabel zieht?"
                  - "Man zieht immer am Stecker, nie am Kabel. Und die Hände sind trocken."
                  - "Sie zieht am Stecker."
              - id: l2-f4
                type: image_multiple_choice
                text: "Was braucht Strom?"
                say: "Welches Bild zeigt etwas, das Strom braucht?"
                options: [{ object: saw }, { object: kettle }, { object: spoon }]
                answer: kettle
                hints:
                  - "Was hat ein Kabel?"
                  - "Säge und Löffel arbeiten mit deinen Händen."
                  - "Der Wasserkocher."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Der Strom kommt aus der _."
                options: ["Steckdose", "Gießkanne", "Schublade"]
                answer: ["Steckdose"]
                hints:
                  - "Wo steckt der Stecker der Lampe?"
                  - "Das Kabel hat einen Stecker, und der steckt in der Wand."
                  - "Steckdose"
              - id: l2-f6
                type: multiple_choice
                text: "Lea geht aus dem Zimmer. Was macht sie mit dem Licht?"
                say: "Lea geht aus dem Zimmer. Was macht sie mit dem Licht?"
                show: { object: lamp }
                options: ["Sie macht es aus.", "Sie lässt es an.", "Sie macht es heller."]
                answer: "Sie macht es aus."
                hints:
                  - "Braucht ein leeres Zimmer Licht?"
                  - "Wer das Licht ausmacht, spart Strom."
                  - "Sie macht es aus."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was braucht keinen Strom?"
                say: "Welches Bild zeigt etwas, das keinen Strom braucht?"
                options: [{ object: fridge }, { object: lamp }, { object: scissors }]
                answer: scissors
                hints: ["Was arbeitet mit der Kraft deiner Hände?"]
              - id: l2-s2
