  vocabulary: { de: [Werkzeug, Gerät, Säge, Schere, Gießkanne, Messbecher, Waage, Kühlschrank, Wasserkocher, Strom, Steckdose, Stecker, Kabel, Akku, scharf, spitz] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: use, what: { de: "Werkzeuge und Geräte benennen und sagen, wofür man sie braucht", en: "naming tools and machines and saying what they are for" } }
    - { id: safe, what: { de: sicher mit Werkzeugen und Strom umgehen, en: handling tools and electricity safely } }
    - { id: power, what: { de: "sagen, welche Geräte Strom brauchen", en: "saying which machines need electricity" } }
  misconceptions:
    - id: everything-needs-power
      what: Thinks every tool or machine needs electricity, or that none of them do
      addressed: "lesson 2 Learn sets the lamp, fridge and kettle against the scissors, saw and watering can; l2-f1, l2-s1, l2-s3, l2-n1, l2-n2, l2-c15 and l2-c17"
    - id: phone-no-power
      what: Thinks a mobile phone needs no electricity because it has no cable
      addressed: "lesson 2 Learn says the phone has a battery charged at the socket; l2-f2, l2-n4 and l2-c19"
    - id: pull-the-cable
      what: Pulls a plug out by its cable
      addressed: "lesson 2 Learn says pull the plug, never the cable; l2-f3 and l2-c10"
    - id: scissors-point-up
      what: Carries scissors with the point up or hands them over point first
      addressed: "lesson 1 Learn says carry them point down and hand them over handle first; l1-f4, l1-s4, l1-n2, l1-c4 and l2-c8"
