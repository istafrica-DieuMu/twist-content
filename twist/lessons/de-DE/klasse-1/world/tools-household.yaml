              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Steck nie etwas in die _."
                options: ["Steckdose", "Tasche", "Kiste"]
                answer: ["Steckdose"]
                hints: ["Wo kommt der Strom heraus?"]
              - id: l2-s5
                type: multiple_choice
                text: "Warum brummt der Kühlschrank nicht mehr?"
                say: "In Opas Küche ist es dunkel. Warum brummt der Kühlschrank nicht mehr?"
                show: { object: fridge }
                options: ["Der Strom ist weg.", "Er schläft.", "Er ist zu voll."]
                answer: "Der Strom ist weg."
                feedback:
                  "Er schläft.": "Ein Kühlschrank schläft nie. Er braucht Strom!"
                hints: ["Auch die Lampe ist aus. Was brauchen beide?"]

          - support: none
            tasks:
