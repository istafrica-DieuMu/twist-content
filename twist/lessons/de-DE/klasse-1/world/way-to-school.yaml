# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.way-to-school
skill: world.space.way-to-school
curriculum: de-DE
language: de
title:
  de: Mein Schulweg
  en: My way to school
summary: >
  Emma is new at school and walks her way to school with her dad at the
  weekend, so that she can soon walk it on her own. Lesson 1: the safest
  way is the best, even when it is longer; walk on the Gehweg away from
  the road, stop at the kerb, look links, rechts, links, then walk
  briskly straight across, and leave early enough. Lesson 2 finds the
  dangerous places on the way (between parked cars, a driveway, a ball
  rolling into the road, the bus stop) and the safe places to cross
  (traffic light, zebra crossing, school crossing patrol), and ends with
  the skill check.
metadata:
  year: klasse-1
  topic: { de: Sicher unterwegs, en: Getting around safely }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.space.left-right-position]
  also_practises: []
  vocabulary: { de: [Schulweg, Gehweg, Fahrbahn, Bordsteinkante, Fußgänger, Ampel, Zebrastreifen, Schülerlotse, Einfahrt, Bushaltestelle, gefährlich, sicher] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: rules, what: { de: "Regeln für Fußgänger: auf dem Gehweg gehen, am Bordstein anhalten, links, rechts, links schauen, nicht rennen", en: "rules for walking: use the pavement, stop at the kerb, look left, right, left, do not run" } }
    - { id: dangers, what: { de: "gefährliche Stellen auf dem Schulweg erkennen", en: "spotting the dangerous places on the way to school" } }
    - { id: safe-way, what: { de: "den sicheren Weg und sichere Stellen zum Überqueren wählen", en: "choosing the safe way and safe places to cross" } }
  misconceptions:
    - id: shortest-is-best
      what: Thinks the shortest way to school is the best one
      addressed: "lesson 1 Learn opens with the short way without a traffic light and the longer way with one; l1-f1, l1-n1, l1-c1, l2-n1, l2-c15 and l2-c20"
    - id: parked-cars-safe
      what: Thinks it is safe to cross between parked cars because the cars are standing still
      addressed: "lesson 2 Learn opens with the gap between parked cars and says drivers cannot see a child there; l2-f1, l2-f3, l2-s1, l2-n4, l2-n5, l2-c8, l2-c11 and l2-c13"
    - id: run-across
      what: Thinks running across the road is safest, or runs after a ball
      addressed: "lesson 1 Learn says zügig gehen, nicht rennen; lesson 2 Learn shows the ball; l1-f4, l1-s1, l1-c4, l2-f2, l2-n3, l2-c7 and l2-c10"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Emma übt den Schulweg", en: "Emma practises the way to school" }
    goal:
      de: "Lerne, wie du sicher zur Schule gehst. Am Bordstein bleibst du stehen und schaust nach links, nach rechts und wieder nach links."
      en: "Learn how to walk to school safely. At the kerb you stop and look left, right and left again."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was ist links vom Fahrrad?"
            say: "Schau dir die Reihe an. Was ist links vom Fahrrad?"
            show: { objects: [car, bike, lorry] }
            options: [{ object: car }, { object: bike }, { object: lorry }]
            answer: car
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Wer hinter einem Baum steht, ist gut zu sehen.\n\nStimmt das?"
            say: "Wer hinter einem Baum steht, ist gut zu sehen. Stimmt das?"
            show: { object: tree }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Welcher Weg ist der beste?"
            say: "Das ist Emma. Emma ist neu an der Schule. Am Wochenende geht sie mit Papa den Schulweg ab. Es gibt zwei Wege. Der kurze Weg geht über eine große Straße ohne Ampel. Der lange Weg geht über eine Ampel. Was glaubst du: Welcher Weg ist der beste Schulweg?"
            show: { objects: [school, traffic-light] }
          - text: "Der sichere Weg ist der beste."
            say: "Der beste Schulweg ist der sicherste, auch wenn er länger ist. Emma und Papa nehmen den Weg mit der Ampel. Sie üben ihn zusammen, so oft, bis Emma ihn gut kennt."
            show: { object: traffic-light-green }
          - text: "Geh auf dem Gehweg."
            say: "Auf dem Gehweg gehen die Fußgänger. Die Autos fahren auf der Fahrbahn. Emma geht auf dem Gehweg möglichst weit weg von der Fahrbahn."
            show: { text: "Gehweg" }
          - text: "Am Bordstein: Stopp!"
            say: "Die Bordsteinkante ist die Kante zwischen Gehweg und Fahrbahn. Dort bleibt Emma immer stehen, bevor sie über die Straße geht."
            show: { text: "Stopp!" }
          - text: "Links, rechts, links schauen."
            say: "Dann schaut Emma nach links, nach rechts und noch einmal nach links. Zuerst links, denn von links kommen die Autos, die auf deiner Seite der Straße fahren. Erst wenn kein Auto kommt, geht sie zügig geradeaus hinüber. Sie rennt nicht."
            show: { object: car }
          - text: "Früh genug losgehen."
            say: "Emma geht morgens früh genug los. Wer in Eile ist, passt nicht so gut auf."
            show: { object: clock }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Schulweg ist der beste?"
                options: ["der sicherste Weg", "der kürzeste Weg", "der Weg mit den meisten Pfützen"]
                answer: "der sicherste Weg"
                feedback:
                  "der kürzeste Weg": "Ein kurzer Weg über eine gefährliche Straße ist nicht der beste."
                  "der Weg mit den meisten Pfützen": "Das macht Spaß, aber dann kommst du nass in der Schule an!"
                hints:
                  - "Was ist auf dem Schulweg das Wichtigste?"
                  - "Emma und Papa nehmen den langen Weg mit der Ampel. Warum?"
                  - "Der sicherste Weg."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Emma bleibt an der Bordsteinkante stehen, bevor sie über die Straße geht.\n\nIst das richtig?"
                say: "Emma bleibt an der Bordsteinkante stehen, bevor sie über die Straße geht. Ist das richtig?"
                answer: true
                hints:
                  - "Was heißt das Wort Stopp?"
                  - "Die Bordsteinkante ist die Kante zur Fahrbahn. Dort hält Emma an."
                  - "Ja. Am Bordstein bleibt Emma stehen."
              - id: l1-f3
                type: ordering
                text: "Wie geht Emma über die Straße?"
                say: "Emma will über die Straße gehen. Leg die Sätze in die richtige Reihenfolge. Tippe die Karten der Reihe nach an."
                options: ["Emma geht zügig über die Straße.", "Emma bleibt am Bordstein stehen.", "Emma schaut links, rechts, links."]
                slot_count: 3
                answer: ["Emma bleibt am Bordstein stehen.", "Emma schaut links, rechts, links.", "Emma geht zügig über die Straße."]
                hints:
                  - "Was macht Emma, bevor sie schaut?"
                  - "Zuerst bleibt sie stehen, dann schaut sie. Und zum Schluss?"
                  - "Stehen bleiben, schauen, gehen."
              - id: l1-f4
                type: sorting
                text: "Richtig oder falsch?"
                say: "Tippe auf eine Karte und hör, was darauf steht. Ist das auf dem Schulweg richtig oder falsch?"
                bins:
                  - { id: richtig, show: { text: "richtig" }, say: "richtig" }
                  - { id: falsch, show: { text: "falsch" }, say: "falsch" }
                options:
                  - { text: "auf dem Gehweg gehen", bin: richtig }
                  - { text: "auf der Straße Fangen spielen", bin: falsch }
                  - { text: "am Bordstein stehen bleiben", bin: richtig }
                  - { text: "über die Straße rennen", bin: falsch }
                hints:
                  - "Frag bei jeder Karte: Bin ich dabei sicher?"
                  - "Auf der Straße fahren Autos. Wer rennt, kann stolpern und sieht weniger."
                  - "Gehweg und Bordstein zu richtig, Fangen und Rennen zu falsch."
              - id: l1-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Emma schaut nach links, nach rechts und noch einmal nach _."
                options: ["links", "rechts", "oben"]
                answer: ["links"]
                hints:
                  - "Emma schaut zweimal in dieselbe Richtung."
                  - "Zuerst schaut sie nach links. Und am Ende noch einmal ..."
                  - "Links."
              - id: l1-f6
                type: image_multiple_choice
                text: "Was hilft Emma an der großen Straße?"
                say: "Was hilft Emma, sicher über die große Straße zu kommen?"
                options: [{ object: kite }, { object: traffic-light }, { object: ball }]
                answer: traffic-light
                hints:
                  - "Was sagt dir, wann du gehen darfst?"
                  - "Emma und Papa nehmen den Weg, wo es so etwas gibt."
                  - "Die Ampel."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Wenn Emma spät dran ist, darf sie über die Straße rennen.\n\nStimmt das?"
                say: "Wenn Emma spät dran ist, darf sie über die Straße rennen. Stimmt das?"
                answer: false
                hints: ["Wer rennt, kann stolpern und passt weniger auf."]
              - id: l1-s2
                type: multiple_choice
                text: "Wo geht Emma auf dem Gehweg?"
                options: ["weit weg von der Fahrbahn", "ganz nah an der Fahrbahn", "auf der Bordsteinkante"]
                answer: "weit weg von der Fahrbahn"
                hints: ["Auf der Fahrbahn fahren die Autos."]
              - id: l1-s3
                type: sorting
                text: "Gut oder gefährlich?"
                say: "Tippe auf eine Karte und hör, was darauf steht. Ist das gut oder gefährlich?"
                bins:
                  - { id: gut, show: { text: "gut" }, say: "gut" }
                  - { id: gefaehrlich, show: { text: "gefährlich" }, say: "gefährlich" }
                options:
                  - { text: "früh genug losgehen", bin: gut }
                  - { text: "auf der Bordsteinkante balancieren", bin: gefaehrlich }
                  - { text: "den Weg mit Papa üben", bin: gut }
                  - { text: "ohne zu schauen über die Straße laufen", bin: gefaehrlich }
                hints: ["Wer auf der Kante balanciert, kann auf die Fahrbahn fallen."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Fußgänger gehen auf dem _."
                options: ["Gehweg", "Dach", "Radweg"]
                answer: ["Gehweg"]
                feedback:
                  Dach: "Auf dem Dach? Da sitzen nur die Vögel!"
                  Radweg: "Der Radweg ist für Fahrräder. Fußgänger gehen daneben."
                hints: ["Das Wort hat gehen in sich."]
              - id: l1-s5
                type: multiple_choice
                text: "Warum schaut Emma zuerst nach links?"
                options: ["Von links kommen zuerst die Autos auf ihrer Straßenseite.", "Links ist es schöner.", "Links ist die Schule."]
                answer: "Von links kommen zuerst die Autos auf ihrer Straßenseite."
                hints: ["Welche Autos fahren ganz nah an Emmas Bordstein vorbei?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Der kürzeste Weg zur Schule ist immer der beste.\n\nStimmt das?"
                say: "Der kürzeste Weg zur Schule ist immer der beste. Stimmt das?"
                answer: false
              - id: l1-n2
                type: ordering
                text: "Wohin schaut Emma? Leg die Karten in die richtige Reihenfolge."
                say: "Emma steht am Bordstein. Wohin schaut sie? Leg die Karten in die richtige Reihenfolge."
                options: ["Emma schaut nach rechts.", "Emma schaut noch einmal nach links.", "Emma schaut nach links."]
                slot_count: 3
                answer: ["Emma schaut nach links.", "Emma schaut nach rechts.", "Emma schaut noch einmal nach links."]
              - id: l1-n3
                type: multiple_choice
                text: "Emma kommt an die Bordsteinkante. Was macht sie jetzt?"
                options: ["Sie bleibt stehen und schaut.", "Sie rennt los.", "Sie macht die Augen zu."]
                answer: "Sie bleibt stehen und schaut."
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Emma geht früh genug los. Dann ist sie nicht in _."
                options: ["Eile", "Schule", "Jacke"]
                answer: ["Eile"]
              - id: l1-n5
                type: sorting
                text: "Richtig oder falsch?"
                say: "Tippe auf eine Karte und hör, was darauf steht. Ist das richtig oder falsch?"
                bins:
                  - { id: richtig, show: { text: "richtig" }, say: "richtig" }
                  - { id: falsch, show: { text: "falsch" }, say: "falsch" }
                options:
                  - { text: "zügig geradeaus über die Straße gehen", bin: richtig }
                  - { text: "auf der Fahrbahn laufen", bin: falsch }
                  - { text: "weit weg von der Fahrbahn gehen", bin: richtig }
                  - { text: "auf der Straße Ball spielen", bin: falsch }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist der beste Schulweg?"
            options: ["der sicherste", "der kürzeste"]
            answer: "der sicherste"
          - id: l1-c2
            type: true_false
            text: "Am Bordstein bleibt Emma stehen.\n\nStimmt das?"
            say: "Am Bordstein bleibt Emma stehen. Stimmt das?"
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Emma geht auf dem _ zur Schule."
            options: ["Gehweg", "Radweg"]
            answer: ["Gehweg"]
          - id: l1-c4
            type: true_false
            text: "Emma rennt schnell über die Straße.\n\nIst das richtig?"
            say: "Emma rennt schnell über die Straße. Ist das richtig?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Wohin schaut Emma am Bordstein zuerst?"
            options: ["nach links", "nach rechts", "nach oben"]
            answer: "nach links"
          - id: l1-c6
            type: image_multiple_choice
            text: "Was hilft dir an einer großen Straße?"
            say: "Was hilft dir, sicher über eine große Straße zu kommen?"
            options: [{ object: teddy }, { object: kite }, { object: traffic-light }]
            answer: traffic-light

  - n: 2
    title: { de: "Achtung, gefährliche Stelle!", en: "Watch out, danger!" }
    goal:
      de: "Erkenne gefährliche Stellen auf dem Schulweg. Zwischen parkenden Autos sieht dich kein Autofahrer."
      en: "Spot the dangerous places on the way to school. Between parked cars no driver can see you."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo bleibt Emma stehen, bevor sie über die Straße geht?"
            options: ["an der Bordsteinkante", "mitten auf der Straße"]
            answer: "an der Bordsteinkante"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Fußgänger gehen auf dem Gehweg.\n\nStimmt das?"
            say: "Fußgänger gehen auf dem Gehweg. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ist das eine gute Stelle?"
            say: "Emma und Papa gehen weiter. Am Straßenrand parken viele Autos dicht hintereinander. Emma will zwischen zwei Autos auf die Straße gehen. Was glaubst du: Ist das eine gute Stelle?"
            show: { objects: [car, lorry] }
          - text: "Zwischen parkenden Autos: gefährlich!"
            say: "Nein! Zwischen parkenden Autos siehst du die fahrenden Autos nicht. Und die Fahrer sehen dich auch nicht, denn du bist kleiner als die Autos. Emma geht weiter, bis sie gut sehen kann und gut gesehen wird."
            show: { objects: [car, lorry] }
          - text: "Achtung, Einfahrt!"
            say: "An einer Einfahrt kann plötzlich ein Auto aus dem Hof oder aus der Garage fahren. Hier geht Emma langsam und schaut genau hin."
            show: { object: car }
          - text: "Der Ball rollt auf die Straße."
            say: "Ein Ball rollt auf die Straße. Emma läuft nicht hinterher! Sie bleibt auf dem Gehweg und holt einen Erwachsenen."
            show: { object: ball }
          - text: "An der Bushaltestelle"
            say: "An der Bushaltestelle wartet Emma mit Abstand zur Bordsteinkante. Sie drängelt nicht und schubst nicht."
            show: { object: sign-bus-stop }
          - text: "Hier gehst du sicher hinüber."
            say: "Über eine große Straße geht Emma an der Ampel, am Zebrastreifen oder dort, wo ein Schülerlotse den Kindern hilft."
            show: { object: traffic-light-green }
          - text: "Wusstest du? Der Zebrastreifen heißt so wegen seiner Streifen."
            say: "Wusstest du? Der Zebrastreifen heißt so, weil seine weißen Streifen auf der Straße aussehen wie die Streifen eines Zebras."
            show: { object: zebra }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Gefährlich oder sicher?"
                say: "Emma und Papa schauen sich die Stellen auf dem Schulweg an. Tippe auf eine Karte und hör, was darauf steht. Ist das eine gefährliche Stelle oder eine sichere Stelle zum Überqueren?"
                bins:
                  - { id: gefaehrlich, show: { text: "gefährlich" }, say: "gefährlich" }
                  - { id: sicher, show: { text: "sicher" }, say: "sicher" }
                options:
                  - { text: "zwischen parkenden Autos", bin: gefaehrlich }
                  - { text: "an der Ampel", bin: sicher }
                  - { text: "an einer Einfahrt", bin: gefaehrlich }
                  - { text: "am Zebrastreifen", bin: sicher }
                hints:
                  - "Frag bei jeder Karte: Kann ich hier gut sehen, und sehen mich die Autofahrer?"
                  - "Zwischen parkenden Autos sieht dich niemand. Aus einer Einfahrt kann ein Auto kommen."
                  - "Parkende Autos und Einfahrt zu gefährlich, Ampel und Zebrastreifen zu sicher."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Der Ball rollt auf die Straße. Emma rennt schnell hinterher.\n\nIst das richtig?"
                say: "Der Ball rollt auf die Straße. Emma rennt schnell hinterher. Ist das richtig?"
                show: { object: ball }
                answer: false
                hints:
                  - "Wer einem Ball hinterherrennt, schaut nur auf den Ball."
                  - "Emma bleibt auf dem Gehweg. Wen holt sie?"
                  - "Nein. Emma holt einen Erwachsenen."
              - id: l2-f3
                type: multiple_choice
                text: "Warum ist es zwischen parkenden Autos gefährlich?"
                show: { objects: [car, lorry] }
                options: ["Die Autofahrer sehen Emma nicht.", "Die Autos sind schmutzig.", "Dort ist es zu laut."]
                answer: "Die Autofahrer sehen Emma nicht."
                hints:
                  - "Wer ist größer, Emma oder die Autos?"
                  - "Die parkenden Autos verdecken Emma."
                  - "Die Autofahrer sehen Emma nicht."
              - id: l2-f4
                type: image_multiple_choice
                text: "Der Ball ist auf der Straße. Wen holt Emma?"
                say: "Emmas Ball ist auf die Straße gerollt. Wen holt Emma?"
                options: [{ object: teddy }, { object: dad }, { object: cat }]
                answer: dad
                feedback:
                  teddy: "Der Teddy ist lieb, aber er kann den Ball nicht holen."
                  cat: "Die Katze holt keinen Ball, schon gar nicht von der Straße!"
                hints:
                  - "Wer kann gut auf die Autos achten?"
                  - "Emma holt einen Erwachsenen."
                  - "Papa."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Aus einer _ kann plötzlich ein Auto herausfahren."
                options: ["Einfahrt", "Ampel", "Bank"]
                answer: ["Einfahrt"]
                hints:
                  - "Durch diese Stelle fahren Autos in den Hof oder in die Garage."
                  - "Ein Auto kommt aus dem Hof heraus. Wie heißt die Stelle?"
                  - "Einfahrt."
              - id: l2-f6
                type: multiple_choice
                text: "Emma wartet an der Bushaltestelle. Was macht sie richtig?"
                show: { object: sign-bus-stop }
                options: ["Sie wartet mit Abstand zur Bordsteinkante.", "Sie drängelt nach vorn.", "Sie spielt Fangen am Bordstein."]
                answer: "Sie wartet mit Abstand zur Bordsteinkante."
                hints:
                  - "Der Bus fährt ganz nah an den Bordstein heran."
                  - "Wer nah an der Kante steht oder drängelt, kann auf die Fahrbahn stolpern."
                  - "Sie wartet mit Abstand zur Bordsteinkante."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Zwischen zwei parkenden Autos sieht Emma gut, ob ein Auto kommt.\n\nStimmt das?"
                say: "Zwischen zwei parkenden Autos sieht Emma gut, ob ein Auto kommt. Stimmt das?"
                answer: false
                hints: ["Die parkenden Autos sind größer als Emma."]
              - id: l2-s2
                type: sorting
                text: "Gefährlich oder sicher?"
                say: "Tippe auf eine Karte und hör, was darauf steht. Ist das gefährlich oder sicher?"
                bins:
                  - { id: gefaehrlich, show: { text: "gefährlich" }, say: "gefährlich" }
                  - { id: sicher, show: { text: "sicher" }, say: "sicher" }
                options:
                  - { text: "mit dem Schülerlotsen hinübergehen", bin: sicher }
                  - { text: "hinter einem Lastwagen hervorlaufen", bin: gefaehrlich }
                  - { text: "bei Grün an der Ampel gehen", bin: sicher }
                  - { text: "dem Ball auf die Straße nachrennen", bin: gefaehrlich }
                hints: ["Hinter einem Lastwagen sieht dich kein Autofahrer."]
              - id: l2-s3
                type: multiple_choice
                text: "Wo geht Emma über die große Straße?"
                options: ["an der Ampel", "zwischen den parkenden Autos", "hinter dem Bus"]
                answer: "an der Ampel"
                hints: ["Wo kann Emma gut sehen und wird gut gesehen?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "An der Bushaltestelle wartet Emma mit _ zur Bordsteinkante."
                options: ["Abstand", "Schwung", "Ball"]
                answer: ["Abstand"]
                hints: ["Emma steht nicht ganz vorn an der Kante."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Auto steht in der Einfahrt, und der Motor brummt. Was macht Emma?"
                show: { object: car }
                options: ["Sie bleibt stehen und passt auf.", "Sie rennt schnell vorbei, ohne zu schauen.", "Sie klopft ans Auto."]
                answer: "Sie bleibt stehen und passt auf."
                hints: ["Das Auto kann jeden Moment losfahren."]

          - support: none
            tasks:
              - id: l2-n1
