# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.feelings-needs
skill: world.society.feelings-needs
curriculum: de-DE
language: de
title:
  de: Wie geht es dir?
  en: How are you feeling?
summary: >
  Feelings and needs in the Klasse 1b. Juna is new in the class and stands
  at the door with big eyes; the child guesses how she feels. Lesson 1
  reads feelings in other people from the face and from what happened,
  names their own, and learns that every feeling is all right and that
  feelings change (Juna laughs once Mia asks her to play). Lesson 2 asks
  what someone needs: food when hungry, comfort when sad, rest when
  tired, someone who is there when scared, a pause to calm down when
  angry, and asking "Was brauchst du?" when unsure. It ends with the
  skill check. Builds on the five feeling words from Deutsch.
metadata:
  year: klasse-1
  topic: { de: Ich und die anderen, en: Me and others }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.speaking.feelings]
  also_practises: [lit-de.speaking.feelings]
  vocabulary: { de: [Gefühl, fröhlich, traurig, wütend, ängstlich, müde, brauchen, Trost, trösten, Ruhe, Pause, beruhigen, helfen] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: name, what: { de: "Gefühle bei mir und bei anderen erkennen und benennen", en: "recognising and naming my own feelings and other people's" } }
    - { id: need, what: { de: "sagen, was jemand braucht, der hungrig, müde, traurig, ängstlich oder wütend ist", en: "saying what someone needs who is hungry, tired, sad, scared or angry" } }
    - { id: care, what: { de: "Rücksicht nehmen: helfen, trösten, nachfragen und Wut mit Worten sagen", en: "taking care of others: helping, comforting, asking, and putting anger into words" } }
  misconceptions:
    - id: bad-feelings
      what: Thinks anger or fear are bad feelings that one must not have
      addressed: "lesson 1 Learn says Alle Gefühle sind in Ordnung; l1-f6, l2-w2 and l2-c18 (say the anger in words)"
    - id: feelings-fixed
      what: Thinks a feeling stays the same, so Juna will always be scared
      addressed: "lesson 1 Learn ends with Juna laughing, Gefühle können sich ändern; l1-s3, l1-s4, l1-c5 and l2-c6"
    - id: hit-back
      what: Thinks shouting back, hitting or laughing helps when someone is angry or sad
      addressed: "lesson 2 Learn shows comfort and a pause to calm down; l2-f3 (feedback), l2-s3, l2-n1, l2-n4, l2-c15, l2-c17 and l2-c18"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wie geht es Juna?", en: "How is Juna feeling?" }
    goal:
      de: "Find heraus, wie sich jemand fühlt. Schau auf das Gesicht und hör, was passiert ist, so wie bei Juna an ihrem ersten Tag."
      en: "Find out how someone feels. Look at their face and listen to what happened, like Juna on her first day."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wo ist das traurige Kind?"
            say: "Wo ist das traurige Kind?"
            options: [{ object: happy }, { object: sad }, { object: tired }]
            answer: sad
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist das Kind fröhlich?"
            say: "Schau dir das Gesicht an. Ist das Kind fröhlich?"
            show: { object: angry }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie geht es Juna?"
            say: "Heute kommt ein neues Kind in die Klasse 1b. Es heißt Juna. Juna bleibt an der Tür stehen. Sie macht große Augen und hält die Hände an die Backen. Was glaubst du: Wie geht es Juna?"
            show: { object: scared }
          - text: "Juna hat ein bisschen Angst."
            say: "Juna ist ängstlich. Sie kennt hier noch niemanden. Ihr Gesicht verrät es: große Augen, die Hände an den Backen. So kannst du bei anderen sehen, wie es ihnen geht."
            show: { object: scared }
          - text: "Hör auch zu, was passiert ist."
            say: "Paul hat seine Brotdose zu Hause vergessen. Er hat Hunger und schaut auf den Boden. Paul ist traurig. Wenn du hörst, was passiert ist, weißt du noch besser, wie sich jemand fühlt."
            show: { object: sad }
          - text: "Und du? Wie geht es dir?"
            say: "Auch du hast Gefühle. Morgens bist du vielleicht müde, in der Pause fröhlich. Frag dich: Wie geht es mir gerade? Dann kannst du es sagen: Ich bin müde. Oder: Ich bin fröhlich."
            show: { objects: [tired, happy] }
          - text: "Alle Gefühle sind in Ordnung."
            say: "Fröhlich, traurig, wütend, ängstlich oder müde: Alle Gefühle sind in Ordnung. Jeder Mensch hat sie. Wichtig ist, dass du sagst, wie es dir geht, und dass du niemandem wehtust."
            show: { objects: [angry, sad] }
          - text: "Wusstest du? Wenn du Angst hast, schlägt dein Herz schneller."
            say: "Wusstest du? Wenn du Angst hast oder dich sehr aufregst, schlägt dein Herz schneller. Dein Körper macht sich bereit, schnell wegzulaufen. Wenn du dich beruhigst, schlägt es wieder langsamer."
            show: { object: heart }
          - text: "Gefühle können sich ändern."
            say: "In der Pause fragt Mia: Juna, spielst du mit? Jetzt lacht Juna. Vorhin hatte sie Angst, jetzt ist sie fröhlich. Gefühle können sich ändern."
            show: { objects: [scared, happy] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Ole fällt auf dem Schulhof hin. Sein Knie tut weh, und er weint.\n\nWie fühlt sich Ole?"
                say: "Ole fällt auf dem Schulhof hin. Sein Knie tut weh, und er weint. Wie fühlt sich Ole?"
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad
                hints:
                  - "Hör genau zu: Was macht Ole?"
                  - "Ole weint. Wer weint, lacht nicht."
                  - "Ole ist traurig."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Mia lacht und hüpft. Sie darf heute die Blumen gießen.\n\nIst Mia wütend?"
                say: "Mia lacht und hüpft. Sie darf heute die Blumen gießen. Ist Mia wütend?"
                show: { object: happy }
                answer: false
                hints:
                  - "Schau dir Mias Gesicht an."
                  - "Mia lacht und hüpft. Freut sie sich oder ärgert sie sich?"
                  - "Nein. Mia ist fröhlich."
              - id: l1-f3
                type: sorting
                text: "Fröhlich oder traurig?"
                say: "Wie fühlst du dich dabei? Tippe auf eine Karte und hör zu. Leg sie zum fröhlichen oder zum traurigen Kind."
                bins:
                  - { id: froh, show: { object: happy }, say: "fröhlich" }
                  - { id: traurig, show: { object: sad }, say: "traurig" }
                options:
                  - { text: "Du bekommst ein Geschenk.", bin: froh }
                  - { text: "Dein Eis fällt auf den Boden.", bin: traurig }
                  - { text: "Ihr spielt dein Lieblingsspiel.", bin: froh }
                  - { text: "Deine beste Freundin zieht weg.", bin: traurig }
                hints:
                  - "Stell dir jede Karte vor. Würdest du lachen oder weinen?"
                  - "Ein Geschenk und dein Lieblingsspiel machen Spaß. Ein Eis auf dem Boden ist schade."
                  - "Geschenk und Lieblingsspiel zum fröhlichen Kind. Eis und Freundin zum traurigen Kind."
              - id: l1-f4
                type: image_multiple_choice
                text: "Ben hat lange an einem Turm gebaut. Lars wirft ihn mit Absicht um.\n\nWie fühlt sich Ben?"
                say: "Ben hat lange an einem Turm gebaut. Lars wirft ihn mit Absicht um. Wie fühlt sich Ben?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
                feedback:
                  happy: "Freust du dich, wenn jemand deinen Turm umwirft? Ben bestimmt nicht!"
                hints:
                  - "Wie würdest du dich fühlen, wenn das mit deinem Turm passiert?"
                  - "Lars hat es mit Absicht gemacht. Ben ärgert sich sehr."
                  - "Ben ist wütend."
              - id: l1-f5
                type: multiple_choice
                text: "Woran siehst du, dass Juna Angst hat?"
                show: { object: scared }
                options: ["Sie macht große Augen.", "Sie lacht laut.", "Sie gähnt."]
                answer: "Sie macht große Augen."
                feedback:
                  "Sie gähnt.": "Wer gähnt, ist müde. Juna gähnt nicht."
                hints:
                  - "Schau dir Junas Augen an."
                  - "Wer Angst hat, macht die Augen ganz weit auf."
                  - "Sie macht große Augen."
              - id: l1-f6
                type: true_false
                text: "Lea ist wütend. Sie sagt: „Ich bin wütend, weil du mein Bild zerknickt hast.“\n\nDarf Lea wütend sein?"
                say: "Lea ist wütend. Sie sagt: Ich bin wütend, weil du mein Bild zerknickt hast. Darf Lea wütend sein?"
                show: { object: angry }
                answer: true
                hints:
                  - "Welche Gefühle sind in Ordnung?"
                  - "Alle Gefühle sind in Ordnung. Lea sagt mit Worten, was los ist, und tut niemandem weh."
                  - "Ja. Lea darf wütend sein."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Tim hat den ganzen Tag im Schwimmbad getobt. Jetzt ist es Abend, und seine Augen fallen zu.\n\nWie fühlt sich Tim?"
                say: "Tim hat den ganzen Tag im Schwimmbad getobt. Jetzt ist es Abend, und seine Augen fallen zu. Wie fühlt sich Tim?"
                options: [{ object: tired }, { object: angry }, { object: scared }]
                answer: tired
                hints: ["Wann fallen dir die Augen zu?"]
              - id: l1-s2
                type: matching
                text: "Wie fühlst du dich dabei?"
                say: "Tippe auf eine Karte und dann auf das Gesicht, das dazu passt."
                pairs:
                  - left: { text: "In der Nacht donnert es laut.", say: "In der Nacht donnert es laut." }
                    right: { object: scared }
                  - left: { text: "Du hast Geburtstag.", say: "Du hast Geburtstag." }
                    right: { object: happy }
                  - left: { text: "Jemand nimmt dir den Ball weg.", say: "Jemand nimmt dir den Ball weg." }
                    right: { object: angry }
                hints: ["Stell dir jede Karte vor: Wie sieht dann dein Gesicht aus?"]
              - id: l1-s3
                type: true_false
                text: "Ein Gefühl bleibt immer gleich.\n\nStimmt das?"
                say: "Ein Gefühl bleibt immer gleich. Stimmt das?"
                answer: false
                hints: ["Denk an Juna: Erst hatte sie Angst, und in der Pause?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Juna spielt jetzt mit Mia Fangen. Sie lacht.\n\nWie fühlt sich Juna jetzt?"
                say: "Juna spielt jetzt mit Mia Fangen. Sie lacht. Wie fühlt sich Juna jetzt?"
                options: [{ object: happy }, { object: scared }, { object: sad }]
                answer: happy
                hints: ["Hör auf das Wort jetzt. Was macht Juna gerade?"]
              - id: l1-s5
                type: multiple_choice
                text: "Du bist müde. Was kannst du sagen?"
                show: { object: tired }
                options: ["Ich bin müde.", "Ich bin wütend.", "Du bist doof."]
                answer: "Ich bin müde."
                feedback:
                  "Du bist doof.": "Das ist gemein, und es sagt nicht, wie es dir geht."
                hints: ["Sag, wie es dir geht. Fang mit „Ich bin“ an."]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Ängstlich oder fröhlich?"
                say: "Wie fühlst du dich dabei? Tippe auf eine Karte und hör zu. Leg sie zum ängstlichen oder zum fröhlichen Kind."
                bins:
                  - { id: angst, show: { object: scared }, say: "ängstlich" }
                  - { id: froh, show: { object: happy }, say: "fröhlich" }
                options:
                  - { text: "Ein großer Hund bellt dich laut an.", bin: angst }
                  - { text: "Oma kommt zu Besuch.", bin: froh }
                  - { text: "Du bist allein im dunklen Keller.", bin: angst }
                  - { text: "Du darfst ins Schwimmbad.", bin: froh }
              - id: l1-n2
                type: image_multiple_choice
                text: "Alle Kinder sind schon abgeholt. Nur Nora wartet noch. Wo bleibt ihr Papa? Nora schaut mit großen Augen zur Tür.\n\nWie fühlt sich Nora?"
                say: "Alle Kinder sind schon abgeholt. Nur Nora wartet noch. Wo bleibt ihr Papa? Nora schaut mit großen Augen zur Tür. Wie fühlt sich Nora?"
                options: [{ object: scared }, { object: happy }, { object: tired }]
                answer: scared
              - id: l1-n3
                type: true_false
                text: "Lukas hat ein Tor geschossen. Er jubelt.\n\nIst Lukas fröhlich?"
                say: "Lukas hat ein Tor geschossen. Er jubelt. Ist Lukas fröhlich?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Wie merkst du, wie sich jemand fühlt?"
                options: ["Ich schaue mir das Gesicht an.", "Ich schaue auf die Schuhe.", "Ich zähle bis zehn."]
                answer: "Ich schaue mir das Gesicht an."
              - id: l1-n5
                type: image_multiple_choice
                text: "Dein Bild ist im Regen nass geworden. Die Farben sind ganz verlaufen.\n\nWie fühlst du dich?"
                say: "Dein Bild ist im Regen nass geworden. Die Farben sind ganz verlaufen. Wie fühlst du dich?"
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Jonas hat seine Jacke verloren. Er sucht überall und weint.\n\nWie fühlt sich Jonas?"
            say: "Jonas hat seine Jacke verloren. Er sucht überall und weint. Wie fühlt sich Jonas?"
            options: [{ object: sad }, { object: happy }, { object: tired }]
            answer: sad
          - id: l1-c2
            type: true_false
            text: "Emma gähnt und reibt sich die Augen.\n\nIst Emma müde?"
            say: "Emma gähnt und reibt sich die Augen. Ist Emma müde?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Satz sagt, wie du dich fühlst?"
            options: ["Ich bin traurig.", "Ich habe einen Ball.", "Ich bin sieben."]
            answer: "Ich bin traurig."
          - id: l1-c4
            type: sorting
            text: "Fröhlich oder wütend?"
            say: "Wie fühlst du dich dabei? Leg jede Karte zum fröhlichen oder zum wütenden Kind."
            bins:
              - { id: froh, show: { object: happy }, say: "fröhlich" }
              - { id: wut, show: { object: angry }, say: "wütend" }
            options:
              - { text: "Du gewinnst ein Spiel.", bin: froh }
              - { text: "Jemand schubst dich.", bin: wut }
              - { text: "Ihr backt zusammen Kekse.", bin: froh }
              - { text: "Jemand kritzelt in dein Heft.", bin: wut }
          - id: l1-c5
            type: true_false
            text: "Gefühle können sich ändern.\n\nStimmt das?"
            say: "Gefühle können sich ändern. Stimmt das?"
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Mia steht vor der ganzen Klasse. Gleich soll sie ein Gedicht aufsagen. Ihre Knie zittern.\n\nWie fühlt sich Mia?"
            say: "Mia steht vor der ganzen Klasse. Gleich soll sie ein Gedicht aufsagen. Ihre Knie zittern. Wie fühlt sich Mia?"
            options: [{ object: scared }, { object: happy }, { object: tired }]
            answer: scared

  - n: 2
    title: { de: "Was brauchst du?", en: "What do you need?" }
    goal:
      de: "Find heraus, was jemand braucht. Wer traurig ist, braucht Trost, und wer müde ist, braucht Ruhe."
      en: "Find out what someone needs. Someone who is sad needs comfort, and someone who is tired needs rest."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Juna kennt in der neuen Klasse noch niemanden. Sie macht große Augen.\n\nWie fühlt sich Juna?"
            say: "Juna kennt in der neuen Klasse noch niemanden. Sie macht große Augen. Wie fühlt sich Juna?"
            options: [{ object: scared }, { object: happy }, { object: angry }]
            answer: scared
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Wütend sein ist verboten.\n\nStimmt das?"
            say: "Wütend sein ist verboten. Stimmt das?"
            show: { object: angry }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was braucht Paul?"
            say: "Paul hat seine Brotdose vergessen. Er hat Hunger und ist traurig. Was glaubst du: Was braucht Paul jetzt? Ein Pflaster, etwas zu essen oder einen Ball?"
            show: { object: sad }
          - text: "Paul braucht etwas zu essen."
            say: "Paul braucht etwas zu essen. Mia teilt ihr Brot mit ihm. Jetzt hat er keinen Hunger mehr, und er lacht wieder. Gefühle zeigen uns, was wir brauchen."
            show: { objects: [bread, happy] }
          - text: "Wer traurig ist, braucht Trost."
            say: "Ole ist hingefallen und weint. Er braucht Trost. Du kannst ihn trösten und fragen: Was ist los? Kann ich dir helfen? Wenn er sich wehgetan hat, holst du die Lehrerin."
            show: { objects: [sad, teacher] }
          - text: "Wer müde ist, braucht Ruhe."
            say: "Wer müde ist, braucht Ruhe und Schlaf. Wer Hunger hat, braucht etwas zu essen. Und wer Durst hat, braucht etwas zu trinken."
            show: { objects: [bed, water] }
          - text: "Wer Angst hat, braucht jemanden, der da ist."
            say: "Juna hatte Angst, weil sie niemanden kannte. Sie brauchte jemanden, der mit ihr spielt. Mia hat sie gefragt: Spielst du mit? Wer Angst hat, braucht jemanden, der da ist und hilft."
            show: { objects: [scared, happy] }
          - text: "Wer wütend ist, braucht eine Pause."
            say: "Wer wütend ist, braucht eine kleine Pause zum Beruhigen. Tief atmen hilft. Danach kann man in Ruhe sagen: Ich bin wütend, weil du meinen Turm umgeworfen hast. Hauen oder Schreien hilft nicht."
            show: { object: angry }
          - text: "Frag nach!"
            say: "Du weißt nicht genau, was jemand braucht? Dann frag einfach: Was brauchst du? Kann ich dir helfen? Und hör gut zu, was er sagt."
            show: { object: listen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was braucht das Kind?"
                say: "Tippe auf ein Kind und dann auf das, was es braucht."
                pairs:
                  - left: { object: tired }
                    right: { text: "Ruhe und Schlaf", say: "Ruhe und Schlaf" }
                  - left: { object: sad }
                    right: { text: "Trost", say: "Trost" }
                  - left: { object: angry }
                    right: { text: "eine Pause zum Beruhigen", say: "eine Pause zum Beruhigen" }
                hints:
                  - "Schau zuerst, wie sich jedes Kind fühlt."
                  - "Das Kind, das gähnt, ist müde. Was hilft, wenn du müde bist?"
                  - "Das müde Kind braucht Schlaf, das traurige Trost, das wütende eine Pause."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Lena hat nach dem Sport großen Durst.\n\nWas braucht Lena?"
                say: "Lena hat nach dem Sport großen Durst. Was braucht Lena?"
                options: [{ object: water }, { object: ball }, { object: book }]
                answer: water
                feedback:
                  ball: "Noch ein Ball? Lena will jetzt nicht spielen, sie hat Durst!"
                hints:
                  - "Was hilft, wenn du Durst hast?"
                  - "Bei Durst brauchst du etwas zu trinken."
                  - "Lena braucht Wasser."
              - id: l2-f3
                type: multiple_choice
                text: "Ole ist hingefallen und weint. Was kannst du tun?"
                show: { object: sad }
                options: ["Ich frage: Was ist los?", "Ich lache ihn aus.", "Ich laufe weg."]
                answer: "Ich frage: Was ist los?"
                feedback:
                  "Ich lache ihn aus.": "Auslachen tut Ole noch mehr weh. Er braucht Trost."
                hints:
                  - "Was braucht jemand, der traurig ist?"
                  - "Ole braucht Trost. Was hilft ihm?"
                  - "Frag ihn: Was ist los?"
              - id: l2-f4
                type: true_false
                text: "Ben ist wütend. Tief atmen und eine kleine Pause können ihm helfen.\n\nStimmt das?"
                say: "Ben ist wütend. Tief atmen und eine kleine Pause können ihm helfen. Stimmt das?"
                show: { object: angry }
                answer: true
                hints:
                  - "Was braucht jemand, der wütend ist?"
                  - "Wer wütend ist, muss sich erst beruhigen."
                  - "Ja. Atmen und eine Pause helfen Ben."
              - id: l2-f5
                type: image_multiple_choice
                text: "Es ist schon spät. Tim ist sehr müde.\n\nWas braucht Tim jetzt?"
                say: "Es ist schon spät. Tim ist sehr müde. Was braucht Tim jetzt?"
                options: [{ object: bed }, { object: cake }, { object: bike }]
                answer: bed
                feedback:
                  bike: "Jetzt noch Fahrrad fahren? Da schläft Tim ja beim Fahren ein!"
                hints:
                  - "Was hilft, wenn du müde bist?"
                  - "Wer müde ist, braucht Ruhe und Schlaf."
                  - "Tim braucht sein Bett."
              - id: l2-f6
                type: sorting
                text: "Juna ist neu. Hilft ihr das?"
                say: "Juna ist neu und kennt noch niemanden. Tippe auf eine Karte und hör zu. Hilft das Juna oder nicht?"
                bins:
                  - { id: hilft, show: { text: "hilft" }, say: "hilft" }
                  - { id: nicht, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "Juna fragen: Spielst du mit?", bin: hilft }
                  - { text: "Juna nicht beachten.", bin: nicht }
                  - { text: "Juna die Schule zeigen.", bin: hilft }
                  - { text: "Über Juna flüstern.", bin: nicht }
                hints:
                  - "Was braucht jemand, der Angst hat?"
                  - "Juna braucht jemanden, der da ist. Wer mit ihr spielt, ist für sie da."
                  - "Mitspielen und die Schule zeigen helfen. Nicht beachten und flüstern helfen nicht."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Paul hat Hunger.\n\nWas braucht Paul?"
                say: "Paul hat Hunger. Was braucht Paul?"
                options: [{ object: apple }, { object: pencil }, { object: kite }]
                answer: apple
                hints: ["Was hilft gegen Hunger?"]
              - id: l2-s2
                type: multiple_choice
                text: "Mila weint, weil ihre Katze krank ist. Was braucht Mila?"
                show: { object: sad }
                options: ["Trost", "einen Ball", "Hausaufgaben"]
                answer: "Trost"
                hints: ["Mila ist traurig. Was braucht jemand, der traurig ist?"]
