# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.traffic-light-crossing
skill: world.space.traffic-light-crossing
curriculum: de-DE
language: de
title:
  de: Sicher über die Straße
  en: Safely across the road
summary: >
  Paul walks to the playground with his Oma and shows her how to cross
  the road. Lesson 1 is the pedestrian light: wait at the kerb, press the
  button, stand at red even when no car comes, look left and right at
  green for turning cars, walk briskly without running, and keep going if
  the light turns red halfway. Lesson 2 is the zebra crossing: wait at the
  kerb, look left, right and left again, cross only once the cars have
  stopped and the driver has seen you, walk straight across, and never
  cross between parked cars; it ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Sicher unterwegs, en: Getting around safely }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.space.left-right-position]
  also_practises: []
  vocabulary: { de: [Ampel, rotes Männchen, grünes Männchen, Bordstein, Knopf, Zebrastreifen, Fahrer, links, rechts, zügig, parkende Autos] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: light, what: { de: an der Ampel richtig gehen, en: crossing properly at the pedestrian light } }
    - { id: zebra, what: { de: am Zebrastreifen richtig gehen, en: crossing properly at the zebra crossing } }
    - { id: look, what: { de: "richtig schauen und den sicheren Weg wählen", en: "looking properly and choosing the safe place to cross" } }
  misconceptions:
    - id: red-ok-if-empty
      what: Thinks it is fine to cross at red when no car is coming, or because others do
      addressed: "lesson 1 Learn says stand at red even when no car comes; l1-f2, l1-s5, l1-c4, l2-c3 and l2-c7"
    - id: green-means-safe
      what: Thinks green means no car can come, so there is no need to look
      addressed: "lesson 1 Learn says look left and right at green because cars turn; l1-f5, l1-n1, l1-c6 and l2-c6"
    - id: zebra-cars-always-stop
      what: Thinks cars always stop at a zebra crossing, so one can walk straight out
      addressed: "lesson 2 Learn says go only once the cars stand and the driver has seen you; l2-f1, l2-s4, l2-n2, l2-c8 and l2-c9"
    - id: turn-back-at-red
      what: Turns back or stops in the road when the light turns red halfway across
      addressed: "lesson 1 Learn says keep going briskly to the other side; l1-s4, l1-n5 and l2-c4"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "An der Ampel", en: "At the traffic light" }
    goal:
      de: "Geh an der Ampel richtig über die Straße. Bei Rot bleibst du stehen, bei Grün schaust du erst nach links und rechts."
      en: "Cross properly at the traffic light. At red you stand still, at green you look left and right first."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist links?"
            say: "Schau auf die zwei Bilder. Was ist links?"
            show: { objects: [bus, bike] }
            options: ["der Bus", "das Fahrrad"]
            answer: "der Bus"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Das Auto ist links."
            say: "Schau auf die zwei Bilder. Das Auto ist links. Stimmt das?"
            show: { objects: [bike, car] }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Dürfen sie jetzt gehen?"
            say: "Paul und Oma wollen zum Spielplatz. Sie kommen an eine Ampel. Das rote Männchen leuchtet. Auf der Straße ist gerade kein Auto. Was glaubst du: Dürfen die beiden jetzt gehen?"
            show: { object: traffic-light }
          - text: "Nein! Bei Rot bleibst du stehen."
            say: "Nein! Bei Rot bleibst du stehen, auch wenn kein Auto kommt. Gleich kann eines um die Ecke biegen. Und auch wenn andere bei Rot gehen: Du wartest."
            show: { object: traffic-light }
          - text: "Am Bordstein warten"
            say: "Paul wartet am Bordstein. Das ist die Kante, an der der Gehweg aufhört. Dort bleibt er stehen, nicht auf der Straße."
            show: { object: kerb }
          - text: "Den Knopf drücken"
            say: "An vielen Ampeln gibt es einen Knopf. Paul drückt ihn. Dann zeigt die Ampel bald Grün für ihn."
            show: { object: push-button }
          - text: "Grün: erst schauen, dann gehen."
            say: "Jetzt leuchtet das grüne Männchen. Trotzdem schaut Paul erst nach links und nach rechts. Manche Autos biegen ab und fahren über seinen Weg. Erst wenn alles frei ist, geht er zügig hinüber, ohne zu rennen."
            show: { object: traffic-light-green }
          - text: "Rot mitten auf der Straße? Weitergehen!"
            say: "Und wenn die Ampel rot wird, während Paul mitten auf der Straße ist? Dann geht er zügig weiter bis auf die andere Seite. Er dreht nicht um und bleibt nicht stehen."
            show: { object: traffic-light }
          - text: "Wusstest du? Manche Ampeln klopfen oder piepen."
            say: "Wusstest du? Manche Ampeln klopfen oder piepen, wenn sie Grün zeigen. So wissen auch blinde Menschen, wann sie gehen dürfen."
            show: { object: traffic-light-green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Das rote Männchen leuchtet. Was macht Paul?"
                say: "Das rote Männchen leuchtet. Was macht Paul?"
                show: { object: traffic-light }
                options: ["Er bleibt stehen.", "Er geht schnell hinüber.", "Er hüpft auf die Straße."]
                answer: "Er bleibt stehen."
                hints:
                  - "Welche Farbe leuchtet?"
                  - "Rot heißt: stehen bleiben."
                  - "Er bleibt stehen."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Bei Rot darfst du gehen, wenn kein Auto kommt."
                say: "Bei Rot darfst du gehen, wenn kein Auto kommt. Stimmt das?"
                show: { object: traffic-light }
                answer: false
                hints:
                  - "Kann gleich ein Auto um die Ecke kommen?"
                  - "Bei Rot bleibst du immer stehen, auch wenn die Straße leer ist."
                  - "Nein, das stimmt nicht."
              - id: l1-f3
                type: ordering
                text: "Was macht Paul an der Ampel? Ordne."
                say: "Was macht Paul an der Ampel? Bring es in die richtige Reihenfolge."
                options: ["bei Grün nach links und rechts schauen", "am Bordstein stehen bleiben", "zügig über die Straße gehen", "den Knopf drücken"]
                slot_count: 4
                answer: ["am Bordstein stehen bleiben", "den Knopf drücken", "bei Grün nach links und rechts schauen", "zügig über die Straße gehen"]
                hints:
                  - "Wo bleibt Paul zuerst stehen?"
                  - "Zuerst bleibt er am Bordstein stehen, dann drückt er den Knopf."
                  - "Bordstein, Knopf, bei Grün schauen, dann gehen."
              - id: l1-f4
                type: multiple_choice
                text: "Wo wartet Paul auf Grün?"
                say: "Wo wartet Paul auf Grün?"
                show: { object: traffic-light }
                options: ["am Bordstein", "mitten auf der Straße", "auf dem Dach eines Autos"]
                answer: "am Bordstein"
                feedback:
                  "auf dem Dach eines Autos": "Da oben? Das wäre ein lustiger Platz, aber ein gefährlicher!"
                hints:
                  - "Wo hört der Gehweg auf?"
                  - "Die Kante am Ende des Gehwegs heißt Bordstein."
                  - "Am Bordstein."
              - id: l1-f5
                type: true_false
                text: "Bei Grün schaut Paul trotzdem nach links und rechts."
                say: "Bei Grün schaut Paul trotzdem nach links und rechts. Ist das richtig?"
                show: { object: traffic-light-green }
                answer: true
                hints:
                  - "Können bei Grün Autos abbiegen?"
                  - "Manche Autos biegen ab und fahren über den Weg."
                  - "Ja, das ist richtig."
              - id: l1-f6
                type: image_multiple_choice
                text: "Bei welcher Ampel darfst du gehen?"
                say: "Schau dir die Ampeln an. Bei welcher Ampel darfst du gehen?"
                options: [{ object: traffic-light }, { object: traffic-light-green }]
                answer: traffic-light-green
                option_audio: false
                hints:
                  - "Welches Männchen leuchtet hell?"
                  - "Grün heißt gehen, Rot heißt stehen."
                  - "Die Ampel mit dem grünen Männchen."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Bei welcher Ampel bleibst du stehen?"
                say: "Schau dir die Ampeln an. Bei welcher Ampel bleibst du stehen?"
                options: [{ object: traffic-light-green }, { object: traffic-light }]
                answer: traffic-light
                option_audio: false
                hints: ["Rot heißt: stehen bleiben."]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Bei Rot bleibe ich _."
                options: ["stehen", "sitzen", "liegen"]
                answer: ["stehen"]
                hints: ["Paul wartet am Bordstein auf seinen Füßen."]
              - id: l1-s3
                type: ordering
                text: "Was kommt zuerst? Ordne."
                say: "Was kommt zuerst? Bring es in die richtige Reihenfolge."
                options: ["über die Straße gehen", "auf Grün warten", "nach links und rechts schauen"]
                slot_count: 3
                answer: ["auf Grün warten", "nach links und rechts schauen", "über die Straße gehen"]
                hints: ["Gehen kommt ganz zum Schluss."]
              - id: l1-s4
                type: true_false
                text: "Die Ampel wird rot, als Paul mitten auf der Straße ist. Er geht zügig weiter bis zur anderen Seite."
                say: "Die Ampel wird rot, als Paul mitten auf der Straße ist. Er geht zügig weiter bis zur anderen Seite. Ist das richtig?"
                show: { object: traffic-light }
                answer: true
                hints: ["Ist es mitten auf der Straße sicher?"]
              - id: l1-s5
                type: multiple_choice
                text: "Andere Leute gehen bei Rot. Was macht Paul?"
                say: "Andere Leute gehen bei Rot über die Straße. Was macht Paul?"
                show: { object: traffic-light }
                options: ["Er wartet auf Grün.", "Er geht mit.", "Er rennt los."]
                answer: "Er wartet auf Grün."
                hints: ["Was heißt Rot, egal was die anderen tun?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Die Ampel wird grün. Was macht Paul zuerst?"
                say: "Die Ampel wird grün. Was macht Paul zuerst?"
                show: { object: traffic-light-green }
                options: ["Er schaut nach links und rechts.", "Er rennt los.", "Er macht die Augen zu."]
                answer: "Er schaut nach links und rechts."
              - id: l1-n2
                type: true_false
                text: "Paul wartet mitten auf der Straße auf Grün."
                say: "Paul wartet mitten auf der Straße auf Grün. Ist das richtig?"
                show: { object: traffic-light }
                answer: false
              - id: l1-n3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Bei Grün schaue ich erst nach links und nach _."
                options: ["rechts", "oben", "hinten"]
                answer: ["rechts"]
              - id: l1-n4
                type: ordering
                text: "Was macht Paul an der Ampel? Ordne."
                say: "Was macht Paul an der Ampel? Bring es in die richtige Reihenfolge."
                options: ["den Knopf drücken", "bei Grün zügig gehen", "am Bordstein stehen bleiben"]
                slot_count: 3
                answer: ["am Bordstein stehen bleiben", "den Knopf drücken", "bei Grün zügig gehen"]
              - id: l1-n5
                type: multiple_choice
                text: "Die Ampel wird rot, Paul ist mitten auf der Straße. Was tut er?"
                say: "Die Ampel wird rot, und Paul ist mitten auf der Straße. Was tut er?"
                show: { object: traffic-light }
                options: ["Er geht zügig weiter auf die andere Seite.", "Er bleibt mitten auf der Straße stehen.", "Er dreht um und rennt zurück."]
                answer: "Er geht zügig weiter auf die andere Seite."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welche Ampel heißt: stehen bleiben?"
            say: "Welche Ampel heißt: stehen bleiben?"
            options: [{ object: traffic-light-green }, { object: traffic-light }]
            answer: traffic-light
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Bei Grün gehst du über die Straße, wenn alles frei ist."
            say: "Bei Grün gehst du über die Straße, wenn alles frei ist. Stimmt das?"
            show: { object: traffic-light-green }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wo wartest du an der Ampel?"
            say: "Wo wartest du an der Ampel?"
            show: { object: traffic-light }
            options: ["am Bordstein", "auf der Straße", "auf dem Ampelmast"]
            answer: "am Bordstein"
          - id: l1-c4
            type: true_false
            text: "Bei Rot darf man schnell hinüberrennen."
            say: "Bei Rot darf man schnell hinüberrennen. Stimmt das?"
            show: { object: traffic-light }
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Beim grünen Männchen darf ich _."
            options: ["gehen", "schlafen", "rückwärts laufen"]
            answer: ["gehen"]
          - id: l1-c6
            type: multiple_choice
            text: "Es ist Grün. Was machst du, bevor du gehst?"
            say: "Es ist Grün. Was machst du, bevor du gehst?"
            show: { object: traffic-light-green }
            options: ["nach links und rechts schauen", "die Schuhe ausziehen", "umdrehen"]
            answer: "nach links und rechts schauen"

  - n: 2
    title: { de: "Am Zebrastreifen", en: "At the zebra crossing" }
    goal:
      de: "Geh am Zebrastreifen sicher hinüber. Schau nach links, nach rechts und wieder nach links, und geh erst, wenn die Autos stehen."
      en: "Cross safely at the zebra crossing. Look left, right and left again, and go only when the cars have stopped."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Bei welcher Ampel darfst du gehen?"
            say: "Bei welcher Ampel darfst du gehen?"
            options: [{ object: traffic-light-green }, { object: traffic-light }]
            answer: traffic-light-green
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Bei Rot bleibst du stehen."
            say: "Bei Rot bleibst du stehen. Stimmt das?"
            show: { object: traffic-light }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Darf Paul einfach losgehen?"
            say: "Am Park gibt es keine Ampel, aber einen Zebrastreifen. Ein Auto kommt. Autos müssen am Zebrastreifen anhalten. Was glaubst du: Darf Paul darum einfach losgehen?"
            show: { object: zebra-crossing }
          - text: "Erst gehen, wenn die Autos stehen."
            say: "Nein! Vielleicht hat der Fahrer Paul gar nicht gesehen. Darum wartet Paul am Bordstein, bis die Autos wirklich stehen."
            show: { object: car }
          - text: "Links, rechts, links"
            say: "Paul schaut nach links, nach rechts und noch einmal nach links. Von links kommen die Autos, die ihm am nächsten sind. Darum schaut er zuerst und zuletzt nach links."
            show: { object: car }
          - text: "Dem Fahrer in die Augen schauen"
            say: "Paul schaut dem Fahrer in die Augen. Der Fahrer nickt oder winkt ihm zu. Jetzt weiß Paul: Der Fahrer hat mich gesehen."
            show: { object: car }
          - text: "Gerade hinüber, nicht rennen."
            say: "Dann geht Paul zügig und gerade über den Zebrastreifen. Er rennt nicht, denn beim Rennen kann er stolpern."
            show: { object: boy }
          - text: "Nie zwischen parkenden Autos"
            say: "Paul geht nie zwischen parkenden Autos über die Straße. Dort sieht ihn kein Fahrer. Der sicherste Weg führt über die Ampel oder den Zebrastreifen, auch wenn er ein bisschen länger ist."
            show: { object: car }
          - text: "Wusstest du? Die erste Ampel in Deutschland stand vor 100 Jahren in Berlin."
            say: "Wusstest du? Die erste Ampel in Deutschland stand vor ungefähr hundert Jahren in Berlin, auf einem hohen Turm mitten auf einem großen Platz. Ein Polizist hat die Lichter von Hand umgeschaltet."
            show: { object: traffic-light }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Paul steht am Zebrastreifen. Ein Auto kommt. Wann geht Paul los?"
                say: "Paul steht am Zebrastreifen. Ein Auto kommt. Wann geht Paul los?"
                show: { object: zebra-crossing }
                options: ["wenn das Auto steht", "sofort", "wenn das Auto noch fährt"]
                answer: "wenn das Auto steht"
                hints:
                  - "Hat der Fahrer Paul schon gesehen?"
                  - "Paul wartet am Bordstein, bis die Autos wirklich stehen."
                  - "Wenn das Auto steht."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Wohin schaut Paul? Ordne."
                say: "Wohin schaut Paul am Zebrastreifen? Bring es in die richtige Reihenfolge."
                options: ["noch einmal nach links schauen", "nach links schauen", "nach rechts schauen"]
                slot_count: 3
                answer: ["nach links schauen", "nach rechts schauen", "noch einmal nach links schauen"]
                hints:
                  - "Von welcher Seite kommen die nächsten Autos?"
                  - "Die nächsten Autos kommen von links. Darum schaut Paul zuerst und zuletzt nach links."
                  - "Links, rechts, noch einmal links."
              - id: l2-f3
                type: true_false
                text: "Am Zebrastreifen rennt Paul, damit er schnell drüben ist."
                say: "Am Zebrastreifen rennt Paul, damit er schnell drüben ist. Ist das richtig?"
                show: { object: zebra-crossing }
                answer: false
                hints:
                  - "Was kann beim Rennen passieren?"
                  - "Beim Rennen kann Paul stolpern. Er geht zügig, aber er rennt nicht."
                  - "Nein, das ist nicht richtig."
              - id: l2-f4
                type: image_multiple_choice
                text: "Wonach heißt der Zebrastreifen?"
                say: "Der Zebrastreifen hat seinen Namen von einem Tier. Von welchem?"
                options: [{ object: horse }, { object: zebra }, { object: cow }]
                answer: zebra
                hints:
                  - "Welches Tier hat Streifen?"
                  - "Der Zebrastreifen hat weiße Streifen auf der dunklen Straße."
                  - "Das Zebra."
              - id: l2-f5
                type: multiple_choice
                text: "Wo geht Paul über die Straße?"
                say: "Paul und Oma wollen in den Park. Wo gehen sie über die Straße?"
                options: ["am Zebrastreifen", "zwischen zwei parkenden Autos", "hinter einem Bus"]
                answer: "am Zebrastreifen"
                hints:
                  - "Wo sieht ein Fahrer Paul gut?"
                  - "Zwischen parkenden Autos und hinter einem Bus sieht ihn kein Fahrer."
                  - "Am Zebrastreifen."
              - id: l2-f6
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Paul schaut dem Fahrer in die _."
                options: ["Augen", "Tasche", "Ohren"]
                answer: ["Augen"]
                hints:
                  - "Woran merkt Paul, dass der Fahrer ihn gesehen hat?"
                  - "Mit den Augen sieht der Fahrer Paul."
                  - "Augen"

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Der Fahrer nickt Paul zu. Jetzt weiß Paul: Der Fahrer hat mich gesehen."
                say: "Der Fahrer nickt Paul zu. Jetzt weiß Paul: Der Fahrer hat mich gesehen. Stimmt das?"
                show: { object: car }
                answer: true
                hints: ["Warum nickt oder winkt ein Fahrer?"]
              - id: l2-s2
                type: multiple_choice
                text: "In welche Richtung schaut Paul zuerst?"
                say: "Paul steht am Zebrastreifen. In welche Richtung schaut er zuerst?"
                options: ["nach links", "nach rechts", "nach oben"]
                answer: "nach links"
                hints: ["Von wo kommen die Autos, die am nächsten sind?"]
              - id: l2-s3
                type: sorting
                text: "Sicher oder gefährlich?"
                say: "Tippe auf eine Karte und hör zu. Ist das sicher oder gefährlich?"
                bins:
                  - { id: sicher, show: { text: "sicher" }, say: "sicher" }
                  - { id: gefaehrlich, show: { text: "gefährlich" }, say: "gefährlich" }
                options:
                  - { text: "am Bordstein warten", bin: sicher }
                  - { text: "zwischen parkenden Autos losgehen", bin: gefaehrlich }
                  - { text: "warten, bis das Auto steht", bin: sicher }
                  - { text: "über den Zebrastreifen rennen", bin: gefaehrlich }
                hints: ["Wo und wann sieht dich ein Fahrer gut?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Ich gehe erst, wenn die Autos _."
                options: ["stehen", "hupen", "fahren"]
                answer: ["stehen"]
                hints: ["Auch am Zebrastreifen hat ein Fahrer dich vielleicht nicht gesehen."]
              - id: l2-s5
                type: multiple_choice
                text: "Warum schaut Paul zuerst nach links?"
                say: "Warum schaut Paul zuerst nach links?"
                options: ["Von links kommen die nächsten Autos.", "Links ist der Park.", "Links ist es heller."]
                answer: "Von links kommen die nächsten Autos."
                hints: ["Welche Autos sind ihm am nächsten?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Was macht Paul am Zebrastreifen? Ordne."
                say: "Was macht Paul am Zebrastreifen? Bring es in die richtige Reihenfolge."
                options: ["gerade hinübergehen", "am Bordstein stehen bleiben", "links, rechts und links schauen"]
                slot_count: 3
                answer: ["am Bordstein stehen bleiben", "links, rechts und links schauen", "gerade hinübergehen"]
              - id: l2-n2
                type: true_false
                text: "Autos müssen am Zebrastreifen halten. Darum kann Paul sofort losgehen."
                say: "Autos müssen am Zebrastreifen halten. Darum kann Paul sofort losgehen. Stimmt das?"
                show: { object: zebra-crossing }
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Wo gehst du am sichersten über die Straße?"
                say: "Wo gehst du am sichersten über die Straße?"
                options: ["an der Ampel oder am Zebrastreifen", "zwischen parkenden Autos", "hinter einem Bus"]
                answer: "an der Ampel oder am Zebrastreifen"
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Am Zebrastreifen schaue ich nach links, nach rechts und noch einmal nach _."
                options: ["links", "oben", "unten"]
