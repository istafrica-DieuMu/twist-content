# Lesson set: Sachunterricht, Klasse 1. Hand-authored draft.
id: de-DE.world.teeth
skill: world.body.teeth
curriculum: de-DE
language: de
title:
  de: Meine Zähne
  en: My teeth
summary: >
  Leo is six and has his first Wackelzahn. Lesson 1 answers what grows
  when it falls out: a new tooth that was waiting underneath pushes the
  Milchzahn out. Children have 20 Milchzähne, the Zahnwechsel usually
  starts at about six, and the bleibende Zähne must last a whole life
  (adults have up to 32). Lesson 2 takes Leo to the Zahnärztin: germs on
  the teeth eat sugar and make acid that makes holes (Karies), so brush
  morning and evening for two to three minutes, Kauflächen, Außenflächen,
  Innenflächen (KAI), with toothpaste the size of a pea, drink water,
  keep sweets for now and then, and see the dentist twice a year. It ends
  with the skill check.
metadata:
  year: klasse-1
  topic: { de: Sauber und gesund, en: Clean and healthy }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [world.body.hygiene]
  also_practises: []
  vocabulary: { de: [Zahn, Milchzahn, Wackelzahn, Zahnwechsel, bleibende Zähne, Zahnbürste, Zahnpasta, Karies, Zucker, Kaufläche, Zahnärztin] }
  forms: [picture, text, audio]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: baby-teeth, what: { de: "Milchzähne und Zahnwechsel erklären", en: explaining baby teeth and how they are replaced } }
    - { id: brushing, what: { de: "sagen, wann, wie lange und wie ich Zähne putze", en: "saying when, how long and how to brush my teeth" } }
    - { id: food, what: { de: "wissen, was den Zähnen schadet und was ihnen guttut", en: knowing what harms teeth and what is good for them } }
  misconceptions:
    - id: teeth-grow-back-always
      what: Thinks every tooth grows back when it falls out, the new ones too
      addressed: "lesson 1 Learn says the bleibende Zähne must last a whole life; l1-s1, l1-c4 and l2-c5"
    - id: gap-stays
      what: Fears the gap from a Wackelzahn stays for ever
      addressed: "lesson 1 Learn opens with the guess and shows the new tooth underneath; l1-f2, l1-n2 and l2-c2"
    - id: sweets-harmless-if-brushed-once
      what: Thinks brushing now and then is enough and sugar does no harm
      addressed: "lesson 2 Learn opens with the guess about cake and carrot and explains sugar, germs and holes; l2-f2, l2-f4, l2-s2 and l2-c16"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Der Wackelzahn", en: "The wobbly tooth" }
    goal:
      de: "Finde heraus, warum Milchzähne wackeln und ausfallen. Unter dem Milchzahn wächst schon ein neuer Zahn."
      en: "Find out why baby teeth wobble and fall out. A new tooth is already growing under the baby tooth."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Womit putzt du die Zähne?"
            say: "Womit putzt du die Zähne?"
            options: [{ object: toothbrush }, { object: fork }, { object: crayon }]
            answer: toothbrush
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Vor dem Essen wäschst du dir die Hände.\n\nStimmt das?"
            say: "Vor dem Essen wäschst du dir die Hände. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Leo hat einen Wackelzahn."
            say: "Leo ist sechs Jahre alt. Vorne unten wackelt ein Zahn! Bald fällt er aus. Was glaubst du: Was wächst dann in der Lücke?"
            show: { object: tooth }
          - text: "Ein neuer Zahn!"
            say: "Ein neuer Zahn! Er wartet schon unter dem alten Zahn im Kiefer. Er wächst und schiebt den alten Zahn hinaus. Darum wackelt der alte Zahn."
            show: { object: tooth }
          - text: "Kinder haben 20 Milchzähne."
            say: "Die ersten Zähne heißen Milchzähne. Sie wachsen schon bei Babys. Ein Kind hat zwanzig Milchzähne."
            show: { object: mouth }
          - text: "Mit etwa 6 Jahren beginnt der Zahnwechsel."
            say: "Mit etwa sechs Jahren beginnt der Zahnwechsel. Dann fällt ein Milchzahn nach dem anderen aus, und neue Zähne wachsen. Das dauert ein paar Jahre."
            show: { object: child }
          - text: "Die neuen Zähne bleiben für immer."
            say: "Die neuen Zähne heißen bleibende Zähne. Sie wachsen nicht noch einmal nach. Sie müssen ein ganzes Leben halten. Erwachsene haben bis zu zweiunddreißig Zähne."
            show: { object: grandpa }
          - text: "Wusstest du? Der Zahnschmelz ist das Härteste an deinem Körper."
            say: "Wusstest du? Außen sind deine Zähne mit Zahnschmelz bedeckt. Zahnschmelz ist das Härteste in deinem ganzen Körper, noch härter als deine Knochen."
            show: { object: tooth }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißen die ersten Zähne eines Kindes?"
                options: ["Milchzähne", "Käsezähne", "Brotzähne"]
                answer: "Milchzähne"
                feedback:
                  Käsezähne: "Käsezähne? Die gibt es nicht. Aber ein Getränk steckt im richtigen Namen."
                  Brotzähne: "Brotzähne gibt es nicht, auch wenn du mit den Zähnen Brot isst."
                hints:
                  - "Der Name hat mit etwas zu tun, das Babys trinken."
                  - "Babys trinken Milch."
                  - "Milchzähne."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Wenn ein Milchzahn ausfällt, wächst ein neuer Zahn.\n\nStimmt das?"
                say: "Wenn ein Milchzahn ausfällt, wächst ein neuer Zahn. Stimmt das?"
                show: { object: tooth }
                answer: true
                hints:
                  - "Was wartet unter dem Milchzahn?"
                  - "Der neue Zahn schiebt den Milchzahn hinaus."
                  - "Ja, das stimmt."
              - id: l1-f3
                type: ordering
                text: "Leos Wackelzahn"
                say: "Leg die Karten in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Der Zahn fällt aus.", "Der neue Zahn wächst.", "Der Zahn wackelt."]
                slot_count: 3
                answer: ["Der Zahn wackelt.", "Der Zahn fällt aus.", "Der neue Zahn wächst."]
                hints:
                  - "Was merkt Leo zuerst?"
                  - "Erst wackelt der Zahn, dann fällt er heraus."
                  - "Wackeln, ausfallen, der neue Zahn wächst."
              - id: l1-f4
                type: image_multiple_choice
                text: "Was wackelt bei Leo?"
                say: "Was wackelt bei Leo?"
                options: [{ object: nose }, { object: tooth }, { object: ear }]
                answer: tooth
                feedback:
                  nose: "Eine Wackelnase? Zum Glück nicht!"
                  ear: "Ohren wackeln nicht und fallen nicht aus."
                hints:
                  - "Es ist im Mund."
                  - "Leo hat einen Wackel...?"
                  - "Der Zahn."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Milchzähne hat ein Kind?"
                options: ["5", "20", "100"]
                answer: "20"
                hints:
                  - "Es sind mehr als deine Finger an einer Hand."
                  - "Es sind so viele wie deine Finger und Zehen zusammen."
                  - "20."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Bleibende Zähne müssen ein ganzes _ halten."
                options: ["Leben", "Jahr", "Wochenende"]
                answer: ["Leben"]
                hints:
                  - "Bleibende Zähne wachsen nicht noch einmal nach."
                  - "Sie sind bis du ganz alt bist in deinem Mund."
                  - "Leben."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Fällt ein bleibender Zahn aus, wächst ein neuer nach.\n\nStimmt das?"
                say: "Fällt ein bleibender Zahn aus, wächst ein neuer nach. Stimmt das?"
                answer: false
                hints: ["Bleibende Zähne müssen ein ganzes Leben halten."]
              - id: l1-s2
                type: multiple_choice
                text: "Wann beginnt meistens der Zahnwechsel?"
                options: ["mit etwa 6 Jahren", "mit 1 Jahr", "mit 30 Jahren"]
                answer: "mit etwa 6 Jahren"
                hints: ["Leo hat gerade seinen ersten Wackelzahn. Wie alt ist er?"]
              - id: l1-s3
                type: ordering
                text: "Erst, dann, zum Schluss"
                say: "Welche Zähne kommen zuerst? Leg die Karten in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["bleibende Zähne", "keine Zähne", "Milchzähne"]
                slot_count: 3
                answer: ["keine Zähne", "Milchzähne", "bleibende Zähne"]
                hints: ["Ein ganz kleines, neugeborenes Baby hat noch keine Zähne."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Unter dem Milchzahn wartet schon ein _ Zahn."
                options: ["neuer", "goldener", "kranker"]
                answer: ["neuer"]
                hints: ["Was wächst nach, wenn der Milchzahn ausfällt?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was schiebt den Milchzahn hinaus?"
                options: ["der neue Zahn darunter", "die Zahnbürste", "der Wind"]
                answer: "der neue Zahn darunter"
                hints: ["Darum wackelt der Milchzahn: Darunter wächst etwas."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Ein Kind hat 20 Milchzähne.\n\nStimmt das?"
                say: "Ein Kind hat zwanzig Milchzähne. Stimmt das?"
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Leos Wackelzahn ist raus. Was passiert jetzt?"
                options: ["Ein neuer Zahn wächst.", "Die Lücke bleibt für immer.", "Der alte Zahn wächst wieder an."]
                answer: "Ein neuer Zahn wächst."
              - id: l1-n3
                type: ordering
                text: "Vom Wackeln zum neuen Zahn"
                say: "Leg die Karten in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Eine Lücke ist da.", "Der Zahn wackelt.", "Der neue Zahn wächst.", "Der Zahn fällt aus."]
                slot_count: 4
                answer: ["Der Zahn wackelt.", "Der Zahn fällt aus.", "Eine Lücke ist da.", "Der neue Zahn wächst."]
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Erwachsene haben bis zu _ Zähne."
                options: ["32", "3", "300"]
                answer: ["32"]
              - id: l1-n5
                type: image_multiple_choice
                text: "Wer ist gerade beim Zahnwechsel?"
                say: "Wer verliert gerade seine Milchzähne?"
                options: [{ object: grandma }, { object: child }, { object: dad }]
                answer: child

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißen die Zähne, die ein Leben lang halten müssen?"
            options: ["bleibende Zähne", "Milchzähne", "Wackelzähne"]
            answer: "bleibende Zähne"
          - id: l1-c2
            type: true_false
            text: "Milchzähne fallen irgendwann aus.\n\nStimmt das?"
            say: "Milchzähne fallen irgendwann aus. Stimmt das?"
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Was hat Leo verloren?"
            say: "Leo hat etwas verloren und freut sich über die Lücke. Was ist es?"
            options: [{ object: shoe }, { object: tooth }, { object: ball }]
            answer: tooth
          - id: l1-c4
            type: true_false
            text: "Bleibende Zähne wachsen immer wieder nach.\n\nStimmt das?"
            say: "Bleibende Zähne wachsen immer wieder nach. Stimmt das?"
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Wort passt?"
            say: "Welches Wort passt in die Lücke?"
            frame: "Der erste Zahn, der ausfällt, ist ein _."
            options: ["Milchzahn", "Holzzahn", "bleibender Zahn"]
            answer: ["Milchzahn"]
          - id: l1-c6
            type: multiple_choice
            text: "Warum wackelt Leos Zahn?"
            options: ["Ein neuer Zahn schiebt ihn hinaus.", "Leo hat zu viel gelacht.", "Der Zahn ist müde."]
            answer: "Ein neuer Zahn schiebt ihn hinaus."

  - n: 2
    title: { de: Zähne richtig putzen, en: Brushing teeth properly }
    goal:
      de: "Lerne, wie du deine Zähne gesund hältst. Du putzt morgens und abends und isst Süßes nur ab und zu."
      en: "Learn how to keep your teeth healthy. You brush morning and evening and eat sweets only now and then."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißen die ersten Zähne eines Kindes?"
            options: ["Milchzähne", "bleibende Zähne"]
            answer: "Milchzähne"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Unter dem Wackelzahn wächst ein neuer Zahn.\n\nStimmt das?"
            say: "Unter dem Wackelzahn wächst ein neuer Zahn. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Kuchen oder Möhre?"
            say: "Leo geht zur Zahnärztin. Sie fragt: Was glaubst du, was mögen deine Zähne gar nicht, den Kuchen oder die Möhre?"
            show: { objects: [cake, carrot] }
          - text: "Zucker schadet den Zähnen."
            say: "Den Kuchen! Darin ist viel Zucker. Auf den Zähnen leben winzige Keime. Sie fressen Zucker und machen dabei Säure. Die Säure macht Löcher in die Zähne. Das heißt Karies."
            show: { object: cake }
          - text: "Gut für die Zähne: Wasser, Milch, Möhren, Käse."
            say: "Wasser, Milch, Möhren und Käse sind gut für die Zähne. Süßes, Kuchen und Saft gibt es lieber nur ab und zu. Trink am besten Wasser."
            show: { objects: [water, carrot] }
          - text: "Morgens und abends, zwei bis drei Minuten."
            say: "Putz deine Zähne jeden Tag zweimal: morgens und abends. Und jedes Mal zwei bis drei Minuten lang. Zahnpasta brauchst du nur so viel wie eine Erbse."
            show: { object: toothbrush }
          - text: "K, A, I: so putzt du."
            say: "Die Zahnärztin zeigt Leo einen Trick: K, A, I. K heißt Kauflächen, oben auf den Zähnen. A heißt Außenflächen, vorne zu den Lippen hin. I heißt Innenflächen, hinten zur Zunge hin. In dieser Reihenfolge putzt du."
            show: { object: mouth }
          - text: "Zweimal im Jahr zur Zahnärztin."
            say: "Zweimal im Jahr geht Leo zur Zahnärztin. Sie schaut nach, ob alle Zähne gesund sind. Ist ein kleines Loch da, kann sie es früh reparieren."
            show: { object: tooth }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Gut für die Zähne?"
                say: "Tippe auf ein Bild und hör das Wort. Ist es gut für die Zähne, oder lieber nur ab und zu?"
                bins:
                  - { id: gut, show: { text: "gut für die Zähne" }, say: "gut für die Zähne" }
                  - { id: selten, show: { text: "nur ab und zu" }, say: "nur ab und zu" }
                options:
                  - { object: water, bin: gut }
                  - { object: cake, bin: selten }
                  - { object: carrot, bin: gut }
                  - { object: ice-cream, bin: selten }
                hints:
                  - "Frag bei jedem Bild: Ist da viel Zucker drin?"
                  - "Kuchen und Eis sind süß. Wasser und Möhren nicht."
                  - "Wasser und Möhre zu gut, Kuchen und Eis zu nur ab und zu."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was macht Löcher in die Zähne?"
                options: ["Keime, die Zucker fressen", "Wasser trinken", "Zähne putzen"]
                answer: "Keime, die Zucker fressen"
                feedback:
                  Wasser trinken: "Wasser ist sogar gut für die Zähne."
                  Zähne putzen: "Zähneputzen schützt die Zähne vor Löchern."
                hints:
                  - "Auf den Zähnen leben winzige Lebewesen."
                  - "Die Keime fressen etwas Süßes und machen Säure."
                  - "Keime, die Zucker fressen."
              - id: l2-f3
                type: ordering
                text: "K, A, I"
                say: "Was putzt Leo zuerst, was danach, was zum Schluss? Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
                options: ["Innenflächen", "Kauflächen", "Außenflächen"]
                slot_count: 3
                answer: ["Kauflächen", "Außenflächen", "Innenflächen"]
                hints:
                  - "Denk an den Trick: K, A, I."
                  - "K wie Kauflächen kommt zuerst. Dann A."
                  - "Kauflächen, Außenflächen, Innenflächen."
              - id: l2-f4
                type: true_false
                text: "Leo putzt nur morgens die Zähne. Das reicht.\n\nStimmt das?"
                say: "Leo putzt nur morgens die Zähne. Das reicht. Stimmt das?"
                answer: false
                hints:
                  - "Wie oft am Tag putzt du die Zähne?"
                  - "Zweimal: morgens und noch einmal ..."
                  - "Nein. Leo putzt auch abends."
              - id: l2-f5
                type: image_multiple_choice
                text: "Leo hat Durst. Was ist am besten für seine Zähne?"
                say: "Leo hat Durst. Was ist am besten für seine Zähne?"
                options: [{ object: juice }, { object: water }, { object: hot-chocolate }]
                answer: water
                hints:
                  - "In welchem Getränk ist gar kein Zucker?"
                  - "Saft und Kakao sind süß."
                  - "Wasser."
              - id: l2-f6
                type: multiple_choice
                text: "Wie viel Zahnpasta nimmt Leo?"
                options: ["so viel wie eine Erbse", "die ganze Tube", "gar keine"]
                answer: "so viel wie eine Erbse"
                feedback:
                  die ganze Tube: "Dann schäumt Leo wie ein Badeschaum! So viel braucht er nicht."
                hints:
                  - "Nicht zu viel und nicht gar nichts."
                  - "Ein kleiner Klecks reicht."
                  - "So viel wie eine Erbse."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Ich putze meine Zähne zwei bis drei _ lang."
                options: ["Minuten", "Stunden", "Tage"]
                answer: ["Minuten"]
                hints: ["Ein Zahnputzlied dauert ungefähr so lange."]
              - id: l2-s2
                type: true_false
                text: "Keime auf den Zähnen fressen Zucker.\n\nStimmt das?"
                say: "Keime auf den Zähnen fressen Zucker. Stimmt das?"
                answer: true
                hints: ["Was passiert mit Zucker auf den Zähnen?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Was ist gut für die Zähne?"
                say: "Welches Bild zeigt etwas, das gut für die Zähne ist?"
                options: [{ object: cake }, { object: cheese }, { object: ice-cream }]
                answer: cheese
                hints: ["Was davon ist nicht süß?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wie oft geht Leo zur Zahnärztin?"
                options: ["zweimal im Jahr", "nie", "jeden Tag"]
                answer: "zweimal im Jahr"
                hints: ["Sie schaut regelmäßig nach, aber nicht jeden Tag."]
              - id: l2-s5
                type: matching
                text: "K, A, I"
                say: "Tippe auf einen Buchstaben und dann auf das passende Wort."
                pairs:
                  - left: { text: "K" }
                    right: { text: "Kauflächen" }
                  - left: { text: "A" }
                    right: { text: "Außenflächen" }
                  - left: { text: "I" }
                    right: { text: "Innenflächen" }
                option_audio: false
                hints: ["Jedes Wort fängt mit seinem Buchstaben an."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Gut für die Zähne?"
                say: "Tippe auf ein Bild und hör das Wort. Ist es gut für die Zähne, oder lieber nur ab und zu?"
                bins:
                  - { id: gut, show: { text: "gut für die Zähne" }, say: "gut für die Zähne" }
                  - { id: selten, show: { text: "nur ab und zu" }, say: "nur ab und zu" }
                options:
                  - { object: milk, bin: gut }
                  - { object: juice, bin: selten }
                  - { object: cheese, bin: gut }
                  - { object: cake, bin: selten }
              - id: l2-n2
                type: true_false
                text: "Leo putzt morgens und abends die Zähne. Das ist richtig.\n\nStimmt das?"
                say: "Leo putzt morgens und abends die Zähne. Das ist richtig. Stimmt das?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Wie heißen Löcher in den Zähnen?"
                options: ["Karies", "Kakao", "Karussell"]
                answer: "Karies"
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Welches Wort passt in die Lücke?"
                frame: "Zuerst putze ich die _."
                options: ["Kauflächen", "Innenflächen", "Außenflächen"]
                answer: ["Kauflächen"]
              - id: l2-n5
                type: image_multiple_choice
                text: "Was braucht Leo zum Zähneputzen?"
                say: "Was braucht Leo zum Zähneputzen?"
                options: [{ object: spoon }, { object: toothbrush }, { object: pencil }]
                answer: toothbrush

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: baby-teeth
            type: multiple_choice
            text: "Wie heißen die ersten Zähne, die wackeln und ausfallen?"
            options: ["Milchzähne", "Löwenzähne", "Glaszähne"]
            answer: "Milchzähne"
          - id: l2-c2
            part: baby-teeth
            type: true_false
            text: "Nach einem Wackelzahn bleibt die Lücke für immer.\n\nStimmt das?"
            say: "Nach einem Wackelzahn bleibt die Lücke für immer. Stimmt das?"
            answer: false
          - id: l2-c3
            part: baby-teeth
            type: ordering
            text: "Der Zahnwechsel"
            say: "Leg die Karten in die richtige Reihenfolge. Tippe die Karten der Reihe nach an oder zieh sie in die Felder."
