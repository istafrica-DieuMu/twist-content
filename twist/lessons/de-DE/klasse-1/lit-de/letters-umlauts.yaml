# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-umlauts
skill: lit-de.letters.umlauts
curriculum: de-DE
language: de
title:
  de: Die Umlaute Ä, Ö und Ü
  en: The umlauts Ä, Ö and Ü
summary: >
  One lesson each for Ä, Ö and Ü: hear the sound, set it against the
  vowel without dots (Käse and Kasse, Möhre and Rose, Tür and Kuh), see
  that the dots make the difference on the page, and meet the umlaut in
  the plural (Apfel, Äpfel; Ofen, Öfen; Hut, Hüte). Lesson 4 sorts and
  reads words with all three (Käse, Löffel, Mütze, Würfel, Königin) and
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.eu-ch-j]
  also_practises:
    [lit-de.letters.eu-ch-j, lit-de.handwriting.print-letters, lit-de.decoding.longer-words]
  vocabulary:
    { de: [Buchstabe, Laut, Umlaut, Punkte, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  parts:
    - { id: ae, what: { de: Ä und A unterscheiden, en: telling Ä from A } }
    - { id: oe, what: { de: Ö und O unterscheiden, en: telling Ö from O } }
    - { id: ue, what: { de: Ü und U unterscheiden, en: telling Ü from U } }
    - { id: words, what: { de: "Wörter mit Ä, Ö und Ü lesen", en: "reading words with Ä, Ö and Ü" } }
  misconceptions:
    - id: dots-forgotten
      what: Reads or writes a, o, u for ä, ö, ü, leaving the dots off
      addressed: "every lesson asks for the dots in highlight_in_text (l1-f4, l2-f4, l3-f4) and in fill_in_blank with the plain vowel as distractor; l4-f5 and l4-n3 read a word against its look-alike without dots"
    - id: umlaut-vowel-ear
      what: Does not hear ä from a, ö from o, ü from u
      addressed: l1-f2, l1-s2, l1-n4, l2-f2, l2-s2, l2-n2, l3-f2, l3-s2 and l3-n4 contrast each pair; the skill check asks all three
    - id: plural-vowel
      what: Does not notice that the vowel changes in the plural (Ball, Bälle)
      addressed: each Learn shows a singular and plural pair; l1-f5, l4-f4, l4-s4 and l4-n4 ask for the umlaut in the plural
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Ä, en: The letter Ä }
    goal:
      de: "Lerne das Ä kennen, ein A mit zwei Punkten. Aus einem Apfel werden viele Äpfel."
      en: "Get to know Ä, an A with two dots. One Apfel becomes many Äpfel."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Wie klingt das ch?"
            audio: { de: "Becher." }
            options: ["wie bei ich", "wie bei Dach"]
            answer: "wie bei ich"
            keep_order: true
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Kuchen" }
            options: [{ object: cow }, { object: cook }, { object: cake }]
            answer: cake
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Ä ä"
            say: "Das ist das Ä. Es ist ein A mit zwei Punkten. Es klingt fast wie ein e: äää. So wie in Äpfel und Käse."
            show: { drawn: letter-card, text: "Ää" }
          - text: "Apfel, Äpfel"
            say: "Ein Apfel, drei Äpfel. Aus dem a wird ein ä."
            show: { object: apple, count: 3, layout: row }
          - text: "Käse"
            say: "Käse. K ... ä ... se. Hörst du das ä in der Mitte?"
            show: { object: cheese }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Hörst du ein ä?"
                say: "Käse. Hörst du in dem Wort ein ä?"
                show: { object: cheese }
                answer: true
                hints:
                  - "Sag das Wort langsam: Käse."
                  - "K ... ä ... se. Klingt es in der Mitte fast wie e?"
                  - "Ja, in Käse hörst du ein ä."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "a oder ä?"
                say: "Was hörst du in der Mitte: a oder ä?"
                audio: { de: "Säge." }
                options: ["a", "ä"]
                answer: "ä"
                feedback:
                  a: "Bei a ist der Mund weit offen. Bei Säge klingt es fast wie e: ä."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach. Ist der Mund weit offen, oder klingt es fast wie e?"
                  - "Fast wie e: Das ist das ä."
              - id: l1-f3
                type: true_false
                text: "Hörst du ein ä?"
                say: "Hase. Hörst du in dem Wort ein ä?"
                show: { object: rabbit }
                answer: false
                hints:
                  - "Sag das Wort langsam: Hase."
                  - "Ha ... se. Ist der Mund weit offen wie beim a?"
                  - "Nein, in Hase hörst du ein a."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes Ä."
                say: "Tippe auf jedes große und kleine Ä. Schau auf die zwei Punkte."
                show: { drawn: letter-card, text: "Ä a ä A Ä" }
                spans: ["Ä", "ä", "Ä"]
                hints:
                  - "Das Ä hat oben zwei Punkte."
                  - "Ein a ohne Punkte ist ein anderer Buchstabe."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Äpfel. Welcher Buchstabe fehlt?"
                show: { object: apple, count: 3, layout: row }
                frame: "_pfel"
                options: ["A", "Ä", "O"]
                answer: ["Ä"]
                hints:
                  - "Hier sind viele Äpfel, nicht nur einer."
                  - "Ein Apfel, viele Äpfel. Aus a wird ä."
                  - "Vorne fehlt das Ä."
              - id: l1-f6
                type: tracing
                text: "Schreib das Ä nach."
                show: { drawn: writing-lines, text: "Ä", mode: trace, arrows: true }
                char: "Ä"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo hörst du ein ä?"
                say: "In welchem Wort hörst du ein ä?"
                options: [{ object: sock }, { object: saw }, { object: fish }]
                answer: saw
                hints: ["S ... ä ... ge."]
              - id: l1-s2
                type: audio_choice
                text: "a oder ä?"
                say: "Was hörst du in der Mitte: a oder ä?"
                audio: { de: "Kasse." }
                options: ["ä", "a"]
                answer: "a"
                hints: ["Ist der Mund weit offen?"]
              - id: l1-s3
                type: true_false
                text: "Hörst du ein ä?"
                say: "Mädchen. Hörst du in dem Wort ein ä?"
                show: { object: girl }
                answer: true
                hints: ["Sprich es langsam: M ... ä ... dchen."]
              - id: l1-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Käse. Welcher Buchstabe fehlt?"
                show: { object: cheese }
                frame: "K_se"
                options: ["a", "ä", "o"]
                answer: ["ä"]
                hints: ["K ... ä ... se. Klingt es fast wie e?"]
              - id: l1-s5
                type: tracing
                text: "Schreib das ä nach."
                show: { drawn: writing-lines, text: "ä", mode: trace, arrows: true }
                char: "ä"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo hörst du ein ä?"
                say: "In welchem Wort hörst du ein ä?"
                options: [{ object: pizza }, { object: ball }, { object: pencil-case }]
                answer: pencil-case
              - id: l1-n2
                type: audio_choice
                text: "a oder ä?"
                say: "Was hörst du: a oder ä?"
                audio: { de: "Bär." }
                options: ["a", "ä"]
                answer: "ä"
              - id: l1-n3
                type: true_false
                text: "Hörst du ein ä?"
                say: "Bälle. Hörst du in dem Wort ein ä?"
                show: { object: ball, count: 3, layout: row }
                answer: true
              - id: l1-n4
                type: audio_choice
                text: "a oder ä?"
                say: "Was hörst du: a oder ä?"
                audio: { de: "Ball." }
                options: ["ä", "a"]
                answer: "a"
              - id: l1-n5
                type: tracing
                text: "Schreib das ä ab."
                show: { drawn: writing-lines, text: "ä", mode: copy, arrows: false }
                char: "ä"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Hörst du ein ä?"
            say: "Säge. Hörst du in dem Wort ein ä?"
            show: { object: saw }
            answer: true
          - id: l1-c2
            type: audio_choice
            text: "a oder ä?"
            say: "Was hörst du: a oder ä?"
            audio: { de: "Hände." }
            options: ["a", "ä"]
            answer: "ä"
          - id: l1-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Säge. Welcher Buchstabe fehlt?"
            show: { object: saw }
            frame: "S_ge"
            options: ["ä", "a"]
            answer: ["ä"]
          - id: l1-c4
            type: true_false
            text: "Hörst du ein ä?"
            say: "Affe. Hörst du in dem Wort ein ä?"
            show: { object: monkey }
            answer: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf jedes Ä."
            say: "Tippe auf jedes große und kleine Ä."
            show: { drawn: letter-card, text: "A ä Ä a Ä" }
            spans: ["ä", "Ä", "Ä"]
          - id: l1-c6
            type: image_multiple_choice
            text: "Wo hörst du ein ä?"
            say: "In welchem Wort hörst du ein ä?"
            options: [{ object: cat }, { object: cheese }, { object: cup }]
            answer: cheese

  - n: 2
    title: { de: Das Ö, en: The letter Ö }
    goal:
      de: "Lerne das Ö kennen, ein O mit zwei Punkten, wie bei Löwe. Mach den Mund dabei schön rund."
      en: "Get to know Ö, an O with two dots, as in Löwe. Make your mouth nice and round."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "a oder ä?"
            say: "Was hörst du: a oder ä?"
            audio: { de: "Käfer." }
            options: ["ä", "a"]
            answer: "ä"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf jedes Ä."
            say: "Tippe auf jedes große und kleine Ä."
            show: { drawn: letter-card, text: "ä a Ä" }
            spans: ["ä", "Ä"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Ö ö"
            say: "Das ist das Ö. Es ist ein O mit zwei Punkten. Sag eee und mach dabei den Mund rund wie beim o: ööö. So wie in Löwe."
            show: { drawn: letter-card, text: "Öö" }
          - text: "Löwe"
            say: "Löwe. L ... ö ... we. Hörst du das ö?"
            show: { object: lion }
          - text: "Ofen, Öfen"
            say: "Ein Ofen, zwei Öfen. Aus dem o wird ein ö."
            show: { object: oven, count: 2, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wo hörst du ein ö?"
                say: "In welchem Wort hörst du ein ö?"
                options: [{ object: lion }, { object: lamp }, { object: ladder }]
                answer: lion
                feedback:
                  lamp: "In Lampe hörst du nach dem l ein a."
                  ladder: "In Leiter hörst du nach dem l ein ei."
                hints:
                  - "Alle fangen mit lll an. Hör auf den Laut danach."
                  - "Löwe ... ö. Lampe ... a. Leiter ... ei."
                  - "In Löwe hörst du ein ö."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "o oder ö?"
                say: "Was hörst du: o oder ö?"
                audio: { de: "Möhre." }
                options: ["o", "ö"]
                answer: "ö"
                feedback:
                  o: "Beim o ist der Mund rund und groß. Bei Möhre klingt es wie ein rundes e: ö."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach. Klingt es wie ein rundes e?"
                  - "Ein rundes e: Das ist das ö."
              - id: l2-f3
                type: true_false
                text: "Hörst du ein ö?"
                say: "Mond. Hörst du in dem Wort ein ö?"
                show: { object: moon }
                answer: false
                hints:
                  - "Sag das Wort langsam: Mond."
                  - "Mmm ... o ... nd. Ist das ein o oder ein ö?"
                  - "Nein, in Mond hörst du ein o."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes Ö."
                say: "Tippe auf jedes große und kleine Ö. Schau auf die zwei Punkte."
                show: { drawn: letter-card, text: "Ö o ö O Ö" }
                spans: ["Ö", "ö", "Ö"]
                hints:
                  - "Das Ö hat oben zwei Punkte."
                  - "Ein o ohne Punkte ist ein anderer Buchstabe."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l2-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Löffel. Welcher Buchstabe fehlt?"
                show: { object: spoon }
                frame: "L_ffel"
                options: ["o", "ö", "ü"]
                answer: ["ö"]
                hints:
                  - "Sprich das Wort langsam: Löffel."
                  - "L ... ö ... ffel. Klingt es wie ein rundes e?"
                  - "Es fehlt das ö."
              - id: l2-f6
                type: tracing
                text: "Schreib das Ö nach."
                show: { drawn: writing-lines, text: "Ö", mode: trace, arrows: true }
                char: "Ö"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wo hörst du ein ö?"
                say: "In welchem Wort hörst du ein ö?"
                options: [{ object: cow }, { object: queen }, { object: cake }]
                answer: queen
                hints: ["Kö ... ni ... gin."]
              - id: l2-s2
                type: audio_choice
                text: "o oder ö?"
                say: "Was hörst du: o oder ö?"
                audio: { de: "Rose." }
                options: ["ö", "o"]
                answer: "o"
                hints: ["Ist der Mund rund und groß?"]
              - id: l2-s3
                type: true_false
                text: "Hörst du ein ö?"
                say: "Öfen. Hörst du in dem Wort ein ö?"
                show: { object: oven, count: 2, layout: row }
                answer: true
                hints: ["Ein Ofen, zwei Öfen."]
              - id: l2-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Möhre. Welcher Buchstabe fehlt?"
                show: { object: carrot }
                frame: "M_hre"
                options: ["ö", "o"]
                answer: ["ö"]
                hints: ["M ... ö ... hre."]
              - id: l2-s5
                type: tracing
                text: "Schreib das ö nach."
                show: { drawn: writing-lines, text: "ö", mode: trace, arrows: true }
                char: "ö"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wo hörst du ein ö?"
                say: "In welchem Wort hörst du ein ö?"
                options: [{ object: moon }, { object: mouse }, { object: carrot }]
                answer: carrot
              - id: l2-n2
                type: audio_choice
                text: "o oder ö?"
                say: "Was hörst du: o oder ö?"
                audio: { de: "Hose." }
                options: ["o", "ö"]
                answer: "o"
              - id: l2-n3
                type: true_false
                text: "Hörst du ein ö?"
                say: "Fröhlich. Hörst du in dem Wort ein ö?"
                show: { object: happy }
                answer: true
              - id: l2-n4
                type: audio_choice
                text: "o oder ö?"
                say: "Was hörst du: o oder ö?"
                audio: { de: "Brötchen." }
                options: ["ö", "o"]
                answer: "ö"
              - id: l2-n5
                type: tracing
                text: "Schreib das Ö ab."
                show: { drawn: writing-lines, text: "Ö", mode: copy, arrows: false }
                char: "Ö"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: true_false
            text: "Hörst du ein ö?"
            say: "Löwe. Hörst du in dem Wort ein ö?"
            show: { object: lion }
            answer: true
          - id: l2-c2
            type: audio_choice
            text: "o oder ö?"
            say: "Was hörst du: o oder ö?"
            audio: { de: "Vögel." }
            options: ["o", "ö"]
            answer: "ö"
          - id: l2-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Löwe. Welcher Buchstabe fehlt?"
            show: { object: lion }
            frame: "L_we"
            options: ["o", "ö"]
            answer: ["ö"]
          - id: l2-c4
            type: true_false
            text: "Hörst du ein ö?"
            say: "Ofen. Hörst du in dem Wort ein ö?"
            show: { object: oven }
            answer: false
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf jedes Ö."
            say: "Tippe auf jedes große und kleine Ö."
            show: { drawn: letter-card, text: "ö O Ö o Ö" }
            spans: ["ö", "Ö", "Ö"]
          - id: l2-c6
            type: audio_choice
            text: "o oder ö?"
            say: "Was hörst du: o oder ö?"
            audio: { de: "Dose." }
            options: ["ö", "o"]
            answer: "o"

  - n: 3
    title: { de: Das Ü, en: The letter Ü }
    goal:
      de: "Lerne das Ü kennen, ein U mit zwei Punkten, wie bei Mütze. Aus einem Hut werden drei Hüte."
      en: "Get to know Ü, a U with two dots, as in Mütze. One Hut becomes three Hüte."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "o oder ö?"
            say: "Was hörst du: o oder ö?"
            audio: { de: "Töne." }
            options: ["ö", "o"]
            answer: "ö"
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Wo hörst du ein ö?"
            say: "In welchem Wort hörst du ein ö?"
            options: [{ object: lamp }, { object: lion }]
            answer: lion
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Ü ü"
            say: "Das ist das Ü. Es ist ein U mit zwei Punkten. Sag iii und mach dabei den Mund rund wie beim u: üüü. So wie in Mütze."
            show: { drawn: letter-card, text: "Üü" }
          - text: "Mütze"
            say: "Mütze. M ... ü ... tze. Hörst du das ü?"
            show: { object: woolly-hat }
          - text: "Hut, Hüte"
            say: "Ein Hut, drei Hüte. Aus dem u wird ein ü."
            show: { object: hat, count: 3, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Wo hörst du ein ü?"
                say: "In welchem Wort hörst du ein ü?"
                options: [{ object: woolly-hat }, { object: mouse }, { object: moon }]
                answer: woolly-hat
                feedback:
                  mouse: "In Maus hörst du ein au."
                  moon: "In Mond hörst du ein o."
                hints:
                  - "Alle fangen mit mmm an. Hör auf den Laut danach."
                  - "Mütze ... ü. Maus ... au. Mond ... o."
                  - "In Mütze hörst du ein ü."
                difficulty: easy
              - id: l3-f2
                type: audio_choice
                text: "u oder ü?"
                say: "Was hörst du: u oder ü?"
                audio: { de: "Tür." }
                show: { object: door }
                options: ["u", "ü"]
                answer: "ü"
                feedback:
                  u: "Beim u ist der Mund klein und rund. Bei Tür klingt es wie ein rundes i: ü."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach. Klingt es wie ein rundes i?"
                  - "Ein rundes i: Das ist das ü."
              - id: l3-f3
                type: true_false
                text: "Hörst du ein ü?"
                say: "Mund. Hörst du in dem Wort ein ü?"
                show: { object: mouth }
                answer: false
                hints:
                  - "Sag das Wort langsam: Mund."
                  - "Mmm ... u ... nd. Ist das ein u oder ein ü?"
                  - "Nein, in Mund hörst du ein u."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes Ü."
                say: "Tippe auf jedes große und kleine Ü. Schau auf die zwei Punkte."
                show: { drawn: letter-card, text: "Ü u ü U Ü" }
                spans: ["Ü", "ü", "Ü"]
                hints:
                  - "Das Ü hat oben zwei Punkte."
                  - "Ein u ohne Punkte ist ein anderer Buchstabe."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Würfel. Welcher Buchstabe fehlt?"
                show: { object: cube }
                frame: "W_rfel"
                options: ["u", "ü", "ö"]
                answer: ["ü"]
                hints:
                  - "Sprich das Wort langsam: Würfel."
                  - "W ... ü ... rfel. Klingt es wie ein rundes i?"
                  - "Es fehlt das ü."
              - id: l3-f6
                type: tracing
                text: "Schreib das Ü nach."
                show: { drawn: writing-lines, text: "Ü", mode: trace, arrows: true }
                char: "Ü"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Wo hörst du ein ü?"
                say: "In welchem Wort hörst du ein ü?"
                options: [{ object: happy }, { object: tired }, { object: sad }]
                answer: tired
                hints: ["Mü ... de."]
              - id: l3-s2
                type: audio_choice
                text: "u oder ü?"
                say: "Was hörst du: u oder ü?"
                audio: { de: "Kuh." }
                options: ["ü", "u"]
                answer: "u"
                hints: ["Ist der Mund klein und rund wie bei uuu?"]
              - id: l3-s3
                type: true_false
