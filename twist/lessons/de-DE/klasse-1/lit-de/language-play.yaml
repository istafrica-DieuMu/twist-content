# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.language-play
skill: lit-de.vocabulary.language-play
curriculum: de-DE
language: de
title:
  de: Mit Sprache spielen
  en: Playing with language
summary: >
  Playing with words and sounds. Lesson 1 tells real words from
  Quatschwörter, finds the Quatschsatz, swaps the first sound of a word
  to make a new one (Maus, Haus) and makes up Quatschreime; lesson 2
  swaps the syllables of a word (Hase, Seha), turns a Quatschwort back
  into the real word, swaps the parts of a compound and sees the meaning
  change (Baumhaus, Hausbaum), and ends with the skill check. Speak tasks
  let the child say a Quatschsatz or a swapped word aloud; they are
  practice only, so the skill check marks the games a screen can mark
  (real or Quatsch, swapped sounds, syllables and word parts). Tongue
  twisters have their own set (tongue-twisters). Every Quatschwort and
  Quatschsatz is made up for Twist.
metadata:
  year: klasse-1
  topic: { de: Sprache untersuchen, en: Exploring language }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.phonological.rhymes]
  also_practises: [lit-de.phonological.syllables, lit-de.phonological.initial-sound]
  vocabulary: { de: [Quatschwort, Quatschsatz, echt, Laut, Silbe, tauschen, Reim] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: real-nonsense, what: { de: echte Wörter und Quatschwörter unterscheiden, en: telling real words from nonsense words } }
    - { id: nonsense-sentence, what: { de: Quatschsätze erkennen, en: spotting nonsense sentences } }
    - { id: swap-sound, what: { de: den ersten Laut tauschen, en: swapping the first sound } }
    - { id: swap-syllables, what: { de: Silben tauschen, en: swapping syllables } }
    - { id: swap-parts, what: { de: die Teile langer Wörter tauschen, en: swapping the parts of compound words } }
  misconceptions:
    - id: sounds-real
      what: Takes a Quatschwort for a real word because it sounds like one, without asking whether it means anything
      addressed: "lesson 1 Learn asks: Weiß ich, was das ist?; true_false and sorting tasks in every stage of lesson 1 mix real words with Quatschwörter built from German syllables (l1-f1 with hints, l1-f2, l1-s2, l1-n4, l1-c1, l2-c3)"
    - id: reverse-letters
      what: Swaps syllables by reversing the letters (Sofa to Afos) instead of moving whole syllables
      addressed: "lesson 2 Learn claps the syllables first and moves them as a whole; every \"Tausch die Silben\" task offers the reversed letters as a wrong option (l2-f2 with feedback, l2-s2, l2-n2, l2-c2)"
    - id: parts-same-meaning
      what: Thinks a compound means the same when its parts are swapped (Baumhaus, Hausbaum)
      addressed: "lesson 2 Learn sets Baumhaus against Hausbaum; l2-f4 (with feedback), l2-s3 and l2-n3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Quatschwörter und Quatschsätze", en: "Nonsense words and sentences" }
    goal:
      de: "Find heraus, was echt ist und was Quatsch. Tausch den ersten Laut, dann wird aus Maus ein Haus."
      en: "Find out what is real and what is nonsense. Swap the first sound, and Maus turns into Haus."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Reimt sich das?"
            say: "Nase, Hase. Reimt sich das?"
            show: { objects: [nose, rabbit] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Was reimt sich auf Tisch?"
            say: "Tisch. Was reimt sich auf Tisch?"
            show: { object: table }
            options: [{ object: fish }, { object: chair }, { object: frog }]
            answer: fish
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hund · Lumpa"
            say: "Hör mal: Hund. Lumpa. Was glaubst du: Welches von den beiden Wörtern gibt es wirklich?"
          - text: "Hund · Lumpa"
            say: "Hund ist ein echtes Wort. Du weißt, was ein Hund ist. Lumpa ist ein Quatschwort. Es klingt wie ein Wort, aber es bedeutet nichts. Frag dich immer: Weiß ich, was das ist?"
            show: { object: dog }
          - text: "Maus → Haus → Laus → Kaus"
            say: "Mit Lauten kannst du spielen. Tausch den ersten Laut von Maus aus. Dann wird es Haus oder Laus. Das sind echte Wörter. Oder es wird Kaus. Das ist Quatsch."
            show: { objects: [mouse, house] }
          - text: "Die Kuh fliegt zum Mond."
            say: "Auch Sätze können Quatsch sein. Die Kuh fliegt zum Mond. Das gibt es nicht wirklich. Quatschsätze sind lustig. Und du merkst sofort: Das stimmt nicht."
            show: { objects: [cow, moon] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Lumpa\n\nIst das ein echtes Wort?"
                say: "Hör gut zu. Lumpa. Ist das ein echtes Wort?"
                answer: false
                hints:
                  - "Frag dich: Weiß ich, was ein Lumpa ist?"
                  - "Hast du schon einmal ein Lumpa gesehen?"
                  - "Lumpa bedeutet nichts. Nein, es ist ein Quatschwort."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Echtes Wort oder Quatschwort?"
                say: "Ist das ein echtes Wort oder ein Quatschwort? Sortiere."
                bins:
                  - { id: real, show: { text: "echtes Wort" }, say: "echtes Wort" }
                  - { id: nonsense, show: { text: "Quatschwort" }, say: "Quatschwort" }
                options:
                  - { text: "Sonne", say: "Sonne", bin: real }
                  - { text: "Tisch", say: "Tisch", bin: real }
                  - { text: "Nofe", say: "Nofe", bin: nonsense }
                  - { text: "Kirabo", say: "Kirabo", bin: nonsense }
                hints:
                  - "Tippe auf jedes Wort und hör es dir an."
                  - "Weißt du, was eine Sonne ist? Und eine Nofe?"
                  - "Sonne und Tisch sind echt. Nofe und Kirabo sind Quatsch."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Satz ist Quatsch?"
                say: "Welcher Satz ist Quatsch?"
                options: ["Die Kuh fliegt zum Mond.", "Die Kuh frisst Gras.", "Die Kuh steht im Stall."]
                answer: "Die Kuh fliegt zum Mond."
                feedback:
                  "Die Kuh frisst Gras.": "Das macht eine Kuh wirklich. Welcher Satz kann nicht stimmen?"
                hints:
                  - "Was kann eine Kuh wirklich, was nicht?"
                  - "Kann eine Kuh fliegen?"
                  - "Die Kuh fliegt zum Mond. Das ist Quatsch."
              - id: l1-f4
                type: image_multiple_choice
                text: "Maus: Tausch den ersten Laut gegen h. Was kommt heraus?"
                say: "Maus. Tausch den ersten Laut gegen hhh. Was kommt heraus?"
                show: { object: mouse }
                options: [{ object: house }, { object: hand }, { object: mouse }]
                answer: house
                hints:
                  - "Sprich Maus ohne den ersten Laut: aus."
                  - "Setz jetzt hhh davor."
                  - "Hhh, aus. Haus."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Wort reimt sich auf Hose und ist ein Quatschwort?"
                say: "Welches Wort reimt sich auf Hose und ist ein Quatschwort?"
                options: ["Wose", "Rose", "Hase"]
                answer: "Wose"
                feedback:
                  "Rose": "Rose reimt sich auf Hose. Aber eine Rose gibt es wirklich."
                hints:
                  - "Zwei Dinge müssen stimmen: Es reimt sich, und es bedeutet nichts."
                  - "Hase reimt sich nicht. Rose ist eine Blume."
                  - "Wose. Das reimt sich und ist Quatsch."
              - id: l1-f6
                type: speak
                text: "Sag den Quatschsatz nach: „Der Fisch fährt Fahrrad.“"
                say: "Sag den Quatschsatz nach: Der Fisch fährt Fahrrad."
                expected_text: "Der Fisch fährt Fahrrad."
                hints:
                  - "Sprich deutlich."
                  - "Du darfst dabei lachen."
                  - "Der Fisch fährt Fahrrad."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Gabel\n\nIst das ein echtes Wort?"
                say: "Hör gut zu. Gabel. Ist das ein echtes Wort?"
                answer: true
                hints: ["Womit isst du Nudeln?"]
              - id: l1-s2
                type: sorting
                text: "Echtes Wort oder Quatschwort?"
                say: "Ist das ein echtes Wort oder ein Quatschwort? Sortiere."
                bins:
                  - { id: real, show: { text: "echtes Wort" }, say: "echtes Wort" }
                  - { id: nonsense, show: { text: "Quatschwort" }, say: "Quatschwort" }
                options:
                  - { text: "Banane", say: "Banane", bin: real }
                  - { text: "Lofu", say: "Lofu", bin: nonsense }
                  - { text: "Apfel", say: "Apfel", bin: real }
                  - { text: "Mirol", say: "Mirol", bin: nonsense }
                hints: ["Weißt du, was das ist? Dann ist es echt."]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Satz ist Quatsch?"
                say: "Welcher Satz ist Quatsch?"
                options: ["Der Fisch fährt Fahrrad.", "Der Fisch schwimmt im Teich.", "Der Fisch hat Flossen."]
                answer: "Der Fisch fährt Fahrrad."
                hints: ["Was kann ein Fisch wirklich?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Tisch: Tausch den ersten Laut gegen f. Was kommt heraus?"
                say: "Tisch. Tausch den ersten Laut gegen fff. Was kommt heraus?"
                show: { object: table }
                options: [{ object: fish }, { object: frog }, { object: table }]
                answer: fish
                hints: ["Sprich Tisch ohne den ersten Laut: isch."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort reimt sich auf Maus und ist ein Quatschwort?"
                say: "Welches Wort reimt sich auf Maus und ist ein Quatschwort?"
                options: ["Paus", "Haus", "Mund"]
                answer: "Paus"
                hints: ["Es reimt sich, und es bedeutet nichts."]
              - id: l1-s6
                type: speak
                text: "Sag den Quatschsatz nach: „Die Kuh fliegt zum Mond.“"
                say: "Sag den Quatschsatz nach: Die Kuh fliegt zum Mond."
                expected_text: "Die Kuh fliegt zum Mond."
                hints: ["Sprich deutlich, Wort für Wort."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Nolpe\n\nIst das ein echtes Wort?"
                say: "Hör gut zu. Nolpe. Ist das ein echtes Wort?"
                answer: false
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Satz ist Quatsch?"
                say: "Welcher Satz ist Quatsch?"
                options: ["Der Hund backt einen Kuchen.", "Der Hund bellt laut.", "Der Hund spielt mit dem Ball."]
                answer: "Der Hund backt einen Kuchen."
              - id: l1-n3
                type: image_multiple_choice
                text: "Kanne: Tausch den ersten Laut gegen t. Was kommt heraus?"
                say: "Kanne. Tausch den ersten Laut gegen t, wie bei Tiger. Was kommt heraus?"
                show: { object: jug }
                options: [{ object: fir-tree }, { object: tree }, { object: jug }]
                answer: fir-tree
              - id: l1-n4
                type: sorting
                text: "Echtes Wort oder Quatschwort?"
                say: "Ist das ein echtes Wort oder ein Quatschwort? Sortiere."
                bins:
                  - { id: real, show: { text: "echtes Wort" }, say: "echtes Wort" }
                  - { id: nonsense, show: { text: "Quatschwort" }, say: "Quatschwort" }
                options:
                  - { text: "Zebra", say: "Zebra", bin: real }
                  - { text: "Pilu", say: "Pilu", bin: nonsense }
                  - { text: "Schuh", say: "Schuh", bin: real }
                  - { text: "Bratsel", say: "Bratsel", bin: nonsense }
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort reimt sich auf Nase und ist ein Quatschwort?"
                say: "Welches Wort reimt sich auf Nase und ist ein Quatschwort?"
                options: ["Pase", "Hase", "Nudel"]
                answer: "Pase"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Bimo\n\nIst das ein echtes Wort?"
            say: "Hör gut zu. Bimo. Ist das ein echtes Wort?"
            answer: false
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Satz ist Quatsch?"
            say: "Welcher Satz ist Quatsch?"
            options: ["Der Baum geht einkaufen.", "Der Baum hat grüne Blätter.", "Der Baum steht im Garten."]
            answer: "Der Baum geht einkaufen."
          - id: l1-c3
            type: image_multiple_choice
            text: "Sonne: Tausch den ersten Laut gegen t. Was kommt heraus?"
            say: "Sonne. Tausch den ersten Laut gegen t, wie bei Tiger. Was kommt heraus?"
            show: { object: sun }
            options: [{ object: bin }, { object: sun }, { object: ball }]
            answer: bin
          - id: l1-c4
            type: true_false
            text: "Kerze\n\nIst das ein echtes Wort?"
            say: "Hör gut zu. Kerze. Ist das ein echtes Wort?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Welches Wort reimt sich auf Hand und ist ein Quatschwort?"
            say: "Welches Wort reimt sich auf Hand und ist ein Quatschwort?"
            options: ["Sand", "Mand", "Hund"]
            answer: "Mand"
          - id: l1-c6
            type: image_multiple_choice
            text: "Hose: Tausch den ersten Laut gegen r. Was kommt heraus?"
            say: "Hose. Tausch den ersten Laut gegen rrr. Was kommt heraus?"
            show: { object: trousers }
            options: [{ object: nose }, { object: trousers }, { object: rose }]
            answer: rose

  - n: 2
    title: { de: "Silben tauschen", en: "Swapping syllables" }
    goal:
      de: "Tausch die Silben eines Wortes und hör, was herauskommt. Aus Hase wird Seha, und wieder zurück."
      en: "Swap the syllables of a word and hear what comes out. Hase turns into Seha, and back again."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Kamuno\n\nIst das ein echtes Wort?"
            say: "Hör gut zu. Kamuno. Ist das ein echtes Wort?"
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Satz ist Quatsch?"
            say: "Welcher Satz ist Quatsch?"
            options: ["Die Ente liest die Zeitung.", "Die Ente schwimmt im See.", "Die Ente hat Federn."]
            answer: "Die Ente liest die Zeitung."
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ha · se → ?"
            say: "Hase hat zwei Silben. Klatsch mit: Ha, se. Was glaubst du: Was kommt heraus, wenn du die zwei Silben tauschst?"
            show: { object: rabbit }
          - text: "Ha · se → Se · ha"
            say: "Jetzt tauschen wir die Silben. Die zweite Silbe kommt nach vorn: Se, ha. Seha! Das ist ein Quatschwort. Du tauschst immer ganze Silben, nicht einzelne Buchstaben. Tauschst du noch einmal, ist der Hase wieder da."
          - text: "Baumhaus · Hausbaum"
            say: "Auch die Teile von langen Wörtern kannst du tauschen. Ein Baumhaus ist ein Haus in einem Baum. Ein Hausbaum wäre ein Baum an einem Haus. Tauschst du die Teile, ändert sich, was das Wort bedeutet."
            show: { objects: [tree, house] }
          - text: "Wusstest du? Uhu, Anna und Otto kannst du auch rückwärts lesen."
            say: "Wusstest du? Manche Wörter bleiben gleich, wenn du sie rückwärts liest: Uhu, Anna, Otto. Probier es aus: U, h, u. Von hinten ist es wieder ein Uhu!"
            show: { object: owl }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Seha: Tausch die Silben. Welches Tier ist das?"
                say: "Seha. Tausch die Silben. Welches Tier ist das?"
                options: [{ object: rabbit }, { object: snail }, { object: cat }]
                answer: rabbit
                hints:
                  - "Klatsch mit: Se, ha."
                  - "Jetzt andersherum: erst ha, dann se."
                  - "Ha, se. Hase."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Sofa: Tausch die Silben. Was kommt heraus?"
                say: "Sofa. Tausch die Silben. Was kommt heraus?"
                show: { object: sofa }
                options: ["Faso", "Afos", "Sofa"]
                answer: "Faso"
                feedback:
                  "Afos": "Hier sind die Buchstaben umgedreht. Tausch ganze Silben: So, fa wird fa, so."
                hints:
                  - "Klatsch mit: So, fa."
                  - "Die zweite Silbe kommt nach vorn."
                  - "Fa, so. Faso."
              - id: l2-f3
                type: image_multiple_choice
                text: "Zekat: Tausch die Silben. Welches Tier ist das?"
                say: "Zekat. Tausch die Silben. Welches Tier ist das?"
                options: [{ object: cat }, { object: dog }, { object: cow }]
                answer: cat
                hints:
                  - "Klatsch mit: Ze, kat."
                  - "Jetzt andersherum: erst kat, dann ze."
                  - "Kat, ze. Katze."
              - id: l2-f4
                type: multiple_choice
                text: "Was ist ein Baumhaus?"
                say: "Was ist ein Baumhaus?"
                options: ["ein Haus in einem Baum", "ein Baum an einem Haus"]
                answer: "ein Haus in einem Baum"
                feedback:
                  "ein Baum an einem Haus": "Das wäre ein Hausbaum. Beim Baumhaus ist das Haus die Hauptsache, und es ist im Baum."
                hints:
                  - "Der letzte Teil sagt, was es ist."
                  - "Ein Baumhaus ist ein Haus. Wo ist es?"
                  - "Ein Haus in einem Baum."
              - id: l2-f5
                type: ordering
                text: "Sena: Leg die Silben so, dass ein echtes Wort herauskommt."
                say: "Sena ist ein Quatschwort. Leg die Silben so, dass ein echtes Wort herauskommt."
                options: ["se", "na"]
                slot_count: 2
                answer: ["na", "se"]
                option_audio: false
                hints:
                  - "Tausch die beiden Silben."
                  - "Erst na, dann se."
                  - "Na, se. Nase."
              - id: l2-f6
                type: speak
                text: "Hose: Tausch die Silben und sag das Quatschwort."
                say: "Hose. Ho, se. Tausch die Silben und sag das Quatschwort."
                expected_text: "Seho."
                hints:
                  - "Klatsch mit: Ho, se."
                  - "Die zweite Silbe kommt nach vorn."
                  - "Se, ho. Seho."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Gelvo: Tausch die Silben. Welches Tier ist das?"
                say: "Gelvo. Tausch die Silben. Welches Tier ist das?"
                options: [{ object: bird }, { object: fish }, { object: frog }]
                answer: bird
                hints: ["Klatsch mit: Gel, vo. Und jetzt andersherum."]
              - id: l2-s2
                type: multiple_choice
                text: "Rose: Tausch die Silben. Was kommt heraus?"
                say: "Rose. Tausch die Silben. Was kommt heraus?"
                options: ["Sero", "Esor", "Rosa"]
                answer: "Sero"
                hints: ["Tausch ganze Silben: Ro, se."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist ein Spielball?"
                say: "Was ist ein Spielball?"
                options: ["ein Ball zum Spielen", "ein Spiel mit einem Ball"]
                answer: "ein Ball zum Spielen"
                hints: ["Der letzte Teil sagt, was es ist."]
              - id: l2-s4
                type: ordering
                text: "Neson: Leg die Silben so, dass ein echtes Wort herauskommt."
                say: "Neson ist ein Quatschwort. Leg die Silben so, dass ein echtes Wort herauskommt."
                options: ["ne", "son"]
                slot_count: 2
                answer: ["son", "ne"]
                option_audio: false
                hints: ["Tausch die beiden Silben."]
              - id: l2-s5
                type: true_false
                text: "Auto: Tausch die Silben. Kommt Toau heraus?"
                say: "Auto. Au, to. Tausch die Silben. Kommt Toau heraus?"
                answer: true
                hints: ["Die zweite Silbe kommt nach vorn."]
              - id: l2-s6
                type: speak
                text: "Nase: Tausch die Silben und sag das Quatschwort."
                say: "Nase. Na, se. Tausch die Silben und sag das Quatschwort."
                expected_text: "Sena."
                hints: ["Die zweite Silbe kommt nach vorn."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Felap: Tausch die Silben. Was ist das?"
                say: "Felap. Tausch die Silben. Was ist das?"
                options: [{ object: apple }, { object: banana }, { object: ball }]
                answer: apple
              - id: l2-n2
                type: multiple_choice
                text: "Pudel: Tausch die Silben. Was kommt heraus?"
                say: "Pudel. Tausch die Silben. Was kommt heraus?"
                options: ["Delpu", "Ledup", "Nudel"]
                answer: "Delpu"
              - id: l2-n3
                type: multiple_choice
                text: "Was ist ein Apfelbaum?"
                say: "Was ist ein Apfelbaum?"
                options: ["ein Baum mit Äpfeln", "ein Apfel mit einem Baum darauf"]
                answer: "ein Baum mit Äpfeln"
              - id: l2-n4
                type: ordering
                text: "Seho: Leg die Silben so, dass ein echtes Wort herauskommt."
                say: "Seho ist ein Quatschwort. Leg die Silben so, dass ein echtes Wort herauskommt."
                options: ["se", "ho"]
                slot_count: 2
                answer: ["ho", "se"]
                option_audio: false
              - id: l2-n5
                type: speak
                text: "Sofa: Tausch die Silben und sag das Quatschwort."
                say: "Sofa. Tausch die Silben und sag das Quatschwort."
                expected_text: "Faso."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: swap-syllables
            type: image_multiple_choice
            text: "Nekan: Tausch die Silben. Was ist das?"
            say: "Nekan. Tausch die Silben. Was ist das?"
            options: [{ object: jug }, { object: cup }, { object: fir-tree }]
            answer: jug
          - id: l2-c2
            part: swap-syllables
            type: multiple_choice
            text: "Tasse: Tausch die Silben. Was kommt heraus?"
            say: "Tasse. Tausch die Silben. Was kommt heraus?"
            options: ["Setas", "Essat", "Tasche"]
            answer: "Setas"
          - id: l2-c3
            part: real-nonsense
            type: true_false
            text: "Mopi\n\nIst das ein echtes Wort?"
            say: "Hör gut zu. Mopi. Ist das ein echtes Wort?"
            answer: false
          - id: l2-c4
            part: nonsense-sentence
            type: multiple_choice
            text: "Welcher Satz ist Quatsch?"
            say: "Welcher Satz ist Quatsch?"
            options: ["Die Maus fährt mit dem Bus zur Schule.", "Die Maus frisst Käse.", "Die Maus wohnt in einem Loch."]
            answer: "Die Maus fährt mit dem Bus zur Schule."
