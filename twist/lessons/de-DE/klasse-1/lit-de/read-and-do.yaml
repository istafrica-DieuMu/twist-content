# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.read-and-do
skill: lit-de.decoding.read-and-do
curriculum: de-DE
language: de
title:
  de: Lesen und tun
  en: Read and do
summary: >
  Reading a short Arbeitsanweisung and doing what it says. The
  instruction is on screen and the voice only says "Lies die Aufgabe und
  mach, was dort steht", so the child has to read it. Lesson 1: one-step
  instructions to tap a thing in a colour, tap every word with a letter,
  count and write the number, put a given letter in a gap (Setze ein H
  ein: _ose, where R and D also make words), and judge whether a child
  did a task right. Lesson 2: the usual instruction words (kreuze an,
  kreise ein, streiche durch, unterstreiche, schreibe ab), two-step
  instructions with zuerst and dann, sorting by an instruction, and the
  skill check. Paper actions such as circling are checked as knowing
  what the word asks for.
metadata:
  year: klasse-1
  topic: { de: Erste Sätze lesen, en: First sentences }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.first-sentences]
  also_practises: [lit-de.decoding.first-sentences]
  vocabulary: { de: [Aufgabe, ankreuzen, einkreisen, durchstreichen, unterstreichen, abschreiben, ordnen, zuerst, dann] }
  forms: [text, audio, picture, drawn]
  drawn: [word-card, letter-card]
  sounds: []
  facets: []
  parts:
    - { id: one-step, what: { de: eine Aufgabe mit einem Schritt lesen und ausführen, en: reading a one-step instruction and carrying it out } }
    - { id: task-words, what: { de: Aufgabenwörter wie „kreise ein“ verstehen, en: understanding instruction words such as kreise ein } }
    - { id: two-steps, what: { de: Aufgaben mit zwei Schritten in der richtigen Reihenfolge ausführen, en: carrying out instructions of two steps in the right order } }
  misconceptions:
    - id: acts-too-early
      what: Starts after the first words and misses the colour, the thing or the letter the instruction names
      addressed: lesson 1 Learn says read to the full stop, then do, then check; colour instructions in every stage (l1-f2, l1-s1, l1-s2, l1-n2, l1-c1, l2-s3, l2-c1), with feedback on l1-f2; l1-f6 and l1-n5 ask whether another child did it right
    - id: own-answer
      what: Does what makes sense instead of what is asked, for example writes R for Rose when the task says Setze ein H ein
      addressed: the gap tasks l1-f5, l1-s5, l1-c2 and the skill check task l2-c4 have options that all make words, with feedback on l1-f5
    - id: instruction-words
      what: Mixes up the instruction words (kreuze an, kreise ein, streiche durch, unterstreiche)
      addressed: lesson 2 Learn explains each; l2-f1, l2-f4, l2-s1, l2-n1, l2-n5 and l2-c2 ask what a word means, with feedback on l2-f4
    - id: order-ignored
      what: Ignores zuerst and dann and does the steps in any order
      addressed: lesson 2 Learn reads a two-step task; l2-f2, l2-s2, l2-n2 and l2-c3 order taps, and l2-f5 asks whether a child kept the order
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Lies und tu es, en: Read it and do it }
    goal:
      de: "Lies eine Aufgabe bis zum Punkt und mach genau, was dort steht. Steht da Katze, tippst du nur auf die Katze."
      en: "Read a task to the full stop and do exactly what it says. If it says cat, you tap only the cat."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Der Ball ist blau." }
            options: [{ object: ball, colour: red }, { object: ball, colour: blue }]
            answer: blue
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Das ist ein Hut.\n\nPasst der Satz zum Bild?"
            say: "Lies den Satz. Passt er zum Bild?"
            show: { object: hat }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Male den Ball rot an."
            say: "Ben liest nur: Male den ... und malt schon los. Er malt ein Auto blau an. Was glaubst du: Hat Ben die Aufgabe richtig gemacht?"
            show: { object: car, colour: blue }
          - text: "Male den Ball rot an."
            say: "Nein! Ein blaues Auto, dabei sollte es ein roter Ball sein. Das ist eine Aufgabe. Sie sagt dir, was du tun sollst. Das Wort, das sagt, was du tun sollst, steht ganz vorne: Male. Dann steht da, was du malen sollst und wie: den Ball, rot."
            show: { object: ball, colour: red }
          - text: "Tippe auf die Katze."
            say: "Lies die Aufgabe ganz bis zum Punkt. Mach erst dann, was dort steht. Tippe auf die Katze heißt: nur auf die Katze. Nicht auf den Hund und nicht auf die Maus."
            show: { object: cat }
          - text: "Erst lesen. Dann tun. Dann prüfen."
            say: "Lies die Aufgabe. Tu, was sie sagt. Lies sie danach noch einmal und prüfe: Habe ich alles so gemacht, wie es dort steht?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Tippe auf die Katze."
                say: "Lies die Aufgabe und mach, was dort steht."
                options: [{ object: dog }, { object: cat }, { object: mouse }]
                answer: cat
                hints:
                  - "Lies die Aufgabe Wort für Wort."
                  - "Tippe auf die ... Welches Tier steht am Ende?"
                  - "Tippe auf die Katze."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Welches Bild ist richtig gemalt?"
                say: "Lies die Aufgabe auf der Karte. Welches Bild ist richtig gemalt?"
                show: { drawn: word-card, text: "Male den Ball rot an." }
                options:
                  - { object: ball, colour: blue, key: ball-blue }
                  - { object: car, colour: red, key: car-red }
                  - { object: ball, colour: red, key: ball-red }
                answer: ball-red
                feedback:
                  car-red: "Rot stimmt. Aber in der Aufgabe steht Ball."
                  ball-blue: "Das ist ein Ball. Lies noch einmal, welche Farbe er haben soll."
                hints:
                  - "Was sollst du malen? Und in welcher Farbe?"
                  - "Male den Ball ... Lies das nächste Wort."
                  - "Ein roter Ball."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf jedes Wort, das mit M beginnt."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { drawn: letter-card, text: "Maus Hund Mond Haus Mama" }
                spans: ["Maus", "Mond", "Mama"]
                hints:
                  - "Lies die Aufgabe. Worauf sollst du tippen?"
                  - "Schau bei jedem Wort auf den ersten Buchstaben."
                  - "Es sind drei: Maus, Mond, Mama."
              - id: l1-f4
                type: text_input
                text: "Zähle die Äpfel. Schreibe die Zahl."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { object: apple, count: 4, layout: row }
                answer: "4"
                hints:
                  - "Die Aufgabe hat zwei Teile: zählen und schreiben."
                  - "Zeig auf jeden Apfel und zähle mit."
                  - "Es sind vier Äpfel. Schreib die 4."
              - id: l1-f5
                type: fill_in_blank
                text: "Setze ein H ein."
                say: "Lies die Aufgabe und mach, was dort steht."
                frame: "_ose"
                options: ["R", "H", "D"]
                answer: ["H"]
                feedback:
                  R: "Rose ist ein Wort. Aber welcher Buchstabe steht in der Aufgabe?"
                  D: "Dose ist ein Wort. Aber welcher Buchstabe steht in der Aufgabe?"
                hints:
                  - "Alle drei passen. Welcher Buchstabe steht in der Aufgabe?"
                  - "Setze ein ... Lies den Buchstaben in der Aufgabe."
                  - "Setze das H ein: Hose."
              - id: l1-f6
                type: true_false
                text: "Aufgabe: Male die Sonne gelb an.\nMia malt die Sonne blau.\n\nHat Mia die Aufgabe richtig gemacht?"
                say: "Lies die Aufgabe und was Mia macht. Hat Mia die Aufgabe richtig gemacht?"
                answer: false
                hints:
                  - "Welche Farbe steht in der Aufgabe?"
                  - "In der Aufgabe steht gelb. Was macht Mia?"
                  - "Nein. Mia malt blau, gelb wäre richtig."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Tippe auf das blaue Auto."
                say: "Lies die Aufgabe und mach, was dort steht."
                options: [{ object: car, colour: red }, { object: car, colour: yellow }, { object: car, colour: blue }]
                answer: blue
                hints: ["Alle sind Autos. Welche Farbe steht in der Aufgabe?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Bild ist richtig gemalt?"
                say: "Lies die Aufgabe auf der Karte. Welches Bild ist richtig gemalt?"
                show: { drawn: word-card, text: "Male das Blatt gelb an." }
                options: [{ object: leaf, colour: red }, { object: leaf, colour: yellow }, { object: leaf, colour: green }]
                answer: yellow
                hints: ["Lies bis zum Ende: Welche Farbe soll das Blatt haben?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf alle Tiere."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { drawn: letter-card, text: "Hund Tisch Maus Ball Kuh" }
                spans: ["Hund", "Maus", "Kuh"]
                hints: ["Lies jedes Wort. Ist es ein Tier?"]
              - id: l1-s4
                type: text_input
                text: "Zähle die Fische. Schreibe die Zahl."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { object: fish, count: 6, layout: scattered }
                answer: "6"
                hints: ["Tippe beim Zählen auf jeden Fisch einmal."]
              - id: l1-s5
                type: fill_in_blank
                text: "Setze ein M ein."
                say: "Lies die Aufgabe und mach, was dort steht."
                frame: "_aus"
                options: ["H", "L", "M"]
                answer: ["M"]
                hints: ["Welcher Buchstabe steht in der Aufgabe?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Tippe auf den Hut."
                say: "Lies die Aufgabe und mach, was dort steht."
                options: [{ object: house }, { object: hand }, { object: hat }]
                answer: hat
              - id: l1-n2
                type: image_multiple_choice
                text: "Welches Bild ist richtig gemalt?"
                say: "Lies die Aufgabe auf der Karte. Welches Bild ist richtig gemalt?"
                show: { drawn: word-card, text: "Male das Kleid blau an." }
                options: [{ object: dress, colour: red }, { object: dress, colour: blue }, { object: dress, colour: yellow }]
                answer: blue
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf alle Wörter, die mit B anfangen."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { drawn: letter-card, text: "Ball Bett Hund Dach Brot" }
                spans: ["Ball", "Bett", "Brot"]
              - id: l1-n4
                type: text_input
                text: "Zähle die Sterne. Schreibe die Zahl."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { object: star, count: 5, layout: scattered }
                answer: "5"
              - id: l1-n5
                type: true_false
                text: "Aufgabe: Tippe auf den Hund.\nTom tippt auf die Katze.\n\nHat Tom die Aufgabe richtig gemacht?"
                say: "Lies die Aufgabe und was Tom macht. Hat Tom die Aufgabe richtig gemacht?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Tippe auf den gelben Ball."
            say: "Lies die Aufgabe und mach, was dort steht."
            options: [{ object: ball, colour: blue }, { object: ball, colour: yellow }, { object: ball, colour: red }]
            answer: yellow
          - id: l1-c2
            type: fill_in_blank
            text: "Setze ein T ein."
            say: "Lies die Aufgabe und mach, was dort steht."
            frame: "_ante"
            options: ["K", "T"]
            answer: ["T"]
          - id: l1-c3
            type: text_input
            text: "Zähle die Eier. Schreibe die Zahl."
            say: "Lies die Aufgabe und mach, was dort steht."
            show: { object: egg, count: 3, layout: row }
            answer: "3"
          - id: l1-c4
            type: image_multiple_choice
            text: "Tippe auf die Gabel."
            say: "Lies die Aufgabe und mach, was dort steht."
            options: [{ object: spoon }, { object: knife }, { object: fork }]
            answer: fork
            option_audio: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf alle Wörter, die mit R beginnen."
            say: "Lies die Aufgabe und mach, was dort steht."
            show: { drawn: letter-card, text: "Rose Hose Rad Dose Ring" }
            spans: ["Rose", "Rad", "Ring"]
          - id: l1-c6
            type: true_false
            text: "Aufgabe: Tippe auf das Auto.\nEmma tippt auf das Auto.\n\nHat Emma die Aufgabe richtig gemacht?"
            say: "Lies die Aufgabe und was Emma macht. Hat Emma die Aufgabe richtig gemacht?"
            answer: true

  - n: 2
    title: { de: Aufgabenwörter, en: Instruction words }
    goal:
      de: "Lerne Aufgabenwörter wie kreuze an und streiche durch. Lies bei zwei Schritten genau, was zuerst kommt."
      en: "Learn task words like tick and cross out. When there are two steps, read carefully what comes first."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Tippe auf den Apfel."
            say: "Lies die Aufgabe und mach, was dort steht."
            options: [{ object: banana }, { object: apple }]
            answer: apple
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Setze ein R ein."
            say: "Lies die Aufgabe und mach, was dort steht."
            frame: "_ose"
            options: ["H", "R"]
            answer: ["R"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Kreise ein."
            say: "In einer Aufgabe steht: Kreise ein. Was glaubst du: Was sollst du jetzt machen?"
          - text: "Kreuze an.\nKreise ein.\nStreiche durch."
            say: "In Aufgaben stehen oft diese Wörter. Kreuze an heißt: Mach ein Kreuz. Kreise ein heißt: Mal einen Kreis darum. Streiche durch heißt: Mach einen Strich mitten durch."
          - text: "Wusstest du? Auch Erwachsene kreuzen an."
            say: "Wusstest du? Auch Erwachsene kreuzen an. Bei einer Wahl macht jeder ein Kreuz auf einem Zettel. So bestimmen sie zum Beispiel, wer Bürgermeister wird."
          - text: "Unterstreiche.\nSchreibe ab.\nOrdne."
            say: "Unterstreiche heißt: Zieh einen Strich darunter. Schreibe ab heißt: Schreib es genauso noch einmal. Ordne heißt: Bring es in die richtige Reihenfolge."
          - text: "Tippe zuerst auf die Katze, dann auf den Hund."
            say: "Manche Aufgaben haben zwei Schritte. Lies die ganze Aufgabe. Die Wörter zuerst und dann sagen dir, was du vorher und was du danach machst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Aufgabe: Kreise das Wort ein.\n\nWas sollst du machen?"
                say: "Lies die Aufgabe. Was sollst du machen?"
                options: ["ein Kreuz machen", "einen Kreis um das Wort malen", "das Wort durchstreichen"]
                answer: "einen Kreis um das Wort malen"
                feedback:
                  "ein Kreuz machen": "Ein Kreuz machst du bei „kreuze an“. Hier steht „kreise ein“."
                hints:
                  - "In „kreise“ steckt ein anderes Wort. Welches?"
                  - "Kreise ein: Da steckt Kreis drin."
                  - "Du malst einen Kreis um das Wort."
              - id: l2-f2
                type: ordering
                text: "Tippe zuerst auf den Hund, dann auf die Katze, dann auf die Maus."
                say: "Lies die Aufgabe und mach, was dort steht."
                options: [{ object: mouse }, { object: dog }, { object: cat }]
                slot_count: 3
                answer: [dog, cat, mouse]
                hints:
                  - "Lies die Aufgabe ganz. Was kommt zuerst?"
                  - "Zuerst der Hund. Was steht nach dem ersten dann?"
                  - "Hund, Katze, Maus."
              - id: l2-f3
                type: sorting
                text: "Lege die Tiere zu den Tieren und das Obst zum Obst."
                say: "Lies die Aufgabe und mach, was dort steht."
                bins:
                  - { id: tiere, show: { text: "Tiere" } }
                  - { id: obst, show: { text: "Obst" } }
                options:
                  - { object: cat, bin: tiere }
                  - { object: banana, bin: obst }
                  - { object: frog, bin: tiere }
                  - { object: strawberry, bin: obst }
                hints:
                  - "Lies die zwei Felder: Tiere und Obst."
                  - "Ist es ein Tier, oder kann man es als Obst essen?"
                  - "Katze und Frosch zu den Tieren. Banane und Erdbeere zum Obst."
              - id: l2-f4
                type: multiple_choice
                text: "Aufgabe: Streiche das Wort durch.\n\nWas sollst du machen?"
                say: "Lies die Aufgabe. Was sollst du machen?"
                options: ["einen Strich unter das Wort machen", "einen Strich durch das Wort machen", "einen Kreis um das Wort malen"]
                answer: "einen Strich durch das Wort machen"
                feedback:
                  "einen Strich unter das Wort machen": "Einen Strich darunter machst du bei „unterstreiche“."
                hints:
                  - "Streiche durch: Wo geht der Strich hin?"
                  - "Durch heißt: mitten durch das Wort."
                  - "Du machst einen Strich durch das Wort."
              - id: l2-f5
                type: true_false
                text: "Aufgabe: Tippe zuerst auf den Mond, dann auf die Sonne.\nLea tippt zuerst auf die Sonne.\n\nHat Lea die Aufgabe richtig gemacht?"
                say: "Lies die Aufgabe und was Lea macht. Hat Lea die Aufgabe richtig gemacht?"
                answer: false
                hints:
                  - "Was soll zuerst kommen?"
                  - "In der Aufgabe steht: zuerst auf den Mond. Worauf tippt Lea zuerst?"
                  - "Nein. Lea hätte zuerst auf den Mond tippen sollen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Aufgabe: Kreuze das richtige Bild an.\n\nWas sollst du machen?"
                say: "Lies die Aufgabe. Was sollst du machen?"
                options: ["das Bild anmalen", "ein Kreuz machen", "einen Kreis malen"]
                answer: "ein Kreuz machen"
                hints: ["In „kreuze“ steckt ein anderes Wort. Welches?"]
              - id: l2-s2
                type: ordering
                text: "Tippe zuerst auf die Banane, dann auf den Apfel, dann auf die Erdbeere."
                say: "Lies die Aufgabe und mach, was dort steht."
                options: [{ object: strawberry }, { object: apple }, { object: banana }]
                slot_count: 3
                answer: [banana, apple, strawberry]
                hints: ["Lies die Aufgabe bis zum Punkt. Was kommt zuerst?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welches Bild ist richtig gemalt?"
                say: "Lies die Aufgabe auf der Karte. Welches Bild ist richtig gemalt?"
                show: { drawn: word-card, text: "Male den Buntstift lila an." }
                options: [{ object: crayon, colour: pink }, { object: crayon, colour: blue }, { object: crayon, colour: purple }]
                answer: purple
                hints: ["Welche Farbe steht am Ende der Aufgabe?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf alle Wörter, die mit S beginnen."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { drawn: letter-card, text: "Sofa Hase Sand Tisch Seil" }
                spans: ["Sofa", "Sand", "Seil"]
                hints: ["Schau nur auf den ersten Buchstaben. Ein S in der Mitte zählt nicht."]
              - id: l2-s5
                type: text_input
                text: "Zähle die Bälle. Schreibe die Zahl."
                say: "Lies die Aufgabe und mach, was dort steht."
                show: { object: ball, count: 7, layout: scattered }
                answer: "7"
                hints: ["Zähle jeden Ball nur einmal."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Aufgabe: Unterstreiche das Wort.\n\nWas sollst du machen?"
                say: "Lies die Aufgabe. Was sollst du machen?"
                options: ["einen Strich durch das Wort machen", "das Wort abschreiben", "einen Strich unter das Wort machen"]
                answer: "einen Strich unter das Wort machen"
              - id: l2-n2
                type: ordering
                text: "Tippe zuerst auf die Kuh, dann auf das Schwein, dann auf die Ziege."
                say: "Lies die Aufgabe und mach, was dort steht."
                options: [{ object: goat }, { object: cow }, { object: pig }]
                slot_count: 3
                answer: [cow, pig, goat]
              - id: l2-n3
                type: sorting
                text: "Lege das Spielzeug zum Spielzeug und das Essen zum Essen."
                say: "Lies die Aufgabe und mach, was dort steht."
                bins:
                  - { id: spielzeug, show: { text: "Spielzeug" } }
                  - { id: essen, show: { text: "Essen" } }
                options:
                  - { object: ball, bin: spielzeug }
                  - { object: bread, bin: essen }
                  - { object: kite, bin: spielzeug }
                  - { object: pizza, bin: essen }
              - id: l2-n4
                type: true_false
                text: "Aufgabe: Male den Stern gelb an.\nOle malt den Stern gelb an.\n\nHat Ole die Aufgabe richtig gemacht?"
                say: "Lies die Aufgabe und was Ole macht. Hat Ole die Aufgabe richtig gemacht?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Aufgabe: Schreibe das Wort ab.\n\nWas sollst du machen?"
                say: "Lies die Aufgabe. Was sollst du machen?"
                options: ["das Wort laut lesen", "das Wort noch einmal genauso schreiben", "das Wort durchstreichen"]
                answer: "das Wort noch einmal genauso schreiben"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: one-step
            type: image_multiple_choice
            text: "Tippe auf den grünen Luftballon."
            say: "Lies die Aufgabe und mach, was dort steht."
            options: [{ object: balloon, colour: red }, { object: balloon, colour: green }, { object: balloon, colour: blue }]
            answer: green
            option_audio: false
          - id: l2-c6
            part: one-step
            type: image_multiple_choice
            text: "Tippe auf das grüne Auto."
            say: "Lies die Aufgabe und mach, was dort steht."
            options: [{ object: car, colour: orange }, { object: car, colour: red }, { object: car, colour: green }]
            answer: green
            option_audio: false
          - id: l2-c7
            part: one-step
            type: highlight_in_text
            text: "Tippe auf alle Wörter, die mit L beginnen."
            say: "Lies die Aufgabe und mach, was dort steht."
            show: { drawn: letter-card, text: "Lampe Hose Leiter Mond Löwe" }
            spans: ["Lampe", "Leiter", "Löwe"]
          - id: l2-c8
