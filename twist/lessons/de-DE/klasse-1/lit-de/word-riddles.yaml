# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.word-riddles
skill: lit-de.decoding.word-riddles
curriculum: de-DE
language: de
title:
  de: Worträtsel und Wortketten
  en: Word riddles and word chains
summary: >
  Children read and solve short word puzzles. Lesson 1 reads riddles of
  two short sentences ("Ich bin rund. Ich rolle.") and finds the picture
  that solves them; the voice never reads the riddle, so the child must.
  Lesson 2 plays Wortketten, where each word starts with the last letter
  of the word before (Ball, Lama, Apfel), and Buchstabensalat, where
  mixed-up letters are put back into a word, and ends with the skill
  check.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter lesen, en: Reading first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.word-picture]
  also_practises: [lit-de.decoding.word-picture, lit-de.vocabulary.language-play]
  vocabulary: { de: [Rätsel, Wortkette, Buchstabensalat, letzter Buchstabe] }
  forms: [picture, drawn, audio]
  drawn: [word-card, letter-card]
  facets: []
  misconceptions:
    - id: one-clue
      what: "Reads only the first clue of a riddle and picks the first picture that fits it (rund: Ball or Sonne or Apfel)"
      addressed: "every riddle has two clues and each picture fits only one of them; feedback on l1-f1 and l1-f3 names the clue the wrong picture misses"
    - id: first-letter-chain
      what: In a Wortkette joins on the first letter of the word before, not the last
      addressed: "lesson 2 Learn marks the last letter; options in l2-f1 and l2-s1 include a word that starts like the word before; l2-f1 gives feedback on it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Rätsel lesen, en: Reading riddles }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Maus" }
            options: [{ object: house }, { object: mouse }]
            answer: mouse
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Brot" }
            options: [{ object: boat }, { object: bread }]
            answer: bread
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich bin rund. Ich bin am Himmel."
            say: "Das ist ein Rätsel. Ich lese es dir einmal vor: Ich bin rund. Ich bin am Himmel. Was kann das sein?"
            show: { drawn: letter-card, text: "Ich bin rund. Ich bin am Himmel." }
          - text: "rund und am Himmel"
            say: "Ein Ball ist rund, aber er ist nicht am Himmel. Ein Vogel ist am Himmel, aber er ist nicht rund. Hier passt beides nur zur Sonne."
            show: { objects: [ball, sun] }
          - text: "Ab jetzt liest du."
            say: "Ab jetzt liest du die Rätsel selbst. Lies jeden Satz, und such das Bild, zu dem alles passt."
            show: { object: sun }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Ich bin gelb. Ich bin krumm."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: sun }, { object: banana }, { object: cheese }]
                answer: banana
                feedback:
                  sun: "Die Sonne ist gelb, aber sie ist nicht krumm."
                hints:
                  - "Lies beide Sätze. Zu welchem Bild passen beide?"
                  - "Gelb sind alle drei. Welches davon ist krumm?"
                  - "Die Banane ist gelb und krumm."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Ich habe vier Beine. Ich sage muh."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: dog }, { object: cow }, { object: duck }]
                answer: cow
                hints:
                  - "Lies beide Sätze."
                  - "Vier Beine haben Hund und Kuh. Wer sagt muh?"
                  - "Die Kuh."
              - id: l1-f3
                type: image_multiple_choice
                text: "Ich bin rot. Ich bin eine Blume."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: strawberry }, { object: rose }, { object: tree }]
                answer: rose
                feedback:
                  strawberry: "Die Erdbeere ist rot, aber sie ist keine Blume."
                hints:
                  - "Lies beide Sätze bis zum Ende."
                  - "Rot ist auch die Erdbeere. Aber ist sie eine Blume?"
                  - "Die Rose."
              - id: l1-f4
                type: true_false
                text: "Ich bin klein. Ich habe Stacheln."
                say: "Lies das Rätsel. Passt das Bild dazu?"
                show: { object: hedgehog }
                answer: true
                hints:
                  - "Lies beide Sätze. Schau dir das Bild an."
                  - "Ist der Igel klein? Hat er Stacheln?"
                  - "Ja, das ist der Igel."
              - id: l1-f5
                type: image_multiple_choice
                text: "Man kann mich essen. Ich bin kalt."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: ice-cream }, { object: snow }, { object: bread }]
                answer: ice-cream
                hints:
                  - "Zu welchem Bild passen beide Sätze?"
                  - "Schnee ist kalt, aber man isst ihn nicht. Brot isst man, aber es ist nicht kalt."
                  - "Das Eis."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Ich habe zwei Räder. Ich habe eine Klingel."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: car }, { object: bike }, { object: bell }]
                answer: bike
                hints: ["Ein Auto hat vier Räder."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Ich bin lang. Ich habe keine Beine."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: giraffe }, { object: snake }, { object: dog }]
                answer: snake
                hints: ["Die Giraffe hat einen langen Hals, aber sie hat Beine."]
              - id: l1-s3
                type: true_false
                text: "Ich bin grün. Ich kann springen."
                say: "Lies das Rätsel. Passt das Bild dazu?"
                show: { object: leaf }
                answer: false
                hints: ["Ein Blatt ist grün. Aber kann es springen?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Ich bin weiß. Ich falle im Winter."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: rain }, { object: snow }, { object: milk }]
                answer: snow
                hints: ["Regen fällt auch, aber er ist nicht weiß."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Ich habe Zeiger. Ich sage dir die Zeit."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: clock }, { object: telephone }, { object: bell }]
                answer: clock
                hints: ["Zeiger hat nur eins davon."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Ich habe Flügel. Ich mache Honig."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: bird }, { object: butterfly }, { object: bee }]
                answer: bee
              - id: l1-n2
                type: true_false
                text: "Ich bin rund. Man spielt mit mir."
                say: "Lies das Rätsel. Passt das Bild dazu?"
                show: { object: ball }
                answer: true
              - id: l1-n3
                type: image_multiple_choice
                text: "Ich bin im Wasser. Ich habe keine Beine."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: duck }, { object: fish }, { object: frog }]
                answer: fish
              - id: l1-n4
                type: image_multiple_choice
                text: "Man trägt mich auf dem Kopf. Ich bin warm."
                say: "Lies das Rätsel. Welches Bild passt?"
                options: [{ object: woolly-hat }, { object: sock }, { object: jumper }]
                answer: woolly-hat
              - id: l1-n5
                type: true_false
                text: "Ich habe einen Rüssel. Ich bin klein."
                say: "Lies das Rätsel. Passt das Bild dazu?"
                show: { object: elephant }
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Ich bin orange. Hasen fressen mich."
            say: "Lies das Rätsel. Welches Bild passt?"
            options: [{ object: orange }, { object: carrot }, { object: apple }]
            answer: carrot
          - id: l1-c2
            type: image_multiple_choice
            text: "Ich schwimme. Ich sage quak."
            say: "Lies das Rätsel. Welches Bild passt?"
            options: [{ object: fish }, { object: duck }, { object: whale }]
            answer: duck
          - id: l1-c3
            type: true_false
            text: "Ich bin ein Tier. Ich habe einen langen Hals."
            say: "Lies das Rätsel. Passt das Bild dazu?"
            show: { object: giraffe }
            answer: true

  - n: 2
    title: { de: Wortketten und Buchstabensalat, en: Word chains and jumbled letters }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Ich bin gelb. Ich bin am Himmel."
            say: "Lies das Rätsel. Welches Bild passt?"
            options: [{ object: banana }, { object: sun }]
            answer: sun
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ich habe lange Ohren. Ich hoppele."
            say: "Lies das Rätsel. Passt das Bild dazu?"
            show: { object: rabbit }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ball  Lama"
            say: "Das ist eine Wortkette. Ball hört mit l auf. Das nächste Wort fängt mit L an: Lama."
            show: { drawn: letter-card, text: "Ball Lama" }
          - text: "Ball  Lama  Apfel"
            say: "Lama hört mit a auf. Also kommt ein Wort mit A: Apfel. Immer der letzte Buchstabe ist der neue Anfang."
            show: { drawn: letter-card, text: "Ball Lama Apfel" }
          - text: "s u a M"
            say: "Das ist Buchstabensalat. Die Buchstaben sind durcheinander. Der große Buchstabe kommt nach vorne: M. Dann probierst du: Maus."
            show: { drawn: letter-card, text: "s u a M" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Wort kommt als Nächstes?"
                say: "Das ist eine Wortkette. Welches Wort kommt als Nächstes?"
                show: { drawn: letter-card, text: "Hund Dose ?" }
                options: ["Esel", "Hase", "Dach"]
                option_audio: false
                answer: "Esel"
                feedback:
                  Dach: "Dach fängt so an wie Dose. Du brauchst aber den letzten Buchstaben von Dose: e."
                  Hase: "Hase fängt mit H an. Dose hört mit e auf."
                hints:
                  - "Schau auf den letzten Buchstaben von Dose."
                  - "Dose hört mit e auf. Welches Wort fängt mit E an?"
                  - "Esel."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Buchstabensalat: Welches Wort ist es?"
                say: "Buchstabensalat. Leg die Buchstaben so, dass ein Wort entsteht."
                show: { object: fish }
                options: ["s", "F", "c", "i", "h"]
                slot_count: 5
                answer: ["F", "i", "s", "c", "h"]
                option_audio: false
                hints:
                  - "Der große Buchstabe kommt nach vorne."
                  - "Das Bild hilft dir: Fisch. F ... i ... sch."
                  - "F, i, s, c, h."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort kommt als Nächstes?"
                say: "Das ist eine Wortkette. Welches Wort kommt als Nächstes?"
                show: { drawn: letter-card, text: "Igel Lampe ?" }
                options: ["Ente", "Igel", "Leiter"]
                option_audio: false
                answer: "Ente"
                hints:
                  - "Schau auf den letzten Buchstaben von Lampe."
                  - "Lampe hört mit e auf."
                  - "Ente."
              - id: l2-f4
                type: multiple_choice
                text: "Buchstabensalat: Welches Wort ist es?"
                say: "Buchstabensalat. Welches Wort steckt darin?"
                show: { drawn: letter-card, text: "o B t o" }
                options: ["Boot", "Brot", "Tor"]
                option_audio: false
                answer: "Boot"
                hints:
                  - "Zähl die Buchstaben. Welches Wort hat genau diese Buchstaben?"
                  - "Ein B, ein t und zwei o."
                  - "Boot."
              - id: l2-f5
                type: true_false
                text: "Ist das eine richtige Wortkette?"
                say: "Lies die Wortkette. Fängt jedes Wort mit dem letzten Buchstaben des Wortes davor an?"
                show: { drawn: letter-card, text: "Maus Sonne Esel" }
                answer: true
                hints:
                  - "Prüf jedes Paar: Maus und Sonne, dann Sonne und Esel."
                  - "Maus hört mit s auf, Sonne fängt mit S an. Sonne hört mit e auf, Esel fängt mit E an."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Wort kommt als Nächstes?"
                say: "Das ist eine Wortkette. Welches Wort kommt als Nächstes?"
                show: { drawn: letter-card, text: "Oma Affe ?" }
                options: ["Ast", "Esel", "Oper"]
                option_audio: false
                answer: "Esel"
                hints: ["Nicht der erste, der letzte Buchstabe von Affe."]
              - id: l2-s2
                type: ordering
                text: "Buchstabensalat: Welches Wort ist es?"
                say: "Buchstabensalat. Leg die Buchstaben so, dass ein Wort entsteht."
                show: { object: mouse }
                options: ["u", "s", "M", "a"]
                slot_count: 4
                answer: ["M", "a", "u", "s"]
                option_audio: false
                hints: ["Das Bild hilft dir."]
              - id: l2-s3
                type: true_false
                text: "Ist das eine richtige Wortkette?"
                say: "Lies die Wortkette. Fängt jedes Wort mit dem letzten Buchstaben des Wortes davor an?"
                show: { drawn: letter-card, text: "Tisch Hut Hose" }
                answer: false
                hints: ["Hut hört mit t auf. Womit fängt Hose an?"]
              - id: l2-s4
                type: multiple_choice
                text: "Buchstabensalat: Welches Wort ist es?"
                say: "Buchstabensalat. Welches Wort steckt darin?"
                show: { drawn: letter-card, text: "e s H a" }
                options: ["Hase", "Haus", "Nase"]
                option_audio: false
                answer: "Hase"
                hints: ["Der große Buchstabe kommt nach vorne."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort kommt als Nächstes?"
                say: "Das ist eine Wortkette. Welches Wort kommt als Nächstes?"
                show: { drawn: letter-card, text: "Brot Tanne ?" }
                options: ["Ei", "Turm", "Bus"]
                option_audio: false
                answer: "Ei"
                hints: ["Tanne hört mit e auf."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort kommt als Nächstes?"
                say: "Das ist eine Wortkette. Welches Wort kommt als Nächstes?"
                show: { drawn: letter-card, text: "Schal Lama ?" }
                options: ["Ameise", "Löwe", "Saft"]
                option_audio: false
                answer: "Ameise"
              - id: l2-n2
                type: ordering
                text: "Buchstabensalat: Welches Wort ist es?"
                say: "Buchstabensalat. Leg die Buchstaben so, dass ein Wort entsteht."
                show: { object: moon }
                options: ["d", "o", "M", "n"]
                slot_count: 4
                answer: ["M", "o", "n", "d"]
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "Ist das eine richtige Wortkette?"
                say: "Lies die Wortkette. Fängt jedes Wort mit dem letzten Buchstaben des Wortes davor an?"
                show: { drawn: letter-card, text: "Ball Lupe Ente" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Buchstabensalat: Welches Wort ist es?"
                say: "Buchstabensalat. Welches Wort steckt darin?"
                show: { drawn: letter-card, text: "u h K" }
                options: ["Kuh", "Schuh", "Hut"]
                option_audio: false
                answer: "Kuh"
              - id: l2-n5
                type: multiple_choice
                text: "Welches Wort kommt als Nächstes?"
                say: "Das ist eine Wortkette. Welches Wort kommt als Nächstes?"
                show: { drawn: letter-card, text: "Rose Esel ?" }
                options: ["Rabe", "Löffel", "Eule"]
                option_audio: false
                answer: "Löffel"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Ich bin süß. Ich bin eine Frucht und rot."
            say: "Lies das Rätsel. Welches Bild passt?"
            options: [{ object: strawberry }, { object: banana }, { object: rose }]
            answer: strawberry
          - id: l2-c2
            type: image_multiple_choice
            text: "Ich bin ein Tier. Ich trage mein Haus."
            say: "Lies das Rätsel. Welches Bild passt?"
            options: [{ object: hedgehog }, { object: snail }, { object: house }]
            answer: snail
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort kommt als Nächstes?"
            say: "Lies die Wortkette. Welches Wort kommt als Nächstes?"
            show: { drawn: letter-card, text: "Kanne Eis ?" }
            options: ["Ente", "Sofa", "Kuh"]
            option_audio: false
            answer: "Sofa"
          - id: l2-c4
            type: ordering
            text: "Buchstabensalat: Welches Wort ist es?"
            say: "Buchstabensalat. Leg die Buchstaben zu einem Wort."
            show: { object: house }
            options: ["s", "a", "H", "u"]
            slot_count: 4
            answer: ["H", "a", "u", "s"]
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Ist das eine richtige Wortkette?"
            say: "Lies die Wortkette. Fängt jedes Wort mit dem letzten Buchstaben des Wortes davor an?"
            show: { drawn: letter-card, text: "Hut Tasse Nest" }
            answer: false
