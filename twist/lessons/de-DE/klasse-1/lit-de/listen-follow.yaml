# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.listen-follow
skill: lit-de.speaking.listen-follow
curriculum: de-DE
language: de
title:
  de: Zuhören und Anweisungen folgen
  en: Listening and following instructions
summary: >
  Listening to a spoken instruction to the end and doing exactly what it
  says. Lesson 1 listens for the two details that matter (the red ball,
  not the red crayon) and for two steps in a row; lesson 2 follows three
  steps with zuerst, dann and zum Schluss, counts the steps, asks again
  when something was not understood, and ends with the skill check. Every
  instruction is spoken; the child answers with action pictures, objects
  or short spoken sentences. Asking again aloud is practised with speak
  tasks and not marked. The skill check marks what a screen can mark:
  the right thing, the right order, every step and when to ask again;
  doing the actions with the body is left to Practise and the classroom.
metadata:
  year: klasse-1
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [zuhören, Anweisung, Schritt, zuerst, dann, zum Schluss, nachfragen] }
  forms: [audio, picture, text]
  drawn: []
  facets: []
  parts:
    - { id: details, what: { de: auf die wichtigen Wörter einer Anweisung hören, en: listening for the key words of an instruction } }
    - { id: order, what: { de: "Schritte in der richtigen Reihenfolge (zuerst, dann, zum Schluss)", en: "steps in the right order (first, then, finally)" } }
    - { id: all-steps, what: { de: alle Schritte einer Anweisung behalten, en: keeping every step of an instruction } }
    - { id: ask-again, what: { de: nachfragen statt raten, en: asking again instead of guessing } }
  misconceptions:
    - id: one-detail
      what: Acts on the first word that sounds familiar (rot, Stift) and misses the second detail of the instruction
      addressed: "lesson 1 Learn names both important words in \"Nimm den blauen Ball\"; every object task offers a picture that matches only the colour or only the thing (l1-f1 and l1-f3 with feedback, l1-s1, l1-n1, l1-c1, l2-w1, l2-c1)"
    - id: first-step-only
      what: Does only the first step, or does the steps in the order that seems easiest, and forgets the rest
      addressed: "Learn in both lessons counts the steps on the fingers; every stage has an ordering task with two steps (lesson 1) or three (lesson 2); \"Wie viele Schritte\" in l2-f2 (with feedback), l2-s3 and l2-n3; true_false tasks where a child swaps or skips a step (l2-f5, l2-s4, l2-c5)"
    - id: guess-instead-of-ask
      what: Guesses or does something else instead of asking again when an instruction was not understood
      addressed: "lesson 2 Learn says frag nach, rate nicht; l2-f4 (with feedback), l2-n4, the speak task l2-f6 and the skill check task l2-c4"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hör genau hin", en: "Listen carefully" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "Gut zuhören"
            say: "Bei einer Anweisung sagt dir jemand, was du tun sollst. Hör bis zum Ende zu. Erst dann fängst du an."
            show: { objects: [listen, quiet] }
          - text: "Nimm den blauen Ball."
            say: "Hör genau: Nimm den blauen Ball. Hier sind zwei Wörter wichtig: blau und Ball. Ein roter Ball passt nicht. Ein blauer Buntstift passt auch nicht."
            show: { object: ball, colour: blue }
          - text: "Steh auf und winke."
            say: "Manchmal sollst du zwei Dinge tun: Steh auf und winke. Zähl mit den Fingern mit. Aufstehen ist eins. Winken ist zwei. Mach beides, eins nach dem anderen."
            show: { objects: [stand-up, wave] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Was sollst du nehmen?"
                say: "Hör gut zu. Was sollst du nehmen?"
                audio: { de: "Nimm den roten Ball." }
                options:
                  - { object: ball, colour: red, key: ball-red }
                  - { object: ball, colour: blue, key: ball-blue }
                  - { object: crayon, colour: red, key: crayon-red }
                answer: ball-red
                feedback:
                  crayon-red: "Die Farbe stimmt. Aber was sollst du nehmen? Einen Buntstift oder einen Ball?"
                  ball-blue: "Das ist ein Ball. Aber welche Farbe hast du gehört?"
                hints:
                  - "Hör noch einmal. Zwei Wörter sind wichtig."
                  - "Welche Farbe? Und welches Ding?"
                  - "Rot und Ball. Tippe auf den roten Ball."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Was sollst du tun?"
                say: "Hör gut zu. Was sollst du tun?"
                audio: { de: "Klatsch in die Hände." }
                options: [{ object: clap }, { object: wave }, { object: jump }]
                answer: clap
                hints:
                  - "Hör noch einmal genau hin."
                  - "Was machst du mit den Händen?"
                  - "Du klatschst. Tippe auf das Kind, das klatscht."
                difficulty: easy
              - id: l1-f3
                type: audio_choice
                text: "Womit sollst du malen?"
                say: "Hör gut zu. Womit sollst du malen?"
                audio: { de: "Mal mit dem grünen Buntstift." }
                options:
                  - { object: crayon, colour: green, key: crayon-green }
                  - { object: crayon, colour: yellow, key: crayon-yellow }
                  - { object: leaf, colour: green, key: leaf-green }
                answer: crayon-green
                feedback:
                  leaf-green: "Das Blatt ist grün. Aber womit malst du? Mit einem Buntstift."
                hints:
                  - "Hör auf die Farbe und auf das Ding."
                  - "Grün und Buntstift."
                  - "Tippe auf den grünen Buntstift."
              - id: l1-f4
                type: ordering
                text: "Was machst du zuerst, was danach?"
                say: "Hör gut zu. Steh auf. Dann klatsch in die Hände. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: clap }, { object: stand-up }]
                slot_count: 2
                answer: [stand-up, clap]
                hints:
                  - "Hör noch einmal. Was hörst du zuerst?"
                  - "Zuerst stehst du auf. Was kommt nach dann?"
                  - "Aufstehen, dann klatschen."
              - id: l1-f5
                type: true_false
                text: "Hat Lena gut zugehört?"
                say: "Hör gut zu. Mama sagt zu Lena: Hol bitte den gelben Luftballon. Lena holt einen roten Luftballon. Hat Lena gut zugehört?"
                answer: false
                hints:
                  - "Welche Farbe sollte der Luftballon haben?"
                  - "Mama sagt gelb. Welche Farbe holt Lena?"
                  - "Lena holt einen roten. Nein, sie hat nicht gut zugehört."
              - id: l1-f6
                type: audio_choice
                text: "Wohin sollst du den Stift legen?"
                say: "Hör gut zu. Wohin sollst du den Stift legen?"
                audio: { de: "Leg den Stift in den Schulranzen." }
                options: [{ object: schoolbag }, { object: pencil-case }, { object: chair }]
                answer: schoolbag
                feedback:
                  pencil-case: "Ein Stift gehört oft ins Mäppchen. Aber wohin sollst du ihn hier legen?"
                hints:
                  - "Hör auf das Ende der Anweisung."
                  - "Leg den Stift in den ..."
                  - "In den Schulranzen."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Was sollst du nehmen?"
                say: "Hör gut zu. Was sollst du nehmen?"
                audio: { de: "Nimm das blaue Auto." }
                options:
                  - { object: car, colour: blue, key: car-blue }
                  - { object: car, colour: yellow, key: car-yellow }
                  - { object: ball, colour: blue, key: ball-blue }
                answer: car-blue
                hints: ["Zwei Wörter sind wichtig: die Farbe und das Ding."]
              - id: l1-s2
                type: audio_choice
                text: "Was sollst du tun?"
                say: "Hör gut zu. Was sollst du tun?"
                audio: { de: "Spring ganz hoch in die Luft." }
                options: [{ object: jump }, { object: sit-down }, { object: clap }]
                answer: jump
                hints: ["Welches Kind ist ganz hoch in der Luft?"]
              - id: l1-s3
                type: ordering
                text: "Was machst du zuerst, was danach?"
                say: "Hör gut zu. Setz dich hin. Dann sei ganz leise. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: quiet }, { object: sit-down }]
                slot_count: 2
                answer: [sit-down, quiet]
                hints: ["Was hast du zuerst gehört?"]
              - id: l1-s4
                type: audio_choice
                text: "Was sollst du in den Becher gießen?"
                say: "Hör gut zu. Was sollst du in den Becher gießen?"
                audio: { de: "Nimm den Becher und gieß Wasser hinein." }
                options: [{ object: water }, { object: milk }, { object: juice }]
                answer: water
                hints: ["Hör auf das Wort nach gieß."]
              - id: l1-s5
                type: true_false
                text: "Hat Ben gut zugehört?"
                say: "Hör gut zu. Die Lehrerin sagt: Holt eure Scheren heraus. Ben holt sein Lineal heraus. Hat Ben gut zugehört?"
                answer: false
                hints: ["Was sollen die Kinder herausholen?"]
              - id: l1-s6
                type: audio_choice
                text: "Was sollst du malen?"
                say: "Hör gut zu. Was sollst du malen?"
                audio: { de: "Mal einen Stern an den Himmel." }
                options: [{ object: star }, { object: sun }, { object: moon }]
                answer: star
                hints: ["Am Himmel gibt es vieles. Welches Wort hast du gehört?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Was sollst du anziehen?"
                say: "Hör gut zu. Was sollst du anziehen?"
                audio: { de: "Zieh den grünen Pullover an." }
                options:
                  - { object: jumper, colour: green, key: jumper-green }
                  - { object: jumper, colour: red, key: jumper-red }
                  - { object: jacket, colour: green, key: jacket-green }
                answer: jumper-green
              - id: l1-n2
                type: audio_choice
                text: "Was sollst du tun?"
                say: "Hör gut zu. Was sollst du tun?"
                audio: { de: "Heb die Hand und winke." }
                options: [{ object: wave }, { object: point }, { object: clap }]
                answer: wave
              - id: l1-n3
                type: ordering
                text: "Was machst du zuerst, was danach?"
                say: "Hör gut zu. Steh auf. Dann spring hoch. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: jump }, { object: stand-up }]
                slot_count: 2
                answer: [stand-up, jump]
              - id: l1-n4
                type: audio_choice
                text: "Wohin sollst du das Buch legen?"
                say: "Hör gut zu. Wohin sollst du das Buch legen?"
                audio: { de: "Leg das Buch auf den Tisch." }
                options: [{ object: table }, { object: chair }, { object: bed }]
                answer: table
              - id: l1-n5
                type: true_false
                text: "Hat Mia gut zugehört?"
                say: "Hör gut zu. Papa sagt: Zieh deine Jacke an. Mia zieht ihre Jacke an. Hat Mia gut zugehört?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Was sollst du nehmen?"
            say: "Hör gut zu. Was sollst du nehmen?"
            audio: { de: "Nimm den gelben Ball." }
            options:
              - { object: ball, colour: yellow, key: ball-yellow }
              - { object: ball, colour: green, key: ball-green }
              - { object: car, colour: yellow, key: car-yellow }
            answer: ball-yellow
          - id: l1-c2
            type: ordering
            text: "Was machst du zuerst, was danach?"
            say: "Hör gut zu. Klatsch in die Hände. Dann setz dich hin. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: sit-down }, { object: clap }]
            slot_count: 2
            answer: [clap, sit-down]
          - id: l1-c3
            type: audio_choice
            text: "Was sollst du holen?"
            say: "Hör gut zu. Was sollst du holen?"
            audio: { de: "Hol dir einen Apfel aus der Küche." }
            options: [{ object: apple }, { object: banana }, { object: orange }]
            answer: apple
          - id: l1-c4
            type: audio_choice
            text: "Worauf sollst du zeigen?"
            say: "Hör gut zu. Worauf sollst du zeigen?"
            audio: { de: "Zeig auf deine Nase." }
            options: [{ object: ear }, { object: nose }, { object: mouth }]
            answer: nose
          - id: l1-c5
            type: ordering
            text: "Was machst du zuerst, was danach?"
            say: "Hör gut zu. Winke. Dann spring hoch. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: jump }, { object: wave }]
            slot_count: 2
            answer: [wave, jump]
          - id: l1-c6
            type: true_false
            text: "Hat Lukas gut zugehört?"
            say: "Hör gut zu. Oma sagt: Bring mir bitte die blaue Tasse. Lukas bringt ihr die blaue Tasse. Hat Lukas gut zugehört?"
            answer: true

  - n: 2
    title: { de: "Schritt für Schritt", en: "Step by step" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Was sollst du nehmen?"
            say: "Hör gut zu. Was sollst du nehmen?"
            audio: { de: "Nimm den grünen Ball." }
            options:
              - { object: ball, colour: green, key: ball-green }
              - { object: ball, colour: red, key: ball-red }
              - { object: crayon, colour: green, key: crayon-green }
            answer: ball-green
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Was sollst du tun?"
            say: "Hör gut zu. Was sollst du tun?"
            audio: { de: "Setz dich auf deinen Stuhl." }
            options: [{ object: sit-down }, { object: stand-up }, { object: jump }]
            answer: sit-down
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "zuerst\ndann\nzum Schluss"
            say: "Manchmal hat eine Anweisung drei Schritte. Hör auf die Wörter zuerst, dann und zum Schluss. Sie sagen dir, was du wann machst."
          - text: "Hör zu."
            say: "Zuerst steh auf. Dann klatsch in die Hände. Zum Schluss setz dich wieder hin. Zähl mit den Fingern mit. Aufstehen ist eins, klatschen ist zwei, hinsetzen ist drei. Mach es genau in dieser Reihenfolge."
            show: { objects: [stand-up, clap, sit-down] }
          - text: "Kannst du das bitte noch einmal sagen?"
            say: "Hast du etwas nicht verstanden? Dann rate nicht. Frag nach: Kannst du das bitte noch einmal sagen? Das machen gute Zuhörer."
            show: { object: listen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Leg die Bilder in die richtige Reihenfolge."
                say: "Hör gut zu. Zuerst steh auf. Dann spring hoch. Zum Schluss setz dich hin. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: sit-down }, { object: jump }, { object: stand-up }]
                slot_count: 3
                answer: [stand-up, jump, sit-down]
                hints:
                  - "Hör noch einmal. Was kommt nach zuerst?"
                  - "Zuerst stehst du auf. Was kommt nach dann?"
                  - "Aufstehen, springen, zum Schluss hinsetzen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie viele Schritte sind das?"
                say: "Hör gut zu. Hol dein Heft, schlag es auf und schreib deinen Namen hinein. Wie viele Schritte sind das?"
                options: ["2", "3", "4"]
                answer: "3"
                feedback:
                  "2": "Zähl mit den Fingern: Heft holen, aufschlagen, Namen schreiben."
                hints:
                  - "Zähl jeden Schritt mit einem Finger."
                  - "Heft holen ist eins. Aufschlagen ist zwei. Und dann?"
                  - "Namen schreiben ist drei. Es sind drei Schritte."
              - id: l2-f3
                type: multiple_choice
                text: "Was machst du zum Schluss?"
                say: "Hör gut zu. Zuerst wasch dir die Hände. Dann nimm dir einen Apfel. Zum Schluss setz dich an den Tisch. Was machst du zum Schluss?"
                options: ["Ich setze mich an den Tisch.", "Ich wasche mir die Hände.", "Ich nehme mir einen Apfel."]
                answer: "Ich setze mich an den Tisch."
                feedback:
                  "Ich wasche mir die Hände.": "Das machst du zuerst. Hör auf die Wörter zum Schluss."
                hints:
                  - "Hör auf die Wörter zum Schluss."
                  - "Zum Schluss setz dich ..."
                  - "Zum Schluss setzt du dich an den Tisch."
              - id: l2-f4
                type: multiple_choice
                text: "Du hast die Anweisung nicht verstanden. Was machst du?"
                options: ["Ich frage nach: Kannst du das bitte noch einmal sagen?", "Ich mache einfach irgendwas.", "Ich mache gar nichts."]
                answer: "Ich frage nach: Kannst du das bitte noch einmal sagen?"
                feedback:
                  "Ich mache einfach irgendwas.": "Raten geht oft schief. Wer nicht sicher ist, fragt nach."
                hints:
                  - "Was machen gute Zuhörer, wenn sie etwas nicht verstehen?"
                  - "Sie raten nicht. Sie fragen."
                  - "Du fragst nach."
              - id: l2-f5
                type: true_false
                text: "Macht Ella es in der richtigen Reihenfolge?"
                say: "Hör gut zu. Frau Kaya sagt: Zuerst packt eure Bücher ein. Dann stellt eure Stühle hoch. Ella stellt zuerst ihren Stuhl hoch. Macht Ella es in der richtigen Reihenfolge?"
                answer: false
                hints:
                  - "Was sollen die Kinder zuerst machen?"
                  - "Zuerst die Bücher einpacken. Was macht Ella zuerst?"
                  - "Ella fängt mit dem Stuhl an. Nein, das ist nicht richtig."
              - id: l2-f6
                type: speak
                text: "Frag höflich nach."
                say: "Du hast die Anweisung nicht verstanden. Frag höflich nach. Sag: Kannst du das bitte noch einmal sagen?"
                expected_text: "Kannst du das bitte noch einmal sagen?"
                hints:
                  - "Sprich laut und freundlich."
                  - "Vergiss das Wort bitte nicht."
                  - "Kannst du das bitte noch einmal sagen?"

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Leg die Bilder in die richtige Reihenfolge."
                say: "Hör gut zu. Zuerst klatsch in die Hände. Dann winke. Zum Schluss sei ganz leise. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: quiet }, { object: clap }, { object: wave }]
                slot_count: 3
                answer: [clap, wave, quiet]
                hints: ["Hör auf zuerst, dann und zum Schluss."]
              - id: l2-s2
                type: audio_choice
                text: "Was kommt nach der Jacke?"
                say: "Hör gut zu. Was kommt nach der Jacke?"
                audio: { de: "Zuerst zieh deine Jacke an. Dann setz deine Mütze auf. Zum Schluss nimm deinen Schulranzen." }
                options: [{ object: woolly-hat }, { object: schoolbag }, { object: jacket }]
                answer: woolly-hat
                hints: ["Was kommt nach dem Wort dann?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Schritte sind das?"
                say: "Hör gut zu. Geh zur Tür und mach sie zu. Wie viele Schritte sind das?"
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["Zähl jeden Schritt mit einem Finger."]
              - id: l2-s4
                type: true_false
                text: "Macht Tim es in der richtigen Reihenfolge?"
                say: "Hör gut zu. Opa sagt: Zuerst putz dir die Zähne. Dann geh ins Bett. Tim geht ins Bett und putzt sich danach die Zähne. Macht Tim es in der richtigen Reihenfolge?"
                answer: false
                hints: ["Was soll Tim zuerst machen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was hilft dir, eine lange Anweisung zu behalten?"
                options: ["mit den Fingern die Schritte zählen", "schnell loslaufen", "dabei laut singen"]
                answer: "mit den Fingern die Schritte zählen"
                hints: ["Wie hast du die Schritte vorhin gezählt?"]
              - id: l2-s6
                type: speak
                text: "Sprich die Anweisung nach."
                say: "Wenn du eine Anweisung nachsprichst, kannst du sie dir besser merken. Sprich nach: Zuerst steh auf, dann winke."
                expected_text: "Zuerst steh auf, dann winke."
                hints: ["Sprich langsam und zähl dabei mit."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Leg die Bilder in die richtige Reihenfolge."
                say: "Hör gut zu. Zuerst sei ganz leise. Dann hör gut zu. Zum Schluss klatsch in die Hände. Leg die Bilder in die richtige Reihenfolge."
                options: [{ object: clap }, { object: listen }, { object: quiet }]
                slot_count: 3
                answer: [quiet, listen, clap]
              - id: l2-n2
                type: multiple_choice
                text: "Was machst du zum Schluss?"
                say: "Hör gut zu. Nimm ein Blatt. Mal einen Baum darauf. Zum Schluss schreib deinen Namen darunter. Was machst du zum Schluss?"
                options: ["Ich schreibe meinen Namen.", "Ich male einen Baum.", "Ich nehme ein Blatt."]
                answer: "Ich schreibe meinen Namen."
              - id: l2-n3
                type: multiple_choice
                text: "Wie viele Schritte sind das?"
                say: "Hör gut zu. Räum die Stifte weg, hol dein Buch und setz dich in den Kreis. Wie viele Schritte sind das?"
                options: ["2", "3", "4"]
                answer: "3"
              - id: l2-n4
                type: multiple_choice
                text: "Mila hat die Anweisung nur halb gehört. Was sagt sie?"
                options: ["Kannst du das bitte wiederholen?", "Das ist mir egal.", "Ich weiß schon alles."]
                answer: "Kannst du das bitte wiederholen?"
              - id: l2-n5
                type: true_false
                text: "Hat Ole alles gemacht?"
                say: "Hör gut zu. Mama sagt: Zieh die Schuhe aus und stell sie ins Regal. Ole zieht die Schuhe aus und stellt sie ins Regal. Hat Ole alles gemacht?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: details
            type: audio_choice
            text: "Was sollst du nehmen?"
            say: "Hör gut zu. Was sollst du nehmen?"
            audio: { de: "Nimm das rote Auto." }
            options:
              - { object: car, colour: red, key: car-red }
              - { object: car, colour: green, key: car-green }
              - { object: ball, colour: red, key: ball-red }
            answer: car-red
          - id: l2-c2
            part: order
            type: ordering
            text: "Leg die Bilder in die richtige Reihenfolge."
            say: "Hör gut zu. Zuerst winke. Dann spring hoch. Zum Schluss setz dich hin. Leg die Bilder in die richtige Reihenfolge."
            options: [{ object: sit-down }, { object: wave }, { object: jump }]
            slot_count: 3
            answer: [wave, jump, sit-down]
          - id: l2-c3
            part: order
            type: multiple_choice
            text: "Was machst du als Zweites?"
