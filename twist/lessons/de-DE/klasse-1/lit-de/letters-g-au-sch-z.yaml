# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-g-au-sch-z
skill: lit-de.letters.g-au-sch-z
curriculum: de-DE
language: de
title:
  de: G, Au, Sch und Z
  en: G, Au, Sch and Z
summary: >
  The sixth letter group in Fibel order. One lesson each: G (against K),
  au (two letters, one sound: Auto, Haus, Baum), sch (three letters for
  one sound: Schuh, Fisch, Tisch, against S) and Z (t and s together:
  Zebra, Katze, against S). Lesson 5 reads words made only of known
  letters (Auto, Schuh, Ziege, Baum, Igel, Schere) and ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.ei-r-h-w]
  also_practises:
    [lit-de.letters.ei-r-h-w, lit-de.handwriting.print-letters, lit-de.decoding.longer-words]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Silbe, Zwielaut, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  parts:
    - { id: g-k, what: { de: G und K unterscheiden, en: telling G from K } }
    - { id: au, what: { de: das au hören und lesen, en: hearing and reading au } }
    - { id: sch, what: { de: "sch: drei Buchstaben, ein Laut", en: "sch: three letters, one sound" } }
    - { id: z-s, what: { de: Z und S unterscheiden, en: telling Z from S } }
    - { id: words, what: { de: "Wörter mit G, Au, Sch und Z lesen", en: "reading words with G, Au, Sch and Z" } }
  misconceptions:
    - id: sch-one-sound
      what: Writes only s for sch, or thinks the three letters are three sounds
      addressed: lesson 3 Learn says three letters make one sound; l3-f4, l3-f5, l3-s4, l3-n4 and l5-n4 need all three letters
    - id: s-sch
      what: Hears the rushing sch as the humming s (Socke, Schuh)
      addressed: l3-f1, l3-f3, l3-s2, l3-s3, l3-n2 and l3-c3 contrast them
    - id: g-k
      what: Does not hear the soft g from the k with its puff of air
      addressed: l1-f3, l1-f5, l1-s2, l1-n1 and l1-n2 contrast G and K
    - id: z-s
      what: Hears the z (ts) as s
      addressed: lesson 4 Learn says z is t and s together; l4-f3, l4-f5, l4-n2 and l4-n3 contrast Z and S
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das G, en: The letter G }
    goal:
      de: "Lerne das G kennen, wie bei Glocke und Gabel. Hör genau hin, es klingt weicher als das K."
      en: "Get to know the letter G, as in Glocke and Gabel. Listen closely, it sounds softer than K."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "W oder F?"
            audio: { de: "Wagen." }
            options: ["W", "F"]
            answer: "W"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Hose" }
            options: [{ object: rose }, { object: rabbit }, { object: trousers }]
            answer: trousers
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "G g"
            say: "Dieser Buchstabe klingt so: g. Wie bei Glocke und Gabel. Er kommt hinten aus dem Mund, wie das k, aber weicher."
            show: { drawn: letter-card, text: "Gg" }
          - text: "Glocke"
            say: "Glocke. G ... locke. Hörst du das g am Anfang?"
            show: { object: bell }
          - text: "Giraffe"
            say: "Giraffe. G ... iraffe. Halte die Hand vor den Mund. Beim g spürst du fast keinen Hauch."
            show: { object: giraffe }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was fängt mit G an?"
                options: [{ object: bell }, { object: cat }, { object: ball }]
                answer: bell
                feedback:
                  cat: "Katze fängt mit k an. Beim k spürst du einen Hauch. Das g ist weicher."
                  ball: "Ball fängt mit b an. Da gehen die Lippen zu."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Glocke ... g. Katze ... k. Ball ... b."
                  - "Glocke fängt mit G an."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du am Anfang ein G?"
                say: "Giraffe. Hörst du am Anfang ein g?"
                show: { object: giraffe }
                answer: true
                hints:
                  - "Sag das Wort mit: Giraffe."
                  - "G ... iraffe. Kommt der erste Laut weich von hinten?"
                  - "Ja, Giraffe fängt mit g an."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Hörst du am Anfang ein G?"
                say: "Kuh. Hörst du am Anfang ein g?"
                show: { object: cow }
                answer: false
                hints:
                  - "Sag das Wort mit: Kuh."
                  - "Halte die Hand vor den Mund. Bei k spürst du einen Hauch. Bei g fast keinen."
                  - "Nein, Kuh fängt mit k an."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes G."
                say: "Tippe auf jedes große und kleine G."
                show: { drawn: letter-card, text: "G O g p G" }
                spans: ["G", "g", "G"]
                hints:
                  - "Das große G ist rund wie ein O und hat innen einen kleinen Strich."
                  - "Das kleine g hat unten einen Haken nach links. Das p hat einen geraden Strich."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l1-f5
                type: audio_choice
                text: "G oder K?"
                audio: { de: "Gabel." }
                options: ["K", "G"]
                answer: "G"
                feedback:
                  K: "Bei k spürst du einen Hauch. Gabel fängt weich an: g."
                hints:
                  - "Hör noch einmal hin."
                  - "Halte die Hand vor den Mund und sprich nach: Gabel. Spürst du viel Luft?"
                  - "Wenig Luft, weich: Das ist das G."
              - id: l1-f6
                type: tracing
                text: "Schreib das G nach."
                show: { drawn: writing-lines, text: "G", mode: trace, arrows: true }
                char: "G"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo hörst du ein g?"
                say: "In welchem Wort hörst du ein g?"
                options: [{ object: house }, { object: hedgehog }, { object: sun }]
                answer: hedgehog
                hints: ["I ... gel. Hör auf die Mitte."]
              - id: l1-s2
                type: audio_choice
                text: "G oder K?"
                audio: { de: "Kamm." }
                options: ["G", "K"]
                answer: "K"
                hints: ["Spürst du an der Hand einen Hauch?"]
              - id: l1-s3
                type: true_false
                text: "Hörst du am Anfang ein G?"
                say: "Glocke. Hörst du am Anfang ein g?"
                show: { object: bell }
                answer: true
                hints: ["Sprich es langsam: G ... locke."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Glocke. Welcher Buchstabe fehlt?"
                show: { object: bell }
                frame: "_locke"
                options: ["K", "G", "B"]
                answer: ["G"]
                hints: ["G ... locke. Weich, ohne Hauch."]
              - id: l1-s5
                type: tracing
                text: "Schreib das g nach."
                show: { drawn: writing-lines, text: "g", mode: trace, arrows: true }
                char: "g"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "G oder K?"
                audio: { de: "Gurke." }
                options: ["G", "K"]
                answer: "G"
              - id: l1-n2
                type: audio_choice
                text: "G oder K?"
                audio: { de: "Katze." }
                options: ["K", "G"]
                answer: "K"
              - id: l1-n3
                type: true_false
                text: "Hörst du ein G?"
                say: "Spiegel. Hörst du in dem Wort ein g?"
                show: { object: mirror }
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Ziege. Welcher Buchstabe fehlt?"
                show: { object: goat }
                frame: "Zie_e"
                options: ["k", "g", "d"]
                answer: ["g"]
              - id: l1-n5
                type: tracing
                text: "Schreib das g ab."
                show: { drawn: writing-lines, text: "g", mode: copy, arrows: false }
                char: "g"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was fängt mit G an?"
            options: [{ object: cake }, { object: present }, { object: dog }]
            answer: present
          - id: l1-c2
            type: audio_choice
            text: "G oder K?"
            audio: { de: "Garten." }
            options: ["K", "G"]
            answer: "G"
          - id: l1-c3
            type: true_false
            text: "Hörst du am Anfang ein G?"
            say: "Kanne. Hörst du am Anfang ein g?"
            show: { object: jug }
            answer: false
          - id: l1-c4
            type: true_false
            text: "Hörst du am Anfang ein G?"
            say: "Gießkanne. Hörst du am Anfang ein g?"
            show: { object: watering-can }
            answer: true
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf jedes G."
            say: "Tippe auf jedes große und kleine G."
            show: { drawn: letter-card, text: "g G p g O" }
            spans: ["g", "G", "g"]
          - id: l1-c6
            type: audio_choice
            text: "G oder K?"
            audio: { de: "Koch." }
            options: ["G", "K"]
            answer: "K"

  - n: 2
    title: { de: Das Au, en: The sound au }
    goal:
      de: "Lerne das Au kennen, es klingt wie wenn du dir wehtust. Hör es in Auto, Auge und Maus."
      en: "Get to know the sound au, like when you hurt yourself. Hear it in Auto, Auge and Maus."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was fängt mit G an?"
            options: [{ object: cat }, { object: bell }]
            answer: bell
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "G oder K?"
            audio: { de: "Gans." }
            options: ["G", "K"]
            answer: "G"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Au au"
            say: "A und u zusammen klingen so: au. Wie wenn du dir wehtust: Au! Wie bei Auto und Auge."
            show: { drawn: letter-card, text: "Au au" }
          - text: "Auto"
            say: "Auto. Au ... to. Hörst du das au am Anfang?"
            show: { object: car }
          - text: "Maus"
            say: "Maus. Mmm ... au ... sss. Hier steckt das au in der Mitte."
            show: { object: mouse }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wo hörst du ein au?"
                say: "In welchem Wort hörst du ein au?"
                options: [{ object: house }, { object: hat }, { object: ice-cream }]
                answer: house
                feedback:
                  hat: "In Hut hörst du nur ein u. In Haus hörst du au: erst a, dann u."
                  ice-cream: "Eis fängt mit ei an. Das ist ein anderer Laut."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf die Mitte."
                  - "Haus ... au. Hut ... u. Eis ... ei."
                  - "In Haus hörst du ein au."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hörst du am Anfang ein au?"
                say: "Auge. Hörst du am Anfang ein au?"
                show: { object: eye }
                answer: true
                hints:
                  - "Sag das Wort mit: Auge."
                  - "Au ... ge. Was hörst du zuerst?"
                  - "Ja, Auge fängt mit au an."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Hörst du am Anfang ein au?"
                say: "Affe. Hörst du am Anfang ein au?"
                show: { object: monkey }
                answer: false
                hints:
                  - "Sag das Wort mit: Affe."
                  - "Hörst du nach dem a ein u? Oder nur a?"
                  - "Nein, Affe fängt nur mit a an."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes au."
                say: "Tippe auf jede Karte mit au. Auch das große Au zählt."
                show: { drawn: letter-card, text: "au ei Au a au" }
                spans: ["au", "Au", "au"]
                hints:
                  - "Bei au steht das a vorne und das u dahinter."
                  - "Bei ei steht das e vorne. Ein a allein ist kein au."
                  - "Es sind drei Karten: au, Au und au."
              - id: l2-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Baum. Was fehlt in dem Wort?"
                show: { object: tree }
                frame: "B_m"
                options: ["au", "a", "ei"]
                answer: ["au"]
                hints:
                  - "Sprich das Wort langsam: B ... au ... m."
                  - "Hörst du a und gleich danach u?"
                  - "Baum schreibt man mit au."
              - id: l2-f6
                type: tracing
                text: "Schreib Au nach."
                show: { drawn: writing-lines, text: "Au", mode: trace, arrows: true }
                char: "Au"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wo hörst du ein au?"
                say: "In welchem Wort hörst du ein au?"
                options: [{ object: ball }, { object: farmer }, { object: banana }]
                answer: farmer
                hints: ["Bau ... er."]
              - id: l2-s2
                type: true_false
                text: "Hörst du ein au?"
                say: "Hund. Hörst du in dem Wort ein au?"
                show: { object: dog }
                answer: false
                hints: ["H ... u ... nd. Steht vor dem u ein a?"]
              - id: l2-s3
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Auto." }
                options: ["A", "Au", "Ei"]
                answer: "Au"
                hints: ["Au ... to. Hörst du nach dem a ein u?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Maus. Was fehlt in dem Wort?"
                show: { object: mouse }
                frame: "M_s"
                options: ["a", "au", "u"]
                answer: ["au"]
                hints: ["Mmm ... au ... sss."]
              - id: l2-s5
                type: tracing
                text: "Schreib au nach."
                show: { drawn: writing-lines, text: "au", mode: trace, arrows: true }
                char: "au"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wo hörst du ein au?"
                say: "In welchem Wort hörst du ein au?"
                options: [{ object: moon }, { object: mouth }, { object: mouse }]
                answer: mouse
                difficulty: stretch
              - id: l2-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Haus. Was fehlt in dem Wort?"
                show: { object: house }
                frame: "H_s"
                options: ["u", "au", "ei"]
                answer: ["au"]
              - id: l2-n3
                type: true_false
                text: "Hörst du ein au?"
                say: "Eis. Hörst du in dem Wort ein au?"
                show: { object: ice-cream }
                answer: false
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf jedes au."
                say: "Tippe auf jede Karte mit au."
                show: { drawn: letter-card, text: "a au u Au" }
                spans: ["au", "Au"]
              - id: l2-n5
                type: tracing
                text: "Schreib au ab."
                show: { drawn: writing-lines, text: "au", mode: copy, arrows: false }
                char: "au"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Wo hörst du ein au?"
            say: "In welchem Wort hörst du ein au?"
            options: [{ object: oven }, { object: car }, { object: egg }]
            answer: car
          - id: l2-c2
            type: true_false
            text: "Hörst du ein au?"
            say: "Baum. Hörst du in dem Wort ein au?"
            show: { object: tree }
            answer: true
          - id: l2-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Auge. Was fehlt in dem Wort?"
            show: { object: eye }
            frame: "_ge"
            options: ["A", "Au", "Ei"]
            answer: ["Au"]
          - id: l2-c4
            type: true_false
            text: "Hörst du ein au?"
            say: "Hut. Hörst du in dem Wort ein au?"
            show: { object: hat }
            answer: false
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf jedes au."
            say: "Tippe auf jede Karte mit au."
            show: { drawn: letter-card, text: "au a Au u au" }
            spans: ["au", "Au", "au"]
          - id: l2-c6
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Ameise." }
            options: ["Au", "A", "U"]
            answer: "A"

  - n: 3
    title: { de: Das Sch, en: The sound sch }
    goal:
      de: "Lerne drei Buchstaben kennen, die zusammen nur einen Laut machen, wie am Anfang von Schuh und am Ende von Fisch."
      en: "Meet three letters that make just one sound together. You hear it at the start of Schuh and the end of Fisch."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: image_multiple_choice
            text: "Wo hörst du ein au?"
            say: "In welchem Wort hörst du ein au?"
            options: [{ object: ear }, { object: eye }]
            answer: eye
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Baum. Was fehlt in dem Wort?"
            show: { object: tree }
            frame: "B_m"
            options: ["a", "au"]
            answer: ["au"]
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Sch sch"
            say: "Hier stehen drei Buchstaben: s, c und h. Zusammen machen sie nur einen Laut: sch. Wie wenn du sagst: Sch, sei leise! Wie bei Schuh und Schaf."
            show: { drawn: letter-card, text: "Sch sch" }
          - text: "Schuh"
            say: "Schuh. Sch ... uh. Hörst du das sch am Anfang?"
            show: { object: shoe }
          - text: "Fisch"
            say: "Fisch. Fff ... i ... sch. Hier steht das sch am Ende."
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit Sch an?"
                options: [{ object: shoe }, { object: sock }, { object: cup }]
                answer: shoe
                feedback:
                  sock: "Socke fängt mit sss an. Das summt. Sch rauscht."
                  cup: "Tasse fängt mit t an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Schuh ... sch. Socke ... sss. Tasse ... t."
                  - "Schuh fängt mit sch an."
                difficulty: easy
              - id: l3-f2
                type: true_false
                text: "Hörst du am Anfang ein sch?"
                say: "Schere. Hörst du am Anfang ein sch?"
                show: { object: scissors }
                answer: true
                hints:
                  - "Sag das Wort mit: Schere."
                  - "Sch ... ere. Rauscht es am Anfang?"
                  - "Ja, Schere fängt mit sch an."
                difficulty: easy
              - id: l3-f3
                type: true_false
                text: "Hörst du am Anfang ein sch?"
                say: "Sonne. Hörst du am Anfang ein sch?"
                show: { object: sun }
                answer: false
                hints:
                  - "Sag das Wort mit: Sonne."
                  - "Summt es wie eine Biene? Dann ist es sss. Rauscht es? Dann ist es sch."
                  - "Nein, Sonne fängt mit sss an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes sch."
                say: "Tippe auf jede Karte mit s, c und h."
                show: { drawn: letter-card, text: "sch s Sch ch sch" }
                spans: ["sch", "Sch", "sch"]
                hints:
                  - "Für sch brauchst du drei Buchstaben."
                  - "Das s allein ist zu wenig. Bei ch fehlt das s."
                  - "Es sind drei Karten: sch, Sch und sch."
              - id: l3-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Tisch. Was fehlt am Ende?"
                show: { object: table }
                frame: "Ti_"
                options: ["s", "sch", "ch"]
                answer: ["sch"]
                hints:
                  - "Sprich das Wort langsam bis zum Ende: Tisch."
                  - "Am Ende rauscht es. Dafür brauchst du drei Buchstaben."
                  - "Am Ende fehlt sch."
              - id: l3-f6
                type: tracing
                text: "Schreib Sch nach."
                show: { drawn: writing-lines, text: "Sch", mode: trace, arrows: true }
                char: "Sch"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Was fängt mit Sch an?"
                options: [{ object: saw }, { object: snail }, { object: nose }]
                answer: snail
                hints: ["Schnecke ... sch."]
              - id: l3-s2
                type: true_false
                text: "Hörst du am Anfang ein sch?"
                say: "Säge. Hörst du am Anfang ein sch?"
                show: { object: saw }
                answer: false
                hints: ["Summt es am Anfang, oder rauscht es?"]
              - id: l3-s3
                type: audio_choice
                text: "Sch oder S?"
                audio: { de: "Schaf." }
                options: ["S", "Sch"]
                answer: "Sch"
                hints: ["Rauscht es am Anfang?"]
              - id: l3-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Fisch. Was fehlt am Ende?"
                show: { object: fish }
                frame: "Fi_"
                options: ["sch", "s"]
                answer: ["sch"]
                hints: ["Am Ende rauscht es. Ein s allein summt nur."]
              - id: l3-s5
                type: tracing
                text: "Schreib sch nach."
                show: { drawn: writing-lines, text: "sch", mode: trace, arrows: true }
                char: "sch"
                difficulty: easy

