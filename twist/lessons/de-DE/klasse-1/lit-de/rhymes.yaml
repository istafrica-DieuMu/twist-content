          - id: l1-c2
            type: image_multiple_choice
            text: "Was reimt sich auf Brot?"
            say: "Brot. Was reimt sich auf Brot?"
            show: { object: bread }
            options: [{ object: egg }, { object: boat }, { object: ball }]
            answer: boat
          - id: l1-c3
            type: true_false
            text: "Reimt sich das?"
            say: "Hase, Hund. Reimt sich das?"
            show: { objects: [rabbit, dog] }
