                say: "Kuh. Was reimt sich auf Kuh?"
                show: { object: cow }
                options: [{ object: cat }, { object: hand }, { object: shoe }]
                answer: shoe

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Reimt sich das?"
            say: "Haus, Maus. Reimt sich das?"
