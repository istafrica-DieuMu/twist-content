                options: [{ object: frog }, { object: table }, { object: apple }]
                answer: table
              - id: l1-n4
                type: true_false
                text: "Reimt sich das?"
                say: "Igel, Spiegel. Reimt sich das?"
                show: { objects: [hedgehog, mirror] }
