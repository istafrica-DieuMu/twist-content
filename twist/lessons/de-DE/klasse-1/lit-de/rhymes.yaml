              - id: l1-s5
                type: true_false
                text: "Reimt sich das?"
                say: "Kuh, Katze. Reimt sich das?"
                show: { objects: [cow, cat] }
                answer: false
                hints: ["Beide fangen gleich an. Und das Ende?"]
              - id: l1-s6
                type: image_multiple_choice
                text: "Was reimt sich auf Sonne?"
                say: "Sonne. Was reimt sich auf Sonne?"
                show: { object: sun }
                options: [{ object: ball }, { object: banana }, { object: bin }]
                answer: bin
                hints: ["Sonne endet mit onne."]

          - support: none
