# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.rhymes
skill: lit-de.phonological.rhymes
curriculum: de-DE
language: de
title:
  de: Reime hören
  en: Hearing rhymes
summary: >
  The first Deutsch lessons of Klasse 1, before any letters. Children hear
  whether two words rhyme (Haus, Maus) and find rhyming words themselves.
  Lesson 1 judges pairs; lesson 2 finds the rhyme, pairs rhymes and spots
  the word that does not rhyme, and ends with the skill check. Nothing has
  to be read: every prompt is spoken, every picture says its word.
metadata:
  year: klasse-1
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: []
  also_practises: []
  vocabulary: { de: [reimen, Reim, Ende, gleich, anders] }
  no_reading: true
  forms: [picture, audio]
  drawn: []
  facets: []
  parts:
    - { id: judge, what: { de: "hören, ob sich zwei Wörter reimen", en: hearing whether two words rhyme } }
    - { id: find, what: { de: ein Reimwort finden, en: finding a rhyming word } }
    - { id: odd-one-out, what: { de: "das Wort finden, das sich nicht reimt", en: finding the word that does not rhyme } }
  misconceptions:
    - id: same-start
      what: Takes words that start the same (Haus, Hund) for rhymes
      addressed: Learn says rhymes sound the same at the end; distractors start with the same sound as the target (Frosch next to Fisch, Katze next to Kuh, Ball next to Brot)
    - id: meaning
      what: Pairs words by meaning (Hund, Katze) instead of by sound
      addressed: options put a meaning partner next to the rhyme (shoe next to sock for Hose); hints say "Hör auf das Ende."
    - id: picture-word
      what: Names a picture with a different word than meant (Mütze for the hat)
      addressed: every picture says its word when tapped, and full-stage hints say the words
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Reimt sich das?", en: "Does it rhyme?" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - say: "Haus und Maus. Hör genau: Haus, Maus. Am Ende klingen beide gleich: aus. Diese Wörter reimen sich."
            show: { objects: [house, mouse] }
          - say: "Hund und Mund. Hund, Mund. Am Ende klingt es gleich: und. Auch das ist ein Reim."
            show: { objects: [dog, mouth] }
          - say: "Haus und Ball. Haus, Ball. Am Ende klingt es anders. Haus und Ball reimen sich nicht."
            show: { objects: [house, ball] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Reimt sich das?"
                say: "Tisch, Fisch. Reimt sich das?"
                show: { objects: [table, fish] }
                answer: true
                hints:
                  - "Sprich beide Wörter langsam nach."
                  - "Hör auf das Ende: Tisch, Fisch."
                  - "Beide enden mit isch. Ja, sie reimen sich."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Reimt sich das?"
                say: "Rose, Ball. Reimt sich das?"
                show: { objects: [rose, ball] }
                answer: false
                hints:
                  - "Sprich beide Wörter langsam nach."
                  - "Hör auf das Ende: Rose, Ball."
                  - "Das Ende klingt anders. Nein, sie reimen sich nicht."
              - id: l1-f3
                type: image_multiple_choice
                text: "Was reimt sich auf Haus?"
                say: "Haus. Was reimt sich auf Haus?"
                show: { object: house }
                options: [{ object: tree }, { object: mouse }, { object: sun }]
                answer: mouse
                feedback:
                  tree: "Baum und Haus klingen am Ende anders."
                  sun: "Sonne und Haus klingen am Ende anders."
                hints:
                  - "Tippe auf die Bilder und hör dir die Wörter an."
                  - "Haus endet mit aus. Welches Wort endet auch so?"
                  - "Haus, Maus. Die Maus reimt sich."
              - id: l1-f4
                type: true_false
                text: "Reimt sich das?"
                say: "Nase, Hase. Reimt sich das?"
                show: { objects: [nose, rabbit] }
                answer: true
                hints:
                  - "Sprich beide Wörter nach."
                  - "Hör auf das Ende: Nase, Hase."
                  - "Beide enden mit ase. Ja, sie reimen sich."
              - id: l1-f5
                type: true_false
                text: "Reimt sich das?"
                say: "Schuh, Mond. Reimt sich das?"
                show: { objects: [shoe, moon] }
                answer: false
                hints:
                  - "Sprich beide Wörter nach."
                  - "Schuh endet mit uh, Mond mit ond."
                  - "Nein, sie reimen sich nicht."
              - id: l1-f6
                type: image_multiple_choice
                text: "Was reimt sich auf Hund?"
                say: "Hund. Was reimt sich auf Hund?"
                show: { object: dog }
                options: [{ object: cat }, { object: mouth }, { object: ball }]
                answer: mouth
                feedback:
                  cat: "Hund und Katze sind beide Tiere. Aber sie reimen sich nicht. Hör auf das Ende."
                hints:
                  - "Hör dir jedes Wort an."
                  - "Hund endet mit und. Welches Wort endet auch so?"
                  - "Hund, Mund. Der Mund reimt sich."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Reimt sich das?"
                say: "Kanne, Tanne. Reimt sich das?"
                show: { objects: [jug, fir-tree] }
                answer: true
                hints: ["Hör auf das Ende: Kanne, Tanne."]
              - id: l1-s2
                type: true_false
                text: "Reimt sich das?"
                say: "Brot, Ei. Reimt sich das?"
                show: { objects: [bread, egg] }
                answer: false
                hints: ["Klingt das Ende gleich?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was reimt sich auf Hose?"
                say: "Hose. Was reimt sich auf Hose?"
                show: { object: trousers }
                options: [{ object: sock }, { object: rose }, { object: shoe }]
                answer: rose
                hints: ["Hose endet mit ose."]
              - id: l1-s4
                type: true_false
                text: "Reimt sich das?"
                say: "Schwein, Bein. Reimt sich das?"
                show: { objects: [pig, leg] }
