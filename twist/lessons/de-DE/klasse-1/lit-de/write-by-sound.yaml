# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.write-by-sound
skill: lit-de.spelling.write-by-sound
curriculum: de-DE
language: de
title:
  de: Schreiben, wie man spricht
  en: Writing words by their sounds
summary: >
  Children write words whose spelling follows their sounds (Oma, Nase,
  Limo, Tomate), using the letters they know. The strategy is the
  Mitsprechen: say the word slowly, one sound at a time, and write a letter
  for each sound. They build words from letter cards, fill the missing
  letter, count sounds, spot a spelling with a sound left out, and type
  whole words on the letter keyboard (Lama, Oma, Ente, Nadel), about one
  task in four. Lesson 1 has short words of two open syllables; lesson 2
  longer ones (Ente, Tomate, Esel) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter schreiben, en: Writing first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.phonological.sounds-in-words, lit-de.letters.e-n-d-u]
  also_practises: [lit-de.phonological.sounds-in-words]
  vocabulary: { de: [Laut, Buchstabe, mitsprechen, langsam sprechen] }
  forms: [audio, picture, drawn]
  drawn: [dots, word-card]
  facets: []
  parts:
    - { id: short, what: { de: "kurze lautgetreue Wörter schreiben (Oma, Nest)", en: "writing short words that are spelt as they sound (Oma, Nest)" } }
    - { id: long, what: { de: "längere Wörter Silbe für Silbe schreiben (Nadel, Salami)", en: "writing longer words syllable by syllable (Nadel, Salami)" } }
    - { id: every-sound, what: { de: "prüfen, ob für jeden Laut ein Buchstabe dasteht", en: "checking that every sound has a letter" } }
  misconceptions:
    - id: vowel-left-out
      what: Leaves out vowels and writes only the loud consonants (Nse for Nase, Tmt for Tomate)
      addressed: "Learn stretches each vowel; tasks l1-f3, l1-s4 and l2-f4 offer the spelling without a vowel, with feedback that every Silbe has a vowel"
    - id: letter-names
      what: Writes letter names for sounds (Esel as SL, because the name of S is Es)
      addressed: "hints say the sound, never the letter name; task l2-f3 sets Esel against a spelling built from letter names"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Langsam mitsprechen, en: Saying it slowly }
    goal:
      de: "Sprich ein Wort ganz langsam mit und schreib für jeden Laut einen Buchstaben, so wie bei Nase."
      en: "Say a word very slowly and write one letter for each sound, like in Nase."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wie viele Laute hörst du?"
            say: "Mund. Wie viele Laute hörst du?"
            show: { object: mouth }
            options:
              - { drawn: dots, count: 3, layout: row }
              - { drawn: dots, count: 4, layout: row }
              - { drawn: dots, count: 5, layout: row }
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Tal." }
            options: ["Tal", "Tee", "Tom"]
            answer: "Tal"
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Wir wollen Nase schreiben. Was glaubst du: Wie viele Buchstaben brauchst du für Nase?"
            show: { object: nose }
          - text: "Nase"
            say: "Sprich ganz langsam mit: Nnn ... aaa ... sss ... eee."
            show: { object: nose }
          - text: "N a s e"
            say: "Für jeden Laut schreibst du einen Buchstaben. Nnn: N. Aaa: a. Sss: s. Eee: e. Vier Laute, vier Buchstaben: Nase."
            show: { drawn: word-card, text: "N a s e" }
          - text: "Nase"
            say: "Jede Silbe hat einen Selbstlaut: Na hat das a, se hat das e. Lies zum Schluss nach: Nase. Wenn du ein Wort tippst: Für den großen Buchstaben am Anfang tippst du zuerst auf den Pfeil."
            show: { drawn: word-card, text: "Nase" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Leg das Wort."
                say: "Oma. Sprich langsam mit und leg die Buchstaben in die richtige Reihenfolge."
                show: { object: grandma }
                options: ["m", "a", "O"]
                slot_count: 3
                answer: ["O", "m", "a"]
                hints:
                  - "Welchen Laut hörst du zuerst?"
                  - "Sprich ganz langsam: Ooo ... mmm ... aaa."
                  - "O, dann m, dann a."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Limo. Sprich mit. Welcher Buchstabe fehlt?"
                frame: "Li_o"
                options: ["m", "n", "l"]
                answer: ["m"]
                hints:
                  - "Sprich langsam: Lll ... iii ... und dann?"
                  - "Die Lippen gehen zu: mmm."
                  - "Es fehlt das m."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Nase. Welches Wort ist richtig geschrieben?"
                show: { object: nose }
                options: ["Nse", "Nase", "Nas"]
                option_audio: false
                answer: "Nase"
                feedback:
                  Nse: "Hier fehlt das a. Sprich mit: Nnn ... aaa. Jede Silbe braucht einen Selbstlaut."
                  Nas: "Hier fehlt das e am Ende. Sprich bis zum Schluss: Na ... se."
                hints:
                  - "Sprich das Wort langsam und hör auf jeden Laut."
                  - "Nnn ... aaa ... sss ... eee. Das sind vier Laute."
                  - "Nase hat vier Buchstaben: N, a, s, e."
              - id: l1-f4
                type: text_input
                keyboard: letters
                text: "Schreib das Wort."
                say: "Lama. Sprich langsam mit und schreib das Wort."
                show: { object: llama }
                answer: "Lama"
                feedback:
                  Lma: "Hier fehlt ein a. Sprich mit: Lll ... aaa. Jede Silbe braucht einen Selbstlaut."
                  lama: "Fast. Lama fängt mit einem großen L an."
                hints:
                  - "Sprich langsam: La ... ma."
                  - "Lll ... aaa ... mmm ... aaa."
                  - "L, a, m, a."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Limo. Sprich langsam mit. Wie viele Laute hörst du?"
                show: { drawn: word-card, text: "Limo" }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "4"
                hints:
                  - "Zeig für jeden Laut einen Finger."
                  - "Lll ... iii ... mmm ... ooo."
                  - "Vier Laute, vier Buchstaben."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Mama. Sprich mit. Welcher Buchstabe fehlt?"
                show: { object: mum }
                frame: "M_ma"
                options: ["a", "o", "u"]
                answer: ["a"]
                hints: ["Mmm ... aaa."]
              - id: l1-s2
                type: ordering
                text: "Leg das Wort."
                say: "Nase. Sprich langsam mit und leg die Buchstaben."
                show: { object: nose }
                options: ["s", "N", "e", "a"]
                slot_count: 4
                answer: ["N", "a", "s", "e"]
                hints: ["Nnn ... aaa ... sss ... eee."]
              - id: l1-s3
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Dose. Sprich mit. Welcher Buchstabe fehlt?"
                frame: "Do_e"
                options: ["s", "t", "n"]
                answer: ["s"]
                hints: ["Do ... und dann summt es wie eine Biene."]
              - id: l1-s4
                type: multiple_choice
                text: "Lisa trinkt eine _.\n\nWelches Wort ist richtig geschrieben?"
                say: "Limo. Lisa trinkt eine Limo. Welches Wort ist richtig geschrieben?"
                options: ["Lmo", "Limo", "Lim"]
                option_audio: false
                answer: "Limo"
                hints: ["Jede Silbe braucht einen Selbstlaut: Li ... mo."]
              - id: l1-s5
                type: text_input
                keyboard: letters
                text: "Schreib das Wort."
                say: "Oma. Sprich mit und schreib das Wort."
                show: { object: grandma }
                answer: "Oma"
                feedback:
                  Om: "Da fehlt der Oma ja ein Stück! Hier fehlt der letzte Laut. Sprich bis zum Schluss: O ... maaa."
                hints: ["Sprich bis zum Schluss: O ... mmm ... aaa."]

          - support: none
            tasks:
              - id: l1-n1
                type: ordering
                text: "Die Kekse sind in der _.\n\nLeg das Wort."
                say: "Dose. Die Kekse sind in der Dose. Leg die Buchstaben."
                options: ["e", "o", "D", "s"]
                slot_count: 4
                answer: ["D", "o", "s", "e"]
              - id: l1-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Nase. Welcher Buchstabe fehlt?"
                show: { object: nose }
                frame: "Nas_"
                options: ["a", "e", "i"]
                answer: ["e"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Mama. Welches Wort ist richtig geschrieben?"
                show: { object: mum }
                options: ["Mma", "Mama", "Mam"]
                option_audio: false
                answer: "Mama"
              - id: l1-n4
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Oma. Wie viele Laute hörst du?"
                show: { object: grandma }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
              - id: l1-n5
                type: text_input
                keyboard: letters
                text: "Ich trinke gern _.\n\nSchreib das Wort."
                say: "Limo. Ich trinke gern Limo. Schreib das Wort."
                answer: "Limo"
                feedback:
                  Lmo: "Hier fehlt das i. Sprich mit: Li ... mo. Jede Silbe braucht einen Selbstlaut."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Lama. Welcher Buchstabe fehlt?"
            show: { object: llama }
            frame: "L_ma"
            options: ["o", "a", "i"]
            answer: ["a"]
          - id: l1-c2
            type: multiple_choice
            text: "Die Stifte sind in der _.\n\nWelches Wort ist richtig geschrieben?"
            say: "Dose. Die Stifte sind in der Dose. Welches Wort ist richtig geschrieben?"
            options: ["Dse", "Dos", "Dose"]
            option_audio: false
            answer: "Dose"
          - id: l1-c3
            type: text_input
            keyboard: letters
            text: "Schreib das Wort."
            say: "Mama. Schreib das Wort."
            show: { object: mum }
            answer: "Mama"
            feedback:
              Mma: "Hier fehlt ein a. Sprich mit: Ma ... ma. Jede Silbe braucht einen Selbstlaut."
          - id: l1-c4
            type: fill_in_blank
            text: "Die _ ist lang und dünn.\n\nWelcher Buchstabe fehlt?"
            say: "Nudel. Die Nudel ist lang und dünn. Welcher Buchstabe fehlt?"
            frame: "Nu_el"
            options: ["l", "d", "m"]
            answer: ["d"]
          - id: l1-c5
            type: text_input
            keyboard: letters
            text: "Das Mädchen heißt _.\n\nSchreib den Namen."
            say: "Lisa. Das Mädchen heißt Lisa. Schreib den Namen."
            answer: "Lisa"
          - id: l1-c6
            type: multiple_choice
            text: "Im Museum steht ein großer _.\n\nWelches Wort ist richtig geschrieben?"
            say: "Dino. Im Museum steht ein großer Dino. Welches Wort ist richtig geschrieben?"
            options: ["Dno", "Dio", "Dino"]
            option_audio: false
            answer: "Dino"

  - n: 2
    title: { de: Längere Wörter, en: Longer words }
    goal:
      de: "Schreib längere Wörter Silbe für Silbe. Bei Tomate sprichst du erst To, dann ma, dann te."
      en: "Write longer words syllable by syllable. For Tomate you say To first, then ma, then te."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Limo. Welcher Buchstabe fehlt?"
            frame: "L_mo"
            options: ["i", "a"]
            answer: ["i"]
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Leg das Wort."
            say: "Oma. Leg die Buchstaben."
            show: { object: grandma }
            options: ["a", "O", "m"]
            slot_count: 3
            answer: ["O", "m", "a"]
            difficulty: easy

      - activity: learn
        mode: do-it-with-me
        screens:
          - say: "Tomate ist ein langes Wort. Was glaubst du: In wie viele Stücke kannst du es beim Sprechen zerlegen?"
            show: { object: tomato }
          - text: "To ma te"
            say: "In drei Stücke! Lange Wörter schreibst du Silbe für Silbe. Tomate: To ... ma ... te. Erst die erste Silbe, dann die nächste."
            show: { drawn: word-card, text: "To ma te" }
          - text: "Tomate"
            say: "In jeder Silbe sprichst du langsam mit: t ... ooo. mmm ... aaa. t ... eee. Tomate."
            show: { object: tomato }
          - text: "Ente"
            say: "Ente. En ... te. Am Anfang hörst du ein kurzes e. Du sagst den Laut, nicht den Namen des Buchstabens."
            show: { object: duck }
          - text: "Wusstest du? Für Pflanzenforscher ist die Tomate eine Beere."
            say: "Wusstest du? Für Pflanzenforscher ist die Tomate eine Beere, genau wie die Heidelbeere. Trotzdem kommt sie meistens in den Salat und nicht in den Obstkorb."
            show: { object: tomato }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                keyboard: letters
                text: "Schreib das Wort."
                say: "Ente. Sprich langsam mit und schreib das Wort."
                show: { object: duck }
                answer: "Ente"
                feedback:
                  Nte: "So klingt der Name des Buchstabens: En. Du schreibst aber die Laute: E ... nnn ... t ... eee."
                  Ent: "Hier fehlt das e am Ende. Sprich bis zum Schluss: En ... te."
                hints:
                  - "Sprich Silbe für Silbe: En ... te."
                  - "E ... nnn. Dann t ... eee."
                  - "E, n, t, e."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Tomate. Welche Silbe fehlt?"
                show: { object: tomato }
                frame: "To_te"
                options: ["ma", "mo", "na"]
                answer: ["ma"]
                hints:
                  - "Sprich Silbe für Silbe: To ... ma ... te."
                  - "Die mittlere Silbe fängt mit mmm an."
                  - "Es fehlt ma."
              - id: l2-f3
                type: multiple_choice
                text: "Der _ hat lange Ohren und sagt i-a.\n\nWelches Wort ist richtig geschrieben?"
                say: "Esel. Der Esel hat lange Ohren und sagt i-a. Welches Wort ist richtig geschrieben?"
                options: ["SL", "Esel", "Esl"]
                option_audio: false
                answer: "Esel"
                feedback:
                  SL: "So klingen die Namen der Buchstaben: Es, El. Du schreibst aber die Laute: E ... sss ... eee ... lll."
                  Esl: "Hier fehlt ein e. Sprich mit: E ... sel. Die zweite Silbe braucht auch einen Selbstlaut."
                hints:
                  - "Sprich die Laute, nicht die Buchstabennamen."
                  - "E ... sss ... eee ... lll."
                  - "Esel hat vier Buchstaben: E, s, e, l."
              - id: l2-f4
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Tomate. Welches Wort ist richtig geschrieben?"
                show: { object: tomato }
                options: ["Tmte", "Tomate", "Tomte"]
                option_audio: false
                answer: "Tomate"
                feedback:
                  Tmte: "Hier fehlen die Selbstlaute. Jede Silbe hat einen: To, ma, te."
                hints:
                  - "Sprich Silbe für Silbe."
                  - "To ... ma ... te. Drei Silben, drei Selbstlaute."
                  - "Tomate."
              - id: l2-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tante. Welcher Buchstabe fehlt?"
                frame: "Ta_te"
                options: ["n", "m", "t"]
                answer: ["n"]
                hints:
                  - "Sprich langsam: Taaa ... und dann?"
                  - "Die Zunge geht hoch, es klingt durch die Nase."
                  - "Es fehlt das n: Tan ... te."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Der _ sagt i-a.\n\nLeg das Wort."
                say: "Esel. Der Esel sagt i-a. Leg die Buchstaben."
                options: ["e", "l", "E", "s"]
                option_audio: false
                slot_count: 4
                answer: ["E", "s", "e", "l"]
                hints: ["E ... sss ... eee ... lll."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Ente. Welche Silbe fehlt?"
                show: { object: duck }
                frame: "En_"
                options: ["te", "ta", "de"]
                answer: ["te"]
                hints: ["En ... te. Am Ende hörst du eee."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie ist dein _?\n\nWelches Wort ist richtig geschrieben?"
                say: "Name. Wie ist dein Name? Welches Wort ist richtig geschrieben?"
                options: ["Nme", "Name", "Nam"]
                option_audio: false
                answer: "Name"
                hints: ["Na ... me. Zwei Silben, zwei Selbstlaute."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tomate. Welcher Buchstabe fehlt?"
                show: { object: tomato }
                frame: "Toma_e"
                options: ["t", "d", "n"]
                answer: ["t"]
                hints: ["Hör auf die letzte Silbe: te."]
              - id: l2-s5
                type: text_input
                keyboard: letters
                text: "Mein _ ist Ben.\n\nSchreib das Wort."
                say: "Name. Mein Name ist Ben. Sprich mit und schreib das Wort."
                answer: "Name"
                feedback:
                  Nam: "Hier fehlt das e am Ende. Sprich bis zum Schluss: Na ... me."
                hints: ["Nnn ... aaa ... mmm ... eee."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Tomate. Welche Silbe fehlt?"
                show: { object: tomato }
                frame: "_mate"
                options: ["To", "Ta", "Mo"]
                answer: ["To"]
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Ente. Welches Wort ist richtig geschrieben?"
                show: { object: duck }
                options: ["Ent", "Nte", "Ente"]
                option_audio: false
                answer: "Ente"
              - id: l2-n3
                type: text_input
                keyboard: letters
                text: "Meine _ heißt Ute.\n\nSchreib das Wort."
                say: "Tante. Meine Tante heißt Ute. Schreib das Wort."
                answer: "Tante"
                feedback:
                  Tate: "Hier fehlt ein Laut. Sprich langsam: Taaa ... nnn ... te."
              - id: l2-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Esel. Welcher Buchstabe fehlt?"
                frame: "Es_l"
                options: ["a", "e", "i"]
                answer: ["e"]
              - id: l2-n5
                type: image_multiple_choice
                text: "Wie viele Laute hörst du?"
                say: "Ente. Wie viele Laute hörst du?"
                show: { object: duck }
                options:
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                  - { drawn: dots, count: 5, layout: row }
                answer: "4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: long
            type: text_input
            keyboard: letters
            text: "Oma näht mit einer _.\n\nSchreib das Wort."
            say: "Nadel. Oma näht mit einer Nadel. Schreib das Wort."
            answer: "Nadel"
            feedback:
              Nadl: "Hier fehlt ein e. Sprich mit: Na ... del. Die zweite Silbe braucht auch einen Selbstlaut."
          - id: l2-c2
            part: every-sound
            type: multiple_choice
            text: "Meine _ besucht uns.\n\nWelches Wort ist richtig geschrieben?"
            say: "Tante. Meine Tante besucht uns. Welches Wort ist richtig geschrieben?"
            options: ["Tnte", "Tante", "Tate"]
            option_audio: false
            answer: "Tante"
          - id: l2-c3
            part: short
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Dose. Welcher Buchstabe fehlt?"
            frame: "D_se"
            options: ["a", "o", "u"]
            answer: ["o"]
          - id: l2-c4
            part: long
            type: fill_in_blank
            text: "Das Tier mit den langen Ohren sagt i-a.\n\nWelche Silbe fehlt?"
            say: "Esel. Das Tier mit den langen Ohren sagt i-a. Welche Silbe fehlt?"
            frame: "E_"
            options: ["sel", "sal", "lse"]
            answer: ["sel"]
          - id: l2-c5
            part: long
            type: ordering
            text: "Auf dem Brot ist _.\n\nLeg das Wort."
            say: "Salami. Auf dem Brot ist Salami. Leg die Silben."
            options: ["mi", "Sa", "la"]
            slot_count: 3
            answer: ["Sa", "la", "mi"]
          - id: l2-c6
            part: short
            type: text_input
            keyboard: letters
            text: "Im Baum ist ein _ mit Eiern.\n\nSchreib das Wort."
            say: "Nest. Im Baum ist ein Nest mit Eiern. Schreib das Wort."
            answer: "Nest"
          - id: l2-c7
            part: short
            type: fill_in_blank
            text: "Zum Essen gibt es grünen _.\n\nWelcher Buchstabe fehlt?"
            say: "Salat. Zum Essen gibt es grünen Salat. Welcher Buchstabe fehlt?"
            frame: "Sa_at"
            options: ["n", "l", "m"]
            answer: ["l"]
          - id: l2-c8
            part: short
            type: multiple_choice
