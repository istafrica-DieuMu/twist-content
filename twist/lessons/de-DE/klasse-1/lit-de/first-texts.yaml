            say: "Lies den Text. Mit wem fährt Ben zum Spielplatz?"
            options: ["mit Ida", "mit Mama", "mit Papa"]
            answer: "mit Papa"
          - id: l2-c4
            part: who-where
            type: multiple_choice
            text: "Ben hat ein neues Fahrrad. Es ist blau. Ben fährt mit Papa zum Spielplatz. Dort trifft er seine Freundin Ida.\n\nWen trifft Ben auf dem Spielplatz?"
            say: "Lies den Text. Wen trifft Ben auf dem Spielplatz?"
