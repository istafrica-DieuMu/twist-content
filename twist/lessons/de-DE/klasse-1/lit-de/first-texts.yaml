            options: [{ object: car }, { object: bike }, { object: bus }]
            answer: bike
          - id: l2-c2
            part: what
            type: multiple_choice
            text: "Opa hat einen neuen Hut. Der Hut ist grün. Opa setzt sich mit dem Hut auf die gelbe Bank im Garten.\n\nWelche Farbe hat der Hut?"
