            text: "Jule und Mama fahren mit dem Zug. Sie besuchen Oma am Meer. Jule schaut die ganze Zeit aus dem Fenster.\n\nStimmt das? Jule fährt mit dem Auto zu Oma."
            say: "Lies den Text. Stimmt das: Jule fährt mit dem Auto zu Oma?"
            answer: false
          - id: l2-c6
            part: who-where
