# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.first-texts
skill: lit-de.decoding.first-texts
curriculum: de-DE
language: de
title:
  de: Erste Texte lesen
  en: Reading first texts
summary: >
  Reading a short text of three to four sentences and answering questions
  about it. Lesson 1: the answer stands in one sentence; the question word
  (wer, was, wo, wie viele) says what to look for, and the child goes back
  to the text to find it. Lesson 2: reading more carefully, where a text
  names more than one thing of a kind (gern and heute, Papa and Ida) and
  where a statement has to be checked word by word against the text; it
  ends with the skill check on a new text. All texts are written for
  Twist; the voice asks the question but never reads the text.
metadata:
  year: klasse-1
  topic: { de: Erste Texte lesen, en: First texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.decoding.read-and-do, lit-de.decoding.longer-words]
  also_practises: [lit-de.decoding.read-and-do, lit-de.decoding.first-sentences]
  vocabulary: { de: [Text, Satz, Frage, Antwort, wer, was, wo, wie viele, nachlesen] }
  forms: [text, audio, picture, drawn]
  drawn: [syllable-arcs]
  sounds: []
  facets: []
  parts:
    - { id: who-where, what: { de: "Personen, Tiere und Orte im Text finden (Wer? Wo?)", en: "finding people, animals and places in the text (who, where)" } }
    - { id: what, what: { de: "Sachen und Farben im Text finden (Was? Welche Farbe?)", en: "finding things and colours in the text (what, which colour)" } }
    - { id: in-the-text, what: { de: "prüfen, ob ein Satz zum Text passt", en: checking whether a sentence fits the text } }
  misconceptions:
    - id: answer-from-memory
      what: Answers from what usually happens or what the child likes, not from what the text says
      addressed: lesson 2 Learn reads a text where Jonas likes apples but eats a banana today; l1-s4 states what ducks can do but the text does not say (the hint names it), l1-n4 states weather the text does not give; l2-f4 and l2-s5 change one detail
    - id: wrong-detail
      what: Takes a word from the text that answers a different question (the boy's name for the dog's name, Ida for the one Ben rides with)
      addressed: lesson 1 Learn finds the sentence with heißt; l1-c1, l2-n2 and the skill check tasks l2-c3 and l2-c4 offer other names or words from the same text
    - id: question-word
      what: Does not use the question word, so answers a wer question with a thing or a wo question with a name
      addressed: lesson 1 Learn names what wer, was, wo and wie viele ask for; hints in the full stage of lesson 1 point at the question word, and l1-f4 has feedback on a thing offered for wer
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Die Antwort steht im Text, en: The answer is in the text }
    goal:
      de: "Lies einen kurzen Text und such die Antwort darin. Fragt jemand wie viele, suchst du eine Zahl."
      en: "Read a short text and look for the answer in it. If the question is how many, you look for a number."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Tippe auf die Ente."
            say: "Lies die Aufgabe und mach, was dort steht."
            options: [{ object: frog }, { object: duck }]
            answer: duck
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Schmetterling", syllables: ["Schmet", "ter", "ling"] }
            options: [{ object: bee }, { object: butterfly }, { object: snail }]
            answer: butterfly
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Tim hat einen Hund. Der Hund heißt Struppi. Struppi ist braun. Er spielt gern mit dem Ball."
            say: "Das ist ein kurzer Text mit vier Sätzen. Hör zu und lies mit. Tim hat einen Hund. Der Hund heißt Struppi. Struppi ist braun. Er spielt gern mit dem Ball."
            show: { object: dog }
          - text: "Wie heißt der Hund?\nDer Hund heißt Struppi."
            say: "Zum Text gibt es eine Frage: Wie heißt der Hund? Lies im Text nach. Such den Satz mit dem Wort heißt. Dort steht: Der Hund heißt Struppi. Tim ist der Junge, nicht der Hund."
          - text: "Wer?  Was?  Wo?  Wie viele?"
            say: "Das Fragewort sagt dir, was du suchst. Wer fragt nach einer Person oder einem Tier. Was fragt nach einer Sache. Wo fragt nach einem Ort. Wie viele fragt nach einer Zahl."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Oma ist im Garten. Sie pflückt drei Äpfel. Die Äpfel sind rot. Oma backt einen Kuchen.\n\nWie viele Äpfel pflückt Oma?"
                say: "Lies den Text. Wie viele Äpfel pflückt Oma?"
                options: [{ object: apple, count: 2, layout: row }, { object: apple, count: 4, layout: row }, { object: apple, count: 3, layout: row }]
                answer: "3"
                hints:
                  - "„Wie viele“ fragt nach einer Zahl. Such im Text das Wort „Äpfel“."
                  - "Lies den zweiten Satz: Sie pflückt ..."
                  - "Oma pflückt drei Äpfel."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Oma ist im Garten. Sie pflückt drei Äpfel. Die Äpfel sind rot. Oma backt einen Kuchen.\n\nWas backt Oma?"
                say: "Lies den Text. Was backt Oma?"
                options: [{ object: bread }, { object: cake }, { object: pizza }]
                answer: cake
                hints:
                  - "„Was“ fragt nach einer Sache. Such im Text das Wort „backt“."
                  - "Lies den letzten Satz."
                  - "Oma backt einen Kuchen."
              - id: l1-f3
                type: true_false
                text: "Oma ist im Garten. Sie pflückt drei Äpfel. Die Äpfel sind rot. Oma backt einen Kuchen.\n\nStimmt das? Oma ist im Haus."
                say: "Lies den Text. Stimmt das: Oma ist im Haus?"
                answer: false
                hints:
                  - "Wo ist Oma? Such es im Text."
                  - "Lies den ersten Satz noch einmal."
                  - "Nein, Oma ist im Garten."
              - id: l1-f4
                type: multiple_choice
                text: "Oma ist im Garten. Sie pflückt drei Äpfel. Die Äpfel sind rot. Oma backt einen Kuchen.\n\nWer ist im Garten?"
                say: "Lies den Text. Wer ist im Garten?"
                options: ["Opa", "Oma", "der Kuchen"]
                answer: "Oma"
                feedback:
                  "der Kuchen": "„Wer“ fragt nach einer Person. Der Kuchen ist eine Sache."
                hints:
                  - "„Wer“ fragt nach einer Person. Such das Wort „Garten“."
                  - "Lies den ersten Satz: ... ist im Garten."
                  - "Oma ist im Garten."
              - id: l1-f5
                type: multiple_choice
                text: "Oma ist im Garten. Sie pflückt drei Äpfel. Die Äpfel sind rot. Oma backt einen Kuchen.\n\nWelche Farbe haben die Äpfel?"
                say: "Lies den Text. Welche Farbe haben die Äpfel?"
                options: ["grün", "gelb", "rot"]
                answer: "rot"
                hints:
                  - "Such den Satz, in dem steht, wie die Äpfel sind."
                  - "Lies den dritten Satz: Die Äpfel sind ..."
                  - "Die Äpfel sind rot."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Paul und Ali sind am See. Sie sehen zwei Enten. Die Enten schwimmen. Paul wirft Brot ins Wasser.\n\nWer ist am See?"
                say: "Lies den Text. Wer ist am See?"
                options: ["Paul und Oma", "Paul und Ali", "Ali und Mia"]
                answer: "Paul und Ali"
                hints: ["Lies den ersten Satz genau. Beide Namen müssen stimmen."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Paul und Ali sind am See. Sie sehen zwei Enten. Die Enten schwimmen. Paul wirft Brot ins Wasser.\n\nWie viele Enten sehen sie?"
                say: "Lies den Text. Wie viele Enten sehen sie?"
                options: [{ object: duck, count: 2, layout: row }, { object: duck, count: 1, layout: row }, { object: duck, count: 3, layout: row }]
                answer: "2"
                hints: ["Such im Text das Wort Enten. Was steht davor?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Paul und Ali sind am See. Sie sehen zwei Enten. Die Enten schwimmen. Paul wirft Brot ins Wasser.\n\nWas wirft Paul ins Wasser?"
                say: "Lies den Text. Was wirft Paul ins Wasser?"
                options: [{ object: ball }, { object: bread }, { object: apple }]
                answer: bread
                hints: ["Such das Wort wirft. Lies den Satz bis zum Ende."]
              - id: l1-s4
                type: true_false
                text: "Paul und Ali sind am See. Sie sehen zwei Enten. Die Enten schwimmen. Paul wirft Brot ins Wasser.\n\nStimmt das? Die Enten fliegen."
                say: "Lies den Text. Stimmt das: Die Enten fliegen?"
                answer: false
                hints: ["Enten können fliegen. Aber was steht im Text?"]
              - id: l1-s5
                type: multiple_choice
                text: "Paul und Ali sind am See. Sie sehen zwei Enten. Die Enten schwimmen. Paul wirft Brot ins Wasser.\n\nWo sind Paul und Ali?"
                say: "Lies den Text. Wo sind Paul und Ali?"
                options: ["im Zoo", "am See", "im Garten"]
                answer: "am See"
                hints: ["„Wo“ fragt nach einem Ort."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Es schneit. Jana und Ben bauen einen Schneemann. Er bekommt eine Möhre als Nase. Jana gibt ihm ihre Mütze.\n\nWas bauen Jana und Ben?"
                say: "Lies den Text. Was bauen Jana und Ben?"
                options: [{ object: house }, { object: snowman }, { object: car }]
                answer: snowman
              - id: l1-n2
                type: image_multiple_choice
                text: "Es schneit. Jana und Ben bauen einen Schneemann. Er bekommt eine Möhre als Nase. Jana gibt ihm ihre Mütze.\n\nWas bekommt der Schneemann als Nase?"
                say: "Lies den Text. Was bekommt der Schneemann als Nase?"
                options: [{ object: banana }, { object: apple }, { object: carrot }]
                answer: carrot
              - id: l1-n3
                type: image_multiple_choice
                text: "Es schneit. Jana und Ben bauen einen Schneemann. Er bekommt eine Möhre als Nase. Jana gibt ihm ihre Mütze.\n\nWas gibt Jana dem Schneemann?"
                say: "Lies den Text. Was gibt Jana dem Schneemann?"
                options: [{ object: hat }, { object: woolly-hat }, { object: sock }]
                answer: woolly-hat
              - id: l1-n4
                type: true_false
                text: "Es schneit. Jana und Ben bauen einen Schneemann. Er bekommt eine Möhre als Nase. Jana gibt ihm ihre Mütze.\n\nStimmt das? Es regnet."
                say: "Lies den Text. Stimmt das: Es regnet?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Es schneit. Jana und Ben bauen einen Schneemann. Er bekommt eine Möhre als Nase. Jana gibt ihm ihre Mütze.\n\nWer baut den Schneemann?"
                say: "Lies den Text. Wer baut den Schneemann?"
                options: ["Jana und Oma", "Ben und Paul", "Jana und Ben"]
                answer: "Jana und Ben"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lena hat eine Katze. Die Katze heißt Mimi. Mimi schläft gern auf dem Sofa.\n\nWie heißt die Katze?"
            say: "Lies den Text. Wie heißt die Katze?"
            options: ["Lena", "Mimi", "Mia"]
            answer: "Mimi"
          - id: l1-c2
            type: multiple_choice
            text: "Opa hat einen Garten. Dort wachsen Tomaten. Die Tomaten sind schon rot.\n\nWo wachsen die Tomaten?"
            say: "Lies den Text. Wo wachsen die Tomaten?"
            options: ["im Haus", "im Garten", "im Wald"]
            answer: "im Garten"
          - id: l1-c3
            type: true_false
            text: "Max hat einen Fisch. Der Fisch ist orange. Er schwimmt in einem Glas.\n\nStimmt das? Max hat einen Hund."
            say: "Lies den Text. Stimmt das: Max hat einen Hund?"
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Emma und Jan gehen in den Wald. Sie finden einen Igel. Der Igel rollt sich zusammen.\n\nWas finden Emma und Jan?"
            say: "Lies den Text. Was finden Emma und Jan?"
            options: [{ object: snail }, { object: hedgehog }, { object: mouse }]
            answer: hedgehog
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Heute ist es warm. Tina zieht ihr rotes Kleid an. Dann geht sie mit Papa ins Schwimmbad.\n\nMit wem geht Tina ins Schwimmbad?"
            say: "Lies den Text. Mit wem geht Tina ins Schwimmbad?"
            options: ["mit Mama", "mit Papa", "mit Oma"]
            answer: "mit Papa"
          - id: l1-c6
            type: true_false
            text: "Der Bus ist gelb. Kim steigt ein. Sie setzt sich neben ihre Freundin Aylin.\n\nStimmt das? Kim sitzt neben Aylin."
            say: "Lies den Text. Stimmt das: Kim sitzt neben Aylin?"
            answer: true

  - n: 2
    title: { de: Genau nachlesen, en: Checking in the text }
    goal:
      de: "Lies Frage und Text ganz genau. Jonas mag Äpfel, aber heute isst er eine Banane."
      en: "Read the question and the text very carefully. Jonas likes apples, but today he eats a banana."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Mia hat einen Ball. Der Ball ist rot.\n\nWelchen Ball hat Mia?"
            say: "Lies den Text. Welchen Ball hat Mia?"
            options: [{ object: ball, colour: blue }, { object: ball, colour: red }]
            answer: red
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Opa sitzt auf der Bank. Er liest ein Buch.\n\nStimmt das? Opa liest eine Zeitung."
            say: "Lies den Text. Stimmt das: Opa liest eine Zeitung?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Jonas mag Äpfel am liebsten. Heute isst er aber eine Banane. Die Banane ist süß.\n\nWas isst Jonas heute?"
            say: "Lies den Text genau. Jonas mag Äpfel am liebsten. Heute isst er aber eine Banane. Die Frage ist: Was isst Jonas heute? Die Antwort ist: eine Banane. Lies darum die Frage genau und such im Text das Wort heute."
            show: { object: banana }
          - text: "Stimmt das?"
            say: "Manchmal sollst du prüfen, ob ein Satz stimmt. Such die Stelle im Text und vergleiche Wort für Wort. Ist nur ein Wort anders, dann stimmt der Satz nicht."
          - text: "Wie heißt die Kuh?"
            say: "Such in der Frage ein wichtiges Wort, zum Beispiel heißt. Such dasselbe Wort im Text. Ganz in der Nähe steht meistens die Antwort."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: text_input
                text: "Mia hat Geburtstag. Sie wird sieben. Es gibt Kuchen und Saft. Mia bekommt ein Buch.\n\nWie alt wird Mia? Schreibe die Zahl."
                say: "Lies den Text. Wie alt wird Mia? Schreibe die Zahl."
                answer: "7"
                hints:
                  - "Such den Satz mit dem Wort wird."
                  - "Lies den zweiten Satz: Sie wird ..."
                  - "Mia wird sieben. Schreib die 7."
              - id: l2-f2
                type: image_multiple_choice
                text: "Mia hat Geburtstag. Sie wird sieben. Es gibt Kuchen und Saft. Mia bekommt ein Buch.\n\nWas bekommt Mia?"
                say: "Lies den Text. Was bekommt Mia?"
                options: [{ object: ball }, { object: bike }, { object: book }]
                answer: book
                hints:
                  - "Such im Text das Wort bekommt."
                  - "Lies den letzten Satz bis zum Ende."
                  - "Mia bekommt ein Buch."
              - id: l2-f3
                type: multiple_choice
                text: "Mia hat Geburtstag. Sie wird sieben. Es gibt Kuchen und Saft. Mia bekommt ein Buch.\n\nWas gibt es zu essen und zu trinken?"
                say: "Lies den Text. Was gibt es zu essen und zu trinken?"
                options: ["Kuchen und Milch", "Kuchen und Saft", "Pizza und Saft"]
                answer: "Kuchen und Saft"
                hints:
                  - "Such den Satz mit Es gibt."
                  - "Beide Wörter müssen stimmen: das Essen und das Trinken."
                  - "Kuchen und Saft."
              - id: l2-f4
                type: true_false
                text: "Mia hat Geburtstag. Sie wird sieben. Es gibt Kuchen und Saft. Mia bekommt ein Buch.\n\nStimmt das? Mia wird acht."
                say: "Lies den Text. Stimmt das: Mia wird acht?"
                answer: false
                hints:
                  - "Such die Stelle im Text, wo steht, wie alt Mia wird."
                  - "Im Text steht: Sie wird sieben. Ist das gleich wie acht?"
                  - "Nein, Mia wird sieben."
              - id: l2-f5
                type: multiple_choice
                text: "Mia hat Geburtstag. Sie wird sieben. Es gibt Kuchen und Saft. Mia bekommt ein Buch.\n\nWer hat Geburtstag?"
                say: "Lies den Text. Wer hat Geburtstag?"
                options: ["Mama", "Mia", "Tim"]
                answer: "Mia"
                hints:
                  - "„Wer“ fragt nach einer Person."
                  - "Lies den ersten Satz."
                  - "Mia hat Geburtstag."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Fridolin ist ein Frosch. Er sitzt auf einem Blatt im Teich. Er fängt eine Fliege. Dann springt er ins Wasser.\n\nWer ist Fridolin?"
                say: "Lies den Text. Wer ist Fridolin?"
                options: [{ object: fish }, { object: frog }, { object: bird }]
                answer: frog
                hints: ["Lies den ersten Satz."]
              - id: l2-s2
                type: multiple_choice
                text: "Fridolin ist ein Frosch. Er sitzt auf einem Blatt im Teich. Er fängt eine Fliege. Dann springt er ins Wasser.\n\nWo sitzt Fridolin?"
                say: "Lies den Text. Wo sitzt Fridolin?"
                options: ["auf einem Stein", "im Gras", "auf einem Blatt"]
                answer: "auf einem Blatt"
                hints: ["Such das Wort sitzt."]
              - id: l2-s3
                type: multiple_choice
                text: "Fridolin ist ein Frosch. Er sitzt auf einem Blatt im Teich. Er fängt eine Fliege. Dann springt er ins Wasser.\n\nWas fängt Fridolin?"
                say: "Lies den Text. Was fängt Fridolin?"
                options: ["eine Fliege", "einen Fisch", "eine Biene"]
                answer: "eine Fliege"
                hints: ["Such das Wort fängt."]
              - id: l2-s4
                type: multiple_choice
                text: "Fridolin ist ein Frosch. Er sitzt auf einem Blatt im Teich. Er fängt eine Fliege. Dann springt er ins Wasser.\n\nWas macht Fridolin zum Schluss?"
                say: "Lies den Text. Was macht Fridolin zum Schluss?"
                options: ["Er schläft ein.", "Er springt ins Wasser.", "Er fängt eine Fliege."]
                answer: "Er springt ins Wasser."
                hints: ["Zum Schluss heißt: ganz am Ende. Lies den letzten Satz."]
              - id: l2-s5
                type: true_false
                text: "Fridolin ist ein Frosch. Er sitzt auf einem Blatt im Teich. Er fängt eine Fliege. Dann springt er ins Wasser.\n\nStimmt das? Fridolin sitzt auf einem Baum."
                say: "Lies den Text. Stimmt das: Fridolin sitzt auf einem Baum?"
                answer: false
                hints: ["Vergleiche Wort für Wort mit dem zweiten Satz."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Auf dem Hof leben vier Schweine und eine Kuh. Die Kuh heißt Berta. Berta gibt jeden Tag Milch.\n\nWie viele Schweine leben auf dem Hof? Schreibe die Zahl."
                say: "Lies den Text. Wie viele Schweine leben auf dem Hof? Schreibe die Zahl."
                answer: "4"
              - id: l2-n2
                type: multiple_choice
                text: "Auf dem Hof leben vier Schweine und eine Kuh. Die Kuh heißt Berta. Berta gibt jeden Tag Milch.\n\nWie heißt die Kuh?"
                say: "Lies den Text. Wie heißt die Kuh?"
                options: ["Bella", "Berta", "Hof"]
                answer: "Berta"
              - id: l2-n3
                type: image_multiple_choice
                text: "Auf dem Hof leben vier Schweine und eine Kuh. Die Kuh heißt Berta. Berta gibt jeden Tag Milch.\n\nWas gibt Berta jeden Tag?"
                say: "Lies den Text. Was gibt Berta jeden Tag?"
                options: [{ object: egg }, { object: milk }, { object: juice }]
                answer: milk
              - id: l2-n4
                type: image_multiple_choice
                text: "Es regnet. Ole zieht seine Jacke an. Die Jacke ist gelb. Ole springt in jede Pfütze.\n\nWelche Jacke hat Ole an?"
                say: "Lies den Text. Welche Jacke hat Ole an?"
                options: [{ object: jacket, colour: blue }, { object: jacket, colour: red }, { object: jacket, colour: yellow }]
                answer: yellow
              - id: l2-n5
                type: true_false
                text: "Es regnet. Ole zieht seine Jacke an. Die Jacke ist gelb. Ole springt in jede Pfütze.\n\nStimmt das? Ole springt in jede Pfütze."
                say: "Lies den Text. Stimmt das: Ole springt in jede Pfütze?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: what
            type: image_multiple_choice
            text: "Lotta hat ein neues Fahrrad. Damit fährt sie zur Schule. Ihr Bruder Max fährt mit dem Bus.\n\nWas ist neu?"
