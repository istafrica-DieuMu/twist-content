# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.simple-tables
skill: lit-de.texts-media.tables-charts
curriculum: de-DE
language: de
title:
  de: Tabellen und Diagramme lesen
  en: Reading tables and charts
summary: >
  Taking information from simple tables, plans and charts. Lesson 1 reads
  short tables from school life (the Klassendienste, a Stundenplan, a
  Sitzplan, drawn as tables): find the right row or column, then read
  along it to the cell you need; lesson 2 reads
  Säulendiagramme about the class (favourite animals, the weather of a
  week), finds the most and the fewest, checks statements, and ends with
  the skill check. All tables and charts are written for Twist.
metadata:
  year: klasse-1
  topic: { de: Bildzeichen und Diagramme, en: Signs and charts }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.texts-media.pictograms, lit-de.decoding.first-texts]
  also_practises: [lit-de.decoding.first-texts]
  vocabulary: { de: [Tabelle, Zeile, Spalte, Stundenplan, Plan, Diagramm, Säule, am meisten, am wenigsten] }
  forms: [text, audio, drawn, picture]
  drawn: [table, bar-chart]
  facets: []
  parts:
    - { id: table, what: { de: einer Tabelle oder einem Plan eine Angabe entnehmen, en: taking a fact from a table or a plan } }
    - { id: chart-value, what: { de: in einem Säulendiagramm eine Zahl ablesen, en: reading a number from a bar chart } }
    - { id: most-fewest, what: { de: im Diagramm am meisten und am wenigsten finden, en: finding the most and the fewest in a chart } }
  misconceptions:
    - id: wrong-line
      what: Reads the answer from the row or column next to the right one, or from the first one, instead of finding the row or column the question names
      addressed: "lesson 1 Learn marks the row (Blumen) and the column (Dienstag) first and then reads along it; l1-f1 and l1-f3 (with feedback), l1-s1, l1-s3, l1-s5 (Seil and Kreide as pictures), l1-n1, l1-n3, l2-f1, l2-s1 and l2-c1 offer the value of a neighbouring row or column"
    - id: most-for-fewest
      what: Picks the tallest column when the question asks for am wenigsten
      addressed: "lesson 2 Learn compares the tallest and the shortest column; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c3 ask for am wenigsten with the tallest column as an option"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Tabellen und Pläne", en: "Tables and plans" }
    goal:
      de: "Lies eine Tabelle Zeile für Zeile. Such die Zeile mit den Blumen, dann siehst du, wer sie gießt."
      en: "Read a table row by row. Find the row with the flowers, and you see who waters them."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was sollst du tun?"
            say: "Dieses Bildzeichen steht vor einer Aufgabe. Was sollst du tun?"
            show: { object: scissors }
            options: ["Schneide aus.", "Hör zu.", "Lies."]
            answer: "Schneide aus."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ali hat einen Bruder. Er heißt Kemal. Kemal ist fünf Jahre alt.\n\nWie alt ist Kemal?"
            say: "Lies den Text. Wie alt ist Kemal?"
            options: ["fünf Jahre", "sechs Jahre", "zwei Jahre"]
            answer: "fünf Jahre"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Klassendienste"
            say: "Das ist eine Tabelle. Hier steht, wer in der Klasse welchen Dienst hat. Ganz oben steht, was in jeder Spalte zu finden ist: der Dienst und das Kind. Jede Zeile gehört zu einem Dienst."
            show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Ben], [Blumen, Lea], [Tür, Can]] }
          - text: "Klassendienste"
            say: "Wer gießt die Blumen? Such zuerst die Zeile mit dem Wort Blumen. Dann lies in dieser Zeile weiter: Lea. Lea gießt die Blumen."
            show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Ben], [Blumen, Lea], [Tür, Can]], mark: [[2, 0], [2, 1]] }
          - text: "Stundenplan"
            say: "Ein Stundenplan ist auch eine Tabelle. Jeder Tag hat eine Spalte. Hast du am Dienstag Sport? Such oben den Dienstag und lies nach unten: Mathe, Kunst, Deutsch. Kein Sport. Sport ist am Montag."
            show: { drawn: table, rows: [[Stunde, Montag, Dienstag], ["1.", Deutsch, Mathe], ["2.", Mathe, Kunst], ["3.", Sport, Deutsch]], mark: [[0, 2], [1, 2], [2, 2], [3, 2]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Klassendienste\n\nWer gießt die Blumen?"
                say: "Lies die Tabelle. Wer gießt die Blumen?"
                show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Mia], [Blumen, Jonas], [Müll, Ella]] }
                options: ["Jonas", "Mia", "Ella"]
                answer: "Jonas"
                feedback:
                  "Mia": "Mia steht bei der Tafel. Such die Zeile mit Blumen."
                hints:
                  - "Such zuerst die Zeile mit dem Wort Blumen."
                  - "In der Zeile Blumen steht ein Name. Lies ihn."
                  - "Jonas gießt die Blumen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Klassendienste\n\nWelchen Dienst hat Ella?"
                say: "Lies die Tabelle. Welchen Dienst hat Ella?"
                show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Mia], [Blumen, Jonas], [Müll, Ella]] }
                options: ["Müll", "Tafel", "Blumen"]
                answer: "Müll"
                hints:
                  - "Such jetzt den Namen Ella."
                  - "Ella steht in der letzten Zeile. Was steht vorne?"
                  - "Ella bringt den Müll weg."
              - id: l1-f3
                type: multiple_choice
                text: "Stundenplan\n\nAn welchem Tag hast du Musik?"
                say: "Lies den Stundenplan. An welchem Tag hast du Musik?"
                show: { drawn: table, rows: [[Stunde, Montag, Dienstag, Mittwoch], ["1.", Deutsch, Mathe, Deutsch], ["2.", Mathe, Musik, Kunst], ["3.", Sport, Deutsch, Mathe]] }
                options: ["am Dienstag", "am Montag", "am Mittwoch"]
                answer: "am Dienstag"
                feedback:
                  "am Montag": "Lies die Spalte Montag noch einmal von oben nach unten. Steht da Musik?"
                hints:
                  - "Such in der Tabelle das Wort Musik."
                  - "Musik steht in der Mitte. Welcher Tag steht oben in dieser Spalte?"
                  - "Musik ist am Dienstag."
              - id: l1-f4
                type: true_false
                text: "Stundenplan\n\nAm Mittwoch hast du Sport."
                say: "Lies den Stundenplan. Stimmt das? Am Mittwoch hast du Sport."
                show: { drawn: table, rows: [[Stunde, Montag, Dienstag, Mittwoch], ["1.", Deutsch, Mathe, Deutsch], ["2.", Mathe, Musik, Kunst], ["3.", Sport, Deutsch, Mathe]] }
                answer: false
                hints:
                  - "Such oben den Mittwoch."
                  - "Lies die Spalte Mittwoch nach unten: Deutsch, Kunst, Mathe. Steht da Sport?"
                  - "Nein. Sport ist am Montag."
              - id: l1-f5
                type: multiple_choice
                text: "Sitzplan\n\nWer sitzt mit Tom an einem Tisch?"
                say: "Lies den Sitzplan. Jede Spalte ist ein Tisch. Wer sitzt mit Tom an einem Tisch?"
                show: { drawn: table, rows: [[Tisch 1, Tisch 2, Tisch 3], [Ali, Tom, Finn], [Nele, Sara, Lotta]] }
                options: ["Sara", "Ali", "Finn"]
                answer: "Sara"
                hints:
                  - "Such den Namen Tom. An welchem Tisch sitzt er?"
                  - "Tom sitzt an Tisch 2. Wer steht noch in der Spalte Tisch 2?"
                  - "Sara sitzt mit Tom an Tisch 2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Geburtstage\n\nWer hat im Mai Geburtstag?"
                say: "Lies die Tabelle. Wer hat im Mai Geburtstag?"
                show: { drawn: table, rows: [[Monat, Kind], [März, Paul], [Mai, Ida], [Juli, Emre]] }
                options: ["Ida", "Paul", "Emre"]
                answer: "Ida"
                hints: ["Such zuerst die Zeile mit Mai."]
              - id: l1-s2
                type: multiple_choice
                text: "Geburtstage\n\nIn welchem Monat hat Emre Geburtstag?"
                say: "Lies die Tabelle. In welchem Monat hat Emre Geburtstag?"
                show: { drawn: table, rows: [[Monat, Kind], [März, Paul], [Mai, Ida], [Juli, Emre]] }
                options: ["im Juli", "im März", "im Mai"]
                answer: "im Juli"
                hints: ["Such den Namen Emre. Was steht vorne in der Zeile?"]
              - id: l1-s3
                type: multiple_choice
                text: "Stundenplan\n\nAn welchem Tag hast du Kunst?"
                say: "Lies den Stundenplan. An welchem Tag hast du Kunst?"
                show: { drawn: table, rows: [[Stunde, Montag, Dienstag, Mittwoch], ["1.", Deutsch, Mathe, Deutsch], ["2.", Mathe, Musik, Kunst], ["3.", Sport, Deutsch, Mathe]] }
                options: ["am Mittwoch", "am Dienstag", "am Montag"]
                answer: "am Mittwoch"
                hints: ["Such das Wort Kunst. Welcher Tag steht oben in dieser Spalte?"]
              - id: l1-s4
                type: true_false
                text: "Sitzplan\n\nFinn und Lotta sitzen an einem Tisch."
                say: "Lies den Sitzplan. Stimmt das? Finn und Lotta sitzen an einem Tisch."
                show: { drawn: table, rows: [[Tisch 1, Tisch 2, Tisch 3], [Ali, Tom, Finn], [Nele, Sara, Lotta]] }
                answer: true
                hints: ["Such den Namen Finn. Wer steht noch in dieser Spalte?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Pausenplan\n\nWas holst du am Montag aus der Spielkiste?"
                say: "Lies den Pausenplan. Was holst du am Montag aus der Spielkiste? Tippe auf das Bild."
                show: { drawn: table, rows: [[Tag, Spielzeug], [Montag, Ball], [Dienstag, Seil], [Mittwoch, Kreide]] }
                options: [{ object: ball }, { object: rope }, { object: chalk }]
                answer: ball
                hints: ["Such die Zeile Montag."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Klassendienste\n\nWer macht die Tür zu?"
                say: "Lies die Tabelle. Wer macht die Tür zu?"
                show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Lars], [Blumen, Aylin], [Tür, Noah], [Müll, Pia]] }
                options: ["Noah", "Aylin", "Pia"]
                answer: "Noah"
              - id: l1-n2
                type: multiple_choice
                text: "Klassendienste\n\nWelchen Dienst hat Lars?"
                say: "Lies die Tabelle. Welchen Dienst hat Lars?"
                show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Lars], [Blumen, Aylin], [Tür, Noah], [Müll, Pia]] }
                options: ["Tafel", "Müll", "Tür"]
                answer: "Tafel"
              - id: l1-n3
                type: multiple_choice
                text: "Mittagessen\n\nWas gibt es am Mittwoch?"
                say: "Lies den Plan. Was gibt es am Mittwoch zu essen?"
                show: { drawn: table, rows: [[Tag, Essen], [Montag, Nudeln], [Dienstag, Suppe], [Mittwoch, Pizza], [Donnerstag, Fisch]] }
                options: ["Pizza", "Suppe", "Fisch"]
                answer: "Pizza"
              - id: l1-n4
                type: true_false
                text: "Mittagessen\n\nAm Montag gibt es Fisch."
                say: "Lies den Plan. Stimmt das? Am Montag gibt es Fisch."
                show: { drawn: table, rows: [[Tag, Essen], [Montag, Nudeln], [Dienstag, Suppe], [Mittwoch, Pizza], [Donnerstag, Fisch]] }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Sitzplan\n\nAn welchem Tisch sitzt Nele?"
                say: "Lies den Sitzplan. An welchem Tisch sitzt Nele?"
                show: { drawn: table, rows: [[Tisch 1, Tisch 2, Tisch 3], [Ali, Tom, Finn], [Nele, Sara, Lotta]] }
                options: ["an Tisch 1", "an Tisch 2", "an Tisch 3"]
                answer: "an Tisch 1"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Klassendienste\n\nWer wischt die Tafel?"
            say: "Lies die Tabelle. Wer wischt die Tafel?"
            show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Emma], [Blumen, Leo], [Müll, Mats]] }
            options: ["Emma", "Leo", "Mats"]
            answer: "Emma"
          - id: l1-c2
            type: multiple_choice
            text: "Stundenplan\n\nWelches Fach hast du am Montag in der 3. Stunde?"
            say: "Lies den Stundenplan. Welches Fach hast du am Montag in der dritten Stunde?"
            show: { drawn: table, rows: [[Stunde, Montag, Dienstag], ["1.", Deutsch, Mathe], ["2.", Mathe, Musik], ["3.", Sport, Deutsch]] }
            options: ["Sport", "Deutsch", "Mathe"]
            answer: "Sport"
          - id: l1-c3
            type: true_false
            text: "Mittagessen\n\nAm Dienstag gibt es Suppe."
            say: "Lies den Plan. Stimmt das? Am Dienstag gibt es Suppe."
            show: { drawn: table, rows: [[Tag, Essen], [Montag, Nudeln], [Dienstag, Suppe], [Mittwoch, Pizza]] }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Sitzplan\n\nWer sitzt mit Mira an einem Tisch?"
            say: "Lies den Sitzplan. Jede Spalte ist ein Tisch. Wer sitzt mit Mira an einem Tisch?"
            show: { drawn: table, rows: [[Tisch 1, Tisch 2], [Jona, Mira], [Ella, Kai]] }
            options: ["Jona", "Kai", "Ella"]
            answer: "Kai"
          - id: l1-c5
            type: true_false
            text: "Geburtstage\n\nLeni hat im April Geburtstag."
            say: "Lies die Tabelle. Stimmt das? Leni hat im April Geburtstag."
            show: { drawn: table, rows: [[Monat, Kind], [Januar, Leni], [April, Omar], [Juni, Tess]] }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Obst in der Pause\n\nWelches Obst gibt es am Mittwoch?"
            say: "Lies den Plan. Welches Obst gibt es am Mittwoch? Tippe auf das Bild."
            show: { drawn: table, rows: [[Tag, Obst], [Montag, Apfel], [Dienstag, Banane], [Mittwoch, Birne]] }
            options: [{ object: apple }, { object: pear }, { object: banana }]
            answer: pear

  - n: 2
    title: { de: "Diagramme lesen", en: "Reading charts" }
    goal:
      de: "Lies ein Säulendiagramm. Die höchste Säule zeigt, welches Tier die meisten Kinder mögen."
      en: "Read a bar chart. The tallest bar shows which animal most children like."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Klassendienste\n\nWer gießt die Blumen?"
            say: "Lies die Tabelle. Wer gießt die Blumen?"
            show: { drawn: table, rows: [[Dienst, Kind], [Tafel, Jan], [Blumen, Ronja], [Tür, Malik]] }
            options: ["Ronja", "Jan", "Malik"]
            answer: "Ronja"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stundenplan\n\nAm Dienstag hast du Kunst."
            say: "Lies den Stundenplan. Stimmt das? Am Dienstag hast du Kunst."
            show: { drawn: table, rows: [[Stunde, Montag, Dienstag], ["1.", Deutsch, Mathe], ["2.", Sport, Kunst]] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Unsere Lieblingstiere"
            say: "Die Klasse 1b hat gefragt: Welches Tier magst du am liebsten? Das Diagramm zeigt die Antworten. Jede Säule gehört zu einem Tier. Unten steht der Name, an der Seite stehen die Zahlen."
            show: { drawn: bar-chart, rows: [["Hund", 6], ["Katze", 4], ["Hase", 2]] }
          - text: "Unsere Lieblingstiere\nWie viele Kinder mögen Katzen?"
            say: "Wie viele Kinder mögen Katzen am liebsten? Such unten das Wort Katze. Geh an der Säule nach oben bis zum Ende. Schau, welche Zahl daneben steht: vier."
            show: { drawn: bar-chart, rows: [["Hund", 6], ["Katze", 4], ["Hase", 2]] }
          - text: "höchste Säule: am meisten\nniedrigste Säule: am wenigsten"
            say: "Die höchste Säule zeigt, was die meisten Kinder mögen: den Hund. Die niedrigste Säule zeigt, was die wenigsten Kinder mögen: den Hasen."
            show: { drawn: bar-chart, rows: [["Hund", 6], ["Katze", 4], ["Hase", 2]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Unser Lieblingsobst\nWie viele Kinder mögen Bananen?"
                say: "Lies das Diagramm. Wie viele Kinder mögen Bananen am liebsten?"
                show: { drawn: bar-chart, rows: [["Apfel", 5], ["Banane", 3], ["Erdbeere", 7]] }
                options: ["3", "5", "7"]
                answer: "3"
                hints:
                  - "Such unten das Wort Banane."
                  - "Geh an der Säule nach oben. Welche Zahl steht am Ende daneben?"
                  - "3 Kinder."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Unser Lieblingsobst\nWelches Obst mögen am wenigsten Kinder?"
                say: "Lies das Diagramm. Welches Obst mögen am wenigsten Kinder?"
                show: { drawn: bar-chart, rows: [["Apfel", 5], ["Banane", 3], ["Erdbeere", 7]] }
                options: ["Banane", "Erdbeere", "Apfel"]
                answer: "Banane"
                feedback:
                  "Erdbeere": "Die Erdbeere hat die höchste Säule. Das ist am meisten. Such die niedrigste Säule."
                hints:
                  - "Am wenigsten: Such die niedrigste Säule."
                  - "Welche Säule ist am niedrigsten?"
                  - "Die Banane."
              - id: l2-f3
                type: true_false
                text: "Unser Lieblingsobst\nDie meisten Kinder mögen Erdbeeren."
                say: "Lies das Diagramm. Stimmt das? Die meisten Kinder mögen Erdbeeren am liebsten."
                show: { drawn: bar-chart, rows: [["Apfel", 5], ["Banane", 3], ["Erdbeere", 7]] }
                answer: true
                hints:
                  - "Die meisten: Such die höchste Säule."
                  - "Welche Säule ist am höchsten?"
                  - "Ja. Die Erdbeere hat die höchste Säule."
              - id: l2-f4
                type: multiple_choice
                text: "So kommen wir zur Schule\nWie kommen die meisten Kinder zur Schule?"
                say: "Lies das Diagramm. Wie kommen die meisten Kinder zur Schule?"
                show: { drawn: bar-chart, rows: [["zu Fuß", 8], ["Bus", 5], ["Auto", 3]] }
                options: ["zu Fuß", "mit dem Bus", "mit dem Auto"]
                answer: "zu Fuß"
                hints:
                  - "Die meisten: Such die höchste Säule."
                  - "Lies unten, was unter der höchsten Säule steht."
                  - "Zu Fuß."
              - id: l2-f5
                type: image_multiple_choice
                text: "So kommen wir zur Schule\nWomit fahren 5 Kinder?"
                say: "Lies das Diagramm. Womit fahren fünf Kinder zur Schule? Tippe auf das Bild."
                show: { drawn: bar-chart, rows: [["zu Fuß", 8], ["Bus", 5], ["Auto", 3]] }
                options: [{ object: bus }, { object: car }, { object: bike }]
                answer: bus
                hints:
                  - "Such die Säule, die bis zur 5 geht."
                  - "Was steht unter dieser Säule?"
                  - "Mit dem Bus."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Das Wetter in dieser Woche\nAn wie vielen Tagen hat es geregnet?"
                say: "Lies das Diagramm. An wie vielen Tagen hat es geregnet?"
                show: { drawn: bar-chart, rows: [["Sonne", 4], ["Regen", 2], ["Wolken", 1]] }
                options: ["2", "4", "1"]
                answer: "2"
                hints: ["Such unten das Wort Regen."]
              - id: l2-s2
                type: multiple_choice
                text: "Unsere Haustiere\nWelches Tier haben am wenigsten Kinder?"
                say: "Lies das Diagramm. Welches Tier haben am wenigsten Kinder zu Hause?"
                show: { drawn: bar-chart, rows: [["Katze", 6], ["Hund", 4], ["Fisch", 1]] }
                options: ["Fisch", "Katze", "Hund"]
                answer: "Fisch"
                hints: ["Am wenigsten: die niedrigste Säule."]
              - id: l2-s3
                type: true_false
                text: "Unsere Haustiere\n4 Kinder haben einen Hund."
                say: "Lies das Diagramm. Stimmt das? Vier Kinder haben einen Hund."
                show: { drawn: bar-chart, rows: [["Katze", 6], ["Hund", 4], ["Fisch", 1]] }
                answer: true
                hints: ["Such die Säule über dem Wort Hund."]
              - id: l2-s4
                type: multiple_choice
                text: "Unsere Lieblingsfarben\nWelche Farbe mögen die meisten Kinder?"
                say: "Lies das Diagramm. Welche Farbe mögen die meisten Kinder?"
                show: { drawn: bar-chart, rows: [["Rot", 4], ["Blau", 7], ["Gelb", 5]] }
                options: ["Blau", "Rot", "Gelb"]
                answer: "Blau"
                hints: ["Die meisten: die höchste Säule."]
              - id: l2-s5
                type: multiple_choice
                text: "Unsere Lieblingsfarben\nWie viele Kinder mögen Gelb?"
                say: "Lies das Diagramm. Wie viele Kinder mögen Gelb am liebsten?"
                show: { drawn: bar-chart, rows: [["Rot", 4], ["Blau", 7], ["Gelb", 5]] }
                options: ["5", "4", "7"]
                answer: "5"
                hints: ["Geh an der Säule über Gelb nach oben."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Unsere Spiele in der Pause\nWie viele Kinder spielen Fangen?"
                say: "Lies das Diagramm. Wie viele Kinder spielen in der Pause Fangen?"
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Fangen", 6], ["Seilspringen", 3]] }
                options: ["6", "7", "3"]
                answer: "6"
              - id: l2-n2
                type: multiple_choice
                text: "Unsere Spiele in der Pause\nWelches Spiel spielen am wenigsten Kinder?"
                say: "Lies das Diagramm. Welches Spiel spielen am wenigsten Kinder?"
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Fangen", 6], ["Seilspringen", 3]] }
                options: ["Seilspringen", "Fußball", "Fangen"]
                answer: "Seilspringen"
              - id: l2-n3
                type: true_false
                text: "Das Wetter in dieser Woche\nAn 3 Tagen war es wolkig."
                say: "Lies das Diagramm. Stimmt das? An drei Tagen war es wolkig."
                show: { drawn: bar-chart, rows: [["Sonne", 4], ["Regen", 2], ["Wolken", 1]] }
                answer: false
              - id: l2-n4
                type: image_multiple_choice
                text: "Unsere Haustiere\nWelches Tier haben 6 Kinder?"
                say: "Lies das Diagramm. Welches Tier haben sechs Kinder zu Hause? Tippe auf das Bild."
                show: { drawn: bar-chart, rows: [["Katze", 6], ["Hund", 4], ["Fisch", 1]] }
