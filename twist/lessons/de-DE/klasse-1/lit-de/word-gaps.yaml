# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.word-gaps
skill: lit-de.sentences.word-gaps
curriculum: de-DE
language: de
title:
  de: Wörter, Lücken und Satzsalat
  en: Word gaps and sentence salad
summary: >
  Children learn where one word ends and the next begins. Lesson 1 counts
  the words in a spoken sentence, finds the gaps in a Wortschlange
  (Lenamaltgern) and spots a sentence with a gap in the wrong place.
  Lesson 2 builds sentences from muddled word cards (Satzsalat), using the
  capital letter at the start and the Punkt at the end, fills gap
  sentences with the word that makes sense, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Erste Sätze schreiben, en: Writing first sentences }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.first-sentences]
  also_practises: [lit-de.decoding.first-sentences]
  vocabulary: { de: [Wort, Lücke, Satz, Wortschlange, Satzsalat, Punkt] }
  forms: [drawn, audio, picture]
  drawn: [letter-card, word-card]
  sounds: []
  facets: []
  parts:
    - { id: boundaries, what: { de: "Wortgrenzen erkennen: Wörter zählen, Lücken richtig setzen", en: "seeing where words begin and end: counting words, placing the gaps" } }
    - { id: salad, what: { de: aus einem Satzsalat einen Satz bilden, en: unscrambling words into a sentence } }
    - { id: gaps, what: { de: Lückensätze mit dem passenden Wort ergänzen, en: completing gap sentences with the word that makes sense } }
  misconceptions:
    - id: syllable-as-word
      what: Takes a syllable for a word, so splits Mama into Ma ma or counts claps instead of words
      addressed: "Learn claps once per word, not per syllable; l1-f2, l1-s3 and l1-n4 set a word split into syllables against the right gaps, with feedback on l1-f2"
    - id: small-words-glued
      what: Hears small words as part of the next word and writes them together (derhund, imhaus)
      addressed: "the Wortschlange tasks and the glued cards in l1-f4, l1-s4 and l2-c3 all hide a short word (der, im, dem) in a longer one; hints on l1-f4 name it"
    - id: salad-in-card-order
      what: Leaves the Satzsalat cards in the order they come, without looking for the capital letter and the Punkt
      addressed: "lesson 2 Learn finds the first card by its capital and the last by its Punkt; hints on l2-f1 and l2-f2 ask for both"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wo hört ein Wort auf?", en: "Where does a word end?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Die Ente ist im Wasser." }
            options: [{ object: duck }, { object: dog }, { object: bee }]
            answer: duck
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Das ist ein Hund.\n\nPasst der Satz zum Bild?"
            say: "Lies den Satz. Passt er zum Bild?"
            show: { object: dog }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Tim hat einen Ball."
            say: "Hör zu: Tim hat einen Ball. Für jedes Wort klatsche ich einmal: Tim, hat, einen, Ball. Das sind vier Wörter."
            show: { drawn: word-card, text: "Tim hat einen Ball." }
          - text: "Lenamaltgern."
            say: "Hier sind die Lücken verschwunden. Das ist eine Wortschlange. Lies langsam und such die Wörter: Lena, malt, gern."
            show: { drawn: word-card, text: "Lenamaltgern." }
          - text: "Lena malt gern."
            say: "Zwischen zwei Wörtern lässt du eine Lücke. Jetzt kann man den Satz gut lesen: Lena malt gern."
            show: { drawn: letter-card, text: "Lena malt gern." }
          - text: "Mama"
            say: "Aber Vorsicht: Ma und ma sind zwei Silben, keine zwei Wörter. Mama ist ein Wort. Da kommt keine Lücke hinein."
            show: { drawn: word-card, text: "Mama" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Hör den Satz. Wie viele Wörter sind es?"
                say: "Hör gut zu. Wie viele Wörter hörst du?"
                audio: { de: "Oma backt Kuchen." }
                options: ["2", "3", "4"]
                answer: "3"
                feedback:
                  "4": "Kuchen hat zwei Silben, aber es ist nur ein Wort. Klatsch einmal pro Wort: Oma, backt, Kuchen."
                hints:
                  - "Klatsch für jedes Wort einmal."
                  - "Oma ... backt ... Kuchen."
                  - "Es sind drei Wörter."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo sind die Lücken richtig?"
                say: "Welcher Satz hat die Lücken an der richtigen Stelle?"
                options: ["Mi a sitzt im Bus.", "Mia sitzt im Bus.", "Mia sitztim Bus."]
                option_audio: false
                answer: "Mia sitzt im Bus."
                feedback:
                  "Mi a sitzt im Bus.": "Mia ist ein Name, also ein Wort. Mitten in einem Wort ist keine Lücke."
                  "Mia sitztim Bus.": "„Sitzt“ und „im“ sind zwei Wörter. Zwischen ihnen fehlt die Lücke."
                hints:
                  - "Lies jeden Satz langsam. Wo hört ein Wort auf?"
                  - "„Mia“ ist ein Wort. „Sitzt“ ist ein Wort. „Im“ ist ein Wort."
                  - "Mia sitzt im Bus."
              - id: l1-f3
                type: multiple_choice
                text: "Lies die Wortschlange. Wie viele Wörter sind es?"
                say: "Lies die Wortschlange. Wie viele Wörter stecken darin?"
                show: { drawn: word-card, text: "Paulisthier." }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Lies langsam und such das erste Wort."
                  - "Paul ... ist ... hier."
                  - "Drei Wörter: Paul, ist, hier."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
                say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
                show: { drawn: letter-card, text: "Derhund bellt laut." }
                spans: ["Derhund"]
                hints:
                  - "Lies jede Karte. Ist es ein Wort oder sind es zwei?"
                  - "Kleine Wörter wie „der“ verstecken sich gern."
                  - "„Derhund“: Das sind „der“ und „Hund“."
              - id: l1-f5
                type: true_false
                text: "Sind die Lücken richtig?"
                say: "Lies den Satz. Sind die Lücken richtig?"
                show: { drawn: letter-card, text: "Ole isst eine Banane." }
                answer: true
                hints:
                  - "Lies Karte für Karte. Ist jede Karte ein ganzes Wort?"
                  - "Ole, isst, eine, Banane."
                  - "Ja, jede Karte ist ein Wort."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Hör den Satz. Wie viele Wörter sind es?"
                say: "Hör gut zu. Wie viele Wörter hörst du?"
                audio: { de: "Die Katze trinkt Milch." }
                options: ["3", "4", "5"]
                answer: "4"
                hints: ["Klatsch für jedes Wort einmal: Die, Katze, trinkt, Milch."]
              - id: l1-s2
                type: multiple_choice
                text: "Lies die Wortschlange. Wie viele Wörter sind es?"
                say: "Lies die Wortschlange. Wie viele Wörter stecken darin?"
                show: { drawn: word-card, text: "IchmagEis." }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Das erste Wort ist ganz kurz: Ich."]
              - id: l1-s3
                type: true_false
                text: "Sind die Lücken richtig?"
                say: "Lies den Satz. Sind die Lücken richtig?"
                show: { drawn: letter-card, text: "Pa pa liest." }
                answer: false
                hints: ["Ist Papa ein Wort oder sind es zwei?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
                say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
                show: { drawn: letter-card, text: "Der Igel liegtim Laub." }
                spans: ["liegtim"]
                hints: ["Such das kleine Wort „im“."]
              - id: l1-s5
                type: multiple_choice
                text: "Wo sind die Lücken richtig?"
                say: "Welcher Satz hat die Lücken an der richtigen Stelle?"
                options: ["Wir malen ein Bild.", "Wirmalen ein Bild.", "Wir ma len ein Bild."]
                option_audio: false
                answer: "Wir malen ein Bild."
                hints: ["Lies jede Karte langsam. Ist sie ein ganzes Wort?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Hör den Satz. Wie viele Wörter sind es?"
                say: "Hör gut zu. Wie viele Wörter hörst du?"
                audio: { de: "Ben hat einen Hund." }
                options: ["3", "4", "5"]
                answer: "4"
              - id: l1-n2
                type: multiple_choice
                text: "Lies die Wortschlange. Wie viele Wörter sind es?"
                say: "Lies die Wortschlange. Wie viele Wörter stecken darin?"
                show: { drawn: word-card, text: "DieSonnescheint." }
                options: ["2", "3", "4"]
                answer: "3"
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
                say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
                show: { drawn: letter-card, text: "Lisa istim Garten." }
                spans: ["istim"]
              - id: l1-n4
                type: true_false
                text: "Sind die Lücken richtig?"
                say: "Lies den Satz. Sind die Lücken richtig?"
                show: { drawn: letter-card, text: "Die Kat ze rennt." }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Wo sind die Lücken richtig?"
                say: "Welcher Satz hat die Lücken an der richtigen Stelle?"
                options: ["Opa holtTee.", "O pa holt Tee.", "Opa holt Tee."]
                option_audio: false
                answer: "Opa holt Tee."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Hör den Satz. Wie viele Wörter sind es?"
            say: "Hör gut zu. Wie viele Wörter hörst du?"
            audio: { de: "Lea malt eine Blume." }
            options: ["4", "5", "6"]
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "Lies die Wortschlange. Wie viele Wörter sind es?"
            say: "Lies die Wortschlange. Wie viele Wörter stecken darin?"
            show: { drawn: word-card, text: "Tomrennt." }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c3
            type: true_false
            text: "Sind die Lücken richtig?"
            say: "Lies den Satz. Sind die Lücken richtig?"
            show: { drawn: letter-card, text: "Der Bus ist rot." }
            answer: true
          - id: l1-c4
            type: audio_choice
            text: "Hör den Satz. Wie viele Wörter sind es?"
            say: "Hör gut zu. Wie viele Wörter hörst du?"
            audio: { de: "Mein Bruder heißt Jan." }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l1-c5
            type: true_false
            text: "Sind die Lücken richtig?"
            say: "Lies den Satz. Sind die Lücken richtig?"
            show: { drawn: letter-card, text: "Lu kas holt Brot." }
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
            say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
            show: { drawn: letter-card, text: "Mama trinktden Tee." }
            spans: ["trinktden"]

  - n: 2
    title: { de: Satzsalat und Lückensätze, en: Sentence salad and gap sentences }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Lies die Wortschlange. Wie viele Wörter sind es?"
            say: "Lies die Wortschlange. Wie viele Wörter stecken darin?"
            show: { drawn: word-card, text: "Ninalacht." }
            options: ["2", "3"]
            answer: "2"
            difficulty: easy
          - id: l2-w2
            type: highlight_in_text
            text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
            say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
            show: { drawn: letter-card, text: "Dasist mein Hut." }
            spans: ["Dasist"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ball.  Ben  den  holt"
            say: "Oh, ein Satzsalat. Die Wörter sind durcheinandergeraten. Wir bringen sie in die richtige Reihenfolge."
            show: { drawn: letter-card, text: "Ball. Ben den holt" }
          - text: "Ben ...  ... Ball."
            say: "Ben fängt groß an, und Ben ist ein Name. Er kommt nach vorn. Ball hat den Punkt. Ball kommt ans Ende."
            show: { drawn: letter-card, text: "Ben Ball." }
          - text: "Ben holt den Ball."
            say: "Jetzt die Mitte. Lies laut und hör, ob es gut klingt: Ben holt den Ball. Das ist ein Satz."
            show: { drawn: letter-card, text: "Ben holt den Ball." }
          - text: "Die Kuh frisst _."
            say: "Bei einem Lückensatz fehlt ein Wort. Lies den Satz und überleg, was passt. Die Kuh frisst Gras. Gras passt, Auto passt nicht."
            show: { object: cow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Satzsalat: Leg den Satz."
                say: "Leg die Wörter in die richtige Reihenfolge."
                show: { object: cat }
                options: ["miaut.", "Katze", "Die"]
                slot_count: 3
                answer: ["Die", "Katze", "miaut."]
                hints:
                  - "Such das Wort mit dem großen Anfang und das Wort mit dem Punkt."
                  - "„Die“ steht am Anfang, „miaut.“ hat den Punkt."
                  - "Die Katze miaut."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Satzsalat: Leg den Satz."
                say: "Leg die Wörter in die richtige Reihenfolge."
                show: { object: grandpa }
                options: ["Opa", "Brot.", "isst"]
                slot_count: 3
                answer: ["Opa", "isst", "Brot."]
                hints:
                  - "Welches Wort hat den Punkt? Das kommt ans Ende."
                  - "Wer tut etwas? Opa. Was tut er? Er isst."
                  - "Opa isst Brot."
              - id: l2-f3
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: bee }
                frame: "Die Biene _."
                options: ["summt", "bellt", "Tisch"]
                answer: ["summt"]
                feedback:
                  bellt: "Ein Hund bellt. Was macht eine Biene?"
                  Tisch: "„Die Biene Tisch“ ist kein Satz. Hier fehlt, was die Biene tut."
                hints:
                  - "Lies den Satz mit jedem Wort. Was ergibt Sinn?"
                  - "Was macht eine Biene?"
                  - "Die Biene summt."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Satz stimmt?"
                say: "Aus den Wörtern Mia, isst und Eis wird ein Satz. Welcher Satz stimmt?"
                options: ["Eis isst Mia.", "Mia isst Eis.", "Isst Eis Mia."]
                option_audio: false
                answer: "Mia isst Eis."
                feedback:
                  "Eis isst Mia.": "Dann würde das Eis Mia essen. Das geht nicht. Wer isst hier?"
                  "Isst Eis Mia.": "Das klingt falsch. Lies es laut. Wer tut etwas? Das kommt nach vorn."
                hints:
                  - "Lies jeden Satz laut. Welcher ergibt Sinn?"
                  - "Wer isst? Mia. Was isst sie?"
                  - "Mia isst Eis."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: sun }
                frame: "Die _ scheint."
                options: ["Sonne", "Seife", "sitzt"]
                answer: ["Sonne"]
                hints:
                  - "Lies den Satz mit jedem Wort."
                  - "Was scheint am Himmel?"
                  - "Die Sonne scheint."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Satzsalat: Leg den Satz."
                say: "Leg die Wörter in die richtige Reihenfolge."
                show: { object: frog }
                options: ["sitzt.", "Frosch", "Der"]
                slot_count: 3
                answer: ["Der", "Frosch", "sitzt."]
                hints: ["Großer Anfang nach vorn, Punkt ans Ende."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: book }
                frame: "Lena liest ein _."
                options: ["Buch", "Bus", "Bein"]
                answer: ["Buch"]
                hints: ["Was kann man lesen?"]
              - id: l2-s3
                type: ordering
                text: "Satzsalat: Leg den Satz."
                say: "Leg die Wörter in die richtige Reihenfolge."
                show: { object: snowman }
                options: ["baut", "Schneemann.", "einen", "Ali"]
                slot_count: 4
                answer: ["Ali", "baut", "einen", "Schneemann."]
                hints: ["Wer baut etwas? Der fängt an."]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Satz stimmt?"
                say: "Welcher Satz ist richtig gelegt?"
                options: ["Der Hund holt den Ball.", "Holt Hund der den Ball.", "Hund der holt den Ball."]
                option_audio: false
                answer: "Der Hund holt den Ball."
                hints: ["Achte auf den großen Anfang und auf den Punkt."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: fish }
                frame: "Der Fisch _ im Wasser."
                options: ["schwimmt", "fliegt", "Bus"]
                answer: ["schwimmt"]
                hints: ["Was macht ein Fisch im Wasser?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Satzsalat: Leg den Satz."
                say: "Leg die Wörter in die richtige Reihenfolge."
                show: { object: bike }
                options: ["Rad.", "hat", "Papa", "ein"]
                slot_count: 4
                answer: ["Papa", "hat", "ein", "Rad."]
              - id: l2-n2
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: cup }
                frame: "Der Tee ist in der _."
                options: ["Tasse", "Tanne", "Tante"]
                answer: ["Tasse"]
              - id: l2-n3
                type: ordering
                text: "Satzsalat: Leg den Satz."
                say: "Leg die Wörter in die richtige Reihenfolge."
                show: { object: kite }
                options: ["Drachen.", "hat", "Emma", "einen"]
                slot_count: 4
                answer: ["Emma", "hat", "einen", "Drachen."]
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt in die Lücke?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: mouse }
                frame: "Die Maus ist _."
                options: ["klein", "Kino", "kocht"]
                answer: ["klein"]
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Satz stimmt?"
                say: "Welcher Satz ist richtig gelegt?"
                options: ["Der Wind weht.", "Weht Wind der.", "Wind der weht."]
                option_audio: false
                answer: "Der Wind weht."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: boundaries
            type: audio_choice
            text: "Hör den Satz. Wie viele Wörter sind es?"
            say: "Hör gut zu. Wie viele Wörter hörst du?"
            audio: { de: "Der Hase frisst eine Möhre." }
            options: ["4", "5", "6"]
            answer: "5"
          - id: l2-c2
            part: salad
            type: ordering
            text: "Satzsalat: Leg den Satz."
            say: "Leg die Wörter in die richtige Reihenfolge."
            show: { object: duck }
            options: ["Ente", "Die", "schwimmt."]
            slot_count: 3
            answer: ["Die", "Ente", "schwimmt."]
          - id: l2-c3
            part: boundaries
            type: highlight_in_text
            text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
            say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
            show: { drawn: letter-card, text: "Ole rennt mitdem Hund." }
            spans: ["mitdem"]
          - id: l2-c4
            part: gaps
            type: fill_in_blank
            text: "Welches Wort passt in die Lücke?"
            say: "Lies den Satz. Welches Wort passt in die Lücke?"
            show: { object: bed }
            frame: "Am Abend gehe ich ins _."
            options: ["Bett", "Brot", "Boot"]
            answer: ["Bett"]
            option_audio: false
          - id: l2-c5
            part: boundaries
            type: multiple_choice
            text: "Wo sind die Lücken richtig?"
            say: "Welcher Satz hat die Lücken an der richtigen Stelle?"
            options: ["I da malt ein Haus.", "Ida malt ein Haus.", "Ida malt einHaus."]
            option_audio: false
            answer: "Ida malt ein Haus."
          - id: l2-c6
            part: boundaries
            type: audio_choice
            text: "Hör den Satz. Wie viele Wörter sind es?"
            say: "Hör gut zu. Wie viele Wörter hörst du?"
            audio: { de: "Wir spielen im Garten." }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c7
            part: boundaries
            type: multiple_choice
            text: "Lies die Wortschlange. Wie viele Wörter sind es?"
            say: "Lies die Wortschlange. Wie viele Wörter stecken darin?"
            show: { drawn: word-card, text: "DieEulefliegtweit." }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c8
            part: boundaries
            type: highlight_in_text
            text: "Tippe auf die Karte, in der zwei Wörter zusammenkleben."
            say: "In einer Karte kleben zwei Wörter zusammen. Tippe darauf."
            show: { drawn: letter-card, text: "Nina sitztauf dem Sofa." }
            spans: ["sitztauf"]
          - id: l2-c9
            part: salad
