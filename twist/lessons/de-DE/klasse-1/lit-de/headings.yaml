# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.headings
skill: lit-de.comprehension.headings
curriculum: de-DE
language: de
title:
  de: Die passende Überschrift
  en: The right heading
summary: >
  Finding the heading that fits a short text. Lesson 1 learns that a
  Überschrift says in a few words what the whole text is about, and picks
  it from three: the right one, one that names only a detail, and one
  about something else; lesson 2 goes the other way, finds the text for a
  heading, matches headings to short texts, says whether a heading fits,
  and ends with the skill check. All texts are written for Twist.
metadata:
  year: klasse-1
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.first-texts]
  also_practises: [lit-de.decoding.first-texts]
  vocabulary: { de: [Überschrift, Text, worum es geht] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: heading-for-text, what: { de: zu einem Text die passende Überschrift finden, en: finding the heading that fits a text } }
    - { id: text-for-heading, what: { de: zu einer Überschrift den passenden Text oder das passende Bild finden, en: finding the text or picture that fits a heading } }
    - { id: fits, what: { de: "prüfen, ob eine Überschrift zum ganzen Text passt", en: checking whether a heading fits the whole text } }
  misconceptions:
    - id: detail-heading
      what: Picks a heading that names only one detail of the text (Der Kuchen for a text about a birthday party)
      addressed: "lesson 1 Learn sets Die Würmer against Der Igel im Herbst; every heading choice offers a detail (l1-f1 and l1-f3 with feedback, l1-s1, l1-s3, l1-n1, l1-n3, l2-w1, l2-c1, l2-c4); l1-f5, l1-s5 and l2-f4 ask true_false about a detail heading"
    - id: word-match
      what: Picks a heading or a text only because the same word appears in both, though the text is about something else
      addressed: "lesson 2 Learn shows a text that names a dog but is about rain; l2-f1 (with feedback), l2-s1, l2-n1 and l2-c2 offer a text that shares a word with the heading but is about something else"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was passt darüber?", en: "What goes on top?" }
    goal:
      de: "Lies den ganzen Text und find die Überschrift, die zu allen Sätzen passt, wie Der Igel im Herbst."
      en: "Read the whole text and find the heading that fits every sentence, like The hedgehog in autumn."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Ida hat eine Katze. Die Katze heißt Mimi.\n\nWie heißt die Katze?"
            say: "Lies den Text. Wie heißt die Katze?"
            options: ["Mimi", "Ida", "Mia"]
            answer: "Mimi"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Im Garten steht ein großer Baum. Ein Vogel sitzt darauf.\n\nWo sitzt der Vogel?"
            say: "Lies den Text. Wo sitzt der Vogel? Tippe auf das Bild."
            options: [{ object: tree }, { object: house }, { object: car }]
            answer: tree
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Igel im Herbst\n\nIm Herbst sucht der Igel viel Futter. Er frisst Käfer und Würmer. Dann baut er sich ein Nest aus Laub."
            say: "Über vielen Texten steht eine Überschrift. Sie steht ganz oben. Sie sagt dir in wenigen Wörtern, worum es im Text geht. Hier geht es um den Igel im Herbst."
            show: { object: hedgehog }
          - text: "Der Igel im Herbst\nDie Würmer\nIm Schwimmbad"
            say: "Welche Überschrift passt? Von den Würmern steht nur in einem Satz etwas. Das ist zu wenig. Vom Schwimmbad steht gar nichts im Text. Der Igel im Herbst passt zum ganzen Text."
          - text: "Lies den ganzen Text.\nFrag dich: Worum geht es?"
            say: "So findest du die Überschrift: Lies zuerst den ganzen Text. Frag dich dann: Worum geht es in allen Sätzen? Die Überschrift muss zum ganzen Text passen, nicht nur zu einem Wort."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Am Samstag hat Lina Geburtstag. Sie feiert mit ihren Freunden. Es gibt Kuchen und viele Spiele.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Linas Geburtstag", "Der Kuchen", "Im Zoo"]
                answer: "Linas Geburtstag"
                feedback:
                  "Der Kuchen": "Der Kuchen kommt nur in einem Satz vor. Worum geht es im ganzen Text?"
                hints:
                  - "Lies alle Sätze. Worum geht es in allen Sätzen?"
                  - "Lina feiert mit Freunden. Was feiert sie?"
                  - "Linas Geburtstag."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Ben hat einen Hund. Er heißt Bello. Jeden Tag geht Ben mit Bello in den Park.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Ben und sein Hund", "Der Park", "Bens neues Fahrrad"]
                answer: "Ben und sein Hund"
                hints:
                  - "Wer kommt in jedem Satz vor?"
                  - "Ben und Bello. Wer ist Bello?"
                  - "Ben und sein Hund."
              - id: l1-f3
                type: multiple_choice
                text: "Es schneit. Die Kinder ziehen Mütze und Handschuhe an. Sie fahren Schlitten und bauen einen Schneemann.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Spaß im Schnee", "Die Mütze", "Ein heißer Tag"]
                answer: "Spaß im Schnee"
                feedback:
                  "Die Mütze": "Die Mütze ist nur ein kleiner Teil. Was machen die Kinder im ganzen Text?"
                hints:
                  - "Lies alle Sätze. Worum geht es?"
                  - "Es schneit, und die Kinder spielen draußen."
                  - "Spaß im Schnee."
              - id: l1-f4
                type: image_multiple_choice
                text: "Die Ente\n\nWelches Bild passt zu dieser Überschrift?"
                say: "Lies die Überschrift. Welches Bild passt dazu?"
                options: [{ object: duck }, { object: bird }, { object: fish }]
                answer: duck
                option_audio: false
                hints:
                  - "Lies die Überschrift genau."
                  - "Lies langsam: En ... te. Welches Tier ist das?"
                  - "Tippe auf die Ente."
              - id: l1-f5
                type: true_false
                text: "Opa und Emil gehen angeln. Sie sitzen lange am See. Am Abend haben sie drei Fische.\n\nÜberschrift: Der See\n\nPasst die Überschrift?"
                say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
                answer: false
                hints:
                  - "Worum geht es in allen Sätzen?"
                  - "Der See kommt nur einmal vor. Was machen Opa und Emil?"
                  - "Nein. Besser passt: Opa und Emil gehen angeln."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Mia packt ihren Schulranzen. Sie legt ihr Heft und ihre Stifte hinein. Dann geht sie zur Schule.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Mia geht zur Schule", "Die Stifte", "Mia im Urlaub"]
                answer: "Mia geht zur Schule"
                hints: ["Die Überschrift muss zu allen Sätzen passen."]
              - id: l1-s2
                type: multiple_choice
                text: "Die Sonne scheint. Papa und Can fahren ans Meer. Sie schwimmen und bauen eine Burg aus Sand.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Ein Tag am Meer", "Im Wald", "Can ist krank"]
                answer: "Ein Tag am Meer"
                hints: ["Wo sind Papa und Can?"]
              - id: l1-s3
                type: multiple_choice
                text: "Nele hat Bauchweh. Sie bleibt im Bett. Mama kocht ihr einen Tee.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Nele ist krank", "Der Tee", "Nele spielt Fußball"]
                answer: "Nele ist krank"
                hints: ["Der Tee kommt nur in einem Satz vor. Wie geht es Nele?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Der Schneemann\n\nWelches Bild passt zu dieser Überschrift?"
                say: "Lies die Überschrift. Welches Bild passt dazu?"
                options: [{ object: snowman }, { object: snow }, { object: clown }]
                answer: snowman
                option_audio: false
                hints: ["Lies das ganze Wort: Schnee ... mann."]
              - id: l1-s5
                type: true_false
                text: "Lea und Tom spielen Verstecken. Tom zählt bis zehn. Lea versteckt sich hinter dem Baum.\n\nÜberschrift: Lea und Tom spielen Verstecken\n\nPasst die Überschrift?"
                say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
                answer: true
                hints: ["Was spielen Lea und Tom?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Im Herbst fallen die Blätter von den Bäumen. Sie sind rot, gelb und braun. Der Wind weht sie über die Wiese.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Bunte Blätter im Herbst", "Die Wiese", "Blumen im Frühling"]
                answer: "Bunte Blätter im Herbst"
              - id: l1-n2
                type: multiple_choice
                text: "Der Frosch lebt am Teich. Er ist grün. Er fängt Fliegen mit seiner langen Zunge.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Der Frosch", "Der Hund", "Die Fliege"]
                answer: "Der Frosch"
              - id: l1-n3
                type: multiple_choice
                text: "Jan und Papa backen Brot. Sie kneten den Teig. Dann kommt das Brot in den Ofen.\n\nWelche Überschrift passt?"
                say: "Lies den Text. Welche Überschrift passt?"
                options: ["Brot backen mit Papa", "Der Ofen", "Jan malt ein Bild"]
                answer: "Brot backen mit Papa"
              - id: l1-n4
                type: image_multiple_choice
                text: "Die Schere\n\nWelches Bild passt zu dieser Überschrift?"
                say: "Lies die Überschrift. Welches Bild passt dazu?"
                options: [{ object: scissors }, { object: pencil }, { object: ruler }]
                answer: scissors
                option_audio: false
              - id: l1-n5
                type: true_false
                text: "Die Klasse 1b fährt in den Zoo. Die Kinder sehen Affen, Löwen und Giraffen. Am Mittag essen sie ein Eis.\n\nÜberschrift: Das Eis\n\nPasst die Überschrift?"
                say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ole hat ein neues Fahrrad. Es ist blau. Ole fährt damit jeden Tag zur Schule.\n\nWelche Überschrift passt?"
            say: "Lies den Text. Welche Überschrift passt?"
            options: ["Oles neues Fahrrad", "Die Schule", "Oles Katze"]
            answer: "Oles neues Fahrrad"
          - id: l1-c2
            type: image_multiple_choice
            text: "Die Giraffe\n\nWelches Bild passt zu dieser Überschrift?"
            say: "Lies die Überschrift. Welches Bild passt dazu?"
            options: [{ object: giraffe }, { object: zebra }, { object: elephant }]
            answer: giraffe
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Es regnet. Aylin zieht ihre Regenjacke an. Sie springt in jede Pfütze.\n\nÜberschrift: Aylin im Regen\n\nPasst die Überschrift?"
            say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Sara spielt Gitarre. Jeden Tag übt sie ein neues Lied. Bald spielt sie in der Schule vor.\n\nWelche Überschrift passt?"
            say: "Lies den Text. Welche Überschrift passt?"
            options: ["Die Schule", "Sara spielt Gitarre", "Sara kocht Suppe"]
            answer: "Sara spielt Gitarre"
          - id: l1-c5
            type: true_false
            text: "Die Feuerwehr kommt mit Blaulicht. Sie löscht ein Feuer in einem Haus. Alle sind froh.\n\nÜberschrift: Das Blaulicht\n\nPasst die Überschrift?"
            say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Der Mond\n\nWelches Bild passt zu dieser Überschrift?"
            say: "Lies die Überschrift. Welches Bild passt dazu?"
            options: [{ object: sun }, { object: star }, { object: moon }]
            answer: moon
            option_audio: false

  - n: 2
    title: { de: "Überschrift und Text", en: "Heading and text" }
    goal:
      de: "Find zu einer Überschrift den passenden Text. Nur weil ein Wort im Text vorkommt, passt sie noch nicht."
      en: "Find the text that goes with a heading. A word from the heading in the text does not mean it fits."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Die Biene fliegt von Blume zu Blume. Sie sammelt Nektar. Daraus macht sie Honig.\n\nWelche Überschrift passt?"
            say: "Lies den Text. Welche Überschrift passt?"
            options: ["Die fleißige Biene", "Die Blume", "Der Bär"]
            answer: "Die fleißige Biene"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ali hilft Oma im Garten. Sie pflanzen Blumen und gießen sie.\n\nÜberschrift: Im Garten bei Oma\n\nPasst die Überschrift?"
            say: "Lies den Text und die Überschrift. Passt die Überschrift?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Hund im Regen"
            say: "Eine Überschrift verrät dir schon vorher, worum es im Text geht. Lies: Der Hund im Regen. Jetzt weißt du: Im Text geht es um einen Hund, und es regnet."
            show: { objects: [dog, rain] }
          - text: "Es regnet. Lisa sieht aus dem Fenster. Draußen läuft ein Hund vorbei.\n\nÜberschrift: Der Hund"
            say: "Hier kommt das Wort Hund im Text vor. Aber geht es um den Hund? Nein, der Hund läuft nur vorbei. Es geht um Lisa und den Regen. Nur weil ein Wort aus der Überschrift im Text steht, passt sie noch lange nicht."
          - text: "Überschrift lesen\nText lesen\nPasst es zusammen?"
            say: "Lies zuerst die Überschrift. Lies dann den Text. Frag dich: Geht es im ganzen Text um das, was die Überschrift sagt?"

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Überschrift: Der kleine Drache\n\nWelcher Text passt dazu?"
                say: "Lies die Überschrift. Welcher Text passt dazu?"
                options: ["Der kleine Drache Fridolin wohnt in einer Höhle. Er kann noch nicht fliegen.", "Lars lässt seinen Drachen steigen. Der Wind ist stark.", "Die Katze schläft auf dem Sofa. Sie schnurrt."]
                answer: "Der kleine Drache Fridolin wohnt in einer Höhle. Er kann noch nicht fliegen."
                option_audio: false
                feedback:
                  "Lars lässt seinen Drachen steigen. Der Wind ist stark.": "Hier ist der Drache ein Spielzeug am Himmel. Die Überschrift sagt: der kleine Drache. Um wen geht es da?"
                hints:
                  - "Lies die Überschrift. Lies dann jeden Text."
                  - "In zwei Texten steht Drache. In welchem Text ist der Drache ein Tier und kein Spielzeug?"
                  - "Der Text über Fridolin."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Welche Überschrift passt zu welchem Text?"
                say: "Lies die Texte. Verbinde jede Überschrift mit ihrem Text."
                option_audio: false
                pairs:
                  - { left: { text: "Im Schwimmbad" }, right: { text: "Max springt ins Wasser. Er taucht bis zum Boden." } }
                  - { left: { text: "Beim Arzt" }, right: { text: "Die Ärztin hört Lenas Herz ab. Lena ist gesund." } }
                  - { left: { text: "Im Supermarkt" }, right: { text: "Papa kauft Milch, Brot und Äpfel." } }
                hints:
                  - "Nimm einen Text nach dem anderen. Wo passiert das?"
                  - "Wo hört eine Ärztin das Herz ab?"
                  - "Wasser: Schwimmbad. Ärztin: Arzt. Milch und Brot kaufen: Supermarkt."
              - id: l2-f3
                type: image_multiple_choice
                text: "Überschrift: Unser Ausflug mit dem Bus\n\nWelches Bild passt?"
                say: "Lies die Überschrift. Welches Bild passt dazu?"
                options: [{ object: bus }, { object: boat }, { object: bike }]
                answer: bus
                option_audio: false
                hints:
                  - "Lies die Überschrift bis zum Ende."
                  - "Womit fahren wir bei diesem Ausflug?"
                  - "Mit dem Bus."
              - id: l2-f4
                type: true_false
                text: "Ida hat einen neuen Freund. Er heißt Kemal. Kemal und Ida bauen zusammen eine Höhle im Garten.\n\nÜberschrift: Der Garten\n\nPasst die Überschrift?"
                say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
                answer: false
                hints:
                  - "Worum geht es in allen Sätzen?"
                  - "Der Garten kommt nur am Ende vor. Wer ist Kemal?"
                  - "Nein. Besser passt: Idas neuer Freund."
              - id: l2-f5
                type: multiple_choice
                text: "Überschrift: Der verlorene Schuh\n\nWorum geht es wohl im Text?"
                say: "Lies die Überschrift. Worum geht es wohl im Text?"
                options: ["Jemand findet seinen Schuh nicht mehr.", "Jemand kauft neue Schuhe.", "Jemand putzt seine Schuhe."]
                answer: "Jemand findet seinen Schuh nicht mehr."
                option_audio: false
                hints:
                  - "Lies jedes Wort der Überschrift."
                  - "Was heißt verloren?"
                  - "Wer etwas verloren hat, findet es nicht mehr."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Überschrift: Die Maus und der Käse\n\nWelcher Text passt dazu?"
                say: "Lies die Überschrift. Welcher Text passt dazu?"
                options: ["Eine Maus findet ein Stück Käse. Sie trägt es in ihr Loch.", "Mama kauft Käse. Sie macht ein Brot damit.", "Die Maus schläft. Draußen ist es dunkel."]
                answer: "Eine Maus findet ein Stück Käse. Sie trägt es in ihr Loch."
                option_audio: false
                hints: ["Im passenden Text kommen die Maus und der Käse vor."]
              - id: l2-s2
                type: matching
                text: "Welche Überschrift passt zu welchem Text?"
                say: "Lies die Texte. Verbinde jede Überschrift mit ihrem Text."
                option_audio: false
                pairs:
                  - { left: { text: "Der Igel" }, right: { text: "Er hat viele Stacheln. Er schläft im Winter." } }
                  - { left: { text: "Die Kuh" }, right: { text: "Sie frisst Gras. Sie gibt Milch." } }
                  - { left: { text: "Der Fisch" }, right: { text: "Er lebt im Wasser. Er hat Flossen." } }
                hints: ["Welches Tier hat Stacheln, welches gibt Milch, welches hat Flossen?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Überschrift: Mein Lieblingsobst\n\nWelches Bild passt?"
                say: "Lies die Überschrift. Welches Bild passt dazu?"
                options: [{ object: banana }, { object: cheese }, { object: bread }]
                answer: banana
                option_audio: false
                hints: ["Was davon ist Obst?"]
              - id: l2-s4
                type: true_false
                text: "Lukas verliert einen Zahn. Er legt ihn unter sein Kissen. Am Morgen liegt dort eine Münze.\n\nÜberschrift: Der Wackelzahn\n\nPasst die Überschrift?"
                say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
                answer: true
                hints: ["Worum geht es in allen Sätzen?"]
              - id: l2-s5
                type: multiple_choice
                text: "Überschrift: Ein Geschenk für Mama\n\nWorum geht es wohl im Text?"
                say: "Lies die Überschrift. Worum geht es wohl im Text?"
                options: ["Ein Kind macht Mama eine Freude.", "Mama kocht Suppe.", "Ein Kind geht zum Sport."]
                answer: "Ein Kind macht Mama eine Freude."
                option_audio: false
                hints: ["Wer bekommt das Geschenk?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Überschrift: Der Ball im Baum\n\nWelcher Text passt dazu?"
                say: "Lies die Überschrift. Welcher Text passt dazu?"
                options: ["Finn schießt den Ball. Der Ball bleibt oben im Baum hängen.", "Finn spielt mit dem Ball auf der Wiese.", "Im Baum wohnt ein Eichhörnchen."]
                answer: "Finn schießt den Ball. Der Ball bleibt oben im Baum hängen."
                option_audio: false
              - id: l2-n2
                type: matching
                text: "Welche Überschrift passt zu welchem Text?"
                say: "Lies die Texte. Verbinde jede Überschrift mit ihrem Text."
                option_audio: false
                pairs:
                  - { left: { text: "Gute Nacht" }, right: { text: "Papa liest noch vor. Dann macht er das Licht aus." } }
                  - { left: { text: "Guten Appetit" }, right: { text: "Die Suppe ist fertig. Alle sitzen am Tisch." } }
                  - { left: { text: "Gute Reise" }, right: { text: "Oma steigt in den Zug. Alle winken." } }
              - id: l2-n3
                type: image_multiple_choice
                text: "Überschrift: Hurra, es schneit!\n\nWelches Bild passt?"
                say: "Lies die Überschrift. Welches Bild passt dazu?"
                options: [{ object: snow }, { object: rain }, { object: sun }]
                answer: snow
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Can hat einen Wackelzahn. Beim Apfelessen fällt er heraus.\n\nÜberschrift: Cans Apfelbaum\n\nPasst die Überschrift?"
                say: "Lies den Text und die Überschrift. Passt die Überschrift zum ganzen Text?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Überschrift: Die Klasse feiert Fasching\n\nWorum geht es wohl im Text?"
                say: "Lies die Überschrift. Worum geht es wohl im Text?"
                options: ["Die Kinder verkleiden sich und feiern.", "Die Kinder schreiben einen Test.", "Die Kinder gehen nach Hause."]
                answer: "Die Kinder verkleiden sich und feiern."
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: heading-for-text
            type: multiple_choice
            text: "Emma steht auf und hat Hunger. Sie macht sich ein Brot mit Käse. Dazu trinkt sie ein Glas Milch.\n\nWelche Überschrift passt?"
            say: "Lies den Text. Welche Überschrift passt?"
