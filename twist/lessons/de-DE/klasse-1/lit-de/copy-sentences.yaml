                answer: "einen Finger breit"
                hints:
                  - "Die Wörter sollen nicht zusammenkleben, aber auch nicht weit weg sein."
                  - "Du kannst deine Hand zum Messen nehmen."
                  - "Einen Finger breit."
              - id: l1-f4
