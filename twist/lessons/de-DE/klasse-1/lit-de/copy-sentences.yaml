                say: "Vorlage: Tim malt. Lea hat den Satz dreimal abgeschrieben. Welche Abschrift ist richtig?"
                show: { drawn: word-card, text: "Tim malt." }
                options: ["Timmalt.", "Tim malt.", "Tim malt"]
                option_audio: false
                answer: "Tim malt."
                feedback:
                  "Timmalt.": "Hier kleben die Wörter zusammen. Zwischen Tim und malt fehlt die Lücke."
                  "Tim malt": "Die Wörter stimmen. Aber am Ende fehlt der Punkt."
                hints:
                  - "Vergleiche mit der Vorlage: Buchstaben, Lücke, Punkt."
                  - "Zwischen Tim und malt ist eine Lücke. Am Ende steht ein Punkt."
                  - "Tim malt. Mit Lücke und mit Punkt."
              - id: l1-f3
