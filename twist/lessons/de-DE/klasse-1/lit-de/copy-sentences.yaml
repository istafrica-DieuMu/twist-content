      - activity: learn
        mode: demonstration
        screens:
          - text: "Ich mag Eis."
            say: "Jetzt schreibst du einen ganzen Satz ab. Lies ihn zuerst: Ich mag Eis."
            show: { drawn: word-card, text: "Ich mag Eis." }
          - text: "Ich  mag  Eis."
            say: "Schreib ein Wort, dann leg einen Finger daneben. So breit ist die Lücke bis zum nächsten Wort."
            show: { drawn: writing-lines, text: "Ich mag Eis.", mode: copy, arrows: false }
          - text: "Ich ... mag ... Eis ... ."
            say: "Merk dir ein Wort und schreib es. Dann das nächste. Und am Ende kommt der Punkt. Der gehört auch dazu."
            show: { drawn: letter-card, text: "Ich mag Eis." }
          - text: "vergleichen"
            say: "Zum Schluss vergleichst du Wort für Wort mit der Vorlage. Stimmt jeder Buchstabe? Sind die Lücken da? Ist der Punkt da?"
            show: { drawn: word-card, text: "Ich mag Eis." }

