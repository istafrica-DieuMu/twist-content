# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.copy-sentences
skill: lit-de.handwriting.copy-sentences
curriculum: de-DE
language: de
title:
  de: Sätze abschreiben
  en: Copying sentences
summary: >
  Children copy short sentences without mistakes, with the same
  Abschreiben steps as for words: read, remember, write, compare. A
  sentence needs three more things than a word: a gap a finger wide
  between the words, a capital letter at the start and a Punkt at the
  end. Lesson 1 copies three-word sentences word by word; lesson 2
  remembers two words at a time, checks copies for all three things and
  ends with the skill check. The app does not yet compare the child's
  strokes with the model, so the writing tasks are practice and the check
  rests on the compare, remember and order tasks.
metadata:
  year: klasse-1
  topic: { de: Erste Sätze schreiben, en: Writing first sentences }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.handwriting.copy-words]
  also_practises: [lit-de.handwriting.copy-words]
  vocabulary: { de: [abschreiben, Vorlage, Abschrift, Lücke, Punkt, vergleichen] }
  forms: [drawn, audio]
  drawn: [writing-lines, word-card, letter-card]
  sounds: []
  facets: [script]
  parts:
    - { id: compare, what: { de: eine Abschrift mit der Vorlage vergleichen, en: comparing a copy with the original } }
    - { id: gaps-capital-stop, what: { de: "großen Anfang, Lücken und Punkt prüfen", en: "checking the capital, the gaps and the full stop" } }
    - { id: remember, what: { de: einen Satz kurz ansehen und genau behalten, en: looking at a sentence briefly and remembering it exactly } }
    - { id: steps, what: { de: die Schritte beim Abschreiben kennen, en: knowing the steps of copying } }
  misconceptions:
    - id: no-gaps
      what: Writes the words of a sentence without gaps, so the copy cannot be read (Ichmageis)
      addressed: "Learn shows the finger gap; every stage has a copy with a missing gap among the options, with feedback on l1-f2 and hints on l2-f2; l1-f4 and l2-c3 ask what was forgotten"
    - id: forgets-full-stop
      what: Copies the words but leaves out the Punkt, or writes the first word small
      addressed: "lesson 2 Learn checks the three things in order (Anfang groß, Lücken, Punkt); options in l2-f1, l2-s4 and l2-c1 leave out the Punkt or the capital"
    - id: word-by-letter
      what: Looks back after each letter and loses the place in the sentence
      addressed: "flash tasks cover the sentence so a word or two must be kept in mind; lesson 2 Learn remembers two words at a time"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
