# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.initial-sound
skill: lit-de.phonological.initial-sound
curriculum: de-DE
language: de
title:
  de: Anlaute hören
  en: Hearing first sounds
summary: >
  Children hear the first sound of a word (Sonne starts with sss) and find
  words that start with the same sound. There are no letters yet: the
  sounds are spoken, and every picture says its word. Lesson 1 listens for
  one sound at a time; lesson 2 pairs and sorts words by their first sound,
  finds the one that starts differently, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Laute hören, en: Hearing sounds }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [lit-de.phonological.rhymes, lit-de.phonological.syllables]
  also_practises: [lit-de.phonological.syllables]
  vocabulary: { de: [Anlaut, erster Laut, Anfang, gleich, anders] }
  no_reading: true
  forms: [picture, audio, drawn]
  drawn: [dots]
  facets: []
  parts:
    - { id: hear-sound, what: { de: "hören, ob ein Wort mit einem bestimmten Laut anfängt", en: hearing whether a word starts with a given sound } }
    - { id: same-start, what: { de: Wörter mit dem gleichen Anlaut finden, en: finding words that start with the same sound } }
    - { id: odd-one-out, what: { de: "das Wort finden, das anders anfängt", en: finding the word that starts differently } }
  misconceptions:
    - id: syllable-not-sound
      what: Hears the first syllable (Son) instead of the first sound (sss)
      addressed: Learn holds the first sound long ("Sss ... onne"); hints say only the sound
    - id: s-sch
      what: Mixes up s and sch (Sonne, Schuh)
      addressed: both lessons set sss words against sch words
    - id: end-sound
      what: Listens to the end of the word (Haus, Maus) as in rhyming
      addressed: Learn contrasts the two ("Beim Reimen hörst du auf das Ende, jetzt auf den Anfang")
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der erste Laut, en: The first sound }
    goal:
      de: "Hör auf den ersten Laut eines Wortes. Halte ihn lange, wie am Anfang von Sonne, dann hörst du ihn gut."
      en: "Listen for the first sound of a word. Hold it long, like at the start of Sonne, and you hear it well."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Reimt sich das?"
            say: "Haus, Maus. Reimt sich das?"
            show: { objects: [mouse, house] }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Wie oft klatschst du?"
            say: "Sonne. Klatsch das Wort mit. Wie oft hast du geklatscht?"
            show: { object: sun }
            options:
              - { drawn: dots, count: 1, layout: row }
              - { drawn: dots, count: 2, layout: row }
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Beim Reimen hörst du auf das Ende. Jetzt hörst du auf den Anfang. Sonne. Sss ... onne. Der erste Laut ist sss."
            show: { object: sun }
          - say: "Maus. Mmm ... aus. Der erste Laut ist mmm."
            show: { object: mouse }
          - say: "Fisch. Fff ... isch. Der erste Laut ist fff. Halte den ersten Laut lange, dann hörst du ihn gut."
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Hörst du am Anfang sss?"
                say: "Socke. Hörst du am Anfang ein sss?"
                show: { object: sock }
                answer: true
                hints:
                  - "Sprich das Wort und halte den ersten Laut lange."
                  - "Sss ... ocke."
                  - "Ja, Socke fängt mit sss an."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Was fängt mit mmm an?"
                say: "Was fängt mit mmm an? Tippe auf das Bild."
                options: [{ object: moon }, { object: ball }, { object: fish }]
                answer: moon
                feedback:
                  ball: "Ball fängt mit b an."
                  fish: "Fisch fängt mit fff an."
                hints:
                  - "Tippe auf die Bilder und hör dir die Wörter an."
                  - "Mond ... mmm. Ball ... b. Fisch ... fff."
                  - "Mond fängt mit mmm an."
              - id: l1-f3
                type: true_false
                text: "Hörst du am Anfang fff?"
                say: "Hund. Hörst du am Anfang ein fff?"
                show: { object: dog }
                answer: false
                hints:
                  - "Sprich das Wort langsam."
                  - "H ... und. Am Anfang hauchst du."
                  - "Nein, Hund fängt mit h an."
              - id: l1-f4
                type: image_multiple_choice
                text: "Was fängt so an wie Sonne?"
                say: "Sonne. Was fängt so an wie Sonne?"
                show: { object: sun }
                options: [{ object: shoe }, { object: sock }, { object: moon }]
                answer: sock
                feedback:
                  shoe: "Schuh fängt mit sch an, Sonne mit sss. Das klingt ähnlich, ist aber nicht gleich."
                hints:
                  - "Sonne fängt mit sss an."
                  - "Hör dir die Wörter an: Schuh, Socke, Mond."
                  - "Sss ... ocke. Socke fängt so an wie Sonne."
              - id: l1-f5
                type: true_false
                text: "Fangen sie gleich an?"
                say: "Fisch, Frosch. Fangen beide gleich an?"
                show: { objects: [fish, frog] }
                answer: true
                hints:
                  - "Hör nur auf den ersten Laut."
                  - "Fff ... isch. Fff ... rosch."
                  - "Ja, beide fangen mit fff an."
              - id: l1-f6
                type: image_multiple_choice
                text: "Was fängt mit h an?"
                say: "Was fängt mit h an? Tippe auf das Bild."
                options: [{ object: apple }, { object: rabbit }, { object: cow }]
                answer: rabbit
                hints:
                  - "Bei h hauchst du, so wie an eine kalte Fensterscheibe."
                  - "Apfel ... a. Hase ... h. Kuh ... k."
                  - "Hase fängt mit h an."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Hörst du am Anfang mmm?"
                say: "Mund. Hörst du am Anfang ein mmm?"
                show: { object: mouth }
                answer: true
                hints: ["Halte den ersten Laut lange: Mmm ... und."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Was fängt mit sss an?"
                say: "Was fängt mit sss an? Tippe auf das Bild."
                options: [{ object: snail }, { object: sun }, { object: fish }]
                answer: sun
                hints: ["Schnecke fängt mit sch an. Hör genau."]
              - id: l1-s3
                type: true_false
                text: "Fangen sie gleich an?"
                say: "Ball, Baum. Fangen beide gleich an?"
                show: { objects: [ball, tree] }
                answer: true
                hints: ["Hör nur auf den Anfang."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Was fängt so an wie Lampe?"
                say: "Lampe. Was fängt so an wie Lampe?"
                show: { object: lamp }
                options: [{ object: lion }, { object: ear }, { object: table }]
                answer: lion
                hints: ["Lampe fängt mit lll an."]
              - id: l1-s5
                type: true_false
                text: "Hörst du am Anfang k?"
                say: "Tisch. Hörst du am Anfang ein k?"
                show: { object: table }
                answer: false
                hints: ["Sprich den ersten Laut: T ... isch."]
              - id: l1-s6
                type: image_multiple_choice
                text: "Was fängt mit sch an?"
                say: "Was fängt mit sch an? Tippe auf das Bild."
                options: [{ object: sock }, { object: shoe }, { object: house }]
                answer: shoe
                hints: ["Sch sagst du, wenn jemand leise sein soll."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Hörst du am Anfang a?"
                say: "Apfel. Hörst du am Anfang ein a?"
                show: { object: apple }
                answer: true
              - id: l1-n2
                type: image_multiple_choice
                text: "Was fängt mit fff an?"
                say: "Was fängt mit fff an? Tippe auf das Bild."
                options: [{ object: hand }, { object: frog }, { object: mouse }]
                answer: frog
              - id: l1-n3
                type: true_false
                text: "Fangen sie gleich an?"
                say: "Kuh, Hund. Fangen beide gleich an?"
                show: { objects: [cow, dog] }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Was fängt so an wie Maus?"
                say: "Maus. Was fängt so an wie Maus?"
                show: { object: mouse }
                options: [{ object: house }, { object: moon }, { object: nose }]
                answer: moon
              - id: l1-n5
                type: image_multiple_choice
                text: "Was fängt mit t an?"
                say: "Was fängt mit t an? Tippe auf das Bild."
                options: [{ object: fir-tree }, { object: rose }, { object: bell }]
                answer: fir-tree

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Hörst du am Anfang sss?"
            say: "Sonne. Hörst du am Anfang ein sss?"
            show: { object: sun }
            answer: true
          - id: l1-c2
            type: image_multiple_choice
            text: "Was fängt mit b an?"
            say: "Was fängt mit b an? Tippe auf das Bild."
            options: [{ object: cat }, { object: bread }, { object: egg }]
            answer: bread
          - id: l1-c3
            type: true_false
            text: "Fangen sie gleich an?"
            say: "Hase, Hand. Fangen beide gleich an?"
            show: { objects: [rabbit, hand] }
            answer: true
          - id: l1-c4
            type: true_false
            text: "Hörst du am Anfang mmm?"
            say: "Messer. Hörst du am Anfang ein mmm?"
            show: { object: knife }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Was fängt mit lll an?"
            say: "Was fängt mit lll an? Tippe auf das Bild."
            options: [{ object: bed }, { object: ladder }, { object: cow }]
            answer: ladder
          - id: l1-c6
            type: true_false
            text: "Hörst du am Anfang sss?"
            say: "Schaf. Hörst du am Anfang ein sss?"
            show: { object: sheep }
            answer: false

  - n: 2
    title: { de: Gleicher Anfang, en: The same start }
    goal:
      de: "Find Wörter, die gleich anfangen, wie Sonne und Socke. Welches Wort fängt anders an?"
      en: "Find words that start the same, like Sonne and Socke. Which word starts differently?"
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Hörst du am Anfang mmm?"
            say: "Mond. Hörst du am Anfang ein mmm?"
            show: { object: moon }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was fängt mit fff an?"
            say: "Was fängt mit fff an? Tippe auf das Bild."
            options: [{ object: fish }, { object: house }, { object: ball }]
            answer: fish
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: "Sonne und Socke fangen gleich an: sss. Sie gehören zusammen."
            show: { objects: [sun, sock] }
          - say: "Ball und Banane fangen gleich an: b. Sie gehören auch zusammen."
            show: { objects: [ball, banana] }
          - say: "Ball und Hund fangen nicht gleich an. Ball fängt mit b an, Hund mit h."
            show: { objects: [ball, dog] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was fängt gleich an?"
                say: "Tippe auf ein Bild und dann auf das Bild, das gleich anfängt."
                pairs:
                  - left: { object: sun }
                    right: { object: sock }
                  - left: { object: fish }
                    right: { object: frog }
                  - left: { object: ball }
                    right: { object: banana }
                hints:
                  - "Tippe auf die Bilder und hör auf den ersten Laut."
                  - "Sonne fängt mit sss an. Welches Wort auch?"
                  - "Sonne, Socke. Fisch, Frosch. Ball, Banane."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Welches Wort fängt anders an?"
                say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
                options: [{ object: mouse }, { object: moon }, { object: house }]
                answer: house
                hints:
                  - "Hör bei jedem Wort auf den ersten Laut."
                  - "Maus und Mond fangen mit mmm an."
                  - "Haus fängt anders an, mit h."
              - id: l2-f3
                type: sorting
                text: "Sortiere nach dem ersten Laut."
                say: "Fängt das Wort an wie Sonne oder wie Ball? Sortiere die Bilder."
                bins:
                  - { id: s, show: { object: sun } }
                  - { id: b, show: { object: ball } }
                options:
                  - { object: sock, bin: s }
                  - { object: banana, bin: b }
                  - { object: boat, bin: b }
                hints:
                  - "Tippe auf jedes Bild und hör auf den Anfang."
                  - "Socke fängt mit sss an wie Sonne."
                  - "Banane und Boot fangen mit b an wie Ball."
              - id: l2-f4
                type: true_false
                text: "Fangen sie gleich an?"
                say: "Schuh, Sonne. Fangen beide gleich an?"
                show: { objects: [shoe, sun] }
                answer: false
                hints:
                  - "Hör genau: Schuh, Sonne."
                  - "Schuh fängt mit sch an, Sonne mit sss."
                  - "Nein, sie fangen nicht gleich an."
              - id: l2-f5
                type: matching
                text: "Was fängt gleich an?"
                say: "Tippe auf ein Bild und dann auf das Bild, das gleich anfängt."
                pairs:
                  - left: { object: house }
                    right: { object: rabbit }
                  - left: { object: lamp }
                    right: { object: lion }
                  - left: { object: table }
                    right: { object: telephone }
                hints:
                  - "Hör auf den ersten Laut."
                  - "Haus fängt mit h an. Welches Tier auch?"
                  - "Haus, Hase. Lampe, Löwe. Tisch, Telefon."
              - id: l2-f6
                type: image_multiple_choice
                text: "Welches Wort fängt anders an?"
                say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
                options: [{ object: cow }, { object: cat }, { object: dog }]
                answer: dog
                hints:
                  - "Hör auf den ersten Laut."
                  - "Kuh und Katze fangen mit k an."
                  - "Hund fängt anders an."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was fängt gleich an?"
                say: "Tippe auf ein Bild und dann auf das Bild, das gleich anfängt."
                pairs:
                  - left: { object: moon }
                    right: { object: mouth }
                  - left: { object: shoe }
                    right: { object: pig }
                  - left: { object: apple }
                    right: { object: monkey }
                hints: ["Hör nur auf den ersten Laut."]
              - id: l2-s2
                type: sorting
                text: "Sortiere nach dem ersten Laut."
                say: "Fängt das Wort an wie Ball oder wie Hund? Sortiere die Bilder."
                bins:
                  - { id: b, show: { object: ball } }
                  - { id: h, show: { object: dog } }
                options:
                  - { object: bread, bin: b }
                  - { object: hand, bin: h }
                  - { object: boat, bin: b }
                  - { object: trousers, bin: h }
                hints: ["Tippe auf jedes Bild und hör auf den Anfang."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welches Wort fängt anders an?"
                say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
                options: [{ object: sock }, { object: snail }, { object: sun }]
                answer: snail
                hints: ["Hör genau auf sss und sch."]
              - id: l2-s4
                type: true_false
                text: "Fangen sie gleich an?"
                say: "Tanne, Tonne. Fangen beide gleich an?"
                show: { objects: [fir-tree, bin] }
                answer: true
                hints: ["Hör nur auf den Anfang."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Was fängt so an wie Kuh?"
                say: "Kuh. Was fängt so an wie Kuh?"
                show: { object: cow }
                options: [{ object: jug }, { object: shoe }, { object: egg }]
                answer: jug
                hints: ["Kuh fängt mit k an."]
              - id: l2-s6
                type: image_multiple_choice
                text: "Welches Wort fängt anders an?"
                say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
                options: [{ object: rose }, { object: lamp }, { object: ladder }]
                answer: rose
                hints: ["Lampe und Leiter fangen mit lll an."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Was fängt gleich an?"
                say: "Tippe auf ein Bild und dann auf das Bild, das gleich anfängt."
                pairs:
                  - left: { object: banana }
                    right: { object: tree }
                  - left: { object: sun }
                    right: { object: sock }
                  - left: { object: rabbit }
                    right: { object: hand }
              - id: l2-n2
                type: sorting
                text: "Sortiere nach dem ersten Laut."
                say: "Fängt das Wort an wie Maus oder wie Schuh? Sortiere die Bilder."
                bins:
                  - { id: m, show: { object: mouse } }
                  - { id: sch, show: { object: shoe } }
                options:
                  - { object: moon, bin: m }
                  - { object: snail, bin: sch }
                  - { object: carrot, bin: m }
                  - { object: pig, bin: sch }
              - id: l2-n3
                type: image_multiple_choice
                text: "Welches Wort fängt anders an?"
                say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
                options: [{ object: fish }, { object: frog }, { object: bell }]
                answer: bell
              - id: l2-n4
                type: true_false
                text: "Fangen sie gleich an?"
                say: "Igel, Elefant. Fangen beide gleich an?"
                show: { objects: [hedgehog, elephant] }
                answer: false
              - id: l2-n5
                type: image_multiple_choice
                text: "Was fängt so an wie Apfel?"
                say: "Apfel. Was fängt so an wie Apfel?"
                show: { object: apple }
                options: [{ object: ear }, { object: anchor }, { object: oven }]
                answer: anchor

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: hear-sound
            type: true_false
            text: "Hörst du am Anfang fff?"
            say: "Frosch. Hörst du am Anfang ein fff?"
            show: { object: frog }
            answer: true
          - id: l2-c2
            part: hear-sound
            type: image_multiple_choice
            text: "Was fängt mit mmm an?"
            say: "Was fängt mit mmm an? Tippe auf das Bild."
            options: [{ object: nose }, { object: mouth }, { object: hand }]
            answer: mouth
          - id: l2-c3
            part: odd-one-out
            type: image_multiple_choice
            text: "Welches Wort fängt anders an?"
            say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
            options: [{ object: boat }, { object: bread }, { object: sun }]
            answer: sun
          - id: l2-c4
            part: same-start
            type: true_false
            text: "Fangen sie gleich an?"
            say: "Socke, Schuh. Fangen beide gleich an?"
            show: { objects: [sock, shoe] }
            answer: false
          - id: l2-c5
            part: same-start
            type: image_multiple_choice
            text: "Was fängt so an wie Hund?"
            say: "Hund. Was fängt so an wie Hund?"
            show: { object: dog }
            options: [{ object: cow }, { object: rabbit }, { object: fish }]
            answer: rabbit
          - id: l2-c6
            part: hear-sound
            type: true_false
            text: "Hörst du am Anfang lll?"
            say: "Löwe. Hörst du am Anfang ein lll?"
            show: { object: lion }
            answer: true
          - id: l2-c7
            part: hear-sound
            type: true_false
            text: "Hörst du am Anfang mmm?"
            say: "Nase. Hörst du am Anfang ein mmm?"
            show: { object: nose }
            answer: false
          - id: l2-c8
            part: hear-sound
            type: image_multiple_choice
            text: "Was fängt mit sch an?"
            say: "Was fängt mit sch an? Tippe auf das Bild."
            options: [{ object: sun }, { object: snake }, { object: sock }]
            answer: snake
          - id: l2-c9
            part: hear-sound
            type: image_multiple_choice
            text: "Was fängt mit a an?"
            say: "Was fängt mit a an? Tippe auf das Bild."
            options: [{ object: ear }, { object: hedgehog }, { object: ant }]
            answer: ant
          - id: l2-c10
            part: hear-sound
            type: true_false
            text: "Hörst du am Anfang t?"
            say: "Tomate. Hörst du am Anfang ein t?"
            show: { object: tomato }
            answer: true
          - id: l2-c11
            part: same-start
            type: image_multiple_choice
            text: "Was fängt so an wie Fisch?"
            say: "Fisch. Was fängt so an wie Fisch?"
            show: { object: fish }
            options: [{ object: table }, { object: foot }, { object: sock }]
            answer: foot
          - id: l2-c12
            part: same-start
            type: matching
            text: "Welche Bilder fangen gleich an? Verbinde sie."
            say: "Tippe auf ein Bild und dann auf das Bild mit dem gleichen ersten Laut."
            pairs:
              - left: { object: moon }
                right: { object: milk }
              - left: { object: bed }
                right: { object: bus }
              - left: { object: rose }
                right: { object: ring }
          - id: l2-c13
            part: same-start
            type: sorting
            text: "Wie Sonne oder wie Schuh? Sortiere die Bilder."
            say: "Fängt das Wort an wie Sonne oder wie Schuh? Sortiere die Bilder."
            bins:
              - { id: s, show: { object: sun } }
              - { id: sch, show: { object: shoe } }
            options:
              - { object: sofa, bin: s }
              - { object: snake, bin: sch }
              - { object: saw, bin: s }
              - { object: ship, bin: sch }
          - id: l2-c14
            part: same-start
            type: true_false
            text: "Fangen sie gleich an?"
            say: "Ziege, Zebra. Fangen beide gleich an?"
            show: { objects: [goat, zebra] }
            answer: true
          - id: l2-c15
            part: same-start
            type: true_false
            text: "Fangen sie gleich an?"
            say: "Mond, Nase. Fangen beide gleich an?"
            show: { objects: [moon, nose] }
            answer: false
          - id: l2-c16
            part: odd-one-out
            type: image_multiple_choice
            text: "Welches Wort fängt anders an?"
            say: "Zwei Wörter fangen gleich an, eins nicht. Welches fängt anders an?"
            options: [{ object: bus }, { object: pig }, { object: bed }]
            answer: pig
          - id: l2-c17
