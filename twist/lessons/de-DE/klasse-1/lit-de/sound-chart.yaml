# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.sound-chart
skill: lit-de.letters.sound-chart
curriculum: de-DE
language: de
title:
  de: Die Anlauttabelle
  en: The sound chart
summary: >
  Using an Anlauttabelle before the letters are taught one by one. Each
  field of the chart is a letter with a picture whose word starts with
  that letter's sound (M wie Maus). Lesson 1: hear a sound or a word,
  find the chart picture that starts the same, and with it the letter;
  keep the sound apart from the letter name (Elefant does not start with
  L) and from sounds later in the word. Lesson 2 goes through a whole
  short word sound by sound (Hut: H wie Hund, U wie Uhr, T wie Tisch),
  puts the chart pictures in order and ends with the skill check. The
  Learn screens show a small chart (sound-chart, six fields) with the
  field being talked about marked, and Oma as the three fields O, M, A.
  Tasks that ask for a sound's field show a short chart of four fields
  with every option on it and nothing marked, so the child has to find
  the field; l1-s1 shows one letter as a gap with two options that are
  not on the chart. Pictures are always named, so each field's word
  starts with exactly its sound (no Ohr for O, no Elefant for L).
  Sorting bins and options also carry fields, and tapping one says it
  ("M wie Maus").
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.phonological.initial-sound]
  also_practises: [lit-de.phonological.initial-sound, lit-de.phonological.sounds-in-words]
  vocabulary: { de: [Anlauttabelle, Anlaut, Laut, Buchstabe, Bild] }
  forms: [audio, picture, drawn]
  drawn: [sound-chart]
  sounds: ["de.m", "de.l", "de.f", "de.n", "de.a:", "de.s", "de.o:"]
  facets: []
  parts:
    - { id: sound, what: { de: zu einem Laut das Bild und den Buchstaben in der Anlauttabelle finden, en: finding the picture and the letter for a sound on the sound chart } }
    - { id: word-start, what: { de: "den ersten Laut eines Wortes in der Tabelle finden, nicht den Buchstabennamen", en: "finding the first sound of a word on the chart, not the letter name" } }
    - { id: whole-word, what: { de: ein kurzes Wort Laut für Laut mit der Tabelle aufschreiben, en: going through a short word sound by sound with the chart } }
  misconceptions:
    - id: letter-name
      what: Goes by the letter name instead of the sound, so Elefant seems to start with L (El) and Esel with S
      addressed: lesson 1 Learn says the chart gives the sound, not the name; l1-s3 asks whether Elefant starts with L, with hint; l1-n3 offers L wie Lampe for Elefant, and the skill check tasks l2-c3 (S and L for Esel) and l2-c13 (E wie Ente for Löwe)
    - id: sound-elsewhere
      what: Picks a picture that has the sound later in the word or rhymes with it (Affe for fff, Haus for Maus)
      addressed: l1-f1 offers a rhyme with feedback, l1-n1 offers Affe for fff; l1-f5 and l1-s4 offer fields for sounds in the middle or at the end, with feedback; l2-c8 offers Affe for fff
    - id: sch-as-s
      what: Takes S wie Sonne for words that start with sch (Schuh, Schere)
      addressed: l1-n5, l1-c2 and l2-c6 set Sonne against Schuh, l1-c4 Säge against Schere; the Learn of lesson 1 says to listen to the whole first sound
    - id: first-sound-only
      what: Looks up the first sound only and leaves out the sounds after it
      addressed: lesson 2 Learn goes through Oma sound by sound; every stage of lesson 2 orders the chart pictures for a whole word (l2-f1, l2-f4, l2-s1, l2-s5, l2-n1, l2-n5, l2-c4) and asks for the missing last field (l2-f3, l2-s3, l2-s4)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Bild und Buchstabe, en: Picture and letter }
    goal:
      de: "Find mit der Anlauttabelle den Buchstaben für einen Laut. Mond fängt an wie Maus, also brauchst du das M."
      en: "Use the sound chart to find the letter for a sound. Mond starts like Maus, so you need the M."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was fängt so an wie Sonne?"
            show: { object: sun }
            options: [{ object: sock }, { object: fish }, { object: ball }]
            answer: sock
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Fangen sie gleich an?"
            say: "Maus, Mond. Fangen die beiden Wörter gleich an?"
            show: { objects: [mouse, moon] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Die Anlauttabelle"
            say: "Das ist eine Anlauttabelle. Bei jedem Buchstaben steht ein Bild. Das Wort zum Bild fängt mit dem Laut an, den der Buchstabe macht."
            show: { drawn: sound-chart, letters: [m, a, l, s, o, f], pictures: { m: mouse, a: ant, l: lamp, s: sun, o: oven, f: fish }, columns: 3 }
          - text: "M wie Maus"
            say: "Schau auf das M. Dort ist eine Maus. Maus fängt mit mmm an. Also klingt das M so: mmm. Die Tabelle zeigt dir, wie ein Buchstabe klingt, nicht, wie er heißt."
            show: { drawn: sound-chart, letters: [m, a, l, s, o, f], pictures: { m: mouse, a: ant, l: lamp, s: sun, o: oven, f: fish }, mark: m, columns: 3 }
            sound: de.m
          - text: "Mond"
            say: "Du willst Mond schreiben. Sprich ganz langsam: Mmm ... ond. Der erste Laut ist mmm. Welches Bild fängt auch mit mmm an? Die Maus. Bei der Maus steht das M. Hör immer auf den ganzen ersten Laut."
            show: { object: moon }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Welches Bild fängt mit diesem Laut an?"
                say: "Hör gut zu. Welches Bild aus der Anlauttabelle fängt mit diesem Laut an?"
                audio: { sound: de.m }
                options: [{ object: house }, { object: mouse }, { object: fish }]
                answer: mouse
                feedback:
                  house: "Haus reimt sich auf Maus. Es fängt aber mit h an."
                  fish: "Fisch fängt mit fff an."
                hints:
                  - "Tippe auf jedes Bild und hör auf den Anfang."
                  - "Haus ... h. Maus ... mmm. Fisch ... fff."
                  - "Maus fängt mit mmm an."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Welches Bild fängt mit diesem Laut an?"
                say: "Hör gut zu. Welches Bild aus der Anlauttabelle fängt mit diesem Laut an?"
                audio: { sound: de.l }
                options: [{ object: nose }, { object: sun }, { object: lamp }]
                answer: lamp
                hints:
                  - "Tippe auf jedes Bild und hör auf den Anfang."
                  - "Nase ... nnn. Sonne ... sss. Lampe ... lll."
                  - "Lampe fängt mit lll an."
                difficulty: easy
              - id: l1-f3
                type: sorting
                text: "Wohin gehört das Bild?"
                say: "Tippe auf ein Bild und dann auf das Feld aus der Anlauttabelle, das genauso anfängt. Tippst du auf ein Feld, hörst du es."
                bins:
                  - { id: m, show: { text: "M" }, say: "M wie Maus" }
                  - { id: s, show: { text: "S" }, say: "S wie Sonne" }
                options:
                  - { object: moon, bin: m }
                  - { object: sock, bin: s }
                  - { object: mum, bin: m }
                  - { object: saw, bin: s }
                hints:
                  - "Tippe auf die Felder. M wie Maus, S wie Sonne."
                  - "Mond ... mmm wie Maus. Socke ... sss wie Sonne."
                  - "Mond und Mama gehören zum M. Socke und Säge gehören zum S."
              - id: l1-f4
                type: true_false
                text: "F wie Fisch. Fängt Frosch mit F an?"
                say: "In der Anlauttabelle steht F wie Fisch. Fängt Frosch auch mit F an?"
                show: { object: frog }
                answer: true
                hints:
                  - "Sprich beide Wörter langsam: Fisch, Frosch."
                  - "Fff ... isch. Fff ... rosch. Hörst du am Anfang das Gleiche?"
                  - "Ja, beide fangen mit fff an."
              - id: l1-f5
                type: multiple_choice
                text: "Du willst Ohr schreiben. Welches Feld hilft dir beim ersten Laut?"
                say: "Du willst Ohr schreiben. Welches Feld aus der Anlauttabelle hilft dir beim ersten Laut?"
                show: { object: ear }
                options: ["O wie Ofen", "U wie Uhr", "R wie Rose"]
                answer: "O wie Ofen"
                feedback:
                  "U wie Uhr": "Uhr klingt ähnlich wie Ohr. Am Anfang hörst du aber ein o."
                  "R wie Rose": "Das r schreibst du am Ende von Ohr, nicht am Anfang."
                hints:
                  - "Sprich ganz langsam: Ohr. Was hörst du zuerst?"
                  - "Ooo ... r. Welches Bild fängt auch mit o an?"
                  - "Ofen fängt mit o an. O wie Ofen."
              - id: l1-f6
                type: audio_choice
                text: "Welches Bild fängt so an wie das Wort?"
                say: "Hör das Wort. Welches Bild aus der Anlauttabelle fängt genauso an?"
                audio: { de: "Nudel." }
                options: [{ object: rose }, { object: nose }, { object: sun }]
                answer: nose
                hints:
                  - "Sprich das Wort nach: Nudel. Was hörst du zuerst?"
                  - "Nnn ... udel. Welches Bild fängt auch mit nnn an?"
                  - "Nase fängt mit nnn an, genau wie Nudel."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Buchstabe fehlt beim Fisch?"
                say: "In der Anlauttabelle fehlt ein Buchstabe. Welcher Buchstabe gehört zum Fisch?"
                show: { drawn: sound-chart, letters: [m, s, f, l], pictures: { m: mouse, s: sun, f: fish, l: lamp }, gaps: [f], columns: 4 }
                options: ["F", "W", "H"]
                answer: "F"
                option_audio: false
                hints: ["Sprich langsam: Fff ... isch. Welchen Laut hörst du zuerst?"]
              - id: l1-s2
                type: sorting
                text: "Wohin gehört das Bild?"
                say: "Tippe auf ein Bild und dann auf das Feld aus der Anlauttabelle, das genauso anfängt."
                bins:
                  - { id: f, show: { text: "F" }, say: "F wie Fisch" }
                  - { id: l, show: { text: "L" }, say: "L wie Lampe" }
                options:
                  - { object: frog, bin: f }
                  - { object: ladder, bin: l }
                  - { object: foot, bin: f }
                  - { object: lion, bin: l }
                hints: ["Hör bei jedem Bild auf den ersten Laut: fff oder lll?"]
              - id: l1-s3
                type: true_false
                text: "L wie Lampe. Fängt Elefant mit L an?"
                say: "In der Anlauttabelle steht L wie Lampe. Fängt Elefant mit L an?"
                show: { object: elephant }
                answer: false
                hints: ["Sprich langsam: E ... le ... fant. Hörst du zuerst lll oder e?"]
              - id: l1-s4
                type: multiple_choice
                text: "Du willst Kuh schreiben. Welches Feld hilft dir beim ersten Laut?"
                say: "Du willst Kuh schreiben. Welches Feld aus der Anlauttabelle hilft dir beim ersten Laut?"
                show: { drawn: sound-chart, letters: [u, k, h, m], pictures: { u: clock, k: cat, h: dog, m: mouse }, columns: 4 }
                options: ["U wie Uhr", "K wie Katze", "H wie Hund"]
                answer: "K wie Katze"
                feedback:
                  "U wie Uhr": "Das u hörst du am Ende. Am Anfang hörst du k."
                hints: ["Sprich langsam: K ... uh. Was hörst du ganz am Anfang?"]
              - id: l1-s5
                type: audio_choice
                text: "Welches Bild fängt so an wie das Wort?"
                say: "Hör das Wort. Welches Bild aus der Anlauttabelle fängt genauso an?"
                audio: { de: "Rakete." }
                options: [{ object: nose }, { object: ladder }, { object: rose }]
                answer: rose
                hints: ["Rrr ... akete. Welches Bild fängt auch mit rrr an?"]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Welches Bild fängt mit diesem Laut an?"
                say: "Hör gut zu. Welches Bild aus der Anlauttabelle fängt mit diesem Laut an?"
                audio: { sound: de.f }
                options: [{ object: monkey }, { object: fish }, { object: sun }]
                answer: fish
              - id: l1-n2
                type: sorting
                text: "Wohin gehört das Bild?"
                say: "Tippe auf ein Bild und dann auf das Feld aus der Anlauttabelle, das genauso anfängt."
                bins:
                  - { id: r, show: { text: "R" }, say: "R wie Rose" }
                  - { id: t, show: { text: "T" }, say: "T wie Tisch" }
                options:
                  - { object: rain, bin: r }
                  - { object: fir-tree, bin: t }
                  - { object: skirt, bin: r }
                  - { object: cup, bin: t }
              - id: l1-n3
                type: multiple_choice
                text: "Du willst Elefant schreiben. Welches Feld hilft dir beim ersten Laut?"
                say: "Du willst Elefant schreiben. Welches Feld aus der Anlauttabelle hilft dir beim ersten Laut?"
                show: { drawn: sound-chart, letters: [l, e, a, m], pictures: { l: lamp, e: duck, a: ant, m: mouse }, columns: 4 }
                options: ["L wie Lampe", "E wie Ente", "A wie Ameise"]
                answer: "E wie Ente"
              - id: l1-n4
                type: multiple_choice
                text: "Du willst Wolke schreiben. Welches Feld hilft dir beim ersten Laut?"
                say: "Du willst Wolke schreiben. Welches Feld aus der Anlauttabelle hilft dir beim ersten Laut?"
                show: { object: cloud }
                options: ["O wie Ofen", "W wie Wal", "K wie Katze"]
                answer: "W wie Wal"
              - id: l1-n5
                type: audio_choice
                text: "Welches Bild fängt so an wie das Wort?"
                say: "Hör das Wort. Welches Bild aus der Anlauttabelle fängt genauso an?"
                audio: { de: "Sofa." }
                show: { object: sofa }
                options: [{ object: shoe }, { object: sun }, { object: fish }]
                answer: sun

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welches Bild fängt mit diesem Laut an?"
            say: "Hör gut zu. Welches Bild aus der Anlauttabelle fängt mit diesem Laut an?"
            audio: { sound: de.m }
            options: [{ object: fish }, { object: nose }, { object: mouse }]
            answer: mouse
          - id: l1-c2
            type: true_false
            text: "S wie Sonne. Fängt Schuh so an wie Sonne?"
            say: "In der Anlauttabelle steht S wie Sonne. Fängt Schuh auch so an wie Sonne?"
            show: { object: shoe }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Du willst Hut schreiben. Welches Feld hilft dir beim ersten Laut?"
            say: "Du willst Hut schreiben. Welches Feld aus der Anlauttabelle hilft dir beim ersten Laut?"
            show: { object: hat }
            options: ["U wie Uhr", "T wie Tisch", "H wie Hund"]
            answer: "H wie Hund"
          - id: l1-c4
            type: audio_choice
            text: "Welches Bild fängt mit diesem Laut an?"
            say: "Hör gut zu. Welches Bild fängt mit diesem Laut an?"
            audio: { sound: de.s }
            options: [{ object: scissors }, { object: saw }, { object: fish }]
            answer: saw
          - id: l1-c5
            type: multiple_choice
            text: "Du willst Tomate schreiben. Welches Feld hilft dir beim ersten Laut?"
            say: "Du willst Tomate schreiben. Welches Feld aus der Anlauttabelle hilft dir beim ersten Laut?"
            show: { object: tomato }
            options: ["O wie Ofen", "T wie Tisch", "M wie Maus"]
            answer: "T wie Tisch"
          - id: l1-c6
            type: true_false
            text: "F wie Fisch. Fängt Fuchs mit F an?"
            say: "In der Anlauttabelle steht F wie Fisch. Fängt Fuchs auch mit F an?"
            show: { object: fox }
            answer: true

  - n: 2
    title: { de: Laut für Laut, en: Sound by sound }
    goal:
      de: "Schreib ein ganzes Wort mit der Anlauttabelle. Für Oma suchst du Ofen, Maus und Ameise."
      en: "Write a whole word with the sound chart. For Oma you look for Ofen, Maus and Ameise."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welches Bild fängt mit diesem Laut an?"
            say: "Hör gut zu. Welches Bild aus der Anlauttabelle fängt mit diesem Laut an?"
            audio: { sound: "de.a:" }
            options: [{ object: ant }, { object: oven }, { object: clock }]
            answer: ant
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "M wie Maus. Fängt Mond mit M an?"
            say: "In der Anlauttabelle steht M wie Maus. Fängt Mond auch mit M an?"
            show: { object: moon }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Oma: O ... m ... a"
            say: "Mit der Anlauttabelle kannst du ein ganzes Wort schreiben. Sprich das Wort ganz langsam: Oma. O ... m ... a. Für jeden Laut suchst du ein Bild."
            show: { object: grandma }
          - text: "O wie Ofen, M wie Maus, A wie Ameise"
            say: "O wie Ofen. M wie Maus. A wie Ameise. Bei den Bildern stehen O, M und A. Also schreibst du: Oma."
            show: { drawn: sound-chart, letters: [o, m, a], pictures: { o: oven, m: mouse, a: ant }, columns: 3 }
          - text: "Hör bis zum Ende."
            say: "Hör auf jeden Laut, nicht nur auf den ersten. Schreib die Buchstaben in der Reihenfolge, in der du sie hörst. Sprich das Wort danach noch einmal: Fehlt noch ein Laut?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Hut: Bring die Bilder in die richtige Reihenfolge."
                say: "Sprich langsam: Hut. Such für jeden Laut das Bild aus der Anlauttabelle. Bring die Bilder in die richtige Reihenfolge."
                options: [{ object: clock }, { object: table }, { object: dog }]
                slot_count: 3
                answer: [dog, clock, table]
                hints:
                  - "Sprich ganz langsam: H ... u ... t."
                  - "Zuerst hörst du h wie Hund. Dann kommt u wie Uhr."
                  - "Hund, Uhr, Tisch."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Welches Bild brauchst du für den letzten Laut?"
                say: "Hör das Wort. Welches Bild aus der Anlauttabelle brauchst du für den letzten Laut?"
                audio: { de: "Ton." }
                options: [{ object: table }, { object: oven }, { object: nose }]
                answer: nose
                feedback:
                  table: "Tisch brauchst du für den ersten Laut. Hör bis zum Ende."
                hints:
                  - "Sprich das Wort langsam bis zum Ende: Ton."
                  - "T ... o ... nnn. Was hörst du ganz am Ende?"
                  - "Am Ende hörst du nnn wie Nase."
              - id: l2-f3
                type: multiple_choice
                text: "Nase: N wie Nase, A wie Ameise, S wie Sonne ... Welches Feld fehlt noch?"
                say: "Du schreibst Nase. N wie Nase, A wie Ameise, S wie Sonne. Sprich das Wort bis zum Ende. Welches Feld fehlt noch?"
                show: { object: nose }
                options: ["E wie Ente", "O wie Ofen", "I wie Igel"]
                answer: "E wie Ente"
                hints:
                  - "Sprich langsam: Na ... se."
                  - "Nach dem sss kommt noch ein Laut. Hör genau hin."
                  - "Am Ende hörst du ein e wie bei Ente."
              - id: l2-f4
                type: ordering
                text: "Limo: Bring die Bilder in die richtige Reihenfolge."
                say: "Sprich langsam: Limo. Such für jeden Laut das Bild aus der Anlauttabelle. Bring die Bilder in die richtige Reihenfolge."
                options: [{ object: mouse }, { object: oven }, { object: lamp }, { object: hedgehog }]
                slot_count: 4
                answer: [lamp, hedgehog, mouse, oven]
                hints:
                  - "Sprich ganz langsam: L ... i ... m ... o."
                  - "Zuerst lll wie Lampe, dann i wie Igel."
                  - "Lampe, Igel, Maus, Ofen."
              - id: l2-f5
                type: true_false
                text: "Lisa will Sofa schreiben. Sie nimmt: S wie Sonne, O wie Ofen, F wie Fisch, A wie Ameise. Stimmt das?"
                say: "Lisa will Sofa schreiben. Sie nimmt: S wie Sonne, O wie Ofen, F wie Fisch, A wie Ameise. Stimmt das?"
                answer: true
                hints:
                  - "Sprich langsam: S ... o ... f ... a."
                  - "Hat Lisa für jeden Laut ein Bild? Sind sie in der richtigen Reihenfolge?"
                  - "Ja, das stimmt. Lisa hat alle vier Laute."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Mus: Bring die Bilder in die richtige Reihenfolge."
                say: "Sprich langsam: Mus. Such für jeden Laut das Bild aus der Anlauttabelle. Bring die Bilder in die richtige Reihenfolge."
                options: [{ object: sun }, { object: mouse }, { object: clock }]
                slot_count: 3
                answer: [mouse, clock, sun]
                hints: ["Mmm ... u ... sss. Was hörst du zuerst?"]
              - id: l2-s2
                type: audio_choice
                text: "Welches Bild brauchst du für den Laut in der Mitte?"
                say: "Hör das Wort. Welches Bild aus der Anlauttabelle brauchst du für den Laut in der Mitte?"
                audio: { de: "Mut." }
                options: [{ object: oven }, { object: clock }, { object: ant }]
                answer: clock
                hints: ["Mmm ... u ... t. Was hörst du zwischen mmm und t?"]
              - id: l2-s3
                type: multiple_choice
                text: "Ofen: O wie Ofen, F wie Fisch, E wie Ente ... Welches Feld fehlt noch?"
                say: "Du schreibst Ofen. O wie Ofen, F wie Fisch, E wie Ente. Sprich das Wort bis zum Ende. Welches Feld fehlt noch?"
                show: { object: oven }
                options: ["M wie Maus", "N wie Nase", "L wie Lampe"]
                answer: "N wie Nase"
                hints: ["O ... fe ... nnn. Was hörst du ganz am Ende?"]
              - id: l2-s4
                type: true_false
                text: "Tim will Rose schreiben. Er nimmt: R wie Rose, O wie Ofen, S wie Sonne. Stimmt das?"
                say: "Tim will Rose schreiben. Er nimmt: R wie Rose, O wie Ofen, S wie Sonne. Stimmt das?"
                answer: false
                hints: ["Sprich bis zum Ende: Ro ... se. Hat Tim den letzten Laut?"]
              - id: l2-s5
                type: ordering
                text: "Ast: Bring die Bilder in die richtige Reihenfolge."
                say: "Sprich langsam: Ast. Such für jeden Laut das Bild aus der Anlauttabelle. Bring die Bilder in die richtige Reihenfolge."
                options: [{ object: sun }, { object: table }, { object: ant }]
                slot_count: 3
                answer: [ant, sun, table]
                hints: ["A ... sss ... t."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Sofa: Bring die Bilder in die richtige Reihenfolge."
