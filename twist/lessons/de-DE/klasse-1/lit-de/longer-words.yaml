# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.longer-words
skill: lit-de.decoding.longer-words
curriculum: de-DE
language: de
title:
  de: Lange Wörter lesen
  en: Reading long words
summary: >
  Children read long words by splitting them into syllables first:
  Ba-na-ne, Kro-ko-dil, Schmet-ter-ling. Syllable arcs show the split while
  it is new; later the word stands on a plain card and the child finds the
  syllables alone. Lesson 1 reads words of three open syllables (Banane,
  Tomate, Telefon); lesson 2 reads harder long words with sch, ei and
  consonant clusters (Elefant, Ameise, Schmetterling) and ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Silben lesen, en: Reading syllables }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.two-syllable-words, lit-de.letters.g-au-sch-z]
  also_practises: [lit-de.phonological.syllables]
  vocabulary: { de: [Silbe, Silbenbogen, lang, gliedern] }
  forms: [audio, drawn, picture]
  drawn: [syllable-arcs, word-card, dots]
  facets: []
  parts:
    - { id: read-word, what: { de: ein langes Wort lesen und verstehen, en: reading a long word and understanding it } }
    - { id: syllables, what: { de: ein langes Wort in Silben gliedern, en: splitting a long word into syllables } }
    - { id: heard-word, what: { de: ein gehörtes Wort unter ähnlichen Wörtern finden, en: finding a heard word among similar words } }
  misconceptions:
    - id: stops-after-two
      what: Reads two syllables and guesses the end of the word (Tele... becomes Telefant)
      addressed: "options share their first syllables (Tomate, Telefon, Teller; Pullover, Pudel, Polizist); hints say every arc to the last one"
    - id: wrong-split
      what: Splits a long word in the wrong places and cannot hear the word (Ban-an-e)
      addressed: "Learn splits each word with arcs; ordering tasks put the syllable cards back together; counting tasks (l1-f4, l2-s3) ask how many syllables"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Drei Bögen, en: Three arcs }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Sonne", syllables: ["Son", "ne"] }
            options: [{ object: sun }, { object: bin }]
            answer: sun
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Bau das Wort."
            say: "Tasse. Leg die Silben der Reihe nach."
            show: { object: cup }
            options: ["se", "Tas"]
            slot_count: 2
            answer: ["Tas", "se"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ba na ne"
            say: "Ein langes Wort liest du in Silben. Drei Bögen: Ba ... na ... ne. Banane."
            show: { drawn: syllable-arcs, word: "Banane", syllables: ["Ba", "na", "ne"] }
          - text: "Banane"
            say: "Erst Bogen für Bogen, dann das ganze Wort, ohne Pause: Banane."
            show: { object: banana }
          - text: "Te le fon"
            say: "Noch eins: Te ... le ... fon. Telefon. Lies immer bis zum letzten Bogen."
            show: { drawn: syllable-arcs, word: "Telefon", syllables: ["Te", "le", "fon"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Banane", syllables: ["Ba", "na", "ne"] }
                options: [{ object: pineapple }, { object: banana }, { object: apple }]
                answer: banana
                feedback:
                  pineapple: "Ananas hat auch drei Silben und viele a. Lies den ersten Bogen: Ba. Ba ... na ... ne."
                hints:
                  - "Lies Bogen für Bogen."
                  - "Ba ... na ... ne."
                  - "Banane."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Bau das Wort."
                say: "Banane. Leg die Silben in die richtige Reihenfolge."
                show: { object: banana }
                options: ["ne", "Ba", "na"]
                slot_count: 3
                answer: ["Ba", "na", "ne"]
                hints:
                  - "Sprich das Wort langsam und klatsch dabei."
                  - "Ba ... na ... ne. Welche Silbe kommt zuerst?"
                  - "Ba, na, ne."
              - id: l1-f3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Lineal." }
                options: ["Lineal", "Limonade", "Linie"]
                answer: "Lineal"
                hints:
                  - "Lies jedes Wort Bogen für Bogen."
                  - "Hör auf das Ende. Das Wort hört mit al auf."
                  - "Lineal."
              - id: l1-f4
                type: image_multiple_choice
                text: "Wie viele Silben hat das Wort?"
                say: "Lies das Wort. Wie viele Silben hat es?"
                show: { drawn: word-card, text: "Ananas" }
                options:
                  - { drawn: dots, count: 2, layout: row }
                  - { drawn: dots, count: 3, layout: row }
                  - { drawn: dots, count: 4, layout: row }
                answer: "3"
                hints:
                  - "Lies das Wort und klatsch bei jeder Silbe."
                  - "A ... na ... nas."
                  - "Drei Silben."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Silbe fehlt?"
                say: "Telefon. Welche Silbe fehlt?"
                show: { object: telephone }
                frame: "Te_fon"
                options: ["le", "la", "ne"]
                answer: ["le"]
                hints:
                  - "Sprich das Wort langsam: Te ... le ... fon."
                  - "Die mittlere Silbe fängt mit lll an."
                  - "Es fehlt le."

