# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.feelings
skill: lit-de.speaking.feelings
curriculum: de-DE
language: de
title:
  de: Gefühle benennen
  en: Naming feelings
summary: >
  Naming five feelings (fröhlich, traurig, wütend, ängstlich, müde) and
  saying how you or someone in a story feels. Lesson 1 learns the words
  with faces, matches face and word, and finds the feeling that fits a
  short scene; lesson 2 says it in a sentence with ich bin and weil,
  uses a more exact word than schlecht, says anger in words instead of
  hitting, follows a feeling that changes in a story, and ends with the
  skill check. Speak tasks let the child say how someone feels and
  compare with the model; they are practice only.
metadata:
  year: klasse-1
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: [lit-de.texts-media.listen-stories]
  vocabulary: { de: [Gefühl, fröhlich, traurig, wütend, ängstlich, Angst haben, müde, weil] }
  forms: [picture, audio, text]
  drawn: []
  facets: []
  parts:
    - { id: name, what: { de: ein Gefühl am Gesicht erkennen und benennen, en: recognising and naming a feeling from a face } }
    - { id: in-a-story, what: { de: "sagen, wie sich jemand in einer kurzen Geschichte fühlt", en: saying how someone in a short story feels } }
    - { id: say-it, what: { de: "mit einem genauen Wort und mit weil sagen, wie es mir geht", en: "saying how I feel with an exact word and with weil" } }
  misconceptions:
    - id: gut-schlecht
      what: Says only gut or schlecht instead of naming the feeling
      addressed: "lesson 2 Learn turns mir geht es schlecht into traurig, wütend or ängstlich; \"Welches Wort sagt genauer, wie es ... geht?\" in the full and some stages of lesson 2 (l2-f3 with feedback, l2-s3) and in l2-c4"
    - id: own-feeling
      what: Gives the feeling the child expects (rain is sad) instead of the one the scene or story shows, or keeps the feeling from the start of a story
      addressed: "l1-n3 (Paul is happy about the rain); stories where the feeling changes ask for the end (l2-f5 with feedback on the first feeling, l2-n4, l2-c5)"
    - id: act-not-say
      what: Shows anger by hitting or shouting instead of saying what is wrong
      addressed: "lesson 2 Learn says ich bin wütend, weil ...; l2-f4 (with feedback on hitting) and l2-n3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie fühlt sich das Kind?", en: "How does the child feel?" }
    goal:
      de: "Schau dir Gesichter genau an und sag, wie sich ein Kind fühlt. Wer gähnt, ist müde."
      en: "Look closely at faces and say how a child feels. Someone who yawns is tired."
    new_content: true
    activities:
      - activity: learn
        mode: new-word
        screens:
          - text: "fröhlich · traurig"
            say: "Gefühle haben Namen. Dieses Kind lacht, der Mund geht nach oben. Es ist fröhlich. Das andere Kind hat eine Träne im Auge. Es ist traurig."
            show: { objects: [happy, sad] }
          - text: "wütend · ängstlich"
            say: "Dieses Kind zieht die Augenbrauen zusammen und hat rote Backen. Es ist wütend. Das andere Kind macht große Augen und hält die Hände an die Backen. Es hat Angst. Es ist ängstlich."
            show: { objects: [angry, scared] }
          - text: "müde"
            say: "Dieses Kind gähnt. Die Augen fallen ihm fast zu. Es ist müde. Schau dir bei anderen das Gesicht an. Und hör gut zu, was passiert ist. Dann weißt du, wie es ihnen geht."
            show: { object: tired }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Welches Kind ist das?"
                say: "Hör gut zu. Welches Kind ist das?"
                audio: { de: "traurig" }
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: sad
                hints:
                  - "Schau dir die Gesichter genau an."
                  - "Wer traurig ist, lacht nicht. Manchmal kommt eine Träne."
                  - "Tippe auf das Kind mit der Träne."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo ist das wütende Kind?"
                say: "Wo ist das wütende Kind?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
                option_audio: false
                feedback:
                  tired: "Dieses Kind gähnt. Es ist müde. Wer wütend ist, zieht die Augenbrauen zusammen."
                hints:
                  - "Wie sieht ein Gesicht aus, wenn jemand wütend ist?"
                  - "Die Augenbrauen gehen nach unten, die Backen werden rot."
                  - "Tippe auf das Kind mit den roten Backen."
              - id: l1-f3
                type: image_multiple_choice
                text: "Lina hat Geburtstag. Sie bekommt ein neues Fahrrad.\n\nWie fühlt sich Lina?"
                say: "Lina hat Geburtstag. Sie bekommt ein neues Fahrrad. Wie fühlt sich Lina?"
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: happy
                hints:
                  - "Wie fühlst du dich, wenn du etwas Schönes bekommst?"
                  - "Lina freut sich."
                  - "Lina ist fröhlich."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf ein Gesicht und dann auf das Wort, das dazu passt."
                option_audio: false
                pairs:
                  - left: { object: happy }
                    right: { text: "fröhlich", say: "fröhlich" }
                  - left: { object: angry }
                    right: { text: "wütend", say: "wütend" }
                  - left: { object: tired }
                    right: { text: "müde", say: "müde" }
                hints:
                  - "Tippe auf die Wörter und hör sie dir an."
                  - "Welches Kind lacht? Das ist fröhlich."
                  - "Wer lacht, ist fröhlich. Wer rote Backen hat, ist wütend. Wer gähnt, ist müde."
              - id: l1-f5
                type: true_false
                text: "Ist das Kind müde?"
                say: "Schau dir das Kind genau an. Ist das Kind müde?"
                show: { object: scared }
                answer: false
                hints:
                  - "Gähnt das Kind?"
                  - "Es macht große Augen und hält die Hände an die Backen."
                  - "Das Kind hat Angst. Nein, es ist nicht müde."
              - id: l1-f6
                type: image_multiple_choice
                text: "Es ist schon spät am Abend. Emil gähnt und reibt sich die Augen.\n\nWie fühlt sich Emil?"
                say: "Es ist schon spät am Abend. Emil gähnt und reibt sich die Augen. Wie fühlt sich Emil?"
                options: [{ object: tired }, { object: sad }, { object: happy }]
                answer: tired
                hints:
                  - "Was macht Emil?"
                  - "Er gähnt. Wann gähnst du?"
                  - "Emil ist müde."

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Welches Kind ist das?"
                say: "Hör gut zu. Welches Kind ist das?"
                audio: { de: "wütend" }
                options: [{ object: angry }, { object: scared }, { object: sad }]
                answer: angry
                hints: ["Wer wütend ist, zieht die Augenbrauen zusammen."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo ist das ängstliche Kind?"
                say: "Wo ist das ängstliche Kind?"
                options: [{ object: scared }, { object: tired }, { object: happy }]
                answer: scared
                option_audio: false
                hints: ["Wer Angst hat, macht große Augen."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Tom hat sein Kuscheltier verloren. Er sucht und sucht, aber er findet es nicht.\n\nWie fühlt sich Tom?"
                say: "Tom hat sein Kuscheltier verloren. Er sucht und sucht, aber er findet es nicht. Wie fühlt sich Tom?"
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad
                hints: ["Wie fühlst du dich, wenn etwas Liebes weg ist?"]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf ein Gesicht und dann auf das Wort, das dazu passt."
                option_audio: false
                pairs:
                  - left: { object: sad }
                    right: { text: "traurig", say: "traurig" }
                  - left: { object: scared }
                    right: { text: "ängstlich", say: "ängstlich" }
                  - left: { object: tired }
                    right: { text: "müde", say: "müde" }
                hints: ["Schau auf die Augen: Träne, große Augen oder fast zu?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Draußen kracht ein lauter Donner. Mila zieht schnell die Decke über den Kopf.\n\nWie fühlt sich Mila?"
                say: "Draußen kracht ein lauter Donner. Mila zieht schnell die Decke über den Kopf. Wie fühlt sich Mila?"
                options: [{ object: scared }, { object: angry }, { object: happy }]
                answer: scared
                hints: ["Warum versteckt sich Mila unter der Decke?"]
              - id: l1-s6
                type: speak
                text: "Wie fühlt sich das Kind?"
                say: "Schau dir das Kind an. Sag, wie es sich fühlt: Das Kind ist fröhlich."
                show: { object: happy }
                expected_text: "Das Kind ist fröhlich."
                hints: ["Fang so an: Das Kind ist ..."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Welches Kind ist das?"
                say: "Hör gut zu. Welches Kind ist das?"
                audio: { de: "müde" }
                options: [{ object: tired }, { object: sad }, { object: angry }]
                answer: tired
              - id: l1-n2
                type: image_multiple_choice
                text: "Jemand hat Ellas Turm aus Bausteinen umgeworfen. Ella stampft mit dem Fuß auf.\n\nWie fühlt sich Ella?"
                say: "Jemand hat Ellas Turm aus Bausteinen umgeworfen. Ella stampft mit dem Fuß auf. Wie fühlt sich Ella?"
                options: [{ object: angry }, { object: tired }, { object: happy }]
                answer: angry
              - id: l1-n3
                type: image_multiple_choice
                text: "Draußen regnet es. Endlich kann Paul seine neuen Gummistiefel anziehen. Er springt in jede Pfütze.\n\nWie fühlt sich Paul?"
                say: "Draußen regnet es. Endlich kann Paul seine neuen Gummistiefel anziehen. Er springt in jede Pfütze. Wie fühlt sich Paul?"
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: happy
              - id: l1-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Tippe auf ein Gesicht und dann auf das Wort, das dazu passt."
                option_audio: false
                pairs:
                  - left: { object: happy }
                    right: { text: "fröhlich", say: "fröhlich" }
                  - left: { object: sad }
                    right: { text: "traurig", say: "traurig" }
                  - left: { object: angry }
                    right: { text: "wütend", say: "wütend" }
                  - left: { object: scared }
                    right: { text: "ängstlich", say: "ängstlich" }
              - id: l1-n5
                type: speak
                text: "Wie fühlt sich das Kind?"
                say: "Schau dir das Kind an. Sag, wie es sich fühlt."
                show: { object: sad }
                expected_text: "Das Kind ist traurig."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welches Kind ist das?"
            say: "Hör gut zu. Welches Kind ist das?"
            audio: { de: "ängstlich" }
            options: [{ object: scared }, { object: happy }, { object: tired }]
            answer: scared
          - id: l1-c2
            type: image_multiple_choice
            text: "Oma kommt zu Besuch. Jana rennt zur Tür und springt ihr in die Arme.\n\nWie fühlt sich Jana?"
            say: "Oma kommt zu Besuch. Jana rennt zur Tür und springt ihr in die Arme. Wie fühlt sich Jana?"
            options: [{ object: happy }, { object: angry }, { object: sad }]
            answer: happy
          - id: l1-c3
            type: image_multiple_choice
            text: "Wo ist das müde Kind?"
            say: "Wo ist das müde Kind?"
            options: [{ object: tired }, { object: scared }, { object: sad }]
            answer: tired
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Ist das Kind traurig?"
            say: "Schau dir das Kind genau an. Ist das Kind traurig?"
            show: { object: tired }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Bens Katze ist krank. Ben sitzt neben ihr und weint.\n\nWie fühlt sich Ben?"
            say: "Bens Katze ist krank. Ben sitzt neben ihr und weint. Wie fühlt sich Ben?"
            options: [{ object: sad }, { object: happy }, { object: tired }]
            answer: sad
          - id: l1-c6
            type: audio_choice
            text: "Welches Kind ist das?"
            say: "Hör gut zu. Welches Kind ist das?"
            audio: { de: "wütend" }
            options: [{ object: tired }, { object: angry }, { object: happy }]
            answer: angry

  - n: 2
    title: { de: "Sag, wie es dir geht", en: "Say how you feel" }
    goal:
      de: "Sag in einem Satz, wie es dir geht und warum. Ich bin traurig, weil mein Luftballon geplatzt ist."
      en: "Say in a sentence how you feel and why. I am sad because my balloon popped."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welches Kind ist das?"
            say: "Hör gut zu. Welches Kind ist das?"
            audio: { de: "fröhlich" }
            options: [{ object: happy }, { object: angry }, { object: tired }]
            answer: happy
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Max hat Bauchweh. Er kann heute nicht zum Fußball.\n\nWie fühlt sich Max?"
            say: "Max hat Bauchweh. Er kann heute nicht zum Fußball. Wie fühlt sich Max?"
            options: [{ object: sad }, { object: happy }, { object: scared }]
            answer: sad
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ich bin traurig."
            say: "Du kannst sagen, wie es dir geht. Fang mit ich bin an: Ich bin traurig. Ich bin fröhlich. Ich bin müde."
            show: { object: sad }
          - text: "Ich bin traurig, weil mein Luftballon geplatzt ist."
            say: "Mit weil sagst du auch, warum. Ich bin traurig, weil mein Luftballon geplatzt ist. Jetzt wissen die anderen, was los ist."
            show: { object: balloon }
          - text: "Mir geht es schlecht.\ntraurig? wütend? ängstlich?"
            say: "Mir geht es schlecht. Das sagt nicht viel. Sag genauer, wie du dich fühlst. Bist du traurig, wütend oder ängstlich? Auch bei Figuren in Geschichten fragst du: Wie geht es ihr? Und woran merke ich das?"
          - text: "Ich bin wütend, weil ..."
            say: "Auch wenn du wütend bist, kannst du es sagen: Ich bin wütend, weil du meinen Turm umgeworfen hast. Das ist besser als schreien oder hauen."
            show: { object: angry }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Kind an. Welcher Satz passt zum Bild?"
                show: { object: angry }
                options: ["Ich bin wütend.", "Ich bin müde.", "Ich bin fröhlich."]
                answer: "Ich bin wütend."
                hints:
                  - "Schau auf die Augenbrauen und die Backen."
                  - "Das Kind hat rote Backen und schaut böse."
                  - "Ich bin wütend."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Was passt?"
                say: "Was passt? Ich bin traurig, weil ..."
                frame: "Ich bin traurig, weil _ ."
                options: ["mein Luftballon geplatzt ist", "heute mein Geburtstag ist", "die Sonne scheint"]
                answer: ["mein Luftballon geplatzt ist"]
                hints:
                  - "Was macht dich traurig?"
                  - "Geburtstag und Sonne sind schön. Was ist nicht schön?"
                  - "weil mein Luftballon geplatzt ist."
              - id: l2-f3
                type: multiple_choice
                text: "Ben sagt: „Mir geht es schlecht.“ Sein Hund ist weggelaufen.\n\nWelches Wort sagt genauer, wie es Ben geht?"
                say: "Ben sagt: Mir geht es schlecht. Sein Hund ist weggelaufen. Welches Wort sagt genauer, wie es Ben geht?"
                options: ["traurig", "müde", "fröhlich"]
                answer: "traurig"
                feedback:
                  "müde": "Müde bist du, wenn du schlafen willst. Wie fühlt sich Ben, weil sein Hund weg ist?"
                hints:
                  - "Was ist mit Bens Hund passiert?"
                  - "Sein Hund ist weg. Wie fühlst du dich, wenn dein Tier weg ist?"
                  - "Ben ist traurig."
              - id: l2-f4
                type: multiple_choice
                text: "Kai hat dein Bild zerrissen. Du bist wütend. Was machst du?"
                say: "Kai hat dein Bild zerrissen. Du bist wütend. Was machst du?"
                options: ["Ich sage: Ich bin wütend, weil du mein Bild zerrissen hast.", "Ich haue Kai.", "Ich zerreiße auch sein Bild."]
                answer: "Ich sage: Ich bin wütend, weil du mein Bild zerrissen hast."
                feedback:
                  "Ich haue Kai.": "Hauen tut weh, und Kai weiß dann immer noch nicht, was los ist. Sag es mit Worten."
                hints:
                  - "Wut darfst du zeigen. Aber mit Worten, nicht mit den Händen."
                  - "Welcher Satz fängt mit ich bin wütend an?"
                  - "Ich sage: Ich bin wütend, weil du mein Bild zerrissen hast."
              - id: l2-f5
                type: image_multiple_choice
                text: "Ronja sitzt allein auf der Bank. Niemand spielt mit ihr. Da kommt Aylin und fragt: „Spielst du mit?“\n\nWie fühlt sich Ronja am Ende?"
                say: "Hör gut zu. Ronja sitzt allein auf der Bank. Niemand spielt mit ihr. Da kommt Aylin und fragt: Spielst du mit? Wie fühlt sich Ronja am Ende?"
                options: [{ object: happy }, { object: sad }, { object: angry }]
                answer: happy
                feedback:
                  sad: "Am Anfang ist Ronja traurig. Aber wie geht es ihr, als Aylin kommt?"
                hints:
                  - "Hör auf das Ende der Geschichte."
                  - "Aylin fragt: Spielst du mit? Wie fühlt sich Ronja jetzt?"
                  - "Ronja freut sich. Sie ist fröhlich."
              - id: l2-f6
                type: speak
                text: "Du bist gestern spät ins Bett gegangen. Sag, wie es dir geht."
                say: "Du bist gestern spät ins Bett gegangen. Sag, wie es dir geht. Sprich nach: Ich bin müde, weil ich spät ins Bett gegangen bin."
                show: { object: tired }
                expected_text: "Ich bin müde, weil ich spät ins Bett gegangen bin."
                hints:
                  - "Fang mit ich bin an."
                  - "Sag dann mit weil, warum."
                  - "Ich bin müde, weil ich spät ins Bett gegangen bin."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Kind an. Welcher Satz passt zum Bild?"
                show: { object: scared }
                options: ["Ich habe Angst.", "Ich bin wütend.", "Ich bin fröhlich."]
                answer: "Ich habe Angst."
                hints: ["Das Kind macht große Augen und hält die Hände an die Backen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Was passt?"
                say: "Was passt? Ich bin wütend, weil ..."
                frame: "Ich bin wütend, weil _ ."
                options: ["mein Bruder meinen Turm umgeworfen hat", "ich ein Geschenk bekommen habe", "ich gut geschlafen habe"]
                answer: ["mein Bruder meinen Turm umgeworfen hat"]
                hints: ["Was macht dich wütend?"]
              - id: l2-s3
                type: multiple_choice
                text: "Lina sagt: „Mir geht es nicht gut.“ Draußen ist es dunkel, und sie hört ein komisches Geräusch.\n\nWelches Wort sagt genauer, wie es Lina geht?"
                say: "Lina sagt: Mir geht es nicht gut. Draußen ist es dunkel, und sie hört ein komisches Geräusch. Welches Wort sagt genauer, wie es Lina geht?"
                options: ["ängstlich", "müde", "fröhlich"]
                answer: "ängstlich"
                hints: ["Wie fühlst du dich im Dunkeln bei einem komischen Geräusch?"]
              - id: l2-s4
                type: multiple_choice
                text: "Dein Freund weint. Was kannst du ihn fragen?"
                options: ["Warum bist du traurig?", "Warum lachst du?", "Warum bist du so fröhlich?"]
                answer: "Warum bist du traurig?"
                hints: ["Wer weint, ist meistens ..."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Opa und Jonas gehen durch den Wald. Plötzlich knackt es laut im Gebüsch. Jonas hält sich an Opa fest.\n\nWie fühlt sich Jonas?"
                say: "Opa und Jonas gehen durch den Wald. Plötzlich knackt es laut im Gebüsch. Jonas hält sich an Opa fest. Wie fühlt sich Jonas?"
                options: [{ object: scared }, { object: happy }, { object: tired }]
                answer: scared
                hints: ["Warum hält sich Jonas an Opa fest?"]
              - id: l2-s6
                type: speak
                text: "Die Sonne scheint, und du gehst raus zum Spielen. Sag, wie es dir geht."
                say: "Die Sonne scheint, und du gehst raus zum Spielen. Sprich nach: Ich bin fröhlich, weil die Sonne scheint."
                show: { object: happy }
                expected_text: "Ich bin fröhlich, weil die Sonne scheint."
                hints: ["Fang mit ich bin an und sag mit weil, warum."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Schau dir das Kind an. Welcher Satz passt zum Bild?"
                show: { object: sad }
                options: ["Ich bin traurig.", "Ich bin müde.", "Ich bin wütend."]
                answer: "Ich bin traurig."
              - id: l2-n2
                type: fill_in_blank
                text: "Was passt?"
                say: "Was passt? Ich bin müde, weil ..."
                frame: "Ich bin müde, weil _ ."
                options: ["ich den ganzen Tag gespielt habe", "ich heute Geburtstag habe", "mein Ball weg ist"]
                answer: ["ich den ganzen Tag gespielt habe"]
              - id: l2-n3
                type: multiple_choice
                text: "Du sitzt auf der Schaukel. Mara schubst dich einfach runter und setzt sich drauf.\n\nWas sagst du?"
                say: "Du sitzt auf der Schaukel. Mara schubst dich einfach runter und setzt sich drauf. Was sagst du?"
                options: ["Ich bin wütend, weil ich zuerst dran war.", "Du bist doof!", "Ich schubse dich auch!"]
                answer: "Ich bin wütend, weil ich zuerst dran war."
              - id: l2-n4
                type: image_multiple_choice
                text: "Malte will seinen Drachen steigen lassen. Aber es weht kein Wind. Malte ist traurig. Dann kommt ein kräftiger Wind, und der Drachen fliegt hoch in den Himmel.\n\nWie fühlt sich Malte am Ende?"
                say: "Hör gut zu. Malte will seinen Drachen steigen lassen. Aber es weht kein Wind. Malte ist traurig. Dann kommt ein kräftiger Wind, und der Drachen fliegt hoch in den Himmel. Wie fühlt sich Malte am Ende?"
                options: [{ object: happy }, { object: sad }, { object: tired }]
                answer: happy
