          - id: l1-c5
            type: fill_in_blank
            text: "Groß oder klein?"
            say: "Papa liest ein Buch. Welcher Buchstabe passt?"
            frame: "Papa liest ein _uch."
            options: ["B", "b"]
            option_audio: false
            answer: ["B"]
          - id: l1-c6
            type: highlight_in_text
            text: "Welche Wörter schreibt man groß? Tippe darauf."
            say: "Hier sind die Nomen klein geschrieben. Tippe auf die Wörter, die groß sein müssen."
            show: { drawn: letter-card, text: "Das kind isst einen apfel." }
