              - id: l2-n2
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Das Auto ist Rot.", "das Auto ist rot.", "Das Auto ist rot."]
                option_audio: false
                answer: "Das Auto ist rot."
              - id: l2-n3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies die zwei Sätze. Sind sie richtig geschrieben?"
