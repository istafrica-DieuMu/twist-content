            answer: "kissen"
          - id: l1-c3
            type: fill_in_blank
            text: "Groß oder klein?"
            say: "Ida malt ein Bild. Welcher Buchstabe passt?"
            frame: "Ida _alt ein Bild."
            options: ["M", "m"]
            option_audio: false
            answer: ["m"]
          - id: l1-c4
            type: true_false
