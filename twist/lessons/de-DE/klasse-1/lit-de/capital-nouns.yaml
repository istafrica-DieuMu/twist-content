# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.capital-nouns
skill: lit-de.spelling.capital-nouns
curriculum: de-DE
language: de
title:
  de: "Groß oder klein?"
  en: "Capital or small letter?"
summary: >
  Children write Nomen and the first word of a sentence with a capital
  letter. Lesson 1 finds the Nomen inside sentences with the Begleiter
  test (can der, die or das go in front?) and picks the capital or small
  first letter for a word in a sentence. Lesson 2 adds the start of a
  sentence: the first word is always written big, also after a Punkt,
  even when it is not a Nomen; it finds every word that needs a capital in
  a sentence written all small, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Groß- und Kleinschreibung, en: Capital letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.nouns.recognise]
  also_practises: [lit-de.nouns.recognise, lit-de.nouns.articles]
  vocabulary: { de: [Nomen, großschreiben, kleinschreiben, Satzanfang, Begleiter, Punkt] }
  forms: [drawn, audio, picture]
  drawn: [letter-card, word-card]
  sounds: []
  facets: []
  parts:
    - { id: noun, what: { de: Nomen im Satz großschreiben, en: writing nouns in a sentence with a capital } }
    - { id: sentence-start, what: { de: "das erste Wort im Satz großschreiben, auch nach einem Punkt", en: "writing the first word of a sentence with a capital, also after a full stop" } }
    - { id: whole-sentence, what: { de: "einen ganzen Satz prüfen: Satzanfang und Nomen", en: "checking a whole sentence: its start and its nouns" } }
  misconceptions:
    - id: big-words-big
      what: Writes words big because they feel important or describe something big (Groß, Laut, Rennen), not because they are Nomen
      addressed: "lesson 1 Learn uses the Begleiter test; l1-f2, l1-s2 and l2-c5 set a verb or an adjective next to a Nomen, with feedback on l1-f2"
    - id: start-only
      what: Writes only the first word of a sentence big and the Nomen inside it small
      addressed: "l1-f1, l1-s1 and l1-n3 start with a capital already given and ask for the Nomen inside the sentence"
    - id: start-word-is-noun
      what: Thinks the first word is big because it is a Nomen, so writes der, ich or heute big inside a sentence too
      addressed: "lesson 2 Learn shows Der at the start and der inside the same sentence; l2-f2 and l2-s4 ask about the same word at the start and inside, with hints on l2-f2"
    - id: no-capital-after-full-stop
      what: Goes on small after a Punkt, because the new sentence is on the same line
      addressed: "lesson 2 Learn and l2-f4, l2-s3 and l2-c3 have two sentences on one line"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Nomen im Satz schreibt man groß, en: Nouns in a sentence take a capital }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wo ist ein Tier?"
            say: "Wo ist ein Tier?"
            options: [{ object: ruler }, { object: zebra }, { object: cake }]
            answer: zebra
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie schreibt man das Nomen?"
            say: "Wie schreibt man das Nomen Kuchen?"
            show: { object: cake }
            options: ["Kuchen", "kuchen"]
            option_audio: false
            answer: "Kuchen"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der Hut  die Hand  das Bett"
            say: "Nomen schreibst du groß. So findest du sie: Kannst du der, die oder das davor sagen? Der Hut, die Hand, das Bett. Ja. Also sind es Nomen."
            show: { drawn: word-card, text: "der Hut  die Hand  das Bett" }
          - text: "der laut?  die schnell?"
            say: "Der laut? Die schnell? Das klingt falsch. Laut und schnell sind keine Nomen. Auch Wörter, die sagen, was jemand tut, sind keine Nomen: rennen, lachen. Du schreibst sie klein."
            show: { drawn: word-card, text: "laut  schnell  rennen  lachen" }
          - text: "Der Bär brummt laut."
            say: "Im Satz probierst du es Wort für Wort. Der Bär: ja, Nomen, groß. Brummt und laut: nein, klein."
            show: { drawn: letter-card, text: "Der Bär brummt laut." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Welche Wörter schreibt man groß? Tippe darauf."
                say: "Hier sind die Nomen klein geschrieben. Tippe auf die Wörter, die groß sein müssen."
                show: { drawn: letter-card, text: "Der hund holt den ball." }
                spans: ["hund", "ball."]
                hints:
                  - "Mach mit jedem Wort die Probe: Passt der, die oder das davor?"
                  - "Der Hund? Das passt. Holt sagt, was jemand tut. Das ist kein Nomen."
                  - "Hund und Ball sind Nomen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["groß", "fenster", "laufen"]
                option_audio: false
                answer: "fenster"
                feedback:
                  groß: "Ein Elefant ist groß, aber groß ist kein Nomen. Der groß? Das passt nicht."
                  laufen: "Laufen sagt, was jemand tut. Es ist kein Nomen."
                hints:
                  - "Sag der, die oder das vor jedes Wort."
                  - "Das Fenster. Klingt das richtig?"
                  - "Fenster ist ein Nomen. Du schreibst es groß."
              - id: l1-f3
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Lena hat eine Puppe. Welcher Buchstabe passt?"
                frame: "Lena hat eine _uppe."
                options: ["P", "p"]
                option_audio: false
                answer: ["P"]
                hints:
                  - "Ist Puppe ein Nomen?"
                  - "Die Puppe. Das passt."
                  - "Puppe ist ein Nomen: großes P."
              - id: l1-f4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: word-card, text: "Die Kuh frisst Gras." }
                answer: true
                hints:
                  - "Prüf jedes Wort: Nomen groß, die anderen klein."
                  - "Kuh und Gras sind Nomen. Frisst ist kein Nomen."
                  - "Ja, alles richtig."
              - id: l1-f5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Die Ente schwimmt. Welcher Buchstabe passt?"
                frame: "Die Ente _chwimmt."
                options: ["S", "s"]
                option_audio: false
                answer: ["s"]
                hints:
                  - "Mach die Probe: der Schwimmt, die Schwimmt, das Schwimmt? Das klingt falsch."
                  - "Schwimmt ist etwas, das die Ente tut. Kein Nomen."
                  - "Kleines s."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Welche Wörter schreibt man groß? Tippe darauf."
                say: "Tippe auf die Wörter, die groß sein müssen."
                show: { drawn: letter-card, text: "Opa liest die zeitung im garten." }
                spans: ["zeitung", "garten."]
                hints: ["Die Zeitung? Der Garten? Mach die Probe."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["laut", "springen", "glocke"]
                option_audio: false
                answer: "glocke"
                hints: ["Vor welches Wort passt die?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Tim isst eine Banane. Welcher Buchstabe passt?"
                frame: "Tim isst eine _anane."
                options: ["B", "b"]
                option_audio: false
                answer: ["B"]
                hints: ["Die Banane. Ist das ein Nomen?"]
              - id: l1-s4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: word-card, text: "Der Igel Schläft im Laub." }
                answer: false
                hints: ["Prüf jedes große Wort. Schläft sagt, was der Igel tut. Ist das ein Nomen?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Der Wind ist kalt. Welcher Buchstabe passt?"
                frame: "Der Wind ist _alt."
                options: ["K", "k"]
                option_audio: false
                answer: ["k"]
                hints: ["Der kalt? Die kalt? Passt das?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["nass", "wolke", "lachen"]
                option_audio: false
                answer: "wolke"
              - id: l1-n2
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Mama kauft Milch. Welcher Buchstabe passt?"
                frame: "Mama kauft _ilch."
                options: ["M", "m"]
                option_audio: false
                answer: ["M"]
              - id: l1-n3
                type: highlight_in_text
                text: "Welche Wörter schreibt man groß? Tippe darauf."
                say: "Tippe auf die Wörter, die groß sein müssen."
                show: { drawn: letter-card, text: "Ein vogel sitzt auf dem baum." }
                spans: ["vogel", "baum."]
              - id: l1-n4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: word-card, text: "Ben hat einen roten ball." }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Die Sonne scheint hell. Welcher Buchstabe passt?"
                frame: "Die Sonne scheint _ell."
                options: ["H", "h"]
                option_audio: false
                answer: ["h"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Welche Wörter schreibt man groß? Tippe darauf."
            say: "Tippe auf die Wörter, die groß sein müssen."
            show: { drawn: letter-card, text: "Die katze trinkt milch." }
            spans: ["katze", "milch."]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort schreibt man groß?"
            say: "Welches Wort schreibt man groß?"
            options: ["müde", "kissen", "schlafen"]
