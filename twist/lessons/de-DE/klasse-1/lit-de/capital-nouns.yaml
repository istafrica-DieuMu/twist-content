              - id: l2-f2
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies den Satz. Ist er richtig geschrieben?"
                show: { drawn: word-card, text: "Ich sehe Den Mond." }
                answer: false
                hints:
                  - "Prüf zwei Dinge: Ist der Anfang groß? Sind nur die Nomen groß?"
                  - "Den steht in der Mitte. Ist den ein Nomen?"
                  - "Nein. Den schreibt man hier klein: Ich sehe den Mond."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["wir spielen Fußball.", "Wir spielen Fußball.", "Wir spielen fußball."]
                option_audio: false
                answer: "Wir spielen Fußball."
                feedback:
                  "wir spielen Fußball.": "Das erste Wort im Satz schreibst du groß."
                  "Wir spielen fußball.": "Der Fußball. Das ist ein Nomen, also groß."
                hints:
                  - "Prüf den Satzanfang und dann die Nomen."
                  - "Wir steht am Anfang. Fußball ist ein Nomen."
                  - "Wir spielen Fußball."
              - id: l2-f4
                type: highlight_in_text
                text: "Welches Wort schreibt man groß? Tippe darauf."
                say: "Lies die zwei Sätze. Ein Wort muss groß sein. Tippe darauf."
                show: { drawn: letter-card, text: "Ich bin müde. dann gehe ich ins Bett." }
                spans: ["dann"]
                hints:
                  - "Wo fängt ein neuer Satz an?"
                  - "Nach dem Punkt beginnt der zweite Satz."
                  - "Dann steht nach dem Punkt. Es muss groß sein."
              - id: l2-f5
                type: fill_in_blank
                text: "Groß oder klein?"
                say: "Am Morgen frühstückt Paul. Welcher Buchstabe passt?"
                frame: "_m Morgen frühstückt Paul."
                options: ["A", "a"]
                option_audio: false
                answer: ["A"]
                hints:
                  - "Wo steht das Wort?"
                  - "Es ist das erste Wort im Satz."
                  - "Am Satzanfang groß: Am."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Welche Wörter schreibt man groß? Tippe darauf."
                say: "Hier ist alles klein geschrieben. Tippe auf jedes Wort, das groß sein muss."
                show: { drawn: letter-card, text: "mein bruder hat ein fahrrad." }
                spans: ["mein", "bruder", "fahrrad."]
                hints: ["Ein Wort am Satzanfang und zwei Nomen."]
              - id: l2-s2
