            text: "Groß oder klein?"
            say: "Der Hase hoppelt. Welcher Buchstabe passt?"
            frame: "Der _ase hoppelt."
            options: ["H", "h"]
            option_audio: false
            answer: ["H"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Heute regnet es."
            say: "Das erste Wort in einem Satz schreibst du immer groß. Auch wenn es kein Nomen ist. Heute ist kein Nomen, aber es steht am Anfang."
            show: { drawn: letter-card, text: "Heute regnet es." }
          - text: "Der Ball rollt unter der Bank."
            say: "Schau: Der am Anfang ist groß. Das zweite der in der Mitte ist klein. Groß ist es nur, weil der Satz damit anfängt."
            show: { drawn: letter-card, text: "Der Ball rollt unter der Bank." }
          - text: "Ich male. Dann spiele ich."
            say: "Nach dem Punkt fängt ein neuer Satz an. Also schreibst du wieder groß: Dann."
            show: { drawn: letter-card, text: "Ich male. Dann spiele ich." }
          - text: "Satzanfang groß? Nomen groß?"
            say: "Prüf jeden Satz zweimal. Ist der Anfang groß? Sind alle Nomen groß?"
            show: { drawn: word-card, text: "Satzanfang groß? Nomen groß?" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Welche Wörter schreibt man groß? Tippe darauf."
                say: "Hier ist alles klein geschrieben. Tippe auf jedes Wort, das groß sein muss."
                show: { drawn: letter-card, text: "die katze schläft." }
                spans: ["die", "katze"]
                hints:
                  - "Denk an zwei Dinge: den Satzanfang und die Nomen."
