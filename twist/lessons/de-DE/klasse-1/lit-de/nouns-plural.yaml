# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.nouns-plural
skill: lit-de.nouns.plural
curriculum: de-DE
language: de
title:
  de: Einzahl und Mehrzahl
  en: Singular and plural
summary: >
  Children tell Einzahl from Mehrzahl and form the Mehrzahl of common
  nouns. Lesson 1 hears and sees one thing against many (der Hund, die
  Hunde), learns that the Begleiter in the Mehrzahl is always die, and
  that die alone does not make a Mehrzahl (die Katze is one cat). Lesson 2
  forms the Mehrzahl with the counting trick (ein Stern, zwei Sterne):
  endings e, en, n and er, the a that turns into ä (der Apfel, die Äpfel),
  and words that stay the same (der Löffel, die Löffel); it ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Nomen, en: Nouns }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.nouns.articles]
  also_practises: [lit-de.nouns.articles]
  vocabulary: { de: [Einzahl, Mehrzahl, Nomen, Begleiter, Umlaut] }
  forms: [picture, drawn, audio]
  drawn: [word-card, letter-card]
  sounds: []
  facets: []
  parts:
    - { id: tell, what: { de: Einzahl und Mehrzahl unterscheiden, en: telling singular from plural } }
    - { id: form, what: { de: die Mehrzahl eines Nomens bilden, en: forming the plural of a noun } }
    - { id: use, what: { de: die Mehrzahl im Satz und zum Wort finden, en: finding the plural in a sentence and for a word } }
  misconceptions:
    - id: die-means-many
      what: Takes every word with die as a Mehrzahl (die Katze, die Sonne)
      addressed: "lesson 1 Learn shows die Katze and die Katzen side by side; l1-f3, l1-s4 and l2-c2 ask about a die-word in the Einzahl, with hints on l1-f3"
    - id: s-for-all
      what: Adds s to every noun, as in a few loan words (die Autos), so writes Hunds or Bälls
      addressed: "lesson 2 Learn says the word decides and the counting trick finds it by ear; options in l2-f2 and l2-s2 offer an s form, with feedback on l2-f2"
    - id: forgets-umlaut
      what: Adds the ending but keeps the a (Apfel for Äpfel, Balle), or the u (Stuhle, Bucher, Hute)
      addressed: "lesson 2 Learn hears the a turn into ä; l2-f2, l2-f3, l2-s3, l2-n3 and l2-c4 offer the form without umlaut, with feedback on l2-f3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Eins oder viele?", en: "One or many?" }
    goal:
      de: "Hör und sieh, ob es eins ist oder viele. Der Hund ist einer, die Hunde sind viele."
      en: "Hear and see whether it is one or many. Der Hund is one, die Hunde are many."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "der, die oder das?"
            say: "Ei. Heißt es der, die oder das Ei?"
            show: { object: egg }
            options: ["der", "die", "das"]
            keep_order: true
            answer: "das"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "der, die oder das?"
            say: "Stuhl. Heißt es der, die oder das Stuhl?"
            show: { object: chair }
            options: ["der", "die", "das"]
            keep_order: true
            answer: "der"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der Hund"
            say: "Hier ist ein Hund. Der Hund. Nur einer: Das ist die Einzahl."
            show: { object: dog }
          - text: "die Hunde"
            say: "Hier sind drei Hunde. Die Hunde. Mehr als einer: Das ist die Mehrzahl. Das Wort ändert sich: Hund, Hunde."
            show: { object: dog, count: 3, layout: row }
          - text: "der Hund  die Hunde"
            say: "In der Mehrzahl ist der Begleiter immer die. Der Hund wird zu die Hunde. Das Ei wird zu die Eier."
            show: { drawn: word-card, text: "der Hund  die Hunde" }
          - text: "die Katze  die Katzen"
            say: "Aber pass auf: Die Katze ist nur eine Katze. Am Begleiter die allein erkennst du die Mehrzahl nicht. Schau auf das Wort: Katze oder Katzen?"
            show: { drawn: word-card, text: "die Katze  die Katzen" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "die Äpfel"
                say: "Hör zu: die Äpfel. Welches Bild passt?"
                options: [{ object: apple }, { object: apple, count: 3, layout: row }]
                option_audio: false
                answer: "3"
                hints:
                  - "Äpfel heißt: mehr als einer."
                  - "Ein Apfel ist die Einzahl. Äpfel ist die Mehrzahl."
                  - "Das Bild mit den drei Äpfeln."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "die Bälle: Einzahl oder Mehrzahl?"
                say: "Die Bälle. Ist das Einzahl oder Mehrzahl?"
                options: ["Einzahl", "Mehrzahl"]
                keep_order: true
                answer: "Mehrzahl"
                hints:
                  - "Ist es ein Ball oder sind es mehrere?"
                  - "Ein Ball, zwei Bälle."
                  - "Bälle ist die Mehrzahl."
              - id: l1-f3
                type: true_false
                text: "die Sonne: Ist das die Mehrzahl?"
                say: "Die Sonne. Ist das die Mehrzahl?"
                show: { object: sun }
                answer: false
                hints:
                  - "Wie viele Sonnen siehst du?"
                  - "Das Wort die steht auch vor Wörtern in der Einzahl: die Sonne, die Katze."
                  - "Nein. Die Sonne ist die Einzahl."
              - id: l1-f4
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde die Einzahl mit ihrer Mehrzahl."
                pairs:
                  - { left: { text: "der Ball" }, right: { text: "die Bälle" } }
                  - { left: { text: "das Ei" }, right: { text: "die Eier" } }
                  - { left: { text: "die Ente" }, right: { text: "die Enten" } }
                hints:
                  - "Sag: ein Ball, zwei ... Wie geht es weiter?"
                  - "Zwei Bälle, zwei Eier, zwei Enten."
                  - "Ball zu Bälle, Ei zu Eier, Ente zu Enten."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist die Mehrzahl von „der Fisch“?"
                say: "Der Fisch. Was ist die Mehrzahl?"
                show: { object: fish, count: 3, layout: row }
                options: ["die Fische", "der Fische", "die Fisch"]
                answer: "die Fische"
                feedback:
                  "der Fische": "In der Mehrzahl ist der Begleiter immer die."
                  "die Fisch": "Du hast nur den Begleiter geändert. In der Mehrzahl ändert sich auch das Wort."
                hints:
                  - "Sag: ein Fisch, zwei ..."
                  - "In der Mehrzahl ist der Begleiter die."
                  - "Die Fische."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "die Kinder: Einzahl oder Mehrzahl?"
                say: "Die Kinder. Ist das Einzahl oder Mehrzahl?"
                options: ["Einzahl", "Mehrzahl"]
                keep_order: true
                answer: "Mehrzahl"
                hints: ["Ein Kind, zwei Kinder."]
              - id: l1-s2
                type: image_multiple_choice
                text: "der Frosch"
                say: "Hör zu: der Frosch. Welches Bild passt?"
                options: [{ object: frog, count: 3, layout: row }, { object: frog }]
                option_audio: false
                answer: frog
                hints: ["Der Frosch ist die Einzahl: nur einer."]
              - id: l1-s3
                type: sorting
                text: "Einzahl oder Mehrzahl?"
                say: "Leg die Wörter zu Einzahl oder Mehrzahl."
                bins:
                  - { id: einzahl, show: { text: "Einzahl" }, say: "Einzahl" }
                  - { id: mehrzahl, show: { text: "Mehrzahl" }, say: "Mehrzahl" }
                options:
                  - { text: "der Hut", bin: einzahl }
                  - { text: "die Hüte", bin: mehrzahl }
                  - { text: "die Tasse", bin: einzahl }
                  - { text: "die Tassen", bin: mehrzahl }
                hints: ["Ist es eins oder sind es mehrere? Der Begleiter die allein verrät es nicht."]
              - id: l1-s4
                type: true_false
                text: "die Biene: Ist das die Mehrzahl?"
                say: "Die Biene. Ist das die Mehrzahl?"
                show: { object: bee }
                answer: false
                hints: ["Eine Biene oder viele Bienen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist die Mehrzahl von „das Schwein“?"
                say: "Das Schwein. Was ist die Mehrzahl?"
                show: { object: pig, count: 3, layout: row }
                options: ["das Schweine", "die Schweine", "die Schwein"]
                answer: "die Schweine"
                hints: ["Ein Schwein, zwei Schweine. Und der Begleiter?"]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "die Bananen"
                say: "Hör zu: die Bananen. Welches Bild passt?"
                options: [{ object: banana }, { object: banana, count: 3, layout: row }]
                option_audio: false
                answer: "3"
              - id: l1-n2
                type: multiple_choice
                text: "die Uhr: Einzahl oder Mehrzahl?"
                say: "Die Uhr. Ist das Einzahl oder Mehrzahl?"
                options: ["Einzahl", "Mehrzahl"]
                keep_order: true
                answer: "Einzahl"
              - id: l1-n3
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde die Einzahl mit ihrer Mehrzahl."
                pairs:
                  - { left: { text: "das Kind" }, right: { text: "die Kinder" } }
                  - { left: { text: "der Tisch" }, right: { text: "die Tische" } }
                  - { left: { text: "der Schuh" }, right: { text: "die Schuhe" } }
              - id: l1-n4
                type: true_false
                text: "die Ziegen: Ist das die Mehrzahl?"
                say: "Die Ziegen. Ist das die Mehrzahl?"
                show: { object: goat, count: 3, layout: row }
                answer: true
              - id: l1-n5
                type: sorting
                text: "Einzahl oder Mehrzahl?"
                say: "Leg die Wörter zu Einzahl oder Mehrzahl."
                bins:
                  - { id: einzahl, show: { text: "Einzahl" }, say: "Einzahl" }
                  - { id: mehrzahl, show: { text: "Mehrzahl" }, say: "Mehrzahl" }
                options:
                  - { text: "die Nase", bin: einzahl }
                  - { text: "die Betten", bin: mehrzahl }
                  - { text: "das Boot", bin: einzahl }
                  - { text: "die Sterne", bin: mehrzahl }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "die Autos: Einzahl oder Mehrzahl?"
            say: "Die Autos. Ist das Einzahl oder Mehrzahl?"
            options: ["Einzahl", "Mehrzahl"]
            keep_order: true
            answer: "Mehrzahl"
          - id: l1-c2
            type: true_false
            text: "die Rose: Ist das die Mehrzahl?"
            say: "Die Rose. Ist das die Mehrzahl?"
            show: { object: rose }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was ist die Mehrzahl von „der Stern“?"
            say: "Der Stern. Was ist die Mehrzahl?"
            show: { object: star, count: 3, layout: row }
            options: ["die Sterne", "der Sterne", "die Stern"]
            answer: "die Sterne"
          - id: l1-c4
            type: image_multiple_choice
            text: "die Schafe"
            say: "Hör zu: die Schafe. Welches Bild passt?"
            options: [{ object: sheep }, { object: sheep, count: 3, layout: row }]
            option_audio: false
            answer: "3"
          - id: l1-c5
            type: sorting
            text: "Einzahl oder Mehrzahl?"
            say: "Lies die Wörter. Ist es eins, oder sind es mehrere? Sortiere."
            bins:
              - { id: einzahl, show: { text: "Einzahl" }, say: "Einzahl" }
              - { id: mehrzahl, show: { text: "Mehrzahl" }, say: "Mehrzahl" }
            options:
              - { text: "die Mützen", bin: mehrzahl }
              - { text: "die Hose", bin: einzahl }
              - { text: "die Beine", bin: mehrzahl }
              - { text: "der Arm", bin: einzahl }
          - id: l1-c6
            type: multiple_choice
            text: "Was ist die Mehrzahl von „die Wolke“?"
            say: "Die Wolke. Was ist die Mehrzahl?"
            show: { object: cloud, count: 3, layout: row }
            options: ["die Wolke", "die Wolken", "der Wolken"]
            answer: "die Wolken"

  - n: 2
    title: { de: Die Mehrzahl bilden, en: Making the plural }
    goal:
      de: "Find die Mehrzahl, indem du zählst. Ein Stern, zwei Sterne, ein Apfel, zwei Äpfel."
      en: "Find the plural by counting. One Stern, two Sterne, one Apfel, two Äpfel."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "die Hüte: Einzahl oder Mehrzahl?"
            say: "Die Hüte. Ist das Einzahl oder Mehrzahl?"
            options: ["Einzahl", "Mehrzahl"]
            keep_order: true
            answer: "Mehrzahl"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "die Tasse: Ist das die Mehrzahl?"
            say: "Die Tasse. Ist das die Mehrzahl?"
            show: { object: cup }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ein Stern, zwei Sterne"
            say: "So findest du die Mehrzahl: Zähl einfach. Ein Stern, zwei Sterne. Was du bei zwei sagst, ist die Mehrzahl."
            show: { object: star, count: 2, layout: row }
          - text: "Sterne  Enten  Eier"
            say: "Am Ende kommt oft etwas dazu: ein e wie bei Sterne, ein n oder en wie bei Enten, oder er wie bei Eier. Welche Endung passt, hörst du beim Zählen."
            show: { drawn: word-card, text: "Sterne  Enten  Eier" }
          - text: "der Apfel  die Äpfel\nder Fuß  die Füße"
            say: "Manchmal wird aus dem a ein ä. Ein Apfel, zwei Äpfel. Hör genau: Apfel, Äpfel. Schreib dann die zwei Punkte auf das a. Genauso wird aus dem u manchmal ein ü: ein Fuß, zwei Füße."
            show: { object: apple, count: 2, layout: row }
          - text: "der Löffel  die Löffel"
            say: "Und manchmal bleibt das Wort gleich. Ein Löffel, zwei Löffel. Nur der Begleiter wird zu die."
            show: { object: spoon, count: 2, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Was kommt dazu?"
                say: "Ein Hund, zwei ... Was kommt am Ende dazu?"
                show: { object: dog, count: 2, layout: row }
                frame: "die Hund_"
                options: ["e", "en", "er"]
                answer: ["e"]
                hints:
                  - "Zähl: ein Hund, zwei ..."
                  - "Zwei Hunde. Was hörst du am Ende?"
                  - "Ein e: die Hunde."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ein Ball, zwei ..."
                say: "Ein Ball, zwei ... Wie heißt die Mehrzahl?"
                show: { object: ball, count: 2, layout: row }
                options: ["Balls", "Bälle", "Balle"]
                answer: "Bälle"
                feedback:
                  Balls: "Balls sagt man nicht. Zähl laut: ein Ball, zwei ... Bälle."
                  Balle: "Hör genau hin: Bälle. Aus dem a wird ein ä."
                hints:
                  - "Sag es laut: ein Ball, zwei ..."
                  - "Aus dem a wird ein ä, und am Ende kommt ein e."
                  - "Bälle."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Buch, zwei ..."
                say: "Ein Buch, zwei ... Wie heißt die Mehrzahl?"
                show: { object: book, count: 2, layout: row }
                options: ["Buchs", "Bücher", "Bucher"]
                answer: "Bücher"
                feedback:
                  Buchs: "Buchs sagt man nicht. Hör noch einmal: zwei Bücher. Am Ende hörst du er."
                  Bucher: "Fast. Hör genau: Bücher. Aus dem u wird ein ü."
                hints:
                  - "Zähl laut: ein Buch, zwei ..."
                  - "Am Ende hörst du er. Und aus dem u wird ein ü."
                  - "Bücher."
              - id: l2-f4
                type: fill_in_blank
                text: "Was kommt dazu?"
                say: "Eine Ente, zwei ... Was kommt am Ende dazu?"
                show: { object: duck, count: 2, layout: row }
                frame: "die Ente_"
                options: ["n", "e", "er"]
                answer: ["n"]
                hints:
                  - "Zähl: eine Ente, zwei ..."
                  - "Zwei Enten. Ente hat schon ein e am Ende."
                  - "Ein n: die Enten."
              - id: l2-f5
                type: multiple_choice
                text: "Ein Igel, zwei ..."
                say: "Ein Igel, zwei ... Wie heißt die Mehrzahl?"
                show: { object: hedgehog, count: 2, layout: row }
                options: ["Igel", "Igels", "Igele"]
                answer: "Igel"
                hints:
                  - "Zähl laut: ein Igel, zwei ..."
                  - "Manche Wörter bleiben gleich."
                  - "Zwei Igel. Das Wort bleibt gleich."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Was kommt dazu?"
                say: "Ein Bett, zwei ... Was kommt am Ende dazu?"
                show: { object: bed, count: 2, layout: row }
                frame: "die Bett_"
                options: ["e", "en", "er"]
                answer: ["en"]
                hints: ["Zähl: ein Bett, zwei Betten."]
              - id: l2-s2
                type: multiple_choice
                text: "Ein Schuh, zwei ..."
                say: "Ein Schuh, zwei ... Wie heißt die Mehrzahl?"
                show: { object: shoe, count: 2, layout: row }
                options: ["Schuhs", "Schuhe", "Schuher"]
                answer: "Schuhe"
                hints: ["Sag es laut: zwei ..."]
              - id: l2-s3
                type: multiple_choice
                text: "Ein Stuhl, zwei ..."
                say: "Ein Stuhl, zwei ... Wie heißt die Mehrzahl?"
                show: { object: chair, count: 2, layout: row }
                options: ["Stuhle", "Stühle", "Stühlen"]
                answer: "Stühle"
                hints: ["Hör genau: Aus dem u wird ein ü."]
              - id: l2-s4
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde die Einzahl mit ihrer Mehrzahl."
                pairs:
                  - { left: { text: "das Messer" }, right: { text: "die Messer" } }
                  - { left: { text: "das Bild" }, right: { text: "die Bilder" } }
                  - { left: { text: "die Rose" }, right: { text: "die Rosen" } }
                hints: ["Zähl jedes Wort: eins, zwei."]
              - id: l2-s5
                type: fill_in_blank
                text: "Was kommt dazu?"
                say: "Ein Schwein, zwei ... Was kommt am Ende dazu?"
                show: { object: pig, count: 2, layout: row }
                frame: "die Schwein_"
                options: ["e", "er", "n"]
                answer: ["e"]
                hints: ["Zwei Schweine. Was hörst du am Ende?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: apple, count: 3, layout: row }
                frame: "Im Korb liegen drei _."
                options: ["Apfel", "Äpfel", "Apfels"]
                answer: ["Äpfel"]
              - id: l2-n2
                type: multiple_choice
                text: "Eine Kuh, zwei ..."
                say: "Eine Kuh, zwei ... Wie heißt die Mehrzahl?"
                show: { object: cow, count: 2, layout: row }
                options: ["Kuhs", "Kühe", "Kuhe"]
                answer: "Kühe"
              - id: l2-n3
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: hand, count: 2, layout: row }
                frame: "Ich wasche meine _."
                options: ["Hande", "Hände", "Hand"]
                answer: ["Hände"]
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: cat, count: 3, layout: row }
                frame: "Auf dem Dach sitzen drei _."
                options: ["Katzen", "Katze", "Katzes"]
                answer: ["Katzen"]
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welches Wort passt in die Lücke?"
                show: { object: banana, count: 2, layout: row }
                frame: "Mia isst zwei _."
                options: ["Banane", "Bananen", "Bananes"]
                answer: ["Bananen"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: tell
            type: image_multiple_choice
            text: "die Erdbeeren"
            say: "Hör gut zu: die Erdbeeren. Welches Bild passt?"
            options: [{ object: strawberry, count: 3, layout: row }, { object: strawberry }]
            option_audio: false
            answer: "3"
          - id: l2-c2
            part: tell
            type: true_false
            text: "die Tanne: Ist das die Mehrzahl?"
            say: "Die Tanne. Ist das die Mehrzahl?"
            show: { object: fir-tree }
            answer: false
          - id: l2-c6
            part: tell
            type: highlight_in_text
            text: "Tippe auf jedes Nomen in der Mehrzahl."
            say: "Lies die Sätze. Tippe auf jedes Nomen in der Mehrzahl."
            show: { drawn: letter-card, text: "Lea holt die Gabeln. Die Blumen stehen auf dem Tisch." }
            spans: ["Blumen", "Gabeln"]
          - id: l2-c7
            part: tell
            type: image_multiple_choice
            text: "die Krone"
            say: "Hör gut zu: die Krone. Welches Bild passt?"
            options: [{ object: crown, count: 3, layout: row }, { object: crown }]
            option_audio: false
            answer: crown
          - id: l2-c8
            part: tell
            type: true_false
            text: "Passt das Wort zum Bild? die Löwen"
            say: "Schau dir das Bild an. Passt das Wort die Löwen dazu?"
            show: { object: lion }
            answer: false
          - id: l2-c9
            part: tell
            type: multiple_choice
            text: "Welches Wort ist die Mehrzahl?"
            say: "Lies beide Wörter. Welches Wort ist die Mehrzahl?"
            options: ["die Feder", "die Federn"]
            answer: "die Federn"
          - id: l2-c10
            part: tell
            type: sorting
            text: "Einzahl oder Mehrzahl?"
            say: "Lies die Wörter. Ist es eins, oder sind es mehrere? Sortiere."
