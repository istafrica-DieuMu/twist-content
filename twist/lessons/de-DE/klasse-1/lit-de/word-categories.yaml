# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.word-categories
skill: lit-de.vocabulary.categories
curriculum: de-DE
language: de
title:
  de: Oberbegriffe
  en: Umbrella terms
summary: >
  Children sort words under an Oberbegriff and find words that belong to
  one. Lesson 1 works with pictures: sort them into Tiere, Obst and
  Kleidung, find the one that does not belong, and learn that a Möhre is
  Gemüse, not Obst. Lesson 2 works with written words: name the
  Oberbegriff for a group (Tisch, Stuhl, Bett: Möbel), find every word of
  one group in a list (Fahrzeuge, Schulsachen, Spielzeug), keep apart
  things that go together from things of the same kind (Schuh and Fuß),
  and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Wortschatz, en: Vocabulary }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.word-picture]
  also_practises: [lit-de.decoding.word-picture]
  vocabulary: { de: [Oberbegriff, Tiere, Obst, Gemüse, Kleidung, Möbel, Fahrzeuge, Spielzeug, Schulsachen, Körperteile] }
  forms: [picture, drawn, audio]
  drawn: [letter-card]
  sounds: []
  facets: []
  parts:
    - { id: sort, what: { de: "Wörter und Bilder nach Oberbegriffen ordnen und finden, was nicht dazugehört", en: sorting words and pictures under umbrella terms and finding the odd one out } }
    - { id: name, what: { de: den Oberbegriff für eine Gruppe nennen, en: naming the umbrella term for a group } }
    - { id: find, what: { de: zu einem Oberbegriff passende Wörter finden, en: finding words that belong to an umbrella term } }
  misconceptions:
    - id: goes-together
      what: Groups things that are used together instead of things of the same kind (Schuh with Fuß, Löffel with Tisch)
      addressed: "lesson 2 Learn sets Schuh and Fuß apart; l2-f3, l2-s3 and l2-c3 sort pairs that go together into different groups, with hints on l2-f3; l2-f2 offers Löffel among Möbel"
    - id: member-as-category
      what: Gives one member as the Oberbegriff (Apfel for Apfel, Banane, Birne) or a word that is too narrow
      addressed: "the Oberbegriff tasks in l2-f1, l2-s1 and l2-c2 always offer a member of the group, with feedback on l2-f1"
    - id: fruit-vegetable
      what: Calls everything that grows and can be eaten Obst, so puts the Möhre with the fruit
      addressed: "lesson 1 Learn says Möhre is Gemüse; l1-f4 and l1-n4 ask about it"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was gehört zusammen?", en: "What belongs together?" }
    goal:
      de: "Sortier Bilder in Gruppen wie Tiere, Obst und Kleidung. Pass auf, die Möhre ist kein Obst."
      en: "Sort pictures into groups like animals, fruit and clothes. Careful, a carrot is not fruit."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: letter-card, text: "Socke" }
            options: [{ object: sock }, { object: skirt }, { object: cake }]
            answer: sock
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: letter-card, text: "Ziege" }
            options: [{ object: cheese }, { object: goat }]
            answer: goat
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Obst"
            say: "Apfel, Banane, Erdbeere. Das ist alles Obst. Obst ist ein Oberbegriff. Er ist wie ein Name für die ganze Gruppe."
            show: { objects: [apple, banana] }
          - text: "Tiere"
            say: "Hund, Katze und Ente sind Tiere. Tiere ist auch ein Oberbegriff."
            show: { objects: [dog, cat] }
          - text: "Kleidung"
            say: "Jacke, Socke und Rock ziehst du an. Der Oberbegriff heißt Kleidung."
            show: { objects: [jacket, sock] }
          - text: "Gemüse"
            say: "Und die Möhre? Die ist kein Obst. Die Möhre ist Gemüse. Das ist eine andere Gruppe."
            show: { object: carrot }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Tiere oder Obst?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Tieren oder zum Obst."
                bins:
                  - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
                  - { id: obst, show: { text: "Obst" }, say: "Obst" }
                options:
                  - { object: frog, bin: tiere }
                  - { object: banana, bin: obst }
                  - { object: pig, bin: tiere }
                  - { object: strawberry, bin: obst }
                hints:
                  - "Frag bei jedem Bild: Ist es ein Tier, oder ist es Obst?"
                  - "Frosch und Schwein sind Tiere. Banane und Erdbeere sind süße Früchte."
                  - "Frosch und Schwein zu den Tieren, Banane und Erdbeere zum Obst."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei Bilder gehören zusammen. Eins passt nicht dazu. Welches?"
                options: [{ object: apple }, { object: orange }, { object: ball }, { object: banana }]
                answer: ball
                hints:
                  - "Sag zu jedem Bild das Wort. Was haben drei gemeinsam?"
                  - "Apfel, Orange, Banane: alles Obst."
                  - "Der Ball ist kein Obst."
              - id: l1-f3
                type: image_multiple_choice
                text: "Was ist Kleidung?"
                say: "Welches Bild gehört zur Kleidung?"
                options: [{ object: dress }, { object: cup }, { object: duck }]
                answer: dress
                hints:
                  - "Kleidung ziehst du an."
                  - "Kannst du eine Tasse anziehen? Eine Ente?"
                  - "Das Kleid ist Kleidung."
              - id: l1-f4
                type: true_false
                text: "Ist die Möhre Obst?"
                say: "Ist die Möhre Obst?"
                show: { object: carrot }
                answer: false
                hints:
                  - "Nicht alles, was man essen kann, ist Obst."
                  - "Die Möhre wächst in der Erde. Sie gehört zu einer anderen Gruppe."
                  - "Nein. Die Möhre ist Gemüse."
              - id: l1-f5
                type: multiple_choice
                text: "Hund, Katze, Ente: Wie heißt der Oberbegriff?"
                say: "Hund, Katze, Ente. Wie heißt der Oberbegriff?"
                show: { objects: [dog, cat] }
                options: ["Tiere", "Kleidung", "Obst"]
                answer: "Tiere"
                hints:
                  - "Was sind Hund, Katze und Ente?"
                  - "Sie leben und können sich bewegen."
                  - "Tiere."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Tiere oder Kleidung?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Tieren oder zur Kleidung."
                bins:
                  - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
                  - { id: kleidung, show: { text: "Kleidung" }, say: "Kleidung" }
                options:
                  - { object: jumper, bin: kleidung }
                  - { object: fox, bin: tiere }
                  - { object: woolly-hat, bin: kleidung }
                  - { object: goat, bin: tiere }
                hints: ["Kleidung ziehst du an. Tiere können sich bewegen."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei Bilder gehören zusammen. Eins passt nicht dazu. Welches?"
                options: [{ object: lion }, { object: skirt }, { object: zebra }, { object: snake }]
                answer: skirt
                hints: ["Drei davon sind Tiere."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was ist Obst?"
                say: "Welches Bild gehört zum Obst?"
                options: [{ object: bread }, { object: pineapple }, { object: cheese }]
                answer: pineapple
                hints: ["Brot und Käse kannst du essen, aber sie sind kein Obst."]
              - id: l1-s4
                type: multiple_choice
                text: "Hose, Kleid, Mütze: Wie heißt der Oberbegriff?"
                say: "Hose, Kleid, Mütze. Wie heißt der Oberbegriff?"
                show: { objects: [trousers, dress] }
                options: ["Tiere", "Kleidung", "Obst"]
                answer: "Kleidung"
                hints: ["Was machst du mit diesen Sachen?"]
              - id: l1-s5
                type: true_false
                text: "Ist der Elefant ein Tier?"
                say: "Ist der Elefant ein Tier?"
                show: { object: elephant }
                answer: true
                hints: ["Gehört er zu Hund, Katze und Ente?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Tiere, Obst oder Kleidung?"
                say: "Tippe auf ein Bild und hör das Wort. Leg es zu den Tieren, zum Obst oder zur Kleidung."
                bins:
                  - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
                  - { id: obst, show: { text: "Obst" }, say: "Obst" }
                  - { id: kleidung, show: { text: "Kleidung" }, say: "Kleidung" }
                options:
                  - { object: hedgehog, bin: tiere }
                  - { object: orange, bin: obst }
                  - { object: hat, bin: kleidung }
                  - { object: apple, bin: obst }
                  - { object: jacket, bin: kleidung }
              - id: l1-n2
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei Bilder gehören zusammen. Eins passt nicht dazu. Welches?"
                options: [{ object: shoe }, { object: t-shirt }, { object: sock }, { object: strawberry }]
                answer: strawberry
              - id: l1-n3
                type: image_multiple_choice
                text: "Was ist ein Tier?"
                say: "Welches Bild gehört zu den Tieren?"
                options: [{ object: tree }, { object: whale }, { object: car }]
                answer: whale
              - id: l1-n4
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei Bilder sind Obst. Eins passt nicht dazu. Welches?"
                options: [{ object: banana }, { object: carrot }, { object: strawberry }, { object: apple }]
                answer: carrot
              - id: l1-n5
                type: multiple_choice
                text: "Apfel, Banane, Orange: Wie heißt der Oberbegriff?"
                say: "Apfel, Banane, Orange. Wie heißt der Oberbegriff?"
                show: { objects: [apple, orange] }
                options: ["Gemüse", "Obst", "Tiere"]
                answer: "Obst"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Drei Bilder gehören zusammen. Eins passt nicht dazu. Welches?"
            options: [{ object: cow }, { object: dog }, { object: jumper }, { object: bird }]
            answer: jumper
          - id: l1-c2
            type: sorting
            text: "Obst oder Kleidung?"
            say: "Tippe auf ein Bild und hör das Wort. Leg es zum Obst oder zur Kleidung."
            bins:
              - { id: obst, show: { text: "Obst" }, say: "Obst" }
              - { id: kleidung, show: { text: "Kleidung" }, say: "Kleidung" }
            options:
              - { object: dress, bin: kleidung }
              - { object: pineapple, bin: obst }
              - { object: sock, bin: kleidung }
              - { object: pear, bin: obst }
          - id: l1-c3
            type: multiple_choice
            text: "Fuchs, Ziege, Igel: Wie heißt der Oberbegriff?"
            say: "Fuchs, Ziege, Igel. Wie heißt der Oberbegriff?"
            show: { objects: [fox, goat] }
            options: ["Kleidung", "Obst", "Tiere"]
            answer: "Tiere"
          - id: l1-c4
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Drei Bilder gehören zusammen. Eins passt nicht dazu. Welches?"
            options: [{ object: pear }, { object: banana }, { object: fish }, { object: pineapple }]
            answer: fish
          - id: l1-c5
            type: true_false
            text: "Ist die Ananas Gemüse?"
            say: "Ist die Ananas Gemüse?"
            show: { object: pineapple }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Löwe, Zebra, Giraffe: Wie heißt der Oberbegriff?"
            say: "Löwe, Zebra, Giraffe. Wie heißt der Oberbegriff?"
            show: { objects: [lion, zebra] }
            options: ["Löwe", "Tiere", "Kleidung"]
            answer: "Tiere"

  - n: 2
    title: { de: Oberbegriffe finden, en: Finding umbrella terms }
    goal:
      de: "Find den Namen für eine ganze Gruppe. Tisch, Stuhl und Bett sind alles Möbel."
      en: "Find the name for a whole group. Table, chair and bed are all furniture."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Rock, Jacke, Socke: Wie heißt der Oberbegriff?"
            say: "Rock, Jacke, Socke. Wie heißt der Oberbegriff?"
            options: ["Kleidung", "Tiere"]
            answer: "Kleidung"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Eins passt nicht dazu. Welches?"
            options: [{ object: frog }, { object: duck }, { object: banana }]
            answer: banana
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tisch  Stuhl  Bett"
            say: "Lies die Wörter: Tisch, Stuhl, Bett. Was ist das alles? Möbel. Möbel ist der Oberbegriff."
            show: { drawn: letter-card, text: "Tisch Stuhl Bett" }
          - text: "Bus  Auto  Boot  Fahrrad"
            say: "Bus, Auto, Boot, Fahrrad: Damit fährt man. Der Oberbegriff heißt Fahrzeuge."
            show: { drawn: letter-card, text: "Bus Auto Boot Fahrrad" }
          - text: "Schuh  Fuß"
            say: "Aufgepasst: Schuh und Fuß gehören zusammen, denn der Schuh kommt an den Fuß. Aber der Schuh ist Kleidung, und der Fuß ist ein Körperteil. Frag immer: Was ist es?"
            show: { objects: [shoe, foot] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tisch, Stuhl, Bett: Wie heißt der Oberbegriff?"
                say: "Lies die Wörter. Wie heißt der Oberbegriff?"
                options: ["Stuhl", "Möbel", "Fahrzeuge"]
                answer: "Möbel"
                feedback:
                  Stuhl: "Der Stuhl ist nur eins von den drei Wörtern. Der Oberbegriff ist der Name für alle zusammen."
                  Fahrzeuge: "Mit einem Tisch kannst du nicht fahren. Was steht in deinem Zimmer?"
                hints:
                  - "Der Oberbegriff passt zu allen drei Wörtern."
                  - "Diese Dinge stehen in einer Wohnung."
                  - "Möbel."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was passt nicht dazu?"
                say: "Lies die Wörter. Welches Wort passt nicht dazu?"
                show: { drawn: letter-card, text: "Tisch Stuhl Löffel Bett" }
                options: ["Tisch", "Stuhl", "Löffel", "Bett"]
                answer: "Löffel"
                hints:
                  - "Drei Wörter sind Möbel."
                  - "Den Löffel legst du auf den Tisch. Aber ist er ein Möbelstück?"
                  - "Der Löffel passt nicht."
              - id: l2-f3
                type: sorting
                text: "Kleidung oder Körperteile?"
                say: "Lies die Wörter. Leg sie zur Kleidung oder zu den Körperteilen."
                bins:
                  - { id: kleidung, show: { text: "Kleidung" }, say: "Kleidung" }
                  - { id: koerper, show: { text: "Körperteile" }, say: "Körperteile" }
                options:
                  - { text: "Schuh", bin: kleidung }
                  - { text: "Fuß", bin: koerper }
                  - { text: "Mütze", bin: kleidung }
                  - { text: "Kopf", bin: koerper }
                hints:
                  - "Frag bei jedem Wort: Was ist es? Nicht: Wozu gehört es?"
                  - "Schuh und Mütze ziehst du an. Fuß und Kopf hast du am Körper."
                  - "Schuh und Mütze zur Kleidung, Fuß und Kopf zu den Körperteilen."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf alle Fahrzeuge."
                say: "Lies die Wörter. Tippe auf alle Fahrzeuge."
                show: { drawn: letter-card, text: "Bus Hund Auto Ball Boot" }
                spans: ["Bus", "Auto", "Boot"]
                hints:
                  - "Mit Fahrzeugen kann man fahren."
                  - "Hund und Ball sind keine Fahrzeuge."
                  - "Bus, Auto und Boot."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welcher Oberbegriff passt in die Lücke?"
                frame: "Ein Ball ist ein _."
                options: ["Spielzeug", "Fahrzeug", "Tier"]
                answer: ["Spielzeug"]
                hints:
                  - "Was machst du mit einem Ball?"
                  - "Du spielst damit."
                  - "Ein Ball ist ein Spielzeug."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Stift, Lineal, Schere: Wie heißt der Oberbegriff?"
                say: "Lies die Wörter. Wie heißt der Oberbegriff?"
                options: ["Schulsachen", "Schere", "Spielzeug"]
                answer: "Schulsachen"
                hints: ["Wo brauchst du diese Dinge?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf alle Körperteile."
                say: "Lies die Wörter. Tippe auf alle Körperteile."
                show: { drawn: letter-card, text: "Hand Hut Nase Ohr Kiste" }
                spans: ["Hand", "Nase", "Ohr"]
                hints: ["Was hast du an deinem Körper?"]
              - id: l2-s3
                type: sorting
                text: "Möbel oder Essen?"
                say: "Lies die Wörter. Leg sie zu den Möbeln oder zum Essen."
                bins:
                  - { id: moebel, show: { text: "Möbel" }, say: "Möbel" }
                  - { id: essen, show: { text: "Essen" }, say: "Essen" }
                options:
                  - { text: "Tisch", bin: moebel }
                  - { text: "Brot", bin: essen }
                  - { text: "Bett", bin: moebel }
                  - { text: "Kuchen", bin: essen }
                hints: ["Das Brot liegt auf dem Tisch. Aber was ist das Brot?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welcher Oberbegriff passt in die Lücke?"
                frame: "Ein Fahrrad ist ein _."
                options: ["Möbel", "Fahrzeug", "Spielzeug"]
                answer: ["Fahrzeug"]
                hints: ["Was machst du mit einem Fahrrad?"]
              - id: l2-s5
                type: multiple_choice
                text: "Was passt nicht dazu?"
                say: "Lies die Wörter. Welches Wort passt nicht dazu?"
                show: { drawn: letter-card, text: "Auto Bus Boot Bett" }
                options: ["Auto", "Bus", "Boot", "Bett"]
                answer: "Bett"
                hints: ["Drei sind Fahrzeuge."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ball, Drachen, Jo-Jo: Wie heißt der Oberbegriff?"
                say: "Lies die Wörter. Wie heißt der Oberbegriff?"
                options: ["Ball", "Spielzeug", "Kleidung"]
                answer: "Spielzeug"
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf alle Schulsachen."
                say: "Lies die Wörter. Tippe auf alle Schulsachen."
                show: { drawn: letter-card, text: "Heft Ente Stift Lineal Rock" }
                spans: ["Heft", "Stift", "Lineal"]
              - id: l2-n3
                type: sorting
                text: "Tiere oder Fahrzeuge?"
                say: "Lies die Wörter. Leg sie zu den Tieren oder zu den Fahrzeugen."
                bins:
                  - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
                  - { id: fahrzeuge, show: { text: "Fahrzeuge" }, say: "Fahrzeuge" }
                options:
                  - { text: "Pferd", bin: tiere }
                  - { text: "Bus", bin: fahrzeuge }
                  - { text: "Wal", bin: tiere }
                  - { text: "Boot", bin: fahrzeuge }
              - id: l2-n4
                type: fill_in_blank
                text: "Welches Wort passt?"
                say: "Lies den Satz. Welcher Oberbegriff passt in die Lücke?"
                frame: "Eine Banane ist _."
                options: ["Gemüse", "Obst", "Kleidung"]
                answer: ["Obst"]
              - id: l2-n5
                type: multiple_choice
                text: "Was passt nicht dazu?"
                say: "Lies die Wörter. Welches Wort passt nicht dazu?"
                show: { drawn: letter-card, text: "Arm Bein Kopf Ball" }
                options: ["Arm", "Bein", "Kopf", "Ball"]
                answer: "Ball"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sort
            type: sorting
            text: "Tiere, Obst oder Kleidung?"
            say: "Tippe auf ein Bild und hör das Wort. Leg es in die richtige Gruppe."
            bins:
              - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
              - { id: obst, show: { text: "Obst" }, say: "Obst" }
              - { id: kleidung, show: { text: "Kleidung" }, say: "Kleidung" }
            options:
              - { object: giraffe, bin: tiere }
              - { object: strawberry, bin: obst }
              - { object: skirt, bin: kleidung }
              - { object: bee, bin: tiere }
          - id: l2-c2
            part: name
            type: multiple_choice
            text: "Hose, Pullover, Kleid: Wie heißt der Oberbegriff?"
            say: "Lies die Wörter. Wie heißt der Oberbegriff?"
            options: ["Kleid", "Kleidung", "Möbel"]
            answer: "Kleidung"
          - id: l2-c3
            part: sort
            type: sorting
            text: "Spielzeug oder Körperteile?"
            say: "Lies die Wörter. Leg sie zum Spielzeug oder zu den Körperteilen."
            bins:
              - { id: spielzeug, show: { text: "Spielzeug" }, say: "Spielzeug" }
              - { id: koerper, show: { text: "Körperteile" }, say: "Körperteile" }
            options:
              - { text: "Ball", bin: spielzeug }
              - { text: "Fuß", bin: koerper }
              - { text: "Hand", bin: koerper }
              - { text: "Puppe", bin: spielzeug }
          - id: l2-c4
            part: find
            type: highlight_in_text
            text: "Tippe auf alle Tiere."
            say: "Lies die Wörter. Tippe auf alle Tiere."
            show: { drawn: letter-card, text: "Maus Mond Kuh Tasse Esel" }
            spans: ["Maus", "Kuh", "Esel"]
          - id: l2-c5
            part: find
            type: image_multiple_choice
            text: "Was ist Gemüse?"
            say: "Welches Bild gehört zum Gemüse?"
            options: [{ object: banana }, { object: carrot }, { object: orange }]
            answer: carrot
          - id: l2-c6
