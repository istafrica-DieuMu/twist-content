# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.function-words
skill: lit-de.fluency.function-words
curriculum: de-DE
language: de
title:
  de: Kleine Wörter blitzschnell lesen
  en: Reading small words in a flash
summary: >
  Blitzlesen with the small words that hold a sentence together. Lesson 1
  takes the Begleiter der, die, das and den; lesson 2 takes ein, eine,
  auf, nicht and sind, finds them inside short sentences, and ends with the
  skill check. As in the first Blitzlesen lessons, a word is shown for two
  seconds and covered, and the options are always words that look alike
  (der and den, die and sie, auf and aus, ein and eine), because that is
  where a quick look goes wrong.
metadata:
  year: klasse-1
  topic: { de: Blitzlesen, en: Flash reading }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [lit-de.fluency.sight-words-easy]
  also_practises: [lit-de.fluency.sight-words-easy]
  vocabulary: { de: [Blitzlesen, Begleiter, auf einen Blick] }
  forms: [audio, drawn]
  drawn: [word-card, letter-card]
  sounds: []
  facets: []
  parts:
    - { id: begleiter, what: { de: "der, die, das und den auf einen Blick lesen", en: "reading der, die, das and den at a glance" } }
    - { id: small-words, what: { de: "ein, eine, auf, nicht und sind auf einen Blick lesen", en: "reading ein, eine, auf, nicht and sind at a glance" } }
    - { id: in-sentence, what: { de: kleine Wörter in einem Satz erkennen, en: recognising small words in a sentence } }
  misconceptions:
    - id: same-start
      what: Reads the first two letters and guesses the rest, so der becomes den and ein becomes eine
      addressed: "every flash task offers a word with the same start; feedback on l1-f2 and l2-f2 points to the last letter"
    - id: small-words-skipped
      what: Skips or swaps small words when reading a sentence, because only the long words seem to matter
      addressed: "lesson 2 Learn shows that nicht turns a sentence round; highlight tasks find the small words inside sentences, and l2-f4 and l2-c4 ask which small word was in a flashed sentence"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "der, die, das, den", en: "der, die, das, den" }
    goal:
      de: "Lies kleine Wörter wie der, die und das blitzschnell. Pass auf, dass du der und den nicht verwechselst."
      en: "Read little words like der, die and das in a flash. Take care not to mix up der and den."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Schau genau hin. Welches Wort war es?"
            show: { drawn: word-card, text: "und", flash: 2 }
            options: ["und", "um"]
            option_audio: false
            answer: "und"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "mit" }
            options: ["mit", "im"]
            answer: "mit"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Hund  der  Elefant  die"
            say: "Was glaubst du: Welches Wort steht in Büchern öfter? Ein langes wie Elefant oder ein kleines wie der?"
            show: { drawn: word-card, text: "Hund  der  Elefant  die" }
          - text: "Wusstest du? Kein Wort steht in deutschen Büchern so oft wie der und die."
            say: "Wusstest du? Die kleinen Wörter gewinnen! Kein Wort steht in deutschen Büchern so oft wie der und die. Darum lohnt es sich, sie blitzschnell zu lesen."
            show: { drawn: letter-card, text: "der die" }
          - text: "der die das"
            say: "Diese drei kleinen Wörter stehen oft vor einem Nomen: der, die, das. Sie heißen Begleiter. Der Hund, die Katze, das Pferd. Du siehst sie in fast jedem Satz."
            show: { drawn: letter-card, text: "der die das" }
          - text: "der den"
            say: "Der und den sehen fast gleich aus. Schau auf den letzten Buchstaben: der hört mit r auf, den mit n."
            show: { drawn: letter-card, text: "der den" }
          - text: "die sie"
            say: "Die und sie sind auch fast gleich. Schau diesmal auf den ersten Buchstaben: d oder s."
            show: { drawn: letter-card, text: "die sie" }
          - text: "das da"
            say: "Das und da fangen gleich an. Das hat am Ende noch ein s."
            show: { drawn: letter-card, text: "das da" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Das Wort ist gleich weg. Welches Wort war es?"
                show: { drawn: word-card, text: "die", flash: 2 }
                options: ["die", "sie", "dir"]
                option_audio: false
                answer: "die"
                hints:
                  - "Schau dir das ganze Wort auf einmal an. Tippe auf „Nochmal sehen“."
                  - "Das Wort fängt mit d an und hört mit e auf."
                  - "Es war die."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "den", flash: 2 }
                options: ["der", "den", "dem"]
                option_audio: false
                answer: "den"
                feedback:
                  der: "Der hört mit r auf. Das Wort hatte am Ende ein n."
                  dem: "Dem hat am Ende ein m mit zwei Bögen. Das Wort hatte ein n mit einem Bogen."
                hints:
                  - "Alle drei fangen mit de an. Schau auf den letzten Buchstaben."
                  - "Der letzte Buchstabe hat einen Bogen."
                  - "Es war den."
              - id: l1-f3
                type: true_false
                text: "Stand da das Wort „das“?"
                say: "Schau genau hin. Stand da das Wort „das“?"
                show: { drawn: word-card, text: "das", flash: 2 }
                answer: true
                hints:
                  - "Tippe auf „Nochmal sehen“."
                  - "D, a, s."
                  - "Ja, das war das."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes der."
                say: "Tippe ganz schnell auf jedes der."
                show: { drawn: letter-card, text: "der den der dir der" }
                spans: ["der", "der", "der"]
                hints:
                  - "Der hört mit r auf."
                  - "Den und dir passen nicht."
                  - "Es sind drei."
              - id: l1-f5
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "die" }
                options: ["der", "die", "das"]
                answer: "die"
                hints:
                  - "Hör auf das Ende des Wortes."
                  - "Am Ende hörst du iii."
                  - "Die."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "das", flash: 2 }
                options: ["da", "was", "das"]
                option_audio: false
                answer: "das"
                hints: ["Das Wort fängt mit d an und hat drei Buchstaben."]
              - id: l1-s2
                type: true_false
                text: "Stand da das Wort „die“?"
                say: "Schau genau hin. Stand da das Wort „die“?"
                show: { drawn: word-card, text: "sie", flash: 2 }
                answer: false
                hints: ["Schau auf den ersten Buchstaben. War es ein d?"]
              - id: l1-s3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "den" }
                options: ["der", "den", "dem"]
                answer: "den"
                hints: ["Am Ende hörst du nnn."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf jedes das."
                say: "Tippe ganz schnell auf jedes das."
                show: { drawn: letter-card, text: "da das was das" }
                spans: ["das", "das"]
                hints: ["Das fängt mit d an und hört mit s auf."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "der", flash: 2 }
                options: ["den", "der", "er"]
                option_audio: false
                answer: "der"
                hints: ["Der letzte Buchstabe ist ein r."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "sie", flash: 2 }
                options: ["die", "sie", "sich"]
                option_audio: false
                answer: "sie"
              - id: l1-n2
                type: true_false
                text: "Stand da das Wort „den“?"
                say: "Schau genau hin. Stand da das Wort „den“?"
                show: { drawn: word-card, text: "der", flash: 2 }
                answer: false
              - id: l1-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "das" }
                options: ["da", "das", "die"]
                answer: "das"
              - id: l1-n4
                type: highlight_in_text
                text: "Tippe auf jedes die."
                say: "Tippe ganz schnell auf jedes die."
                show: { drawn: letter-card, text: "sie die dir die" }
                spans: ["die", "die"]
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "den", flash: 2 }
                options: ["dem", "der", "den"]
                option_audio: false
                answer: "den"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Schau genau hin. Welches Wort war es?"
            show: { drawn: word-card, text: "der", flash: 2 }
            options: ["der", "dir", "den"]
            option_audio: false
            answer: "der"
          - id: l1-c2
            type: true_false
            text: "Stand da das Wort „das“?"
            say: "Schau genau hin. Stand da das Wort „das“?"
            show: { drawn: word-card, text: "da", flash: 2 }
            answer: false
          - id: l1-c3
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "die" }
            options: ["sie", "die", "dir"]
            answer: "die"
          - id: l1-c4
            type: highlight_in_text
            text: "Tippe auf jedes die."
            say: "Tippe ganz schnell auf jedes die."
            show: { drawn: letter-card, text: "die sie die dir die" }
            spans: ["die", "die", "die"]
          - id: l1-c5
            type: true_false
            text: "Stand da das Wort „der“?"
            say: "Schau genau hin. Stand da das Wort „der“?"
            show: { drawn: word-card, text: "der", flash: 2 }
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Schau genau hin. Welches Wort war es?"
            show: { drawn: word-card, text: "sie", flash: 2 }
            options: ["die", "sei", "sie"]
            option_audio: false
            answer: "sie"

  - n: 2
    title: { de: "ein, eine, auf, nicht, sind", en: "ein, eine, auf, nicht, sind" }
    goal:
      de: "Lies neue kleine Wörter blitzschnell, wie ein, auf und nicht. Schon das kleine nicht dreht einen Satz um."
      en: "Read new little words in a flash, like ein, auf and nicht. Even little nicht turns a sentence around."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Schau genau hin. Welches Wort war es?"
            show: { drawn: word-card, text: "das", flash: 2 }
            options: ["das", "da"]
            option_audio: false
            answer: "das"
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "der" }
            options: ["der", "den"]
            answer: "der"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "Der Hund ist nass."
            say: "Der Hund ist nass. Was glaubst du: Kann ein ganz kleines Wort diesen Satz ins Gegenteil drehen?"
            show: { drawn: word-card, text: "Der Hund ist nass." }
          - text: "Der Hund ist nicht nass."
            say: "Ja! Das kleine Wort nicht. Der Hund ist nass. Der Hund ist nicht nass. Ein Wort, und der Satz sagt das Gegenteil. Nicht ist klein, aber wichtig."
            show: { drawn: letter-card, text: "Der Hund ist nicht nass." }
          - text: "ein eine"
            say: "Neue Blitzwörter: ein und eine. Ein Ball, eine Puppe. Eine ist einen Buchstaben länger: Am Ende steht ein e."
            show: { drawn: letter-card, text: "ein eine" }
          - text: "auf aus"
            say: "Auf und aus fangen gleich an. Schau auf den letzten Buchstaben: auf hat ein f, aus ein s."
            show: { drawn: letter-card, text: "auf aus" }
          - text: "sind"
            say: "Das ist sind. Wir sind da. Die Kinder sind froh."
            show: { drawn: word-card, text: "sind" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Das Wort ist gleich weg. Welches Wort war es?"
                show: { drawn: word-card, text: "auf", flash: 2 }
                options: ["aus", "auf", "auch"]
                option_audio: false
                answer: "auf"
                hints:
                  - "Alle fangen mit au an. Schau auf das Ende. Tippe auf „Nochmal sehen“."
                  - "Der letzte Buchstabe ist lang und hat oben einen Bogen."
                  - "Es war auf."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "eine", flash: 2 }
                options: ["ein", "eine", "einen"]
                option_audio: false
                answer: "eine"
                feedback:
                  ein: "Ein hört mit n auf. Das Wort hatte am Ende noch ein e."
                  einen: "Einen hat am Ende noch ein n. Das Wort hörte mit e auf."
                hints:
                  - "Alle fangen mit ein an. Schau auf das Ende."
                  - "Das Wort hatte vier Buchstaben."
                  - "Es war eine."
              - id: l2-f3
                type: true_false
                text: "Stand da das Wort „nicht“?"
                say: "Schau genau hin. Stand da das Wort „nicht“?"
                show: { drawn: word-card, text: "nicht", flash: 2 }
                answer: true
                hints:
                  - "Tippe auf „Nochmal sehen“."
                  - "N, i, c, h, t."
                  - "Ja, das war nicht."
              - id: l2-f4
                type: multiple_choice
                text: "Welches kleine Wort stand im Satz?"
                say: "Lies den Satz schnell. Gleich ist er weg. Welches kleine Wort stand darin?"
                show: { drawn: word-card, text: "Die Katze sitzt auf dem Dach.", flash: 3 }
                options: ["auf", "aus", "an"]
                option_audio: false
                answer: "auf"
                hints:
                  - "Tippe auf „Nochmal sehen“. Schau auf das Wort nach sitzt."
                  - "Wo sitzt die Katze? Oben drauf."
                  - "Auf. Die Katze sitzt auf dem Dach."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf jedes ein."
                say: "Tippe auf jedes ein. Pass auf: eine ist ein anderes Wort."
                show: { drawn: letter-card, text: "ein eine ein einen ein" }
                spans: ["ein", "ein", "ein"]
                hints:
                  - "Ein hat nur drei Buchstaben."
                  - "Eine und einen sind länger."
                  - "Es sind drei."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "sind", flash: 2 }
                options: ["sind", "sie", "singt"]
                option_audio: false
                answer: "sind"
                hints: ["Das Wort fängt mit s an und hört mit d auf."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf jedes nicht."
                say: "Lies die Sätze. Tippe auf jedes nicht."
                show: { drawn: letter-card, text: "Ich bin nicht müde. Es regnet nicht." }
                spans: ["nicht", "nicht."]
                hints: ["Nicht hat fünf Buchstaben und hört mit t auf."]
              - id: l2-s3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "aus" }
                options: ["auf", "aus", "auch"]
                answer: "aus"
                hints: ["Am Ende hörst du sss."]
              - id: l2-s4
                type: true_false
                text: "Stand da das Wort „ein“?"
                say: "Schau genau hin. Stand da das Wort „ein“?"
                show: { drawn: word-card, text: "eine", flash: 2 }
                answer: false
                hints: ["Wie viele Buchstaben hatte das Wort?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welches kleine Wort stand im Satz?"
                say: "Lies den Satz schnell. Welches kleine Wort stand darin?"
                show: { drawn: word-card, text: "Die Kinder sind im Garten.", flash: 3 }
                options: ["sie", "sind", "ist"]
                option_audio: false
                answer: "sind"
                hints: ["Das Wort steht hinter Kinder."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "nicht", flash: 2 }
                options: ["nach", "nicht", "nichts"]
                option_audio: false
                answer: "nicht"
              - id: l2-n2
                type: true_false
                text: "Stand da das Wort „auf“?"
                say: "Schau genau hin. Stand da das Wort „auf“?"
                show: { drawn: word-card, text: "aus", flash: 2 }
                answer: false
              - id: l2-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "sind" }
                options: ["sie", "sind", "Kind"]
                answer: "sind"
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf jedes auf."
                say: "Lies die Sätze. Tippe auf jedes auf."
                show: { drawn: letter-card, text: "Ben steht auf. Er geht aus dem Haus. Er klettert auf den Baum." }
                spans: ["auf.", "auf"]
              - id: l2-n5
                type: multiple_choice
                text: "Welches kleine Wort stand im Satz?"
                say: "Lies den Satz schnell. Welches kleine Wort stand darin?"
                show: { drawn: word-card, text: "Ich habe eine Katze.", flash: 3 }
                options: ["ein", "eine", "einen"]
                option_audio: false
                answer: "eine"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: in-sentence
            type: multiple_choice
            text: "Blitzlesen: Welches kleine Wort stand vor Ball?"
            say: "Blitzlesen. Welches kleine Wort stand vor Ball?"
            show: { drawn: word-card, text: "Der Hund holt den Ball.", flash: 3 }
            options: ["der", "den", "dem"]
            option_audio: false
            answer: "den"
          - id: l2-c2
            part: small-words
            type: multiple_choice
            text: "Blitzlesen: Welches Wort war es?"
            say: "Blitzlesen. Welches Wort war es?"
            show: { drawn: word-card, text: "ein", flash: 2 }
            options: ["eine", "ein", "in"]
            option_audio: false
            answer: "ein"
          - id: l2-c3
            part: begleiter
            type: true_false
            text: "Blitzlesen: Stand da das Wort „der“?"
            say: "Blitzlesen. Stand da das Wort „der“?"
            show: { drawn: word-card, text: "den", flash: 2 }
            answer: false
          - id: l2-c4
            part: in-sentence
            type: multiple_choice
            text: "Blitzlesen: Welches kleine Wort stand im Satz?"
            say: "Blitzlesen. Welches kleine Wort stand im Satz?"
            show: { drawn: word-card, text: "Der Ball ist nicht rot.", flash: 3 }
            options: ["nicht", "nach", "nichts"]
            option_audio: false
            answer: "nicht"
          - id: l2-c5
            part: small-words
            type: multiple_choice
            text: "Blitzlesen: Welches Wort war es?"
            say: "Blitzlesen. Welches Wort war es?"
            show: { drawn: word-card, text: "aus", flash: 2 }
