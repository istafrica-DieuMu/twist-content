# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.print-letters
skill: lit-de.handwriting.print-letters
curriculum: de-DE
language: de
title:
  de: Buchstaben schreiben
  en: Writing print letters
summary: >
  Children write print letters in the Häuschen of four lines: small letters
  like a, o, m live in the Erdgeschoss, tall ones like l and d reach the
  Dach, and every capital starts at the top line. Each letter starts at the
  green dot and is written from top to bottom. Lesson 1 sets out the
  Häuschen with the letters already known (L, O, A, M); lesson 2 adds i, t,
  e, n, u and d and ends with the skill check. Tracing and copying carry
  the writing; short choice tasks ask where a letter starts and which
  floors it uses.
metadata:
  year: klasse-1
  topic: { de: Schreiben lernen, en: Learning to write }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.l-o-a-m]
  also_practises: [lit-de.letters.l-o-a-m]
  vocabulary: { de: [Häuschen, Dach, Erdgeschoss, Keller, Linie, Startpunkt] }
  forms: [drawn, audio]
  drawn: [writing-lines, letter-card]
  sounds: [de.m]
  facets: [script]
  misconceptions:
    - id: start-at-bottom
      what: Starts a letter at the bottom line and writes upwards, so letters wobble and later joined writing is hard
      addressed: "Learn shows the green start dot at the top; tasks l1-f2, l1-s1 and l2-f2 ask where a letter starts, and the feedback on unten says why we start at the top"
    - id: all-letters-same-height
      what: Writes small letters as tall as capitals and l, so a and o fill the whole Häuschen
      addressed: "tasks l1-f3, l1-f5, l2-f3 and l2-s2 ask which floors a letter uses; feedback on the tall choice says a and o stay in the Erdgeschoss"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das Häuschen, en: The little house }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welcher Buchstabe passt zu dem Laut?"
            audio: { sound: de.m }
            options: ["M", "L", "O"]
            answer: "M"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf jedes a."
            say: "Tippe auf jedes kleine a."
            show: { drawn: letter-card, text: "a o a l m" }
            spans: ["a", "a"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Das Häuschen"
            say: "Buchstaben wohnen in einem Häuschen aus vier Linien. Unten ist der Keller, in der Mitte das Erdgeschoss, oben das Dach."
            show: { drawn: writing-lines, text: "a", mode: copy, arrows: false }
          - text: "a o m"
            say: "Kleine Buchstaben wie a, o und m wohnen nur im Erdgeschoss. Sie sind klein."
            show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
          - text: "l L"
            say: "Das l und alle großen Buchstaben reichen bis unters Dach. Du fängst immer oben an, beim grünen Punkt, und schreibst nach unten."
            show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Fahr das l nach."
                say: "Fahr das l nach. Fang beim grünen Punkt an und zieh den Strich nach unten."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo fängst du beim l an?"
                say: "Du schreibst ein kleines l. Wo fängst du an: oben oder unten?"
                show: { drawn: writing-lines, text: "l", mode: copy, arrows: false }
                options: ["oben", "unten"]
                keep_order: true
                answer: "oben"
                feedback:
                  unten: "Wir fangen oben an, unter dem Dach, und ziehen den Strich nach unten. So wird er gerade."
                hints:
                  - "Denk an den grünen Punkt beim Nachfahren."
                  - "Der grüne Punkt war ganz oben, unter dem Dach."
                  - "Oben. Dann geht der Strich nach unten."
              - id: l1-f3
                type: multiple_choice
                text: "Wo wohnt das kleine a?"
                say: "Wo wohnt das kleine a im Häuschen? Nur im Erdgeschoss, oder bis unters Dach?"
                show: { drawn: letter-card, text: "a" }
                options: ["nur im Erdgeschoss", "bis unters Dach"]
                keep_order: true
                answer: "nur im Erdgeschoss"
                feedback:
                  "bis unters Dach": "Das große A reicht bis unters Dach. Das kleine a ist klein und bleibt im Erdgeschoss."
                hints:
                  - "Ist das a ein großer oder ein kleiner Buchstabe?"
                  - "Kleine runde Buchstaben wie a und o sind niedrig."
                  - "Das kleine a wohnt nur im Erdgeschoss."
              - id: l1-f4
                type: tracing
                text: "Fahr das o nach."
                say: "Fahr das o nach. Fang oben an und mach einen runden Bogen nach links."
                show: { drawn: writing-lines, text: "o", mode: trace, arrows: true }
                char: "o"
                difficulty: easy
              - id: l1-f5
                type: true_false
                text: "Stimmt das?"
                say: "Das große M reicht bis unters Dach. Stimmt das?"
                show: { drawn: letter-card, text: "M" }
                answer: true
                hints:
                  - "Ist das M ein großer oder ein kleiner Buchstabe?"
                  - "Alle großen Buchstaben sind hoch."
                  - "Ja. Das große M reicht bis unters Dach."
              - id: l1-f6
                type: tracing
                text: "Fahr das m nach."
                say: "Fahr das kleine m nach. Erst der Strich nach unten, dann zwei kleine Bögen."
                show: { drawn: writing-lines, text: "m", mode: trace, arrows: true }
                char: "m"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wo fängst du beim O an?"
                say: "Du schreibst ein großes O. Wo fängst du an: oben oder unten?"
                show: { drawn: writing-lines, text: "O", mode: copy, arrows: false }
                options: ["oben", "unten"]
                keep_order: true
                answer: "oben"
                hints: ["Alle Buchstaben fangen oben an."]
              - id: l1-s2
                type: tracing
                text: "Fahr das A nach."
                say: "Fahr das große A nach. Zwei schräge Striche wie ein Dach, dann der Strich in der Mitte."
                show: { drawn: writing-lines, text: "A", mode: trace, arrows: true }
                char: "A"
              - id: l1-s3
                type: true_false
                text: "Stimmt das?"
                say: "Das kleine o reicht bis unters Dach. Stimmt das?"
                show: { drawn: letter-card, text: "o" }
                answer: false
                hints: ["Ist das o groß oder klein?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Buchstabe reicht bis unters Dach?"
                say: "Welcher kleine Buchstabe reicht bis unters Dach?"
                options: ["l", "o", "a"]
                answer: "l"
                option_audio: false
                hints: ["Such den langen Strich."]
              - id: l1-s5
                type: tracing
                text: "Schreib das l ab."
                say: "Schreib das l ab. Fang oben an."
                show: { drawn: writing-lines, text: "l", mode: copy, arrows: false }
                char: "l"

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Schreib das o ab."
                say: "Schreib das kleine o ab. Es bleibt im Erdgeschoss."
                show: { drawn: writing-lines, text: "o", mode: copy, arrows: false }
                char: "o"
              - id: l1-n2
                type: multiple_choice
                text: "Wo wohnt das kleine m?"
                say: "Wo wohnt das kleine m im Häuschen?"
                show: { drawn: letter-card, text: "m" }
                options: ["nur im Erdgeschoss", "bis unters Dach"]
                keep_order: true
                answer: "nur im Erdgeschoss"
              - id: l1-n3
                type: true_false
                text: "Stimmt das?"
                say: "Das große L reicht bis unters Dach. Stimmt das?"
                show: { drawn: letter-card, text: "L" }
                answer: true
              - id: l1-n4
                type: tracing
                text: "Schreib das M ab."
                say: "Schreib das große M ab. Fang oben an."
                show: { drawn: writing-lines, text: "M", mode: copy, arrows: false }
                char: "M"
              - id: l1-n5
                type: multiple_choice
                text: "Welcher Buchstabe bleibt im Erdgeschoss?"
                say: "Welcher Buchstabe bleibt nur im Erdgeschoss?"
                options: ["L", "a", "l"]
                answer: "a"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo fängst du beim A an?"
            say: "Du schreibst ein großes A. Wo fängst du an: oben oder unten?"
            options: ["oben", "unten"]
            keep_order: true
            answer: "oben"
          - id: l1-c2
            type: true_false
            text: "Stimmt das?"
            say: "Das kleine a reicht bis unters Dach. Stimmt das?"
            show: { drawn: letter-card, text: "a" }
            answer: false
          - id: l1-c3
            type: tracing
            text: "Schreib das a ab."
            say: "Schreib das kleine a ab."
            show: { drawn: writing-lines, text: "a", mode: copy, arrows: false }
            char: "a"

  - n: 2
    title: { de: Striche und Bögen, en: Strokes and curves }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo fängst du beim M an?"
            say: "Du schreibst ein großes M. Wo fängst du an: oben oder unten?"
            options: ["oben", "unten"]
            keep_order: true
            answer: "oben"
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Schreib das L ab."
            say: "Schreib das große L ab."
            show: { drawn: writing-lines, text: "L", mode: copy, arrows: false }
            char: "L"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "i"
            say: "Das kleine i: ein kurzer Strich im Erdgeschoss, von oben nach unten. Den Punkt setzt du zum Schluss."
            show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
          - text: "t d"
            say: "Das t und das d sind hoch. Sie reichen über das Erdgeschoss hinaus. Beim t ist der Querstrich oben im Erdgeschoss."
            show: { drawn: writing-lines, text: "d", mode: trace, arrows: true }
          - text: "n u e"
            say: "Das n, das u und das e bleiben im Erdgeschoss. Das n hat einen Bogen oben, das u einen Bogen unten."
            show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Fahr das i nach."
                say: "Fahr das kleine i nach. Erst den Strich, dann den Punkt."
                show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
                char: "i"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was schreibst du beim i zuerst?"
                say: "Du schreibst ein kleines i. Was kommt zuerst: der Strich oder der Punkt?"
                show: { drawn: letter-card, text: "i" }
                options: ["der Strich", "der Punkt"]
                keep_order: true
                answer: "der Strich"
                feedback:
                  "der Punkt": "Der Punkt kommt zum Schluss. Zuerst schreibst du den Strich von oben nach unten."
                hints:
                  - "Denk daran, wie du das i eben nachgefahren hast."
                  - "Erst kommt der Buchstabe, dann der Punkt obendrauf."
                  - "Zuerst der Strich."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Buchstabe ist hoch?"
                say: "Welcher kleine Buchstabe reicht über das Erdgeschoss hinaus?"
                options: ["n", "d", "u"]
                answer: "d"
                option_audio: false
                feedback:
                  n: "Das n bleibt im Erdgeschoss. Es hat nur einen kleinen Bogen."
                  u: "Das u bleibt im Erdgeschoss. Es ist so hoch wie das o."
                hints:
                  - "Such den Buchstaben mit dem langen Strich."
                  - "Das n und das u sind so klein wie das a."
                  - "Das d hat einen langen Strich bis unters Dach."
              - id: l2-f4
                type: tracing
                text: "Fahr das n nach."
                say: "Fahr das kleine n nach. Strich nach unten, wieder hoch, dann ein Bogen."
                show: { drawn: writing-lines, text: "n", mode: trace, arrows: true }
                char: "n"
              - id: l2-f5
                type: true_false
                text: "Stimmt das?"
                say: "Das kleine u hat den Bogen unten. Stimmt das?"
                show: { drawn: letter-card, text: "u" }
                answer: true
                hints:
                  - "Schau dir das u genau an."
                  - "Das u sieht aus wie eine Schale."
                  - "Ja, der Bogen ist unten."
              - id: l2-f6
                type: tracing
                text: "Fahr das t nach."
                say: "Fahr das kleine t nach. Erst den langen Strich, dann den Querstrich."
                show: { drawn: writing-lines, text: "t", mode: trace, arrows: true }
                char: "t"

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Fahr das e nach."
                say: "Fahr das kleine e nach. Fang in der Mitte an, mit einem kleinen Strich nach rechts."
                show: { drawn: writing-lines, text: "e", mode: trace, arrows: true }
                char: "e"
              - id: l2-s2
                type: true_false
                text: "Stimmt das?"
                say: "Das kleine n reicht bis unters Dach. Stimmt das?"
                show: { drawn: letter-card, text: "n" }
                answer: false
                hints: ["Ist das n so klein wie das a?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Buchstabe hat den Bogen oben?"
                say: "Welcher Buchstabe hat den Bogen oben?"
                options: ["n", "u"]
                answer: "n"
                option_audio: false
                hints: ["Das u sieht aus wie eine Schale."]
              - id: l2-s4
                type: tracing
                text: "Schreib das d ab."
                say: "Schreib das kleine d ab. Erst der Bauch, dann der lange Strich."
                show: { drawn: writing-lines, text: "d", mode: copy, arrows: false }
                char: "d"
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Buchstabe ist hoch?"
                say: "Welcher kleine Buchstabe ist hoch?"
                options: ["e", "i", "t"]
                answer: "t"
                option_audio: false
                hints: ["Der hohe Buchstabe hat einen Querstrich."]

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Schreib das u ab."
                say: "Schreib das kleine u ab."
                show: { drawn: writing-lines, text: "u", mode: copy, arrows: false }
                char: "u"
              - id: l2-n2
                type: true_false
                text: "Stimmt das?"
                say: "Das kleine d reicht bis unters Dach. Stimmt das?"
                show: { drawn: letter-card, text: "d" }
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Wo fängst du beim t an?"
                say: "Du schreibst ein kleines t. Wo fängst du an: oben oder unten?"
                options: ["oben", "unten"]
                keep_order: true
                answer: "oben"
              - id: l2-n4
                type: tracing
                text: "Schreib das i ab."
                say: "Schreib das kleine i ab. Denk an den Punkt."
                show: { drawn: writing-lines, text: "i", mode: copy, arrows: false }
                char: "i"
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Buchstabe bleibt im Erdgeschoss?"
                say: "Welcher Buchstabe bleibt nur im Erdgeschoss?"
                options: ["d", "e", "l"]
                answer: "e"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welcher Buchstabe ist hoch?"
            say: "Welcher kleine Buchstabe reicht bis unters Dach?"
            options: ["o", "m", "l"]
            answer: "l"
            option_audio: false
          - id: l2-c2
            type: true_false
            text: "Stimmt das?"
            say: "Das kleine e reicht bis unters Dach. Stimmt das?"
            show: { drawn: letter-card, text: "e" }
            answer: false
          - id: l2-c3
            type: multiple_choice
            text: "Was schreibst du beim i zuletzt?"
            say: "Du schreibst ein kleines i. Was kommt zum Schluss?"
            options: ["der Strich", "der Punkt"]
            keep_order: true
            answer: "der Punkt"
          - id: l2-c4
            type: multiple_choice
            text: "Welcher Buchstabe hat den Bogen unten?"
            say: "Welcher Buchstabe hat den Bogen unten?"
            options: ["n", "u"]
            answer: "u"
            option_audio: false
          - id: l2-c5
            type: true_false
            text: "Stimmt das?"
            say: "Das kleine t reicht über das Erdgeschoss hinaus. Stimmt das?"
            show: { drawn: letter-card, text: "t" }
            answer: true
