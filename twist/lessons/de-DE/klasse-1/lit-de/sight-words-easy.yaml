# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.sight-words-easy
skill: lit-de.fluency.sight-words-easy
curriculum: de-DE
language: de
title:
  de: Blitzlesen
  en: Flash reading
summary: >
  Children learn to know short frequent words at a glance, the way a
  Blitzlesen card game trains them: the word appears for two seconds and is
  covered, and the child says which word it was. Lesson 1 works with und,
  ist, im, am, in and an; lesson 2 with mit, da, du, so and es, and ends
  with the skill check. Words that look alike (im, in; am, an; um, und) are
  always set side by side, because that is where a quick look goes wrong.
metadata:
  year: klasse-1
  topic: { de: Blitzlesen, en: Flash reading }
  ages: [6-7]
  lesson_minutes: 9
  builds_on: [lit-de.decoding.one-syllable-words]
  also_practises: [lit-de.decoding.one-syllable-words]
  vocabulary: { de: [Blitzlesen, Wort, auf einen Blick] }
  forms: [audio, drawn]
  drawn: [word-card, letter-card]
  facets: []
  parts:
    - { id: flash, what: { de: ein Blitzwort auf einen Blick erkennen, en: recognising a sight word at a glance } }
    - { id: look-alike, what: { de: "ähnliche Blitzwörter auseinanderhalten (im, in, am, an)", en: "telling look-alike sight words apart (im, in, am, an)" } }
    - { id: find, what: { de: ein Blitzwort schnell unter anderen finden, en: quickly finding a sight word among others } }
  misconceptions:
    - id: look-alike
      what: Sees the first letter and the length and picks a word that looks alike (im for in, am for an, um for und)
      addressed: "every flash task sets look-alike words as options; feedback on l1-f2 and l2-f3 names the letter that differs"
    - id: sounding-out-forever
      what: Keeps sounding out short words letter by letter, which is slow and blocks reading sentences later
      addressed: "the word is covered after two seconds, so the child must take it in whole; Learn says to look at the whole word at once"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "und, ist, im, am", en: "und, ist, im, am" }
    goal:
      de: "Erkenn kleine Wörter wie und und ist auf einen Blick. Schau bei im und am genau auf den ersten Buchstaben."
      en: "Know little words like und and ist at a glance. With im and am, look closely at the first letter."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Mus." }
            options: ["Mus", "Mut"]
            answer: "Mus"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Tal." }
            options: ["Tee", "Tal"]
            answer: "Tal"
            difficulty: easy

      - activity: learn
        mode: new-word
        screens:
          - text: "und"
            say: "Manche Wörter kommen in fast jedem Satz vor. Die lernst du wie ein Bild: Du schaust einmal hin und weißt es. Das hier ist und."
            show: { drawn: word-card, text: "und" }
          - text: "ist"
            say: "Das ist ist. Schau es dir genau an: i, s, t. Gleich ist es nur kurz zu sehen."
            show: { drawn: word-card, text: "ist" }
          - text: "im am"
            say: "Diese zwei sehen fast gleich aus: im und am. Schau auf den ersten Buchstaben."
            show: { drawn: letter-card, text: "im am" }
          - text: "in an"
            say: "Und diese zwei: in und an. Sie hören beide mit n auf. Schau wieder auf den ersten Buchstaben."
            show: { drawn: letter-card, text: "in an" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Das Wort ist gleich weg. Welches Wort war es?"
                show: { drawn: word-card, text: "und", flash: 2 }
                options: ["und", "um", "uns"]
                option_audio: false
                answer: "und"
                hints:
                  - "Schau dir das ganze Wort auf einmal an. Tippe auf „Nochmal sehen“."
                  - "Das Wort hat drei Buchstaben und hört mit d auf."
                  - "Es war „und“."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "im", flash: 2 }
                options: ["im", "in", "am"]
                option_audio: false
                answer: "im"
                feedback:
                  in: "„In“ hat am Ende ein n mit einem Bogen. „Im“ hat ein m mit zwei Bögen."
                  am: "„Am“ fängt mit a an. Das Wort fing mit dem i mit dem Punkt an."
                hints:
                  - "Schau auf den ersten und auf den letzten Buchstaben."
                  - "Der erste Buchstabe hat einen Punkt."
                  - "Es war „im“."
              - id: l1-f3
                type: true_false
                text: "War das das Wort „ist“?"
                say: "Schau genau hin. War das das Wort „ist“?"
                show: { drawn: word-card, text: "ist", flash: 2 }
                answer: true
                hints:
                  - "Tippe auf „Nochmal sehen“."
                  - "I, s, t."
                  - "Ja, das war „ist“."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes „und“."
                say: "Tippe ganz schnell auf jedes und."
                show: { drawn: letter-card, text: "und um und uns und" }
                spans: ["und", "und", "und"]
                hints:
                  - "„Und“ hört mit d auf."
                  - "„Um“ und „uns“ haben kein d."
                  - "Es sind drei."
              - id: l1-f5
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "am" }
                options: ["im", "am", "an"]
                answer: "am"
                hints:
                  - "Hör auf den ersten Laut."
                  - "Aaa am Anfang, mmm am Ende."
                  - "Am."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "an", flash: 2 }
                options: ["am", "an", "in"]
                option_audio: false
                answer: "an"
                hints: ["Der letzte Buchstabe hat einen Bogen."]
              - id: l1-s2
                type: true_false
                text: "War das das Wort „und“?"
                say: "Schau genau hin. War das das Wort „und“?"
                show: { drawn: word-card, text: "um", flash: 2 }
                answer: false
                hints: ["Hatte das Wort ein d am Ende?"]
              - id: l1-s3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "in" }
                options: ["in", "im", "an"]
                answer: "in"
                hints: ["Am Ende hörst du nnn."]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf jedes „ist“."
                say: "Tippe ganz schnell auf jedes ist."
                show: { drawn: letter-card, text: "ist es ist im" }
                spans: ["ist", "ist"]
                hints: ["„Ist“ hat drei Buchstaben."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "ist", flash: 2 }
                options: ["es", "ist", "im"]
                option_audio: false
                answer: "ist"
                hints: ["Das Wort hat einen Punkt und hört mit t auf."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "am", flash: 2 }
                options: ["an", "am", "im"]
                option_audio: false
                answer: "am"
              - id: l1-n2
                type: true_false
                text: "War das das Wort „in“?"
                say: "Schau genau hin. War das das Wort „in“?"
                show: { drawn: word-card, text: "in", flash: 2 }
                answer: true
              - id: l1-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "und" }
                options: ["um", "und", "uns"]
                answer: "und"
              - id: l1-n4
                type: highlight_in_text
                text: "Tippe auf jedes „im“."
                say: "Tippe ganz schnell auf jedes im."
                show: { drawn: letter-card, text: "in im am im" }
                spans: ["im", "im"]
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "in", flash: 2 }
                options: ["im", "an", "in"]
                option_audio: false
                answer: "in"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Schau genau hin. Welches Wort war es?"
            show: { drawn: word-card, text: "und", flash: 2 }
            options: ["uns", "und", "um"]
            option_audio: false
            answer: "und"
          - id: l1-c2
            type: true_false
            text: "War das das Wort „am“?"
            say: "Schau genau hin. War das das Wort „am“?"
            show: { drawn: word-card, text: "an", flash: 2 }
            answer: false
          - id: l1-c3
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "ist" }
            options: ["ist", "es", "im"]
            answer: "ist"
          - id: l1-c4
            type: multiple_choice
            text: "Welches Wort war es?"
            say: "Schau genau hin. Welches Wort war es?"
            show: { drawn: word-card, text: "an", flash: 2 }
            options: ["in", "und", "an"]
            option_audio: false
            answer: "an"
          - id: l1-c5
            type: true_false
            text: "War das das Wort „im“?"
            say: "Schau genau hin. War das das Wort „im“?"
            show: { drawn: word-card, text: "im", flash: 2 }
            answer: true
          - id: l1-c6
            type: highlight_in_text
            text: "Tippe auf jedes „in“."
            say: "Tippe ganz schnell auf jedes in."
            show: { drawn: letter-card, text: "in an in im" }
            spans: ["in", "in"]

  - n: 2
    title: { de: "mit, da, du, so, es", en: "mit, da, du, so, es" }
    goal:
      de: "Lies neue Blitzwörter wie mit, da und du. Bei da und du hilft dir der zweite Buchstabe."
      en: "Read new flash words like mit, da and du. With da and du, the second letter helps you."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
