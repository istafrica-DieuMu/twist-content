                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "mit", flash: 2 }
                options: ["mit", "im", "Tim"]
                option_audio: false
                answer: "mit"
                hints:
                  - "Schau dir das ganze Wort auf einmal an. Tippe auf „Nochmal sehen“."
                  - "Das Wort fängt mit m an."
                  - "Es war „mit“."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "War das das Wort „du“?"
                say: "Schau genau hin. War das das Wort „du“?"
                show: { drawn: word-card, text: "du", flash: 2 }
                answer: true
                hints:
                  - "Tippe auf „Nochmal sehen“."
                  - "Der zweite Buchstabe ist eine Schale: u."
                  - "Ja, das war „du“."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "da", flash: 2 }
                options: ["du", "da", "an"]
                option_audio: false
                answer: "da"
                feedback:
                  du: "„Du“ hat am Ende ein u. Das Wort hatte ein a."
                  an: "„An“ fängt mit a an. Das Wort fing mit d an."
                hints:
                  - "Schau auf den zweiten Buchstaben."
                  - "Der zweite Buchstabe ist rund und hat rechts einen Strich."
                  - "Es war „da“."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes „so“."
                say: "Tippe ganz schnell auf jedes so."
                show: { drawn: letter-card, text: "so es so os" }
                spans: ["so", "so"]
                hints:
                  - "„So“ fängt mit s an."
                  - "„Os“ ist umgedreht. Das passt nicht."
                  - "Es sind zwei."
              - id: l2-f5
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "es" }
                options: ["es", "so", "ist"]
                answer: "es"
                hints:
                  - "Hör auf den ersten Laut."
                  - "Ein kurzes e am Anfang."
                  - "Es."

          - support: some
