                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "du", flash: 2 }
                options: ["da", "du", "und"]
                option_audio: false
                answer: "du"
              - id: l2-n2
                type: true_false
                text: "War das das Wort „so“?"
