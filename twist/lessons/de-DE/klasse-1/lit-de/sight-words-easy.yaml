                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "es", flash: 2 }
                options: ["so", "es", "ist"]
                option_audio: false
                answer: "es"
                hints: ["Das Wort fängt mit e an."]
              - id: l2-s2
                type: true_false
                text: "War das das Wort „mit“?"
                say: "Schau genau hin. War das das Wort „mit“?"
                show: { drawn: word-card, text: "im", flash: 2 }
                answer: false
                hints: ["Hatte das Wort drei Buchstaben?"]
              - id: l2-s3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "da" }
                options: ["du", "da", "so"]
                answer: "da"
                hints: ["Am Ende hörst du aaa."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf jedes „mit“."
                say: "Tippe ganz schnell auf jedes mit."
                show: { drawn: letter-card, text: "mit im mit Tim" }
                spans: ["mit", "mit"]
                hints: ["„Mit“ fängt mit m an."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort war es?"
                say: "Schau genau hin. Welches Wort war es?"
                show: { drawn: word-card, text: "so", flash: 2 }
                options: ["es", "da", "so"]
                option_audio: false
                answer: "so"
                hints: ["Der zweite Buchstabe ist ein Kreis."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
