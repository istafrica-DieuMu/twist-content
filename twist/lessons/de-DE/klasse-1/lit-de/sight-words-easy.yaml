          - text: "da du"
            say: "Das ist da, und das ist du. Sie fangen gleich an. Schau auf den zweiten Buchstaben."
            show: { drawn: letter-card, text: "da du" }
          - text: "so es"
            say: "Und das sind so und es. Zwei Buchstaben, einmal hinschauen."
            show: { drawn: letter-card, text: "so es" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
