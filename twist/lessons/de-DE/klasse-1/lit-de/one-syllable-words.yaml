# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.one-syllable-words
skill: lit-de.decoding.one-syllable-words
curriculum: de-DE
language: de
title:
  de: Kurze Wörter lesen
  en: Reading one-syllable words
summary: >
  Children read short words of one syllable, made only from the letters
  they know so far (L, O, A, M, I, ie, S, T, E, N, D, U): Tal, Mus, Tee,
  Lied in lesson 1, then words that end in two consonants (Mond, Mund,
  Nest, Ast, Sand) in lesson 2. They hear a word and find it written, read
  a word and find its picture, answer a yes or no question about what a
  word means, and tell apart words that differ in one letter. Lesson 2 ends
  with the skill check.
metadata:
  year: klasse-1
  topic: { de: Silben lesen, en: Reading syllables }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.blend-syllables, lit-de.letters.e-n-d-u]
  also_practises: [lit-de.decoding.blend-syllables]
  vocabulary: { de: [Wort, Laut, zusammenziehen, lesen] }
  forms: [audio, drawn, picture]
  drawn: [word-card, letter-card, syllable-arcs]
  sounds: [de.mo]
  facets: []
  parts:
    - { id: heard-word, what: { de: ein gehörtes Wort geschrieben finden, en: finding a heard word in writing } }
    - { id: meaning, what: { de: ein Wort lesen und sein Bild oder seine Bedeutung finden, en: reading a word and finding its picture or meaning } }
    - { id: one-letter, what: { de: "Wörter auseinanderhalten, die sich in einem Buchstaben unterscheiden", en: telling apart words that differ in one letter } }
  misconceptions:
    - id: first-letter-guess
      what: Reads the first letter and guesses the word, so Mond and Mund, Tal and Tee are the same word
      addressed: "options always share the first letter; feedback on l1-f2 and l2-f1 points to the letter in the middle"
    - id: cluster-dropped
      what: Leaves out a sound at the end when two consonants meet (reads Nest as Nes, Sand as San)
      addressed: "lesson 2 Learn reads every sound to the end; tasks l2-f3 and l2-n4 ask for the last sound, l2-s5 sets Nest against Nes"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Laut für Laut, en: Sound by sound }
    goal:
      de: "Lies kurze Wörter Laut für Laut und zieh sie zusammen, so wie Tal und Mus."
      en: "Read short words sound by sound and pull them together, like Tal and Mus."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welche Silbe hörst du?"
            audio: { sound: de.mo }
            options: ["Ma", "Mo", "Lo"]
            answer: "Mo"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: syllable-arcs, word: "Oma", syllables: ["O", "ma"] }
            options: [{ object: grandma }, { object: llama }]
            answer: grandma
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "T a l"
            say: "So liest du ein kurzes Wort. Sprich jeden Laut und zieh sie zusammen: t ... aaa ... lll. Taaal. Tal. Ein Tal liegt zwischen zwei Bergen."
            show: { drawn: letter-card, text: "T a l" }
          - text: "Tal"
            say: "Jetzt stehen die Buchstaben zusammen. Lies sie in einem Zug: Tal."
            show: { drawn: word-card, text: "Tal" }
          - text: "Mus"
            say: "Noch eins. Mmm ... uuu ... sss. Mus. Apfelmus kannst du essen."
            show: { drawn: word-card, text: "Mus" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Tee." }
                options: ["Tee", "Tal", "See"]
                answer: "Tee"
                hints:
                  - "Lies jedes Wort Laut für Laut."
                  - "Das Wort fängt mit t an. Danach kommt ein langes eee."
                  - "T ... eee. Tee."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Mut." }
                options: ["Mus", "Mut", "Tal"]
                answer: "Mut"
                feedback:
                  Mus: "Mus und Mut fangen gleich an. Lies bis zum Ende: Am Ende steht ein t."
                hints:
                  - "Zwei Wörter fangen gleich an. Lies bis zum letzten Buchstaben."
                  - "Mmm ... uuu ... und dann? Summt es, oder macht es kurz t?"
                  - "Mut. Am Ende steht das t."
              - id: l1-f3
                type: true_false
                text: "Lies das Wort. Kann man das trinken?"
                say: "Lies das Wort. Kann man das trinken?"
                show: { drawn: word-card, text: "Tee" }
                answer: true
                hints:
                  - "Lies Laut für Laut und zieh sie zusammen."
                  - "T ... eee."
                  - "Da steht Tee. Tee kann man trinken. Ja."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes Wort „Lied“."
                say: "Tippe auf jedes Wort Lied."
                show: { drawn: letter-card, text: "Lied Lid Lied Mus" }
                spans: ["Lied", "Lied"]
                hints:
                  - "Lied schreibt man mit ie."
                  - "Schau, ob nach dem i noch ein e kommt."
                  - "Es sind zwei: die erste und die dritte Karte."
              - id: l1-f5
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "See." }
                options: ["Tee", "See", "Tal"]
                answer: "See"
                hints:
                  - "Hör auf den ersten Laut."
                  - "Sss am Anfang."
                  - "S ... eee. See."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Lies das Wort. Kann man das essen?"
                say: "Lies das Wort. Kann man das essen?"
                show: { drawn: word-card, text: "Mus" }
                answer: true
                hints: ["Mmm ... uuu ... sss."]
              - id: l1-s2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Tal." }
                options: ["Tee", "Tal", "Tom"]
                answer: "Tal"
                hints: ["Nach dem t kommt ein langes aaa."]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf jedes Wort „Tom“."
                say: "Tippe auf jedes Wort Tom. Tom ist ein Name."
                show: { drawn: letter-card, text: "Tom Tim Tom Tal" }
                spans: ["Tom", "Tom"]
                hints: ["In der Mitte steht ein o."]
              - id: l1-s4
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Lied." }
                options: ["Lied", "Lid", "Mus"]
                answer: "Lied"
                hints: ["Hörst du ein langes iii? Das schreibt man ie."]
                difficulty: stretch
              - id: l1-s5
                type: true_false
                text: "Lies das Wort. Ist das ein Name?"
                say: "Lies das Wort. Ist das ein Name?"
                show: { drawn: word-card, text: "Tim" }
                answer: true
                hints: ["T ... iii ... mmm."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Tim." }
                options: ["Tom", "Tim", "Tal"]
                answer: "Tim"
              - id: l1-n2
                type: true_false
                text: "Lies das Wort. Kann man darin schwimmen?"
                say: "Lies das Wort. Kann man darin schwimmen?"
                show: { drawn: word-card, text: "Mus" }
                answer: false
              - id: l1-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Mus." }
                options: ["Mut", "Mus", "Tee"]
                answer: "Mus"
              - id: l1-n4
                type: highlight_in_text
                text: "Tippe auf jedes Wort „See“."
                say: "Tippe auf jedes Wort See."
                show: { drawn: letter-card, text: "Tee See See Tal" }
                spans: ["See", "See"]
              - id: l1-n5
                type: true_false
                text: "Lies das Wort. Kann man das singen?"
                say: "Lies das Wort. Kann man das singen?"
                show: { drawn: word-card, text: "Lied" }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Tom." }
            options: ["Tim", "Tom", "Tee"]
            answer: "Tom"
          - id: l1-c2
            type: true_false
            text: "Lies das Wort. Kann man darin schwimmen?"
            say: "Lies das Wort. Kann man darin schwimmen?"
            show: { drawn: word-card, text: "See" }
            answer: true
          - id: l1-c3
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Mut." }
            options: ["Mut", "Mus"]
            answer: "Mut"
          - id: l1-c4
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Mal." }
            options: ["Tal", "Mal", "Mus"]
            answer: "Mal"
          - id: l1-c5
            type: true_false
            text: "Lies das Wort. Ist das ein Tier?"
            say: "Lies das Wort. Ist das ein Tier?"
            show: { drawn: word-card, text: "Tee" }
            answer: false
          - id: l1-c6
            type: highlight_in_text
            text: "Tippe auf jedes Wort „Tim“."
            say: "Tippe auf jedes Wort Tim."
            show: { drawn: letter-card, text: "Tim Tom Tim Tee" }
            spans: ["Tim", "Tim"]

  - n: 2
    title: { de: Bis zum letzten Laut, en: To the last sound }
    goal:
      de: "Lies jedes Wort bis zum letzten Buchstaben. Mond und Mund sehen fast gleich aus."
      en: "Read every word right to the last letter. Mond and Mund look almost the same."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welches Wort hörst du?"
            audio: { de: "Tee." }
            options: ["Tee", "Tal"]
            answer: "Tee"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Lies das Wort. Kann man das trinken?"
            say: "Lies das Wort. Kann man das trinken?"
            show: { drawn: word-card, text: "Tal" }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "M o n d"
            say: "Bei manchen Wörtern stehen am Ende zwei Buchstaben hintereinander. Lies bis zum Schluss: mmm ... ooo ... nnn ... d. Mond."
            show: { drawn: letter-card, text: "M o n d" }
          - text: "Mond"
            say: "Mond. Lies jedes Mal bis zum letzten Buchstaben."
            show: { object: moon }
          - text: "Mund"
            say: "Hier steht in der Mitte ein u: mmm ... uuu ... nnn ... d. Mund. Ein Buchstabe anders, und es ist ein anderes Wort."
            show: { object: mouth }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Mund" }
                options: [{ object: moon }, { object: mouth }, { object: sun }]
                answer: mouth
                feedback:
                  moon: "Mond hat in der Mitte ein o. Hier steht ein u: Mund."
                hints:
                  - "Lies Laut für Laut, auch den Buchstaben in der Mitte."
                  - "Mmm ... uuu ... nnn ... d."
                  - "Da steht Mund."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Nest." }
                options: ["Nest", "Ast", "Mist"]
                answer: "Nest"
                hints:
                  - "Lies jedes Wort bis zum Ende."
                  - "Das Wort fängt mit nnn an."
                  - "Nnn ... eee ... sss ... t. Nest."
              - id: l2-f3
                type: fill_in_blank
                text: "Was fehlt am Ende?"
                say: "Nest. Was fehlt am Ende?"
                frame: "Nes_"
                options: ["t", "s", "n"]
                answer: ["t"]
                feedback:
                  n: "Nesn ist kein Wort. Sprich langsam bis zum Schluss: Nes ... t."
                hints:
                  - "Sprich das Wort ganz langsam bis zum Schluss."
                  - "Nnn ... eee ... sss ... und dann ganz kurz?"
                  - "Am Ende fehlt das t."
              - id: l2-f4
                type: true_false
                text: "Lies das Wort. Ist das ein Teil von einem Baum?"
                say: "Lies das Wort. Ist das ein Teil von einem Baum?"
                show: { drawn: word-card, text: "Ast" }
                answer: true
                hints:
                  - "Lies Laut für Laut."
                  - "Aaa ... sss ... t."
                  - "Da steht Ast. Ein Ast wächst am Baum. Ja."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies die Wörter."
                show: { object: moon }
                options: ["Mund", "Mond", "Sand"]
                option_audio: false
                answer: "Mond"
                hints:
                  - "Sag, was du auf dem Bild siehst. Dann such das Wort."
                  - "Mond hat in der Mitte ein o."
                  - "Mond."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Sand." }
                options: ["Sand", "Saal", "See"]
                answer: "Sand"
                hints: ["Sss ... aaa ... nnn ... d."]
              - id: l2-s2
                type: true_false
                text: "Lies das Wort. Ist das am Himmel?"
                say: "Lies das Wort. Ist das am Himmel?"
                show: { drawn: word-card, text: "Mond" }
                answer: true
                hints: ["In der Mitte steht ein o."]
              - id: l2-s3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Sand. Was fehlt?"
                frame: "Sa_d"
                options: ["n", "m", "t"]
                answer: ["n"]
                hints: ["Sss ... aaa ... und dann? Es klingt wie bei Mond."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Mond" }
                options: [{ object: mouth }, { object: star }, { object: moon }]
                answer: moon
                hints: ["Mmm ... ooo ... nnn ... d."]
              - id: l2-s5
                type: highlight_in_text
                text: "Tippe auf jedes Wort „Nest“."
                say: "Tippe auf jedes Wort Nest."
                show: { drawn: letter-card, text: "Nest Nes Nest Ast" }
                spans: ["Nest", "Nest"]
                hints: ["Nest hat am Ende ein t."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Wort passt zum Bild?"
                say: "Welches Wort passt zum Bild? Lies die Wörter."
                show: { object: mouth }
                options: ["Mond", "Mund", "Mus"]
                option_audio: false
                answer: "Mund"
              - id: l2-n2
                type: true_false
                text: "Lies das Wort. Kann man das essen?"
                say: "Lies das Wort. Kann man das essen?"
                show: { drawn: word-card, text: "Sand" }
                answer: false
              - id: l2-n3
                type: audio_choice
                text: "Welches Wort hörst du?"
                audio: { de: "Ast." }
                options: ["Nest", "Ast", "Tal"]
                answer: "Ast"
              - id: l2-n4
                type: fill_in_blank
                text: "Was fehlt am Ende?"
                say: "Ast. Was fehlt am Ende?"
                frame: "As_"
                options: ["t", "m", "n"]
                answer: ["t"]
              - id: l2-n5
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Mund" }
                options: [{ object: ear }, { object: mouth }, { object: moon }]
                answer: mouth

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: heard-word
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Mond." }
            options: ["Mund", "Mond", "Mus"]
            answer: "Mond"
          - id: l2-c2
            part: meaning
            type: true_false
            text: "Lies das Wort. Ist das ein Teil von deinem Körper?"
            say: "Lies das Wort. Ist das ein Teil von deinem Körper?"
            show: { drawn: word-card, text: "Mund" }
            answer: true
          - id: l2-c3
            part: heard-word
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Lied." }
            options: ["Lid", "Lied", "See"]
            answer: "Lied"
          - id: l2-c4
            part: meaning
            type: true_false
            text: "Lies das Wort. Wohnt darin ein Vogel?"
            say: "Lies das Wort. Wohnt darin ein Vogel?"
            show: { drawn: word-card, text: "Nest" }
            answer: true
          - id: l2-c5
            part: meaning
            type: true_false
            text: "Lies das Wort. Kann man das hören?"
            say: "Lies das Wort. Kann man das hören?"
            show: { drawn: word-card, text: "Lied" }
            answer: true
          - id: l2-c6
            part: heard-word
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Land." }
            options: ["Sand", "Lamm", "Land"]
            answer: "Land"
          - id: l2-c7
            part: heard-word
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Mann." }
            options: ["Mann", "Mond", "Mal"]
            answer: "Mann"
          - id: l2-c8
            part: heard-word
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Moos." }
            options: ["Mus", "Mut", "Moos"]
            answer: "Moos"
          - id: l2-c9
            part: heard-word
            type: audio_choice
            text: "Hör zu. Welches Wort ist das?"
            audio: { de: "Ton." }
            options: ["Tal", "Ton", "Tee"]
            answer: "Ton"
          - id: l2-c10
            part: meaning
            type: true_false
            text: "Lies das Wort. Ist das ein Tier?"
            say: "Lies das Wort. Ist das ein Tier?"
            show: { drawn: word-card, text: "Lamm" }
            answer: true
          - id: l2-c11
            part: meaning
            type: true_false
            text: "Lies das Wort. Kann man darauf sitzen?"
            say: "Lies das Wort. Kann man darauf sitzen?"
            show: { drawn: word-card, text: "Tee" }
            answer: false
          - id: l2-c12
            part: meaning
            type: true_false
            text: "Lies das Wort. Wächst das an einem Baum?"
            say: "Lies das Wort. Wächst das an einem Baum?"
            show: { drawn: word-card, text: "Tal" }
            answer: false
          - id: l2-c13
            part: meaning
            type: true_false
            text: "Lies das Wort. Ist das ein Name?"
            say: "Lies das Wort. Ist das ein Name?"
            show: { drawn: word-card, text: "Sand" }
            answer: false
          - id: l2-c14
            part: meaning
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Schau dir das Bild an. Welches Wort passt? Lies die Wörter."
            show: { object: lamb }
            options: ["Damm", "Lamm", "Mann"]
            option_audio: false
            answer: "Lamm"
          - id: l2-c15
            part: one-letter
            type: highlight_in_text
            text: "Tippe auf jedes Wort „Mund“."
            say: "Tippe auf jedes Wort Mund."
            show: { drawn: letter-card, text: "Mund Mond Mund Mus" }
            spans: ["Mund", "Mund"]
          - id: l2-c16
            part: one-letter
            type: highlight_in_text
            text: "Tippe auf jedes Wort „Sand“."
            say: "Tippe auf jedes Wort Sand."
            show: { drawn: letter-card, text: "Saal Sand Land Sand" }
            spans: ["Sand", "Sand"]
          - id: l2-c17
            part: one-letter
            type: true_false
            text: "Lies das Wort. Ist das ein Teil von deinem Gesicht?"
            say: "Lies das Wort. Ist das ein Teil von deinem Gesicht?"
            show: { drawn: word-card, text: "Mond" }
            answer: false
          - id: l2-c18
            part: one-letter
            type: matching
            text: "Was gehört zusammen?"
            say: "Lies die Wörter. Verbinde jedes Wort mit seinem Bild."
            option_audio: false
            pairs:
              - { left: { text: "Mond" }, right: { object: moon } }
              - { left: { text: "Mund" }, right: { object: mouth } }
              - { left: { text: "Lamm" }, right: { object: lamb } }
          - id: l2-c19
            part: one-letter
            type: true_false
            text: "Lies das Wort. Kann man das essen?"
            say: "Lies das Wort. Kann man das essen?"
            show: { drawn: word-card, text: "Mut" }
            answer: false
          - id: l2-c20
            part: one-letter
            type: highlight_in_text
            text: "Tippe auf jedes Wort „Tal“."
            say: "Tippe auf jedes Wort Tal."
            show: { drawn: letter-card, text: "Tal Mal Tee Tal" }
            spans: ["Tal", "Tal"]
