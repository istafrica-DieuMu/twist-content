# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.nouns-recognise
skill: lit-de.nouns.recognise
curriculum: de-DE
language: de
title:
  de: Nomen erkennen
  en: Recognising nouns
summary: >
  Children learn that Nomen are the names for people, animals, plants and
  things, and that a Nomen always starts with a capital letter. Lesson 1
  sorts pictures into Menschen, Tiere, Pflanzen and Dinge and picks the
  Nomen out of word groups, written in GROSSBUCHSTABEN so the capital
  letter does not give the Nomen away; lesson 2 uses the capital letter: find every
  Nomen in a short sentence, pick the right spelling, and ends with the
  skill check.
metadata:
  year: klasse-1
  topic: { de: Nomen, en: Nouns }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.word-picture]
  also_practises: [lit-de.vocabulary.categories]
  vocabulary: { de: [Nomen, Mensch, Tier, Pflanze, Ding, großschreiben] }
  forms: [picture, drawn, audio]
  drawn: [word-card, letter-card]
  facets: []
  parts:
    - { id: groups, what: { de: "Menschen, Tiere, Pflanzen und Dinge als Nomen erkennen", en: "recognising people, animals, plants and things as nouns" } }
    - { id: find, what: { de: Nomen unter anderen Wörtern und im Satz finden, en: finding nouns among other words and in a sentence } }
    - { id: capital, what: { de: "wissen, dass man Nomen großschreibt", en: knowing that nouns take a capital } }
  misconceptions:
    - id: only-things
      what: Thinks only things you can hold are Nomen, so people, animals and plants are left out
      addressed: "Learn names all four groups; sorting tasks need all four bins; l1-f3 asks if Oma is a Nomen, with hints that people are Nomen too"
    - id: first-word-only
      what: Thinks a capital letter just marks the first word, so every capital word is a Nomen and Nomen in the middle of a sentence are missed
      addressed: "l2-f1, l2-s1, l2-n1 and l2-c1 start with Der, Die or Das, which are not Nomen; Learn screen 3 and the l2-f1 hint say the first word is big because the sentence starts there; l2-n5 has Nomen in the middle (Lea, Kuchen)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Menschen, Tiere, Pflanzen, Dinge", en: "People, animals, plants, things" }
    goal:
      de: "Find Nomen, die Namen für Menschen, Tiere, Pflanzen und Dinge. Oma, Hund, Baum und Ball sind Nomen."
      en: "Find nouns, the names for people, animals, plants and things. Oma, Hund, Baum and Ball are nouns."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Hose" }
            options: [{ object: rose }, { object: trousers }]
            answer: trousers
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Tisch" }
            options: [{ object: fish }, { object: table }]
            answer: table
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was ist gleich?"
            say: "Ein Ball, ein Hund und eine Oma. Was glaubst du: Was haben die drei gemeinsam?"
            show: { objects: [ball, dog, grandma] }
          - text: "Nomen"
            say: "Sie haben alle einen Namen! Alles, was du sehen und anfassen kannst, hat einen Namen: der Tisch, der Ball. Solche Wörter heißen Nomen."
            show: { object: ball }
          - text: "Menschen und Tiere"
            say: "Auch Menschen und Tiere haben Namen: die Oma, das Kind, der Hund, die Katze. Das sind auch Nomen."
            show: { objects: [grandma, dog] }
          - text: "Pflanzen und Dinge"
            say: "Und Pflanzen: der Baum, die Rose. Menschen, Tiere, Pflanzen und Dinge: Das alles sind Nomen."
            show: { objects: [tree, rose] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Mensch, Tier oder Ding?"
                say: "Ist es ein Mensch, ein Tier oder ein Ding? Sortiere die Bilder."
                bins:
                  - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: grandma, bin: mensch }
                  - { object: cat, bin: tier }
                  - { object: cup, bin: ding }
                  - { object: baby, bin: mensch }
                  - { object: frog, bin: tier }
                  - { object: chair, bin: ding }
                hints:
                  - "Tippe auf ein Bild und hör das Wort. Lebt es? Ist es ein Mensch?"
                  - "Oma und Baby sind Menschen. Katze und Frosch sind Tiere."
                  - "Tasse und Stuhl sind Dinge."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo ist eine Pflanze?"
                say: "Wo ist eine Pflanze?"
                options: [{ object: tree }, { object: dog }, { object: ball }]
                answer: tree
                feedback:
                  ball: "Ein Ball wächst nicht aus der Erde. Schade, sonst gäbe es einen Ballgarten!"
                hints:
                  - "Eine Pflanze wächst aus der Erde."
                  - "Der Hund läuft, der Ball rollt. Was wächst?"
                  - "Der Baum ist eine Pflanze."
              - id: l1-f3
                type: true_false
                text: "Ist „OMA“ ein Nomen?"
                say: "Oma. Ist das Wort Oma ein Nomen?"
                show: { object: grandma }
                answer: true
                hints:
                  - "Nomen sind Namen für Menschen, Tiere, Pflanzen und Dinge."
                  - "Ist die Oma ein Mensch?"
                  - "Ja. Oma ist ein Mensch, also ist Oma ein Nomen."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Welches Wort ist ein Nomen?"
                options: ["LAUFEN", "KATZE", "SCHNELL"]
                answer: "KATZE"
                feedback:
                  LAUFEN: "Laufen ist etwas, das man tut. Das ist kein Nomen."
                  SCHNELL: "Schnell sagt, wie etwas ist. Das ist kein Nomen."
                hints:
                  - "Frag dich: Kann ich das sehen oder anfassen?"
                  - "Eine Katze kannst du sehen und streicheln. Und laufen oder schnell?"
                  - "Katze ist ein Nomen. Sie ist ein Tier."
              - id: l1-f5
                type: sorting
                text: "Tier oder Pflanze?"
                say: "Ist es ein Tier oder eine Pflanze? Sortiere die Bilder."
                bins:
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                options:
                  - { object: rose, bin: pflanze }
                  - { object: fir-tree, bin: pflanze }
                  - { object: rabbit, bin: tier }
                  - { object: snail, bin: tier }
                hints:
                  - "Tiere können sich bewegen. Pflanzen bleiben an ihrem Platz und wachsen."
                  - "Die Schnecke ist langsam, aber sie kriecht."
                  - "Rose und Tanne sind Pflanzen, Hase und Schnecke sind Tiere."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Welches Wort ist ein Nomen?"
                options: ["SPRINGEN", "ROT", "BALL"]
                answer: "BALL"
                hints: ["Kannst du das anfassen?"]
              - id: l1-s2
                type: sorting
                text: "Mensch, Tier, Pflanze oder Ding?"
                say: "Sortiere die Bilder: Mensch, Tier, Pflanze oder Ding."
                bins:
                  - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                  - { id: ding, show: { text: "Ding" }, say: "Ding" }
                options:
                  - { object: teacher, bin: mensch }
                  - { object: duck, bin: tier }
                  - { object: leaf, bin: pflanze }
                  - { object: scissors, bin: ding }
                hints: ["Die Lehrerin ist ein Mensch, die Ente ein Tier."]
              - id: l1-s3
                type: true_false
                text: "Ist „BAUM“ ein Nomen?"
                say: "Baum. Ist das Wort Baum ein Nomen?"
                show: { object: tree }
                answer: true
                hints: ["Ist ein Baum eine Pflanze?"]
              - id: l1-s4
                type: true_false
                text: "Ist „SINGEN“ ein Nomen?"
                say: "Singen. Ist das Wort singen ein Nomen?"
                show: { object: sing }
                answer: false
                hints: ["Singen ist etwas, das man tut. Das kannst du nicht anfassen."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Wo ist ein Mensch?"
                say: "Wo ist ein Mensch?"
                options: [{ object: monkey }, { object: doctor }, { object: snowman }]
                answer: doctor
                feedback:
                  snowman: "Ein Schneemann ist kein Mensch. Er schmilzt in der Sonne!"
                  monkey: "Der Affe sieht ein bisschen aus wie wir, aber er ist ein Tier."
                hints: ["Ein Schneemann sieht aus wie ein Mensch, aber er ist aus Schnee."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort ist ein Nomen?"
                say: "Welches Wort ist ein Nomen?"
                options: ["ROSE", "LESEN", "KLEIN"]
                answer: "ROSE"
              - id: l1-n2
                type: sorting
                text: "Mensch, Tier oder Pflanze?"
                say: "Sortiere die Bilder: Mensch, Tier oder Pflanze."
                bins:
                  - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                options:
                  - { object: grandpa, bin: mensch }
                  - { object: girl, bin: mensch }
                  - { object: hedgehog, bin: tier }
                  - { object: tree, bin: pflanze }
              - id: l1-n3
                type: true_false
                text: "Ist „SCHNELL“ ein Nomen?"
                say: "Schnell. Ist das Wort schnell ein Nomen?"
                show: { drawn: word-card, text: "SCHNELL" }
                answer: false
              - id: l1-n4
                type: image_multiple_choice
                text: "Wo ist ein Ding?"
                say: "Wo ist ein Ding? Kein Mensch, kein Tier, keine Pflanze."
                options: [{ object: rose }, { object: bird }, { object: pencil }]
                answer: pencil
              - id: l1-n5
                type: true_false
                text: "Ist „HUND“ ein Nomen?"
                say: "Hund. Ist das Wort Hund ein Nomen?"
                show: { object: dog }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["MALEN", "TASSE", "BUNT"]
            answer: "TASSE"
          - id: l1-c2
            type: true_false
            text: "Ist „KIND“ ein Nomen?"
            say: "Kind. Ist das Wort Kind ein Nomen?"
            show: { object: child }
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Wo ist eine Pflanze?"
            say: "Wo ist eine Pflanze?"
            options: [{ object: cat }, { object: rose }, { object: book }]
            answer: rose
          - id: l1-c4
            type: sorting
            text: "Tier oder Ding?"
            say: "Ist es ein Tier oder ein Ding? Sortiere die Bilder."
            bins:
              - { id: tier, show: { text: "Tier" }, say: "Tier" }
              - { id: ding, show: { text: "Ding" }, say: "Ding" }
            options:
              - { object: bucket, bin: ding }
              - { object: horse, bin: tier }
              - { object: spoon, bin: ding }
              - { object: mouse, bin: tier }
          - id: l1-c5
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["WINKEN", "DICK", "BUS"]
            answer: "BUS"
          - id: l1-c6
            type: true_false
            text: "Ist „PAPA“ ein Nomen?"
            say: "Papa. Ist das Wort Papa ein Nomen?"
            show: { object: dad }
            answer: true

  - n: 2
    title: { de: Nomen schreibt man groß, en: Nouns take a capital }
    goal:
      de: "Find die Nomen in einem Satz. Hund und Ball sind Nomen, darum schreibt man sie groß."
      en: "Find the nouns in a sentence. Hund and Ball are nouns, so they get capital letters."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["BAUM", "GEHEN"]
            answer: "BAUM"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Wo ist ein Tier?"
            say: "Wo ist ein Tier?"
            options: [{ object: chair }, { object: fox }]
            answer: fox
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "hund oder Hund?"
            say: "Was glaubst du: Wie schreibt man Hund, mit einem kleinen h oder mit einem großen H?"
            show: { object: dog }
          - text: "Hund"
            say: "Mit einem großen H! Nomen schreibt man groß. Der erste Buchstabe ist ein Großbuchstabe: H wie Hund."
            show: { drawn: word-card, text: "Hund" }
          - text: "Wusstest du? Dein Name ist auch ein Nomen."
            say: "Wusstest du? Auch dein Name ist ein Nomen. Darum fängt er immer mit einem großen Buchstaben an. Schreib ihn mal auf und schau nach!"
          - text: "Der Hund holt den Ball."
            say: "In diesem Satz sind zwei Nomen: Hund und Ball. Beide fangen groß an."
            show: { drawn: letter-card, text: "Der Hund holt den Ball." }
          - text: "Der"
            say: "Auch Der fängt groß an. Aber Der ist kein Nomen. Es steht am Satzanfang, darum schreibt man es groß."
            show: { drawn: letter-card, text: "Der Hund holt den Ball." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Der Ball rollt zur Katze. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Der Ball rollt zur Katze." }
                spans: ["Ball", "Katze."]
                hints:
                  - "Such die Namen für Menschen, Tiere, Pflanzen und Dinge."
                  - "Ein Ding und ein Tier. Der fängt nur groß an, weil der Satz damit beginnt."
                  - "Ball und Katze."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie schreibt man das Nomen?"
                say: "Wie schreibt man das Nomen Sonne?"
                show: { object: sun }
                options: ["Sonne", "sonne"]
                option_audio: false
                answer: "Sonne"
                feedback:
                  sonne: "Sonne ist ein Nomen. Nomen fangen immer mit einem großen Buchstaben an."
                hints:
                  - "Sonne ist ein Ding am Himmel. Also ist es ein Nomen."
                  - "Nomen schreibt man groß."
                  - "Sonne, mit großem S."
              - id: l2-f3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: word-card, text: "maus" }
                answer: false
                hints:
                  - "Ist Maus ein Nomen?"
                  - "Maus ist ein Tier. Wie fängt ein Nomen an?"
                  - "Nein. Maus schreibt man mit großem M."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Mama kauft Brot und Käse. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Mama kauft Brot und Käse." }
                spans: ["Mama", "Brot", "Käse."]
                hints:
                  - "Ein Mensch und zwei Dinge."
                  - "Die Wörter „kauft“ und „und“ sind keine Nomen."
                  - "Mama, Brot und Käse."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["lampe", "lesen", "leise"]
                option_audio: false
                answer: "lampe"
                hints:
                  - "Such das Nomen."
                  - "Was davon kannst du anfassen?"
                  - "Lampe ist ein Ding. Man schreibt es groß."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Die Ente frisst Brot. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Die Ente frisst Brot." }
                spans: ["Ente", "Brot."]
                hints: ["Ein Tier und ein Ding. Die ist kein Nomen."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie schreibt man das Nomen?"
                say: "Wie schreibt man das Nomen Hase?"
                show: { object: rabbit }
                options: ["hase", "Hase"]
                option_audio: false
                answer: "Hase"
                hints: ["Hase ist ein Tier."]
              - id: l2-s3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: word-card, text: "Tisch" }
                answer: true
                hints: ["Tisch ist ein Ding. Fängt es groß an?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["rot", "baum", "rennen"]
                option_audio: false
                answer: "baum"
                hints: ["Welches ist eine Pflanze?"]
              - id: l2-s5
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Opa liest ein Buch. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Opa liest ein Buch." }
                spans: ["Opa", "Buch."]
                hints: ["Ein Mensch und ein Ding."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Das Kind malt eine Blume. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Das Kind malt eine Blume." }
                spans: ["Kind", "Blume."]
              - id: l2-n2
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: word-card, text: "schuh" }
                answer: false
              - id: l2-n3
                type: multiple_choice
                text: "Wie schreibt man das Nomen?"
                say: "Wie schreibt man das Nomen Igel?"
                show: { object: hedgehog }
                options: ["Igel", "igel"]
                option_audio: false
                answer: "Igel"
              - id: l2-n4
                type: multiple_choice
                text: "Welches Wort schreibt man groß?"
                say: "Welches Wort schreibt man groß?"
                options: ["singen", "müde", "kuh"]
                option_audio: false
                answer: "kuh"
              - id: l2-n5
                type: highlight_in_text
                text: "Tippe auf jedes Nomen."
                say: "Papa und Lea backen einen Kuchen. Tippe auf jedes Nomen."
                show: { drawn: letter-card, text: "Papa und Lea backen einen Kuchen." }
                spans: ["Papa", "Lea", "Kuchen."]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c6
            part: groups
            type: image_multiple_choice
            text: "Wo ist ein Tier?"
            say: "Schau dir die Bilder an. Wo ist ein Tier?"
            options: [{ object: flower }, { object: kite }, { object: spider }]
            answer: spider
          - id: l2-c7
            part: groups
            type: sorting
            text: "Mensch oder Ding?"
            say: "Ist es ein Mensch oder ein Ding? Sortiere die Bilder."
            bins:
              - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
              - { id: ding, show: { text: "Ding" }, say: "Ding" }
            options:
              - { object: umbrella, bin: ding }
              - { object: police-officer, bin: mensch }
              - { object: kite, bin: ding }
              - { object: cook, bin: mensch }
          - id: l2-c8
            part: groups
            type: true_false
            text: "Ist „WURM“ ein Nomen?"
            say: "Wurm. Ist das Wort Wurm ein Nomen?"
            show: { object: worm }
            answer: true
          - id: l2-c9
            part: groups
            type: multiple_choice
            text: "„BLUME“ ist ein Nomen. Was ist eine Blume?"
            say: "Blume ist ein Nomen. Was ist eine Blume: ein Mensch, ein Tier, eine Pflanze oder ein Ding?"
            options: ["ein Mensch", "ein Tier", "eine Pflanze", "ein Ding"]
            keep_order: true
            answer: "eine Pflanze"
          - id: l2-c10
            part: groups
            type: sorting
            text: "Mensch, Tier, Pflanze oder Ding?"
            say: "Tippe auf jedes Bild und hör das Wort. Ist es ein Mensch, ein Tier, eine Pflanze oder ein Ding?"
            bins:
              - { id: mensch, show: { text: "Mensch" }, say: "Mensch" }
              - { id: tier, show: { text: "Tier" }, say: "Tier" }
              - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
              - { id: ding, show: { text: "Ding" }, say: "Ding" }
            options:
              - { object: present, bin: ding }
              - { object: queen, bin: mensch }
              - { object: wheat, bin: pflanze }
              - { object: owl, bin: tier }
          - id: l2-c11
            part: find
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Welches Wort ist ein Nomen?"
            options: ["GEHEN", "BLAU", "BIENE"]
            answer: "BIENE"
          - id: l2-c12
            part: find
            type: highlight_in_text
            text: "Tippe auf jedes Nomen."
            say: "Der Hase sitzt im Garten. Tippe auf jedes Nomen."
            show: { drawn: letter-card, text: "Der Hase sitzt im Garten." }
            spans: ["Hase", "Garten."]
          - id: l2-c13
            part: find
            type: highlight_in_text
            text: "Tippe auf jedes Nomen."
            say: "Lena gibt der Ziege ein Brot. Tippe auf jedes Nomen."
            show: { drawn: letter-card, text: "Lena gibt der Ziege ein Brot." }
            spans: ["Lena", "Ziege", "Brot."]
          - id: l2-c14
            part: find
            type: true_false
            text: "Ist „LEISE“ ein Nomen?"
            say: "Leise. Ist das Wort leise ein Nomen?"
            show: { drawn: word-card, text: "LEISE" }
            answer: false
          - id: l2-c15
            part: find
            type: multiple_choice
            text: "Wie viele Nomen stehen in dem Satz?"
