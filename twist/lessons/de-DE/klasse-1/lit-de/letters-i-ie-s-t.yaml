# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-i-ie-s-t
skill: lit-de.letters.i-ie-s-t
curriculum: de-DE
language: de
title:
  de: Die Buchstaben I, S, T und ie
  en: The letters I, S, T and ie
summary: >
  The second letter group in Fibel order. One lesson each for I, S and T:
  hear the sound, find it in words, see and trace the letter, practised in
  three stages. Lesson 4 brings ie as the spelling of the long iii (Biene,
  Ziege) and sets it against the short i in Fisch. Lesson 5 reads the
  first words made only of known letters (Mast, Tim, Salat, Lisa), sorts
  pictures by their first letter and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.l-o-a-m]
  also_practises:
    [lit-de.letters.l-o-a-m, lit-de.handwriting.print-letters, lit-de.decoding.one-syllable-words]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Großbuchstabe, Kleinbuchstabe, lang, kurz] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, word-card]
  sounds: ["de.m"]
  facets: [script]
  parts:
    - { id: i, what: { de: das I und das kurze i, en: the letter I and the short i } }
    - { id: ie, what: { de: ie für das lange iii, en: ie for the long ee sound } }
    - { id: s-t, what: { de: die Laute von S und T, en: the sounds of S and T } }
    - { id: words, what: { de: Wörter aus bekannten Buchstaben lesen, en: reading words made of known letters } }
  misconceptions:
    - id: s-sch
      what: Hears the sch at the start of Schuh or Schwein as S
      addressed: l2-f3, l2-s3 and l2-c3 set the humming sss against the rushing sch; the hints name the difference
    - id: short-long-i
      what: Thinks ie is a second, different sound and does not hear that it is just a long iii; or writes ie for the short i in Fisch
      addressed: lesson 4 Learn says ie sounds like a long iii; l4-f1, l4-s2 and l4-n2 set Biene against Fisch, Kiste and Tisch
    - id: i-ei
      what: Reads ei for ie because the same two letters swap places
      addressed: l4-f3, l4-s3 and l4-n4 put ie and ei side by side on the cards; ei itself comes with the group Ei, R, H, W
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das I, en: The letter I }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: de.m }
            options: ["M", "L", "O"]
            answer: "M"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Oma" }
            options: [{ object: llama }, { object: grandma }, { object: mum }]
            answer: grandma
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "I i"
            say: "Das ist das I. Es klingt so: iii. Wie bei Igel."
            show: { drawn: letter-card, text: "Ii" }
          - text: "Igel"
            say: "Igel. Iii-gel. Hörst du das iii am Anfang?"
            show: { object: hedgehog }
          - text: "Fisch"
            say: "Fisch. Hier steckt das i in der Mitte, ganz kurz: Fff ... i ... sch."
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was fängt mit I an?"
                options: [{ object: hedgehog }, { object: oven }, { object: monkey }]
                answer: hedgehog
                feedback:
                  oven: "Ofen fängt mit ooo an. Das ist das O."
                  monkey: "Affe fängt mit a an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Igel ... iii. Ofen ... ooo. Affe ... a."
                  - "Igel fängt mit I an."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du ein i?"
                say: "Fisch. Hörst du in dem Wort ein i?"
                show: { object: fish }
                answer: true
                hints:
                  - "Sag das Wort langsam: Fisch."
                  - "Fff ... i ... sch. Was hörst du in der Mitte?"
                  - "Ja, in Fisch hörst du ein i."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Hörst du ein i?"
                say: "Maus. Hörst du in dem Wort ein i?"
                show: { object: mouse }
                answer: false
                hints:
                  - "Sag das Wort langsam: Maus."
                  - "Mmm ... au ... sss. Ist ein i dabei?"
                  - "Nein, in Maus ist kein i."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes I."
                say: "Tippe auf jedes große und kleine I."
                show: { drawn: letter-card, text: "I a i O I" }
                spans: ["I", "i", "I"]
                hints:
                  - "Das große I ist ein gerader Strich."
                  - "Das kleine i hat einen Punkt."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l1-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Igel. Welcher Buchstabe fehlt?"
                show: { object: hedgehog }
                frame: "_gel"
                options: ["I", "A", "O"]
                answer: ["I"]
                hints:
                  - "Sprich das Wort langsam."
                  - "Iii ... gel. Welcher Laut fehlt vorne?"
                  - "Vorne fehlt das I."
              - id: l1-f6
                type: tracing
                text: "Schreib das I nach."
                show: { drawn: writing-lines, text: "I", mode: trace, arrows: true }
                char: "I"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Igel." }
                options: ["I", "A", "M"]
                answer: "I"
                hints: ["Iii-gel. Hör auf den Anfang."]
              - id: l1-s2
                type: true_false
                text: "Hörst du ein i?"
                say: "Kind. Hörst du in dem Wort ein i?"
                show: { object: child }
                answer: true
                hints: ["Sprich es langsam: K ... i ... nd."]
              - id: l1-s3
                type: true_false
                text: "Hörst du ein i?"
                say: "Hund. Hörst du in dem Wort ein i?"
                show: { object: dog }
                answer: false
                hints: ["Was hörst du nach dem h? Ist es ein i?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf jedes I."
                say: "Tippe auf jedes große und kleine I."
                show: { drawn: letter-card, text: "a I o i M" }
                spans: ["I", "i"]
                hints: ["Es sind zwei. Das kleine i hat einen Punkt."]
              - id: l1-s5
                type: tracing
                text: "Schreib das i nach."
                show: { drawn: writing-lines, text: "i", mode: trace, arrows: true }
                char: "i"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo hörst du ein i?"
                say: "In welchem Wort hörst du ein i?"
                options: [{ object: ball }, { object: fish }, { object: moon }]
                answer: fish
              - id: l1-n2
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Fisch. Welcher Buchstabe fehlt?"
                show: { object: fish }
                frame: "F_sch"
                options: ["i", "a", "o"]
                answer: ["i"]
              - id: l1-n3
                type: true_false
                text: "Hörst du am Anfang ein I?"
                say: "Ameise. Hörst du am Anfang ein iii?"
                show: { object: ant }
                answer: false
              - id: l1-n4
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Insel." }
                options: ["L", "I", "O"]
                answer: "I"
              - id: l1-n5
                type: tracing
                text: "Schreib das i ab."
                show: { drawn: writing-lines, text: "i", mode: copy, arrows: false }
                char: "i"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was fängt mit I an?"
            options: [{ object: apple }, { object: ear }, { object: hedgehog }]
            answer: hedgehog
          - id: l1-c2
            type: fill_in_blank
            text: "Welcher Buchstabe fehlt?"
            say: "Kind. Welcher Buchstabe fehlt?"
            show: { object: child }
            frame: "K_nd"
            options: ["a", "i", "o"]
            answer: ["i"]
          - id: l1-c3
            type: true_false
            text: "Hörst du ein i?"
            say: "Mund. Hörst du in dem Wort ein i?"
            show: { object: mouth }
            answer: false
          - id: l1-c4
            type: true_false
            text: "Hörst du ein i?"
            say: "Ring. Hörst du in dem Wort ein i?"
            show: { object: ring }
            answer: true
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf jedes I."
            say: "Tippe auf jedes große und kleine I."
            show: { drawn: letter-card, text: "I o i L i" }
            spans: ["I", "i", "i"]
          - id: l1-c6
            type: image_multiple_choice
            text: "Wo hörst du ein i?"
            say: "In welchem Wort hörst du ein i?"
            options: [{ object: moon }, { object: child }, { object: ball }]
            answer: child

  - n: 2
    title: { de: Das S, en: The letter S }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
