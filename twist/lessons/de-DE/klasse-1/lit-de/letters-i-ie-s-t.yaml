      - activity: learn
        mode: new-sound
        screens:
          - text: "S s"
            say: "Dieser Buchstabe klingt so: sss. Wie bei Sonne und Socke. Es summt wie eine Biene."
            show: { drawn: letter-card, text: "Ss" }
          - text: "Sonne"
            say: "Sonne. Sss-onne. Hörst du das sss am Anfang?"
            show: { object: sun }
          - text: "Socke"
            say: "Socke. Sss-ocke. Deine Zunge ist dabei hinter den Zähnen."
            show: { object: sock }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was fängt mit S an?"
