                answer: sock
                feedback:
                  fish: "Fisch fängt mit fff an. Das fff bläst, das sss summt."
                  mouse: "Maus fängt mit mmm an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Socke ... sss. Fisch ... fff. Maus ... mmm."
                  - "Socke fängt mit sss an."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hörst du am Anfang ein S?"
                say: "Saft. Hörst du am Anfang ein sss?"
                show: { object: juice }
                answer: true
                hints:
                  - "Sag das Wort mit: Saft."
                  - "Halte den ersten Laut lange: Sssaft."
                  - "Ja, Saft fängt mit sss an."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Hörst du am Anfang ein S?"
                say: "Schuh. Hörst du am Anfang ein sss?"
                show: { object: shoe }
                answer: false
                hints:
                  - "Sag das Wort mit: Schuh."
                  - "Sss summt wie eine Biene. Bei Schuh rauscht es: sch."
                  - "Nein, Schuh fängt mit sch an."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes S."
                say: "Tippe auf jedes große und kleine S."
                show: { drawn: letter-card, text: "S a s M S" }
                spans: ["S", "s", "S"]
                hints:
                  - "Das S sieht aus wie eine kleine Schlange."
                  - "Das kleine s sieht aus wie das große, nur kleiner."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l2-f5
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Sonne." }
                options: ["S", "M", "L"]
                answer: "S"
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach: Sssonne. Summt es?"
                  - "Es ist der Buchstabe, der aussieht wie eine Schlange."
              - id: l2-f6
                type: tracing
                text: "Schreib das S nach."
                show: { drawn: writing-lines, text: "S", mode: trace, arrows: true }
                char: "S"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was fängt mit S an?"
                options: [{ object: ear }, { object: saw }, { object: lion }]
                answer: saw
                hints: ["Säge ... sss."]
              - id: l2-s2
                type: true_false
                text: "Hörst du am Anfang ein S?"
                say: "Socke. Hörst du am Anfang ein sss?"
                show: { object: sock }
                answer: true
                hints: ["Sprich es langsam: Sssocke."]
              - id: l2-s3
                type: true_false
                text: "Hörst du am Anfang ein S?"
                say: "Schwein. Hörst du am Anfang ein sss?"
                show: { object: pig }
                answer: false
                hints: ["Summt es am Anfang, oder rauscht es: sch?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Sonne. Welcher Buchstabe fehlt?"
                show: { object: sun }
                frame: "_onne"
                options: ["S", "M", "O"]
                answer: ["S"]
                hints: ["Sss ... onne. Welcher Laut fehlt vorne?"]
              - id: l2-s5
                type: tracing
                text: "Schreib das s nach."
                show: { drawn: writing-lines, text: "s", mode: trace, arrows: true }
                char: "s"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was fängt mit S an?"
                options: [{ object: frog }, { object: ant }, { object: sofa }]
                answer: sofa
              - id: l2-n2
                type: true_false
                text: "Hörst du am Anfang ein S?"
                say: "Fisch. Hörst du am Anfang ein sss?"
                show: { object: fish }
                answer: false
                difficulty: easy
              - id: l2-n3
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Salat." }
                options: ["L", "S", "A"]
                answer: "S"
              - id: l2-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Säge. Welcher Buchstabe fehlt?"
                show: { object: saw }
                frame: "_äge"
                options: ["L", "S", "M"]
                answer: ["S"]
              - id: l2-n5
                type: tracing
                text: "Schreib das S ab."
                show: { drawn: writing-lines, text: "S", mode: copy, arrows: false }
                char: "S"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was fängt mit S an?"
            options: [{ object: mouse }, { object: juice }, { object: egg }]
            answer: juice
          - id: l2-c2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Igel." }
            options: ["S", "I"]
            answer: "I"
          - id: l2-c3
            type: true_false
            text: "Hörst du am Anfang ein S?"
            say: "Schere. Hörst du am Anfang ein sss?"
            show: { object: scissors }
            answer: false
          - id: l2-c4
            type: true_false
            text: "Hörst du am Anfang ein S?"
            say: "Sofa. Hörst du am Anfang ein sss?"
            show: { object: sofa }
            answer: true
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf jedes S."
            say: "Tippe auf jedes große und kleine S."
            show: { drawn: letter-card, text: "s I S t s" }
            spans: ["s", "S", "s"]
          - id: l2-c6
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Seil." }
            options: ["L", "S", "I"]
            answer: "S"

  - n: 3
    title: { de: Das T, en: The letter T }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: image_multiple_choice
            text: "Was fängt mit S an?"
            options: [{ object: sock }, { object: lamp }]
            answer: sock
            difficulty: easy
          - id: l3-w2
            type: true_false
            text: "Hörst du am Anfang ein S?"
            say: "Säge. Hörst du am Anfang ein sss?"
            show: { object: saw }
            answer: true
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "T t"
            say: "Dieser Buchstabe klingt ganz kurz: t. Wie bei Tisch und Tasse. Halte die Hand vor den Mund. Du spürst einen kleinen Hauch."
            show: { drawn: letter-card, text: "Tt" }
          - text: "Tisch"
            say: "Tisch. T ... isch. Das t ist kurz, du kannst es nicht lange halten."
            show: { object: table }
          - text: "Tasse"
            say: "Tasse. T ... asse."
            show: { object: cup }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit T an?"
                options: [{ object: cup }, { object: ball }, { object: sun }]
                answer: cup
                feedback:
                  ball: "Ball fängt mit b an. Die Lippen gehen dabei zu."
                  sun: "Sonne fängt mit sss an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Tasse ... t. Ball ... b. Sonne ... sss."
                  - "Tasse fängt mit t an."
                difficulty: easy
              - id: l3-f2
                type: true_false
                text: "Hörst du am Anfang ein T?"
                say: "Tanne. Hörst du am Anfang ein t?"
                show: { object: fir-tree }
                answer: true
                hints:
                  - "Sag das Wort mit: Tanne."
                  - "Halte die Hand vor den Mund. Spürst du am Anfang den kleinen Hauch?"
                  - "Ja, Tanne fängt mit t an."
                difficulty: easy
              - id: l3-f3
                type: true_false
                text: "Hörst du am Anfang ein T?"
                say: "Kanne. Hörst du am Anfang ein t?"
                show: { object: jug }
                answer: false
                hints:
                  - "Sag das Wort mit: Kanne. Es klingt fast wie Tanne."
                  - "Bei t tippt die Zunge vorne an die Zähne. Bei Kanne kommt der Laut von hinten: k."
                  - "Nein, Kanne fängt mit k an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes T."
                say: "Tippe auf jedes große und kleine T."
                show: { drawn: letter-card, text: "T a t L T" }
                spans: ["T", "t", "T"]
                hints:
                  - "Das große T hat oben einen Strich wie ein Dach."
                  - "Das kleine t sieht aus wie ein kleines Kreuz."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Tonne." }
                options: ["T", "S", "L"]
                answer: "T"
                hints:
                  - "Hör noch einmal hin."
                  - "Kannst du den ersten Laut lange halten? Nein, er ist kurz: t."
                  - "Es ist der Buchstabe mit dem Dach."
              - id: l3-f6
                type: tracing
                text: "Schreib das T nach."
                show: { drawn: writing-lines, text: "T", mode: trace, arrows: true }
                char: "T"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Was fängt mit T an?"
                options: [{ object: telephone }, { object: house }, { object: apple }]
                answer: telephone
                hints: ["Telefon ... t."]
              - id: l3-s2
                type: true_false
                text: "Hörst du am Anfang ein T?"
                say: "Tonne. Hörst du am Anfang ein t?"
                show: { object: bin }
                answer: true
                hints: ["Spürst du den kleinen Hauch am Anfang?"]
              - id: l3-s3
                type: true_false
                text: "Hörst du am Anfang ein T?"
                say: "Sonne. Hörst du am Anfang ein t?"
                show: { object: sun }
                answer: false
                hints: ["Kannst du den ersten Laut lange halten? Dann ist es kein t."]
              - id: l3-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tisch. Welcher Buchstabe fehlt?"
                show: { object: table }
                frame: "_isch"
                options: ["T", "S", "M"]
                answer: ["T"]
                hints: ["T ... isch. Welcher Laut fehlt vorne?"]
              - id: l3-s5
                type: tracing
                text: "Schreib das t nach."
                show: { drawn: writing-lines, text: "t", mode: trace, arrows: true }
                char: "t"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: image_multiple_choice
                text: "Was fängt mit T an?"
                options: [{ object: rose }, { object: fir-tree }, { object: egg }]
                answer: fir-tree
              - id: l3-n2
                type: true_false
                text: "Hörst du am Anfang ein T?"
                say: "Teddy. Hörst du am Anfang ein t?"
                show: { object: teddy }
                answer: true
                difficulty: easy
              - id: l3-n3
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Tomate." }
                show: { object: tomato }
                options: ["M", "O", "T"]
                answer: "T"
              - id: l3-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Tonne. Welcher Buchstabe fehlt?"
                show: { object: bin }
                frame: "_onne"
                options: ["S", "T", "M"]
                answer: ["T"]
                difficulty: stretch
              - id: l3-n5
