# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-ng-nk-qu-v
skill: lit-de.letters.ng-nk-qu-v
curriculum: de-DE
language: de
title:
  de: ng, nk, Qu und V
  en: ng, nk, Qu and V
summary: >
  The letter group after St, Sp and Pf. Lesson 1: ng is one sound made at
  the back of the mouth, with no g to hear (Schlange, Junge, Ring), and nk
  is that sound with a k after it (Anker, Bank); the child hears which one
  it is and keeps ng apart from a plain n. Lesson 2: Qu always comes as Q
  and u together and sounds kw (Qualle, Quadrat); V mostly sounds f
  (Vogel, Vater) and sometimes w (Pullover), so V words are learnt as
  Merkwörter. Lesson 3 reads and sorts words with all four and ends with
  the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.st-sp-pf]
  also_practises:
    [lit-de.letters.st-sp-pf, lit-de.handwriting.print-letters, lit-de.spelling.write-by-sound]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Merkwort, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, word-card, syllable-arcs, shape]
  sounds: []
  facets: [script]
  parts:
    - { id: ng-nk, what: { de: ng und nk hören und unterscheiden, en: hearing ng and nk and telling them apart } }
    - { id: qu, what: { de: "Qu: Man hört kw und schreibt Qu", en: "Qu: you hear kw and write Qu" } }
    - { id: v, what: { de: "V als Merkwort: Es klingt wie f oder w", en: "V as a word to remember: it sounds like f or w" } }
    - { id: words, what: { de: "Wörter mit ng, nk, Qu und V lesen", en: "reading words with ng, nk, Qu and V" } }
  misconceptions:
    - id: ng-as-n
      what: Hears ng as a plain n or as n and g, and writes Rin or Ringk for Ring
      addressed: lesson 1 Learn says there is no g to hear; l1-f1, l1-f2, l1-f5, l1-n2 and l1-c3 offer n, with feedback on l1-f1 and l1-f2; singen against sinken in l3-f3 and l3-s2
    - id: ng-nk
      what: Mixes up ng and nk (Bang for Bank, Rink for Ring)
      addressed: l1-f2, l1-s1, l1-n1, l1-n3 and l1-c2 ask ng or nk; l3-f1 sorts them; l3-s4 and the skill check tasks l3-c2 and l3-c3 ask again
    - id: qu-kw
      what: Writes Kw for the kw sound, or Q without the u
      addressed: lesson 2 Learn says Q never comes alone; l2-f1, l2-f5, l2-s1, l2-n1, l3-f4, l3-s5 and the skill check task l3-c4 offer Kw or Q as a distractor
    - id: v-as-f
      what: Writes F for V in Vogel and Vater, or W for the V in Pullover
      addressed: lesson 2 Learn names V words as Merkwörter and shows V spoken as w in Pullover and Vase; l2-f4, l2-s4, l2-n2, l2-c6 and l3-c8 offer F, l2-c2 and l3-c8 offer W, l2-s2 and l3-n3 deal with V spoken as w
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: ng und nk, en: ng and nk }
    goal:
      de: "Hör den Laut ganz hinten im Mund, wie in Schlange und Ring. Bei Anker und Bank kommt noch ein K dazu."
      en: "Hear the sound at the back of your mouth in Schlange and Ring. In Anker and Bank a K follows it."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Spinne." }
            options: ["Sp", "St", "Sch"]
            answer: "Sp"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Stuhl" }
            options: [{ object: table }, { object: chair }, { object: star }]
            answer: chair
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Schlange"
            say: "Hör gut zu: Schlange. Was glaubst du: Hörst du in Schlange ein g?"
            show: { object: snake }
          - text: "ng"
            say: "Nein, ein g hörst du nicht! Und doch steht es da. Hier stehen n und g zusammen: ng. Die beiden klingen wie ein Laut, ganz hinten im Mund: ng."
            show: { drawn: letter-card, text: "ng" }
          - text: "Ring"
            say: "Ring. Hörst du das ng am Ende? Ring."
            show: { object: ring }
          - text: "nk"
            say: "Hier stehen n und k zusammen: nk. Erst kommt das ng, dann ein k. Wie bei Anker."
            show: { object: anchor }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wo hörst du ng?"
                say: "In welchem Wort hörst du ein ng?"
                options: [{ object: snake }, { object: nose }, { object: bin }]
                answer: snake
                feedback:
                  nose: "Nase fängt mit nnn an. Ein ng hörst du da nicht."
                  bin: "Bei Tonne hörst du nnn, aber kein ng."
                hints:
                  - "Sprich jedes Wort langsam. Klingt es irgendwo ganz hinten im Mund?"
                  - "Schlange ... ng. Nase ... nnn. Tonne ... nnn."
                  - "In Schlange hörst du ein ng."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wie hört das Wort auf?"
                audio: { de: "Ring." }
                show: { object: ring }
                options: ["n", "ng", "nk"]
                answer: "ng"
                feedback:
                  n: "Hör genau hin: Am Ende klingt es hinten im Mund. Das ist ng."
                  nk: "Am Ende von Ring kommt kein k."
                hints:
                  - "Hör noch einmal hin."
                  - "Sprich es nach: Ring. Klingt das Ende hinten im Mund? Kommt noch ein k?"
                  - "Ring hört mit ng auf."
              - id: l1-f3
                type: true_false
                text: "Hörst du ng?"
                say: "Junge. Hörst du in dem Wort ein ng?"
                show: { object: boy }
                answer: true
                hints:
                  - "Sag das Wort mit: Junge."
                  - "Ju ... nge. Klingt es in der Mitte hinten im Mund?"
                  - "Ja, in Junge hörst du ein ng."
                difficulty: easy
              - id: l1-f4
                type: true_false
                text: "Hörst du nk?"
                say: "Ente. Hörst du in dem Wort ein nk?"
                show: { object: duck }
                answer: false
                hints:
                  - "Sag das Wort mit: Ente."
                  - "En ... te. Kommt nach dem n ein k oder ein t?"
                  - "Nein, bei Ente kommt nach dem n ein t."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Schlange. Was fehlt in dem Wort?"
                show: { object: snake }
                frame: "Schla_e"
                options: ["n", "nk", "ng"]
                answer: ["ng"]
                hints:
                  - "Sprich das Wort langsam: Schlange."
                  - "In der Mitte klingt es hinten im Mund. Hörst du ein k?"
                  - "Es fehlt ng."
              - id: l1-f6
                type: tracing
                text: "Schreib ng nach."
                show: { drawn: writing-lines, text: "ng", mode: trace, arrows: true }
                char: "ng"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "ng oder nk?"
                audio: { de: "Bank." }
                show: { object: bench }
                options: ["ng", "nk"]
                answer: "nk"
                hints: ["Hörst du am Ende noch ein k?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo hörst du nk?"
                say: "In welchem Wort hörst du ein nk?"
                options: [{ object: snake }, { object: anchor }, { object: nose }]
                answer: anchor
                hints: ["Erst ng, dann ein k: Wo hörst du das?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf jedes ng."
                say: "Tippe auf jede Karte mit n und g."
                show: { drawn: letter-card, text: "ng nk ng n ng" }
                spans: ["ng", "ng", "ng"]
                hints: ["Es sind drei. Nach dem n muss ein g stehen."]
              - id: l1-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Singen. Was fehlt in dem Wort?"
                show: { object: sing }
                frame: "si_en"
                options: ["nk", "ng"]
                answer: ["ng"]
                hints: ["Si ... ngen. Hörst du ein k?"]
              - id: l1-s5
                type: tracing
                text: "Schreib nk nach."
                show: { drawn: writing-lines, text: "nk", mode: trace, arrows: true }
                char: "nk"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "ng oder nk?"
                audio: { de: "Schrank." }
                show: { object: cupboard }
                options: ["nk", "ng"]
                answer: "nk"
              - id: l1-n2
                type: audio_choice
                text: "Wie hört das Wort auf?"
                audio: { de: "lang." }
                options: ["nk", "n", "ng"]
                answer: "ng"
              - id: l1-n3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Anker. Was fehlt in dem Wort?"
                show: { object: anchor }
                frame: "A_er"
                options: ["ng", "n", "nk"]
                answer: ["nk"]
              - id: l1-n4
                type: true_false
                text: "Hörst du nk?"
                say: "Winken. Hörst du in dem Wort ein nk?"
                show: { object: wave }
                answer: true
              - id: l1-n5
                type: tracing
                text: "Schreib nk ab."
                show: { drawn: writing-lines, text: "nk", mode: copy, arrows: false }
                char: "nk"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo hörst du ng?"
            say: "In welchem Wort hörst du ein ng?"
            options: [{ object: bin }, { object: boy }, { object: nose }]
            answer: boy
          - id: l1-c2
            type: audio_choice
            text: "ng oder nk?"
            audio: { de: "trinken." }
            options: ["ng", "nk"]
            answer: "nk"
          - id: l1-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Ring. Was fehlt am Ende?"
            show: { object: ring }
            frame: "Ri_"
            options: ["n", "ng", "nk"]
            answer: ["ng"]
          - id: l1-c4
            type: true_false
            text: "Hörst du ng?"
            say: "Nase. Hörst du in dem Wort ein ng?"
            show: { object: nose }
            answer: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf jedes ng."
            say: "Tippe auf jede Karte mit n und g."
            show: { drawn: letter-card, text: "n ng nk ng" }
            spans: ["ng", "ng"]
          - id: l1-c6
            type: audio_choice
            text: "ng oder nk?"
            audio: { de: "Finger." }
            options: ["nk", "ng"]
            answer: "ng"

  - n: 2
    title: { de: Qu und V, en: Qu and V }
    goal:
      de: "Lerne zwei seltene Buchstaben kennen. Nach dem Q kommt immer ein U, wie bei Qualle, und Vogel schreibt man mit V."
      en: "Meet two rare letters. Q always has a U after it, as in Qualle, and Vogel is written with V."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "ng oder nk?"
            audio: { de: "Zunge." }
            options: ["ng", "nk"]
            answer: "ng"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Wo hörst du nk?"
            say: "In welchem Wort hörst du ein nk?"
            options: [{ object: boy }, { object: anchor }]
            answer: anchor
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "Q _"
            say: "Das ist das Q. Es ist ein bisschen schüchtern. Was glaubst du: Welcher Buchstabe steht immer direkt hinter ihm?"
            show: { drawn: letter-card, text: "Q _" }
          - text: "Qu qu"
            say: "Das Q steht nie allein. Nach dem Q kommt immer ein u: Qu. Zusammen klingen sie wie kw. Wie bei Qualle."
            show: { drawn: letter-card, text: "Qu qu" }
          - text: "Qualle"
            say: "Qualle. Kw ... alle. Du hörst kw und schreibst Qu."
            show: { object: jellyfish }
          - text: "Wusstest du? Das Q ist der seltenste Buchstabe im Deutschen."
            say: "Wusstest du? Kein Buchstabe kommt in deutschen Texten so selten vor wie das Q. Der häufigste Buchstabe ist das e."
            show: { drawn: letter-card, text: "Q e" }
          - text: "Quadrat"
            say: "Quadrat. Kw ... adrat. Du hörst kw und schreibst Qu."
            show: { drawn: shape, kind: square }
          - text: "V v"
            say: "Das V klingt meistens wie f, wie bei Vogel und Vater. Du hörst ein f und schreibst trotzdem ein V. Solche Wörter musst du dir merken. Das sind Merkwörter."
            show: { object: bird }
          - text: "Pullover"
            say: "In manchen Wörtern klingt das V wie w. Pullover. Auch hier schreibst du ein v."
            show: { object: jumper }
          - text: "Vase"
            say: "Vase. Auch hier klingt das V wie w. Vase ist ein Merkwort."
            show: { object: vase }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Qualle." }
                show: { object: jellyfish }
                options: ["K", "Qu", "Kw"]
                answer: "Qu"
                feedback:
                  Kw: "Du hörst kw. Geschrieben wird es aber Qu."
                  K: "Nach dem k hörst du noch ein w. Das schreibst du Qu."
                hints:
                  - "Hör noch einmal hin."
                  - "Hörst du am Anfang kw? Das schreibst du immer gleich."
                  - "Kw schreibt man Qu."
              - id: l2-f2
                type: true_false
                text: "Hörst du am Anfang kw?"
                say: "Quadrat. Hörst du am Anfang ein kw?"
                show: { drawn: shape, kind: square }
                answer: true
                hints:
                  - "Sag das Wort mit: Quadrat."
                  - "Kw ... adrat. Kommt nach dem k ein w?"
                  - "Ja, Quadrat fängt mit kw an. Man schreibt Qu."
                difficulty: easy
              - id: l2-f3
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Vogel" }
                options: [{ object: frog }, { object: bird }, { object: fox }]
                answer: bird
                feedback:
                  frog: "Ein Frosch mit Flügeln? Frosch fängt mit F an. Auf der Karte steht ein V."
                hints:
                  - "Das V am Anfang liest du wie f."
                  - "Fff ... o ... gel."
                  - "Vogel."
                difficulty: easy
              - id: l2-f4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Vogel. Was fehlt am Anfang?"
                show: { object: bird }
                frame: "_ogel"
                options: ["F", "V", "W"]
                answer: ["V"]
                hints:
                  - "Du hörst f. Aber Vogel ist ein Merkwort."
                  - "Vogel, Vater, vier: Diese Merkwörter schreibst du mit V."
                  - "Vogel schreibt man mit V."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben? Lies genau."
                show: { object: jellyfish }
                options: ["Kwalle", "Qualle", "Qalle"]
                answer: "Qualle"
                option_audio: false
                feedback:
                  Kwalle: "Kw schreibt man Qu."
                  Qalle: "Nach dem Q kommt immer ein u."
                hints:
                  - "Wie schreibt man kw?"
                  - "Kw schreibt man Q und u."
                  - "Qualle."
              - id: l2-f6
                type: tracing
                text: "Schreib Qu nach."
                show: { drawn: writing-lines, text: "Qu", mode: trace, arrows: true }
                char: "Qu"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Quark." }
                options: ["Kw", "K", "Qu"]
                answer: "Qu"
                hints: ["Kw am Anfang schreibt man immer gleich."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Pullover", syllables: ["Pul", "lo", "ver"] }
                options: [{ object: jacket }, { object: jumper }, { object: dress }]
                answer: jumper
                hints: ["Pul ... lo ... ver. Hier klingt das v wie w."]
              - id: l2-s3
                type: highlight_in_text
                text: "Tippe auf jedes V."
                say: "Tippe auf jede Karte mit einem großen oder kleinen V."
                show: { drawn: letter-card, text: "V F v W V" }
                spans: ["V", "v", "V"]
                hints: ["Es sind drei. Das V ist unten spitz."]
              - id: l2-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Vater. Was fehlt am Anfang?"
                show: { object: dad }
                frame: "_ater"
                options: ["V", "F"]
                answer: ["V"]
                hints: ["Vater ist ein Merkwort wie Vogel."]
              - id: l2-s5
                type: tracing
                text: "Schreib V nach."
                show: { drawn: writing-lines, text: "V", mode: trace, arrows: true }
                char: "V"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Wie fängt das Wort an?"
                audio: { de: "Quelle." }
                options: ["Qu", "Kw", "Gu"]
                answer: "Qu"
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben? Lies genau."
                options: ["Fogel", "Wogel", "Vogel"]
                answer: "Vogel"
                option_audio: false
              - id: l2-n3
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: word-card, text: "Quadrat" }
                options: [{ drawn: shape, kind: triangle }, { drawn: shape, kind: square }, { drawn: shape, kind: circle }]
                answer: square
                difficulty: stretch
              - id: l2-n4
                type: true_false
                text: "Hör zu. Steht dieses Wort auf der Karte?"
                show: { drawn: word-card, text: "Vater" }
                audio: { de: "Vase." }
                answer: false
              - id: l2-n5
                type: tracing
                text: "Schreib v ab."
                show: { drawn: writing-lines, text: "v", mode: copy, arrows: false }
                char: "v"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Quatsch." }
            options: ["Kw", "Qu"]
            answer: "Qu"
          - id: l2-c2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Vase. Was fehlt am Anfang?"
            show: { object: vase }
            frame: "_ase"
            options: ["W", "V"]
            answer: ["V"]
          - id: l2-c3
            type: true_false
            text: "Hörst du am Anfang kw?"
            say: "Kuh. Hörst du am Anfang ein kw?"
            show: { object: cow }
            answer: false
          - id: l2-c4
            type: image_multiple_choice
            text: "Was fängt mit Qu an?"
            options: [{ object: cow }, { object: crown }, { object: jellyfish }]
            answer: jellyfish
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf jedes Qu."
            say: "Tippe auf jede Karte mit Q und u."
            show: { drawn: letter-card, text: "qu Q Qu K qu" }
            spans: ["qu", "Qu", "qu"]
          - id: l2-c6
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            show: { object: dad }
            options: ["Fater", "Vater", "Water"]
            answer: "Vater"
            option_audio: false

  - n: 3
    title: { de: "Wörter mit ng, nk, Qu und V", en: "Words with ng, nk, Qu and V" }
    goal:
      de: "Lies und sortier Wörter wie Ring, Bank, Qualle und Vogel."
      en: "Read and sort words like Ring, Bank, Qualle and Vogel."
    new_content: false
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "Wie fängt das Wort an?"
            audio: { de: "Quelle." }
            options: ["K", "Qu"]
            answer: "Qu"
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Vogel" }
            options: [{ object: cat }, { object: bird }]
            answer: bird
            difficulty: easy

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: sorting
                text: "ng oder nk?"
                say: "Hörst du ng oder nk? Tippe auf ein Bild und dann auf die Buchstaben."
                bins:
                  - { id: ng, show: { text: "ng" } }
                  - { id: nk, show: { text: "nk" } }
                options:
                  - { object: snake, bin: ng }
                  - { object: anchor, bin: nk }
                  - { object: boy, bin: ng }
                  - { object: wave, bin: nk }
                  - { object: ring, bin: ng }
                  - { object: bench, bin: nk }
                hints:
                  - "Tippe auf jedes Bild und hör genau hin."
                  - "Hörst du nach dem ng noch ein k? Dann ist es nk."
                  - "Schlange, Junge und Ring: ng. Anker, winken und Bank: nk."
              - id: l3-f2
                type: image_multiple_choice
                text: "Lies das Wort. Welches Bild passt?"
                show: { drawn: syllable-arcs, word: "Schlange", syllables: ["Schlan", "ge"] }
                options: [{ object: snail }, { object: snake }, { object: star }]
                answer: snake
                hints:
                  - "Lies Bogen für Bogen."
                  - "Schlan ... ge."
                  - "Schlange."
                difficulty: easy
              - id: l3-f3
                type: audio_choice
                text: "Welches Wort hörst du?"
                say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
                audio: { de: "sinken." }
                options: ["singen", "sinken", "Sonne"]
                answer: "sinken"
                feedback:
                  singen: "Hör genau hin: Nach dem ng kommt noch ein k."
                hints:
                  - "Hör auf die Mitte des Wortes."
                  - "Hörst du ng oder nk?"
                  - "Du hörst nk: sinken."
