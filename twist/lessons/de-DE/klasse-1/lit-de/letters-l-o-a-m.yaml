# Model lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-l-o-a-m
skill: lit-de.letters.l-o-a-m
curriculum: de-DE
language: de
title:
  de: Die Buchstaben L, O, A und M
  en: The letters L, O, A and M
summary: >
  The first four letters in Fibel order, chosen because their sounds can be
  held (lll, ooo, aaa, mmm) and they make words at once: Oma, Mama, Lama.
  One lesson per letter: hear the sound, find it at the start of words, see
  and trace the letter, practised in three stages (full hints, one hint, no
  hints). The fifth lesson blends the first syllables, reads three words and
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.sound-chart, lit-de.phonological.initial-sound]
  also_practises:
    [lit-de.handwriting.print-letters, lit-de.decoding.blend-syllables]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Silbe, Großbuchstabe, Kleinbuchstabe] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds:
    [
      "de.l",
      "de.o:",
      "de.a:",
      "de.a",
      "de.m",
      "de.ma",
      "de.mo",
      "de.la",
      "de.lo",
      "de.al",
      "de.om",
    ]
  facets: [script]
  misconceptions:
    - id: letter-name
      what: Says the letter name (El, Em) instead of the sound (lll, mmm), which blocks blending
      addressed: Learn always plays the sound, never the name; hints repeat the sound
    - id: o-a-confusion
      what: Mixes up O and A by shape and sound
      addressed: lesson 3 sets O against A in every stage; the skill check asks both
    - id: m-n-later
      what: Confuses M with N later
      addressed: not yet; N comes with the group E, N, D, U, where it is contrasted with M
  twist_reuse: []
  status: draft
  version: 2
  authored: 2026-10-12

lessons:
  - n: 1
    title: { de: Das L, en: The letter L }
    new_content: true
    activities:
      - activity: learn
        mode: new-sound
        screens:
          - text: "L l"
            say: "Dieser Buchstabe klingt so: lll. Wie bei Lama und Löwe."
            show: { drawn: letter-card, text: "Ll" }
            sound: de.l
          - text: "Lama"
            say: "Lama. Hörst du das lll am Anfang?"
            show: { object: llama }
          - text: "Löwe"
            say: "Löwe. Lll, Löwe."
            show: { object: lion }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was fängt mit L an?"
                options: [{ object: lamp }, { object: sun }, { object: fish }]
                answer: lamp
                feedback:
                  sun: "Sonne fängt mit sss an."
                  fish: "Fisch fängt mit fff an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Lampe ... lll. Sonne ... sss. Fisch ... fff."
                  - "Lampe fängt mit lll an."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du am Anfang ein L?"
                say: "Leiter. Hörst du am Anfang ein lll?"
                show: { object: ladder }
                answer: true
                hints:
                  - "Sag das Wort mit: Leiter."
                  - "Halte den ersten Laut lange: Lllleiter."
                  - "Ja, Leiter fängt mit lll an."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Hörst du am Anfang ein L?"
                say: "Baum. Hörst du am Anfang ein lll?"
                show: { object: tree }
                answer: false
                hints:
                  - "Sag das Wort mit: Baum."
                  - "Am Anfang gehen deine Lippen zu: b."
                  - "Nein, Baum fängt mit b an."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes L."
                say: "Tippe auf jeden Buchstaben für lll, groß und klein."
                show: { drawn: letter-card, text: "L o l M L a" }
                spans: ["L", "l", "L"]
                hints:
                  - "Das große L sieht aus wie eine Ecke."
                  - "Das kleine l ist ein langer Strich."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l1-f5
                type: audio_choice
                text: "Welcher Buchstabe klingt so?"
                audio: { sound: de.l }
                options: ["L", "M", "S"]
                answer: "L"
                hints:
                  - "Hör noch einmal hin."
                  - "Lll wie Lama."
                  - "Das ist der Buchstabe, der wie eine Ecke aussieht."
              - id: l1-f6
                type: tracing
                text: "Schreib das l nach."
                show: { drawn: writing-lines, text: "l", mode: trace, arrows: true }
                char: "l"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was fängt mit L an?"
                options: [{ object: egg }, { object: spoon }, { object: dog }]
                answer: spoon
                hints: ["Löffel ... lll."]
              - id: l1-s2
                type: true_false
                text: "Hörst du am Anfang ein L?"
                say: "Luftballon. Hörst du am Anfang ein lll?"
                show: { object: balloon }
                answer: true
                hints: ["Sprich es langsam: Lllluftballon."]
              - id: l1-s3
                type: true_false
                text: "Hörst du am Anfang ein L?"
                say: "Buch. Hörst du am Anfang ein lll?"
                show: { object: book }
                answer: false
                hints: ["Gehen deine Lippen am Anfang zu?"]
              - id: l1-s4
                type: highlight_in_text
                text: "Tippe auf jedes L."
                say: "Tippe auf jeden Buchstaben für lll, groß und klein."
                show: { drawn: letter-card, text: "a L m l O" }
                spans: ["L", "l"]
                hints: ["Es sind zwei."]
              - id: l1-s5
                type: tracing
                text: "Schreib das L nach."
                show: { drawn: writing-lines, text: "L", mode: trace, arrows: true }
                char: "L"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was fängt mit L an?"
                options: [{ object: house }, { object: banana }, { object: lion }]
                answer: lion
              - id: l1-n2
                type: true_false
                text: "Hörst du am Anfang ein L?"
                say: "Fisch. Hörst du am Anfang ein lll?"
                show: { object: fish }
                answer: false
                difficulty: easy
              - id: l1-n3
                type: image_multiple_choice
                text: "Was fängt mit L an?"
                options: [{ object: llama }, { object: tree }, { object: sun }]
                answer: llama
              - id: l1-n4
                type: audio_choice
                text: "Welcher Buchstabe klingt so?"
                audio: { sound: de.l }
                options: ["O", "L", "A"]
                answer: "L"
              - id: l1-n5
                type: tracing
                text: "Schreib das l ab."
                show: { drawn: writing-lines, text: "l", mode: copy, arrows: false }
                char: "l"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was fängt mit L an?"
            options: [{ object: ladder }, { object: egg }, { object: fish }]
            answer: ladder
          - id: l1-c2
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: de.l }
            options: ["M", "L", "S"]
            answer: "L"
          - id: l1-c3
            type: true_false
            text: "Hörst du am Anfang ein L?"
            say: "Löwe. Hörst du am Anfang ein lll?"
            show: { object: lion }
            answer: true

  - n: 2
    title: { de: Das O, en: The letter O }
    new_content: true
    activities:
      - activity: warm-up
