                options: [{ object: oven }, { object: mouse }, { object: banana }]
                answer: oven
                feedback:
                  mouse: "Maus fängt mit mmm an."
                  banana: "Banane fängt mit b an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Ofen ... ooo. Maus ... mmm. Banane ... b."
                  - "Ofen fängt mit O an."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hörst du am Anfang ein O?"
                say: "Ohr. Hörst du am Anfang ein ooo?"
                show: { object: ear }
                answer: true
                hints:
                  - "Sag das Wort mit: Ohr."
                  - "Ist dein Mund am Anfang rund?"
                  - "Ja, Ohr fängt mit O an."
                difficulty: easy
              - id: l2-f3
                type: audio_choice
                text: "Welcher Buchstabe klingt so?"
                audio: { sound: "de.o:" }
                options: ["O", "L", "A"]
                answer: "O"
                hints:
                  - "Hör noch einmal hin."
                  - "Mach den Laut nach. Dein Mund wird rund."
                  - "Rund wie der Buchstabe: Das ist das O."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes O."
                say: "Tippe auf jedes große und kleine O."
                show: { drawn: letter-card, text: "O a o L O" }
                spans: ["O", "o", "O"]
                hints:
                  - "Das O ist ein Kreis."
                  - "Das große O und das kleine o sind beide rund."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l2-f5
                type: true_false
                text: "Hörst du am Anfang ein O?"
                say: "Hund. Hörst du am Anfang ein ooo?"
                show: { object: dog }
                answer: false
                hints:
                  - "Sag das Wort mit: Hund."
                  - "Am Anfang kommt ein Hauch: h."
                  - "Nein, Hund fängt mit h an."
              - id: l2-f6
                type: tracing
                text: "Schreib das O nach."
                show: { drawn: writing-lines, text: "O", mode: trace, arrows: true }
                char: "O"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was fängt mit O an?"
                options: [{ object: fish }, { object: orange }, { object: lamp }]
                answer: orange
                hints: ["Orange ... o."]
              - id: l2-s2
                type: true_false
                text: "Hörst du am Anfang ein O?"
                say: "Oma. Hörst du am Anfang ein ooo?"
                show: { object: grandma }
                answer: true
                hints: ["Sprich es langsam: Ooo-ma."]
              - id: l2-s3
                type: true_false
                text: "Hörst du am Anfang ein O?"
                say: "Sonne. Hörst du am Anfang ein ooo?"
                show: { object: sun }
                answer: false
                hints: ["Zischt es am Anfang?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf jedes O."
                say: "Tippe auf jedes große und kleine O."
                show: { drawn: letter-card, text: "o L O m" }
                spans: ["o", "O"]
                hints: ["Es sind zwei."]
              - id: l2-s5
                type: tracing
                text: "Schreib das o nach."
                show: { drawn: writing-lines, text: "o", mode: trace, arrows: true }
                char: "o"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was fängt mit O an?"
                options: [{ object: tree }, { object: egg }, { object: octopus }]
                answer: octopus
              - id: l2-n2
                type: audio_choice
                text: "Welcher Buchstabe klingt so?"
                audio: { sound: "de.o:" }
                options: ["A", "O"]
                answer: "O"
              - id: l2-n3
                type: true_false
                text: "Hörst du am Anfang ein O?"
                say: "Maus. Hörst du am Anfang ein ooo?"
                show: { object: mouse }
                answer: false
                difficulty: easy
              - id: l2-n4
                type: image_multiple_choice
                text: "Was fängt mit O an?"
                options: [{ object: lion }, { object: ear }, { object: book }]
                answer: ear
              - id: l2-n5
                type: tracing
                text: "Schreib das O ab."
                show: { drawn: writing-lines, text: "O", mode: copy, arrows: false }
                char: "O"

      - activity: check
        size: quick
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was fängt mit O an?"
            options: [{ object: grandma }, { object: sun }, { object: dog }]
            answer: grandma
          - id: l2-c2
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: "de.o:" }
            options: ["L", "O"]
            answer: "O"
          - id: l2-c3
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: de.l }
            options: ["O", "L"]
            answer: "L"

  - n: 3
    title: { de: Das A, en: The letter A }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: "de.o:" }
            options: ["O", "L"]
            answer: "O"
            difficulty: easy
          - id: l3-w2
            type: image_multiple_choice
            text: "Was fängt mit O an?"
            options: [{ object: oven }, { object: lion }]
            answer: oven
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "A a"
            say: "Das ist das A. Es klingt so: aaa. Wie bei Ameise und Affe."
            show: { drawn: letter-card, text: "Aa" }
            sound: "de.a:"
          - text: "Ameise"
            say: "Ameise. Aaa-meise. Dein Mund ist dabei weit offen."
            show: { object: ant }
          - text: "Affe"
            say: "Affe. Hier ist das a ganz kurz: a, Affe."
            show: { object: monkey }
            sound: de.a

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit A an?"
                options: [{ object: monkey }, { object: ear }, { object: lion }]
                answer: monkey
                feedback:
                  ear: "Ohr fängt mit ooo an. Das ist das O."
                  lion: "Löwe fängt mit lll an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Affe ... a. Ohr ... ooo. Löwe ... lll."
                  - "Affe fängt mit A an."
                difficulty: easy
              - id: l3-f2
                type: audio_choice
                text: "O oder A?"
                audio: { sound: "de.a:" }
                options: ["O", "A"]
                answer: "A"
                feedback:
                  O: "Beim O wird der Mund rund. Beim A ist er weit offen: aaa."
                hints:
                  - "Hör noch einmal hin."
                  - "Mach den Laut nach. Ist dein Mund rund oder weit offen?"
                  - "Weit offen: Das ist das A."
              - id: l3-f3
                type: image_multiple_choice
                text: "Was fängt mit A an?"
                options: [{ object: oven }, { object: apple }]
                answer: apple
                feedback:
                  oven: "Ofen fängt mit ooo an. Der Mund ist rund."
                hints:
                  - "Sprich beide Wörter langsam."
                  - "Apfel ... a. Ofen ... ooo."
                  - "Apfel fängt mit A an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes A."
                say: "Tippe auf jedes große und kleine A."
                show: { drawn: letter-card, text: "A o a O A" }
                spans: ["A", "a", "A"]
                hints:
                  - "Das große A sieht aus wie ein Dach."
                  - "Das kleine a ist rund und hat rechts einen Strich. Das o hat keinen."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: true_false
                text: "Hörst du am Anfang ein A?"
                say: "Anker. Hörst du am Anfang ein a?"
                show: { object: anchor }
                answer: true
                hints:
                  - "Sag das Wort mit: Anker."
                  - "Der erste Laut ist kurz: a."
                  - "Ja, Anker fängt mit A an."
              - id: l3-f6
                type: tracing
                text: "Schreib das A nach."
                show: { drawn: writing-lines, text: "A", mode: trace, arrows: true }
                char: "A"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Was fängt mit A an?"
                options: [{ object: fish }, { object: mouse }, { object: pineapple }]
                answer: pineapple
                hints: ["Ananas ... a."]
              - id: l3-s2
                type: true_false
                text: "Hörst du am Anfang ein A?"
                say: "Ofen. Hörst du am Anfang ein aaa?"
                show: { object: oven }
                answer: false
                hints: ["Ist der Mund rund? Dann ist es das O."]
              - id: l3-s3
                type: audio_choice
                text: "Welcher Buchstabe klingt so?"
                audio: { sound: "de.a:" }
                options: ["A", "L", "O"]
                answer: "A"
                hints: ["Der Mund ist weit offen."]
              - id: l3-s4
                type: highlight_in_text
                text: "Tippe auf jedes A."
                say: "Tippe auf jedes große und kleine A."
                show: { drawn: letter-card, text: "a O A o" }
                spans: ["a", "A"]
                hints: ["Es sind zwei. Pass auf das o auf."]
              - id: l3-s5
                type: tracing
                text: "Schreib das a nach."
                show: { drawn: writing-lines, text: "a", mode: trace, arrows: true }
                char: "a"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: image_multiple_choice
                text: "Was fängt mit A an?"
                options: [{ object: tree }, { object: traffic-light }, { object: grandma }]
                answer: traffic-light
              - id: l3-n2
                type: true_false
                text: "Hörst du am Anfang ein A?"
                say: "Ameise. Hörst du am Anfang ein aaa?"
                show: { object: ant }
                answer: true
                difficulty: easy
              - id: l3-n3
                type: audio_choice
                text: "O oder A?"
                audio: { sound: "de.o:" }
                options: ["O", "A"]
                answer: "O"
              - id: l3-n4
                type: image_multiple_choice
                text: "Was fängt mit A an?"
                options: [{ object: ear }, { object: lamp }, { object: apple }]
                answer: apple
              - id: l3-n5
                type: tracing
                text: "Schreib das A ab."
                show: { drawn: writing-lines, text: "A", mode: copy, arrows: false }
                char: "A"

      - activity: check
        size: quick
        tasks:
          - id: l3-c1
            type: audio_choice
            text: "O oder A?"
            audio: { sound: "de.a:" }
            options: ["A", "O"]
            answer: "A"
          - id: l3-c2
            type: audio_choice
            text: "O oder A?"
            audio: { sound: "de.o:" }
            options: ["A", "O"]
            answer: "O"
          - id: l3-c3
            type: image_multiple_choice
            text: "Was fängt mit A an?"
            options: [{ object: ant }, { object: grandma }, { object: lamp }]
            answer: ant

  - n: 4
    title: { de: Das M, en: The letter M }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l4-w1
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            audio: { sound: "de.a:" }
            options: ["A", "O", "L"]
            answer: "A"
            difficulty: easy
          - id: l4-w2
            type: image_multiple_choice
            text: "Was fängt mit A an?"
            options: [{ object: monkey }, { object: oven }]
            answer: monkey
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "M m"
            say: "Dieser Buchstabe klingt so: mmm. Wie bei Maus und Mama. Die Lippen bleiben zu."
            show: { drawn: letter-card, text: "Mm" }
            sound: de.m
          - text: "Maus"
            say: "Maus. Mmm-aus."
            show: { object: mouse }
          - text: "M + a = Ma"
            say: "Jetzt verbinden wir zwei Laute. Mmm und aaa. Mmmaaa. Ma."
            show: { drawn: syllable-arcs, word: "Ma", syllables: ["Ma"] }
            sound: de.ma

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l4-f1
                type: image_multiple_choice
                text: "Was fängt mit M an?"
                options: [{ object: moon }, { object: lion }, { object: oven }]
                answer: moon
                feedback:
                  lion: "Löwe fängt mit lll an."
                  oven: "Ofen fängt mit ooo an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Mond ... mmm. Löwe ... lll. Ofen ... ooo."
                  - "Mond fängt mit mmm an."
                difficulty: easy
              - id: l4-f2
                type: true_false
                text: "Hörst du am Anfang ein M?"
                say: "Mütze. Hörst du am Anfang ein mmm?"
                show: { object: woolly-hat }
                answer: true
                hints:
                  - "Sag das Wort mit: Mütze."
                  - "Summt es am Anfang? Mmmütze."
                  - "Ja, Mütze fängt mit mmm an."
                difficulty: easy
              - id: l4-f3
                type: audio_choice
                text: "Welche Silbe hörst du?"
                audio: { sound: de.mo }
                options: ["Ma", "Mo"]
                answer: "Mo"
                feedback:
                  Ma: "Bei Ma ist der Mund am Ende weit offen. Hier wird er rund: Mo."
                hints:
                  - "Beide fangen mit mmm an. Hör auf den zweiten Laut."
                  - "Mmm ... ooo. Wird der Mund rund?"
                  - "Mo."
              - id: l4-f4
