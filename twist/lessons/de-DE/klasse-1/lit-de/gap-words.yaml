                  - "Der Laut in der Mitte ist au."
                  - "Au: zwei Buchstaben, a und u."
              - id: l1-f3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Bein. Was fehlt?"
                show: { object: leg }
                frame: "B_n"
