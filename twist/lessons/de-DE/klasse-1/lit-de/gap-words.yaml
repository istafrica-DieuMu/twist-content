# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.gap-words
skill: lit-de.spelling.gap-words
curriculum: de-DE
language: de
title:
  de: Lückenwörter
  en: Gap words
summary: >
  Children fill the gaps in words and build words from syllables and
  letters. Lesson 1 fills one missing letter or letter group, including
  the ones that are one sound but more letters (sch, ei, au, ch, eu): Fi_
  becomes Fisch. Lesson 2 builds words from syllable cards with one card
  too many and from letter cards, and ends with the skill check. The
  strategy is always the same: say the word slowly and listen where the
  gap is.
metadata:
  year: klasse-1
  topic: { de: Erste Wörter schreiben, en: Writing first words }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.spelling.write-by-sound]
  also_practises: [lit-de.spelling.write-by-sound, lit-de.decoding.two-syllable-words]
  vocabulary: { de: [Lücke, Lückenwort, Silbe, Buchstabe, mitsprechen] }
  forms: [picture, drawn, audio]
  drawn: [word-card]
  facets: []
  parts:
    - { id: letter, what: { de: einen fehlenden Buchstaben ergänzen, en: filling in a missing letter } }
    - { id: letter-group, what: { de: "einen Laut mit mehreren Buchstaben ergänzen (sch, ch, ei, au, eu)", en: "filling in a sound written with more than one letter (sch, ch, ei, au, eu)" } }
    - { id: syllables, what: { de: Wörter aus Silben bauen und fehlende Silben ergänzen, en: building words from syllables and filling in missing syllables } }
    - { id: letters, what: { de: Wörter aus Buchstaben legen, en: building words from letters } }
  misconceptions:
    - id: one-letter-per-sound
      what: Thinks every sound is one letter, so writes s for sch or a for au (Fis, Hs)
      addressed: "lesson 1 Learn shows sch as three letters for one sound; chips in l1-f1, l1-s2 and l1-n2 offer the single-letter choice, with feedback on l1-f1"
    - id: gap-position
      what: Fills the gap with the sound from the wrong part of the word (the first sound for a gap in the middle)
      addressed: "gaps move between start, middle and end; hints say the word in syllables and point to the syllable with the gap"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
