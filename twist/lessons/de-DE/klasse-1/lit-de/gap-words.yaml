                say: "Tisch. Was fehlt?"
                show: { object: table }
                frame: "Ti_"
                options: ["s", "sch", "ch"]
                answer: ["sch"]
                feedback:
                  s: "Dann steht da nur Tis. Du hörst aber sch am Ende, und sch hat drei Buchstaben."
                hints:
                  - "Sprich das Wort langsam bis zum Ende."
                  - "Ti ... sch. Der letzte Laut ist sch."
                  - "Es fehlt sch."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
