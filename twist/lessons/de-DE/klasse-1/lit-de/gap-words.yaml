            text: "Welcher Buchstabe fehlt?"
            say: "Nase. Welcher Buchstabe fehlt?"
            show: { object: nose }
            frame: "Na_e"
            options: ["s", "m", "t"]
            answer: ["s"]
            difficulty: easy
          - id: l1-w2
            type: ordering
            text: "Leg das Wort."
            say: "Oma. Leg die Buchstaben."
            show: { object: grandma }
            options: ["a", "m", "O"]
            slot_count: 3
            answer: ["O", "m", "a"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Fi_"
            say: "Hier fehlt etwas am Ende. Sprich mit: Fi ... sch. Der letzte Laut ist sch."
            show: { object: fish }
          - text: "sch"
            say: "Sch ist ein Laut, aber drei Buchstaben: s, c, h. In die Lücke kommt alles zusammen."
            show: { drawn: word-card, text: "Fisch" }
          - text: "H_s"
            say: "Auch au ist ein Laut mit zwei Buchstaben: H ... au ... s. Haus."
            show: { object: house }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
