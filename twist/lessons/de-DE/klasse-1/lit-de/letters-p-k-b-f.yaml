# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.letters-p-k-b-f
skill: lit-de.letters.p-k-b-f
curriculum: de-DE
language: de
title:
  de: Die Buchstaben P, K, B und F
  en: The letters P, K, B and F
summary: >
  The fourth letter group in Fibel order. One lesson each for P, K, B and
  F: hear the sound, find it in words, see and trace the letter, practised
  in three stages. The hand in front of the mouth tells P (a puff) from B
  (almost none) and K from T; F is set against S. The shapes b, d and p
  are set side by side. Lesson 5 reads words made only of known letters
  (Papa, Kanne, Bus, Boot, Apfel, Telefon) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Buchstaben, en: Letters }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.letters.e-n-d-u]
  also_practises:
    [lit-de.letters.e-n-d-u, lit-de.handwriting.print-letters, lit-de.decoding.two-syllable-words]
  vocabulary:
    { de: [Buchstabe, Laut, Anlaut, Silbe, Großbuchstabe, Kleinbuchstabe, Hauch] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, writing-lines, syllable-arcs, word-card]
  sounds: []
  facets: [script]
  parts:
    - { id: p-b, what: { de: P und B unterscheiden, en: telling P from B } }
    - { id: k-t, what: { de: K und T unterscheiden, en: telling K from T } }
    - { id: f-s, what: { de: F und S unterscheiden, en: telling F from S } }
    - { id: shapes, what: { de: "b, d und p an der Form erkennen", en: "telling b, d and p apart by their shape" } }
    - { id: words, what: { de: "Wörter mit P, K, B und F lesen", en: "reading words with P, K, B and F" } }
  misconceptions:
    - id: p-b
      what: Does not hear P (with a puff of air) from B (soft, almost no puff)
      addressed: lesson 3 Learn uses the hand in front of the mouth; l1-f3, l3-f2, l3-f3, l3-s2, l3-n1, l3-n2, l5-f5 and l5-c5 contrast P and B
    - id: b-d-p-shape
      what: Mixes up the mirror shapes b, d and p
      addressed: l1-f4, l3-f4, l3-s4 and l3-n4 put b, d and p on the same cards; the hints say where the belly and the stick are
    - id: k-t
      what: Hears the k at the back of the mouth as t (Kanne, Tanne)
      addressed: l2-f3, l2-s2 and l2-n2 contrast K and T; the hint says where the tongue is
    - id: f-s
      what: Confuses the blowing fff with the humming sss
      addressed: l4-f3, l4-s3 and l4-n2 set F against S
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Das P, en: The letter P }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Tanne" }
            options: [{ object: bin }, { object: fir-tree }, { object: cup }]
            answer: fir-tree
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "D oder T?"
            audio: { de: "Daumen." }
            options: ["D", "T"]
            answer: "D"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "P p"
            say: "Dieser Buchstabe klingt so: p. Wie bei Papa und Pizza. Die Lippen gehen zu und springen mit einem Hauch auf."
            show: { drawn: letter-card, text: "Pp" }
          - text: "Papa"
            say: "Papa. P ... apa. Hörst du das p am Anfang?"
            show: { object: dad }
          - text: "Pizza"
            say: "Pizza. P ... izza. Halte die Hand vor den Mund. Spürst du den Hauch?"
            show: { object: pizza }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was fängt mit P an?"
                options: [{ object: pizza }, { object: banana }, { object: fish }]
                answer: pizza
                feedback:
                  banana: "Banane fängt mit b an. Das b ist weicher, fast ohne Hauch."
                  fish: "Fisch fängt mit fff an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Pizza ... p. Banane ... b. Fisch ... fff."
                  - "Pizza fängt mit P an."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Hörst du am Anfang ein P?"
                say: "Pullover. Hörst du am Anfang ein p?"
                show: { object: jumper }
                answer: true
                hints:
                  - "Sag das Wort mit: Pullover."
                  - "Halte die Hand vor den Mund. Spürst du am Anfang einen Hauch?"
                  - "Ja, Pullover fängt mit p an."
                difficulty: easy
              - id: l1-f3
                type: true_false
                text: "Hörst du am Anfang ein P?"
                say: "Ball. Hörst du am Anfang ein p?"
                show: { object: ball }
                answer: false
                hints:
                  - "Sag das Wort mit: Ball."
                  - "Halte die Hand vor den Mund. Bei p spürst du einen Hauch. Bei Ball fast keinen."
                  - "Nein, Ball fängt mit b an."
              - id: l1-f4
                type: highlight_in_text
                text: "Tippe auf jedes P."
                say: "Tippe auf jedes große und kleine P."
                show: { drawn: letter-card, text: "P d p b P" }
                spans: ["P", "p", "P"]
                hints:
                  - "Das große P hat oben rechts einen Bauch."
                  - "Beim kleinen p geht der Strich nach unten, unter die Linie. Beim b und beim d geht er nach oben."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l1-f5
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Polizist." }
                options: ["P", "T", "D"]
                answer: "P"
                hints:
                  - "Hör noch einmal hin."
                  - "Gehen am Anfang die Lippen zu? Dann ist es kein t und kein d."
                  - "Die Lippen springen mit einem Hauch auf: Das ist das P."
              - id: l1-f6
                type: tracing
                text: "Schreib das P nach."
                show: { drawn: writing-lines, text: "P", mode: trace, arrows: true }
                char: "P"
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was fängt mit P an?"
                options: [{ object: nose }, { object: police-officer }, { object: cup }]
                answer: police-officer
                hints: ["Polizist ... p."]
              - id: l1-s2
                type: true_false
                text: "Hörst du am Anfang ein P?"
                say: "Pullover. Hörst du am Anfang ein p?"
                show: { object: jumper }
                answer: true
                hints: ["Sprich es langsam: P ... ullover."]
              - id: l1-s3
                type: true_false
                text: "Hörst du am Anfang ein P?"
                say: "Tasse. Hörst du am Anfang ein p?"
                show: { object: cup }
                answer: false
                hints: ["Gehen deine Lippen am Anfang zu?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Papa. Welcher Buchstabe fehlt?"
                show: { object: dad }
                frame: "_apa"
                options: ["P", "M", "T"]
                answer: ["P"]
                hints: ["P ... apa. Spürst du den Hauch?"]
              - id: l1-s5
                type: tracing
                text: "Schreib das p nach."
                show: { drawn: writing-lines, text: "p", mode: trace, arrows: true }
                char: "p"
                difficulty: easy

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was fängt mit P an?"
                options: [{ object: kite }, { object: mouse }, { object: dad }]
                answer: dad
              - id: l1-n2
                type: audio_choice
                text: "Mit welchem Buchstaben fängt das Wort an?"
                audio: { de: "Puppe." }
                options: ["D", "P", "M"]
                answer: "P"
              - id: l1-n3
                type: true_false
                text: "Hörst du am Anfang ein P?"
                say: "Banane. Hörst du am Anfang ein p?"
                show: { object: banana }
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Pizza. Welcher Buchstabe fehlt?"
                show: { object: pizza }
                frame: "_izza"
                options: ["T", "S", "P"]
                answer: ["P"]
              - id: l1-n5
                type: tracing
                text: "Schreib das p ab."
                show: { drawn: writing-lines, text: "p", mode: copy, arrows: false }
                char: "p"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was fängt mit P an?"
            options: [{ object: ball }, { object: jumper }, { object: sun }]
            answer: jumper
          - id: l1-c2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Paket." }
            options: ["T", "P"]
            answer: "P"
          - id: l1-c3
            type: true_false
            text: "Hörst du am Anfang ein P?"
            say: "Pizza. Hörst du am Anfang ein p?"
            show: { object: pizza }
            answer: true
          - id: l1-c4
            type: true_false
            text: "Hörst du am Anfang ein P?"
            say: "Kuchen. Hörst du am Anfang ein p?"
            show: { object: cake }
            answer: false
          - id: l1-c5
            type: highlight_in_text
            text: "Tippe auf jedes P."
            say: "Tippe auf jedes große und kleine P."
            show: { drawn: letter-card, text: "p b P d p" }
            spans: ["p", "P", "p"]
          - id: l1-c6
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Paprika." }
            options: ["B", "T", "P"]
            answer: "P"

  - n: 2
    title: { de: Das K, en: The letter K }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was fängt mit P an?"
            options: [{ object: lamp }, { object: pizza }]
            answer: pizza
            difficulty: easy
          - id: l2-w2
            type: audio_choice
            text: "Mit welchem Buchstaben fängt das Wort an?"
            audio: { de: "Pinsel." }
            options: ["P", "T"]
            answer: "P"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "K k"
            say: "Dieser Buchstabe klingt so: k. Wie bei Katze und Kuh. Der Laut kommt ganz hinten aus dem Mund."
            show: { drawn: letter-card, text: "Kk" }
          - text: "Katze"
            say: "Katze. K ... atze. Hörst du das k am Anfang?"
            show: { object: cat }
          - text: "Kuh"
            say: "Kuh. K ... uh. Sag Kuh und dann Tuch. Spürst du, wo die Zunge ist? Beim k hinten, beim t vorne."
            show: { object: cow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was fängt mit K an?"
                options: [{ object: cat }, { object: table }, { object: banana }]
                answer: cat
                feedback:
                  table: "Tisch fängt mit t an. Beim t ist die Zunge vorne. Das k kommt von hinten."
                  banana: "Banane fängt mit b an."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Katze ... k. Tisch ... t. Banane ... b."
                  - "Katze fängt mit K an."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hörst du am Anfang ein K?"
                say: "Kuchen. Hörst du am Anfang ein k?"
                show: { object: cake }
                answer: true
                hints:
                  - "Sag das Wort mit: Kuchen."
                  - "K ... uchen. Kommt der erste Laut von hinten aus dem Mund?"
                  - "Ja, Kuchen fängt mit k an."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Hörst du am Anfang ein K?"
                say: "Tonne. Hörst du am Anfang ein k?"
                show: { object: bin }
                answer: false
                hints:
                  - "Sag das Wort mit: Tonne."
                  - "Wo ist deine Zunge am Anfang? Vorne an den Zähnen ist es t. Hinten im Mund ist es k."
                  - "Nein, Tonne fängt mit t an."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf jedes K."
                say: "Tippe auf jedes große und kleine K."
                show: { drawn: letter-card, text: "K t k L K" }
                spans: ["K", "k", "K"]
                hints:
                  - "Das große K hat einen Strich und zwei Arme."
                  - "Beim kleinen k ist der Strich lang und die Arme sind klein."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l2-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Kuh. Welcher Buchstabe fehlt?"
                show: { object: cow }
                frame: "_uh"
                options: ["K", "T", "M"]
                answer: ["K"]
                hints:
                  - "Sprich das Wort langsam."
                  - "K ... uh. Kommt der erste Laut von hinten?"
                  - "Vorne fehlt das K."
              - id: l2-f6
                type: tracing
                text: "Schreib das K nach."
                show: { drawn: writing-lines, text: "K", mode: trace, arrows: true }
                char: "K"
                difficulty: easy

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was fängt mit K an?"
                options: [{ object: egg }, { object: sun }, { object: crocodile }]
                answer: crocodile
                hints: ["Krokodil ... k."]
              - id: l2-s2
                type: audio_choice
                text: "K oder T?"
                audio: { de: "Kanne." }
                options: ["T", "K"]
                answer: "K"
                hints: ["Kommt der erste Laut von hinten aus dem Mund?"]
              - id: l2-s3
                type: true_false
                text: "Hörst du am Anfang ein K?"
                say: "Kopf. Hörst du am Anfang ein k?"
                show: { object: head }
                answer: true
                hints: ["Sprich es langsam: K ... opf."]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf jedes K."
                say: "Tippe auf jedes große und kleine K."
                show: { drawn: letter-card, text: "k t K l" }
                spans: ["k", "K"]
                hints: ["Es sind zwei. Schau auf die Arme."]
              - id: l2-s5
                type: tracing
                text: "Schreib das k nach."
                show: { drawn: writing-lines, text: "k", mode: trace, arrows: true }
                char: "k"
                difficulty: easy

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Was fängt mit K an?"
                options: [{ object: ball }, { object: cheese }, { object: fish }]
                answer: cheese
              - id: l2-n2
                type: audio_choice
                text: "K oder T?"
                audio: { de: "Tanne." }
                options: ["K", "T"]
                answer: "T"
              - id: l2-n3
                type: true_false
                text: "Hörst du am Anfang ein K?"
                say: "Pizza. Hörst du am Anfang ein k?"
                show: { object: pizza }
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Katze. Welcher Buchstabe fehlt?"
                show: { object: cat }
                frame: "_atze"
                options: ["T", "K", "M"]
                answer: ["K"]
              - id: l2-n5
                type: tracing
                text: "Schreib das K ab."
                show: { drawn: writing-lines, text: "K", mode: copy, arrows: false }
                char: "K"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: image_multiple_choice
            text: "Was fängt mit K an?"
            options: [{ object: moon }, { object: ant }, { object: box }]
            answer: box
          - id: l2-c2
            type: audio_choice
            text: "K oder T?"
            audio: { de: "Koffer." }
            options: ["T", "K"]
            answer: "K"
          - id: l2-c3
            type: true_false
            text: "Hörst du am Anfang ein K?"
            say: "Kleid. Hörst du am Anfang ein k?"
            show: { object: dress }
            answer: true
          - id: l2-c4
            type: true_false
            text: "Hörst du am Anfang ein K?"
            say: "Tisch. Hörst du am Anfang ein k?"
            show: { object: table }
            answer: false
          - id: l2-c5
            type: highlight_in_text
            text: "Tippe auf jedes K."
            say: "Tippe auf jedes große und kleine K."
            show: { drawn: letter-card, text: "K k t K l" }
            spans: ["K", "k", "K"]
          - id: l2-c6
            type: image_multiple_choice
            text: "Was fängt mit K an?"
            options: [{ object: sun }, { object: cook }, { object: egg }]
            answer: cook

  - n: 3
    title: { de: Das B, en: The letter B }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: image_multiple_choice
            text: "Was fängt mit K an?"
            options: [{ object: cow }, { object: sun }]
            answer: cow
            difficulty: easy
          - id: l3-w2
            type: audio_choice
            text: "K oder T?"
            audio: { de: "Keks." }
            options: ["K", "T"]
            answer: "K"
            difficulty: easy

      - activity: learn
        mode: new-sound
        screens:
          - text: "B b"
            say: "Dieser Buchstabe klingt so: b. Wie bei Ball und Banane. Die Lippen gehen zu und öffnen sich ganz weich."
            show: { drawn: letter-card, text: "Bb" }
          - text: "Ball"
            say: "Ball. B ... all. Hörst du das b am Anfang?"
            show: { object: ball }
          - text: "B P"
            say: "Halte die Hand vor den Mund. Sag Papa: Du spürst einen Hauch. Sag Ball: Der Hauch ist ganz klein."
            show: { drawn: letter-card, text: "B P" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: image_multiple_choice
                text: "Was fängt mit B an?"
                options: [{ object: banana }, { object: pizza }, { object: mouse }]
                answer: banana
                feedback:
                  pizza: "Pizza fängt mit p an. Da spürst du einen starken Hauch."
                  mouse: "Maus fängt mit mmm an. Da bleiben die Lippen zu und summen."
                hints:
                  - "Sprich jedes Wort langsam. Hör auf den ersten Laut."
                  - "Banane ... b. Pizza ... p. Maus ... mmm."
                  - "Banane fängt mit B an."
                difficulty: easy
              - id: l3-f2
                type: audio_choice
                text: "B oder P?"
                audio: { de: "Butter." }
                options: ["B", "P"]
                answer: "B"
                feedback:
                  P: "Bei p spürst du einen starken Hauch. Butter fängt weich an: b."
                hints:
                  - "Hör noch einmal hin."
                  - "Halte die Hand vor den Mund und sprich nach: Butter. Spürst du viel Luft?"
                  - "Wenig Luft, weich: Das ist das B."
              - id: l3-f3
                type: true_false
                text: "Hörst du am Anfang ein B?"
                say: "Papa. Hörst du am Anfang ein b?"
                show: { object: dad }
                answer: false
                hints:
                  - "Sag das Wort mit: Papa."
                  - "Spürst du an der Hand einen Hauch? Dann ist es p."
                  - "Nein, Papa fängt mit p an."
              - id: l3-f4
                type: highlight_in_text
                text: "Tippe auf jedes B."
                say: "Tippe auf jedes große und kleine B."
                show: { drawn: letter-card, text: "B d b p B" }
                spans: ["B", "b", "B"]
                hints:
                  - "Das große B hat zwei Bäuche."
                  - "Beim kleinen b ist der Bauch rechts unten. Beim d ist er links."
                  - "Es sind drei: zwei große und ein kleines."
              - id: l3-f5
                type: fill_in_blank
                text: "Welcher Buchstabe fehlt?"
                say: "Boot. Welcher Buchstabe fehlt?"
                show: { object: boat }
                frame: "_oot"
                options: ["B", "P", "T"]
                answer: ["B"]
                hints:
                  - "Sprich das Wort langsam."
                  - "B ... oot. Spürst du einen starken Hauch, oder fängt es weich an?"
                  - "Vorne fehlt das B."
              - id: l3-f6
                type: tracing
                text: "Schreib das B nach."
                show: { drawn: writing-lines, text: "B", mode: trace, arrows: true }
                char: "B"
                difficulty: easy

          - support: some
            tasks:
              - id: l3-s1
                type: image_multiple_choice
                text: "Was fängt mit B an?"
                options: [{ object: nose }, { object: frog }, { object: bed }]
                answer: bed
                hints: ["Bett ... b."]
              - id: l3-s2
                type: audio_choice
                text: "B oder P?"
                audio: { de: "Puppe." }
                options: ["B", "P"]
                answer: "P"
                hints: ["Spürst du an der Hand einen Hauch?"]
              - id: l3-s3
                type: true_false
                text: "Hörst du am Anfang ein B?"
                say: "Buch. Hörst du am Anfang ein b?"
                show: { object: book }
                answer: true
                hints: ["Sprich es langsam: B ... uch."]
              - id: l3-s4
                type: highlight_in_text
                text: "Tippe auf jedes B."
                say: "Tippe auf jedes große und kleine B."
                show: { drawn: letter-card, text: "b d B p" }
                spans: ["b", "B"]
                hints: ["Es sind zwei. Beim kleinen b ist der Bauch rechts."]
              - id: l3-s5
                type: tracing
                text: "Schreib das b nach."
                show: { drawn: writing-lines, text: "b", mode: trace, arrows: true }
                char: "b"
                difficulty: easy

          - support: none
            tasks:
              - id: l3-n1
                type: audio_choice
                text: "B oder P?"
                audio: { de: "Bär." }
                options: ["P", "B"]
                answer: "B"
              - id: l3-n2
                type: audio_choice
                text: "B oder P?"
                audio: { de: "Post." }
                options: ["B", "P"]
                answer: "P"
              - id: l3-n3
                type: image_multiple_choice
                text: "Was fängt mit B an?"
                options: [{ object: pizza }, { object: bus }, { object: kite }]
                answer: bus
              - id: l3-n4
                type: highlight_in_text
                text: "Tippe auf jedes B."
                say: "Tippe auf jedes große und kleine B."
                show: { drawn: letter-card, text: "b d p b B d" }
