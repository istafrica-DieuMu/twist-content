# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.dictation-short
skill: lit-de.spelling.dictation-short
curriculum: de-DE
language: de
title:
  de: Kurze Sätze nach Diktat
  en: Short sentences from dictation
summary: >
  Children write short practised sentences they hear, with the steps of a
  class Diktat: listen to the whole sentence, say it again, write it word
  by word while speaking along, then check it (Anfang groß, Nomen groß,
  Lücken, Punkt). Lesson 1 takes three-word sentences (Oma ist da.);
  lesson 2 takes longer ones with a Nomen inside (Der Hund ist im Haus.)
  and ends with the skill check. The app cannot yet read free writing, so
  the child builds the heard sentence from word cards, fills its gaps,
  picks its spelling and finds the mistake in a written copy.
metadata:
  year: klasse-1
  topic: { de: Erste Sätze schreiben, en: Writing first sentences }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling.gap-words, lit-de.handwriting.copy-sentences]
  also_practises: [lit-de.spelling.gap-words, lit-de.spelling.capital-nouns]
  vocabulary: { de: [Diktat, nachsprechen, mitsprechen, prüfen, Punkt] }
  forms: [audio, drawn, picture]
  drawn: [letter-card, word-card]
  sounds: []
  facets: []
  parts:
    - { id: whole-sentence, what: { de: einen gehörten Satz Wort für Wort und vollständig legen, en: building a heard sentence word by word with no word missing } }
    - { id: practised-words, what: { de: geübte Wörter richtig schreiben, en: spelling practised words correctly } }
    - { id: check, what: { de: "den Satz prüfen: Anfang groß, Nomen groß, Lücken und Punkt", en: "checking the sentence: capitals, gaps and full stop" } }
  misconceptions:
    - id: writes-what-remembered
      what: Hears the sentence once, then writes what it should say, leaving out or changing small words (Oma da. for Oma ist da.)
      addressed: "Learn says the sentence back before writing; the speak task in l1-f1 practises it; ordering tasks need every word, and l1-f4 and l2-s4 show a copy with a missing small word"
    - id: sound-alike-spelling
      what: Writes a word as it sounds at the end (Hunt) or misses a doubled letter (Waser), because the practised spelling was not recalled
      addressed: "card and option sets in l1-f3, l2-f1, l2-s2 and l2-c2 include the sound-alike spelling, with hints on l2-f1"
    - id: no-final-check
      what: Stops after the last word and does not check capitals, gaps and the Punkt
      addressed: "the order task in l1-f5 puts prüfen last; l1-f2, l1-n4, l2-n3 and l2-c4 show copies with a missing Punkt or a small first letter"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Hören, sprechen, schreiben", en: "Listen, say, write" }
    goal:
      de: "Hör einen kurzen Satz, sprich ihn nach und leg ihn Wort für Wort, so wie Oma ist da."
      en: "Listen to a short sentence, say it back and build it word by word, like Oma ist da."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Sofa. Was fehlt?"
            show: { object: sofa }
            frame: "So_a"
            options: ["f", "w", "s"]
            option_audio: false
            answer: ["f"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Abschrift ist richtig?"
            say: "Vorlage: Mia lacht. Welche Abschrift ist richtig?"
            show: { drawn: word-card, text: "Mia lacht." }
            options: ["Mia lacht.", "Mialacht."]
            option_audio: false
            answer: "Mia lacht."
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 hören  2 nachsprechen  3 schreiben  4 prüfen"
            say: "So schreibst du nach Diktat. Erst hörst du den ganzen Satz. Dann sprichst du ihn nach. Dann schreibst du Wort für Wort. Zum Schluss prüfst du."
            show: { drawn: word-card, text: "Oma ist da." }
          - text: "Oma ist da."
            say: "Hör zu: Oma ist da. Sprich nach: Oma ist da. Drei Wörter. Wenn du den Satz sprechen kannst, hast du ihn dir gemerkt."
            show: { drawn: letter-card, text: "Oma ist da." }
          - text: "O-ma ... ist ... da."
            say: "Beim Schreiben sprichst du leise mit. O-ma. Lücke. ist. Lücke. da. Punkt."
            show: { drawn: letter-card, text: "Oma ist da." }
          - text: "Anfang groß?  Lücken?  Punkt?"
            say: "Jetzt prüfst du. Fängt der Satz groß an? Sind die Lücken da? Steht am Ende der Punkt?"
            show: { drawn: word-card, text: "Oma ist da." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: speak
                text: "Hör zu und sprich nach."
                say: "Hör gut zu und sprich den Satz nach: Mama malt."
                expected_text: "Mama malt."
                hints:
                  - "Hör dir den Satz noch einmal an."
                  - "Es sind zwei Wörter. Das erste ist Mama."
                  - "Mama malt."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Oma ist da." }
                options: ["Oma ist da.", "oma ist da.", "Oma ist da"]
                answer: "Oma ist da."
                feedback:
                  "oma ist da.": "Oma steht am Anfang, und Oma ist ein Nomen. Also groß."
                  "Oma ist da": "Die Wörter stimmen. Aber am Ende fehlt der Punkt."
                hints:
                  - "Prüf: Anfang groß, Lücken, Punkt."
                  - "Schau auf den ersten Buchstaben und auf das Ende."
                  - "Oma ist da. Großes O, Punkt am Ende."
              - id: l1-f3
                type: ordering
                text: "Hör zu und leg den Satz."
                say: "Hör zu: Tim hat ein Auto. Leg den Satz. Eine Karte ist zu viel."
                options: ["Auto.", "hat", "Tim", "ein", "hatt"]
                option_audio: false
                slot_count: 4
                answer: ["Tim", "hat", "ein", "Auto."]
                hints:
                  - "Sprich den Satz nach und leg Wort für Wort."
                  - "Tim, hat, ein, Auto. Hat schreibst du mit einem t."
                  - "Tim hat ein Auto."
              - id: l1-f4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Hör zu: Ich bin Lina. Ben hat den Satz so geschrieben. Stimmt das?"
                show: { drawn: word-card, text: "Ich Lina." }
                answer: false
                hints:
                  - "Sprich den Satz nach und zähl die Wörter."
                  - "Ich, bin, Lina. Das sind drei Wörter."
                  - "Nein. Das Wort bin fehlt."
              - id: l1-f5
                type: ordering
                text: "Leg die Schritte zum Diktat."
                say: "Was machst du beim Diktat zuerst, was danach? Leg die Schritte."
                options: ["schreiben", "prüfen", "hören", "nachsprechen"]
                slot_count: 4
                answer: ["hören", "nachsprechen", "schreiben", "prüfen"]
                hints:
                  - "Bevor du schreiben kannst, musst du den Satz kennen."
                  - "Hören, dann nachsprechen. Was kommt danach?"
                  - "Hören, nachsprechen, schreiben, prüfen."

          - support: some
            tasks:
              - id: l1-s1
                type: speak
                text: "Hör zu und sprich nach."
                say: "Hör gut zu und sprich den Satz nach: Die Sonne lacht."
                expected_text: "Die Sonne lacht."
                hints: ["Drei Wörter. Das erste Wort heißt die."]
              - id: l1-s2
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Mama malt." }
                options: ["Mama mald.", "Mama malt.", "Mamamalt."]
                answer: "Mama malt."
                hints: ["Hör auf das Ende von malt. Was hörst du da?"]
              - id: l1-s3
                type: ordering
                text: "Hör zu und leg den Satz."
                say: "Hör zu: Die Sonne lacht. Leg den Satz. Eine Karte ist zu viel."
                options: ["Sone", "lacht.", "Die", "Sonne"]
                option_audio: false
                slot_count: 3
                answer: ["Die", "Sonne", "lacht."]
                hints: ["Son-ne: zwei n, eins in jeder Silbe."]
              - id: l1-s4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Hör zu: Tim hat ein Auto. Lea hat den Satz so geschrieben. Stimmt das?"
                show: { drawn: word-card, text: "Tim hat ein Auto." }
                answer: true
                hints: ["Prüf jedes Wort, die Lücken und den Punkt."]
              - id: l1-s5
                type: fill_in_blank
                text: "Hör zu. Welches Wort fehlt?"
                say: "Hör zu: Ich bin Lina. Welches Wort fehlt?"
                frame: "Ich _ Lina."
                options: ["bin", "bien", "in"]
                option_audio: false
                answer: ["bin"]
                hints: ["Sprich nach: Ich ... bin ... Lina."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Ich bin Lina.", speaker: female }
                options: ["Ich bin lina.", "Ich bin Lina.", "ich bin Lina."]
                answer: "Ich bin Lina."
              - id: l1-n2
                type: ordering
                text: "Hör zu und leg den Satz."
                say: "Hör zu: Oma ist da. Leg den Satz. Eine Karte ist zu viel."
                options: ["ist", "da.", "isst", "Oma"]
                option_audio: false
                slot_count: 3
                answer: ["Oma", "ist", "da."]
              - id: l1-n3
                type: fill_in_blank
                text: "Hör zu. Welches Wort fehlt?"
                say: "Hör zu: Die Sonne lacht. Welches Wort fehlt?"
                frame: "Die _ lacht."
                options: ["Sone", "Sonne", "sonne"]
                option_audio: false
                answer: ["Sonne"]
              - id: l1-n4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Hör zu: Mama malt. Paul hat den Satz so geschrieben. Stimmt das?"
                show: { drawn: word-card, text: "Mama malt" }
                answer: false
              - id: l1-n5
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Tim hat ein Auto." }
                options: ["Tim hat ein auto.", "Tim hat ein Auto.", "Tim hat einAuto."]
                answer: "Tim hat ein Auto."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Hör zu. Welcher Satz ist richtig geschrieben?"
            audio: { de: "Die Sonne lacht." }
            options: ["Die Sonne lacht.", "Die Sone lacht.", "die Sonne lacht."]
            answer: "Die Sonne lacht."
          - id: l1-c2
            type: ordering
            text: "Hör zu und leg den Satz."
            say: "Hör zu: Mama malt. Leg den Satz. Eine Karte ist zu viel."
            options: ["malt.", "Mama", "mald."]
            option_audio: false
            slot_count: 2
            answer: ["Mama", "malt."]
          - id: l1-c3
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Hör zu: Oma ist da. Emma hat den Satz so geschrieben. Stimmt das?"
            show: { drawn: word-card, text: "Oma ist da." }
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Hör zu. Welches Wort fehlt?"
            say: "Hör zu: Tim hat ein Auto. Welches Wort fehlt?"
            frame: "Tim _ ein Auto."
            options: ["hatt", "hat", "had"]
            option_audio: false
            answer: ["hat"]
          - id: l1-c5
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Hör zu: Ich bin Lina. Ali hat den Satz so geschrieben. Stimmt das?"
            show: { drawn: word-card, text: "Ich bin Lina" }
            answer: false
          - id: l1-c6
            type: audio_choice
            text: "Hör zu. Welcher Satz ist richtig geschrieben?"
            audio: { de: "Mama malt." }
            options: ["mama malt.", "Mama malt", "Mama malt."]
            answer: "Mama malt."

  - n: 2
    title: { de: Längere Sätze nach Diktat, en: Longer sentences from dictation }
    goal:
      de: "Schreib längere Sätze nach Diktat. Prüf am Ende, ob Hund und Haus groß geschrieben sind."
      en: "Write longer sentences from dictation. At the end, check that Hund and Haus have capital letters."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Hör zu. Welcher Satz ist richtig geschrieben?"
            audio: { de: "Oma ist da." }
            options: ["Oma ist da.", "Oma isst da."]
            answer: "Oma ist da."
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Hör zu und leg den Satz."
            say: "Hör zu: Ich bin Lina. Leg den Satz."
            options: ["Lina.", "Ich", "bin"]
            option_audio: false
            slot_count: 3
            answer: ["Ich", "bin", "Lina."]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Hund ist im Haus."
            say: "Dieser Satz ist länger: Der Hund ist im Haus. Sprich ihn nach, bis du ihn kannst. Fünf Wörter."
            show: { drawn: letter-card, text: "Der Hund ist im Haus." }
          - text: "Hund  Hunde"
            say: "Bei Hund hörst du am Ende ein t. Geschrieben wird aber ein d. Das weißt du, wenn du verlängerst: die Hunde. Dieses Wort hast du geübt."
            show: { drawn: word-card, text: "Hund  Hunde" }
          - text: "Der Hund ist im Haus."
            say: "Jetzt prüfst du. Der steht am Anfang, also groß. Hund und Haus sind Nomen, also auch groß. Dann die Lücken und der Punkt."
            show: { drawn: letter-card, text: "Der Hund ist im Haus." }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Hör zu und leg den Satz."
                say: "Hör zu: Der Hund ist im Haus. Leg den Satz. Eine Karte ist zu viel."
                options: ["Haus.", "Hunt", "ist", "Der", "im", "Hund"]
                option_audio: false
                slot_count: 5
                answer: ["Der", "Hund", "ist", "im", "Haus."]
                hints:
                  - "Sprich den Satz nach. Wie viele Wörter sind es?"
                  - "Hund oder Hunt? Verlängere: die Hunde."
                  - "Der Hund ist im Haus."
                difficulty: easy
              - id: l2-f2
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Wir rufen Opa." }
                options: ["Wir rufen opa.", "Wir rufen Opa.", "Wir rufen Opa"]
                answer: "Wir rufen Opa."
                hints:
                  - "Prüf: Anfang groß, Nomen groß, Punkt."
                  - "Opa ist ein Nomen."
                  - "Wir rufen Opa. Mit großem O und Punkt."
              - id: l2-f3
                type: highlight_in_text
                text: "Ein Wort ist falsch geschrieben. Tippe darauf."
                say: "Hör zu: Lisa malt eine Rose. So hat Ole geschrieben. Ein Wort ist falsch. Tippe darauf."
                show: { drawn: letter-card, text: "Lisa malt eine rose." }
                spans: ["rose."]
                hints:
                  - "Prüf jedes Wort. Denk an die Nomen."
                  - "Lisa und Rose sind Nomen."
                  - "Rose muss groß sein."
              - id: l2-f4
                type: fill_in_blank
                text: "Hör zu. Welches Wort fehlt?"
                say: "Hör zu: Ein Esel trinkt Wasser. Welches Wort fehlt?"
                frame: "Ein Esel _ Wasser."
                options: ["trinkt", "trinkd", "tringt"]
                option_audio: false
                answer: ["trinkt"]
                hints:
                  - "Sprich das Wort langsam: trinkt."
                  - "Am Ende hörst du k und t."
                  - "Trinkt."
              - id: l2-f5
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Hör zu: Der Hund ist im Haus. Mia hat den Satz so geschrieben. Stimmt das?"
                show: { drawn: word-card, text: "Der Hund istim Haus." }
                answer: false
                hints:
                  - "Prüf die Lücken."
                  - "Schau auf ist und im."
                  - "Nein. Zwischen ist und im fehlt die Lücke."

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Lisa malt eine Rose." }
                options: ["Lisa malt eine Rose.", "Lisa malt eine Rohse.", "Lisa malt eine Rose"]
                answer: "Lisa malt eine Rose."
                hints: ["Rose schreibst du so, wie du es sprichst: Ro-se. Und prüf das Ende."]
              - id: l2-s2
                type: ordering
                text: "Hör zu und leg den Satz."
                say: "Hör zu: Wir rufen Opa. Leg den Satz. Eine Karte ist zu viel."
                options: ["Opa.", "Wir", "rufen", "ruffen"]
                option_audio: false
                slot_count: 3
                answer: ["Wir", "rufen", "Opa."]
                hints: ["Ru-fen: Das u ist lang, also nur ein f."]
              - id: l2-s3
                type: highlight_in_text
                text: "Ein Wort ist falsch geschrieben. Tippe darauf."
                say: "Hör zu: Ein Esel trinkt Wasser. So hat Ben geschrieben. Ein Wort ist falsch. Tippe darauf."
                show: { drawn: letter-card, text: "Ein Esel trinkt Waser." }
                spans: ["Waser."]
                hints: ["Was-ser: Sprich mit und hör auf die Silben."]
              - id: l2-s4
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Hör zu: Lisa malt eine Rose. Emil hat den Satz so geschrieben. Stimmt das?"
                show: { drawn: word-card, text: "Lisa malt Rose." }
                answer: false
                hints: ["Zähl die Wörter. Sind es vier?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Hör zu. Welches Wort fehlt?"
                say: "Hör zu: Der Hund ist im Haus. Welches Wort fehlt?"
                frame: "Der Hund ist im _."
                options: ["Haus", "haus", "Hauss"]
                option_audio: false
                answer: ["Haus"]
                hints: ["Haus ist ein Nomen."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Hör zu und leg den Satz."
                say: "Hör zu: Ein Esel trinkt Wasser. Leg den Satz. Eine Karte ist zu viel."
                options: ["trinkt", "Wasser.", "Ein", "Esel", "Esl"]
                option_audio: false
                slot_count: 4
                answer: ["Ein", "Esel", "trinkt", "Wasser."]
              - id: l2-n2
                type: audio_choice
                text: "Hör zu. Welcher Satz ist richtig geschrieben?"
                audio: { de: "Der Hund ist im Haus." }
                options: ["Der Hunt ist im Haus.", "Der Hund ist im haus.", "Der Hund ist im Haus."]
                answer: "Der Hund ist im Haus."
              - id: l2-n3
                type: true_false
                text: "Ist das richtig geschrieben?"
                say: "Hör zu: Wir rufen Opa. Lara hat den Satz so geschrieben. Stimmt das?"
                show: { drawn: word-card, text: "wir rufen Opa." }
                answer: false
              - id: l2-n4
                type: highlight_in_text
                text: "Ein Wort ist falsch geschrieben. Tippe darauf."
                say: "Hör zu: Der Hund ist im Haus. So hat Tom geschrieben. Ein Wort ist falsch. Tippe darauf."
                show: { drawn: letter-card, text: "Der Hunt ist im Haus." }
                spans: ["Hunt"]
              - id: l2-n5
                type: fill_in_blank
                text: "Hör zu. Welches Wort fehlt?"
                say: "Hör zu: Lisa malt eine Rose. Welches Wort fehlt?"
                frame: "Lisa _ eine Rose."
                options: ["mald", "malt", "mallt"]
                option_audio: false
                answer: ["malt"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: practised-words
            type: audio_choice
            text: "Hör zu. Welcher Satz ist richtig geschrieben?"
            audio: { de: "Ein Esel trinkt Wasser." }
            options: ["Ein Esel trinkt Wasser.", "Ein esel trinkt Wasser.", "Ein Esel trinkt Waser."]
            answer: "Ein Esel trinkt Wasser."
          - id: l2-c2
            part: whole-sentence
            type: ordering
            text: "Hör zu und leg den Satz."
            say: "Hör gut zu: Der Hund trinkt Wasser. Leg den Satz. Eine Karte ist zu viel."
            options: ["Wasser.", "Hunt", "Der", "trinkt", "Hund"]
            option_audio: false
            slot_count: 4
            answer: ["Der", "Hund", "trinkt", "Wasser."]
          - id: l2-c3
            part: practised-words
            type: highlight_in_text
            text: "Ein Wort ist falsch geschrieben. Tippe darauf."
            say: "Hör zu: Wir rufen Opa. So hat Nina geschrieben. Ein Wort ist falsch. Tippe darauf."
            show: { drawn: letter-card, text: "Wir ruffen Opa." }
            spans: ["ruffen"]
          - id: l2-c4
            part: check
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Hör zu: Tim hat ein Auto. Jan hat den Satz so geschrieben. Stimmt das?"
            show: { drawn: word-card, text: "Tim hat ein Auto" }
            answer: false
          - id: l2-c5
            part: practised-words
            type: fill_in_blank
            text: "Hör zu. Welches Wort fehlt?"
            say: "Hör gut zu: Lisa malt eine Rose. Welches Wort fehlt?"
            frame: "Lisa malt eine _."
            options: ["rose", "Rose", "Rohse"]
            option_audio: false
            answer: ["Rose"]
          - id: l2-c6
            part: whole-sentence
            type: ordering
            text: "Hör zu und leg den Satz."
            say: "Hör zu: Oma trinkt Wasser. Leg den Satz. Eine Karte ist zu viel."
            options: ["Wasser.", "Oma", "Waser.", "trinkt"]
            option_audio: false
            slot_count: 3
            answer: ["Oma", "trinkt", "Wasser."]
          - id: l2-c7
            part: whole-sentence
            type: ordering
            text: "Hör zu und leg den Satz."
            say: "Hör zu: Opa ist im Haus. Leg den Satz. Eine Karte ist zu viel."
            options: ["im", "Haus.", "Opa", "isst", "ist"]
            option_audio: false
            slot_count: 4
            answer: ["Opa", "ist", "im", "Haus."]
          - id: l2-c8
            part: whole-sentence
            type: ordering
            text: "Hör zu und leg den Satz."
            say: "Hör zu: Lina malt ein Auto. Leg den Satz."
            options: ["ein", "Auto.", "Lina", "malt"]
            option_audio: false
            slot_count: 4
            answer: ["Lina", "malt", "ein", "Auto."]
          - id: l2-c9
            part: whole-sentence
            type: true_false
            text: "Ist das richtig geschrieben?"
            say: "Hör zu: Mama ruft Tim. Ole hat den Satz so geschrieben. Stimmt das?"
