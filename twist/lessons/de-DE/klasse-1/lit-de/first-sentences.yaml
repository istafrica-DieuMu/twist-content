# Lesson set: Deutsch, Klasse 1. Hand-authored draft.
id: de-DE.lit-de.first-sentences
skill: lit-de.decoding.first-sentences
curriculum: de-DE
language: de
title:
  de: Erste Sätze lesen
  en: Reading first sentences
summary: >
  Reading a short sentence to the end and finding the picture that fits.
  Lesson 1: one sentence of three to five words; the last word decides
  (Der Ball ist rot, Hier sind drei Eier), so the child reads every word
  before choosing; the child also builds a sentence from word cards.
  Lesson 2: sentences that differ in one word (Hund, Mund), two sentences
  that only together name a thing (Es ist gelb. Es ist am Himmel.), and
  checking a sentence against a picture; it ends with the skill check.
  Words use only letters taught so far (up to Eu, Ch and J) and the first
  sight words. The voice never reads the sentence the child has to read.
metadata:
  year: klasse-1
  topic: { de: Erste Sätze lesen, en: First sentences }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [lit-de.decoding.word-picture, lit-de.fluency.sight-words-easy]
  also_practises: [lit-de.decoding.word-picture, lit-de.fluency.sight-words-easy]
  vocabulary: { de: [Satz, Wort, Punkt, Bild, lesen] }
  forms: [text, audio, picture, drawn]
  drawn: [word-card]
  sounds: []
  facets: []
  parts:
    - { id: whole-sentence, what: { de: einen Satz bis zum Punkt lesen und das passende Bild finden, en: reading a sentence to the full stop and finding the picture that matches } }
    - { id: check-picture, what: { de: "prüfen, ob ein Satz zum Bild passt", en: checking whether a sentence matches a picture } }
    - { id: one-word, what: { de: "Sätze unterscheiden, die nur in einem Wort verschieden sind", en: telling apart sentences that differ in one word } }
    - { id: two-sentences, what: { de: zwei Sätze zusammen lesen und verstehen, en: reading two sentences together and understanding them } }
  misconceptions:
    - id: stops-early
      what: Reads the first words and guesses the rest, so picks the right thing in the wrong colour or number
      addressed: lesson 1 Learn says the last word decides; colour and number sentences in every stage (l1-f2, l1-f4, l1-s1, l1-s4, l1-n2, l2-f4, l2-s4, l2-n4) and the skill check tasks l2-c2 and l2-c3
    - id: similar-words
      what: Mixes up words that differ in one letter (Hund, Mund; Rose, Hose)
      addressed: lesson 2 Learn sets Hund against Mund; l2-f1, l2-s1, l2-n1 and the skill check task l2-c4 offer sentences that differ in one word, with feedback on l2-f1
    - id: one-sentence
      what: Uses only one of two sentences in a riddle and picks a picture that fits only that one (Banane for gelb)
      addressed: lesson 2 Learn reads both sentences of a riddle; l2-f2 (feedback on Banane), l2-s2, l2-n2 and l2-c5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: Ein Satz und ein Bild, en: A sentence and a picture }
    goal:
      de: "Lies einen kurzen Satz bis zum letzten Wort und find dann das passende Bild, zum Beispiel den roten Ball."
      en: "Read a short sentence right to the last word, then find the picture that fits, like the red ball."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Lies das Wort. Welches Bild passt?"
            show: { drawn: word-card, text: "Hose" }
            options: [{ object: rose }, { object: trousers }, { object: nose }]
            answer: trousers
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welches Wort hörst du?"
            say: "Hör gut zu. Welches Wort hörst du? Lies die Karten."
            audio: { de: "ist." }
            options: ["im", "ist", "ich"]
            answer: "ist"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Hund bellt."
            say: "Hier steht ein Satz. Was glaubst du: Wie viele Wörter hat er?"
            show: { object: dog }
          - text: "Der Hund bellt."
            say: "Es sind drei! Das ist ein Satz. Er hat drei Wörter. Am Anfang steht ein großer Buchstabe, am Ende ein Punkt. Lies Wort für Wort: Der ... Hund ... bellt."
            show: { object: dog }
          - text: "Wusstest du? Ein Hund riecht viel besser als du."
            say: "Wusstest du? Ein Hund riecht viel, viel besser als ein Mensch. Mit seiner Nase findet er sogar Menschen, die tief unter dem Schnee liegen."
            show: { object: dog }
          - text: "Der Ball ist rot."
            say: "Lies jedes Wort, auch das letzte. Der Ball ist rot. Erst das letzte Wort sagt dir, welcher Ball gemeint ist."
            show: { object: ball, colour: red }
          - text: "Erst lesen, dann schauen."
            say: "So gehst du vor: Lies den ganzen Satz bis zum Punkt. Dann schau dir die Bilder an. Welches Bild passt zu allem, was im Satz steht?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Der Hund bellt." }
                options: [{ object: cat }, { object: dog }, { object: cow }]
                answer: dog
                hints:
                  - "Lies Wort für Wort."
                  - "Der ... Hund ... Welches Tier ist ein Hund?"
                  - "Der Hund bellt."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Der Ball ist rot." }
                options: [{ object: ball, colour: blue }, { object: ball, colour: red }, { object: ball, colour: yellow }]
                answer: red
                feedback:
                  blue: "Das ist ein Ball. Lies noch das letzte Wort: Welche Farbe hat er?"
                  yellow: "Das ist ein Ball. Lies noch das letzte Wort: Welche Farbe hat er?"
                hints:
                  - "Alle Bilder zeigen einen Ball. Lies bis zum Punkt."
                  - "Das letzte Wort sagt dir die Farbe. Lies es ganz genau."
                  - "Der Ball ist rot."
              - id: l1-f3
                type: true_false
                text: "Das ist ein Hund.\n\nPasst der Satz zum Bild?"
                say: "Lies den Satz. Passt er zum Bild?"
                show: { object: cat }
                answer: false
                hints:
                  - "Lies den Satz. Schau dann das Bild an."
                  - "Im Satz steht Hund. Ist auf dem Bild ein Hund?"
                  - "Nein, auf dem Bild ist eine Katze."
              - id: l1-f4
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Hier sind drei Eier." }
                options: [{ object: egg, count: 2, layout: row }, { object: egg, count: 3, layout: row }, { object: egg, count: 1, layout: row }]
                answer: "3"
                hints:
                  - "Alle Bilder zeigen Eier. Lies genau, wie viele es sind."
                  - "Lies das Wort vor Eier ganz genau. Zähl dann die Eier auf jedem Bild."
                  - "Drei Eier."
              - id: l1-f5
                type: ordering
                text: "Bau den Satz zum Bild."
                say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
                show: { object: fish }
                options: ["schwimmt.", "Fisch", "Der"]
                slot_count: 3
                answer: ["Der", "Fisch", "schwimmt."]
                option_audio: false
                hints:
                  - "Ein Satz fängt mit einem großen Buchstaben an und hört mit einem Punkt auf."
                  - "Welches Wort hat einen großen Buchstaben und passt an den Anfang? Welches hat den Punkt?"
                  - "Der Fisch schwimmt."
              - id: l1-f6
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Lies die Sätze. Welcher Satz passt zum Bild?"
                show: { object: car, colour: red }
                options: ["Das Auto ist blau.", "Das Auto ist rot.", "Die Rose ist rot."]
                answer: "Das Auto ist rot."
                option_audio: false
                feedback:
                  "Die Rose ist rot.": "Rot stimmt. Aber auf dem Bild ist keine Rose."
                hints:
                  - "Was ist auf dem Bild? Welche Farbe hat es?"
                  - "Es ist ein rotes Auto. Welcher Satz sagt beides?"
                  - "Das Auto ist rot."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Das Auto ist gelb." }
                options: [{ object: car, colour: red }, { object: car, colour: yellow }, { object: car, colour: blue }]
                answer: yellow
                hints: ["Lies bis zum Punkt. Das letzte Wort sagt die Farbe."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Die Kuh gibt Milch." }
                options: [{ object: goat }, { object: pig }, { object: cow }]
                answer: cow
                feedback:
                  pig: "Schweinemilch zum Frühstück? Lieber nicht! Lies das zweite Wort genau."
                hints: ["Welches Tier steht im Satz?"]
              - id: l1-s3
                type: true_false
                text: "Der Ball ist blau.\n\nPasst der Satz zum Bild?"
                say: "Lies den Satz. Passt er zum Bild?"
                show: { object: ball, colour: blue }
                answer: true
                hints: ["Stimmt das Ding? Stimmt die Farbe?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Lisa hat zwei Bananen." }
                options: [{ object: banana, count: 1, layout: row }, { object: banana, count: 3, layout: row }, { object: banana, count: 2, layout: row }]
                answer: "2"
                hints: ["Wie viele Bananen hat Lisa? Lies genau."]
              - id: l1-s5
                type: ordering
                text: "Bau den Satz zum Bild."
                say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
                show: { object: cat }
                options: ["Katze", "miaut.", "Die"]
                slot_count: 3
                answer: ["Die", "Katze", "miaut."]
                option_audio: false
                hints: ["Das Wort mit dem Punkt kommt ans Ende."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Das Kind malt." }
                options: [{ object: read }, { object: dance }, { object: paint }]
                answer: paint
              - id: l1-n2
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Der Luftballon ist blau." }
                options: [{ object: balloon, colour: green }, { object: balloon, colour: blue }, { object: balloon, colour: red }]
                answer: blue
              - id: l1-n3
                type: true_false
                text: "Die Sonne scheint.\n\nPasst der Satz zum Bild?"
                say: "Lies den Satz. Passt er zum Bild?"
                show: { object: moon }
                answer: false
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Lies die Sätze. Welcher Satz passt zum Bild?"
                show: { object: egg, count: 2, layout: row }
                options: ["Hier ist ein Ei.", "Hier sind drei Eier.", "Hier sind zwei Eier."]
                answer: "Hier sind zwei Eier."
                option_audio: false
              - id: l1-n5
                type: ordering
                text: "Bau den Satz zum Bild."
                say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
                show: { object: dance }
                options: ["tanzt.", "Kind", "Das"]
                slot_count: 3
                answer: ["Das", "Kind", "tanzt."]
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Das ist eine Maus." }
            options: [{ object: house }, { object: mouse }, { object: nose }]
            answer: mouse
            option_audio: false
          - id: l1-c2
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Das Auto ist braun." }
            options: [{ object: car, colour: blue }, { object: car, colour: red }, { object: car, colour: brown }]
            answer: brown
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Der Hund bellt.\n\nPasst der Satz zum Bild?"
            say: "Lies den Satz. Passt er zum Bild?"
            show: { object: dog }
            answer: true
          - id: l1-c4
            type: true_false
            text: "Das Kind schwimmt.\n\nPasst der Satz zum Bild?"
            say: "Lies den Satz. Passt er zum Bild?"
            show: { object: swim }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Lies die Sätze. Welcher Satz passt zum Bild?"
            show: { object: ball, colour: yellow }
            options: ["Der Ball ist rot.", "Die Banane ist gelb.", "Der Ball ist gelb."]
            answer: "Der Ball ist gelb."
            option_audio: false
          - id: l1-c6
            type: ordering
            text: "Bau den Satz zum Bild."
            say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
            show: { object: bee }
            options: ["summt.", "Biene", "Die"]
            slot_count: 3
            answer: ["Die", "Biene", "summt."]
            option_audio: false

  - n: 2
    title: { de: Genau lesen, en: Reading carefully }
    goal:
      de: "Lies jedes Wort ganz genau, denn manchmal ist nur eins anders, wie bei Hund und Mund."
      en: "Read every word carefully, because sometimes only one is different, like Hund and Mund."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Der Ball ist gelb." }
            options: [{ object: ball, colour: yellow }, { object: ball, colour: red }]
            answer: yellow
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Das ist eine Katze.\n\nPasst der Satz zum Bild?"
            say: "Lies den Satz. Passt er zum Bild?"
            show: { object: cat }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Hund ist braun.\nDer Mund ist rot."
            say: "Schau dir die zwei Sätze genau an. Was glaubst du: Wie viele Wörter sind anders?"
          - text: "Der Hund ist braun.\nDer Mund ist rot."
            say: "Zwei Wörter: Hund und Mund, braun und rot. Hund und Mund sehen fast gleich aus, nur ein Buchstabe ist anders. Darum liest du jedes Wort genau, von vorne bis hinten."
          - text: "Es ist gelb. Es ist am Himmel."
            say: "Manchmal brauchst du zwei Sätze. Es ist gelb. Es ist am Himmel. Gelb ist auch eine Banane. Aber am Himmel ist nur die Sonne. Erst beide Sätze zusammen sagen dir, was gemeint ist."
            show: { object: sun }
          - text: "Noch einmal lesen und prüfen."
            say: "Hast du ein Bild gewählt? Dann lies den Satz noch einmal. Passt jedes Wort zum Bild?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Lies die Sätze genau. Welcher Satz passt zum Bild?"
                show: { object: dog }
                options: ["Das ist ein Mund.", "Das ist ein Hund.", "Das ist ein Hut."]
                answer: "Das ist ein Hund."
                option_audio: false
                feedback:
                  "Das ist ein Mund.": "Lies genau: Mund fängt mit M an. Auf dem Bild ist ein Hund."
                  "Das ist ein Hut.": "Hut fängt wie Hund an. Lies das Wort bis zum Ende."
                hints:
                  - "Die Sätze sind fast gleich. Schau auf das letzte Wort."
                  - "Mund, Hund, Hut. Welches Wort passt zum Bild?"
                  - "Das ist ein Hund."
              - id: l2-f2
                type: image_multiple_choice
                text: "Lies die Sätze. Welches Bild passt?"
                show: { drawn: word-card, text: "Es ist gelb. Es ist am Himmel." }
                options: [{ object: banana }, { object: moon }, { object: sun }]
                answer: sun
                feedback:
                  banana: "Die Banane ist gelb. Aber ist sie am Himmel?"
                  moon: "Der Mond ist am Himmel. Lies auch den ersten Satz."
                hints:
                  - "Lies beide Sätze."
                  - "Was ist gelb? Was ist am Himmel? Was ist beides?"
                  - "Die Sonne."
              - id: l2-f3
                type: true_false
                text: "Der Ball ist blau.\n\nPasst der Satz zum Bild?"
                say: "Lies den Satz genau. Passt er zum Bild?"
                show: { object: ball, colour: red }
                answer: false
                hints:
                  - "Lies bis zum Punkt."
                  - "Im Satz steht blau. Welche Farbe hat der Ball?"
                  - "Nein, der Ball ist rot."
              - id: l2-f4
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Hier sind zwei Hasen." }
                options:
                  - { object: rabbit, count: 3, layout: row, key: rabbits-3 }
                  - { object: dog, count: 2, layout: row, key: dogs-2 }
                  - { object: rabbit, count: 2, layout: row, key: rabbits-2 }
                answer: rabbits-2
                hints:
                  - "Lies jedes Wort. Welches Tier? Wie viele?"
                  - "Zwei ... Hasen. Zähl auf jedem Bild."
                  - "Zwei Hasen."
              - id: l2-f5
                type: ordering
                text: "Bau den Satz zum Bild."
                say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
                show: { object: car, colour: blue }
                options: ["ist", "Das", "blau.", "Auto"]
                slot_count: 4
                answer: ["Das", "Auto", "ist", "blau."]
                option_audio: false
                hints:
                  - "Fang mit dem großen Buchstaben an. Das Wort mit dem Punkt kommt ans Ende."
                  - "Das ... Auto ... und dann?"
                  - "Das Auto ist blau."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Lies die Sätze genau. Welcher Satz passt zum Bild?"
                show: { object: hat }
                options: ["Das ist ein Haus.", "Das ist eine Hand.", "Das ist ein Hut."]
                answer: "Das ist ein Hut."
                option_audio: false
                hints: ["Alle Wörter fangen mit H an. Lies sie bis zum Ende."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Lies die Sätze. Welches Bild passt?"
                show: { drawn: word-card, text: "Es ist rund. Man kann es werfen." }
                options: [{ object: moon }, { object: egg }, { object: ball }]
                answer: ball
                hints: ["Was ist rund? Und was kann man werfen?"]
              - id: l2-s3
                type: true_false
                text: "Der Fisch kann fliegen.\n\nPasst der Satz zum Bild?"
                say: "Lies den Satz genau. Passt er zum Bild?"
                show: { object: fish }
                answer: false
                hints: ["Lies das letzte Wort. Kann ein Fisch das?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Hier ist ein Ei." }
                options: [{ object: egg, count: 3, layout: row }, { object: egg, count: 1, layout: row }, { object: egg, count: 2, layout: row }]
                answer: "1"
                hints: ["Lies das Wort vor Ei genau. Wie viele Eier sind das?"]
              - id: l2-s5
                type: ordering
                text: "Bau den Satz zum Bild."
                say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
                show: { object: cow }
                options: ["Kuh", "Milch.", "Die", "gibt"]
                slot_count: 4
                answer: ["Die", "Kuh", "gibt", "Milch."]
                option_audio: false
                hints: ["Die ... Kuh ... Was macht sie?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Satz passt zum Bild?"
                say: "Lies die Sätze genau. Welcher Satz passt zum Bild?"
                show: { object: rose }
                options: ["Das ist eine Hose.", "Das ist eine Rose.", "Das ist eine Dose."]
                answer: "Das ist eine Rose."
                option_audio: false
              - id: l2-n2
                type: image_multiple_choice
                text: "Lies die Sätze. Welches Bild passt?"
                show: { drawn: word-card, text: "Es ist ein Tier. Es hat acht Arme." }
                options: [{ object: fish }, { object: octopus }, { object: frog }]
                answer: octopus
              - id: l2-n3
                type: true_false
                text: "Das Auto ist gelb.\n\nPasst der Satz zum Bild?"
                say: "Lies den Satz genau. Passt er zum Bild?"
                show: { object: car, colour: yellow }
                answer: true
              - id: l2-n4
                type: image_multiple_choice
                text: "Lies den Satz. Welches Bild passt?"
                show: { drawn: word-card, text: "Der Luftballon ist rot." }
                options: [{ object: balloon, colour: pink }, { object: balloon, colour: blue }, { object: balloon, colour: red }]
                answer: red
              - id: l2-n5
                type: ordering
                text: "Bau den Satz zum Bild."
                say: "Bau den Satz zum Bild. Tippe die Wörter der Reihe nach an."
                show: { object: hat }
                options: ["Hut.", "Papa", "einen", "hat"]
                slot_count: 4
                answer: ["Papa", "hat", "einen", "Hut."]
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: whole-sentence
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Die Katze miaut." }
            options: [{ object: dog }, { object: mouse }, { object: cat }]
            answer: cat
            option_audio: false
          - id: l2-c2
            part: whole-sentence
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Der Ball ist grün." }
            options:
              - { object: ball, colour: red, key: ball-red }
              - { object: car, colour: green, key: car-green }
              - { object: ball, colour: green, key: ball-green }
            answer: ball-green
            option_audio: false
          - id: l2-c3
            part: check-picture
            type: true_false
            text: "Hier sind zwei Eier.\n\nPasst der Satz zum Bild?"
            say: "Lies den Satz genau. Passt er zum Bild?"
            show: { object: egg, count: 3, layout: row }
            answer: false
          - id: l2-c5
            part: two-sentences
            type: image_multiple_choice
            text: "Lies die Sätze. Welches Bild passt?"
            show: { drawn: word-card, text: "Es ist ein Tier. Es macht Muh." }
            options: [{ object: pig }, { object: cow }, { object: dog }]
            answer: cow
            option_audio: false
          - id: l2-c6
            part: whole-sentence
            type: image_multiple_choice
            text: "Lies den Satz. Welches Bild passt?"
            show: { drawn: word-card, text: "Der Luftballon ist lila." }
            options:
              - { object: ball, colour: purple, key: ball-purple }
              - { object: balloon, colour: red, key: balloon-red }
              - { object: balloon, colour: purple, key: balloon-purple }
            answer: balloon-purple
