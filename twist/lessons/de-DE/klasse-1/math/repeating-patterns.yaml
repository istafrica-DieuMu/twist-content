        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "rot, blau, rot, blau, _"
            say: "Rot, blau, rot, blau. Welche Farbe kommt als Nächstes?"
            options: ["rot", "blau"]
            answer: "rot"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Teil wiederholt sich?"
            say: "Kreis, Dreieck, Kreis, Dreieck. Welcher Teil wiederholt sich?"
            show: { drawn: shape, row: [circle, triangle, circle, triangle], colours: [red, blue, red, blue] }
            options: ["Kreis, Dreieck", "Kreis, Kreis"]
            answer: "Kreis, Dreieck"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Kreis, Quadrat, ?, Quadrat"
            say: "Hier fehlt eine Form in der Mitte. Kreis, Quadrat, und dann? Danach kommt wieder das Quadrat. Also fehlt der Kreis."
            show: { drawn: shape, row: [circle, square, "?", square], colours: [red, blue, null, blue] }
          - text: "Ein Fehler im Muster"
            say: "Dreieck, Kreis, Dreieck, Kreis, Kreis. Die letzte Form passt nicht. Nach dem Kreis müsste das Dreieck kommen."
            show: { drawn: shape, row: [triangle, circle, triangle, circle, circle], colours: [green, yellow, green, yellow, yellow] }
          - text: "1, 2, 1, 2, 1, 2"
            say: "Auch Zahlen können ein Muster bilden: eins, zwei, eins, zwei. Als Nächstes kommt die Eins."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was fehlt?"
                say: "Dreieck, Kreis, Lücke, Kreis. Welche Form fehlt?"
                show: { drawn: shape, row: [triangle, circle, "?", circle], colours: [orange, purple, null, purple] }
                options:
                  - { drawn: shape, kind: triangle, colour: orange }
                  - { drawn: shape, kind: circle, colour: purple }
                  - { drawn: shape, kind: square, colour: green }
                answer: triangle
                option_audio: false
