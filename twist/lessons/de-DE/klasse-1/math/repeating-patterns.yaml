                answer: "Kreis, Kreis, Quadrat"
                hints: ["Sprich das Muster laut mit."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Rechteck, Kreis, Rechteck, Kreis. Was kommt als Nächstes?"
                show: { drawn: shape, row: [rectangle, circle, rectangle, circle, "?"], colours: [orange, purple, orange, purple] }
