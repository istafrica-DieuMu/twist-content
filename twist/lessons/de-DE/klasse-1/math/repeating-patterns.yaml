                say: "Blau, grün, grün, blau, grün, grün. Welche Farbe kommt als Nächstes?"
                show: { drawn: shape, row: [circle, circle, circle, circle, circle, circle, "?"], colours: [blue, green, green, blue, green, green] }
                options: ["blau", "grün", "gelb"]
                answer: "blau"
              - id: l1-n3
                type: image_multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Quadrat, Kreis, Dreieck, Quadrat, Kreis. Was kommt als Nächstes?"
