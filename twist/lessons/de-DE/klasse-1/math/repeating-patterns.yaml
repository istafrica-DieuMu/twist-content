          - id: l1-c4
            type: image_multiple_choice
            text: "Was kommt als Nächstes?"
            say: "Kreis, Dreieck, Dreieck, Kreis, Dreieck, Dreieck. Was kommt als Nächstes?"
            show: { drawn: shape, row: [circle, triangle, triangle, circle, triangle, triangle, "?"], colours: [blue, yellow, yellow, blue, yellow, yellow] }
            options:
              - { drawn: shape, kind: triangle, colour: yellow }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: square, colour: red }
            answer: circle
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Teil wiederholt sich?"
            say: "Welcher Teil wiederholt sich in diesem Muster?"
