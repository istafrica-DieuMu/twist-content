                say: "Eine Form passt nicht ins Muster. Die wievielte Form ist es?"
                show: { drawn: shape, row: [square, circle, square, circle, circle, circle], colours: [blue, red, blue, red, red, red] }
                options: ["die fünfte", "die erste", "die zweite"]
                answer: "die fünfte"
                hints:
                  - "Sprich das Muster mit: Quadrat, Kreis, Quadrat, Kreis ..."
                  - "Die vierte Form ist ein Kreis. Danach müsste ein Quadrat kommen."
                  - "Die fünfte Form."
              - id: l2-f3
                type: multiple_choice
                text: "1, 2, 1, 2, 1, _"
                say: "Eins, zwei, eins, zwei, eins. Welche Zahl kommt als Nächstes?"
                options: ["2", "1", "3"]
                answer: "2"
                option_audio: false
