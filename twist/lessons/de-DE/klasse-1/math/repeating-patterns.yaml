# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.repeating-patterns
skill: math.patterns.repeating
curriculum: de-DE
language: de
title:
  de: Muster fortsetzen
  en: Continuing patterns
summary: >
  Lesson 1 finds the part of a shape or colour pattern that repeats
  (Kreis, Dreieck, Kreis, Dreieck) and continues it; lesson 2 finds the
  gap in the middle of a pattern, the shape that breaks it and simple
  number patterns (1, 2, 1, 2), and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Muster, en: Patterns }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.shapes.basic-shapes, math.numbers-to-20.count-to-10]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { de: [Muster, fortsetzen, wiederholen, Reihe, als Nächstes, Lücke] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: continue, what: { de: ein Muster aus Formen oder Farben erkennen und fortsetzen, en: recognising and continuing a shape or colour pattern } }
    - { id: gap, what: { de: die Lücke in einem Muster füllen, en: filling a gap in a pattern } }
    - { id: mistake, what: { de: einen Fehler im Muster finden, en: spotting a mistake in a pattern } }
    - { id: numbers, what: { de: Zahlenmuster fortsetzen, en: continuing a number pattern } }
  misconceptions:
    - id: repeats-last
      what: Repeats the last item instead of continuing the unit (Kreis, Dreieck, Kreis, Dreieck, then Dreieck again)
      addressed: lesson 1 Learn marks the part that repeats; every stage of lesson 1 offers the last shape again, with feedback in l1-f1
    - id: unit-of-two-only
      what: Expects every pattern to repeat after two items and misreads an ABC or AAB pattern
      addressed: lesson 1 Learn shows Kreis, Kreis, Quadrat; l1-f4, l1-s3 and l1-n3 have three-part units
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was kommt als Nächstes?", en: "What comes next?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form?"
            show: { drawn: shape, kind: triangle, colour: green }
            options: ["Dreieck", "Kreis"]
            answer: "Dreieck"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "1, 2, 3, _"
            say: "Eins, zwei, drei. Welche Zahl kommt als Nächstes?"
            options: ["4", "5", "1"]
            answer: "4"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Kreis, Dreieck, Kreis, Dreieck"
            say: "Das ist ein Muster. Kreis, Dreieck, Kreis, Dreieck. Kreis und Dreieck kommen immer wieder. Das ist der Teil, der sich wiederholt."
            show: { drawn: shape, row: [circle, triangle, circle, triangle], colours: [red, blue, red, blue] }
          - text: "Kreis, Dreieck, Kreis, Dreieck, ?"
            say: "Wie geht es weiter? Nach dem Dreieck fängt der Teil wieder von vorn an: mit dem Kreis."
            show: { drawn: shape, row: [circle, triangle, circle, triangle, "?"], colours: [red, blue, red, blue] }
          - text: "Kreis, Kreis, Quadrat"
            say: "Manche Muster haben drei Teile: Kreis, Kreis, Quadrat. Kreis, Kreis, Quadrat. Sprich das Muster laut mit, dann hörst du es."
            show: { drawn: shape, row: [circle, circle, square, circle, circle, square], colours: [yellow, yellow, green, yellow, yellow, green] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Quadrat, Kreis, Quadrat, Kreis. Was kommt als Nächstes?"
                show: { drawn: shape, row: [square, circle, square, circle, "?"], colours: [blue, yellow, blue, yellow] }
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: circle, colour: yellow }
                  - { drawn: shape, kind: triangle, colour: red }
                answer: square
                option_audio: false
                feedback:
                  circle: "Der Kreis war gerade dran. Nach dem Kreis fängt das Muster wieder mit dem Quadrat an."
                hints:
                  - "Welcher Teil kommt immer wieder?"
                  - "Quadrat, Kreis. Und dann wieder von vorn."
                  - "Das Quadrat."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "rot, blau, rot, blau, _"
                say: "Rot, blau, rot, blau. Welche Farbe kommt als Nächstes?"
                show: { drawn: shape, row: [circle, circle, circle, circle, "?"], colours: [red, blue, red, blue] }
                options: ["rot", "blau", "grün"]
                answer: "rot"
                hints:
                  - "Sprich das Muster laut mit."
                  - "Nach blau fängt es wieder an."
                  - "Rot."
              - id: l1-f3
                type: image_multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Dreieck, Dreieck, Kreis, Dreieck, Dreieck. Was kommt als Nächstes?"
                show: { drawn: shape, row: [triangle, triangle, circle, triangle, triangle, "?"], colours: [green, green, orange, green, green] }
                options:
                  - { drawn: shape, kind: circle, colour: orange }
                  - { drawn: shape, kind: triangle, colour: green }
                  - { drawn: shape, kind: square, colour: blue }
                answer: circle
                option_audio: false
                hints:
                  - "Der Teil hat drei Formen."
                  - "Dreieck, Dreieck, Kreis."
                  - "Der Kreis."
              - id: l1-f4
                type: true_false
                text: "Kreis, Quadrat, Dreieck, Kreis, Quadrat. Als Nächstes kommt das Dreieck."
                say: "Kreis, Quadrat, Dreieck, Kreis, Quadrat. Stimmt das: Als Nächstes kommt das Dreieck?"
                show: { drawn: shape, row: [circle, square, triangle, circle, square, "?"], colours: [red, blue, yellow, red, blue] }
                answer: true
                hints:
                  - "Der Teil hat drei Formen."
                  - "Kreis, Quadrat, Dreieck."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Welcher Teil wiederholt sich?"
                say: "Welcher Teil wiederholt sich in diesem Muster?"
                show: { drawn: shape, row: [square, triangle, square, triangle, square, triangle], colours: [purple, orange, purple, orange, purple, orange] }
                options: ["Quadrat, Dreieck", "Quadrat, Quadrat", "Dreieck, Kreis"]
                answer: "Quadrat, Dreieck"
                hints:
                  - "Schau auf die ersten Formen."
                  - "Danach kommt dasselbe noch einmal."
                  - "Quadrat, Dreieck."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was kommt als Nächstes?"
                say: "Dreieck, Kreis, Dreieck, Kreis. Was kommt als Nächstes?"
                show: { drawn: shape, row: [triangle, circle, triangle, circle, "?"], colours: [red, green, red, green] }
