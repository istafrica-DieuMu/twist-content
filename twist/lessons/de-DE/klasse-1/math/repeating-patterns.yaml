                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Dreieck, Quadrat, Dreieck, Quadrat. Als Nächstes kommt das Dreieck."
                say: "Dreieck, Quadrat, Dreieck, Quadrat. Stimmt das: Als Nächstes kommt das Dreieck?"
                show: { drawn: shape, row: [triangle, square, triangle, square, "?"], colours: [yellow, purple, yellow, purple] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Welcher Teil wiederholt sich?"
                say: "Welcher Teil wiederholt sich in diesem Muster?"
                show: { drawn: shape, row: [triangle, circle, square, triangle, circle, square], colours: [green, green, green, green, green, green] }
                options: ["Dreieck, Kreis, Quadrat", "Dreieck, Kreis", "Kreis, Quadrat"]
                answer: "Dreieck, Kreis, Quadrat"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wie geht das Muster weiter?"
            say: "Kreis, Quadrat, Kreis, Quadrat. Wie geht das Muster weiter?"
            show: { drawn: shape, row: [circle, square, circle, square, "?"], colours: [green, orange, green, orange] }
