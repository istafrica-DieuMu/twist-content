                show: { drawn: shape, row: [circle, triangle, square, circle, triangle, "?"], colours: [blue, blue, blue, blue, blue] }
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                answer: square
                option_audio: false
                hints: ["Der Teil hat drei Formen."]
              - id: l1-s4
                type: true_false
                text: "rot, blau, rot, blau. Als Nächstes kommt blau."
                say: "Rot, blau, rot, blau. Stimmt das: Als Nächstes kommt blau?"
                show: { drawn: shape, row: [triangle, triangle, triangle, triangle, "?"], colours: [red, blue, red, blue] }
                answer: false
                hints: ["Nach blau fängt es wieder an."]
              - id: l1-s5
                type: multiple_choice
                text: "Welcher Teil wiederholt sich?"
                say: "Welcher Teil wiederholt sich in diesem Muster?"
                show: { drawn: shape, row: [circle, circle, square, circle, circle, square], colours: [red, red, green, red, red, green] }
