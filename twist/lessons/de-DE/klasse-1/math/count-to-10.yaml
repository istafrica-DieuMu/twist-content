# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.count-to-10
skill: math.numbers-to-20.count-to-10
curriculum: de-DE
language: de
title:
  de: Zählen bis 10
  en: Counting to 10
summary: >
  Children count up to 10 things. Lesson 1 counts things in a row, where
  it is easy to keep track; lesson 2 counts things that lie scattered,
  where the trick is to mark what has been counted (tapping does that), and
  ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.count-to-5]
  also_practises: []
  vocabulary: { de: [zählen, wie viele, sechs, sieben, acht, neun, zehn, durcheinander] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: in-a-row, what: { de: bis zu 10 Dinge in einer Reihe abzählen, en: counting up to 10 things in a row } }
    - { id: scattered, what: { de: "bis zu 10 Dinge abzählen, die durcheinanderliegen", en: counting up to 10 scattered things } }
    - { id: find-group, what: { de: die Gruppe mit einer bestimmten Anzahl finden, en: finding the group with a given number } }
  misconceptions:
    - id: lose-track
      what: Loses track in a scattered group and counts some things twice or not at all
      addressed: lesson 2 Learn shows each counted thing marked; tap_to_count marks it; hints say "Tippe nur die ohne Zahl."
    - id: stop-at-5
      what: Counts on beyond 5 unsure of the number words (sechs, sieben)
      addressed: lesson 1 Learn counts 6 to 10 aloud; full-hint tasks say the count in words
    - id: last-number
      what: Says the whole counting sequence as the answer instead of the last number
      addressed: true_false tasks ask "Sind das 8 ...?" after counting; Learn repeats "Die letzte Zahl sagt, wie viele es sind."
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zählen bis 10, en: Counting to 10 }
    goal:
      de: "Zähl Dinge in einer Reihe bis 10. Nach sechs kommt sieben, dann acht, neun und zehn."
      en: "Count things in a row up to 10. After six comes seven, then eight, nine and ten."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "Tippe jeden Ball einmal an. Wie viele sind es?"
            show: { object: ball, count: 4, layout: row }
            options: ["3", "4", "5"]
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Äpfel sind es?"
            show: { object: apple, count: 5, layout: scattered }
            options: ["4", "5", "6"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Mehr als 5?"
            say: "Was glaubst du: Sind das mehr als fünf Erdbeeren? Rate erst, dann zählen wir."
            show: { object: strawberry, count: 6, layout: row }
          - text: "1, 2, 3, 4, 5, 6"
            say: "Wir zählen weiter als bis fünf. Eins, zwei, drei, vier, fünf, sechs. Ja, mehr als fünf: Es sind sechs Erdbeeren."
            show: { object: strawberry, count: 6, layout: row }
          - text: "7, 8"
            say: "Nach sechs kommt sieben, dann acht. Eins, zwei, drei, vier, fünf, sechs, sieben, acht. Acht Möhren."
            show: { object: carrot, count: 8, layout: row }
          - text: "9, 10"
            say: "Nach acht kommt neun, dann zehn. Zehn Murmeln. Die letzte Zahl sagt, wie viele es sind."
            show: { object: marble, count: 10, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tap_to_count
                text: "Tippe jeden Apfel einmal an. Wie viele sind es?"
                show: { object: apple, count: 6, layout: row }
                options: ["5", "6", "7"]
                answer: "6"
                hints:
                  - "Fang beim ersten Apfel an und tippe einen nach dem anderen."
                  - "Zähl beim Tippen mit: eins, zwei, drei, vier, fünf, sechs."
                  - "Es sind 6 Äpfel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Fische sind es?"
                show: { object: fish, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
                feedback:
                  "6": "Fast. Zähl bis zum letzten Fisch."
                  "8": "Hast du einen Fisch zweimal gezählt?"
                hints:
                  - "Zeig auf jeden Fisch genau einmal."
                  - "Nach sechs kommt sieben."
                  - "Es sind 7 Fische."
              - id: l1-f3
                type: image_multiple_choice
                text: "Wo sind 8 Bälle?"
                options:
                  - { object: ball, count: 8, layout: row }
                  - { object: ball, count: 6, layout: row }
                  - { object: ball, count: 10, layout: row }
                answer: "8"
                hints:
                  - "Zähl die Bälle in jedem Bild."
                  - "Ein Bild hat sechs, ein anderes zehn."
                  - "Such das Bild, bei dem du bei acht aufhörst."
              - id: l1-f4
                type: true_false
                text: "Sind das 9 Eier?"
                say: "Zähl die Eier. Sind das neun Eier?"
                show: { object: egg, count: 9, layout: row }
                answer: true
                hints:
                  - "Zähl die Eier, eins nach dem anderen."
                  - "Eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun."
                  - "Ja, es sind 9 Eier."
              - id: l1-f5
                type: tap_to_count
                text: "Tippe jeden Luftballon einmal an. Wie viele sind es?"
                show: { object: balloon, count: 10, layout: row }
                options: ["8", "9", "10"]
                answer: "10"
                hints:
                  - "Tippe einen Luftballon nach dem anderen, bis alle eine Zahl haben."
                  - "Nach neun kommt zehn."
                  - "Es sind 10 Luftballons."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele Blätter sind es?"
                show: { object: leaf, count: 8, layout: row }
                options: ["7", "8", "9"]
                answer: "8"
                feedback:
                  "9": "Zeig auf jedes Blatt nur einmal und zähl noch einmal."
                hints:
                  - "Fang links an."
                  - "Eins, zwei, drei, vier, fünf, sechs, sieben, acht."
                  - "Es sind 8 Blätter."

          - support: some
            tasks:
              - id: l1-s1
                type: tap_to_count
                text: "Tippe jede Banane einmal an. Wie viele sind es?"
                show: { object: banana, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["Tippe und zähl mit, bis keine Banane mehr ohne Zahl ist."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo sind 6 Frösche?"
                options:
                  - { object: lion, count: 1, layout: row }
                  - { object: frog, count: 7, layout: row }
                  - { object: frog, count: 6, layout: row }
                answer: "6"
                feedback:
                  "1": "Das ist ein Löwe! Der quakt nicht und ist kein Frosch."
                hints: ["Zähl in jedem Bild bis zum letzten Frosch."]
              - id: l1-s3
                type: true_false
                text: "Sind das 10 Sticker?"
                say: "Zähl die Sticker. Sind das zehn Sticker?"
                show: { object: sticker, count: 9, layout: row }
                answer: false
                hints: ["Zähl genau bis zum letzten Sticker. Kommst du bis zehn?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Buntstifte sind es?"
                show: { object: crayon, count: 9, layout: row }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Welche Zahl sagst du beim letzten Buntstift?"]
              - id: l1-s5
                type: tap_to_count
                text: "Tippe jede Möhre einmal an. Wie viele sind es?"
                show: { object: carrot, count: 6, layout: row }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["Fang links an und tippe eine nach der anderen."]
              - id: l1-s6
                type: image_multiple_choice
                text: "Wo sind 10 Murmeln?"
                options:
                  - { object: marble, count: 9, layout: row }
                  - { object: marble, count: 10, layout: row }
                  - { object: marble, count: 8, layout: row }
                answer: "10"
                hints: ["Zähl in jedem Bild. In welchem kommst du bis zehn?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Oma hat Erdbeeren gepflückt. Wie viele Erdbeeren sind es?"
                show: { object: strawberry, count: 8, layout: row }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l1-n2
                type: tap_to_count
                text: "Tippe jedes Auto einmal an. Wie viele sind es?"
                show: { object: car, count: 7, layout: row }
                options: ["6", "7", "8"]
                answer: "7"
              - id: l1-n3
                type: true_false
                text: "Sind das 6 Mäuse?"
                say: "Zähl die Mäuse. Sind das sechs Mäuse?"
                show: { object: mouse, count: 6, layout: row }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Wo sind 9 Äpfel?"
                options:
                  - { object: apple, count: 10, layout: row }
                  - { object: apple, count: 7, layout: row }
                  - { object: apple, count: 9, layout: row }
                answer: "9"
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Ameisen sind es?"
                show: { object: ant, count: 10, layout: row }
                options: ["8", "9", "10"]
                answer: "10"
                difficulty: stretch

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Bälle sind es?"
            show: { object: ball, count: 7, layout: row }
            options: ["6", "7", "8"]
            answer: "7"
          - id: l1-c2
            type: image_multiple_choice
            text: "Wo sind 8 Eier?"
            options:
              - { object: egg, count: 9, layout: row }
              - { object: egg, count: 8, layout: row }
              - { object: egg, count: 6, layout: row }
            answer: "8"
          - id: l1-c3
            type: tap_to_count
            text: "Tippe jeden Fisch einmal an. Wie viele sind es?"
            show: { object: fish, count: 10, layout: row }
            options: ["8", "9", "10"]
            answer: "10"
          - id: l1-c4
            type: true_false
            text: "Sind das 8 Frösche?"
            say: "Sind das acht Frösche?"
            show: { object: frog, count: 8, layout: row }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele Luftballons sind es?"
            show: { object: balloon, count: 9, layout: row }
            options: ["8", "9", "10"]
            answer: "9"
          - id: l1-c6
            type: image_multiple_choice
            text: "Wo sind 7 Möhren?"
            options:
              - { object: carrot, count: 6, layout: row }
              - { object: carrot, count: 7, layout: row }
              - { object: carrot, count: 9, layout: row }
            answer: "7"

  - n: 2
    title: { de: Durcheinander zählen, en: Counting scattered things }
    goal:
      de: "Zähl Dinge, die durcheinander liegen. Tipp jeden Fisch an, den du gezählt hast, dann vergisst du keinen."
      en: "Count things that are all mixed up. Tap each fish you have counted, so you do not miss one."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Murmeln sind es?"
            show: { object: marble, count: 8, layout: row }
            options: ["7", "8", "9"]
            answer: "8"
            difficulty: easy
          - id: l2-w2
            type: tap_to_count
            text: "Tippe jede Erdbeere einmal an. Wie viele sind es?"
            show: { object: strawberry, count: 6, layout: row }
            options: ["5", "6", "7"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wie viele?"
            say: "Diese Fische schwimmen durcheinander. Was glaubst du: Wie viele sind es? Wenn sie nicht in einer Reihe sind, vergisst man leicht einen."
            show: { object: fish, count: 8, layout: scattered }
          - text: "1, 2, 3 ..."
            say: "Der Trick: Jeden Fisch, den du gezählt hast, markierst du. Tippe ihn an, dann bekommt er seine Zahl. So weißt du immer, welche noch fehlen."
            show: { object: fish, count: 8, layout: scattered }
          - text: "8"
            say: "Wir zählen, bis kein Fisch mehr ohne Zahl ist: eins, zwei, drei, vier, fünf, sechs, sieben, acht. Es sind acht Fische, genauso viele wie in einer Reihe."
            show: { object: fish, count: 8, layout: row }
          - text: "Wusstest du? Eine Spinne hat 8 Beine. Eine Ameise hat nur 6."
            say: "Wusstest du? Eine Spinne hat acht Beine. Eine Ameise hat nur sechs. Wenn du eine Spinne siehst, zähl mal mit!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tap_to_count
                text: "Tippe jeden Luftballon einmal an. Wie viele sind es?"
                show: { object: balloon, count: 6, layout: scattered }
                options: ["5", "6", "7"]
                answer: "6"
                hints:
                  - "Jeder Luftballon, den du antippst, bekommt eine Zahl."
                  - "Such die Luftballons, die noch keine Zahl haben."
                  - "Es sind 6 Luftballons."
                difficulty: easy
              - id: l2-f2
                type: tap_to_count
                text: "Tippe jedes Ei einmal an. Wie viele sind es?"
                show: { object: egg, count: 8, layout: scattered }
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Fang bei einem Ei am Rand an."
                  - "Tippe nur die Eier ohne Zahl, bis alle eine haben."
                  - "Es sind 8 Eier."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Ameisen sind es?"
                show: { object: ant, count: 7, layout: scattered }
                options: ["6", "7", "8"]
                answer: "7"
                feedback:
                  "6": "Eine Ameise hast du ausgelassen. Zähl noch einmal und merk dir, wo du angefangen hast."
                  "8": "Eine Ameise hast du zweimal gezählt."
                hints:
                  - "Zeig mit dem Finger auf jede Ameise genau einmal."
                  - "Zähl von oben nach unten, so lässt du keine aus."
                  - "Es sind 7 Ameisen."
              - id: l2-f4
                type: true_false
                text: "Sind das 9 Sticker?"
                say: "Zähl die Sticker. Sind das neun Sticker?"
                show: { object: sticker, count: 9, layout: scattered }
                answer: true
                hints:
                  - "Zeig auf jeden Sticker genau einmal."
                  - "Zähl von oben nach unten."
                  - "Ja, es sind 9 Sticker."
              - id: l2-f5
                type: image_multiple_choice
                text: "Wo sind 7 Blätter?"
                options:
                  - { object: leaf, count: 7, layout: scattered }
                  - { object: leaf, count: 9, layout: scattered }
                  - { object: leaf, count: 5, layout: scattered }
                answer: "7"
                hints:
                  - "Zähl die Blätter in jedem Bild."
                  - "In einem Bild sind fünf, in einem anderen neun."
                  - "Such das Bild, bei dem du bei sieben aufhörst."
              - id: l2-f6
                type: tap_to_count
                text: "Tippe jeden Ball einmal an. Wie viele sind es?"
                show: { object: ball, count: 10, layout: scattered }
                options: ["8", "9", "10"]
                answer: "10"
                hints:
                  - "Viele Bälle! Tippe einen nach dem anderen."
                  - "Hat jeder Ball eine Zahl? Dann bist du fertig."
                  - "Es sind 10 Bälle."

          - support: some
            tasks:
              - id: l2-s1
                type: tap_to_count
                text: "Tippe jeden Frosch einmal an. Wie viele sind es?"
                show: { object: frog, count: 9, layout: scattered }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Tippe nur die Frösche ohne Zahl."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele Äpfel sind es?"
                show: { object: apple, count: 6, layout: scattered }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["Zähl von oben nach unten."]
              - id: l2-s3
                type: true_false
                text: "Sind das 8 Bananen?"
                say: "Zähl die Bananen. Sind das acht Bananen?"
                show: { object: banana, count: 7, layout: scattered }
                answer: false
                hints: ["Zeig auf jede Banane genau einmal. Kommst du bis acht?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Wo sind 10 Erdbeeren?"
                options:
                  - { object: strawberry, count: 8, layout: scattered }
                  - { object: strawberry, count: 10, layout: scattered }
                  - { object: strawberry, count: 9, layout: scattered }
                answer: "10"
                hints: ["Zähl in jedem Bild genau. Bei zwei Bildern fehlt etwas."]
              - id: l2-s5
                type: tap_to_count
                text: "Tippe jede Maus einmal an. Wie viele sind es?"
                show: { object: mouse, count: 7, layout: scattered }
                options: ["6", "7", "8"]
                answer: "7"
                hints: ["Jede angetippte Maus hat eine Zahl. Welche fehlen noch?"]
              - id: l2-s6
                type: multiple_choice
                text: "Wie viele Murmeln sind es?"
                show: { object: marble, count: 9, layout: scattered }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Zähl von oben nach unten."]

          - support: none
            tasks:
              - id: l2-n1
                type: tap_to_count
                text: "Auf dem Parkplatz stehen Autos kreuz und quer. Tippe jedes Auto einmal an. Wie viele sind es?"
                show: { object: car, count: 8, layout: scattered }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l2-n2
                type: multiple_choice
                text: "Wie viele Buntstifte sind es?"
                show: { object: crayon, count: 10, layout: scattered }
                options: ["8", "9", "10"]
                answer: "10"
              - id: l2-n3
                type: image_multiple_choice
                text: "Wo sind 6 Fische?"
                options:
                  - { object: fish, count: 7, layout: scattered }
                  - { object: fish, count: 5, layout: scattered }
                  - { object: fish, count: 6, layout: scattered }
                answer: "6"
              - id: l2-n4
                type: true_false
                text: "Sind das 10 Möhren?"
                say: "Zähl die Möhren. Sind das zehn Möhren?"
                show: { object: carrot, count: 10, layout: scattered }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Wie viele Eier sind es?"
                show: { object: egg, count: 9, layout: scattered }
                options: ["8", "9", "10"]
                answer: "9"
                difficulty: stretch

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: scattered
            type: multiple_choice
            text: "Wie viele Bälle sind es?"
            show: { object: ball, count: 9, layout: scattered }
            options: ["8", "9", "10"]
