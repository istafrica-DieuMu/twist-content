                say: "Ein Zehner und acht Einer. Schreib die Zahl in die Stellentafel."
                show: { drawn: place-value-chart, columns: [tens, ones], values: [null, null] }
                frame: "Z: _  E: _"
                options: ["1", "8", "10"]
