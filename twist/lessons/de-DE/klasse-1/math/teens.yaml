  - n: 2
    title: { de: Zahlen bis 20 lesen und schreiben, en: Reading and writing numbers to 20 }
    goal:
      de: "Lies und schreib Zahlen bis 20. Wir sagen vierzehn, schreiben aber zuerst die 1, dann die 4."
      en: "Read and write numbers up to 20. In German you say the four first in fourteen, but you write the 1 first."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte sind es zusammen?"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            options: ["13", "3", "31"]
            answer: "13"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Zehner und Einer"
            say: "Wie viele Zehner und wie viele Einer sind das?"
            show: { drawn: zwanzigerfeld, filled: [10, 8] }
            frame: "_ Zehner und _ Einer"
            options: ["1", "8", "10", "18"]
            answer: ["1", "8"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Z E · 1 4"
            say: "In der Stellentafel steht der Zehner links, die Einer rechts. Ein Zehner und vier Einer: eins, vier. Das ist vierzehn."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [1, 4] }
          - text: "14, nicht 41"
            say: "Pass auf: Wir sagen vierzehn, zuerst die vier Einer, dann den Zehner. Wir schreiben aber zuerst die 1 für den Zehner, dann die 4. Also 14, nicht 41."
          - text: "11 · 12"
            say: "Elf und zwölf haben eigene Namen. Elf ist ein Zehner und ein Einer, zwölf ist ein Zehner und zwei Einer."
          - text: "16 · 17"
            say: "Bei sechzehn und siebzehn fällt etwas weg: sechzehn, nicht sechszehn, und siebzehn, nicht siebenzehn."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Zahl hörst du?"
                say: "Neunzehn. Welche Zahl hörst du?"
                option_audio: false
                options: ["19", "91", "9"]
                answer: "19"
                feedback:
                  "91": "Wir sagen die Neun zuerst, schreiben aber zuerst die 1 für den Zehner: 19."
                hints:
                  - "Neunzehn ist ein Zehner und neun Einer."
                  - "Der Zehner steht vorne."
                  - "19."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "1 Zehner und 5 Einer. Schreib die Zahl in die Stellentafel."
                say: "Ein Zehner und fünf Einer. Schreib die Zahl in die Stellentafel."
                show: { drawn: place-value-chart, columns: [tens, ones], values: [null, null] }
                frame: "Z: _  E: _"
                options: ["1", "5", "10"]
                answer: ["1", "5"]
                hints:
                  - "Wie viele Zehner?"
                  - "Ein Zehner, fünf Einer."
                  - "Z: 1, E: 5."
              - id: l2-f3
                type: text_input
                text: "Schreib die Zahl."
                say: "Schreib die Zahl siebzehn."
                answer: "17"
                hints:
                  - "Siebzehn ist ein Zehner und sieben Einer."
                  - "Zuerst die 1."
                  - "17."
              - id: l2-f4
                type: true_false
                text: "Ist das 12?"
                say: "Ist das zwölf?"
                show: { drawn: place-value-chart, columns: [tens, ones], values: [1, 2] }
                answer: true
                hints:
                  - "Ein Zehner und zwei Einer."
                  - "Zehn und zwei."
                  - "Ja, zwölf."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl hörst du?"
                say: "Sechzehn. Welche Zahl hörst du?"
                option_audio: false
                options: ["61", "16", "6"]
                answer: "16"
                hints:
                  - "Sechzehn ist ein Zehner und sechs Einer."
                  - "Erst die 1, dann die 6."
                  - "16."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Zahl hörst du?"
                say: "Dreizehn. Welche Zahl hörst du?"
                option_audio: false
                options: ["31", "13", "3"]
                answer: "13"
                hints: ["Welche Ziffer steht für den Zehner?"]
              - id: l2-s2
                type: fill_in_blank
