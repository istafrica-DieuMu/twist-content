                text: "1 Zehner und 3 Einer. Schreib die Zahl in die Stellentafel."
                say: "Ein Zehner und drei Einer. Schreib die Zahl in die Stellentafel."
                show: { drawn: place-value-chart, columns: [tens, ones], values: [null, null] }
                frame: "Z: _  E: _"
                options: ["1", "3", "10"]
                answer: ["1", "3"]
              - id: l2-n3
                type: text_input
                text: "Schreib die Zahl."
