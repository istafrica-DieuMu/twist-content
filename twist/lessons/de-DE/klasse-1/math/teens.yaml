                text: "Welche Zahl hat 1 Zehner und 7 Einer?"
                say: "Welche Zahl hat einen Zehner und sieben Einer?"
                options: ["17", "71", "8"]
                answer: "17"
                hints: ["Der Zehner kommt zuerst."]

          - support: none
            tasks:
              - id: l2-n1
