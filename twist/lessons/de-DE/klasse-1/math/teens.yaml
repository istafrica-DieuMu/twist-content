# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.teens
skill: math.numbers-to-20.teens
curriculum: de-DE
language: de
title:
  de: Die Zahlen von 11 bis 20
  en: The numbers 11 to 20
summary: >
  A number from 11 to 20 is one full ten and some ones. Lesson 1 sees the
  full ten-frame and the ones in the Zwanzigerfeld and reads the number;
  lesson 2 writes the numbers with Zehner and Einer, hears that German
  says the Einer first (vierzehn), and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { de: [Zehner, Einer, zehn, elf, zwölf, dreizehn, zwanzig] }
  forms: [drawn, text, audio]
  drawn: [ten-frame, zwanzigerfeld, place-value-chart]
  facets: []
  parts:
    - { id: see, what: { de: Anzahlen von 11 bis 20 im Zwanzigerfeld erkennen, en: reading amounts from 11 to 20 in the twenty-frame } }
    - { id: tens-ones, what: { de: eine Zahl als Zehner und Einer verstehen, en: seeing a number as one ten and some ones } }
    - { id: write, what: { de: gehörte Zahlen richtig schreiben, en: writing numbers you hear in the right order } }
  misconceptions:
    - id: count-all-again
      what: Counts every counter from one instead of seeing the full ten
      addressed: 'Learn shows the full top frame as ten at a glance; hints say "Das obere Feld ist voll: zehn" and "Zähl von zehn weiter"'
    - id: digit-order-swap
      what: Writes 41 for vierzehn because the Einer are said first
      addressed: lesson 2 Learn says German says the Einer first but writes the Zehner first; options include the swapped number, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Ein Zehner und Einer, en: One ten and some ones }
    goal:
      de: "Sieh in Zahlen bis 20 einen vollen Zehner und ein paar Einer. Zehn und drei sind dreizehn."
      en: "See a full ten and some ones in numbers up to 20. Ten and three make thirteen."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte sind im Zehnerfeld?"
            show: { drawn: ten-frame, filled: 10 }
            options: ["9", "10", "5"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 + 3 = _"
            say: "Sieben plus drei."
            answer: "10"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "10"
            say: "Das obere Feld ist ganz voll. Ein volles Feld sind zehn Punkte. Das ist ein Zehner."
            show: { drawn: zwanzigerfeld, filled: [10, 0] }
          - text: "10 und 3"
            say: "Unten liegen noch drei Punkte. Das sind drei Einer. Ein Zehner und drei Einer."
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
          - text: "13"
            say: "Zehn und drei sind dreizehn. Du musst nicht alle Punkte zählen. Das volle Feld ist zehn, dann zählst du nur weiter: elf, zwölf, dreizehn."
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
          - text: "20"
            say: "Sind beide Felder voll, sind es zwei Zehner: zwanzig."
            show: { drawn: zwanzigerfeld, filled: [10, 10] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 5] }
                options: ["14", "15", "5"]
                answer: "15"
                feedback:
                  "5": "Du hast nur unten gezählt. Oben ist noch ein voller Zehner."
                hints:
                  - "Das obere Feld ist voll: zehn."
                  - "Unten sind fünf. Zähl von zehn weiter."
                  - "Zehn und fünf sind fünfzehn: 15."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 1] }
                options: ["11", "12", "10"]
                answer: "11"
                hints:
                  - "Oben ist ein voller Zehner."
                  - "Unten ist ein Punkt."
                  - "Zehn und eins sind elf: 11."
              - id: l1-f3
                type: true_false
                text: "Sind das 18 Punkte?"
                say: "Sind das achtzehn Punkte?"
                show: { drawn: zwanzigerfeld, filled: [10, 8] }
                answer: true
                hints:
                  - "Oben ist ein Zehner."
                  - "Unten sind acht Einer."
                  - "Ja, zehn und acht sind achtzehn."
              - id: l1-f4
                type: fill_in_blank
                text: "Zehner und Einer"
                say: "Wie viele Zehner und wie viele Einer sind das?"
                show: { drawn: zwanzigerfeld, filled: [10, 6] }
                frame: "_ Zehner und _ Einer"
                options: ["1", "6", "10", "16"]
                answer: ["1", "6"]
                hints:
                  - "Ein volles Feld ist ein Zehner."
                  - "Unten sind sechs Punkte."
                  - "1 Zehner und 6 Einer."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 9] }
                options: ["19", "18", "91"]
                answer: "19"
                hints:
                  - "Zehn oben."
                  - "Neun unten."
                  - "Zehn und neun sind neunzehn: 19."
              - id: l1-f6
                type: image_multiple_choice
                text: "Welches Bild zeigt 20 Punkte?"
                say: "Welches Bild zeigt zwanzig Punkte?"
                options: [{ drawn: zwanzigerfeld, filled: [10, 10] }, { drawn: zwanzigerfeld, filled: [10, 1] }, { drawn: zwanzigerfeld, filled: [10, 9] }]
                answer: "20"
                feedback:
                  "11": "Hier ist unten nur ein Punkt. Zwanzig sind zwei volle Zehner."
                hints:
                  - "Zwanzig sind zwei Zehner."
                  - "Such ein Bild, auf dem beide Felder voll sind."
                  - "Oben zehn und unten zehn."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 4] }
                options: ["14", "13", "4"]
                answer: "14"
                hints: ["Fang bei zehn an und zähl unten weiter."]
              - id: l1-s2
                type: true_false
                text: "Sind das 12 Punkte?"
                say: "Sind das zwölf Punkte?"
                show: { drawn: zwanzigerfeld, filled: [10, 1] }
                answer: false
                hints: ["Wie viele sind unten?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Zehner und Einer"
                say: "Wie viele Zehner und wie viele Einer sind das?"
                show: { drawn: zwanzigerfeld, filled: [10, 7] }
                frame: "_ Zehner und _ Einer"
                options: ["1", "7", "10", "17"]
                answer: ["1", "7"]
                hints: ["Ein volles Feld ist ein Zehner."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 2] }
                options: ["12", "21", "2"]
                answer: "12"
                hints: ["Fang bei zehn an."]
              - id: l1-s5
                type: multiple_choice
                text: "Woraus besteht 16?"
                say: "Woraus besteht sechzehn?"
                option_audio: false
                options: ["10 und 6", "10 und 4", "6 und 6"]
                answer: "10 und 6"
                hints: ["Sechzehn ist ein Zehner und ein paar Einer."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 7] }
                options: ["17", "71", "16"]
                answer: "17"
              - id: l1-n2
                type: true_false
                text: "Sind das 11 Punkte?"
                say: "Sind das elf Punkte?"
                show: { drawn: zwanzigerfeld, filled: [10, 1] }
                answer: true
              - id: l1-n3
                type: fill_in_blank
                text: "Zehner und Einer"
                say: "Wie viele Zehner und wie viele Einer sind das?"
                show: { drawn: zwanzigerfeld, filled: [10, 9] }
                frame: "_ Zehner und _ Einer"
                options: ["1", "9", "10", "19"]
                answer: ["1", "9"]
              - id: l1-n4
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 8] }
                options: ["18", "17", "8"]
                answer: "18"
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Punkte?"
                say: "Wie viele Punkte sind es zusammen?"
                show: { drawn: zwanzigerfeld, filled: [10, 5] }
                options: ["15", "51", "10"]
                answer: "15"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte sind es zusammen?"
            show: { drawn: zwanzigerfeld, filled: [10, 6] }
            options: ["16", "61", "6"]
            answer: "16"
          - id: l1-c2
            type: true_false
            text: "Sind das 14 Punkte?"
            say: "Sind das vierzehn Punkte?"
            show: { drawn: zwanzigerfeld, filled: [10, 4] }
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Zehner und Einer"
            say: "Wie viele Zehner und wie viele Einer sind das?"
            show: { drawn: zwanzigerfeld, filled: [10, 2] }
            frame: "_ Zehner und _ Einer"
            options: ["1", "2", "10", "12"]
            answer: ["1", "2"]
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Bild zeigt 15 Punkte?"
            say: "Welches Bild zeigt fünfzehn Punkte?"
            options: [{ drawn: zwanzigerfeld, filled: [10, 4] }, { drawn: zwanzigerfeld, filled: [5, 0] }, { drawn: zwanzigerfeld, filled: [10, 5] }]
            answer: "15"
          - id: l1-c5
            type: true_false
            text: "Sind das 16 Punkte?"
            say: "Sind das sechzehn Punkte?"
            show: { drawn: zwanzigerfeld, filled: [10, 7] }
            answer: false
          - id: l1-c6
