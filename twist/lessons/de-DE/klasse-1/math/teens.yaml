            part: see
            type: multiple_choice
            text: "Wie viele Punkte sind im Zwanzigerfeld?"
            say: "Wie viele Punkte sind im Zwanzigerfeld?"
            show: { drawn: zwanzigerfeld, filled: [10, 9] }
