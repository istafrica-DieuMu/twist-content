# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.time-full-half
skill: math.time.full-half-hour
curriculum: de-DE
language: de
title:
  de: Volle und halbe Stunden
  en: O'clock and half past
summary: >
  Reading the clock to the hour and the half hour. Lesson 1 reads full
  hours from the short hand when the long hand points to 12 (drei Uhr,
  3:00); lesson 2 reads halbe Stunden, where the long hand points to 6
  and the short hand sits between two numbers (halb vier, 3:30), and ends
  with the skill check. Every practise stage and both checks also ask the
  child to set the hands (clock_hands_drag).
metadata:
  year: klasse-1
  topic: { de: Uhrzeit, en: Time }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.order-to-20]
  also_practises: [math.numbers-to-20.order-to-20]
  vocabulary: { de: [Uhr, Stunde, kleiner Zeiger, großer Zeiger, halb, Digitaluhr] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  parts:
    - { id: full-hour, what: { de: volle Stunden ablesen, en: reading o'clock times } }
    - { id: half-hour, what: { de: halbe Stunden ablesen, en: reading half past times } }
    - { id: set, what: { de: die Zeiger auf eine Uhrzeit stellen, en: setting the hands to a time } }
    - { id: digital, what: { de: die Uhrzeit auf der Digitaluhr lesen, en: reading the time on a digital clock } }
  misconceptions:
    - id: hands-swapped
      what: Reads the long hand as the hour (sees 12 o'clock when the long hand is on 12)
      addressed: lesson 1 Learn names the short hand as the hour hand; l1-f2 offers the time read from the long hand, with feedback; l1-s2 asks to set 6 Uhr, with feedback for the swapped hands (12:30)
    - id: halb-wrong-hour
      what: Says halb drei for 3:30, naming the hour that has passed
      addressed: lesson 2 Learn says halb vier means half the way to four; every stage of lesson 2 offers the hour that has passed, with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Volle Stunden", en: "O'clock" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Zahl kommt nach 7?"
            say: "Welche Zahl kommt nach sieben?"
            options: ["8", "6", "9"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Zahl kommt vor 12?"
            say: "Welche Zahl kommt vor zwölf?"
            options: ["11", "13", "10"]
            answer: "11"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 Uhr"
            say: "Die Uhr hat zwei Zeiger. Der kleine Zeiger zeigt die Stunde. Er zeigt auf die Drei. Der große Zeiger zeigt auf die Zwölf. Dann ist es genau drei Uhr."
            show: { drawn: clock, hour: 3, minute: 0 }
          - text: "8 Uhr"
            say: "Hier zeigt der kleine Zeiger auf die Acht, der große Zeiger auf die Zwölf. Es ist acht Uhr. Gleich stellst du die Uhr selbst: Du ziehst die Zeiger mit dem Finger."
            show: { drawn: clock, hour: 8, minute: 0 }
          - text: "3:00"
            say: "Auf einer Digitaluhr steht drei Uhr so: drei, Doppelpunkt, null null."
            show: { drawn: clock, hour: 3, minute: 0, digital: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: clock_hands_drag
                text: "Stell die Uhr auf 5 Uhr."
                say: "Stell die Uhr auf fünf Uhr. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "5:00"
                feedback:
                  "5:30": "Bei 5 Uhr zeigt der große Zeiger auf die Zwölf, nicht auf die Sechs."
                hints:
                  - "Bei einer vollen Stunde zeigt der große Zeiger auf die Zwölf."
                  - "Der kleine Zeiger zeigt die Stunde. Auf welche Zahl muss er?"
                  - "Lass den großen Zeiger auf der Zwölf und zieh den kleinen Zeiger auf die Fünf."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 9, minute: 0 }
                options: ["9 Uhr", "12 Uhr", "10 Uhr"]
                answer: "9 Uhr"
                feedback:
                  "12 Uhr": "Auf die Zwölf zeigt der große Zeiger. Die Stunde zeigt der kleine Zeiger."
                hints:
                  - "Welcher Zeiger zeigt die Stunde?"
                  - "Der große Zeiger zeigt auf die Zwölf. Auf welche Zahl zeigt der kleine Zeiger?"
                  - "9 Uhr."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welche Uhr zeigt 2 Uhr?"
                say: "Welche Uhr zeigt zwei Uhr?"
                options:
                  - { drawn: clock, hour: 2, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 10 }
                  - { drawn: clock, hour: 4, minute: 0 }
                answer: "2:00"
                hints:
                  - "Bei zwei Uhr zeigt der große Zeiger auf die Zwölf."
                  - "Der kleine Zeiger zeigt auf die Zwei."
                  - "Die Uhr mit dem kleinen Zeiger auf der Zwei."
              - id: l1-f4
                type: true_false
                text: "Ist es 7 Uhr?"
                say: "Ist es sieben Uhr?"
                show: { drawn: clock, hour: 7, minute: 0 }
                answer: true
                hints:
                  - "Schau auf den kleinen Zeiger."
                  - "Auf welche Zahl zeigt er? Und steht der große Zeiger auf der Zwölf?"
                  - "Ja, es ist 7 Uhr."
              - id: l1-f5
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt vier, Doppelpunkt, null null. Wie spät ist es?"
                show: { drawn: clock, hour: 4, minute: 0, digital: true }
                options: ["4 Uhr", "5 Uhr", "halb 4"]
                answer: "4 Uhr"
                hints:
                  - "Die Zahl vor dem Doppelpunkt ist die Stunde."
                  - "Null null heißt: genau, volle Stunde."
                  - "4 Uhr."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 10, minute: 0 }
                options: ["10 Uhr", "11 Uhr", "12 Uhr"]
                answer: "10 Uhr"
                hints: ["Schau auf den kleinen Zeiger."]
              - id: l1-s2
                type: clock_hands_drag
                text: "Stell die Uhr auf 6 Uhr."
                say: "Stell die Uhr auf sechs Uhr. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "6:00"
                feedback:
                  "12:30": "Du hast die Zeiger vertauscht. Der kleine Zeiger zeigt die Stunde: Er gehört auf die Sechs. Der große Zeiger bleibt auf der Zwölf."
                hints: ["Der kleine Zeiger zeigt die Stunde, der große Zeiger bleibt auf der Zwölf."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welche Uhr zeigt 11 Uhr?"
                say: "Welche Uhr zeigt elf Uhr?"
                options:
                  - { drawn: clock, hour: 1, minute: 0 }
                  - { drawn: clock, hour: 11, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 55 }
                answer: "11:00"
                hints: ["Der kleine Zeiger zeigt auf die Elf."]
              - id: l1-s4
                type: true_false
                text: "Ist es 3 Uhr?"
                say: "Ist es drei Uhr?"
                show: { drawn: clock, hour: 4, minute: 0 }
                answer: false
                hints: ["Auf welche Zahl zeigt der kleine Zeiger?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt elf, Doppelpunkt, null null. Wie spät ist es?"
                show: { drawn: clock, hour: 11, minute: 0, digital: true }
                options: ["11 Uhr", "1 Uhr", "10 Uhr"]
                answer: "11 Uhr"
                hints: ["Die Zahl vor dem Doppelpunkt ist die Stunde."]

          - support: none
            tasks:
              - id: l1-n1
                type: clock_hands_drag
                text: "Stell die Uhr auf 1 Uhr."
                say: "Stell die Uhr auf ein Uhr. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "1:00"
                feedback:
                  "1:30": "Bei 1 Uhr zeigt der große Zeiger auf die Zwölf."
              - id: l1-n2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 12, minute: 0 }
                options: ["12 Uhr", "11 Uhr", "6 Uhr"]
                answer: "12 Uhr"
              - id: l1-n3
                type: image_multiple_choice
                text: "Welche Uhr zeigt 8 Uhr?"
                say: "Welche Uhr zeigt acht Uhr?"
                options:
                  - { drawn: clock, hour: 8, minute: 0 }
                  - { drawn: clock, hour: 12, minute: 40 }
                  - { drawn: clock, hour: 9, minute: 0 }
                answer: "8:00"
              - id: l1-n4
                type: true_false
                text: "Ist es 10 Uhr?"
                say: "Ist es zehn Uhr?"
                show: { drawn: clock, hour: 10, minute: 0 }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt sieben, Doppelpunkt, null null. Wie spät ist es?"
                show: { drawn: clock, hour: 7, minute: 0, digital: true }
                options: ["7 Uhr", "8 Uhr", "halb 7"]
                answer: "7 Uhr"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: clock_hands_drag
            text: "Stell die Uhr auf 2 Uhr."
            say: "Stell die Uhr auf zwei Uhr. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 30
            answer: "2:00"
            feedback:
              "2:30": "Bei 2 Uhr zeigt der große Zeiger auf die Zwölf."
          - id: l1-c2
            type: image_multiple_choice
            text: "Welche Uhr zeigt 6 Uhr?"
            say: "Welche Uhr zeigt sechs Uhr?"
            options:
              - { drawn: clock, hour: 12, minute: 30 }
              - { drawn: clock, hour: 6, minute: 0 }
              - { drawn: clock, hour: 7, minute: 0 }
            answer: "6:00"
          - id: l1-c3
            type: true_false
            text: "Ist es 10 Uhr?"
            say: "Ist es zehn Uhr?"
            show: { drawn: clock, hour: 9, minute: 0 }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 5, minute: 0 }
            options: ["12 Uhr", "5 Uhr", "6 Uhr"]
            answer: "5 Uhr"
          - id: l1-c5
            type: multiple_choice
            text: "Was zeigt die Digitaluhr?"
            say: "Die Digitaluhr zeigt zwölf, Doppelpunkt, null null. Wie spät ist es?"
            show: { drawn: clock, hour: 12, minute: 0, digital: true }
            options: ["11 Uhr", "1 Uhr", "12 Uhr"]
            answer: "12 Uhr"
          - id: l1-c6
            type: clock_hands_drag
            text: "Stell die Uhr auf 4 Uhr."
            say: "Stell die Uhr auf vier Uhr. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 30
            answer: "4:00"
            feedback:
              "4:30": "Bei 4 Uhr zeigt der große Zeiger auf die Zwölf."

  - n: 2
    title: { de: "Halbe Stunden", en: "Half past" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 11, minute: 0 }
            options: ["11 Uhr", "12 Uhr", "10 Uhr"]
            answer: "11 Uhr"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist es 5 Uhr?"
            say: "Ist es fünf Uhr?"
            show: { drawn: clock, hour: 5, minute: 0 }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "halb 4"
            say: "Jetzt zeigt der große Zeiger auf die Sechs. Er ist eine halbe Runde gelaufen. Der kleine Zeiger steht zwischen der Drei und der Vier. Es ist halb vier. Die Stunde von drei bis vier Uhr ist schon zur Hälfte um."
            show: { drawn: clock, hour: 3, minute: 30 }
          - text: "halb 4 = 3:30"
            say: "Auf der Digitaluhr steht halb vier so: drei, Doppelpunkt, dreißig. Eine halbe Stunde hat dreißig Minuten."
            show: { drawn: clock, hour: 3, minute: 30, digital: true }
          - text: "halb 7"
            say: "Merk dir: Bei halb schaust du auf die Zahl, zu der der kleine Zeiger gerade läuft. Hier läuft er zur Sieben. Es ist halb sieben."
            show: { drawn: clock, hour: 6, minute: 30 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 1, minute: 30 }
                options: ["halb 2", "halb 1", "2 Uhr"]
                answer: "halb 2"
                feedback:
                  "halb 1": "Der kleine Zeiger ist schon an der Eins vorbei und läuft zur Zwei. Es ist halb zwei."
                hints:
                  - "Der große Zeiger zeigt auf die Sechs. Es ist halb."
                  - "Zu welcher Zahl läuft der kleine Zeiger?"
                  - "halb 2."
                difficulty: easy
              - id: l2-f2
                type: clock_hands_drag
                text: "Stell die Uhr auf halb 5."
                say: "Stell die Uhr auf halb fünf. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "4:30"
                feedback:
                  "5:30": "Das ist halb sechs. Bei halb fünf läuft der kleine Zeiger erst zur Fünf: Er steht zwischen der Vier und der Fünf."
                  "4:00": "Das ist 4 Uhr. Bei halb zeigt der große Zeiger auf die Sechs."
                hints:
                  - "Bei halb zeigt der große Zeiger auf die Sechs."
                  - "Halb fünf: Der kleine Zeiger läuft gerade zur Fünf. Er steht zwischen der Vier und der Fünf."
                  - "Zieh den großen Zeiger auf die Sechs und den kleinen Zeiger auf die Vier. Er rückt dann ein Stück weiter, zwischen Vier und Fünf."
              - id: l2-f3
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt acht, Doppelpunkt, dreißig. Wie spät ist es?"
                show: { drawn: clock, hour: 8, minute: 30, digital: true }
                options: ["halb 9", "halb 8", "8 Uhr"]
                answer: "halb 9"
                hints:
                  - "Dreißig Minuten sind eine halbe Stunde."
                  - "Acht Uhr ist vorbei. Es geht auf neun zu."
                  - "halb 9."
              - id: l2-f4
                type: true_false
                text: "Ist es halb 11?"
                say: "Ist es halb elf?"
                show: { drawn: clock, hour: 10, minute: 30 }
                answer: true
                hints:
                  - "Zeigt der große Zeiger auf die Sechs?"
                  - "Er zeigt auf die Sechs. Zu welcher Zahl läuft der kleine Zeiger?"
                  - "Ja, es ist halb 11."
              - id: l2-f5
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 12, minute: 30 }
                options: ["halb 1", "halb 12", "12 Uhr"]
                answer: "halb 1"
                hints:
                  - "Der große Zeiger zeigt auf die Sechs."
                  - "Der kleine Zeiger ist an der Zwölf vorbei und läuft zur Eins."
                  - "halb 1."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 7, minute: 30 }
                options: ["halb 8", "halb 7", "7 Uhr"]
                answer: "halb 8"
                hints: ["Zu welcher Zahl läuft der kleine Zeiger?"]
              - id: l2-s2
                type: clock_hands_drag
                text: "Stell die Uhr auf halb 3."
                say: "Stell die Uhr auf halb drei. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "2:30"
                feedback:
                  "3:30": "Das ist halb vier. Bei halb drei steht der kleine Zeiger zwischen der Zwei und der Drei."
                hints: ["Halb drei: Der große Zeiger zeigt auf die Sechs, der kleine Zeiger läuft zur Drei."]
              - id: l2-s3
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt fünf, Doppelpunkt, dreißig. Wie spät ist es?"
                show: { drawn: clock, hour: 5, minute: 30, digital: true }
                options: ["halb 6", "halb 5", "5 Uhr"]
                answer: "halb 6"
                hints: ["Fünf Uhr ist vorbei."]
              - id: l2-s4
                type: true_false
                text: "Ist es halb 9?"
                say: "Ist es halb neun?"
                show: { drawn: clock, hour: 9, minute: 30 }
                answer: false
                hints: ["Zu welcher Zahl läuft der kleine Zeiger?"]
              - id: l2-s5
                type: multiple_choice
                text: "Halb 4 oder 4 Uhr?"
                say: "Halb vier oder vier Uhr? Wie spät ist es?"
                show: { drawn: clock, hour: 4, minute: 0 }
                options: ["4 Uhr", "halb 4", "halb 5"]
                answer: "4 Uhr"
                hints: ["Wo steht der große Zeiger?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 11, minute: 30 }
                options: ["halb 12", "halb 11", "12 Uhr"]
                answer: "halb 12"
              - id: l2-n2
                type: clock_hands_drag
                text: "Stell die Uhr auf halb 10."
                say: "Stell die Uhr auf halb zehn. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 30
                answer: "9:30"
                feedback:
                  "10:30": "Das ist halb elf. Bei halb zehn steht der kleine Zeiger zwischen der Neun und der Zehn."
              - id: l2-n3
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt zwei, Doppelpunkt, dreißig. Wie spät ist es?"
                show: { drawn: clock, hour: 2, minute: 30, digital: true }
                options: ["halb 3", "halb 2", "2 Uhr"]
                answer: "halb 3"
              - id: l2-n4
                type: true_false
                text: "Ist es halb 5?"
                say: "Ist es halb fünf?"
                show: { drawn: clock, hour: 4, minute: 30 }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 9, minute: 0 }
                options: ["9 Uhr", "halb 9", "halb 10"]
                answer: "9 Uhr"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: full-hour
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 2, minute: 0 }
            options: ["2 Uhr", "12 Uhr", "halb 2"]
            answer: "2 Uhr"
          - id: l2-c2
            part: half-hour
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 5, minute: 30 }
            options: ["halb 6", "halb 5", "6 Uhr"]
            answer: "halb 6"
          - id: l2-c3
            part: set
            type: clock_hands_drag
            text: "Stell die Uhr auf halb 2."
            say: "Stell die Uhr auf halb zwei. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 30
            answer: "1:30"
            feedback:
              "2:30": "Das ist halb drei. Bei halb zwei steht der kleine Zeiger zwischen der Eins und der Zwei."
          - id: l2-c4
            part: half-hour
            type: true_false
            text: "Ist es halb 12?"
            say: "Ist es halb zwölf?"
            show: { drawn: clock, hour: 12, minute: 30 }
            answer: false
          - id: l2-c5
            part: digital
            type: multiple_choice
            text: "Was zeigt die Digitaluhr?"
            say: "Die Digitaluhr zeigt zehn, Doppelpunkt, dreißig. Wie spät ist es?"
            show: { drawn: clock, hour: 10, minute: 30, digital: true }
            options: ["halb 11", "halb 10", "10 Uhr"]
            answer: "halb 11"
          - id: l2-c6
            part: full-hour
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 6, minute: 0 }
            options: ["12 Uhr", "7 Uhr", "6 Uhr"]
            answer: "6 Uhr"
          - id: l2-c7
            part: half-hour
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 9, minute: 30 }
            options: ["halb 9", "halb 10", "10 Uhr"]
            answer: "halb 10"
          - id: l2-c8
            part: set
            type: clock_hands_drag
            text: "Stell die Uhr auf 9 Uhr."
            say: "Stell die Uhr auf neun Uhr. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 30
            answer: "9:00"
            feedback:
              "9:30": "Bei 9 Uhr zeigt der große Zeiger auf die Zwölf."
          - id: l2-c9
            part: digital
            type: multiple_choice
            text: "Was zeigt die Digitaluhr?"
            say: "Die Digitaluhr zeigt neun, Doppelpunkt, null null. Wie spät ist es?"
            show: { drawn: clock, hour: 9, minute: 0, digital: true }
            options: ["halb 9", "9 Uhr", "10 Uhr"]
            answer: "9 Uhr"
          - id: l2-c10
            part: full-hour
            type: image_multiple_choice
            text: "Welche Uhr zeigt 4 Uhr?"
            say: "Welche Uhr zeigt vier Uhr?"
            options:
              - { drawn: clock, hour: 12, minute: 20 }
              - { drawn: clock, hour: 5, minute: 0 }
              - { drawn: clock, hour: 4, minute: 0 }
            answer: "4:00"
          - id: l2-c11
            part: half-hour
            type: image_multiple_choice
            text: "Welche Uhr zeigt halb 8?"
            say: "Welche Uhr zeigt halb acht?"
            options:
              - { drawn: clock, hour: 8, minute: 30 }
              - { drawn: clock, hour: 7, minute: 30 }
              - { drawn: clock, hour: 7, minute: 0 }
            answer: "7:30"
          - id: l2-c12
            part: set
            type: clock_hands_drag
            text: "Stell die Uhr auf halb 12."
            say: "Stell die Uhr auf halb zwölf. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
