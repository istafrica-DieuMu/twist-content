# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.position-words
skill: math.space.position-words
curriculum: de-DE
language: de
title:
  de: Links, rechts, oben, unten
  en: Left, right, above, below
summary: >
  Lesson 1 finds things in a row by links, rechts, neben and zwischen;
  lesson 2 uses oben and unten in a stack and vor, hinter, auf and unter
  in everyday sentences, and ends with the skill check. The skill has no
  prerequisite, so lesson 1 starts with Learn instead of a warm-up.
metadata:
  year: klasse-1
  topic: { de: Orientierung, en: Position and direction }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { de: [links, rechts, oben, unten, neben, zwischen, vor, hinter, auf, unter, über] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: left-right, what: { de: links und rechts in einer Reihe, en: left and right in a row } }
    - { id: between, what: { de: neben und zwischen, en: next to and between } }
    - { id: up-down, what: { de: "oben, unten und über", en: "top, bottom and above" } }
    - { id: everyday, what: { de: "vor, hinter, auf, unter und über im Alltag", en: "in front of, behind, on, under and above in everyday sentences" } }
  misconceptions:
    - id: left-right-swap
      what: Swaps links and rechts
      addressed: lesson 1 Learn ties links to the start of reading; every stage of lesson 1 asks for links and rechts in one row, with feedback in l1-f1
    - id: zwischen-one-side
      what: Picks a shape next to one of the two named ones instead of the one between them
      addressed: l1-f3, l1-s3 and l1-n3 ask what lies zwischen two shapes in a row of four, with hints in l1-f3 and l1-s3 that point at both sides
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Links, rechts, zwischen", en: "Left, right, between" }
    goal:
      de: "Sag, wo etwas in einer Reihe steht. Der Kreis ist zwischen dem Quadrat und dem Dreieck."
      en: "Say where something is in a row. The circle is between the square and the triangle."
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "links · rechts"
            say: "Beim Lesen fängst du links an und gehst nach rechts. Ganz links ist hier das Quadrat. Ganz rechts ist das Dreieck."
            show: { drawn: shape, row: [square, circle, triangle], colours: [blue, red, yellow] }
          - text: "zwischen"
            say: "Der Kreis ist zwischen dem Quadrat und dem Dreieck. Zwischen heißt: auf der einen Seite das eine, auf der anderen Seite das andere."
            show: { drawn: shape, row: [square, circle, triangle], colours: [blue, red, yellow] }
          - text: "neben"
            say: "Das Quadrat ist neben dem Kreis. Neben heißt: direkt daneben, links oder rechts."
            show: { drawn: shape, row: [square, circle, triangle], colours: [blue, red, yellow] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist ganz links?"
                say: "Welche Form ist ganz links?"
                show: { drawn: shape, row: [triangle, square, circle], colours: [green, orange, purple] }
                options: ["das Dreieck", "der Kreis", "das Quadrat"]
                answer: "das Dreieck"
                feedback:
                  "der Kreis": "Der Kreis ist ganz rechts. Links ist dort, wo du beim Lesen anfängst."
                hints:
                  - "Links ist dort, wo du beim Lesen anfängst."
                  - "Schau auf die erste Form."
                  - "Das Dreieck."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist ganz rechts?"
                say: "Welche Form ist ganz rechts?"
                show: { drawn: shape, row: [circle, triangle, square], colours: [blue, blue, blue] }
                options: ["das Quadrat", "der Kreis", "das Dreieck"]
                answer: "das Quadrat"
                hints:
                  - "Rechts ist dort, wo du beim Lesen aufhörst."
                  - "Schau auf die letzte Form."
                  - "Das Quadrat."
              - id: l1-f3
                type: multiple_choice
                text: "Was ist zwischen dem Kreis und dem Rechteck?"
                say: "Welche Form ist zwischen dem Kreis und dem Rechteck?"
                show: { drawn: shape, row: [square, circle, triangle, rectangle], colours: [red, yellow, green, blue] }
                options: ["das Dreieck", "das Quadrat", "der Kreis"]
                answer: "das Dreieck"
                hints:
                  - "Such zuerst den Kreis und das Rechteck."
                  - "Was liegt genau in der Mitte zwischen den beiden?"
                  - "Das Dreieck."
              - id: l1-f4
                type: true_false
                text: "Der Kreis ist neben dem Dreieck."
                say: "Stimmt das? Der Kreis ist neben dem Dreieck."
                show: { drawn: shape, row: [circle, triangle, square], colours: [red, red, red] }
                answer: true
                hints:
                  - "Liegen sie direkt nebeneinander?"
                  - "Zwischen Kreis und Dreieck ist nichts."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist rechts vom Quadrat?"
                say: "Welche Form ist direkt rechts vom Quadrat?"
                show: { drawn: shape, row: [triangle, square, circle], colours: [purple, green, orange] }
                options: ["der Kreis", "das Dreieck", "das Quadrat"]
                answer: "der Kreis"
                hints:
                  - "Such das Quadrat."
                  - "Geh einen Schritt nach rechts."
                  - "Der Kreis."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist ganz links?"
                say: "Welche Form ist ganz links?"
                show: { drawn: shape, row: [rectangle, circle, triangle], colours: [yellow, blue, red] }
                options: ["das Rechteck", "das Dreieck", "der Kreis"]
                answer: "das Rechteck"
                hints: ["Links fängst du beim Lesen an."]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist ganz rechts?"
                say: "Welche Form ist ganz rechts?"
                show: { drawn: shape, row: [square, rectangle, circle], colours: [green, green, green] }
                options: ["der Kreis", "das Quadrat", "das Rechteck"]
                answer: "der Kreis"
                hints: ["Schau auf die letzte Form."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist zwischen dem Dreieck und dem Kreis?"
                say: "Welche Form ist zwischen dem Dreieck und dem Kreis?"
                show: { drawn: shape, row: [triangle, square, circle, rectangle], colours: [orange, purple, blue, red] }
                options: ["das Quadrat", "das Rechteck", "das Dreieck"]
                answer: "das Quadrat"
                hints: ["Auf der einen Seite das Dreieck, auf der anderen der Kreis."]
              - id: l1-s4
                type: true_false
                text: "Das Quadrat ist links vom Kreis."
                say: "Stimmt das? Das Quadrat ist links vom Kreis."
                show: { drawn: shape, row: [circle, square], colours: [red, blue] }
                answer: false
                hints: ["Welche Form kommt beim Lesen zuerst?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist links vom Dreieck?"
                say: "Welche Form ist direkt links vom Dreieck?"
                show: { drawn: shape, row: [circle, rectangle, triangle], colours: [yellow, green, blue] }
                options: ["das Rechteck", "der Kreis", "das Dreieck"]
                answer: "das Rechteck"
                hints: ["Such das Dreieck und geh einen Schritt nach links."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist ganz links?"
                say: "Welche Form ist ganz links?"
                show: { drawn: shape, row: [circle, square, rectangle], colours: [purple, purple, purple] }
                options: ["der Kreis", "das Rechteck", "das Quadrat"]
                answer: "der Kreis"
              - id: l1-n2
                type: multiple_choice
                text: "Was ist ganz rechts?"
                say: "Welche Form ist ganz rechts?"
                show: { drawn: shape, row: [rectangle, square, triangle], colours: [red, yellow, green] }
                options: ["das Dreieck", "das Rechteck", "das Quadrat"]
                answer: "das Dreieck"
              - id: l1-n3
                type: multiple_choice
                text: "Was ist zwischen dem Quadrat und dem Dreieck?"
                say: "Welche Form ist zwischen dem Quadrat und dem Dreieck?"
                show: { drawn: shape, row: [rectangle, square, circle, triangle], colours: [blue, orange, red, green] }
                options: ["der Kreis", "das Rechteck", "das Quadrat"]
                answer: "der Kreis"
              - id: l1-n4
                type: true_false
                text: "Das Dreieck ist zwischen dem Kreis und dem Quadrat."
                say: "Stimmt das? Das Dreieck ist zwischen dem Kreis und dem Quadrat."
                show: { drawn: shape, row: [circle, triangle, square], colours: [blue, yellow, red] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Was ist rechts vom Kreis?"
                say: "Welche Form ist direkt rechts vom Kreis?"
                show: { drawn: shape, row: [square, circle, rectangle], colours: [green, orange, purple] }
                options: ["das Rechteck", "das Quadrat", "der Kreis"]
                answer: "das Rechteck"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist ganz links?"
            say: "Welche Form ist hier ganz links?"
            show: { drawn: shape, row: [square, triangle, circle], colours: [orange, orange, orange] }
            options: ["das Quadrat", "der Kreis", "das Dreieck"]
            answer: "das Quadrat"
          - id: l1-c2
            type: multiple_choice
            text: "Was ist zwischen dem Rechteck und dem Kreis?"
            say: "Welche Form ist zwischen dem Rechteck und dem Kreis?"
            show: { drawn: shape, row: [rectangle, triangle, circle, square], colours: [red, blue, yellow, green] }
            options: ["das Dreieck", "das Quadrat", "das Rechteck"]
            answer: "das Dreieck"
          - id: l1-c3
            type: true_false
            text: "Der Kreis ist ganz rechts."
            say: "Stimmt das? Der Kreis ist ganz rechts."
            show: { drawn: shape, row: [triangle, square, circle], colours: [green, red, blue] }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Was ist rechts vom Dreieck?"
            say: "Welche Form ist direkt rechts vom Dreieck?"
            show: { drawn: shape, row: [square, triangle, rectangle], colours: [green, blue, red] }
            options: ["das Rechteck", "das Quadrat", "das Dreieck"]
            answer: "das Rechteck"
          - id: l1-c5
            type: true_false
            text: "Das Quadrat ist neben dem Rechteck."
            say: "Stimmt das? Das Quadrat ist neben dem Rechteck."
            show: { drawn: shape, row: [square, circle, rectangle], colours: [orange, purple, green] }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Was ist zwischen dem Dreieck und dem Quadrat?"
            say: "Welche Form ist zwischen dem Dreieck und dem Quadrat?"
            show: { drawn: shape, row: [circle, triangle, rectangle, square], colours: [blue, red, yellow, green] }
            options: ["das Rechteck", "der Kreis", "das Dreieck"]
            answer: "das Rechteck"

  - n: 2
    title: { de: "Oben, unten, vor, hinter", en: "Above, below, in front, behind" }
    goal:
      de: "Find heraus, was oben, unten, vor oder hinter etwas ist. Die Katze schläft unter dem Tisch."
      en: "Work out what is above, below, in front of or behind something. The cat sleeps under the table."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist ganz rechts?"
            say: "Welche Form ist ganz rechts?"
            show: { drawn: shape, row: [circle, square], colours: [red, blue] }
            options: ["das Quadrat", "der Kreis"]
            answer: "das Quadrat"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist zwischen Kreis und Dreieck?"
            say: "Welche Form ist zwischen dem Kreis und dem Dreieck?"
            show: { drawn: shape, row: [circle, square, triangle], colours: [blue, yellow, red] }
            options: ["das Quadrat", "der Kreis"]
            answer: "das Quadrat"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "oben · unten"
            say: "Hier liegen Formen übereinander. Ganz oben ist der Kreis. Ganz unten ist das Rechteck. Das Dreieck ist in der Mitte."
            show: { drawn: shape, column: [circle, triangle, rectangle], colours: [red, yellow, blue] }
          - text: "auf · unter · über"
            say: "Die Tasse steht auf dem Tisch. Die Katze schläft unter dem Tisch. Die Lampe hängt über dem Tisch. Über und unter sind Gegenteile."
          - text: "vor · hinter"
            say: "Lena steht vor dem Haus. Der Garten ist hinter dem Haus. Vor heißt: auf der Seite, die du siehst. Hinter heißt: auf der anderen Seite."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was ist ganz oben?"
                say: "Welche Form ist ganz oben?"
                show: { drawn: shape, column: [triangle, square, circle], colours: [green, blue, red] }
                options: ["das Dreieck", "der Kreis", "das Quadrat"]
                answer: "das Dreieck"
                hints:
                  - "Oben ist zum Himmel hin."
                  - "Schau auf die erste Form von oben."
                  - "Das Dreieck."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was ist ganz unten?"
                say: "Welche Form ist ganz unten?"
                show: { drawn: shape, column: [circle, rectangle, square], colours: [yellow, yellow, yellow] }
                options: ["das Quadrat", "der Kreis", "das Rechteck"]
                answer: "das Quadrat"
                hints:
                  - "Unten ist zum Boden hin."
                  - "Schau auf die letzte Form."
                  - "Das Quadrat."
              - id: l2-f3
                type: multiple_choice
                text: "Der Ball liegt unter dem Bett. Wo ist das Bett?"
                say: "Der Ball liegt unter dem Bett. Wo ist dann das Bett?"
                options: ["über dem Ball", "unter dem Ball", "neben dem Ball"]
                answer: "über dem Ball"
                hints:
                  - "Hör genau hin: Der Ball ist unten."
                  - "Über und unter sind Gegenteile."
                  - "Das Bett ist über dem Ball."
              - id: l2-f4
                type: true_false
                text: "Die Lampe hängt über dem Tisch. Die Lampe ist unter dem Tisch."
                say: "Die Lampe hängt über dem Tisch. Stimmt das: Die Lampe ist unter dem Tisch?"
                answer: false
                hints:
                  - "Über und unter sind Gegenteile."
                  - "Die Lampe ist oben."
                  - "Nein, sie ist über dem Tisch."
              - id: l2-f5
                type: multiple_choice
                text: "Du stehst auf der Straße. Das Auto parkt vor der Garage. Wo ist die Garage?"
                say: "Du stehst auf der Straße. Das Auto parkt vor der Garage. Wo ist die Garage?"
                options: ["hinter dem Auto", "vor dem Auto", "auf dem Auto"]
                answer: "hinter dem Auto"
                hints:
                  - "Vor und hinter sind Gegenteile."
                  - "Ist das Auto vor der Garage, ist die Garage dahinter."
                  - "Hinter dem Auto."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was ist ganz oben?"
                say: "Welche Form ist ganz oben?"
                show: { drawn: shape, column: [square, rectangle, triangle], colours: [purple, orange, green] }
                options: ["das Quadrat", "das Dreieck", "das Rechteck"]
                answer: "das Quadrat"
                hints: ["Oben ist zum Himmel hin."]
              - id: l2-s2
                type: multiple_choice
                text: "Was ist in der Mitte?"
                say: "Welche Form ist in der Mitte, zwischen oben und unten?"
                show: { drawn: shape, column: [circle, triangle, square], colours: [blue, red, yellow] }
                options: ["das Dreieck", "der Kreis", "das Quadrat"]
                answer: "das Dreieck"
                hints: ["Nicht ganz oben und nicht ganz unten."]
              - id: l2-s3
                type: multiple_choice
                text: "Die Katze sitzt auf dem Stuhl. Wo ist der Stuhl?"
                say: "Die Katze sitzt auf dem Stuhl. Wo ist dann der Stuhl?"
                options: ["unter der Katze", "auf der Katze", "hinter der Katze"]
                answer: "unter der Katze"
                hints: ["Die Katze ist oben. Der Stuhl ist ..."]
              - id: l2-s4
                type: true_false
                text: "Tim steht hinter Mia. Mia steht vor Tim."
                say: "Tim steht hinter Mia. Stimmt das: Mia steht vor Tim?"
                answer: true
                hints: ["Vor und hinter sind Gegenteile."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Bücher stehen im Regal über den Spielen. Wo sind die Spiele?"
                say: "Die Bücher stehen im Regal über den Spielen. Wo sind die Spiele?"
                options: ["unter den Büchern", "über den Büchern", "neben den Büchern"]
                answer: "unter den Büchern"
                hints: ["Über und unter sind Gegenteile."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was ist ganz unten?"
                say: "Welche Form ist ganz unten?"
                show: { drawn: shape, column: [rectangle, circle, triangle], colours: [green, green, green] }
                options: ["das Dreieck", "das Rechteck", "der Kreis"]
                answer: "das Dreieck"
              - id: l2-n2
                type: multiple_choice
                text: "Was ist in der Mitte?"
                say: "Welche Form ist in der Mitte, zwischen oben und unten?"
                show: { drawn: shape, column: [triangle, rectangle, circle], colours: [red, blue, orange] }
                options: ["das Rechteck", "das Dreieck", "der Kreis"]
                answer: "das Rechteck"
              - id: l2-n3
                type: multiple_choice
                text: "Von dir aus gesehen liegt der Hund hinter dem Sofa. Wo ist das Sofa?"
                say: "Von dir aus gesehen liegt der Hund hinter dem Sofa. Wo ist dann das Sofa?"
                options: ["vor dem Hund", "hinter dem Hund", "auf dem Hund"]
                answer: "vor dem Hund"
              - id: l2-n4
                type: true_false
                text: "Der Teppich liegt unter dem Tisch. Der Tisch steht auf dem Teppich."
                say: "Der Teppich liegt unter dem Tisch. Stimmt das: Der Tisch steht auf dem Teppich?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Ben sitzt vorne im Bus. Lea sitzt ganz hinten. Was stimmt?"
                say: "Ben sitzt vorne im Bus. Lea sitzt ganz hinten. Was stimmt?"
                options: ["Ben sitzt vor Lea.", "Lea sitzt vor Ben.", "Ben sitzt hinter Lea."]
                answer: "Ben sitzt vor Lea."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: left-right
            type: multiple_choice
            text: "Was ist ganz rechts?"
            say: "Welche Form ist in dieser Reihe ganz rechts?"
            show: { drawn: shape, row: [square, triangle, rectangle], colours: [blue, red, yellow] }
            options: ["das Rechteck", "das Quadrat", "das Dreieck"]
            answer: "das Rechteck"
          - id: l2-c2
            part: between
            type: multiple_choice
            text: "Was ist zwischen dem Kreis und dem Quadrat?"
            say: "Welche Form ist zwischen dem Kreis und dem Quadrat?"
            show: { drawn: shape, row: [triangle, circle, rectangle, square], colours: [green, purple, orange, red] }
            options: ["das Rechteck", "das Dreieck", "der Kreis"]
            answer: "das Rechteck"
          - id: l2-c3
            part: up-down
            type: multiple_choice
            text: "Was ist ganz oben?"
            say: "Welche Form ist hier ganz oben?"
            show: { drawn: shape, column: [rectangle, triangle, circle], colours: [orange, blue, green] }
            options: ["das Rechteck", "der Kreis", "das Dreieck"]
            answer: "das Rechteck"
          - id: l2-c4
            part: everyday
            type: multiple_choice
            text: "Die Mütze liegt auf dem Schrank. Wo ist der Schrank?"
            say: "Die Mütze liegt auf dem Schrank. Wo ist dann der Schrank?"
            options: ["unter der Mütze", "auf der Mütze", "neben der Mütze"]
            answer: "unter der Mütze"
          - id: l2-c5
            part: everyday
            type: true_false
            text: "Von dir aus gesehen steht das Fahrrad vor dem Haus. Das Haus ist hinter dem Fahrrad."
            say: "Von dir aus gesehen steht das Fahrrad vor dem Haus. Stimmt das: Das Haus ist hinter dem Fahrrad?"
            answer: true
          - id: l2-c6
            part: left-right
            type: multiple_choice
            text: "Was ist links vom Kreis?"
            say: "Welche Form ist direkt links vom Kreis?"
            show: { drawn: shape, row: [triangle, square, circle], colours: [yellow, red, blue] }
            options: ["das Quadrat", "das Dreieck", "der Kreis"]
            answer: "das Quadrat"
          - id: l2-c7
            part: left-right
            type: multiple_choice
            text: "Was ist ganz links?"
            say: "Welche Form ist ganz links?"
            show: { drawn: shape, row: [triangle, rectangle, circle], colours: [orange, green, red] }
            options: ["das Rechteck", "das Dreieck", "der Kreis"]
            answer: "das Dreieck"
          - id: l2-c8
            part: left-right
            type: true_false
            text: "Das Dreieck ist rechts vom Quadrat."
            say: "Stimmt das? Das Dreieck ist rechts vom Quadrat."
            show: { drawn: shape, row: [square, triangle], colours: [blue, yellow] }
            answer: true
          - id: l2-c9
            part: left-right
            type: true_false
            text: "Der Kreis ist ganz links."
            say: "Stimmt das? Der Kreis ist ganz links."
            show: { drawn: shape, row: [square, triangle, circle], colours: [red, green, blue] }
            answer: false
          - id: l2-c10
            part: between
            type: multiple_choice
            text: "Was ist zwischen dem Quadrat und dem Kreis?"
            say: "Welche Form ist zwischen dem Quadrat und dem Kreis?"
            show: { drawn: shape, row: [rectangle, square, triangle, circle], colours: [yellow, red, green, blue] }
            options: ["das Dreieck", "das Rechteck", "der Kreis"]
            answer: "das Dreieck"
          - id: l2-c11
            part: between
            type: multiple_choice
            text: "Was ist neben dem Rechteck?"
            say: "Welche Form ist direkt neben dem Rechteck?"
            show: { drawn: shape, row: [rectangle, triangle, square], colours: [purple, orange, blue] }
            options: ["das Dreieck", "das Quadrat", "der Kreis"]
            answer: "das Dreieck"
          - id: l2-c12
            part: between
            type: true_false
            text: "Das Quadrat ist zwischen dem Dreieck und dem Kreis."
            say: "Stimmt das? Das Quadrat ist zwischen dem Dreieck und dem Kreis."
            show: { drawn: shape, row: [square, triangle, circle], colours: [purple, purple, purple] }
            answer: false
          - id: l2-c13
            part: between
            type: true_false
            text: "Das Rechteck ist neben dem Kreis."
            say: "Stimmt das? Das Rechteck ist neben dem Kreis."
            show: { drawn: shape, row: [circle, rectangle, triangle], colours: [red, yellow, blue] }
            answer: true
          - id: l2-c14
            part: up-down
            type: multiple_choice
            text: "Was ist ganz unten?"
            say: "Welche Form ist hier ganz unten?"
            show: { drawn: shape, column: [square, triangle, circle], colours: [blue, red, green] }
            options: ["der Kreis", "das Quadrat", "das Dreieck"]
            answer: "der Kreis"
          - id: l2-c15
            part: up-down
            type: multiple_choice
            text: "Was ist in der Mitte?"
            say: "Welche Form ist in der Mitte, zwischen oben und unten?"
            show: { drawn: shape, column: [rectangle, square, triangle], colours: [orange, green, purple] }
            options: ["das Quadrat", "das Rechteck", "das Dreieck"]
            answer: "das Quadrat"
          - id: l2-c16
