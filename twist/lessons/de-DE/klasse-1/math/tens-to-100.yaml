            type: ordering
            text: "Ordne von groß nach klein."
            say: "Ordne die Zahlen von groß nach klein."
            options: ["60", "90", "10"]
            slot_count: 3
            answer: ["90", "60", "10"]
          - id: l2-c14
            part: bundle
            type: true_false
