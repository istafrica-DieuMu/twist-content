                say: "Welche Aufgabe hat dasselbe Ergebnis wie sechs plus fünf?"
                options: ["7 + 4", "6 + 6", "5 + 5"]
                answer: "7 + 4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sum-and-number
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen acht plus sieben und sechzehn?"
            frame: "8 + 7 _ 16"
            options: ["<", ">", "="]
            answer: ["<"]
