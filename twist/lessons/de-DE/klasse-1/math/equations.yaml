                answer: "7 + 7"
                hints:
                  - "Rechne zuerst acht plus sechs."
                  - "Acht plus sechs ist vierzehn. Welche Aufgabe ergibt auch vierzehn?"
                  - "7 + 7."
              - id: l2-f5
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen neun plus eins und vier plus sieben?"
                frame: "9 + 1 _ 4 + 7"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Die Neun ist größer als die Vier, aber rechne beide Seiten aus."
                  - "Links ist zehn, rechts ist elf."
                  - "10 < 11."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen neun plus drei und acht plus vier?"
                frame: "9 + 3 _ 8 + 4"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Rechne beide Seiten aus."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Sechs plus acht ist gleich wie viel plus vier?"
                frame: "6 + 8 = _ + 4"
                options: ["10", "14", "4"]
                answer: ["10"]
                hints: ["Wie viel ist links? Rechts muss genauso viel herauskommen."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? 7 + 6 = 9 + 4"
                say: "Sieben plus sechs ist gleich neun plus vier. Stimmt das?"
                answer: true
                hints: ["Rechne beide Seiten aus."]
              - id: l2-s4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen acht plus zwei und drei plus neun?"
                frame: "8 + 2 _ 3 + 9"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Vergleiche nicht nur die ersten Zahlen."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Aufgabe hat dasselbe Ergebnis wie 9 + 7?"
                say: "Welche Aufgabe hat dasselbe Ergebnis wie neun plus sieben?"
                options: ["8 + 8", "9 + 6", "7 + 7"]
                answer: "8 + 8"
                hints: ["Wie viel ist neun plus sieben?"]

          - support: none
