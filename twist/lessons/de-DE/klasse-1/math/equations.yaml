# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.equations
skill: math.add-sub-to-20.equations
curriculum: de-DE
language: de
title:
  de: Gleich, größer, kleiner
  en: Equal, greater, smaller
summary: >
  Comparing sums and numbers with <, > and =, and seeing that different
  sums can have the same result (7 + 5 = 6 + 6). Lesson 1 compares a sum
  with a number; lesson 2 compares two sums, finds sums that are equal,
  and ends with the skill check. The = sign means "is the same as", not
  "the answer comes next".
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-bridge-10, math.numbers-to-20.compare-to-20]
  also_practises: [math.add-sub-to-20.fluency-to-20]
  vocabulary: { de: [gleich, größer als, kleiner als, Gleichheitszeichen, Ergebnis] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld]
  facets: []
  parts:
    - { id: sum-and-number, what: { de: "eine Aufgabe mit einer Zahl vergleichen (<, >, =)", en: "comparing a calculation with a number (<, >, =)" } }
    - { id: two-sums, what: { de: zwei Aufgaben miteinander vergleichen, en: comparing two calculations } }
    - { id: same-result, what: { de: Aufgaben mit demselben Ergebnis finden und ergänzen, en: finding and completing calculations with the same result } }
  misconceptions:
    - id: equals-means-answer
      what: Reads = as "and the answer is", so 7 + 5 = 6 + 6 looks wrong and fills 7 + 5 = _ + 6 with 12
      addressed: Learn says = means both sides are the same; lesson 2 has a sum on both sides in every stage, the result of the left side is an option in each Was fehlt? task, with feedback in the full stage
    - id: compare-first-number
      what: Compares only the first numbers (calls 8 + 1 greater than 7 + 5 because 8 > 7)
      addressed: Learn says to work out both sides first; tasks where the first numbers mislead appear in every stage of lesson 2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Aufgabe und Zahl vergleichen, en: A sum and a number }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen fünfzehn und zwölf?"
            frame: "15 _ 12"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 + 4 = _"
            say: "Acht plus vier."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7 + 5 _ 10"
            say: "Ist sieben plus fünf größer, kleiner oder gleich zehn? Rechne zuerst die Aufgabe: sieben plus fünf ist zwölf."
          - text: "7 + 5 > 10"
            say: "Zwölf ist größer als zehn. Also setzt du das Größer-Zeichen: Sieben plus fünf ist größer als zehn."
          - text: "6 + 4 = 10"
            say: "Sechs plus vier ist zehn. Beide Seiten sind gleich. Das Gleichheitszeichen heißt: Links und rechts ist gleich viel."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen neun plus drei und elf?"
                frame: "9 + 3 _ 11"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Rechne zuerst neun plus drei."
                  - "Neun plus drei ist zwölf. Vergleiche zwölf und elf."
                  - "12 > 11."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen fünfzehn minus sechs und neun?"
                frame: "15 − 6 _ 9"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints:
                  - "Rechne zuerst fünfzehn minus sechs."
                  - "Das ist neun."
                  - "Neun und neun sind gleich viel: 9 = 9."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 8 + 6 < 13"
                say: "Acht plus sechs ist kleiner als dreizehn. Stimmt das?"
                answer: false
                hints:
                  - "Rechne zuerst acht plus sechs."
                  - "Acht plus sechs ist vierzehn. Ist vierzehn kleiner als dreizehn?"
                  - "Nein, vierzehn ist größer als dreizehn."
              - id: l1-f4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen zwölf minus fünf und acht?"
                frame: "12 − 5 _ 8"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Rechne zuerst zwölf minus fünf."
                  - "Zwölf minus fünf ist sieben. Vergleiche sieben und acht."
                  - "7 < 8."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl passt? 6 + 7 = _"
                say: "Wie viel ist sechs plus sieben?"
                options: ["13", "12", "67"]
                answer: "13"
                hints:
                  - "Sechs plus sechs ist zwölf."
                  - "Sieben ist eins mehr."
                  - "13."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen sieben plus sieben und vierzehn?"
                frame: "7 + 7 _ 14"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Rechne zuerst die Aufgabe."]
              - id: l1-s2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen sechzehn minus neun und neun?"
                frame: "16 − 9 _ 9"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Was ist sechzehn minus neun?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? 5 + 8 > 12"
                say: "Fünf plus acht ist größer als zwölf. Stimmt das?"
                answer: true
                hints: ["Rechne zuerst fünf plus acht."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen elf minus zwei und acht?"
                frame: "11 − 2 _ 8"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Was ist elf minus zwei?"]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl passt? 18 − 9 = _"
                say: "Wie viel ist achtzehn minus neun?"
                options: ["9", "8", "27"]
                answer: "9"
                hints: ["Denk an neun plus neun."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen acht plus acht und fünfzehn?"
                frame: "8 + 8 _ 15"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen dreizehn minus sieben und sechs?"
                frame: "13 − 7 _ 6"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 9 + 9 < 17"
                say: "Neun plus neun ist kleiner als siebzehn. Stimmt das?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen vierzehn minus acht und sieben?"
                frame: "14 − 8 _ 7"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahl passt? 4 + 9 = _"
                say: "Wie viel ist vier plus neun?"
                options: ["13", "14", "49"]
                answer: "13"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen sechs plus fünf und zwölf?"
            frame: "6 + 5 _ 12"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Stimmt das? 17 − 8 = 9"
            say: "Siebzehn minus acht ist gleich neun. Stimmt das?"
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen zehn plus sechs und sechzehn?"
            frame: "10 + 6 _ 16"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false
          - id: l1-c4
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen neun plus vier und vierzehn?"
            frame: "9 + 4 _ 14"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 11 − 3 > 9"
            say: "Elf minus drei ist größer als neun. Stimmt das?"
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen sechzehn minus acht und acht?"
            frame: "16 − 8 _ 8"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false

