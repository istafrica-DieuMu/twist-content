            answer: "12"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 + 5 = 6 + 6"
            say: "Sieben plus fünf ist zwölf. Sechs plus sechs ist auch zwölf. Also darf man schreiben: Sieben plus fünf ist gleich sechs plus sechs. Auf beiden Seiten ist gleich viel."
            show: { drawn: zwanzigerfeld, filled: [10, 2] }
          - text: "8 + 1 < 7 + 5"
            say: "Bei zwei Aufgaben rechnest du beide aus. Acht plus eins ist neun, sieben plus fünf ist zwölf. Neun ist kleiner als zwölf. Pass auf: Die erste Zahl allein sagt dir das nicht."
          - text: "9 + 4 = _ + 3"
            say: "Neun plus vier ist dreizehn. Rechts muss auch dreizehn herauskommen: zehn plus drei. Die Lücke ist zehn, nicht dreizehn."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen acht plus drei und sechs plus vier?"
                frame: "8 + 3 _ 6 + 4"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Rechne beide Seiten aus."
                  - "Links ist elf, rechts ist zehn."
                  - "11 > 10."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Neun plus fünf ist gleich wie viel plus sechs?"
                frame: "9 + 5 = _ + 6"
                options: ["8", "14", "9"]
                answer: ["8"]
                feedback:
                  "14": "Vierzehn ist das Ergebnis von neun plus fünf. Rechts muss auch vierzehn herauskommen: Was plus sechs ist vierzehn?"
                  "9": "Neun plus sechs ist fünfzehn, nicht vierzehn."
                hints:
                  - "Rechne zuerst die linke Seite aus."
                  - "Links ist vierzehn. Was plus sechs ist vierzehn?"
                  - "8."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 9 + 2 < 5 + 5"
                say: "Neun plus zwei ist kleiner als fünf plus fünf. Stimmt das?"
                answer: false
                hints:
                  - "Rechne beide Seiten aus."
                  - "Neun plus zwei ist elf. Fünf plus fünf ist zehn."
                  - "Nein, elf ist größer als zehn."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Aufgabe hat dasselbe Ergebnis wie 8 + 6?"
                say: "Welche Aufgabe hat dasselbe Ergebnis wie acht plus sechs?"
