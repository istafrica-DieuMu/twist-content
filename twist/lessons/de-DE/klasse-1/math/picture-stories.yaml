# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.picture-stories
skill: math.word-problems.picture-stories
curriculum: de-DE
language: de
title:
  de: Rechengeschichten
  en: Number stories
summary: >
  A picture or a short story asks a question, and the child finds the sum,
  works it out and says the answer. Lesson 1 finds what the story asks and
  the sum for it; lesson 2 adds the answer sentence and mixes plus and minus
  stories, and ends with the skill check. Stories are spoken and stand on
  screen with their numbers.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-to-10]
  also_practises: [math.add-sub-to-20.add-to-10, math.add-sub-to-20.sub-meaning]
  vocabulary: { de: [Rechengeschichte, Frage, Aufgabe, Antwort, Antwortsatz, dazu, weg] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame]
  facets: []
  parts:
    - { id: question, what: { de: "sagen, was die Geschichte wissen will", en: "saying what the story asks" } }
    - { id: sum, what: { de: die passende Aufgabe finden, en: finding the sum that fits } }
    - { id: solve, what: { de: die Rechengeschichte ausrechnen, en: working out the story } }
    - { id: answer, what: { de: den passenden Antwortsatz finden, en: choosing the answer sentence } }
  misconceptions:
    - id: wrong-start
      what: Starts the minus sum with the number taken away (2 − 6 for "6 Vögel, 2 fliegen weg")
      addressed: Learn says the first number is how many there were at the start; options always include the swapped sum
    - id: answer-without-thing
      what: Gives a bare number as the answer and loses what it counts
      addressed: lesson 2 chooses the answer sentence; the wrong options put the right number on the wrong thing
    - id: keyword-only
      what: Picks plus or minus from one word without picturing the story
      addressed: the word noch appears in both plus and minus stories, and some plus stories have no signal word (Oma legt vier hinein); hints ask whether there are more or fewer at the end
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was will die Geschichte wissen?", en: "What does the story ask?" }
    goal:
      de: "Hör die Geschichte und find die passende Aufgabe. Fünf Vögel, zwei fliegen weg, das ist 5 − 2."
      en: "Listen to the story and find the sum that fits. Five birds and two fly away, that is 5 − 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "7 − 3 = _"
            say: "Sieben minus drei."
            answer: "4"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 + 5 = _"
            say: "Zwei plus fünf."
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - say: "Fünf Vögel sitzen auf dem Baum. Zwei fliegen weg. Wie viele Vögel sitzen noch auf dem Baum?"
            show: { object: bird, count: 5 }
          - say: "Die Geschichte will wissen: Wie viele sitzen noch da? Am Anfang sind es fünf. Zwei fliegen weg, also sind es am Ende weniger. Das ist eine Minusaufgabe: fünf minus zwei."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - say: "Fünf minus zwei ist drei. Drei Vögel sitzen noch auf dem Baum."
            text: "5 − 2 = 3"
          - say: "So gehst du vor: Hör die Geschichte. Was will sie wissen? Werden es mehr oder weniger? Dann rechnest du."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "4 Äpfel liegen im Korb. Mama legt 2 dazu. Wie viele Äpfel sind jetzt im Korb?\nWelche Aufgabe passt?"
                say: "Vier Äpfel liegen im Korb. Mama legt zwei dazu. Wie viele Äpfel sind jetzt im Korb? Welche Aufgabe passt?"
                show: { object: apple, groups: [4, 2] }
                options: ["4 + 2", "4 − 2", "2 − 4"]
                answer: "4 + 2"
                hints:
                  - "Werden es mehr oder weniger Äpfel?"
                  - "Zwei kommen dazu, also mehr: plus."
                  - "Vier und zwei dazu: 4 + 2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "6 Kinder spielen Fußball. 2 gehen nach Hause.\nWas sollst du herausfinden?"
                say: "Sechs Kinder spielen Fußball. Zwei gehen nach Hause. Was sollst du herausfinden?"
                show: { object: child, count: 6, gone: 2 }
                options: ["Wie viele spielen noch?", "Wie heißt das Spiel?", "Wo ist der Ball?"]
                answer: "Wie viele spielen noch?"
                hints:
                  - "Bei einer Rechengeschichte geht es um eine Zahl."
                  - "Welche Frage hat eine Zahl als Antwort?"
                  - "Wie viele spielen noch?"
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "7 Ballons sind am Stand. 3 fliegen weg. Wie viele Ballons sind noch da?\nWelche Aufgabe passt?"
                say: "Sieben Ballons sind am Stand. Drei fliegen weg. Wie viele Ballons sind noch da? Welche Aufgabe passt?"
                show: { object: balloon, count: 7, gone: 3 }
                options: ["3 − 7", "7 + 3", "7 − 3"]
                answer: "7 − 3"
                hints:
                  - "Am Anfang sind es sieben."
                  - "Drei fliegen weg, also weniger: minus."
                  - "7 − 3."
              - id: l1-f4
                type: text_input
                text: "7 Ballons sind am Stand. 3 fliegen weg. Wie viele Ballons sind noch da?\n7 − 3 = _"
                say: "Sieben Ballons sind am Stand. Drei fliegen weg. Wie viele Ballons sind noch da? Rechne sieben minus drei."
                show: { object: balloon, count: 7, gone: 3 }
                answer: "4"
                hints:
                  - "Nimm drei von sieben weg."
                  - "Sieben, sechs, fünf, vier."
                  - "4 Ballons."
              - id: l1-f5
                type: multiple_choice
                text: "Auf dem Teller liegen 3 Erdbeeren. Ben legt noch 5 dazu. Wie viele Erdbeeren sind es jetzt?\nWelche Aufgabe passt?"
                say: "Auf dem Teller liegen drei Erdbeeren. Ben legt noch fünf dazu. Wie viele Erdbeeren sind es jetzt? Welche Aufgabe passt?"
                show: { object: strawberry, groups: [3, 5] }
                options: ["5 − 3", "3 + 5", "3 − 5"]
                answer: "3 + 5"
                hints:
                  - "Noch fünf dazu: Werden es mehr oder weniger?"
                  - "Mehr, also plus."
                  - "3 + 5."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "9 Ameisen laufen über den Weg. 4 krabbeln unter einen Stein. Wie viele sind noch auf dem Weg?\nWelche Aufgabe passt?"
                say: "Neun Ameisen laufen über den Weg. Vier krabbeln unter einen Stein. Wie viele sind noch auf dem Weg? Welche Aufgabe passt?"
                show: { object: ant, count: 9, gone: 4 }
                options: ["9 − 4", "9 + 4", "4 − 9"]
                answer: "9 − 4"
                hints: ["Werden es auf dem Weg mehr oder weniger?"]
              - id: l1-s2
                type: text_input
                text: "9 Ameisen laufen über den Weg. 4 krabbeln unter einen Stein. Wie viele sind noch auf dem Weg?\n9 − 4 = _"
                say: "Neun Ameisen laufen über den Weg. Vier krabbeln unter einen Stein. Wie viele Ameisen sind noch auf dem Weg?"
                show: { object: ant, count: 9, gone: 4 }
                answer: "5"
                hints: ["Zähl von neun vier zurück."]
              - id: l1-s3
                type: multiple_choice
                text: "Lena hat 2 Sticker. Sie bekommt noch 3.\nWas sollst du herausfinden?"
                say: "Lena hat zwei Sticker. Sie bekommt noch drei. Was sollst du herausfinden?"
                show: { object: sticker, groups: [2, 3] }
                options: ["Wie viele Sticker hat sie jetzt?", "Wer gibt ihr die Sticker?", "Welche Farbe haben sie?"]
                answer: "Wie viele Sticker hat sie jetzt?"
                hints: ["Die Antwort ist eine Zahl."]
              - id: l1-s4
                type: true_false
                text: "6 Frösche sitzen am Teich. 2 springen ins Wasser. Wie viele sitzen noch am Teich?\nPasst 6 + 2?"
                say: "Sechs Frösche sitzen am Teich. Zwei springen ins Wasser. Wie viele sitzen noch am Teich? Passt sechs plus zwei?"
                show: { object: frog, count: 6, gone: 2 }
                answer: false
                hints: ["Am Teich werden es weniger."]
              - id: l1-s5
                type: text_input
                text: "Im Stall steht 1 Lama. 4 kommen von der Wiese dazu. Wie viele Lamas sind jetzt im Stall?\n1 + 4 = _"
                say: "Im Stall steht ein Lama. Vier kommen von der Wiese dazu. Wie viele Lamas sind jetzt im Stall?"
                show: { object: llama, groups: [1, 4] }
                answer: "5"
                hints: ["Eins und vier dazu."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "8 Fische schwimmen im Glas. Mia setzt 2 Fische in ein anderes Glas. Wie viele sind noch im ersten Glas?\nWelche Aufgabe passt?"
                say: "Acht Fische schwimmen im Glas. Mia setzt zwei Fische in ein anderes Glas. Wie viele sind noch im ersten Glas? Welche Aufgabe passt?"
                show: { object: fish, count: 8, gone: 2 }
                options: ["2 − 8", "8 − 2", "8 + 2"]
                answer: "8 − 2"
              - id: l1-n2
                type: text_input
                text: "8 Fische schwimmen im Glas. Mia setzt 2 Fische in ein anderes Glas. Wie viele sind noch im ersten Glas?\n8 − 2 = _"
                say: "Acht Fische schwimmen im Glas. Mia setzt zwei Fische in ein anderes Glas. Wie viele Fische sind noch im ersten Glas?"
                show: { object: fish, count: 8, gone: 2 }
                answer: "6"
              - id: l1-n3
                type: multiple_choice
                text: "4 Autos stehen auf dem Parkplatz. Noch 3 fahren dazu. Wie viele Autos stehen jetzt da?\nWelche Aufgabe passt?"
                say: "Vier Autos stehen auf dem Parkplatz. Noch drei fahren dazu. Wie viele Autos stehen jetzt da? Welche Aufgabe passt?"
                show: { object: car, groups: [4, 3] }
                options: ["4 + 3", "4 − 3", "3 − 4"]
                answer: "4 + 3"
              - id: l1-n4
                type: text_input
                text: "4 Autos stehen auf dem Parkplatz. Noch 3 fahren dazu. Wie viele Autos stehen jetzt da?\n4 + 3 = _"
                say: "Vier Autos stehen auf dem Parkplatz. Noch drei fahren dazu. Wie viele Autos stehen jetzt auf dem Parkplatz?"
                show: { object: car, groups: [4, 3] }
                answer: "7"
              - id: l1-n5
                type: multiple_choice
                text: "10 Blätter hängen am Baum. Der Wind weht 3 weg.\nWas sollst du herausfinden?"
                say: "Zehn Blätter hängen am Baum. Der Wind weht drei weg. Was sollst du herausfinden?"
                show: { object: leaf, count: 10, gone: 3 }
                options: ["Woher kommt der Wind?", "Wie viele hängen noch am Baum?", "Was für ein Baum ist das?"]
                answer: "Wie viele hängen noch am Baum?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "5 Mäuse sitzen im Loch. Noch 2 kommen dazu. Wie viele Mäuse sind jetzt im Loch?\nWelche Aufgabe passt?"
            say: "Fünf Mäuse sitzen im Loch. Noch zwei kommen dazu. Wie viele Mäuse sind jetzt im Loch? Welche Aufgabe passt?"
            show: { object: mouse, groups: [5, 2] }
            options: ["5 − 2", "2 − 5", "5 + 2"]
            answer: "5 + 2"
          - id: l1-c2
            type: fill_in_blank
            text: "6 Bananen liegen auf dem Tisch. Die Kinder essen 4. Wie viele Bananen liegen noch da?\nSchreib die Rechnung."
            say: "Sechs Bananen liegen auf dem Tisch. Die Kinder essen vier. Wie viele Bananen liegen noch da? Schreib die Rechnung."
            show: { object: banana, count: 6, gone: 4 }
            frame: "_ _ _ = _"
            options: ["2", "4", "6", "10", "+", "−"]
            answer: ["6", "−", "4", "2"]
          - id: l1-c3
            type: true_false
            text: "9 Kinder sind im Bus. 3 steigen aus. Wie viele Kinder sind noch im Bus?\nPasst 3 − 9?"
            say: "Neun Kinder sind im Bus. Drei steigen aus. Wie viele Kinder sind noch im Bus? Passt drei minus neun?"
            show: { object: child, count: 9, gone: 3 }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "8 Bananen liegen im Korb. Ali nimmt 3 heraus.\nWas sollst du herausfinden?"
            say: "Acht Bananen liegen im Korb. Ali nimmt drei heraus. Was sollst du herausfinden?"
            show: { object: banana, count: 8, gone: 3 }
            options: ["Wie viele Bananen liegen noch im Korb?", "Wer hat den Korb gekauft?", "Wie schmecken die Bananen?"]
            answer: "Wie viele Bananen liegen noch im Korb?"
          - id: l1-c5
            type: text_input
            text: "2 Kinder fahren Rad. 6 kommen dazu. Wie viele Kinder fahren jetzt Rad?\n2 + 6 = _"
            say: "Zwei Kinder fahren Rad. Sechs kommen dazu. Wie viele Kinder fahren jetzt Rad?"
            show: { object: child, groups: [2, 6] }
            answer: "8"
          - id: l1-c6
            type: multiple_choice
            text: "10 Murmeln liegen auf dem Boden. Tim hebt 6 auf. Wie viele Murmeln liegen noch auf dem Boden?\nWelche Aufgabe passt?"
            say: "Zehn Murmeln liegen auf dem Boden. Tim hebt sechs auf. Wie viele Murmeln liegen noch auf dem Boden? Welche Aufgabe passt?"
            show: { object: marble, count: 10, gone: 6 }
            options: ["10 − 6", "6 − 10", "10 + 6"]
            answer: "10 − 6"

  - n: 2
    title: { de: "Frage, Rechnung, Antwort", en: "Question, sum, answer" }
    goal:
      de: "Rechne die Geschichte aus und sag die Antwort in einem ganzen Satz. In der Schublade liegen noch vier Löffel."
      en: "Work out the story and give the answer in a whole sentence. There are four spoons left in the drawer."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2 Hunde spielen im Garten. 3 kommen dazu. Wie viele Hunde sind jetzt im Garten?\nWelche Aufgabe passt?"
            say: "Zwei Hunde spielen im Garten. Drei kommen dazu. Wie viele Hunde sind jetzt im Garten? Welche Aufgabe passt?"
            show: { object: dog, groups: [2, 3] }
            options: ["2 + 3", "3 − 2", "2 − 3"]
            answer: "2 + 3"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 − 5 = _"
            say: "Acht minus fünf."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - say: "In der Schublade liegen sieben Löffel. Papa nimmt drei für den Tisch. Wie viele Löffel liegen noch in der Schublade?"
            show: { object: spoon, count: 7 }
          - say: "Die Frage: Wie viele Löffel liegen noch in der Schublade? Die Rechnung: sieben minus drei ist vier."
            text: "7 − 3 = 4"
          - say: "Die Antwort sagst du in einem ganzen Satz, mit der Zahl und mit dem, was du gezählt hast: In der Schublade liegen noch vier Löffel."
            text: "In der Schublade liegen noch 4 Löffel."
          - say: "Pass auf: Das Wort noch steht in Plusgeschichten und in Minusgeschichten. Frag dich immer: Sind es am Ende mehr oder weniger?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3 Kinder sitzen auf der Bank. 2 setzen sich dazu. 3 + 2 = 5\nWelcher Antwortsatz passt?"
                say: "Drei Kinder sitzen auf der Bank. Zwei setzen sich dazu. Drei plus zwei ist fünf. Welcher Antwortsatz passt?"
                show: { object: child, groups: [3, 2] }
                options: ["Jetzt sitzen 5 Kinder auf der Bank.", "Jetzt sitzen 2 Kinder auf der Bank.", "Jetzt sind 5 Bänke da."]
                answer: "Jetzt sitzen 5 Kinder auf der Bank."
                hints:
                  - "Die Rechnung sagt fünf."
                  - "Gezählt hast du Kinder, keine Bänke."
                  - "Jetzt sitzen 5 Kinder auf der Bank."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Auf dem Teller liegen noch 8 Erdbeeren. Tim isst 5. Wie viele Erdbeeren liegen dann noch auf dem Teller?\nWelche Aufgabe passt?"
                say: "Auf dem Teller liegen noch acht Erdbeeren. Tim isst fünf. Wie viele Erdbeeren liegen dann noch auf dem Teller? Welche Aufgabe passt?"
                show: { object: strawberry, count: 8, gone: 5 }
                options: ["8 + 5", "8 − 5", "5 − 8"]
                answer: "8 − 5"
                hints:
                  - "Hier kommt das Wort noch vor. Werden es trotzdem mehr oder weniger?"
                  - "Tim isst Erdbeeren, also weniger."
                  - "8 − 5."
              - id: l2-f3
                type: text_input
                text: "Auf dem Teller liegen 8 Erdbeeren. Tim isst 5. Wie viele Erdbeeren liegen noch auf dem Teller?\n8 − 5 = _"
                say: "Auf dem Teller liegen acht Erdbeeren. Tim isst fünf. Wie viele Erdbeeren liegen noch auf dem Teller?"
                show: { object: strawberry, count: 8, gone: 5 }
                answer: "3"
                hints:
                  - "Nimm fünf von acht weg."
                  - "Sieben, sechs, fünf, vier, drei."
                  - "3 Erdbeeren."
              - id: l2-f4
                type: multiple_choice
                text: "Auf dem Teller liegen 8 Erdbeeren. Tim isst 5. 8 − 5 = 3\nWelcher Antwortsatz passt?"
                say: "Auf dem Teller liegen acht Erdbeeren. Tim isst fünf. Acht minus fünf ist drei. Welcher Antwortsatz passt?"
                show: { object: strawberry, count: 8, gone: 5 }
                options: ["Auf dem Teller liegen noch 3 Teller.", "Auf dem Teller liegen noch 3 Erdbeeren.", "Auf dem Teller liegen noch 5 Erdbeeren."]
                answer: "Auf dem Teller liegen noch 3 Erdbeeren."
                hints:
                  - "Du hast drei gerechnet."
                  - "Was hast du gezählt?"
                  - "Auf dem Teller liegen noch 3 Erdbeeren."
              - id: l2-f5
                type: multiple_choice
                text: "In der Schachtel sind 2 Murmeln. Oma legt 4 hinein. Wie viele Murmeln sind jetzt in der Schachtel?\nWelche Aufgabe passt?"
                say: "In der Schachtel sind zwei Murmeln. Oma legt vier hinein. Wie viele Murmeln sind jetzt in der Schachtel? Welche Aufgabe passt?"
                show: { object: marble, groups: [2, 4] }
                options: ["4 − 2", "2 − 4", "2 + 4"]
                answer: "2 + 4"
                hints:
                  - "Mehr oder weniger Murmeln?"
                  - "Oma legt welche hinein: mehr."
                  - "2 + 4."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "10 Buntstifte sind in der Dose. Ali verleiht 4. Wie viele Buntstifte sind noch in der Dose?\n10 − 4 = _"
                say: "Zehn Buntstifte sind in der Dose. Ali verleiht vier. Wie viele Buntstifte sind noch in der Dose?"
                show: { object: crayon, count: 10, gone: 4 }
                answer: "6"
                hints: ["Zehn, davon vier weg."]
              - id: l2-s2
                type: multiple_choice
                text: "10 Buntstifte sind in der Dose. Ali verleiht 4. Wie viele Buntstifte sind noch in der Dose?\nWelcher Antwortsatz passt?"
                say: "Zehn Buntstifte sind in der Dose. Ali verleiht vier. Wie viele Buntstifte sind noch in der Dose? Welcher Antwortsatz passt?"
                show: { object: crayon, count: 10, gone: 4 }
                options: ["In der Dose sind noch 4 Buntstifte.", "In der Dose sind noch 6 Buntstifte.", "Ali hat 6 Dosen."]
                answer: "In der Dose sind noch 6 Buntstifte."
                hints: ["Wie viel ist zehn minus vier?"]
              - id: l2-s3
                type: multiple_choice
                text: "Am Morgen sind 5 Eier im Nest. Bis zum Mittag legt die Henne noch 2 dazu. Wie viele Eier sind jetzt im Nest?\nWelche Aufgabe passt?"
                say: "Am Morgen sind fünf Eier im Nest. Bis zum Mittag legt die Henne noch zwei dazu. Wie viele Eier sind jetzt im Nest? Welche Aufgabe passt?"
                show: { object: egg, groups: [5, 2] }
                options: ["5 + 2", "5 − 2", "2 − 5"]
                answer: "5 + 2"
                hints: ["Mehr oder weniger Eier am Mittag?"]
              - id: l2-s4
                type: true_false
                text: "4 Kinder sind auf dem Spielplatz. 5 kommen dazu. Wie viele Kinder sind jetzt da?\nPasst 4 + 5?"
                say: "Vier Kinder sind auf dem Spielplatz. Fünf kommen dazu. Wie viele Kinder sind jetzt da? Passt vier plus fünf?"
                show: { object: child, groups: [4, 5] }
                answer: true
                hints: ["Es kommen Kinder dazu."]
              - id: l2-s5
                type: text_input
                text: "4 Kinder sind auf dem Spielplatz. 5 kommen dazu. Wie viele Kinder sind jetzt da?\n4 + 5 = _"
                say: "Vier Kinder sind auf dem Spielplatz. Fünf kommen dazu. Wie viele Kinder sind jetzt auf dem Spielplatz?"
                show: { object: child, groups: [4, 5] }
                answer: "9"
                hints: ["Fang bei fünf an und zähl vier weiter."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "An der Leine hängen 9 T-Shirts. Papa nimmt 6 ab. Wie viele hängen noch an der Leine?\nWelche Aufgabe passt?"
                say: "An der Leine hängen neun T-Shirts. Papa nimmt sechs ab. Wie viele hängen noch an der Leine? Welche Aufgabe passt?"
                show: { object: t-shirt, count: 9, gone: 6 }
                options: ["6 − 9", "9 + 6", "9 − 6"]
                answer: "9 − 6"
              - id: l2-n2
                type: text_input
                text: "An der Leine hängen 9 T-Shirts. Papa nimmt 6 ab. Wie viele hängen noch an der Leine?\n9 − 6 = _"
                say: "An der Leine hängen neun T-Shirts. Papa nimmt sechs ab. Wie viele T-Shirts hängen noch an der Leine?"
                show: { object: t-shirt, count: 9, gone: 6 }
                answer: "3"
              - id: l2-n3
                type: multiple_choice
                text: "An der Leine hängen 9 T-Shirts. Papa nimmt 6 ab. Wie viele T-Shirts hängen noch an der Leine?\nWelcher Antwortsatz passt?"
                say: "An der Leine hängen neun T-Shirts. Papa nimmt sechs ab. Wie viele T-Shirts hängen noch an der Leine? Welcher Antwortsatz passt?"
                show: { object: t-shirt, count: 9, gone: 6 }
                options: ["An der Leine hängen noch 3 T-Shirts.", "Papa hat 3 Leinen.", "An der Leine hängen noch 6 T-Shirts."]
                answer: "An der Leine hängen noch 3 T-Shirts."
              - id: l2-n4
                type: text_input
                text: "3 Kinder malen ein Bild. Noch 3 malen mit. Wie viele Kinder malen jetzt?\n3 + 3 = _"
                say: "Drei Kinder malen ein Bild. Noch drei malen mit. Wie viele Kinder malen jetzt?"
                show: { object: child, groups: [3, 3] }
                answer: "6"
