# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.add-sub-tens
skill: math.add-sub-to-100.tens
curriculum: de-DE
language: de
title:
  de: Mit Zehnerzahlen rechnen
  en: Adding and subtracting tens
summary: >
  Lesson 1 adds Zehnerzahlen with the small sum (3 + 4 = 7, also 30 +
  40 = 70) using tens rods; lesson 2 subtracts them the same way (9 − 6 =
  3, also 90 − 60 = 30), finds the missing Zehnerzahl to 100, and ends
  with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen mit Zehnern, en: Adding and subtracting tens }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-100.tens, math.add-sub-to-20.sub-to-10]
  also_practises: [math.numbers-to-100.tens]
  vocabulary: { de: [Zehner, plus, minus, kleine Aufgabe, große Aufgabe] }
  forms: [text, audio, drawn]
  drawn: [base-ten]
  facets: []
  parts:
    - { id: add, what: { de: Zehnerzahlen addieren, en: adding multiples of ten } }
    - { id: subtract, what: { de: Zehnerzahlen subtrahieren, en: subtracting multiples of ten } }
    - { id: to-100, what: { de: die fehlende Zehnerzahl bis 100 finden, en: finding the missing multiple of ten to 100 } }
  misconceptions:
    - id: drops-the-zero
      what: Solves the small sum and forgets the Zehner (30 + 40 = 7)
      addressed: lesson 1 Learn writes the small sum under the big one; every stage offers the small result, with feedback in l1-f2 and l2-f2
    - id: adds-the-zeros
      what: Writes both zeros into the answer (30 + 40 = 700)
      addressed: l1-f3 and l1-s3 offer the result with both zeros (600, 400), with feedback in l1-f3; the rods in lesson 1 Learn show seven Zehner
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zehner plus Zehner", en: "Tens plus tens" }
    goal:
      de: "Rechne mit ganzen Zehnern plus. Weil 3 + 4 sieben ist, ist 30 + 40 siebzig."
      en: "Add whole tens. Because 3 + 4 is 7, 30 + 40 is 70."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 + 4 = _"
            say: "Drei plus vier."
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "7 Zehner = _"
            say: "Sieben Zehner sind wie viel?"
            options: ["70", "7", "17"]
            answer: "70"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "30 + 40: mehr als 100?"
            say: "Dreißig plus vierzig. Was glaubst du: Ist das mehr als hundert oder weniger?"
          - text: "30 + 40"
            say: "Wir legen es mit Stangen. Drei Zehnerstangen und vier Zehnerstangen. Zusammen sind das sieben Zehnerstangen."
            show: { drawn: base-ten, tens: 7 }
          - text: "3 + 4 = 7 | 30 + 40 = 70"
            say: "Die kleine Aufgabe hilft: Drei plus vier ist sieben. Dann sind drei Zehner plus vier Zehner sieben Zehner: siebzig. Das ist weniger als hundert."
          - text: "50 + 50 = 100"
            say: "Fünf plus fünf ist zehn. Fünf Zehner plus fünf Zehner sind zehn Zehner: hundert."
          - text: "Wusstest du? Ein Handballspiel dauert 60 Minuten: 2 Halbzeiten mit je 30 Minuten."
            say: "Wusstest du? Ein Handballspiel dauert sechzig Minuten: zwei Halbzeiten mit je dreißig Minuten. Dreißig plus dreißig ist sechzig."
            show: { object: ball, count: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "20 + 30 = _"
                say: "Zwanzig plus dreißig."
                options: ["50", "5", "23"]
                answer: "50"
                option_audio: false
                hints:
                  - "Die kleine Aufgabe ist 2 + 3."
                  - "2 + 3 = 5, also fünf Zehner."
                  - "50."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "40 + 50 = _"
                say: "Vierzig plus fünfzig."
                options: ["90", "9", "45"]
                answer: "90"
                option_audio: false
                feedback:
                  "9": "Das ist die kleine Aufgabe 4 + 5. Es sind aber Zehner: neun Zehner."
                hints:
                  - "Denk an 4 + 5."
                  - "4 + 5 = 9, also neun Zehner."
                  - "90."
              - id: l1-f3
                type: multiple_choice
                text: "30 + 30 = _"
                say: "Dreißig plus dreißig."
                options: ["60", "600", "33"]
                answer: "60"
                option_audio: false
                feedback:
                  "600": "Drei Zehner und drei Zehner sind sechs Zehner. Sechs Zehner schreibst du mit einer 0: 60."
                hints:
                  - "Denk an 3 + 3."
                  - "Sechs Zehner."
                  - "60."
              - id: l1-f4
                type: true_false
                text: "60 + 20 = 80"
                say: "Stimmt das? Sechzig plus zwanzig ist achtzig."
                answer: true
                hints:
                  - "Denk an 6 + 2."
                  - "6 + 2 = 8, also acht Zehner."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: text_input
                text: "10 + 70 = _"
                say: "Zehn plus siebzig."
                answer: "80"
                hints:
                  - "Denk an 1 + 7."
                  - "Acht Zehner."
                  - "80."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "40 + 20 = _"
                say: "Vierzig plus zwanzig."
                options: ["60", "6", "42"]
                answer: "60"
                option_audio: false
                hints: ["Denk an 4 + 2."]
              - id: l1-s2
                type: multiple_choice
                text: "50 + 30 = _"
                say: "Fünfzig plus dreißig."
                options: ["80", "8", "53"]
                answer: "80"
                option_audio: false
                hints: ["Die kleine Aufgabe ist 5 + 3."]
              - id: l1-s3
                type: multiple_choice
                text: "20 + 20 = _"
                say: "Zwanzig plus zwanzig."
                options: ["40", "400", "22"]
                answer: "40"
                option_audio: false
                feedback:
                  "400": "Vierhundert? So viele Stangen passen nicht mal in dein Kinderzimmer! Zwei Zehner und zwei Zehner sind vier Zehner: vierzig."
                hints: ["Vier Zehner schreibst du mit einer 0."]
              - id: l1-s4
                type: true_false
                text: "70 + 20 = 9"
                say: "Stimmt das? Siebzig plus zwanzig ist neun."
                answer: false
                hints: ["Denk an 7 + 2. Sind das Einer oder Zehner?"]
              - id: l1-s5
                type: text_input
                text: "60 + 40 = _"
                say: "Sechzig plus vierzig."
                answer: "100"
                hints: ["6 + 4 = 10. Zehn Zehner sind ..."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "10 + 50 = _"
                say: "Zehn plus fünfzig."
                options: ["60", "6", "15"]
                answer: "60"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "30 + 50 = _"
                say: "Dreißig plus fünfzig."
                options: ["80", "8", "35"]
                answer: "80"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "40 + 40 = 80"
                say: "Stimmt das? Vierzig plus vierzig ist achtzig."
                answer: true
              - id: l1-n4
                type: text_input
                text: "Vor der Schule stehen 20 Fahrräder, hinter der Schule 70. Wie viele Fahrräder sind es zusammen?"
                say: "Vor der Schule stehen zwanzig Fahrräder, hinter der Schule siebzig. Wie viele Fahrräder sind es zusammen?"
                answer: "90"
              - id: l1-n5
                type: text_input
                text: "80 + 20 = _"
                say: "Achtzig plus zwanzig."
                answer: "100"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "50 + 40 = _"
            say: "Fünfzig plus vierzig."
            options: ["90", "9", "54"]
            answer: "90"
            option_audio: false
          - id: l1-c2
            type: text_input
            text: "30 + 60 = _"
            say: "Dreißig plus sechzig."
            answer: "90"
          - id: l1-c3
            type: true_false
            text: "20 + 50 = 70"
            say: "Stimmt das? Zwanzig plus fünfzig ist siebzig."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "70 + 10 = _"
            say: "Siebzig plus zehn."
            options: ["80", "8", "71"]
            answer: "80"
            option_audio: false
          - id: l1-c5
            type: text_input
            text: "40 + 60 = _"
            say: "Vierzig plus sechzig."
            answer: "100"
          - id: l1-c6
            type: true_false
            text: "30 + 20 = 5"
            say: "Stimmt das? Dreißig plus zwanzig ist fünf."
            answer: false

  - n: 2
    title: { de: "Zehner minus Zehner", en: "Tens minus tens" }
    goal:
      de: "Nimm ganze Zehner weg. Weil 9 − 6 drei ist, ist 90 − 60 dreißig."
      en: "Take away whole tens. Because 9 − 6 is 3, 90 − 60 is 30."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "40 + 30 = _"
            say: "Vierzig plus dreißig."
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "9 − 6 = _"
            say: "Neun minus sechs."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "9 Stangen, 6 weg"
            say: "Du hast neun Zehnerstangen und nimmst sechs weg. Was glaubst du: Wie viele Stangen bleiben übrig?"
          - text: "90 − 60"
            say: "Neun Zehnerstangen. Sechs nimmst du weg. Drei Stangen bleiben übrig."
            show: { drawn: base-ten, tens: 3 }
          - text: "9 − 6 = 3 | 90 − 60 = 30"
            say: "Die kleine Aufgabe hilft wieder: Neun minus sechs ist drei. Dann sind neun Zehner minus sechs Zehner drei Zehner: dreißig."
          - text: "70 + _ = 100"
            say: "Wie viel fehlt von siebzig bis hundert? Sieben plus drei ist zehn. Also fehlen drei Zehner: dreißig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "80 − 30 = _"
                say: "Achtzig minus dreißig."
                options: ["50", "5", "77"]
                answer: "50"
                option_audio: false
                hints:
                  - "Die kleine Aufgabe ist 8 − 3."
                  - "8 − 3 = 5, also fünf Zehner."
                  - "50."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "70 − 40 = _"
                say: "Siebzig minus vierzig."
                options: ["30", "3", "66"]
                answer: "30"
                option_audio: false
                feedback:
                  "3": "Das ist die kleine Aufgabe 7 − 4. Es bleiben aber drei Zehner."
                hints:
                  - "Denk an 7 − 4."
                  - "7 − 4 = 3, also drei Zehner."
                  - "30."
              - id: l2-f3
                type: text_input
                text: "100 − 20 = _"
                say: "Hundert minus zwanzig."
                answer: "80"
                hints:
                  - "Hundert sind zehn Zehner."
                  - "10 − 2 = 8, also acht Zehner."
                  - "80."
              - id: l2-f4
                type: true_false
                text: "60 − 50 = 10"
                say: "Stimmt das? Sechzig minus fünfzig ist zehn."
                answer: true
                hints:
                  - "Denk an 6 − 5."
                  - "Ein Zehner bleibt."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "60 + _ = 100"
                say: "Sechzig plus wie viel ist hundert?"
                options: ["40", "4", "50"]
                answer: "40"
                option_audio: false
                hints:
                  - "Denk an 6 + _ = 10."
                  - "6 + 4 = 10, also vier Zehner."
                  - "40."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "50 − 20 = _"
                say: "Fünfzig minus zwanzig."
                options: ["30", "3", "48"]
                answer: "30"
                option_audio: false
                hints: ["Denk an 5 − 2."]
              - id: l2-s2
                type: multiple_choice
                text: "90 − 70 = _"
                say: "Neunzig minus siebzig."
                options: ["20", "2", "83"]
                answer: "20"
                option_audio: false
                hints: ["Die kleine Aufgabe ist 9 − 7."]
              - id: l2-s3
                type: text_input
                text: "100 − 60 = _"
                say: "Hundert minus sechzig."
                answer: "40"
                hints: ["10 − 6 = ?"]
              - id: l2-s4
                type: true_false
                text: "80 − 40 = 4"
                say: "Stimmt das? Achtzig minus vierzig ist vier."
                answer: false
                hints: ["Denk an 8 − 4. Sind das Einer oder Zehner?"]
              - id: l2-s5
                type: multiple_choice
                text: "30 + _ = 100"
                say: "Dreißig plus wie viel ist hundert?"
                options: ["70", "7", "60"]
                answer: "70"
                option_audio: false
                hints: ["3 + 7 = 10."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "60 − 20 = _"
                say: "Sechzig minus zwanzig."
                options: ["40", "4", "58"]
                answer: "40"
                option_audio: false
              - id: l2-n2
                type: multiple_choice
                text: "90 − 50 = _"
                say: "Neunzig minus fünfzig."
                options: ["40", "4", "85"]
                answer: "40"
                option_audio: false
              - id: l2-n3
                type: text_input
                text: "Ein Buch hat 100 Seiten. Lea hat schon 30 gelesen. Wie viele Seiten fehlen noch?"
                say: "Ein Buch hat hundert Seiten. Lea hat schon dreißig gelesen. Wie viele Seiten fehlen noch?"
                answer: "70"
              - id: l2-n4
                type: true_false
                text: "70 − 70 = 0"
                say: "Stimmt das? Siebzig minus siebzig ist null."
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "20 + _ = 100"
                say: "Zwanzig plus wie viel ist hundert?"
                options: ["80", "8", "90"]
                answer: "80"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: multiple_choice
            text: "10 + 60 = _"
            say: "Zehn plus sechzig."
            options: ["70", "7", "16"]
            answer: "70"
            option_audio: false
          - id: l2-c2
            part: add
            type: text_input
            text: "90 + 10 = _"
            say: "Neunzig plus zehn."
            answer: "100"
          - id: l2-c3
            part: subtract
            type: multiple_choice
            text: "80 − 60 = _"
            say: "Achtzig minus sechzig."
            options: ["20", "2", "74"]
            answer: "20"
            option_audio: false
          - id: l2-c4
            part: subtract
            type: text_input
            text: "100 − 40 = _"
            say: "Hundert minus vierzig."
            answer: "60"
          - id: l2-c5
            part: to-100
            type: multiple_choice
            text: "90 + _ = 100"
            say: "Neunzig plus wie viel ist hundert?"
            options: ["10", "1", "20"]
            answer: "10"
            option_audio: false
          - id: l2-c6
            part: add
            type: text_input
            text: "60 + 30 = _"
            say: "Sechzig plus dreißig."
            answer: "90"
          - id: l2-c7
            part: add
            type: multiple_choice
            text: "20 + 40 = _"
            say: "Zwanzig plus vierzig."
            options: ["60", "6", "24"]
            answer: "60"
            option_audio: false
          - id: l2-c8
            part: add
            type: true_false
            text: "30 + 70 = 100"
            say: "Stimmt das? Dreißig plus siebzig ist hundert."
            answer: true
          - id: l2-c9
            part: add
            type: multiple_choice
            text: "50 + 20: Welche kleine Aufgabe hilft?"
            say: "Fünfzig plus zwanzig. Welche kleine Aufgabe hilft dir?"
            options: ["5 + 2", "5 − 2", "50 + 2"]
            answer: "5 + 2"
          - id: l2-c10
            part: add
            type: true_false
            text: "10 + 40 = 14"
            say: "Stimmt das? Zehn plus vierzig ist vierzehn."
            answer: false
          - id: l2-c11
            part: subtract
            type: text_input
            text: "70 − 20 = _"
            say: "Siebzig minus zwanzig."
            answer: "50"
          - id: l2-c12
            part: subtract
            type: multiple_choice
            text: "90 − 30 = _"
            say: "Neunzig minus dreißig."
            options: ["60", "6", "87"]
            answer: "60"
            option_audio: false
          - id: l2-c13
            part: subtract
            type: true_false
            text: "100 − 50 = 50"
            say: "Stimmt das? Hundert minus fünfzig ist fünfzig."
            answer: true
          - id: l2-c14
            part: subtract
            type: multiple_choice
            text: "80 − 50: Welche kleine Aufgabe hilft?"
            say: "Achtzig minus fünfzig. Welche kleine Aufgabe hilft dir?"
            options: ["8 − 5", "8 + 5", "80 − 5"]
            answer: "8 − 5"
          - id: l2-c15
            part: subtract
            type: true_false
            text: "60 − 30 = 3"
            say: "Stimmt das? Sechzig minus dreißig ist drei."
            answer: false
          - id: l2-c16
            part: to-100
            type: multiple_choice
            text: "40 + _ = 100"
            say: "Vierzig plus wie viel ist hundert?"
            options: ["60", "6", "70"]
            answer: "60"
            option_audio: false
          - id: l2-c17
            part: to-100
            type: text_input
            text: "80 + _ = 100"
            say: "Achtzig plus wie viel ist hundert?"
            answer: "20"
          - id: l2-c18
            part: to-100
            type: text_input
            text: "10 + _ = 100"
            say: "Zehn plus wie viel ist hundert?"
            answer: "90"
          - id: l2-c19
            part: to-100
            type: true_false
            text: "70 + 20 = 100"
            say: "Stimmt das? Siebzig plus zwanzig ist hundert."
            answer: false
          - id: l2-c20
            part: to-100
            type: multiple_choice
            text: "_ + 60 = 100"
            say: "Wie viel plus sechzig ist hundert?"
            options: ["40", "4", "30"]
            answer: "40"
            option_audio: false
