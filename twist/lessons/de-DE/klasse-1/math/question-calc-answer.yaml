# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.question-calc-answer
skill: math.word-problems.question-calc-answer
curriculum: de-DE
language: de
title:
  de: "Sachaufgaben: Frage, Rechnung, Antwort"
  en: "Word problems: question, calculation, answer"
summary: >
  Word problems to 20 in three steps: the question, the calculation and
  the answer sentence, and telling the facts you need from the ones you
  do not. Lesson 1 finds the question and the calculation, also across
  ten; lesson 2 picks out the facts you need when a story has one too
  many, writes the answer sentence, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.word-problems.picture-stories, math.add-sub-to-20.fluency-to-20]
  also_practises: [math.add-sub-to-20.add-bridge-10, math.add-sub-to-20.sub-bridge-10]
  vocabulary: { de: [Sachaufgabe, Frage, Rechnung, Antwort, Antwortsatz, wichtig, unwichtig] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: question, what: { de: die Frage einer Sachaufgabe finden, en: finding the question in a word problem } }
    - { id: calc, what: { de: die passende Rechnung finden und ausrechnen, en: finding and working out the calculation } }
    - { id: answer, what: { de: den passenden Antwortsatz finden, en: choosing the answer sentence } }
    - { id: facts, what: { de: wichtige von unwichtigen Angaben unterscheiden, en: telling the facts you need from the ones you do not } }
  misconceptions:
    - id: use-every-number
      what: Puts every number of the story into the calculation, also the one that is not needed
      addressed: lesson 2 Learn marks the unneeded fact as unwichtig; a task in each stage of lesson 2 asks which fact is not needed, with feedback in the full stage, and the calculation chips include the unneeded number
    - id: answer-without-question
      what: Writes an answer sentence that does not answer the question asked
      addressed: lesson 2 answer-sentence options repeat words from the question and the wrong ones answer a different question
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Frage und Rechnung, en: Question and calculation }
    goal:
      de: "Find die Frage und die passende Rechnung. Lena hat 8 Sticker und bekommt 5 dazu, das ist 8 + 5."
      en: "Find the question and the sum that fits. Lena has 8 stickers and gets 5 more, that is 8 + 5."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "6 Vögel sitzen auf dem Dach. 2 fliegen weg.\nWelche Aufgabe passt?"
            say: "Sechs Vögel sitzen auf dem Dach. Zwei fliegen weg. Welche Aufgabe passt?"
            show: { object: bird, count: 6, gone: 2 }
            options: ["6 − 2", "6 + 2", "2 + 6"]
            answer: "6 − 2"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "8 + 5 = _"
            say: "Acht plus fünf."
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Frage · Rechnung · Antwort"
            say: "Eine Sachaufgabe löst du in drei Schritten. Zuerst: Wie heißt die Frage? Dann: Welche Rechnung passt? Zum Schluss schreibst du einen Antwortsatz."
          - text: "Lena hat 8 Sticker. Sie bekommt 5 dazu. Wie viele Sticker hat sie jetzt?"
            say: "Lena hat acht Sticker. Sie bekommt fünf dazu. Wie viele Sticker hat sie jetzt? Die Frage steht am Ende: Wie viele Sticker hat sie jetzt?"
          - text: "R: 8 + 5 = 13 | A: Lena hat jetzt 13 Sticker."
            say: "Die Rechnung: acht plus fünf ist dreizehn. Die Antwort: Lena hat jetzt dreizehn Sticker."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Im Bus sitzen 12 Kinder. 5 steigen aus. Wie viele Kinder sitzen noch im Bus?\nWie heißt die Frage?"
                say: "Im Bus sitzen zwölf Kinder. Fünf steigen aus. Wie viele Kinder sitzen noch im Bus? Wie heißt die Frage?"
                show: { object: child, count: 12, gone: 5 }
                options: ["Wie viele Kinder sitzen noch im Bus?", "Wie viele steigen aus?", "Wie viele Kinder steigen ein?"]
                answer: "Wie viele Kinder sitzen noch im Bus?"
                feedback:
                  "Wie viele steigen aus?": "Das weißt du schon: fünf. Gefragt ist, wie viele noch im Bus sitzen."
                  "Wie viele Kinder steigen ein?": "In der Geschichte steigt niemand ein. Hör noch einmal auf das Ende."
                hints:
                  - "Die Frage will etwas wissen, das du noch nicht weißt."
                  - "Die Frage kommt am Ende der Geschichte."
                  - "Wie viele Kinder sitzen noch im Bus?"
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Im Bus sitzen 12 Kinder. 5 steigen aus. Wie viele Kinder sitzen noch im Bus?\nSchreib die Rechnung."
                say: "Im Bus sitzen zwölf Kinder. Fünf steigen aus. Wie viele Kinder sitzen noch im Bus? Schreib die Rechnung."
                show: { object: child, count: 12, gone: 5 }
                frame: "_ _ _ = _"
                options: ["12", "5", "7", "17", "+", "−"]
                answer: ["12", "−", "5", "7"]
                hints:
                  - "Werden es mehr oder weniger Kinder?"
                  - "Weniger: zwölf minus fünf."
                  - "12 − 5 = 7."
              - id: l1-f3
                type: text_input
                text: "Auf dem Teller liegen 9 Erdbeeren. Mama legt 6 dazu. Wie viele Erdbeeren liegen jetzt auf dem Teller?"
                say: "Auf dem Teller liegen neun Erdbeeren. Mama legt sechs dazu. Wie viele Erdbeeren liegen jetzt auf dem Teller?"
                show: { object: strawberry, groups: [9, 6] }
                answer: "15"
                hints:
                  - "Werden es mehr oder weniger?"
                  - "Neun plus sechs."
                  - "15."
              - id: l1-f4
                type: multiple_choice
                text: "Tom hat 14 Murmeln. Er verliert 6. Wie viele Murmeln hat er noch?\nWelche Rechnung passt?"
                say: "Tom hat vierzehn Murmeln. Er verliert sechs. Wie viele Murmeln hat er noch? Welche Rechnung passt?"
                show: { object: marble, count: 14, gone: 6 }
                options: ["14 − 6", "14 + 6", "6 + 14"]
                answer: "14 − 6"
                hints:
                  - "Verlieren heißt: Es werden weniger."
                  - "Vierzehn, dann sechs weg."
                  - "14 − 6."
              - id: l1-f5
                type: text_input
                text: "Tom hat 14 Murmeln. Er verliert 6. Wie viele Murmeln hat er noch?"
                say: "Tom hat vierzehn Murmeln. Er verliert sechs. Wie viele Murmeln hat er noch?"
                show: { object: marble, count: 14, gone: 6 }
                answer: "8"
                hints:
                  - "Erst vier weg bis zehn."
                  - "Dann noch zwei."
                  - "8."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Am Teich sind 7 Enten. 6 kommen dazu. Wie viele Enten sind jetzt am Teich?\nWie heißt die Frage?"
                say: "Am Teich sind sieben Enten. Sechs kommen dazu. Wie viele Enten sind jetzt am Teich? Wie heißt die Frage?"
                show: { object: duck, groups: [7, 6] }
                options: ["Wie viele Enten sind jetzt am Teich?", "Wie viele kommen dazu?", "Wo sind die Enten?"]
                answer: "Wie viele Enten sind jetzt am Teich?"
                hints: ["Was weißt du noch nicht?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Am Teich sind 7 Enten. 6 kommen dazu. Wie viele Enten sind jetzt am Teich?\nSchreib die Rechnung."
                say: "Am Teich sind sieben Enten. Sechs kommen dazu. Wie viele Enten sind jetzt am Teich? Schreib die Rechnung."
                show: { object: duck, groups: [7, 6] }
                frame: "7 _ _ = _"
                options: ["7", "6", "13", "1", "+", "−"]
                answer: ["+", "6", "13"]
                hints: ["Mehr oder weniger?"]
              - id: l1-s3
                type: text_input
                text: "Im Korb sind 16 Äpfel. Oma nimmt 7 heraus. Wie viele Äpfel sind noch im Korb?"
                say: "Im Korb sind sechzehn Äpfel. Oma nimmt sieben heraus. Wie viele Äpfel sind noch im Korb?"
                show: { object: apple, count: 16, gone: 7 }
                answer: "9"
                hints: ["Erst bis zur Zehn zurück."]
              - id: l1-s4
                type: multiple_choice
                text: "Ben hat 8 Muscheln. Er bekommt noch 7 Muscheln. Wie viele Muscheln hat er jetzt?\nWelche Rechnung passt?"
                say: "Ben hat acht Muscheln. Er bekommt noch sieben Muscheln. Wie viele Muscheln hat er jetzt? Welche Rechnung passt?"
                show: { object: shell, groups: [8, 7] }
                options: ["8 + 7", "8 − 7", "7 + 7"]
                answer: "8 + 7"
                hints: ["Bekommen: mehr oder weniger?"]
              - id: l1-s5
                type: text_input
                text: "Ben hat 8 Muscheln. Er bekommt noch 7 Muscheln. Wie viele Muscheln hat er jetzt?"
                say: "Ben hat acht Muscheln. Er bekommt noch sieben Muscheln. Wie viele Muscheln hat er jetzt?"
                show: { object: shell, groups: [8, 7] }
                answer: "15"
                hints: ["Acht plus zwei ist zehn."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "In der Klasse sind 18 Kinder. 9 gehen zum Turnen. Wie viele bleiben in der Klasse?\nWie heißt die Frage?"
                say: "In der Klasse sind achtzehn Kinder. Neun gehen zum Turnen. Wie viele bleiben in der Klasse? Wie heißt die Frage?"
                show: { object: child, count: 18, gone: 9 }
                options: ["Wie viele bleiben in der Klasse?", "Wie viele gehen zum Turnen?", "Wann ist Turnen?"]
                answer: "Wie viele bleiben in der Klasse?"
              - id: l1-n2
                type: fill_in_blank
                text: "In der Klasse sind 18 Kinder. 9 gehen zum Turnen. Wie viele bleiben in der Klasse?\nSchreib die Rechnung."
                say: "In der Klasse sind achtzehn Kinder. Neun gehen zum Turnen. Wie viele bleiben in der Klasse? Schreib die Rechnung."
                show: { object: child, count: 18, gone: 9 }
                frame: "_ _ _ = _"
                options: ["18", "9", "27", "8", "+", "−"]
                answer: ["18", "−", "9", "9"]
              - id: l1-n3
                type: text_input
                text: "Mia hat 5 Stifte. Sie kauft 9 dazu. Wie viele Stifte hat sie jetzt?"
                say: "Mia hat fünf Stifte. Sie kauft neun dazu. Wie viele Stifte hat sie jetzt?"
                show: { object: pencil, groups: [5, 9] }
                answer: "14"
              - id: l1-n4
                type: multiple_choice
                text: "Auf dem Parkplatz stehen 11 Autos. 4 fahren weg. Wie viele Autos stehen noch da?\nWelche Rechnung passt?"
                say: "Auf dem Parkplatz stehen elf Autos. Vier fahren weg. Wie viele Autos stehen noch da? Welche Rechnung passt?"
                show: { object: car, count: 11, gone: 4 }
                options: ["11 − 4", "11 + 4", "4 + 11"]
                answer: "11 − 4"
              - id: l1-n5
                type: text_input
                text: "Auf dem Parkplatz stehen 11 Autos. 4 fahren weg. Wie viele Autos stehen noch da?"
                say: "Auf dem Parkplatz stehen elf Autos. Vier fahren weg. Wie viele Autos stehen noch da?"
                show: { object: car, count: 11, gone: 4 }
                answer: "7"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Auf dem Teller liegen 13 Erdbeeren. Lisa isst 5. Wie viele Erdbeeren liegen noch auf dem Teller?\nWelche Rechnung passt?"
            say: "Auf dem Teller liegen dreizehn Erdbeeren. Lisa isst fünf. Wie viele Erdbeeren liegen noch auf dem Teller? Welche Rechnung passt?"
            show: { object: strawberry, count: 13, gone: 5 }
            options: ["13 − 5", "13 + 5", "5 + 13"]
            answer: "13 − 5"
          - id: l1-c2
            type: text_input
            text: "Auf dem Teller liegen 13 Erdbeeren. Lisa isst 5. Wie viele Erdbeeren liegen noch auf dem Teller?"
            say: "Auf dem Teller liegen dreizehn Erdbeeren. Lisa isst fünf. Wie viele Erdbeeren liegen noch auf dem Teller?"
            show: { object: strawberry, count: 13, gone: 5 }
            answer: "8"
          - id: l1-c3
            type: multiple_choice
            text: "Paul hat 6 Autos. Er bekommt 8 dazu. Wie viele Autos hat er jetzt?\nWie heißt die Frage?"
            say: "Paul hat sechs Autos. Er bekommt acht dazu. Wie viele Autos hat er jetzt? Wie heißt die Frage?"
            show: { object: car, groups: [6, 8] }
            options: ["Wie viele Autos hat er jetzt?", "Wie viele bekommt er?", "Wer hat die Autos?"]
            answer: "Wie viele Autos hat er jetzt?"
          - id: l1-c4
            type: fill_in_blank
            text: "Im Teich schwimmen 9 Fische. 8 kommen dazu. Wie viele Fische schwimmen jetzt im Teich?\nSchreib die Rechnung."
            say: "Im Teich schwimmen neun Fische. Acht kommen dazu. Wie viele Fische schwimmen jetzt im Teich? Schreib die Rechnung."
            show: { object: fish, groups: [9, 8] }
            frame: "_ _ _ = _"
            options: ["9", "8", "17", "1", "+", "−"]
            answer: ["9", "+", "8", "17"]
          - id: l1-c5
            type: text_input
            text: "Auf der Wiese sind 15 Schafe. 7 laufen in den Stall. Wie viele Schafe sind noch auf der Wiese?"
            say: "Auf der Wiese sind fünfzehn Schafe. Sieben laufen in den Stall. Wie viele Schafe sind noch auf der Wiese?"
            show: { object: sheep, count: 15, gone: 7 }
            answer: "8"
          - id: l1-c6
            type: multiple_choice
            text: "Ida hat 4 Teddys. Sie bekommt 9 dazu. Wie viele Teddys hat sie jetzt?\nWelche Rechnung passt?"
            say: "Ida hat vier Teddys. Sie bekommt neun dazu. Wie viele Teddys hat sie jetzt? Welche Rechnung passt?"
            show: { object: teddy, groups: [4, 9] }
            options: ["4 + 9", "9 − 4", "9 + 9"]
            answer: "4 + 9"

  - n: 2
    title: { de: "Wichtig oder unwichtig?", en: "What do you need?" }
    goal:
      de: "Such dir nur die Zahlen heraus, die du brauchst. Wie alt Tim ist, hilft dir bei seinen Bällen nicht."
      en: "Pick out only the numbers you need. How old Tim is does not help you count his balls."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Im Zoo gibt es 7 Affen. 5 neue kommen dazu. Wie viele Affen sind es jetzt?"
            say: "Im Zoo gibt es sieben Affen. Fünf neue kommen dazu. Wie viele Affen sind es jetzt?"
            show: { object: monkey, groups: [7, 5] }
            answer: "12"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ella hat 15 Stifte. Sie verschenkt 6. Wie viele hat sie noch?\nWelche Rechnung passt?"
            say: "Ella hat fünfzehn Stifte. Sie verschenkt sechs. Wie viele hat sie noch? Welche Rechnung passt?"
            show: { object: pencil, count: 15, gone: 6 }
            options: ["15 − 6", "15 + 6", "6 + 15"]
            answer: "15 − 6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tim ist 7 Jahre alt. Er hat 12 Bälle. Er verschenkt 4. Wie viele Bälle hat er noch?"
            say: "Tim ist sieben Jahre alt. Er hat zwölf Bälle. Er verschenkt vier. Wie viele Bälle hat er noch? Hier stehen drei Zahlen, aber du brauchst nur zwei."
          - text: "7 Jahre: unwichtig | 12 − 4 = 8"
            say: "Wie alt Tim ist, hilft bei der Frage nicht. Das ist unwichtig. Wichtig sind die Bälle: zwölf minus vier ist acht."
          - text: "A: Tim hat noch 8 Bälle."
            say: "Der Antwortsatz nimmt die Wörter der Frage auf: Wie viele Bälle hat er noch? Tim hat noch acht Bälle."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lea wohnt im dritten Stock. Sie hat 9 Bücher. Sie leiht sich 5 dazu. Wie viele Bücher hat sie jetzt?\nWelche Angabe brauchst du nicht?"
                say: "Lea wohnt im dritten Stock. Sie hat neun Bücher. Sie leiht sich fünf dazu. Wie viele Bücher hat sie jetzt? Welche Angabe brauchst du nicht?"
                show: { object: book, groups: [9, 5] }
                options: ["Lea wohnt im dritten Stock.", "Sie hat 9 Bücher.", "Sie leiht sich 5 dazu."]
                answer: "Lea wohnt im dritten Stock."
                feedback:
                  "Sie hat 9 Bücher.": "Die neun Bücher brauchst du: Mit ihnen fängt die Rechnung an."
                hints:
                  - "Lies die Frage: Es geht um Bücher."
                  - "Hat der Stock etwas mit den Büchern zu tun?"
                  - "Der dritte Stock ist unwichtig."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Lea wohnt im dritten Stock. Sie hat 9 Bücher. Sie leiht sich 5 dazu. Wie viele Bücher hat sie jetzt?\nSchreib die Rechnung."
                say: "Lea wohnt im dritten Stock. Sie hat neun Bücher. Sie leiht sich fünf dazu. Wie viele Bücher hat sie jetzt? Schreib die Rechnung."
                show: { object: book, groups: [9, 5] }
                frame: "9 _ _ = _"
                options: ["9", "5", "3", "14", "+", "−"]
                answer: ["+", "5", "14"]
                hints:
                  - "Nimm nur die wichtigen Zahlen."
                  - "Neun Bücher und fünf dazu."
                  - "9 + 5 = 14."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Bücher hat Lea jetzt?\nWelcher Antwortsatz passt?"
                say: "Wie viele Bücher hat Lea jetzt? Welcher Antwortsatz passt?"
                options: ["Lea hat jetzt 14 Bücher.", "Lea wohnt im 3. Stock.", "Lea leiht sich 5 Bücher."]
                answer: "Lea hat jetzt 14 Bücher."
                hints:
                  - "Der Antwortsatz beantwortet die Frage."
                  - "Gefragt ist, wie viele Bücher sie jetzt hat."
                  - "Lea hat jetzt 14 Bücher."
              - id: l2-f4
                type: multiple_choice
                text: "Am Kiosk gibt es 16 Croissants. Der Kiosk öffnet um 8 Uhr. 7 Croissants werden verkauft. Wie viele Croissants sind noch da?\nWelche Angabe brauchst du nicht?"
                say: "Am Kiosk gibt es sechzehn Croissants. Der Kiosk öffnet um acht Uhr. Sieben Croissants werden verkauft. Wie viele Croissants sind noch da? Welche Angabe brauchst du nicht?"
                show: { object: croissant, count: 16, gone: 7 }
                options: ["Der Kiosk öffnet um 8 Uhr.", "Es gibt 16 Croissants.", "7 Croissants werden verkauft."]
                answer: "Der Kiosk öffnet um 8 Uhr."
                hints:
                  - "Die Frage ist: Wie viele Croissants sind noch da?"
                  - "Hat die Uhrzeit etwas mit den Croissants zu tun?"
                  - "Die Uhrzeit ist unwichtig."
              - id: l2-f5
                type: text_input
                text: "Am Kiosk gibt es 16 Croissants. 7 Croissants werden verkauft. Wie viele Croissants sind noch da?"
                say: "Am Kiosk gibt es sechzehn Croissants. Sieben Croissants werden verkauft. Wie viele Croissants sind noch da?"
                show: { object: croissant, count: 16, gone: 7 }
                answer: "9"
                hints:
                  - "Werden es mehr oder weniger? Sechzehn minus sieben."
                  - "Erst sechs weg bis zehn, dann noch eins."
                  - "9."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Opa ist 70 Jahre alt. Er pflanzt 8 Blumen und dann noch 6. Wie viele Blumen pflanzt er?\nWelche Angabe brauchst du nicht?"
                say: "Opa ist siebzig Jahre alt. Er pflanzt acht Blumen und dann noch sechs. Wie viele Blumen pflanzt er? Welche Angabe brauchst du nicht?"
                show: { object: flower, groups: [8, 6] }
                options: ["Opa ist 70 Jahre alt.", "Er pflanzt 8 Blumen.", "Dann pflanzt er noch 6."]
                answer: "Opa ist 70 Jahre alt."
                hints: ["Worum geht es in der Frage?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Opa ist 70 Jahre alt. Er pflanzt 8 Blumen und dann noch 6. Wie viele Blumen pflanzt er?\nSchreib die Rechnung."
                say: "Opa ist siebzig Jahre alt. Er pflanzt acht Blumen und dann noch sechs. Wie viele Blumen pflanzt er? Schreib die Rechnung."
                show: { object: flower, groups: [8, 6] }
                frame: "8 _ _ = _"
                options: ["8", "6", "70", "14", "+", "−"]
                answer: ["+", "6", "14"]
                hints: ["Nur die Blumen zählen."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Blumen pflanzt Opa?\nWelcher Antwortsatz passt?"
                say: "Wie viele Blumen pflanzt Opa? Welcher Antwortsatz passt?"
                options: ["Opa pflanzt 14 Blumen.", "Opa ist 70 Jahre alt.", "Opa pflanzt 6 Blumen."]
                answer: "Opa pflanzt 14 Blumen."
                hints: ["Welcher Satz beantwortet die Frage?"]
              - id: l2-s4
                type: multiple_choice
                text: "Im Regal stehen 13 Bücher. Das Regal ist blau. 4 Bücher werden ausgeliehen. Wie viele Bücher stehen noch im Regal?\nWelche Angabe brauchst du nicht?"
                say: "Im Regal stehen dreizehn Bücher. Das Regal ist blau. Vier Bücher werden ausgeliehen. Wie viele Bücher stehen noch im Regal? Welche Angabe brauchst du nicht?"
                show: { object: book, count: 13, gone: 4 }
                options: ["Das Regal ist blau.", "Es stehen 13 Bücher im Regal.", "4 Bücher werden ausgeliehen."]
                answer: "Das Regal ist blau."
                hints: ["Hilft die Farbe bei der Frage?"]
              - id: l2-s5
                type: text_input
                text: "Im Regal stehen 13 Bücher. 4 werden ausgeliehen. Wie viele Bücher stehen noch im Regal?"
                say: "Im Regal stehen dreizehn Bücher. Vier werden ausgeliehen. Wie viele Bücher stehen noch im Regal?"
                show: { object: book, count: 13, gone: 4 }
                answer: "9"
                hints: ["Erst drei weg bis zehn."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Sara hat 2 Brüder. Sie hat 11 Steine. Am Strand findet sie noch 6. Wie viele Steine hat sie jetzt?\nWelche Angabe brauchst du nicht?"
                say: "Sara hat zwei Brüder. Sie hat elf Steine. Am Strand findet sie noch sechs. Wie viele Steine hat sie jetzt? Welche Angabe brauchst du nicht?"
                show: { object: stone, groups: [11, 6] }
                options: ["Sara hat 2 Brüder.", "Sie hat 11 Steine.", "Sie findet noch 6."]
                answer: "Sara hat 2 Brüder."
              - id: l2-n2
