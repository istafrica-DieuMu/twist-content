# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.money-to-20
skill: math.money.amounts-to-20
curriculum: de-DE
language: de
title:
  de: Geld zählen bis 20 €
  en: Counting money to 20
summary: >
  Lesson 1 counts amounts up to 20 € laid out in notes and coins,
  starting with the note worth the most and counting on (10 € + 5 € +
  2 € is 17 €), and counts value, not pieces; lesson 2 lays an amount
  (14 € = 10 € + 2 € + 2 €), finds that one amount can be laid in more
  than one way, compares who has more money, and ends with the skill
  check. Dragging real coins onto a tray waits for a drag-and-drop task.
metadata:
  year: klasse-1
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.money.coins-notes, math.add-sub-to-20.add-bridge-10]
  also_practises: [math.add-sub-to-20.add-bridge-10, math.money.coins-notes]
  vocabulary: { de: [Geld, Betrag, legen, zusammen, mehr Geld, Schein, Münze] }
  forms: [text, audio, drawn]
  drawn: [coins]
  facets: [currency]
  parts:
    - { id: count, what: { de: Geld bis 20 € zählen, en: counting money to 20 } }
    - { id: make, what: { de: einen Betrag bis 20 € legen, en: making an amount to 20 } }
    - { id: ways, what: { de: einen Betrag auf verschiedene Arten legen, en: making one amount in different ways } }
    - { id: compare, what: { de: "vergleichen, wer mehr Geld hat", en: "comparing who has more money" } }
  misconceptions:
    - id: counts-pieces
      what: Counts the coins and notes instead of their value (four 2-Euro-Münzen are 4 €)
      addressed: lesson 1 Learn counts three 2-Euro-Münzen as 6 €; l1-f2 (with feedback), l1-s2, l1-n2 and l2-c5 offer the number of pieces as an answer; l2-f4 (with feedback), l2-n4 and l2-c4 give more pieces to the child with less money
    - id: one-way-only
      what: Thinks an amount can be laid in only one way
      addressed: lesson 2 Learn lays 10 € as one note and as two 5-Euro-Scheine; l2-f3 asks whether three 5-Euro-Scheine are also 15 €
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Wie viel Geld ist das?", en: "How much money is it?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "8 + 5 = _"
            say: "Acht plus fünf."
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Wo ist der 10-Euro-Schein?"
            say: "Wo ist der Zehn-Euro-Schein?"
            options:
              - { drawn: coins, values: [1000] }
              - { drawn: coins, values: [100] }
              - { drawn: coins, values: [500] }
            answer: "1000"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5 € + 2 € + 1 € = 8 €"
            say: "Wie viel Geld ist das? Fang mit dem Schein an: fünf Euro. Zwei Euro dazu: sieben. Noch ein Euro: acht Euro."
            show: { drawn: coins, values: [500, 200, 100] }
          - text: "10 € + 5 € + 2 € + 2 € = 19 €"
            say: "Nimm zuerst das, was am meisten wert ist: zehn. Fünf dazu: fünfzehn. Zwei dazu: siebzehn. Noch zwei: neunzehn Euro."
            show: { drawn: coins, values: [1000, 500, 200, 200] }
          - text: "3 Münzen, aber 6 €"
            say: "Hier sind drei Münzen. Das sind aber nicht drei Euro. Jede Münze ist zwei Euro wert: zwei, vier, sechs. Das sind sechs Euro. Zähl immer den Wert."
            show: { drawn: coins, values: [200, 200, 200] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [500, 100] }
                answer: "6"
                hints:
                  - "Fang mit dem Schein an."
                  - "Fünf und eins."
                  - "6 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [200, 200, 200, 200] }
                options: ["8 €", "4 €", "6 €"]
                answer: "8 €"
                feedback:
                  "4 €": "Das sind vier Münzen. Aber jede ist 2 € wert: 2, 4, 6, 8."
                hints:
                  - "Jede Münze ist 2 € wert."
                  - "Zähl in Zweierschritten: 2, 4, ..."
                  - "8 €."
              - id: l1-f3
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [1000, 500] }
                answer: "15"
                hints:
                  - "Lies die Zahlen auf den Scheinen."
                  - "Zehn und fünf."
                  - "15 €."
              - id: l1-f4
                type: true_false
                text: "Das sind 13 €."
                say: "Stimmt das? Das sind dreizehn Euro."
                show: { drawn: coins, values: [1000, 200, 100] }
                answer: true
                hints:
                  - "Fang mit dem Schein an und zähl weiter."
                  - "Zehn, zwei dazu ist zwölf, eins dazu ist ..."
                  - "Ja, 10 € + 2 € + 1 € sind 13 €."
              - id: l1-f5
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [1000, 500, 200, 100, 100] }
                answer: "19"
                hints:
                  - "Zuerst die Scheine, dann die Münzen."
                  - "Zehn, fünfzehn, siebzehn, achtzehn, ..."
                  - "19 €."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [500, 200] }
                answer: "7"
                hints: ["Fünf und zwei."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [500, 500, 500] }
                options: ["15 €", "3 €", "10 €"]
                answer: "15 €"
                hints: ["Jeder Schein ist 5 € wert. Zähl in Fünferschritten."]
              - id: l1-s3
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [1000, 1000] }
                answer: "20"
                hints: ["Zehn und noch mal zehn."]
              - id: l1-s4
                type: true_false
                text: "Das sind 3 €."
                say: "Stimmt das? Das sind drei Euro."
                show: { drawn: coins, values: [500, 500, 200] }
                answer: false
                hints: ["Zähl nicht die Scheine und Münzen, sondern ihren Wert."]
              - id: l1-s5
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [1000, 200, 200, 100] }
                answer: "15"
                hints: ["Zehn, zwölf, vierzehn, ..."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [1000, 100] }
                answer: "11"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viel Geld ist das?"
                say: "Wie viel Geld ist das?"
                show: { drawn: coins, values: [200, 200, 200, 200, 200] }
                options: ["10 €", "5 €", "7 €"]
                answer: "10 €"
              - id: l1-n3
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [500, 200, 200, 100] }
                answer: "10"
              - id: l1-n4
                type: true_false
                text: "Das sind 19 €."
                say: "Stimmt das? Das sind neunzehn Euro."
                show: { drawn: coins, values: [1000, 500, 200, 200] }
                answer: true
              - id: l1-n5
                type: text_input
                text: "Wie viel Euro sind das?"
                say: "Wie viel Euro sind das?"
                show: { drawn: coins, values: [1000, 500, 100, 100, 100] }
                answer: "18"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "Wie viel Euro sind das?"
            say: "Zähl das Geld. Wie viel Euro sind das?"
            show: { drawn: coins, values: [1000, 200] }
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viel Geld ist das?"
            say: "Zähl das Geld. Wie viel ist das?"
            show: { drawn: coins, values: [500, 500] }
            options: ["10 €", "2 €", "5 €"]
            answer: "10 €"
          - id: l1-c3
            type: text_input
            text: "Wie viel Euro sind das?"
            say: "Zähl das Geld. Wie viel Euro sind das?"
            show: { drawn: coins, values: [500, 200, 100, 100] }
            answer: "9"
          - id: l1-c4
            type: true_false
            text: "Das sind 16 €."
            say: "Stimmt das? Das sind sechzehn Euro."
            show: { drawn: coins, values: [1000, 500, 100] }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Wie viel Geld ist das?"
            say: "Zähl das Geld. Wie viel ist das?"
            show: { drawn: coins, values: [200, 200, 200, 200, 200, 200] }
            options: ["12 €", "6 €", "10 €"]
            answer: "12 €"
          - id: l1-c6
            type: text_input
            text: "Wie viel Euro sind das?"
            say: "Zähl das Geld. Wie viel Euro sind das?"
            show: { drawn: coins, values: [1000, 500, 200, 200, 100] }
            answer: "20"

  - n: 2
    title: { de: "Geld legen", en: "Making amounts" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Wie viel Euro sind das?"
            say: "Wie viel Euro sind das?"
            show: { drawn: coins, values: [500, 200, 200] }
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "10 + 7 = _"
            say: "Zehn plus sieben."
            answer: "17"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "14 € = 10 € + 2 € + 2 €"
            say: "Lea will vierzehn Euro legen. Sie nimmt zuerst den Zehn-Euro-Schein. Dann fehlen noch vier Euro. Die legt sie mit zwei Zwei-Euro-Münzen."
            show: { drawn: coins, values: [1000, 200, 200] }
          - text: "10 € = 5 € + 5 €"
            say: "Zehn Euro kannst du auch anders legen: mit zwei Fünf-Euro-Scheinen. Oft gibt es mehrere Wege."
            show: { drawn: coins, values: [500, 500] }
          - text: "Tim: 10 € + 5 € = 15 €\nMia: 5 € + 5 € + 2 € = 12 €"
            say: "Tim hat einen Zehner und einen Fünfer, das sind fünfzehn Euro. Mia hat mehr Scheine und Münzen, aber nur zwölf Euro. Tim hat mehr Geld."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wo sind 12 €?"
                say: "Ole braucht zwölf Euro. Wo sind zwölf Euro?"
                options:
                  - { drawn: coins, values: [1000, 200] }
                  - { drawn: coins, values: [1000, 100] }
                  - { drawn: coins, values: [500, 200] }
                answer: "1200"
                hints:
                  - "Zähl bei jedem Bild das Geld."
                  - "Zehn und zwei sind zwölf."
                  - "Der 10-Euro-Schein und die 2-Euro-Münze."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Fünfzehn Euro sind zehn Euro und wie viel noch?"
                frame: "15 € = 10 € + _"
                options: ["5 €", "2 €", "1 €"]
                answer: ["5 €"]
                hints:
                  - "Von zehn bis fünfzehn: Wie viel fehlt?"
                  - "Zehn plus wie viel ist fünfzehn?"
                  - "5 €."
              - id: l2-f3
                type: true_false
                text: "Das sind auch 15 €."
                say: "Ben legt fünfzehn Euro nur mit Fünf-Euro-Scheinen. Stimmt das: Das sind auch fünfzehn Euro?"
                show: { drawn: coins, values: [500, 500, 500] }
                answer: true
                hints:
                  - "Zähl in Fünferschritten."
                  - "Fünf, zehn, ..."
                  - "Ja, 5 € + 5 € + 5 € sind 15 €."
              - id: l2-f4
                type: multiple_choice
                text: "Tom hat 10 € + 2 €.\nIda hat 5 € + 2 € + 2 € + 2 €.\nWer hat mehr Geld?"
                say: "Tom hat einen Zehn-Euro-Schein und eine Zwei-Euro-Münze. Ida hat einen Fünf-Euro-Schein und drei Zwei-Euro-Münzen. Wer hat mehr Geld?"
                options: ["Tom", "Ida"]
                answer: "Tom"
                feedback:
                  "Ida": "Ida hat mehr Scheine und Münzen. Aber zähl den Wert: Ida hat 11 €, Tom hat 12 €."
                hints:
                  - "Rechne für jedes Kind aus, wie viel Geld es hat."
                  - "Tom: 10 und 2. Ida: 5, 7, 9, 11."
                  - "Tom hat 12 €, Ida hat 11 €. Tom hat mehr."
              - id: l2-f5
                type: multiple_choice
                text: "Wie legst du 9 €?"
                say: "Paula will neun Euro legen. Wie geht das?"
                options: ["5 € + 2 € + 2 €", "5 € + 2 € + 1 €", "5 € + 5 €"]
                answer: "5 € + 2 € + 2 €"
                hints:
                  - "Rechne jede Reihe aus."
                  - "Fünf, sieben, neun."
                  - "5 € + 2 € + 2 €."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wo sind 16 €?"
                say: "Ein Spiel kostet sechzehn Euro. Wo sind sechzehn Euro?"
                options:
                  - { drawn: coins, values: [1000, 500, 100] }
                  - { drawn: coins, values: [1000, 500] }
                  - { drawn: coins, values: [500, 500, 200] }
                answer: "1600"
                hints: ["Zähl bei jedem Bild weiter: zuerst der Schein mit dem höchsten Wert."]
              - id: l2-s2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Siebzehn Euro sind zehn Euro und fünf Euro und wie viel noch?"
                frame: "17 € = 10 € + 5 € + _"
                options: ["2 €", "1 €", "5 €"]
                answer: ["2 €"]
                hints: ["Zehn und fünf sind fünfzehn. Bis siebzehn fehlen ..."]
              - id: l2-s3
                type: true_false
                text: "Das sind 20 €."
                say: "Mia will zwanzig Euro legen. Stimmt das: Das sind zwanzig Euro?"
                show: { drawn: coins, values: [1000, 200, 200, 200, 200] }
                answer: false
                hints: ["Zehn, dann in Zweierschritten weiter."]
              - id: l2-s4
                type: multiple_choice
                text: "Lisa hat 5 € + 5 € + 5 €.\nPaul hat 20 €.\nWer hat mehr Geld?"
                say: "Lisa hat drei Fünf-Euro-Scheine. Paul hat einen Zwanzig-Euro-Schein. Wer hat mehr Geld?"
                options: ["Lisa", "Paul"]
                answer: "Paul"
                hints: ["Lisa hat drei Scheine. Wie viel Euro sind das?"]
              - id: l2-s5
                type: multiple_choice
                text: "Wie legst du 13 €?"
                say: "Emil will dreizehn Euro legen. Wie geht das?"
                options: ["10 € + 2 € + 1 €", "10 € + 2 € + 2 €", "5 € + 5 € + 2 €"]
                answer: "10 € + 2 € + 1 €"
                hints: ["Rechne jede Reihe aus."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wo sind 11 €?"
                say: "Wo sind elf Euro?"
                options:
                  - { drawn: coins, values: [1000, 100] }
                  - { drawn: coins, values: [500, 500] }
                  - { drawn: coins, values: [1000, 200] }
                answer: "1100"
              - id: l2-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Zwanzig Euro sind zehn Euro und wie viel noch?"
                frame: "20 € = 10 € + _"
                options: ["10 €", "5 €", "2 €"]
                answer: ["10 €"]
              - id: l2-n3
                type: true_false
                text: "Das sind 10 €."
                say: "Can legt zehn Euro so. Stimmt das: Das sind zehn Euro?"
                show: { drawn: coins, values: [500, 200, 200, 100] }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Emil hat 10 € + 5 € + 2 €.\nNora hat 5 € + 5 € + 2 € + 2 € + 2 €.\nWer hat mehr Geld?"
                say: "Emil hat zehn Euro, fünf Euro und zwei Euro. Nora hat zweimal fünf Euro und dreimal zwei Euro. Wer hat mehr Geld?"
                options: ["Emil", "Nora"]
                answer: "Emil"
              - id: l2-n5
                type: multiple_choice
                text: "Wie legst du 19 €?"
                say: "Wie legst du neunzehn Euro?"
                options: ["10 € + 5 € + 2 € + 2 €", "10 € + 5 € + 2 € + 1 €", "10 € + 5 € + 5 €"]
                answer: "10 € + 5 € + 2 € + 2 €"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count
            type: text_input
            text: "Wie viel Euro sind das?"
            say: "Zähl das Geld. Wie viel Euro sind das?"
            show: { drawn: coins, values: [1000, 500, 200] }
            answer: "17"
          - id: l2-c2
            part: make
            type: image_multiple_choice
            text: "Wo sind 14 €?"
            say: "Tipp auf das Bild mit vierzehn Euro."
            options:
              - { drawn: coins, values: [1000, 200, 200] }
              - { drawn: coins, values: [500, 500, 200] }
              - { drawn: coins, values: [1000, 500] }
            answer: "1400"
          - id: l2-c3
            part: make
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Sechzehn Euro sind zehn Euro und fünf Euro und wie viel noch?"
            frame: "16 € = 10 € + 5 € + _"
            options: ["1 €", "2 €", "5 €"]
            answer: ["1 €"]
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Jan hat 10 € + 10 €.\nElla hat 5 € + 5 € + 5 € + 2 €.\nWer hat mehr Geld?"
            say: "Jan hat zwei Zehn-Euro-Scheine. Ella hat drei Fünf-Euro-Scheine und eine Zwei-Euro-Münze. Wer hat mehr Geld?"
            options: ["Jan", "Ella"]
            answer: "Jan"
          - id: l2-c5
            part: count
            type: true_false
            text: "Das sind 5 €."
            say: "Stimmt das? Das sind fünf Euro."
            show: { drawn: coins, values: [200, 200, 200, 200, 200] }
            answer: false
          - id: l2-c6
            part: count
            type: text_input
            text: "Wie viel Euro sind das?"
            say: "Zähl das Geld. Wie viel Euro sind das?"
            show: { drawn: coins, values: [1000, 200, 200, 200] }
            answer: "16"
          - id: l2-c7
            part: count
            type: multiple_choice
            text: "Wie viel Geld ist das?"
            say: "Zähl das Geld. Wie viel ist das?"
            show: { drawn: coins, values: [500, 500, 500, 200] }
            options: ["17 €", "4 €", "15 €"]
            answer: "17 €"
          - id: l2-c8
            part: count
            type: true_false
            text: "Das sind 14 €."
            say: "Stimmt das? Das sind vierzehn Euro."
            show: { drawn: coins, values: [1000, 200, 100, 100] }
            answer: true
          - id: l2-c9
            part: make
            type: image_multiple_choice
            text: "Wo sind 18 €?"
            say: "Tipp auf das Bild mit achtzehn Euro."
            options:
              - { drawn: coins, values: [1000, 500, 200] }
              - { drawn: coins, values: [1000, 500, 200, 100] }
              - { drawn: coins, values: [1000, 200, 200, 200] }
            answer: "1800"
          - id: l2-c10
            part: make
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Dreizehn Euro sind zehn Euro und zwei Euro und wie viel noch?"
            frame: "13 € = 10 € + 2 € + _"
            options: ["1 €", "2 €", "5 €"]
            answer: ["1 €"]
          - id: l2-c11
            part: make
            type: multiple_choice
            text: "Wie legst du 12 €?"
            say: "Finn will zwölf Euro legen. Wie geht das?"
            options: ["10 € + 2 €", "10 € + 1 €", "5 € + 5 € + 1 €"]
            answer: "10 € + 2 €"
          - id: l2-c12
            part: ways
            type: true_false
            text: "Jana legt 20 € nur mit 5-Euro-Scheinen. Sind das 20 €?"
            say: "Jana legt zwanzig Euro nur mit Fünf-Euro-Scheinen. Sind das zwanzig Euro?"
            show: { drawn: coins, values: [500, 500, 500, 500] }
            answer: true
          - id: l2-c13
            part: ways
            type: multiple_choice
            text: "Du hast keinen 10-Euro-Schein. Womit kannst du trotzdem 10 € legen?"
            say: "Du hast keinen Zehn-Euro-Schein. Womit kannst du trotzdem zehn Euro legen?"
            options: ["5 € + 2 € + 2 € + 1 €", "5 € + 2 € + 2 €", "2 € + 2 € + 2 €"]
            answer: "5 € + 2 € + 2 € + 1 €"
          - id: l2-c14
            part: ways
            type: true_false
            text: "Max will 6 € nur mit 2-Euro-Münzen legen. Sind das 6 €?"
            say: "Max will sechs Euro nur mit Zwei-Euro-Münzen legen. Sind das sechs Euro?"
            show: { drawn: coins, values: [200, 200] }
            answer: false
          - id: l2-c15
            part: ways
            type: image_multiple_choice
            text: "Wo sind 15 €?"
            say: "Tipp auf das Bild mit fünfzehn Euro."
            options:
              - { drawn: coins, values: [500, 500, 500] }
              - { drawn: coins, values: [500, 500, 200] }
              - { drawn: coins, values: [1000, 200, 200] }
            answer: "1500"
          - id: l2-c16
            part: ways
            type: multiple_choice
            text: "Ali legt 10 € + 2 €.\nEva legt 5 € + 5 € + 2 €.\nBeide wollen 12 € legen. Wer hat 12 € gelegt?"
            say: "Ali und Eva wollen zwölf Euro legen. Ali legt zehn Euro und zwei Euro. Eva legt fünf Euro, fünf Euro und zwei Euro. Wer hat zwölf Euro gelegt?"
            options: ["beide", "nur Ali", "nur Eva"]
            answer: "beide"
            keep_order: true
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Ben hat 10 € + 5 €.\nAnna hat 5 € + 2 € + 2 € + 2 € + 2 €.\nWer hat mehr Geld?"
            say: "Ben hat einen Zehn-Euro-Schein und einen Fünf-Euro-Schein. Anna hat einen Fünf-Euro-Schein und vier Zwei-Euro-Münzen. Wer hat mehr Geld?"
            options: ["Ben", "Anna"]
            answer: "Ben"
          - id: l2-c18
            part: compare
            type: multiple_choice
