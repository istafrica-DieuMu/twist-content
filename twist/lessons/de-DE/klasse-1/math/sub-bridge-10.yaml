# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.sub-bridge-10
skill: math.add-sub-to-20.sub-bridge-10
curriculum: de-DE
language: de
title:
  de: Minus mit Zehnerübergang
  en: Subtracting across ten
summary: >
  Subtracting across ten in two steps: first back to 10, then the rest
  (13 − 5 = 13 − 3 − 2 = 8). Lesson 1 splits the number to take away and
  goes back to ten on the Rechenstrich; lesson 2 writes the steps,
  practises with all sums from 11 to 18, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.add-sub-to-20.add-bridge-10]
  also_practises: [math.numbers-to-20.partition-to-10, math.add-sub-to-20.analog-to-20]
  vocabulary: { de: [Zehnerübergang, bis zur 10 zurück, zerlegen, Rechenstrich] }
  forms: [drawn, text, audio]
  drawn: [equation, rechenstrich]
  facets: []
  parts:
    - { id: split, what: { de: "die Zahl so zerlegen, dass du zuerst bis zur 10 zurückgehst", en: "splitting the number so the first step goes back to 10" } }
    - { id: steps, what: { de: "in zwei Schritten rechnen", en: "working in two steps" } }
    - { id: solve, what: { de: "Minusaufgaben mit Zehnerübergang lösen", en: "answering subtractions across ten" } }
    - { id: check, what: { de: "ein Ergebnis prüfen", en: "checking an answer" } }
  misconceptions:
    - id: wrong-split
      what: Splits the number to take away the wrong way (13 − 5 as 13 − 2 − 3, missing ten)
      addressed: Learn says the first step goes back exactly to 10, as many as the Einer; tasks ask how far it is to 10 before the rest, and the split frames start with that step
    - id: subtract-ones-backwards
      what: Takes the smaller ones from the larger (13 − 5 = 12, because 5 − 3 = 2)
      addressed: multiple-choice sums include that answer as an option, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Erst bis zur 10, en: Back to ten first }
    goal:
      de: "Geh erst zurück bis zur 10, dann nimm den Rest weg. Bei 13 − 5 nimmst du erst 3 weg, dann 2."
      en: "Go back to 10 first, then take away the rest. For 13 − 5 you take away 3 first, then 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "14 − 4 = _"
            say: "Vierzehn minus vier."
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Zerlege die 6."
            say: "Zerlege sechs in zwei und wie viel?"
            frame: "6 = 2 + _"
            options: ["3", "4", "8"]
            answer: ["4"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "13 − 5 = ?"
            say: "Dreizehn minus fünf. Von dreizehn kommst du mit drei zurück genau zur Zehn."
            show: { drawn: equation, text: "13 − 5 = _", split: "5 = 3 + 2" }
          - text: "13 − 3 = 10"
            say: "Also zerlegst du die Fünf in drei und zwei. Erst minus drei: zehn."
            show: { drawn: rechenstrich, start: 13, jumps: [-3] }
          - text: "10 − 2 = 8"
            say: "Dann der Rest: zehn minus zwei ist acht. Dreizehn minus fünf ist acht."
            show: { drawn: rechenstrich, start: 13, jumps: [-3, -2] }
          - text: "Erst bis zur 10, dann den Rest"
            say: "So geht es immer: Geh zuerst zurück bis zur Zehn, so viele wie Einer da sind. Dann nimm den Rest weg."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "12 − 4: Wie viele nimmst du zuerst weg, bis du bei 10 bist?"
                say: "Zwölf minus vier. Wie viele nimmst du zuerst weg, damit du genau bei zehn bist?"
                show: { drawn: rechenstrich, start: 12, jumps: [], back: true }
                options: ["2", "4", "1"]
                answer: "2"
                hints:
                  - "Wie viele Einer hat zwölf?"
                  - "Zwölf minus zwei ist zehn."
                  - "2."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne in zwei Schritten."
                say: "Vierzehn minus sechs. Erst bis zur Zehn, dann den Rest."
                show: { drawn: equation, text: "14 − 6 = _", split: "6 = 4 + 2" }
                frame: "14 − 4 = _ | 10 − 2 = _"
                options: ["10", "8", "12", "6"]
                answer: ["10", "8"]
                hints:
                  - "Der erste Schritt endet genau bei zehn."
                  - "Vierzehn minus vier ist zehn. Dann noch zwei weg."
                  - "10, dann 8."
              - id: l1-f3
                type: multiple_choice
                text: "11 − 8 = ?"
                say: "Elf minus acht."
                show: { drawn: rechenstrich, start: 11, jumps: [-1, -7] }
                options: ["3", "17", "4"]
                answer: "3"
                feedback:
                  "17": "Du hast acht minus eins gerechnet. Du nimmst aber acht von elf weg: erst eins bis zehn, dann noch sieben."
                  "4": "Schau auf die Sprünge: eins und sieben, das sind zusammen acht. Von zehn noch sieben weg."
                hints:
                  - "Schau auf die zwei Sprünge."
                  - "Erst eins zurück bis zehn. Dann noch sieben."
                  - "10 − 7 = ?"
              - id: l1-f4
                type: fill_in_blank
                text: "Zerlege die 7 so, dass du zuerst bei 10 ankommst."
                say: "Fünfzehn minus sieben. Zerlege die Sieben so, dass du zuerst genau bei zehn ankommst."
                frame: "15 − 7 = 15 − _ − _"
                options: ["5", "2", "3", "4"]
                answer: ["5", "2"]
                hints:
                  - "Wie viele sind es von fünfzehn zurück bis zehn?"
                  - "Fünfzehn minus fünf ist zehn. Sieben ist fünf und noch zwei."
                  - "15 − 7 = 15 − 5 − 2"
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 11 − 3 = 8"
                say: "Elf minus drei ist acht. Stimmt das?"
                answer: true
                hints:
                  - "Elf minus eins ist zehn."
                  - "Dann noch zwei weg."
                  - "Ja."
              - id: l1-f6
                type: text_input
                text: "16 − 8 = _"
                say: "Sechzehn minus acht."
                answer: "8"
                hints:
                  - "Erst sechs weg bis zehn."
                  - "Dann noch zwei."
                  - "8."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "17 − 9: Wie viele nimmst du zuerst weg, bis du bei 10 bist?"
                say: "Siebzehn minus neun. Wie viele nimmst du zuerst weg, damit du genau bei zehn bist?"
                show: { drawn: rechenstrich, start: 17, jumps: [], back: true }
                options: ["7", "9", "2"]
                answer: "7"
                hints: ["Wie viele Einer hat die erste Zahl?"]
              - id: l1-s2
                type: fill_in_blank
                text: "12 − 5: Rechne in zwei Schritten."
                say: "Zwölf minus fünf. Erst bis zur Zehn, dann den Rest."
                frame: "12 − 2 = _ | 10 − 3 = _"
                options: ["10", "7", "8", "3"]
                answer: ["10", "7"]
                hints: ["Erst zur Zehn."]
              - id: l1-s3
                type: multiple_choice
                text: "14 − 5 = ?"
                say: "Vierzehn minus fünf."
                options: ["9", "11", "10"]
                answer: "9"
                hints: ["Erst vier zurück bis zehn."]
              - id: l1-s4
                type: fill_in_blank
                text: "Zerlege die 6 so, dass du zuerst bei 10 ankommst."
                say: "Dreizehn minus sechs. Zerlege die Sechs so, dass du zuerst genau bei zehn ankommst."
                frame: "13 − 6 = 13 − _ − _"
                options: ["3", "2", "4", "1"]
                answer: ["3", "3"]
                hints: ["Wie viele sind es von dreizehn zurück bis zehn?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 15 − 6 = 11"
                say: "Fünfzehn minus sechs ist elf. Stimmt das?"
                answer: false
                hints: ["Erst fünf weg bis zehn, dann den Rest."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "16 − 7: Wie viele nimmst du zuerst weg, bis du bei 10 bist?"
                say: "Sechzehn minus sieben. Wie viele nimmst du zuerst weg, damit du genau bei zehn bist?"
                show: { drawn: rechenstrich, start: 16, jumps: [], back: true }
                options: ["6", "7", "1"]
                answer: "6"
              - id: l1-n2
                type: fill_in_blank
                text: "11 − 4: Rechne in zwei Schritten."
                say: "Elf minus vier. Rechne in zwei Schritten."
                frame: "11 − 1 = _ | 10 − 3 = _"
                options: ["10", "7", "9", "3"]
                answer: ["10", "7"]
              - id: l1-n3
                type: text_input
                text: "13 − 4 = _"
                say: "Dreizehn minus vier."
                answer: "9"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 12 − 3 = 9"
                say: "Zwölf minus drei ist neun. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "13 − 7 = _"
                say: "Dreizehn minus sieben."
                answer: "6"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "14 − 7 = _"
            say: "Vierzehn minus sieben."
            answer: "7"
          - id: l1-c2
            type: multiple_choice
            text: "15 − 8: Wie viele nimmst du zuerst weg, bis du bei 10 bist?"
