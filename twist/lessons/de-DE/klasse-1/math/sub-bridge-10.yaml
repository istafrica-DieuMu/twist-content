            options: ["5", "8", "3"]
            answer: "5"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 11 − 2 = 9"
            say: "Elf minus zwei ist neun. Stimmt das?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Zerlege die 4 so, dass du zuerst bei 10 ankommst."
            say: "Zwölf minus vier. Zerlege die Vier so, dass du zuerst genau bei zehn ankommst."
            frame: "12 − 4 = 12 − _ − _"
            options: ["2", "1", "3"]
            answer: ["2", "2"]
          - id: l1-c5
            type: multiple_choice
            text: "17 − 8 = ?"
            say: "Siebzehn minus acht."
            options: ["9", "11", "10"]
            answer: "9"
          - id: l1-c6
            type: fill_in_blank
            text: "15 − 9: Rechne in zwei Schritten."
