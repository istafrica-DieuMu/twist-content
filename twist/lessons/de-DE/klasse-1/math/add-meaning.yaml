# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.add-meaning
skill: math.add-sub-to-20.add-meaning
curriculum: de-DE
language: de
title:
  de: Was bedeutet plus?
  en: What does plus mean?
summary: >
  The first Rechnen lesson: plus is something coming along (Dazukommen)
  or two groups put together (Zusammenlegen). Lesson 1 finds the plus sum
  for a picture or a little story; lesson 2 tells a story for a sum and
  writes the sum with + and =, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { de: [plus, dazu, zusammen, gleich, Aufgabe, Plusaufgabe] }
  forms: [picture, drawn, text, audio]
  drawn: [ten-frame, dots]
  facets: []
  parts:
    - { id: picture, what: { de: die Plusaufgabe zu einem Bild finden, en: finding the addition for a picture } }
    - { id: story, what: { de: die Plusaufgabe zu einer Geschichte finden und lösen, en: finding and solving the addition for a story } }
    - { id: tell, what: { de: die Geschichte zu einer Plusaufgabe finden, en: finding the story for an addition } }
  misconceptions:
    - id: count-all-only
      what: Counts the total but cannot say which sum goes with it
      addressed: tasks ask for the sum, not just the total; Learn names each part
    - id: order-of-story
      what: Writes the parts in the wrong order (2 + 3 for "3 kommen, 2 kommen dazu")
      addressed: lesson 2 Learn says the first number is what was there first, and fill-ins say which colour comes first; the swapped sum is never marked wrong, since both orders give the same total (the Tauschaufgaben skill)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Dazu und zusammen, en: Coming along and putting together }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: ten-frame, filled: 5 }
            options: ["4", "5", "6"]
            answer: "5"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Zerlege die 6."
            say: "Sechs Punkte, rot und blau. Wie viele rote, wie viele blaue?"
            show: { drawn: dots, count: 6, layout: five-structure, colour_split: [4, 2] }
            frame: "6 = _ + _"
            options: ["2", "4", "6"]
            answer: ["4", "2"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3"
            say: "Auf der Wiese spielen drei Kinder."
            show: { drawn: ten-frame, filled: 3 }
          - text: "3 + 2"
            say: "Zwei Kinder kommen dazu. Dazukommen heißt: plus. Drei plus zwei."
            show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }
          - text: "3 + 2 = 5"
            say: "Jetzt sind es fünf Kinder. Drei plus zwei gleich fünf. Auch wenn man zwei Gruppen zusammenlegt, rechnet man plus."
            show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Vier rote Punkte und noch ein blauer dazu. Welche Plusaufgabe passt?"
                show: { drawn: ten-frame, filled: 5, colour_split: [4, 1] }
                options: ["4 + 1", "4 + 4", "5 + 1"]
                answer: "4 + 1"
                hints:
                  - "Zähl zuerst die roten Punkte."
                  - "Vier rote, ein blauer kommt dazu."
                  - "4 + 1."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "2 Äpfel liegen im Korb. 3 Äpfel kommen dazu. Welche Aufgabe passt?"
                show: { object: apple, groups: [2, 3] }
                say: "Zwei Äpfel liegen im Korb. Drei Äpfel kommen dazu. Welche Plusaufgabe passt?"
                options: ["2 + 3", "2 + 2", "3 + 3"]
                answer: "2 + 3"
                hints:
                  - "Wie viele Äpfel waren zuerst da?"
                  - "Zwei. Dann kommen drei dazu."
                  - "2 + 3."
              - id: l1-f3
                type: fill_in_blank
                text: "Schreib die Aufgabe."
                say: "Drei rote Punkte und drei blaue Punkte. Schreib die Plusaufgabe."
                show: { drawn: dots, count: 6, layout: five-structure, colour_split: [3, 3] }
                frame: "_ + _ = _"
                options: ["3", "6", "5"]
                answer: ["3", "3", "6"]
                hints:
                  - "Zähl die roten, dann die blauen."
                  - "Drei und drei."
                  - "3 + 3 = 6."
              - id: l1-f4
                type: true_false
                text: "5 Kinder sitzen im Bus. 2 steigen ein. Passt 5 + 2?"
                say: "Fünf Kinder sitzen im Bus. Zwei steigen ein. Passt fünf plus zwei?"
                show: { object: child, groups: [5, 2] }
                answer: true
                hints:
                  - "Einsteigen heißt dazukommen."
                  - "Fünf und zwei dazu."
                  - "Ja, 5 + 2."
              - id: l1-f5
                type: multiple_choice
                text: "Lena hat 2 Stifte. Ben hat 4 Stifte. Sie legen alle zusammen. Welche Aufgabe passt?"
                say: "Lena hat zwei Stifte. Ben hat vier Stifte. Sie legen alle zusammen. Welche Plusaufgabe passt?"
                show: { object: crayon, groups: [2, 4] }
                options: ["2 + 4", "4 − 2", "2 + 2"]
                answer: "2 + 4"
                hints:
                  - "Zusammenlegen ist auch plus."
                  - "Zwei Stifte und vier Stifte."
                  - "2 + 4."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele sind es zusammen?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["6", "7", "8"]
                answer: "7"
                hints:
                  - "Eine volle Reihe ist fünf."
                  - "Fünf und noch zwei."
                  - "Es sind 7."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Sechs rote Punkte und noch zwei blaue dazu. Welche Plusaufgabe passt?"
                show: { drawn: ten-frame, filled: 8, colour_split: [6, 2] }
                options: ["6 + 2", "6 + 6", "8 + 2"]
                answer: "6 + 2"
                hints: ["Erst die roten, dann die blauen."]
              - id: l1-s2
                type: multiple_choice
                text: "3 Enten schwimmen im Teich. 1 Ente kommt dazu. Welche Aufgabe passt?"
                say: "Drei Enten schwimmen im Teich. Eine Ente kommt dazu. Welche Plusaufgabe passt?"
                show: { object: duck, groups: [3, 1] }
                options: ["3 + 1", "3 + 3", "1 + 1"]
                answer: "3 + 1"
                hints: ["Drei waren zuerst da."]
              - id: l1-s3
                type: fill_in_blank
                text: "Schreib die Aufgabe: erst die roten, dann die blauen."
                say: "Fünf rote Punkte und vier blaue Punkte. Schreib die Plusaufgabe: erst die roten, dann die blauen."
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                frame: "_ + _ = _"
                options: ["4", "5", "9"]
                answer: ["5", "4", "9"]
                hints: ["Rot, dann blau, dann alle."]
              - id: l1-s4
                type: true_false
                text: "Mia hat 3 Murmeln. Sie bekommt 3 dazu. Passt 3 + 1?"
                say: "Mia hat drei Murmeln. Sie bekommt drei dazu. Passt drei plus eins?"
                show: { object: marble, groups: [3, 3] }
                answer: false
                hints: ["Wie viele bekommt sie dazu?"]
              - id: l1-s5
                type: multiple_choice
                text: "Wie viele sind es zusammen?"
                show: { drawn: ten-frame, filled: 6, colour_split: [4, 2] }
                options: ["5", "6", "7"]
                answer: "6"
                hints: ["Zähl alle Punkte."]
              - id: l1-s6
                type: multiple_choice
                text: "4 Kinder bauen eine Burg. 4 Kinder kommen dazu. Welche Aufgabe passt?"
                say: "Vier Kinder bauen eine Burg. Vier Kinder kommen dazu. Welche Plusaufgabe passt?"
                show: { object: child, groups: [4, 4] }
                options: ["4 + 4", "4 + 0", "8 + 4"]
                answer: "4 + 4"
                hints: ["Erst sind vier da. Wie viele kommen dazu?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Zwei rote Punkte und noch fünf blaue dazu. Welche Plusaufgabe passt?"
                show: { drawn: ten-frame, filled: 7, colour_split: [2, 5] }
                options: ["2 + 5", "5 + 5", "7 + 2"]
                answer: "2 + 5"
              - id: l1-n2
                type: fill_in_blank
                text: "Schreib die Aufgabe: erst die roten, dann die blauen."
                say: "Sieben rote Punkte und drei blaue Punkte. Schreib die Plusaufgabe: erst die roten, dann die blauen."
                show: { drawn: ten-frame, filled: 10, colour_split: [7, 3] }
                frame: "_ + _ = _"
                options: ["3", "7", "10"]
                answer: ["7", "3", "10"]
              - id: l1-n3
                type: multiple_choice
                text: "Im Glas sind 6 Murmeln. Mama legt 2 dazu. Welche Aufgabe passt?"
                say: "Im Glas sind sechs Murmeln. Mama legt zwei dazu. Welche Aufgabe passt?"
                show: { object: marble, groups: [6, 2] }
                options: ["6 + 2", "6 − 2", "2 + 2"]
                answer: "6 + 2"
              - id: l1-n4
                type: true_false
                text: "Tom hat 1 Ball. Lisa hat 2 Bälle. Passt 1 + 2?"
                say: "Tom hat einen Ball. Lisa hat zwei Bälle. Passt eins plus zwei?"
                show: { object: ball, groups: [1, 2] }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele sind es zusammen?"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                options: ["8", "9", "10"]
                answer: "9"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Drei rote Punkte und noch vier blaue dazu. Welche Plusaufgabe passt?"
            show: { drawn: ten-frame, filled: 7, colour_split: [3, 4] }
            options: ["3 + 4", "3 + 3", "4 + 4"]
            answer: "3 + 4"
          - id: l1-c2
            type: multiple_choice
            text: "5 Vögel sitzen auf dem Dach. 3 fliegen dazu. Welche Aufgabe passt?"
            say: "Fünf Vögel sitzen auf dem Dach. Drei fliegen dazu. Welche Aufgabe passt?"
            show: { object: bird, groups: [5, 3] }
            options: ["5 + 3", "5 − 3", "3 + 3"]
            answer: "5 + 3"
          - id: l1-c3
            type: fill_in_blank
            text: "Schreib die Aufgabe."
            say: "Zwei rote Punkte und zwei blaue Punkte. Schreib die Plusaufgabe."
            show: { drawn: dots, count: 4, layout: five-structure, colour_split: [2, 2] }
            frame: "_ + _ = _"
            options: ["2", "4", "3"]
            answer: ["2", "2", "4"]
          - id: l1-c4
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Ein roter Punkt und noch fünf blaue dazu. Welche Plusaufgabe passt?"
            show: { drawn: ten-frame, filled: 6, colour_split: [1, 5] }
            options: ["1 + 5", "1 + 1", "5 + 5"]
            answer: "1 + 5"
          - id: l1-c5
            type: true_false
            text: "4 Kinder malen. 4 kommen dazu. Passt 4 + 2?"
            say: "Vier Kinder malen. Vier Kinder kommen dazu. Passt vier plus zwei?"
            show: { object: child, groups: [4, 4] }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Wie viele sind es zusammen?"
            show: { drawn: ten-frame, filled: 10, colour_split: [6, 4] }
            options: ["9", "10", "11"]
            answer: "10"

  - n: 2
    title: { de: Rechengeschichten, en: Number stories }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2 Kinder spielen. 3 kommen dazu. Welche Aufgabe passt?"
            say: "Zwei Kinder spielen. Drei kommen dazu. Welche Plusaufgabe passt?"
            show: { object: child, groups: [2, 3] }
            options: ["2 + 3", "2 + 2", "3 − 2"]
            answer: "2 + 3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie viele sind es zusammen?"
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            options: ["5", "6", "7"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "4 + 3"
            say: "Zu einer Plusaufgabe kann man eine Geschichte erzählen. Vier plus drei: Vier Kinder sitzen am Tisch. Drei Kinder kommen dazu."
            show: { drawn: ten-frame, filled: 7, colour_split: [4, 3] }
          - text: "4 + 3 = 7"
            say: "Wie viele Kinder sind es jetzt? Sieben. Vier plus drei gleich sieben. Die erste Zahl ist das, was zuerst da war."
          - text: "+   ="
            say: "Das Pluszeichen heißt plus, das Gleichheitszeichen heißt gleich. Nach dem Gleichheitszeichen steht, wie viele es zusammen sind."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Geschichte passt zu 3 + 2?"
                options: ["3 Kinder spielen, 2 kommen dazu.", "3 Kinder spielen, 2 gehen weg.", "2 Kinder spielen, 2 kommen dazu."]
                answer: "3 Kinder spielen, 2 kommen dazu."
                hints:
                  - "Plus heißt: Es kommt etwas dazu."
                  - "Zuerst sind es 3, dann kommen 2 dazu."
                  - "3 Kinder spielen, 2 kommen dazu."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Im Stall stehen 5 Kühe. 1 Kuh kommt dazu. Schreib die Aufgabe."
                say: "Im Stall stehen fünf Kühe. Eine Kuh kommt dazu. Schreib die Plusaufgabe."
                show: { object: cow, groups: [5, 1] }
                frame: "_ + _ = _"
                options: ["1", "5", "6"]
                answer: ["5", "1", "6"]
                hints:
                  - "Wie viele Kühe waren zuerst da?"
                  - "Fünf, dann eine dazu."
                  - "5 + 1 = 6."
              - id: l2-f3
                type: multiple_choice
                text: "Auf dem Teller liegen 4 Erdbeeren. Papa legt 2 dazu. Wie viele Erdbeeren sind es jetzt?"
                say: "Auf dem Teller liegen vier Erdbeeren. Papa legt zwei dazu. Wie viele Erdbeeren sind es jetzt?"
                show: { object: strawberry, groups: [4, 2] }
                options: ["5", "6", "2"]
                answer: "6"
                hints:
                  - "Vier und zwei dazu."
                  - "Zähl weiter: fünf, sechs."
                  - "Es sind 6."
              - id: l2-f4
                type: true_false
                text: "2 Katzen schlafen auf dem Sofa, 3 Katzen im Korb. Sind es zusammen 5 Katzen?"
                say: "Zwei Katzen schlafen auf dem Sofa, drei Katzen im Korb. Zusammen sind es fünf Katzen. Stimmt das?"
                show: { object: cat, groups: [2, 3] }
                answer: true
                hints:
                  - "Zusammenlegen ist plus."
                  - "Zwei plus drei."
                  - "Ja, fünf."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Geschichte passt zu 6 + 1?"
                options: ["6 Vögel sitzen im Baum, 1 fliegt dazu.", "6 Vögel sitzen im Baum, 1 fliegt weg.", "1 Vogel sitzt im Baum, 1 fliegt dazu."]
                answer: "6 Vögel sitzen im Baum, 1 fliegt dazu."
                hints:
                  - "Plus heißt dazu."
                  - "Zuerst 6, dann 1 dazu."
                  - "6 Vögel, 1 fliegt dazu."
              - id: l2-f6
                type: fill_in_blank
                text: "Lea hat 3 Sticker. Sie bekommt 4 dazu. Schreib die Aufgabe."
                say: "Lea hat drei Sticker. Sie bekommt vier dazu. Schreib die Plusaufgabe."
                show: { object: sticker, groups: [3, 4] }
                frame: "_ + _ = _"
                options: ["3", "4", "7"]
                answer: ["3", "4", "7"]
                hints:
                  - "Zuerst drei."
                  - "Vier kommen dazu."
                  - "3 + 4 = 7."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Geschichte passt zu 2 + 5?"
                options: ["2 Kinder rutschen, 5 kommen dazu.", "5 Kinder rutschen, 2 gehen weg.", "2 Kinder rutschen, 2 kommen dazu."]
                answer: "2 Kinder rutschen, 5 kommen dazu."
                hints: ["Zuerst 2, dann 5 dazu."]
              - id: l2-s2
                type: fill_in_blank
                text: "In der Dose sind 6 Murmeln. Ben legt 3 dazu. Schreib die Aufgabe."
                say: "In der Dose sind sechs Murmeln. Ben legt drei dazu. Schreib die Plusaufgabe."
                show: { object: marble, groups: [6, 3] }
                frame: "_ + _ = _"
                options: ["3", "6", "9"]
                answer: ["6", "3", "9"]
                hints: ["Zuerst sechs."]
              - id: l2-s3
                type: multiple_choice
                text: "3 Kinder warten an der Haltestelle. 3 kommen dazu. Wie viele Kinder warten jetzt?"
                say: "Drei Kinder warten an der Haltestelle. Drei kommen dazu. Wie viele Kinder warten jetzt?"
                show: { object: child, groups: [3, 3] }
                options: ["5", "6", "3"]
                answer: "6"
                hints: ["Drei und drei."]
              - id: l2-s4
                type: true_false
                text: "Ein Kind hat 4 Stifte und bekommt 1 dazu. Passt 4 − 1?"
                say: "Ein Kind hat vier Stifte und bekommt noch einen. Die Aufgabe ist vier minus eins. Stimmt das?"
                show: { object: crayon, groups: [4, 1] }
                answer: false
                hints: ["Bekommen heißt dazu."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Geschichte passt zu 5 + 4?"
                options: ["5 Fische schwimmen, 4 kommen dazu.", "5 Fische schwimmen, 4 schwimmen weg.", "4 Fische schwimmen, 4 kommen dazu."]
                answer: "5 Fische schwimmen, 4 kommen dazu."
                hints: ["Plus heißt dazu."]
              - id: l2-s6
                type: fill_in_blank
                text: "2 rote und 6 blaue Ballons. Schreib die Aufgabe: erst die roten, dann die blauen."
                say: "Zwei rote und sechs blaue Ballons. Wie viele Ballons sind es zusammen? Schreib die Plusaufgabe: erst die roten, dann die blauen."
                show: { object: balloon, groups: [2, 6] }
                frame: "_ + _ = _"
                options: ["2", "6", "8"]
                answer: ["2", "6", "8"]
                hints: ["Rot und blau zusammen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Geschichte passt zu 4 + 4?"
                options: ["4 Kinder malen, 4 kommen dazu.", "4 Kinder malen, 4 gehen weg.", "8 Kinder malen, 4 kommen dazu."]
                answer: "4 Kinder malen, 4 kommen dazu."
              - id: l2-n2
                type: fill_in_blank
                text: "Im Nest liegen 2 Eier. 1 Ei kommt dazu. Schreib die Aufgabe."
                say: "Im Nest liegen zwei Eier. Ein Ei kommt dazu. Schreib die Plusaufgabe."
                show: { object: egg, groups: [2, 1] }
                frame: "_ + _ = _"
                options: ["1", "2", "3"]
                answer: ["2", "1", "3"]
              - id: l2-n3
                type: multiple_choice
                text: "Auf dem Ast sitzen 7 Spatzen. 2 fliegen dazu. Wie viele Spatzen sind es jetzt?"
                say: "Auf dem Ast sitzen sieben Spatzen. Zwei fliegen dazu. Wie viele Spatzen sind es jetzt?"
                show: { object: bird, groups: [7, 2] }
                options: ["8", "9", "5"]
                answer: "9"
              - id: l2-n4
                type: true_false
                text: "5 Birnen liegen in der Schale, 5 Birnen im Korb. Sind es zusammen 10?"
                say: "Fünf Birnen liegen in der Schale, fünf Birnen im Korb. Zusammen sind es zehn. Stimmt das?"
                show: { object: pear, groups: [5, 5] }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Mama hat 3 Tassen. Sie kauft 5 dazu. Schreib die Aufgabe."
                say: "Mama hat drei Tassen. Sie kauft fünf dazu. Schreib die Plusaufgabe."
                show: { object: cup, groups: [3, 5] }
                frame: "_ + _ = _"
                options: ["3", "5", "8"]
                answer: ["3", "5", "8"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: picture
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Fünf rote Punkte und noch zwei blaue dazu. Welche Plusaufgabe passt?"
            show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
            options: ["5 + 2", "5 + 5", "7 + 2"]
            answer: "5 + 2"
          - id: l2-c2
            part: story
            type: fill_in_blank
            text: "Im Teich schwimmen 4 Enten. 2 Enten kommen dazu. Schreib die Aufgabe."
            say: "Im Teich schwimmen vier Enten. Zwei Enten kommen dazu. Schreib die Plusaufgabe."
            show: { object: duck, groups: [4, 2] }
            frame: "_ + _ = _"
            options: ["2", "4", "6"]
            answer: ["4", "2", "6"]
          - id: l2-c3
            part: tell
            type: multiple_choice
            text: "Welche Geschichte passt zu 2 + 6?"
            options: ["2 Kinder lesen, 6 kommen dazu.", "6 Kinder lesen, 2 gehen weg.", "2 Kinder lesen, 2 kommen dazu."]
            answer: "2 Kinder lesen, 6 kommen dazu."
          - id: l2-c4
            part: story
            type: multiple_choice
            text: "3 Kinder sitzen auf der Bank. 4 setzen sich dazu. Wie viele sitzen jetzt auf der Bank?"
            say: "Drei Kinder sitzen auf der Bank. Vier setzen sich dazu. Wie viele sitzen jetzt auf der Bank?"
            show: { object: child, groups: [3, 4] }
            options: ["6", "7", "8"]
            answer: "7"
          - id: l2-c5
            part: story
            type: true_false
            text: "Ein Junge hat 6 Murmeln und bekommt 2 dazu. Passt 6 + 2?"
            say: "Ein Junge hat sechs Murmeln und bekommt zwei dazu. Die Aufgabe ist sechs plus zwei. Stimmt das?"
            show: { object: marble, groups: [6, 2] }
            answer: true
          - id: l2-c6
            part: picture
