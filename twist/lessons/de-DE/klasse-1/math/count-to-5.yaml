# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.count-to-5
skill: math.numbers-to-20.count-to-5
curriculum: de-DE
language: de
title:
  de: Zählen bis 5
  en: Counting to 5
summary: >
  The first maths lessons of Klasse 1. Children count up to 5 things by
  pointing at each one exactly once, and learn that the last number they
  say tells how many there are. Lesson 1 counts to 3, lesson 2 to 5,
  including things that lie scattered, and ends with the skill check.
  Children tap each picture as they count, so the app can see the
  one-to-one match.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [zählen, wie viele, eins, zwei, drei, vier, fünf] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: in-a-row, what: { de: bis zu 5 Dinge in einer Reihe abzählen, en: counting up to 5 things in a row } }
    - { id: scattered, what: { de: "bis zu 5 Dinge abzählen, die durcheinanderliegen", en: counting up to 5 scattered things } }
    - { id: find-group, what: { de: die Gruppe mit einer bestimmten Anzahl finden, en: finding the group with a given number } }
  misconceptions:
    - id: count-twice
      what: Counts one thing twice or skips one
      addressed: tap_to_count marks each tapped picture, and the first hint of every counting task says "Tippe auf einen nach dem anderen."
    - id: last-number
      what: Counts correctly but cannot say how many there are, or recounts when asked
      addressed: lesson 1 Learn says "Die letzte Zahl sagt, wie viele es sind"; true_false tasks ask "Sind das 3 ...?" after counting
    - id: arrangement
      what: Thinks scattered things are more or fewer than the same number in a row
      addressed: lesson 2 Learn shows the same five fish in a row and scattered; lesson 2 practises scattered groups
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zählen bis 3, en: Counting to 3 }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "1, 2, 3"
            say: "Wir zählen die Äpfel. Wir zeigen auf jeden Apfel genau einmal: eins, zwei, drei."
            show: { object: apple, count: 3, layout: row }
          - text: "3"
            say: "Die letzte Zahl sagt, wie viele es sind. Es sind drei Äpfel."
            show: { object: apple, count: 3, layout: row }
          - text: "1, 2"
            say: "Hier sind Bälle. Eins, zwei. Es sind zwei Bälle."
            show: { object: ball, count: 2, layout: row }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tap_to_count
                text: "Tippe jeden Apfel einmal an. Wie viele sind es?"
                show: { object: apple, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Tippe auf einen Apfel nach dem anderen."
                  - "Zähl beim Tippen mit: eins, zwei."
                  - "Es sind 2 Äpfel."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Bälle sind es?"
                show: { object: ball, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
                feedback:
                  "2": "Hast du einen Ball vergessen? Zeig auf jeden Ball genau einmal."
                hints:
                  - "Zeig mit dem Finger auf jeden Ball."
                  - "Eins, zwei, drei. Welche Zahl hast du zuletzt gesagt?"
                  - "Es sind 3 Bälle."
              - id: l1-f3
                type: image_multiple_choice
                text: "Wo sind 2 Bananen?"
                options:
                  - { object: banana, count: 1, layout: row }
                  - { object: banana, count: 2, layout: row }
                  - { object: banana, count: 3, layout: row }
                answer: "2"
                hints:
                  - "Zähl die Bananen in jedem Bild."
                  - "In einem Bild ist eine, in einem anderen sind drei."
                  - "Such das Bild, bei dem du eins, zwei zählst und fertig bist."
              - id: l1-f4
                type: true_false
                text: "Sind das 3 Fische?"
                say: "Zähl die Fische. Sind das drei Fische?"
                show: { object: fish, count: 3, layout: row }
                answer: true
                hints:
                  - "Zähl die Fische, einen nach dem anderen."
                  - "Eins, zwei, drei."
                  - "Ja, es sind 3 Fische."
              - id: l1-f5
                type: tap_to_count
                text: "Tippe jedes Ei einmal an. Wie viele sind es?"
                show: { object: egg, count: 1, layout: row }
                options: ["1", "2", "3"]
                answer: "1"
                hints:
                  - "Wie viele Eier siehst du?"
                  - "Es liegt nur ein Ei da."
                  - "Es ist 1 Ei."
                difficulty: easy
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele Autos sind es?"
                show: { object: car, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                feedback:
                  "3": "Zähl noch einmal und zeig auf jedes Auto nur einmal."
                hints:
                  - "Zeig auf jedes Auto genau einmal."
                  - "Eins, zwei. Dann ist kein Auto mehr übrig."
                  - "Es sind 2 Autos."

          - support: some
            tasks:
              - id: l1-s1
                type: tap_to_count
                text: "Tippe jede Erdbeere einmal an. Wie viele sind es?"
                show: { object: strawberry, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["Tippe auf eine nach der anderen und zähl mit."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo ist 1 Ball?"
                options:
                  - { object: ball, count: 3, layout: row }
                  - { object: ball, count: 1, layout: row }
                  - { object: ball, count: 2, layout: row }
                answer: "1"
                hints: ["Such das Bild mit nur einem Ball."]
                difficulty: easy
              - id: l1-s3
                type: true_false
                text: "Sind das 2 Murmeln?"
                say: "Zähl die Murmeln. Sind das zwei Murmeln?"
                show: { object: marble, count: 3, layout: row }
                answer: false
                hints: ["Zähl genau: eins, zwei, und dann?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Frösche sind es?"
                show: { object: frog, count: 2, layout: row }
                options: ["1", "2", "3"]
                answer: "2"
                hints: ["Welche Zahl sagst du beim letzten Frosch?"]
              - id: l1-s5
                type: tap_to_count
                text: "Tippe jeden Luftballon einmal an. Wie viele sind es?"
                show: { object: balloon, count: 3, layout: scattered }
                options: ["1", "2", "3"]
                answer: "3"
                hints: ["Die Luftballons sind durcheinander. Tippe jeden nur einmal."]
              - id: l1-s6
                type: image_multiple_choice
                text: "Wo sind 3 Möhren?"
                options:
                  - { object: carrot, count: 2, layout: row }
                  - { object: carrot, count: 1, layout: row }
                  - { object: carrot, count: 3, layout: row }
                answer: "3"
                hints: ["Zähl in jedem Bild bis zur letzten Möhre."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Blätter sind es?"
                show: { object: leaf, count: 3, layout: row }
                options: ["1", "2", "3"]
                answer: "3"
              - id: l1-n2
                type: tap_to_count
                text: "Tippe jede Ameise einmal an. Wie viele sind es?"
                show: { object: ant, count: 2, layout: scattered }
                options: ["1", "2", "3"]
                answer: "2"
              - id: l1-n3
                type: true_false
                text: "Ist das 1 Maus?"
                say: "Zähl die Mäuse. Ist das eine Maus?"
                show: { object: mouse, count: 1, layout: row }
                answer: true
                difficulty: easy
              - id: l1-n4
                type: image_multiple_choice
                text: "Wo sind 2 Eier?"
                options:
                  - { object: egg, count: 2, layout: row }
                  - { object: egg, count: 3, layout: row }
                  - { object: egg, count: 1, layout: row }
                answer: "2"
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele Sticker sind es?"
                show: { object: sticker, count: 3, layout: scattered }
                options: ["1", "2", "3"]
                answer: "3"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Äpfel sind es?"
            show: { object: apple, count: 2, layout: scattered }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c2
            type: image_multiple_choice
            text: "Wo sind 3 Bälle?"
            options:
              - { object: ball, count: 2, layout: row }
              - { object: ball, count: 3, layout: row }
              - { object: ball, count: 1, layout: row }
            answer: "3"
          - id: l1-c3
            type: tap_to_count
            text: "Tippe jeden Buntstift einmal an. Wie viele sind es?"
            show: { object: crayon, count: 3, layout: row }
            options: ["1", "2", "3"]
            answer: "3"
          - id: l1-c4
            type: true_false
            text: "Sind das 3 Bananen?"
            say: "Zähl die Bananen. Sind das drei Bananen?"
            show: { object: banana, count: 2, layout: row }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele Fische sind es?"
            show: { object: fish, count: 3, layout: scattered }
            options: ["1", "2", "3"]
            answer: "3"
          - id: l1-c6
            type: image_multiple_choice
            text: "Wo ist 1 Frosch?"
            options:
              - { object: frog, count: 2, layout: row }
              - { object: frog, count: 1, layout: row }
              - { object: frog, count: 3, layout: row }
            answer: "1"

