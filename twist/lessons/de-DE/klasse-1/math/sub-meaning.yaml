# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.sub-meaning
skill: math.add-sub-to-20.sub-meaning
curriculum: de-DE
language: de
title:
  de: Was bedeutet minus?
  en: What does minus mean?
summary: >
  Minus is taking away: some go away, are eaten, fly off. Lesson 1 finds
  the minus sum for a picture with crossed-out counters or a little story;
  lesson 2 tells a story for a sum, writes it with − and =, and sets plus
  and minus stories side by side, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-meaning]
  also_practises: [math.add-sub-to-20.add-meaning]
  vocabulary: { de: [minus, weg, wegnehmen, bleiben, übrig, Minusaufgabe] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame]
  facets: []
  parts:
    - { id: picture, what: { de: "die Minusaufgabe zu einem Bild finden", en: "finding the subtraction for a picture" } }
    - { id: story, what: { de: "die Minusaufgabe zu einer Geschichte finden und lösen", en: "finding and solving the subtraction for a story" } }
    - { id: plus-or-minus, what: { de: "entscheiden, ob eine Geschichte plus oder minus ist", en: "deciding whether a story is plus or minus" } }
    - { id: story-for-sum, what: { de: "die passende Geschichte zu einer Minusaufgabe finden", en: "finding a story that fits a subtraction" } }
  misconceptions:
    - id: plus-for-everything
      what: Uses plus for every story, also when something goes away
      addressed: lesson 2 sets plus and minus stories side by side; feedback names the word that shows taking away
    - id: wrong-start
      what: Starts the minus sum with the number taken away (2 − 5 for "5, 2 gehen weg")
      addressed: Learn says the first number is how many there were at the start
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Weg ist weg, en: Taking away }
    goal:
      de: "Find die Minusaufgabe zu einem Bild. Fünf Kekse, zwei werden gegessen, das ist 5 − 2."
      en: "Find the take-away sum for a picture. Five biscuits and two get eaten, that is 5 − 2."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "3 Kinder spielen. 2 kommen dazu.\nWelche Aufgabe passt?"
            say: "Drei Kinder spielen. Zwei kommen dazu. Welche Aufgabe passt?"
            show: { object: child, groups: [3, 2] }
            options: ["3 + 2", "3 + 3", "2 + 2"]
            answer: "3 + 2"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 + 2 = _"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wie viele bleiben übrig?"
            say: "Auf dem Teller liegen fünf Kekse. Gleich werden zwei gegessen. Was glaubst du: Wie viele Kekse bleiben übrig?"
            show: { drawn: ten-frame, filled: 5 }
          - text: "5 − 2"
            say: "Zwei Kekse werden gegessen. Sie sind weg. Wegnehmen heißt: minus. Fünf minus zwei."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - text: "5 − 2 = 3"
            say: "Drei Kekse bleiben übrig. Fünf minus zwei gleich drei. Die erste Zahl sagt, wie viele am Anfang da waren."
            show: { drawn: ten-frame, filled: 5, cross: 2 }
          - text: "Wusstest du? Ein Hai verliert in seinem Leben Tausende Zähne."
            say: "Wusstest du? Ein Hai verliert in seinem Leben Tausende Zähne. Ist ein Zahn weg, rückt einfach ein neuer nach."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Sechs Punkte, zwei sind durchgestrichen. Welche Minusaufgabe passt?"
                show: { drawn: ten-frame, filled: 6, cross: 2 }
                options: ["6 − 2", "6 + 2", "2 − 6"]
                answer: "6 − 2"
                feedback:
                  "6 + 2": "Durchgestrichen heißt weg. Weg ist minus, nicht plus."
                  "2 − 6": "Die erste Zahl sagt, wie viele am Anfang da waren: sechs."
                hints:
                  - "Wie viele Punkte waren am Anfang da?"
                  - "Sechs. Zwei sind weg."
                  - "6 − 2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele bleiben übrig?"
                show: { drawn: ten-frame, filled: 4, cross: 1 }
                options: ["3", "4", "5"]
                answer: "3"
                hints:
                  - "Zähl nur die Punkte ohne Kreuz."
                  - "Vier, und einer ist weg."
                  - "Drei bleiben übrig."
              - id: l1-f3
                type: multiple_choice
                text: "5 Vögel sitzen auf dem Baum. 3 fliegen weg.\nWelche Aufgabe passt?"
                say: "Auf dem Baum sitzen fünf Vögel. Drei fliegen weg. Welche Minusaufgabe passt?"
                show: { object: bird, count: 5, gone: 3 }
                options: ["5 − 3", "5 + 3", "3 − 5"]
                answer: "5 − 3"
                hints:
                  - "Wegfliegen heißt weg."
                  - "Zuerst fünf, dann fliegen drei weg."
                  - "5 − 3."
              - id: l1-f4
                type: fill_in_blank
                text: "Schreib die Aufgabe."
                say: "Sieben Punkte, drei sind durchgestrichen. Schreib die Minusaufgabe."
                show: { drawn: ten-frame, filled: 7, cross: 3 }
                frame: "_ − _ = _"
                options: ["3", "4", "7"]
                answer: ["7", "3", "4"]
                hints:
                  - "Wie viele am Anfang, wie viele weg?"
                  - "Sieben, drei weg."
                  - "7 − 3 = 4."
              - id: l1-f5
                type: true_false
                text: "Tom hat 4 Ballons. 1 platzt. Passt 4 − 1?"
                say: "Tom hat vier Ballons. Einer platzt. Passt vier minus eins?"
                show: { object: balloon, count: 4, gone: 1 }
                answer: true
                hints:
                  - "Platzen heißt: Er ist weg."
                  - "Vier, einer weg."
                  - "Ja, 4 − 1."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele bleiben übrig?"
                show: { drawn: ten-frame, filled: 8, cross: 3 }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Zähl die Punkte ohne Kreuz."
                  - "Die obere Reihe ist voll: fünf."
                  - "5 bleiben übrig."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Neun Punkte, vier sind durchgestrichen. Welche Minusaufgabe passt?"
                show: { drawn: ten-frame, filled: 9, cross: 4 }
                options: ["9 − 4", "9 + 4", "4 − 9"]
                answer: "9 − 4"
                hints: ["Zuerst neun."]
              - id: l1-s2
                type: multiple_choice
                text: "Im Schälchen liegen 5 Erdbeeren. Der Hund schnappt sich 2. Wie viele bleiben übrig?"
                say: "Im Schälchen liegen fünf Erdbeeren. Der Hund schnappt sich zwei. Wie viele Erdbeeren bleiben übrig?"
                show: { object: strawberry, count: 5, gone: 2 }
                options: ["2", "3", "4"]
                answer: "3"
                feedback:
                  "2": "Zwei hat der freche Hund im Maul. Wie viele liegen noch im Schälchen?"
                hints: ["Zähl nur die Erdbeeren, die noch da sind."]
              - id: l1-s3
                type: multiple_choice
                text: "Im Korb liegen 6 Äpfel. Mama nimmt 1 heraus.\nWelche Aufgabe passt?"
                say: "Im Korb liegen sechs Äpfel. Mama nimmt einen heraus. Welche Minusaufgabe passt?"
                show: { object: apple, count: 6, gone: 1 }
                options: ["6 − 1", "6 + 1", "1 − 6"]
                answer: "6 − 1"
                hints: ["Herausnehmen heißt weg."]
              - id: l1-s4
                type: fill_in_blank
                text: "Schreib die Aufgabe."
                say: "Zehn Punkte, fünf sind durchgestrichen. Schreib die Minusaufgabe."
                show: { drawn: ten-frame, filled: 10, cross: 5 }
                frame: "_ − _ = _"
                options: ["5", "10"]
                answer: ["10", "5", "5"]
                hints: ["Zehn, fünf weg."]
              - id: l1-s5
                type: true_false
                text: "3 Kinder sind im Garten. 1 geht nach Hause. Passt 3 + 1?"
                say: "Drei Kinder sind im Garten. Ein Kind geht nach Hause. Passt drei plus eins?"
                show: { object: child, count: 3, gone: 1 }
                answer: false
                hints: ["Nach Hause gehen heißt weg."]
              - id: l1-s6
                type: multiple_choice
                text: "Wie viele bleiben übrig?"
                show: { drawn: ten-frame, filled: 7, cross: 4 }
                options: ["2", "3", "4"]
                answer: "3"
                hints: ["Ohne Kreuz zählen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Aufgabe passt?"
                say: "Acht Punkte, zwei sind durchgestrichen. Welche Minusaufgabe passt?"
                show: { drawn: ten-frame, filled: 8, cross: 2 }
                options: ["8 − 2", "8 + 2", "2 − 8"]
                answer: "8 − 2"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele bleiben übrig?"
                show: { drawn: ten-frame, filled: 6, cross: 3 }
                options: ["2", "3", "4"]
                answer: "3"
              - id: l1-n3
                type: fill_in_blank
                text: "Schreib die Aufgabe."
                say: "Neun Punkte, einer ist durchgestrichen. Schreib die Minusaufgabe."
                show: { drawn: ten-frame, filled: 9, cross: 1 }
                frame: "_ − _ = _"
                options: ["1", "8", "9"]
                answer: ["9", "1", "8"]
              - id: l1-n4
                type: multiple_choice
                text: "Auf dem Teich schwimmen 7 Enten. 2 schwimmen weg.\nWelche Aufgabe passt?"
                say: "Auf dem Teich schwimmen sieben Enten. Zwei schwimmen weg. Welche Minusaufgabe passt?"
                show: { object: duck, count: 7, gone: 2 }
                options: ["7 − 2", "7 + 2", "2 − 7"]
                answer: "7 − 2"
              - id: l1-n5
                type: true_false
                text: "Lea hat 5 Erdbeeren und isst 2. Passt 5 − 2?"
                say: "Lea hat fünf Erdbeeren und isst zwei. Passt fünf minus zwei?"
                show: { object: strawberry, count: 5, gone: 2 }
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Sieben Punkte, drei sind durchgestrichen. Welche Minusaufgabe passt?"
            show: { drawn: ten-frame, filled: 7, cross: 3 }
            options: ["7 − 3", "7 + 3", "3 − 7"]
            answer: "7 − 3"
          - id: l1-c2
            type: multiple_choice
            text: "Wie viele bleiben übrig?"
            show: { drawn: ten-frame, filled: 9, cross: 2 }
            options: ["6", "7", "8"]
            answer: "7"
          - id: l1-c3
            type: multiple_choice
            text: "Im Bus sitzen 4 Kinder. 1 Kind steigt aus.\nWelche Aufgabe passt?"
            say: "Im Bus sitzen vier Kinder. Ein Kind steigt aus. Welche Minusaufgabe passt?"
            show: { object: child, count: 4, gone: 1 }
            options: ["4 − 1", "4 + 1", "1 − 4"]
            answer: "4 − 1"
          - id: l1-c4
            type: fill_in_blank
            text: "Schreib die Aufgabe."
            say: "Zehn Punkte, zwei sind durchgestrichen. Schreib die Minusaufgabe."
            show: { drawn: ten-frame, filled: 10, cross: 2 }
            frame: "_ − _ = _"
            options: ["2", "8", "10"]
            answer: ["10", "2", "8"]
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele bleiben übrig?"
            say: "Sieben Punkte, fünf sind durchgestrichen. Wie viele bleiben übrig?"
            show: { drawn: ten-frame, filled: 7, cross: 5 }
            options: ["1", "2", "3"]
            answer: "2"
          - id: l1-c6
            type: true_false
            text: "Auf dem Ast sitzen 7 Vögel. 4 fliegen weg. Passt 4 − 7?"
            say: "Auf dem Ast sitzen sieben Vögel. Vier fliegen weg. Passt vier minus sieben?"
            show: { object: bird, count: 7, gone: 4 }
            answer: false

  - n: 2
    title: { de: "Plus oder minus?", en: "Plus or minus?" }
    goal:
      de: "Hör genau hin, ob etwas dazukommt oder weggeht. Kommt etwas dazu, rechnest du plus, geht etwas weg, rechnest du minus."
      en: "Listen for whether something comes or goes. When something comes you add, when something goes you take away."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele bleiben übrig?"
            show: { drawn: ten-frame, filled: 6, cross: 1 }
            options: ["4", "5", "6"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "5 Kinder spielen. 2 gehen nach Hause.\nWelche Aufgabe passt?"
            say: "Fünf Kinder spielen. Zwei gehen nach Hause. Welche Aufgabe passt?"
            show: { object: child, count: 5, gone: 2 }
            options: ["5 − 2", "5 + 2", "2 − 5"]
            answer: "5 − 2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Plus oder minus?"
            say: "Auf dem Tisch liegen sechs Äpfel. Vier werden gegessen. Was glaubst du: Ist das plus oder minus?"
            show: { object: apple, count: 6, gone: 4 }
          - text: "dazu → plus"
            say: "Kommt etwas dazu, wird es mehr: plus. Zum Beispiel: Zwei Kinder kommen dazu."
          - text: "weg → minus"
            say: "Geht etwas weg, wird es weniger: minus. Zum Beispiel: Zwei Kinder gehen weg. Und die Äpfel? Gegessen ist weg, also minus!"
          - text: "6 − 4 = 2"
            say: "Eine Geschichte zu sechs minus vier: Sechs Äpfel liegen auf dem Tisch. Vier werden gegessen. Zwei bleiben übrig."
            show: { drawn: ten-frame, filled: 6, cross: 4 }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "3 Katzen schlafen. 2 Katzen laufen weg.\nPlus oder minus?"
                say: "Drei Katzen schlafen. Zwei Katzen laufen weg. Plus oder minus?"
                show: { object: cat, count: 3, gone: 2 }
                options: ["plus", "minus"]
                answer: "minus"
                feedback:
                  "plus": "Weglaufen heißt weg. Es werden weniger: minus."
                hints:
                  - "Wird es mehr oder weniger?"
                  - "Weglaufen: weniger."
                  - "Minus."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Geschichte passt zu 5 − 1?"
                options: ["5 Vögel sitzen im Baum, 1 fliegt weg.", "5 Vögel sitzen im Baum, 1 fliegt dazu.", "1 Vogel sitzt im Baum, 5 fliegen weg."]
                answer: "5 Vögel sitzen im Baum, 1 fliegt weg."
                hints:
                  - "Minus heißt weg."
                  - "Zuerst 5, dann 1 weg."
                  - "5 Vögel, 1 fliegt weg."
              - id: l2-f3
                type: fill_in_blank
                text: "In der Schüssel sind 8 Erdbeeren. Ben isst 3.\nSchreib die Aufgabe."
                say: "In der Schüssel sind acht Erdbeeren. Ben isst drei. Schreib die Minusaufgabe."
                show: { object: strawberry, count: 8, gone: 3 }
                frame: "_ − _ = _"
                options: ["3", "5", "8"]
                answer: ["8", "3", "5"]
                hints:
                  - "Wie viele waren am Anfang da?"
                  - "Acht, drei werden gegessen."
                  - "8 − 3 = 5."
              - id: l2-f4
                type: multiple_choice
                text: "4 Kinder spielen Fangen. 3 Kinder kommen dazu.\nPlus oder minus?"
                say: "Vier Kinder spielen Fangen. Drei Kinder kommen dazu. Plus oder minus?"
                show: { object: child, groups: [4, 3] }
                options: ["plus", "minus"]
                answer: "plus"
                hints:
                  - "Wird es mehr oder weniger?"
                  - "Dazukommen: mehr."
                  - "Plus."
              - id: l2-f5
                type: true_false
                text: "7 Tassen. 2 gehen kaputt. Bleiben 5?"
                say: "Auf dem Tisch stehen sieben Tassen. Zwei fallen herunter und gehen kaputt. Es bleiben fünf. Stimmt das?"
                show: { object: cup, count: 7, gone: 2 }
                answer: true
                hints:
                  - "Sieben minus zwei."
                  - "Zähl von sieben zwei zurück: sechs, fünf."
                  - "Ja."
              - id: l2-f6
                type: multiple_choice
                text: "Mia hat 6 Sticker. Sie schenkt ihrer Freundin 2.\nWie viele Sticker hat Mia noch?"
                say: "Mia hat sechs Sticker. Sie schenkt ihrer Freundin zwei. Wie viele Sticker hat Mia noch?"
                show: { object: sticker, count: 6, gone: 2 }
                options: ["4", "5", "8"]
                answer: "4"
                feedback:
                  "8": "Verschenken heißt weg. Es werden weniger: 6 − 2."
                hints:
                  - "Verschenken heißt weg."
                  - "Sechs minus zwei."
                  - "4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "5 Fische schwimmen im Glas. Papa setzt 2 dazu.\nPlus oder minus?"
                say: "Fünf Fische schwimmen im Glas. Papa setzt zwei dazu. Plus oder minus?"
                show: { object: fish, groups: [5, 2] }
                options: ["plus", "minus"]
                answer: "plus"
                hints: ["Mehr oder weniger?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Geschichte passt zu 7 − 4?"
                options: ["7 Kinder sind im Zimmer, 4 gehen hinaus.", "7 Kinder sind im Zimmer, 4 kommen herein.", "4 Kinder sind im Zimmer, 7 gehen hinaus."]
                answer: "7 Kinder sind im Zimmer, 4 gehen hinaus."
                hints: ["Zuerst 7, dann 4 weg."]
              - id: l2-s3
                type: fill_in_blank
                text: "Auf der Leine hängen 10 Socken. Mama nimmt 4 ab.\nSchreib die Aufgabe."
                say: "Auf der Leine hängen zehn Socken. Mama nimmt vier ab. Schreib die Minusaufgabe."
                show: { object: sock, count: 10, gone: 4 }
                frame: "_ − _ = _"
                options: ["4", "6", "10"]
                answer: ["10", "4", "6"]
                hints: ["Zuerst zehn."]
              - id: l2-s4
                type: true_false
                text: "3 Vögel sitzen auf dem Zaun. 1 fliegt weg. Passt 3 + 1?"
                say: "Auf dem Zaun sitzen drei Vögel. Einer fliegt weg. Die Aufgabe ist drei plus eins. Stimmt das?"
                show: { object: bird, count: 3, gone: 1 }
                answer: false
                hints: ["Werden es auf dem Zaun mehr oder weniger?"]
              - id: l2-s5
                type: multiple_choice
                text: "Leo hat 9 Murmeln. Er verliert 3.\nWie viele hat er noch?"
                say: "Leo hat neun Murmeln. Er verliert drei. Wie viele hat er noch?"
                show: { object: marble, count: 9, gone: 3 }
                options: ["5", "6", "12"]
                answer: "6"
                hints: ["Neun minus drei."]
              - id: l2-s6
                type: multiple_choice
                text: "8 Blätter hängen am Baum. Der Wind weht 3 herunter.\nPlus oder minus?"
                say: "Acht Blätter hängen am Baum. Der Wind weht drei herunter. Plus oder minus?"
                show: { object: leaf, count: 8, gone: 3 }
                options: ["plus", "minus"]
                answer: "minus"
                hints: ["Herunterwehen heißt weg."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "2 Hunde spielen. 2 Hunde kommen dazu.\nPlus oder minus?"
                say: "Zwei Hunde spielen. Zwei Hunde kommen dazu. Plus oder minus?"
                show: { object: dog, groups: [2, 2] }
                options: ["plus", "minus"]
                answer: "plus"
              - id: l2-n2
                type: fill_in_blank
                text: "Im Glas sind 7 Murmeln. Lisa nimmt 1.\nSchreib die Aufgabe."
                say: "Im Glas sind sieben Murmeln. Lisa nimmt eine. Schreib die Minusaufgabe."
                show: { object: marble, count: 7, gone: 1 }
                frame: "_ − _ = _"
                options: ["1", "6", "7"]
                answer: ["7", "1", "6"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Geschichte passt zu 9 − 5?"
                options: ["9 Äpfel hängen am Baum, 5 fallen herunter.", "9 Äpfel hängen am Baum, 5 wachsen dazu.", "5 Äpfel hängen am Baum, 9 fallen herunter."]
                answer: "9 Äpfel hängen am Baum, 5 fallen herunter."
              - id: l2-n4
                type: true_false
                text: "5 Kinder sitzen am Tisch. 3 gehen. Sitzen noch 2?"
                say: "Fünf Kinder sitzen am Tisch. Drei stehen auf und gehen. Zwei sitzen noch. Stimmt das?"
                show: { object: child, count: 5, gone: 3 }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Auf dem Parkplatz stehen 8 Autos. 4 fahren weg.\nWie viele stehen noch da?"
                say: "Auf dem Parkplatz stehen acht Autos. Vier fahren weg. Wie viele stehen noch da?"
                show: { object: car, count: 8, gone: 4 }
                options: ["3", "4", "12"]
                answer: "4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: picture
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Zehn Punkte, drei sind durchgestrichen. Welche Minusaufgabe passt?"
            show: { drawn: ten-frame, filled: 10, cross: 3 }
            options: ["10 − 3", "10 + 3", "3 − 10"]
            answer: "10 − 3"
          - id: l2-c2
            part: plus-or-minus
            type: multiple_choice
            text: "6 Kinder schwimmen. 2 gehen aus dem Wasser.\nPlus oder minus?"
            say: "Sechs Kinder schwimmen. Zwei gehen aus dem Wasser. Plus oder minus?"
            show: { object: child, count: 6, gone: 2 }
            options: ["plus", "minus"]
            answer: "minus"
          - id: l2-c3
            part: story
            type: fill_in_blank
            text: "Auf dem Teller liegen 8 Erdbeeren. Tim isst 1.\nSchreib die Aufgabe."
            say: "Auf dem Teller liegen acht Erdbeeren. Tim isst eine. Schreib die Minusaufgabe."
            show: { object: strawberry, count: 8, gone: 1 }
            frame: "_ − _ = _"
            options: ["1", "7", "8"]
            answer: ["8", "1", "7"]
          - id: l2-c4
            part: story-for-sum
            type: multiple_choice
            text: "Welche Geschichte passt zu 6 − 3?"
