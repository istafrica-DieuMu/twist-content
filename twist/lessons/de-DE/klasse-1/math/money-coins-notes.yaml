# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.money-coins-notes
skill: math.money.coins-notes
curriculum: de-DE
language: de
title:
  de: Münzen und Scheine
  en: Coins and notes
summary: >
  Lesson 1 tells the coins apart: the Cent-Münzen (1, 2, 5, 10, 20 and
  50 Cent) and the Euro-Münzen (1 € and 2 €), reading the number and the
  word Cent or Euro on each coin; lesson 2 meets the Scheine (5 €, 10 €,
  20 €, 50 €, 100 €), compares what coins and notes are worth and puts
  them in order by value, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.compare-to-20]
  also_practises: [math.numbers-to-20.compare-to-20]
  vocabulary: { de: [Geld, Münze, Schein, Cent, Euro, wert, mehr wert] }
  forms: [text, audio, drawn]
  drawn: [coins]
  facets: [currency]
  parts:
    - { id: coins, what: { de: Münzen erkennen und ihren Wert lesen, en: recognising coins and reading their value } }
    - { id: notes, what: { de: Scheine erkennen und ihren Wert lesen, en: recognising notes and reading their value } }
    - { id: compare, what: { de: "sagen, was mehr oder weniger wert ist", en: "saying which is worth more or less" } }
    - { id: order, what: { de: Münzen und Scheine nach dem Wert ordnen, en: putting coins and notes in order of value } }
  misconceptions:
    - id: big-coin-worth-more
      what: Thinks a bigger coin is worth more (the 50-Cent-Münze is bigger than the 1-Euro-Münze, the 5-Cent-Münze bigger than the 10-Cent-Münze)
      addressed: lesson 1 Learn says to read the coin, not to look at its size; l1-f4 (50 ct against 1 €, with feedback) and l1-s4 (5 ct against 10 ct) put a big coin of low value next to a smaller one worth more
    - id: cent-is-euro
      what: Reads only the number and treats 2 ct and 2 € as the same
      addressed: lesson 1 Learn points at the word Cent or Euro; l1-f2 (with feedback), l1-s2, l1-n5 and l1-c3 offer the same number with the other unit
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Münzen", en: "The coins" }
    goal:
      de: "Lerne die Münzen kennen. Lies die Zahl und das Wort Cent oder Euro, denn die Größe verrät es nicht."
      en: "Get to know the coins. Read the number and the word cent or euro, because the size does not tell you."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist mehr: 12 oder 15?"
            say: "Was ist mehr: zwölf oder fünfzehn?"
            options: ["15", "12"]
            answer: "15"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Zahl ist größer: 9 oder 19?"
            say: "Welche Zahl ist größer: neun oder neunzehn?"
            options: ["19", "9"]
            answer: "19"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wie viele Münzen?"
            say: "Was glaubst du: Wie viele verschiedene Münzen gibt es beim Euro? Rate eine Zahl, dann zählen wir."
          - text: "1 ct · 2 ct · 5 ct · 10 ct · 20 ct · 50 ct"
            say: "Das sind die Cent-Münzen, sechs Stück. Ein Cent, zwei Cent und fünf Cent sind kupferrot. Zehn Cent, zwanzig Cent und fünfzig Cent sind golden."
            show: { drawn: coins, values: [1, 2, 5, 10, 20, 50] }
          - text: "1 € · 2 €"
            say: "Das sind die Euro-Münzen. Sie haben zwei Farben. Ein Euro ist innen silbern, zwei Euro sind innen golden. Sechs Cent-Münzen und zwei Euro-Münzen: Es gibt acht verschiedene Münzen."
            show: { drawn: coins, values: [100, 200] }
          - text: "1 ct oder 1 €?"
            say: "Auf jeder Münze steht, wie viel sie wert ist. Lies die Zahl und das Wort: Cent oder Euro. Die Größe sagt es dir nicht. Ein Euro ist viel mehr wert als ein Cent."
            show: { drawn: coins, values: [1, 100] }
          - text: "Wusstest du? Auf den deutschen 1-, 2- und 5-Cent-Münzen ist ein Eichenzweig."
            say: "Wusstest du? Jedes Euro-Land hat für seine Münzen ein eigenes Bild auf der Rückseite. Auf den deutschen Ein-, Zwei- und Fünf-Cent-Münzen ist ein Eichenzweig. Schau mal in deinem Portemonnaie nach!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wo ist die 2-Euro-Münze?"
                say: "Wo ist die Zwei-Euro-Münze?"
                options:
                  - { drawn: coins, values: [200] }
                  - { drawn: coins, values: [2] }
                  - { drawn: coins, values: [20] }
                answer: "200"
                hints:
                  - "Schau auf die Zahl und auf das Zeichen €."
                  - "Die Euro-Münzen haben zwei Farben."
                  - "Es ist die Münze mit 2 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viel ist diese Münze wert?"
                say: "Wie viel ist diese Münze wert?"
                show: { drawn: coins, values: [50] }
                options: ["50 ct", "50 €", "5 ct"]
                answer: "50 ct"
                feedback:
                  "50 €": "Auf der Münze steht ct. Das heißt Cent, nicht Euro."
                hints:
                  - "Lies die Zahl und das Wort auf der Münze."
                  - "Die Münze ist golden. Das ist eine Cent-Münze."
                  - "50 ct."
              - id: l1-f3
                type: true_false
                text: "Das ist eine 1-Euro-Münze."
                say: "Stimmt das? Das ist eine Ein-Euro-Münze."
                show: { drawn: coins, values: [100] }
                answer: true
                hints:
                  - "Schau auf die Zahl und das Zeichen."
                  - "Die Münze ist innen silbern und außen golden."
                  - "Ja, das ist 1 €."
              - id: l1-f4
                type: image_multiple_choice
                text: "Welche Münze ist mehr wert?"
                say: "Welche Münze ist mehr wert?"
                options:
                  - { drawn: coins, values: [50] }
                  - { drawn: coins, values: [100] }
                answer: "100"
                feedback:
                  "50": "Die 50-Cent-Münze ist größer. Aber 1 Euro ist mehr wert als 50 Cent."
                hints:
                  - "Lies, was auf den Münzen steht. Die Größe hilft nicht."
                  - "Cent oder Euro? Ein Euro ist mehr als jede Cent-Münze."
                  - "Die Münze mit 1 €."
              - id: l1-f5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Münze mit ihrem Wert."
                pairs:
                  - { left: { drawn: coins, values: [10] }, right: { text: "10 ct" } }
                  - { left: { drawn: coins, values: [200] }, right: { text: "2 €" } }
                  - { left: { drawn: coins, values: [5] }, right: { text: "5 ct" } }
                option_audio: false
                hints:
                  - "Lies auf jeder Münze die Zahl."
                  - "Nur eine Münze ist eine Euro-Münze."
                  - "10 ct zu 10 ct, 2 € zu 2 €, 5 ct zu 5 ct."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo ist die 10-Cent-Münze?"
                say: "Wo ist die Zehn-Cent-Münze?"
                options:
                  - { drawn: coins, values: [1] }
                  - { drawn: coins, values: [10] }
                  - { drawn: coins, values: [100] }
                answer: "10"
                hints: ["Such die Zahl 10 und die Abkürzung ct."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viel ist diese Münze wert?"
                say: "Wie viel ist diese Münze wert?"
                show: { drawn: coins, values: [2] }
                options: ["2 ct", "2 €", "20 ct"]
                answer: "2 ct"
                hints: ["Kupferrote Münzen sind Cent-Münzen."]
              - id: l1-s3
                type: true_false
                text: "Das ist eine 2-Euro-Münze."
                say: "Stimmt das? Das ist eine Zwei-Euro-Münze."
                show: { drawn: coins, values: [20] }
                answer: false
                hints: ["Lies die Zahl und das Wort auf der Münze."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Welche Münze ist mehr wert?"
                say: "Welche Münze ist mehr wert?"
                options:
                  - { drawn: coins, values: [5] }
                  - { drawn: coins, values: [10] }
                answer: "10"
                hints: ["Die größere Münze ist nicht immer mehr wert. Lies die Zahlen."]
              - id: l1-s5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Münze mit ihrem Wert."
                pairs:
                  - { left: { drawn: coins, values: [1] }, right: { text: "1 ct" } }
                  - { left: { drawn: coins, values: [100] }, right: { text: "1 €" } }
                  - { left: { drawn: coins, values: [50] }, right: { text: "50 ct" } }
                option_audio: false
                hints: ["Zwei Münzen haben eine 1. Schau auf ct und €."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo ist die 50-Cent-Münze?"
                say: "Wo ist die Fünfzig-Cent-Münze?"
                options:
                  - { drawn: coins, values: [5] }
                  - { drawn: coins, values: [50] }
                  - { drawn: coins, values: [200] }
                answer: "50"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viel ist diese Münze wert?"
                say: "Wie viel ist diese Münze wert?"
                show: { drawn: coins, values: [100] }
                options: ["1 €", "1 ct", "10 ct", "1 Bonbon"]
                answer: "1 €"
                feedback:
                  "1 Bonbon": "Vielleicht kaufst du damit Bonbons! Aber auf der Münze steht, wie viel sie wert ist: 1 Euro."
              - id: l1-n3
                type: true_false
                text: "Das ist eine 5-Cent-Münze."
                say: "Stimmt das? Das ist eine Fünf-Cent-Münze."
                show: { drawn: coins, values: [5] }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Im Sparschwein sind drei Münzen. Welche ist am wenigsten wert?"
                say: "Im Sparschwein sind drei Münzen. Welche Münze ist am wenigsten wert?"
                options:
                  - { drawn: coins, values: [10] }
                  - { drawn: coins, values: [1] }
                  - { drawn: coins, values: [50] }
                answer: "1"
              - id: l1-n5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Münze mit ihrem Wert."
                pairs:
                  - { left: { drawn: coins, values: [2] }, right: { text: "2 ct" } }
                  - { left: { drawn: coins, values: [200] }, right: { text: "2 €" } }
                  - { left: { drawn: coins, values: [20] }, right: { text: "20 ct" } }
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo ist die 1-Euro-Münze?"
            say: "Tipp auf die Ein-Euro-Münze."
            options:
              - { drawn: coins, values: [1] }
              - { drawn: coins, values: [100] }
              - { drawn: coins, values: [10] }
            answer: "100"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welche Münze ist mehr wert?"
            say: "Welche Münze ist mehr wert? Tipp darauf."
            options:
              - { drawn: coins, values: [5] }
              - { drawn: coins, values: [20] }
            answer: "20"
          - id: l1-c3
            type: multiple_choice
            text: "Wie viel ist diese Münze wert?"
            say: "Wie viel ist diese Münze wert? Tipp auf den Wert."
            show: { drawn: coins, values: [20] }
            options: ["20 ct", "20 €", "2 ct"]
            answer: "20 ct"
          - id: l1-c4
            type: true_false
            text: "Das ist eine 10-Cent-Münze."
            say: "Stimmt das? Das ist eine Zehn-Cent-Münze."
            show: { drawn: coins, values: [10] }
            answer: true
          - id: l1-c5
            type: matching
            text: "Was gehört zusammen?"
            say: "Verbinde jede Münze mit dem, was sie wert ist."
            pairs:
              - { left: { drawn: coins, values: [20] }, right: { text: "20 ct" } }
              - { left: { drawn: coins, values: [5] }, right: { text: "5 ct" } }
              - { left: { drawn: coins, values: [200] }, right: { text: "2 €" } }
            option_audio: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Welche Münze ist am meisten wert?"
            say: "Welche Münze ist am meisten wert? Tipp darauf."
            options:
              - { drawn: coins, values: [50] }
              - { drawn: coins, values: [200] }
              - { drawn: coins, values: [10] }
            answer: "200"

  - n: 2
    title: { de: "Scheine und was sie wert sind", en: "Notes and what they are worth" }
    goal:
      de: "Lerne die Geldscheine kennen und ordne Geld nach seinem Wert. Ein Schein ist mehr wert als jede Münze."
      en: "Get to know the notes and put money in order of value. A note is worth more than any coin."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Wo ist die 20-Cent-Münze?"
            say: "Wo ist die Zwanzig-Cent-Münze?"
            options:
              - { drawn: coins, values: [20] }
              - { drawn: coins, values: [200] }
              - { drawn: coins, values: [2] }
            answer: "20"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ist das eine Cent-Münze oder eine Euro-Münze?"
            say: "Ist das eine Cent-Münze oder eine Euro-Münze?"
            show: { drawn: coins, values: [200] }
            options: ["eine Euro-Münze", "eine Cent-Münze"]
            answer: "eine Euro-Münze"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Gibt es einen 1-Euro-Schein?"
            say: "Es gibt auch Geld aus Papier, die Geldscheine. Was glaubst du: Gibt es einen Ein-Euro-Schein?"
          - text: "5 € · 10 € · 20 €"
            say: "Nein! Für einen Euro gibt es nur die Münze. Der kleinste Schein ist fünf Euro. Das sind Geldscheine. Der Fünf-Euro-Schein ist grau, der Zehn-Euro-Schein ist rot und der Zwanzig-Euro-Schein ist blau."
            show: { drawn: coins, values: [500, 1000, 2000] }
          - text: "50 € · 100 €"
            say: "Es gibt auch Scheine, die noch mehr wert sind. Zum Beispiel fünfzig Euro und hundert Euro."
            show: { drawn: coins, values: [5000, 10000] }
          - text: "1 ct · 1 € · 5 €"
            say: "Jetzt ordnen wir nach dem Wert. Ein Cent ist am wenigsten wert. Ein Euro ist mehr. Der Fünf-Euro-Schein ist noch mehr wert. Jeder Schein ist mehr wert als jede Münze."
            show: { drawn: coins, values: [1, 100, 500] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wo ist der 10-Euro-Schein?"
                say: "Wo ist der Zehn-Euro-Schein?"
                options:
                  - { drawn: coins, values: [500] }
                  - { drawn: coins, values: [1000] }
                  - { drawn: coins, values: [2000] }
                answer: "1000"
                hints:
                  - "Auf jedem Schein steht seine Zahl."
                  - "Such die Zahl 10."
                  - "Der rote Schein mit 10 €."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Das ist ein 20-Euro-Schein."
                say: "Stimmt das? Das ist ein Zwanzig-Euro-Schein."
                show: { drawn: coins, values: [2000] }
                answer: true
                hints:
                  - "Lies die Zahl auf dem Schein."
                  - "Der Schein ist blau. Darauf steht 20."
                  - "Ja, das ist ein 20-Euro-Schein."
              - id: l2-f3
                type: image_multiple_choice
                text: "Was ist mehr wert?"
                say: "Was ist mehr wert, die Münze oder der Schein?"
                options:
                  - { drawn: coins, values: [200] }
                  - { drawn: coins, values: [500] }
                answer: "500"
                feedback:
                  "200": "Die 2-Euro-Münze ist die Münze mit dem höchsten Wert. Aber der kleinste Schein ist 5 €, und 5 € sind mehr als 2 €."
                hints:
                  - "Lies beide Zahlen."
                  - "2 Euro oder 5 Euro: Was ist mehr?"
                  - "Der 5-Euro-Schein."
              - id: l2-f4
                type: ordering
                text: "Ordne nach dem Wert. Fang mit dem kleinsten Wert an."
                say: "Ordne nach dem Wert. Fang mit dem an, was am wenigsten wert ist."
                options:
                  - { drawn: coins, values: [100] }
                  - { drawn: coins, values: [10] }
                  - { drawn: coins, values: [500] }
                slot_count: 3
                answer: ["10", "100", "500"]
                hints:
                  - "Cent-Münzen sind am wenigsten wert, dann kommen Euro-Münzen, dann Scheine."
                  - "Zuerst die Cent-Münze."
                  - "10 ct, dann 1 €, dann 5 €."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viel ist dieser Schein wert?"
                say: "Wie viel ist dieser Schein wert?"
                show: { drawn: coins, values: [5000] }
                options: ["50 €", "5 €", "50 ct"]
                answer: "50 €"
                hints:
                  - "Lies die Zahl auf dem Schein."
                  - "Auf einem Schein steht immer Euro, nie Cent."
                  - "50 €."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wo ist der 5-Euro-Schein?"
                say: "Wo ist der Fünf-Euro-Schein?"
                options:
                  - { drawn: coins, values: [5] }
                  - { drawn: coins, values: [500] }
                  - { drawn: coins, values: [5000] }
                answer: "500"
                hints: ["Ein Schein, und darauf steht nur eine 5."]
              - id: l2-s2
                type: true_false
                text: "Das ist ein 100-Euro-Schein."
                say: "Stimmt das? Das ist ein Hundert-Euro-Schein."
                show: { drawn: coins, values: [1000] }
                answer: false
                hints: ["Zähl die Nullen auf dem Schein."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welcher Schein ist mehr wert?"
                say: "Welcher Schein ist mehr wert?"
                options:
                  - { drawn: coins, values: [2000] }
                  - { drawn: coins, values: [1000] }
                answer: "2000"
                hints: ["10 oder 20: Was ist mehr?"]
              - id: l2-s4
                type: ordering
                text: "Ordne nach dem Wert. Fang mit dem kleinsten Wert an."
                say: "Ordne nach dem Wert. Fang mit dem an, was am wenigsten wert ist."
                options:
                  - { drawn: coins, values: [2000] }
                  - { drawn: coins, values: [200] }
                  - { drawn: coins, values: [20] }
                slot_count: 3
                answer: ["20", "200", "2000"]
                hints: ["Erst die Cent-Münze, dann die Euro-Münze, dann der Schein."]
              - id: l2-s5
                type: multiple_choice
                text: "Was ist mehr wert: 1 € oder 1 ct?"
                say: "Was ist mehr wert: ein Euro oder ein Cent?"
                options: ["1 €", "1 ct"]
                answer: "1 €"
                hints: ["Ein Euro sind hundert Cent."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wo ist der 20-Euro-Schein?"
                say: "Wo ist der Zwanzig-Euro-Schein?"
                options:
                  - { drawn: coins, values: [1000] }
                  - { drawn: coins, values: [2000] }
                  - { drawn: coins, values: [200] }
                answer: "2000"
              - id: l2-n2
                type: true_false
                text: "Das ist ein 5-Euro-Schein."
                say: "Stimmt das? Das ist ein Fünf-Euro-Schein."
                show: { drawn: coins, values: [500] }
                answer: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Was ist am meisten wert?"
                say: "Was ist am meisten wert?"
                options:
                  - { drawn: coins, values: [200] }
                  - { drawn: coins, values: [50] }
                  - { drawn: coins, values: [500] }
                answer: "500"
              - id: l2-n4
                type: ordering
                text: "Ordne nach dem Wert. Fang mit dem kleinsten Wert an."
                say: "Ordne nach dem Wert. Fang mit dem an, was am wenigsten wert ist."
                options:
                  - { drawn: coins, values: [500] }
                  - { drawn: coins, values: [50] }
                  - { drawn: coins, values: [5] }
                slot_count: 3
                answer: ["5", "50", "500"]
              - id: l2-n5
                type: ordering
                text: "Ordne nach dem Wert. Fang mit dem kleinsten Wert an."
                say: "Ordne alle vier nach dem Wert. Fang mit dem an, was am wenigsten wert ist."
                options:
                  - { drawn: coins, values: [1000] }
                  - { drawn: coins, values: [1] }
                  - { drawn: coins, values: [200] }
                  - { drawn: coins, values: [20] }
                slot_count: 4
                answer: ["1", "20", "200", "1000"]
                difficulty: stretch

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: coins
            type: image_multiple_choice
            text: "Wo ist die 5-Cent-Münze?"
            say: "Tipp auf die Fünf-Cent-Münze."
            options:
              - { drawn: coins, values: [5] }
              - { drawn: coins, values: [50] }
              - { drawn: coins, values: [500] }
            answer: "5"
          - id: l2-c2
            part: coins
            type: multiple_choice
            text: "Wie viel ist diese Münze wert?"
            say: "Wie viel ist diese Münze wert?"
            show: { drawn: coins, values: [200] }
            options: ["2 €", "2 ct", "20 €"]
            answer: "2 €"
          - id: l2-c3
            part: compare
            type: image_multiple_choice
            text: "Was ist mehr wert?"
            say: "Was ist mehr wert? Tipp darauf."
            options:
              - { drawn: coins, values: [200] }
              - { drawn: coins, values: [1000] }
            answer: "1000"
          - id: l2-c4
            part: notes
            type: true_false
            text: "Das ist ein 10-Euro-Schein."
            say: "Stimmt das? Das ist ein Zehn-Euro-Schein."
            show: { drawn: coins, values: [1000] }
            answer: true
          - id: l2-c5
            part: order
            type: ordering
            text: "Ordne nach dem Wert. Fang mit dem kleinsten Wert an."
            say: "Ordne nach dem Wert. Fang mit dem an, was am wenigsten wert ist."
            options:
              - { drawn: coins, values: [2000] }
              - { drawn: coins, values: [50] }
              - { drawn: coins, values: [500] }
              - { drawn: coins, values: [100] }
            slot_count: 4
            answer: ["50", "100", "500", "2000"]
          - id: l2-c6
            part: coins
            type: multiple_choice
            text: "Wie viel ist diese Münze wert?"
            say: "Wie viel ist diese Münze wert?"
            show: { drawn: coins, values: [10] }
            options: ["10 ct", "10 €", "1 ct"]
            answer: "10 ct"
          - id: l2-c7
