# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.double-halve-to-20
skill: math.numbers-to-20.double-halve-to-20
curriculum: de-DE
language: de
title:
  de: Verdoppeln und Halbieren bis 20
  en: Doubling and halving to 20
summary: >
  Doubling numbers to 10 and halving even numbers to 20. Lesson 1 doubles
  with the Zwanzigerfeld and dots (the same amount once more, like a
  mirror); lesson 2 halves by sharing fairly into two equal parts, links
  halving back to doubling, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.partition-to-10]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { de: [verdoppeln, das Doppelte, halbieren, die Hälfte, gleich viel, gerecht teilen] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, dots]
  facets: []
  parts:
    - { id: double, what: { de: Zahlen bis 10 verdoppeln, en: doubling numbers to 10 } }
    - { id: halve, what: { de: gerade Zahlen bis 20 halbieren und gerecht teilen, en: halving even numbers to 20 and sharing fairly } }
    - { id: link, what: { de: Halbieren über das Verdoppeln finden, en: finding halves from doubles } }
  misconceptions:
    - id: double-as-plus-two
      what: Thinks doubling means adding two (das Doppelte von 6 is 8)
      addressed: Learn says doubling is the same amount once more; options include n + 2, with feedback in the full stage
    - id: half-unequal
      what: Splits into two parts that are not equal and calls one a half
      addressed: lesson 2 Learn shares fairly, one each in turn; true/false tasks in the full and none stages show unequal splits
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Verdoppeln, en: Doubling }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 + 3 = _"
            say: "Drei plus drei."
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte sind es zusammen?"
            show: { drawn: zwanzigerfeld, filled: [10, 2] }
            options: ["12", "2", "21"]
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4"
            say: "Hier sind vier Punkte."
            show: { drawn: dots, count: 4, layout: dice }
          - text: "4 + 4 = 8"
            say: "Verdoppeln heißt: noch einmal genauso viele dazu. Vier und noch einmal vier sind acht. Das Doppelte von vier ist acht."
            show: { drawn: dots, groups: [4, 4], layout: dice }
          - text: "7 + 7 = 14"
            say: "Im Zwanzigerfeld: oben sieben, unten sieben. Sieben und sieben sind vierzehn. Das Doppelte von sieben ist vierzehn."
            show: { drawn: zwanzigerfeld, filled: [7, 7] }
          - text: "Das Doppelte: zweimal gleich viel"
            say: "Ein Trick: Verdoppeln ist wie ein Spiegel. Was auf der einen Seite ist, ist auf der anderen Seite noch einmal."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Das Doppelte von 5"
                say: "Was ist das Doppelte von fünf?"
                show: { drawn: dots, groups: [5, 5], layout: dice }
                options: ["10", "7", "6"]
                answer: "10"
                feedback:
                  "7": "Verdoppeln heißt nicht zwei dazu. Es kommen noch einmal fünf dazu."
                hints:
                  - "Fünf und noch einmal fünf."
                  - "Fünf plus fünf."
                  - "10."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "6 + 6 = _"
                say: "Verdopple sechs: sechs plus sechs."
                show: { drawn: zwanzigerfeld, filled: [6, 6] }
                answer: "12"
                hints:
                  - "Oben sechs, unten sechs."
                  - "Sechs und vier sind zehn, dann noch zwei."
                  - "12."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Das Doppelte von 3 ist 6."
                say: "Das Doppelte von drei ist sechs. Stimmt das?"
                answer: true
                hints:
                  - "Drei und noch einmal drei."
                  - "Drei plus drei ist sechs."
                  - "Ja."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem Doppelten."
                pairs:
                  - { left: { text: "2" }, right: { text: "4" } }
                  - { left: { text: "8" }, right: { text: "16" } }
                  - { left: { text: "10" }, right: { text: "20" } }
                hints:
                  - "Das Doppelte ist zweimal die Zahl."
                  - "Zwei plus zwei ist vier."
                  - "2 zu 4, 8 zu 16, 10 zu 20."
              - id: l1-f5
                type: multiple_choice
                text: "Das Doppelte von 9"
                say: "Was ist das Doppelte von neun?"
                show: { drawn: zwanzigerfeld, filled: [9, 9] }
                options: ["18", "11", "19"]
                answer: "18"
                hints:
                  - "Oben neun, unten neun."
                  - "Neun und eins sind zehn, dann noch acht."
                  - "18."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Das Doppelte von 3"
                say: "Was ist das Doppelte von drei?"
                options: ["6", "5", "33"]
                answer: "6"
                hints: ["Drei und noch einmal drei."]
              - id: l1-s2
                type: text_input
                text: "8 + 8 = _"
                say: "Verdopple acht: acht plus acht."
                show: { drawn: zwanzigerfeld, filled: [8, 8] }
                answer: "16"
                hints: ["Füll zuerst die Zehn auf."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Das Doppelte von 6 ist 8."
                say: "Das Doppelte von sechs ist acht. Stimmt das?"
                answer: false
                hints: ["Wie viele kommen beim Verdoppeln dazu?"]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem Doppelten."
                pairs:
                  - { left: { text: "1" }, right: { text: "2" } }
                  - { left: { text: "6" }, right: { text: "12" } }
                  - { left: { text: "9" }, right: { text: "18" } }
                hints: ["Rechne jede Zahl plus dieselbe Zahl."]
              - id: l1-s5
                type: text_input
                text: "Das Doppelte von 10"
                say: "Was ist das Doppelte von zehn?"
                answer: "20"
                hints: ["Zehn und noch einmal zehn."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das Doppelte von 2"
                say: "Was ist das Doppelte von zwei?"
                options: ["4", "3", "22"]
                answer: "4"
              - id: l1-n2
                type: text_input
                text: "7 + 7 = _"
                say: "Verdopple sieben."
                answer: "14"
              - id: l1-n3
                type: true_false
                text: "Stimmt das? Das Doppelte von 8 ist 16."
                say: "Das Doppelte von acht ist sechzehn. Stimmt das?"
                answer: true
              - id: l1-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrem Doppelten."
                pairs:
                  - { left: { text: "3" }, right: { text: "6" } }
                  - { left: { text: "5" }, right: { text: "10" } }
                  - { left: { text: "10" }, right: { text: "20" } }
              - id: l1-n5
                type: text_input
                text: "Das Doppelte von 9"
                say: "Was ist das Doppelte von neun?"
                answer: "18"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Das Doppelte von 6"
            say: "Was ist das Doppelte von sechs?"
            options: ["12", "8", "7"]
            answer: "12"
          - id: l1-c2
            type: text_input
            text: "5 + 5 = _"
            say: "Verdopple fünf."
            answer: "10"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Das Doppelte von 4 ist 6."
            say: "Das Doppelte von vier ist sechs. Stimmt das?"
            answer: false
          - id: l1-c4
            type: matching
            text: "Finde die Paare."
            say: "Welche Zahl ist das Doppelte? Verbinde die Paare."
            pairs:
              - { left: { text: "2" }, right: { text: "4" } }
              - { left: { text: "6" }, right: { text: "12" } }
              - { left: { text: "8" }, right: { text: "16" } }
          - id: l1-c5
            type: text_input
            text: "Das Doppelte von 7"
            say: "Was ist das Doppelte von sieben? Schreib die Zahl."
            answer: "14"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Das Doppelte von 10 ist 20."
            say: "Das Doppelte von zehn ist zwanzig. Stimmt das?"
            answer: true

  - n: 2
    title: { de: Halbieren, en: Halving }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Das Doppelte von 8"
            say: "Was ist das Doppelte von acht?"
            options: ["16", "10", "18"]
            answer: "16"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3 + 3 = _"
            say: "Verdopple drei."
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "10 → 5 und 5"
            say: "Zwei Kinder teilen zehn Kekse gerecht. Sie bekommen abwechselnd immer einen Keks, bis alle verteilt sind. Jedes Kind hat fünf. Die Hälfte von zehn ist fünf."
            show: { drawn: dots, groups: [5, 5], layout: row }
          - text: "16 → 8 und 8"
            say: "Halbieren heißt: in zwei gleich große Teile teilen. Die Hälfte von sechzehn ist acht, denn acht und acht sind sechzehn."
            show: { drawn: zwanzigerfeld, filled: [8, 8] }
          - text: "Halbieren ↔ Verdoppeln"
            say: "Halbieren ist das Gegenteil von Verdoppeln. Das Doppelte von sechs ist zwölf, die Hälfte von zwölf ist sechs. Wenn du die Verdopplungen kennst, kennst du auch die Hälften."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Hälfte von 8"
                say: "Was ist die Hälfte von acht?"
                show: { drawn: dots, groups: [4, 4], layout: row }
                options: ["4", "6", "16"]
                answer: "4"
                feedback:
                  "16": "Sechzehn ist das Doppelte. Die Hälfte ist kleiner. Teil acht in zwei gleiche Teile."
                hints:
                  - "Teil acht in zwei gleich große Teile."
                  - "Welche Zahl und noch einmal dieselbe sind acht?"
                  - "4 und 4 sind 8. Die Hälfte ist 4."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Zwei Kinder teilen 12 Murmeln. Ein Kind bekommt 7, das andere 5. Ist das gerecht geteilt?"
                say: "Zwei Kinder teilen zwölf Murmeln. Ein Kind bekommt sieben, das andere fünf. Ist das gerecht geteilt?"
                show: { drawn: dots, groups: [7, 5], layout: row }
                answer: false
                hints:
                  - "Sind die zwei Teile gleich groß?"
                  - "Sieben und fünf sind nicht gleich."
                  - "Nein, gerecht wäre sechs und sechs."
              - id: l2-f3
                type: text_input
                text: "Die Hälfte von 14"
                say: "Was ist die Hälfte von vierzehn?"
                show: { drawn: zwanzigerfeld, filled: [7, 7] }
                answer: "7"
                hints:
                  - "Welche Verdopplung ergibt vierzehn?"
                  - "Sieben und sieben sind vierzehn."
                  - "7."
              - id: l2-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrer Hälfte."
                pairs:
                  - { left: { text: "6" }, right: { text: "3" } }
                  - { left: { text: "4" }, right: { text: "2" } }
                  - { left: { text: "20" }, right: { text: "10" } }
                hints:
                  - "Die Hälfte und noch einmal die Hälfte ergibt die Zahl."
                  - "Drei und drei sind sechs."
                  - "6 zu 3, 4 zu 2, 20 zu 10."
              - id: l2-f5
                type: multiple_choice
                text: "Die Hälfte von 18"
                say: "Was ist die Hälfte von achtzehn?"
                options: ["9", "8", "36"]
                answer: "9"
                hints:
                  - "Welche Zahl verdoppelt ergibt achtzehn?"
                  - "Neun und neun sind achtzehn."
                  - "9."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Die Hälfte von 6"
                say: "Was ist die Hälfte von sechs?"
                show: { drawn: dots, groups: [3, 3], layout: row }
                options: ["3", "4", "12"]
                answer: "3"
                hints: ["Welche Verdopplung ergibt sechs?"]
              - id: l2-s2
                type: true_false
                text: "Zwei Kinder teilen 8 Bonbons. Jedes bekommt 4. Ist das gerecht geteilt?"
                say: "Zwei Kinder teilen acht Bonbons. Jedes bekommt vier. Ist das gerecht geteilt?"
                show: { drawn: dots, groups: [4, 4], layout: row }
                answer: true
                hints: ["Sind beide Teile gleich groß?"]
              - id: l2-s3
                type: text_input
                text: "Die Hälfte von 4"
                say: "Was ist die Hälfte von vier?"
                answer: "2"
                hints: ["Welche Zahl und noch einmal dieselbe sind vier?"]
              - id: l2-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrer Hälfte."
                pairs:
                  - { left: { text: "2" }, right: { text: "1" } }
                  - { left: { text: "14" }, right: { text: "7" } }
                  - { left: { text: "18" }, right: { text: "9" } }
                hints: ["Denk an die Verdopplungen."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Hälfte von 20"
                say: "Was ist die Hälfte von zwanzig?"
                options: ["10", "15", "40"]
                answer: "10"
                hints: ["Welche Zahl verdoppelt ergibt zwanzig?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Hälfte von 16"
                say: "Was ist die Hälfte von sechzehn?"
                options: ["8", "6", "32"]
                answer: "8"
              - id: l2-n2
                type: true_false
                text: "Zwei Kinder teilen 10 Karten. Ein Kind bekommt 6, das andere 4. Ist das gerecht geteilt?"
                say: "Zwei Kinder teilen zehn Karten. Ein Kind bekommt sechs, das andere vier. Ist das gerecht geteilt?"
                show: { drawn: dots, groups: [6, 4], layout: row }
                answer: false
              - id: l2-n3
                type: text_input
                text: "Die Hälfte von 18"
                say: "Was ist die Hälfte von achtzehn?"
                answer: "9"
              - id: l2-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Zahl mit ihrer Hälfte."
                pairs:
                  - { left: { text: "8" }, right: { text: "4" } }
                  - { left: { text: "14" }, right: { text: "7" } }
                  - { left: { text: "20" }, right: { text: "10" } }
              - id: l2-n5
                type: multiple_choice
                text: "Die Hälfte von 10"
                say: "Was ist die Hälfte von zehn?"
                options: ["5", "4", "20"]
                answer: "5"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: double
            type: multiple_choice
            text: "Das Doppelte von 7"
            say: "Was ist das Doppelte von sieben?"
            options: ["14", "9", "15"]
            answer: "14"
          - id: l2-c2
            part: halve
            type: text_input
            text: "Die Hälfte von 12"
            say: "Was ist die Hälfte von zwölf? Schreib die Zahl."
            answer: "6"
          - id: l2-c3
            part: halve
            type: true_false
            text: "Zwei Kinder teilen 14 Nüsse. Jedes bekommt 7. Ist das gerecht geteilt?"
            say: "Zwei Kinder teilen vierzehn Nüsse. Jedes bekommt sieben. Ist das gerecht geteilt?"
            answer: true
          - id: l2-c4
            part: double
            type: text_input
            text: "Das Doppelte von 4"
            say: "Was ist das Doppelte von vier? Schreib die Zahl."
            answer: "8"
          - id: l2-c5
            part: link
            type: multiple_choice
            text: "Das Doppelte von 8 ist 16. Was ist die Hälfte von 16?"
            say: "Das Doppelte von acht ist sechzehn. Was ist dann die Hälfte von sechzehn?"
            options: ["8", "14", "6"]
            answer: "8"
          - id: l2-c6
            part: double
            type: text_input
            text: "Das Doppelte von 6"
            say: "Was ist das Doppelte von sechs? Schreib die Zahl."
            answer: "12"
          - id: l2-c7
            part: double
            type: multiple_choice
            text: "Das Doppelte von 1"
            say: "Was ist das Doppelte von eins?"
            options: ["2", "1", "11"]
            answer: "2"
          - id: l2-c8
            part: double
            type: true_false
            text: "Stimmt das? Das Doppelte von 9 ist 11."
            say: "Das Doppelte von neun ist elf. Stimmt das?"
            answer: false
          - id: l2-c9
            part: double
            type: matching
            text: "Finde die Paare."
            say: "Welche Zahl ist das Doppelte? Verbinde die Paare."
            pairs:
              - { left: { text: "4" }, right: { text: "8" } }
              - { left: { text: "7" }, right: { text: "14" } }
              - { left: { text: "9" }, right: { text: "18" } }
          - id: l2-c10
            part: double
            type: text_input
            text: "Ein Schmetterling hat auf jeder Seite 8 Punkte. Wie viele Punkte hat er zusammen?"
            say: "Ein Schmetterling hat auf jeder Seite acht Punkte. Wie viele Punkte hat er zusammen?"
            answer: "16"
          - id: l2-c11
            part: halve
            type: multiple_choice
            text: "Ella und Tim teilen 18 Kekse gerecht. Wie viele Kekse bekommt jedes Kind?"
            say: "Ella und Tim teilen achtzehn Kekse gerecht. Wie viele Kekse bekommt jedes Kind?"
            options: ["7", "9", "16"]
            answer: "9"
          - id: l2-c12
            part: halve
            type: text_input
            text: "Die Hälfte von 2"
            say: "Was ist die Hälfte von zwei? Schreib die Zahl."
            answer: "1"
          - id: l2-c13
            part: halve
            type: true_false
            text: "Zwei Kinder teilen 16 Sticker. Ein Kind bekommt 9, das andere 7. Ist das gerecht geteilt?"
            say: "Zwei Kinder teilen sechzehn Sticker. Ein Kind bekommt neun, das andere sieben. Ist das gerecht geteilt?"
            show: { drawn: dots, groups: [9, 7], layout: row }
            answer: false
          - id: l2-c14
            part: halve
            type: text_input
            text: "Zwei Kinder teilen 20 Murmeln gerecht. Wie viele Murmeln bekommt jedes Kind?"
            say: "Zwei Kinder teilen zwanzig Murmeln gerecht. Wie viele Murmeln bekommt jedes Kind?"
            answer: "10"
          - id: l2-c15
            part: halve
            type: multiple_choice
            text: "Zwei Kinder teilen 4 Äpfel gerecht. Wie viele Äpfel bekommt jedes Kind?"
            say: "Zwei Kinder teilen vier Äpfel gerecht. Wie viele Äpfel bekommt jedes Kind?"
            show: { drawn: dots, count: 4, layout: row }
            options: ["2", "1", "8"]
            answer: "2"
          - id: l2-c16
            part: link
            type: text_input
            text: "9 + 9 = 18. Wie viel ist dann die Hälfte von 18?"
            say: "Neun plus neun ist achtzehn. Wie viel ist dann die Hälfte von achtzehn?"
            answer: "9"
          - id: l2-c17
            part: link
            type: true_false
            text: "Stimmt das? Die Hälfte von 10 ist 5, weil 5 + 5 = 10 ist."
            say: "Die Hälfte von zehn ist fünf, weil fünf plus fünf zehn ist. Stimmt das?"
            answer: true
          - id: l2-c18
            part: link
            type: multiple_choice
            text: "Welche Verdopplung hilft bei der Hälfte von 12?"
            say: "Du suchst die Hälfte von zwölf. Welche Verdopplung hilft dir?"
            options: ["6 + 6", "10 + 2", "12 + 12"]
            answer: "6 + 6"
          - id: l2-c19
            part: link
            type: true_false
            text: "Stimmt das? Die Hälfte von 8 ist 16."
            say: "Die Hälfte von acht ist sechzehn. Stimmt das?"
            answer: false
          - id: l2-c20
            part: link
            type: matching
            text: "Doppelt oder halb?"
            say: "Verbinde jede Aufgabe mit ihrem Ergebnis."
            pairs:
              - { left: { text: "die Hälfte von 10" }, right: { text: "5" } }
              - { left: { text: "das Doppelte von 10" }, right: { text: "20" } }
              - { left: { text: "die Hälfte von 20" }, right: { text: "10" } }
