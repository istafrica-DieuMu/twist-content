# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.missing-addend
skill: math.add-sub-to-20.missing-addend
curriculum: de-DE
language: de
title:
  de: Ergänzen bis 10
  en: Missing numbers to 10
summary: >
  Ergänzungsaufgaben (3 + _ = 8): how many more are needed? Lesson 1 fills
  up the ten-frame and counts on from the first number to the total;
  lesson 2 finds the partner number to 10 for every number (die
  Zehnerfreunde) and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-to-10]
  also_practises: [math.numbers-to-20.partition-to-10]
  vocabulary: { de: [ergänzen, fehlen, Partnerzahl, Zehnerfreunde, bis] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame, number-line]
  facets: []
  parts:
    - { id: picture, what: { de: "am Zehnerfeld oder Zahlenstrahl sehen, wie viele fehlen", en: "seeing how many are missing on a ten-frame or number line" } }
    - { id: missing, what: { de: Ergänzungsaufgaben bis 10 lösen, en: solving missing-number sums to 10 } }
    - { id: partner, what: { de: die Partnerzahl bis 10 finden, en: finding the partner number to 10 } }
  misconceptions:
    - id: add-the-two
      what: Adds the two numbers shown (3 + _ = 8 answered 11)
      addressed: Learn reads the sum as "drei und wie viel sind acht?"; feedback on the sum says the 8 is the total
    - id: count-on-includes-start
      what: Counts the start number when counting on to the total
      addressed: Learn counts the jumps, not the numbers
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wie viele fehlen?", en: "How many are missing?" }
    goal:
      de: "Find heraus, wie viele noch fehlen. Von 3 bis 8 sind es fünf Sprünge."
      en: "Find out how many more you need. From 3 to 8 is five jumps."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "5 + 3 = _"
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "Zerlege die 7."
            say: "Sieben Punkte, rot und blau. Wie viele rote, wie viele blaue?"
            show: { drawn: ten-frame, filled: 7, colour_split: [4, 3] }
            frame: "7 = _ + _"
            options: ["3", "4", "7"]
            answer: ["4", "3"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + _ = 8"
            say: "Drei plus wie viel gleich acht? Wir haben drei und wollen acht haben. Was glaubst du: Wie viele fehlen?"
            show: { drawn: ten-frame, filled: 3 }
          - text: "3 … 8"
            say: "Zähl die Sprünge von drei bis acht: vier, fünf, sechs, sieben, acht. Das sind fünf Sprünge."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[3, 1], [4, 1], [5, 1], [6, 1], [7, 1]] }
          - text: "3 + 5 = 8"
            say: "Es fehlen fünf. Drei plus fünf gleich acht."
            show: { drawn: ten-frame, filled: 8, colour_split: [3, 5] }
          - text: "Wusstest du? Das Zeichen = gibt es seit fast 500 Jahren."
            say: "Wusstest du? Das Gleichheitszeichen hat sich ein Mann namens Robert Recorde ausgedacht, vor fast fünfhundert Jahren. Er fand: Nichts ist so gleich wie zwei gleich lange Striche."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Vier Punkte sind da. Wie viele fehlen bis sechs?"
                show: { drawn: ten-frame, filled: 4 }
                frame: "4 + _ = 6"
                options: ["2", "6", "10"]
                answer: ["2"]
                feedback:
                  "10": "Die 6 ist das Ergebnis. Von 4 bis 6 sind es nur zwei."
                hints:
                  - "Von 4 bis 6."
                  - "Fünf, sechs: zwei Sprünge."
                  - "4 + 2 = 6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele fehlen bis 5?"
                say: "Drei Punkte sind da. Wie viele fehlen, bis die obere Reihe voll ist?"
                show: { drawn: ten-frame, filled: 3 }
                options: ["1", "2", "3"]
                answer: "2"
                hints:
                  - "Eine volle Reihe hat fünf Plätze."
                  - "Zähl die leeren Plätze oben."
                  - "3 + 2 = 5."
              - id: l1-f3
                type: text_input
                text: "5 + _ = 7"
                say: "Fünf plus wie viel gleich sieben?"
                answer: "2"
                hints:
                  - "Fang bei 5 an."
                  - "Sechs, sieben: zwei Sprünge."
                  - "2."
              - id: l1-f4
                type: multiple_choice
                text: "2 + _ = 5"
                say: "Fang bei zwei an und spring bis fünf. Wie viele Sprünge sind das?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                options: ["2", "5", "3"]
                answer: "3"
                hints:
                  - "Fang bei der Zwei an."
                  - "Zähl die Sprünge: drei, vier, fünf."
                  - "Drei Sprünge: 2 + 3 = 5."
              - id: l1-f5
                type: multiple_choice
                text: "6 + _ = 9"
                say: "Sechs plus wie viel gleich neun?"
                options: ["3", "9", "15"]
                answer: "3"
                feedback:
                  "15": "Neun ist das Ergebnis. Von 6 bis 9 sind es drei."
                hints:
                  - "Von 6 bis 9."
                  - "Sieben, acht, neun."
                  - "3."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 1 + 4 = 5"
                answer: true
                hints:
                  - "Von 1 bis 5."
                  - "Vier Sprünge."
                  - "Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Zwei Punkte sind da. Wie viele fehlen bis sieben?"
                show: { drawn: ten-frame, filled: 2 }
                frame: "2 + _ = 7"
                options: ["5", "7", "9"]
                answer: ["5"]
                hints: ["Von 2 bis 7."]
              - id: l1-s2
                type: text_input
                text: "4 + _ = 8"
                say: "Vier plus wie viel gleich acht?"
                answer: "4"
                hints: ["Von 4 bis 8."]
              - id: l1-s3
                type: multiple_choice
                text: "Ben hat 7 Sticker. Er will 9 haben. 7 + _ = 9"
                say: "Ben hat sieben Sticker. Er will neun haben. Sieben plus wie viel gleich neun?"
                show: { object: sticker, count: 7 }
                options: ["2", "9", "16"]
                answer: "2"
                feedback:
                  "16": "Sechzehn Sticker? Dann klebt Ben ja das ganze Zimmer voll! Von sieben bis neun fehlen nur ein paar."
                hints: ["Acht, neun."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 3 + 3 = 7"
                answer: false
                hints: ["Drei und drei."]
              - id: l1-s5
                type: text_input
                text: "1 + _ = 6"
                say: "Eins plus wie viel gleich sechs?"
                answer: "5"
                hints: ["Von 1 bis 6."]
              - id: l1-s6
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Sechs Punkte sind da. Wie viele fehlen bis acht?"
                show: { drawn: ten-frame, filled: 6 }
                frame: "6 + _ = 8"
                options: ["2", "8", "14"]
                answer: ["2"]
                hints: ["Sieben, acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "3 + _ = 7"
                say: "Drei plus wie viel gleich sieben?"
                answer: "4"
              - id: l1-n2
                type: multiple_choice
                text: "5 + _ = 9"
                say: "Fünf plus wie viel gleich neun?"
                options: ["4", "9", "14"]
                answer: "4"
              - id: l1-n3
                type: fill_in_blank
                text: "Wie viele fehlen?"
                say: "Ein Punkt ist da. Wie viele fehlen bis vier?"
                show: { drawn: ten-frame, filled: 1 }
                frame: "1 + _ = 4"
                options: ["3", "4", "5"]
                answer: ["3"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 2 + 6 = 8"
                answer: true
              - id: l1-n5
                type: text_input
                text: "4 + _ = 9"
                say: "Vier plus wie viel gleich neun?"
                answer: "5"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "2 + _ = 6"
            say: "Zwei plus wie viel gleich sechs?"
            answer: "4"
          - id: l1-c2
            type: multiple_choice
            text: "6 + _ = 8"
            say: "Sechs plus wie viel gleich acht?"
            options: ["2", "8", "14"]
            answer: "2"
          - id: l1-c3
            type: fill_in_blank
            text: "Wie viele fehlen?"
            say: "Fünf Punkte sind da. Wie viele fehlen bis neun?"
            show: { drawn: ten-frame, filled: 5 }
            frame: "5 + _ = 9"
            options: ["4", "9", "14"]
            answer: ["4"]
          - id: l1-c4
            type: text_input
            text: "1 + _ = 9"
            say: "Eins plus wie viel gleich neun?"
            answer: "8"
          - id: l1-c5
            type: multiple_choice
            text: "5 + _ = 8"
            say: "Fünf plus wie viel gleich acht?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            options: ["3", "5", "8"]
            answer: "3"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 3 + 4 = 7"
            answer: true

  - n: 2
    title: { de: Die Zehnerfreunde, en: Partners to 10 }
    goal:
      de: "Find zu jeder Zahl ihren Zehnerfreund. Sieben und drei sind zusammen zehn."
      en: "Find the partner that makes 10 for each number. Seven and three make ten."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "5 + _ = 8"
            say: "Fünf plus wie viel gleich acht?"
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "3 + _ = 5"
            say: "Drei plus wie viel gleich fünf?"
            options: ["2", "5", "8"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie viele Plätze sind leer?"
            say: "Im Zehnerfeld sind sieben Punkte. Was glaubst du: Wie viele Plätze sind noch leer?"
            show: { drawn: ten-frame, filled: 7 }
          - text: "7 + 3 = 10"
            say: "Drei Plätze sind leer. Sieben und drei sind zehn. Sieben und drei sind Zehnerfreunde."
            show: { drawn: ten-frame, filled: 7 }
          - text: "1 + 9, 2 + 8, 3 + 7, 4 + 6, 5 + 5"
            say: "Alle Zehnerfreunde: eins und neun, zwei und acht, drei und sieben, vier und sechs, fünf und fünf."
          - text: "Leere Plätze zählen"
            say: "Ein Trick: Wie viele Plätze im Zehnerfeld sind noch leer? Das ist der Zehnerfreund."
            show: { drawn: ten-frame, filled: 6 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "In den Eierkarton passen 10 Eier. 8 sind drin. Wie viele fehlen bis 10?"
                say: "In den Eierkarton passen zehn Eier. Acht sind schon drin. Wie viele fehlen bis zehn?"
                show: { drawn: ten-frame, filled: 8 }
                options: ["1", "2", "8"]
                answer: "2"
                hints:
                  - "Zähl die leeren Plätze."
                  - "Zwei Plätze sind leer."
                  - "8 + 2 = 10."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Zehnerfreunde"
                say: "Vier und wie viel sind zehn?"
                show: { drawn: ten-frame, filled: 4 }
                frame: "4 + _ = 10"
                options: ["5", "6", "14"]
                answer: ["6"]
                hints:
                  - "Wie viele Plätze sind leer, wenn vier voll sind?"
                  - "Sechs."
                  - "4 + 6 = 10."
              - id: l2-f3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde die Zehnerfreunde."
                pairs:
                  - { left: { text: "1" }, right: { text: "9" } }
                  - { left: { text: "3" }, right: { text: "7" } }
                  - { left: { text: "6" }, right: { text: "4" } }
                hints:
                  - "Zusammen müssen es zehn sein."
                  - "Eins und neun."
                  - "1 und 9, 3 und 7, 6 und 4."
              - id: l2-f4
                type: text_input
                text: "2 + _ = 10"
                say: "Zwei plus wie viel gleich zehn?"
                answer: "8"
                hints:
                  - "Zehnerfreunde."
                  - "Zwei und acht."
                  - "8."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 6 + 3 = 10"
                answer: false
                hints:
                  - "Wie viel sind sechs und drei?"
                  - "Neun."
                  - "Nein, 6 + 4 = 10."
              - id: l2-f6
                type: multiple_choice
                text: "Wie viele fehlen bis 10?"
                show: { drawn: ten-frame, filled: 3 }
                options: ["6", "7", "3"]
                answer: "7"
                hints:
                  - "Zähl die leeren Plätze."
                  - "Unten fünf leer, oben zwei leer."
                  - "7."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele fehlen bis 10?"
                show: { drawn: ten-frame, filled: 9 }
                options: ["1", "2", "9"]
                answer: "1"
                hints: ["Ein Platz ist leer."]
              - id: l2-s2
                type: fill_in_blank
                text: "Zehnerfreunde"
                say: "Sieben und wie viel sind zehn?"
                frame: "7 + _ = 10"
                options: ["2", "3", "17"]
                answer: ["3"]
                hints: ["Stell dir das Zehnerfeld vor: 7 Plätze sind voll. Wie viele sind leer?"]
              - id: l2-s3
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde die Zehnerfreunde."
                pairs:
                  - { left: { text: "2" }, right: { text: "8" } }
                  - { left: { text: "4" }, right: { text: "6" } }
                  - { left: { text: "9" }, right: { text: "1" } }
                hints: ["Zusammen zehn."]
              - id: l2-s4
                type: text_input
                text: "5 + _ = 10"
                say: "Fünf plus wie viel gleich zehn?"
                answer: "5"
                hints: ["Denk an das Zehnerfeld: 5 und 5 sind zwei volle Reihen."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 8 + 2 = 10"
                answer: true
                hints: ["Zehnerfreunde."]
              - id: l2-s6
                type: multiple_choice
                text: "Wie viele fehlen bis 10?"
                show: { drawn: ten-frame, filled: 4 }
                options: ["5", "6", "4"]
                answer: "6"
                hints: ["Zähl die leeren Plätze."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele fehlen bis 10?"
                show: { drawn: ten-frame, filled: 6 }
                options: ["3", "4", "6"]
                answer: "4"
              - id: l2-n2
                type: fill_in_blank
                text: "Zehnerfreunde"
                say: "Eins und wie viel sind zehn?"
                frame: "1 + _ = 10"
                options: ["8", "9", "11"]
                answer: ["9"]
              - id: l2-n3
                type: text_input
                text: "3 + _ = 10"
                say: "Drei plus wie viel gleich zehn?"
                answer: "7"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 7 + 2 = 10"
                answer: false
              - id: l2-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde die Zehnerfreunde."
                pairs:
                  - { left: { text: "6" }, right: { text: "4" } }
                  - { left: { text: "8" }, right: { text: "2" } }
                  - { left: { text: "3" }, right: { text: "7" } }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: missing
            type: text_input
            text: "4 + _ = 7"
            say: "Vier plus wie viel gleich sieben?"
            answer: "3"
          - id: l2-c2
            part: picture
            type: fill_in_blank
            text: "Wie viele fehlen?"
            say: "Zwei Punkte sind da. Wie viele fehlen bis neun?"
            show: { drawn: ten-frame, filled: 2 }
            frame: "2 + _ = 9"
            options: ["9", "7", "11"]
            answer: ["7"]
          - id: l2-c3
            part: partner
            type: multiple_choice
            text: "Wie viele fehlen bis 10?"
            show: { drawn: ten-frame, filled: 2 }
            options: ["7", "8", "2"]
            answer: "8"
          - id: l2-c4
            part: partner
            type: text_input
            text: "6 + _ = 10"
            say: "Sechs plus wie viel gleich zehn?"
            answer: "4"
          - id: l2-c5
            part: partner
            type: true_false
            text: "Stimmt das? 9 + 1 = 10"
            answer: true
          - id: l2-c6
            part: picture
            type: fill_in_blank
            text: "Wie viele fehlen?"
            say: "Fünf Punkte sind da. Wie viele fehlen bis sieben?"
            show: { drawn: ten-frame, filled: 5 }
            frame: "5 + _ = 7"
            options: ["2", "7", "12"]
            answer: ["2"]
          - id: l2-c7
            part: picture
            type: multiple_choice
            text: "Wie viele fehlen bis 8?"
            say: "Ein Punkt ist da. Wie viele fehlen bis acht?"
            show: { drawn: ten-frame, filled: 1 }
            options: ["6", "7", "9"]
            answer: "7"
          - id: l2-c8
            part: picture
            type: multiple_choice
            text: "3 + _ = 6"
            say: "Drei plus wie viel gleich sechs?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            options: ["3", "6", "9"]
            answer: "3"
          - id: l2-c9
            part: picture
            type: fill_in_blank
            text: "Wie viele fehlen?"
            say: "Vier Punkte sind da. Wie viele fehlen bis fünf?"
            show: { drawn: ten-frame, filled: 4 }
            frame: "4 + _ = 5"
            options: ["1", "5", "9"]
            answer: ["1"]
          - id: l2-c10
            part: picture
            type: multiple_choice
            text: "1 + _ = 5"
            say: "Eins plus wie viel gleich fünf?"
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            options: ["4", "5", "6"]
            answer: "4"
          - id: l2-c11
            part: picture
            type: fill_in_blank
            text: "Wie viele fehlen?"
            say: "Vier Punkte sind da. Wie viele fehlen bis neun?"
            show: { drawn: ten-frame, filled: 4 }
            frame: "4 + _ = 9"
            options: ["5", "9", "13"]
            answer: ["5"]
          - id: l2-c12
            part: missing
            type: text_input
            text: "7 + _ = 8"
            say: "Sieben plus wie viel gleich acht?"
            answer: "1"
          - id: l2-c13
            part: missing
            type: multiple_choice
            text: "2 + _ = 4"
            say: "Zwei plus wie viel gleich vier?"
            options: ["2", "4", "6"]
            answer: "2"
          - id: l2-c14
            part: missing
            type: text_input
            text: "Mia hat 6 Murmeln. Sie will 9 haben. Wie viele fehlen ihr noch?"
            say: "Mia hat sechs Murmeln. Sie will neun haben. Wie viele fehlen ihr noch?"
            show: { object: marble, count: 6, layout: row }
            answer: "3"
          - id: l2-c15
            part: missing
            type: true_false
            text: "Stimmt das? 5 + 2 = 8"
            answer: false
          - id: l2-c16
            part: missing
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Zwei plus wie viel gleich acht?"
            frame: "2 + _ = 8"
            options: ["6", "8", "10"]
            answer: ["6"]
          - id: l2-c17
            part: missing
            type: multiple_choice
            text: "1 + _ = 7"
            say: "Eins plus wie viel gleich sieben?"
            options: ["6", "7", "8"]
            answer: "6"
          - id: l2-c18
            part: partner
            type: matching
            text: "Was passt zusammen?"
            say: "Verbinde jede Zahl mit ihrem Zehnerfreund."
            pairs:
              - { left: { text: "7" }, right: { text: "3" } }
              - { left: { text: "1" }, right: { text: "9" } }
              - { left: { text: "8" }, right: { text: "2" } }
          - id: l2-c19
            part: partner
            type: fill_in_blank
            text: "In eine Schachtel passen 10 Eier. 8 sind schon drin. Wie viele passen noch hinein?"
            say: "In eine Schachtel passen zehn Eier. Acht sind schon drin. Wie viele passen noch hinein?"
            show: { object: egg, count: 8, layout: row }
            frame: "8 + _ = 10"
            options: ["2", "8", "18"]
            answer: ["2"]
          - id: l2-c20
            part: partner
            type: true_false
            text: "Stimmt das? 4 + 5 = 10"
            answer: false
