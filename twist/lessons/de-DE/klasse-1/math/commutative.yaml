# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.commutative
skill: math.add-sub-to-20.commutative
curriculum: de-DE
language: de
title:
  de: Tauschaufgaben
  en: Turnaround sums
summary: >
  Swapping the two numbers of a plus sum gives the same result: 2 + 6 and
  6 + 2 are both 8. Lesson 1 sees this in the ten-frame, turned round;
  lesson 2 uses it to make adding easier (start with the bigger number),
  learns that it does not work for minus, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-to-10]
  also_practises: []
  vocabulary: { de: [Tauschaufgabe, tauschen, gleich, größere Zahl] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame]
  facets: []
  parts:
    - { id: find, what: { de: die Tauschaufgabe finden, en: finding the turnaround sum } }
    - { id: same-result, what: { de: "wissen, dass Tauschaufgaben dasselbe Ergebnis haben", en: knowing that turnaround sums have the same result } }
    - { id: easier, what: { de: "mit der größeren Zahl anfangen, damit es leichter geht", en: starting with the bigger number to make adding easier } }
    - { id: not-minus, what: { de: "wissen, dass man Minusaufgaben nicht tauschen kann", en: knowing that subtractions cannot be swapped } }
  misconceptions:
    - id: swap-changes-result
      what: Works out both sums from scratch, not seeing they are equal
      addressed: Learn shows 2 + 6 and 6 + 2 as two frames of eight counters; the parts swap, the total stays
    - id: swap-minus
      what: Swaps the numbers in a minus sum too (5 − 2 = 2 − 5)
      addressed: lesson 2 Learn shows that a minus sum cannot be swapped; a true/false task in each stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Gleich viel, en: The same amount }
    goal:
      de: "Tausch die beiden Zahlen und schau, was passiert. 2 + 6 und 6 + 2 sind beide 8."
      en: "Swap the two numbers and see what happens. 2 + 6 and 6 + 2 both make 8."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "4 + 2 = _"
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "2 + 4 = _"
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "2 + 6"
            say: "Im Zehnerfeld sind zwei rote und sechs blaue Punkte. Zwei plus sechs. Gleich tauschen wir die Zahlen: sechs plus zwei. Was glaubst du: Sind es dann mehr Punkte, weniger oder gleich viele?"
            show: { drawn: ten-frame, filled: 8, colour_split: [2, 6] }
          - text: "6 + 2"
            say: "Jetzt tauschen wir: erst sechs, dann zwei. Sechs plus zwei. Es sind wieder acht Punkte."
            show: { drawn: ten-frame, filled: 8, colour_split: [6, 2] }
          - text: "2 + 6 = 6 + 2 = 8"
            say: "Gleich viele! Beide Aufgaben haben dasselbe Ergebnis: acht. Wenn du die Zahlen tauschst, bekommst du die Tauschaufgabe."
          - text: "Wusstest du? OTTO heißt von hinten gelesen auch OTTO."
            say: "Wusstest du? Den Namen Otto kannst du von vorne und von hinten lesen. Es bleibt immer Otto. Bei Plusaufgaben ist es ähnlich: Du tauschst vorne und hinten, und es kommt dasselbe heraus."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt die Tauschaufgabe von 3 + 4?"
                options: ["4 + 3", "3 + 3", "4 − 3"]
                answer: "4 + 3"
                hints:
                  - "Tauschen heißt: Die Zahlen wechseln den Platz."
                  - "Die 4 kommt nach vorne."
                  - "4 + 3."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Schreib die Tauschaufgabe."
                say: "Eins plus fünf. Schreib die Tauschaufgabe."
                frame: "1 + 5 = _ + _"
                options: ["1", "5", "6"]
                answer: ["5", "1"]
                hints:
                  - "Tausch die beiden Zahlen."
                  - "Die 5 nach vorne."
                  - "5 + 1."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 2 + 7 = 7 + 2"
                answer: true
                hints:
                  - "Es sind dieselben Zahlen."
                  - "Beides ergibt neun."
                  - "Ja."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit ihrer Tauschaufgabe."
                pairs:
                  - { left: { text: "1 + 8" }, right: { text: "8 + 1" } }
                  - { left: { text: "3 + 6" }, right: { text: "6 + 3" } }
                  - { left: { text: "2 + 5" }, right: { text: "5 + 2" } }
                hints:
                  - "Welche Aufgabe hat dieselben Zahlen?"
                  - "1 + 8 und 8 + 1."
                  - "1 + 8 zu 8 + 1, 3 + 6 zu 6 + 3, 2 + 5 zu 5 + 2."
              - id: l1-f5
                type: multiple_choice
                text: "3 + 5 = 8. Wie viel ist 5 + 3?"
                options: ["7", "8", "9"]
                answer: "8"
                hints:
                  - "Es ist die Tauschaufgabe."
                  - "Tauschaufgaben haben dasselbe Ergebnis."
                  - "8."
              - id: l1-f6
                type: fill_in_blank
                text: "Schreib die Tauschaufgabe."
                say: "Rote und blaue Punkte: vier plus drei. Schreib die Tauschaufgabe."
                show: { drawn: ten-frame, filled: 7, colour_split: [4, 3] }
                frame: "4 + 3 = _ + _"
                options: ["3", "4", "7"]
                answer: ["3", "4"]
                hints:
                  - "Tausch vier und drei."
                  - "Die 3 nach vorne."
                  - "3 + 4."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie heißt die Tauschaufgabe von 6 + 1?"
                options: ["1 + 6", "6 + 6", "6 − 1"]
                answer: "1 + 6"
                hints: ["Die Zahlen wechseln den Platz."]
              - id: l1-s2
                type: fill_in_blank
                text: "Schreib die Tauschaufgabe."
                say: "Zwei plus drei. Schreib die Tauschaufgabe."
                frame: "2 + 3 = _ + _"
                options: ["2", "3", "5"]
                answer: ["3", "2"]
                hints: ["Tausch die beiden Zahlen."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? 4 + 5 = 5 + 3"
                answer: false
                hints: ["Sind es dieselben Zahlen?"]
              - id: l1-s4
                type: multiple_choice
                text: "2 + 6 = 8. Wie viel ist 6 + 2?"
                options: ["7", "8", "4"]
                answer: "8"
                hints: ["Das ist die Tauschaufgabe."]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit ihrer Tauschaufgabe."
                pairs:
                  - { left: { text: "4 + 1" }, right: { text: "1 + 4" } }
                  - { left: { text: "2 + 7" }, right: { text: "7 + 2" } }
                  - { left: { text: "3 + 4" }, right: { text: "4 + 3" } }
                hints: ["Dieselben Zahlen."]
              - id: l1-s6
                type: true_false
                text: "Stimmt das? 1 + 9 = 9 + 1"
                answer: true
                hints: ["Beides ergibt zehn."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie heißt die Tauschaufgabe von 5 + 4?"
                options: ["4 + 5", "5 + 5", "5 − 4"]
                answer: "4 + 5"
              - id: l1-n2
                type: fill_in_blank
                text: "Schreib die Tauschaufgabe."
                say: "Drei plus sieben. Schreib die Tauschaufgabe."
                frame: "3 + 7 = _ + _"
                options: ["3", "7", "10"]
                answer: ["7", "3"]
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 6 + 3 = 3 + 6"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "1 + 7 = 8. Wie viel ist 7 + 1?"
                options: ["6", "8", "9"]
                answer: "8"
              - id: l1-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Aufgabe mit ihrer Tauschaufgabe."
                pairs:
                  - { left: { text: "5 + 3" }, right: { text: "3 + 5" } }
                  - { left: { text: "8 + 2" }, right: { text: "2 + 8" } }
                  - { left: { text: "6 + 1" }, right: { text: "1 + 6" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie heißt die Tauschaufgabe von 2 + 5?"
            options: ["5 + 2", "2 + 2", "5 − 2"]
            answer: "5 + 2"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? 3 + 4 = 4 + 3"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "4 + 6 = 10. Wie viel ist 6 + 4?"
            options: ["9", "10", "11"]
            answer: "10"
          - id: l1-c4
            type: fill_in_blank
            text: "Schreib die Tauschaufgabe."
            say: "Eins plus drei. Schreib die Tauschaufgabe."
            frame: "1 + 3 = _ + _"
            options: ["1", "3", "4"]
            answer: ["3", "1"]
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 3 + 5 = 5 + 4"
            answer: false
          - id: l1-c6
            type: matching
            text: "Finde die Tauschaufgaben."
            say: "Welche Aufgaben sind Tauschaufgaben? Verbinde sie."
            pairs:
              - { left: { text: "5 + 4" }, right: { text: "4 + 5" } }
              - { left: { text: "1 + 2" }, right: { text: "2 + 1" } }
              - { left: { text: "6 + 4" }, right: { text: "4 + 6" } }

  - n: 2
    title: { de: Tauschen macht es leichter, en: Swapping makes it easier }
    goal:
      de: "Fang bei der größeren Zahl an, dann geht es schneller. Bei 2 + 7 rechnest du lieber 7 + 2."
      en: "Start with the bigger number, it is quicker. Work out 2 + 7 as 7 + 2."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie heißt die Tauschaufgabe von 1 + 6?"
            options: ["6 + 1", "1 + 1", "6 − 1"]
            answer: "6 + 1"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? 2 + 5 = 5 + 2"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "2 + 7"
            say: "Zwei plus sieben. Was glaubst du: Fängst du besser bei der Zwei an oder bei der Sieben?"
          - text: "7 + 2"
            say: "Bei der Sieben! Von zwei aus sieben weiterzuzählen dauert lange. Tausch die Zahlen: sieben plus zwei."
          - text: "7 … 8, 9"
            say: "Jetzt fängst du bei sieben an und zählst nur zwei weiter: acht, neun. Fang immer bei der größeren Zahl an."
          - text: "5 − 2 ≠ 2 − 5"
            say: "Aber Vorsicht: Minusaufgaben kann man nicht tauschen. Fünf minus zwei ist drei. Von zwei kann man nicht fünf wegnehmen."
            show: { drawn: ten-frame, filled: 5, cross: 2 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Mit welcher Zahl fängst du an? 1 + 8"
                say: "Eins plus acht. Mit welcher Zahl fängst du am besten an?"
                options: ["8", "1"]
                answer: "8"
                option_audio: false
                hints:
                  - "Fang bei der größeren Zahl an."
                  - "Acht ist größer."
                  - "Fang bei 8 an und zähl einen weiter."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Auf dem Spielplatz sind 2 Kinder. 8 kommen dazu. 2 + 8 = _"
                say: "Auf dem Spielplatz sind zwei Kinder. Acht kommen dazu. Zwei plus acht. Tausch die Zahlen, wenn es hilft."
                show: { object: child, groups: [2, 8] }
                answer: "10"
                hints:
                  - "Fang bei 8 an."
                  - "Neun, zehn."
                  - "10."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 6 − 2 = 2 − 6"
                answer: false
                feedback:
                  "true": "Minusaufgaben kann man nicht tauschen. Von zwei kann man nicht sechs wegnehmen."
                hints:
                  - "Kann man Minusaufgaben tauschen?"
                  - "Nein, nur Plusaufgaben."
                  - "Nein."
              - id: l2-f4
                type: text_input
                text: "3 + 6 = _"
                say: "Drei plus sechs. Tausch die Zahlen, wenn es hilft."
                answer: "9"
                hints:
                  - "Fang bei 6 an."
                  - "Sieben, acht, neun."
                  - "9."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Aufgabe ist leichter zu rechnen?"
                options: ["7 + 1", "1 + 7"]
                answer: "7 + 1"
                option_audio: false
                feedback:
                  "1 + 7": "Bei der Eins anfangen und sieben weiterzählen? Das dauert ja so lange wie bei einer Schnecke! Fang lieber bei der Sieben an."
                hints:
                  - "Bei welcher fängst du mit der größeren Zahl an?"
                  - "Bei 7 + 1 zählst du nur einen weiter."
                  - "7 + 1."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 4 + 3 = 3 + 4"
                answer: true
                hints:
                  - "Das ist eine Plusaufgabe."
                  - "Plusaufgaben kann man tauschen."
                  - "Ja."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Mit welcher Zahl fängst du an? 2 + 7"
                say: "Zwei plus sieben. Mit welcher Zahl fängst du am besten an?"
                options: ["2", "7"]
                answer: "7"
                option_audio: false
                hints: ["Die größere Zahl."]
              - id: l2-s2
                type: text_input
                text: "1 + 9 = _"
                answer: "10"
                hints: ["Fang bei 9 an."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? 8 − 3 = 3 − 8"
                answer: false
                hints: ["Minus kann man nicht tauschen."]
              - id: l2-s4
                type: text_input
                text: "2 + 6 = _"
                answer: "8"
                hints: ["Fang bei 6 an."]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Aufgabe ist leichter zu rechnen?"
                options: ["3 + 6", "6 + 3"]
                answer: "6 + 3"
                option_audio: false
                hints: ["Größere Zahl zuerst."]
              - id: l2-s6
                type: true_false
                text: "Stimmt das? 5 + 4 = 4 + 5"
                answer: true
                hints: ["Plus kann man tauschen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mit welcher Zahl fängst du an? 3 + 7"
                say: "Drei plus sieben. Mit welcher Zahl fängst du am besten an?"
                options: ["3", "7"]
                answer: "7"
                option_audio: false
              - id: l2-n2
                type: text_input
                text: "1 + 6 = _"
                answer: "7"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? 9 − 4 = 4 − 9"
                answer: false
              - id: l2-n4
                type: text_input
                text: "2 + 7 = _"
                answer: "9"
              - id: l2-n5
                type: multiple_choice
                text: "Welche Aufgabe ist leichter zu rechnen?"
                options: ["8 + 2", "2 + 8"]
                answer: "8 + 2"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: find
            type: fill_in_blank
            text: "Schreib die Tauschaufgabe."
            say: "Vier plus fünf. Schreib die Tauschaufgabe."
            frame: "4 + 5 = _ + _"
            options: ["4", "5", "9"]
            answer: ["5", "4"]
          - id: l2-c2
            part: same-result
            type: multiple_choice
            text: "2 + 4 = 6. Wie viel ist 4 + 2?"
            options: ["5", "6", "8"]
            answer: "6"
          - id: l2-c3
            part: not-minus
            type: true_false
            text: "Stimmt das? 7 − 1 = 1 − 7"
            answer: false
          - id: l2-c4
            part: easier
            type: text_input
            text: "3 + 7 = _"
            say: "Drei plus sieben."
            answer: "10"
          - id: l2-c5
            part: easier
            type: multiple_choice
            text: "Mit welcher Zahl fängst du an? 1 + 5"
            say: "Eins plus fünf. Mit welcher Zahl fängst du am besten an?"
            options: ["5", "1"]
            answer: "5"
            option_audio: false
          - id: l2-c6
            part: find
            type: multiple_choice
            text: "Wie heißt die Tauschaufgabe von 8 + 1?"
            options: ["1 + 8", "8 + 8", "8 − 1"]
            answer: "1 + 8"
          - id: l2-c7
            part: find
            type: fill_in_blank
            text: "Schreib die Tauschaufgabe."
            say: "Sechs plus vier. Schreib die Tauschaufgabe."
            frame: "6 + 4 = _ + _"
            options: ["4", "6", "10"]
            answer: ["4", "6"]
          - id: l2-c8
            part: find
            type: matching
            text: "Finde die Tauschaufgaben."
            say: "Welche Aufgaben sind Tauschaufgaben? Verbinde sie."
            pairs:
              - { left: { text: "7 + 3" }, right: { text: "3 + 7" } }
              - { left: { text: "4 + 2" }, right: { text: "2 + 4" } }
              - { left: { text: "1 + 5" }, right: { text: "5 + 1" } }
          - id: l2-c9
            part: find
            type: fill_in_blank
            text: "Schreib die Tauschaufgabe."
            say: "Rote und blaue Punkte: fünf plus eins. Schreib die Tauschaufgabe."
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
            frame: "5 + 1 = _ + _"
            options: ["1", "5", "6"]
            answer: ["1", "5"]
          - id: l2-c10
            part: same-result
            type: multiple_choice
            text: "5 + 4 = 9. Wie viel ist 4 + 5?"
            options: ["8", "9", "10"]
            answer: "9"
          - id: l2-c11
            part: same-result
            type: true_false
            text: "Stimmt das? 2 + 8 = 8 + 2"
            answer: true
          - id: l2-c13
            part: same-result
            type: multiple_choice
            text: "6 + 1 = 7. Wie viel ist 1 + 6?"
            options: ["6", "7", "8"]
            answer: "7"
          - id: l2-c14
            part: easier
            type: multiple_choice
            text: "Mit welcher Zahl fängst du an? 4 + 6"
            say: "Vier plus sechs. Mit welcher Zahl fängst du am besten an?"
            options: ["4", "6"]
            answer: "6"
            option_audio: false
          - id: l2-c12
            part: same-result
            type: true_false
            text: "Stimmt das? 1 + 4 = 4 + 2"
            answer: false
          - id: l2-c15
            part: easier
            type: multiple_choice
            text: "Welche Aufgabe ist leichter zu rechnen?"
            options: ["1 + 9", "9 + 1"]
            answer: "9 + 1"
            option_audio: false
          - id: l2-c16
            part: easier
            type: multiple_choice
            text: "3 + 6: Wie zählst du am schnellsten?"
            say: "Drei plus sechs. Wie zählst du am schnellsten?"
            options: ["6 … 7, 8, 9", "3 … 4, 5, 6, 7, 8, 9", "6 … 7, 8"]
            answer: "6 … 7, 8, 9"
            option_audio: false
          - id: l2-c17
            part: not-minus
            type: true_false
            text: "Stimmt das? Bei 8 − 6 darfst du die Zahlen tauschen."
            say: "Stimmt das? Bei acht minus sechs darfst du die Zahlen tauschen."
            answer: false
          - id: l2-c18
            part: not-minus
            type: multiple_choice
            text: "Bei welcher Aufgabe kannst du die Zahlen tauschen?"
            options: ["4 + 2", "4 − 2"]
            answer: "4 + 2"
          - id: l2-c19
            part: not-minus
            type: multiple_choice
            text: "Bei welcher Aufgabe darfst du die Zahlen nicht tauschen?"
            options: ["6 + 1", "6 − 1"]
            answer: "6 − 1"
          - id: l2-c20
            part: not-minus
            type: true_false
            text: "Stimmt das? Bei 3 + 5 darfst du die Zahlen tauschen."
            answer: true
