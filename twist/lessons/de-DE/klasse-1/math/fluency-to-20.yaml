# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.fluency-to-20
skill: math.add-sub-to-20.fluency-to-20
curriculum: de-DE
language: de
title:
  de: Das kleine Einspluseins
  en: Addition and subtraction facts to 20
summary: >
  All the sums of the kleines Einspluseins quickly and surely, using the
  tricks the child knows (Verdoppeln, Zehnerfreunde, Analogieaufgaben,
  Zehnerübergang) and deriving minus facts from plus facts. Lesson 1
  mixes plus facts and picks a quick way; lesson 2 derives the minus
  facts with the Umkehraufgabe, mixes both, and ends with a timed skill
  check: five facts, each answered correctly within the time per task set
  for the child's age.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-bridge-10]
  also_practises: [math.add-sub-to-20.add-bridge-10, math.add-sub-to-20.neighbour-facts, math.add-sub-to-20.inverse]
  vocabulary: { de: [Einspluseins, schnell rechnen, Trick, Umkehraufgabe, Zehnerfreunde, Verdopplungsaufgabe, Nachbaraufgabe, Analogieaufgabe] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: plus-easy, what: { de: Plusaufgaben ohne Zehnerübergang, en: addition facts that do not cross ten } }
    - { id: plus-bridge, what: { de: Plusaufgaben mit Zehnerübergang, en: addition facts that cross ten } }
    - { id: minus, what: { de: Minusaufgaben bis 20, en: subtraction facts to 20 } }
    - { id: inverse, what: { de: Minusaufgaben aus der Plusaufgabe ableiten, en: working out a subtraction from its addition fact } }
  misconceptions:
    - id: count-in-ones
      what: Counts on in ones for every sum instead of using a known fact
      addressed: Learn lists the tricks; lesson 1 asks which trick fits a sum, with feedback in the full stage naming the faster way
    - id: minus-from-scratch
      what: Works out 15 − 8 from scratch though it knows 8 + 7 = 15
      addressed: lesson 2 Learn derives minus facts from plus facts; fill-in tasks pair each plus fact with its Umkehraufgabe
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Schnell plus rechnen, en: Quick adding }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "8 + 5 = _"
            say: "Acht plus fünf."
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "7 + 7 = _"
            say: "Sieben plus sieben."
            answer: "14"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 + 6 · 6 + 7"
            say: "Du kennst schon viele Tricks. Verdopplungsaufgaben: sechs plus sechs ist zwölf. Nachbaraufgaben: sechs plus sieben ist eins mehr."
          - text: "7 + 3 · 13 + 4"
            say: "Zehnerfreunde: sieben plus drei ist zehn. Analogieaufgaben: Bei dreizehn plus vier hilft die kleine Aufgabe drei plus vier, der Zehner bleibt."
          - text: "8 + 5 = 8 + 2 + 3"
            say: "Und der Zehnerübergang: erst bis zur Zehn, dann den Rest. Schau dir jede Aufgabe an und nimm den Trick, der am schnellsten geht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Trick hilft bei 9 + 9?"
                say: "Neun plus neun. Welcher Trick hilft am schnellsten?"
                options: ["verdoppeln", "Zehnerfreunde", "weiterzählen"]
                answer: "verdoppeln"
                feedback:
                  "weiterzählen": "Weiterzählen geht, dauert aber lange. Neun plus neun ist eine Verdopplung."
                hints:
                  - "Beide Zahlen sind gleich."
                  - "Das ist eine Verdopplung."
                  - "Verdoppeln: 18."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "4 + 6 = _"
                say: "Vier plus sechs."
                answer: "10"
                hints:
                  - "Vier und sechs sind Zehnerfreunde."
                  - "Zusammen ergeben sie eine volle Zehn."
                  - "10."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Trick hilft bei 12 + 5?"
                say: "Zwölf plus fünf. Welcher Trick hilft am schnellsten?"
                options: ["kleine Aufgabe", "verdoppeln", "Zehnerfreunde"]
                answer: "kleine Aufgabe"
                feedback:
                  "verdoppeln": "Zwölf und fünf sind nicht gleich. Lass den Zehner weg: zwei plus fünf."
                  "Zehnerfreunde": "Zwölf und fünf ergeben keine Zehn. Lass den Zehner weg: zwei plus fünf."
                hints:
                  - "Gehst du über die nächste Zehn?"
                  - "Nein. Der Zehner bleibt, nur die Einer ändern sich."
                  - "Die kleine Aufgabe 2 + 5."
              - id: l1-f4
                type: text_input
                text: "9 + 6 = _"
                say: "Neun plus sechs."
                answer: "15"
                hints:
                  - "Erst bis zur Zehn: neun plus eins."
                  - "Dann noch fünf."
                  - "15."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 7 + 8 = 15"
                say: "Sieben plus acht ist fünfzehn. Stimmt das?"
                answer: true
                hints:
                  - "Sieben plus sieben ist vierzehn."
                  - "Acht ist eins mehr."
                  - "Ja."
              - id: l1-f6
                type: text_input
                text: "5 + 8 = _"
                say: "Fünf plus acht."
                answer: "13"
                hints:
                  - "Tausch die Zahlen: acht plus fünf."
                  - "Erst bis zehn, dann drei."
                  - "13."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Trick hilft bei 3 + 7?"
                say: "Drei plus sieben. Welcher Trick hilft am schnellsten?"
                options: ["Zehnerfreunde", "verdoppeln", "kleine Aufgabe"]
                answer: "Zehnerfreunde"
                hints: ["Was ergeben die beiden Zahlen zusammen?"]
              - id: l1-s2
                type: text_input
                text: "8 + 8 = _"
                say: "Acht plus acht."
                answer: "16"
                hints: ["Das ist eine Verdopplung."]
              - id: l1-s3
                type: text_input
                text: "6 + 9 = _"
                say: "Sechs plus neun."
                answer: "15"
                hints: ["Rechne sechs plus zehn, dann eins weniger."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 14 + 3 = 18"
                say: "Vierzehn plus drei ist achtzehn. Stimmt das?"
                answer: false
                hints: ["Denk an vier plus drei."]
              - id: l1-s5
                type: text_input
                text: "7 + 5 = _"
                say: "Sieben plus fünf."
                answer: "12"
                hints: ["Erst bis zur Zehn."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "9 + 5 = _"
                say: "Neun plus fünf."
                answer: "14"
              - id: l1-n2
                type: text_input
                text: "2 + 8 = _"
                say: "Zwei plus acht."
                answer: "10"
              - id: l1-n3
                type: text_input
                text: "11 + 7 = _"
                say: "Elf plus sieben."
                answer: "18"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 9 + 4 = 13"
                say: "Neun plus vier ist dreizehn. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "8 + 6 = _"
                say: "Acht plus sechs."
                answer: "14"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "5 + 5 = _"
            say: "Fünf plus fünf."
            answer: "10"
          - id: l1-c2
            type: text_input
            text: "9 + 8 = _"
            say: "Neun plus acht."
            answer: "17"
          - id: l1-c3
            type: text_input
            text: "15 + 4 = _"
            say: "Fünfzehn plus vier."
            answer: "19"
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Trick hilft bei 8 + 8?"
            say: "Acht plus acht. Welcher Trick hilft am schnellsten?"
            options: ["verdoppeln", "Zehnerfreunde", "kleine Aufgabe"]
            answer: "verdoppeln"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 6 + 4 = 11"
            say: "Sechs plus vier ist elf. Stimmt das?"
            answer: false
          - id: l1-c6
            type: text_input
            text: "12 + 6 = _"
            say: "Zwölf plus sechs."
            answer: "18"

  - n: 2
    title: { de: Minus aus Plus ableiten, en: Minus from plus }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "7 + 6 = _"
            say: "Sieben plus sechs."
            answer: "13"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "4 + 9 = _"
            say: "Vier plus neun."
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 + 7 = 15 → 15 − 7 = 8"
            say: "Wenn du weißt, dass acht plus sieben fünfzehn ist, weißt du auch: fünfzehn minus sieben ist acht. Das ist die Umkehraufgabe."
          - text: "15 − 8 = 7"
            say: "Und fünfzehn minus acht ist sieben. Aus einer Plusaufgabe bekommst du zwei Minusaufgaben."
          - text: "7 + 7 = 14 → 14 − 7 = 7"
            say: "Bei vierzehn minus sieben hilft die Verdopplung: sieben plus sieben ist vierzehn, also ist vierzehn minus sieben sieben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Die Plusaufgabe hilft."
                say: "Neun plus vier ist dreizehn. Was ist dann dreizehn minus vier?"
                frame: "9 + 4 = 13 | 13 − 4 = _"
                options: ["9", "4", "17"]
                answer: ["9"]
                hints:
                  - "Minus vier macht das Plus vier rückgängig."
                  - "Dann bleibt die Neun."
                  - "9."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Plusaufgabe hilft bei 12 − 5?"
                say: "Zwölf minus fünf. Welche Plusaufgabe hilft dir?"
                options: ["7 + 5 = 12", "12 + 5 = 17", "6 + 6 = 12"]
                answer: "7 + 5 = 12"
                hints:
                  - "Welche Zahl plus fünf ist zwölf?"
                  - "Sieben plus fünf ist zwölf."
                  - "7 + 5 = 12."
              - id: l2-f3
                type: text_input
                text: "16 − 8 = _"
                say: "Sechzehn minus acht."
                answer: "8"
                hints:
                  - "Denk an eine Verdopplung."
                  - "Acht plus acht ist sechzehn."
                  - "8."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 11 − 3 = 8, denn 8 + 3 = 11."
                say: "Elf minus drei ist acht, denn acht plus drei ist elf. Stimmt das?"
                answer: true
                hints:
                  - "Rechne acht plus drei."
                  - "Acht plus drei ist elf."
                  - "Ja."
              - id: l2-f5
                type: fill_in_blank
                text: "Die Plusaufgabe hilft."
                say: "Sechs plus acht ist vierzehn. Was ist dann vierzehn minus acht und vierzehn minus sechs?"
                frame: "6 + 8 = 14 | 14 − 8 = _ | 14 − 6 = _"
                options: ["6", "8", "14", "2"]
                answer: ["6", "8"]
                hints:
                  - "Minus acht macht das Plus acht rückgängig."
                  - "Dann bleibt die Sechs, und bei minus sechs die Acht."
                  - "6 und 8."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Die Plusaufgabe hilft."
                say: "Sieben plus vier ist elf. Was ist dann elf minus vier?"
                frame: "7 + 4 = 11 | 11 − 4 = _"
                options: ["7", "4", "15"]
                answer: ["7"]
                hints: ["Minus macht das Plus rückgängig."]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Plusaufgabe hilft bei 17 − 9?"
                say: "Siebzehn minus neun. Welche Plusaufgabe hilft dir?"
                options: ["8 + 9 = 17", "17 + 9 = 26", "9 + 9 = 18"]
                answer: "8 + 9 = 17"
                hints: ["Welche Zahl plus neun ist siebzehn?"]
              - id: l2-s3
                type: text_input
                text: "18 − 9 = _"
                say: "Achtzehn minus neun."
                answer: "9"
                hints: ["Denk an eine Verdopplung."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 13 − 6 = 8, denn 8 + 6 = 13."
                say: "Dreizehn minus sechs ist acht, denn acht plus sechs ist dreizehn. Stimmt das?"
                answer: false
                hints: ["Rechne acht plus sechs nach."]
              - id: l2-s5
                type: text_input
                text: "15 − 6 = _"
                say: "Fünfzehn minus sechs."
                answer: "9"
                hints: ["Welche Zahl plus sechs ist fünfzehn?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Die Plusaufgabe hilft."
                say: "Fünf plus neun ist vierzehn. Was ist dann vierzehn minus neun?"
                frame: "5 + 9 = 14 | 14 − 9 = _"
                options: ["5", "9", "23"]
                answer: ["5"]
              - id: l2-n2
                type: text_input
                text: "12 − 6 = _"
                say: "Zwölf minus sechs."
                answer: "6"
              - id: l2-n3
                type: text_input
                text: "17 − 8 = _"
                say: "Siebzehn minus acht."
                answer: "9"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 11 − 7 = 4"
                say: "Elf minus sieben ist vier. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "13 − 5 = _"
                say: "Dreizehn minus fünf."
                answer: "8"

      - activity: check
        size: timed
        draw: 5
        tasks:
          - id: l2-c1
            part: plus-bridge
            type: text_input
            text: "6 + 5 = _"
            say: "Sechs plus fünf."
            answer: "11"
          - id: l2-c2
            part: minus
            type: text_input
            text: "14 − 5 = _"
            say: "Vierzehn minus fünf."
            answer: "9"
          - id: l2-c3
            part: plus-bridge
            type: text_input
            text: "9 + 7 = _"
            say: "Neun plus sieben."
            answer: "16"
          - id: l2-c4
            part: minus
            type: text_input
            text: "16 − 9 = _"
            say: "Sechzehn minus neun."
            answer: "7"
          - id: l2-c5
            part: minus
            type: text_input
            text: "11 − 8 = _"
            say: "Elf minus acht."
            answer: "3"
          - id: l2-c6
            part: plus-bridge
            type: text_input
            text: "3 + 9 = _"
            say: "Drei plus neun."
            answer: "12"
          - id: l2-c7
            part: plus-easy
            type: text_input
            text: "13 + 5 = _"
            say: "Dreizehn plus fünf."
            answer: "18"
          - id: l2-c8
            part: plus-easy
            type: text_input
            text: "1 + 9 = _"
            say: "Eins plus neun."
            answer: "10"
          - id: l2-c9
            part: plus-easy
            type: true_false
            text: "Stimmt das? 12 + 4 = 15"
            say: "Zwölf plus vier ist fünfzehn. Stimmt das?"
            answer: false
          - id: l2-c10
            part: plus-easy
            type: text_input
            text: "16 + 3 = _"
            say: "Sechzehn plus drei."
            answer: "19"
          - id: l2-c11
            part: plus-bridge
            type: text_input
            text: "2 + 9 = _"
            say: "Zwei plus neun."
            answer: "11"
          - id: l2-c12
            part: plus-bridge
            type: true_false
            text: "Stimmt das? 8 + 4 = 12"
            say: "Acht plus vier ist zwölf. Stimmt das?"
            answer: true
          - id: l2-c13
            part: plus-bridge
            type: text_input
            text: "4 + 7 = _"
            say: "Vier plus sieben."
            answer: "11"
          - id: l2-c14
            part: minus
            type: text_input
            text: "13 − 7 = _"
            say: "Dreizehn minus sieben."
            answer: "6"
          - id: l2-c15
            part: minus
            type: true_false
            text: "Stimmt das? 15 − 9 = 7"
            say: "Fünfzehn minus neun ist sieben. Stimmt das?"
            answer: false
          - id: l2-c16
            part: inverse
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Sieben plus fünf ist zwölf. Was ist dann zwölf minus fünf?"
            frame: "7 + 5 = 12 | 12 − 5 = _"
            options: ["7", "5", "17"]
            answer: ["7"]
          - id: l2-c17
            part: inverse
            type: multiple_choice
            text: "Welche Umkehraufgabe gehört zu 7 + 9 = 16?"
            say: "Sieben plus neun ist sechzehn. Welche Umkehraufgabe gehört dazu?"
            options: ["16 − 7 = 8", "16 − 9 = 7", "16 + 7 = 23"]
            answer: "16 − 9 = 7"
          - id: l2-c18
            part: inverse
            type: multiple_choice
            text: "Welche Plusaufgabe hilft bei 14 − 6?"
            say: "Vierzehn minus sechs. Welche Plusaufgabe hilft dir?"
            options: ["8 + 6", "14 + 6", "7 + 7"]
            answer: "8 + 6"
          - id: l2-c19
            part: inverse
            type: true_false
            text: "Stimmt das? 12 − 3 = 9, denn 9 + 3 = 12."
            say: "Zwölf minus drei ist neun, denn neun plus drei ist zwölf. Stimmt das?"
            answer: true
          - id: l2-c20
            part: inverse
            type: multiple_choice
            text: "Welche Plusaufgabe hilft bei 13 − 8?"
            say: "Dreizehn minus acht. Welche Plusaufgabe hilft dir?"
            options: ["5 + 8", "8 + 8", "3 + 10"]
            answer: "5 + 8"
