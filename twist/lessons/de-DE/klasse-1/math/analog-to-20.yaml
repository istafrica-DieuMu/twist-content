# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.analog-to-20
skill: math.add-sub-to-20.analog-to-20
curriculum: de-DE
language: de
title:
  de: Analogieaufgaben im zweiten Zehner
  en: Related sums in the second ten
summary: >
  A sum in the second ten is the matching small sum plus a ten: 3 + 4 = 7
  helps with 13 + 4 = 17, and 8 − 5 = 3 with 18 − 5 = 13. Lesson 1 adds,
  lesson 2 subtracts and mixes both, and ends with the skill check. No
  sum here crosses ten; that comes with the Zehnerübergang.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.sub-to-10, math.numbers-to-20.teens]
  also_practises: [math.add-sub-to-20.add-to-10]
  vocabulary: { de: [Analogieaufgabe, kleine Aufgabe, zweiter Zehner, Zehner, Einer] }
  forms: [drawn, text, audio]
  drawn: [zwanzigerfeld, number-line]
  facets: []
  misconceptions:
    - id: add-to-the-ten
      what: Adds the ones to the ten digit (13 + 4 = 53 or 23)
      addressed: Learn says the Zehner stays and only the Einer change; lesson 1 options include the changed ten, with feedback in the full stage
    - id: drop-the-ten
      what: Answers with the small sum only (13 + 4 = 7)
      addressed: Learn shows the small and the big sum side by side; options include the small result, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die kleine Aufgabe hilft, en: The small sum helps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "3 + 4 = _"
            say: "Drei plus vier."
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Punkte?"
            say: "Wie viele Punkte sind es zusammen?"
            show: { drawn: zwanzigerfeld, filled: [10, 3] }
            options: ["13", "3", "31"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 4 = 7"
            say: "Drei plus vier ist sieben."
            show: { drawn: zwanzigerfeld, filled: [0, 7] }
          - text: "13 + 4 = 17"
            say: "Jetzt liegt oben noch ein voller Zehner dazu. Dreizehn plus vier: Der Zehner bleibt, unten rechnest du wie vorher drei plus vier. Siebzehn."
            show: { drawn: zwanzigerfeld, filled: [10, 7] }
          - text: "3 + 4 = 7 | 13 + 4 = 17"
            say: "Die kleine Aufgabe hilft bei der großen. Das nennt man Analogieaufgabe. Nur die Einer ändern sich, der Zehner bleibt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne die kleine Aufgabe, dann die große."
                say: "Zwei plus fünf, dann zwölf plus fünf."
                frame: "2 + 5 = _ | 12 + 5 = _"
                options: ["7", "17", "62", "70"]
                answer: ["7", "17"]
                hints:
                  - "Rechne zuerst nur die Einer."
                  - "Zwei plus fünf ist sieben. Bei zwölf plus fünf bleibt der Zehner."
                  - "7 und 17."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "14 + 3 = ?"
                say: "Vierzehn plus drei. Denk an die kleine Aufgabe."
                options: ["17", "7", "43"]
                answer: "17"
                feedback:
                  "7": "Vier plus drei ist sieben. Aber der Zehner bleibt: siebzehn."
                  "43": "Die Drei gehört zu den Einern, nicht zum Zehner. Vier plus drei ist sieben: siebzehn."
                hints:
                  - "Die kleine Aufgabe ist vier plus drei."
                  - "Vier plus drei ist sieben. Der Zehner bleibt."
                  - "17."
              - id: l1-f3
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 15 + 2?"
                say: "Fünfzehn plus zwei. Welche kleine Aufgabe hilft?"
                options: ["5 + 2", "1 + 2", "15 + 1"]
                answer: "5 + 2"
                hints:
                  - "Lass den Zehner weg."
                  - "Fünfzehn ohne den Zehner ist fünf."
                  - "5 + 2."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 11 + 6 = 17"
                say: "Elf plus sechs ist siebzehn. Stimmt das?"
                answer: true
                hints:
                  - "Die kleine Aufgabe ist eins plus sechs."
                  - "Eins plus sechs ist sieben. Mit dem Zehner: siebzehn."
                  - "Ja."
              - id: l1-f5
                type: text_input
                text: "16 + 3 = _"
                say: "Sechzehn plus drei."
                answer: "19"
                hints:
                  - "Denk an sechs plus drei."
                  - "Sechs plus drei ist neun."
                  - "19."
              - id: l1-f6
                type: multiple_choice
                text: "13 + 5 = ?"
                say: "Dreizehn plus fünf."
                options: ["18", "63", "8"]
                answer: "18"
                feedback:
                  "63": "Die Fünf gehört zu den Einern, nicht zum Zehner. Drei plus fünf ist acht: achtzehn."
                  "8": "Drei plus fünf ist acht. Aber der Zehner bleibt: achtzehn."
                hints:
                  - "Die kleine Aufgabe ist drei plus fünf."
                  - "Drei plus fünf ist acht."
                  - "18."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne die kleine Aufgabe, dann die große."
                say: "Vier plus vier, dann vierzehn plus vier."
                frame: "4 + 4 = _ | 14 + 4 = _"
                options: ["8", "18", "48", "80"]
                answer: ["8", "18"]
                hints: ["Der Zehner bleibt."]
              - id: l1-s2
                type: multiple_choice
                text: "12 + 6 = ?"
                say: "Zwölf plus sechs."
                options: ["18", "8", "72"]
                answer: "18"
                hints: ["Welche kleine Aufgabe hilft?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 17 + 2?"
                say: "Siebzehn plus zwei. Welche kleine Aufgabe hilft?"
                options: ["7 + 2", "1 + 2", "17 + 1"]
                answer: "7 + 2"
                hints: ["Lass den Zehner weg."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 15 + 4 = 9"
                say: "Fünfzehn plus vier ist neun. Stimmt das?"
                answer: false
                hints: ["Hast du an den Zehner gedacht?"]
              - id: l1-s5
                type: text_input
                text: "11 + 8 = _"
                say: "Elf plus acht."
                answer: "19"
                hints: ["Denk an eins plus acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne die kleine Aufgabe, dann die große."
                say: "Fünf plus drei, dann fünfzehn plus drei."
                frame: "5 + 3 = _ | 15 + 3 = _"
                options: ["8", "18", "45", "80"]
                answer: ["8", "18"]
              - id: l1-n2
                type: multiple_choice
                text: "13 + 6 = ?"
                say: "Dreizehn plus sechs."
                options: ["19", "9", "73"]
                answer: "19"
              - id: l1-n3
                type: text_input
                text: "12 + 7 = _"
                say: "Zwölf plus sieben."
                answer: "19"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 14 + 5 = 19"
                say: "Vierzehn plus fünf ist neunzehn. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "10 + 6 = _"
                say: "Zehn plus sechs."
                answer: "16"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "11 + 4 = _"
            say: "Elf plus vier."
            answer: "15"
          - id: l1-c2
            type: multiple_choice
            text: "Welche kleine Aufgabe hilft bei 12 + 4?"
            say: "Zwölf plus vier. Welche kleine Aufgabe hilft?"
            options: ["2 + 4", "1 + 4", "12 + 1"]
            answer: "2 + 4"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 16 + 2 = 18"
            say: "Sechzehn plus zwei ist achtzehn. Stimmt das?"
            answer: true

  - n: 2
    title: { de: Auch bei Minus, en: Subtracting too }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "14 + 4 = _"
            say: "Vierzehn plus vier."
            answer: "18"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "8 − 5 = _"
            say: "Acht minus fünf."
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8 − 5 = 3 | 18 − 5 = 13"
            say: "Bei Minus geht es genauso. Acht minus fünf ist drei. Achtzehn minus fünf: Der Zehner bleibt, bei den Einern rechnest du acht minus fünf. Dreizehn."
          - text: "7 − 4 = 3 | 17 − 4 = 13"
            say: "Siebzehn minus vier: Die kleine Aufgabe ist sieben minus vier, das ist drei. Mit dem Zehner: dreizehn."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, jumps: [[17, -4]] }
          - text: "19 − 9 = 10"
            say: "Wenn alle Einer weg sind, bleibt nur der Zehner: neunzehn minus neun ist zehn."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne die kleine Aufgabe, dann die große."
                say: "Sieben minus zwei, dann siebzehn minus zwei."
                frame: "7 − 2 = _ | 17 − 2 = _"
                options: ["5", "15", "3", "13"]
                answer: ["5", "15"]
                hints:
                  - "Rechne zuerst nur die Einer."
                  - "Sieben minus zwei ist fünf. Bei siebzehn minus zwei bleibt der Zehner."
                  - "5 und 15."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "16 − 4 = ?"
                say: "Sechzehn minus vier."
                options: ["12", "2", "6"]
                answer: "12"
                feedback:
                  "2": "Sechs minus vier ist zwei. Aber der Zehner bleibt: zwölf."
                hints:
                  - "Die kleine Aufgabe ist sechs minus vier."
                  - "Sechs minus vier ist zwei."
                  - "12."
              - id: l2-f3
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 19 − 6?"
                say: "Neunzehn minus sechs. Welche kleine Aufgabe hilft?"
                options: ["9 − 6", "1 − 6", "19 − 1"]
                answer: "9 − 6"
                hints:
                  - "Lass den Zehner weg."
                  - "Neunzehn ohne Zehner ist neun."
                  - "9 − 6."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 15 − 5 = 10"
                say: "Fünfzehn minus fünf ist zehn. Stimmt das?"
                answer: true
                hints:
                  - "Fünf minus fünf ist null."
                  - "Es bleibt nur der Zehner."
                  - "Ja."
              - id: l2-f5
                type: text_input
                text: "18 − 3 = _"
                say: "Achtzehn minus drei."
                answer: "15"
                hints:
                  - "Denk an acht minus drei."
                  - "Acht minus drei ist fünf."
                  - "15."
              - id: l2-f6
                type: fill_in_blank
                text: "Rechne beide Aufgaben."
                say: "Vierzehn plus zwei, dann vierzehn minus zwei."
                frame: "14 + 2 = _ | 14 − 2 = _"
                options: ["16", "12", "6", "2"]
                answer: ["16", "12"]
                hints:
                  - "Vier plus zwei und vier minus zwei."
                  - "Sechs und zwei, der Zehner bleibt."
                  - "16 und 12."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne die kleine Aufgabe, dann die große."
                say: "Neun minus vier, dann neunzehn minus vier."
                frame: "9 − 4 = _ | 19 − 4 = _"
                options: ["5", "15", "4", "14"]
                answer: ["5", "15"]
                hints: ["Der Zehner bleibt."]
              - id: l2-s2
                type: multiple_choice
                text: "17 − 5 = ?"
                say: "Siebzehn minus fünf."
                options: ["12", "2", "22"]
                answer: "12"
                hints: ["Welche kleine Aufgabe hilft?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche kleine Aufgabe hilft bei 16 − 3?"
                say: "Sechzehn minus drei. Welche kleine Aufgabe hilft?"
                options: ["6 − 3", "1 − 3", "16 − 1"]
                answer: "6 − 3"
                hints: ["Lass den Zehner weg."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 18 − 6 = 2"
                say: "Achtzehn minus sechs ist zwei. Stimmt das?"
                answer: false
                hints: ["Hast du an den Zehner gedacht?"]
              - id: l2-s5
                type: text_input
                text: "11 + 5 = _"
                say: "Elf plus fünf."
                answer: "16"
                hints: ["Denk an eins plus fünf."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne die kleine Aufgabe, dann die große."
                say: "Sechs minus zwei, dann sechzehn minus zwei."
                frame: "6 − 2 = _ | 16 − 2 = _"
                options: ["4", "14", "8", "18"]
                answer: ["4", "14"]
              - id: l2-n2
                type: multiple_choice
                text: "19 − 7 = ?"
                say: "Neunzehn minus sieben."
                options: ["12", "2", "16"]
                answer: "12"
              - id: l2-n3
                type: text_input
                text: "14 − 3 = _"
                say: "Vierzehn minus drei."
                answer: "11"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 17 − 7 = 10"
                say: "Siebzehn minus sieben ist zehn. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "13 + 3 = _"
                say: "Dreizehn plus drei."
                answer: "16"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "12 + 3 = _"
            say: "Zwölf plus drei."
            answer: "15"
          - id: l2-c2
            type: multiple_choice
            text: "18 − 4 = ?"
            say: "Achtzehn minus vier."
            options: ["14", "4", "12"]
            answer: "14"
          - id: l2-c3
            type: fill_in_blank
            text: "Rechne die kleine Aufgabe, dann die große."
            say: "Acht minus sechs, dann achtzehn minus sechs."
            frame: "8 − 6 = _ | 18 − 6 = _"
            options: ["2", "12", "14", "4"]
            answer: ["2", "12"]
          - id: l2-c4
            type: true_false
            text: "Stimmt das? 11 + 7 = 8"
            say: "Elf plus sieben ist acht. Stimmt das?"
            answer: false
          - id: l2-c5
            type: multiple_choice
            text: "Welche kleine Aufgabe hilft bei 15 − 2?"
            say: "Fünfzehn minus zwei. Welche kleine Aufgabe hilft?"
            options: ["5 − 2", "1 − 2", "15 − 1"]
            answer: "5 − 2"
