# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.sort-classify
skill: math.data.sort-classify
curriculum: de-DE
language: de
title:
  de: Sortieren und zählen
  en: Sorting and counting
summary: >
  Lesson 1 sorts pictures by one feature (Tier oder Essen, rot oder
  blau) and finds the one that does not belong; lesson 2 counts how many
  are in each group, says which group has more, and ends with the skill
  check.
metadata:
  year: klasse-1
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { de: [sortieren, Gruppe, gehört dazu, passt nicht, mehr, weniger, gleich viele] }
  forms: [picture, text, audio, drawn]
  drawn: [colour-swatch]
  facets: []
  parts:
    - { id: sort, what: { de: "nach einem Merkmal sortieren", en: "sorting by one feature" } }
    - { id: odd-one-out, what: { de: "erkennen, was dazugehört und was nicht passt", en: "spotting what belongs and what does not" } }
    - { id: count, what: { de: "zählen, wie viele in einer Gruppe sind", en: "counting how many are in a group" } }
    - { id: compare, what: { de: "Gruppen vergleichen", en: "comparing groups" } }
  misconceptions:
    - id: sorts-by-two-features
      what: Switches the feature halfway through sorting (sorts some by colour and some by kind)
      addressed: "lesson 1 Learn names one feature for every sort; each sorting task names its feature in the say"
    - id: bigger-group-looks-bigger
      what: Says the group that takes more space has more, without counting
      addressed: "lesson 2 Learn shows three balls spread wide and says to count before comparing (Erst zählen, dann vergleichen); l2-f2 (with feedback), l2-s2 and l2-n2 show two groups of pictures where the group with fewer is spread wider"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was gehört zusammen?", en: "What belongs together?" }
    goal:
      de: "Sortier Bilder in Gruppen und find das, was nicht passt. Hund, Katze, Maus und Banane, die Banane passt nicht."
      en: "Sort pictures into groups and find the odd one out. Dog, cat, mouse and banana, the banana does not fit."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            say: "Wie viele Äpfel sind das?"
            show: { object: apple, count: 4 }
            options: ["4", "3", "5"]
            answer: "4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welches ist ein Tier?"
            say: "Welches Bild zeigt ein Tier?"
            options: [{ object: dog }, { object: apple }, { object: ball }]
            answer: dog
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hund, Katze, Apfel, Brot: Was gehört zusammen?"
            say: "Hund, Katze, Apfel und Brot. Was glaubst du: Welche zwei gehören zusammen, und welche zwei?"
          - text: "Tiere · Essen"
            say: "Hund und Katze, Apfel und Brot! Sortieren heißt: Was zusammengehört, kommt in eine Gruppe. Hier sortieren wir nach einer Frage: Ist es ein Tier oder etwas zum Essen? Der Hund und die Katze sind Tiere. Der Apfel und das Brot sind etwas zum Essen."
          - text: "rot · blau"
            say: "Man kann auch nach der Farbe sortieren. Dann gehören ein roter Ball und ein rotes Auto zusammen, auch wenn sie ganz verschieden sind."
          - text: "Was passt nicht?"
            say: "Hund, Katze, Maus und Banane. Drei sind Tiere, die Banane passt nicht dazu."
          - text: "Wusstest du? Ein Wal lebt im Meer, ist aber kein Fisch."
            say: "Wusstest du? Ein Wal lebt im Meer, aber er ist kein Fisch. Er muss zum Atmen nach oben, und seine Babys trinken Milch, so wie bei Kühen und Hunden."
            show: { object: whale }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: sorting
                text: "Tier oder Essen?"
                say: "Sortiere: Ist es ein Tier oder etwas zum Essen?"
                bins:
                  - { id: animal, show: { text: "Tier" }, say: "Tier" }
                  - { id: food, show: { text: "Essen" }, say: "Essen" }
                options:
                  - { object: cat, bin: animal }
                  - { object: banana, bin: food }
                  - { object: cow, bin: animal }
                  - { object: bread, bin: food }
                hints:
                  - "Lebt es, oder kann man es essen?"
                  - "Katze und Kuh sind Tiere."
                  - "Tier: Katze, Kuh. Essen: Banane, Brot."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei gehören zusammen. Was passt nicht dazu?"
                options: [{ object: pig }, { object: duck }, { object: goat }, { object: car }]
                answer: car
                hints:
                  - "Welche drei gehören zusammen?"
                  - "Schwein, Ente und Ziege sind Tiere."
                  - "Das Auto."
              - id: l1-f3
                type: sorting
                text: "Rot oder blau?"
                say: "Hilf Tim beim Aufräumen. Sortiere nach der Farbe: rot oder blau?"
                bins:
                  - { id: red, show: { drawn: colour-swatch, colour: red }, say: "rot" }
                  - { id: blue, show: { drawn: colour-swatch, colour: blue }, say: "blau" }
                options:
                  - { object: ball, colour: red, bin: red }
                  - { object: car, colour: blue, bin: blue }
                  - { object: balloon, colour: red, bin: red }
                  - { object: t-shirt, colour: blue, bin: blue }
                hints:
                  - "Schau nur auf die Farbe."
                  - "Der Ball und der Luftballon sind rot."
                  - "Rot: Ball, Luftballon. Blau: Auto, T-Shirt."
              - id: l1-f4
                type: true_false
                text: "Gehört die Schere zu den Sachen für die Schule?"
                say: "Stift, Heft, Lineal. Gehört die Schere auch zu den Sachen für die Schule?"
                show: { object: scissors }
                answer: true
                hints:
                  - "Was brauchst du in der Schule?"
                  - "Mit der Schere schneidest du im Unterricht."
                  - "Ja, sie gehört dazu."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was gehört zur Kleidung?"
                say: "Hose, Rock, Jacke. Was gehört auch dazu?"
                options: [{ object: sock }, { object: spoon }, { object: tree }]
                answer: sock
                feedback:
                  tree: "Einen Baum anziehen? Der passt in keinen Schrank! Was kann man anziehen?"
                hints:
                  - "Was kann man anziehen?"
                  - "Einen Löffel und einen Baum kann man nicht anziehen."
                  - "Die Socke."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Fahrzeug oder Tier?"
                say: "Sortiere: Ist es ein Fahrzeug oder ein Tier?"
                bins:
                  - { id: vehicle, show: { text: "Fahrzeug" }, say: "Fahrzeug" }
                  - { id: animal, show: { text: "Tier" }, say: "Tier" }
                options:
                  - { object: bus, bin: vehicle }
                  - { object: elephant, bin: animal }
                  - { object: bike, bin: vehicle }
                  - { object: rabbit, bin: animal }
                hints: ["Ein Fahrzeug fährt mit Rädern oder auf dem Wasser."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei gehören zusammen. Was passt nicht dazu?"
                options: [{ object: apple }, { object: strawberry }, { object: banana }, { object: shoe }]
                answer: shoe
                hints: ["Drei davon kann man essen."]
              - id: l1-s3
                type: sorting
                text: "Gelb oder grün?"
                say: "Sortiere nach der Farbe: gelb oder grün?"
                bins:
                  - { id: yellow, show: { drawn: colour-swatch, colour: yellow }, say: "gelb" }
                  - { id: green, show: { drawn: colour-swatch, colour: green }, say: "grün" }
                options:
                  - { object: ball, colour: yellow, bin: yellow }
                  - { object: leaf, colour: green, bin: green }
                  - { object: balloon, colour: green, bin: green }
                  - { object: car, colour: yellow, bin: yellow }
                hints: ["Schau nur auf die Farbe."]
              - id: l1-s4
                type: true_false
                text: "Gehört der Fisch zu den Tieren?"
                say: "Hund, Katze, Vogel. Gehört der Fisch auch zu den Tieren?"
                show: { object: fish }
                answer: true
                hints: ["Ein Fisch lebt im Wasser."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was gehört zum Spielzeug?"
                say: "Ball, Drachen, Jo-Jo. Was gehört auch dazu?"
                options: [{ object: marble }, { object: carrot }, { object: bed }]
                answer: marble
                hints: ["Womit kann man spielen?"]

          - support: none
            tasks:
              - id: l1-n1
                type: sorting
                text: "Tier oder Essen?"
                say: "Sortiere: Ist es ein Tier oder etwas zum Essen?"
                bins:
                  - { id: animal, show: { text: "Tier" }, say: "Tier" }
                  - { id: food, show: { text: "Essen" }, say: "Essen" }
                options:
                  - { object: frog, bin: animal }
                  - { object: cheese, bin: food }
                  - { object: carrot, bin: food }
                  - { object: snail, bin: animal }
                  - { object: cake, bin: food }
              - id: l1-n2
                type: image_multiple_choice
                text: "Was passt nicht dazu?"
                say: "Drei gehören zusammen. Was passt nicht dazu?"
                options: [{ object: pencil }, { object: ruler }, { object: rubber }, { object: banana }]
                answer: banana
              - id: l1-n3
                type: sorting
                text: "Rot oder blau?"
                say: "Sortiere nach der Farbe: rot oder blau?"
                bins:
                  - { id: red, show: { drawn: colour-swatch, colour: red }, say: "rot" }
                  - { id: blue, show: { drawn: colour-swatch, colour: blue }, say: "blau" }
                options:
                  - { object: t-shirt, colour: blue, bin: blue }
                  - { object: ball, colour: red, bin: red }
                  - { object: skirt, colour: red, bin: red }
                  - { object: balloon, colour: blue, bin: blue }
                  - { object: car, colour: red, bin: red }
              - id: l1-n4
                type: true_false
                text: "Gehört der Kuchen zu den Tieren?"
                say: "Maus, Löwe, Ente. Gehört der Kuchen auch zu den Tieren?"
                show: { object: cake }
                answer: false
              - id: l1-n5
                type: image_multiple_choice
                text: "Was gehört zum Wetter?"
                say: "Sonne, Regen, Wind. Was gehört auch dazu?"
                options: [{ object: snow }, { object: cup }, { object: dog }]
                answer: snow

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: sorting
            text: "Fahrzeug oder Kleidung?"
            say: "Sortiere: Ist es ein Fahrzeug oder etwas zum Anziehen?"
            bins:
              - { id: vehicle, show: { text: "Fahrzeug" }, say: "Fahrzeug" }
              - { id: clothes, show: { text: "Kleidung" }, say: "Kleidung" }
            options:
              - { object: boat, bin: vehicle }
              - { object: dress, bin: clothes }
              - { object: van, bin: vehicle }
              - { object: jacket, bin: clothes }
          - id: l1-c2
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Drei gehören zusammen. Welches Bild passt nicht?"
            options: [{ object: elephant }, { object: giraffe }, { object: zebra }, { object: pizza }]
            answer: pizza
          - id: l1-c3
            type: true_false
            text: "Gehört die Möhre zum Essen?"
            say: "Brot, Käse, Apfel. Gehört die Möhre auch zum Essen?"
            show: { object: carrot }
            answer: true
          - id: l1-c4
            type: sorting
            text: "Rot oder gelb?"
            say: "Sortiere nach der Farbe: rot oder gelb?"
            bins:
              - { id: red, show: { drawn: colour-swatch, colour: red }, say: "rot" }
              - { id: yellow, show: { drawn: colour-swatch, colour: yellow }, say: "gelb" }
            options:
              - { object: ball, colour: red, bin: red }
              - { object: car, colour: yellow, bin: yellow }
              - { object: dress, colour: red, bin: red }
              - { object: leaf, colour: yellow, bin: yellow }
          - id: l1-c5
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Drei gehören zusammen. Was passt nicht dazu?"
            options: [{ object: frog }, { object: snail }, { object: fish }, { object: bread }]
            answer: bread
          - id: l1-c6
            type: true_false
            text: "Gehört der Ball zur Kleidung?"
            say: "Hose, Rock, Jacke. Gehört der Ball auch zur Kleidung?"
            show: { object: ball }
            answer: false

  - n: 2
    title: { de: "Wie viele in jeder Gruppe?", en: "How many in each group?" }
    goal:
      de: "Zähl jede Gruppe und sag, wo mehr sind. Vier Äpfel sind mehr als zwei Bananen."
      en: "Count each group and say which has more. Four apples are more than two bananas."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Was passt nicht dazu: Hund, Katze, Banane?"
            options: [{ object: dog }, { object: cat }, { object: banana }]
            answer: banana
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist mehr: 5 oder 3?"
            say: "Was ist mehr: fünf oder drei?"
            options: ["5", "3"]
            answer: "5"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wovon gibt es mehr?"
            say: "Im Korb liegen vier Äpfel und zwei Bananen. Was glaubst du: Gibt es mehr Äpfel oder mehr Bananen?"
            show: { object: apple, count: 4 }
          - text: "4 Äpfel · 2 Bananen"
            say: "Zählen wir nach! Nach dem Sortieren zählst du jede Gruppe. Hier sind vier Äpfel und zwei Bananen."
            show: { object: apple, count: 4 }
          - text: "4 ist mehr als 2."
            say: "Vier ist mehr als zwei. Also gibt es mehr Äpfel als Bananen."
          - text: "Erst zählen, dann vergleichen!"
            say: "Diese drei Bälle liegen weit auseinander. Die Gruppe sieht groß aus, aber es sind nur drei. Eine Gruppe kann groß aussehen und trotzdem weniger haben. Zähl immer nach."
            show: { object: ball, count: 3, layout: scattered }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Bälle sind es?"
                say: "Lena hat die Bälle in eine Gruppe sortiert. Wie viele Bälle sind es?"
                show: { object: ball, count: 6, colour: red }
                options: ["6", "5", "7"]
                answer: "6"
                option_audio: false
                hints:
                  - "Zeig auf jeden Ball und zähl."
                  - "Eins, zwei, drei, vier, fünf, ..."
                  - "6."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Wo sind mehr Äpfel?"
                say: "Tim hat die Äpfel in zwei Gruppen gelegt. Wo sind mehr? Zähl genau!"
                options:
                  - { object: apple, count: 3, layout: scattered }
                  - { object: apple, count: 5, layout: row }
                answer: "5"
                feedback:
                  "3": "Die Äpfel liegen weit auseinander, aber es sind nur drei. Zähl beide Gruppen."
                hints:
                  - "Lass dich nicht täuschen: Zähl beide Gruppen."
                  - "Hier sind drei, dort sind fünf."
                  - "Fünf ist mehr als drei."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Fische sind es?"
                say: "Wie viele Fische sind in dieser Gruppe?"
                show: { object: fish, count: 4 }
                options: ["4", "3", "5", "zu viele zum Zählen"]
                answer: "4"
                option_audio: false
                feedback:
                  "zu viele zum Zählen": "Ach was, die schaffst du! Zeig auf jeden Fisch und zähl."
                hints:
                  - "Zähl jeden Fisch einmal."
                  - "Eins, zwei, drei, ..."
                  - "4."
              - id: l2-f4
                type: true_false
                text: "Es sind 4 rote und 4 blaue Murmeln. Es sind gleich viele."
                say: "Mia sortiert ihre Murmeln. Es sind vier rote und vier blaue. Stimmt das: Es sind gleich viele?"
                show: { object: marble, groups: [4, 4] }
                answer: true
                hints:
                  - "Vergleiche die Zahlen."
                  - "Vier und vier."
                  - "Ja, gleich viele."
              - id: l2-f5
                type: multiple_choice
                text: "6 Kinder mögen Eis, 2 mögen Kuchen. Wie viele Kinder mehr mögen Eis?"
                say: "In der Gruppe mögen sechs Kinder Eis und zwei Kinder Kuchen. Wie viele Kinder mehr mögen Eis?"
                show: { object: child, groups: [6, 2] }
                options: ["4", "8", "2"]
                answer: "4"
                option_audio: false
                hints:
                  - "Zähl von 2 weiter bis 6."
                  - "3, 4, 5, 6."
                  - "4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Autos sind es?"
                say: "Ben hat seine Autos sortiert. Wie viele sind es?"
                show: { object: car, count: 7, colour: blue }
                options: ["7", "6", "8"]
                answer: "7"
                option_audio: false
                hints: ["Zeig auf jedes Auto."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Wo sind weniger Vögel?"
                say: "Im Garten sitzen Vögel in zwei Gruppen. Wo sind weniger? Zähl genau!"
                options:
                  - { object: bird, count: 4, layout: scattered }
                  - { object: bird, count: 6, layout: row }
                answer: "4"
                hints: ["Zähl beide Gruppen, auch wenn eine größer aussieht."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Sterne sind es?"
                say: "Wie viele Sterne sind in dieser Gruppe?"
                show: { object: star, count: 5 }
                options: ["5", "4", "6"]
                answer: "5"
                option_audio: false
                hints: ["Zähl jeden Stern einmal."]
              - id: l2-s4
                type: true_false
                text: "Es sind 5 Jungen und 3 Mädchen. Es sind mehr Mädchen."
                say: "In der Gruppe sind fünf Jungen und drei Mädchen. Stimmt das: Es sind mehr Mädchen?"
                show: { object: child, groups: [5, 3] }
                answer: false
                hints: ["Fünf oder drei: Was ist mehr?"]
              - id: l2-s5
                type: multiple_choice
                text: "7 Kinder fahren mit dem Rad, 3 mit dem Bus. Wie viele mehr fahren mit dem Rad?"
                say: "Sieben Kinder kommen mit dem Rad zur Schule, drei mit dem Bus. Wie viele Kinder mehr kommen mit dem Rad?"
                show: { object: child, groups: [7, 3] }
                options: ["4", "10", "3"]
                answer: "4"
                option_audio: false
                hints: ["Zähl von 3 weiter bis 7."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Blätter sind es?"
                say: "Wie viele Blätter sind in dieser Gruppe?"
                show: { object: leaf, count: 8, colour: green }
                options: ["8", "7", "9"]
                answer: "8"
                option_audio: false
              - id: l2-n2
                type: image_multiple_choice
                text: "Wo sind mehr Sterne?"
                say: "Lena hat Sterne in zwei Gruppen sortiert. Wo sind mehr?"
                options:
                  - { object: star, count: 4, layout: scattered }
                  - { object: star, count: 6, layout: row }
                answer: "6"
              - id: l2-n3
                type: multiple_choice
                text: "Wie viele Kuchen sind es?"
                say: "Wie viele Kuchen sind in dieser Gruppe?"
                show: { object: cake, count: 3 }
                options: ["3", "2", "4"]
                answer: "3"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Auf dem Sofa liegen 2 Katzen, im Korb 6 Katzen. Im Korb sind mehr Katzen."
                say: "Auf dem Sofa liegen zwei Katzen, im Korb sechs Katzen. Stimmt das: Im Korb sind mehr Katzen?"
                show: { object: cat, groups: [2, 6] }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "8 Kinder mögen Äpfel, 5 mögen Bananen. Wie viele Kinder mehr mögen Äpfel?"
                say: "Acht Kinder mögen Äpfel, fünf mögen Bananen. Wie viele Kinder mehr mögen Äpfel?"
                show: { object: child, groups: [8, 5] }
                options: ["3", "13", "5"]
                answer: "3"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: sort
            type: sorting
            text: "Schule oder Spielzeug?"
            say: "Sortiere: Brauchst du es in der Schule, oder ist es ein Spielzeug?"
            bins:
              - { id: school, show: { text: "Schule" }, say: "Schule" }
              - { id: toy, show: { text: "Spielzeug" }, say: "Spielzeug" }
            options:
              - { object: pencil, bin: school }
              - { object: kite, bin: toy }
              - { object: scissors, bin: school }
              - { object: yo-yo, bin: toy }
          - id: l2-c2
            part: odd-one-out
            type: image_multiple_choice
            text: "Was passt nicht dazu?"
            say: "Drei gehören zusammen. Welches Bild passt nicht?"
            options: [{ object: sun }, { object: moon }, { object: star }, { object: shoe }]
            answer: shoe
          - id: l2-c3
            part: count
            type: multiple_choice
            text: "Wie viele Enten sind es?"
            say: "Wie viele Enten sind in dieser Gruppe?"
            show: { object: duck, count: 5 }
            options: ["5", "4", "6"]
            answer: "5"
            option_audio: false
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Es sind 7 rote und 9 gelbe Blumen. Wovon gibt es mehr?"
            say: "Im Beet sind sieben rote und neun gelbe Blumen. Wovon gibt es mehr?"
            show: { object: flower, groups: [7, 9] }
            options: ["gelbe Blumen", "rote Blumen", "gleich viele"]
            answer: "gelbe Blumen"
          - id: l2-c5
            part: compare
            type: true_false
            text: "Es sind 3 Kinder mit Brille und 3 ohne. Es sind gleich viele."
            say: "In der Gruppe sind drei Kinder mit Brille und drei ohne Brille. Stimmt das: Es sind gleich viele?"
            show: { object: child, groups: [3, 3] }
            answer: true
          - id: l2-c6
            part: sort
            type: sorting
            text: "Essen oder Kleidung?"
            say: "Sortiere: Kann man es essen, oder kann man es anziehen?"
            bins:
              - { id: food, show: { text: "Essen" }, say: "Essen" }
              - { id: clothes, show: { text: "Kleidung" }, say: "Kleidung" }
            options:
              - { object: cheese, bin: food }
              - { object: sock, bin: clothes }
              - { object: strawberry, bin: food }
              - { object: skirt, bin: clothes }
          - id: l2-c7
            part: odd-one-out
            type: image_multiple_choice
