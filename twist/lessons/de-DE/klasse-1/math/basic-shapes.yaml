# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.basic-shapes
skill: math.shapes.basic-shapes
curriculum: de-DE
language: de
title:
  de: Kreis, Dreieck, Rechteck, Quadrat
  en: Circles, triangles, rectangles and squares
summary: >
  Lesson 1 names the four flat shapes by their corners and sides (Ein
  Dreieck hat drei Ecken); lesson 2 tells the square from the rectangle
  (alle Seiten gleich lang), finds a shape turned or in another colour,
  finds the shapes in things around us, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Formen, en: Shapes }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.count-to-5]
  also_practises: []
  vocabulary: { de: [Kreis, Dreieck, Rechteck, Quadrat, Ecke, Seite, rund, gleich lang] }
  forms: [text, audio, drawn]
  drawn: [shape, dots]
  facets: []
  parts:
    - { id: name, what: { de: "Kreis, Dreieck, Rechteck und Quadrat erkennen und benennen", en: "recognising and naming circles, triangles, rectangles and squares" } }
    - { id: corners-sides, what: { de: Formen an ihren Ecken und Seiten unterscheiden, en: telling shapes apart by their corners and sides } }
    - { id: around-us, what: { de: Formen in der Umwelt finden, en: finding shapes around us } }
  misconceptions:
    - id: square-not-rectangle
      what: Thinks a square is never a rectangle, or calls every rectangle a square
      addressed: lesson 2 Learn sets the square against the long rectangle and says the square is a special rectangle; l2-f2, l2-s2 and l2-n2 tell them apart by the sides, with feedback in l2-f2
    - id: colour-or-turn-changes-shape
      what: Thinks a shape changes its name when it has another colour or is turned (a triangle on its tip is no triangle)
      addressed: lesson 2 Learn says a triangle stays a triangle when it is turned or coloured differently; l2-f3, l2-s3 and l2-n3 ask about a turned or recoloured shape
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ecken und Seiten", en: "Corners and sides" }
    goal:
      de: "Zähl Ecken und Seiten und sag, wie die Form heißt. Ein Dreieck hat drei Ecken."
      en: "Count corners and sides and name the shape. A triangle has three corners."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            say: "Wie viele Punkte sind das?"
            show: { drawn: dots, count: 3, layout: dice }
            options: ["3", "4", "2"]
            answer: "3"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist rund?"
            say: "Was ist rund: ein Ball oder ein Buch?"
            options: ["ein Ball", "ein Buch"]
            answer: "ein Ball"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der Kreis"
            say: "Das ist ein Kreis. Er ist ganz rund. Er hat keine Ecken."
            show: { drawn: shape, kind: circle, colour: red }
          - text: "das Dreieck: 3 Ecken, 3 Seiten"
            say: "Das ist ein Dreieck. Es hat drei Ecken und drei gerade Seiten. Darum heißt es Drei-eck."
            show: { drawn: shape, kind: triangle, colour: blue }
          - text: "das Rechteck: 4 Ecken, 4 Seiten"
            say: "Das ist ein Rechteck. Es hat vier Ecken und vier gerade Seiten."
            show: { drawn: shape, kind: rectangle, colour: green }
          - text: "das Quadrat: 4 Ecken, 4 gleich lange Seiten"
            say: "Das ist ein Quadrat. Es hat auch vier Ecken und vier Seiten. Beim Quadrat sind alle vier Seiten gleich lang."
            show: { drawn: shape, kind: square, colour: yellow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wo ist der Kreis?"
                say: "Wo ist der Kreis?"
                options:
                  - { drawn: shape, kind: circle, colour: green }
                  - { drawn: shape, kind: triangle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                answer: circle
                option_audio: false
                hints:
                  - "Ein Kreis ist ganz rund."
                  - "Er hat keine Ecken."
                  - "Der Kreis ist die runde Form."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie heißt diese Form?"
                say: "Wie heißt diese Form?"
                show: { drawn: shape, kind: triangle, colour: orange }
                options: ["Dreieck", "Kreis", "Rechteck"]
                answer: "Dreieck"
                hints:
                  - "Zähl die Ecken."
                  - "Es sind drei Ecken."
                  - "Dreieck."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Ecken hat ein Rechteck?"
                say: "Wie viele Ecken hat ein Rechteck?"
                show: { drawn: shape, kind: rectangle, colour: blue }
                options: ["4", "3", "0"]
                answer: "4"
                option_audio: false
                hints:
                  - "Zähl die Ecken mit dem Finger."
                  - "Oben zwei, unten zwei."
                  - "4."
              - id: l1-f4
                type: true_false
                text: "Ein Kreis hat keine Ecken."
                say: "Stimmt das? Ein Kreis hat keine Ecken."
                show: { drawn: shape, kind: circle, colour: yellow }
                answer: true
                hints:
                  - "Fahr in Gedanken um den Kreis herum."
                  - "Er ist überall rund."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wo ist das Dreieck?"
                say: "Wo ist das Dreieck?"
                options:
                  - { drawn: shape, kind: triangle, colour: red }
                  - { drawn: shape, kind: rectangle, colour: red }
                  - { drawn: shape, kind: circle, colour: red }
                answer: triangle
                option_audio: false
                hints:
                  - "Ein Dreieck hat drei Ecken."
                  - "Zähl bei jeder Form die Ecken."
                  - "Das Dreieck ist die Form mit drei Ecken."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo ist das Rechteck?"
                say: "Wo ist das Rechteck?"
                options:
                  - { drawn: shape, kind: rectangle, colour: purple }
                  - { drawn: shape, kind: triangle, colour: purple }
                  - { drawn: shape, kind: circle, colour: purple }
                answer: rectangle
                option_audio: false
                hints: ["Ein Rechteck hat vier Ecken."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie heißt diese Form?"
                say: "Wie heißt diese Form?"
                show: { drawn: shape, kind: circle, colour: blue }
                options: ["Kreis", "Dreieck", "Quadrat"]
                answer: "Kreis"
                hints: ["Hat sie Ecken?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viele Seiten hat ein Dreieck?"
                say: "Wie viele gerade Seiten hat ein Dreieck?"
                show: { drawn: shape, kind: triangle, colour: green }
                options: ["3", "4", "2"]
                answer: "3"
                option_audio: false
                hints: ["So viele Seiten wie Ecken."]
              - id: l1-s4
                type: true_false
                text: "Ein Dreieck hat 4 Ecken."
                say: "Stimmt das? Ein Dreieck hat vier Ecken."
                answer: false
                hints: ["Der Name verrät es."]
              - id: l1-s5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Form mit ihrem Namen."
                pairs:
                  - { left: { drawn: shape, kind: circle, colour: red }, right: { text: "Kreis" } }
                  - { left: { drawn: shape, kind: triangle, colour: blue }, right: { text: "Dreieck" } }
                  - { left: { drawn: shape, kind: rectangle, colour: yellow }, right: { text: "Rechteck" } }
                hints: ["Zähl die Ecken."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo ist das Quadrat?"
                say: "Wo ist das Quadrat?"
                options:
                  - { drawn: shape, kind: square, colour: orange }
                  - { drawn: shape, kind: circle, colour: orange }
                  - { drawn: shape, kind: triangle, colour: orange }
                answer: square
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Wie heißt diese Form?"
                say: "Wie heißt diese Form?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["Rechteck", "Dreieck", "Kreis"]
                answer: "Rechteck"
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele Ecken hat ein Kreis?"
                say: "Wie viele Ecken hat ein Kreis?"
                options: ["0", "1", "4"]
                answer: "0"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Ein Quadrat hat 4 Ecken."
                say: "Stimmt das? Ein Quadrat hat vier Ecken."
                answer: true
              - id: l1-n5
                type: matching
                text: "Was gehört zusammen?"
                say: "Wie viele Ecken hat jede Form? Verbinde."
                pairs:
                  - { left: { drawn: shape, kind: triangle, colour: purple }, right: { text: "3 Ecken" } }
                  - { left: { drawn: shape, kind: square, colour: purple }, right: { text: "4 Ecken" } }
                  - { left: { drawn: shape, kind: circle, colour: purple }, right: { text: "0 Ecken" } }
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo ist das Dreieck?"
            say: "Tipp auf das Dreieck."
            options:
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
            answer: triangle
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form? Tipp auf den Namen."
            show: { drawn: shape, kind: square, colour: blue }
            options: ["Quadrat", "Kreis", "Dreieck"]
            answer: "Quadrat"
          - id: l1-c3
            type: true_false
            text: "Ein Rechteck hat 3 Seiten."
            say: "Stimmt das? Ein Rechteck hat drei Seiten."
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Welche Form hat 4 Ecken?"
            say: "Welche Form hat vier Ecken?"
            options:
              - { drawn: shape, kind: square, colour: red }
              - { drawn: shape, kind: triangle, colour: red }
              - { drawn: shape, kind: circle, colour: red }
            answer: square
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele Seiten hat ein Quadrat?"
            say: "Wie viele Seiten hat ein Quadrat?"
            show: { drawn: shape, kind: square, colour: green }
            options: ["4", "3", "0"]
            answer: "4"
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Ein Rechteck hat 4 Ecken."
            say: "Stimmt das? Ein Rechteck hat vier Ecken."
            answer: true

  - n: 2
    title: { de: "Quadrat oder Rechteck?", en: "Square or rectangle?" }
    goal:
      de: "Erkenn Quadrat und Rechteck und finde Formen um dich herum. Eine Tür ist ein Rechteck."
      en: "Tell a square from a rectangle and find shapes around you. A door is a rectangle."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Ecken hat ein Dreieck?"
            say: "Wie viele Ecken hat ein Dreieck?"
            options: ["3", "4"]
            answer: "3"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt die runde Form?"
            show: { drawn: shape, kind: circle, colour: green }
            options: ["Kreis", "Quadrat"]
            answer: "Kreis"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Quadrat: alle 4 Seiten gleich lang"
            say: "Beim Quadrat sind alle vier Seiten gleich lang."
            show: { drawn: shape, kind: square, colour: red }
          - text: "Rechteck: 2 lange und 2 kurze Seiten"
            say: "Dieses Rechteck hat zwei lange und zwei kurze Seiten. Ein Quadrat ist ein besonderes Rechteck, bei dem alle Seiten gleich lang sind."
            show: { drawn: shape, kind: rectangle, colour: red }
          - text: "Ein Dreieck bleibt ein Dreieck."
            say: "Wenn du ein Dreieck drehst oder anders anmalst, bleibt es ein Dreieck. Es hat immer noch drei Ecken."
            show: { drawn: shape, kind: triangle, colour: purple }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Form hat ein Teller?"
                say: "Welche Form hat ein Teller, wenn du von oben draufschaust?"
                options: ["Kreis", "Dreieck", "Quadrat"]
                answer: "Kreis"
                hints:
                  - "Ein Teller ist rund."
                  - "Er hat keine Ecken."
                  - "Kreis."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Eine Form hat 4 Ecken. 2 Seiten sind lang, 2 kurz. Welche Form ist das?"
                say: "Eine Form hat vier Ecken. Zwei Seiten sind lang und zwei sind kurz. Welche Form ist das?"
                options: ["ein Rechteck", "ein Quadrat", "ein Dreieck"]
                answer: "ein Rechteck"
                feedback:
                  "ein Quadrat": "Beim Quadrat sind alle Seiten gleich lang. Hier sind zwei lang und zwei kurz."
                hints:
                  - "Sind alle Seiten gleich lang?"
                  - "Nein. Dann ist es kein Quadrat."
                  - "Es ist ein Rechteck."
              - id: l2-f3
                type: true_false
                text: "Lena dreht ein Dreieck auf die Spitze. Ist es noch ein Dreieck?"
                say: "Lena dreht ein Dreieck, bis es auf der Spitze steht. Ist es noch ein Dreieck?"
                answer: true
                hints:
                  - "Zähl die Ecken."
                  - "Es hat immer noch drei Ecken."
                  - "Ja, es ist noch ein Dreieck."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Form hat eine Tür?"
                say: "Welche Form hat eine Tür?"
                options: ["Rechteck", "Kreis", "Dreieck"]
                answer: "Rechteck"
                hints:
                  - "Eine Tür hat vier Ecken."
                  - "Sie ist hoch und schmal."
                  - "Rechteck."
              - id: l2-f5
                type: image_multiple_choice
                text: "Wo sind alle 4 Seiten gleich lang?"
                say: "Bei welcher Form sind alle vier Seiten gleich lang?"
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                answer: square
                option_audio: false
                hints:
                  - "Es muss vier Seiten haben."
                  - "Das Rechteck hat lange und kurze Seiten."
                  - "Das Quadrat."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Das Schild „Vorfahrt achten“ hat 3 Ecken. Welche Form hat es?"
                say: "Das Schild Vorfahrt achten hat drei Ecken. Welche Form hat es?"
                options: ["Dreieck", "Kreis", "Rechteck"]
                answer: "Dreieck"
                hints: ["Drei Ecken."]
              - id: l2-s2
                type: multiple_choice
                text: "Eine Form hat 4 gleich lange Seiten. Welche Form ist das?"
                say: "Eine Form hat vier Ecken und vier gleich lange Seiten. Welche Form ist das?"
                options: ["ein Quadrat", "ein Kreis", "ein Dreieck"]
                answer: "ein Quadrat"
                hints: ["Alle Seiten gleich lang."]
              - id: l2-s3
                type: true_false
                text: "Ein grüner Kreis ist auch ein Kreis."
                say: "Stimmt das? Ein grüner Kreis ist auch ein Kreis."
                answer: true
                hints: ["Ändert die Farbe die Form?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Form haben Fenster oft?"
                say: "Welche Form haben Fenster oft?"
                options: ["Rechteck", "Dreieck", "Kreis"]
                answer: "Rechteck"
                hints: ["Ein Fenster hat meist vier Ecken."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Wo sind 2 Seiten lang und 2 kurz?"
                say: "Bei welcher Form sind zwei Seiten lang und zwei kurz?"
                options:
                  - { drawn: shape, kind: rectangle, colour: orange }
                  - { drawn: shape, kind: square, colour: orange }
                  - { drawn: shape, kind: circle, colour: orange }
                answer: rectangle
                option_audio: false
                hints: ["Beim Quadrat sind alle Seiten gleich."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Form hat eine Münze?"
                say: "Welche Form hat eine Münze?"
                options: ["Kreis", "Quadrat", "Dreieck"]
                answer: "Kreis"
              - id: l2-n2
                type: multiple_choice
                text: "Eine Form hat 4 Ecken, aber nicht alle Seiten sind gleich lang. Welche Form ist das?"
                say: "Eine Form hat vier Ecken, aber nicht alle Seiten sind gleich lang. Welche Form ist das?"
                options: ["ein Rechteck", "ein Quadrat", "ein Kreis"]
                answer: "ein Rechteck"
              - id: l2-n3
                type: true_false
                text: "Ein gedrehtes Quadrat ist kein Quadrat mehr."
                say: "Stimmt das? Wenn du ein Quadrat drehst, ist es kein Quadrat mehr."
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Welche Form hat ein Blatt Papier?"
                say: "Welche Form hat ein Blatt Papier aus deinem Heft?"
                options: ["Rechteck", "Kreis", "Dreieck"]
                answer: "Rechteck"
              - id: l2-n5
                type: image_multiple_choice
                text: "Welche Form hat keine Ecken?"
                say: "Welche Form hat keine Ecken?"
                options:
                  - { drawn: shape, kind: circle, colour: purple }
                  - { drawn: shape, kind: square, colour: purple }
                  - { drawn: shape, kind: triangle, colour: purple }
                answer: circle
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form? Tipp auf den Namen."
            show: { drawn: shape, kind: rectangle, colour: yellow }
            options: ["Quadrat", "Rechteck", "Kreis"]
            answer: "Rechteck"
          - id: l2-c2
            part: corners-sides
            type: multiple_choice
            text: "Wie viele Ecken hat ein Quadrat?"
            say: "Wie viele Ecken hat ein Quadrat?"
            options: ["4", "3", "0"]
            answer: "4"
            option_audio: false
          - id: l2-c3
            part: around-us
            type: multiple_choice
            text: "Welche Form hat ein Rad?"
            say: "Welche Form hat ein Rad, wenn du von der Seite schaust?"
            options: ["Kreis", "Rechteck", "Dreieck"]
            answer: "Kreis"
          - id: l2-c4
            part: corners-sides
            type: multiple_choice
            text: "Eine Form hat 3 Ecken und 3 Seiten. Welche Form ist das?"
            say: "Eine Form hat drei Ecken und drei Seiten. Welche Form ist das?"
            options: ["ein Dreieck", "ein Quadrat", "ein Kreis"]
            answer: "ein Dreieck"
          - id: l2-c5
            part: corners-sides
            type: true_false
            text: "Beim Quadrat sind alle Seiten gleich lang."
            say: "Stimmt das? Beim Quadrat sind alle Seiten gleich lang."
            answer: true
          - id: l2-c6
            part: name
            type: image_multiple_choice
            text: "Wo ist der Kreis?"
            say: "Tipp auf den Kreis."
            options:
              - { drawn: shape, kind: rectangle, colour: orange }
              - { drawn: shape, kind: circle, colour: orange }
              - { drawn: shape, kind: triangle, colour: orange }
            answer: circle
            option_audio: false
          - id: l2-c7
            part: name
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form? Tipp auf den Namen."
            show: { drawn: shape, kind: triangle, colour: red }
            options: ["Dreieck", "Quadrat", "Kreis"]
            answer: "Dreieck"
          - id: l2-c8
            part: name
            type: matching
            text: "Wie heißen die Formen?"
            say: "Wie heißt jede Form? Verbinde sie mit ihrem Namen."
            pairs:
              - { left: { drawn: shape, kind: square, colour: green }, right: { text: "Quadrat" } }
              - { left: { drawn: shape, kind: circle, colour: yellow }, right: { text: "Kreis" } }
              - { left: { drawn: shape, kind: triangle, colour: red }, right: { text: "Dreieck" } }
          - id: l2-c9
            part: name
            type: true_false
            text: "Diese Form ist ein Kreis."
            say: "Stimmt das? Diese Form ist ein Kreis."
            show: { drawn: shape, kind: triangle, colour: green }
            answer: false
          - id: l2-c10
            part: name
            type: image_multiple_choice
            text: "Wo ist das Quadrat?"
            say: "Tipp auf das Quadrat."
            options:
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: square, colour: blue }
            answer: square
            option_audio: false
          - id: l2-c11
            part: name
            type: true_false
            text: "Diese Form ist ein Rechteck."
            say: "Stimmt das? Diese Form ist ein Rechteck."
            show: { drawn: shape, kind: rectangle, colour: orange }
            answer: true
          - id: l2-c12
            part: corners-sides
            type: multiple_choice
            text: "Wie viele Seiten hat ein Rechteck?"
            say: "Wie viele Seiten hat ein Rechteck?"
            show: { drawn: shape, kind: rectangle, colour: yellow }
            options: ["4", "3", "2"]
            answer: "4"
            option_audio: false
          - id: l2-c13
            part: corners-sides
            type: image_multiple_choice
            text: "Welche Form hat 3 Ecken?"
            say: "Welche Form hat drei Ecken?"
            options:
              - { drawn: shape, kind: square, colour: green }
              - { drawn: shape, kind: triangle, colour: green }
              - { drawn: shape, kind: circle, colour: green }
            answer: triangle
            option_audio: false
          - id: l2-c14
            part: corners-sides
            type: true_false
            text: "Ein Dreieck hat 4 Seiten."
            say: "Stimmt das? Ein Dreieck hat vier Seiten."
            answer: false
          - id: l2-c15
            part: corners-sides
            type: multiple_choice
            text: "Eine Form ist ganz rund und hat keine Ecken. Welche Form ist das?"
            say: "Eine Form ist ganz rund und hat keine Ecken. Welche Form ist das?"
            options: ["ein Kreis", "ein Dreieck", "ein Rechteck"]
            answer: "ein Kreis"
          - id: l2-c16
            part: around-us
            type: multiple_choice
            text: "Welche Form hat eine Tafel in der Schule?"
            say: "Welche Form hat eine Tafel in der Schule?"
            options: ["Rechteck", "Kreis", "Dreieck"]
            answer: "Rechteck"
          - id: l2-c17
            part: around-us
            type: multiple_choice
            text: "Du schaust von vorne auf einen Spielwürfel. Welche Form siehst du?"
            say: "Du schaust von vorne auf einen Spielwürfel. Welche Form siehst du?"
            options: ["Quadrat", "Kreis", "Dreieck"]
            answer: "Quadrat"
          - id: l2-c18
