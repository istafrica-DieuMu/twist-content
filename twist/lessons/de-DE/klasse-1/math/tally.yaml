# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.tally
skill: math.data.tally
curriculum: de-DE
language: de
title:
  de: Strichlisten
  en: Tally charts
summary: >
  Lesson 1 reads a Strichliste: four strokes and the fifth across make a
  bundle of 5 (Fünferbündel), so 7 is a bundle and two more; lesson 2
  reads a class survey in a Strichliste (Lieblingsobst, Lieblingsfarbe),
  says which is the most and how many more, and ends with the skill
  check. Making the strokes with a finger waits for a drawing task.
metadata:
  year: klasse-1
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.data.sort-classify, math.numbers-to-20.subitize-to-10]
  also_practises: [math.data.sort-classify]
  vocabulary: { de: [Strichliste, Strich, Fünferbündel, Umfrage, am meisten, am wenigsten] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, dots]
  facets: []
  parts:
    - { id: read, what: { de: eine Strichliste mit Fünferbündeln auszählen, en: counting a tally with bundles of five } }
    - { id: show, what: { de: die Strichliste zu einer Zahl finden, en: finding the tally for a number } }
    - { id: survey, what: { de: eine Zeile in einer Umfrage ablesen, en: reading one row of a survey } }
    - { id: compare, what: { de: Ergebnisse einer Umfrage vergleichen, en: comparing the results of a survey } }
  misconceptions:
    - id: bundle-as-one
      what: Counts a Fünferbündel as one stroke, or counts the crossing stroke twice
      addressed: "lesson 1 Learn counts a bundle stroke by stroke; in every stage of lesson 1 the bundle tasks offer the count with each bundle as 1 and with the crossing stroke counted twice, with feedback in l1-f2"
    - id: longest-row-not-counted
      what: Picks the most popular answer by the length of the row without counting the strokes
      addressed: "lesson 2 Learn counts each row before naming the most; l2-f2 hints count each row; l2-f2, l2-s2 and l2-n2 ask for the most or the fewest"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Striche zählen", en: "Counting strokes" }
    goal:
      de: "Zähl Striche in einer Strichliste. Der fünfte Strich geht quer, so siehst du sofort fünf."
      en: "Count the marks in a tally. The fifth mark goes across, so you see five straight away."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Punkte sind es?"
            say: "Wie viele Punkte sind das?"
            show: { drawn: dots, count: 5, layout: dice }
            options: ["5", "4", "6"]
            answer: "5"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5 + 2 = _"
            say: "Fünf plus zwei."
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wie viele Striche sind das?"
            say: "Ben zählt Autos. Für jedes Auto, das vorbeifährt, macht er einen Strich. Was glaubst du: Wie viele Autos hat er schon gezählt?"
            show: { drawn: bar-chart, tally: true, rows: [["", 4]] }
          - text: "1, 2, 3, 4"
            say: "Vier Autos! In einer Strichliste machst du für jedes Ding einen Strich. Eins, zwei, drei, vier."
            show: { drawn: bar-chart, tally: true, rows: [["", 4]] }
          - text: "5: der fünfte Strich geht quer"
            say: "Den fünften Strich machst du quer über die vier. Das ist ein Fünferbündel. So siehst du sofort: fünf."
            show: { drawn: bar-chart, tally: true, rows: [["", 5]] }
          - text: "7 = 5 und 2"
            say: "Hier ist ein Fünferbündel und noch zwei Striche. Fünf und zwei sind sieben."
            show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
          - text: "Wusstest du? Schon vor mehr als 20 000 Jahren haben Menschen zum Zählen Striche in Knochen geritzt."
            say: "Wusstest du? Schon vor mehr als zwanzigtausend Jahren haben Menschen zum Zählen Striche in Knochen geritzt. Solche Knochen hat man in Afrika gefunden. Das waren Strichlisten aus der Steinzeit!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Striche sind es?"
                say: "Wie viele Striche sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 3]] }
                options: ["3", "4", "2", "ein Kamm"]
                answer: "3"
                option_audio: false
                feedback:
                  "ein Kamm": "Sieht ein bisschen aus wie ein Kamm, oder? Aber hier zählst du Striche."
                hints:
                  - "Zeig auf jeden Strich."
                  - "Eins, zwei, ..."
                  - "3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele sind es?"
                say: "Ein Fünferbündel und noch ein Strich. Wie viele sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 6]] }
                options: ["6", "2", "7"]
                answer: "6"
                option_audio: false
                feedback:
                  "2": "Das Bündel zählt nicht als ein Strich. Ein Fünferbündel sind fünf Striche."
                  "7": "Der Querstrich ist der fünfte Strich. Zähl ihn nur einmal."
                hints:
                  - "Ein Fünferbündel sind 5."
                  - "5 und 1 mehr."
                  - "6."
              - id: l1-f3
                type: multiple_choice
                text: "Wie viele Autos hat Ben gezählt?"
                say: "Ben macht für jedes Auto einen Strich. Wie viele Autos hat er gezählt?"
                show: { drawn: bar-chart, tally: true, rows: [["", 8]] }
                options: ["8", "4", "9"]
                answer: "8"
                option_audio: false
                hints:
                  - "Zuerst das Fünferbündel."
                  - "5 und 3."
                  - "8."
              - id: l1-f4
                type: true_false
                text: "Das sind 10 Striche."
                say: "Zwei Fünferbündel. Stimmt das: Das sind zehn Striche?"
                show: { drawn: bar-chart, tally: true, rows: [["", 10]] }
                answer: true
                hints:
                  - "Ein Bündel sind 5."
                  - "5 und 5."
                  - "Ja, das sind 10."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welche Strichliste zeigt 4?"
                say: "Welche Strichliste zeigt vier?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["", 4]], key: "4" }
                  - { drawn: bar-chart, tally: true, rows: [["", 5]], key: "5" }
                  - { drawn: bar-chart, tally: true, rows: [["", 3]], key: "3" }
                answer: "4"
                option_audio: false
                hints:
                  - "Bei vier gibt es noch keinen Querstrich."
                  - "Zähl die Striche."
                  - "Vier Striche ohne Querstrich."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Striche sind es?"
                say: "Wie viele Striche sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 2]] }
                options: ["2", "3", "1"]
                answer: "2"
                option_audio: false
                hints: ["Zeig auf jeden Strich."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie viele sind es?"
                say: "Wie viele sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 5]] }
                options: ["5", "1", "6"]
                answer: "5"
                option_audio: false
                hints: ["Der Querstrich ist der fünfte."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie viele sind es?"
                say: "Wie viele sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 9]] }
                options: ["9", "5", "10"]
                answer: "9"
                option_audio: false
                hints: ["5 und 4."]
              - id: l1-s4
                type: true_false
                text: "Das sind 6 Striche."
                say: "Stimmt das: Das sind sechs Striche?"
                show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
                answer: false
                hints: ["Ein Fünferbündel und wie viele mehr?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welche Strichliste zeigt 7?"
                say: "Welche Strichliste zeigt sieben?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["", 7]], key: "7" }
                  - { drawn: bar-chart, tally: true, rows: [["", 2]], key: "2" }
                  - { drawn: bar-chart, tally: true, rows: [["", 6]], key: "6" }
                answer: "7"
                option_audio: false
                hints: ["Sieben ist ein Fünferbündel und zwei."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Striche sind es?"
                say: "Wie viele Striche sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 4]] }
                options: ["4", "5", "3"]
                answer: "4"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele sind es?"
                say: "Wie viele sind es?"
                show: { drawn: bar-chart, tally: true, rows: [["", 11]] }
                options: ["11", "3", "12"]
                answer: "11"
                option_audio: false
              - id: l1-n3
                type: multiple_choice
                text: "Wie viele Vögel hat Mia gezählt?"
                say: "Mia macht für jeden Vogel im Garten einen Strich. Wie viele Vögel hat sie gezählt?"
                show: { drawn: bar-chart, tally: true, rows: [["", 13]] }
                options: ["13", "5", "14"]
                answer: "13"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Das sind 8 Striche."
                say: "Stimmt das: Das sind acht Striche?"
                show: { drawn: bar-chart, tally: true, rows: [["", 8]] }
                answer: true
              - id: l1-n5
                type: image_multiple_choice
                text: "Welche Strichliste zeigt 10?"
                say: "Welche Strichliste zeigt zehn?"
                options:
                  - { drawn: bar-chart, tally: true, rows: [["", 10]], key: "10" }
                  - { drawn: bar-chart, tally: true, rows: [["", 9]], key: "9" }
                  - { drawn: bar-chart, tally: true, rows: [["", 12]], key: "12" }
                answer: "10"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Striche sind es?"
            say: "Wie viele Striche sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 10]] }
            options: ["10", "2", "12"]
            answer: "10"
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Ein Fünferbündel sind 5 Striche."
            say: "Stimmt das? Ein Fünferbündel sind fünf Striche."
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Welche Strichliste zeigt 6?"
            say: "Welche Strichliste zeigt sechs?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 6]], key: "6" }
              - { drawn: bar-chart, tally: true, rows: [["", 4]], key: "4" }
              - { drawn: bar-chart, tally: true, rows: [["", 8]], key: "8" }
            answer: "6"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Wie viele Striche sind es?"
            say: "Wie viele Striche sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 14]] }
            options: ["14", "4", "15"]
            answer: "14"
            option_audio: false
          - id: l1-c5
            type: true_false
            text: "Das sind 7 Striche."
            say: "Stimmt das: Das sind sieben Striche?"
            show: { drawn: bar-chart, tally: true, rows: [["", 6]] }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Welche Strichliste zeigt 11?"
            say: "Welche Strichliste zeigt elf?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 10]], key: "10" }
              - { drawn: bar-chart, tally: true, rows: [["", 11]], key: "11" }
              - { drawn: bar-chart, tally: true, rows: [["", 13]], key: "13" }
            answer: "11"
            option_audio: false

  - n: 2
    title: { de: "Eine Umfrage in der Klasse", en: "A class survey" }
    goal:
      de: "Lies eine Umfrage in einer Strichliste. Find heraus, welches Obst die meisten Kinder mögen."
      en: "Read a class survey in a tally chart. Find out which fruit most children like."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            say: "Wie viele sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 6]] }
            options: ["6", "2"]
            answer: "6"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist mehr: 7 oder 4?"
            say: "Was ist mehr: sieben oder vier?"
            options: ["7", "4"]
            answer: "7"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Welches Obst mögen die meisten?"
            say: "Apfel, Banane oder Erdbeere? Was glaubst du: Welches Obst mögen die meisten Kinder in einer Klasse?"
          - text: "Was ist dein Lieblingsobst?"
            say: "Finden wir es heraus! Die Klasse macht eine Umfrage: Was ist dein Lieblingsobst? Für jedes Kind kommt ein Strich in die Zeile mit seinem Obst."
            show: { drawn: bar-chart, tally: true, rows: [["Apfel", 6], ["Banane", 4], ["Erdbeere", 8]] }
          - text: "Apfel 6 · Banane 4 · Erdbeere 8"
            say: "Jetzt zählst du jede Zeile. Apfel: sechs. Banane: vier. Erdbeere: acht. Erdbeeren mögen die meisten Kinder."
            show: { drawn: bar-chart, tally: true, rows: [["Apfel", 6], ["Banane", 4], ["Erdbeere", 8]] }
          - text: "8 − 4 = 4"
            say: "Wie viele Kinder mehr mögen Erdbeeren als Bananen? Acht minus vier: vier Kinder mehr."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Kinder mögen Rot?"
                say: "Die Klasse hat nach der Lieblingsfarbe gefragt. Wie viele Kinder mögen Rot?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 7], ["Blau", 5], ["Grün", 3]] }
                options: ["7", "5", "2"]
                answer: "7"
                option_audio: false
                hints:
                  - "Such die Zeile mit Rot."
                  - "Ein Fünferbündel und zwei."
                  - "7."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Farbe mögen die meisten?"
                say: "Welche Farbe mögen die meisten Kinder?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 7], ["Blau", 5], ["Grün", 3]] }
                options: ["Rot", "Blau", "Grün", "Pink mit Glitzer"]
                answer: "Rot"
                feedback:
                  "Pink mit Glitzer": "Pink mit Glitzer ist schön, aber das steht nicht in der Liste. Zähl jede Zeile."
                hints:
                  - "Zähl jede Zeile."
                  - "Rot 7, Blau 5, Grün 3."
                  - "Rot."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Kinder mehr mögen Rot als Grün?"
                say: "Wie viele Kinder mehr mögen Rot als Grün?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 7], ["Blau", 5], ["Grün", 3]] }
                options: ["4", "10", "3"]
                answer: "4"
                option_audio: false
                hints:
                  - "Rot sind 7, Grün sind 3."
                  - "7 − 3."
                  - "4."
              - id: l2-f4
                type: true_false
                text: "Blau mögen 5 Kinder."
                say: "Stimmt das? Blau mögen fünf Kinder."
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 7], ["Blau", 5], ["Grün", 3]] }
                answer: true
                hints:
                  - "Such die Zeile mit Blau."
                  - "Dort ist genau ein Fünferbündel."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Kinder haben mitgemacht?"
                say: "Wie viele Kinder haben zusammen bei der Umfrage mitgemacht?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 7], ["Blau", 5], ["Grün", 3]] }
                options: ["15", "7", "12"]
                answer: "15"
                option_audio: false
                hints:
                  - "Zähl alle Zeilen zusammen."
                  - "7 + 5 + 3."
                  - "15."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Wie viele Kinder kommen zu Fuß?"
                say: "Die Klasse hat gefragt: Wie kommst du zur Schule? Wie viele Kinder kommen zu Fuß? Tipp die Zahl ein."
                show: { drawn: bar-chart, tally: true, rows: [["zu Fuß", 9], ["Auto", 4], ["Bus", 6]] }
                answer: "9"
                hints: ["Such die Zeile „zu Fuß“."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie kommen die wenigsten Kinder zur Schule?"
                say: "Wie kommen die wenigsten Kinder zur Schule?"
                show: { drawn: bar-chart, tally: true, rows: [["zu Fuß", 9], ["Auto", 4], ["Bus", 6]] }
                options: ["mit dem Auto", "zu Fuß", "mit dem Bus"]
                answer: "mit dem Auto"
                hints: ["Am wenigsten heißt: die kleinste Zahl."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Kinder mehr kommen zu Fuß als mit dem Bus?"
                say: "Wie viele Kinder mehr kommen zu Fuß als mit dem Bus?"
                show: { drawn: bar-chart, tally: true, rows: [["zu Fuß", 9], ["Auto", 4], ["Bus", 6]] }
                options: ["3", "15", "5"]
                answer: "3"
                option_audio: false
                hints: ["9 − 6."]
              - id: l2-s4
                type: true_false
                text: "Mit dem Bus kommen 5 Kinder."
                say: "Stimmt das? Mit dem Bus kommen fünf Kinder."
                show: { drawn: bar-chart, tally: true, rows: [["zu Fuß", 9], ["Auto", 4], ["Bus", 6]] }
                answer: false
                hints: ["Ein Fünferbündel und noch ein Strich."]
              - id: l2-s5
                type: multiple_choice
                text: "Auto und Bus zusammen: Wie viele Kinder sind das?"
                say: "Mit dem Auto und mit dem Bus zusammen: Wie viele Kinder sind das?"
                show: { drawn: bar-chart, tally: true, rows: [["zu Fuß", 9], ["Auto", 4], ["Bus", 6]] }
                options: ["10", "6", "2"]
                answer: "10"
                option_audio: false
                hints: ["4 + 6."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Wie viele Kinder haben eine Katze?"
                say: "Die Klasse hat nach Haustieren gefragt. Wie viele Kinder haben eine Katze? Tipp die Zahl ein."
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 8], ["Fisch", 2]] }
                answer: "8"
              - id: l2-n2
                type: multiple_choice
                text: "Welches Haustier haben die meisten?"
                say: "Welches Haustier haben die meisten Kinder?"
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 8], ["Fisch", 2]] }
                options: ["Katze", "Hund", "Fisch"]
                answer: "Katze"
              - id: l2-n3
                type: multiple_choice
                text: "Wie viele Kinder mehr haben einen Hund als einen Fisch?"
                say: "Wie viele Kinder mehr haben einen Hund als einen Fisch?"
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 8], ["Fisch", 2]] }
                options: ["4", "8", "2"]
                answer: "4"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Einen Fisch haben 2 Kinder."
                say: "Stimmt das? Einen Fisch haben zwei Kinder."
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 8], ["Fisch", 2]] }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Hund und Katze zusammen: Wie viele Kinder sind das?"
                say: "Kinder mit Hund und Kinder mit Katze zusammen: Wie viele sind das?"
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 8], ["Fisch", 2]] }
                options: ["14", "8", "2"]
                answer: "14"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "Wie viele Striche sind es?"
            say: "Wie viele Striche sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 12]] }
            options: ["12", "4", "14"]
            answer: "12"
            option_audio: false
          - id: l2-c2
            part: survey
            type: multiple_choice
            text: "Wie viele Kinder mögen Fußball?"
            say: "Die Klasse hat nach dem Lieblingssport gefragt. Wie viele Kinder mögen Fußball?"
            show: { drawn: bar-chart, tally: true, rows: [["Fußball", 8], ["Schwimmen", 5], ["Turnen", 4]] }
            options: ["8", "5", "4"]
            answer: "8"
            option_audio: false
          - id: l2-c3
            part: compare
            type: multiple_choice
            text: "Welchen Sport mögen die wenigsten?"
            say: "Welchen Sport mögen die wenigsten Kinder?"
            show: { drawn: bar-chart, tally: true, rows: [["Fußball", 8], ["Schwimmen", 5], ["Turnen", 4]] }
            options: ["Turnen", "Schwimmen", "Fußball"]
            answer: "Turnen"
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Wie viele Kinder mehr mögen Fußball als Schwimmen?"
            say: "Wie viele Kinder mehr mögen Fußball als Schwimmen?"
            show: { drawn: bar-chart, tally: true, rows: [["Fußball", 8], ["Schwimmen", 5], ["Turnen", 4]] }
            options: ["3", "13", "4"]
            answer: "3"
            option_audio: false
          - id: l2-c5
            part: show
            type: image_multiple_choice
            text: "Welche Strichliste zeigt 9?"
            say: "Welche Strichliste zeigt neun?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 9]], key: "9" }
              - { drawn: bar-chart, tally: true, rows: [["", 4]], key: "4" }
              - { drawn: bar-chart, tally: true, rows: [["", 8]], key: "8" }
            answer: "9"
            option_audio: false
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "Wie viele Striche sind es?"
            say: "Wie viele Striche sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 16]] }
            options: ["16", "4", "17"]
            answer: "16"
            option_audio: false
          - id: l2-c7
            part: show
