# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.order-to-20
skill: math.numbers-to-20.order-to-20
curriculum: de-DE
language: de
title:
  de: Zahlen bis 20 ordnen
  en: Ordering numbers to 20
summary: >
  The numbers to 20 in order. Lesson 1 finds numbers on the Zahlenstrahl
  to 20, with the long stroke at ten as a landmark, and names the numbers
  before and after; lesson 2 orders numbers, counts forwards and
  backwards across ten, continues sequences in steps of 2, and ends with
  the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.teens, math.numbers-to-20.order-to-10]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { de: [Zahlenstrahl, Vorgänger, Nachfolger, Nachbarzahl, vorwärts, rückwärts] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  parts:
    - { id: line, what: { de: Zahlen bis 20 am Zahlenstrahl finden und ablesen, en: finding and reading numbers to 20 on the number line } }
    - { id: neighbours, what: { de: "Vorgänger, Nachfolger und Nachbarzahlen bis 20", en: "the number before, the number after and neighbours to 20" } }
    - { id: order, what: { de: Zahlen bis 20 der Größe nach ordnen, en: putting numbers to 20 in order of size } }
    - { id: count, what: { de: vorwärts und rückwärts über die Zehn zählen, en: counting forwards and backwards across ten } }
    - { id: steps, what: { de: Zahlenfolgen in Zweierschritten fortsetzen, en: continuing sequences in steps of 2 } }
  misconceptions:
    - id: count-ticks-from-zero
      what: Counts every stroke from 0 to find a teen number
      addressed: Learn shows the long stroke at 10 as a landmark; hints say "Fang bei der Zehn an"
    - id: stuck-at-ten
      what: Counting backwards, jumps from 11 to 9 or stops at 10
      addressed: lesson 2 counts backwards across ten in every stage; the full-stage true/false task leaves out the 10, with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der Zahlenstrahl bis 20, en: The number line to 20 }
    goal:
      de: "Find Zahlen auf dem Zahlenstrahl bis 20. Für die 13 fängst du bei der 10 an und gehst drei weiter."
      en: "Find numbers on the number line to 20. For 13, start at 10 and go three more."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Zahl kommt nach 9?"
            say: "Welche Zahl kommt nach neun?"
            options: ["10", "8", "11"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Schreib die Zahl."
            say: "Schreib die Zahl dreizehn."
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0 … 10 … 20"
            say: "Das ist der Zahlenstrahl bis zwanzig. Links ist die Null, rechts die Zwanzig. Der lange Strich in der Mitte ist die Zehn."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
          - text: "10 → 13"
            say: "Für dreizehn fängst du bei der Zehn an und gehst drei Striche weiter: elf, zwölf, dreizehn. Du musst nicht von null an zählen."
            show: { drawn: number-line, from: 0, to: 20, labels: tens, mark: 13 }
          - text: "14, 15, 16"
            say: "Die Nachbarzahlen von fünfzehn sind vierzehn und sechzehn. Vierzehn kommt vor fünfzehn, sechzehn kommt nach fünfzehn."
            show: { drawn: number-line, from: 0, to: 20, labels: all }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Wo ist die 12? Tippe auf den Zahlenstrahl."
                say: "Wo ist die Zwölf? Tippe auf den Zahlenstrahl."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 12
                hints:
                  - "Fang bei der langen Zehn in der Mitte an."
                  - "Geh zwei Striche weiter: elf, zwölf."
                  - "Tippe auf den zweiten Strich nach der Zehn."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Zahl kommt nach 15?"
                say: "Welche Zahl kommt nach fünfzehn?"
                options: ["16", "14", "51"]
                answer: "16"
                hints:
                  - "Nach heißt: eins mehr."
                  - "Fünfzehn, dann ..."
                  - "16."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens, mark: 17 }
                options: ["17", "7", "18"]
                answer: "17"
                feedback:
                  "7": "Der Pfeil steht rechts von der Zehn. Fang bei zehn an: siebzehn."
                hints:
                  - "Steht der Pfeil vor oder nach der Zehn?"
                  - "Zähl von der Zehn aus weiter."
                  - "Siebzehn: 17."
              - id: l1-f4
                type: fill_in_blank
                text: "Welche Nachbarzahlen hat die 11?"
                say: "Welche Zahlen sind die Nachbarn von elf?"
                frame: "_ , 11, _"
                options: ["9", "10", "12", "13"]
                answer: ["10", "12"]
                hints:
                  - "Der Nachbar davor ist eins weniger."
                  - "Der Nachbar danach ist eins mehr."
                  - "10 und 12."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl kommt vor 20?"
                say: "Welche Zahl kommt vor zwanzig?"
                options: ["19", "21", "10"]
                answer: "19"
                hints:
                  - "Vor heißt: eins weniger."
                  - "Zähl rückwärts von zwanzig."
                  - "19."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Wo ist die 16? Tippe auf den Zahlenstrahl."
                say: "Wo ist die Sechzehn? Tippe auf den Zahlenstrahl."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 16
                hints: ["Fang bei der Zehn an."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Zahl kommt vor 14?"
                say: "Welche Zahl kommt vor vierzehn?"
                options: ["13", "15", "41"]
                answer: "13"
                hints: ["Vor heißt eins weniger."]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens, mark: 14 }
                options: ["14", "4", "15"]
                answer: "14"
                hints: ["Zähl von der Zehn aus."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Nachbarzahlen hat die 18?"
                say: "Welche Zahlen sind die Nachbarn von achtzehn?"
                frame: "_ , 18, _"
                options: ["16", "17", "19", "20"]
                answer: ["17", "19"]
                hints: ["Eins weniger und eins mehr."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 13 kommt nach 12."
                say: "Kommt dreizehn nach zwölf?"
                answer: true
                hints: ["Ist dreizehn eins mehr als zwölf?"]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Wo ist die 19? Tippe auf den Zahlenstrahl."
                say: "Wo ist die Neunzehn? Tippe auf den Zahlenstrahl."
                show: { drawn: number-line, from: 0, to: 20, labels: tens }
                answer: 19
              - id: l1-n2
                type: multiple_choice
                text: "Welche Zahl kommt nach 10?"
                say: "Welche Zahl kommt nach zehn?"
                options: ["11", "9", "20"]
                answer: "11"
              - id: l1-n3
                type: multiple_choice
                text: "Welche Zahl zeigt der Pfeil?"
                say: "Welche Zahl zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 20, labels: tens, mark: 11 }
                options: ["11", "1", "12"]
                answer: "11"
              - id: l1-n4
                type: fill_in_blank
                text: "Welche Nachbarzahlen hat die 14?"
                say: "Welche Zahlen sind die Nachbarn von vierzehn?"
                frame: "_ , 14, _"
                options: ["12", "13", "15", "16"]
                answer: ["13", "15"]
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 17 kommt vor 16."
                say: "Kommt siebzehn vor sechzehn?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Wo ist die 15? Tippe auf den Zahlenstrahl."
            say: "Wo ist die Fünfzehn? Tippe auf den Zahlenstrahl."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 15
          - id: l1-c2
            type: multiple_choice
            text: "Welche Zahl kommt nach 17?"
            say: "Welche Zahl kommt nach siebzehn?"
            options: ["18", "16", "71"]
            answer: "18"
          - id: l1-c3
            type: fill_in_blank
            text: "Welche Nachbarzahlen hat die 16?"
            say: "Welche Zahlen sind die Nachbarn von sechzehn?"
            frame: "_ , 16, _"
            options: ["14", "15", "17", "18"]
            answer: ["15", "17"]
          - id: l1-c4
            type: multiple_choice
            text: "Welche Zahl zeigt der Pfeil?"
            say: "Welche Zahl zeigt der Pfeil?"
            show: { drawn: number-line, from: 0, to: 20, labels: tens, mark: 16 }
            options: ["16", "6", "17"]
            answer: "16"
          - id: l1-c5
            type: multiple_choice
            text: "Welche Zahl kommt vor 12?"
            say: "Welche Zahl kommt vor zwölf?"
            options: ["11", "13", "21"]
            answer: "11"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 15 kommt vor 14."
            say: "Kommt fünfzehn vor vierzehn?"
            answer: false

  - n: 2
    title: { de: Vorwärts und rückwärts, en: Forwards and backwards }
    goal:
      de: "Zähl vorwärts und rückwärts über die 10 und in Zweierschritten. Zwölf, elf, zehn, neun, vergiss die Zehn nicht."
      en: "Count forwards and backwards past 10, and in twos. Twelve, eleven, ten, nine, do not skip the ten."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Zahl kommt vor 18?"
            say: "Welche Zahl kommt vor achtzehn?"
            options: ["17", "19", "81"]
            answer: "17"
            difficulty: easy
          - id: l2-w2
            type: point_on_line
            text: "Wo ist die 13? Tippe auf den Zahlenstrahl."
            say: "Wo ist die Dreizehn? Tippe auf den Zahlenstrahl."
            show: { drawn: number-line, from: 0, to: 20, labels: tens }
            answer: 13
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "8, 9, 10, 11, 12"
            say: "Vorwärts über die Zehn: acht, neun, zehn, elf, zwölf. Nach der Neun kommt die Zehn, dann geht es mit elf weiter."
          - text: "12, 11, 10, 9, 8"
            say: "Rückwärts geht es genauso über die Zehn: zwölf, elf, zehn, neun, acht. Vergiss die Zehn nicht."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[12, -1], [11, -1], [10, -1], [9, -1]] }
          - text: "2, 4, 6, 8 …"
            say: "Man kann auch in Zweierschritten zählen: zwei, vier, sechs, acht, zehn, zwölf. Jedes Mal kommen zwei dazu."
            show: { drawn: number-line, from: 0, to: 20, labels: all, jumps: [[0, 2], [2, 2], [4, 2], [6, 2]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Bring die Zahlen in die richtige Reihenfolge. Die kleinste zuerst."
                say: "Bring die Zahlen in die richtige Reihenfolge. Die kleinste zuerst."
                options: ["15", "11", "19", "13"]
                slot_count: 4
                answer: ["11", "13", "15", "19"]
                hints:
                  - "Alle haben einen Zehner. Schau auf die Einer."
                  - "Elf hat die wenigsten Einer."
                  - "11, 13, 15, 19."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Zähl rückwärts."
                say: "Zähl rückwärts. Welche Zahlen fehlen?"
                frame: "11, _ , _ , 8, 7"
                options: ["9", "10", "6", "12"]
                answer: ["10", "9"]
                hints:
                  - "Nach elf kommt rückwärts die Zehn."
                  - "Dann die Neun."
                  - "10 und 9."
              - id: l2-f3
                type: fill_in_blank
                text: "Setz die Reihe fort."
                say: "Zähl in Zweierschritten weiter."
                frame: "10, 12, 14, _ , _"
                options: ["15", "16", "18", "17"]
                answer: ["16", "18"]
                hints:
                  - "Es kommen immer zwei dazu."
                  - "Vierzehn und zwei."
                  - "16 und 18."
              - id: l2-f4
                type: ordering
                text: "Zähl rückwärts. Die größte zuerst."
                say: "Zähl rückwärts. Die größte Zahl zuerst."
                options: ["11", "13", "10", "12"]
                slot_count: 4
                answer: ["13", "12", "11", "10"]
                hints:
                  - "Welche Zahl ist die größte?"
                  - "Dreizehn, dann zwölf."
                  - "13, 12, 11, 10."
              - id: l2-f5
                type: true_false
                text: "Jemand zählt rückwärts: 11, 9, 8, 7. Stimmt das?"
                say: "Jemand zählt rückwärts: elf, neun, acht, sieben. Stimmt das?"
                answer: false
                feedback:
                  "true": "Zwischen elf und neun fehlt die Zehn."
                hints:
                  - "Zähl selbst rückwärts von elf."
                  - "Elf, ..."
                  - "Nein, die 10 fehlt."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Bring die Zahlen in die richtige Reihenfolge. Die kleinste zuerst."
                say: "Bring die Zahlen in die richtige Reihenfolge. Die kleinste zuerst."
                options: ["17", "9", "20", "12"]
                slot_count: 4
                answer: ["9", "12", "17", "20"]
                hints: ["Welche Zahl hat keinen Zehner?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Zähl rückwärts."
                say: "Zähl rückwärts. Welche Zahlen fehlen?"
                frame: "20, 19, _ , _ , 16"
                options: ["18", "17", "15", "21"]
                answer: ["18", "17"]
                hints: ["Rückwärts heißt immer eins weniger."]
              - id: l2-s3
                type: fill_in_blank
                text: "Setz die Reihe fort."
                say: "Zähl in Zweierschritten weiter."
                frame: "3, 5, 7, _ , _"
                options: ["8", "9", "11", "10"]
                answer: ["9", "11"]
                hints: ["Wie viele kommen jedes Mal dazu?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Zahl fehlt? 9, 10, _, 12"
                say: "Welche Zahl fehlt? Neun, zehn, ..., zwölf."
                options: ["11", "13", "1"]
                answer: "11"
                hints: ["Was kommt nach zehn?"]
              - id: l2-s5
                type: true_false
                text: "Jemand zählt in Zweierschritten: 14, 16, 18, 20. Stimmt das?"
                say: "Jemand zählt in Zweierschritten: vierzehn, sechzehn, achtzehn, zwanzig. Stimmt das?"
                answer: true
                hints: ["Kommen immer zwei dazu?"]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
