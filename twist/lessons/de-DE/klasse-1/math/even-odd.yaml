# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.even-odd
skill: math.numbers-to-20.even-odd
curriculum: de-DE
language: de
title:
  de: Gerade und ungerade Zahlen
  en: Even and odd numbers
summary: >
  Even numbers can be shared into pairs with none left over; odd numbers
  always leave one. Lesson 1 makes pairs with dots up to 10 and sorts
  numbers; lesson 2 reads even and odd from the last digit to 20, links
  even numbers to doubles, and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 20, en: Numbers to 20 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.double-halve-to-20]
  also_practises: [math.numbers-to-20.order-to-20]
  vocabulary: { de: [gerade, ungerade, Paar, übrig, Einer] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: pairs, what: { de: "Paare bilden und sehen, ob eins übrig bleibt", en: "making pairs and seeing whether one is left over" } }
    - { id: to-10, what: { de: gerade und ungerade Zahlen bis 10, en: even and odd numbers to 10 } }
    - { id: to-20, what: { de: gerade und ungerade Zahlen bis 20 an den Einern erkennen, en: telling even and odd numbers to 20 by the ones } }
    - { id: steps, what: { de: gerade und ungerade Zahlen in Zweierschritten weiterzählen, en: counting on in steps of two through even or odd numbers } }
  misconceptions:
    - id: whole-number-look
      what: Calls 12 or 14 odd because the 1 in front is odd
      addressed: lesson 2 Learn says only the Einer decide; teen numbers in every stage of lesson 2, with feedback in the full stage
    - id: zero-ones-unclear
      what: Is unsure whether 10 and 20 are even
      addressed: lesson 2 Learn shows 10 as five pairs; 10 and 20 appear in practise and the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Paare bilden, en: Making pairs }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Das Doppelte von 4"
            say: "Was ist das Doppelte von vier?"
            options: ["8", "6", "5"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "Die Hälfte von 10"
            say: "Was ist die Hälfte von zehn?"
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6 → 3 Paare"
            say: "Sechs Kinder stellen sich zu zweit auf. Es gibt drei Paare, keins bleibt übrig. Sechs ist eine gerade Zahl."
            show: { drawn: dots, count: 6, layout: dice }
          - text: "7 → 3 Paare und 1"
            say: "Bei sieben Kindern gibt es drei Paare, und eins bleibt allein übrig. Sieben ist eine ungerade Zahl."
            show: { drawn: dots, count: 7, layout: dice }
          - text: "gerade: 2, 4, 6, 8, 10 · ungerade: 1, 3, 5, 7, 9"
            say: "Gerade Zahlen gehen in Paaren auf: zwei, vier, sechs, acht, zehn. Bei ungeraden bleibt immer eins übrig: eins, drei, fünf, sieben, neun."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Hier sind 8 Punkte. Ist 8 gerade oder ungerade?"
                say: "Hier sind acht Punkte. Ist acht gerade oder ungerade?"
                show: { drawn: dots, count: 8, layout: dice }
                options: ["gerade", "ungerade"]
                answer: "gerade"
                hints:
                  - "Bilde Paare."
                  - "Acht sind vier Paare, keiner bleibt übrig."
                  - "Gerade."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "5 Kinder bilden Paare. Bleibt ein Kind übrig?"
                say: "Fünf Kinder bilden Paare. Bleibt ein Kind übrig?"
                show: { object: child, count: 5, layout: row }
                answer: true
                hints:
                  - "Zwei Paare sind vier Kinder."
                  - "Fünf ist eins mehr als vier."
                  - "Ja, eins bleibt übrig."
              - id: l1-f3
                type: sorting
                text: "Gerade oder ungerade?"
                say: "Sortiere die Zahlen: gerade oder ungerade?"
                option_audio: false
                bins:
                  - { id: even, show: { text: "gerade" }, say: "gerade" }
                  - { id: odd, show: { text: "ungerade" }, say: "ungerade" }
                options:
                  - { text: "4", bin: even }
                  - { text: "3", bin: odd }
                  - { text: "10", bin: even }
                  - { text: "9", bin: odd }
                hints:
                  - "Kannst du die Zahl in Paare teilen?"
                  - "Vier und zehn gehen in Paaren auf."
                  - "Gerade: 4, 10. Ungerade: 3, 9."
              - id: l1-f4
                type: multiple_choice
                text: "Hier sind 9 Punkte. Ist 9 gerade oder ungerade?"
                say: "Hier sind neun Punkte. Ist neun gerade oder ungerade?"
                show: { drawn: dots, count: 9, layout: row }
                options: ["gerade", "ungerade"]
                answer: "ungerade"
                feedback:
                  "gerade": "Bilde Paare: Vier Paare sind acht, dann bleibt einer übrig. Neun ist ungerade."
                hints:
                  - "Bilde Paare."
                  - "Vier Paare und einer übrig."
                  - "Ungerade."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl ist gerade?"
                say: "Welche Zahl ist gerade?"
                options: ["2", "5", "9"]
                answer: "2"
                option_audio: false
                hints:
                  - "Welche Zahl geht in Paaren auf?"
                  - "Zwei ist ein Paar."
                  - "2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Hier sind 10 Punkte. Ist 10 gerade oder ungerade?"
                say: "Hier sind zehn Punkte. Ist zehn gerade oder ungerade?"
                show: { drawn: dots, count: 10, layout: dice }
                options: ["gerade", "ungerade"]
                answer: "gerade"
                hints: ["Bleibt beim Paarebilden einer übrig?"]
              - id: l1-s2
                type: true_false
