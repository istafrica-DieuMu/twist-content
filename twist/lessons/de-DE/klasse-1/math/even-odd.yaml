                say: "Hier sind drei Punkte. Ist drei gerade oder ungerade?"
                show: { drawn: dots, count: 3, layout: row }
                options: ["gerade", "ungerade"]
                answer: "ungerade"
                hints: ["Ein Paar sind zwei."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl ist ungerade?"
                say: "Welche Zahl ist ungerade?"
                options: ["6", "9", "4"]
                answer: "9"
                option_audio: false
                hints: ["Bei welcher Zahl bleibt einer übrig?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Hier sind 7 Punkte. Ist 7 gerade oder ungerade?"
                say: "Hier sind sieben Punkte. Ist sieben gerade oder ungerade?"
                show: { drawn: dots, count: 7, layout: dice }
                options: ["gerade", "ungerade"]
                answer: "ungerade"
              - id: l1-n2
                type: true_false
                text: "6 Kinder bilden Paare. Bleibt ein Kind übrig?"
                say: "Sechs Kinder bilden Paare. Bleibt ein Kind übrig?"
                show: { object: child, count: 6, layout: row }
                answer: false
              - id: l1-n3
                type: sorting
                text: "Gerade oder ungerade?"
                say: "Sortiere die Zahlen: gerade oder ungerade?"
                option_audio: false
                bins:
                  - { id: even, show: { text: "gerade" }, say: "gerade" }
                  - { id: odd, show: { text: "ungerade" }, say: "ungerade" }
                options:
                  - { text: "2", bin: even }
                  - { text: "7", bin: odd }
                  - { text: "4", bin: even }
                  - { text: "3", bin: odd }
              - id: l1-n4
                type: multiple_choice
                text: "Welche Zahl ist gerade?"
                say: "Welche Zahl ist gerade?"
                options: ["1", "7", "8"]
                answer: "8"
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Hier sind 2 Punkte. Ist 2 gerade oder ungerade?"
                say: "Hier sind zwei Punkte. Ist zwei gerade oder ungerade?"
                show: { drawn: dots, count: 2, layout: row }
                options: ["gerade", "ungerade"]
                answer: "gerade"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Hier sind 5 Punkte. Ist 5 gerade oder ungerade?"
            say: "Hier sind fünf Punkte. Ist fünf gerade oder ungerade?"
