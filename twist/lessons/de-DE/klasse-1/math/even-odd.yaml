            say: "Zehn sind fünf Paare, keiner bleibt übrig. Zehn ist gerade, und zwanzig auch."
            show: { drawn: dots, count: 10, layout: dice }
          - text: "14: die 4 entscheidet"
            say: "Bei Zahlen bis zwanzig schaust du nur auf die Einer. Vierzehn hat vier Einer. Vier ist gerade, also ist vierzehn gerade. Die Eins vorne ist der Zehner, der zählt nicht."
          - text: "gerade Einer: 0, 2, 4, 6, 8"
            say: "Endet eine Zahl auf null, zwei, vier, sechs oder acht, ist sie gerade. Endet sie auf eins, drei, fünf, sieben oder neun, ist sie ungerade. Gerade Zahlen sind auch immer Verdopplungen: sechs und sechs sind zwölf."

