# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.write-numerals-to-10
skill: math.numbers-to-20.write-numerals-to-10
curriculum: de-DE
language: de
title:
  de: Die Ziffern 0 bis 10
  en: The numerals 0 to 10
summary: >
  Children read and write the numerals and match each to its amount.
  Lesson 1 takes 1 to 5, lesson 2 takes 6 to 10, each with how the numeral
  is written; lesson 3 adds 0, mixes all of them and ends with the skill
  check. When a task asks which numeral fits, the numeral options have no
  speaker, because hearing "drei" would give the answer.
metadata:
  year: klasse-1
  topic: { de: Zahlen bis 10, en: Numbers to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { de: [Ziffer, Zahl, null, schreiben, Strich, Bogen, Kreis] }
  forms: [drawn, picture, text, audio]
  drawn: [letter-card, writing-lines, dots, ten-frame]
  facets: [script]
  parts:
    - { id: amount-to-numeral, what: { de: die passende Ziffer zu einer Anzahl finden, en: finding the numeral for an amount } }
    - { id: hear, what: { de: eine gehörte Zahl als Ziffer erkennen, en: recognising a numeral you hear } }
    - { id: numeral-to-amount, what: { de: die passende Anzahl zu einer Ziffer finden, en: finding the amount for a numeral } }
    - { id: read, what: { de: Ziffern lesen und auseinanderhalten, en: reading numerals and telling them apart } }
  misconceptions:
    - id: mirror
      what: Writes some numerals mirrored (2, 3, 7, 9)
      addressed: tracing starts at the green dot; Learn describes each numeral's strokes (1 to 5 over the trace guide in lesson 1, 6 to 10 in lesson 2, 0 in lesson 3); copy tasks come only after tracing
    - id: six-nine
      what: Mixes up 6 and 9
      addressed: lesson 2 Learn contrasts them (6 has its circle at the bottom, 9 at the top); options set 6 against 9
    - id: ten-two-numerals
      what: Thinks 10 is a new single numeral, or reads 10 as "eins null"
      addressed: lesson 2 Learn shows that 10 is written with a 1 and a 0
    - id: zero-nothing
      what: Does not see 0 as a number, only as "nothing"
      addressed: lesson 3 Learn shows 0 as an empty ten-frame and puts 0 before 1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die Ziffern 1 bis 5, en: The numerals 1 to 5 }
    goal:
      de: "Lies und schreib die Ziffern von 1 bis 5. Fang immer am grünen Punkt oben an."
      en: "Read and write the numbers 1 to 5. Always start at the green dot at the top."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "Tippe jeden Apfel einmal an. Wie viele sind es?"
            show: { object: apple, count: 3, layout: row }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Bälle sind es?"
            show: { object: ball, count: 5, layout: scattered }
            options: ["4", "5", "6"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1"
            say: "Das ist die Ziffer 1. Sie steht für eins: einen Apfel."
            show: { object: apple, count: 1, layout: row }
          - text: "2, 3, 4, 5"
            say: "Und so geht es weiter: zwei, drei, vier, fünf. Jede Ziffer sagt, wie viele es sind."
            show: { drawn: dots, count: 5, layout: dice }
          - text: "1"
            say: "Ziffern kann man schreiben. Jede fängt am grünen Punkt oben an. Die 1: erst ein kleiner Strich schräg hoch, dann ein langer Strich gerade nach unten."
            show: { drawn: writing-lines, text: "1", mode: trace, arrows: true }
          - text: "2"
            say: "Die 2: oben ein Bogen nach rechts, dann schräg nach unten links, unten ein Strich nach rechts."
            show: { drawn: writing-lines, text: "2", mode: trace, arrows: true }
          - text: "3"
            say: "Die 3: oben ein Bogen nach rechts bis zur Mitte, dann noch ein Bogen nach rechts bis unten."
            show: { drawn: writing-lines, text: "3", mode: trace, arrows: true }
          - text: "4"
            say: "Die 4: oben anfangen, schräg nach unten, dann quer nach rechts. Dann oben neu ansetzen und gerade nach unten."
            show: { drawn: writing-lines, text: "4", mode: trace, arrows: true }
          - text: "5"
            say: "Die 5: oben anfangen, ein Strich nach unten, dann ein Bauch nach rechts. Zum Schluss oben das Dach nach rechts."
            show: { drawn: writing-lines, text: "5", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Äpfel sind es? Tippe auf die passende Ziffer."
                show: { object: apple, count: 3, layout: row }
                options: ["2", "3", "5"]
                answer: "3"
                option_audio: false
                hints:
                  - "Zähl zuerst die Äpfel."
                  - "Es sind drei Äpfel. Wie sieht die Drei aus?"
                  - "Die 3 hat zwei Bögen, die nach links offen sind."
                difficulty: easy
              - id: l1-f2
                type: tracing
                text: "Schreib die 2 nach."
                show: { drawn: writing-lines, text: "2", mode: trace, arrows: true }
                char: "2"
              - id: l1-f3
                type: audio_choice
                text: "Welche Ziffer hörst du?"
                audio: { de: "Vier." }
                options: ["1", "4", "5"]
                answer: "4"
                hints:
                  - "Hör noch einmal hin."
                  - "Vier kommt nach drei."
                  - "Die 4 hat einen Strich nach unten und einen quer."
              - id: l1-f4
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: "Tippe auf eine Ziffer und dann auf das passende Würfelbild."
                pairs:
                  - left: { text: "1" }
                    right: { drawn: dots, count: 1, layout: dice }
                  - left: { text: "3" }
                    right: { drawn: dots, count: 3, layout: dice }
                  - left: { text: "5" }
                    right: { drawn: dots, count: 5, layout: dice }
                hints:
                  - "Fang mit der 1 an: Welcher Würfel hat nur einen Punkt?"
                  - "Die 3 hat drei Punkte in einer Linie."
                  - "Die 5 hat einen Punkt in der Mitte."
              - id: l1-f5
                type: true_false
                text: "Ist das die 4?"
                say: "Schau dir die Ziffer an. Ist das die Vier?"
                show: { drawn: letter-card, text: "4" }
                answer: true
                hints:
                  - "Die 4 hat einen Strich nach unten und einen quer."
                  - "Sieht diese Ziffer so aus?"
                  - "Ja, das ist die 4."
              - id: l1-f6
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Bälle sind es? Tippe auf die passende Ziffer."
                show: { object: ball, count: 2, layout: row }
                options: ["2", "4", "1"]
                answer: "2"
                option_audio: false
                hints:
                  - "Zähl die Bälle."
                  - "Es sind zwei. Die 2 hat einen Bogen und unten einen geraden Strich."
                  - "Tippe auf die 2."
                difficulty: easy

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Eier sind es? Tippe auf die passende Ziffer."
                show: { object: egg, count: 4, layout: row }
                options: ["3", "4", "5"]
                answer: "4"
                option_audio: false
                hints: ["Zähl zuerst, dann such die Ziffer."]
              - id: l1-s2
                type: tracing
                text: "Schreib die 3 nach."
                show: { drawn: writing-lines, text: "3", mode: trace, arrows: true }
                char: "3"
              - id: l1-s3
                type: audio_choice
                text: "Welche Ziffer hörst du?"
                audio: { de: "Zwei." }
                options: ["2", "3", "5"]
                answer: "2"
                hints: ["Zwei kommt nach eins."]
              - id: l1-s4
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: "Tippe auf eine Ziffer und dann auf das passende Bild."
                pairs:
                  - left: { text: "2" }
                    right: { drawn: dots, count: 2, layout: dice }
                  - left: { text: "4" }
                    right: { drawn: dots, count: 4, layout: dice }
                  - left: { text: "3" }
                    right: { drawn: dots, count: 3, layout: scattered }
                hints: ["Zähl die Punkte in jedem Bild."]
              - id: l1-s5
                type: true_false
                text: "Ist das die 3?"
                say: "Schau dir die Ziffer an. Ist das die Drei?"
                show: { drawn: letter-card, text: "5" }
                answer: false
                hints: ["Die 3 hat zwei Bögen. Hat diese Ziffer zwei Bögen?"]
              - id: l1-s6
                type: tracing
                text: "Schreib die 4 nach."
                show: { drawn: writing-lines, text: "4", mode: trace, arrows: true }
                char: "4"

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Erdbeeren sind es? Tippe auf die passende Ziffer."
                show: { object: strawberry, count: 5, layout: row }
                options: ["4", "5", "3"]
                answer: "5"
                option_audio: false
              - id: l1-n2
                type: audio_choice
                text: "Welche Ziffer hörst du?"
                audio: { de: "Drei." }
                options: ["3", "1", "4"]
                answer: "3"
              - id: l1-n3
                type: tracing
                text: "Schreib die 5 ab."
                show: { drawn: writing-lines, text: "5", mode: copy, arrows: false }
                char: "5"
              - id: l1-n4
                type: true_false
                text: "Ist das die 1?"
                say: "Schau dir die Ziffer an. Ist das die Eins?"
                show: { drawn: letter-card, text: "1" }
                answer: true
                difficulty: easy
              - id: l1-n5
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
                show: { drawn: dots, count: 2, layout: dice }
                options: ["1", "2", "3"]
                answer: "2"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Ziffer passt?"
            say: "Wie viele Fische sind es? Tippe auf die passende Ziffer."
            show: { object: fish, count: 4, layout: row }
            options: ["4", "2", "5"]
            answer: "4"
            option_audio: false
          - id: l1-c2
            type: audio_choice
            text: "Welche Ziffer hörst du?"
            audio: { de: "Fünf." }
            options: ["5", "4", "2"]
            answer: "5"
          - id: l1-c3
            type: matching
            option_audio: false
            text: "Was passt zusammen?"
            say: "Tippe auf eine Ziffer und dann auf das passende Würfelbild."
            pairs:
              - left: { text: "2" }
                right: { drawn: dots, count: 2, layout: dice }
              - left: { text: "4" }
                right: { drawn: dots, count: 4, layout: dice }
              - left: { text: "1" }
                right: { drawn: dots, count: 1, layout: dice }
          - id: l1-c4
            type: true_false
            text: "Ist das die 2?"
            say: "Schau dir die Ziffer an. Ist das die Zwei?"
            show: { drawn: letter-card, text: "3" }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Welche Ziffer passt?"
            say: "Wie viele Erdbeeren sind es? Tippe auf die passende Ziffer."
            show: { object: strawberry, count: 3, layout: row }
            options: ["3", "2", "5"]
            answer: "3"
            option_audio: false
          - id: l1-c6
            type: audio_choice
            text: "Welche Ziffer hörst du?"
            audio: { de: "Eins." }
            options: ["4", "1", "3"]
            answer: "1"

  - n: 2
    title: { de: Die Ziffern 6 bis 10, en: The numerals 6 to 10 }
    goal:
      de: "Lies und schreib die Ziffern von 6 bis 10. Bei der 6 ist der Kreis unten, bei der 9 oben."
      en: "Read and write the numbers 6 to 10. The 6 has its circle at the bottom, the 9 at the top."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Welche Ziffer hörst du?"
            audio: { de: "Vier." }
            options: ["4", "3", "5"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Ziffer passt?"
            say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
            show: { drawn: dots, count: 5, layout: dice }
            options: ["3", "5", "4"]
            answer: "5"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "6"
            say: "Das ist die 6: ein Bogen von oben, der unten zu einem Kreis wird. Sechs Punkte im Zehnerfeld: eine volle Reihe und einer."
            show: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
          - text: "7"
            say: "Die 7: oben ein Strich nach rechts, dann ein langer Strich schräg nach unten."
            show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
          - text: "8"
            say: "Die 8 sieht aus wie zwei Kreise übereinander. Du schreibst sie in einem Zug: oben anfangen, nach links herum, schräg durch die Mitte, unten herum und wieder hoch zum Anfang."
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
          - text: "9"
            say: "Die 9: oben ein Kreis, dann ein Strich nach unten. Pass auf: Bei der 6 ist der Kreis unten, bei der 9 oben."
            show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
          - text: "10"
            say: "Die 10 schreibt man mit zwei Ziffern: einer 1 und einer 0. Das Zehnerfeld ist voll."
            show: { drawn: ten-frame, filled: 10 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["6", "7", "9"]
                answer: "7"
                option_audio: false
                hints:
                  - "Oben ist die Reihe voll: fünf. Und unten?"
                  - "Fünf und zwei sind sieben."
                  - "Die 7 hat oben einen Strich und dann einen schrägen Strich nach unten."
              - id: l2-f2
                type: tracing
                text: "Schreib die 6 nach."
                show: { drawn: writing-lines, text: "6", mode: trace, arrows: true }
                char: "6"
              - id: l2-f3
                type: audio_choice
                text: "Welche Ziffer hörst du?"
                audio: { de: "Neun." }
                options: ["6", "9", "8"]
                answer: "9"
                feedback:
                  "6": "Das ist die 6, ihr Kreis ist unten. Bei der 9 ist der Kreis oben."
                hints:
                  - "Hör noch einmal hin."
                  - "Neun kommt kurz vor zehn."
                  - "Die 9 hat den Kreis oben."
              - id: l2-f4
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: "Tippe auf eine Ziffer und dann auf das passende Zehnerfeld."
                pairs:
                  - left: { text: "6" }
                    right: { drawn: ten-frame, filled: 6, colour_split: [5, 1] }
                  - left: { text: "8" }
                    right: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                  - left: { text: "10" }
                    right: { drawn: ten-frame, filled: 10 }
                hints:
                  - "Oben ist bei allen die Reihe voll. Schau nach unten."
                  - "Unten ein Punkt: Das ist sechs. Unten drei Punkte: Das ist acht."
                  - "Die 10 ist das volle Zehnerfeld."
              - id: l2-f5
                type: true_false
                text: "Ist das die 8?"
                say: "Schau dir die Ziffer an. Ist das die Acht?"
                show: { drawn: letter-card, text: "8" }
                answer: true
                hints:
                  - "Die 8 sieht aus wie zwei Kreise übereinander."
                  - "Hat diese Ziffer zwei Kreise?"
                  - "Ja, das ist die 8."
              - id: l2-f6
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Murmeln sind es? Tippe auf die passende Ziffer."
                show: { object: marble, count: 10, layout: row }
                options: ["10", "1", "9"]
                answer: "10"
                option_audio: false
                feedback:
                  "1": "Die 1 ist nur eine Murmel. Zehn schreibt man mit einer 1 und einer 0."
                hints:
                  - "Zähl die Murmeln."
                  - "Es sind zehn."
                  - "Die 10 hat zwei Ziffern: eine 1 und eine 0."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                options: ["9", "6", "8"]
                answer: "9"
                option_audio: false
                hints: ["Fünf und vier sind ..."]
              - id: l2-s2
                type: tracing
                text: "Schreib die 7 nach."
                show: { drawn: writing-lines, text: "7", mode: trace, arrows: true }
                char: "7"
              - id: l2-s3
                type: audio_choice
                text: "Welche Ziffer hörst du?"
                audio: { de: "Sechs." }
                options: ["9", "6", "7"]
                answer: "6"
                hints: ["Bei der 6 ist der Kreis unten."]
              - id: l2-s4
                type: true_false
                text: "Ist das die 9?"
                say: "Schau dir die Ziffer an. Ist das die Neun?"
                show: { drawn: letter-card, text: "6" }
                answer: false
                hints: ["Ist der Kreis oben oder unten?"]
              - id: l2-s5
                type: matching
                option_audio: false
                text: "Was passt zusammen?"
                say: "Tippe auf eine Ziffer und dann auf das passende Bild."
                pairs:
                  - left: { text: "7" }
                    right: { drawn: dots, count: 7, layout: five-structure, colour_split: [5, 2] }
                  - left: { text: "9" }
                    right: { drawn: dots, count: 9, layout: five-structure, colour_split: [5, 4] }
                  - left: { text: "6" }
                    right: { drawn: dots, count: 6, layout: five-structure, colour_split: [5, 1] }
                hints: ["Eine volle Reihe ist fünf. Zähl dazu, was darunter liegt."]
              - id: l2-s6
                type: tracing
                text: "Schreib die 8 nach."
                show: { drawn: writing-lines, text: "8", mode: trace, arrows: true }
                char: "8"

          - support: none
            tasks:
              - id: l2-n1
                type: audio_choice
                text: "Welche Ziffer hörst du?"
                audio: { de: "Acht." }
                options: ["8", "6", "3"]
                answer: "8"
              - id: l2-n2
                type: tracing
                text: "Schreib die 9 nach."
                show: { drawn: writing-lines, text: "9", mode: trace, arrows: true }
                char: "9"
              - id: l2-n3
                type: multiple_choice
                text: "Welche Ziffer passt?"
                say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
                show: { drawn: dots, count: 6, layout: dice }
                options: ["6", "9", "5"]
                answer: "6"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Ist das die 7?"
                say: "Schau dir die Ziffer an. Ist das die Sieben?"
                show: { drawn: letter-card, text: "7" }
                answer: true
              - id: l2-n5
                type: tracing
                text: "Schreib die 10 ab."
                show: { drawn: writing-lines, text: "10", mode: copy, arrows: false }
                char: "10"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welche Ziffer passt?"
            say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
            show: { drawn: dots, count: 8, layout: five-structure, colour_split: [5, 3] }
            options: ["9", "8", "6"]
            answer: "8"
            option_audio: false
          - id: l2-c2
            type: audio_choice
            text: "Welche Ziffer hörst du?"
            audio: { de: "Sieben." }
            options: ["1", "7", "9"]
            answer: "7"
          - id: l2-c3
            type: true_false
            text: "Ist das die 6?"
            say: "Schau dir die Ziffer an. Ist das die Sechs?"
            show: { drawn: letter-card, text: "9" }
            answer: false
          - id: l2-c4
            type: matching
            option_audio: false
            text: "Was passt zusammen?"
            say: "Tippe auf eine Ziffer und dann auf das passende Bild."
            pairs:
              - left: { text: "7" }
                right: { drawn: dots, count: 7, layout: scattered }
              - left: { text: "9" }
                right: { drawn: dots, count: 9, layout: row }
              - left: { text: "6" }
                right: { drawn: dots, count: 6, layout: dice }
          - id: l2-c5
            type: audio_choice
            text: "Welche Ziffer hörst du?"
            audio: { de: "Zehn." }
            options: ["1", "9", "10"]
            answer: "10"
          - id: l2-c6
            type: multiple_choice
            text: "Welche Ziffer passt?"
            say: "Wie viele Eier sind es? Tippe auf die passende Ziffer."
            show: { object: egg, count: 9, layout: row }
            options: ["6", "9", "8"]
            answer: "9"
            option_audio: false

  - n: 3
    title: { de: "Null, Zahl und Menge", en: "Zero, numeral and amount" }
    goal:
      de: "Lerne die Null kennen und find zu jeder Ziffer die passende Menge. Null heißt gar nichts."
      en: "Meet zero and match each number to the right amount. Zero means nothing at all."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: audio_choice
            text: "Welche Ziffer hörst du?"
            audio: { de: "Neun." }
            options: ["9", "6", "7"]
            answer: "9"
            difficulty: easy
          - id: l3-w2
            type: multiple_choice
            text: "Welche Ziffer passt?"
            say: "Wie viele Punkte sind es? Tippe auf die passende Ziffer."
            show: { drawn: ten-frame, filled: 10 }
            options: ["1", "10", "9"]
            answer: "10"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "0"
            say: "Das ist die 0. Null heißt: gar nichts. Im Zehnerfeld liegt kein Plättchen."
            show: { drawn: ten-frame, filled: 0 }
          - text: "0, 1, 2, 3"
            say: "Die Null steht ganz vorne, noch vor der Eins: null, eins, zwei, drei."
            show: { drawn: letter-card, text: "0 1 2 3" }
          - text: "0"
