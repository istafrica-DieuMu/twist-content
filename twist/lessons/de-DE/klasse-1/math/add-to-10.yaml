# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.add-to-10
skill: math.add-sub-to-20.add-to-10
curriculum: de-DE
language: de
title:
  de: Plusaufgaben bis 10
  en: Adding to 10
summary: >
  Solving plus sums to 10, first to 5 and then to 10, by counting on from
  the bigger number and by using the five in the ten-frame. Lesson 1 adds
  to 5 and starts counting on; lesson 2 adds to 10 with the Kraft der 5
  and ends with the skill check.
metadata:
  year: klasse-1
  topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-20.add-meaning]
  also_practises: [math.numbers-to-20.subitize-to-10]
  vocabulary: { de: [plus, gleich, weiterzählen, Ergebnis, Zehnerfeld] }
  forms: [drawn, picture, text, audio]
  drawn: [ten-frame, number-line]
  facets: []
  parts:
    - { id: to-5, what: { de: Plusaufgaben bis 5, en: additions to 5 } }
    - { id: to-10, what: { de: Plusaufgaben bis 10, en: additions to 10 } }
    - { id: count-on, what: { de: "weiterzählen, auch von der größeren Zahl aus", en: "counting on, also from the bigger number" } }
  misconceptions:
    - id: count-from-one
      what: Counts both parts from one every time
      addressed: lesson 1 counts on from the first number ("Fang bei der ersten Zahl an und zähl weiter"); lesson 2 starts at the bigger number
    - id: start-counting-on-same
      what: Counts the start number twice when counting on (3 + 2 as 3, 4 = 4)
      addressed: Learn says the next number after the start, with jumps on the number line
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Plus bis 5, en: Adding to 5 }
    goal:
      de: "Merk dir die erste Zahl und zähl einfach weiter. So rechnest du 3 + 2 ganz schnell."
      en: "Keep the first number in your head and count on. That makes 3 + 2 quick."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Aufgabe passt?"
            say: "Zwei rote Punkte und noch zwei blaue dazu. Welche Plusaufgabe passt?"
            show: { drawn: ten-frame, filled: 4, colour_split: [2, 2] }
            options: ["2 + 2", "2 + 1", "4 + 2"]
            answer: "2 + 2"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was kommt nach 4?"
            say: "Welche Zahl kommt nach vier?"
            options: ["3", "5", "6"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "3 + 2 = ?"
            say: "Drei plus zwei. Was glaubst du: Musst du dafür alle Punkte von vorne zählen?"
            show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }
          - text: "3 … 4, 5"
            say: "Musst du nicht! Merk dir die Drei und zähl weiter: vier, fünf. Zwei Schritte weiter."
            show: { drawn: number-line, from: 0, to: 10, labels: all, jumps: [[3, 1], [4, 1]] }
          - text: "3 + 2 = 5"
            say: "Drei plus zwei gleich fünf. Fang bei der ersten Zahl an und zähl weiter."
          - text: "0 + 4 = 4"
            say: "Und plus null? Dann kommt nichts dazu. Null plus vier ist vier."
            show: { drawn: ten-frame, filled: 4 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "2 + 1 = ?"
                show: { drawn: ten-frame, filled: 3, colour_split: [2, 1] }
                options: ["2", "3", "4"]
                answer: "3"
                hints:
                  - "Fang bei 2 an."
                  - "Zähl einen weiter: drei."
                  - "2 + 1 = 3."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "4 Enten schwimmen im Teich. 1 kommt dazu. 4 + 1 = ?"
                say: "Vier Enten schwimmen im Teich. Eine Ente kommt dazu. Vier plus eins, wie viele sind es?"
                show: { object: duck, groups: [4, 1] }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Fang bei 4 an."
                  - "Einen weiter."
                  - "4 + 1 = 5."
              - id: l1-f3
                type: point_on_line
                text: "Wo landest du? 2 + 3"
                say: "Fang bei zwei an, drei Schritte weiter. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 5
                hints:
                  - "Fang bei 2 an."
                  - "Drei Schritte: drei, vier, fünf."
                  - "Du landest bei 5."
              - id: l1-f4
                type: text_input
                text: "1 + 3 = _"
                answer: "4"
                hints:
                  - "Fang bei der Eins an."
                  - "Zähl drei weiter: zwei, drei, vier."
                  - "4."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 2 + 2 = 4"
                answer: true
                hints:
                  - "Fang bei 2 an."
                  - "Zwei weiter: drei, vier."
                  - "Ja."
              - id: l1-f6
                type: multiple_choice
                text: "3 + 2 = ?"
                show: { drawn: ten-frame, filled: 5, colour_split: [3, 2] }
                options: ["4", "5", "6"]
                answer: "5"
                hints:
                  - "Fang bei 3 an."
                  - "Vier, fünf."
                  - "5."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "1 Socke und noch 1 Socke. 1 + 1 = ?"
                say: "Eine Socke und noch eine Socke. Eins plus eins, wie viele Socken sind es?"
                show: { object: sock, groups: [1, 1] }
                options: ["1", "2", "3"]
                answer: "2"
                feedback:
                  "1": "Nur eine Socke? Dann hat die Waschmaschine wieder eine verschluckt! Eins und noch eins sind zwei."
                hints: ["Eins und noch eins."]
              - id: l1-s2
                type: text_input
                text: "3 + 1 = _"
                answer: "4"
                hints: ["Einen weiter."]
              - id: l1-s3
                type: point_on_line
                text: "Wo landest du? 1 + 4"
                say: "Fang bei eins an, vier Schritte weiter. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 5
                hints: ["Zähl von eins aus vier Schritte weiter."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 3 + 1 = 5"
                answer: false
                hints: ["Nur einen weiter."]
              - id: l1-s5
                type: multiple_choice
                text: "2 + 3 = ?"
                show: { drawn: ten-frame, filled: 5, colour_split: [2, 3] }
                options: ["4", "5", "6"]
                answer: "5"
                hints: ["Fang bei 2 an und zähl drei weiter."]
              - id: l1-s6
                type: text_input
                text: "0 + 4 = _"
                answer: "4"
                hints: ["Null dazu ändert nichts."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "4 + 1 = ?"
                show: { drawn: ten-frame, filled: 5, colour_split: [4, 1] }
                options: ["4", "5", "6"]
                answer: "5"
              - id: l1-n2
                type: text_input
                text: "2 + 2 = _"
                answer: "4"
              - id: l1-n3
                type: point_on_line
                text: "Wo landest du? 3 + 2"
                say: "Wo landest du? Drei plus zwei."
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 5
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 1 + 2 = 3"
                answer: true
              - id: l1-n5
                type: text_input
                text: "Im Korb liegen 5 Äpfel. 0 kommen dazu. 5 + 0 = _"
                say: "Im Korb liegen fünf Äpfel. Null Äpfel kommen dazu, also gar keiner. Fünf plus null?"
                show: { object: apple, count: 5 }
                answer: "5"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "2 + 3 = _"
            answer: "5"
          - id: l1-c2
            type: multiple_choice
            text: "1 + 3 = ?"
            options: ["3", "4", "5"]
            answer: "4"
          - id: l1-c3
            type: point_on_line
            text: "Wo landest du? 4 + 1"
            say: "Wo landest du? Vier plus eins."
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 5
          - id: l1-c4
            type: text_input
            text: "0 + 5 = _"
            answer: "5"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 1 + 3 = 5"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "1 + 2 = ?"
            show: { drawn: ten-frame, filled: 3, colour_split: [1, 2] }
            options: ["2", "3", "4"]
            answer: "3"

  - n: 2
    title: { de: Plus bis 10, en: Adding to 10 }
    goal:
      de: "Rechne Plusaufgaben bis 10. Die volle Fünferreihe hilft dir, so wie bei 5 + 3."
      en: "Add numbers up to 10. The full row of five helps you, like in 5 + 3."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 + 2 = _"
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 + 1 = ?"
            options: ["4", "5", "6"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 + 3 = ?"
            say: "Fünf plus drei. Im Zehnerfeld ist die obere Reihe voll: das sind fünf. Unten kommen drei dazu. Was glaubst du: Wie viele sind es zusammen? Rate, ohne zu zählen!"
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
          - text: "5 + 3 = 8"
            say: "Es sind acht. Fünf und drei sind acht. Die volle Fünferreihe hilft: Du siehst sie, ohne zu zählen."
            show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
          - text: "2 + 6 = 6 + 2"
            say: "Bei zwei plus sechs fängst du bei der größeren Zahl an, bei der Sechs. Dann zählst du zwei weiter: sieben, acht."
          - text: "Wusstest du? Ein Krake hat 8 Arme und 3 Herzen."
            say: "Wusstest du? Ein Krake hat acht Arme. Das sind fünf und drei. Und er hat sogar drei Herzen!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "5 + 2 = ?"
                show: { drawn: ten-frame, filled: 7, colour_split: [5, 2] }
                options: ["6", "7", "8"]
                answer: "7"
                hints:
                  - "Die obere Reihe ist fünf."
                  - "Zwei kommen dazu: sechs, sieben."
                  - "5 + 2 = 7."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "6 + 3 = _"
                answer: "9"
                hints:
                  - "Fang bei 6 an."
                  - "Sieben, acht, neun."
                  - "9."
              - id: l2-f3
                type: point_on_line
                text: "Wo landest du? 4 + 4"
                say: "Fang bei vier an, vier Schritte weiter. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 8
                hints:
                  - "Fang bei 4 an."
                  - "Fünf, sechs, sieben, acht."
                  - "Du landest bei 8."
              - id: l2-f4
                type: multiple_choice
                text: "Im Bus sitzen 2 Kinder. 7 steigen ein. 2 + 7 = ?"
                say: "Im Bus sitzen zwei Kinder. Sieben steigen ein. Zwei plus sieben, wie viele sind es?"
                show: { object: child, groups: [2, 7] }
                options: ["8", "9", "10"]
                answer: "9"
                feedback:
                  "8": "Fang bei 7 an und zähl zwei weiter: acht, neun."
                hints:
                  - "Fang bei der größeren Zahl an: 7."
                  - "Zwei weiter."
                  - "9."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 5 + 5 = 10"
                show: { drawn: ten-frame, filled: 10, colour_split: [5, 5] }
                answer: true
                hints:
                  - "Zwei volle Reihen."
                  - "Fünf und fünf."
                  - "Ja, 10."
              - id: l2-f6
                type: text_input
                text: "3 + 4 = _"
                answer: "7"
                hints:
                  - "Fang bei 4 an."
                  - "Drei weiter: fünf, sechs, sieben."
                  - "7."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "5 + 4 = ?"
                show: { drawn: ten-frame, filled: 9, colour_split: [5, 4] }
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Fünf und vier."]
              - id: l2-s2
                type: text_input
                text: "7 + 2 = _"
                answer: "9"
                hints: ["Fang bei 7 an."]
              - id: l2-s3
                type: point_on_line
                text: "Wo landest du? 6 + 4"
                say: "Fang bei sechs an, vier Schritte weiter. Wo landest du?"
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 10
                hints: ["Von sechs aus vier Schritte weiter."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 3 + 5 = 9"
                answer: false
                hints: ["Fang bei 5 an."]
              - id: l2-s5
                type: multiple_choice
                text: "1 + 8 = ?"
                options: ["8", "9", "10"]
                answer: "9"
                hints: ["Fang bei 8 an."]
              - id: l2-s6
                type: text_input
                text: "4 + 3 = _"
                answer: "7"
                hints: ["Fang bei 4 an."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "5 + 3 = ?"
                show: { drawn: ten-frame, filled: 8, colour_split: [5, 3] }
                options: ["7", "8", "9"]
                answer: "8"
              - id: l2-n2
                type: text_input
                text: "2 + 8 = _"
                answer: "10"
              - id: l2-n3
                type: point_on_line
                text: "Wo landest du? 3 + 6"
                say: "Wo landest du? Drei plus sechs."
                show: { drawn: number-line, from: 0, to: 10, labels: all }
                answer: 9
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 6 + 2 = 8"
                answer: true
              - id: l2-n5
                type: text_input
                text: "4 + 5 = _"
                answer: "9"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: to-5
            type: text_input
            text: "1 + 4 = _"
            say: "Eins plus vier. Schreib das Ergebnis."
            answer: "5"
          - id: l2-c2
            part: to-10
            type: multiple_choice
            text: "5 + 1 = ?"
            options: ["7", "6", "5"]
            answer: "6"
          - id: l2-c3
            part: to-10
            type: text_input
            text: "6 + 4 = _"
            say: "Sechs plus vier. Schreib das Ergebnis."
            answer: "10"
          - id: l2-c4
            part: count-on
            type: point_on_line
            text: "Wo landest du? 2 + 5"
            say: "Wo landest du? Zwei plus fünf."
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 7
          - id: l2-c5
            part: count-on
            type: multiple_choice
            text: "1 + 7 = ?"
            options: ["7", "8", "9"]
            answer: "8"
          - id: l2-c6
            part: to-5
            type: multiple_choice
            text: "3 + 1 = ?"
            show: { drawn: ten-frame, filled: 4, colour_split: [3, 1] }
            options: ["3", "4", "5"]
            answer: "4"
          - id: l2-c7
            part: to-5
            type: text_input
            text: "4 + 0 = _"
            say: "Vier plus null. Schreib das Ergebnis."
            answer: "4"
          - id: l2-c8
            part: to-5
            type: true_false
            text: "Stimmt das? 2 + 3 = 4"
            answer: false
          - id: l2-c9
            part: to-5
            type: text_input
            text: "1 + 2 = _"
            say: "Eins plus zwei. Schreib das Ergebnis."
            answer: "3"
          - id: l2-c10
            part: to-5
            type: multiple_choice
            text: "0 + 3 = ?"
            options: ["0", "3", "4"]
            answer: "3"
          - id: l2-c11
            part: to-5
            type: true_false
            text: "Stimmt das? 4 + 1 = 5"
            answer: true
          - id: l2-c12
            part: to-10
            type: multiple_choice
            text: "4 + 2 = ?"
            show: { drawn: ten-frame, filled: 6, colour_split: [4, 2] }
            options: ["5", "6", "7"]
            answer: "6"
          - id: l2-c13
            part: to-10
            type: text_input
            text: "7 + 3 = _"
            say: "Sieben plus drei. Schreib das Ergebnis."
            answer: "10"
          - id: l2-c14
            part: to-10
            type: true_false
            text: "Stimmt das? 4 + 4 = 9"
            answer: false
          - id: l2-c15
            part: to-10
            type: multiple_choice
            text: "8 + 1 = ?"
            options: ["8", "9", "10"]
            answer: "9"
          - id: l2-c16
            part: to-10
            type: text_input
            text: "3 + 3 = _"
            say: "Drei plus drei. Schreib das Ergebnis."
            answer: "6"
          - id: l2-c17
            part: count-on
            type: point_on_line
            text: "Wo landest du? 6 + 3"
            say: "Wo landest du? Sechs plus drei."
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 9
          - id: l2-c18
            part: count-on
            type: multiple_choice
            text: "3 + 7 = ?"
            options: ["8", "9", "10"]
            answer: "10"
          - id: l2-c19
            part: count-on
            type: point_on_line
            text: "Wo landest du? 7 + 2"
            say: "Wo landest du? Sieben plus zwei."
            show: { drawn: number-line, from: 0, to: 10, labels: all }
            answer: 9
          - id: l2-c20
            part: count-on
            type: text_input
            text: "1 + 9 = _"
            say: "Eins plus neun. Schreib das Ergebnis."
            answer: "10"
