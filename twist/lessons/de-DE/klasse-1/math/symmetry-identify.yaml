            text: "Ist das Z symmetrisch?"
            say: "Ist das Z symmetrisch?"
            show: { drawn: letter-card, text: "Z" }
            answer: false
          - id: l1-c4
            type: true_false
            text: "Ist das U symmetrisch?"
            say: "Ist das U symmetrisch?"
            show: { drawn: letter-card, text: "U" }
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Welcher Buchstabe ist symmetrisch?"
            say: "Welcher Buchstabe ist symmetrisch?"
            options: ["P", "T", "L"]
            answer: "T"
