  - n: 2
    title: { de: "Die Symmetrieachse", en: "The line of symmetry" }
    goal:
      de: "Find die Faltlinie einer Figur, die Symmetrieachse. Beim A geht sie von oben nach unten durch die Mitte."
      en: "Find the fold line, the line of symmetry. On the letter A it runs from top to bottom through the middle."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Ist das A symmetrisch?"
            say: "Ist das A symmetrisch?"
            show: { drawn: letter-card, text: "A" }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Buchstabe ist symmetrisch?"
            say: "Welcher Buchstabe ist symmetrisch: T oder F?"
            options: ["T", "F"]
            answer: "T"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Symmetrieachse"
            say: "Die Linie, an der du faltest, heißt Symmetrieachse. Wenn du einen Spiegel genau auf die Achse stellst, siehst du die ganze Figur."
          - text: "A: senkrecht"
            say: "Beim A geht die Achse senkrecht durch die Mitte, von oben nach unten."
            show: { drawn: letter-card, text: "A" }
          - text: "B: waagerecht"
            say: "Beim B geht die Achse waagerecht durch die Mitte, von links nach rechts. Der obere Bauch passt auf den unteren."
            show: { drawn: letter-card, text: "B" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie geht die Symmetrieachse beim M?"
                say: "Wie geht die Symmetrieachse beim M?"
                show: { drawn: letter-card, text: "M" }
                options: ["senkrecht, von oben nach unten", "waagerecht, von links nach rechts", "es gibt keine"]
                answer: "senkrecht, von oben nach unten"
                hints:
                  - "Welche Hälften sind gleich: links und rechts oder oben und unten?"
                  - "Links und rechts sind gleich."
                  - "Senkrecht, von oben nach unten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie geht die Symmetrieachse beim E?"
                say: "Wie geht die Symmetrieachse beim E?"
                show: { drawn: letter-card, text: "E" }
                options: ["waagerecht, von links nach rechts", "senkrecht, von oben nach unten", "es gibt keine"]
                answer: "waagerecht, von links nach rechts"
                feedback:
                  "senkrecht, von oben nach unten": "Links ist beim E ein Strich, rechts sind drei Arme. Links und rechts passen nicht. Oben und unten passen."
                  "es gibt keine": "Falte es einmal von links nach rechts. Der obere Arm passt auf den unteren."
                hints:
                  - "Sind oben und unten gleich?"
                  - "Der obere Arm passt auf den unteren."
                  - "Waagerecht, von links nach rechts."
              - id: l2-f3
                type: true_false
                text: "Stellst du einen Spiegel auf die Achse vom H, siehst du das ganze H."
                say: "Stimmt das? Stellst du einen Spiegel genau auf die Symmetrieachse vom H, siehst du das ganze H."
                show: { drawn: letter-card, text: "H" }
                answer: true
                hints:
                  - "Der Spiegel zeigt die andere Hälfte."
                  - "Beim H sind beide Hälften gleich."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Buchstabe hat keine Symmetrieachse?"
                say: "Welcher Buchstabe hat keine Symmetrieachse?"
                options: ["G", "A", "E"]
                answer: "G"
                option_audio: false
                hints:
                  - "Falte jeden einmal senkrecht und einmal waagerecht."
                  - "Beim A geht es senkrecht, beim E waagerecht."
                  - "G."
              - id: l2-f5
                type: multiple_choice
                text: "Wie geht die Symmetrieachse beim Dreieck mit der Spitze oben?"
                say: "Das Dreieck steht mit der Spitze nach oben. Wie geht die Symmetrieachse?"
                show: { drawn: shape, kind: triangle, colour: yellow }
                options: ["senkrecht, durch die Spitze", "waagerecht, durch die Mitte", "es gibt keine"]
                answer: "senkrecht, durch die Spitze"
                hints:
                  - "Sind links und rechts gleich?"
                  - "Von der Spitze nach unten teilt die Linie es in zwei gleiche Hälften."
                  - "Senkrecht, durch die Spitze."

          - support: some
