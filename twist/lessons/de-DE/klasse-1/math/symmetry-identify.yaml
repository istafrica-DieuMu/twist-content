                say: "Ist das O symmetrisch?"
                show: { drawn: letter-card, text: "O" }
                answer: true
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Buchstabe ist symmetrisch?"
                say: "Welcher Buchstabe ist symmetrisch?"
                options: ["V", "P", "N"]
                answer: "V"
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ist das N symmetrisch?"
                say: "Ist das N symmetrisch?"
                show: { drawn: letter-card, text: "N" }
                answer: false
              - id: l1-n4
                type: true_false
                text: "Ist das Rechteck symmetrisch?"
                say: "Ist das Rechteck symmetrisch?"
                show: { drawn: shape, kind: rectangle, colour: orange }
                answer: true
              - id: l1-n5
                type: multiple_choice
