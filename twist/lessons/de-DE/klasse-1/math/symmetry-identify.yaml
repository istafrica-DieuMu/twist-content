                say: "Was ist symmetrisch?"
                options: ["ein Gesicht von vorn", "ein Ohr", "die Zahl 7"]
                answer: "ein Gesicht von vorn"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Ist das W symmetrisch?"
            say: "Ist das W symmetrisch?"
            show: { drawn: letter-card, text: "W" }
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Buchstabe ist nicht symmetrisch?"
            say: "Welcher Buchstabe ist nicht symmetrisch?"
