                show: { drawn: letter-card, text: "B" }
                options: ["waagerecht, von links nach rechts", "senkrecht, von oben nach unten", "es gibt keine"]
                answer: "waagerecht, von links nach rechts"
                hints: ["Der obere Bauch passt auf den unteren."]
              - id: l2-s3
                type: true_false
                text: "Das J hat eine Symmetrieachse."
                say: "Stimmt das? Das J hat eine Symmetrieachse."
                show: { drawn: letter-card, text: "J" }
                answer: false
                hints: ["Der Haken zeigt nur zu einer Seite."]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Buchstabe hat keine Symmetrieachse?"
                say: "Welcher Buchstabe hat keine Symmetrieachse?"
                options: ["P", "T", "B"]
                answer: "P"
