# Lesson set: Mathe, Klasse 1. Hand-authored draft.
id: de-DE.math.symmetry-identify
skill: math.symmetry.identify
curriculum: de-DE
language: de
title:
  de: Symmetrie erkennen
  en: Spotting symmetry
summary: >
  Lesson 1 folds in the mind: a figure is symmetrisch when both halves
  fit exactly on each other along the fold (Schmetterling, Herz, die
  Buchstaben A und T); lesson 2 says where the Symmetrieachse runs
  (senkrecht durch die Mitte, waagerecht), finds letters and shapes that
  are not symmetric, and ends with the skill check. Drawing the mirror
  half waits for a drawing task.
metadata:
  year: klasse-1
  topic: { de: Symmetrie, en: Symmetry }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.shapes.basic-shapes]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { de: [symmetrisch, Symmetrieachse, falten, Hälfte, Spiegel, senkrecht, waagerecht] }
  forms: [picture, text, audio, drawn]
  drawn: [letter-card, shape]
  facets: []
  parts:
    - { id: is-symmetric, what: { de: "prüfen, ob eine Figur symmetrisch ist", en: "checking whether a figure is symmetric" } }
    - { id: find, what: { de: "unter mehreren Figuren die symmetrische oder die nicht symmetrische finden", en: "picking out the symmetric or the non-symmetric figure from several" } }
    - { id: axis, what: { de: "sagen, wie die Symmetrieachse verläuft", en: "saying where the line of symmetry runs" } }
  misconceptions:
    - id: same-colour-is-symmetric
      what: Calls a figure symmetric because both sides look alike in colour or size, without checking that they match when folded
      addressed: lesson 1 Learn folds the letter F and the halves do not match; l1-f3, l1-s3 and l1-n3 ask about letters whose halves are similar but not mirror images, with feedback in l1-f3
    - id: only-vertical-axis
      what: Thinks a Symmetrieachse is always senkrecht
      addressed: lesson 2 Learn shows the B with a waagerechte axis; l2-f2 and l2-s2 ask about the letters B and E
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passt es beim Falten?", en: "Does it fit when folded?" }
    goal:
      de: "Falte eine Figur in Gedanken und schau, ob beide Hälften genau passen. Beim Schmetterling passen sie."
      en: "Fold a picture in your head and see if both halves match. On a butterfly they do."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form?"
            show: { drawn: shape, kind: square, colour: blue }
            options: ["Quadrat", "Dreieck"]
            answer: "Quadrat"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Form ist links?"
            say: "Welche Form ist links?"
            show: { drawn: shape, row: [circle, triangle], colours: [red, green] }
            options: ["der Kreis", "das Dreieck"]
            answer: "der Kreis"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "symmetrisch"
            say: "Ein Schmetterling hat zwei gleiche Flügel. Faltest du ihn in der Mitte, passen beide Hälften genau aufeinander. Dann ist er symmetrisch."
            show: { object: butterfly }
          - text: "A"
            say: "Auch das A ist symmetrisch. Falte es in der Mitte von oben nach unten. Die linke Hälfte passt genau auf die rechte."
            show: { drawn: letter-card, text: "A" }
          - text: "F"
            say: "Das F ist nicht symmetrisch. Faltest du es in der Mitte, zeigen die Striche nur zu einer Seite. Die Hälften passen nicht aufeinander."
            show: { drawn: letter-card, text: "F" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Ist das T symmetrisch?"
                say: "Falte das T in Gedanken in der Mitte. Ist es symmetrisch?"
                show: { drawn: letter-card, text: "T" }
                answer: true
                hints:
                  - "Falte von oben nach unten durch die Mitte."
                  - "Der Balken oben ist links und rechts gleich lang."
                  - "Ja, das T ist symmetrisch."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Buchstabe ist symmetrisch?"
                say: "Welcher Buchstabe ist symmetrisch?"
                options: ["M", "L", "J"]
                answer: "M"
                option_audio: false
                hints:
                  - "Falte jeden Buchstaben in der Mitte."
                  - "Beim L und beim J zeigt etwas nur zu einer Seite."
                  - "M."
              - id: l1-f3
                type: true_false
                text: "Ist das R symmetrisch?"
                say: "Falte das R in Gedanken in der Mitte. Ist es symmetrisch?"
                show: { drawn: letter-card, text: "R" }
                answer: false
                feedback:
                  "true": "Der Bauch und das Bein des R zeigen nur nach rechts. Links ist nichts, was darauf passt."
                hints:
                  - "Schau, wohin der Bauch zeigt."
                  - "Links ist nur ein gerader Strich."
                  - "Nein, das R ist nicht symmetrisch."
              - id: l1-f4
                type: true_false
                text: "Ist der Kreis symmetrisch?"
                say: "Falte den Kreis in Gedanken in der Mitte. Ist er symmetrisch?"
                show: { drawn: shape, kind: circle, colour: red }
                answer: true
                hints:
                  - "Falte ihn genau durch die Mitte."
                  - "Beide Hälften sind gleich rund."
                  - "Ja, der Kreis ist symmetrisch."
              - id: l1-f5
                type: multiple_choice
                text: "Was ist symmetrisch?"
                say: "Was ist symmetrisch?"
                options: ["ein Herz", "ein Schuh", "eine Hand"]
                answer: "ein Herz"
                hints:
                  - "Stell dir vor, du faltest es in der Mitte."
                  - "Ein Schuh ist vorne anders als hinten."
                  - "Ein Herz."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Ist das H symmetrisch?"
                say: "Falte das H in Gedanken in der Mitte. Ist es symmetrisch?"
                show: { drawn: letter-card, text: "H" }
                answer: true
                hints: ["Links und rechts ist je ein Strich."]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Buchstabe ist symmetrisch?"
                say: "Welcher Buchstabe ist symmetrisch?"
                options: ["U", "G", "F"]
                answer: "U"
                option_audio: false
                hints: ["Falte jeden Buchstaben senkrecht in der Mitte."]
              - id: l1-s3
                type: true_false
                text: "Ist das S symmetrisch?"
                say: "Falte das S in Gedanken in der Mitte von oben nach unten. Ist es symmetrisch?"
                show: { drawn: letter-card, text: "S" }
                answer: false
                hints: ["Oben zeigt der Bogen nach links, unten nach rechts."]
              - id: l1-s4
                type: true_false
                text: "Ist das Quadrat symmetrisch?"
                say: "Falte das Quadrat in Gedanken in der Mitte. Ist es symmetrisch?"
                show: { drawn: shape, kind: square, colour: green }
                answer: true
                hints: ["Alle Seiten sind gleich lang."]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist symmetrisch?"
                say: "Was ist symmetrisch?"
                options: ["ein Schmetterling", "eine Schnecke", "ein Fragezeichen"]
                answer: "ein Schmetterling"
                hints: ["Welches hat zwei gleiche Hälften?"]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
