                say: "Du hast ein halbes A. Wo stellst du den Spiegel hin, um das ganze A zu sehen?"
                options: ["genau auf die Mitte, senkrecht", "unten quer", "irgendwo daneben"]
                answer: "genau auf die Mitte, senkrecht"
                hints: ["Der Spiegel kommt auf die Symmetrieachse."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie geht die Symmetrieachse beim U?"
                say: "Wie geht die Symmetrieachse beim U?"
                show: { drawn: letter-card, text: "U" }
