                say: "Ein Herz steht mit der Spitze nach unten. Wie geht die Symmetrieachse?"
                options: ["senkrecht, durch die Spitze", "waagerecht, durch die Mitte", "es gibt keine"]
                answer: "senkrecht, durch die Spitze"

