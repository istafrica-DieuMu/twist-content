# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.ones-bridge
skill: math.add-sub-to-100.ones-bridge
curriculum: de-DE
language: de
title:
  de: Einer mit Zehnerübergang
  en: Adding and taking away ones across a ten
summary: >
  Adding and taking away ones across a ten, in steps via the full ten
  (38 + 5 = 38 + 2 + 3, 43 − 6 = 43 − 3 − 3). Lesson 1 adds: split the
  ones, jump to the next ten, then jump on, on the Rechenstrich. Lesson 2
  takes away back to the full ten and on, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.ones-no-bridge, math.add-sub-to-20.sub-bridge-10]
  also_practises: [math.numbers-to-20.partition-to-10]
  vocabulary: { de: [Zehnerübergang, voller Zehner, zerlegen, Rechenstrich, in Schritten] }
  forms: [drawn, text, audio]
  drawn: [equation, rechenstrich]
  facets: []
  parts:
    - { id: add, what: { de: Einer mit Zehnerübergang addieren, en: adding ones across a ten } }
    - { id: sub, what: { de: Einer mit Zehnerübergang subtrahieren, en: subtracting ones across a ten } }
    - { id: steps, what: { de: in Schritten über den vollen Zehner rechnen, en: working in steps via the full ten } }
  misconceptions:
    - id: tens-stay
      what: Keeps the tens the same after crossing (38 + 5 = 33)
      addressed: Learn crosses the full ten on the Rechenstrich; 33 is an option with feedback in l1-f1, and hints say "Du kommst über den nächsten Zehner"
    - id: wrong-split
      what: Splits the ones so the first step misses the ten (38 + 5 = 38 + 3 + 2)
      addressed: Learn asks how far it is to the next ten first; l1-s4 asks whether a wrong first step reaches the ten
    - id: minus-ones-reversed
      what: Takes the smaller ones digit from the larger (52 − 7 = 55, from 7 − 2)
      addressed: lesson 2 Learn goes back to the full ten first and warns about 6 − 3; the reversed answer (55 for 52 − 7) is an option with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Über den Zehner dazu, en: Adding across a ten }
    goal:
      de: "Rechne plus über den vollen Zehner, so wie bei 38 + 5 erst 2 bis zur 40 und dann noch 3."
      en: "Add across a full ten, like 38 + 5, first 2 to make 40 and then 3 more."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "8 + 5 = ?"
            say: "Acht plus fünf."
            options: ["12", "13", "14"]
            answer: "13"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "38 + _ = 40"
            say: "Wie viel fehlt von achtunddreißig bis vierzig?"
            options: ["2", "8", "12"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "38 + 5: Bleibst du in den Dreißigern?"
            say: "Achtunddreißig plus fünf. Was glaubst du: Bleibt das Ergebnis in den Dreißigern, oder kommst du über die Vierzig?"
            show: { drawn: rechenstrich, start: 38, jumps: [] }
          - text: "38 + 5"
            say: "Du kommst über die Vierzig! Bis zum nächsten Zehner, der Vierzig, fehlen zwei. Also zerlegen wir die Fünf in zwei und drei."
            show: { drawn: equation, text: "38 + 5 = _", split: "5 = 2 + 3" }
          - text: "38 + 2 = 40 | 40 + 3 = 43"
            say: "Erst zwei bis zur Vierzig, dann noch drei: dreiundvierzig."
            show: { drawn: rechenstrich, start: 38, jumps: [2, 3] }
          - text: "38 + 5 = 43"
            say: "Wenn die Einer über zehn gehen, kommst du über den nächsten Zehner. Das heißt Zehnerübergang. Aus drei Zehnern werden vier."
          - text: "8 + 5 = 13 | 38 + 5 = 43"
            say: "Auch hier hilft die kleine Aufgabe: Acht plus fünf ist dreizehn, also ist achtunddreißig plus fünf dreiundvierzig."
          - text: "Wusstest du? Erwachsene haben 28 Zähne. Viele bekommen später noch 4 Weisheitszähne: 28 + 4 = 32."
            say: "Wusstest du? Erwachsene haben achtundzwanzig Zähne. Viele bekommen später noch vier Weisheitszähne dazu. Achtundzwanzig plus vier: erst zwei bis zur Dreißig, dann noch zwei. Das sind zweiunddreißig Zähne."
            show: { object: tooth, count: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "27 + 6 = ?"
                say: "Siebenundzwanzig plus sechs."
                show: { drawn: equation, text: "27 + 6 = _", split: "6 = 3 + 3" }
                options: ["33", "23", "213"]
                answer: "33"
                feedback:
                  "23": "Du kommst über die Dreißig. Aus zwei Zehnern werden drei."
                  "213": "Sieben und sechs sind dreizehn Einer. Zehn davon sind ein neuer Zehner."
                hints:
                  - "Bis zur Dreißig fehlen drei."
                  - "27 + 3 = 30, dann noch 3."
                  - "33."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne in Schritten."
                say: "Fünfundvierzig plus sieben. Erst bis zum vollen Zehner, dann weiter."
                frame: "45 + 7 = 45 + 5 + _ = _"
                options: ["2", "52", "7", "42"]
                answer: ["2", "52"]
                hints:
                  - "Sieben sind fünf und zwei."
                  - "45 + 5 = 50."
                  - "50 + 2 = 52."
              - id: l1-f3
                type: multiple_choice
                text: "59 + 4: Welcher Sprung bringt dich zuerst zur 60?"
                say: "Neunundfünfzig plus vier. Welcher Sprung bringt dich zuerst zur Sechzig?"
                show: { drawn: rechenstrich, start: 59, jumps: [] }
                options: ["1", "4", "3"]
                answer: "1"
                hints:
                  - "Welcher Zehner kommt nach 59?"
                  - "Von 59 bis 60."
                  - "Ein Sprung von 1."
              - id: l1-f4
                type: text_input
                text: "66 + 8 = _"
                say: "Sechsundsechzig plus acht."
                show: { drawn: rechenstrich, start: 66, jumps: [4, 4] }
                answer: "74"
                hints:
                  - "Erst vier bis zur Siebzig."
                  - "Dann noch vier."
                  - "74."
              - id: l1-f5
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst die kleine Aufgabe, dann die große."
                frame: "9 + 4 = _ | 29 + 4 = _"
                options: ["13", "33", "23", "213"]
                answer: ["13", "33"]
                hints:
                  - "Neun plus vier."
                  - "Dreizehn Einer: ein Zehner mehr."
                  - "13, und dann 33."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 84 + 9 = 93"
                say: "Vierundachtzig plus neun gleich dreiundneunzig. Stimmt das?"
                answer: true
                hints:
                  - "Bis zur Neunzig fehlen sechs."
                  - "90 + 3 = 93."
                  - "Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "36 + 7 = _"
                say: "Sechsunddreißig plus sieben."
                answer: "43"
                hints: ["Wie viel fehlt bis zur Vierzig?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Rechne in Schritten."
                say: "Achtundsiebzig plus fünf. Erst bis zum vollen Zehner, dann weiter."
                frame: "78 + 5 = 78 + 2 + _ = _"
                options: ["3", "83", "5", "73"]
                answer: ["3", "83"]
                hints: ["Fünf sind zwei und noch wie viel?"]
              - id: l1-s3
                type: multiple_choice
                text: "23 + 9: Welcher Sprung bringt dich zuerst zur 30?"
                say: "Dreiundzwanzig plus neun. Welcher Sprung bringt dich zuerst zur Dreißig?"
                show: { drawn: rechenstrich, start: 23, jumps: [] }
                options: ["7", "9", "3"]
                answer: "7"
                hints: ["Zähl von 23 bis 30."]
              - id: l1-s4
                type: true_false
                text: "47 + 6: Der erste Sprung ist + 2. Kommst du so genau zur 50?"
                say: "Siebenundvierzig plus sechs. Der erste Sprung ist plus zwei. Kommst du so genau zur Fünfzig?"
                answer: false
                hints: ["Rechne nach: 47 + 2."]
              - id: l1-s5
                type: text_input
                text: "58 + 4 = _"
                say: "Achtundfünfzig plus vier."
                answer: "62"
                hints: ["Erst zur Sechzig, dann weiter."]
              - id: l1-s6
                type: multiple_choice
                text: "Auf dem Dach sitzen 19 Vögel. 5 fliegen dazu. Wie viele Vögel sind es jetzt?"
                say: "Auf dem Dach sitzen neunzehn Vögel. Fünf fliegen dazu. Wie viele Vögel sind es jetzt?"
                show: { object: bird, count: 5, layout: row }
                options: ["24", "14", "25"]
                answer: "24"
                hints: ["Ein Sprung bis zur Zwanzig."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "75 + 8 = _"
                say: "Fünfundsiebzig plus acht."
                answer: "83"
              - id: l1-n2
                type: fill_in_blank
                text: "Rechne in Schritten."
                say: "Vierunddreißig plus neun. Rechne in Schritten."
                frame: "34 + 9 = 34 + 6 + _ = _"
                options: ["3", "43", "9", "33"]
                answer: ["3", "43"]
              - id: l1-n3
                type: multiple_choice
                text: "Im Zug sitzen 88 Leute. Am Bahnhof steigen 6 ein. Wie viele sind es jetzt?"
                say: "Im Zug sitzen achtundachtzig Leute. Am Bahnhof steigen sechs ein. Wie viele sind es jetzt?"
                show: { object: train, count: 1 }
                options: ["94", "84", "814"]
                answer: "94"
                feedback:
                  "814": "Achthundertvierzehn Leute? Da wäre der Zug aber eng! Acht und sechs sind vierzehn Einer: ein neuer Zehner."
                  "84": "Es steigen Leute ein, also werden es mehr als achtundachtzig."
              - id: l1-n4
                type: text_input
                text: "47 + 5 = _"
                say: "Siebenundvierzig plus fünf."
                answer: "52"
              - id: l1-n5
                type: true_false
                text: "Stimmt das? 63 + 9 = 62"
                say: "Dreiundsechzig plus neun gleich zweiundsechzig. Stimmt das?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "28 + 7 = _"
            say: "Achtundzwanzig plus sieben."
            answer: "35"
          - id: l1-c2
            type: fill_in_blank
            text: "Rechne in Schritten."
            say: "Sechsundfünfzig plus sechs. Rechne in Schritten."
            frame: "56 + 6 = 56 + 4 + _ = _"
            options: ["2", "62", "6", "52"]
            answer: ["2", "62"]
          - id: l1-c3
            type: multiple_choice
            text: "39 + 3 = ?"
            say: "Neununddreißig plus drei."
            options: ["42", "32", "312"]
            answer: "42"
          - id: l1-c4
            type: text_input
            text: "17 + 5 = _"
            say: "Siebzehn plus fünf."
            answer: "22"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 76 + 7 = 73"
            say: "Sechsundsiebzig plus sieben gleich dreiundsiebzig. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "48 + 3: Welcher Sprung bringt dich zuerst zur 50?"
            say: "Achtundvierzig plus drei. Welcher Sprung bringt dich zuerst zur Fünfzig?"
            show: { drawn: rechenstrich, start: 48, jumps: [] }
            options: ["2", "3", "8"]
            answer: "2"

  - n: 2
    title: { de: Über den Zehner zurück, en: Taking away across a ten }
    goal:
      de: "Rechne minus über den Zehner, so wie bei 43 − 6 erst 3 zurück bis zur 40 und dann noch 3."
      en: "Take away back across a ten, like 43 − 6, first 3 back to 40 and then 3 more."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "67 + 5 = _"
            say: "Siebenundsechzig plus fünf."
            answer: "72"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "13 − 6 = ?"
            say: "Dreizehn minus sechs."
            options: ["6", "7", "8"]
            answer: "7"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "43 − 6: Bleibst du in den Vierzigern?"
            say: "Dreiundvierzig minus sechs. Was glaubst du: Bleibt das Ergebnis in den Vierzigern?"
            show: { drawn: rechenstrich, start: 43, jumps: [], back: true }
          - text: "43 − 6"
            say: "Nein, du kommst unter die Vierzig. Zurück bis zum vollen Zehner, der Vierzig, sind es drei. Also zerlegen wir die Sechs in drei und drei."
            show: { drawn: equation, text: "43 − 6 = _", split: "6 = 3 + 3" }
          - text: "43 − 3 = 40 | 40 − 3 = 37"
            say: "Erst drei zurück zur Vierzig, dann noch drei zurück: siebenunddreißig."
            show: { drawn: rechenstrich, start: 43, jumps: [-3, -3] }
          - text: "43 − 6 = 37"
            say: "Du gehst über den Zehner zurück. Aus vier Zehnern werden drei. Pass auf: Sechs minus drei ist hier falsch, denn du nimmst sechs von dreiundvierzig weg."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "52 − 7 = ?"
                say: "Zweiundfünfzig minus sieben."
                show: { drawn: equation, text: "52 − 7 = _", split: "7 = 2 + 5" }
                options: ["45", "55", "35"]
                answer: "45"
                feedback:
                  "55": "Du hast sieben minus zwei gerechnet. Du nimmst aber sieben von zweiundfünfzig weg, das Ergebnis wird kleiner."
                  "35": "Du bist zu weit zurückgegangen. Von 52 gehst du nur bis in die Vierziger."
                hints:
                  - "Zurück bis zur Fünfzig sind es zwei."
                  - "52 − 2 = 50, dann noch 5 zurück."
                  - "45."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Rechne in Schritten."
                say: "Einundsechzig minus vier. Erst zurück zum vollen Zehner, dann weiter."
                frame: "61 − 4 = 61 − 1 − _ = _"
                options: ["3", "57", "4", "63"]
                answer: ["3", "57"]
                hints:
                  - "Vier sind eins und drei."
                  - "61 − 1 = 60."
                  - "60 − 3 = 57."
              - id: l2-f3
                type: multiple_choice
                text: "84 − 7: Welcher Sprung zurück bringt dich zuerst zur 80?"
                say: "Vierundachtzig minus sieben. Welcher Sprung zurück bringt dich zuerst zur Achtzig?"
                options: ["4", "7", "3"]
                answer: "4"
                hints:
                  - "Welcher Zehner kommt vor 84?"
                  - "Von 84 zurück bis 80."
                  - "Ein Sprung von 4."
              - id: l2-f4
                type: text_input
                text: "35 − 8 = _"
                say: "Fünfunddreißig minus acht."
                show: { drawn: rechenstrich, start: 35, jumps: [-5, -3] }
                answer: "27"
                hints:
                  - "Erst fünf zurück zur Dreißig."
                  - "Dann noch drei zurück."
                  - "27."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 72 − 5 = 67"
                say: "Zweiundsiebzig minus fünf gleich siebenundsechzig. Stimmt das?"
                answer: true
                hints:
                  - "Erst zwei zurück zur Siebzig."
                  - "70 − 3 = 67."
                  - "Ja."
              - id: l2-f6
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst die kleine Aufgabe, dann die große."
                frame: "14 − 6 = _ | 54 − 6 = _"
                options: ["8", "48", "52", "58"]
                answer: ["8", "48"]
                hints:
                  - "Vierzehn minus sechs."
                  - "Vierundfünfzig ist vierzig und vierzehn."
                  - "8, und dann 48."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "44 − 7 = _"
                say: "Vierundvierzig minus sieben."
                answer: "37"
                hints: ["Wie weit ist es zurück bis zur Vierzig?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Rechne in Schritten."
                say: "Dreiundneunzig minus fünf. Erst zurück zum vollen Zehner, dann weiter."
                frame: "93 − 5 = 93 − 3 − _ = _"
                options: ["2", "88", "5", "98"]
                answer: ["2", "88"]
                hints: ["Fünf sind drei und noch wie viel?"]
              - id: l2-s3
                type: multiple_choice
                text: "26 − 9: Welcher Sprung zurück bringt dich zuerst zur 20?"
                say: "Sechsundzwanzig minus neun. Welcher Sprung zurück bringt dich zuerst zur Zwanzig?"
                options: ["6", "9", "3"]
                answer: "6"
                hints: ["Zähl von 26 zurück bis 20."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 31 − 4 = 33"
                say: "Einunddreißig minus vier gleich dreiunddreißig. Stimmt das?"
                answer: false
                hints: ["Wird das Ergebnis bei Minus größer oder kleiner?"]
              - id: l2-s5
                type: text_input
                text: "Der Bäcker hat 80 Brötchen. Er verkauft 6. Wie viele Brötchen hat er noch?"
                say: "Der Bäcker hat achtzig Brötchen. Er verkauft sechs. Wie viele Brötchen hat er noch?"
                show: { object: bread, count: 1 }
                answer: "74"
                hints: ["Achtzig ist schon ein voller Zehner. Geh sechs zurück."]
              - id: l2-s6
                type: text_input
                text: "57 + 6 = _"
                say: "Siebenundfünfzig plus sechs."
                answer: "63"
                hints: ["Plus oder minus? Schau aufs Zeichen."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "65 − 9 = _"
                say: "Fünfundsechzig minus neun."
                answer: "56"
              - id: l2-n2
                type: fill_in_blank
                text: "Rechne in Schritten."
                say: "Zweiundvierzig minus acht. Rechne in Schritten."
                frame: "42 − 8 = 42 − 2 − _ = _"
                options: ["6", "34", "8", "46"]
                answer: ["6", "34"]
              - id: l2-n3
                type: multiple_choice
                text: "Auf der Wiese grasen 71 Schafe. 3 laufen weg. Wie viele Schafe grasen noch?"
                say: "Auf der Wiese grasen einundsiebzig Schafe. Drei laufen weg. Wie viele Schafe grasen noch?"
                show: { object: sheep, count: 3, layout: row }
                options: ["68", "72", "78"]
                answer: "68"
                feedback:
                  "72": "Mehr Schafe als vorher? Drei sind weggelaufen, also werden es weniger."
                  "78": "Das sind mehr als einundsiebzig. Geh über die Siebzig zurück."
              - id: l2-n4
                type: text_input
                text: "23 − 5 = _"
                say: "Dreiundzwanzig minus fünf."
                answer: "18"
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 96 − 8 = 88"
                say: "Sechsundneunzig minus acht gleich achtundachtzig. Stimmt das?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add
            type: text_input
            text: "49 + 6 = _"
            say: "Neunundvierzig plus sechs."
            answer: "55"
          - id: l2-c2
            part: sub
            type: text_input
            text: "62 − 5 = _"
            say: "Zweiundsechzig minus fünf."
            answer: "57"
          - id: l2-c3
            part: steps
            type: fill_in_blank
            text: "Rechne in Schritten."
            say: "Fünfundachtzig minus sieben. Rechne in Schritten."
            frame: "85 − 7 = 85 − 5 − _ = _"
            options: ["2", "78", "7", "82"]
            answer: ["2", "78"]
          - id: l2-c4
            part: steps
            type: multiple_choice
            text: "74 + 8: Welcher Sprung bringt dich zuerst zur 80?"
            say: "Vierundsiebzig plus acht. Welcher Sprung bringt dich zuerst zur Achtzig?"
            options: ["6", "8", "4"]
            answer: "6"
          - id: l2-c5
            part: sub
            type: multiple_choice
            text: "33 − 6 = ?"
            say: "Dreiunddreißig minus sechs."
            options: ["27", "37", "17"]
            answer: "27"
          - id: l2-c6
            part: add
            type: text_input
            text: "57 + 8 = _"
            say: "Siebenundfünfzig plus acht."
            answer: "65"
          - id: l2-c7
            part: add
            type: multiple_choice
            text: "29 + 7 = ?"
            say: "Neunundzwanzig plus sieben."
            options: ["36", "26", "37"]
            answer: "36"
          - id: l2-c8
            part: add
            type: true_false
            text: "Stimmt das? 68 + 5 = 63"
            say: "Achtundsechzig plus fünf gleich dreiundsechzig. Stimmt das?"
            answer: false
          - id: l2-c9
            part: add
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Sieben plus sechs, dann siebenundvierzig plus sechs."
            frame: "7 + 6 = _ | 47 + 6 = _"
            options: ["13", "53", "43", "413"]
            answer: ["13", "53"]
          - id: l2-c10
            part: add
            type: text_input
            text: "86 + 7 = _"
            say: "Sechsundachtzig plus sieben."
            answer: "93"
          - id: l2-c11
            part: add
            type: multiple_choice
            text: "Lena hat 45 Murmeln. Sie bekommt 8 dazu. Wie viele Murmeln hat sie jetzt?"
            say: "Lena hat fünfundvierzig Murmeln. Sie bekommt acht dazu. Wie viele Murmeln hat sie jetzt?"
            options: ["53", "43", "52"]
            answer: "53"
          - id: l2-c12
            part: sub
            type: text_input
            text: "53 − 6 = _"
            say: "Dreiundfünfzig minus sechs."
            answer: "47"
          - id: l2-c13
            part: sub
            type: multiple_choice
            text: "91 − 4 = ?"
            say: "Einundneunzig minus vier."
            options: ["87", "93", "97"]
            answer: "87"
          - id: l2-c14
            part: sub
            type: true_false
            text: "Stimmt das? 46 − 9 = 37"
            say: "Sechsundvierzig minus neun gleich siebenunddreißig. Stimmt das?"
            answer: true
          - id: l2-c15
            part: sub
            type: fill_in_blank
