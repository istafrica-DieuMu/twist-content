        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "36 + 42 = _"
            say: "Sechsunddreißig plus zweiundvierzig. Rechne schrittweise: erst die Zehner, dann die Einer."
            answer: "78"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Rechne schrittweise."
            say: "Siebenundvierzig plus fünfundzwanzig. Erst plus zwanzig, dann plus fünf."
            frame: "47 + 25 = 47 + 20 + _ = _"
            options: ["5", "72", "67", "2"]
            answer: ["5", "72"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + 38"
            say: "Ein anderer Weg: stellenweise rechnen. Fünfundvierzig hat vier Zehner und fünf Einer, achtunddreißig hat drei Zehner und acht Einer."
          - text: "40 + 30 = 70 | 5 + 8 = 13"
            say: "Zehner plus Zehner: vierzig plus dreißig ist siebzig. Einer plus Einer: fünf plus acht ist dreizehn."
            show: { drawn: base-ten, tens: 7, ones: 13 }
          - text: "70 + 13 = 83"
            say: "Dann beides zusammen: siebzig plus dreizehn ist dreiundachtzig. Zehn von den dreizehn Einern sind ein neuer Zehner."
            show: { drawn: base-ten, tens: 8, ones: 3 }
          - text: "Mehr als 9 Einer: ein Zehner mehr"
            say: "Pass auf: Sind die Einer zusammen mehr als neun, bekommst du einen Zehner dazu. Schreib nicht siebzig und dreizehn nebeneinander."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne stellenweise."
                say: "Vierunddreißig plus fünfundzwanzig. Erst die Zehner, dann die Einer, dann zusammen."
                frame: "34 + 25: 30 + 20 = _ | 4 + 5 = _ | _ + _ = _"
                options: ["50", "9", "59", "40", "7"]
                answer: ["50", "9", "50", "9", "59"]
                hints:
                  - "Erst die Zehner: 30 + 20."
                  - "Dann die Einer: 4 + 5."
                  - "50 + 9 = 59."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "47 + 36 = ?"
                say: "Siebenundvierzig plus sechsunddreißig."
                show: { drawn: base-ten, tens: 7, ones: 13 }
                options: ["83", "713", "73"]
                answer: "83"
                feedback:
                  "713": "70 und 13 schreibst du nicht nebeneinander. Du rechnest 70 + 13 = 83."
                  "73": "Die Einer 7 + 6 sind 13. Das gibt einen Zehner mehr."
                hints:
                  - "Zehner: 40 + 30 = 70."
                  - "Einer: 7 + 6 = 13."
                  - "70 + 13 = 83."
              - id: l2-f3
                type: fill_in_blank
                text: "Rechne stellenweise."
                frame: "56 + 27: 50 + 20 = _ | 6 + 7 = _ | _ + _ = _"
                options: ["70", "13", "83", "73", "12"]
                answer: ["70", "13", "70", "13", "83"]
                hints:
                  - "50 + 20 = 70."
                  - "6 + 7 = 13."
                  - "70 + 13 = 83."
              - id: l2-f4
                type: multiple_choice
                text: "28 + 45: Wie viel sind die Einer zusammen?"
                say: "Bei achtundzwanzig plus fünfundvierzig: Wie viel sind die Einer zusammen?"
                options: ["13", "12", "3"]
                answer: "13"
                hints:
                  - "Die Einer sind 8 und 5."
                  - "8 + 5 geht über die 10."
                  - "13."
              - id: l2-f5
                type: text_input
                text: "62 + 35 = _"
                say: "Zweiundsechzig plus fünfunddreißig."
                answer: "97"
                hints:
                  - "60 + 30 = 90."
                  - "2 + 5 = 7."
                  - "97."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 38 + 46 = 74"
                say: "Achtunddreißig plus sechsundvierzig gleich vierundsiebzig. Stimmt das?"
                answer: false
                feedback:
                  "true": "8 + 6 = 14. Das ist ein Zehner mehr: 70 + 14 = 84."
                hints:
                  - "Zehner: 30 + 40 = 70."
                  - "Einer: 8 + 6 = 14."
                  - "70 + 14 = 84, also nein."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne stellenweise."
                frame: "43 + 39: 40 + 30 = _ | 3 + 9 = _ | _ + _ = _"
                options: ["70", "12", "82", "72", "13"]
                answer: ["70", "12", "70", "12", "82"]
                hints: ["Zehner zu Zehnern, Einer zu Einern."]
              - id: l2-s2
                type: multiple_choice
                text: "65 + 27 = ?"
                options: ["92", "82", "812"]
                answer: "92"
                hints: ["Sind die Einer zusammen mehr als 9?"]
              - id: l2-s3
                type: text_input
                text: "51 + 44 = _"
                answer: "95"
                hints: ["Rechne Zehner und Einer getrennt."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 36 + 48 = 84"
                say: "Sechsunddreißig plus achtundvierzig gleich vierundachtzig. Stimmt das?"
                answer: true
                hints: ["Rechne zuerst die Einer: 6 + 8."]
              - id: l2-s5
                type: multiple_choice
                text: "57 + 26: Wie viel sind die Zehner zusammen?"
                say: "Bei siebenundfünfzig plus sechsundzwanzig: Wie viel sind die Zehner zusammen?"
                options: ["70", "80", "13"]
                answer: "70"
                hints: ["Nimm nur die Zehner der beiden Zahlen."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne stellenweise."
                frame: "29 + 54: 20 + 50 = _ | 9 + 4 = _ | _ + _ = _"
                options: ["70", "13", "83", "73", "14"]
                answer: ["70", "13", "70", "13", "83"]
              - id: l2-n2
                type: text_input
                text: "46 + 46 = _"
                answer: "92"
              - id: l2-n3
                type: multiple_choice
                text: "73 + 18 = ?"
                options: ["91", "81", "811"]
                answer: "91"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 25 + 37 = 52"
                say: "Fünfundzwanzig plus siebenunddreißig gleich zweiundfünfzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "14 + 75 = _"
                answer: "89"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: text_input
            text: "34 + 57 = _"
            say: "Vierunddreißig plus siebenundfünfzig."
            answer: "91"
          - id: l2-c2
            type: multiple_choice
            text: "68 + 24 = ?"
            say: "Achtundsechzig plus vierundzwanzig."
            options: ["92", "82", "812"]
            answer: "92"
          - id: l2-c3
            type: fill_in_blank
            text: "Rechne stellenweise."
            say: "Rechne stellenweise. Fünfundvierzig plus siebenundzwanzig."
            frame: "45 + 27: 40 + 20 = _ | 5 + 7 = _ | _ + _ = _"
            options: ["60", "12", "72", "62", "11"]
            answer: ["60", "12", "60", "12", "72"]
          - id: l2-c4
            type: fill_in_blank
            text: "Rechne stellenweise."
            say: "Rechne stellenweise. Sechsundzwanzig plus neunundfünfzig."
            frame: "26 + 59: 20 + 50 = _ | 6 + 9 = _ | _ + _ = _"
            options: ["70", "15", "85", "75", "14"]
            answer: ["70", "15", "70", "15", "85"]
          - id: l2-c5
            type: true_false
            text: "Stimmt das? 47 + 45 = 92"
            say: "Siebenundvierzig plus fünfundvierzig gleich zweiundneunzig. Stimmt das?"
            answer: true
          - id: l2-c6
            type: multiple_choice
            text: "35 + 47 = ?"
            say: "Fünfunddreißig plus siebenundvierzig."
            options: ["82", "72", "712"]
            answer: "82"

  - n: 3
    title: { de: Mit Hilfsaufgabe, en: Using an easier sum }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: fill_in_blank
            text: "Rechne stellenweise."
            say: "Achtunddreißig plus sechsundzwanzig, stellenweise: Zehner plus Zehner, Einer plus Einer, dann beides zusammen."
            frame: "38 + 26: 30 + 20 = _ | 8 + 6 = _ | 50 + 14 = _"
            options: ["50", "14", "64", "54"]
            answer: ["50", "14", "64"]
            difficulty: easy
          - id: l3-w2
            type: text_input
            text: "57 + 35 = _"
            say: "Siebenundfünfzig plus fünfunddreißig. Rechne stellenweise."
            answer: "92"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "36 + 29"
            say: "Neunundzwanzig ist fast dreißig. Eine Hilfsaufgabe macht es leicht: Wir rechnen sechsunddreißig plus dreißig."
            show: { drawn: rechenstrich, start: 36, jumps: [30, -1] }
          - text: "36 + 30 = 66 | 66 − 1 = 65"
            say: "Sechsunddreißig plus dreißig ist sechsundsechzig. Dreißig ist eins zu viel, also nehmen wir eins wieder weg: fünfundsechzig."
          - text: "schrittweise · stellenweise · mit Hilfsaufgabe"
            say: "Jetzt kennst du drei Rechenwege. Endet eine Zahl auf neun, passt oft die Hilfsaufgabe. Sonst rechnest du schrittweise oder stellenweise."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l3-f1
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                say: "Vierundzwanzig plus neununddreißig. Rechne erst plus vierzig."
                frame: "24 + 39 = 24 + 40 − _ = _"
                options: ["1", "9", "63", "64", "65"]
                answer: ["1", "63"]
                hints:
                  - "39 ist eins weniger als 40."
                  - "24 + 40 = 64."
                  - "64 − 1 = 63."
                difficulty: easy
              - id: l3-f2
                type: multiple_choice
                text: "47 + 19 = ?"
                say: "Siebenundvierzig plus neunzehn."
                show: { drawn: rechenstrich, start: 47, jumps: [20, -1] }
                options: ["66", "68", "67"]
                answer: "66"
                feedback:
                  "68": "Mit 20 hast du eins zu viel dazugerechnet. Das nimmst du wieder weg. Du legst nicht noch eins dazu."
                  "67": "47 + 20 = 67. Jetzt noch eins wegnehmen."
                hints:
                  - "19 ist fast 20."
                  - "47 + 20 = 67."
                  - "67 − 1 = 66."
              - id: l3-f3
                type: multiple_choice
                text: "Welcher Weg passt gut zu 53 + 29?"
                options: ["mit Hilfsaufgabe", "stellenweise", "schrittweise"]
                answer: "mit Hilfsaufgabe"
                feedback:
                  "stellenweise": "Das geht auch. Aber 29 ist fast 30: Mit der Hilfsaufgabe ist es leichter."
                  "schrittweise": "Das geht auch. Aber 29 ist fast 30: Mit der Hilfsaufgabe ist es leichter."
                hints:
                  - "Schau dir die zweite Zahl an."
                  - "29 ist fast 30."
                  - "Mit Hilfsaufgabe: 53 + 30 − 1."
              - id: l3-f4
                type: text_input
                text: "35 + 49 = _"
                say: "Fünfunddreißig plus neunundvierzig."
                answer: "84"
                hints:
                  - "49 ist fast 50."
                  - "35 + 50 = 85."
                  - "85 − 1 = 84."
              - id: l3-f5
                type: fill_in_blank
                text: "Rechne schrittweise."
                frame: "38 + 47 = 38 + 40 + _ = _"
                options: ["7", "8", "85", "78", "75"]
                answer: ["7", "85"]
                hints:
                  - "38 + 40 = 78."
                  - "78 + 7: erst 2 bis 80, dann noch 5."
                  - "85."

          - support: some
            tasks:
              - id: l3-s1
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                frame: "56 + 29 = 56 + 30 − _ = _"
                options: ["1", "9", "85", "86", "84"]
                answer: ["1", "85"]
                hints: ["Wie weit ist 29 von 30 weg?"]
              - id: l3-s2
                type: multiple_choice
                text: "62 + 19 = ?"
                options: ["81", "83", "82"]
                answer: "81"
                hints: ["Rechne plus 20 und geh dann 1 zurück."]
              - id: l3-s3
                type: multiple_choice
                text: "Welcher Weg passt gut zu 41 + 35?"
                options: ["stellenweise", "mit Hilfsaufgabe"]
                answer: "stellenweise"
                hints: ["Liegt eine der Zahlen kurz vor einem vollen Zehner?"]
              - id: l3-s4
                type: text_input
