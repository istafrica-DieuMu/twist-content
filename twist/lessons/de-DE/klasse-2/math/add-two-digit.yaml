# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.add-two-digit
skill: math.add-sub-to-100.add-two-digit
curriculum: de-DE
language: de
title:
  de: Zweistellige Zahlen addieren
  en: Adding two-digit numbers
summary: >
  Adding two two-digit numbers with three Rechenwege. Lesson 1 adds
  schrittweise on the Rechenstrich (first the tens, then the ones, across a
  ten when needed); lesson 2 adds stellenweise, tens and ones apart, and
  bundles ten ones into a ten; lesson 3 adds the Hilfsaufgabe for a number
  just below a full ten, mixes the three ways and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.tens-to-two-digit, math.add-sub-to-100.ones-bridge]
  also_practises: [math.add-sub-to-100.ones-bridge]
  vocabulary: { de: [schrittweise, stellenweise, Hilfsaufgabe, Rechenweg, Zehner, Einer, Zehnerübergang] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich, base-ten]
  facets: []
  parts:
    - { id: steps, what: { de: schrittweise rechnen, en: adding in steps } }
    - { id: places, what: { de: stellenweise rechnen, en: adding tens and ones separately } }
    - { id: helper, what: { de: mit einer Hilfsaufgabe rechnen, en: adding via an easier sum } }
    - { id: sums, what: { de: zwei zweistellige Zahlen addieren, en: adding two two-digit numbers } }
  misconceptions:
    - id: forget-carried-ten
      what: Adds the ones to more than nine and drops the extra ten (47 + 36 = 73)
      addressed: lesson 2 Learn bundles ten ones into a ten on the base-ten picture; 73 is an option with feedback, and full-stage hints split the ones across the ten
    - id: digits-side-by-side
      what: Writes the tens sum and the ones sum next to each other (47 + 36 = 713)
      addressed: lesson 2 Learn adds 70 + 13 as a last step; 713 is an option with feedback in the full stage
    - id: hilfsaufgabe-wrong-way
      what: After adding the full ten, adds the difference instead of taking it away (47 + 19 = 47 + 20 + 1)
      addressed: lesson 3 Learn says the full ten was one too much; 68 is an option with feedback
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Schrittweise rechnen, en: Adding in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "34 + 20 = _"
            say: "Vierunddreißig plus zwanzig."
            answer: "54"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "38 + 5 = ?"
            say: "Achtunddreißig plus fünf."
            options: ["42", "43", "33"]
            answer: "43"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + 38"
            say: "Fünfundvierzig plus achtunddreißig. Wir rechnen schrittweise: erst die Zehner, dann die Einer."
            show: { drawn: rechenstrich, start: 45, jumps: [30, 8] }
          - text: "45 + 30 = 75"
            say: "Zuerst springen wir drei Zehner weiter. Fünfundvierzig plus dreißig ist fünfundsiebzig."
          - text: "75 + 8 = 83"
            say: "Dann die Einer: fünfundsiebzig plus acht. Das geht über den Zehner: plus fünf ist achtzig, plus drei ist dreiundachtzig."
          - text: "45 + 38 = 83"
            say: "Fünfundvierzig plus achtunddreißig gleich dreiundachtzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne schrittweise."
                say: "Dreiundzwanzig plus fünfundvierzig. Erst die Zehner, dann die Einer."
                frame: "23 + 45 = 23 + 40 + _ = _"
                options: ["5", "4", "68", "63", "78"]
                answer: ["5", "68"]
                hints:
                  - "Erst die Zehner: 23 + 40 = 63."
                  - "Dann kommen noch die 5 Einer dazu."
                  - "63 + 5 = 68."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "36 + 52 = ?"
                say: "Sechsunddreißig plus zweiundfünfzig."
                show: { drawn: rechenstrich, start: 36, jumps: [50, 2] }
                options: ["88", "86", "78"]
                answer: "88"
                feedback:
                  "86": "Den Zehnersprung hast du gemacht: 36 + 50 = 86. Jetzt noch die 2 Einer dazu."
                hints:
                  - "Spring erst 50 weiter."
                  - "36 + 50 = 86."
                  - "86 + 2 = 88."
              - id: l1-f3
                type: fill_in_blank
                text: "Rechne schrittweise."
                say: "Siebenundvierzig plus sechsundzwanzig. Erst die Zehner, dann die Einer."
                frame: "47 + 26 = 47 + 20 + _ = _"
                options: ["6", "2", "73", "67", "63"]
                answer: ["6", "73"]
                hints:
                  - "47 + 20 = 67."
                  - "67 + 6 geht über die 70: erst 3, dann noch 3."
                  - "67 + 6 = 73."
              - id: l1-f4
                type: multiple_choice
                text: "58 + 34 = ?"
                say: "Achtundfünfzig plus vierunddreißig."
                options: ["92", "82", "812"]
                answer: "92"
                feedback:
                  "82": "58 + 30 = 88. Bei 88 + 4 gehst du über die 90: erst 2 bis 90, dann noch 2."
                hints:
                  - "Erst 58 + 30."
                  - "88 + 4: mach erst die 90 voll."
                  - "92."
              - id: l1-f5
                type: text_input
                text: "24 + 35 = _"
                say: "Vierundzwanzig plus fünfunddreißig."
                answer: "59"
                hints:
                  - "Erst die Zehner: 24 + 30."
                  - "54 + 5."
                  - "59."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 39 + 27 = 56"
                say: "Neununddreißig plus siebenundzwanzig gleich sechsundfünfzig. Stimmt das?"
                answer: false
                feedback:
                  "true": "39 + 20 = 59, und 59 + 7 geht über die 60: 66."
                hints:
                  - "Rechne erst 39 + 20."
                  - "59 + 7 geht über die 60."
                  - "39 + 27 = 66, also nein."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne schrittweise."
                frame: "52 + 37 = 52 + 30 + _ = _"
                options: ["7", "3", "89", "82", "59"]
                answer: ["7", "89"]
                hints: ["Erst die Zehner, dann die Einer."]
              - id: l1-s2
                type: multiple_choice
                text: "29 + 44 = ?"
                say: "Neunundzwanzig plus vierundvierzig."
                options: ["73", "63", "83"]
                answer: "73"
                hints: ["Nach dem Zehnersprung geht es über den nächsten Zehner."]
              - id: l1-s3
                type: text_input
                text: "61 + 28 = _"
                answer: "89"
                hints: ["Erst die Zehner dazu, dann die Einer."]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Sprung kommt zuerst?"
                say: "Du rechnest sechsundvierzig plus fünfunddreißig schrittweise, erst die Zehner. Welcher Sprung kommt zuerst?"
                show: { drawn: rechenstrich, start: 46, jumps: [] }
                options: ["+30", "+5", "+3"]
                answer: "+30"
                hints: ["Schrittweise heißt: erst die Zehner."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 55 + 25 = 80"
                say: "Fünfundfünfzig plus fünfundzwanzig gleich achtzig. Stimmt das?"
                answer: true
                hints: ["Rechne erst 55 + 20, dann die Einer."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne schrittweise."
                frame: "34 + 48 = 34 + 40 + _ = _"
                options: ["8", "4", "82", "72", "74"]
                answer: ["8", "82"]
              - id: l1-n2
                type: text_input
                text: "43 + 36 = _"
                answer: "79"
              - id: l1-n3
                type: multiple_choice
                text: "27 + 57 = ?"
                options: ["84", "74", "94"]
                answer: "84"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 66 + 18 = 74"
                say: "Sechsundsechzig plus achtzehn gleich vierundsiebzig. Stimmt das?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "19 + 63 = _"
                answer: "82"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "37 + 41 = _"
            say: "Siebenunddreißig plus einundvierzig."
            answer: "78"
          - id: l1-c2
            type: multiple_choice
            text: "48 + 35 = ?"
            say: "Achtundvierzig plus fünfunddreißig."
            options: ["83", "73", "713"]
            answer: "83"
          - id: l1-c3
            type: fill_in_blank
            text: "Rechne schrittweise."
            say: "Rechne schrittweise. Sechsundzwanzig plus fünfundvierzig."
            frame: "26 + 45 = 26 + 40 + _ = _"
            options: ["5", "4", "71", "66", "61"]
            answer: ["5", "71"]
          - id: l1-c4
            type: text_input
            text: "42 + 35 = _"
            say: "Zweiundvierzig plus fünfunddreißig."
            answer: "77"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 38 + 44 = 72"
            say: "Achtunddreißig plus vierundvierzig gleich zweiundsiebzig. Stimmt das?"
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "57 + 26 schrittweise: Welcher Sprung kommt zuerst?"
            say: "Du rechnest siebenundfünfzig plus sechsundzwanzig schrittweise. Welcher Sprung kommt zuerst?"
            show: { drawn: rechenstrich, start: 57, jumps: [] }
            options: ["+20", "+6", "+2"]
            answer: "+20"

  - n: 2
    title: { de: Stellenweise rechnen, en: Adding tens and ones apart }
    new_content: true
    activities:
