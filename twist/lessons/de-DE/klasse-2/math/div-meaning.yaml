# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.div-meaning
skill: math.mult-div.div-meaning
curriculum: de-DE
language: de
title:
  de: Aufteilen und Verteilen
  en: Grouping and sharing
summary: >
  What division means. Lesson 1 is Aufteilen (12 apples, three to a bag:
  how many bags?) and the sign ":" read as "geteilt durch"; lesson 2 is
  Verteilen (12 strawberries shared fairly among three children: how many
  each?), tells the two apart, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.count-to-10]
  also_practises: [math.mult-div.mult-meaning, math.mult-div.arrays]
  vocabulary: { de: [aufteilen, verteilen, geteilt durch, gerecht, Gruppe, reihum] }
  forms: [picture, drawn, text, audio]
  drawn: [dots]
  facets: [operation-signs]
  parts:
    - { id: group, what: { de: beim Aufteilen die Zahl der Gruppen finden, en: "grouping, finding how many groups" } }
    - { id: share, what: { de: "beim Verteilen finden, wie viele jeder bekommt", en: "sharing, finding how many each gets" } }
    - { id: which, what: { de: die passende Geteiltaufgabe zu einer Geschichte finden, en: finding the division that matches a story } }
    - { id: calc, what: { de: Geteiltaufgaben ausrechnen, en: working out divisions } }
  misconceptions:
    - id: subtract-once
      what: Takes the group size away once instead of making groups (10 balls, 2 to a box, gives 8)
      addressed: l1-f1 and l2-f1 have the difference as an option with feedback; "Welche Aufgabe passt?" in every stage of lesson 1 offers the minus task, with feedback in l1-f3
    - id: groups-or-size
      what: "Mixes up the number of groups and the size of a group (12 : 3, answers 3)"
      addressed: "lesson 2 Learn sets Aufteilen (how many groups?) against Verteilen (how many each?); l1-s1 and l2-s1 offer the divisor as an option; l2-s3 and l2-n3 ask which of the two a story is"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Aufteilen", en: "Grouping" }
    goal:
      de: "Teile Dinge in gleich große Gruppen auf, so wie 12 Äpfel mit immer 3 in einer Tüte."
      en: "Put things into equal groups, like 12 apples with 3 in each bag."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: tap_to_count
            text: "Wie viele Äpfel sind es?"
            say: "Tippe jeden Apfel einmal an. Wie viele Äpfel sind es?"
            show: { object: apple, count: 8, layout: row }
            options: ["7", "8", "9"]
            answer: "8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "3 + 3 + 3 + 3 = _"
            say: "Drei plus drei plus drei plus drei."
            answer: "12"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "12 Äpfel, immer 3 in eine Tüte"
            say: "Hier sind zwölf Äpfel. Wir packen immer drei Äpfel in eine Tüte. Wie viele Tüten brauchen wir?"
            show: { object: apple, count: 12, layout: row }
          - text: "12 : 3 = 4"
            say: "Wir legen immer drei Äpfel zusammen. Das sind vier Gruppen. Wir brauchen also vier Tüten."
            show: { drawn: dots, array: [4, 3] }
          - text: "12 : 3 = 4"
            say: "Das Zeichen mit den zwei Punkten heißt geteilt durch. Zwölf geteilt durch drei ist vier."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "10 Bälle, immer 2 in eine Kiste. Wie viele Kisten?"
                say: "Zehn Bälle. Immer zwei kommen in eine Kiste. Wie viele Kisten brauchst du?"
                show: { drawn: dots, array: [5, 2] }
                options: ["5", "2", "8"]
                answer: "5"
                feedback:
                  "8": "Das ist zehn minus zwei. Zähle, wie viele Zweiergruppen es sind."
                  "2": "In jede Kiste kommen zwei. Wie viele Kisten sind es?"
                hints:
                  - "Lege immer zwei Bälle zusammen."
                  - "Jede Reihe ist eine Kiste. Zähle die Reihen."
                  - "5 Kisten."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "15 Stifte, immer 5 in eine Dose."
                say: "Fünfzehn Stifte. Immer fünf kommen in eine Dose. Wie viele Dosen brauchst du?"
                show: { drawn: dots, array: [3, 5] }
                frame: "15 : 5 = _"
                options: ["3", "5", "10"]
                answer: ["3"]
                hints:
                  - "Wie oft passen fünf Stifte in fünfzehn?"
                  - "Fünf, zehn, fünfzehn. Das sind drei Fünfer."
                  - "3."
              - id: l1-f3
                type: multiple_choice
                text: "8 Brötchen, immer 2 in eine Tüte. Welche Aufgabe passt?"
                say: "Acht Brötchen. Immer zwei kommen in eine Tüte. Welche Aufgabe passt?"
                options: ["8 : 2", "8 − 2", "8 + 2"]
                answer: "8 : 2"
                feedback:
                  "8 − 2": "Du nimmst nicht nur einmal zwei weg. Du teilst die Brötchen in Zweiergruppen auf."
                  "8 + 2": "Es kommen keine Brötchen dazu. Du teilst sie auf."
                hints:
                  - "Du teilst die Brötchen auf, immer zwei in eine Tüte."
                  - "Aufteilen rechnest du mit geteilt durch."
                  - "8 : 2."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 : 2 = 3"
                say: "Sechs geteilt durch zwei ist drei. Stimmt das?"
                show: { drawn: dots, array: [3, 2] }
                answer: true
                hints:
                  - "Zähle die Zweiergruppen."
                  - "Drei Reihen mit je zwei Punkten."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: text_input
                text: "20 Kekse, immer 10 auf einen Teller. Wie viele Teller?"
                say: "Zwanzig Kekse. Immer zehn kommen auf einen Teller. Wie viele Teller brauchst du?"
                answer: "2"
                hints:
                  - "Wie oft passt zehn in zwanzig?"
                  - "Zehn und noch einmal zehn."
                  - "2."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "12 Erdbeeren, immer 4 in eine Schale. Wie viele Schalen?"
                say: "Zwölf Erdbeeren. Immer vier kommen in eine Schale. Wie viele Schalen brauchst du?"
                show: { drawn: dots, array: [3, 4] }
                options: ["3", "4", "8"]
                answer: "3"
                hints: ["Zähle die Vierergruppen."]
              - id: l1-s2
                type: fill_in_blank
                text: "18 Kinder, immer 3 an einen Tisch."
                say: "Achtzehn Kinder. Immer drei sitzen an einem Tisch. Wie viele Tische braucht ihr?"
                frame: "18 : 3 = _"
                options: ["6", "3", "15"]
                answer: ["6"]
                hints: ["Zähle in Dreierschritten bis achtzehn."]
              - id: l1-s3
                type: multiple_choice
                text: "9 Murmeln, immer 3 in einen Beutel. Welche Aufgabe passt?"
                say: "Neun Murmeln. Immer drei kommen in einen Beutel. Welche Aufgabe passt?"
                options: ["9 : 3", "9 − 3", "9 · 3"]
                answer: "9 : 3"
                hints: ["Du teilst die Murmeln in Dreiergruppen auf."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 10 : 5 = 5"
                say: "Zehn geteilt durch fünf ist fünf. Stimmt das?"
                show: { drawn: dots, array: [2, 5] }
                answer: false
                hints: ["Zähle die Fünfergruppen."]
              - id: l1-s5
                type: text_input
                text: "14 Socken, immer 2 sind ein Paar. Wie viele Paare?"
                say: "Vierzehn Socken. Immer zwei sind ein Paar. Wie viele Paare sind es?"
                answer: "7"
                hints: ["Zähle in Zweierschritten bis vierzehn."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "16 Äpfel, immer 4 in eine Tüte. Wie viele Tüten?"
                say: "Sechzehn Äpfel. Immer vier kommen in eine Tüte. Wie viele Tüten brauchst du?"
                show: { object: apple, count: 16, layout: scattered }
                options: ["4", "12", "2"]
                answer: "4"
              - id: l1-n2
                type: fill_in_blank
                text: "25 Stifte, immer 5 in eine Dose."
                say: "Fünfundzwanzig Stifte. Immer fünf kommen in eine Dose. Wie viele Dosen brauchst du?"
                frame: "25 : 5 = _"
                options: ["5", "20", "4"]
                answer: ["5"]
              - id: l1-n3
                type: multiple_choice
                text: "20 Bälle, immer 5 in ein Netz. Welche Aufgabe passt?"
                say: "Zwanzig Bälle. Immer fünf kommen in ein Netz. Welche Aufgabe passt?"
                options: ["20 : 5", "20 − 5", "20 + 5"]
                answer: "20 : 5"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 12 : 2 = 6"
                say: "Zwölf geteilt durch zwei ist sechs. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "30 Kinder, immer 10 in einer Gruppe. Wie viele Gruppen?"
                say: "Dreißig Kinder. Immer zehn sind in einer Gruppe. Wie viele Gruppen sind es?"
                answer: "3"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "6 Bananen, immer 3 in eine Tüte. Wie viele Tüten?"
            say: "Sechs Bananen. Immer drei kommen in eine Tüte. Wie viele Tüten brauchst du?"
            answer: "2"
          - id: l1-c2
            type: multiple_choice
            text: "15 Kekse, immer 3 auf einen Teller. Welche Aufgabe passt?"
            say: "Fünfzehn Kekse. Immer drei kommen auf einen Teller. Welche Aufgabe passt?"
            options: ["15 : 3", "15 − 3", "15 · 3"]
            answer: "15 : 3"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 8 : 4 = 2"
            say: "Acht geteilt durch vier ist zwei. Stimmt das?"
            show: { drawn: dots, array: [2, 4] }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "21 Kinder, immer 3 in ein Auto. Wie viele Autos?"
            say: "Einundzwanzig Kinder. Immer drei fahren in einem Auto. Wie viele Autos braucht ihr?"
            options: ["7", "3", "18"]
            answer: "7"
          - id: l1-c5
            type: fill_in_blank
            text: "Rechne."
            say: "Rechne. Zehn geteilt durch zwei."
            frame: "10 : 2 = _"
            options: ["5", "8", "2"]
            answer: ["5"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 12 : 6 = 3"
            say: "Zwölf geteilt durch sechs ist drei. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Verteilen", en: "Sharing" }
    goal:
      de: "Verteile Dinge gerecht, so wie 12 Erdbeeren an 3 Kinder, und sag, wie viele jedes Kind bekommt."
      en: "Share things out fairly, like 12 strawberries between 3 children, and say how many each child gets."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "10 Kinder, immer 5 in einer Mannschaft. Wie viele Mannschaften?"
            say: "Zehn Kinder. Immer fünf spielen in einer Mannschaft. Wie viele Mannschaften gibt es?"
            options: ["2", "5", "15"]
            answer: "2"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Rechne."
            say: "Rechne. Zwanzig geteilt durch zwei."
            frame: "20 : 2 = _"
            options: ["10", "18", "2"]
            answer: ["10"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "12 Erdbeeren für 3 Kinder"
            say: "Zwölf Erdbeeren sollen gerecht an drei Kinder verteilt werden. Jedes Kind soll gleich viele bekommen."
            show: { object: strawberry, count: 12, layout: scattered }
          - text: "12 : 3 = 4"
            say: "Wir geben jedem Kind eine Erdbeere, dann noch eine, immer reihum, bis keine mehr übrig ist. Jedes Kind hat jetzt vier Erdbeeren."
            show: { drawn: dots, array: [3, 4] }
          - text: "Aufteilen: Wie viele Gruppen? | Verteilen: Wie viele für jeden?"
            say: "Beim Aufteilen fragst du: Wie viele Gruppen gibt es? Beim Verteilen fragst du: Wie viele bekommt jeder? Beide Male rechnest du mit geteilt durch."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "10 Bonbons für 2 Kinder. Wie viele bekommt jedes Kind?"
                say: "Zehn Bonbons werden gerecht an zwei Kinder verteilt. Wie viele bekommt jedes Kind?"
                show: { drawn: dots, array: [2, 5] }
                options: ["5", "2", "8"]
                answer: "5"
                feedback:
                  "8": "Das ist zehn minus zwei. Verteile die Bonbons gerecht an beide Kinder."
                  "2": "Zwei ist die Zahl der Kinder. Wie viele Bonbons bekommt jedes Kind?"
                hints:
                  - "Gib jedem Kind reihum ein Bonbon."
                  - "Jede Reihe gehört einem Kind. Zähle die Punkte in einer Reihe."
                  - "5."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "15 Murmeln für 3 Kinder."
                say: "Fünfzehn Murmeln werden gerecht an drei Kinder verteilt. Wie viele bekommt jedes Kind?"
                show: { drawn: dots, array: [3, 5] }
                frame: "15 : 3 = _"
                options: ["5", "3", "12"]
                answer: ["5"]
                hints:
                  - "Verteile reihum an drei Kinder."
                  - "Jede Reihe gehört einem Kind. In jeder Reihe sind fünf."
                  - "5."
              - id: l2-f3
                type: multiple_choice
                text: "20 Sticker für 4 Kinder. Welche Aufgabe passt?"
                say: "Zwanzig Sticker werden gerecht an vier Kinder verteilt. Welche Aufgabe passt?"
                options: ["20 : 4", "20 − 4", "20 · 4"]
                answer: "20 : 4"
                hints:
                  - "Die Sticker werden gerecht verteilt."
                  - "Verteilen rechnest du mit geteilt durch."
                  - "20 : 4."
              - id: l2-f4
                type: true_false
                text: "9 Kekse für 3 Kinder. Jedes Kind bekommt 3. Stimmt das?"
                say: "Neun Kekse werden gerecht an drei Kinder verteilt. Jedes Kind bekommt drei. Stimmt das?"
                show: { drawn: dots, array: [3, 3] }
                answer: true
                hints:
                  - "Verteile reihum."
                  - "Drei Reihen mit je drei Punkten."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: text_input
                text: "16 Stifte für 4 Kinder. Wie viele bekommt jedes Kind?"
                say: "Sechzehn Stifte werden gerecht an vier Kinder verteilt. Wie viele bekommt jedes Kind?"
                answer: "4"
                hints:
                  - "Verteile die Stifte reihum an die vier Kinder."
                  - "Jedes Kind bekommt zwei, das sind acht Stifte. Noch zwei für jedes, das sind sechzehn."
                  - "4."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "12 Äpfel für 4 Kinder. Wie viele bekommt jedes Kind?"
                say: "Zwölf Äpfel werden gerecht an vier Kinder verteilt. Wie viele bekommt jedes Kind?"
                show: { drawn: dots, array: [4, 3] }
                options: ["3", "4", "8"]
                answer: "3"
                hints: ["Gib jedem Kind reihum einen Apfel."]
              - id: l2-s2
                type: fill_in_blank
                text: "14 Bälle für 2 Mannschaften."
                say: "Vierzehn Bälle werden gerecht an zwei Mannschaften verteilt. Wie viele bekommt jede Mannschaft?"
                frame: "14 : 2 = _"
                options: ["7", "12", "2"]
                answer: ["7"]
                hints: ["Die Hälfte von vierzehn."]
              - id: l2-s3
                type: multiple_choice
                text: "18 Kinder, immer 6 in ein Boot. Wie viele Boote? Aufteilen oder verteilen?"
                say: "Achtzehn Kinder. Immer sechs fahren in einem Boot. Wie viele Boote braucht ihr? Ist das Aufteilen oder Verteilen?"
                options: ["Aufteilen", "Verteilen"]
                keep_order: true
                answer: "Aufteilen"
                hints: ["Fragt die Aufgabe nach der Zahl der Gruppen oder danach, wie viele jeder bekommt?"]
              - id: l2-s4
                type: true_false
                text: "8 Bananen für 2 Affen. Jeder bekommt 3. Stimmt das?"
                say: "Acht Bananen werden gerecht an zwei Affen verteilt. Jeder bekommt drei. Stimmt das?"
                answer: false
                hints: ["Verteile reihum. Bleibt etwas übrig?"]
              - id: l2-s5
                type: text_input
                text: "25 Murmeln für 5 Kinder. Wie viele bekommt jedes Kind?"
                say: "Fünfundzwanzig Murmeln werden gerecht an fünf Kinder verteilt. Wie viele bekommt jedes Kind?"
                answer: "5"
                hints: ["Fünf mal wie viel ist fünfundzwanzig?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "24 Erdbeeren für 3 Kinder. Wie viele bekommt jedes Kind?"
                say: "Vierundzwanzig Erdbeeren werden gerecht an drei Kinder verteilt. Wie viele bekommt jedes Kind?"
                options: ["8", "3", "21"]
                answer: "8"
              - id: l2-n2
                type: fill_in_blank
                text: "20 Sticker für 5 Kinder."
                say: "Zwanzig Sticker werden gerecht an fünf Kinder verteilt. Wie viele bekommt jedes Kind?"
                frame: "20 : 5 = _"
                options: ["4", "5", "15"]
                answer: ["4"]
              - id: l2-n3
                type: multiple_choice
                text: "4 Kinder teilen sich 24 Bonbons gerecht. Wie viele bekommt jedes Kind? Aufteilen oder verteilen?"
                say: "Vier Kinder teilen sich vierundzwanzig Bonbons gerecht. Wie viele bekommt jedes Kind? Ist das Aufteilen oder Verteilen?"
                options: ["Aufteilen", "Verteilen"]
                keep_order: true
                answer: "Verteilen"
              - id: l2-n4
                type: true_false
                text: "30 Stifte für 10 Kinder. Jedes Kind bekommt 3. Stimmt das?"
                say: "Dreißig Stifte werden gerecht an zehn Kinder verteilt. Jedes Kind bekommt drei. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "12 Kekse für 6 Kinder. Wie viele bekommt jedes Kind?"
                say: "Zwölf Kekse werden gerecht an sechs Kinder verteilt. Wie viele bekommt jedes Kind?"
                answer: "2"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: group
            type: text_input
            text: "14 Äpfel, immer 7 in eine Tüte. Wie viele Tüten?"
            say: "Vierzehn Äpfel. Immer sieben kommen in eine Tüte. Wie viele Tüten brauchst du?"
            answer: "2"
          - id: l2-c2
            part: share
            type: text_input
            text: "21 Bonbons für 3 Kinder. Wie viele bekommt jedes Kind?"
            say: "Einundzwanzig Bonbons werden gerecht an drei Kinder verteilt. Wie viele bekommt jedes Kind?"
            answer: "7"
          - id: l2-c3
            part: which
            type: multiple_choice
            text: "16 Räder, jedes Auto hat 4. Wie viele Autos? Welche Aufgabe passt?"
            say: "Sechzehn Räder. Jedes Auto hat vier Räder. Wie viele Autos sind das? Welche Aufgabe passt?"
            options: ["16 : 4", "16 − 4", "16 · 4"]
            answer: "16 : 4"
          - id: l2-c4
            part: calc
            type: fill_in_blank
            text: "Rechne."
            say: "Rechne. Achtzehn geteilt durch zwei."
            frame: "18 : 2 = _"
            options: ["9", "8", "16"]
            answer: ["9"]
          - id: l2-c5
            part: calc
            type: true_false
            text: "Stimmt das? 12 : 4 = 4"
            say: "Zwölf geteilt durch vier ist vier. Stimmt das?"
            answer: false
          - id: l2-c6
            part: group
            type: multiple_choice
            text: "12 Eier, immer 6 in einen Karton. Wie viele Kartons?"
            say: "Zwölf Eier. Immer sechs kommen in einen Karton. Wie viele Kartons brauchst du?"
            options: ["2", "6", "18"]
            answer: "2"
          - id: l2-c7
            part: group
            type: fill_in_blank
            text: "20 Stifte, immer 4 in eine Dose."
            say: "Zwanzig Stifte. Immer vier kommen in eine Dose. Wie viele Dosen brauchst du?"
            frame: "20 : 4 = _"
            options: ["5", "4", "16"]
            answer: ["5"]
          - id: l2-c8
            part: group
            type: true_false
            text: "15 Kinder, immer 5 an einem Tisch. Ihr braucht 3 Tische. Stimmt das?"
            say: "Fünfzehn Kinder. Immer fünf sitzen an einem Tisch. Ihr braucht drei Tische. Stimmt das?"
            answer: true
          - id: l2-c9
            part: group
            type: multiple_choice
            text: "12 Äpfel, immer 2 in eine Tüte. Wie viele Tüten?"
            say: "Zwölf Äpfel. Immer zwei kommen in eine Tüte. Wie viele Tüten brauchst du?"
            show: { object: apple, count: 12, layout: scattered }
            options: ["6", "2", "10"]
            answer: "6"
          - id: l2-c10
            part: share
            type: multiple_choice
            text: "8 Kekse für 4 Kinder. Wie viele bekommt jedes Kind?"
            say: "Acht Kekse werden gerecht an vier Kinder verteilt. Wie viele bekommt jedes Kind?"
            options: ["2", "4", "12"]
            answer: "2"
          - id: l2-c11
            part: share
            type: fill_in_blank
            text: "30 Murmeln für 3 Kinder."
            say: "Dreißig Murmeln werden gerecht an drei Kinder verteilt. Wie viele bekommt jedes Kind?"
            frame: "30 : 3 = _"
            options: ["10", "3", "27"]
            answer: ["10"]
          - id: l2-c12
            part: share
            type: true_false
            text: "6 Bananen für 3 Affen. Jeder bekommt 3. Stimmt das?"
            say: "Sechs Bananen werden gerecht an drei Affen verteilt. Jeder bekommt drei. Stimmt das?"
            answer: false
          - id: l2-c13
            part: share
            type: text_input
            text: "Lea und Tim teilen sich 18 Erdbeeren gerecht. Wie viele bekommt jeder?"
            say: "Lea und Tim teilen sich achtzehn Erdbeeren gerecht. Wie viele bekommt jeder?"
            answer: "9"
          - id: l2-c14
            part: which
            type: multiple_choice
            text: "12 Stühle, immer 4 an einen Tisch. Welche Aufgabe passt?"
            say: "Zwölf Stühle. Immer vier kommen an einen Tisch. Welche Aufgabe passt?"
            options: ["12 : 4", "12 − 4", "12 + 4"]
            answer: "12 : 4"
          - id: l2-c15
            part: which
