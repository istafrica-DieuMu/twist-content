# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.read-tables
skill: math.data.read-tables
curriculum: de-DE
language: de
title:
  de: Tabellen lesen
  en: Reading tables
summary: >
  Lesson 1 reads a table with two columns (Eissorte und Kinder, Bücher in
  den Ferien, Tiere auf dem Bauernhof): find the row, read across, and
  answer questions about the most, the fewest, how many more and how
  many together; lesson 2 reads tables with rows and columns, where the
  answer stands where a row and a column meet (Runden an drei Tagen, ein
  Stundenplan, ein Wochenkalender), and ends with the skill check.
  Filling in a table yourself waits for a table task.
metadata:
  year: klasse-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.tally]
  also_practises: [math.add-sub-to-100.add-two-digit, math.data.tally]
  vocabulary: { de: [Tabelle, Zeile, Spalte, ablesen, Stundenplan, Kalender, am meisten, am wenigsten, insgesamt] }
  forms: [text, audio, drawn]
  drawn: [bar-chart, table]
  facets: []
  parts:
    - { id: read, what: { de: eine Zahl in der richtigen Zeile ablesen, en: reading a number in the right row } }
    - { id: compare, what: { de: "am meisten und am wenigsten finden", en: finding the most and the fewest } }
    - { id: calculate, what: { de: "mit den Zahlen rechnen: wie viele mehr, wie viele zusammen", en: "working with the numbers: how many more, how many altogether" } }
    - { id: grid, what: { de: "ablesen, wo sich Zeile und Spalte treffen, auch im Stundenplan", en: "reading where a row and a column meet, also in a timetable" } }
  misconceptions:
    - id: neighbour-row
      what: Reads the number from the row above or below the one asked for
      addressed: lesson 1 Learn finds the row first and reads across; l1-f1 (with feedback), l1-s1 and l1-n1 offer the numbers of the neighbouring rows
    - id: row-column-mixed
      what: In a table with rows and columns reads along the wrong line (the other child's number, or the wrong day)
      addressed: lesson 2 Learn finds the cell where a row and a column meet; l2-f1 (with feedback), l2-s4, l2-n1 and l2-c1 offer the number from the other row or column
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Eine Tabelle lesen", en: "Reading a table" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Striche sind es?"
            say: "Wie viele Striche sind es?"
            show: { drawn: bar-chart, tally: true, rows: [["", 7]] }
            options: ["7", "2", "8"]
            answer: "7"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welche Farbe mögen die meisten?"
            say: "Welche Farbe mögen die meisten Kinder?"
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 4], ["Blau", 6], ["Gelb", 3]] }
            options: ["Blau", "Rot", "Gelb"]
            answer: "Blau"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lieblingseis"
            show: { drawn: table, rows: [[Eissorte, Kinder], [Schoko, "8"], [Erdbeere, "6"], [Vanille, "5"]] }
            say: "Das ist eine Tabelle. In der obersten Zeile steht, was in den Spalten steht: links die Eissorte, rechts wie viele Kinder sie mögen."
          - text: "Lieblingseis: Erdbeere"
            show: { drawn: table, rows: [[Eissorte, Kinder], [Schoko, "8"], [Erdbeere, "6"], [Vanille, "5"]], mark: [[2, 0], [2, 1]] }
            say: "Wie viele Kinder mögen Erdbeere? Such zuerst die Zeile mit Erdbeere. Dann geh in dieser Zeile nach rechts: sechs Kinder."
          - text: "Schoko 8, Vanille 5\n8 − 5 = 3"
            show: { drawn: table, rows: [[Eissorte, Kinder], [Schoko, "8"], [Erdbeere, "6"], [Vanille, "5"]], mark: [[1, 1], [3, 1]] }
            say: "Wie viele Kinder mehr mögen Schoko als Vanille? Lies beide Zahlen ab: acht und fünf. Acht minus fünf ist drei. Drei Kinder mehr."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Bücher in den Ferien\nWie viele Bücher hat Mia gelesen?"
                show: { drawn: table, rows: [[Kind, Bücher], [Lea, "7"], [Tim, "4"], [Mia, "9"], [Ben, "5"]] }
                say: "Die Tabelle zeigt, wie viele Bücher die Kinder in den Ferien gelesen haben. Wie viele Bücher hat Mia gelesen?"
                options: ["9", "5", "4"]
                answer: "9"
                feedback:
                  "5": "5 steht in der Zeile darunter, bei Ben. Bleib in Mias Zeile."
                  "4": "4 steht in der Zeile darüber, bei Tim. Bleib in Mias Zeile."
                hints:
                  - "Such zuerst die Zeile mit Mia."
                  - "Geh in Mias Zeile nach rechts."
                  - "9 Bücher."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Bücher in den Ferien\nWer hat die meisten Bücher gelesen?"
                show: { drawn: table, rows: [[Kind, Bücher], [Lea, "7"], [Tim, "4"], [Mia, "9"], [Ben, "5"]] }
                say: "Wer hat die meisten Bücher gelesen?"
                options: ["Mia", "Lea", "Ben"]
                answer: "Mia"
                hints:
                  - "Die meisten heißt: die größte Zahl."
                  - "Vergleiche 7, 4, 9 und 5."
                  - "Mia hat 9 Bücher gelesen."
              - id: l1-f3
                type: multiple_choice
                text: "Bücher in den Ferien\nWie viele Bücher hat Lea mehr gelesen als Tim?"
                show: { drawn: table, rows: [[Kind, Bücher], [Lea, "7"], [Tim, "4"], [Mia, "9"], [Ben, "5"]] }
                say: "Wie viele Bücher hat Lea mehr gelesen als Tim?"
                options: ["3", "11", "4"]
                answer: "3"
                hints:
                  - "Lies die Zahlen von Lea und von Tim ab."
                  - "Lea 7, Tim 4. Rechne 7 − 4."
                  - "3 Bücher mehr."
              - id: l1-f4
                type: true_false
                text: "Bücher in den Ferien\nBen hat 5 Bücher gelesen."
                show: { drawn: table, rows: [[Kind, Bücher], [Lea, "7"], [Tim, "4"], [Mia, "9"], [Ben, "5"]] }
                say: "Stimmt das? Ben hat fünf Bücher gelesen."
                answer: true
                hints:
                  - "Such die Zeile mit Ben."
                  - "Was steht bei Ben rechts?"
                  - "Ja, Ben hat 5 Bücher gelesen."
              - id: l1-f5
                type: multiple_choice
                text: "Bücher in den Ferien\nWie viele Bücher haben Lea und Tim zusammen gelesen?"
                show: { drawn: table, rows: [[Kind, Bücher], [Lea, "7"], [Tim, "4"], [Mia, "9"], [Ben, "5"]] }
                say: "Wie viele Bücher haben Lea und Tim zusammen gelesen?"
                options: ["11", "3", "7"]
                answer: "11"
                hints:
                  - "Zusammen heißt: plus."
                  - "7 + 4."
                  - "11 Bücher."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nWie viele Kühe gibt es?"
                show: { drawn: table, rows: [[Tier, Anzahl], [Hühner, "12"], [Kühe, "8"], [Schafe, "15"], [Pferde, "3"]] }
                say: "Die Tabelle zeigt die Tiere auf einem Bauernhof. Wie viele Kühe gibt es?"
                options: ["8", "12", "15"]
                answer: "8"
                hints: ["Such die Zeile mit den Kühen und bleib in dieser Zeile."]
              - id: l1-s2
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nVon welchem Tier gibt es am wenigsten?"
                show: { drawn: table, rows: [[Tier, Anzahl], [Hühner, "12"], [Kühe, "8"], [Schafe, "15"], [Pferde, "3"]] }
                say: "Von welchem Tier gibt es am wenigsten?"
                options: ["Pferde", "Kühe", "Schafe"]
                answer: "Pferde"
                hints: ["Am wenigsten heißt: die kleinste Zahl."]
              - id: l1-s3
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nWie viele Schafe gibt es mehr als Hühner?"
                show: { drawn: table, rows: [[Tier, Anzahl], [Hühner, "12"], [Kühe, "8"], [Schafe, "15"], [Pferde, "3"]] }
                say: "Wie viele Schafe gibt es mehr als Hühner?"
                options: ["3", "27", "4"]
                answer: "3"
                hints: ["Rechne 15 − 12."]
              - id: l1-s4
                type: true_false
                text: "Tiere auf dem Bauernhof\nEs gibt 15 Hühner."
                show: { drawn: table, rows: [[Tier, Anzahl], [Hühner, "12"], [Kühe, "8"], [Schafe, "15"], [Pferde, "3"]] }
                say: "Stimmt das? Es gibt fünfzehn Hühner."
                answer: false
                hints: ["Such die Zeile mit den Hühnern."]
              - id: l1-s5
                type: multiple_choice
                text: "Tiere auf dem Bauernhof\nWie viele Kühe und Pferde sind es zusammen?"
                show: { drawn: table, rows: [[Tier, Anzahl], [Hühner, "12"], [Kühe, "8"], [Schafe, "15"], [Pferde, "3"]] }
                say: "Wie viele Kühe und Pferde sind es zusammen?"
                options: ["11", "5", "9"]
                answer: "11"
                hints: ["Rechne 8 + 3."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Sport nach der Schule\nWie viele Kinder turnen?"
                show: { drawn: table, rows: [[Sport, Kinder], [Fußball, "14"], [Schwimmen, "9"], [Turnen, "6"], [Tanzen, "11"]] }
                say: "Die Tabelle zeigt, welchen Sport die Kinder nach der Schule machen. Wie viele Kinder turnen?"
                options: ["6", "9", "11"]
                answer: "6"
              - id: l1-n2
                type: multiple_choice
                text: "Sport nach der Schule\nWelchen Sport machen die meisten Kinder?"
                show: { drawn: table, rows: [[Sport, Kinder], [Fußball, "14"], [Schwimmen, "9"], [Turnen, "6"], [Tanzen, "11"]] }
                say: "Welchen Sport machen die meisten Kinder?"
                options: ["Fußball", "Tanzen", "Schwimmen"]
                answer: "Fußball"
              - id: l1-n3
                type: multiple_choice
                text: "Sport nach der Schule\nWie viele Kinder mehr spielen Fußball als tanzen?"
                show: { drawn: table, rows: [[Sport, Kinder], [Fußball, "14"], [Schwimmen, "9"], [Turnen, "6"], [Tanzen, "11"]] }
                say: "Wie viele Kinder mehr spielen Fußball als tanzen?"
                options: ["3", "25", "5"]
                answer: "3"
              - id: l1-n4
                type: true_false
                text: "Sport nach der Schule\n9 Kinder schwimmen."
                show: { drawn: table, rows: [[Sport, Kinder], [Fußball, "14"], [Schwimmen, "9"], [Turnen, "6"], [Tanzen, "11"]] }
                say: "Stimmt das? Neun Kinder schwimmen."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Sport nach der Schule\nWie viele Kinder schwimmen und turnen zusammen?"
                show: { drawn: table, rows: [[Sport, Kinder], [Fußball, "14"], [Schwimmen, "9"], [Turnen, "6"], [Tanzen, "11"]] }
                say: "Wie viele Kinder schwimmen und turnen zusammen?"
                options: ["15", "3", "14"]
                answer: "15"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Kinder in den Klassen\nWie viele Kinder sind in der 2b?"
            show: { drawn: table, rows: [[Klasse, Kinder], [2a, "24"], [2b, "22"], [2c, "25"]] }
            say: "Die Tabelle zeigt, wie viele Kinder in jeder Klasse sind. Wie viele Kinder sind in der zwei b?"
            options: ["22", "24", "25"]
            answer: "22"
          - id: l1-c2
            type: multiple_choice
            text: "Kinder in den Klassen\nWelche Klasse hat die meisten Kinder?"
            show: { drawn: table, rows: [[Klasse, Kinder], [2a, "24"], [2b, "22"], [2c, "25"]] }
            say: "Welche Klasse hat die meisten Kinder?"
            options: ["2c", "2a", "2b"]
            answer: "2c"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Kinder in den Klassen\nIn der 2a sind 2 Kinder mehr als in der 2b."
            show: { drawn: table, rows: [[Klasse, Kinder], [2a, "24"], [2b, "22"], [2c, "25"]] }
            say: "Stimmt das? In der zwei a sind zwei Kinder mehr als in der zwei b."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Spiele in der Pause\nWie viele Kinder springen Seil?"
            show: { drawn: table, rows: [[Spiel, Kinder], [Fangen, "9"], [Seilspringen, "6"], [Verstecken, "12"]] }
            say: "Die Tabelle zeigt, was die Kinder in der Pause spielen. Wie viele Kinder springen Seil?"
            options: ["6", "9", "12"]
            answer: "6"
          - id: l1-c5
            type: multiple_choice
            text: "Spiele in der Pause\nWelches Spiel spielen die meisten Kinder?"
            show: { drawn: table, rows: [[Spiel, Kinder], [Fangen, "9"], [Seilspringen, "6"], [Verstecken, "12"]] }
            say: "Welches Spiel spielen die meisten Kinder?"
            options: ["Verstecken", "Fangen", "Seilspringen"]
            answer: "Verstecken"
          - id: l1-c6
            type: true_false
            text: "Spiele in der Pause\nFangen und Verstecken spielen zusammen 20 Kinder."
            show: { drawn: table, rows: [[Spiel, Kinder], [Fangen, "9"], [Seilspringen, "6"], [Verstecken, "12"]] }
            say: "Stimmt das? Fangen und Verstecken spielen zusammen zwanzig Kinder."
            answer: false

  - n: 2
    title: { de: "Zeilen und Spalten", en: "Rows and columns" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Bücher in den Ferien\nWie viele Bücher hat Tim gelesen?"
            show: { drawn: table, rows: [[Kind, Bücher], [Lea, "7"], [Tim, "4"], [Mia, "9"], [Ben, "5"]] }
            say: "Wie viele Bücher hat Tim gelesen?"
            options: ["4", "7", "9"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Tiere auf dem Bauernhof\nVon welchem Tier gibt es die meisten?"
            show: { drawn: table, rows: [[Tier, Anzahl], [Hühner, "12"], [Kühe, "8"], [Schafe, "15"], [Pferde, "3"]] }
            say: "Von welchem Tier gibt es die meisten?"
            options: ["Schafe", "Hühner", "Kühe"]
            answer: "Schafe"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Gelesene Seiten"
            show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Lea, "3", "5", "2"], [Tim, "4", "1", "6"]] }
            say: "Diese Tabelle hat Zeilen und Spalten. In jeder Zeile steht ein Kind, in jeder Spalte ein Tag: Montag, Dienstag, Mittwoch. Die Zahlen sagen, wie viele Seiten das Kind an diesem Tag gelesen hat."
          - text: "Gelesene Seiten: Tim am Dienstag"
            show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Lea, "3", "5", "2"], [Tim, "4", "1", "6"]], mark: [[2, 2]] }
            say: "Wie viele Seiten hat Tim am Dienstag gelesen? Geh in Tims Zeile. Dann such die Spalte Di. Wo sich Zeile und Spalte treffen, steht die Antwort: eine Seite."
          - text: "Stundenplan"
            show: { drawn: table, rows: [[Tag, "1. Stunde", "2. Stunde"], [Montag, Deutsch, Mathe], [Dienstag, Sport, Deutsch]], mark: [[2, 1]] }
            say: "Auch ein Stundenplan ist eine Tabelle. Was hast du am Dienstag in der ersten Stunde? Zeile Dienstag, Spalte erste Stunde: Sport."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Gelaufene Runden\nWie viele Runden ist Nora am Dienstag gelaufen?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Emil, "4", "6", "5"], [Nora, "7", "3", "8"]] }
                say: "Die Tabelle zeigt, wie viele Runden Emil und Nora auf dem Sportplatz gelaufen sind. Wie viele Runden ist Nora am Dienstag gelaufen?"
                options: ["3", "6", "7"]
                answer: "3"
                feedback:
                  "6": "6 steht bei Emil. Bleib in Noras Zeile und geh bis zur Spalte Di."
                  "7": "7 steht bei Montag. Geh in Noras Zeile weiter bis zur Spalte Di."
                hints:
                  - "Such zuerst Noras Zeile, dann die Spalte Di."
                  - "Wo treffen sich Noras Zeile und die Spalte Di?"
                  - "3 Runden."
              - id: l2-f2
                type: multiple_choice
                text: "Gelaufene Runden\nAn welchem Tag ist Emil die meisten Runden gelaufen?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Emil, "4", "6", "5"], [Nora, "7", "3", "8"]] }
                say: "An welchem Tag ist Emil die meisten Runden gelaufen?"
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
                keep_order: true
                hints:
                  - "Bleib in Emils Zeile."
                  - "Emil: 4, 6 und 5. Welche Zahl ist am größten?"
                  - "Am Dienstag, 6 Runden."
              - id: l2-f3
                type: multiple_choice
                text: "Gelaufene Runden\nWie viele Runden ist Nora insgesamt gelaufen?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Emil, "4", "6", "5"], [Nora, "7", "3", "8"]] }
                say: "Wie viele Runden ist Nora an allen drei Tagen zusammen gelaufen?"
                options: ["18", "8", "15"]
                answer: "18"
                hints:
                  - "Zähl alle Zahlen in Noras Zeile zusammen."
                  - "7 + 3 + 8."
                  - "18 Runden."
              - id: l2-f4
                type: true_false
                text: "Gelaufene Runden\nAm Mittwoch ist Nora mehr Runden gelaufen als Emil."
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Emil, "4", "6", "5"], [Nora, "7", "3", "8"]] }
                say: "Stimmt das? Am Mittwoch ist Nora mehr Runden gelaufen als Emil."
                answer: true
                hints:
                  - "Schau nur in die Spalte Mi."
                  - "Emil 5, Nora 8."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Stundenplan\nWas hat die Klasse am Mittwoch in der 2. Stunde?"
                show: { drawn: table, rows: [[Tag, "1. Stunde", "2. Stunde"], [Montag, Deutsch, Mathe], [Dienstag, Sport, Deutsch], [Mittwoch, Mathe, Kunst]] }
                say: "Das ist der Stundenplan der Klasse. Was hat die Klasse am Mittwoch in der zweiten Stunde?"
                options: ["Kunst", "Mathe", "Deutsch"]
                answer: "Kunst"
                hints:
                  - "Such die Zeile Mittwoch und die Spalte 2. Stunde."
                  - "Am Mittwoch: zuerst Mathe, dann ..."
                  - "Kunst."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Stundenplan\nWas hat die Klasse am Montag in der 1. Stunde?"
                show: { drawn: table, rows: [[Tag, "1. Stunde", "2. Stunde"], [Montag, Deutsch, Mathe], [Dienstag, Sport, Deutsch], [Mittwoch, Mathe, Kunst]] }
                say: "Was hat die Klasse am Montag in der ersten Stunde?"
                options: ["Deutsch", "Mathe", "Sport"]
                answer: "Deutsch"
                hints: ["Zeile Montag, Spalte 1. Stunde."]
              - id: l2-s2
                type: multiple_choice
                text: "Stundenplan\nAn welchem Tag hat die Klasse Sport?"
                show: { drawn: table, rows: [[Tag, "1. Stunde", "2. Stunde"], [Montag, Deutsch, Mathe], [Dienstag, Sport, Deutsch], [Mittwoch, Mathe, Kunst]] }
                say: "An welchem Tag hat die Klasse Sport?"
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
                keep_order: true
                hints: ["Such das Wort Sport. In welcher Zeile steht es?"]
              - id: l2-s3
                type: true_false
                text: "Stundenplan\nAm Mittwoch hat die Klasse in der 1. Stunde Mathe."
                show: { drawn: table, rows: [[Tag, "1. Stunde", "2. Stunde"], [Montag, Deutsch, Mathe], [Dienstag, Sport, Deutsch], [Mittwoch, Mathe, Kunst]] }
                say: "Stimmt das? Am Mittwoch hat die Klasse in der ersten Stunde Mathe."
                answer: true
                hints: ["Zeile Mittwoch, Spalte 1. Stunde."]
              - id: l2-s4
                type: multiple_choice
                text: "Gesammelte Kastanien\nWie viele Kastanien hat Jonas am Montag gesammelt?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Ida, "12", "9", "15"], [Jonas, "10", "14", "8"]] }
                say: "Die Tabelle zeigt, wie viele Kastanien Ida und Jonas gesammelt haben. Wie viele Kastanien hat Jonas am Montag gesammelt?"
                options: ["10", "12", "14"]
                answer: "10"
                hints: ["Jonas' Zeile, Spalte Mo."]
              - id: l2-s5
                type: multiple_choice
                text: "Gesammelte Kastanien\nWer hat am Dienstag mehr Kastanien gesammelt?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Ida, "12", "9", "15"], [Jonas, "10", "14", "8"]] }
                say: "Wer hat am Dienstag mehr Kastanien gesammelt?"
                options: ["Jonas", "Ida"]
                answer: "Jonas"
                hints: ["Schau nur in die Spalte Di."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Gesammelte Kastanien\nWie viele Kastanien hat Ida am Mittwoch gesammelt?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Ida, "12", "9", "15"], [Jonas, "10", "14", "8"]] }
                say: "Wie viele Kastanien hat Ida am Mittwoch gesammelt?"
                options: ["15", "8", "9"]
                answer: "15"
              - id: l2-n2
                type: multiple_choice
                text: "Gesammelte Kastanien\nWie viele Kastanien hat Jonas insgesamt gesammelt?"
                show: { drawn: table, rows: [[Kind, Mo, Di, Mi], [Ida, "12", "9", "15"], [Jonas, "10", "14", "8"]] }
                say: "Wie viele Kastanien hat Jonas an allen drei Tagen zusammen gesammelt?"
                options: ["32", "14", "30"]
                answer: "32"
              - id: l2-n3
                type: true_false
