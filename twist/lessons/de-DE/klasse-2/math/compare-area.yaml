# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.compare-area
skill: math.area-volume.compare-area
curriculum: de-DE
language: de
title:
  de: Flächen vergleichen
  en: Comparing areas
summary: >
  Lesson 1 measures a Fläche by the Kästchen that cover it and compares
  two Flächen by counting, so the longer one is not always the bigger
  one (a row of 7 is smaller than 2 rows of 4); lesson 2 counts only the
  coloured Kästchen on Kästchenpapier, sees that many different Figuren
  can have the same size, compares only with gleich große Kästchen, and
  ends with the skill check. Covering a shape by dragging tiles onto it
  waits for a drag task.
metadata:
  year: klasse-2
  topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.basic-shapes, math.numbers-to-20.count-to-10]
  also_practises: [math.numbers-to-20.count-to-10]
  vocabulary: { de: [Fläche, Kästchen, auslegen, größer, kleiner, gleich groß, Kästchenpapier] }
  forms: [text, audio, drawn]
  drawn: [shape, dots]
  facets: []
  parts:
    - { id: measure, what: { de: eine Fläche in Kästchen messen, en: measuring an area in squares } }
    - { id: compare, what: { de: zwei Flächen durch Zählen vergleichen, en: comparing two areas by counting } }
    - { id: units, what: { de: nur mit gleich großen Kästchen vergleichen, en: comparing only with squares of the same size } }
  misconceptions:
    - id: longer-is-bigger
      what: Thinks the longer or taller Fläche is the bigger one without counting the Kästchen
      addressed: lesson 1 Learn compares a long row of 6 with 2 rows of 3; l1-f2 (with feedback), l1-s2, l1-n2, l1-c2 and l2-c2 make the longer figure the smaller or the same
    - id: unequal-units
      what: Compares two Flächen by the number of tiles although the tiles are of different sizes
      addressed: lesson 2 Learn lays the same table with 4 large and 9 small tiles; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c4 give the same number of large and small tiles
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kästchen zählen", en: "Counting squares" }
    goal:
      de: "Zähl die Kästchen, um zu sehen, welche Fläche größer ist. Die längere ist nicht immer die größere."
      en: "Count the squares to see which area is bigger. The longer one is not always the bigger one."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wo ist das Rechteck?"
            say: "Wo ist das Rechteck?"
            options:
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: rectangle
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Punkte sind es?"
            say: "Wie viele Punkte sind es?"
            show: { drawn: dots, count: 8, layout: five-structure, colour_split: [5, 3] }
            options: ["8", "7", "9"]
            answer: "8"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A:\n■ ■ ■ ■ ■ ■\nB:\n■ ■ ■\n■ ■ ■"
            say: "Tom hat Decke A gehäkelt, Lea Decke B. Beide haben gleich große Kästchen. Was glaubst du: Welche Decke ist größer?"
          - text: "A:\n■ ■ ■ ■ ■ ■\nB:\n■ ■ ■\n■ ■ ■"
            say: "A ist länger als B. Aber zähl: A hat sechs Kästchen, B hat auch sechs. Die Flächen sind gleich groß. Schauen reicht nicht, du musst zählen."
          - text: "■ ■ ■\n■ ■ ■"
            say: "Diese Fläche ist mit Kästchen ausgelegt. Zähl die Kästchen: sechs. Die Fläche ist sechs Kästchen groß."
          - text: "A:\n■ ■ ■\n■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■ ■"
            say: "Welche Fläche ist größer? A hat sechs Kästchen, B hat acht. B ist größer."
          - text: "Wusstest du? Ein Schachbrett hat 64 gleich große Felder."
            say: "Wusstest du? Ein Schachbrett hat vierundsechzig gleich große Felder. Und wenn du auch die großen Quadrate zählst, die aus vielen Feldern bestehen, findest du auf dem Brett sogar zweihundertvier Quadrate!"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■ ■\n■ ■ ■ ■"
                say: "Wie viele Kästchen ist diese Fläche groß?"
                options: ["8", "4", "6"]
                answer: "8"
                hints:
                  - "Zähl Reihe für Reihe."
                  - "Oben sind 4, unten sind auch 4."
                  - "4 + 4 = 8 Kästchen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Fläche ist größer?\nA:\n■ ■ ■ ■ ■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■ ■"
                say: "Welche Fläche ist größer, A oder B? Oder sind beide gleich groß?"
                options: ["A", "B", "beide gleich groß"]
                answer: "B"
                keep_order: true
                feedback:
                  "A": "A ist länger. Aber zähl: A hat 7 Kästchen, B hat 8."
                hints:
                  - "Zähl bei beiden Flächen die Kästchen."
                  - "A hat 7 Kästchen. B hat zwei Reihen mit 4."
                  - "B ist größer."
              - id: l1-f3
                type: true_false
                text: "A:\n■ ■ ■\n■ ■ ■\nB:\n■ ■\n■ ■\n■ ■\nA und B sind gleich groß."
                say: "Stimmt das? Die Flächen A und B sind gleich groß."
                answer: true
                hints:
                  - "Zähl die Kästchen von A, dann von B."
                  - "A: 3 + 3. B: 2 + 2 + 2."
                  - "Ja, beide haben 6 Kästchen."
              - id: l1-f4
                type: multiple_choice
                text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■\n■\n■"
                say: "Wie viele Kästchen ist diese Fläche groß?"
                options: ["5", "3", "9"]
                answer: "5"
                hints:
                  - "Zähl jedes Kästchen genau einmal."
                  - "Oben sind 3, darunter noch 1 und noch 1."
                  - "5 Kästchen."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Fläche ist kleiner?\nA:\n■ ■ ■\n■ ■ ■\n■ ■ ■\nB:\n■ ■ ■ ■ ■\n■ ■ ■ ■ ■"
                say: "Welche Fläche ist kleiner, A oder B? Oder sind beide gleich groß?"
                options: ["A", "B", "beide gleich groß"]
                answer: "A"
                keep_order: true
                hints:
                  - "Kleiner heißt: weniger Kästchen."
                  - "A hat 3 Reihen mit 3, B hat 2 Reihen mit 5."
                  - "A hat 9, B hat 10. A ist kleiner."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■ ■ ■\n■ ■ ■ ■ ■"
                say: "Wie viele Kästchen ist diese Fläche groß? Tipp die Zahl ein."
                answer: "10"
                hints: ["Zwei Reihen mit je 5."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Fläche ist größer?\nA:\n■ ■ ■ ■ ■ ■\nB:\n■ ■ ■\n■ ■ ■\n■ ■"
                say: "Welche Fläche ist größer, A oder B? Oder sind beide gleich groß?"
                options: ["A", "B", "beide gleich groß"]
                answer: "B"
                keep_order: true
                hints: ["Nicht die Länge zählt. Zähl die Kästchen."]
              - id: l1-s3
                type: true_false
                text: "A:\n■ ■ ■ ■\nB:\n■ ■\n■ ■\nB ist größer als A."
                say: "Stimmt das? Die Fläche B ist größer als A."
                answer: false
                hints: ["Zähl bei A und bei B die Kästchen."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie viele Kästchen ist die Fläche groß?\n■ ■\n■ ■ ■\n■ ■ ■ ■"
                say: "Wie viele Kästchen ist diese Fläche groß?"
                options: ["9", "4", "12"]
                answer: "9"
                hints: ["Zähl Reihe für Reihe: 2, 3 und 4."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Fläche ist kleiner?\nA:\n■ ■ ■ ■\n■ ■ ■ ■\nB:\n■ ■ ■\n■ ■ ■\n■ ■ ■"
                say: "Welche Fläche ist kleiner, A oder B? Oder sind beide gleich groß?"
                options: ["A", "B", "beide gleich groß"]
                answer: "A"
                keep_order: true
                hints: ["Kleiner heißt: weniger Kästchen."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■\n■ ■ ■\n■ ■ ■"
                say: "Wie viele Kästchen ist diese Fläche groß? Tipp die Zahl ein."
                answer: "9"
              - id: l1-n2
                type: multiple_choice
                text: "Welche Fläche ist größer?\nA:\n■ ■ ■ ■ ■\n■ ■ ■ ■ ■\nB:\n■ ■ ■ ■ ■ ■ ■ ■"
                say: "Welche Fläche ist größer, A oder B? Oder sind beide gleich groß?"
                options: ["A", "B", "beide gleich groß"]
                answer: "A"
                keep_order: true
              - id: l1-n3
                type: true_false
                text: "A:\n■ ■ ■ ■ ■\nB:\n■ ■ ■\n■ ■\nA und B sind gleich groß."
                say: "Stimmt das? Die Flächen A und B sind gleich groß."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■ ■\n■\n■\n■"
                say: "Wie viele Kästchen ist diese Fläche groß?"
                options: ["7", "4", "16"]
                answer: "7"
              - id: l1-n5
                type: multiple_choice
                text: "Welche Fläche ist kleiner?\nA:\n■ ■\n■ ■\n■ ■\n■ ■\nB:\n■ ■ ■\n■ ■ ■\n■ ■ ■"
                say: "Welche Fläche ist kleiner, A oder B? Oder sind beide gleich groß?"
                options: ["A", "B", "beide gleich groß"]
                answer: "A"
                keep_order: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■ ■ ■ ■\n■ ■ ■ ■ ■ ■"
            say: "Wie viele Kästchen ist diese Fläche groß?"
            options: ["12", "6", "8"]
            answer: "12"
          - id: l1-c2
            type: multiple_choice
            text: "Welche Fläche ist größer?\nA:\n■ ■ ■ ■ ■ ■ ■ ■ ■\nB:\n■ ■ ■ ■ ■\n■ ■ ■ ■ ■"
            say: "Welche Fläche ist größer, A oder B? Oder sind beide gleich groß?"
            options: ["A", "B", "beide gleich groß"]
