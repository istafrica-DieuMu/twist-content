            text: "A:\n■ ■ ■\n■ ■ ■\nB:\n■ ■ ■ ■\n■ ■\nA und B sind gleich groß."
            say: "Stimmt das? Die Flächen A und B sind gleich groß."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■ ■ ■\n■ ■\n■"
            say: "Wie viele Kästchen ist diese Fläche groß?"
            options: ["8", "5", "3"]
            answer: "8"
          - id: l1-c5
            type: multiple_choice
            text: "Welche Fläche ist kleiner?\nA:\n■ ■ ■ ■ ■ ■ ■ ■\nB:\n■ ■ ■\n■ ■ ■"
            say: "Welche Fläche ist kleiner, A oder B? Oder sind beide gleich groß?"
            options: ["A", "B", "beide gleich groß"]
            answer: "B"
            keep_order: true
          - id: l1-c6
            type: true_false
            text: "A:\n■ ■ ■ ■ ■ ■ ■ ■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■ ■\nB ist größer als A."
            say: "Stimmt das? Die Fläche B ist größer als A."
            answer: false

  - n: 2
    title: { de: "Figuren auf Kästchenpapier", en: "Shapes on squared paper" }
    goal:
      de: "Zähl nur die ausgemalten Kästchen und finde Figuren, die gleich groß sind, auch wenn sie anders aussehen."
      en: "Count only the coloured squares and find shapes that are the same size, even when they look different."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Kästchen ist die Fläche groß?\n■ ■ ■\n■ ■ ■"
            say: "Wie viele Kästchen ist diese Fläche groß?"
            options: ["6", "3", "5"]
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Fläche ist größer?\nA:\n■ ■\nB:\n■ ■ ■"
            say: "Welche Fläche ist größer, A oder B?"
            options: ["A", "B"]
            answer: "B"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lea: große Fliesen\nTom: kleine Fliesen"
            say: "Lea und Tom legen zwei gleich große Tische mit Fliesen aus. Leas Fliesen sind groß, Toms Fliesen sind klein. Was glaubst du: Wer braucht mehr Fliesen?"
          - text: "Lea: 4 große Fliesen\nTom: 9 kleine Fliesen"
            say: "Tom! Lea braucht vier große Fliesen, Tom neun kleine. Die Tische sind trotzdem gleich groß. Zählen hilft nur, wenn alle Kästchen gleich groß sind."
          - text: "□ ■ □\n■ ■ ■\n□ ■ □"
            say: "Diese Figur ist auf Kästchenpapier ausgemalt. Zähl nur die ausgemalten Kästchen: fünf. Die leeren Kästchen gehören nicht zur Figur."
          - text: "■ ■ ■ ■ ■ ■\n\n■ ■ ■\n■ ■ ■\n\n■ ■ ■ ■\n■ ■"
            say: "Aus sechs Kästchen kannst du viele verschiedene Figuren legen. Sie sehen anders aus, aber jede ist sechs Kästchen groß."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Kästchen sind ausgemalt?\n□ ■ ■ □\n■ ■ ■ ■\n□ ■ ■ □"
                say: "Wie viele Kästchen sind ausgemalt?"
                options: ["8", "12", "4"]
                answer: "8"
                feedback:
                  "12": "Die leeren Kästchen zählen nicht mit. Zähl nur die ausgemalten."
                hints:
                  - "Zähl nur die ausgemalten Kästchen, Reihe für Reihe."
                  - "Oben 2, in der Mitte 4, unten 2."
                  - "8 Kästchen."
              - id: l2-f2
                type: multiple_choice
                text: "Mila legt ihr Beet mit 6 großen Platten aus.\nJan legt sein Beet mit 6 kleinen Platten aus.\nWelches Beet ist größer?"
                say: "Mila legt ihr Beet mit sechs großen Platten aus. Jan legt sein Beet mit sechs kleinen Platten aus. Welches Beet ist größer?"
                options: ["Milas Beet", "Jans Beet", "beide gleich groß"]
                answer: "Milas Beet"
                keep_order: true
                feedback:
                  "beide gleich groß": "Beide brauchen 6 Platten. Aber Milas Platten sind größer, also ist ihr Beet größer."
                hints:
                  - "Sind die Platten gleich groß?"
                  - "Gleich viele Platten, aber Milas Platten sind größer."
                  - "Milas Beet ist größer."
              - id: l2-f3
                type: true_false
                text: "A:\n■ ■ ■ ■\n■ ■ ■ ■\nB:\n■ ■ ■ ■ ■ ■ ■ ■\nA und B sind gleich groß."
                say: "Die Figuren sehen verschieden aus. Stimmt das: A und B sind gleich groß?"
                answer: true
                hints:
                  - "Zähl bei beiden Figuren die Kästchen."
                  - "A: 4 + 4. B: eine Reihe mit 8."
                  - "Ja, beide sind 8 Kästchen groß."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Figur ist 7 Kästchen groß?\nA:\n■ ■ ■\n■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■\nC:\n■ ■ ■ ■\n■ ■ ■ ■"
                say: "Welche Figur ist sieben Kästchen groß?"
                options: ["A", "B", "C"]
                answer: "B"
                keep_order: true
                hints:
                  - "Zähl bei jeder Figur die Kästchen."
                  - "A hat 6, C hat 8."
                  - "B: 4 + 3 = 7."
              - id: l2-f5
                type: multiple_choice
                text: "Ida malt noch 2 Kästchen dazu. Wie groß ist die Figur dann?\n■ ■ ■\n■ ■ ■"
                say: "Ida malt zu dieser Figur noch zwei Kästchen dazu. Wie viele Kästchen ist die Figur dann groß?"
                options: ["8", "6", "2"]
                answer: "8"
                hints:
                  - "Zähl zuerst, wie groß die Figur jetzt ist."
                  - "Jetzt sind es 6. Dazu kommen 2."
                  - "6 + 2 = 8 Kästchen."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "Wie viele Kästchen sind ausgemalt?\n□ ■ □\n■ ■ ■\n■ ■ ■"
                say: "Wie viele Kästchen sind ausgemalt? Tipp die Zahl ein."
                answer: "7"
                hints: ["Die leeren Kästchen zählen nicht mit."]
              - id: l2-s2
                type: multiple_choice
                text: "Ben legt eine Fläche mit 10 kleinen Plättchen aus.\nElla legt eine Fläche mit 10 großen Plättchen aus.\nWelche Fläche ist größer?"
                say: "Ben legt eine Fläche mit zehn kleinen Plättchen aus. Ella legt eine Fläche mit zehn großen Plättchen aus. Welche Fläche ist größer?"
                options: ["Bens Fläche", "Ellas Fläche", "beide gleich groß"]
                answer: "Ellas Fläche"
                keep_order: true
                feedback:
                  "Bens Fläche": "Kleine Plättchen, kleine Fläche. Ben müsste noch ganz schön viele dazulegen!"
                hints: ["Gleich viele Plättchen, aber sind sie gleich groß?"]
              - id: l2-s3
                type: true_false
                text: "A:\n■ ■ ■\n■ ■ ■\n■ ■ ■\nB:\n■ ■ ■ ■ ■\n■ ■ ■ ■\nA und B sind gleich groß."
                say: "Stimmt das: A und B sind gleich groß?"
                answer: true
                hints: ["Zähl bei beiden Figuren die Kästchen."]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Figur ist 5 Kästchen groß?\nA:\n■ ■ ■\n■ ■\nB:\n■ ■ ■ ■\n■ ■\nC:\n■ ■\n■ ■"
                say: "Welche Figur ist fünf Kästchen groß?"
                options: ["A", "B", "C"]
                answer: "A"
                keep_order: true
                hints: ["Zähl bei jeder Figur die Kästchen."]
              - id: l2-s5
                type: multiple_choice
                text: "Tom nimmt 3 Kästchen weg. Wie groß ist die Figur dann?\n■ ■ ■ ■\n■ ■ ■ ■"
                say: "Tom nimmt von dieser Figur drei Kästchen weg. Wie viele Kästchen ist die Figur dann groß?"
                options: ["5", "8", "11"]
                answer: "5"
                hints: ["Jetzt sind es 8 Kästchen. Drei kommen weg."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "Wie viele Kästchen sind ausgemalt?\n■ □ ■\n■ ■ ■\n■ □ ■"
                say: "Wie viele Kästchen sind ausgemalt? Tipp die Zahl ein."
                answer: "7"
              - id: l2-n2
                type: multiple_choice
                text: "Paula legt ein Bild mit 8 kleinen Kärtchen aus.\nEmre legt ein Bild mit 8 großen Kärtchen aus.\nWelches Bild ist größer?"
                say: "Paula legt ein Bild mit acht kleinen Kärtchen aus. Emre legt ein Bild mit acht großen Kärtchen aus. Welches Bild ist größer?"
                options: ["Paulas Bild", "Emres Bild", "beide gleich groß"]
                answer: "Emres Bild"
                keep_order: true
              - id: l2-n3
                type: true_false
                text: "A:\n■ ■ ■ ■ ■\n■ ■ ■ ■ ■\nB:\n■ ■ ■\n■ ■ ■\n■ ■ ■\nA und B sind gleich groß."
                say: "Stimmt das: A und B sind gleich groß?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Welche Figur ist 9 Kästchen groß?\nA:\n■ ■ ■\n■ ■ ■\n■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■ ■\nC:\n■ ■ ■ ■ ■\n■ ■ ■ ■ ■"
                say: "Welche Figur ist neun Kästchen groß?"
                options: ["A", "B", "C"]
                answer: "A"
                keep_order: true
              - id: l2-n5
                type: multiple_choice
                text: "Lina malt noch 4 Kästchen dazu. Wie groß ist die Figur dann?\n■ ■ ■ ■ ■"
                say: "Lina malt zu dieser Figur noch vier Kästchen dazu. Wie viele Kästchen ist die Figur dann groß?"
                options: ["9", "5", "4"]
                answer: "9"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: measure
            type: multiple_choice
            text: "Wie viele Kästchen sind ausgemalt?\n■ ■ ■ □\n■ ■ □ □\n■ □ □ □"
