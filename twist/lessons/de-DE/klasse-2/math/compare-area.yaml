            text: "A:\n■ ■ ■ ■ ■ ■ ■\nB:\n■ ■ ■ ■\n■ ■ ■\nA und B sind gleich groß."
            say: "Stimmt das: A und B sind gleich groß?"
            answer: true
          - id: l2-c4
            part: units
            type: multiple_choice
            text: "Leo legt eine Fläche mit 5 großen Fliesen aus.\nSara legt eine Fläche mit 5 kleinen Fliesen aus.\nWelche Fläche ist größer?"
            say: "Leo legt eine Fläche mit fünf großen Fliesen aus. Sara legt eine Fläche mit fünf kleinen Fliesen aus. Welche Fläche ist größer?"
            options: ["Leos Fläche", "Saras Fläche", "beide gleich groß"]
            answer: "Leos Fläche"
            keep_order: true
          - id: l2-c5
