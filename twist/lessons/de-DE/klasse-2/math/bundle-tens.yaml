          - id: l2-c5
            part: estimate
            type: multiple_choice
            text: "Schätze: Wie viele sind es ungefähr?"
            say: "Schau kurz hin und schätze. Wie viele Punkte sind es ungefähr?"
            show: { drawn: hundred-field, filled: 60, flash: 2 }
            options: ["etwa 20", "etwa 60", "etwa 100"]
            answer: "etwa 60"
          - id: l2-c6
            part: count
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 6, ones: 4 }
            options: ["64", "46", "10"]
            answer: "64"
          - id: l2-c7
            part: count
            type: true_false
            text: "Stimmt das? 7 Zehner und 2 Einer sind 27."
            say: "Sieben Zehner und zwei Einer. Sind das siebenundzwanzig?"
            show: { drawn: base-ten, tens: 7, ones: 2 }
            answer: false
          - id: l2-c8
            part: count
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: hundred-field, filled: 47 }
            options: ["47", "74", "40"]
            answer: "47"
          - id: l2-c9
            part: count
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 1, ones: 9 }
            options: ["19", "91", "10"]
            answer: "19"
          - id: l2-c10
            part: bundle
            type: fill_in_blank
            text: "Wie viele Zehner, wie viele Einer?"
            show: { drawn: base-ten, tens: 5, ones: 8 }
            frame: "_ Zehner und _ Einer"
            options: ["5", "8", "13", "58"]
            answer: ["5", "8"]
          - id: l2-c11
            part: bundle
            type: image_multiple_choice
            text: "Welches Bild zeigt 39?"
            options:
