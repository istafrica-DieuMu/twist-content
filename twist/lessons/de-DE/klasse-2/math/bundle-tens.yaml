# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.bundle-tens
skill: math.numbers-to-100.bundle-tens
curriculum: de-DE
language: de
title:
  de: Zehner bündeln
  en: Bundling tens
summary: >
  The start of the Hunderterraum. Children bundle things into tens and
  count tens and ones (3 Zehner und 4 Einer sind 34), then use bundles to
  estimate a large amount and check the estimate. Lesson 1 bundles and
  counts; lesson 2 estimates and checks, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens]
  also_practises: [math.numbers-to-20.teens]
  vocabulary: { de: [bündeln, Zehner, Einer, Zehnerstange, Einerwürfel, schätzen, prüfen] }
  forms: [drawn, text, audio]
  drawn: [base-ten, hundred-field]
  facets: []
  parts:
    - { id: count, what: { de: Zehner und Einer zählen, en: counting tens and ones } }
    - { id: bundle, what: { de: eine Zahl in Zehner und Einer bündeln, en: grouping a number into tens and ones } }
    - { id: estimate, what: { de: große Anzahlen schätzen und prüfen, en: estimating and checking large amounts } }
  misconceptions:
    - id: count-ones
      what: Counts every single cube instead of counting the tens as tens
      addressed: Learn counts in tens first ("zehn, zwanzig, dreißig") and then the ones; hints say "Zähl zuerst die Zehner."
    - id: tens-as-ones
      what: Counts a tens rod as one (3 rods and 4 cubes as 7)
      addressed: Learn shows that a rod is ten cubes stuck together; feedback on the answer 7 says so
    - id: wild-guess
      what: Estimates without looking (says 100 for 30 things)
      addressed: lesson 2 estimates by first seeing one bundle of ten, then checks by counting the tens
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner und Einer, en: Tens and ones }
    goal:
      de: "Bündle Dinge zu Zehnern und zähl Zehner und Einer, so wie 3 Zehner und 4 Einer sind 34."
      en: "Bundle things into tens and count tens and ones, like 3 tens and 4 ones make 34."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Zähl in Zehnerschritten: 10, 20, 30, _"
            say: "Zähl in Zehnerschritten: zehn, zwanzig, dreißig. Was kommt dann?"
            options: ["31", "40", "50"]
            answer: "40"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele sind es?"
            say: "Ein voller Zehner und noch drei. Wie viele sind es?"
            show: { drawn: base-ten, tens: 1, ones: 3 }
            options: ["4", "13", "31"]
            answer: "13"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Wie viele Würfel stecken in einer Stange?"
            say: "Kleine Würfel kann man zu einer Stange zusammenstecken. Was glaubst du: Wie viele Würfel stecken in dieser Stange?"
            show: { drawn: base-ten, tens: 1, ones: 0 }
          - text: "10, 20, 30"
            say: "Es sind zehn Einerwürfel. Darum heißt sie Zehnerstange. Drei Zehnerstangen zählen wir in Zehnern: zehn, zwanzig, dreißig."
            show: { drawn: base-ten, tens: 3, ones: 0 }
          - text: "3 Zehner und 4 Einer sind 34"
            say: "Drei Zehner und vier Einer. Erst die Zehner: zehn, zwanzig, dreißig. Dann die Einer: einunddreißig, zweiunddreißig, dreiunddreißig, vierunddreißig. Es sind vierunddreißig."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "Wusstest du? Du hast 10 Finger und 10 Zehen. Das sind 2 Zehner, also 20."
            say: "Wusstest du? Du hast zehn Finger und zehn Zehen. Das sind zwei Zehner, also zwanzig. Deine Hände sind ein Zehner, den du immer dabei hast."
            show: { object: hand, count: 2 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 2, ones: 5 }
                options: ["7", "25", "52"]
                answer: "25"
                feedback:
                  "7": "Eine Stange ist zehn, nicht eins. Zähl die Stangen in Zehnern."
                  "52": "Erst die Zehner: zwei Zehner sind zwanzig. Dann fünf Einer."
                hints:
                  - "Zähl zuerst die Zehner: zehn, zwanzig."
                  - "Dann zählst du die Einer dazu."
                  - "2 Zehner und 5 Einer sind 25."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Wie viele Zehner, wie viele Einer?"
                show: { drawn: base-ten, tens: 4, ones: 2 }
                frame: "_ Zehner und _ Einer"
                options: ["2", "4", "6", "42"]
                answer: ["4", "2"]
                hints:
                  - "Zähl die Stangen. Das sind die Zehner."
                  - "Zähl die Würfel. Das sind die Einer."
                  - "4 Zehner und 2 Einer."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welches Bild zeigt 36?"
                options:
                  - { drawn: base-ten, tens: 6, ones: 3 }
                  - { drawn: base-ten, tens: 3, ones: 6 }
                  - { drawn: base-ten, tens: 3, ones: 3 }
                answer: "36"
                hints:
                  - "Bei 36 steht die 3 für die Zehner."
                  - "Such das Bild mit 3 Stangen."
                  - "3 Stangen und 6 Würfel sind 36."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 5 Zehner und 1 Einer sind 51."
                say: "Fünf Zehner und ein Einer. Sind das einundfünfzig?"
                show: { drawn: base-ten, tens: 5, ones: 1 }
                answer: true
                hints:
                  - "Zähl die Zehner: zehn, zwanzig, ..."
                  - "Fünf Zehner sind fünfzig. Und ein Einer dazu."
                  - "Ja, das sind 51."
              - id: l1-f5
                type: multiple_choice
                text: "Wie viele sind es?"
                say: "Zehn Einer werden zu einer Stange gebündelt. Wie viele sind es dann?"
                show: { drawn: base-ten, tens: 1, ones: 7 }
                options: ["8", "17", "71"]
                answer: "17"
                hints:
                  - "Eine Stange ist zehn."
                  - "Zehn und noch sieben."
                  - "Es sind 17."
              - id: l1-f6
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 6, ones: 0 }
                options: ["6", "16", "60"]
                answer: "60"
                hints:
                  - "Es gibt nur Stangen, keine Einer."
                  - "Zähl in Zehnern: zehn, zwanzig, dreißig, ..."
                  - "Sechs Zehner sind 60."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 3, ones: 8 }
                options: ["38", "83", "11"]
                answer: "38"
                hints: ["Erst die Zehner, dann die Einer."]
              - id: l1-s2
                type: fill_in_blank
                text: "Wie viele Zehner, wie viele Einer?"
                show: { drawn: base-ten, tens: 7, ones: 3 }
                frame: "_ Zehner und _ Einer"
                options: ["3", "7", "10", "73"]
                answer: ["7", "3"]
                hints: ["Stangen sind Zehner, Würfel sind Einer."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welches Bild zeigt 52?"
                options:
                  - { drawn: base-ten, tens: 2, ones: 5 }
                  - { drawn: base-ten, tens: 5, ones: 2 }
                  - { drawn: base-ten, tens: 5, ones: 5 }
                answer: "52"
                hints: ["Bei 52 steht die 5 für die Zehner."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 4 Zehner und 6 Einer sind 64."
                say: "Vier Zehner und sechs Einer. Sind das vierundsechzig?"
                show: { drawn: base-ten, tens: 4, ones: 6 }
                answer: false
                hints: ["Vier Zehner sind vierzig."]
              - id: l1-s5
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 8, ones: 4 }
                options: ["84", "48", "12"]
                answer: "84"
                hints: ["Zähl die Stangen in Zehnern."]
              - id: l1-s6
                type: multiple_choice
                text: "Oma hat 90 Eier. In jeden Karton passen 10 Eier. Wie viele volle Kartons sind es?"
                say: "Oma hat neunzig Eier. In jeden Karton passen zehn Eier. Wie viele volle Kartons sind es?"
                show: { object: egg, count: 10, layout: row }
                options: ["9", "90", "10"]
                answer: "9"
                feedback:
                  "90": "Dann läge in jedem Karton nur ein Ei! In einen Karton passen zehn."
                  "10": "Zehn Kartons wären hundert Eier. Zähl in Zehnern bis neunzig."
                hints: ["Zehn, zwanzig, ... bis neunzig. Wie oft hast du gezählt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 2, ones: 9 }
                options: ["29", "92", "11"]
                answer: "29"
              - id: l1-n2
                type: fill_in_blank
                text: "Wie viele Zehner, wie viele Einer?"
                show: { drawn: base-ten, tens: 6, ones: 5 }
                frame: "_ Zehner und _ Einer"
                options: ["5", "6", "11", "65"]
                answer: ["6", "5"]
              - id: l1-n3
                type: image_multiple_choice
                text: "Welches Bild zeigt 47?"
                options:
                  - { drawn: base-ten, tens: 7, ones: 4 }
                  - { drawn: base-ten, tens: 4, ones: 7 }
                  - { drawn: base-ten, tens: 4, ones: 4 }
                answer: "47"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 9 Zehner und 9 Einer sind 99."
                say: "Neun Zehner und neun Einer. Sind das neunundneunzig?"
                show: { drawn: base-ten, tens: 9, ones: 9 }
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 0, ones: 8 }
                options: ["8", "80", "18"]
                answer: "8"
                difficulty: easy

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 5, ones: 3 }
            options: ["35", "53", "8"]
            answer: "53"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welches Bild zeigt 61?"
            options:
              - { drawn: base-ten, tens: 1, ones: 6 }
              - { drawn: base-ten, tens: 6, ones: 1 }
              - { drawn: base-ten, tens: 6, ones: 6 }
            answer: "61"
          - id: l1-c3
            type: fill_in_blank
            text: "Wie viele Zehner, wie viele Einer?"
            show: { drawn: base-ten, tens: 5, ones: 0 }
            frame: "_ Zehner und _ Einer"
            options: ["0", "5", "50"]
            answer: ["5", "0"]
          - id: l1-c4
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 4, ones: 8 }
            options: ["48", "84", "12"]
            answer: "48"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 6 Zehner und 3 Einer sind 36."
            say: "Sechs Zehner und drei Einer. Sind das sechsunddreißig?"
            show: { drawn: base-ten, tens: 6, ones: 3 }
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Welches Bild zeigt 25?"
            options:
              - { drawn: base-ten, tens: 5, ones: 2 }
              - { drawn: base-ten, tens: 2, ones: 5 }
              - { drawn: base-ten, tens: 2, ones: 2 }
            answer: "25"

  - n: 2
    title: { de: Schätzen und prüfen, en: Estimate and check }
    goal:
      de: "Schätze, wie viele Punkte es ungefähr sind, und prüf deine Schätzung mit den Zehnern."
      en: "Guess about how many dots there are, then check your guess with the tens."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 4, ones: 5 }
            options: ["45", "54", "9"]
            answer: "45"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Welches Bild zeigt 28?"
            options:
              - { drawn: base-ten, tens: 2, ones: 8 }
              - { drawn: base-ten, tens: 8, ones: 2 }
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie viele Punkte sind das?"
            say: "Schau kurz hin. Zum Zählen ist keine Zeit. Was glaubst du: Wie viele Punkte sind das?"
            show: { drawn: hundred-field, filled: 40, flash: 2 }
          - text: "Schätzen"
            say: "Hast du ungefähr vierzig gesagt? Ungefähr sagen, wie viele es sind, heißt schätzen. Zählen dauert lange, schätzen geht schnell. Ich schätze: etwa vierzig."
            show: { drawn: hundred-field, filled: 40, flash: 2 }
          - text: "10"
            say: "Ein Trick: Schau dir an, wie viel zehn sind. Eine Reihe im Hunderterfeld ist zehn."
            show: { drawn: hundred-field, filled: 10 }
          - text: "40"
            say: "Jetzt siehst du: Es sind vier volle Reihen, also vier Zehner. Das sind vierzig. Meine Schätzung war gut. Mit den Zehnern kannst du jede Schätzung prüfen."
            show: { drawn: hundred-field, filled: 40 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Schätze: Wie viele sind es ungefähr?"
                say: "Schau kurz hin und schätze. Wie viele Punkte sind es ungefähr?"
                show: { drawn: hundred-field, filled: 30, flash: 2 }
                options: ["etwa 10", "etwa 30", "etwa 90"]
                answer: "etwa 30"
                hints:
                  - "Eine volle Reihe ist zehn."
                  - "Es waren drei volle Reihen."
                  - "Etwa 30."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Prüfe: Wie viele sind es genau?"
                show: { drawn: hundred-field, filled: 30 }
                options: ["3", "30", "300"]
                answer: "30"
                hints:
                  - "Zähl die vollen Reihen."
                  - "Drei Reihen sind drei Zehner."
                  - "Drei Zehner sind 30."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: hundred-field, filled: 56 }
                options: ["56", "65", "50"]
                answer: "56"
                hints:
                  - "Zähl zuerst die vollen Reihen."
                  - "Fünf volle Reihen sind fünfzig. In der nächsten Reihe sind sechs."
                  - "50 und 6 sind 56."
              - id: l2-f4
                type: true_false
                text: "Tom schätzt: etwa 70. Ist die Schätzung gut?"
                say: "Tom schätzt: etwa siebzig. Schau, wie viele es sind. Ist das eine gute Schätzung?"
                show: { drawn: hundred-field, filled: 68 }
                answer: true
                hints:
                  - "Zähl die vollen Reihen."
                  - "Sechs volle Reihen und noch acht: 68."
                  - "68 ist nah an 70. Ja, gut geschätzt."
              - id: l2-f5
                type: multiple_choice
                text: "Schätze: Wie viele sind es ungefähr?"
                say: "Schau kurz hin und schätze. Wie viele Punkte sind es ungefähr?"
                show: { drawn: hundred-field, filled: 90, flash: 2 }
                options: ["etwa 20", "etwa 50", "etwa 90"]
                answer: "etwa 90"
                hints:
                  - "War das Feld fast voll oder fast leer?"
                  - "Fast voll heißt: fast hundert."
                  - "Etwa 90."
              - id: l2-f6
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: hundred-field, filled: 23 }
                options: ["23", "32", "20"]
                answer: "23"
                hints:
                  - "Wie viele volle Reihen?"
                  - "Zwei volle Reihen und noch drei."
                  - "20 und 3 sind 23."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Schätze: Wie viele sind es ungefähr?"
                say: "Schau kurz hin und schätze. Wie viele Punkte sind es ungefähr?"
                show: { drawn: hundred-field, filled: 50, flash: 2 }
                options: ["etwa 15", "etwa 50", "etwa 95"]
                answer: "etwa 50"
                hints: ["Es war ungefähr die Hälfte."]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: hundred-field, filled: 74 }
                options: ["74", "47", "70"]
                answer: "74"
                hints: ["Erst die vollen Reihen, dann die Punkte in der letzten Reihe."]
              - id: l2-s3
                type: true_false
                text: "Lea schätzt: etwa 20. Ist die Schätzung gut?"
                say: "Lea schätzt: etwa zwanzig. Schau, wie viele es sind. Ist das eine gute Schätzung?"
                show: { drawn: hundred-field, filled: 81 }
                answer: false
                hints: ["Wie viele volle Reihen sind es?"]
              - id: l2-s4
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: hundred-field, filled: 40 }
                options: ["4", "40", "14"]
                answer: "40"
                hints: ["Nur volle Reihen."]
              - id: l2-s5
                type: multiple_choice
                text: "Schätze: Wie viele sind es ungefähr?"
                say: "Schau kurz hin und schätze. Wie viele Punkte sind es ungefähr?"
                show: { drawn: hundred-field, filled: 12, flash: 2 }
                options: ["etwa 10", "etwa 40", "etwa 80"]
                answer: "etwa 10"
                hints: ["War es ungefähr eine Reihe oder viele Reihen?"]
              - id: l2-s6
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 7, ones: 7 }
                options: ["77", "14", "70"]
                answer: "77"
                hints: ["Zähl die Stangen in Zehnern."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Schätze: Wie viele sind es ungefähr?"
                say: "Schau kurz hin und schätze. Wie viele Punkte sind es ungefähr?"
                show: { drawn: hundred-field, filled: 70, flash: 1.5 }
                options: ["etwa 30", "etwa 70", "etwa 100"]
                answer: "etwa 70"
              - id: l2-n2
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: hundred-field, filled: 35 }
                options: ["35", "53", "30"]
                answer: "35"
              - id: l2-n3
                type: true_false
                text: "Ben schätzt: etwa 60. Ist die Schätzung gut?"
                say: "Ben schätzt: etwa sechzig. Schau, wie viele es sind. Ist das eine gute Schätzung?"
                show: { drawn: hundred-field, filled: 58 }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Im Kino gibt es 100 Plätze. Jeder Punkt ist ein Kind. Wie viele Kinder sitzen im Kino?"
                say: "Im Kino gibt es hundert Plätze. Jeder Punkt ist ein Kind. Wie viele Kinder sitzen im Kino?"
                show: { drawn: hundred-field, filled: 99 }
                options: ["90", "99", "100"]
                answer: "99"
              - id: l2-n5
                type: multiple_choice
                text: "Wie viele sind es?"
                show: { drawn: base-ten, tens: 9, ones: 0 }
                options: ["9", "90", "19"]
                answer: "90"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: base-ten, tens: 3, ones: 7 }
            options: ["37", "73", "10"]
            answer: "37"
          - id: l2-c2
            part: bundle
            type: fill_in_blank
            text: "Wie viele Zehner, wie viele Einer?"
            show: { drawn: base-ten, tens: 8, ones: 1 }
            frame: "_ Zehner und _ Einer"
            options: ["1", "8", "9", "81"]
            answer: ["8", "1"]
          - id: l2-c3
            part: count
            type: multiple_choice
            text: "Wie viele sind es?"
            show: { drawn: hundred-field, filled: 62 }
            options: ["62", "26", "60"]
            answer: "62"
          - id: l2-c4
            part: bundle
            type: image_multiple_choice
            text: "Welches Bild zeigt 44?"
            options:
              - { drawn: base-ten, tens: 4, ones: 0 }
              - { drawn: base-ten, tens: 0, ones: 4 }
