# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.hundred-field
skill: math.numbers-to-100.hundred-field
curriculum: de-DE
language: de
title:
  de: Das Hunderterfeld
  en: The hundred field
summary: >
  The Hunderterfeld is ten rows of ten dots with gaps after five each way,
  so amounts can be read without counting each dot. Lesson 1 reads full
  rows and the rest of a row using the five-gap; lesson 2 reads amounts at
  a glance, finds how many are missing to 100, and ends with the skill
  check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.place-value]
  also_practises: [math.numbers-to-100.bundle-tens]
  vocabulary: { de: [Hunderterfeld, Reihe, Zehnerreihe, Hälfte, fehlen] }
  forms: [drawn, text, audio]
  drawn: [hundred-field, base-ten]
  facets: []
  parts:
    - { id: read, what: { de: Anzahlen am Hunderterfeld ablesen, en: reading an amount on the hundred field } }
    - { id: show, what: { de: das Hunderterfeld zu einer Zahl finden, en: finding the hundred field that shows a number } }
    - { id: glance, what: { de: Anzahlen auf einen Blick erkennen, en: reading amounts at a glance } }
    - { id: missing, what: { de: "ablesen, wie viele bis 100 fehlen", en: reading how many are missing to 100 } }
  misconceptions:
    - id: dot-by-dot
      what: Counts every dot one by one and loses count
      addressed: Learn reads whole rows as tens and uses the five-gap; flash tasks make counting one by one impossible
    - id: half-is-fifty
      what: Does not see that five rows (above the middle gap) are 50
      addressed: lesson 1 learn shows the middle gap as the half; tasks around 50 use it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

