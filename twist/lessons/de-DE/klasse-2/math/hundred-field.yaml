            say: "Das ist das Hunderterfeld. Es hat zehn Reihen mit je zehn Punkten. Das sind hundert Punkte."
            show: { drawn: hundred-field, filled: 100 }
          - text: "50"
            say: "In der Mitte ist eine Lücke. Über der Lücke sind fünf Reihen. Fünf Reihen sind fünfzig, die Hälfte von hundert."
            show: { drawn: hundred-field, filled: 50 }
          - text: "37"
            say: "Drei volle Reihen sind dreißig. In der nächsten Reihe: fünf bis zur Lücke, dann noch zwei. Das sind sieben. Dreißig und sieben sind siebenunddreißig."
            show: { drawn: hundred-field, filled: 37 }

