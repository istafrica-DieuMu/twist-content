                say: "Achtundvierzig. Wie viele Zehner, wie viele Einer hat die Zahl?"
                frame: "_ Zehner und _ Einer"
                options: ["4", "8", "12", "48"]
                answer: ["4", "8"]
                option_audio: false
                hints:
                  - "Vierzig sind die Zehner."
                  - "Acht sind die Einer."
                  - "4 Zehner und 8 Einer."
