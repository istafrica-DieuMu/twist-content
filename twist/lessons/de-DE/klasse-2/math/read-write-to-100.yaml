                hints:
                  - "Hör auf das Ende: dreißig."
                  - "Dreißig sind drei Zehner. Schreib die 3 zuerst."
                  - "Sechsunddreißig ist 36."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Hör zu und schreib die Zahl."
