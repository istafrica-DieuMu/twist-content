# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.read-write-to-100
skill: math.numbers-to-100.read-write
curriculum: de-DE
language: de
title:
  de: Zahlen lesen und schreiben
  en: Reading and writing numbers
summary: >
  The German number word says the ones first (vierundzwanzig), the digits
  write the tens first (24). Lesson 1 hears numbers and writes them,
  tens first; lesson 2 reads number words and digits and finds the
  swapped number, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Zahlwort, Ziffer, Zehner, Einer, vertauscht] }
  forms: [text, audio, drawn]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: hear, what: { de: eine gehörte Zahl mit Ziffern schreiben, en: writing a number you hear in digits } }
    - { id: read, what: { de: ein Zahlwort lesen und als Zahl schreiben, en: reading a number word and writing the number } }
    - { id: word, what: { de: zu einer Zahl das passende Zahlwort finden, en: finding the number word for a number } }
  misconceptions:
    - id: word-order-digits
      what: Writes the digits in the order they are heard (vierundzwanzig as 42)
      addressed: Learn and the full-stage hints say "Hör auf die Zehner, schreib sie zuerst"; the swapped number is always a wrong option, with feedback
    - id: teen-words
      what: Mixes up the teen words and the tens (sechzehn and sechzig)
      addressed: lesson 2 sets sechzehn and sechzig, siebzehn and siebzig side by side
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
