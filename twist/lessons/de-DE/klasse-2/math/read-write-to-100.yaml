    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Zahl steht in der Stellentafel?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [4, 2] }
            options: ["42", "24", "6"]
            answer: "42"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "10, 20, 30, 40, _"
            say: "Zähl weiter: zehn, zwanzig, dreißig, vierzig. Was kommt dann?"
            options: ["41", "50", "60"]
            answer: "50"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "vierundzwanzig"
            say: "Hör gut zu: vierundzwanzig. Wir sagen zuerst die Vier, dann die Zwanzig."
          - text: "24"
            say: "Aber wir schreiben zuerst die Zehner. Zwanzig sind zwei Zehner, also schreiben wir die Zwei links. Dann die Vier. Vierundzwanzig schreibt man mit den Ziffern zwei und vier."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [2, 4] }
          - text: "Zehner zuerst"
            say: "Ein Trick: Hör auf das Ende des Zahlworts. Bei vierundzwanzig ist das zwanzig. Schreib diese Zehner zuerst, dann die Einer."

      - activity: practise
