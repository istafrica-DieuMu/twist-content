# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.length-cm-m
skill: math.length.cm-m
curriculum: de-DE
language: de
title:
  de: Zentimeter und Meter
  en: Centimetres and metres
summary: >
  Lesson 1 reads lengths on the ruler in cm, first from 0 and then from a
  strip that starts further along (von 2 bis 9 sind es 7 cm); lesson 2
  learns 1 m = 100 cm, changes between m and cm (2 m = 200 cm, 1 m 40 cm =
  140 cm) and picks cm or m for a thing, and ends with the skill check.
  Drawing a line of a given length waits for a drawing task.
metadata:
  year: klasse-2
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.length.non-standard, math.numbers-to-100.number-line]
  also_practises: [math.length.non-standard]
  vocabulary: { de: [Lineal, Zentimeter, cm, Meter, m, messen, Strecke] }
  forms: [text, audio, drawn]
  drawn: [ruler]
  facets: [units]
  parts:
    - { id: measure, what: { de: Längen am Lineal in cm ablesen, en: reading lengths in cm on a ruler } }
    - { id: off-zero, what: { de: "messen, wenn der Streifen nicht bei 0 anfängt", en: measuring a strip that does not start at 0 } }
    - { id: convert, what: { de: Meter und Zentimeter umrechnen, en: changing between metres and centimetres } }
    - { id: unit, what: { de: cm oder m passend wählen, en: choosing cm or m } }
  misconceptions:
    - id: reads-end-not-length
      what: Reads the number at the end of the strip when it does not start at 0 (strip from 2 to 9 read as 9 cm)
      addressed: lesson 1 Learn measures a strip from 2 to 9; every stage of lesson 1 has a strip off zero offering the end number, with feedback in l1-f3
    - id: m-cm-mixed
      what: Reads 1 m 40 cm as 14 cm or 1040 cm, or thinks 1 m = 10 cm
      addressed: lesson 2 Learn builds 140 cm from 100 cm and 40 cm; l2-f3, l2-s3 and l2-c3 offer the joined digits (12 cm, 16 cm, 15 cm) and 1 m as 1000 cm, l2-n3 offers 18 cm and 180 cm, with feedback in l2-f3; l2-s5 says 1 m = 10 cm
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit dem Lineal messen", en: "Measuring with a ruler" }
    goal:
      de: "Miss mit dem Lineal in Zentimetern und leg es immer genau mit der Null an."
      en: "Measure in centimetres with a ruler, and always start exactly at zero."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "9 − 2 = _"
            say: "Neun minus zwei."
            answer: "7"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Warum messen wir in Zentimetern?"
            say: "Warum messen wir in Zentimetern und nicht mit der Hand?"
            options: ["Ein Zentimeter ist für alle gleich lang.", "Hände kann man nicht zählen."]
            answer: "Ein Zentimeter ist für alle gleich lang."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Der Streifen ist 6 cm lang."
            say: "Das ist ein Lineal. Die Zahlen sind Zentimeter. Der Streifen fängt genau bei null an und hört bei sechs auf. Er ist sechs Zentimeter lang. Kurz schreibst du Zentimeter mit den Buchstaben c und m."
            show: { drawn: ruler, to: 10, length: 6 }
          - text: "Von 2 bis 9: 9 − 2 = 7 cm"
            say: "Dieser Streifen fängt nicht bei null an, sondern bei zwei. Er hört bei neun auf. Zähl die Zentimeter von zwei bis neun: sieben. Er ist sieben Zentimeter lang, nicht neun."
            show: { drawn: ruler, to: 10, start: 2, length: 7 }
          - text: "Leg das Lineal mit der 0 an!"
            say: "Darum legst du das Lineal immer mit der Null genau an den Anfang. Dann zeigt das Ende gleich die Länge."
            show: { drawn: ruler, to: 10, length: 4, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, length: 8 }
                options: ["8 cm", "9 cm", "7 cm"]
                answer: "8 cm"
                hints:
                  - "Schau, wo der Streifen aufhört."
                  - "Er fängt bei 0 an und hört bei 8 auf."
                  - "8 cm."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 15, length: 12, colour: blue }
                options: ["12 cm", "13 cm", "15 cm"]
                answer: "12 cm"
                hints:
                  - "Schau auf das Ende."
                  - "Das Ende ist 2 cm hinter der 10."
                  - "12 cm."
              - id: l1-f3
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, start: 3, length: 5 }
                options: ["5 cm", "8 cm", "3 cm"]
                answer: "5 cm"
                feedback:
                  "8 cm": "8 ist das Ende. Der Streifen fängt aber bei 3 an. Zähl von 3 bis 8."
                  "3 cm": "3 ist der Anfang. Zähl von 3 bis zum Ende."
                hints:
                  - "Wo fängt er an, wo hört er auf?"
                  - "Von 3 bis 8: 8 − 3."
                  - "5 cm."
              - id: l1-f4
                type: true_false
                text: "Der Streifen ist 4 cm lang."
                say: "Der Streifen fängt bei eins an. Stimmt das: Er ist vier Zentimeter lang?"
                show: { drawn: ruler, to: 10, start: 1, length: 4, colour: green }
                answer: true
                hints:
                  - "Er fängt bei 1 an."
                  - "Er hört bei 5 auf. 5 − 1 = 4."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: multiple_choice
                text: "Wo legst du das Lineal an?"
                say: "Du willst einen Stift messen. Welche Zahl vom Lineal legst du an den Anfang des Stifts?"
                options: ["bei der 0", "bei der 1", "irgendwo"]
                answer: "bei der 0"
                hints:
                  - "Dann zeigt das Ende gleich die Länge."
                  - "Die erste Zahl am Lineal."
                  - "bei der 0."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, length: 3, colour: green }
                options: ["3 cm", "4 cm", "2 cm"]
                answer: "3 cm"
                hints: ["Schau auf das Ende."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 15, length: 14 }
                options: ["14 cm", "15 cm", "4 cm"]
                answer: "14 cm"
                hints: ["Er hört kurz vor der 15 auf."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, start: 4, length: 6, colour: blue }
                options: ["6 cm", "10 cm", "4 cm"]
                answer: "6 cm"
                hints: ["Zähl von 4 bis zum Ende."]
              - id: l1-s4
                type: true_false
                text: "Der Streifen ist 9 cm lang."
                say: "Der Streifen fängt bei zwei an und hört bei neun auf. Stimmt das: Er ist neun Zentimeter lang?"
                show: { drawn: ruler, to: 10, start: 2, length: 7 }
                answer: false
                hints: ["Von 2 bis 9 sind es nicht 9 cm."]
              - id: l1-s5
                type: multiple_choice
                text: "Der rote Streifen ist 7 cm lang, der blaue 11 cm. Welcher ist länger?"
                say: "Ein roter Streifen ist sieben Zentimeter lang, ein blauer elf Zentimeter. Welcher ist länger?"
                options: ["der blaue mit 11 cm", "der rote mit 7 cm", "beide gleich lang"]
                answer: "der blaue mit 11 cm"
                hints: ["Mehr Zentimeter heißt länger."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 15, length: 10, colour: green }
                options: ["10 cm", "11 cm", "9 cm"]
                answer: "10 cm"
              - id: l1-n2
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Der Streifen fängt bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 10, length: 5, colour: blue }
                options: ["5 cm", "6 cm", "10 cm"]
                answer: "5 cm"
              - id: l1-n3
                type: multiple_choice
                text: "Wie lang ist der Streifen?"
                say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
                show: { drawn: ruler, to: 15, start: 5, length: 8 }
                options: ["8 cm", "13 cm", "5 cm"]
                answer: "8 cm"
              - id: l1-n4
                type: true_false
                text: "Der Streifen ist 6 cm lang."
                say: "Der Streifen fängt bei drei an. Stimmt das: Er ist sechs Zentimeter lang?"
                show: { drawn: ruler, to: 10, start: 3, length: 6, colour: green }
                answer: true
              - id: l1-n5
                type: text_input
                text: "Ein Streifen fängt bei 6 cm an und hört bei 14 cm auf. Wie viele cm ist er lang?"
                say: "Ein Streifen fängt am Lineal bei sechs an und hört bei vierzehn auf. Wie viele Zentimeter ist er lang?"
                answer: "8"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, length: 9, colour: blue }
            options: ["9 cm", "10 cm", "8 cm"]
            answer: "9 cm"
          - id: l1-c2
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, start: 1, length: 7 }
            options: ["7 cm", "8 cm", "1 cm"]
            answer: "7 cm"
          - id: l1-c3
            type: true_false
            text: "Beim Messen legst du die 0 vom Lineal an den Anfang."
            say: "Stimmt das? Beim Messen legst du die Null vom Lineal genau an den Anfang."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 15, length: 4, colour: green }
            options: ["4 cm", "5 cm", "3 cm"]
            answer: "4 cm"
          - id: l1-c5
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 15, start: 7, length: 6 }
            options: ["6 cm", "13 cm", "7 cm"]
            answer: "6 cm"
          - id: l1-c6
            type: true_false
            text: "Der Streifen ist 9 cm lang."
            say: "Der Streifen fängt bei eins an. Stimmt das: Er ist neun Zentimeter lang?"
            show: { drawn: ruler, to: 10, start: 1, length: 8, colour: blue }
            answer: false

  - n: 2
    title: { de: "1 Meter hat 100 Zentimeter", en: "A metre is 100 centimetres" }
    goal:
      de: "Wechsle zwischen Meter und Zentimeter, so wie ein Meter 40 sind 140 Zentimeter."
      en: "Change between metres and centimetres, like 1 metre 40 is 140 centimetres."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 15, length: 11, colour: green }
            options: ["11 cm", "12 cm", "10 cm"]
            answer: "11 cm"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "100 + 40 = _"
            say: "Hundert plus vierzig."
            answer: "140"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 m = 100 cm"
            say: "Für lange Dinge gibt es den Meter. Ein Meter hat hundert Zentimeter. Ein großer Schritt von einem Erwachsenen ist ungefähr ein Meter."
          - text: "2 m = 200 cm, 3 m = 300 cm"
            say: "Zwei Meter sind zweihundert Zentimeter, drei Meter dreihundert Zentimeter."
          - text: "1 m 40 cm = 100 cm + 40 cm = 140 cm"
            say: "Lena ist ein Meter vierzig groß. Ein Meter sind hundert Zentimeter. Dazu kommen vierzig Zentimeter. Zusammen sind das hundertvierzig Zentimeter."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "1 m = _ cm"
                say: "Ein Meter sind wie viele Zentimeter?"
                options: ["100", "10", "1000"]
                answer: "100"
                hints:
                  - "Ein Meter ist viel länger als ein Zentimeter."
                  - "Er hat hundert Zentimeter."
                  - "100."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "3 m = _ cm"
                say: "Drei Meter sind wie viele Zentimeter?"
                answer: "300"
                hints:
                  - "Ein Meter hat 100 cm."
                  - "Dreimal 100 cm."
                  - "300."
              - id: l2-f3
                type: multiple_choice
                text: "1 m 20 cm = _ cm"
                say: "Ein Meter und zwanzig Zentimeter sind wie viele Zentimeter?"
                options: ["120 cm", "12 cm", "1020 cm"]
                answer: "120 cm"
                feedback:
                  "12 cm": "Ein Meter allein hat schon 100 cm. Dazu kommen 20 cm."
                  "1020 cm": "Ein Meter hat 100 cm, nicht 1000 cm."
                hints:
                  - "Ein Meter sind 100 cm."
                  - "100 cm + 20 cm."
                  - "120 cm."
              - id: l2-f4
                type: multiple_choice
                text: "Was misst du in Metern?"
                say: "Was misst du besser in Metern als in Zentimetern?"
                options: ["wie lang ein Schwimmbecken ist", "wie lang ein Radiergummi ist", "wie lang ein Stift ist"]
                answer: "wie lang ein Schwimmbecken ist"
                hints:
                  - "Meter nimmst du für lange Dinge."
                  - "Ein Schwimmbecken ist sehr lang."
                  - "wie lang ein Schwimmbecken ist."
              - id: l2-f5
                type: true_false
                text: "200 cm = 2 m"
                say: "Stimmt das? Zweihundert Zentimeter sind zwei Meter."
                answer: true
                hints:
                  - "100 cm sind 1 m."
                  - "Zweimal 100 cm sind 2 m."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: text_input
                text: "5 m = _ cm"
                say: "Fünf Meter sind wie viele Zentimeter?"
                answer: "500"
                hints: ["Jeder Meter hat 100 cm."]
              - id: l2-s2
                type: multiple_choice
                text: "100 cm = _"
                say: "Hundert Zentimeter sind wie viele Meter?"
                options: ["1 m", "10 m", "100 m"]
                answer: "1 m"
                hints: ["Ein Meter hat 100 cm."]
              - id: l2-s3
                type: multiple_choice
                text: "1 m 60 cm = _ cm"
                say: "Ein Meter und sechzig Zentimeter sind wie viele Zentimeter?"
                options: ["160 cm", "16 cm", "1060 cm"]
                answer: "160 cm"
                hints: ["100 cm und 60 cm."]
              - id: l2-s4
                type: multiple_choice
                text: "Was misst du in Zentimetern?"
                say: "Was misst du besser in Zentimetern als in Metern?"
                options: ["wie lang ein Heft ist", "wie lang eine Straße ist", "wie lang ein Zug ist"]
                answer: "wie lang ein Heft ist"
                hints: ["Zentimeter nimmst du für kurze Dinge."]
              - id: l2-s5
                type: true_false
                text: "1 m = 10 cm"
                say: "Stimmt das? Ein Meter sind zehn Zentimeter."
                answer: false
                hints: ["Ein Meter hat viel mehr Zentimeter."]

          - support: none
            tasks:
              - id: l2-n1
                type: text_input
                text: "4 m = _ cm"
                say: "Vier Meter sind wie viele Zentimeter?"
                answer: "400"
              - id: l2-n2
                type: multiple_choice
                text: "300 cm = _"
                say: "Dreihundert Zentimeter sind wie viele Meter?"
                options: ["3 m", "30 m", "300 m"]
                answer: "3 m"
              - id: l2-n3
                type: multiple_choice
                text: "1 m 8 cm = _ cm"
                say: "Ein Meter und acht Zentimeter sind wie viele Zentimeter?"
                options: ["108 cm", "18 cm", "180 cm"]
                answer: "108 cm"
              - id: l2-n4
                type: multiple_choice
                text: "Was misst du in Metern?"
                say: "Was misst du besser in Metern als in Zentimetern?"
                options: ["wie hoch ein Haus ist", "wie lang ein Löffel ist", "wie breit ein Buch ist"]
                answer: "wie hoch ein Haus ist"
              - id: l2-n5
                type: text_input
                text: "Tim ist 1 m 32 cm groß. Wie viele cm sind das?"
                say: "Tim ist ein Meter zweiunddreißig groß. Wie viele Zentimeter sind das?"
                answer: "132"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: off-zero
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 15, start: 6, length: 7, colour: blue }
            options: ["7 cm", "13 cm", "6 cm"]
            answer: "7 cm"
          - id: l2-c2
            part: convert
            type: text_input
            text: "2 m = _ cm"
            say: "Zwei Meter sind wie viele Zentimeter?"
            answer: "200"
          - id: l2-c3
            part: convert
            type: multiple_choice
            text: "1 m 50 cm = _ cm"
            say: "Ein Meter und fünfzig Zentimeter sind wie viele Zentimeter?"
            options: ["150 cm", "15 cm", "1050 cm"]
            answer: "150 cm"
          - id: l2-c4
            part: unit
            type: multiple_choice
            text: "Was misst du in Zentimetern?"
            say: "Was misst du besser in Zentimetern als in Metern?"
            options: ["wie lang ein Daumen ist", "wie lang ein Fußballfeld ist", "wie hoch ein Baum ist"]
            answer: "wie lang ein Daumen ist"
          - id: l2-c5
            part: off-zero
            type: true_false
            text: "Ein Streifen von 4 cm bis 10 cm ist 10 cm lang."
            say: "Stimmt das? Ein Streifen, der am Lineal bei vier anfängt und bei zehn aufhört, ist zehn Zentimeter lang."
            answer: false
          - id: l2-c6
            part: measure
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, length: 7, colour: green }
            options: ["7 cm", "8 cm", "6 cm"]
            answer: "7 cm"
          - id: l2-c7
            part: measure
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Der Streifen fängt bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 15, length: 13 }
            options: ["13 cm", "14 cm", "15 cm"]
            answer: "13 cm"
          - id: l2-c8
            part: measure
            type: true_false
            text: "Der Streifen ist 2 cm lang."
            say: "Der Streifen fängt bei null an. Stimmt das: Er ist zwei Zentimeter lang?"
            show: { drawn: ruler, to: 10, length: 2, colour: blue }
            answer: true
          - id: l2-c9
            part: measure
            type: text_input
            text: "Wie viele cm ist der Streifen lang?"
            say: "Der Streifen fängt bei null an. Wie viele Zentimeter ist er lang?"
            show: { drawn: ruler, to: 15, length: 9, colour: blue }
            answer: "9"
          - id: l2-c10
            part: measure
            type: true_false
            text: "Der Streifen ist 12 cm lang."
            say: "Der Streifen fängt bei null an. Stimmt das: Er ist zwölf Zentimeter lang?"
            show: { drawn: ruler, to: 15, length: 11 }
            answer: false
          - id: l2-c11
            part: off-zero
            type: multiple_choice
            text: "Wie lang ist der Streifen?"
            say: "Dieser Streifen fängt nicht bei null an. Wie lang ist er?"
            show: { drawn: ruler, to: 10, start: 2, length: 6 }
            options: ["6 cm", "8 cm", "2 cm"]
            answer: "6 cm"
          - id: l2-c12
            part: off-zero
            type: true_false
            text: "Der Streifen ist 5 cm lang."
            say: "Der Streifen fängt bei vier an. Stimmt das: Er ist fünf Zentimeter lang?"
            show: { drawn: ruler, to: 15, start: 4, length: 5, colour: green }
            answer: true
          - id: l2-c13
            part: off-zero
            type: text_input
            text: "Ein Streifen fängt bei 3 cm an und hört bei 12 cm auf. Wie viele cm ist er lang?"
            say: "Ein Streifen fängt am Lineal bei drei an und hört bei zwölf auf. Wie viele Zentimeter ist er lang?"
            answer: "9"
          - id: l2-c14
            part: convert
            type: text_input
            text: "6 m = _ cm"
            say: "Sechs Meter sind wie viele Zentimeter?"
            answer: "600"
          - id: l2-c15
            part: convert
            type: multiple_choice
            text: "1 m 5 cm = _ cm"
            say: "Ein Meter und fünf Zentimeter sind wie viele Zentimeter?"
            options: ["105 cm", "15 cm", "150 cm"]
            answer: "105 cm"
          - id: l2-c16
            part: convert
            type: multiple_choice
            text: "400 cm = _"
            say: "Vierhundert Zentimeter sind wie viele Meter?"
            options: ["4 m", "40 m", "400 m"]
            answer: "4 m"
          - id: l2-c17
            part: convert
            type: true_false
            text: "1 m 30 cm = 130 cm"
            say: "Stimmt das? Ein Meter und dreißig Zentimeter sind hundertdreißig Zentimeter."
            answer: true
          - id: l2-c18
            part: unit
            type: multiple_choice
            text: "Was misst du in Metern?"
            say: "Was misst du besser in Metern als in Zentimetern?"
            options: ["wie lang ein Bus ist", "wie lang eine Gabel ist", "wie lang ein Schuh ist"]
            answer: "wie lang ein Bus ist"
          - id: l2-c19
            part: unit
            type: fill_in_blank
            text: "cm oder m?"
            say: "Zentimeter oder Meter? Was passt in die Lücke?"
            frame: "Ein Bleistift ist 15 _ lang."
            options: ["cm", "m"]
            answer: ["cm"]
          - id: l2-c20
            part: unit
            type: fill_in_blank
            text: "cm oder m?"
            say: "Zentimeter oder Meter? Was passt in die Lücke?"
            frame: "Das Klassenzimmer ist 8 _ lang."
            options: ["cm", "m"]
            answer: ["m"]
