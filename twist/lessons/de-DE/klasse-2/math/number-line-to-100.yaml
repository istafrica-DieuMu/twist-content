# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.number-line-to-100
skill: math.numbers-to-100.number-line
curriculum: de-DE
language: de
title:
  de: Der Zahlenstrahl bis 100
  en: The number line to 100
summary: >
  Reading and marking numbers on the Zahlenstrahl when only the tens are
  labelled. Lesson 1 finds tens on the whole line and numbers on a part
  of it; lesson 2 reads what an arrow points at, uses the five in the
  middle of each ten, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.read-write]
  also_practises: [math.numbers-to-100.tens]
  vocabulary: { de: [Zahlenstrahl, Strich, Pfeil, Zehnerzahl, zwischen] }
  forms: [drawn, text, audio]
  drawn: [number-line]
  facets: []
  misconceptions:
    - id: count-from-zero
      what: Counts every small tick from 0 instead of starting at the nearest labelled ten
      addressed: Learn starts at the ten before the number; hints say "Fang bei der Zehnerzahl an"
    - id: tick-is-ten
      what: Thinks each small tick is ten because the labels go in tens
      addressed: Learn counts the small ticks between 40 and 50 one by one; the long tick in the middle is 45
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner und Striche, en: Tens and ticks }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "10, 20, 30, _"
            say: "Zähl weiter: zehn, zwanzig, dreißig. Was kommt dann?"
            options: ["31", "40", "300"]
            answer: "40"
            difficulty: easy
          - id: l1-w2
            type: point_on_line
            text: "Wo ist 7?"
            show: { drawn: number-line, from: 0, to: 10, labels: ends }
            answer: 7
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "0 bis 100"
            say: "Das ist der Zahlenstrahl von null bis hundert. Jeder Strich ist eine Zehnerzahl: zehn, zwanzig, dreißig, bis hundert. Der längere Strich in der Mitte ist fünfzig."
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: tens }
          - text: "40 bis 50"
            say: "Jetzt schauen wir genauer hin, von vierzig bis fünfzig. Dazwischen sind kleine Striche. Jeder kleine Strich ist eins mehr: einundvierzig, zweiundvierzig, und so weiter."
            show: { drawn: number-line, from: 40, to: 50, labels: ends }
          - text: "47"
            say: "Wo ist siebenundvierzig? Fang bei vierzig an und zähl sieben Striche weiter. Oder schneller: Der mittlere Strich ist fünfundvierzig. Von dort sind es noch zwei."
            show: { drawn: number-line, from: 40, to: 50, labels: ends, mark: 47 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: point_on_line
                text: "Wo ist 60?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
                answer: 60
                hints:
                  - "Jeder Strich ist zehn mehr."
                  - "Zähl von null: zehn, zwanzig, dreißig, ..."
                  - "60 ist der sechste Strich nach der Null."
                difficulty: easy
              - id: l1-f2
                type: point_on_line
                text: "Wo ist 34?"
                show: { drawn: number-line, from: 30, to: 40, labels: ends }
                answer: 34
                hints:
                  - "Fang bei 30 an."
                  - "Zähl vier Striche weiter."
                  - "31, 32, 33, 34."
              - id: l1-f3
                type: point_on_line
                text: "Wo ist 90?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
                answer: 90
                hints:
                  - "90 ist nah an 100."
                  - "Geh von 100 einen Strich zurück."
                  - "Der Strich vor 100 ist 90."
              - id: l1-f4
                type: point_on_line
                text: "Wo ist 55?"
                show: { drawn: number-line, from: 50, to: 60, labels: ends }
                answer: 55
                hints:
                  - "55 ist genau in der Mitte zwischen 50 und 60."
                  - "Der Strich in der Mitte ist etwas länger."
                  - "Tipp auf den mittleren Strich."
              - id: l1-f5
                type: point_on_line
                text: "Wo ist 28?"
                show: { drawn: number-line, from: 20, to: 30, labels: ends }
                answer: 28
                hints:
                  - "28 ist nah an 30."
                  - "Geh von 30 zwei Striche zurück."
                  - "29, dann 28."
              - id: l1-f6
                type: point_on_line
                text: "Wo ist 73?"
                show: { drawn: number-line, from: 60, to: 80, labels: tens }
                answer: 73
                hints:
                  - "Such zuerst die 70."
                  - "Von 70 drei Striche weiter."
                  - "71, 72, 73."

          - support: some
            tasks:
              - id: l1-s1
                type: point_on_line
                text: "Wo ist 30?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
                answer: 30
                hints: ["Jeder Strich ist zehn. Zähl die Striche von null."]
              - id: l1-s2
                type: point_on_line
                text: "Wo ist 46?"
                show: { drawn: number-line, from: 40, to: 50, labels: ends }
                answer: 46
                hints: ["Die Mitte ist 45."]
              - id: l1-s3
                type: point_on_line
                text: "Wo ist 82?"
                show: { drawn: number-line, from: 80, to: 90, labels: ends }
                answer: 82
                hints: ["Fang bei 80 an."]
              - id: l1-s4
                type: point_on_line
                text: "Wo ist 59?"
                show: { drawn: number-line, from: 50, to: 70, labels: tens }
                answer: 59
                hints: ["59 ist eins vor 60."]
              - id: l1-s5
                type: point_on_line
                text: "Wo ist 70?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
                answer: 70
                hints: ["Von 100 drei Striche zurück."]
              - id: l1-s6
                type: point_on_line
                text: "Wo ist 15?"
                show: { drawn: number-line, from: 10, to: 20, labels: ends }
                answer: 15
                hints: ["Genau in der Mitte."]

          - support: none
            tasks:
              - id: l1-n1
                type: point_on_line
                text: "Wo ist 50?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
                answer: 50
              - id: l1-n2
                type: point_on_line
                text: "Wo ist 63?"
                show: { drawn: number-line, from: 60, to: 70, labels: ends }
                answer: 63
              - id: l1-n3
                type: point_on_line
                text: "Wo ist 37?"
                show: { drawn: number-line, from: 30, to: 40, labels: ends }
                answer: 37
              - id: l1-n4
                type: point_on_line
                text: "Wo ist 88?"
                show: { drawn: number-line, from: 70, to: 90, labels: tens }
                answer: 88
              - id: l1-n5
                type: point_on_line
                text: "Wo ist 20?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
                answer: 20

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: point_on_line
            text: "Wo ist 80?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
            answer: 80
          - id: l1-c2
            type: point_on_line
            text: "Wo ist 42?"
            show: { drawn: number-line, from: 40, to: 50, labels: ends }
            answer: 42
          - id: l1-c3
            type: point_on_line
            text: "Wo ist 96?"
            show: { drawn: number-line, from: 90, to: 100, labels: ends }
            answer: 96

  - n: 2
    title: { de: "Wohin zeigt der Pfeil?", en: "Where does the arrow point?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: point_on_line
            text: "Wo ist 40?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
            answer: 40
            difficulty: easy
          - id: l2-w2
            type: point_on_line
            text: "Wo ist 25?"
            show: { drawn: number-line, from: 20, to: 30, labels: ends }
            answer: 25
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "?"
            say: "Jetzt zeigt ein Pfeil auf eine Zahl. Welche ist es? Such zuerst die Zehnerzahl davor. Hier ist es fünfzig."
            show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 53 }
          - text: "53"
            say: "Von fünfzig zählen wir die Striche bis zum Pfeil: einundfünfzig, zweiundfünfzig, dreiundfünfzig. Der Pfeil zeigt auf dreiundfünfzig."
            show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 53 }
          - text: "85"
            say: "Auf dem langen Zahlenstrahl gibt es Striche in Fünferschritten. Der Pfeil ist genau zwischen achtzig und neunzig. Das ist fünfundachtzig."
            show: { drawn: number-line, from: 0, to: 100, step: 5, labels: tens, mark: 85 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 30, to: 40, labels: ends, mark: 32 }
                options: ["32", "23", "38"]
                answer: "32"
                feedback:
                  "38": "Zähl von der 30 aus, nicht von der 40."
                hints:
                  - "Fang bei 30 an."
                  - "Zähl die Striche bis zum Pfeil."
                  - "31, 32. Der Pfeil zeigt auf 32."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends, mark: 60 }
                options: ["6", "60", "70"]
                answer: "60"
                hints:
                  - "Jeder Strich ist zehn."
                  - "Zähl von null: zehn, zwanzig, ..."
                  - "Der Pfeil zeigt auf 60."
              - id: l2-f3
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 70, to: 80, labels: ends, mark: 79 }
                options: ["79", "71", "89"]
                answer: "79"
                hints:
                  - "Der Pfeil ist ganz nah an 80."
                  - "Ein Strich vor 80."
                  - "Das ist 79."
              - id: l2-f4
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 100, step: 5, labels: tens, mark: 45 }
                options: ["40", "45", "54"]
                answer: "45"
                hints:
                  - "Der Pfeil ist zwischen 40 und 50."
                  - "Er ist genau in der Mitte."
                  - "Die Mitte von 40 und 50 ist 45."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Der Pfeil zeigt auf 66."
                say: "Der Pfeil zeigt auf sechsundsechzig. Stimmt das?"
                show: { drawn: number-line, from: 60, to: 70, labels: ends, mark: 64 }
                answer: false
                hints:
                  - "Zähl von 60 bis zum Pfeil."
                  - "61, 62, 63, 64."
                  - "Nein, der Pfeil zeigt auf 64."
              - id: l2-f6
                type: fill_in_blank
                text: "Zwischen welchen Zehnerzahlen liegt der Pfeil?"
                say: "Der Pfeil zeigt auf siebenunddreißig. Zwischen welchen Zehnerzahlen liegt er?"
                show: { drawn: number-line, from: 0, to: 100, step: 10, labels: tens, mark: 37 }
                frame: "37 liegt zwischen _ und _"
                options: ["20", "30", "40", "50"]
                answer: ["30", "40"]
                hints:
                  - "Welche Zehnerzahl kommt vor 37?"
                  - "30 kommt davor, 40 danach."
                  - "37 liegt zwischen 30 und 40."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 20, to: 30, labels: ends, mark: 26 }
                options: ["26", "62", "24"]
                answer: "26"
                hints: ["Fang bei 20 an."]
              - id: l2-s2
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 100, step: 5, labels: tens, mark: 15 }
                options: ["15", "50", "10"]
                answer: "15"
                hints: ["Die Mitte zwischen 10 und 20."]
              - id: l2-s3
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 80, to: 90, labels: ends, mark: 81 }
                options: ["81", "89", "18"]
                answer: "81"
                hints: ["Ein Strich nach 80."]
              - id: l2-s4
                type: fill_in_blank
                text: "Zwischen welchen Zehnerzahlen liegt die Zahl?"
                say: "Zwischen welchen Zehnerzahlen liegt dreiundsechzig?"
                frame: "63 liegt zwischen _ und _"
                options: ["50", "60", "70", "80"]
                answer: ["60", "70"]
                hints: ["Welche Zehnerzahl kommt vor 63?"]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Der Pfeil zeigt auf 95."
                say: "Der Pfeil zeigt auf fünfundneunzig. Stimmt das?"
                show: { drawn: number-line, from: 0, to: 100, step: 5, labels: tens, mark: 95 }
                answer: true
                hints: ["Zwischen 90 und 100, in der Mitte."]
              - id: l2-s6
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 40, to: 60, labels: tens, mark: 58 }
                options: ["48", "58", "52"]
                answer: "58"
                hints: ["Nah an 60."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 50, to: 60, labels: ends, mark: 57 }
                options: ["57", "53", "75"]
                answer: "57"
              - id: l2-n2
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 0, to: 100, step: 5, labels: tens, mark: 65 }
                options: ["56", "60", "65"]
                answer: "65"
              - id: l2-n3
                type: fill_in_blank
                text: "Zwischen welchen Zehnerzahlen liegt die Zahl?"
                say: "Zwischen welchen Zehnerzahlen liegt achtundachtzig?"
                frame: "88 liegt zwischen _ und _"
                options: ["70", "80", "90", "100"]
                answer: ["80", "90"]
              - id: l2-n4
                type: true_false
                text: "Stimmt das? Der Pfeil zeigt auf 33."
                say: "Der Pfeil zeigt auf dreiunddreißig. Stimmt das?"
                show: { drawn: number-line, from: 30, to: 40, labels: ends, mark: 33 }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Wohin zeigt der Pfeil?"
                show: { drawn: number-line, from: 10, to: 30, labels: tens, mark: 14 }
                options: ["14", "24", "16"]
                answer: "14"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: point_on_line
            text: "Wo ist 10?"
            show: { drawn: number-line, from: 0, to: 100, step: 10, labels: ends }
            answer: 10
          - id: l2-c2
            type: point_on_line
            text: "Wo ist 54?"
            show: { drawn: number-line, from: 50, to: 60, labels: ends }
            answer: 54
          - id: l2-c3
            type: multiple_choice
            text: "Wohin zeigt der Pfeil?"
            show: { drawn: number-line, from: 70, to: 80, labels: ends, mark: 78 }
            options: ["78", "72", "87"]
            answer: "78"
          - id: l2-c4
            type: multiple_choice
            text: "Wohin zeigt der Pfeil?"
            show: { drawn: number-line, from: 0, to: 100, step: 5, labels: tens, mark: 35 }
            options: ["30", "35", "53"]
            answer: "35"
          - id: l2-c5
            type: fill_in_blank
            text: "Zwischen welchen Zehnerzahlen liegt die Zahl?"
            say: "Zwischen welchen Zehnerzahlen liegt einundzwanzig?"
            frame: "21 liegt zwischen _ und _"
            options: ["10", "20", "30", "40"]
            answer: ["20", "30"]
