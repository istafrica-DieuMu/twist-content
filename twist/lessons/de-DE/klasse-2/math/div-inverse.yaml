# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.div-inverse
skill: math.mult-div.div-inverse
curriculum: de-DE
language: de
title:
  de: Geteilt mit der Malaufgabe
  en: Dividing with multiplication
summary: >
  Solving a division with its Umkehraufgabe. Lesson 1 turns 12 : 3 into
  "drei mal wie viel ist zwölf?" and uses the multiplication to check;
  lesson 2 builds Aufgabenfamilien of two multiplications and two
  divisions from three numbers, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.div-meaning, math.mult-div.core-facts]
  also_practises: [math.mult-div.commutative, math.mult-div.all-tables]
  vocabulary: { de: [geteilt durch, Umkehraufgabe, Aufgabenfamilie, Malaufgabe, Geteiltaufgabe] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: [operation-signs]
  parts:
    - { id: solve, what: { de: eine Geteiltaufgabe mit der Malaufgabe lösen, en: solving a division with its multiplication } }
    - { id: inverse, what: { de: die passende Umkehraufgabe finden, en: finding the matching multiplication } }
    - { id: family, what: { de: eine Aufgabenfamilie ergänzen, en: completing a fact family } }
    - { id: belongs, what: { de: "erkennen, welche Aufgabe zur Familie gehört", en: spotting which calculation belongs to a family } }
  misconceptions:
    - id: inverse-is-plus
      what: "Takes a plus or a times with the wrong numbers as the Umkehraufgabe (20 : 4 with 4 + 16 or 20 · 4)"
      addressed: "every stage of lesson 1 has a \"Welche Umkehraufgabe hilft?\" task offering the plus and the 20 · 4 kind, with feedback in l1-f2"
    - id: small-number-first
      what: "Writes the smaller number first in a division (3 : 18 = 6)"
      addressed: lesson 2 Learn says the largest number comes first; l2-f5 (with feedback) and l2-s5 ask which division is written correctly
    - id: family-intruder
      what: Takes any task with the right numbers, or a plus or minus task, as part of the family
      addressed: l2-f2, l2-s2, l2-n2 and the skill check ask which task does not belong; l2-s4 offers a division with a number from outside the family
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Die Malaufgabe hilft", en: "Multiplication helps" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Welche Zahl fehlt in der Malaufgabe?"
            frame: "_ · 5 = 20"
            options: ["4", "5", "15"]
            answer: ["4"]
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? 9 : 3 = 3"
            say: "Neun geteilt durch drei ist drei. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "12 : 3 = _ | 3 · _ = 12"
            say: "Zwölf geteilt durch drei. Frag dich: Drei mal wie viel ist zwölf? Drei mal vier ist zwölf."
            show: { drawn: dots, array: [3, 4] }
          - text: "12 : 3 = 4, denn 3 · 4 = 12"
            say: "Also ist zwölf geteilt durch drei gleich vier. Die Malaufgabe ist die Umkehraufgabe. Mit ihr kannst du auch prüfen, ob du richtig gerechnet hast."
          - text: "35 : 5 = 7, denn 5 · 7 = 35"
            say: "Noch ein Beispiel: fünfunddreißig geteilt durch fünf. Fünf mal sieben ist fünfunddreißig. Also ist das Ergebnis sieben."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Die Malaufgabe hilft."
                say: "Achtzehn geteilt durch drei. Drei mal wie viel ist achtzehn?"
                show: { drawn: dots, array: [3, 6] }
                frame: "3 · _ = 18 | 18 : 3 = _"
                options: ["6", "5", "15"]
                answer: ["6", "6"]
                hints:
                  - "Zähle in Dreierschritten bis achtzehn."
                  - "Drei, sechs, neun, zwölf, fünfzehn, achtzehn. Das sind sechs Dreier."
                  - "6 und 6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Umkehraufgabe hilft bei 20 : 4?"
                say: "Zwanzig geteilt durch vier. Welche Umkehraufgabe hilft dir?"
                options: ["4 · 5 = 20", "4 + 16 = 20", "20 · 4 = 80"]
                answer: "4 · 5 = 20"
                feedback:
                  "4 + 16 = 20": "Das ist eine Plusaufgabe. Die Umkehraufgabe von geteilt ist mal."
                  "20 · 4 = 80": "Hier ist das Ergebnis viel größer. Frag dich: Vier mal wie viel ist zwanzig?"
                hints:
                  - "Die Umkehraufgabe hat ein Malzeichen."
                  - "Vier mal wie viel ist zwanzig?"
                  - "4 · 5 = 20."
              - id: l1-f3
                type: text_input
                text: "24 : 4 = _"
                say: "Vierundzwanzig geteilt durch vier."
                answer: "6"
                hints:
                  - "Vier mal wie viel ist vierundzwanzig?"
                  - "Vier mal sechs ist vierundzwanzig."
                  - "6."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 30 : 5 = 6, denn 5 · 6 = 30"
                say: "Dreißig geteilt durch fünf ist sechs, denn fünf mal sechs ist dreißig. Stimmt das?"
                answer: true
                hints:
                  - "Rechne die Malaufgabe aus."
                  - "Fünf mal sechs ist dreißig."
                  - "Ja, das stimmt."
              - id: l1-f5
                type: fill_in_blank
                text: "Die Malaufgabe hilft."
                say: "Vierzehn geteilt durch zwei. Zwei mal wie viel ist vierzehn?"
                frame: "2 · _ = 14 | 14 : 2 = _"
                options: ["7", "6", "12"]
                answer: ["7", "7"]
                hints:
                  - "Zähle in Zweierschritten bis vierzehn."
                  - "Zwei mal sieben ist vierzehn."
                  - "7 und 7."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Die Malaufgabe hilft."
                say: "Vierzig geteilt durch fünf. Fünf mal wie viel ist vierzig?"
                frame: "5 · _ = 40 | 40 : 5 = _"
                options: ["8", "7", "35"]
                answer: ["8", "8"]
                hints: ["Zähle in Fünferschritten bis vierzig."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Umkehraufgabe hilft bei 27 : 3?"
                say: "Siebenundzwanzig geteilt durch drei. Welche Umkehraufgabe hilft dir?"
                options: ["3 · 9 = 27", "3 + 24 = 27", "27 · 3 = 81"]
                answer: "3 · 9 = 27"
                hints: ["Die Umkehraufgabe hat ein Malzeichen und das gleiche Ergebnis."]
              - id: l1-s3
                type: text_input
                text: "32 : 4 = _"
                say: "Zweiunddreißig geteilt durch vier."
                answer: "8"
                hints: ["Vier mal wie viel ist zweiunddreißig?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 21 : 3 = 6, denn 3 · 6 = 21"
                say: "Einundzwanzig geteilt durch drei ist sechs, denn drei mal sechs ist einundzwanzig. Stimmt das?"
                answer: false
                hints: ["Rechne drei mal sechs aus."]
              - id: l1-s5
                type: text_input
                text: "45 : 5 = _"
                say: "Fünfundvierzig geteilt durch fünf."
                answer: "9"
                hints: ["Fünf mal wie viel ist fünfundvierzig?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Die Malaufgabe hilft."
                say: "Achtundzwanzig geteilt durch vier. Vier mal wie viel ist achtundzwanzig?"
                frame: "4 · _ = 28 | 28 : 4 = _"
                options: ["7", "6", "24"]
                answer: ["7", "7"]
              - id: l1-n2
                type: multiple_choice
                text: "Welche Umkehraufgabe hilft bei 16 : 2?"
                say: "Sechzehn geteilt durch zwei. Welche Umkehraufgabe hilft dir?"
                options: ["2 · 8 = 16", "2 + 14 = 16", "16 · 2 = 32"]
                answer: "2 · 8 = 16"
              - id: l1-n3
                type: text_input
                text: "21 : 3 = _"
                say: "Einundzwanzig geteilt durch drei."
                answer: "7"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 24 : 3 = 8, denn 3 · 8 = 24"
                say: "Vierundzwanzig geteilt durch drei ist acht, denn drei mal acht ist vierundzwanzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "40 : 4 = _"
                say: "Vierzig geteilt durch vier."
                answer: "10"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "15 : 3 = _"
            say: "Fünfzehn geteilt durch drei."
            answer: "5"
          - id: l1-c2
            type: text_input
            text: "36 : 4 = _"
            say: "Sechsunddreißig geteilt durch vier."
            answer: "9"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 20 : 2 = 8"
            say: "Zwanzig geteilt durch zwei ist acht. Stimmt das?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Die Malaufgabe hilft."
            say: "Zwölf geteilt durch zwei. Zwei mal wie viel ist zwölf?"
            frame: "2 · _ = 12 | 12 : 2 = _"
            options: ["6", "5", "10"]
            answer: ["6", "6"]
          - id: l1-c5
            type: multiple_choice
            text: "Welche Umkehraufgabe hilft bei 50 : 10?"
            say: "Fünfzig geteilt durch zehn. Welche Umkehraufgabe hilft dir?"
            options: ["10 · 5 = 50", "10 + 40 = 50", "50 − 10 = 40"]
            answer: "10 · 5 = 50"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 40 : 10 = 4, denn 10 · 4 = 40"
            say: "Vierzig geteilt durch zehn ist vier, denn zehn mal vier ist vierzig. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Aufgabenfamilien", en: "Fact families" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "60 : 10 = _"
            say: "Sechzig geteilt durch zehn."
            answer: "6"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Die Malaufgabe hilft."
            say: "Achtzehn geteilt durch zwei. Zwei mal wie viel ist achtzehn?"
            frame: "2 · _ = 18 | 18 : 2 = _"
            options: ["9", "8", "16"]
            answer: ["9", "9"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 · 4 = 12 | 4 · 3 = 12 | 12 : 3 = 4 | 12 : 4 = 3"
            say: "Zu diesem Punktefeld gehören vier Aufgaben: drei mal vier, vier mal drei, zwölf geteilt durch drei und zwölf geteilt durch vier. Zusammen sind sie eine Aufgabenfamilie."
            show: { drawn: dots, array: [3, 4] }
          - text: "2 · 5 = 10 | 5 · 2 = 10 | 10 : 2 = 5 | 10 : 5 = 2"
            say: "Die Zahlen zwei, fünf und zehn gehören zusammen. Mit ihnen bildest du zwei Malaufgaben und zwei Geteiltaufgaben."
            show: { drawn: dots, array: [2, 5] }
          - text: "10 : 2 = 5"
            say: "Bei den Geteiltaufgaben steht die größte Zahl immer vorne."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Ergänze die Aufgabenfamilie."
                say: "Ergänze die Aufgabenfamilie von zwei, sieben und vierzehn."
                show: { drawn: dots, array: [2, 7] }
                frame: "2 · 7 = 14 | 7 · 2 = 14 | 14 : 2 = _ | 14 : 7 = _"
                options: ["7", "2", "12"]
                answer: ["7", "2"]
                hints:
                  - "Vierzehn geteilt durch zwei: Zwei mal wie viel ist vierzehn?"
                  - "Vierzehn geteilt durch sieben: Sieben mal wie viel ist vierzehn?"
                  - "7 und 2."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Aufgabe gehört nicht zur Familie von 3, 5 und 15?"
                say: "Welche Aufgabe gehört nicht zur Aufgabenfamilie von drei, fünf und fünfzehn?"
                options: ["5 · 3 = 15", "15 : 5 = 3", "15 − 5 = 10"]
                answer: "15 − 5 = 10"
                hints:
                  - "Zur Familie gehören nur Malaufgaben und Geteiltaufgaben."
                  - "Fünf mal drei und fünfzehn geteilt durch fünf passen. Fünfzehn minus fünf ist eine Minusaufgabe."
                  - "15 − 5 = 10."
              - id: l2-f3
                type: fill_in_blank
                text: "Ergänze die Aufgabenfamilie."
                say: "Ergänze die Aufgabenfamilie von vier, sechs und vierundzwanzig."
                frame: "4 · 6 = 24 | 6 · 4 = _ | 24 : 4 = _ | 24 : 6 = _"
                options: ["24", "6", "4", "10"]
                answer: ["24", "6", "4"]
                hints:
                  - "Die Tauschaufgabe hat das gleiche Ergebnis."
                  - "Vier mal sechs ist vierundzwanzig. Also passt die Vier sechsmal und die Sechs viermal hinein."
                  - "24, 6 und 4."
              - id: l2-f4
                type: true_false
                text: "Gehört 8 : 2 = 4 zur Familie von 2 · 4 = 8?"
                say: "Gehört acht geteilt durch zwei gleich vier zur Familie von zwei mal vier gleich acht?"
                answer: true
                hints:
                  - "Welche drei Zahlen kommen in 2 · 4 = 8 vor?"
                  - "Zwei, vier und acht. Kommen in 8 : 2 = 4 die gleichen Zahlen vor?"
                  - "Ja, sie gehört dazu."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Geteiltaufgabe ist richtig geschrieben?"
                say: "Welche Geteiltaufgabe ist richtig geschrieben?"
                options: ["18 : 3 = 6", "3 : 18 = 6", "6 : 18 = 3"]
                answer: "18 : 3 = 6"
                feedback:
                  "3 : 18 = 6": "Bei der Geteiltaufgabe steht die größte Zahl vorne."
                  "6 : 18 = 3": "Bei der Geteiltaufgabe steht die größte Zahl vorne."
                hints:
                  - "Welche Zahl ist die größte?"
                  - "Die größte Zahl steht vorne."
                  - "18 : 3 = 6."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Ergänze die Aufgabenfamilie."
                say: "Ergänze die Aufgabenfamilie von fünf, acht und vierzig."
                frame: "5 · 8 = 40 | 8 · 5 = _ | 40 : 5 = _ | 40 : 8 = _"
                options: ["40", "8", "5", "35"]
                answer: ["40", "8", "5"]
                hints: ["Die Tauschaufgabe hat das gleiche Ergebnis."]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Aufgabe gehört nicht zur Familie von 4, 9 und 36?"
                say: "Welche Aufgabe gehört nicht zur Aufgabenfamilie von vier, neun und sechsunddreißig?"
                options: ["9 · 4 = 36", "36 : 9 = 4", "36 : 6 = 6"]
                answer: "36 : 6 = 6"
                hints: ["In jeder Aufgabe der Familie kommen nur 4, 9 und 36 vor."]
              - id: l2-s3
                type: text_input
                text: "7 · 3 = 21 | 21 : 7 = _"
                say: "Sieben mal drei ist einundzwanzig. Wie viel ist einundzwanzig geteilt durch sieben?"
                answer: "3"
                hints: ["Sieben mal wie viel ist einundzwanzig?"]
              - id: l2-s4
                type: true_false
                text: "Gehört 6 : 3 = 2 zur Familie von 3 · 6 = 18?"
                say: "Gehört sechs geteilt durch drei gleich zwei zur Familie von drei mal sechs gleich achtzehn?"
                answer: false
                hints: ["Welche drei Zahlen kommen in 3 · 6 = 18 vor?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Geteiltaufgabe ist richtig geschrieben?"
                say: "Welche Geteiltaufgabe ist richtig geschrieben?"
                options: ["9 : 45 = 5", "45 : 9 = 5", "5 : 45 = 9"]
                answer: "45 : 9 = 5"
                hints: ["Die größte Zahl steht vorne."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Ergänze die Aufgabenfamilie."
                say: "Ergänze die Aufgabenfamilie von sechs, neun und vierundfünfzig."
                frame: "6 · 9 = 54 | 9 · 6 = _ | 54 : 6 = _ | 54 : 9 = _"
                options: ["54", "9", "6", "48"]
                answer: ["54", "9", "6"]
              - id: l2-n2
                type: multiple_choice
                text: "Welche Aufgabe gehört nicht zur Familie von 2, 8 und 16?"
                say: "Welche Aufgabe gehört nicht zur Aufgabenfamilie von zwei, acht und sechzehn?"
                options: ["16 : 8 = 2", "8 · 2 = 16", "16 + 2 = 18"]
                answer: "16 + 2 = 18"
              - id: l2-n3
                type: text_input
                text: "8 · 4 = 32 | 32 : 8 = _"
                say: "Acht mal vier ist zweiunddreißig. Wie viel ist zweiunddreißig geteilt durch acht?"
                answer: "4"
              - id: l2-n4
                type: true_false
                text: "Gehört 30 : 6 = 5 zur Familie von 5 · 6 = 30?"
                say: "Gehört dreißig geteilt durch sechs gleich fünf zur Familie von fünf mal sechs gleich dreißig?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "63 : 7 = _"
                say: "Dreiundsechzig geteilt durch sieben."
                answer: "9"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: solve
            type: text_input
            text: "48 : 8 = _"
            say: "Achtundvierzig geteilt durch acht."
            answer: "6"
          - id: l2-c2
            part: solve
            type: text_input
            text: "42 : 6 = _"
            say: "Zweiundvierzig geteilt durch sechs."
            answer: "7"
          - id: l2-c3
            part: family
            type: fill_in_blank
            text: "Ergänze die Aufgabenfamilie."
            say: "Ergänze die Aufgabenfamilie von drei, neun und siebenundzwanzig."
            frame: "3 · 9 = 27 | 9 · 3 = _ | 27 : 3 = _ | 27 : 9 = _"
            options: ["27", "9", "3", "24"]
            answer: ["27", "9", "3"]
          - id: l2-c4
            part: belongs
            type: multiple_choice
            text: "Welche Aufgabe gehört nicht zur Familie von 5, 7 und 35?"
            say: "Welche Aufgabe gehört nicht zur Aufgabenfamilie von fünf, sieben und fünfunddreißig?"
            options: ["35 : 7 = 5", "7 · 5 = 35", "35 − 7 = 28"]
            answer: "35 − 7 = 28"
          - id: l2-c5
            part: solve
            type: true_false
            text: "Stimmt das? 40 : 8 = 4"
            say: "Vierzig geteilt durch acht ist vier. Stimmt das?"
            answer: false
          - id: l2-c6
            part: solve
            type: fill_in_blank
            text: "Die Malaufgabe hilft."
            say: "Siebzig geteilt durch zehn. Zehn mal wie viel ist siebzig?"
            frame: "10 · _ = 70 | 70 : 10 = _"
            options: ["7", "10", "60"]
            answer: ["7", "7"]
          - id: l2-c7
            part: solve
            type: text_input
            text: "25 : 5 = _"
            say: "Fünfundzwanzig geteilt durch fünf."
            answer: "5"
          - id: l2-c8
            part: inverse
            type: multiple_choice
            text: "Welche Umkehraufgabe hilft bei 30 : 3?"
            say: "Dreißig geteilt durch drei. Welche Umkehraufgabe hilft dir?"
            options: ["3 · 10 = 30", "3 + 27 = 30", "30 · 3 = 90"]
            answer: "3 · 10 = 30"
          - id: l2-c9
            part: inverse
            type: multiple_choice
            text: "Welche Umkehraufgabe hilft bei 12 : 2?"
            say: "Zwölf geteilt durch zwei. Welche Umkehraufgabe hilft dir?"
            options: ["12 · 2 = 24", "2 · 6 = 12", "2 + 10 = 12"]
            answer: "2 · 6 = 12"
          - id: l2-c10
            part: inverse
            type: true_false
            text: "Stimmt das? 16 : 4 = 4, denn 4 · 4 = 16"
            say: "Sechzehn geteilt durch vier ist vier, denn vier mal vier ist sechzehn. Stimmt das?"
            answer: true
          - id: l2-c11
            part: inverse
            type: true_false
            text: "Stimmt das? 50 : 5 = 9, denn 5 · 9 = 50"
            say: "Fünfzig geteilt durch fünf ist neun, denn fünf mal neun ist fünfzig. Stimmt das?"
            answer: false
          - id: l2-c12
            part: inverse
            type: fill_in_blank
            text: "24 : 6 = 4. Welche Zahl fehlt in der Malaufgabe?"
            say: "Vierundzwanzig geteilt durch sechs ist vier. Welche Zahl fehlt in der Malaufgabe?"
            frame: "_ · 4 = 24"
            options: ["6", "4", "20"]
            answer: ["6"]
          - id: l2-c13
            part: family
            type: fill_in_blank
            text: "Ergänze die Aufgabenfamilie."
            say: "Ergänze die Aufgabenfamilie von zwei, neun und achtzehn."
            frame: "2 · 9 = 18 | 9 · 2 = _ | 18 : 2 = _ | 18 : 9 = _"
            options: ["18", "9", "2", "16"]
            answer: ["18", "9", "2"]
          - id: l2-c14
            part: family
            type: fill_in_blank
            text: "Ergänze die Aufgabenfamilie."
            say: "Ergänze die Aufgabenfamilie von drei, zehn und dreißig."
            frame: "10 · 3 = 30 | 3 · 10 = 30 | 30 : 10 = _ | 30 : 3 = _"
            options: ["3", "10", "20"]
            answer: ["3", "10"]
          - id: l2-c15
            part: family
            type: text_input
            text: "4 · 7 = 28 | 28 : 7 = _"
            say: "Vier mal sieben ist achtundzwanzig. Wie viel ist achtundzwanzig geteilt durch sieben?"
            answer: "4"
          - id: l2-c16
            part: family
            type: multiple_choice
            text: "Mit welchen drei Zahlen bildest du eine Aufgabenfamilie aus Malaufgaben und Geteiltaufgaben?"
            say: "Mit welchen drei Zahlen bildest du eine Aufgabenfamilie aus Malaufgaben und Geteiltaufgaben?"
            options: ["3, 6, 18", "3, 6, 9", "3, 6, 12"]
            answer: "3, 6, 18"
          - id: l2-c17
