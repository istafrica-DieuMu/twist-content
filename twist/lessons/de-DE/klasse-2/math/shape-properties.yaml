# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.shape-properties
skill: math.shapes.properties
curriculum: de-DE
language: de
title:
  de: Ecken und Seiten
  en: Corners and sides
summary: >
  Lesson 1 describes flat shapes by their Ecken and Seiten (Dreieck 3,
  Viereck 4, Sechseck 6, der Kreis hat keine Ecke) and sorts them by
  the number of corners, whatever their colour or size; lesson 2 sets
  Rechteck and Quadrat side by side (four rechte Ecken; in a Quadrat all
  four sides are gleich lang), explains why every Quadrat is also a
  Rechteck but not the other way round, and ends with the skill check.
  Folding and measuring paper shapes waits for a hands-on task.
metadata:
  year: klasse-2
  topic: { de: Formen, en: Shapes }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.basic-shapes]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { de: [Ecke, Seite, Viereck, Sechseck, Rechteck, Quadrat, rechte Ecke, gleich lang] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: count, what: { de: Ecken und Seiten einer Figur zählen, en: counting the corners and sides of a shape } }
    - { id: sort, what: { de: "Figuren nach ihren Ecken finden und sortieren, egal welche Farbe und Größe", en: "finding and sorting shapes by their corners, whatever their colour and size" } }
    - { id: square-rect, what: { de: Quadrat und Rechteck unterscheiden, en: telling a square from a rectangle } }
    - { id: square-is-rect, what: { de: "erklären, warum jedes Quadrat auch ein Rechteck ist", en: explaining why every square is also a rectangle } }
  misconceptions:
    - id: square-not-rectangle
      what: Thinks a Quadrat cannot be a Rechteck because it looks different
      addressed: lesson 2 Learn lists what a Rechteck needs and finds it all in the Quadrat; l2-f2, l2-f5 (with feedback), l2-s2, l2-n3, l2-c2 and l2-c4 ask whether a Quadrat is also a Rechteck
    - id: colour-or-size-decides
      what: Names or sorts a shape by its colour or size instead of its corners and sides
      addressed: l1-f5, l1-s2, l1-n2 and l1-c2 show the shapes in different colours and sizes, with feedback in l1-f5; the hints say to count the corners
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Ecken und Seiten zählen", en: "Counting corners and sides" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form?"
            show: { drawn: shape, kind: triangle, colour: green }
            options: ["Dreieck", "Rechteck", "Kreis"]
            answer: "Dreieck"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Wo ist der Kreis?"
            say: "Wo ist der Kreis?"
            options:
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: triangle, colour: blue }
            answer: circle
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Dreieck: 3 Ecken, 3 Seiten"
            say: "Ein Dreieck hat drei Ecken. Die geraden Linien zwischen den Ecken heißen Seiten. Ein Dreieck hat drei Seiten. Eine Figur mit vier Ecken heißt Viereck."
            show: { drawn: shape, kind: triangle, colour: orange }
          - text: "Sechseck: 6 Ecken, 6 Seiten"
            say: "Das ist ein Sechseck. Zähl die Ecken rundherum: sechs. Es hat auch sechs Seiten. Eine Figur mit geraden Seiten hat immer gleich viele Ecken wie Seiten."
            show: { drawn: shape, kind: hexagon, colour: purple }
          - text: "Kreis: keine Ecke"
            say: "Der Kreis hat keine Ecke und keine gerade Seite, nur eine runde Linie. Ob eine Figur rot oder blau ist, groß oder klein: Für ihren Namen zählen nur die Ecken und Seiten."
            show: { drawn: shape, kind: circle, colour: yellow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Ecken hat diese Figur?"
                say: "Wie viele Ecken hat diese Figur?"
                show: { drawn: shape, kind: hexagon, colour: blue }
                options: ["6", "5", "4"]
                answer: "6"
                hints:
                  - "Zeig auf jede Ecke."
                  - "Fang oben links an und zähl rundherum, bis du wieder dort bist."
                  - "6 Ecken. Es ist ein Sechseck."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Seiten hat ein Rechteck?"
                say: "Wie viele Seiten hat ein Rechteck?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["4", "2", "8"]
                answer: "4"
                feedback:
                  "2": "Zwei Seiten sind lang und zwei sind kurz. Zusammen sind es 4 Seiten."
                hints:
                  - "Fahr mit dem Finger um das Rechteck herum."
                  - "Oben, rechts, unten, links."
                  - "4 Seiten."
              - id: l1-f3
                type: true_false
                text: "Ein Kreis hat eine Ecke."
                say: "Stimmt das? Ein Kreis hat eine Ecke."
                answer: false
                hints:
                  - "Eine Ecke ist dort, wo zwei gerade Seiten zusammenstoßen."
                  - "Hat der Kreis gerade Seiten?"
                  - "Nein, ein Kreis hat keine Ecke."
              - id: l1-f4
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Figur mit der Zahl ihrer Ecken."
                pairs:
                  - { left: { drawn: shape, kind: triangle, colour: red }, right: { text: "3 Ecken" } }
                  - { left: { drawn: shape, kind: hexagon, colour: red }, right: { text: "6 Ecken" } }
                  - { left: { drawn: shape, kind: square, colour: red }, right: { text: "4 Ecken" } }
                option_audio: false
                hints:
                  - "Zähl bei jeder Figur die Ecken."
                  - "Die Figur mit den meisten Ecken ist das Sechseck."
                  - "Dreieck 3, Quadrat 4, Sechseck 6."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welche Figur hat 4 Ecken?"
                say: "Welche Figur hat vier Ecken?"
                options:
                  - { drawn: shape, kind: triangle, colour: red, size: 120 }
                  - { drawn: shape, kind: square, colour: yellow, size: 70 }
                  - { drawn: shape, kind: hexagon, colour: red, size: 120 }
                answer: square
                option_audio: false
                feedback:
                  triangle: "Das Dreieck ist groß, aber es hat nur 3 Ecken. Die Größe zählt nicht."
                hints:
                  - "Die Größe und die Farbe zählen nicht. Zähl die Ecken."
                  - "Das Dreieck hat 3, das Sechseck hat 6."
                  - "Das kleine gelbe Quadrat."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Seiten hat diese Figur?"
                say: "Wie viele Seiten hat diese Figur?"
                show: { drawn: shape, kind: triangle, colour: pink }
                options: ["3", "4", "2"]
                answer: "3"
                hints: ["Fahr mit dem Finger an jeder geraden Linie entlang."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welche Figur hat 6 Ecken?"
                say: "Welche Figur hat sechs Ecken?"
                options:
                  - { drawn: shape, kind: rectangle, colour: purple, size: 120 }
                  - { drawn: shape, kind: hexagon, colour: green, size: 70 }
                  - { drawn: shape, kind: triangle, colour: purple, size: 120 }
                answer: hexagon
                option_audio: false
                hints: ["Zähl die Ecken, nicht die Farbe oder die Größe."]
              - id: l1-s3
                type: true_false
                text: "Ein Rechteck hat 4 Ecken und 4 Seiten."
                say: "Stimmt das? Ein Rechteck hat vier Ecken und vier Seiten."
                answer: true
                hints: ["Denk an ein Blatt Papier. Zähl seine Ecken und seine Seiten."]
              - id: l1-s4
                type: multiple_choice
                text: "Eine Figur hat 3 Ecken. Wie viele Seiten hat sie?"
                say: "Eine Figur hat drei Ecken. Wie viele Seiten hat sie?"
                options: ["3", "6", "4"]
                answer: "3"
                hints: ["Eine Figur mit geraden Seiten hat so viele Seiten wie Ecken."]
              - id: l1-s5
                type: sorting
                text: "Wie viele Ecken hat die Figur?"
                say: "Sortiere die Figuren: Wie viele Ecken haben sie?"
                bins:
                  - { id: three, show: { text: "3 Ecken" }, say: "drei Ecken" }
                  - { id: four, show: { text: "4 Ecken" }, say: "vier Ecken" }
                  - { id: none, show: { text: "keine Ecke" }, say: "keine Ecke" }
                options:
                  - { text: "Dreieck", bin: three }
                  - { text: "Quadrat", bin: four }
                  - { text: "Kreis", bin: none }
                  - { text: "Rechteck", bin: four }
                hints: ["Denk dir jede Figur und zähl ihre Ecken."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Ecken hat diese Figur?"
                say: "Wie viele Ecken hat diese Figur?"
                show: { drawn: shape, kind: square, colour: orange }
                options: ["4", "3", "5"]
                answer: "4"
              - id: l1-n2
                type: image_multiple_choice
                text: "Welche Figur hat keine Ecke?"
                say: "Welche Figur hat keine Ecke?"
                options:
                  - { drawn: shape, kind: hexagon, colour: blue, size: 70 }
                  - { drawn: shape, kind: circle, colour: brown, size: 120 }
                  - { drawn: shape, kind: triangle, colour: blue, size: 70 }
                answer: circle
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Ein Sechseck hat 6 Seiten."
                say: "Stimmt das? Ein Sechseck hat sechs Seiten."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Eine Figur hat 4 Ecken. Wie viele Seiten hat sie?"
                say: "Eine Figur hat vier Ecken. Wie viele Seiten hat sie?"
                options: ["4", "8", "3"]
                answer: "4"
              - id: l1-n5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jede Figur mit der Zahl ihrer Ecken."
                pairs:
                  - { left: { drawn: shape, kind: rectangle, colour: green }, right: { text: "4 Ecken" } }
                  - { left: { drawn: shape, kind: hexagon, colour: green }, right: { text: "6 Ecken" } }
                  - { left: { drawn: shape, kind: circle, colour: green }, right: { text: "keine Ecke" } }
                  - { left: { drawn: shape, kind: triangle, colour: green }, right: { text: "3 Ecken" } }
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Seiten hat diese Figur?"
            say: "Wie viele Seiten hat diese Figur?"
            show: { drawn: shape, kind: hexagon, colour: yellow }
            options: ["6", "5", "8"]
            answer: "6"
          - id: l1-c2
            type: image_multiple_choice
            text: "Welche Figur hat 3 Ecken?"
            say: "Welche Figur hat drei Ecken?"
            options:
              - { drawn: shape, kind: square, colour: red, size: 120 }
              - { drawn: shape, kind: triangle, colour: blue, size: 70 }
              - { drawn: shape, kind: hexagon, colour: red, size: 120 }
            answer: triangle
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ein Quadrat hat 3 Seiten."
            say: "Stimmt das? Ein Quadrat hat drei Seiten."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Wie viele Ecken hat diese Figur?"
            say: "Wie viele Ecken hat diese Figur?"
            show: { drawn: shape, kind: rectangle, colour: purple }
            options: ["4", "2", "6"]
            answer: "4"
          - id: l1-c5
            type: true_false
            text: "Ein Dreieck hat 3 Ecken und 3 Seiten."
            say: "Stimmt das? Ein Dreieck hat drei Ecken und drei Seiten."
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Welche Figur hat 4 Seiten?"
            say: "Welche Figur hat vier Seiten?"
            options:
              - { drawn: shape, kind: hexagon, colour: green, size: 120 }
              - { drawn: shape, kind: rectangle, colour: yellow, size: 70 }
              - { drawn: shape, kind: triangle, colour: green, size: 120 }
            answer: rectangle
            option_audio: false

  - n: 2
    title: { de: "Quadrat und Rechteck", en: "Square and rectangle" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Ecken hat diese Figur?"
            say: "Wie viele Ecken hat diese Figur?"
            show: { drawn: shape, kind: triangle, colour: blue }
            options: ["3", "4"]
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ein Rechteck hat 4 Seiten."
            say: "Stimmt das? Ein Rechteck hat vier Seiten."
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Rechteck: 4 rechte Ecken"
            say: "Ein Rechteck hat vier Ecken. Jede Ecke sieht so aus wie die Ecke von einem Blatt Papier. Das ist eine rechte Ecke. Die Seiten, die sich gegenüberliegen, sind gleich lang."
            show: { drawn: shape, kind: rectangle, colour: blue }
          - text: "Quadrat: 4 rechte Ecken und 4 gleich lange Seiten"
            say: "Ein Quadrat hat auch vier rechte Ecken. Bei ihm sind aber alle vier Seiten gleich lang."
            show: { drawn: shape, kind: square, colour: red }
          - text: "Jedes Quadrat ist auch ein Rechteck."
            say: "Ein Rechteck braucht vier Seiten und vier rechte Ecken. Das Quadrat hat beides. Darum ist jedes Quadrat auch ein Rechteck. Aber nicht jedes Rechteck ist ein Quadrat."
            show: { drawn: shape, row: [square, rectangle], colours: [red, blue] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Bei welcher Figur sind alle Seiten gleich lang?"
                say: "Bei welcher Figur sind alle vier Seiten gleich lang?"
                options:
                  - { drawn: shape, kind: rectangle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                answer: square
                option_audio: false
                hints:
                  - "Vergleiche die Seiten oben und an der Seite."
                  - "Beim Rechteck sind zwei Seiten lang und zwei kurz."
                  - "Beim Quadrat."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Ein Quadrat ist auch ein Rechteck."
                say: "Stimmt das? Ein Quadrat ist auch ein Rechteck."
                answer: true
                hints:
                  - "Was braucht ein Rechteck? Vier Seiten und vier rechte Ecken."
                  - "Hat ein Quadrat vier Seiten und vier rechte Ecken?"
                  - "Ja, jedes Quadrat ist auch ein Rechteck."
              - id: l2-f3
                type: multiple_choice
                text: "Ist das ein Quadrat?"
                say: "Ist diese Figur ein Quadrat?"
                show: { drawn: shape, kind: rectangle, colour: orange }
                options: ["Nein, nicht alle Seiten sind gleich lang.", "Ja, es hat 4 Ecken.", "Nein, es hat keine rechten Ecken."]
                answer: "Nein, nicht alle Seiten sind gleich lang."
                feedback:
                  "Ja, es hat 4 Ecken.": "4 Ecken hat jedes Rechteck. Bei einem Quadrat müssen auch alle Seiten gleich lang sein."
                hints:
                  - "Ein Quadrat braucht 4 gleich lange Seiten."
                  - "Sind die Seiten oben und rechts gleich lang?"
                  - "Nein, nicht alle Seiten sind gleich lang."
              - id: l2-f4
                type: multiple_choice
                text: "Was hat ein Quadrat, aber nicht jedes Rechteck?"
                say: "Was hat ein Quadrat, aber nicht jedes Rechteck?"
                options: ["4 gleich lange Seiten", "4 Ecken", "4 rechte Ecken"]
                answer: "4 gleich lange Seiten"
                hints:
                  - "Beide haben 4 Ecken, und alle Ecken sind rechte Ecken."
                  - "Was ist beim Rechteck anders?"
                  - "4 gleich lange Seiten."
              - id: l2-f5
                type: multiple_choice
                text: "Lena sagt: Das ist ein Rechteck.\nTom sagt: Das ist ein Quadrat.\nWer hat recht?"
                say: "Lena sagt: Das ist ein Rechteck. Tom sagt: Das ist ein Quadrat. Wer hat recht?"
                show: { drawn: shape, kind: square, colour: purple }
                options: ["beide", "nur Lena", "nur Tom"]
                answer: "beide"
                feedback:
                  "nur Tom": "Tom hat recht, es ist ein Quadrat. Aber jedes Quadrat ist auch ein Rechteck. Also hat Lena auch recht."
                hints:
                  - "Ist die Figur ein Quadrat? Ist sie auch ein Rechteck?"
                  - "Sie hat 4 gleich lange Seiten und 4 rechte Ecken."
                  - "Beide haben recht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Seiten sind gleich lang?"
                say: "Wie viele Seiten von diesem Quadrat sind gleich lang?"
                show: { drawn: shape, kind: square, colour: yellow }
                options: ["alle 4", "nur 2", "keine"]
                answer: "alle 4"
                hints: ["Bei einem Quadrat ist keine Seite länger als die anderen."]
              - id: l2-s2
                type: true_false
                text: "Jedes Rechteck ist ein Quadrat."
                say: "Stimmt das? Jedes Rechteck ist ein Quadrat."
                answer: false
                hints: ["Denk an ein Rechteck mit zwei langen und zwei kurzen Seiten."]
              - id: l2-s3
                type: multiple_choice
                text: "Mia sagt: Das ist ein Rechteck.\nBen sagt: Das ist ein Quadrat.\nWer hat recht?"
                say: "Mia sagt: Das ist ein Rechteck. Ben sagt: Das ist ein Quadrat. Wer hat recht?"
                show: { drawn: shape, kind: rectangle, colour: green }
                options: ["nur Mia", "nur Ben", "beide"]
                answer: "nur Mia"
                hints: ["Sind alle Seiten gleich lang?"]
              - id: l2-s4
                type: multiple_choice
                text: "Eine Figur hat 4 rechte Ecken und 4 gleich lange Seiten. Welche Figur ist das?"
                say: "Eine Figur hat vier rechte Ecken und vier gleich lange Seiten. Welche Figur ist das?"
                options: ["ein Quadrat", "ein Sechseck", "ein Dreieck"]
                answer: "ein Quadrat"
                hints: ["Welche Figur hat 4 gleich lange Seiten?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "Wo ist ein Rechteck, das kein Quadrat ist?"
                say: "Wo ist ein Rechteck, das kein Quadrat ist?"
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                answer: rectangle
                option_audio: false
                hints: ["Es hat 4 rechte Ecken, aber zwei lange und zwei kurze Seiten."]

          - support: none
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Wo ist das Quadrat?"
                say: "Wo ist das Quadrat?"
                options:
                  - { drawn: shape, kind: rectangle, colour: orange, size: 120 }
                  - { drawn: shape, kind: square, colour: pink, size: 70 }
                  - { drawn: shape, kind: hexagon, colour: orange, size: 120 }
                answer: square
                option_audio: false
              - id: l2-n2
                type: true_false
                text: "Ein Rechteck hat 4 rechte Ecken."
                say: "Stimmt das? Ein Rechteck hat vier rechte Ecken."
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Ella sagt: Das ist ein Quadrat.\nJonas sagt: Das ist ein Rechteck.\nWer hat recht?"
                say: "Ella sagt: Das ist ein Quadrat. Jonas sagt: Das ist ein Rechteck. Wer hat recht?"
                show: { drawn: shape, kind: square, colour: green }
                options: ["beide", "nur Ella", "nur Jonas"]
                answer: "beide"
              - id: l2-n4
                type: multiple_choice
                text: "Was haben Quadrat und Rechteck gemeinsam?"
                say: "Was haben das Quadrat und das Rechteck gemeinsam?"
                options: ["4 rechte Ecken", "4 gleich lange Seiten", "3 Seiten"]
                answer: "4 rechte Ecken"
              - id: l2-n5
                type: sorting
                text: "Ist es ein Viereck?"
                say: "Sortiere: Ist die Figur ein Viereck oder nicht?"
                bins:
                  - { id: viereck, show: { text: "Viereck" }, say: "Viereck" }
                  - { id: other, show: { text: "kein Viereck" }, say: "kein Viereck" }
                options:
                  - { text: "Quadrat", bin: viereck }
                  - { text: "Dreieck", bin: other }
                  - { text: "Rechteck", bin: viereck }
                  - { text: "Sechseck", bin: other }
                  - { text: "Kreis", bin: other }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count
            type: fill_in_blank
            text: "Zähl die Ecken und die Seiten."
            say: "Wie viele Ecken und wie viele Seiten hat diese Figur?"
            show: { drawn: shape, kind: hexagon, colour: orange }
            frame: "_ Ecken und _ Seiten"
            options: ["4", "5", "6"]
            answer: ["6", "6"]
          - id: l2-c2
            part: square-is-rect
            type: true_false
            text: "Jedes Quadrat ist ein Rechteck."
            say: "Stimmt das? Jedes Quadrat ist ein Rechteck."
            answer: true
          - id: l2-c3
            part: square-rect
            type: image_multiple_choice
            text: "Welche Figur hat 4 rechte Ecken, aber nicht 4 gleich lange Seiten?"
            say: "Welche Figur hat vier rechte Ecken, aber nicht vier gleich lange Seiten?"
            options:
              - { drawn: shape, kind: square, colour: purple }
              - { drawn: shape, kind: hexagon, colour: purple }
              - { drawn: shape, kind: rectangle, colour: purple }
            answer: rectangle
            option_audio: false
          - id: l2-c4
            part: square-is-rect
            type: multiple_choice
            text: "Welcher Satz stimmt?"
            say: "Schau dir die Figur an. Welcher Satz stimmt?"
            show: { drawn: shape, kind: square, colour: blue }
            options: ["Das ist ein Quadrat und auch ein Rechteck.", "Das ist ein Quadrat, aber kein Rechteck.", "Das ist ein Rechteck, aber kein Quadrat."]
            answer: "Das ist ein Quadrat und auch ein Rechteck."
          - id: l2-c5
            part: sort
            type: sorting
            text: "Wie viele Ecken hat die Figur?"
            say: "Sortiere die Figuren nach der Zahl ihrer Ecken."
            bins:
              - { id: three, show: { text: "3 Ecken" }, say: "drei Ecken" }
              - { id: four, show: { text: "4 Ecken" }, say: "vier Ecken" }
              - { id: six, show: { text: "6 Ecken" }, say: "sechs Ecken" }
            options:
              - { text: "Rechteck", bin: four }
              - { text: "Sechseck", bin: six }
              - { text: "Dreieck", bin: three }
              - { text: "Quadrat", bin: four }
          - id: l2-c6
            part: count
            type: multiple_choice
            text: "Wie viele Ecken hat diese Figur?"
            say: "Wie viele Ecken hat diese Figur?"
            show: { drawn: shape, kind: pentagon, colour: green }
            options: ["5", "4", "6"]
            answer: "5"
          - id: l2-c7
            part: count
            type: true_false
            text: "Ein Dreieck hat 4 Seiten."
            say: "Stimmt das? Ein Dreieck hat vier Seiten."
            answer: false
          - id: l2-c8
            part: count
            type: multiple_choice
