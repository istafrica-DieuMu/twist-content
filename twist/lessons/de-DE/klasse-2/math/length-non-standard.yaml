# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.length-non-standard
skill: math.length.non-standard
curriculum: de-DE
language: de
title:
  de: Messen mit Körpermaßen
  en: Measuring with hand spans and steps
summary: >
  Lesson 1 measures with hand spans, steps, feet and objects (Der Tisch
  ist 6 Handspannen lang) and reads which measure is longer from the
  count; lesson 2 sees that big and small hands give different numbers,
  why we need one measure for everyone (der Zentimeter, der Meter), and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.length.compare, math.numbers-to-20.count-to-10]
  also_practises: [math.length.compare]
  vocabulary: { de: [messen, Handspanne, Schritt, Fuß, Maß, Zentimeter, Meter] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: choose-unit, what: { de: ein passendes Maß zum Messen wählen, en: choosing a suitable unit to measure with } }
    - { id: measure, what: { de: richtig messen und Messzahlen vergleichen, en: measuring correctly and comparing the counts } }
    - { id: unit-size, what: { de: "erklären, warum verschiedene Maße verschiedene Zahlen geben", en: explaining why different units give different counts } }
    - { id: standard, what: { de: "wissen, warum wir Zentimeter und Meter brauchen", en: knowing why we need centimetres and metres } }
  misconceptions:
    - id: bigger-unit-bigger-count
      what: Thinks a bigger measuring unit gives a bigger number (in Schritten sind es mehr als in Füßen)
      addressed: lesson 2 Learn measures one room in Schritte and in Füße; l2-f2, l2-s2 and l2-n2 ask which unit gives the bigger or the smaller count
    - id: gaps-when-measuring
      what: Leaves gaps or overlaps between hand spans and still counts them
      addressed: lesson 1 Learn says the spans go end to end without gaps; l1-f4 (gaps), l1-s4 (no gaps), l1-n4 (overlaps) and l2-c4 ask whether a measurement is right
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Mit Händen und Füßen messen", en: "Measuring with hands and feet" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist länger: ein Tisch oder ein Stift?"
            say: "Was ist länger: ein Tisch oder ein Stift?"
            options: ["ein Tisch", "ein Stift"]
            answer: "ein Tisch"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist mehr: 8 oder 5?"
            say: "Was ist mehr: acht oder fünf?"
            options: ["8", "5"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Handspanne"
            say: "Spreize deine Hand weit auf. Vom Daumen bis zum kleinen Finger: Das ist eine Handspanne. Damit kannst du messen."
          - text: "Der Tisch ist 6 Handspannen lang."
            say: "Lena legt ihre Hand immer wieder an, eine Spanne genau an die nächste, ohne Lücke. Sie zählt sechs Handspannen. Der Tisch ist sechs Handspannen lang."
          - text: "Klassenzimmer: 12 Schritte · Flur: 20 Schritte"
            say: "Für lange Dinge nimmst du Schritte. Das Klassenzimmer ist zwölf Schritte lang, der Flur zwanzig Schritte. Mehr Schritte heißt: länger. Der Flur ist länger."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Womit misst du am besten, wie lang der Schulhof ist?"
                say: "Womit misst du am besten, wie lang der Schulhof ist?"
                options: ["mit Schritten", "mit Fingerbreiten", "mit Büroklammern"]
                answer: "mit Schritten"
                hints:
                  - "Der Schulhof ist sehr lang."
                  - "Mit kleinen Maßen müsstest du ganz lange zählen."
                  - "mit Schritten."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Das Regal ist 5 Handspannen lang, der Schrank 9 Handspannen. Was ist länger?"
                say: "Tim misst mit seiner Hand. Das Regal ist fünf Handspannen lang, der Schrank neun Handspannen. Was ist länger?"
                options: ["der Schrank", "das Regal", "beide gleich lang"]
                answer: "der Schrank"
                hints:
                  - "Mehr Handspannen heißt: länger."
                  - "Neun ist mehr als fünf."
                  - "der Schrank."
              - id: l1-f3
                type: text_input
                text: "Mia legt ihre Hand 7-mal an, Spanne an Spanne. Wie viele Handspannen lang ist die Bank?"
                say: "Mia misst die Bank. Sie legt ihre Hand siebenmal an, eine Spanne genau an die nächste. Wie viele Handspannen ist die Bank lang?"
                answer: "7"
                hints:
                  - "Jedes Anlegen ist eine Handspanne."
                  - "Sie legt die Hand siebenmal an."
                  - "7."
              - id: l1-f4
                type: true_false
                text: "Ben lässt zwischen seinen Handspannen immer eine Lücke. Er misst so richtig."
                say: "Ben misst den Tisch. Zwischen seinen Handspannen lässt er immer eine Lücke. Misst er so richtig?"
                answer: false
                hints:
                  - "Die Lücken werden nicht mitgezählt."
                  - "Die Spannen müssen genau aneinander liegen."
                  - "Nein, so misst er nicht richtig."
              - id: l1-f5
                type: multiple_choice
                text: "Womit misst du am besten, wie lang dein Heft ist?"
                say: "Womit misst du am besten, wie lang dein Heft ist?"
                options: ["mit Fingerbreiten", "mit Schritten", "mit Autos"]
                answer: "mit Fingerbreiten"
                hints:
                  - "Das Heft ist klein."
                  - "Ein Schritt ist viel länger als ein Heft."
                  - "mit Fingerbreiten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Womit misst du am besten, wie lang der Flur ist?"
                say: "Womit misst du am besten, wie lang der Flur in der Schule ist?"
                options: ["mit Schritten", "mit Radiergummis", "mit Fingerbreiten"]
                answer: "mit Schritten"
                hints: ["Der Flur ist lang."]
              - id: l1-s2
                type: multiple_choice
                text: "Die Tafel ist 14 Handspannen lang, das Fenster 10. Was ist kürzer?"
                say: "Lisa misst mit ihrer Hand. Die Tafel ist vierzehn Handspannen lang, das Fenster zehn. Was ist kürzer?"
                options: ["das Fenster", "die Tafel", "beide gleich lang"]
                answer: "das Fenster"
                hints: ["Weniger Handspannen heißt: kürzer."]
              - id: l1-s3
                type: text_input
                text: "Ali geht Fuß vor Fuß den Teppich entlang. Er zählt 11 Füße. Wie viele Füße lang ist der Teppich?"
                say: "Ali geht Fuß vor Fuß den Teppich entlang, die Ferse immer genau an die Zehen. Er zählt elf Füße. Wie viele Füße ist der Teppich lang?"
                answer: "11"
                hints: ["Jeder Fuß zählt einmal."]
              - id: l1-s4
                type: true_false
                text: "Lea legt Büroklammern genau hintereinander, ohne Lücke. Sie misst so richtig."
                say: "Lea misst ihr Mäppchen mit Büroklammern. Sie legt sie genau hintereinander, ohne Lücke. Misst sie so richtig?"
                answer: true
                hints: ["Ohne Lücke und ohne Übereinander ist richtig."]
              - id: l1-s5
                type: multiple_choice
                text: "Womit misst du am besten, wie lang ein Buch ist?"
                say: "Womit misst du am besten, wie lang ein Buch ist?"
                options: ["mit Büroklammern", "mit Schritten", "mit Bussen"]
                answer: "mit Büroklammern"
                hints: ["Ein Buch ist nicht lang."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Womit misst du am besten, wie lang ein Fußballfeld ist?"
                say: "Womit misst du am besten, wie lang ein Fußballfeld ist?"
                options: ["mit Schritten", "mit Fingerbreiten", "mit Handspannen"]
                answer: "mit Schritten"
              - id: l1-n2
                type: multiple_choice
                text: "Das Sofa ist 8 Handspannen lang, das Bett 12. Was ist länger?"
                say: "Papa misst mit seiner Hand. Das Sofa ist acht Handspannen lang, das Bett zwölf. Was ist länger?"
                options: ["das Bett", "das Sofa", "beide gleich lang"]
                answer: "das Bett"
              - id: l1-n3
                type: text_input
                text: "Jan geht 16 Schritte von der Tür bis zum Fenster. Wie viele Schritte lang ist der Weg?"
                say: "Jan geht von der Tür bis zum Fenster. Er zählt sechzehn Schritte. Wie viele Schritte lang ist der Weg?"
                answer: "16"
              - id: l1-n4
                type: true_false
                text: "Paul legt seine Handspannen ein Stück übereinander. Er misst so richtig."
                say: "Paul misst den Tisch. Seine Handspannen legt er immer ein Stück übereinander. Misst er so richtig?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Der Teppich ist 9 Füße lang, der Läufer 9 Füße. Was stimmt?"
                say: "Mama misst mit ihren Füßen. Der Teppich ist neun Füße lang, der Läufer im Flur auch neun Füße. Was stimmt?"
                options: ["Beide sind gleich lang.", "Der Teppich ist länger.", "Der Läufer ist länger."]
                answer: "Beide sind gleich lang."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Womit misst du am besten, wie lang ein Radiergummi ist?"
            say: "Womit misst du am besten, wie lang ein Radiergummi ist?"
            options: ["mit Fingerbreiten", "mit Schritten", "mit Füßen"]
            answer: "mit Fingerbreiten"
          - id: l1-c2
            type: multiple_choice
            text: "Der Tisch ist 7 Handspannen lang, die Bank 11. Was ist länger?"
            say: "Mila misst mit ihrer Hand. Der Tisch ist sieben Handspannen lang, die Bank elf. Was ist länger?"
            options: ["die Bank", "der Tisch", "beide gleich lang"]
            answer: "die Bank"
          - id: l1-c3
            type: true_false
            text: "Beim Messen mit Füßen setzt man einen Fuß genau an den nächsten."
            say: "Stimmt das? Beim Messen mit Füßen setzt man einen Fuß genau an den nächsten, die Ferse an die Zehen."
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Womit misst du am besten, wie lang der Gartenzaun ist?"
            say: "Womit misst du am besten, wie lang der Gartenzaun ist?"
            options: ["mit Schritten", "mit Büroklammern", "mit Fingerbreiten"]
            answer: "mit Schritten"
          - id: l1-c5
            type: text_input
            text: "Ella misst den Flur mit Schritten. Bis zur Tür sind es 10 Schritte, dann noch 5 Schritte bis zum Ende. Wie viele Schritte lang ist der Flur?"
            say: "Ella misst den Flur mit Schritten. Bis zur Tür sind es zehn Schritte, dann noch fünf Schritte bis zum Ende. Wie viele Schritte ist der Flur lang?"
            answer: "15"
          - id: l1-c6
            type: true_false
            text: "Die Bank ist 12 Füße lang, der Tisch 8 Füße. Der Tisch ist länger."
            say: "Sara misst mit ihren Füßen. Die Bank ist zwölf Füße lang, der Tisch acht Füße. Ist der Tisch länger?"
            answer: false

  - n: 2
    title: { de: "Warum wir Zentimeter brauchen", en: "Why we need centimetres" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Das Regal ist 6 Handspannen lang, die Tür 4. Was ist länger?"
            say: "Das Regal ist sechs Handspannen lang, die Tür vier Handspannen. Was ist länger?"
            options: ["das Regal", "die Tür"]
            answer: "das Regal"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Womit misst du am besten den Schulhof?"
            say: "Womit misst du am besten, wie lang der Schulhof ist?"
            options: ["mit Schritten", "mit Fingerbreiten"]
            answer: "mit Schritten"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lena: 6 Handspannen · Papa: 4 Handspannen"
            say: "Lena und Papa messen den gleichen Tisch. Lena zählt sechs Handspannen, Papa nur vier. Papas Hand ist größer. Mit einer großen Hand brauchst du weniger Spannen."
          - text: "Schritte: 10 · Füße: 25"
            say: "Lena misst das Zimmer zweimal. Mit Schritten sind es zehn, mit Füßen fünfundzwanzig. Ein Fuß ist kürzer als ein Schritt, darum braucht sie mehr Füße."
          - text: "1 cm · 1 m"
            say: "Weil Hände und Füße verschieden groß sind, gibt es Maße, die für alle gleich sind: den Zentimeter und den Meter. Ein Zentimeter ist bei allen gleich lang."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tim und Oma messen das gleiche Bett. Tim zählt 10 Handspannen, Oma 7. Warum?"
                say: "Tim und Oma messen das gleiche Bett mit der Hand. Tim zählt zehn Handspannen, Oma sieben. Warum?"
                options: ["Omas Hand ist größer.", "Tims Hand ist größer.", "Das Bett ist für Oma kürzer."]
                answer: "Omas Hand ist größer."
                feedback:
                  "Das Bett ist für Oma kürzer.": "Es ist das gleiche Bett. Es ist für alle gleich lang."
                hints:
                  - "Es ist das gleiche Bett."
                  - "Mit einer großen Hand brauchst du weniger Spannen."
                  - "Omas Hand ist größer."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ben misst den Flur mit Schritten und mit Füßen. Womit zählt er mehr?"
                say: "Ben misst den Flur zweimal: einmal mit Schritten, einmal mit Füßen. Womit zählt er mehr?"
                options: ["mit Füßen", "mit Schritten", "beides gleich viel"]
                answer: "mit Füßen"
                hints:
                  - "Was ist kürzer: ein Fuß oder ein Schritt?"
                  - "Mit einem kürzeren Maß brauchst du mehr."
                  - "mit Füßen."
              - id: l2-f3
                type: true_false
                text: "Mia und ihr großer Bruder messen den gleichen Tisch mit der Hand. Sie bekommen sicher die gleiche Zahl."
                say: "Mia und ihr großer Bruder messen den gleichen Tisch mit der Hand. Bekommen sie sicher die gleiche Zahl?"
                answer: false
                hints:
                  - "Sind ihre Hände gleich groß?"
                  - "Der große Bruder hat eine größere Hand."
                  - "Nein, nicht sicher."
              - id: l2-f4
                type: multiple_choice
                text: "Warum messen wir in Zentimetern?"
                say: "Warum messen wir lieber in Zentimetern als mit der Hand?"
                options: ["Ein Zentimeter ist für alle gleich lang.", "Zentimeter sind immer groß.", "Hände kann man nicht zählen."]
                answer: "Ein Zentimeter ist für alle gleich lang."
                hints:
                  - "Hände sind verschieden groß."
                  - "Ein Zentimeter ist überall gleich."
                  - "Ein Zentimeter ist für alle gleich lang."
              - id: l2-f5
                type: multiple_choice
                text: "Lisa misst ihr Zimmer: 8 Schritte. Ihr kleiner Bruder misst auch. Was zählt er wohl?"
                say: "Lisa misst ihr Zimmer mit Schritten: acht Schritte. Ihr kleiner Bruder macht kleinere Schritte. Was zählt er wohl?"
                options: ["mehr als 8 Schritte", "weniger als 8 Schritte", "genau 8 Schritte"]
                answer: "mehr als 8 Schritte"
                hints:
                  - "Seine Schritte sind kleiner."
                  - "Mit kleinen Schritten brauchst du mehr."
                  - "mehr als 8 Schritte."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lea und Papa messen den gleichen Tisch. Lea zählt 9 Handspannen, Papa 6. Warum?"
                say: "Lea und Papa messen den gleichen Tisch. Lea zählt neun Handspannen, Papa sechs. Warum?"
                options: ["Papas Hand ist größer.", "Leas Hand ist größer.", "Der Tisch ist für Papa kürzer."]
                answer: "Papas Hand ist größer."
                hints: ["Wer weniger zählt, hat das größere Maß."]
              - id: l2-s2
                type: multiple_choice
                text: "Ali misst sein Heft mit Fingerbreiten und mit Büroklammern. Eine Büroklammer ist länger als eine Fingerbreite. Womit zählt er weniger?"
                say: "Ali misst sein Heft zweimal: mit Fingerbreiten und mit Büroklammern. Eine Büroklammer ist länger als eine Fingerbreite. Womit zählt er weniger?"
                options: ["mit Büroklammern", "mit Fingerbreiten", "beides gleich viel"]
                answer: "mit Büroklammern"
                hints: ["Mit einem längeren Maß brauchst du weniger."]
              - id: l2-s3
                type: true_false
                text: "Mit Zentimetern bekommen alle für den gleichen Tisch die gleiche Zahl."
                say: "Stimmt das? Mit Zentimetern bekommen alle für den gleichen Tisch die gleiche Zahl."
                answer: true
                hints: ["Ein Zentimeter ist für alle gleich lang."]
              - id: l2-s4
                type: multiple_choice
                text: "Welches Maß ist für alle gleich lang?"
                say: "Welches Maß ist für alle gleich lang?"
                options: ["der Meter", "der Schritt", "die Handspanne"]
                answer: "der Meter"
                hints: ["Schritte und Hände sind verschieden groß."]
              - id: l2-s5
                type: multiple_choice
                text: "Opa misst den Garten: 20 Schritte. Ein Kind misst auch. Was zählt es wohl?"
                say: "Opa misst den Garten mit Schritten: zwanzig Schritte. Ein Kind macht kleinere Schritte. Was zählt es wohl?"
                options: ["mehr als 20 Schritte", "weniger als 20 Schritte", "genau 20 Schritte"]
                answer: "mehr als 20 Schritte"
                hints: ["Mit kleinen Schritten brauchst du mehr."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Jan und Mama messen den gleichen Teppich. Jan zählt 12 Füße, Mama 9. Warum?"
                say: "Jan und Mama messen den gleichen Teppich mit ihren Füßen. Jan zählt zwölf, Mama neun. Warum?"
                options: ["Mamas Füße sind größer.", "Jans Füße sind größer.", "Der Teppich ist für Mama kürzer."]
                answer: "Mamas Füße sind größer."
              - id: l2-n2
                type: multiple_choice
                text: "Tim misst den Schulhof mit Schritten und mit Füßen. Womit zählt er weniger?"
                say: "Tim misst den Schulhof zweimal: mit Schritten und mit Füßen. Womit zählt er weniger?"
                options: ["mit Schritten", "mit Füßen", "beides gleich viel"]
                answer: "mit Schritten"
              - id: l2-n3
                type: true_false
                text: "Zwei Kinder messen das gleiche Fenster mit der Hand. Sie bekommen immer die gleiche Zahl."
                say: "Stimmt das? Zwei Kinder messen das gleiche Fenster mit der Hand. Sie bekommen immer die gleiche Zahl."
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Welche Maße sind für alle gleich lang?"
                say: "Welche Maße sind für alle Menschen gleich lang?"
                options: ["Zentimeter und Meter", "Schritte und Füße", "Handspannen und Finger"]
                answer: "Zentimeter und Meter"
              - id: l2-n5
                type: multiple_choice
                text: "Ein großer Mann misst einen Weg: 30 Schritte. Ein Kind misst auch. Was zählt es wohl?"
                say: "Ein großer Mann misst einen Weg mit Schritten: dreißig Schritte. Ein Kind misst den gleichen Weg. Was zählt es wohl?"
                options: ["mehr als 30 Schritte", "weniger als 30 Schritte", "genau 30 Schritte"]
                answer: "mehr als 30 Schritte"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: choose-unit
            type: multiple_choice
            text: "Womit misst du am besten, wie lang die Turnhalle ist?"
            say: "Womit misst du am besten, wie lang die Turnhalle ist?"
            options: ["mit Schritten", "mit Fingerbreiten", "mit Büroklammern"]
            answer: "mit Schritten"
          - id: l2-c2
            part: measure
            type: multiple_choice
            text: "Die Tür ist 7 Handspannen breit, das Fenster 5. Was ist breiter?"
            say: "Oma misst mit ihrer Hand. Die Tür ist sieben Handspannen breit, das Fenster fünf. Was ist breiter?"
            options: ["die Tür", "das Fenster", "beide gleich breit"]
            answer: "die Tür"
          - id: l2-c3
            part: unit-size
            type: multiple_choice
            text: "Lena und Opa messen die gleiche Bank. Lena zählt 8 Handspannen, Opa 5. Warum?"
            say: "Lena und Opa messen die gleiche Bank mit der Hand. Lena zählt acht Handspannen, Opa fünf. Warum?"
            options: ["Opas Hand ist größer.", "Lenas Hand ist größer.", "Die Bank ist für Opa kürzer."]
            answer: "Opas Hand ist größer."
          - id: l2-c4
            part: measure
            type: true_false
            text: "Ole misst die Bank mit der Hand. Er lässt zwischen den Spannen Lücken und zählt 6. Die Bank ist genau 6 Handspannen lang."
            say: "Ole misst die Bank mit der Hand. Er lässt zwischen den Spannen Lücken und zählt sechs. Ist die Bank genau sechs Handspannen lang?"
            answer: false
          - id: l2-c5
            part: standard
            type: multiple_choice
            text: "Warum gibt es den Zentimeter?"
            say: "Warum gibt es den Zentimeter?"
            options: ["Damit alle mit dem gleichen Maß messen.", "Damit man nicht zählen muss.", "Weil Hände zu klein sind."]
            answer: "Damit alle mit dem gleichen Maß messen."
          - id: l2-c6
            part: choose-unit
            type: multiple_choice
            text: "Womit misst du am besten, wie lang dein Mäppchen ist?"
            say: "Womit misst du am besten, wie lang dein Mäppchen ist?"
            options: ["mit Büroklammern", "mit Schritten", "mit Füßen"]
            answer: "mit Büroklammern"
          - id: l2-c7
            part: choose-unit
            type: multiple_choice
            text: "Womit misst du am besten, wie lang die Straße vor der Schule ist?"
            say: "Womit misst du am besten, wie lang die Straße vor der Schule ist?"
            options: ["mit Schritten", "mit Handspannen", "mit Fingerbreiten"]
            answer: "mit Schritten"
          - id: l2-c8
            part: choose-unit
            type: true_false
            text: "Den Schulhof misst man am besten mit Fingerbreiten."
            say: "Stimmt das? Den Schulhof misst man am besten mit Fingerbreiten."
            answer: false
          - id: l2-c9
            part: choose-unit
            type: multiple_choice
            text: "Womit misst du am besten, wie breit dein Tisch ist?"
            say: "Womit misst du am besten, wie breit dein Tisch ist?"
            options: ["mit Handspannen", "mit Schritten", "mit Füßen"]
            answer: "mit Handspannen"
          - id: l2-c10
            part: measure
            type: text_input
            text: "Emil misst die Tafel mit Stiften. Er legt 13 Stifte genau hintereinander. Wie viele Stifte lang ist die Tafel?"
            say: "Emil misst die Tafel mit Stiften. Er legt dreizehn Stifte genau hintereinander. Wie viele Stifte ist die Tafel lang?"
            answer: "13"
          - id: l2-c11
            part: measure
            type: multiple_choice
