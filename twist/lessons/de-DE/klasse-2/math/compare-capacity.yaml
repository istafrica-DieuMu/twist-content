# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.compare-capacity
skill: math.mass-capacity.compare-capacity
curriculum: de-DE
language: de
title:
  de: Wo passt mehr hinein?
  en: Which holds more?
summary: >
  Lesson 1 compares containers (In einen Eimer passt mehr als in eine
  Tasse) and says whether one is voll, halb voll or leer; lesson 2
  compares by pouring and by counting cups (Die Kanne füllt 4 Becher, die
  Flasche 6), sees that a tall glass does not always hold more, and ends
  with the skill check.
metadata:
  year: klasse-2
  topic: { de: Rauminhalte, en: Capacity }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: [math.numbers-to-20.compare-to-10]
  also_practises: []
  vocabulary: { de: [voll, halb voll, leer, mehr, weniger, gleich viel, Gefäß, umfüllen, Becher] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: compare, what: { de: "sagen, in welches Gefäß mehr passt", en: saying which container holds more } }
    - { id: fill, what: { de: "sagen, ob ein Gefäß voll, halb voll oder leer ist", en: "saying whether a container is full, half full or empty" } }
    - { id: pour, what: { de: durch Umfüllen und mit Bechern vergleichen, en: comparing by pouring and by counting cups } }
  misconceptions:
    - id: taller-holds-more
      what: Thinks the taller container always holds more, whatever its width
      addressed: lesson 2 Learn pours a tall thin glass into a wide bowl; l2-f3 and l2-n3 ask whether the taller one always holds more, l2-s3 whether a wide pot can hold more than a tall thin glass, with feedback in l2-f3
    - id: more-cups-less
      what: Thinks the container that fills fewer cups holds more
      addressed: lesson 2 Learn says more cups means more fits in; l2-f2, l2-s2 and l2-n2 compare cup counts
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Voll, halb voll, leer", en: "Full, half full, empty" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist mehr: 4 oder 6?"
            say: "Was ist mehr: vier oder sechs?"
            options: ["6", "4"]
            answer: "6"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist größer: ein Eimer oder ein Löffel?"
            say: "Was ist größer: ein Eimer oder ein Löffel?"
            options: ["ein Eimer", "ein Löffel"]
            answer: "ein Eimer"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "In einen Eimer passt mehr als in eine Tasse."
            say: "Ein Eimer und eine Tasse. In den Eimer passt viel mehr Wasser als in die Tasse. In die Tasse passt weniger."
          - text: "voll · halb voll · leer"
            say: "Ist ein Glas bis oben gefüllt, ist es voll. Ist es bis zur Mitte gefüllt, ist es halb voll. Ist nichts drin, ist es leer."
          - text: "Zwei gleiche Gläser, beide halb voll: gleich viel"
            say: "Zwei gleiche Gläser, beide halb voll: In beiden ist gleich viel Saft."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wo passt mehr Wasser hinein: in eine Badewanne oder in einen Eimer?"
                say: "Wo passt mehr Wasser hinein: in eine Badewanne oder in einen Eimer?"
                options: ["in eine Badewanne", "in einen Eimer", "gleich viel"]
                answer: "in eine Badewanne"
                hints:
                  - "Stell dir vor, du füllst beide."
                  - "In eine Badewanne passt ein ganzes Kind."
                  - "in eine Badewanne."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo passt weniger hinein: in einen Löffel oder in eine Tasse?"
                say: "Wo passt weniger hinein: in einen Löffel oder in eine Tasse?"
                options: ["in einen Löffel", "in eine Tasse", "gleich viel"]
                answer: "in einen Löffel"
                hints:
                  - "Weniger heißt: nicht so viel."
                  - "Du musst viele Löffel hineingießen, bis die Tasse voll ist."
                  - "in einen Löffel."
              - id: l1-f3
                type: multiple_choice
                text: "Im Glas ist Saft bis zur Mitte. Wie ist das Glas?"
                say: "Im Glas ist Saft genau bis zur Mitte. Wie ist das Glas?"
                options: ["halb voll", "voll", "leer"]
                answer: "halb voll"
                hints:
                  - "Bis oben wäre voll."
                  - "Bis zur Mitte ist die Hälfte."
                  - "halb voll."
              - id: l1-f4
                type: true_false
                text: "Ben hat seinen Becher ganz ausgetrunken. Der Becher ist jetzt leer."
                say: "Ben hat seinen Becher ganz ausgetrunken. Stimmt das: Der Becher ist jetzt leer?"
                answer: true
                hints:
                  - "Ist noch etwas drin?"
                  - "Ganz ausgetrunken heißt: nichts mehr drin."
                  - "Ja, er ist leer."
              - id: l1-f5
                type: multiple_choice
                text: "Zwei gleiche Flaschen. Eine ist voll, eine halb voll. In welcher ist mehr?"
                say: "Zwei gleiche Flaschen. Eine ist voll, die andere halb voll. In welcher ist mehr Wasser?"
                options: ["in der vollen", "in der halb vollen", "gleich viel"]
                answer: "in der vollen"
                hints:
                  - "Die Flaschen sind gleich groß."
                  - "Voll ist mehr als halb voll."
                  - "in der vollen."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wo passt mehr hinein: in eine Gießkanne oder in eine Tasse?"
                say: "Wo passt mehr Wasser hinein: in eine Gießkanne oder in eine Tasse?"
                options: ["in eine Gießkanne", "in eine Tasse", "gleich viel"]
                answer: "in eine Gießkanne"
                hints: ["Mit einer Gießkanne gießt du viele Blumen."]
              - id: l1-s2
                type: multiple_choice
                text: "Wo passt weniger hinein: in einen Eierbecher oder in einen Kochtopf?"
                say: "Wo passt weniger hinein: in einen Eierbecher oder in einen Kochtopf?"
                options: ["in einen Eierbecher", "in einen Kochtopf", "gleich viel"]
                answer: "in einen Eierbecher"
                hints: ["In einen Eierbecher passt nur ein Ei."]
              - id: l1-s3
                type: multiple_choice
                text: "Die Kanne ist bis oben mit Tee gefüllt. Wie ist sie?"
                say: "Die Kanne ist bis ganz oben mit Tee gefüllt. Wie ist sie?"
                options: ["voll", "halb voll", "leer"]
                answer: "voll"
                hints: ["Bis oben gefüllt heißt ..."]
              - id: l1-s4
                type: true_false
                text: "Im Glas ist kein Wasser. Das Glas ist halb voll."
                say: "Im Glas ist kein Wasser. Stimmt das: Das Glas ist halb voll?"
                answer: false
                hints: ["Ohne Wasser ist ein Glas ..."]
              - id: l1-s5
                type: multiple_choice
                text: "Zwei gleiche Gläser, beide halb voll. In welchem ist mehr?"
                say: "Zwei gleiche Gläser, beide halb voll mit Milch. In welchem ist mehr Milch?"
                options: ["gleich viel", "im ersten", "im zweiten"]
                answer: "gleich viel"
                hints: ["Gleiche Gläser, gleich hoch gefüllt."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wo passt mehr hinein: in ein Planschbecken oder in einen Eimer?"
                say: "Wo passt mehr Wasser hinein: in ein Planschbecken oder in einen Eimer?"
                options: ["in ein Planschbecken", "in einen Eimer", "gleich viel"]
                answer: "in ein Planschbecken"
              - id: l1-n2
                type: multiple_choice
                text: "Wo passt weniger hinein: in eine Flasche oder in eine Badewanne?"
                say: "Wo passt weniger Wasser hinein: in eine Flasche oder in eine Badewanne?"
                options: ["in eine Flasche", "in eine Badewanne", "gleich viel"]
                answer: "in eine Flasche"
              - id: l1-n3
                type: multiple_choice
                text: "Die Flasche war voll. Mia hat die Hälfte getrunken. Wie ist die Flasche jetzt?"
                say: "Die Flasche war voll. Mia hat die Hälfte getrunken. Wie ist die Flasche jetzt?"
                options: ["halb voll", "voll", "leer"]
                answer: "halb voll"
              - id: l1-n4
                type: true_false
                text: "Ein voller Eimer hat mehr Wasser als ein voller Becher."
                say: "Stimmt das? Ein voller Eimer hat mehr Wasser als ein voller Becher."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Zwei gleiche Tassen. Eine ist leer, eine halb voll. In welcher ist mehr?"
                say: "Zwei gleiche Tassen. Eine ist leer, die andere halb voll. In welcher ist mehr Tee?"
                options: ["in der halb vollen", "in der leeren", "gleich viel"]
                answer: "in der halb vollen"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo passt mehr hinein: in ein Aquarium oder in ein Glas?"
            say: "Wo passt mehr Wasser hinein: in ein Aquarium oder in ein Glas?"
            options: ["in ein Aquarium", "in ein Glas", "gleich viel"]
            answer: "in ein Aquarium"
          - id: l1-c2
            type: multiple_choice
            text: "Im Becher ist Kakao bis zur Mitte. Wie ist der Becher?"
            say: "Im Becher ist Kakao genau bis zur Mitte. Wie ist der Becher?"
            options: ["halb voll", "voll", "leer"]
            answer: "halb voll"
          - id: l1-c3
            type: true_false
            text: "In einen Löffel passt mehr als in einen Eimer."
            say: "Stimmt das? In einen Löffel passt mehr als in einen Eimer."
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Wo passt weniger hinein: in ein Glas oder in einen Eimer?"
            say: "Wo passt weniger Wasser hinein: in ein Glas oder in einen Eimer?"
            options: ["in ein Glas", "in einen Eimer", "gleich viel"]
            answer: "in ein Glas"
          - id: l1-c5
            type: multiple_choice
            text: "Die Tasse ist bis ganz oben mit Tee gefüllt. Wie ist sie?"
            say: "Die Tasse ist bis ganz oben mit Tee gefüllt. Wie ist sie?"
            options: ["voll", "halb voll", "leer"]
            answer: "voll"
          - id: l1-c6
            type: true_false
            text: "Zwei gleiche Tassen sind beide voll. In beiden ist gleich viel."
            say: "Zwei gleiche Tassen sind beide voll. Stimmt das: In beiden ist gleich viel?"
            answer: true

  - n: 2
    title: { de: "Umfüllen und vergleichen", en: "Pouring and comparing" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Im Glas ist nichts mehr. Wie ist es?"
            say: "Im Glas ist nichts mehr drin. Wie ist es?"
            options: ["leer", "voll"]
            answer: "leer"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist mehr Wasser: 5 volle Becher oder 3 volle Becher?"
            say: "Was ist mehr Wasser: fünf volle Becher oder drei volle Becher?"
            options: ["5 Becher", "3 Becher"]
            answer: "5 Becher"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Kanne: 4 Becher · Flasche: 6 Becher"
            say: "Lena füllt Becher mit Wasser aus der Kanne. Die Kanne füllt vier Becher. Die Flasche füllt sechs Becher. Mehr Becher heißt: Es passt mehr hinein. In die Flasche passt mehr."
          - text: "Umfüllen: Das Glas läuft über."
            say: "Du kannst auch umfüllen. Ben gießt die volle Tasse in ein leeres Glas. Das Glas läuft über. Also passt in die Tasse mehr als in das Glas."
          - text: "Hoch heißt nicht immer mehr!"
            say: "Ein hohes, schmales Glas und eine breite Schüssel. Mia gießt das volle Glas in die Schüssel. Die Schüssel wird nicht einmal halb voll. In die breite Schüssel passt mehr, obwohl sie niedriger ist."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tim gießt einen vollen Becher in eine leere Tasse. Die Tasse läuft über. Wo passt mehr hinein?"
                say: "Tim gießt einen vollen Becher in eine leere Tasse. Die Tasse läuft über. Wo passt mehr hinein?"
                options: ["in den Becher", "in die Tasse", "gleich viel"]
                answer: "in den Becher"
                hints:
                  - "Die Tasse läuft über: Es war zu viel für sie."
                  - "Im Becher war mehr, als in die Tasse passt."
                  - "in den Becher."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Der Topf füllt 8 Becher, die Schüssel 5 Becher. Wo passt mehr hinein?"
                say: "Mama füllt Becher mit Wasser. Der Topf füllt acht Becher, die Schüssel fünf Becher. Wo passt mehr hinein?"
                options: ["in den Topf", "in die Schüssel", "gleich viel"]
                answer: "in den Topf"
                hints:
                  - "Mehr Becher heißt: Es passt mehr hinein."
                  - "Acht ist mehr als fünf."
                  - "in den Topf."
              - id: l2-f3
                type: true_false
                text: "Ein Glas ist höher als eine Schüssel. Also passt in das Glas sicher mehr."
                say: "Ein Glas ist höher als eine Schüssel. Stimmt das: In das Glas passt sicher mehr?"
                answer: false
                feedback:
                  "true": "Hoch heißt nicht immer mehr. Eine breite Schüssel kann mehr fassen als ein hohes, schmales Glas."
                hints:
                  - "Eine Schüssel ist oft viel breiter als ein Glas."
                  - "Auch die Breite zählt."
                  - "Nein, nicht sicher."
              - id: l2-f4
                type: multiple_choice
                text: "Lea gießt die volle Flasche in den leeren Krug. Der Krug wird genau voll. Was stimmt?"
                say: "Lea gießt die volle Flasche in den leeren Krug. Der Krug wird genau voll. Was stimmt?"
                options: ["In beide passt gleich viel.", "In die Flasche passt mehr.", "In den Krug passt mehr."]
                answer: "In beide passt gleich viel."
                hints:
                  - "Nichts läuft über und nichts bleibt leer."
                  - "Genau voll heißt: genau gleich viel."
                  - "In beide passt gleich viel."
              - id: l2-f5
                type: multiple_choice
                text: "Die Gießkanne füllt 10 Becher, der Eimer 12 Becher. Wo passt weniger hinein?"
                say: "Opa füllt Becher. Die Gießkanne füllt zehn Becher, der Eimer zwölf Becher. Wo passt weniger hinein?"
                options: ["in die Gießkanne", "in den Eimer", "gleich viel"]
                answer: "in die Gießkanne"
                hints:
                  - "Weniger Becher heißt: Es passt weniger hinein."
                  - "Zehn ist weniger als zwölf."
                  - "in die Gießkanne."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ali gießt ein volles Glas in einen leeren Becher. Der Becher wird nur halb voll. Wo passt mehr hinein?"
                say: "Ali gießt ein volles Glas in einen leeren Becher. Der Becher wird nur halb voll. Wo passt mehr hinein?"
                options: ["in den Becher", "in das Glas", "gleich viel"]
                answer: "in den Becher"
                hints: ["Im Becher ist noch Platz."]
              - id: l2-s2
                type: multiple_choice
                text: "Die Kanne füllt 3 Tassen, die Flasche 7 Tassen. Wo passt mehr hinein?"
                say: "Die Kanne füllt drei Tassen, die Flasche sieben Tassen. Wo passt mehr hinein?"
                options: ["in die Flasche", "in die Kanne", "gleich viel"]
                answer: "in die Flasche"
                hints: ["Mehr Tassen heißt: Es passt mehr hinein."]
              - id: l2-s3
                type: true_false
                text: "Ein breiter Topf kann mehr fassen als ein hohes, schmales Glas."
                say: "Stimmt das? Ein breiter Topf kann mehr fassen als ein hohes, schmales Glas."
                answer: true
                hints: ["Hoch heißt nicht immer mehr."]
              - id: l2-s4
                type: multiple_choice
                text: "Ben gießt den vollen Becher in die leere Tasse. Die Tasse wird genau voll. Was stimmt?"
                say: "Ben gießt den vollen Becher in die leere Tasse. Die Tasse wird genau voll. Was stimmt?"
                options: ["In beide passt gleich viel.", "In den Becher passt mehr.", "In die Tasse passt mehr."]
                answer: "In beide passt gleich viel."
                hints: ["Nichts läuft über."]
              - id: l2-s5
                type: multiple_choice
                text: "Das Aquarium füllt 20 Eimer, die Badewanne 15 Eimer. Wo passt weniger hinein?"
                say: "Das Aquarium füllt zwanzig Eimer, die Badewanne fünfzehn Eimer. Wo passt weniger hinein?"
                options: ["in die Badewanne", "in das Aquarium", "gleich viel"]
                answer: "in die Badewanne"
                hints: ["Weniger Eimer heißt: Es passt weniger hinein."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mia gießt eine volle Tasse in einen leeren Eierbecher. Der Eierbecher läuft über. Wo passt mehr hinein?"
                say: "Mia gießt eine volle Tasse in einen leeren Eierbecher. Der Eierbecher läuft über. Wo passt mehr hinein?"
                options: ["in die Tasse", "in den Eierbecher", "gleich viel"]
                answer: "in die Tasse"
              - id: l2-n2
                type: multiple_choice
                text: "Der Krug füllt 6 Gläser, die Kanne 6 Gläser. Wo passt mehr hinein?"
                say: "Der Krug füllt sechs Gläser, die Kanne auch sechs Gläser. Wo passt mehr hinein?"
                options: ["gleich viel", "in den Krug", "in die Kanne"]
                answer: "gleich viel"
              - id: l2-n3
                type: true_false
                text: "Das höhere Gefäß fasst immer mehr."
                say: "Stimmt das? Das höhere Gefäß fasst immer mehr."
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Lisa gießt die volle Schüssel in den leeren Topf. Im Topf ist noch viel Platz. Was stimmt?"
                say: "Lisa gießt die volle Schüssel in den leeren Topf. Im Topf ist danach noch viel Platz. Was stimmt?"
                options: ["In den Topf passt mehr.", "In die Schüssel passt mehr.", "In beide passt gleich viel."]
                answer: "In den Topf passt mehr."
              - id: l2-n5
                type: multiple_choice
                text: "Die Flasche füllt 4 Becher, der Krug 9 Becher. Wo passt weniger hinein?"
                say: "Die Flasche füllt vier Becher, der Krug neun Becher. Wo passt weniger hinein?"
                options: ["in die Flasche", "in den Krug", "gleich viel"]
                answer: "in die Flasche"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: compare
            type: multiple_choice
            text: "Wo passt mehr hinein: in einen Kochtopf oder in eine Tasse?"
            say: "Wo passt mehr Wasser hinein: in einen Kochtopf oder in eine Tasse?"
            options: ["in einen Kochtopf", "in eine Tasse", "gleich viel"]
            answer: "in einen Kochtopf"
          - id: l2-c2
            part: fill
            type: multiple_choice
            text: "Im Eimer ist Wasser bis ganz oben. Wie ist er?"
            say: "Im Eimer ist Wasser bis ganz oben. Wie ist er?"
            options: ["voll", "halb voll", "leer"]
            answer: "voll"
          - id: l2-c3
            part: pour
            type: multiple_choice
            text: "Die Kanne füllt 5 Becher, die Flasche 8 Becher. Wo passt mehr hinein?"
            say: "Die Kanne füllt fünf Becher, die Flasche acht Becher. Wo passt mehr hinein?"
            options: ["in die Flasche", "in die Kanne", "gleich viel"]
            answer: "in die Flasche"
          - id: l2-c4
            part: pour
            type: multiple_choice
            text: "Paul gießt den vollen Eimer in die leere Gießkanne. Die Gießkanne läuft über. Wo passt mehr hinein?"
            say: "Paul gießt den vollen Eimer in die leere Gießkanne. Die Gießkanne läuft über. Wo passt mehr hinein?"
            options: ["in den Eimer", "in die Gießkanne", "gleich viel"]
            answer: "in den Eimer"
          - id: l2-c5
            part: pour
            type: true_false
            text: "Jonas gießt ein volles, hohes Glas in eine leere, breite Schüssel. Die Schüssel wird nur halb voll. In das Glas passt mehr."
            say: "Jonas gießt ein volles, hohes Glas in eine leere, breite Schüssel. Die Schüssel wird nur halb voll. Stimmt das: In das Glas passt mehr?"
            answer: false
          - id: l2-c6
            part: compare
            type: multiple_choice
            text: "Wo passt mehr hinein: in ein Waschbecken oder in einen Becher?"
            say: "Wo passt mehr Wasser hinein: in ein Waschbecken oder in einen Becher?"
            options: ["in ein Waschbecken", "in einen Becher", "gleich viel"]
            answer: "in ein Waschbecken"
          - id: l2-c7
            part: compare
            type: multiple_choice
            text: "Wo passt weniger hinein: in eine Gießkanne oder in ein Planschbecken?"
            say: "Wo passt weniger Wasser hinein: in eine Gießkanne oder in ein Planschbecken?"
            options: ["in eine Gießkanne", "in ein Planschbecken", "gleich viel"]
            answer: "in eine Gießkanne"
          - id: l2-c8
            part: compare
            type: true_false
            text: "In eine Badewanne passt mehr Wasser als in ein Glas."
            say: "Stimmt das? In eine Badewanne passt mehr Wasser als in ein Glas."
            answer: true
          - id: l2-c9
            part: compare
            type: true_false
            text: "In einen Becher passt mehr als in einen Kochtopf."
            say: "Stimmt das? In einen Becher passt mehr als in einen Kochtopf."
            answer: false
          - id: l2-c10
            part: compare
            type: multiple_choice
            text: "Wo passt am meisten Wasser hinein?"
            say: "Wo passt am meisten Wasser hinein?"
            options: ["in einen Eimer", "in eine Tasse", "in einen Löffel"]
            answer: "in einen Eimer"
          - id: l2-c11
            part: compare
            type: multiple_choice
            text: "Wo passt am wenigsten Wasser hinein?"
            say: "Wo passt am wenigsten Wasser hinein?"
            options: ["in einen Eierbecher", "in eine Flasche", "in eine Badewanne"]
            answer: "in einen Eierbecher"
          - id: l2-c12
            part: fill
            type: multiple_choice
            text: "Die Gießkanne ist bis zur Mitte mit Wasser gefüllt. Wie ist sie?"
            say: "Die Gießkanne ist genau bis zur Mitte mit Wasser gefüllt. Wie ist sie?"
            options: ["halb voll", "voll", "leer"]
            answer: "halb voll"
          - id: l2-c13
            part: fill
            type: multiple_choice
            text: "Lena hat ihren Kakao ganz ausgetrunken. Wie ist die Tasse jetzt?"
            say: "Lena hat ihren Kakao ganz ausgetrunken. Wie ist die Tasse jetzt?"
            options: ["leer", "halb voll", "voll"]
            answer: "leer"
          - id: l2-c14
