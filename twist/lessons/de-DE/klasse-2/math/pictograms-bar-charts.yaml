# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.pictograms-bar-charts
skill: math.data.pictograms-bar-charts
curriculum: de-DE
language: de
title:
  de: Bilddiagramme und Säulendiagramme
  en: Pictograms and bar charts
summary: >
  Lesson 1 reads Bilddiagramme where a picture stands for one child or
  for two (a picture = 2 Kinder: count in twos), and turns a Strichliste
  into a row of the Bilddiagramm; lesson 2 reads Säulendiagramme on a scale in ones
  and in twos (read the number on the scale, do not count the lines),
  finds the chart that fits a Strichliste, and ends with the skill check.
  Drawing the bars or placing the pictures yourself waits for a drawing
  or drag task.
metadata:
  year: klasse-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.tally]
  also_practises: [math.data.tally]
  vocabulary: { de: [Bilddiagramm, Säulendiagramm, Säule, Skala, Zweierschritte, am meisten, am wenigsten] }
  forms: [picture, text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  parts:
    - { id: read-picto, what: { de: "Bilddiagramme ablesen, auch wenn ein Bild für 2 steht", en: "reading pictograms, also when a symbol stands for 2" } }
    - { id: read-bar, what: { de: Säulendiagramme an der Skala ablesen, en: reading bar charts from the scale } }
    - { id: compare, what: { de: "Daten vergleichen und sagen, wo es am meisten oder am wenigsten ist", en: comparing data and saying which is most or least } }
    - { id: show, what: { de: Daten aus einer Strichliste als Diagramm darstellen, en: showing data from a tally chart as a diagram } }
  misconceptions:
    - id: symbol-is-one
      what: Counts each picture as one when the key says a picture = 2
      addressed: lesson 1 Learn counts a diagram with a picture = 2 Kinder in twos; l1-f3 (with feedback), l1-s2, l1-s4, l1-n1, l1-n4 and l2-c4 use a key of 2 and offer the number of pictures
    - id: counts-lines
      what: Reads a Säulendiagramm by counting the lines instead of reading the scale, so a scale in twos gives half the value
      addressed: lesson 2 Learn reads a scale in twos; l2-f3 (with feedback), l2-s3, l2-n1 and l2-c3 use a scale in twos and offer half the value
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bilddiagramme", en: "Pictograms" }
    goal:
      de: "Lies Bilddiagramme ab, auch wenn ein Bild für 2 Kinder steht, und mach aus einer Strichliste ein Bilddiagramm."
      en: "Read picture charts, even when one picture stands for 2 children, and turn a tally into a picture chart."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Kinder haben einen Hund?"
            say: "Die Klasse hat nach Haustieren gefragt. Wie viele Kinder haben einen Hund?"
            show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 4]] }
            options: ["6", "4", "2"]
            answer: "6"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welche Strichliste zeigt 8?"
            say: "Welche Strichliste zeigt acht?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 8]], key: "8" }
              - { drawn: bar-chart, tally: true, rows: [["", 3]], key: "3" }
              - { drawn: bar-chart, tally: true, rows: [["", 7]], key: "7" }
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hund, Katze oder Pferd?"
            say: "Die Klasse hat gefragt: Welches Tier magst du am liebsten? Was glaubst du: Welches Tier mögen die meisten Kinder?"
            show: { objects: [dog, cat] }
          - text: "Lieblingstiere"
            say: "Die meisten mögen Katzen! Das zeigt dieses Bilddiagramm. Jedes Bild steht für ein Kind. Vier Kinder mögen Hunde am liebsten, sechs mögen Katzen und zwei mögen Pferde."
            show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["Hund", 4], ["Katze", 6], ["Pferd", 2]] }
          - text: "Lieblingstiere: Ein Bild steht für 2 Kinder."
            say: "Lies immer zuerst, was unten steht. Hier steht ein Bild für zwei Kinder. Dann zählst du in Zweierschritten. Hund: zwei, vier. Vier Kinder. Katze: zwei, vier, sechs. Sechs Kinder."
            show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Hund", 4], ["Katze", 6], ["Pferd", 2]] }
          - text: "Strichliste: Rot 3, Blau 5"
            say: "Ein Bilddiagramm kannst du auch selbst machen. In der Strichliste haben drei Kinder Rot und fünf Kinder Blau."
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 3], ["Blau", 5]] }
          - text: "Bilddiagramm: Rot 3, Blau 5"
            say: "Für jedes Kind malst du ein Bild. Bei Rot sind es drei Bilder, bei Blau fünf Bilder."
            show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["Rot", 3], ["Blau", 5]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie kommst du zur Schule? Wie viele Kinder fahren mit dem Bus?"
                say: "Die Klasse hat gefragt: Wie kommst du zur Schule? Wie viele Kinder fahren mit dem Bus?"
                show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["zu Fuß", 7], ["Bus", 4], ["Auto", 3], ["Fahrrad", 5]] }
                options: ["4", "7", "5"]
                answer: "4"
                hints:
                  - "Such die Zeile mit Bus."
                  - "Jedes Bild ist ein Kind. Zähl die Bilder."
                  - "4 Kinder."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie kommen die meisten Kinder zur Schule?"
                say: "Wie kommen die meisten Kinder zur Schule?"
                show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["zu Fuß", 7], ["Bus", 4], ["Auto", 3], ["Fahrrad", 5]] }
                options: ["zu Fuß", "mit dem Fahrrad", "mit dem Bus", "mit dem Hubschrauber"]
                answer: "zu Fuß"
                feedback:
                  "mit dem Hubschrauber": "Das wäre ein Spaß! Aber im Diagramm gibt es keinen Hubschrauber. Such die Zeile mit den meisten Bildern."
                hints:
                  - "Die meisten: die Zeile mit den meisten Bildern."
                  - "Zu Fuß 7, Fahrrad 5, Bus 4."
                  - "Zu Fuß."
              - id: l1-f3
                type: multiple_choice
                text: "Lieblingsobst: Wie viele Kinder mögen Äpfel am liebsten?"
                say: "Schau genau, was unten steht. Wie viele Kinder mögen Äpfel am liebsten?"
                show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Apfel", 6], ["Banane", 4], ["Kiwi", 2]] }
                options: ["6", "3", "5"]
                answer: "6"
                feedback:
                  "3": "Ein Bild steht hier für 2 Kinder. Zähl in Zweierschritten: 2, 4, 6."
                hints:
                  - "Unten steht: Ein Bild steht für 2 Kinder."
                  - "Zähl in Zweierschritten: 2, 4, ..."
                  - "6 Kinder."
              - id: l1-f4
                type: true_false
                text: "5 Kinder fahren mit dem Fahrrad."
                say: "Stimmt das? Fünf Kinder fahren mit dem Fahrrad."
                show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["zu Fuß", 7], ["Bus", 4], ["Auto", 3], ["Fahrrad", 5]] }
                answer: true
                hints:
                  - "Such die Zeile mit Fahrrad."
                  - "Zähl die Bilder in dieser Zeile."
                  - "Ja, das sind 5 Kinder."
              - id: l1-f5
                type: multiple_choice
                text: "Mach aus der Strichliste ein Bilddiagramm. Ein Bild steht für 1 Kind. Wie viele Bilder malst du bei Katze?"
                say: "Hier ist eine Strichliste. Du machst daraus ein Bilddiagramm, ein Bild steht für ein Kind. Wie viele Bilder malst du bei Katze?"
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 3], ["Katze", 5]] }
                options: ["5", "3", "8"]
                answer: "5"
                hints:
                  - "Wie viele Striche hat Katze in der Strichliste?"
                  - "Katze hat ein Fünferbündel."
                  - "5 Bilder."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Kinder kommen mit dem Auto zur Schule?"
                say: "Wie viele Kinder kommen mit dem Auto zur Schule?"
                show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["zu Fuß", 7], ["Bus", 4], ["Auto", 3], ["Fahrrad", 5]] }
                options: ["3", "4", "7"]
                answer: "3"
                hints: ["Zähl die Bilder in der Zeile Auto."]
              - id: l1-s2
                type: multiple_choice
                text: "Lieblingsobst: Wie viele Kinder mögen Bananen am liebsten?"
                say: "Wie viele Kinder mögen Bananen am liebsten?"
                show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Apfel", 6], ["Banane", 4], ["Kiwi", 2]] }
                options: ["4", "2", "3"]
                answer: "4"
                hints: ["Ein Bild steht für 2 Kinder."]
              - id: l1-s3
                type: text_input
                text: "Wie viele Kinder mehr kommen zu Fuß als mit dem Auto?"
                say: "Wie viele Kinder mehr kommen zu Fuß als mit dem Auto? Tipp die Zahl ein."
                show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["zu Fuß", 7], ["Bus", 4], ["Auto", 3], ["Fahrrad", 5]] }
                answer: "4"
                hints: ["Zu Fuß 7, Auto 3."]
              - id: l1-s4
                type: true_false
                text: "Lieblingsobst: 2 Kinder mögen Kiwis am liebsten."
                say: "Stimmt das? Zwei Kinder mögen Kiwis am liebsten."
                show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Apfel", 6], ["Banane", 4], ["Kiwi", 2]] }
                answer: true
                hints: ["Bei Kiwi ist nur ein Bild. Für wie viele Kinder steht ein Bild?"]
              - id: l1-s5
                type: multiple_choice
                text: "Mach aus der Strichliste ein Bilddiagramm. Ein Bild steht für 1 Kind. Wie viele Bilder malst du bei Rot?"
                say: "Hier ist eine Strichliste. Du machst daraus ein Bilddiagramm, ein Bild steht für ein Kind. Wie viele Bilder malst du bei Rot?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 4], ["Gelb", 2]] }
                options: ["4", "2", "5"]
                answer: "4"
                hints: ["Für jeden Strich ein Bild."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Blätter hat Lea gesammelt?"
                say: "Die Kinder haben bunte Blätter gesammelt. Wie viele Blätter hat Lea gesammelt?"
                show: { drawn: bar-chart, pictogram_object: leaf, key: 2, rows: [["Lea", 8], ["Tim", 4], ["Mia", 6]] }
                options: ["8", "4", "6"]
                answer: "8"
              - id: l1-n2
                type: multiple_choice
                text: "Wer hat die wenigsten Blätter gesammelt?"
                say: "Wer hat die wenigsten Blätter gesammelt?"
                show: { drawn: bar-chart, pictogram_object: leaf, key: 2, rows: [["Lea", 8], ["Tim", 4], ["Mia", 6]] }
                options: ["Tim", "Mia", "Lea"]
                answer: "Tim"
              - id: l1-n3
                type: text_input
                text: "Wie viele Blätter haben alle drei Kinder zusammen gesammelt?"
                say: "Wie viele Blätter haben alle drei Kinder zusammen gesammelt? Tipp die Zahl ein."
                show: { drawn: bar-chart, pictogram_object: leaf, key: 2, rows: [["Lea", 8], ["Tim", 4], ["Mia", 6]] }
                answer: "18"
                difficulty: stretch
              - id: l1-n4
                type: true_false
                text: "Mia hat 3 Blätter gesammelt."
                say: "Stimmt das? Mia hat drei Blätter gesammelt."
                show: { drawn: bar-chart, pictogram_object: leaf, key: 2, rows: [["Lea", 8], ["Tim", 4], ["Mia", 6]] }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ben hat 10 Blätter gesammelt. Ein Bild steht für 2 Blätter. Wie viele Bilder bekommt Ben?"
                say: "Ben hat zehn Blätter gesammelt. Ein Bild steht für zwei Blätter. Wie viele Bilder bekommt Ben im Bilddiagramm?"
                options: ["5", "10", "2"]
                answer: "5"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Tore hat Team Rot geschossen?"
            say: "Wie viele Tore hat Team Rot geschossen?"
            show: { drawn: bar-chart, pictogram_object: ball, key: 1, rows: [["Team Rot", 6], ["Team Blau", 4]] }
            options: ["6", "4", "3"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Lieblingssaft: Wie viele Kinder mögen Orangensaft am liebsten?"
            say: "Wie viele Kinder mögen Orangensaft am liebsten?"
            show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Apfel", 8], ["Orange", 4]] }
            options: ["4", "2", "8"]
            answer: "4"
          - id: l1-c3
            type: true_false
            text: "Team Blau hat 2 Tore weniger geschossen als Team Rot."
            say: "Stimmt das? Team Blau hat zwei Tore weniger geschossen als Team Rot."
            show: { drawn: bar-chart, pictogram_object: ball, key: 1, rows: [["Team Rot", 6], ["Team Blau", 4]] }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Max und Lotta haben Blätter gesammelt. Wer hat mehr Blätter gesammelt?"
            say: "Max und Lotta haben Blätter gesammelt. Wer hat mehr Blätter gesammelt?"
            show: { drawn: bar-chart, pictogram_object: leaf, key: 1, rows: [["Max", 6], ["Lotta", 4]] }
            options: ["Max", "Lotta"]
            answer: "Max"
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele Kinder spielen am liebsten Verstecken?"
            say: "Wie viele Kinder spielen am liebsten Verstecken?"
            show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Fangen", 6], ["Verstecken", 10]] }
            options: ["10", "5", "8"]
            answer: "10"
          - id: l1-c6
            type: true_false
            text: "3 Kinder spielen am liebsten Fangen."
            say: "Stimmt das? Drei Kinder spielen am liebsten Fangen."
            show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Fangen", 6], ["Verstecken", 10]] }
            answer: false

  - n: 2
    title: { de: "Säulendiagramme", en: "Bar charts" }
    goal:
      de: "Lies Säulendiagramme an der Skala ab, auch in Zweierschritten, so wie bei den Lieblingstieren."
      en: "Read bar charts from the scale, also in steps of two, like the chart of favourite animals."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Kinder mögen Blau am liebsten?"
            say: "Wie viele Kinder mögen Blau am liebsten?"
            show: { drawn: bar-chart, pictogram_object: child, key: 1, rows: [["Rot", 3], ["Blau", 5]] }
            options: ["5", "3"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ein Bild steht für 2 Kinder. Wie viele Kinder mögen Rot am liebsten?"
            say: "Ein Bild steht für zwei Kinder. Wie viele Kinder mögen Rot am liebsten?"
            show: { drawn: bar-chart, pictogram_object: child, key: 2, rows: [["Rot", 4], ["Blau", 6]] }
            options: ["4", "2", "6"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Welche Säule gewinnt?"
            say: "Hier sind die Lieblingstiere als Säulen gezeichnet. Was glaubst du: Welche Säule gehört zu dem Tier, das die meisten Kinder mögen?"
            show: { drawn: bar-chart, rows: [["Hund", 4], ["Katze", 6], ["Pferd", 2]] }
          - text: "Lieblingstiere"
            say: "Die höchste Säule: Katze! Das ist ein Säulendiagramm. Für jedes Tier gibt es eine Säule. Links steht die Skala mit den Zahlen. Die Säule für Katze geht bis zur Sechs: Sechs Kinder mögen Katzen am liebsten."
            show: { drawn: bar-chart, rows: [["Hund", 4], ["Katze", 6], ["Pferd", 2]] }
          - text: "Die Skala geht in Zweierschritten."
            say: "Hier geht die Skala in Zweierschritten: null, zwei, vier, sechs und so weiter. Zähl nicht die Linien. Lies die Zahl an der Skala ab. Die Säule für Blau geht bis zwölf."
            show: { drawn: bar-chart, rows: [["Rot", 8], ["Blau", 12], ["Grün", 6]], step: 2 }
          - text: "Ball 5, Puppe 3"
            say: "Aus einer Strichliste machst du ein Säulendiagramm. Ball hat fünf Striche, also geht die Säule bis fünf. Puppe hat drei, also geht ihre Säule bis drei."
            show: { drawn: bar-chart, tally: true, rows: [["Ball", 5], ["Puppe", 3]] }
          - text: "Wusstest du? In Deutschland gibt es mehr Katzen als Hunde."
            say: "Wusstest du? In Deutschland leben in den Familien mehr Katzen als Hunde. Ein Säulendiagramm von allen Haustieren hätte also eine höhere Säule für Katzen."
            show: { objects: [cat, dog] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Kinder tanzen gern?"
                say: "Das Säulendiagramm zeigt, welchen Sport die Kinder gern machen. Wie viele Kinder tanzen gern?"
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Tanzen", 4], ["Schwimmen", 5]] }
                options: ["4", "5", "7"]
                answer: "4"
                hints:
                  - "Such die Säule für Tanzen."
                  - "Geh von oben an der Säule waagerecht nach links zur Skala."
                  - "4 Kinder."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welchen Sport mögen die meisten Kinder?"
                say: "Welchen Sport mögen die meisten Kinder?"
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Tanzen", 4], ["Schwimmen", 5]] }
                options: ["Fußball", "Schwimmen", "Tanzen"]
                answer: "Fußball"
                hints:
                  - "Die meisten: die höchste Säule."
                  - "Welche Säule geht am weitesten nach oben?"
                  - "Fußball."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Kinder mögen Pflaumen am liebsten?"
                say: "Schau dir die Skala genau an. Wie viele Kinder mögen Pflaumen am liebsten?"
                show: { drawn: bar-chart, rows: [["Apfel", 10], ["Birne", 6], ["Pflaume", 14]], step: 2 }
                options: ["14", "7", "12"]
                answer: "14"
                feedback:
                  "7": "Die Skala geht in Zweierschritten. Lies die Zahl an der Skala ab, zähl nicht die Linien."
                hints:
                  - "Die Skala geht in Zweierschritten."
                  - "Die Säule für Pflaume geht über die 12 hinaus bis zur nächsten Zahl."
                  - "14 Kinder."
              - id: l2-f4
                type: true_false
                text: "Fußball mögen 3 Kinder mehr als Tanzen."
                say: "Stimmt das? Fußball mögen drei Kinder mehr als Tanzen."
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Tanzen", 4], ["Schwimmen", 5]] }
                answer: true
                hints:
                  - "Lies beide Säulen ab."
                  - "Fußball 7, Tanzen 4. Rechne 7 − 4."
                  - "Ja, das sind 3 mehr."
              - id: l2-f5
                type: image_multiple_choice
                text: "Hund 3, Katze 5. Welches Säulendiagramm passt?"
                say: "In der Strichliste haben drei Kinder einen Hund und fünf eine Katze. Welches Säulendiagramm passt?"
                options:
                  - { drawn: bar-chart, rows: [["Hund", 3], ["Katze", 5]], key: "3-5" }
                  - { drawn: bar-chart, rows: [["Hund", 5], ["Katze", 3]], key: "5-3" }
                  - { drawn: bar-chart, rows: [["Hund", 3], ["Katze", 3]], key: "3-3" }
                answer: "3-5"
                hints:
                  - "Die Säule für Katze muss höher sein als die für Hund."
                  - "Hund bis 3, Katze bis 5."
                  - "Das Diagramm mit Hund 3 und Katze 5."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Kinder waren am Mittwoch in der Bücherei?"
                say: "Das Säulendiagramm zeigt, wie viele Kinder in der Schulbücherei waren. Wie viele waren am Mittwoch da?"
                show: { drawn: bar-chart, rows: [["Mo", 8], ["Di", 4], ["Mi", 6]] }
                options: ["6", "4", "8"]
                answer: "6"
                hints: ["Mi heißt Mittwoch. Lies die Säule an der Skala ab."]
              - id: l2-s2
                type: multiple_choice
                text: "An welchem Tag waren die wenigsten Kinder da?"
                say: "An welchem Tag waren die wenigsten Kinder in der Bücherei?"
                show: { drawn: bar-chart, rows: [["Mo", 8], ["Di", 4], ["Mi", 6]] }
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
                keep_order: true
                hints: ["Die wenigsten: die niedrigste Säule."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Kinder mögen Gelb am liebsten?"
                say: "Wie viele Kinder mögen Gelb am liebsten?"
                show: { drawn: bar-chart, rows: [["Rot", 12], ["Gelb", 8], ["Grün", 16]], step: 2 }
                options: ["8", "4", "10"]
                answer: "8"
                hints: ["Die Skala geht in Zweierschritten. Lies die Zahl an der Skala ab."]
              - id: l2-s4
                type: true_false
                text: "Am Montag waren 4 Kinder mehr da als am Dienstag."
                say: "Stimmt das? Am Montag waren vier Kinder mehr in der Bücherei als am Dienstag."
                show: { drawn: bar-chart, rows: [["Mo", 8], ["Di", 4], ["Mi", 6]] }
                answer: true
                hints: ["Montag 8, Dienstag 4."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Ball 6, Puppe 2. Welches Säulendiagramm passt?"
                say: "In der Strichliste mögen sechs Kinder Bälle und zwei Kinder Puppen. Welches Säulendiagramm passt?"
                options:
                  - { drawn: bar-chart, rows: [["Ball", 2], ["Puppe", 6]], key: "2-6" }
                  - { drawn: bar-chart, rows: [["Ball", 6], ["Puppe", 2]], key: "6-2" }
                  - { drawn: bar-chart, rows: [["Ball", 6], ["Puppe", 6]], key: "6-6" }
                answer: "6-2"
                hints: ["Die Säule für Ball muss bis 6 gehen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
