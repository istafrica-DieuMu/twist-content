# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.pictograms-bar-charts
skill: math.data.pictograms-bar-charts
curriculum: de-DE
language: de
title:
  de: Bilddiagramme und Säulendiagramme
  en: Pictograms and bar charts
summary: >
  Lesson 1 reads Bilddiagramme where a dot stands for one child or for
  two (● = 2 Kinder: count in twos), and turns a Strichliste into a row
  of the Bilddiagramm; lesson 2 reads Säulendiagramme on a scale in ones
  and in twos (read the number on the scale, do not count the lines),
  finds the chart that fits a Strichliste, and ends with the skill check.
  Drawing the bars or placing the pictures yourself waits for a drawing
  or drag task.
metadata:
  year: klasse-2
  topic: { de: Daten, en: Data }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.tally]
  also_practises: [math.data.tally]
  vocabulary: { de: [Bilddiagramm, Säulendiagramm, Säule, Skala, Zweierschritte, am meisten, am wenigsten] }
  forms: [text, audio, drawn]
  drawn: [bar-chart]
  facets: []
  misconceptions:
    - id: symbol-is-one
      what: Counts each picture as one when the key says ● = 2
      addressed: lesson 1 Learn counts a ● = 2 Kinder diagram in twos; l1-f3 (with feedback), l1-s2, l1-s4, l1-n1, l1-n4 and l2-c4 use a key of 2 and offer the number of dots
    - id: counts-lines
      what: Reads a Säulendiagramm by counting the lines instead of reading the scale, so a scale in twos gives half the value
      addressed: lesson 2 Learn reads a scale in twos; l2-f3 (with feedback), l2-s3, l2-n1 and l2-c3 use a scale in twos and offer half the value
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Bilddiagramme", en: "Pictograms" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Kinder haben einen Hund?"
            say: "Die Klasse hat nach Haustieren gefragt. Wie viele Kinder haben einen Hund?"
            show: { drawn: bar-chart, tally: true, rows: [["Hund", 6], ["Katze", 4]] }
            options: ["6", "4", "2"]
            answer: "6"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welche Strichliste zeigt 8?"
            say: "Welche Strichliste zeigt acht?"
            options:
              - { drawn: bar-chart, tally: true, rows: [["", 8]], key: "8" }
              - { drawn: bar-chart, tally: true, rows: [["", 3]], key: "3" }
              - { drawn: bar-chart, tally: true, rows: [["", 7]], key: "7" }
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lieblingstiere\nHund: ● ● ● ●\nKatze: ● ● ● ● ● ●\nPferd: ● ●\n● = 1 Kind"
            say: "Das ist ein Bilddiagramm. Jeder Punkt steht für ein Kind. Vier Kinder mögen Hunde am liebsten, sechs mögen Katzen und zwei mögen Pferde."
          - text: "Lieblingstiere\nHund: ● ●\nKatze: ● ● ●\nPferd: ●\n● = 2 Kinder"
            say: "Lies immer zuerst, was unten steht. Hier steht ein Punkt für zwei Kinder. Dann zählst du in Zweierschritten. Hund: zwei, vier. Vier Kinder. Katze: zwei, vier, sechs. Sechs Kinder."
          - text: "Rot: ● ● ●\nBlau: ● ● ● ● ●\n● = 1 Kind"
            say: "Ein Bilddiagramm kannst du auch selbst machen. In der Strichliste haben drei Kinder Rot und fünf Kinder Blau. Für jedes Kind malst du einen Punkt."
            show: { drawn: bar-chart, tally: true, rows: [["Rot", 3], ["Blau", 5]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie kommst du zur Schule?\nzu Fuß: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nAuto: ● ● ●\nFahrrad: ● ● ● ● ●\n● = 1 Kind\nWie viele Kinder fahren mit dem Bus?"
                say: "Die Klasse hat gefragt: Wie kommst du zur Schule? Wie viele Kinder fahren mit dem Bus?"
                options: ["4", "7", "5"]
                answer: "4"
                hints:
                  - "Such die Zeile mit Bus."
                  - "Jeder Punkt ist ein Kind. Zähl die Punkte."
                  - "4 Kinder."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie kommst du zur Schule?\nzu Fuß: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nAuto: ● ● ●\nFahrrad: ● ● ● ● ●\n● = 1 Kind\nWie kommen die meisten Kinder zur Schule?"
                say: "Wie kommen die meisten Kinder zur Schule?"
                options: ["zu Fuß", "mit dem Fahrrad", "mit dem Bus"]
                answer: "zu Fuß"
                hints:
                  - "Die meisten: die Zeile mit den meisten Punkten."
                  - "Zu Fuß 7, Fahrrad 5, Bus 4."
                  - "Zu Fuß."
              - id: l1-f3
                type: multiple_choice
                text: "Lieblingsobst\nApfel: ● ● ●\nBanane: ● ●\nKiwi: ●\n● = 2 Kinder\nWie viele Kinder mögen Äpfel am liebsten?"
                say: "Schau genau, was unten steht. Wie viele Kinder mögen Äpfel am liebsten?"
                options: ["6", "3", "5"]
                answer: "6"
                feedback:
                  "3": "Ein Punkt steht hier für 2 Kinder. Zähl in Zweierschritten: 2, 4, 6."
                hints:
                  - "Unten steht: Ein Punkt steht für 2 Kinder."
                  - "Zähl in Zweierschritten: 2, 4, ..."
                  - "6 Kinder."
              - id: l1-f4
                type: true_false
                text: "Wie kommst du zur Schule?\nzu Fuß: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nAuto: ● ● ●\nFahrrad: ● ● ● ● ●\n● = 1 Kind\n5 Kinder fahren mit dem Fahrrad."
                say: "Stimmt das? Fünf Kinder fahren mit dem Fahrrad."
                answer: true
                hints:
                  - "Such die Zeile mit Fahrrad."
                  - "Zähl die Punkte in dieser Zeile."
                  - "Ja, das sind 5 Kinder."
              - id: l1-f5
                type: multiple_choice
                text: "Mach ein Bilddiagramm mit ● = 1 Kind.\nWelche Zeile passt zu Katze?"
                say: "Hier ist eine Strichliste. Du machst daraus ein Bilddiagramm, ein Punkt steht für ein Kind. Welche Zeile passt zu Katze?"
                show: { drawn: bar-chart, tally: true, rows: [["Hund", 3], ["Katze", 5]] }
                options: ["● ● ● ● ●", "● ● ●", "● ● ● ● ● ● ● ●"]
                answer: "● ● ● ● ●"
                option_audio: false
                hints:
                  - "Wie viele Striche hat Katze in der Strichliste?"
                  - "Katze hat ein Fünferbündel."
                  - "5 Punkte."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie kommst du zur Schule?\nzu Fuß: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nAuto: ● ● ●\nFahrrad: ● ● ● ● ●\n● = 1 Kind\nWie viele Kinder kommen mit dem Auto?"
                say: "Wie viele Kinder kommen mit dem Auto zur Schule?"
                options: ["3", "4", "7"]
                answer: "3"
                hints: ["Zähl die Punkte in der Zeile Auto."]
              - id: l1-s2
                type: multiple_choice
                text: "Lieblingsobst\nApfel: ● ● ●\nBanane: ● ●\nKiwi: ●\n● = 2 Kinder\nWie viele Kinder mögen Bananen am liebsten?"
                say: "Wie viele Kinder mögen Bananen am liebsten?"
                options: ["4", "2", "3"]
                answer: "4"
                hints: ["Ein Punkt steht für 2 Kinder."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie kommst du zur Schule?\nzu Fuß: ● ● ● ● ● ● ●\nBus: ● ● ● ●\nAuto: ● ● ●\nFahrrad: ● ● ● ● ●\n● = 1 Kind\nWie viele Kinder mehr kommen zu Fuß als mit dem Auto?"
                say: "Wie viele Kinder mehr kommen zu Fuß als mit dem Auto?"
                options: ["4", "10", "3"]
                answer: "4"
                hints: ["Zu Fuß 7, Auto 3."]
              - id: l1-s4
                type: true_false
                text: "Lieblingsobst\nApfel: ● ● ●\nBanane: ● ●\nKiwi: ●\n● = 2 Kinder\n2 Kinder mögen Kiwis am liebsten."
                say: "Stimmt das? Zwei Kinder mögen Kiwis am liebsten."
                answer: true
                hints: ["Bei Kiwi ist nur ein Punkt. Für wie viele Kinder steht ein Punkt?"]
              - id: l1-s5
                type: multiple_choice
                text: "Mach ein Bilddiagramm mit ● = 1 Kind.\nWelche Zeile passt zu Rot?"
                say: "Hier ist eine Strichliste. Du machst daraus ein Bilddiagramm, ein Punkt steht für ein Kind. Welche Zeile passt zu Rot?"
                show: { drawn: bar-chart, tally: true, rows: [["Rot", 4], ["Gelb", 2]] }
                options: ["● ● ● ●", "● ●", "● ● ● ● ●"]
                answer: "● ● ● ●"
                option_audio: false
                hints: ["Für jeden Strich ein Punkt."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Gesammelte Blätter\nLea: ● ● ● ●\nTim: ● ●\nMia: ● ● ●\n● = 2 Blätter\nWie viele Blätter hat Lea gesammelt?"
                say: "Die Kinder haben bunte Blätter gesammelt. Wie viele Blätter hat Lea gesammelt?"
                options: ["8", "4", "6"]
                answer: "8"
              - id: l1-n2
                type: multiple_choice
                text: "Gesammelte Blätter\nLea: ● ● ● ●\nTim: ● ●\nMia: ● ● ●\n● = 2 Blätter\nWer hat die wenigsten Blätter gesammelt?"
                say: "Wer hat die wenigsten Blätter gesammelt?"
                options: ["Tim", "Mia", "Lea"]
                answer: "Tim"
              - id: l1-n3
                type: multiple_choice
                text: "Gesammelte Blätter\nLea: ● ● ● ●\nTim: ● ●\nMia: ● ● ●\n● = 2 Blätter\nWie viele Blätter haben alle zusammen gesammelt?"
                say: "Wie viele Blätter haben alle drei Kinder zusammen gesammelt?"
                options: ["18", "9", "16"]
                answer: "18"
                difficulty: stretch
              - id: l1-n4
                type: true_false
                text: "Gesammelte Blätter\nLea: ● ● ● ●\nTim: ● ●\nMia: ● ● ●\n● = 2 Blätter\nMia hat 3 Blätter gesammelt."
                say: "Stimmt das? Mia hat drei Blätter gesammelt."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Ben hat 10 Blätter gesammelt.\n● = 2 Blätter\nWie viele Punkte bekommt Ben?"
                say: "Ben hat zehn Blätter gesammelt. Ein Punkt steht für zwei Blätter. Wie viele Punkte bekommt Ben im Bilddiagramm?"
                options: ["5", "10", "2"]
                answer: "5"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Tore\nTeam Rot: ● ● ● ● ● ●\nTeam Blau: ● ● ● ●\n● = 1 Tor\nWie viele Tore hat Team Rot geschossen?"
            say: "Wie viele Tore hat Team Rot geschossen?"
            options: ["6", "4", "3"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Lieblingssaft\nApfel: ● ● ● ●\nOrange: ● ●\n● = 2 Kinder\nWie viele Kinder mögen Orangensaft am liebsten?"
            say: "Schau genau, was unten steht. Wie viele Kinder mögen Orangensaft am liebsten?"
            options: ["4", "2", "8"]
            answer: "4"
          - id: l1-c3
            type: true_false
            text: "Tore\nTeam Rot: ● ● ● ● ● ●\nTeam Blau: ● ● ● ●\n● = 1 Tor\nTeam Blau hat 2 Tore weniger als Team Rot."
            say: "Stimmt das? Team Blau hat zwei Tore weniger geschossen als Team Rot."
            answer: true

  - n: 2
    title: { de: "Säulendiagramme", en: "Bar charts" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Lieblingsfarbe\nRot: ● ● ●\nBlau: ● ● ● ● ●\n● = 1 Kind\nWie viele Kinder mögen Blau?"
            say: "Wie viele Kinder mögen Blau am liebsten?"
            options: ["5", "3"]
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Lieblingsfarbe\nRot: ● ●\nBlau: ● ● ●\n● = 2 Kinder\nWie viele Kinder mögen Rot?"
            say: "Ein Punkt steht für zwei Kinder. Wie viele Kinder mögen Rot am liebsten?"
            options: ["4", "2", "6"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lieblingstiere"
            say: "Das ist ein Säulendiagramm. Für jedes Tier gibt es eine Säule. Links steht die Skala mit den Zahlen. Die Säule für Katze geht bis zur Sechs: Sechs Kinder mögen Katzen am liebsten."
            show: { drawn: bar-chart, rows: [["Hund", 4], ["Katze", 6], ["Pferd", 2]] }
          - text: "Die Skala geht in Zweierschritten."
            say: "Hier geht die Skala in Zweierschritten: null, zwei, vier, sechs und so weiter. Zähl nicht die Linien. Lies die Zahl an der Skala ab. Die Säule für Blau geht bis zwölf."
            show: { drawn: bar-chart, rows: [["Rot", 8], ["Blau", 12], ["Grün", 6]] }
          - text: "Ball 5, Puppe 3"
            say: "Aus einer Strichliste machst du ein Säulendiagramm. Ball hat fünf Striche, also geht die Säule bis fünf. Puppe hat drei, also geht ihre Säule bis drei."
            show: { drawn: bar-chart, tally: true, rows: [["Ball", 5], ["Puppe", 3]] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Kinder tanzen gern?"
                say: "Das Säulendiagramm zeigt, welchen Sport die Kinder gern machen. Wie viele Kinder tanzen gern?"
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Tanzen", 4], ["Schwimmen", 5]] }
                options: ["4", "5", "7"]
                answer: "4"
                hints:
                  - "Such die Säule für Tanzen."
                  - "Geh von oben an der Säule waagerecht nach links zur Skala."
                  - "4 Kinder."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welchen Sport mögen die meisten Kinder?"
                say: "Welchen Sport mögen die meisten Kinder?"
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Tanzen", 4], ["Schwimmen", 5]] }
                options: ["Fußball", "Schwimmen", "Tanzen"]
                answer: "Fußball"
                hints:
                  - "Die meisten: die höchste Säule."
                  - "Welche Säule geht am weitesten nach oben?"
                  - "Fußball."
              - id: l2-f3
                type: multiple_choice
                text: "Wie viele Kinder mögen Pflaumen am liebsten?"
                say: "Schau dir die Skala genau an. Wie viele Kinder mögen Pflaumen am liebsten?"
                show: { drawn: bar-chart, rows: [["Apfel", 10], ["Birne", 6], ["Pflaume", 14]] }
                options: ["14", "7", "12"]
                answer: "14"
                feedback:
                  "7": "Die Skala geht in Zweierschritten. Lies die Zahl an der Skala ab, zähl nicht die Linien."
                hints:
                  - "Die Skala geht in Zweierschritten."
                  - "Die Säule für Pflaume geht über die 12 hinaus bis zur nächsten Zahl."
                  - "14 Kinder."
              - id: l2-f4
                type: true_false
                text: "Fußball mögen 3 Kinder mehr als Tanzen."
                say: "Stimmt das? Fußball mögen drei Kinder mehr als Tanzen."
                show: { drawn: bar-chart, rows: [["Fußball", 7], ["Tanzen", 4], ["Schwimmen", 5]] }
                answer: true
                hints:
                  - "Lies beide Säulen ab."
                  - "Fußball 7, Tanzen 4. Rechne 7 − 4."
                  - "Ja, das sind 3 mehr."
              - id: l2-f5
                type: image_multiple_choice
                text: "Hund 3, Katze 5. Welches Säulendiagramm passt?"
                say: "In der Strichliste haben drei Kinder einen Hund und fünf eine Katze. Welches Säulendiagramm passt?"
                options:
                  - { drawn: bar-chart, rows: [["Hund", 3], ["Katze", 5]], key: "3-5" }
                  - { drawn: bar-chart, rows: [["Hund", 5], ["Katze", 3]], key: "5-3" }
                  - { drawn: bar-chart, rows: [["Hund", 3], ["Katze", 3]], key: "3-3" }
                answer: "3-5"
                hints:
                  - "Die Säule für Katze muss höher sein als die für Hund."
                  - "Hund bis 3, Katze bis 5."
                  - "Das Diagramm mit Hund 3 und Katze 5."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Kinder waren am Mittwoch in der Bücherei?"
                say: "Das Säulendiagramm zeigt, wie viele Kinder in der Schulbücherei waren. Wie viele waren am Mittwoch da?"
                show: { drawn: bar-chart, rows: [["Mo", 8], ["Di", 4], ["Mi", 6]] }
                options: ["6", "4", "8"]
                answer: "6"
                hints: ["Mi heißt Mittwoch. Lies die Säule an der Skala ab."]
              - id: l2-s2
                type: multiple_choice
                text: "An welchem Tag waren die wenigsten Kinder da?"
                say: "An welchem Tag waren die wenigsten Kinder in der Bücherei?"
                show: { drawn: bar-chart, rows: [["Mo", 8], ["Di", 4], ["Mi", 6]] }
                options: ["Montag", "Dienstag", "Mittwoch"]
                answer: "Dienstag"
                keep_order: true
                hints: ["Die wenigsten: die niedrigste Säule."]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Kinder mögen Gelb am liebsten?"
                say: "Wie viele Kinder mögen Gelb am liebsten?"
                show: { drawn: bar-chart, rows: [["Rot", 12], ["Gelb", 8], ["Grün", 16]] }
                options: ["8", "4", "10"]
                answer: "8"
                hints: ["Die Skala geht in Zweierschritten. Lies die Zahl an der Skala ab."]
              - id: l2-s4
                type: true_false
                text: "Am Montag waren 4 Kinder mehr da als am Dienstag."
                say: "Stimmt das? Am Montag waren vier Kinder mehr in der Bücherei als am Dienstag."
                show: { drawn: bar-chart, rows: [["Mo", 8], ["Di", 4], ["Mi", 6]] }
                answer: true
                hints: ["Montag 8, Dienstag 4."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Ball 6, Puppe 2. Welches Säulendiagramm passt?"
                say: "In der Strichliste mögen sechs Kinder Bälle und zwei Kinder Puppen. Welches Säulendiagramm passt?"
                options:
                  - { drawn: bar-chart, rows: [["Ball", 2], ["Puppe", 6]], key: "2-6" }
                  - { drawn: bar-chart, rows: [["Ball", 6], ["Puppe", 2]], key: "6-2" }
                  - { drawn: bar-chart, rows: [["Ball", 6], ["Puppe", 6]], key: "6-6" }
                answer: "6-2"
                hints: ["Die Säule für Ball muss bis 6 gehen."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Kinder haben einen Hund?"
                say: "Das Säulendiagramm zeigt die Haustiere der Klasse. Wie viele Kinder haben einen Hund?"
                show: { drawn: bar-chart, rows: [["Katze", 10], ["Hund", 12], ["Hase", 4]] }
                options: ["12", "6", "10"]
                answer: "12"
              - id: l2-n2
                type: multiple_choice
                text: "Welches Haustier haben die wenigsten Kinder?"
                say: "Welches Haustier haben die wenigsten Kinder?"
                show: { drawn: bar-chart, rows: [["Katze", 10], ["Hund", 12], ["Hase", 4]] }
                options: ["Hase", "Katze", "Hund"]
                answer: "Hase"
              - id: l2-n3
                type: multiple_choice
                text: "Wie viele Kinder haben zusammen eine Katze oder einen Hasen?"
                say: "Wie viele Kinder haben zusammen eine Katze oder einen Hasen?"
                show: { drawn: bar-chart, rows: [["Katze", 10], ["Hund", 12], ["Hase", 4]] }
                options: ["14", "10", "6"]
                answer: "14"
              - id: l2-n4
                type: true_false
                text: "Einen Hund haben 2 Kinder mehr als eine Katze."
                say: "Stimmt das? Einen Hund haben zwei Kinder mehr als eine Katze."
                show: { drawn: bar-chart, rows: [["Katze", 10], ["Hund", 12], ["Hase", 4]] }
                answer: true
              - id: l2-n5
                type: image_multiple_choice
                text: "Rot 4, Blau 7. Welches Säulendiagramm passt?"
                say: "In der Strichliste mögen vier Kinder Rot und sieben Kinder Blau. Welches Säulendiagramm passt?"
                options:
                  - { drawn: bar-chart, rows: [["Rot", 7], ["Blau", 4]], key: "7-4" }
                  - { drawn: bar-chart, rows: [["Rot", 4], ["Blau", 4]], key: "4-4" }
                  - { drawn: bar-chart, rows: [["Rot", 4], ["Blau", 7]], key: "4-7" }
                answer: "4-7"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie viele Kinder trinken am liebsten Wasser?"
            say: "Das Säulendiagramm zeigt, was die Kinder am liebsten trinken. Wie viele Kinder trinken am liebsten Wasser?"
            show: { drawn: bar-chart, rows: [["Saft", 5], ["Milch", 3], ["Wasser", 8]] }
            options: ["8", "5", "3"]
            answer: "8"
          - id: l2-c2
            type: multiple_choice
            text: "Was trinken die wenigsten Kinder am liebsten?"
