# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.number-puzzles-to-100
skill: math.numbers-to-100.number-puzzles
curriculum: de-DE
language: de
title:
  de: Zahlenrätsel bis 100
  en: Number riddles to 100
summary: >
  Riddles that combine clues about tens, ones and neighbours. Lesson 1
  solves riddles with two clues, one clue at a time; lesson 2 uses three
  clues and checks the answer against every clue, and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.order-compare]
  also_practises: [math.numbers-to-100.place-value, math.numbers-to-100.read-write]
  vocabulary: { de: [Rätsel, Hinweis, Zehnerziffer, Einerziffer, zwischen, prüfen] }
  forms: [text, audio, drawn]
  drawn: [place-value-chart]
  facets: []
  parts:
    - { id: digits, what: { de: Rätsel mit Hinweisen zu Zehnern und Einern lösen, en: solving riddles with clues about tens and ones } }
    - { id: neighbours, what: { de: Rätsel mit Nachbarzahlen und Nachbarzehnern lösen, en: solving riddles with neighbouring numbers and tens } }
    - { id: three-clues, what: { de: Rätsel mit drei Hinweisen lösen, en: solving riddles with three clues } }
    - { id: check, what: { de: "prüfen, ob eine Zahl zu allen Hinweisen passt", en: checking whether a number fits every clue } }
  misconceptions:
    - id: one-clue
      what: Stops after the first clue that fits and does not check the others
      addressed: Learn checks every clue in turn; in lesson 2 one wrong option fits two of three clues, with feedback naming the clue it breaks
    - id: digit-roles
      what: Mixes up Zehnerziffer and Einerziffer in a clue
      addressed: Learn fills a Stellentafel clue by clue
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zwei Hinweise, en: Two clues }
    goal:
      de: "Löse Zahlenrätsel mit zwei Hinweisen, so wie 7 Zehner und 2 Einer sind 72."
      en: "Solve number riddles with two clues, like 7 tens and 2 ones make 72."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Zahlen sind die Nachbarzahlen von 45?"
            say: "Welche Zahlen sind die Nachbarzahlen von fünfundvierzig?"
            frame: "_ , 45, _"
            options: ["35", "44", "46", "55"]
            answer: ["44", "46"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Einer hat 58?"
            options: ["5", "8", "58"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Meine Zahl hat 7 Zehner."
            say: "Ein Zahlenrätsel. Erster Hinweis: Meine Zahl hat sieben Zehner. Was glaubst du: Weißt du jetzt schon, welche Zahl es ist?"
            show: { drawn: place-value-chart, columns: [tens, ones], values: [7, null] }
          - text: "Sie hat 2 Einer."
            say: "Noch nicht ganz! Die Sieben steht bei den Zehnern, aber es fehlen die Einer. Zweiter Hinweis: Sie hat zwei Einer. Die Zwei kommt zu den Einern."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [7, 2] }
          - text: "72"
            say: "Die Zahl ist zweiundsiebzig. Prüfe jeden Hinweis: sieben Zehner, ja. Zwei Einer, ja. Gelöst."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [7, 2] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Meine Zahl hat 4 Zehner und 9 Einer."
                say: "Meine Zahl hat vier Zehner und neun Einer. Welche Zahl ist es?"
                options: ["49", "94", "13"]
                answer: "49"
                hints:
                  - "Die Zehner stehen links."
                  - "4 bei Z, 9 bei E."
                  - "Die Zahl ist 49."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Meine Zahl kommt direkt nach 59."
                say: "Meine Zahl kommt direkt nach neunundfünfzig. Welche Zahl ist es?"
                options: ["58", "60", "69"]
                answer: "60"
                hints:
                  - "Direkt danach heißt: eins mehr."
                  - "59 und 1."
                  - "Die Zahl ist 60."
              - id: l1-f3
                type: multiple_choice
                text: "Meine Zahl hat 3 Einer. Sie liegt zwischen 50 und 60."
                say: "Meine Zahl hat drei Einer. Sie liegt zwischen fünfzig und sechzig. Welche Zahl ist es?"
                options: ["35", "53", "63"]
                answer: "53"
                feedback:
                  "63": "63 hat 3 Einer, aber sie liegt nicht zwischen 50 und 60."
                hints:
                  - "Zwischen 50 und 60 haben alle Zahlen 5 Zehner."
                  - "5 Zehner und 3 Einer."
                  - "Die Zahl ist 53."
              - id: l1-f4
                type: text_input
                text: "Meine Zahl hat 8 Zehner und keine Einer."
                say: "Meine Zahl hat acht Zehner und keine Einer. Schreib die Zahl."
                answer: "80"
                hints:
                  - "Keine Einer heißt: 0 bei E."
                  - "8 bei Z, 0 bei E."
                  - "Die Zahl ist 80."
              - id: l1-f5
                type: multiple_choice
                text: "Zehnerziffer und Einerziffer sind gleich. Die Zahl ist größer als 50 und kleiner als 60."
                say: "Bei meiner Zahl sind die Zehnerziffer und die Einerziffer gleich. Sie ist größer als fünfzig und kleiner als sechzig. Welche Zahl ist es?"
                options: ["44", "55", "66"]
                answer: "55"
                hints:
                  - "Zwischen 50 und 60: 5 Zehner."
                  - "Die Einer sind auch 5."
                  - "Die Zahl ist 55."
              - id: l1-f6
                type: multiple_choice
                text: "Meine Zahl ist der größere Nachbarzehner von 76."
                say: "Meine Zahl ist der größere Nachbarzehner von sechsundsiebzig. Welche Zahl ist es?"
                options: ["77", "70", "80"]
                answer: "80"
                hints:
                  - "Nachbarzehner sind Zehnerzahlen."
                  - "76 liegt zwischen 70 und 80."
                  - "Danach kommt 80."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Meine Zahl hat 6 Zehner und 1 Einer."
                say: "Meine Zahl hat sechs Zehner und einen Einer. Welche Zahl ist es?"
                options: ["16", "61", "7"]
                answer: "61"
                hints: ["Zehner links."]
              - id: l1-s2
                type: multiple_choice
                text: "Meine Zahl kommt direkt vor 40."
                say: "Meine Zahl kommt direkt vor vierzig. Welche Zahl ist es?"
                options: ["39", "41", "30"]
                answer: "39"
                hints: ["Eins weniger."]
              - id: l1-s3
                type: multiple_choice
                text: "Meine Zahl hat 7 Einer. Sie liegt zwischen 20 und 30."
                say: "Meine Zahl hat sieben Einer. Sie liegt zwischen zwanzig und dreißig. Welche Zahl ist es?"
                options: ["27", "72", "37"]
                answer: "27"
                hints: ["Zwischen 20 und 30: 2 Zehner."]
              - id: l1-s4
                type: text_input
                text: "Meine Zahl hat 9 Zehner und 5 Einer."
                say: "Meine Zahl hat neun Zehner und fünf Einer. Schreib die Zahl."
                answer: "95"
                hints: ["9 bei Z."]
              - id: l1-s5
                type: multiple_choice
                text: "Die Einerziffer ist 1 mehr als die Zehnerziffer. Die Zahl hat 3 Zehner."
                say: "Meine Zahl hat drei Zehner. Die Einerziffer ist eins mehr als die Zehnerziffer. Welche Zahl ist es?"
                options: ["34", "43", "32"]
                answer: "34"
                hints: ["3 Zehner. Die Einerziffer ist 3 + 1."]
              - id: l1-s6
                type: multiple_choice
                text: "Meine Zahl ist das Doppelte von 20."
                say: "Meine Zahl ist das Doppelte von zwanzig. Welche Zahl ist es?"
                options: ["22", "40", "10"]
                answer: "40"
                hints: ["20 und noch einmal 20."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Meine Zahl hat 2 Zehner und 8 Einer."
                say: "Meine Zahl hat zwei Zehner und acht Einer. Welche Zahl ist es?"
                options: ["82", "28", "10"]
                answer: "28"
              - id: l1-n2
                type: text_input
                text: "Meine Zahl kommt direkt nach 89."
                say: "Meine Zahl kommt direkt nach neunundachtzig. Schreib die Zahl."
                answer: "90"
              - id: l1-n3
                type: multiple_choice
                text: "Meine Zahl hat 6 Einer. Sie liegt zwischen 80 und 90."
                say: "Meine Zahl hat sechs Einer. Sie liegt zwischen achtzig und neunzig. Welche Zahl ist es?"
                options: ["68", "86", "96"]
                answer: "86"
              - id: l1-n4
                type: multiple_choice
                text: "Zehnerziffer und Einerziffer sind gleich. Die Zahl liegt zwischen 30 und 40."
                say: "Bei meiner Zahl sind die Zehnerziffer und die Einerziffer gleich. Sie liegt zwischen dreißig und vierzig. Welche Zahl ist es?"
                options: ["22", "33", "44"]
                answer: "33"
              - id: l1-n5
                type: text_input
                text: "Meine Zahl hat 1 Zehner und 9 Einer."
                say: "Meine Zahl hat einen Zehner und neun Einer. Schreib die Zahl."
                answer: "19"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Meine Zahl hat 5 Zehner und 7 Einer."
            say: "Meine Zahl hat fünf Zehner und sieben Einer. Welche Zahl ist es?"
            options: ["75", "57", "12"]
            answer: "57"
          - id: l1-c2
            type: multiple_choice
            text: "Meine Zahl hat 4 Einer. Sie liegt zwischen 70 und 80."
            say: "Meine Zahl hat vier Einer. Sie liegt zwischen siebzig und achtzig. Welche Zahl ist es?"
            options: ["47", "74", "84"]
            answer: "74"
          - id: l1-c3
            type: text_input
            text: "Meine Zahl kommt direkt vor 70."
            say: "Meine Zahl kommt direkt vor siebzig. Schreib die Zahl."
            answer: "69"
          - id: l1-c4
            type: multiple_choice
            text: "Meine Zahl hat 1 Einer. Sie liegt zwischen 40 und 50."
            say: "Meine Zahl hat einen Einer. Sie liegt zwischen vierzig und fünfzig. Welche Zahl ist es?"
            options: ["14", "41", "51"]
            answer: "41"
          - id: l1-c5
            type: text_input
            text: "Meine Zahl ist der kleinere Nachbarzehner von 67."
            say: "Meine Zahl ist der kleinere Nachbarzehner von siebenundsechzig. Schreib die Zahl."
            answer: "60"
          - id: l1-c6
            type: multiple_choice
            text: "Zehnerziffer und Einerziffer sind gleich. Die Zahl ist größer als 70 und kleiner als 80."
            say: "Bei meiner Zahl sind die Zehnerziffer und die Einerziffer gleich. Sie ist größer als siebzig und kleiner als achtzig. Welche Zahl ist es?"
            options: ["66", "77", "88"]
            answer: "77"

  - n: 2
    title: { de: Drei Hinweise, en: Three clues }
    goal:
      de: "Löse Zahlenrätsel mit drei Hinweisen und prüf deine Zahl bei jedem Hinweis."
      en: "Solve number riddles with three clues and check your number against every clue."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Meine Zahl hat 3 Zehner und 6 Einer."
            say: "Meine Zahl hat drei Zehner und sechs Einer. Welche Zahl ist es?"
            options: ["36", "63", "9"]
            answer: "36"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Meine Zahl kommt direkt nach 49."
            say: "Meine Zahl kommt direkt nach neunundvierzig. Welche Zahl ist es?"
            options: ["48", "50", "59"]
            answer: "50"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1. Meine Zahl ist größer als 60."
            say: "Drei Hinweise. Erster Hinweis: Meine Zahl ist größer als sechzig. Was glaubst du: Wie viele Zahlen passen dazu, eine oder viele?"
          - text: "2. Sie ist kleiner als 70.  3. Die Einerziffer ist 4."
            say: "Viele! Einundsechzig, zweiundsechzig, bis hundert. Darum brauchen wir mehr Hinweise. Zweiter Hinweis: Sie ist kleiner als siebzig. Also hat sie sechs Zehner. Dritter Hinweis: Die Einerziffer ist vier. Dann ist es vierundsechzig."
            show: { drawn: place-value-chart, columns: [tens, ones], values: [6, 4] }
          - text: "64"
            say: "Prüfe alle drei: Vierundsechzig ist größer als sechzig, ja. Kleiner als siebzig, ja. Die Einerziffer ist vier, ja. Gelöst."
          - text: "Wusstest du? Ein Sudoku ist auch ein Zahlenrätsel. Es hat 81 Felder: 9 Reihen mit je 9 Feldern."
            say: "Wusstest du? Ein Sudoku ist auch ein Zahlenrätsel. Es hat einundachtzig Felder: neun Reihen mit je neun Feldern. Darin stehen nur die Ziffern eins bis neun."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Größer als 30. Kleiner als 40. Die Einerziffer ist 8."
                say: "Meine Zahl ist größer als dreißig und kleiner als vierzig. Die Einerziffer ist acht. Welche Zahl ist es?"
                options: ["38", "48", "83"]
                answer: "38"
                feedback:
                  "48": "48 hat die Einerziffer 8, aber 48 ist nicht kleiner als 40."
                hints:
                  - "Zwischen 30 und 40: 3 Zehner."
                  - "3 Zehner und 8 Einer."
                  - "Die Zahl ist 38."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Gerade. Zwischen 20 und 30. Die Einerziffer ist größer als 7."
                say: "Meine Zahl ist gerade. Sie liegt zwischen zwanzig und dreißig. Die Einerziffer ist größer als sieben. Welche Zahl ist es?"
                options: ["28", "29", "26"]
                answer: "28"
                feedback:
                  "29": "29 hat eine Einerziffer größer als 7, aber 29 ist nicht gerade."
                hints:
                  - "Die Einerziffer ist 8 oder 9."
                  - "Gerade Zahlen enden mit 0, 2, 4, 6 oder 8."
                  - "Die Zahl ist 28."
              - id: l2-f3
                type: multiple_choice
                text: "Die Zehnerziffer ist 9. Ungerade. Kleiner als 93."
                say: "Die Zehnerziffer meiner Zahl ist neun. Sie ist ungerade. Sie ist kleiner als dreiundneunzig. Welche Zahl ist es?"
                options: ["91", "95", "92"]
                answer: "91"
                hints:
                  - "Neun Zehner: von 90 bis 99."
                  - "Ungerade und kleiner als 93: 91."
                  - "Die Zahl ist 91."
              - id: l2-f4
                type: text_input
                text: "Zwischen 40 und 50. Die Einerziffer ist doppelt so groß wie die Zehnerziffer."
                say: "Meine Zahl liegt zwischen vierzig und fünfzig. Die Einerziffer ist doppelt so groß wie die Zehnerziffer. Schreib die Zahl."
                answer: "48"
                hints:
                  - "Die Zehnerziffer ist 4."
                  - "Das Doppelte von 4 ist 8."
                  - "Die Zahl ist 48."
              - id: l2-f5
                type: true_false
                text: "Stimmt 75? Größer als 70. Kleiner als 80. Die Einerziffer ist 3."
                say: "Meine Zahl ist größer als siebzig und kleiner als achtzig, und die Einerziffer ist drei. Ist es fünfundsiebzig?"
                answer: false
                hints:
                  - "Prüf jeden Hinweis."
                  - "75 ist größer als 70 und kleiner als 80."
                  - "Aber die Einerziffer von 75 ist 5. Nein."
              - id: l2-f6
                type: multiple_choice
                text: "Eine Nachbarzahl ist 60. Ungerade. Größer als 60."
                say: "Eine Nachbarzahl meiner Zahl ist sechzig. Meine Zahl ist ungerade. Sie ist größer als sechzig. Welche Zahl ist es?"
                options: ["59", "61", "62"]
                answer: "61"
                hints:
                  - "Die Nachbarzahlen von 60 sind 59 und 61."
                  - "Welche davon ist größer als 60?"
                  - "61 ist ungerade und größer als 60."
          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Größer als 80. Kleiner als 90. Die Einerziffer ist 2."
                say: "Meine Zahl ist größer als achtzig und kleiner als neunzig. Die Einerziffer ist zwei. Welche Zahl ist es?"
                options: ["28", "82", "92"]
                answer: "82"
                hints: ["8 Zehner."]
              - id: l2-s2
                type: multiple_choice
                text: "Ungerade. Zwischen 10 und 20. Die Einerziffer ist kleiner als 3."
                say: "Meine Zahl ist ungerade. Sie liegt zwischen zehn und zwanzig. Die Einerziffer ist kleiner als drei. Welche Zahl ist es?"
                options: ["11", "12", "13"]
                answer: "11"
                hints: ["Einer 0, 1 oder 2. Welche ist ungerade?"]
              - id: l2-s3
                type: text_input
                text: "Zwischen 30 und 40. Zehnerziffer und Einerziffer sind gleich."
                say: "Meine Zahl liegt zwischen dreißig und vierzig. Die Zehnerziffer und die Einerziffer sind gleich. Schreib die Zahl."
                answer: "33"
                hints: ["3 Zehner."]
              - id: l2-s4
                type: true_false
                text: "Stimmt 46? Gerade. Zwischen 40 und 50. Die Einerziffer ist 6."
                say: "Meine Zahl ist gerade, liegt zwischen vierzig und fünfzig, und die Einerziffer ist sechs. Ist es sechsundvierzig?"
                answer: true
                hints: ["Prüf jeden Hinweis."]
              - id: l2-s5
                type: multiple_choice
                text: "Eine Zehnerzahl. Größer als 50. Kleiner als 70."
                say: "Meine Zahl ist eine Zehnerzahl. Sie ist größer als fünfzig und kleiner als siebzig. Welche Zahl ist es?"
                options: ["50", "60", "70"]
                answer: "60"
                hints: ["Zehnerzahlen enden mit 0."]
              - id: l2-s6
                type: multiple_choice
                text: "Die Hälfte meiner Zahl ist 15."
                say: "Die Hälfte meiner Zahl ist fünfzehn. Welche Zahl ist es?"
                options: ["30", "25", "35"]
                answer: "30"
                hints: ["Das Doppelte von 15."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Eule Olli hat eine Zahl versteckt. Größer als 50. Kleiner als 60. Die Einerziffer ist 9."
                show: { object: owl }
                say: "Eule Olli hat eine Zahl versteckt. Ollis Zahl ist größer als fünfzig und kleiner als sechzig. Die Einerziffer ist neun. Welche Zahl ist es?"
                options: ["59", "95", "69"]
                answer: "59"
              - id: l2-n2
                type: text_input
                text: "Olli versteckt die nächste Zahl. Zwischen 20 und 30. Die Einerziffer ist doppelt so groß wie die Zehnerziffer."
                say: "Olli versteckt die nächste Zahl. Sie liegt zwischen zwanzig und dreißig. Die Einerziffer ist doppelt so groß wie die Zehnerziffer. Schreib die Zahl."
                answer: "24"
              - id: l2-n3
                type: multiple_choice
                text: "Ollis Zahl ist gerade. Die Zehnerziffer ist 7. Die Einerziffer ist größer als 7."
                say: "Ollis Zahl ist gerade. Die Zehnerziffer ist sieben. Die Einerziffer ist größer als sieben. Welche Zahl ist es?"
                options: ["78", "79", "87"]
                answer: "78"
              - id: l2-n4
                type: true_false
                text: "Ben rät 43. Stimmt das? Ollis Zahl ist ungerade. Zwischen 40 und 50. Die Einerziffer ist 5."
                say: "Ollis Zahl ist ungerade, liegt zwischen vierzig und fünfzig, und die Einerziffer ist fünf. Ben rät dreiundvierzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Ollis letzte Zahl: eine Zehnerzahl. Größer als 80. Kleiner als 100."
                say: "Ollis letzte Zahl ist eine Zehnerzahl. Sie ist größer als achtzig und kleiner als hundert. Welche Zahl ist es?"
                show: { object: owl }
                options: ["80", "90", "100"]
                answer: "90"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: digits
            type: multiple_choice
            text: "Meine Zahl hat 8 Zehner und 3 Einer."
            say: "Meine Zahl hat acht Zehner und drei Einer. Welche Zahl ist es?"
            options: ["38", "83", "11"]
            answer: "83"
          - id: l2-c2
            part: three-clues
            type: multiple_choice
            text: "Größer als 60. Kleiner als 70. Die Einerziffer ist 1."
            say: "Meine Zahl ist größer als sechzig und kleiner als siebzig. Die Einerziffer ist eins. Welche Zahl ist es?"
            options: ["16", "61", "71"]
            answer: "61"
          - id: l2-c3
            part: digits
            type: text_input
            text: "Zwischen 10 und 20. Zehnerziffer und Einerziffer sind gleich."
            say: "Meine Zahl liegt zwischen zehn und zwanzig. Die Zehnerziffer und die Einerziffer sind gleich. Schreib die Zahl."
            answer: "11"
          - id: l2-c4
            part: three-clues
            type: multiple_choice
            text: "Gerade. Zwischen 50 und 60. Die Einerziffer ist größer als 7."
            say: "Meine Zahl ist gerade. Sie liegt zwischen fünfzig und sechzig. Die Einerziffer ist größer als sieben. Welche Zahl ist es?"
            options: ["58", "59", "68"]
            answer: "58"
          - id: l2-c5
            part: check
            type: true_false
            text: "Stimmt 92? Gerade. Größer als 90. Kleiner als 94."
            say: "Meine Zahl ist gerade, größer als neunzig und kleiner als vierundneunzig. Ist es zweiundneunzig?"
            answer: true
          - id: l2-c6
            part: digits
            type: multiple_choice
            text: "Meine Zahl hat 5 Einer. Die Zehnerziffer ist 2 mehr als die Einerziffer."
            say: "Meine Zahl hat fünf Einer. Die Zehnerziffer ist zwei mehr als die Einerziffer. Welche Zahl ist es?"
            options: ["75", "57", "53"]
            answer: "75"
          - id: l2-c7
            part: digits
            type: multiple_choice
            text: "Meine Zahl hat 6 Einer und 7 Zehner."
            say: "Meine Zahl hat sechs Einer und sieben Zehner. Welche Zahl ist es?"
            options: ["67", "76", "13"]
            answer: "76"
          - id: l2-c8
            part: digits
            type: text_input
            text: "Meine Zahl hat 2 Zehner. Die Einerziffer ist 3 mehr als die Zehnerziffer."
            say: "Meine Zahl hat zwei Zehner. Die Einerziffer ist drei mehr als die Zehnerziffer. Schreib die Zahl."
            answer: "25"
          - id: l2-c9
            part: neighbours
