# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.describe-methods
skill: math.add-sub-to-100.describe-methods
curriculum: de-DE
language: de
title:
  de: Rechenwege vergleichen
  en: Comparing methods
summary: >
  Naming and comparing Rechenwege. Lesson 1 names the way a calculation is
  worked (schrittweise, stellenweise, mit Hilfsaufgabe, ergänzen) and works
  sums the named way; lesson 2 says which way suits a calculation and why,
  checks two children's ways side by side, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.clever]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { de: [Rechenweg, schrittweise, stellenweise, Hilfsaufgabe, ergänzen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: name, what: { de: einen Rechenweg erkennen und benennen, en: naming the method a calculation uses } }
    - { id: work, what: { de: auf einem genannten Weg rechnen, en: working a calculation a given way } }
    - { id: suits, what: { de: "sagen, welcher Weg zu einer Aufgabe passt", en: saying which method suits a calculation } }
    - { id: compare, what: { de: zwei Rechenwege vergleichen und prüfen, en: comparing and checking two methods } }
  misconceptions:
    - id: one-right-way
      what: Thinks only one Rechenweg is right
      addressed: '"Wer hat richtig gerechnet?" tasks show two different ways with the same result; Learn says every way gives the same result'
    - id: hilfsaufgabe-wrong-correction
      what: Corrects the Hilfsaufgabe the wrong way (54 + 39 = 54 + 40 + 1)
      addressed: lesson 2 tasks where one child corrects the wrong way, in the some and none stages
    - id: method-for-every-sum
      what: Uses the Hilfsaufgabe or ergänzen where it does not help (43 + 25)
      addressed: 'the Welcher Weg passt tasks mix plus and minus answers (74 − 29 suits the Hilfsaufgabe, 62 + 34 suits schrittweise); true/false tasks on whether a way fits; feedback says when it fits'
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Welcher Rechenweg ist das?", en: "Which method is this?" }
    goal:
      de: "Erkenne, welchen Rechenweg jemand nimmt, so wie schrittweise oder stellenweise, und rechne selbst so."
      en: "Spot which way someone works a sum, like in steps or tens and ones apart, and work it that way yourself."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 30 + 8 = _"
            answer: "83"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "56 + 20 − 1 = _"
            answer: "75"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + 38: nur ein Weg?"
            say: "Fünfundvierzig plus achtunddreißig. Was glaubst du: Gibt es nur einen Weg, das zu rechnen, oder mehrere?"
          - text: "45 + 38 = 45 + 30 + 8 = 83"
            say: "Es gibt mehrere Rechenwege. Schrittweise: Die erste Zahl bleibt ganz. Du rechnest erst die Zehner dazu, dann die Einer. Fünfundvierzig plus dreißig ist fünfundsiebzig, plus acht ist dreiundachtzig."
          - text: "40 + 30 = 70\n5 + 8 = 13\n70 + 13 = 83"
            say: "Stellenweise: Du rechnest Zehner und Einer getrennt und zählst am Ende zusammen."
          - text: "45 + 39 = 45 + 40 − 1 = 84"
            say: "Mit Hilfsaufgabe: Neununddreißig ist fast vierzig. Du rechnest fünfundvierzig plus vierzig und nimmst danach eins wieder weg."
          - text: "72 − 68: 68 + 4 = 72"
            say: "Ergänzen: Bei zweiundsiebzig minus achtundsechzig liegen die Zahlen nah beieinander. Du fragst: Wie viel fehlt von achtundsechzig bis zweiundsiebzig? Es sind vier."
          - text: "Wusstest du? In Japan lernen viele Kinder, mit einem Rechenbrett zu rechnen. Es heißt Soroban."
            say: "Wusstest du? In Japan lernen viele Kinder, mit einem Rechenbrett zu rechnen. Es heißt Soroban. Wer viel damit übt, kann sich das Brett im Kopf vorstellen und so ohne Brett rechnen. Auch das ist ein Rechenweg."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 36 + 27 = 36 + 20 + 7"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
                feedback:
                  "stellenweise": "Stellenweise rechnet man Zehner und Einer getrennt: 30 + 20 und 6 + 7. Hier bleibt die 36 ganz."
                hints:
                  - "Bleibt die erste Zahl ganz?"
                  - "Zur 36 kommen erst die Zehner dazu, dann die Einer."
                  - "Schrittweise."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Rechenweg ist das?\n30 + 20 = 50\n6 + 7 = 13\n50 + 13 = 63"
                say: "Welcher Rechenweg ist das? Dreißig plus zwanzig ist fünfzig. Sechs plus sieben ist dreizehn. Fünfzig plus dreizehn ist dreiundsechzig."
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "stellenweise"
                hints:
                  - "Werden Zehner und Einer getrennt gerechnet?"
                  - "Erst 30 + 20, dann 6 + 7."
                  - "Stellenweise."
              - id: l1-f3
                type: true_false
                text: "Ist das mit Hilfsaufgabe gerechnet? 54 + 29 = 54 + 30 − 1"
                say: "Ist das mit Hilfsaufgabe gerechnet? Vierundfünfzig plus neunundzwanzig ist vierundfünfzig plus dreißig minus eins."
                answer: true
                feedback:
                  "false": "Schrittweise würde man 54 + 20 + 9 rechnen. Hier wird mit 30 gerechnet und dann eins weggenommen."
                hints:
                  - "Wird mit einer runden Zahl gerechnet?"
                  - "29 ist fast 30."
                  - "Ja, mit Hilfsaufgabe."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 61 − 57: 57 + 4 = 61"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "ergänzen"
                hints:
                  - "Wird hier abgezogen oder dazugezählt?"
                  - "Es wird von 57 bis 61 gezählt."
                  - "Ergänzen."
              - id: l1-f5
                type: fill_in_blank
                text: "Rechne schrittweise: 47 + 25"
                say: "Rechne siebenundvierzig plus fünfundzwanzig schrittweise."
                frame: "47 + 20 = _ | _ + 5 = _"
                options: ["62", "67", "72", "77"]
                answer: ["67", "67", "72"]
                hints:
                  - "Erst die Zehner: 47 + 20."
                  - "Das sind 67. Dann noch 5 dazu."
                  - "67 + 5 = 72."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 68 + 24 = 68 + 20 + 4"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
                hints: ["Bleibt die erste Zahl ganz?"]
              - id: l1-s2
                type: true_false
                text: "Ist das schrittweise gerechnet? 70 − 66: 66 + 4 = 70"
                say: "Ist das schrittweise gerechnet? Siebzig minus sechsundsechzig: sechsundsechzig plus vier ist siebzig."
                answer: false
                hints: ["Wird abgezogen oder dazugezählt?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Rechenweg ist das?\n40 + 50 = 90\n3 + 4 = 7\n90 + 7 = 97"
                say: "Welcher Rechenweg ist das? Vierzig plus fünfzig ist neunzig. Drei plus vier ist sieben. Neunzig plus sieben ist siebenundneunzig."
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "stellenweise"
                hints: ["Werden Zehner und Einer getrennt gerechnet?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 75 − 19 = 75 − 20 + 1"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "mit Hilfsaufgabe"
                hints: ["Wird mit einer runden Zahl gerechnet?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Rechne stellenweise: 34 + 52"
                say: "Rechne vierunddreißig plus zweiundfünfzig stellenweise."
                frame: "30 + 50 = _ | 4 + 2 = _ | _ + _ = _"
                options: ["6", "76", "80", "86"]
                answer: ["80", "6", "80", "6", "86"]
                hints: ["Erst die Zehner, dann die Einer, dann beides zusammen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 23 + 49 = 23 + 50 − 1"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "mit Hilfsaufgabe"
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 52 + 36 = 52 + 30 + 6"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
              - id: l1-n3
                type: true_false
                text: "Ist das durch Ergänzen gerechnet? 83 − 79: 79 + 4 = 83"
                say: "Ist das durch Ergänzen gerechnet? Dreiundachtzig minus neunundsiebzig: neunundsiebzig plus vier ist dreiundachtzig."
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Rechenweg ist das?\n20 + 60 = 80\n5 + 3 = 8\n80 + 8 = 88"
                say: "Welcher Rechenweg ist das? Zwanzig plus sechzig ist achtzig. Fünf plus drei ist acht. Achtzig plus acht ist achtundachtzig."
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "stellenweise"
              - id: l1-n5
                type: fill_in_blank
                text: "Rechne mit Hilfsaufgabe: 37 + 29"
                say: "Rechne siebenunddreißig plus neunundzwanzig mit Hilfsaufgabe."
                frame: "37 + 30 = _ | _ − 1 = _"
                options: ["66", "67", "68", "76"]
                answer: ["67", "67", "66"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 46 + 38 = 46 + 30 + 8"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "schrittweise"
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 64 − 59: 59 + 5 = 64"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "ergänzen"
          - id: l1-c5
            type: fill_in_blank
            text: "Rechne schrittweise: 56 + 37"
            say: "Rechne sechsundfünfzig plus siebenunddreißig schrittweise."
            frame: "56 + 30 = _ | _ + 7 = _"
            options: ["83", "86", "93", "96"]
            answer: ["86", "86", "93"]
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 58 + 19 = 58 + 20 − 1"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "mit Hilfsaufgabe"
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Rechenweg ist das?\n50 + 20 = 70\n4 + 5 = 9\n70 + 9 = 79"
            say: "Welcher Rechenweg ist das? Fünfzig plus zwanzig ist siebzig. Vier plus fünf ist neun. Siebzig plus neun ist neunundsiebzig."
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "stellenweise"
          - id: l1-c6
            type: true_false
            text: "Ist das mit Hilfsaufgabe gerechnet? 44 + 29 = 44 + 30 − 1"
            say: "Ist das mit Hilfsaufgabe gerechnet? Vierundvierzig plus neunundzwanzig ist vierundvierzig plus dreißig minus eins."
            answer: true

  - n: 2
    title: { de: "Welcher Weg passt?", en: "Which method suits?" }
    goal:
      de: "Such dir den Rechenweg aus, der am besten passt, so wie die Hilfsaufgabe bei 56 + 19."
      en: "Pick the way that fits best, like the easier sum for 56 + 19."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 33 + 45 = 33 + 40 + 5"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "schrittweise"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "81 − 78 = _"
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "56 + 19: Welcher Weg passt?"
            say: "Sechsundfünfzig plus neunzehn. Was glaubst du: Mit welchem Rechenweg geht das am schnellsten?"
          - text: "56 + 19"
            say: "Bei sechsundfünfzig plus neunzehn ist neunzehn fast zwanzig. Da passt die Hilfsaufgabe gut: Sechsundfünfzig plus zwanzig ist sechsundsiebzig, eins wieder weg, fünfundsiebzig."
          - text: "91 − 87"
            say: "Bei einundneunzig minus siebenundachtzig liegen die Zahlen nah beieinander. Ergänzen geht schnell: Von siebenundachtzig bis einundneunzig sind es vier."
          - text: "42 + 35"
            say: "Bei zweiundvierzig plus fünfunddreißig ist keine Zahl fast ein Zehner. Da passt schrittweise oder stellenweise. Beide Wege sind gut."
          - text: "Jeder Weg führt zum selben Ergebnis."
            say: "Jeder richtige Weg führt zum selben Ergebnis. Ein guter Weg ist einer, bei dem du wenig und sicher rechnen musst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Weg passt gut zu 37 + 29?"
                options: ["mit Hilfsaufgabe", "ergänzen", "in Einerschritten weiterzählen"]
                answer: "mit Hilfsaufgabe"
                feedback:
                  "ergänzen": "Ergänzen passt bei Minusaufgaben, wenn die Zahlen nah beieinander liegen."
                  "in Einerschritten weiterzählen": "Das sind 29 Schritte. Bis du fertig bist, ist dein Eis geschmolzen! Mit Hilfsaufgabe geht es schneller: 37 + 30 − 1."
                hints:
                  - "Ist eine Zahl fast ein Zehner?"
                  - "29 ist fast 30."
                  - "Mit Hilfsaufgabe: 37 + 30 − 1."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Weg passt gut zu 62 − 58?"
                options: ["ergänzen", "schrittweise", "stellenweise"]
                answer: "ergänzen"
                feedback:
                  "schrittweise": "Das geht, ist aber lang: 62 − 50 − 8. Die Zahlen liegen nah beieinander, da ist Ergänzen schneller."
                hints:
                  - "Liegen die Zahlen nah beieinander?"
                  - "Von 58 bis 62 ist es nicht weit."
                  - "Ergänzen: 58 + 4 = 62."
              - id: l2-f3
                type: true_false
                text: "Passt die Hilfsaufgabe gut zu 43 + 25?"
                say: "Passt die Hilfsaufgabe gut zu dreiundvierzig plus fünfundzwanzig?"
                answer: false
                feedback:
                  "true": "Die Hilfsaufgabe passt, wenn eine Zahl fast ein Zehner ist, wie 29 oder 39. 25 ist das nicht."
                hints:
                  - "Ist 25 fast ein Zehner?"
                  - "Nein, 25 liegt genau zwischen 20 und 30."
                  - "Nein. Hier passt schrittweise oder stellenweise."
              - id: l2-f4
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 48 + 26\nLena: 48 + 20 = 68, 68 + 6 = 74\nJonas: 40 + 20 = 60, 8 + 6 = 14, 60 + 14 = 74"
                say: "Lena rechnet schrittweise: achtundvierzig plus zwanzig ist achtundsechzig, plus sechs ist vierundsiebzig. Jonas rechnet stellenweise: vierzig plus zwanzig ist sechzig, acht plus sechs ist vierzehn, zusammen vierundsiebzig. Wer hat richtig gerechnet?"
                options: ["beide", "nur Lena", "nur Jonas"]
                answer: "beide"
                hints:
                  - "Rechne beide Wege nach."
                  - "Beide kommen auf 74."
                  - "Beide. Verschiedene Wege, dasselbe Ergebnis."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Weg passt gut zu 74 − 29?"
                options: ["mit Hilfsaufgabe", "ergänzen", "stellenweise"]
                answer: "mit Hilfsaufgabe"
                feedback:
                  "ergänzen": "Ergänzen passt, wenn die Zahlen nah beieinander liegen. 29 und 74 liegen weit auseinander."
                  "stellenweise": "Stellenweise geht hier schwer: 4 − 9 geht nicht. 29 ist fast 30, da hilft die Hilfsaufgabe."
                hints:
                  - "Ist eine Zahl fast ein Zehner?"
                  - "29 ist fast 30."
                  - "Mit Hilfsaufgabe: 74 − 30 + 1."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Passt Ergänzen gut zu 80 − 77?"
                say: "Passt Ergänzen gut zu achtzig minus siebenundsiebzig?"
                answer: true
                hints: ["Liegen die Zahlen nah beieinander?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Weg passt gut zu 62 + 34?"
                options: ["schrittweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
                hints: ["Ist eine Zahl fast ein Zehner? Wenn nicht, rechne Zehner und Einer der Reihe nach."]
              - id: l2-s3
                type: true_false
                text: "Passt Ergänzen gut zu 53 + 24?"
                say: "Passt Ergänzen gut zu dreiundfünfzig plus vierundzwanzig?"
                answer: false
                hints: ["Wann passt Ergänzen? Denk an die Minusaufgaben mit nahen Zahlen."]
              - id: l2-s4
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 63 − 28\nSara: 63 − 20 = 43, 43 − 8 = 35\nTim: 63 − 30 = 33, 33 + 2 = 35"
                say: "Sara rechnet: dreiundsechzig minus zwanzig ist dreiundvierzig, minus acht ist fünfunddreißig. Tim rechnet: dreiundsechzig minus dreißig ist dreiunddreißig, plus zwei ist fünfunddreißig. Wer hat richtig gerechnet?"
                options: ["beide", "nur Sara", "nur Tim"]
                answer: "beide"
                hints: ["Rechne beide Wege nach."]
              - id: l2-s5
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 54 + 39\nEmma: 54 + 40 = 94, 94 − 1 = 93\nLeo: 54 + 40 = 94, 94 + 1 = 95"
                say: "Emma rechnet: vierundfünfzig plus vierzig ist vierundneunzig, minus eins ist dreiundneunzig. Leo rechnet: vierundfünfzig plus vierzig ist vierundneunzig, plus eins ist fünfundneunzig. Wer hat richtig gerechnet?"
                options: ["nur Emma", "nur Leo", "beide"]
                answer: "nur Emma"
                hints: ["39 ist eins weniger als 40. Was muss man danach also tun?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Weg passt gut zu 83 − 39?"
                options: ["mit Hilfsaufgabe", "ergänzen", "in Einerschritten zurückzählen"]
                answer: "mit Hilfsaufgabe"
              - id: l2-n2
                type: true_false
                text: "Passt Ergänzen gut zu 72 − 69?"
                say: "Passt Ergänzen gut zu zweiundsiebzig minus neunundsechzig?"
                answer: true
              - id: l2-n3
                type: true_false
                text: "Passt die Hilfsaufgabe gut zu 58 + 39?"
                say: "Passt die Hilfsaufgabe gut zu achtundfünfzig plus neununddreißig?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 85 − 19\nNina: 85 − 20 = 65, 65 + 1 = 66\nPaul: 85 − 20 = 65, 65 − 1 = 64"
                say: "Nina rechnet: fünfundachtzig minus zwanzig ist fünfundsechzig, plus eins ist sechsundsechzig. Paul rechnet: fünfundachtzig minus zwanzig ist fünfundsechzig, minus eins ist vierundsechzig. Wer hat richtig gerechnet?"
                options: ["nur Nina", "nur Paul", "beide"]
                answer: "nur Nina"
              - id: l2-n5
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 27 + 46\nMila: 27 + 40 = 67, 67 + 6 = 73\nBen: 20 + 40 = 60, 7 + 6 = 13, 60 + 13 = 73"
                say: "Mila rechnet schrittweise: siebenundzwanzig plus vierzig ist siebenundsechzig, plus sechs ist dreiundsiebzig. Ben rechnet stellenweise: zwanzig plus vierzig ist sechzig, sieben plus sechs ist dreizehn, zusammen dreiundsiebzig. Wer hat richtig gerechnet?"
                options: ["beide", "nur Mila", "nur Ben"]
                answer: "beide"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: multiple_choice
            text: "Welcher Rechenweg ist das?\n10 + 70 = 80\n9 + 4 = 13\n80 + 13 = 93"
            say: "Welcher Rechenweg ist das? Zehn plus siebzig ist achtzig. Neun plus vier ist dreizehn. Achtzig plus dreizehn ist dreiundneunzig."
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "stellenweise"
          - id: l2-c2
            part: name
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 92 − 88: 88 + 4 = 92"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "ergänzen"
          - id: l2-c3
            part: suits
            type: multiple_choice
            text: "Welcher Weg passt gut zu 41 + 26?"
            options: ["stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "stellenweise"
          - id: l2-c16
            part: work
            type: fill_in_blank
            text: "Rechne schrittweise: 36 + 48"
            say: "Rechne sechsunddreißig plus achtundvierzig schrittweise."
            frame: "36 + 40 = _ | _ + 8 = _"
            options: ["74", "76", "84", "86"]
            answer: ["76", "76", "84"]
          - id: l2-c4
            part: suits
            type: multiple_choice
            text: "Welcher Weg passt gut zu 51 − 48?"
            options: ["ergänzen", "schrittweise", "stellenweise"]
            answer: "ergänzen"
          - id: l2-c5
            part: compare
