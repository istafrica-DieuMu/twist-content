# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.describe-methods
skill: math.add-sub-to-100.describe-methods
curriculum: de-DE
language: de
title:
  de: Rechenwege vergleichen
  en: Comparing methods
summary: >
  Naming and comparing Rechenwege. Lesson 1 names the way a calculation is
  worked (schrittweise, stellenweise, mit Hilfsaufgabe, ergänzen) and works
  sums the named way; lesson 2 says which way suits a calculation and why,
  checks two children's ways side by side, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.clever]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { de: [Rechenweg, schrittweise, stellenweise, Hilfsaufgabe, ergänzen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: name, what: { de: einen Rechenweg erkennen und benennen, en: naming the method a calculation uses } }
    - { id: work, what: { de: auf einem genannten Weg rechnen, en: working a calculation a given way } }
    - { id: suits, what: { de: "sagen, welcher Weg zu einer Aufgabe passt", en: saying which method suits a calculation } }
    - { id: compare, what: { de: zwei Rechenwege vergleichen und prüfen, en: comparing and checking two methods } }
  misconceptions:
    - id: one-right-way
      what: Thinks only one Rechenweg is right
      addressed: '"Wer hat richtig gerechnet?" tasks show two different ways with the same result; Learn says every way gives the same result'
    - id: hilfsaufgabe-wrong-correction
      what: Corrects the Hilfsaufgabe the wrong way (54 + 39 = 54 + 40 + 1)
      addressed: lesson 2 tasks where one child corrects the wrong way, in the some and none stages
    - id: method-for-every-sum
      what: Uses the Hilfsaufgabe or ergänzen where it does not help (43 + 25)
      addressed: 'the Welcher Weg passt tasks mix plus and minus answers (74 − 29 suits the Hilfsaufgabe, 62 + 34 suits schrittweise); true/false tasks on whether a way fits; feedback says when it fits'
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Welcher Rechenweg ist das?", en: "Which method is this?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 30 + 8 = _"
            answer: "83"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "56 + 20 − 1 = _"
            answer: "75"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + 38 = 45 + 30 + 8 = 83"
            say: "Es gibt verschiedene Rechenwege. Schrittweise: Die erste Zahl bleibt ganz. Du rechnest erst die Zehner dazu, dann die Einer. 45 plus 30 ist 75, plus 8 ist 83."
          - text: "40 + 30 = 70 | 5 + 8 = 13 | 70 + 13 = 83"
            say: "Stellenweise: Du rechnest Zehner und Einer getrennt und zählst am Ende zusammen."
          - text: "45 + 39 = 45 + 40 − 1 = 84"
            say: "Mit Hilfsaufgabe: 39 ist fast 40. Du rechnest 45 plus 40 und nimmst danach eins wieder weg."
          - text: "72 − 68: 68 + 4 = 72"
            say: "Ergänzen: Bei 72 minus 68 liegen die Zahlen nah beieinander. Du fragst: Wie viel fehlt von 68 bis 72? Es sind 4."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 36 + 27 = 36 + 20 + 7"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
                feedback:
                  "stellenweise": "Stellenweise rechnet man Zehner und Einer getrennt: 30 + 20 und 6 + 7. Hier bleibt die 36 ganz."
                hints:
                  - "Bleibt die erste Zahl ganz?"
                  - "Zur 36 kommen erst die Zehner dazu, dann die Einer."
                  - "Schrittweise."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 30 + 20 = 50 | 6 + 7 = 13 | 50 + 13 = 63"
                say: "Welcher Rechenweg ist das? 30 plus 20 ist 50. 6 plus 7 ist 13. 50 plus 13 ist 63."
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "stellenweise"
                hints:
                  - "Werden Zehner und Einer getrennt gerechnet?"
                  - "Erst 30 + 20, dann 6 + 7."
                  - "Stellenweise."
              - id: l1-f3
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 54 + 29 = 54 + 30 − 1"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "mit Hilfsaufgabe"
                feedback:
                  "schrittweise": "Schrittweise würde man 54 + 20 + 9 rechnen. Hier wird mit 30 gerechnet und dann eins weggenommen."
                hints:
                  - "Wird mit einer runden Zahl gerechnet?"
                  - "29 ist fast 30."
                  - "Mit Hilfsaufgabe."
              - id: l1-f4
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 61 − 57: 57 + 4 = 61"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "ergänzen"
                hints:
                  - "Wird hier abgezogen oder dazugezählt?"
                  - "Es wird von 57 bis 61 gezählt."
                  - "Ergänzen."
              - id: l1-f5
                type: fill_in_blank
                text: "Rechne schrittweise: 47 + 25"
                say: "Rechne 47 plus 25 schrittweise."
                frame: "47 + 20 = _ | _ + 5 = _"
                options: ["62", "67", "72", "77"]
                answer: ["67", "67", "72"]
                hints:
                  - "Erst die Zehner: 47 + 20."
                  - "Das sind 67. Dann noch 5 dazu."
                  - "67 + 5 = 72."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 68 + 24 = 68 + 20 + 4"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
                hints: ["Bleibt die erste Zahl ganz?"]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 70 − 66: 66 + 4 = 70"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "ergänzen"
                hints: ["Wird abgezogen oder dazugezählt?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 40 + 50 = 90 | 3 + 4 = 7 | 90 + 7 = 97"
                say: "Welcher Rechenweg ist das? 40 plus 50 ist 90. 3 plus 4 ist 7. 90 plus 7 ist 97."
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "stellenweise"
                hints: ["Werden Zehner und Einer getrennt gerechnet?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 75 − 19 = 75 − 20 + 1"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "mit Hilfsaufgabe"
                hints: ["Wird mit einer runden Zahl gerechnet?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Rechne stellenweise: 34 + 52"
                say: "Rechne 34 plus 52 stellenweise."
                frame: "30 + 50 = _ | 4 + 2 = _ | _ + _ = _"
                options: ["6", "76", "80", "86"]
                answer: ["80", "6", "80", "6", "86"]
                hints: ["Erst die Zehner, dann die Einer, dann beides zusammen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 23 + 49 = 23 + 50 − 1"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "mit Hilfsaufgabe"
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 52 + 36 = 52 + 30 + 6"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
              - id: l1-n3
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 83 − 79: 79 + 4 = 83"
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "ergänzen"
              - id: l1-n4
                type: multiple_choice
                text: "Welcher Rechenweg ist das? 20 + 60 = 80 | 5 + 3 = 8 | 80 + 8 = 88"
                say: "Welcher Rechenweg ist das? 20 plus 60 ist 80. 5 plus 3 ist 8. 80 plus 8 ist 88."
                options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "stellenweise"
              - id: l1-n5
                type: fill_in_blank
                text: "Rechne mit Hilfsaufgabe: 37 + 29"
                say: "Rechne 37 plus 29 mit Hilfsaufgabe."
                frame: "37 + 30 = _ | _ − 1 = _"
                options: ["66", "67", "68", "76"]
                answer: ["67", "67", "66"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 46 + 38 = 46 + 30 + 8"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "schrittweise"
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 64 − 59: 59 + 5 = 64"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "ergänzen"
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 58 + 19 = 58 + 20 − 1"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "mit Hilfsaufgabe"
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 50 + 20 = 70 | 4 + 5 = 9 | 70 + 9 = 79"
            say: "Welcher Rechenweg ist das? Fünfzig plus zwanzig ist siebzig. Vier plus fünf ist neun. Siebzig plus neun ist neunundsiebzig."
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "stellenweise"
          - id: l1-c5
            type: fill_in_blank
            text: "Rechne schrittweise: 56 + 37"
            say: "Rechne sechsundfünfzig plus siebenunddreißig schrittweise."
            frame: "56 + 30 = _ | _ + 7 = _"
            options: ["83", "86", "93", "96"]
            answer: ["86", "86", "93"]
          - id: l1-c6
            type: true_false
            text: "Ist das mit Hilfsaufgabe gerechnet? 44 + 29 = 44 + 30 − 1"
            say: "Ist das mit Hilfsaufgabe gerechnet? Vierundvierzig plus neunundzwanzig ist vierundvierzig plus dreißig minus eins."
            answer: true

  - n: 2
    title: { de: "Welcher Weg passt?", en: "Which method suits?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 33 + 45 = 33 + 40 + 5"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "schrittweise"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "81 − 78 = _"
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "56 + 19"
            say: "Welcher Weg passt? Bei 56 plus 19 ist 19 fast 20. Da passt die Hilfsaufgabe gut: 56 plus 20 ist 76, eins wieder weg, 75."
          - text: "91 − 87"
            say: "Bei 91 minus 87 liegen die Zahlen nah beieinander. Ergänzen geht schnell: Von 87 bis 91 sind es 4."
          - text: "42 + 35"
            say: "Bei 42 plus 35 ist keine Zahl fast ein Zehner. Da passt schrittweise oder stellenweise. Beide Wege sind gut."
          - text: "Jeder Weg führt zum selben Ergebnis."
            say: "Jeder richtige Weg führt zum selben Ergebnis. Ein guter Weg ist einer, bei dem du wenig und sicher rechnen musst."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Weg passt gut zu 37 + 29?"
                options: ["mit Hilfsaufgabe", "ergänzen", "in Einerschritten weiterzählen"]
                answer: "mit Hilfsaufgabe"
                feedback:
                  "ergänzen": "Ergänzen passt bei Minusaufgaben, wenn die Zahlen nah beieinander liegen."
                  "in Einerschritten weiterzählen": "Das sind 29 Schritte. Mit Hilfsaufgabe geht es schneller: 37 + 30 − 1."
                hints:
                  - "Ist eine Zahl fast ein Zehner?"
                  - "29 ist fast 30."
                  - "Mit Hilfsaufgabe: 37 + 30 − 1."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welcher Weg passt gut zu 62 − 58?"
                options: ["ergänzen", "schrittweise", "stellenweise"]
                answer: "ergänzen"
                feedback:
                  "schrittweise": "Das geht, ist aber lang: 62 − 50 − 8. Die Zahlen liegen nah beieinander, da ist Ergänzen schneller."
                hints:
                  - "Liegen die Zahlen nah beieinander?"
                  - "Von 58 bis 62 ist es nicht weit."
                  - "Ergänzen: 58 + 4 = 62."
              - id: l2-f3
                type: true_false
                text: "Passt die Hilfsaufgabe gut zu 43 + 25?"
                say: "Passt die Hilfsaufgabe gut zu 43 plus 25?"
                answer: false
                feedback:
                  "true": "Die Hilfsaufgabe passt, wenn eine Zahl fast ein Zehner ist, wie 29 oder 39. 25 ist das nicht."
                hints:
                  - "Ist 25 fast ein Zehner?"
                  - "Nein, 25 liegt genau zwischen 20 und 30."
                  - "Nein. Hier passt schrittweise oder stellenweise."
              - id: l2-f4
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 48 + 26"
                say: "Lena rechnet schrittweise: 48 plus 20 ist 68, plus 6 ist 74. Jonas rechnet stellenweise: 40 plus 20 ist 60, 8 plus 6 ist 14, zusammen 74. Wer hat richtig gerechnet?"
                options: ["beide", "nur Lena", "nur Jonas"]
                answer: "beide"
                hints:
                  - "Rechne beide Wege nach."
                  - "Beide kommen auf 74."
                  - "Beide. Verschiedene Wege, dasselbe Ergebnis."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Weg passt gut zu 74 − 29?"
                options: ["mit Hilfsaufgabe", "ergänzen", "stellenweise"]
                answer: "mit Hilfsaufgabe"
                feedback:
                  "ergänzen": "Ergänzen passt, wenn die Zahlen nah beieinander liegen. 29 und 74 liegen weit auseinander."
                  "stellenweise": "Stellenweise geht hier schwer: 4 − 9 geht nicht. 29 ist fast 30, da hilft die Hilfsaufgabe."
                hints:
                  - "Ist eine Zahl fast ein Zehner?"
                  - "29 ist fast 30."
                  - "Mit Hilfsaufgabe: 74 − 30 + 1."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Weg passt gut zu 80 − 77?"
                options: ["ergänzen", "schrittweise", "stellenweise"]
                answer: "ergänzen"
                hints: ["Liegen die Zahlen nah beieinander?"]
              - id: l2-s2
                type: multiple_choice
                text: "Welcher Weg passt gut zu 62 + 34?"
                options: ["schrittweise", "mit Hilfsaufgabe", "ergänzen"]
                answer: "schrittweise"
                hints: ["Ist eine Zahl fast ein Zehner? Wenn nicht, rechne Zehner und Einer der Reihe nach."]
              - id: l2-s3
                type: true_false
                text: "Passt Ergänzen gut zu 53 + 24?"
                say: "Passt Ergänzen gut zu 53 plus 24?"
                answer: false
                hints: ["Wann passt Ergänzen? Denk an die Minusaufgaben mit nahen Zahlen."]
              - id: l2-s4
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 63 − 28"
                say: "Sara rechnet: 63 minus 20 ist 43, minus 8 ist 35. Tim rechnet: 63 minus 30 ist 33, plus 2 ist 35. Wer hat richtig gerechnet?"
                options: ["beide", "nur Sara", "nur Tim"]
                answer: "beide"
                hints: ["Rechne beide Wege nach."]
              - id: l2-s5
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 54 + 39"
                say: "Emma rechnet: 54 plus 40 ist 94, minus 1 ist 93. Leo rechnet: 54 plus 40 ist 94, plus 1 ist 95. Wer hat richtig gerechnet?"
                options: ["nur Emma", "nur Leo", "beide"]
                answer: "nur Emma"
                hints: ["39 ist eins weniger als 40. Was muss man danach also tun?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Weg passt gut zu 83 − 39?"
                options: ["mit Hilfsaufgabe", "ergänzen", "in Einerschritten zurückzählen"]
                answer: "mit Hilfsaufgabe"
              - id: l2-n2
                type: multiple_choice
                text: "Welcher Weg passt gut zu 72 − 69?"
                options: ["ergänzen", "schrittweise", "stellenweise"]
                answer: "ergänzen"
              - id: l2-n3
                type: true_false
                text: "Passt die Hilfsaufgabe gut zu 58 + 39?"
                say: "Passt die Hilfsaufgabe gut zu 58 plus 39?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 85 − 19"
                say: "Nina rechnet: 85 minus 20 ist 65, plus 1 ist 66. Paul rechnet: 85 minus 20 ist 65, minus 1 ist 64. Wer hat richtig gerechnet?"
                options: ["nur Nina", "nur Paul", "beide"]
                answer: "nur Nina"
              - id: l2-n5
                type: multiple_choice
                text: "Wer hat richtig gerechnet? 27 + 46"
                say: "Mila rechnet schrittweise: 27 plus 40 ist 67, plus 6 ist 73. Ben rechnet stellenweise: 20 plus 40 ist 60, 7 plus 6 ist 13, zusammen 73. Wer hat richtig gerechnet?"
                options: ["beide", "nur Mila", "nur Ben"]
                answer: "beide"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: name
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 10 + 70 = 80 | 9 + 4 = 13 | 80 + 13 = 93"
            say: "Welcher Rechenweg ist das? Zehn plus siebzig ist achtzig. Neun plus vier ist dreizehn. Achtzig plus dreizehn ist dreiundneunzig."
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "stellenweise"
          - id: l2-c2
            part: name
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 92 − 88: 88 + 4 = 92"
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "ergänzen"
          - id: l2-c3
            part: suits
            type: multiple_choice
            text: "Welcher Weg passt gut zu 41 + 26?"
            options: ["stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "stellenweise"
          - id: l2-c4
            part: suits
            type: multiple_choice
            text: "Welcher Weg passt gut zu 51 − 48?"
            options: ["ergänzen", "schrittweise", "stellenweise"]
            answer: "ergänzen"
          - id: l2-c5
            part: compare
            type: multiple_choice
            text: "Wer hat richtig gerechnet? 76 − 39 | Ida: 76 − 40 = 36, 36 + 1 = 37 | Max: 76 − 30 = 46, 46 − 9 = 37"
            say: "Ida rechnet: sechsundsiebzig minus vierzig ist sechsunddreißig, plus eins ist siebenunddreißig. Max rechnet: sechsundsiebzig minus dreißig ist sechsundvierzig, minus neun ist siebenunddreißig. Wer hat richtig gerechnet?"
            options: ["beide", "nur Ida", "nur Max"]
            answer: "beide"
          - id: l2-c6
            part: name
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 27 + 45 = 27 + 40 + 5"
            say: "Welcher Rechenweg ist das? Siebenundzwanzig plus fünfundvierzig ist siebenundzwanzig plus vierzig plus fünf."
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "schrittweise"
          - id: l2-c7
            part: name
            type: multiple_choice
            text: "Welcher Rechenweg ist das? 66 + 29 = 66 + 30 − 1"
            say: "Welcher Rechenweg ist das? Sechsundsechzig plus neunundzwanzig ist sechsundsechzig plus dreißig minus eins."
            options: ["schrittweise", "stellenweise", "mit Hilfsaufgabe", "ergänzen"]
            answer: "mit Hilfsaufgabe"
          - id: l2-c8
            part: name
            type: true_false
            text: "Ist das stellenweise gerechnet? 63 − 58: 58 + 5 = 63"
            say: "Ist das stellenweise gerechnet? Dreiundsechzig minus achtundfünfzig: achtundfünfzig plus fünf ist dreiundsechzig."
            answer: false
          - id: l2-c9
            part: suits
            type: multiple_choice
            text: "Welcher Weg passt gut zu 47 + 19?"
            say: "Welcher Weg passt gut zu siebenundvierzig plus neunzehn?"
            options: ["mit Hilfsaufgabe", "ergänzen", "in Einerschritten weiterzählen"]
            answer: "mit Hilfsaufgabe"
          - id: l2-c10
            part: suits
            type: true_false
            text: "Passt Ergänzen gut zu 94 − 91?"
            say: "Passt Ergänzen gut zu vierundneunzig minus einundneunzig?"
            answer: true
          - id: l2-c11
            part: suits
            type: multiple_choice
            text: "Bei welcher Aufgabe passt Ergänzen gut?"
            say: "Bei welcher Aufgabe passt Ergänzen gut?"
            options: ["73 − 68", "73 − 18", "73 + 18"]
            answer: "73 − 68"
          - id: l2-c12
            part: compare
            type: multiple_choice
            text: "Wer hat richtig gerechnet? 38 + 47 | Anna: 38 + 40 = 78, 78 + 7 = 85 | Finn: 30 + 40 = 70, 8 + 7 = 15, 70 + 15 = 85"
            say: "Anna rechnet: achtunddreißig plus vierzig ist achtundsiebzig, plus sieben ist fünfundachtzig. Finn rechnet: dreißig plus vierzig ist siebzig, acht plus sieben ist fünfzehn, zusammen fünfundachtzig. Wer hat richtig gerechnet?"
            options: ["beide", "nur Anna", "nur Finn"]
            answer: "beide"
          - id: l2-c13
            part: compare
            type: multiple_choice
            text: "Wer hat richtig gerechnet? 65 + 29 | Lio: 65 + 30 = 95, 95 − 1 = 94 | Mara: 65 + 30 = 95, 95 + 1 = 96"
            say: "Lio rechnet: fünfundsechzig plus dreißig ist fünfundneunzig, minus eins ist vierundneunzig. Mara rechnet: fünfundsechzig plus dreißig ist fünfundneunzig, plus eins ist sechsundneunzig. Wer hat richtig gerechnet?"
            options: ["nur Lio", "nur Mara", "beide"]
            answer: "nur Lio"
          - id: l2-c14
