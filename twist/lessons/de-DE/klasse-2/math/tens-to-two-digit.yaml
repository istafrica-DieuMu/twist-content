                show: { drawn: hundred-square, highlight: [42] }
                options: ["82", "46", "62"]
                answer: "82"
                hints: ["Jede Zeile nach unten ist ein Zehner mehr."]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? 24 + 60 = 30"
                say: "Vierundzwanzig plus sechzig gleich dreißig. Stimmt das?"
                answer: false
                hints: ["Sechzig sind sechs Zehner."]
              - id: l1-s6
                type: text_input
                text: "9 + 70 = _"
                say: "Neun plus siebzig."
                answer: "79"
                hints: ["Neun hat keinen Zehner. Wie viele Zehner kommen dazu?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "33 + 40 = _"
                say: "Dreiunddreißig plus vierzig."
                answer: "73"
              - id: l1-n2
                type: multiple_choice
                text: "56 + 30 = ?"
                say: "Sechsundfünfzig plus dreißig."
                options: ["86", "59", "89"]
                answer: "86"
              - id: l1-n3
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Erst die Zehner, dann die große Aufgabe."
                frame: "10 + 60 = _ | 18 + 60 = _"
                options: ["70", "78", "24", "16"]
                answer: ["70", "78"]
              - id: l1-n4
                type: multiple_choice
