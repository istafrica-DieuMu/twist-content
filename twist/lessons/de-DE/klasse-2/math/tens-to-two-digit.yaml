# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.tens-to-two-digit
skill: math.add-sub-to-100.tens-to-two-digit
curriculum: de-DE
language: de
title:
  de: Zehner dazu und weg
  en: Adding and taking away tens
summary: >
  Adding and taking away whole tens (34 + 20, 76 − 40). Only the tens
  change; the ones stay. Lesson 1 adds tens with base-ten blocks and on the
  Hundertertafel, where each ten is one row down; lesson 2 takes tens away,
  mixes tens and ones, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.tens, math.add-sub-to-100.ones-no-bridge]
  also_practises: [math.add-sub-to-100.ones-no-bridge, math.numbers-to-100.hundred-square]
  vocabulary: { de: [Zehner, Einer, Zehnerzahl, Hundertertafel, Zeile] }
  forms: [drawn, text, audio]
  drawn: [base-ten, hundred-square]
  facets: []
  parts:
    - { id: add, what: { de: ganze Zehner zu einer zweistelligen Zahl addieren, en: adding whole tens to a two-digit number } }
    - { id: sub, what: { de: ganze Zehner von einer zweistelligen Zahl subtrahieren, en: taking whole tens away from a two-digit number } }
    - { id: model, what: { de: mit Zehnerstangen und auf der Hundertertafel rechnen, en: working with tens rods and on the hundred square } }
    - { id: why, what: { de: "sehen, dass sich nur die Zehner ändern, und die kleine Aufgabe nutzen", en: "seeing that only the tens change, and using the small sum" } }
  misconceptions:
    - id: tens-as-ones
      what: Adds the tens digit to the ones (34 + 20 = 36)
      addressed: Learn shows twenty as two rods joining the rods; the ones answer (45 for 43 + 20) is an option with feedback in l1-f1, and "Which part changes" tasks in both lessons
    - id: both-change
      what: Changes the ones as well (34 + 20 = 50 or 56)
      addressed: hints say the ones stay; "beide" is always an option in "Which part changes" tasks
    - id: tens-minus-wrong-way
      what: Takes the tens away from the ones in a minus sum (76 − 40 = 72)
      addressed: lesson 2 Learn takes rods away, not cubes; the ones answer (63 for 67 − 40) is an option with feedback in l2-f1
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner dazu, en: Adding tens }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "30 + 20 = ?"
            say: "Dreißig plus zwanzig."
            options: ["32", "50", "5"]
            answer: "50"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "41 + 3 = _"
            say: "Einundvierzig plus drei."
            answer: "44"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "34 + 20"
            say: "Vierunddreißig plus zwanzig. Zwanzig sind zwei Zehner. Die zwei Zehnerstangen kommen zu den drei Zehnerstangen."
            show: { drawn: base-ten, tens: 3, ones: 4 }
          - text: "34 + 20 = 54"
            say: "Jetzt sind es fünf Zehner. Die vier Einer bleiben. Fünf Zehner und vier Einer: vierundfünfzig."
            show: { drawn: base-ten, tens: 5, ones: 4 }
          - text: "34 → 44 → 54"
            say: "Auf der Hundertertafel geht es für jeden Zehner eine Zeile nach unten. Von vierunddreißig zwei Zeilen nach unten: vierundvierzig, vierundfünfzig."
            show: { drawn: hundred-square, highlight: [34, 44, 54] }
          - text: "3 + 2 = 5\n30 + 20 = 50"
            say: "Die kleine Aufgabe hilft: Drei Zehner und zwei Zehner sind fünf Zehner."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "43 + 20 = ?"
                say: "Dreiundvierzig plus zwanzig."
                options: ["63", "45", "65"]
                answer: "63"
                feedback:
                  "45": "Zwanzig sind zwei Zehner, nicht zwei Einer. Sie kommen zu den Zehnern."
                  "65": "Die Einer bleiben drei. Nur die Zehner ändern sich."
                hints:
                  - "Zwanzig sind zwei Zehner."
                  - "Vier Zehner und zwei Zehner sind sechs Zehner. Die drei Einer bleiben."
                  - "63."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "52 + 30: Was ändert sich?"
                say: "Zweiundfünfzig plus dreißig. Was ändert sich?"
                options: ["die Zehner", "die Einer", "beide"]
                answer: "die Zehner"
                feedback:
                  "die Einer": "Dreißig sind drei Zehner. Sie kommen zu den Zehnern."
                hints:
                  - "Ist dreißig eine Zehnerzahl?"
                  - "Drei Zehner kommen zu den fünf Zehnern."
                  - "Nur die Zehner."
              - id: l1-f3
                type: fill_in_blank
                text: "Die kleine Aufgabe hilft."
                say: "Rechne erst mit den Zehnern, dann die große Aufgabe."
                frame: "20 + 40 = _ | 26 + 40 = _"
                options: ["60", "66", "30", "62"]
                answer: ["60", "66"]
                hints:
                  - "Zwei Zehner und vier Zehner."
                  - "Die sechs Einer bleiben."
                  - "60, und dann 66."
              - id: l1-f4
                type: text_input
                text: "17 + 30 = _"
                say: "Siebzehn plus dreißig."
                show: { drawn: base-ten, tens: 1, ones: 7 }
                answer: "47"
                hints:
                  - "Leg drei Zehnerstangen dazu."
                  - "Ein Zehner und drei Zehner sind vier Zehner."
                  - "47."
              - id: l1-f5
                type: multiple_choice
                text: "Wo landest du? 23 + 30"
                say: "Auf der Hundertertafel: Fang bei dreiundzwanzig an. Drei Zeilen nach unten. Wo landest du?"
                show: { drawn: hundred-square, highlight: [23] }
                options: ["53", "26", "33"]
                answer: "53"
                feedback:
                  "26": "Das sind drei Schritte nach rechts. Ein Zehner ist eine Zeile nach unten."
                hints:
                  - "Eine Zeile nach unten ist ein Zehner mehr."
                  - "33, 43, 53."
                  - "53."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 45 + 40 = 85"
                say: "Fünfundvierzig plus vierzig gleich fünfundachtzig. Stimmt das?"
                answer: true
                hints:
                  - "Vier Zehner und vier Zehner."
                  - "Acht Zehner, und die fünf Einer bleiben."
                  - "Ja."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "61 + 20 = _"
                say: "Einundsechzig plus zwanzig."
                answer: "81"
                hints: ["Rechne nur mit den Zehnern. Die Einer bleiben."]
              - id: l1-s2
                type: multiple_choice
                text: "38 + 50: Was ändert sich?"
                say: "Achtunddreißig plus fünfzig. Was ändert sich?"
