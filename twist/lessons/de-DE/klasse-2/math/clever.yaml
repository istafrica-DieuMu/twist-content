# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.clever
skill: math.add-sub-to-100.clever
curriculum: de-DE
language: de
title:
  de: Geschickt rechnen
  en: Calculating cleverly
summary: >
  Two tricks for numbers just below a full ten. Lesson 1 recalls the
  Hilfsaufgabe for plus and carries it over to minus and to numbers two
  below a ten: add or take away the full ten, then put right what was too
  much (63 − 29 = 63 − 30 + 1, 58 + 28 = 58 + 30 − 2). Lesson 2 teaches
  gleichsinniges Verändern for minus: change both numbers the same way so
  the second becomes a full ten (52 − 18 = 54 − 20), and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.sub-two-digit]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { de: [geschickt rechnen, Hilfsaufgabe, voller Zehner, gleichsinniges Verändern, Abstand] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  parts:
    - { id: add, what: { de: Plusaufgaben mit einer Hilfsaufgabe rechnen, en: adding by rounding and adjusting } }
    - { id: sub, what: { de: Minusaufgaben mit einer Hilfsaufgabe rechnen, en: subtracting by rounding and adjusting } }
    - { id: same-way, what: { de: bei Minusaufgaben beide Zahlen gleich verändern, en: changing both numbers of a subtraction the same way } }
  misconceptions:
    - id: adjust-wrong-way
      what: Puts the difference right in the wrong direction (63 − 29 = 63 − 30 − 1; 58 + 29 = 58 + 30 + 1)
      addressed: lesson 1 Learn sets the plus and minus Hilfsaufgabe side by side ("eins zu viel addiert" against "eins zu viel weggenommen"); a task asks only which way to put it right, and the wrong-way results are options with feedback
    - id: change-opposite-ways
      what: Makes one number of a minus sum bigger and the other smaller (53 − 28 = 51 − 30)
      addressed: lesson 2 Learn says both numbers change the same way and the gap stays the same; a true/false task in the full stage has feedback for it
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Hilfsaufgaben bei Plus und Minus, en: Rounding and adjusting }
    goal:
      de: "Rechne mit dem vollen Zehner und gleich dann aus, so wie bei 63 − 29 erst minus 30, dann plus 1."
      en: "Use the full ten first and then put it right, like 63 − 29 as minus 30 and then plus 1."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 20 = _"
            answer: "65"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "63 − 30 = _"
            answer: "33"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + 19: plus 19 oder plus 20?"
            say: "Fünfundvierzig plus neunzehn. Was glaubst du: Was geht leichter im Kopf, plus neunzehn oder plus zwanzig?"
          - text: "45 + 19 = 45 + 20 − 1"
            say: "Plus zwanzig geht leichter. Die Hilfsaufgabe kennst du schon: Fünfundvierzig plus neunzehn rechnest du als fünfundvierzig plus zwanzig, und dann eins wieder weg. Vierundsechzig."
            show: { drawn: rechenstrich, start: 45, jumps: [20, -1] }
          - text: "63 − 29 = 63 − 30 + 1 = 34"
            say: "Neu ist die Hilfsaufgabe bei Minus. Mit dreißig haben wir eins zu viel weggenommen. Also legen wir eins wieder dazu: vierunddreißig."
            show: { drawn: rechenstrich, start: 63, jumps: [-30, 1] }
          - text: "58 + 28 = 58 + 30 − 2 = 86"
            say: "Endet eine Zahl auf acht, fehlen zwei bis zum vollen Zehner. Achtundfünfzig plus dreißig ist achtundachtzig. Das sind zwei zu viel, also minus zwei: sechsundachtzig."
            show: { drawn: rechenstrich, start: 58, jumps: [30, -2] }
          - text: "81 − 48 = 81 − 50 + 2 = 33"
            say: "Bei Minus legst du die zwei wieder dazu: Einundachtzig minus fünfzig ist einunddreißig, plus zwei ist dreiunddreißig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                say: "Sechsunddreißig plus neunzehn. Rechne erst plus zwanzig."
                frame: "36 + 19 = 36 + 20 − _ = _"
                options: ["1", "9", "55", "56", "57"]
                answer: ["1", "55"]
                hints:
                  - "19 ist eins weniger als 20."
                  - "36 + 20 = 56."
                  - "56 − 1 = 55."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "54 − 19 = ?"
                say: "Vierundfünfzig minus neunzehn."
                show: { drawn: rechenstrich, start: 54, jumps: [-20, 1] }
                options: ["35", "33", "34"]
                answer: "35"
                feedback:
                  "33": "Mit 20 hast du eins zu viel weggenommen. Das legst du wieder dazu, du nimmst nicht noch eins weg."
                  "34": "54 − 20 = 34. Jetzt noch eins dazulegen."
                hints:
                  - "Nimm 20 weg statt 19."
                  - "54 − 20 = 34."
                  - "34 + 1 = 35."
              - id: l1-f3
                type: multiple_choice
                text: "Für 72 − 29 rechnest du 72 − 30. Was musst du danach tun?"
                say: "Für zweiundsiebzig minus neunundzwanzig rechnest du zweiundsiebzig minus dreißig. Musst du danach eins dazulegen oder eins wegnehmen?"
                options: ["eins dazulegen", "eins wegnehmen"]
                answer: "eins dazulegen"
                feedback:
                  "eins wegnehmen": "Mit 30 hast du eins zu viel weggenommen. Das legst du wieder dazu."
                hints:
                  - "Du hast 30 statt 29 weggenommen."
                  - "Das ist eins zu viel weggenommen."
                  - "Eins dazulegen."
              - id: l1-f4
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                say: "Sechsundvierzig plus achtundzwanzig. Rechne erst plus dreißig."
                frame: "46 + 28 = 46 + 30 − _ = _"
                options: ["2", "8", "74", "76", "78"]
                answer: ["2", "74"]
                hints:
                  - "28 ist zwei weniger als 30."
                  - "46 + 30 = 76."
                  - "76 − 2 = 74."
              - id: l1-f5
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                frame: "81 − 39 = 81 − 40 + _ = _"
                options: ["1", "9", "42", "41", "40"]
                answer: ["1", "42"]
                hints:
                  - "39 ist eins weniger als 40."
                  - "81 − 40 = 41."
                  - "41 + 1 = 42."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 58 + 29 = 58 + 30 + 1"
                say: "Achtundfünfzig plus neunundzwanzig ist dasselbe wie achtundfünfzig plus dreißig plus eins. Stimmt das?"
                answer: false
                feedback:
                  "true": "30 ist eins mehr als 29. Du hast eins zu viel addiert, also minus 1: 58 + 30 − 1."
                hints:
                  - "Ist 30 mehr oder weniger als 29?"
                  - "Mit 30 hast du eins zu viel addiert."
                  - "Nein, richtig ist 58 + 30 − 1."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                frame: "47 + 29 = 47 + 30 − _ = _"
                options: ["1", "9", "76", "77", "78"]
                answer: ["1", "76"]
                hints: ["Wie weit ist 29 von 30 weg?"]
              - id: l1-s2
                type: multiple_choice
                text: "65 − 29 = ?"
                options: ["36", "34", "35"]
                answer: "36"
                hints: ["Bei Minus legst du danach wieder dazu."]
              - id: l1-s3
                type: text_input
                text: "33 + 48 = _"
                answer: "81"
                hints: ["Wie weit ist 48 von 50 weg?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 92 − 48 = 92 − 50 + 2"
                say: "Zweiundneunzig minus achtundvierzig ist dasselbe wie zweiundneunzig minus fünfzig plus zwei. Stimmt das?"
                answer: true
                hints: ["Wie viel hast du mit 50 zu viel weggenommen?"]
              - id: l1-s5
                type: text_input
                text: "74 − 19 = _"
                answer: "55"
                hints: ["Nimm erst einen vollen Zehner weg."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Rechne mit der Hilfsaufgabe."
                frame: "25 + 59 = 25 + 60 − _ = _"
                options: ["1", "9", "84", "85", "86"]
                answer: ["1", "84"]
              - id: l1-n2
                type: multiple_choice
                text: "Ein Clown hat 83 Luftballons. 39 fliegen davon. Wie viele Luftballons hat er noch?"
                say: "Ein Clown hat dreiundachtzig Luftballons. Neununddreißig fliegen davon. Wie viele Luftballons hat er noch?"
                show: { object: balloon, count: 3, layout: scattered }
                options: ["44", "42", "43"]
                answer: "44"
                feedback:
                  "42": "Mit 40 ist ein Ballon zu viel davongeflogen. Den holst du zurück: plus eins."
                  "43": "83 − 40 = 43. Ein Ballon war zu viel, den legst du wieder dazu."
              - id: l1-n3
                type: text_input
                text: "16 + 68 = _"
                answer: "84"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 71 − 18 = 71 − 20 − 2"
                say: "Einundsiebzig minus achtzehn ist dasselbe wie einundsiebzig minus zwanzig minus zwei. Stimmt das?"
                answer: false
              - id: l1-n5
                type: text_input
                text: "56 − 28 = _"
                answer: "28"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "44 + 29 = _"
            say: "Vierundvierzig plus neunundzwanzig."
            answer: "73"
          - id: l1-c2
            type: multiple_choice
            text: "62 − 19 = ?"
            say: "Zweiundsechzig minus neunzehn."
            options: ["43", "41", "42"]
            answer: "43"
          - id: l1-c3
            type: fill_in_blank
            text: "Rechne mit der Hilfsaufgabe."
            say: "Rechne mit der Hilfsaufgabe. Achtunddreißig plus neunundvierzig."
            frame: "38 + 49 = 38 + 50 − _ = _"
            options: ["1", "9", "87", "88", "89"]
            answer: ["1", "87"]
          - id: l1-c4
            type: true_false
            text: "Stimmt das? 47 + 38 = 47 + 40 − 2"
            say: "Siebenundvierzig plus achtunddreißig ist dasselbe wie siebenundvierzig plus vierzig minus zwei. Stimmt das?"
            answer: true
          - id: l1-c5
            type: text_input
            text: "72 − 49 = _"
            say: "Zweiundsiebzig minus neunundvierzig."
            answer: "23"
          - id: l1-c6
            type: fill_in_blank
            text: "Rechne mit der Hilfsaufgabe."
            say: "Rechne mit der Hilfsaufgabe. Dreiundneunzig minus neunundfünfzig."
            frame: "93 − 59 = 93 − 60 + _ = _"
            options: ["1", "9", "34", "33", "32"]
            answer: ["1", "34"]

  - n: 2
    title: { de: Beide Zahlen verändern, en: Changing both numbers }
    goal:
      de: "Verändere bei Minusaufgaben beide Zahlen gleich, so wird aus 52 − 18 die leichte Aufgabe 54 − 20."
      en: "Change both numbers by the same amount when you take away, so 52 − 18 becomes the easy 54 − 20."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "54 − 20 = _"
            answer: "34"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "36 − 19 = ?"
            options: ["17", "15", "16"]
            answer: "17"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "52 − 18 und 54 − 20: gleich viel?"
            say: "Zweiundfünfzig minus achtzehn, und vierundfünfzig minus zwanzig. Was glaubst du: Kommt bei beiden Aufgaben dasselbe heraus?"
          - text: "52 − 18 = 54 − 20"
            say: "Ja! Für Minusaufgaben ist das ein Trick: Verändere beide Zahlen gleich. Wir legen bei beiden Zahlen zwei dazu. Aus achtzehn wird zwanzig, aus zweiundfünfzig wird vierundfünfzig. Der Abstand zwischen den Zahlen bleibt gleich. Das heißt gleichsinniges Verändern."
          - text: "54 − 20 = 34"
            say: "Vierundfünfzig minus zwanzig ist leicht: vierunddreißig. Also ist auch zweiundfünfzig minus achtzehn gleich vierunddreißig."
          - text: "beide + 2"
            say: "Pass auf: Beide Zahlen werden um gleich viel größer. Machst du eine größer und die andere kleiner, stimmt das Ergebnis nicht mehr."
          - text: "Wusstest du? Ist deine Schwester 3 Jahre älter als du, bleibt sie das für immer: mit 7 und 10, mit 50 und 53."
            say: "Wusstest du? Ist deine Schwester drei Jahre älter als du, bleibt sie das für immer. Mit sieben und zehn, mit fünfzig und dreiundfünfzig. Jedes Jahr werdet ihr beide eins älter, und der Abstand bleibt gleich. Genau wie beim Trick mit beiden Zahlen."
            show: { object: sister, count: 1 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Verändere beide Zahlen gleich."
                say: "Dreiundsechzig minus achtundzwanzig. Mach aus der achtundzwanzig eine dreißig."
                frame: "63 − 28 = 65 − _ = _"
                options: ["30", "26", "35", "37", "33"]
                answer: ["30", "35"]
                hints:
                  - "Aus 28 wird 30: plus 2."
                  - "Dann auch 63 plus 2: 65."
                  - "65 − 30 = 35."
                difficulty: easy
              - id: l2-f2
