                say: "Beim Schulfest gibt es vierundsechzig Stück Kuchen. Siebenundzwanzig Stück werden gegessen. Wie viele Stücke sind noch da?"
                show: { object: cake, count: 1 }
                options: ["37", "43", "47"]
                answer: "37"

