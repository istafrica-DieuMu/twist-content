                say: "Fünfundvierzig minus neunzehn ist dasselbe wie sechsundvierzig minus zwanzig. Stimmt das?"
                answer: true
                hints:
                  - "Wie viel kommt bei der 19 dazu?"
                  - "Bei beiden Zahlen kommt 1 dazu."
                  - "Ja."
              - id: l2-f4
                type: text_input
                text: "82 − 37 = _"
                say: "Zweiundachtzig minus siebenunddreißig."
                answer: "45"
                hints:
                  - "Mach aus 37 eine 40: plus 3."
                  - "82 plus 3 ist 85."
                  - "85 − 40 = 45."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? 53 − 28 = 51 − 30"
                say: "Dreiundfünfzig minus achtundzwanzig ist dasselbe wie einundfünfzig minus dreißig. Stimmt das?"
                answer: false
                feedback:
                  "true": "Die 28 wird um 2 größer, also muss auch die 53 um 2 größer werden: 55 − 30."
                hints:
                  - "Was passiert mit der 28, was mit der 53?"
                  - "28 wird größer, 53 wird hier kleiner."
                  - "Nein, richtig ist 55 − 30."
              - id: l2-f6
