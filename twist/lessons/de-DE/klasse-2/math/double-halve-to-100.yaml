# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.double-halve-to-100
skill: math.numbers-to-100.double-halve
curriculum: de-DE
language: de
title:
  de: Verdoppeln und halbieren bis 100
  en: Doubling and halving to 100
summary: >
  Doubling numbers to 50 and halving even numbers to 100 by splitting
  into tens and ones: double 34 is double 30 and double 4. Lesson 1
  doubles; lesson 2 halves, including halving an odd number of tens (half
  of 50 is 25), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-20.double-halve-to-20, math.numbers-to-100.place-value]
  also_practises: [math.numbers-to-100.bundle-tens]
  vocabulary: { de: [verdoppeln, das Doppelte, halbieren, die Hälfte, gerade] }
  forms: [drawn, text, audio]
  drawn: [base-ten]
  facets: []
  parts:
    - { id: double, what: { de: Zehner und Einer einzeln verdoppeln, en: doubling the tens and the ones } }
    - { id: double-over, what: { de: "verdoppeln, wenn die Einer über zehn kommen", en: doubling when the ones make more than ten } }
    - { id: halve, what: { de: Zahlen mit gerader Zehnerzahl halbieren, en: halving numbers with an even number of tens } }
    - { id: halve-odd-tens, what: { de: Zahlen mit ungerader Zehnerzahl halbieren, en: halving numbers with an odd number of tens } }
  misconceptions:
    - id: double-ones-only
      what: Doubles only the ones (double 23 as 26)
      addressed: Learn doubles the tens and the ones separately with base-ten blocks; feedback on 18 for double 14 says so
    - id: half-of-odd-tens
      what: Cannot halve 50 or 70 because 5 and 7 tens do not split evenly
      addressed: lesson 2 learn changes one ten into ten ones before halving
    - id: double-adds-two
      what: Thinks doubling means adding 2
      addressed: "Learn says that verdoppeln means noch einmal so viel"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Verdoppeln, en: Doubling }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Das Doppelte von 6"
            say: "Was ist das Doppelte von sechs?"
            options: ["8", "12", "66"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Die Hälfte von 10"
            say: "Was ist die Hälfte von zehn?"
            options: ["5", "2", "20"]
            answer: "5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "23"
            say: "Verdoppeln heißt: noch einmal so viel. Hier sind dreiundzwanzig: zwei Zehner und drei Einer."
            show: { drawn: base-ten, tens: 2, ones: 3 }
          - text: "23 + 23"
            say: "Wir legen noch einmal dreiundzwanzig dazu. Jetzt sind es vier Zehner und sechs Einer."
            show: { drawn: base-ten, tens: 4, ones: 6 }
          - text: "Das Doppelte von 23 ist 46"
            say: "Ein Trick: Verdopple die Zehner und die Einer einzeln. Das Doppelte von zwanzig ist vierzig, das Doppelte von drei ist sechs. Vierzig und sechs sind sechsundvierzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Das Doppelte von 30"
                say: "Was ist das Doppelte von dreißig?"
                show: { drawn: base-ten, tens: 3, ones: 0 }
                options: ["32", "60", "33"]
                answer: "60"
                hints:
                  - "Noch einmal drei Zehner dazu."
                  - "Drei Zehner und drei Zehner sind sechs Zehner."
                  - "Das Doppelte von 30 ist 60."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Das Doppelte von 14"
                say: "Was ist das Doppelte von vierzehn?"
                show: { drawn: base-ten, tens: 1, ones: 4 }
                options: ["18", "28", "24"]
                answer: "28"
                feedback:
                  "18": "Du hast nur die Einer verdoppelt. Verdopple auch den Zehner."
                hints:
                  - "Verdopple die Zehner und die Einer einzeln."
                  - "Das Doppelte von 10 ist 20, das Doppelte von 4 ist 8."
                  - "20 und 8 sind 28."
              - id: l1-f3
                type: fill_in_blank
                text: "Das Doppelte von 32"
                say: "Verdopple zweiunddreißig. Erst die Zehner, dann die Einer."
                frame: "60 + _ = _"
                options: ["2", "4", "62", "64"]
                answer: ["4", "64"]
                hints:
                  - "Das Doppelte von 30 ist 60."
                  - "Das Doppelte von 2 ist 4."
                  - "60 + 4 = 64."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Das Doppelte von 25 ist 50."
                say: "Das Doppelte von fünfundzwanzig ist fünfzig. Stimmt das?"
                answer: true
                hints:
                  - "Das Doppelte von 20 ist 40."
                  - "Das Doppelte von 5 ist 10."
                  - "40 und 10 sind 50. Das stimmt."
              - id: l1-f5
                type: text_input
                text: "Das Doppelte von 41"
                say: "Was ist das Doppelte von einundvierzig?"
                answer: "82"
                hints:
                  - "Verdopple die Zehner und die Einer einzeln."
                  - "Das Doppelte von 40 ist 80, von 1 ist 2."
                  - "Das sind 82."
              - id: l1-f6
