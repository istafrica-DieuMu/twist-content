# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.certain-possible-impossible
skill: math.chance.certain-possible-impossible
curriculum: de-DE
language: de
title:
  de: Sicher, möglich, unmöglich
  en: Certain, possible, impossible
summary: >
  Lesson 1 sorts what can happen into sicher, möglich and unmöglich with
  Glücksräder, a normal Würfel and everyday events (a wheel that is all
  red always stops on red; a 7 is unmöglich with a Würfel); lesson 2
  splits möglich into wahrscheinlich and unwahrscheinlich by counting
  fields on the wheel or balls in a bag (five red fields and one blue:
  blue is möglich, but unwahrscheinlich), orders the words from
  unmöglich to sicher, and ends with the skill check. Spinning a real
  wheel or drawing balls waits for an experiment task.
metadata:
  year: klasse-2
  topic: { de: Wahrscheinlichkeit, en: Chance }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: []
  vocabulary: { de: [sicher, möglich, unmöglich, wahrscheinlich, unwahrscheinlich, Glücksrad, Würfel, ziehen] }
  forms: [text, audio, drawn]
  drawn: [spinner, dots]
  facets: []
  parts:
    - { id: certain, what: { de: "sagen, ob etwas sicher, möglich oder unmöglich ist", en: "saying whether something is certain, possible or impossible" } }
    - { id: likely, what: { de: wahrscheinlich und unwahrscheinlich unterscheiden, en: telling likely from unlikely } }
    - { id: wheel, what: { de: das Glücksrad oder Säckchen zu einer Aussage finden, en: finding the spinner or bag that fits a statement } }
  misconceptions:
    - id: possible-is-certain
      what: Calls an event sicher because it can happen (blue is on the wheel, so blue will come)
      addressed: lesson 1 Learn shows a red and blue wheel where both can come but neither must; l1-f3 (with feedback), l1-s3, l1-n6 and l1-c3 ask about one colour of several, l2-n3 and l2-c4 contrast sicher with wahrscheinlich
    - id: rare-is-impossible
      what: Calls an unlikely event unmöglich because it hardly ever happens (one blue field of six)
      addressed: lesson 2 Learn says blue is möglich, but unwahrscheinlich; l2-f1 (with feedback), l2-s1, l2-n2, l2-n6 and l2-c2 offer unmöglich for a colour that is there only once
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Sicher, möglich oder unmöglich", en: "Certain, possible or impossible" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "Das Glücksrad ist ganz rot."
            say: "Dieses Glücksrad ist ganz rot. Wenn du es drehst, bleibt der Zeiger auf Rot stehen. Das ist sicher. Blau kann gar nicht kommen. Das ist unmöglich."
            show: { drawn: spinner, sectors: [red, red, red, red] }
          - text: "Rot und Blau sind möglich."
            say: "Dieses Glücksrad hat rote und blaue Felder. Rot kann kommen. Blau kann auch kommen. Beides ist möglich. Vorher weißt du nicht, was kommt."
            show: { drawn: spinner, sectors: [red, blue, red, blue] }
          - text: "Würfel: 1, 2, 3, 4, 5, 6\nEine 4 ist möglich.\nEine 7 ist unmöglich."
            say: "Auf einem Würfel stehen die Zahlen eins bis sechs. Eine Vier ist möglich. Eine Sieben ist unmöglich, die gibt es auf dem Würfel nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Zeiger bleibt auf Rot stehen."
                say: "Du drehst das Glücksrad. Der Zeiger bleibt auf Rot stehen. Ist das sicher, möglich oder unmöglich?"
                show: { drawn: spinner, sectors: [red, red, red, red] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "sicher"
                keep_order: true
                feedback:
                  "möglich": "Das Rad hat nur rote Felder. Dann kommt immer Rot. Das ist sicher."
                hints:
                  - "Schau dir alle Felder an. Welche Farben gibt es?"
                  - "Alle Felder sind rot. Kann eine andere Farbe kommen?"
                  - "Es kommt immer Rot. Das ist sicher."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Der Zeiger bleibt auf Gelb stehen."
                say: "Du drehst das Glücksrad. Der Zeiger bleibt auf Gelb stehen. Ist das sicher, möglich oder unmöglich?"
                show: { drawn: spinner, sectors: [red, blue, red, blue] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "unmöglich"
                keep_order: true
                feedback:
                  "möglich": "Auf dem Rad gibt es kein gelbes Feld. Gelb kann nicht kommen."
                hints:
                  - "Such ein gelbes Feld auf dem Rad."
                  - "Es gibt nur rote und blaue Felder."
                  - "Gelb ist gar nicht da. Das ist unmöglich."
                difficulty: easy
              - id: l1-f3
                type: multiple_choice
                text: "Der Zeiger bleibt auf Blau stehen."
                say: "Du drehst das Glücksrad. Der Zeiger bleibt auf Blau stehen. Ist das sicher, möglich oder unmöglich?"
                show: { drawn: spinner, sectors: [red, blue, yellow, green] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "möglich"
                keep_order: true
                feedback:
                  "sicher": "Blau kann kommen, aber es muss nicht. Es gibt auch Rot, Gelb und Grün."
                  "unmöglich": "Schau genau: Es gibt ein blaues Feld. Blau kann also kommen."
                hints:
                  - "Gibt es ein blaues Feld? Gibt es auch andere Farben?"
                  - "Blau ist da. Aber Rot, Gelb und Grün sind auch da."
                  - "Blau kann kommen, muss aber nicht. Das ist möglich."
              - id: l1-f4
                type: multiple_choice
                text: "Du würfelst eine 8."
                say: "Du würfelst mit einem normalen Würfel. Du würfelst eine Acht. Ist das sicher, möglich oder unmöglich?"
                options: ["sicher", "möglich", "unmöglich"]
                answer: "unmöglich"
                keep_order: true
                feedback:
                  "möglich": "Auf einem Würfel stehen nur die Zahlen 1 bis 6. Eine 8 gibt es nicht."
                hints:
                  - "Welche Zahlen stehen auf einem Würfel?"
                  - "Ein Würfel hat 1, 2, 3, 4, 5 und 6."
                  - "Eine 8 gibt es nicht. Das ist unmöglich."
              - id: l1-f5
                type: multiple_choice
                text: "Morgen früh geht die Sonne auf."
                say: "Morgen früh geht die Sonne auf. Ist das sicher, möglich oder unmöglich?"
                show: { object: sun }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "sicher"
                keep_order: true
                hints:
                  - "Denk an jeden Morgen. Was passiert da immer?"
                  - "Auch wenn es regnet, wird es am Morgen hell."
                  - "Die Sonne geht jeden Morgen auf. Das ist sicher."
              - id: l1-f6
                type: image_multiple_choice
                text: "Bei welchem Glücksrad ist Blau unmöglich?"
                say: "Bei welchem Glücksrad ist Blau unmöglich?"
                options:
                  - { drawn: spinner, sectors: [red, yellow, red, yellow], key: "rot-gelb" }
                  - { drawn: spinner, sectors: [blue, yellow, blue, yellow], key: "blau-gelb" }
                  - { drawn: spinner, sectors: [blue, blue, blue, blue], key: "blau" }
                answer: "rot-gelb"
                hints:
                  - "Unmöglich heißt: Blau kann gar nicht kommen."
                  - "Such das Rad, auf dem kein blaues Feld ist."
                  - "Das Rad mit Rot und Gelb."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Der Zeiger bleibt auf Gelb stehen."
                say: "Der Zeiger bleibt auf Gelb stehen. Ist das sicher, möglich oder unmöglich?"
                show: { drawn: spinner, sectors: [yellow, yellow, yellow] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "sicher"
                keep_order: true
                hints: ["Gibt es auf dem Rad eine andere Farbe als Gelb?"]
              - id: l1-s2
                type: multiple_choice
                text: "Der Zeiger bleibt auf Blau stehen."
                say: "Der Zeiger bleibt auf Blau stehen. Ist das sicher, möglich oder unmöglich?"
                show: { drawn: spinner, sectors: [green, green, red] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "unmöglich"
                keep_order: true
                hints: ["Such ein blaues Feld."]
              - id: l1-s3
                type: multiple_choice
                text: "Du würfelst eine 3."
                say: "Du würfelst mit einem normalen Würfel. Du würfelst eine Drei. Ist das sicher, möglich oder unmöglich?"
                options: ["sicher", "möglich", "unmöglich"]
                answer: "möglich"
                keep_order: true
                feedback:
                  "sicher": "Eine 3 kann kommen. Aber es kann auch eine andere Zahl kommen."
                hints: ["Die 3 ist auf dem Würfel. Aber muss sie kommen?"]
              - id: l1-s4
                type: multiple_choice
                text: "Ein Hund fliegt allein zum Mond."
                say: "Ein Hund fliegt allein zum Mond. Ist das sicher, möglich oder unmöglich?"
                show: { objects: [dog, moon] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "unmöglich"
                keep_order: true
                hints: ["Kann ein Hund fliegen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Heute Nachmittag regnet es."
                say: "Heute Nachmittag regnet es. Ist das sicher, möglich oder unmöglich?"
                options: ["sicher", "möglich", "unmöglich"]
                answer: "möglich"
                keep_order: true
                hints: ["Weißt du jetzt schon genau, wie das Wetter wird?"]
              - id: l1-s6
                type: image_multiple_choice
                text: "Bei welchem Glücksrad ist Rot sicher?"
                say: "Bei welchem Glücksrad ist Rot sicher?"
                options:
                  - { drawn: spinner, sectors: [red, blue, red, blue], key: "rot-blau" }
                  - { drawn: spinner, sectors: [red, red, red, red], key: "rot" }
                  - { drawn: spinner, sectors: [red, red, red, green], key: "rot-gruen" }
                answer: "rot"
                hints: ["Sicher heißt: Es kommt immer Rot. Dann gibt es keine andere Farbe."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: sorting
                text: "Sicher, möglich oder unmöglich?"
                say: "Lies jede Karte. Ist das sicher, möglich oder unmöglich? Sortiere."
                bins:
                  - { id: sicher, show: { text: "sicher" }, say: "sicher" }
                  - { id: moeglich, show: { text: "möglich" }, say: "möglich" }
                  - { id: unmoeglich, show: { text: "unmöglich" }, say: "unmöglich" }
                options:
                  - { text: "Nach Montag kommt Dienstag.", bin: sicher }
                  - { text: "Du findest heute einen Euro.", bin: moeglich }
                  - { text: "Ein Fisch fährt Fahrrad.", bin: unmoeglich }
                  - { text: "Du würfelst eine 6.", bin: moeglich }
              - id: l1-n2
                type: multiple_choice
                text: "Der Zeiger bleibt auf Grün stehen."
                say: "Der Zeiger bleibt auf Grün stehen. Ist das sicher, möglich oder unmöglich?"
                show: { drawn: spinner, sectors: [red, blue] }
                options: ["sicher", "möglich", "unmöglich"]
                answer: "unmöglich"
                keep_order: true
              - id: l1-n3
                type: true_false
                text: "Lena sagt: „Rot ist möglich.“"
                say: "Lena sagt: Bei diesem Glücksrad ist Rot möglich. Stimmt das?"
                show: { drawn: spinner, sectors: [blue, blue, red, blue] }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Du würfelst eine Zahl von 1 bis 6."
                say: "Du würfelst mit einem normalen Würfel. Du würfelst eine Zahl von eins bis sechs. Ist das sicher, möglich oder unmöglich?"
                options: ["sicher", "möglich", "unmöglich"]
                answer: "sicher"
                keep_order: true
              - id: l1-n5
                type: multiple_choice
                text: "Im Dezember fällt Schnee."
                say: "Im Dezember fällt bei dir Schnee. Ist das sicher, möglich oder unmöglich?"
                options: ["sicher", "möglich", "unmöglich"]
                answer: "möglich"
                keep_order: true
              - id: l1-n6
                type: image_multiple_choice
                text: "Bei welchem Glücksrad sind Rot und Gelb möglich?"
                say: "Bei welchem Glücksrad sind Rot und Gelb beide möglich?"
                options:
                  - { drawn: spinner, sectors: [red, red, red], key: "rot" }
                  - { drawn: spinner, sectors: [red, yellow, red, yellow], key: "rot-gelb" }
                  - { drawn: spinner, sectors: [yellow, blue, yellow, blue], key: "gelb-blau" }
                answer: "rot-gelb"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Der Zeiger bleibt auf Gelb stehen. Sicher, möglich oder unmöglich?"
            say: "Der Zeiger bleibt auf Gelb stehen. Ist das sicher, möglich oder unmöglich?"
            show: { drawn: spinner, sectors: [green, green, green, green] }
            options: ["sicher", "möglich", "unmöglich"]
            answer: "unmöglich"
            keep_order: true
          - id: l1-c2
            type: multiple_choice
            text: "Nach Sonntag kommt Montag. Sicher, möglich oder unmöglich?"
            say: "Nach dem Sonntag kommt der Montag. Ist das sicher, möglich oder unmöglich?"
            options: ["sicher", "möglich", "unmöglich"]
            answer: "sicher"
            keep_order: true
          - id: l1-c3
            type: multiple_choice
            text: "Der Zeiger bleibt auf Gelb stehen. Sicher, möglich oder unmöglich?"
            say: "Der Zeiger bleibt auf Gelb stehen. Ist das sicher, möglich oder unmöglich?"
            show: { drawn: spinner, sectors: [red, yellow] }
            options: ["sicher", "möglich", "unmöglich"]
            answer: "möglich"
            keep_order: true
          - id: l1-c4
            type: multiple_choice
            text: "Der Zeiger bleibt auf Rot stehen. Sicher, möglich oder unmöglich?"
            say: "Der Zeiger bleibt auf Rot stehen. Ist das sicher, möglich oder unmöglich?"
            show: { drawn: spinner, sectors: [red, red, red] }
            options: ["sicher", "möglich", "unmöglich"]
            answer: "sicher"
            keep_order: true
          - id: l1-c5
            type: multiple_choice
            text: "Du würfelst eine 2. Sicher, möglich oder unmöglich?"
            say: "Du würfelst mit einem normalen Würfel eine Zwei. Ist das sicher, möglich oder unmöglich?"
            options: ["sicher", "möglich", "unmöglich"]
            answer: "möglich"
            keep_order: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Bei welchem Glücksrad ist Grün möglich?"
            say: "Bei welchem Glücksrad ist Grün möglich?"
            options:
              - { drawn: spinner, sectors: [red, red, red, red], key: "rot" }
              - { drawn: spinner, sectors: [green, red, green, red], key: "gruen-rot" }
              - { drawn: spinner, sectors: [blue, red, blue, red], key: "blau-rot" }
            answer: "gruen-rot"

  - n: 2
    title: { de: "Wahrscheinlich oder unwahrscheinlich", en: "Likely or unlikely" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Der Zeiger bleibt auf Blau stehen."
            say: "Der Zeiger bleibt auf Blau stehen. Ist das sicher, möglich oder unmöglich?"
            show: { drawn: spinner, sectors: [blue, blue, blue] }
            options: ["sicher", "möglich", "unmöglich"]
            answer: "sicher"
            keep_order: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Du würfelst eine 0."
            say: "Du würfelst mit einem normalen Würfel eine Null. Ist das sicher, möglich oder unmöglich?"
            options: ["sicher", "möglich", "unmöglich"]
            answer: "unmöglich"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5 rote Felder, 1 blaues Feld"
            say: "Auf diesem Glücksrad sind fünf Felder rot und nur eins ist blau. Rot und Blau sind beide möglich. Aber der Zeiger bleibt meistens auf Rot stehen. Rot ist wahrscheinlich. Blau ist unwahrscheinlich, aber nicht unmöglich."
            show: { drawn: spinner, sectors: [red, red, blue, red, red, red] }
          - text: "Im Säckchen: 1 rote Kugel, 5 blaue Kugeln"
            say: "In einem Säckchen sind diese Kugeln: eine rote und fünf blaue. Du ziehst eine Kugel, ohne hinzuschauen. Eine blaue Kugel ist wahrscheinlich. Eine rote Kugel ist unwahrscheinlich."
            show: { drawn: dots, count: 6, layout: row, colour_split: [1, 5] }
          - text: "unmöglich\nunwahrscheinlich\nwahrscheinlich\nsicher"
            say: "So kannst du die Wörter ordnen. Unmöglich: Es kommt nie. Unwahrscheinlich: Es kommt selten. Wahrscheinlich: Es kommt oft. Sicher: Es kommt immer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Zeiger bleibt auf Blau stehen."
                say: "Der Zeiger bleibt auf Blau stehen. Ist das wahrscheinlich, unwahrscheinlich oder unmöglich?"
                show: { drawn: spinner, sectors: [red, red, red, blue, red, red] }
                options: ["wahrscheinlich", "unwahrscheinlich", "unmöglich"]
                answer: "unwahrscheinlich"
                keep_order: true
                feedback:
                  "unmöglich": "Ein Feld ist blau. Blau kann also kommen, nur selten."
                  "wahrscheinlich": "Nur ein Feld ist blau, fünf sind rot. Blau kommt selten."
                hints:
                  - "Zähl die blauen Felder und die roten Felder."
                  - "Ein Feld ist blau, fünf Felder sind rot."
                  - "Blau kommt selten. Das ist unwahrscheinlich."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Der Zeiger bleibt auf Rot stehen."
                say: "Der Zeiger bleibt auf Rot stehen. Ist das wahrscheinlich, unwahrscheinlich oder unmöglich?"
                show: { drawn: spinner, sectors: [red, red, red, blue, red, red] }
                options: ["wahrscheinlich", "unwahrscheinlich", "unmöglich"]
                answer: "wahrscheinlich"
                keep_order: true
                hints:
                  - "Zähl die roten Felder."
                  - "Fünf Felder sind rot. Fast das ganze Rad ist rot."
                  - "Rot kommt oft. Das ist wahrscheinlich."
                difficulty: easy
              - id: l2-f3
                type: multiple_choice
                text: "Du ziehst eine rote Kugel."
                say: "Im Säckchen sind diese Kugeln. Du ziehst eine, ohne hinzuschauen. Du ziehst eine rote Kugel. Ist das wahrscheinlich, unwahrscheinlich oder unmöglich?"
                show: { drawn: dots, count: 6, layout: row, colour_split: [5, 1] }
                options: ["wahrscheinlich", "unwahrscheinlich", "unmöglich"]
                answer: "wahrscheinlich"
                keep_order: true
                hints:
                  - "Zähl die roten und die blauen Kugeln."
                  - "Fünf Kugeln sind rot, nur eine ist blau."
                  - "Eine rote Kugel ist wahrscheinlich."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Farbe kommt wahrscheinlich?"
                say: "Du drehst dieses Glücksrad. Welche Farbe kommt wahrscheinlich?"
                show: { drawn: spinner, sectors: [green, green, yellow, green] }
                options: ["Grün", "Gelb", "Rot"]
                answer: "Grün"
                feedback:
                  "Rot": "Auf dem Rad gibt es gar kein Rot. Rot ist unmöglich."
                  "Gelb": "Nur ein Feld ist gelb. Gelb kommt selten."
                hints:
                  - "Welche Farbe hat die meisten Felder?"
                  - "Drei Felder sind grün, eins ist gelb."
                  - "Grün."
              - id: l2-f5
                type: ordering
                text: "Ordne von unmöglich bis sicher."
                say: "Ordne die Wörter. Fang mit unmöglich an und hör mit sicher auf."
                options: ["sicher", "unwahrscheinlich", "unmöglich", "wahrscheinlich"]
                slot_count: 4
                answer: ["unmöglich", "unwahrscheinlich", "wahrscheinlich", "sicher"]
                hints:
                  - "Unmöglich kommt nie. Sicher kommt immer."
                  - "Unwahrscheinlich kommt selten, wahrscheinlich kommt oft."
                  - "unmöglich, unwahrscheinlich, wahrscheinlich, sicher"
              - id: l2-f6
                type: multiple_choice
                text: "Du würfelst keine 6."
                say: "Du würfelst mit einem normalen Würfel. Es kommt keine Sechs. Ist das wahrscheinlich, unwahrscheinlich oder unmöglich?"
                options: ["wahrscheinlich", "unwahrscheinlich", "unmöglich"]
                answer: "wahrscheinlich"
                keep_order: true
                hints:
                  - "Welche Zahlen sind keine 6?"
                  - "1, 2, 3, 4 und 5: Das sind fünf Zahlen. Die 6 ist nur eine."
                  - "Keine 6 ist wahrscheinlich."
                difficulty: stretch

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Zeiger bleibt auf Gelb stehen."
                say: "Der Zeiger bleibt auf Gelb stehen. Ist das wahrscheinlich, unwahrscheinlich oder unmöglich?"
                show: { drawn: spinner, sectors: [blue, blue, yellow, blue, blue, blue] }
                options: ["wahrscheinlich", "unwahrscheinlich", "unmöglich"]
                answer: "unwahrscheinlich"
                keep_order: true
                feedback:
                  "unmöglich": "Ein Feld ist gelb. Gelb kann also kommen."
                hints: ["Wie viele Felder sind gelb, wie viele blau?"]
              - id: l2-s2
                type: multiple_choice
                text: "Du ziehst eine blaue Kugel."
                say: "Im Säckchen sind diese Kugeln. Du ziehst eine blaue Kugel. Ist das wahrscheinlich, unwahrscheinlich oder unmöglich?"
                show: { drawn: dots, count: 8, layout: row, colour_split: [2, 6] }
                options: ["wahrscheinlich", "unwahrscheinlich", "unmöglich"]
                answer: "wahrscheinlich"
                keep_order: true
                hints: ["Zähl die blauen Kugeln und die roten Kugeln."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Rot ist wahrscheinlich. Blau ist unwahrscheinlich. Welches Glücksrad passt?"
                say: "Rot ist wahrscheinlich. Blau ist unwahrscheinlich. Welches Glücksrad passt?"
                options:
                  - { drawn: spinner, sectors: [blue, blue, red, blue], key: "viel-blau" }
                  - { drawn: spinner, sectors: [red, red, blue, red], key: "viel-rot" }
                  - { drawn: spinner, sectors: [red, red, red, red], key: "nur-rot" }
                answer: "viel-rot"
                feedback:
                  "nur-rot": "Hier ist Blau unmöglich, nicht unwahrscheinlich."
                hints: ["Du brauchst viele rote Felder und ein blaues."]
              - id: l2-s4
                type: true_false
                text: "Tom sagt: „Rot ist unmöglich.“"
                say: "Tom sagt: Bei diesem Glücksrad ist Rot unmöglich. Stimmt das?"
                show: { drawn: spinner, sectors: [red, blue, blue, blue] }
                answer: false
                hints: ["Such ein rotes Feld. Ist es da?"]
              - id: l2-s5
                type: matching
                text: "Was passt zu welchem Glücksrad?"
                say: "Was passt zu welchem Glücksrad? Verbinde."
                pairs:
