# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.money-shopping
skill: math.money.shopping
curriculum: de-DE
language: de
title:
  de: Einkaufen und Rückgeld
  en: Shopping and change
summary: >
  Lesson 1 adds up prices (ein Ball für 8 € und ein Buch für 6 € kosten
  14 €) and pays with the right notes and coins; lesson 2 works out the
  Rückgeld by counting up to the note paid with (Preis 17 €, bezahlt mit
  20 €: 3 € zurück), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.amounts-to-100, math.add-sub-to-100.complement]
  also_practises: [math.add-sub-to-100.complement, math.add-sub-to-100.add-two-digit]
  vocabulary: { de: [Preis, kosten, bezahlen, passend, Rückgeld, zurückbekommen] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: change-is-price
      what: Gives the price as the change, or adds instead of subtracting
      addressed: lesson 2 Learn counts up from the price to the note; the Rückgeld choices l2-f1, l2-s1 and l2-n1 offer the price and the sum as options, with feedback in l2-f1
    - id: not-enough
      what: Pays with too little money (a 10-€-Schein for 12 €)
      addressed: "\"Reicht das Geld?\" in every stage of lesson 1"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was kostet alles zusammen?", en: "What does it all cost?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "8 + 6 = _"
            say: "Acht plus sechs."
            answer: "14"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "20 € + 5 € = _ €"
            say: "Ein Zwanziger und ein Fünfer. Wie viel Geld ist das?"
            answer: "25"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ball 8 € + Buch 6 € = 14 €"
            say: "Tom kauft einen Ball für acht Euro und ein Buch für sechs Euro. Zusammen kostet das vierzehn Euro."
            show: { objects: [ball, book] }
          - text: "14 € = 10 € + 2 € + 2 €"
            say: "Tom bezahlt passend: mit einem Zehner und zwei Zweieuromünzen."
          - text: "Reicht das Geld?"
            say: "Bevor du bezahlst, prüfst du: Reicht mein Geld? Hat Tom zehn Euro, reicht es nicht für vierzehn Euro."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "Ein Apfel kostet 1 €, ein Saft 3 €. Was kostet beides zusammen?"
                say: "Ein Apfel kostet einen Euro, ein Saft kostet drei Euro. Wie viel Euro kostet beides zusammen?"
                answer: "4"
                hints:
                  - "Zähle die Preise zusammen."
                  - "Eins plus drei."
                  - "4 €."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Eine Mütze kostet 12 €, ein Schal 15 €. Was kostet beides zusammen?"
                say: "Eine Mütze kostet zwölf Euro, ein Schal kostet fünfzehn Euro. Wie viel Euro kostet beides zusammen?"
                answer: "27"
                hints:
                  - "Zähle die Preise zusammen."
                  - "Zwölf plus zehn ist zweiundzwanzig, plus fünf."
                  - "27 €."
              - id: l1-f3
                type: true_false
                text: "Lea hat 20 €. Sie möchte ein Spiel für 18 € kaufen. Reicht das Geld?"
                say: "Lea hat zwanzig Euro. Sie möchte ein Spiel für achtzehn Euro kaufen. Reicht ihr Geld?"
                answer: true
                hints:
                  - "Ist zwanzig mehr als achtzehn?"
                  - "Zwanzig ist größer, also reicht es."
                  - "Ja, das Geld reicht."
              - id: l1-f4
                type: multiple_choice
                text: "Wie bezahlst du 16 € passend?"
                say: "Wie bezahlst du sechzehn Euro passend?"
                options: ["10 € + 5 € + 1 €", "10 € + 5 €", "20 € + 1 €"]
                answer: "10 € + 5 € + 1 €"
                hints:
                  - "Passend heißt: genau sechzehn Euro."
                  - "Zehn plus fünf plus eins."
                  - "10 € + 5 € + 1 €."
              - id: l1-f5
                type: text_input
                text: "Ein Heft kostet 2 €. Was kosten 4 Hefte?"
                say: "Ein Heft kostet zwei Euro. Wie viel Euro kosten vier Hefte?"
                answer: "8"
                hints:
                  - "Viermal zwei Euro."
                  - "Zwei, vier, sechs, acht."
                  - "8 €."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "Ein Ball kostet 9 €, eine Pumpe 7 €. Was kostet beides zusammen?"
                say: "Ein Ball kostet neun Euro, eine Pumpe kostet sieben Euro. Wie viel Euro kostet beides zusammen?"
                answer: "16"
                hints: ["Neun plus sieben."]
              - id: l1-s2
                type: text_input
                text: "Ein Buch kostet 14 €, ein Stift 3 €. Was kostet beides zusammen?"
                say: "Ein Buch kostet vierzehn Euro, ein Stift kostet drei Euro. Wie viel Euro kostet beides zusammen?"
                answer: "17"
                hints: ["Vierzehn plus drei."]
              - id: l1-s3
                type: true_false
                text: "Ben hat 10 €. Er möchte ein Spielzeugauto für 12 € kaufen. Reicht das Geld?"
                say: "Ben hat zehn Euro. Er möchte ein Spielzeugauto für zwölf Euro kaufen. Reicht sein Geld?"
                answer: false
                hints: ["Ist zehn mehr als zwölf?"]
              - id: l1-s4
                type: multiple_choice
                text: "Wie bezahlst du 23 € passend?"
                say: "Wie bezahlst du dreiundzwanzig Euro passend?"
                options: ["20 € + 2 € + 1 €", "20 € + 2 €", "10 € + 10 € + 5 €"]
                answer: "20 € + 2 € + 1 €"
                hints: ["Genau dreiundzwanzig Euro."]
              - id: l1-s5
                type: text_input
                text: "Eine Kugel Eis kostet 2 €. Was kosten 3 Kugeln?"
                say: "Eine Kugel Eis kostet zwei Euro. Wie viel Euro kosten drei Kugeln?"
                answer: "6"
                hints: ["Dreimal zwei Euro."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "Ein T-Shirt kostet 8 €, eine Hose 25 €. Was kostet beides zusammen?"
                say: "Ein T-Shirt kostet acht Euro, eine Hose kostet fünfundzwanzig Euro. Wie viel Euro kostet beides zusammen?"
                answer: "33"
              - id: l1-n2
                type: text_input
                text: "Brot 3 €, Käse 5 €, Milch 1 €. Was kostet alles zusammen?"
                say: "Ein Brot kostet drei Euro, Käse fünf Euro und Milch einen Euro. Wie viel Euro kostet alles zusammen?"
                answer: "9"
              - id: l1-n3
                type: true_false
                text: "Anna hat 30 €. Sie möchte Schuhe für 29 € kaufen. Reicht das Geld?"
                say: "Anna hat dreißig Euro. Sie möchte Schuhe für neunundzwanzig Euro kaufen. Reicht ihr Geld?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Wie bezahlst du 45 € passend?"
                say: "Wie bezahlst du fünfundvierzig Euro passend?"
                options: ["20 € + 20 € + 5 €", "50 € + 5 €", "20 € + 20 € + 2 €"]
                answer: "20 € + 20 € + 5 €"
              - id: l1-n5
                type: text_input
                text: "Eine Kinokarte kostet 5 €. Was kosten 3 Karten?"
                say: "Eine Kinokarte für Kinder kostet fünf Euro. Wie viel Euro kosten drei Karten?"
                answer: "15"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Ein Kuchen kostet 6 €, Saft 4 €. Was kostet beides zusammen?"
            say: "Ein Kuchen kostet sechs Euro, ein Saft kostet vier Euro. Wie viel Euro kostet beides zusammen?"
            answer: "10"
          - id: l1-c2
            type: true_false
            text: "Tim hat 15 €. Er möchte ein Buch für 17 € kaufen. Reicht das Geld?"
            say: "Tim hat fünfzehn Euro. Er möchte ein Buch für siebzehn Euro kaufen. Reicht sein Geld?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Wie bezahlst du 12 € passend?"
            say: "Wie bezahlst du zwölf Euro passend?"
            options: ["10 € + 2 €", "10 € + 1 €", "5 € + 5 €"]
            answer: "10 € + 2 €"

  - n: 2
    title: { de: "Rückgeld", en: "Change" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "Ein Ball kostet 7 €, ein Heft 2 €. Was kostet beides zusammen?"
            say: "Ein Ball kostet sieben Euro, ein Heft zwei Euro. Wie viel Euro kostet beides zusammen?"
            answer: "9"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "17 + _ = 20"
            say: "Siebzehn plus wie viel ist zwanzig?"
            answer: "3"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Preis 17 € | bezahlt 20 € | Rückgeld 3 €"
            say: "Lea kauft ein Buch für siebzehn Euro. Sie bezahlt mit einem Zwanziger. Die Verkäuferin zählt von siebzehn hoch bis zwanzig: achtzehn, neunzehn, zwanzig. Lea bekommt drei Euro zurück."
          - text: "Preis 36 € | bezahlt 50 € | 36 + 4 = 40 | 40 + 10 = 50"
            say: "Kostet etwas sechsunddreißig Euro und du bezahlst mit fünfzig, zählst du in Schritten hoch: vier Euro bis vierzig, dann zehn Euro bis fünfzig. Du bekommst vierzehn Euro zurück."
          - text: "Rückgeld = bezahlt − Preis"
            say: "Du kannst auch rechnen: fünfzig minus sechsunddreißig. Das Rückgeld ist das, was vom bezahlten Geld übrig bleibt."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Preis 8 €, du bezahlst mit 10 €. Wie viel bekommst du zurück?"
                say: "Etwas kostet acht Euro. Du bezahlst mit einem Zehner. Wie viel Euro bekommst du zurück?"
                options: ["2 €", "8 €", "18 €"]
                answer: "2 €"
                feedback:
                  "18 €": "Zurück bekommst du weniger, als du bezahlt hast. Zähle von acht bis zehn."
                  "8 €": "Acht Euro ist der Preis. Was bleibt von den zehn Euro übrig?"
                hints:
                  - "Zähle vom Preis bis zehn hoch."
                  - "Neun, zehn."
                  - "2 €."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "Preis 15 €, du bezahlst mit 20 €. Wie viel Euro bekommst du zurück?"
                say: "Etwas kostet fünfzehn Euro. Du bezahlst mit einem Zwanziger. Wie viel Euro bekommst du zurück?"
                answer: "5"
                hints:
                  - "Zähle von fünfzehn bis zwanzig hoch."
                  - "Fünfzehn plus wie viel ist zwanzig?"
                  - "5 €."
              - id: l2-f3
                type: text_input
                text: "Preis 43 €, du bezahlst mit 50 €. Wie viel Euro bekommst du zurück?"
                say: "Etwas kostet dreiundvierzig Euro. Du bezahlst mit einem Fünfziger. Wie viel Euro bekommst du zurück?"
                answer: "7"
                hints:
                  - "Zähle bis fünfzig hoch."
                  - "Dreiundvierzig plus wie viel ist fünfzig?"
                  - "7 €."
              - id: l2-f4
                type: true_false
                text: "Preis 26 €, bezahlt mit 50 €. Rückgeld 24 €. Stimmt das?"
                say: "Etwas kostet sechsundzwanzig Euro. Du bezahlst mit einem Fünfziger und bekommst vierundzwanzig Euro zurück. Stimmt das?"
                answer: true
                hints:
                  - "Zähle in Schritten hoch: bis dreißig, dann bis fünfzig."
                  - "Vier Euro und zwanzig Euro."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: text_input
                text: "Mia kauft Saft für 3 € und Brötchen für 2 €. Sie bezahlt mit 10 €. Wie viel bekommt sie zurück?"
                say: "Mia kauft Saft für drei Euro und Brötchen für zwei Euro. Sie bezahlt mit einem Zehner. Wie viel Euro bekommt sie zurück?"
                answer: "5"
                hints:
                  - "Rechne zuerst, was alles zusammen kostet."
                  - "Fünf Euro. Von fünf bis zehn?"
                  - "5 €."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Preis 4 €, du bezahlst mit 5 €. Wie viel bekommst du zurück?"
                say: "Etwas kostet vier Euro. Du bezahlst mit einem Fünfer. Wie viel Euro bekommst du zurück?"
                options: ["1 €", "4 €", "9 €"]
                answer: "1 €"
                hints: ["Zähle vom Preis bis fünf hoch."]
              - id: l2-s2
                type: text_input
                text: "Preis 12 €, du bezahlst mit 20 €. Wie viel Euro bekommst du zurück?"
                say: "Etwas kostet zwölf Euro. Du bezahlst mit einem Zwanziger. Wie viel Euro bekommst du zurück?"
                answer: "8"
                hints: ["Zwölf plus wie viel ist zwanzig?"]
              - id: l2-s3
                type: text_input
                text: "Preis 31 €, du bezahlst mit 50 €. Wie viel Euro bekommst du zurück?"
                say: "Etwas kostet einunddreißig Euro. Du bezahlst mit einem Fünfziger. Wie viel Euro bekommst du zurück?"
                answer: "19"
                hints: ["Bis vierzig, dann bis fünfzig."]
              - id: l2-s4
                type: true_false
                text: "Preis 65 €, bezahlt mit 100 €. Rückgeld 45 €. Stimmt das?"
                say: "Etwas kostet fünfundsechzig Euro. Du bezahlst mit einem Hunderter und bekommst fünfundvierzig Euro zurück. Stimmt das?"
                answer: false
                hints: ["Zähle hoch: bis siebzig, dann bis hundert."]
              - id: l2-s5
                type: text_input
                text: "Tom kauft eine Mütze für 9 € und Handschuhe für 6 €. Er bezahlt mit 20 €. Wie viel bekommt er zurück?"
                say: "Tom kauft eine Mütze für neun Euro und Handschuhe für sechs Euro. Er bezahlt mit einem Zwanziger. Wie viel Euro bekommt er zurück?"
                answer: "5"
                hints: ["Rechne zuerst, was alles zusammen kostet."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Preis 18 €, du bezahlst mit 20 €. Wie viel bekommst du zurück?"
                say: "Etwas kostet achtzehn Euro. Du bezahlst mit einem Zwanziger. Wie viel Euro bekommst du zurück?"
                options: ["2 €", "18 €", "38 €"]
                answer: "2 €"
              - id: l2-n2
                type: text_input
                text: "Preis 27 €, du bezahlst mit 30 €. Wie viel Euro bekommst du zurück?"
                say: "Etwas kostet siebenundzwanzig Euro. Du bezahlst mit drei Zehnern. Wie viel Euro bekommst du zurück?"
                answer: "3"
              - id: l2-n3
                type: text_input
                text: "Preis 54 €, du bezahlst mit 100 €. Wie viel Euro bekommst du zurück?"
                say: "Etwas kostet vierundfünfzig Euro. Du bezahlst mit einem Hunderter. Wie viel Euro bekommst du zurück?"
                answer: "46"
              - id: l2-n4
                type: true_false
                text: "Preis 19 €, bezahlt mit 50 €. Rückgeld 31 €. Stimmt das?"
                say: "Etwas kostet neunzehn Euro. Du bezahlst mit einem Fünfziger und bekommst einunddreißig Euro zurück. Stimmt das?"
                answer: true
              - id: l2-n5
                type: text_input
                text: "Lena kauft ein Buch für 11 € und ein Heft für 4 €. Sie bezahlt mit 20 €. Wie viel bekommt sie zurück?"
                say: "Lena kauft ein Buch für elf Euro und ein Heft für vier Euro. Sie bezahlt mit einem Zwanziger. Wie viel Euro bekommt sie zurück?"
                answer: "5"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "Ein Spiel kostet 13 €, ein Ball 5 €. Was kostet beides zusammen?"
            say: "Ein Spiel kostet dreizehn Euro, ein Ball fünf Euro. Wie viel Euro kostet beides zusammen?"
            answer: "18"
          - id: l2-c2
            type: text_input
            text: "Preis 16 €, du bezahlst mit 20 €. Wie viel Euro bekommst du zurück?"
            say: "Etwas kostet sechzehn Euro. Du bezahlst mit einem Zwanziger. Wie viel Euro bekommst du zurück?"
            answer: "4"
          - id: l2-c3
            type: text_input
            text: "Preis 38 €, du bezahlst mit 50 €. Wie viel Euro bekommst du zurück?"
            say: "Etwas kostet achtunddreißig Euro. Du bezahlst mit einem Fünfziger. Wie viel Euro bekommst du zurück?"
            answer: "12"
          - id: l2-c4
            type: multiple_choice
            text: "Wie bezahlst du 32 € passend?"
            say: "Wie bezahlst du zweiunddreißig Euro passend?"
            options: ["20 € + 10 € + 2 €", "20 € + 10 € + 1 €", "20 € + 20 €"]
            answer: "20 € + 10 € + 2 €"
          - id: l2-c5
            type: true_false
            text: "Paul hat 40 €. Er möchte Schuhe für 45 € kaufen. Reicht das Geld?"
            say: "Paul hat vierzig Euro. Er möchte Schuhe für fünfundvierzig Euro kaufen. Reicht sein Geld?"
            answer: false
