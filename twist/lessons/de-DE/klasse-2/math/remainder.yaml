# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.remainder
skill: math.mult-div.remainder
curriculum: de-DE
language: de
title:
  de: Geteilt mit Rest
  en: Division with remainders
summary: >
  Divisions that do not come out exactly. Lesson 1 finds how many fit and
  what is left (17 : 5 = 3 Rest 2), checks with the Probe and learns that
  the Rest is smaller than the divisor; lesson 2 reads the Rest in a story
  (one more car for the children left over, or money left over), and ends
  with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.div-facts]
  also_practises: [math.mult-div.div-facts, math.mult-div.all-tables]
  vocabulary: { de: [Rest, übrig bleiben, geteilt durch, Probe] }
  forms: [picture, text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: calc, what: { de: Geteiltaufgaben mit Rest rechnen, en: working out divisions with a remainder } }
    - { id: rest, what: { de: "den Rest finden, kleiner als die Zahl, durch die man teilt", en: "finding the remainder, smaller than the number you divide by" } }
    - { id: story, what: { de: den Rest in einer Sachaufgabe deuten, en: saying what the remainder means in a story } }
  misconceptions:
    - id: rest-too-big
      what: "Leaves a Rest as big as or bigger than the divisor (23 : 5 = 3 Rest 8)"
      addressed: "lesson 1 Learn says the Rest is always smaller than the divisor; l1-f2 has the divisor as an option with feedback, l1-s3 asks whether 23 : 5 is 3 Rest 8"
    - id: ignore-the-rest
      what: Drops the Rest when the story needs one more (14 children, 4 to a boat, gives 3 boats)
      addressed: lesson 2 Learn shows a car story and a money story; every stage of lesson 2 has a "Wie viele … braucht man?" task with the rounded-down answer as an option, with feedback in l2-f1; l2-f4 and l2-n4 ask whether the rounded-down number is enough
    - id: round-up-always
      what: Adds one more when the story does not need it (17 euro, 5 euro a ball, gives 4 balls)
      addressed: "every stage of lesson 2 has a money task with the rounded-up answer as an option, with feedback in l2-f2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was übrig bleibt", en: "What is left over" }
    goal:
      de: "Teile und finde heraus, was übrig bleibt, so wie bei 17 Äpfeln mit immer 5 in einer Tüte."
      en: "Divide and find what is left over, like 17 apples with 5 in each bag."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Stimmt das? 2 · 4 + 3 = 11"
            say: "Zwei mal vier plus drei ist elf. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 · 6 + 1 = _"
            say: "Vier mal sechs plus eins."
            answer: "25"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "17 Äpfel, immer 5 in eine Tüte. Passen alle hinein?"
            say: "Siebzehn Äpfel. Immer fünf kommen in eine Tüte. Was glaubst du: Kommen alle Äpfel in volle Tüten, oder bleiben welche übrig?"
            show: { object: apple, count: 17, layout: scattered }
          - text: "17 Äpfel, immer 5 in eine Tüte"
            say: "Drei Tüten werden voll. Zwei Äpfel bleiben übrig."
            show: { object: apple, count: 17, layout: scattered }
          - text: "17 : 5 = 3 Rest 2"
            say: "Das schreibst du so: Siebzehn geteilt durch fünf ist drei Rest zwei."
          - text: "Probe: 3 · 5 + 2 = 17"
            say: "Die Probe: Drei mal fünf ist fünfzehn, plus der Rest zwei ist siebzehn. Der Rest ist immer kleiner als die Zahl, durch die du teilst."
          - text: "Wusstest du? Ein Jahr hat 52 Wochen und 1 Tag Rest. Darum ist dein Geburtstag nächstes Jahr meistens einen Wochentag später."
            say: "Wusstest du? Ein Jahr hat zweiundfünfzig volle Wochen, und meistens bleibt ein Tag übrig. Dieser Rest schiebt alles weiter. Ist dein Geburtstag dieses Jahr an einem Montag, ist er nächstes Jahr meistens an einem Dienstag."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "11 Kekse, immer 3 auf einen Teller."
                say: "Elf Kekse. Immer drei kommen auf einen Teller. Wie viele Teller werden voll? Wie viele Kekse bleiben übrig?"
                frame: "11 : 3 = _ Rest _"
                options: ["3", "2", "4", "1"]
                answer: ["3", "2"]
                hints:
                  - "Wie viele Dreier passen in elf?"
                  - "Drei mal drei ist neun. Bis elf fehlen noch zwei."
                  - "3 Rest 2."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie groß ist der Rest bei 13 : 4?"
                say: "Dreizehn geteilt durch vier. Wie groß ist der Rest?"
                options: ["1", "3", "4"]
                answer: "1"
                feedback:
                  "4": "Der Rest muss kleiner sein als vier. Sonst passt noch eine Vier hinein."
                  "3": "Drei ist das Ergebnis. Was bleibt übrig?"
                hints:
                  - "Wie viele Vierer passen in dreizehn?"
                  - "Vier mal drei ist zwölf. Bis dreizehn fehlt noch eins."
                  - "1."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? 9 : 2 = 4 Rest 1"
                say: "Neun geteilt durch zwei ist vier Rest eins. Stimmt das?"
                answer: true
                hints:
                  - "Mach die Probe: zwei mal vier, dann plus den Rest."
                  - "Zwei mal vier ist acht. Acht plus eins ist neun."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Aufgabe geht ohne Rest auf?"
                say: "Welche Aufgabe geht ohne Rest auf?"
                options: ["12 : 4", "13 : 4", "14 : 4"]
                answer: "12 : 4"
                hints:
                  - "Welche Zahl steht in der Viererreihe?"
                  - "Vier mal drei ist zwölf."
                  - "12 : 4."
              - id: l1-f5
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Neunzehn geteilt durch fünf."
                frame: "19 : 5 = _ Rest _"
                options: ["3", "4", "5"]
                answer: ["3", "4"]
                hints:
                  - "Wie viele Fünfer passen in neunzehn?"
                  - "Fünf mal drei ist fünfzehn. Bis neunzehn fehlen noch vier."
                  - "3 Rest 4."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "14 Stifte, immer 4 in eine Dose."
                say: "Vierzehn Stifte. Immer vier kommen in eine Dose. Wie viele Dosen werden voll? Wie viele Stifte bleiben übrig?"
                show: { object: pencil, count: 14 }
                frame: "14 : 4 = _ Rest _"
                options: ["3", "2", "4"]
                answer: ["3", "2"]
                hints: ["Wie viele Vierer passen in vierzehn?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wie groß ist der Rest bei 17 : 3?"
                say: "Siebzehn geteilt durch drei. Wie groß ist der Rest?"
                options: ["2", "1", "5"]
                answer: "2"
                hints: ["Drei mal fünf ist fünfzehn."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? 23 : 5 = 3 Rest 8"
                say: "Dreiundzwanzig geteilt durch fünf ist drei Rest acht. Stimmt das?"
                answer: false
                hints: ["Darf der Rest größer sein als fünf?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Aufgabe geht ohne Rest auf?"
                say: "Welche Aufgabe geht ohne Rest auf?"
                options: ["25 : 3", "24 : 3", "26 : 3"]
                answer: "24 : 3"
                hints: ["Welche Zahl steht in der Dreierreihe?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Neunundzwanzig geteilt durch zehn."
                frame: "29 : 10 = _ Rest _"
                options: ["2", "9", "1"]
                answer: ["2", "9"]
                hints: ["Zehn mal zwei ist zwanzig."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "22 Kinder, immer 5 in einer Gruppe."
                say: "Zweiundzwanzig Kinder. Immer fünf sind in einer Gruppe. Wie viele Gruppen gibt es? Wie viele Kinder bleiben übrig?"
                frame: "22 : 5 = _ Rest _"
                options: ["4", "2", "3"]
                answer: ["4", "2"]
              - id: l1-n2
                type: multiple_choice
                text: "Wie groß ist der Rest bei 26 : 4?"
                say: "Sechsundzwanzig geteilt durch vier. Wie groß ist der Rest?"
                options: ["2", "6", "4"]
                answer: "2"
              - id: l1-n3
                type: true_false
                text: "Stimmt das? 15 : 2 = 7 Rest 1"
                say: "Fünfzehn geteilt durch zwei ist sieben Rest eins. Stimmt das?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welche Aufgabe geht ohne Rest auf?"
                say: "Welche Aufgabe geht ohne Rest auf?"
                options: ["30 : 7", "35 : 7", "40 : 7"]
                answer: "35 : 7"
              - id: l1-n5
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Achtunddreißig geteilt durch sechs."
                frame: "38 : 6 = _ Rest _"
                options: ["6", "2", "5"]
                answer: ["6", "2"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Zehn geteilt durch drei."
            frame: "10 : 3 = _ Rest _"
            options: ["3", "1", "2"]
            answer: ["3", "1"]
          - id: l1-c2
            type: multiple_choice
            text: "Wie groß ist der Rest bei 21 : 4?"
            say: "Einundzwanzig geteilt durch vier. Wie groß ist der Rest?"
            options: ["1", "5", "3"]
            answer: "1"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 16 : 5 = 3 Rest 1"
            say: "Sechzehn geteilt durch fünf ist drei Rest eins. Stimmt das?"
            answer: true
          - id: l1-c4
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Fünfundzwanzig geteilt durch drei."
            frame: "25 : 3 = _ Rest _"
            options: ["8", "1", "7"]
            answer: ["8", "1"]
          - id: l1-c5
            type: multiple_choice
            text: "Welche Aufgabe geht ohne Rest auf?"
            say: "Welche Aufgabe geht ohne Rest auf?"
            options: ["18 : 5", "20 : 5", "22 : 5"]
            answer: "20 : 5"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 19 : 4 = 3 Rest 7"
            say: "Neunzehn geteilt durch vier ist drei Rest sieben. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Was bedeutet der Rest?", en: "What does the remainder mean?" }
    goal:
      de: "Überleg, was der Rest in einer Geschichte bedeutet. Bleiben 2 Kinder übrig, brauchst du noch ein Auto."
      en: "Think about what the remainder means in a story. If 2 children are left over, you need one more car."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Siebzehn geteilt durch zwei."
            frame: "17 : 2 = _ Rest _"
            options: ["8", "1", "7"]
            answer: ["8", "1"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie groß ist der Rest bei 11 : 5?"
            say: "Elf geteilt durch fünf. Wie groß ist der Rest?"
            options: ["1", "2", "6"]
            answer: "1"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "22 Kinder, 4 in ein Auto. Reichen 5 Autos?"
            say: "Zweiundzwanzig Kinder machen einen Ausflug. In jedes Auto passen vier Kinder. Was glaubst du: Reichen fünf Autos?"
            show: { object: car }
          - text: "22 Kinder, 4 in ein Auto\n22 : 4 = 5 Rest 2"
            say: "Zweiundzwanzig geteilt durch vier ist fünf Rest zwei. Fünf Autos sind voll, aber zwei Kinder haben noch keinen Platz. Man braucht also sechs Autos."
            show: { object: car }
          - text: "20 €, ein Buch kostet 6 €\n20 : 6 = 3 Rest 2"
            say: "Lena hat zwanzig Euro. Ein Buch kostet sechs Euro. Zwanzig geteilt durch sechs ist drei Rest zwei. Sie kann drei Bücher kaufen. Zwei Euro bleiben übrig."
            show: { object: book }
          - text: "Was bedeutet der Rest?"
            say: "Bei jeder Aufgabe mit Rest fragst du: Was bedeutet der Rest hier? Manchmal brauchst du noch eins mehr. Manchmal bleibt etwas übrig."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "14 Kinder, in ein Boot passen 4. Wie viele Boote braucht man?"
                say: "Vierzehn Kinder wollen Boot fahren. In ein Boot passen vier Kinder. Wie viele Boote braucht man?"
                show: { object: boat }
                options: ["4", "3", "2"]
                answer: "4"
                feedback:
                  "3": "Drei Boote sind voll, aber zwei Kinder haben noch keinen Platz. Sie brauchen auch ein Boot."
                  "2": "Zwei ist der Rest. Gefragt ist, wie viele Boote man braucht."
                hints:
                  - "Rechne vierzehn geteilt durch vier."
                  - "Das ist drei Rest zwei. Die zwei Kinder brauchen auch ein Boot."
                  - "4 Boote."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tim hat 17 €. Ein Ball kostet 5 €. Wie viele Bälle kann er kaufen?"
                say: "Tim hat siebzehn Euro. Ein Ball kostet fünf Euro. Wie viele Bälle kann er kaufen?"
                show: { object: ball }
                options: ["3", "4", "2"]
                answer: "3"
                feedback:
                  "4": "Für einen vierten Ball reicht das Geld nicht. Es bleiben nur zwei Euro übrig."
                  "2": "Zwei Euro bleiben übrig. Gefragt ist, wie viele Bälle Tim kaufen kann."
                hints:
                  - "Rechne siebzehn geteilt durch fünf."
                  - "Das ist drei Rest zwei. Die zwei Euro reichen für keinen Ball mehr."
                  - "3 Bälle."
              - id: l2-f3
                type: fill_in_blank
                text: "23 Eier, in einen Karton passen 6."
                say: "Dreiundzwanzig Eier. In einen Karton passen sechs. Wie viele Kartons werden voll? Wie viele Eier bleiben übrig?"
                frame: "23 : 6 = _ Rest _"
                options: ["3", "5", "4"]
                answer: ["3", "5"]
                hints:
                  - "Wie viele Sechser passen in dreiundzwanzig?"
                  - "Sechs mal drei ist achtzehn. Bis dreiundzwanzig fehlen noch fünf."
                  - "3 Rest 5."
              - id: l2-f4
                type: true_false
                text: "26 Kinder, an einen Tisch passen 5. Man braucht 5 Tische. Stimmt das?"
                say: "Sechsundzwanzig Kinder. An einen Tisch passen fünf Kinder. Man braucht fünf Tische. Stimmt das?"
                answer: false
                hints:
                  - "Rechne sechsundzwanzig geteilt durch fünf."
                  - "Das ist fünf Rest eins. Das eine Kind braucht auch einen Platz."
                  - "Nein. Man braucht 6 Tische."
              - id: l2-f5
                type: text_input
                text: "30 Bonbons für 4 Kinder. Jedes bekommt gleich viele. Wie viele bleiben übrig?"
                say: "Dreißig Bonbons werden gerecht an vier Kinder verteilt. Wie viele Bonbons bleiben übrig?"
                answer: "2"
                hints:
                  - "Rechne dreißig geteilt durch vier."
                  - "Vier mal sieben ist achtundzwanzig. Bis dreißig fehlen noch zwei."
                  - "2."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "19 Kinder, in ein Auto passen 4. Wie viele Autos braucht man?"
                say: "Neunzehn Kinder fahren mit. In ein Auto passen vier Kinder. Wie viele Autos braucht man?"
                show: { object: car }
                options: ["5", "4", "3"]
                answer: "5"
                feedback:
                  "4": "Dann müssten drei Kinder zu Fuß hinterherlaufen! Sie brauchen noch ein Auto."
                hints: ["Was ist mit den Kindern, die übrig bleiben?"]
              - id: l2-s2
                type: multiple_choice
                text: "Mia hat 25 €. Ein Buch kostet 8 €. Wie viele Bücher kann sie kaufen?"
                say: "Mia hat fünfundzwanzig Euro. Ein Buch kostet acht Euro. Wie viele Bücher kann sie kaufen?"
                options: ["3", "4", "1"]
                answer: "3"
                hints: ["Rechne fünfundzwanzig geteilt durch acht."]
              - id: l2-s3
                type: fill_in_blank
                text: "33 Stifte, in eine Packung passen 10."
                say: "Dreiunddreißig Stifte. In eine Packung passen zehn. Wie viele Packungen werden voll? Wie viele Stifte bleiben übrig?"
                frame: "33 : 10 = _ Rest _"
                options: ["3", "1", "30"]
                answer: ["3", "3"]
                hints: ["Zehn mal drei ist dreißig."]
              - id: l2-s4
                type: true_false
                text: "26 Äpfel, immer 6 in eine Tüte. Es bleiben 2 Äpfel übrig. Stimmt das?"
                say: "Sechsundzwanzig Äpfel. Immer sechs kommen in eine Tüte. Es bleiben zwei Äpfel übrig. Stimmt das?"
                answer: true
                hints: ["Sechs mal vier ist vierundzwanzig."]
              - id: l2-s5
                type: text_input
                text: "In einen Kleinbus passen 9 Kinder. Wie viele Kleinbusse braucht man für 30 Kinder?"
                say: "In einen Kleinbus passen neun Kinder. Wie viele Kleinbusse braucht man für dreißig Kinder?"
                answer: "4"
                hints: ["Drei Kleinbusse sind voll. Bleiben noch Kinder übrig?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "17 Kinder, in ein Zelt passen 3. Wie viele Zelte braucht man?"
                say: "Siebzehn Kinder zelten. In ein Zelt passen drei Kinder. Wie viele Zelte braucht man?"
                options: ["6", "5", "2"]
                answer: "6"
                feedback:
                  "5": "Dann schlafen zwei Kinder unter dem Sternenhimmel! Sie brauchen auch ein Zelt."
              - id: l2-n2
                type: multiple_choice
                text: "Ben hat 22 €. Ein Heft kostet 3 €. Wie viele Hefte kann er kaufen?"
                say: "Ben hat zweiundzwanzig Euro. Ein Heft kostet drei Euro. Wie viele Hefte kann er kaufen?"
                options: ["7", "8", "1"]
                answer: "7"
              - id: l2-n3
                type: fill_in_blank
                text: "Rechne mit Rest."
                say: "Fünfundvierzig geteilt durch sieben."
                frame: "45 : 7 = _ Rest _"
                options: ["6", "3", "7"]
                answer: ["6", "3"]
              - id: l2-n4
                type: true_false
                text: "34 Kinder, in ein Boot passen 8. Man braucht 4 Boote. Stimmt das?"
                say: "Vierunddreißig Kinder. In ein Boot passen acht Kinder. Man braucht vier Boote. Stimmt das?"
                answer: false
              - id: l2-n5
                type: text_input
                text: "50 Murmeln für 6 Kinder. Jedes bekommt gleich viele. Wie viele bleiben übrig?"
                say: "Fünfzig Murmeln werden gerecht an sechs Kinder verteilt. Wie viele Murmeln bleiben übrig?"
                answer: "2"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: calc
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Siebenundzwanzig geteilt durch fünf."
            frame: "27 : 5 = _ Rest _"
            options: ["5", "2", "7"]
            answer: ["5", "2"]
          - id: l2-c2
            part: rest
            type: multiple_choice
            text: "Wie groß ist der Rest bei 31 : 7?"
            say: "Einunddreißig geteilt durch sieben. Wie groß ist der Rest?"
            options: ["3", "4", "7"]
            answer: "3"
          - id: l2-c3
            part: story
            type: multiple_choice
            text: "23 Kinder, in ein Auto passen 4. Wie viele Autos braucht man?"
            say: "Dreiundzwanzig Kinder fahren mit. In ein Auto passen vier Kinder. Wie viele Autos braucht man?"
            options: ["6", "5", "3"]
            answer: "6"
          - id: l2-c4
            part: story
            type: multiple_choice
            text: "Lina hat 19 €. Ein Spiel kostet 6 €. Wie viele Spiele kann sie kaufen?"
            say: "Lina hat neunzehn Euro. Ein Spiel kostet sechs Euro. Wie viele Spiele kann sie kaufen?"
            options: ["3", "4", "1"]
            answer: "3"
          - id: l2-c5
            part: calc
            type: true_false
            text: "Stimmt das? 40 : 9 = 4 Rest 4"
            say: "Vierzig geteilt durch neun ist vier Rest vier. Stimmt das?"
            answer: true
          - id: l2-c6
            part: calc
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Dreiundvierzig geteilt durch sechs."
            frame: "43 : 6 = _ Rest _"
            options: ["7", "1", "6"]
            answer: ["7", "1"]
          - id: l2-c7
            part: calc
            type: multiple_choice
            text: "29 : 3 = ?"
            say: "Wie viel ist neunundzwanzig geteilt durch drei?"
            options: ["9 Rest 2", "8 Rest 5", "9 Rest 1"]
            answer: "9 Rest 2"
          - id: l2-c8
            part: calc
            type: true_false
            text: "Stimmt das? 35 : 8 = 4 Rest 3"
            say: "Fünfunddreißig geteilt durch acht ist vier Rest drei. Stimmt das?"
            answer: true
          - id: l2-c9
            part: calc
            type: fill_in_blank
            text: "Rechne mit Rest."
            say: "Sechsundfünfzig geteilt durch neun."
            frame: "56 : 9 = _ Rest _"
            options: ["6", "2", "5"]
            answer: ["6", "2"]
          - id: l2-c10
            part: calc
            type: true_false
            text: "Stimmt das? 25 : 7 = 3 Rest 3"
            say: "Fünfundzwanzig geteilt durch sieben ist drei Rest drei. Stimmt das?"
            answer: false
          - id: l2-c11
            part: rest
            type: multiple_choice
            text: "Wie groß ist der Rest bei 38 : 5?"
            say: "Achtunddreißig geteilt durch fünf. Wie groß ist der Rest?"
            options: ["3", "7", "8"]
            answer: "3"
          - id: l2-c12
            part: rest
            type: multiple_choice
            text: "Welche Aufgabe geht ohne Rest auf?"
            say: "Welche Aufgabe geht ohne Rest auf?"
            options: ["32 : 6", "36 : 6", "40 : 6"]
            answer: "36 : 6"
          - id: l2-c13
            part: rest
            type: true_false
            text: "Stimmt das? 47 : 5 = 8 Rest 7"
            say: "Siebenundvierzig geteilt durch fünf ist acht Rest sieben. Stimmt das?"
            answer: false
          - id: l2-c14
