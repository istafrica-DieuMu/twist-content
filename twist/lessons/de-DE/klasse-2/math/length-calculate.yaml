# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.length-calculate
skill: math.length.calculate
curriculum: de-DE
language: de
title:
  de: Mit Längen rechnen
  en: Calculating with lengths
summary: >
  Lesson 1 adds and subtracts lengths in cm and says the unit in the
  answer (35 cm + 40 cm = 75 cm), also up to 1 m (60 cm + 40 cm = 100 cm
  = 1 m); lesson 2 solves length stories with m and cm (Wie viel fehlt
  noch bis 1 m? Wie lang sind beide Bretter zusammen?), and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.length.cm-m, math.add-sub-to-100.sub-two-digit]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.complement, math.word-problems.question-calc-answer]
  vocabulary: { de: [Zentimeter, Meter, zusammen, länger als, kürzer als, fehlen, Unterschied] }
  forms: [text, audio]
  drawn: []
  facets: [units]
  parts:
    - { id: cm, what: { de: Längen in cm addieren und subtrahieren, en: adding and subtracting lengths in cm } }
    - { id: m-cm, what: { de: mit m und cm rechnen, en: calculating with m and cm } }
    - { id: compare, what: { de: "ausrechnen, wie viel länger oder kürzer etwas ist", en: working out how much longer or shorter something is } }
    - { id: story, what: { de: Sachaufgaben mit Längen lösen, en: solving word problems with lengths } }
  misconceptions:
    - id: units-dropped
      what: Adds the numbers and leaves the unit out, or mixes m and cm in one sum (1 m + 20 cm = 21)
      addressed: lesson 1 Learn always says the unit; l1-f4, l1-s4 and l1-n4 add m and cm with an option that drops the change to cm, with feedback in l1-f4
    - id: difference-is-sum
      what: Adds the two lengths when asked how much longer one is
      addressed: lesson 2 Learn compares two lengths with minus; l2-f2, l2-s2, l2-n2 and l2-c2 ask wie viel länger, höher or größer and offer the sum, with feedback in l2-f2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Längen plus und minus", en: "Adding and subtracting lengths" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "1 m = _ cm"
            say: "Wie viele Zentimeter hat ein Meter?"
            options: ["100", "10"]
            answer: "100"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "35 + 40 = _"
            say: "Fünfunddreißig plus vierzig."
            answer: "75"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "35 cm + 40 cm = 75 cm"
            say: "Zwei Bänder: fünfunddreißig Zentimeter und vierzig Zentimeter. Zusammen sind sie fünfundsiebzig Zentimeter lang. Die Einheit schreibst du immer mit."
          - text: "60 cm + 40 cm = 100 cm = 1 m"
            say: "Sechzig Zentimeter und vierzig Zentimeter sind hundert Zentimeter. Das ist genau ein Meter."
          - text: "1 m − 30 cm = 100 cm − 30 cm = 70 cm"
            say: "Von einem Meter Schnur schneidest du dreißig Zentimeter ab. Ein Meter sind hundert Zentimeter. Hundert minus dreißig sind siebzig Zentimeter. Rechne zuerst alles in Zentimeter um."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "25 cm + 30 cm = _"
                say: "Fünfundzwanzig Zentimeter plus dreißig Zentimeter."
                options: ["55 cm", "55 m", "5 cm"]
                answer: "55 cm"
                hints:
                  - "Rechne 25 + 30."
                  - "Die Einheit bleibt cm."
                  - "55 cm."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "80 cm − 35 cm = _ cm"
                say: "Achtzig Zentimeter minus fünfunddreißig Zentimeter."
                answer: "45"
                hints:
                  - "Erst 80 − 30, dann noch 5 weg."
                  - "50, dann 45."
                  - "45 cm."
              - id: l1-f3
                type: multiple_choice
                text: "70 cm + 30 cm = _"
                say: "Siebzig Zentimeter plus dreißig Zentimeter."
                options: ["1 m", "10 cm", "1 cm"]
                answer: "1 m"
                hints:
                  - "70 + 30 = 100."
                  - "100 cm sind ein Meter."
                  - "1 m."
              - id: l1-f4
                type: multiple_choice
                text: "1 m + 20 cm = _"
                say: "Ein Meter plus zwanzig Zentimeter."
                options: ["120 cm", "21 cm", "30 cm"]
                answer: "120 cm"
                feedback:
                  "21 cm": "Du hast 1 und 20 zusammengezählt. 1 m sind aber 100 cm."
                hints:
                  - "Rechne den Meter zuerst in Zentimeter um."
                  - "100 cm + 20 cm."
                  - "120 cm."
              - id: l1-f5
                type: text_input
                text: "1 m − 40 cm = _ cm"
                say: "Ein Meter minus vierzig Zentimeter."
                answer: "60"
                hints:
                  - "1 m sind 100 cm."
                  - "100 − 40."
                  - "60 cm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "42 cm + 15 cm = _"
                say: "Zweiundvierzig Zentimeter plus fünfzehn Zentimeter."
                options: ["57 cm", "57 m", "27 cm"]
                answer: "57 cm"
                hints: ["Die Einheit bleibt cm."]
              - id: l1-s2
                type: text_input
                text: "90 cm − 45 cm = _ cm"
                say: "Neunzig Zentimeter minus fünfundvierzig Zentimeter."
                answer: "45"
                hints: ["Erst 90 − 40, dann noch 5 weg."]
              - id: l1-s3
                type: multiple_choice
                text: "55 cm + 45 cm = _"
                say: "Fünfundfünfzig Zentimeter plus fünfundvierzig Zentimeter."
                options: ["1 m", "90 cm", "10 m"]
                answer: "1 m"
                hints: ["Sind es zusammen 100 cm?"]
              - id: l1-s4
                type: multiple_choice
                text: "1 m + 35 cm = _"
                say: "Ein Meter plus fünfunddreißig Zentimeter."
                options: ["135 cm", "36 cm", "45 cm"]
                answer: "135 cm"
                hints: ["1 m sind 100 cm."]
              - id: l1-s5
                type: text_input
                text: "1 m − 15 cm = _ cm"
                say: "Ein Meter minus fünfzehn Zentimeter."
                answer: "85"
                hints: ["100 − 15."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "33 cm + 44 cm = _"
                say: "Dreiunddreißig Zentimeter plus vierundvierzig Zentimeter."
                options: ["77 cm", "77 m", "11 cm"]
                answer: "77 cm"
              - id: l1-n2
                type: text_input
                text: "70 cm − 28 cm = _ cm"
                say: "Siebzig Zentimeter minus achtundzwanzig Zentimeter."
                answer: "42"
              - id: l1-n3
                type: multiple_choice
                text: "65 cm + 35 cm = _"
                say: "Fünfundsechzig Zentimeter plus fünfunddreißig Zentimeter."
                options: ["1 m", "90 cm", "1 cm"]
                answer: "1 m"
              - id: l1-n4
                type: multiple_choice
                text: "1 m + 50 cm = _"
                say: "Ein Meter plus fünfzig Zentimeter."
                options: ["150 cm", "51 cm", "60 cm"]
                answer: "150 cm"
              - id: l1-n5
                type: text_input
                text: "1 m − 65 cm = _ cm"
                say: "Ein Meter minus fünfundsechzig Zentimeter."
                answer: "35"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "48 cm + 30 cm = _"
            say: "Achtundvierzig Zentimeter plus dreißig Zentimeter."
            options: ["78 cm", "78 m", "18 cm"]
            answer: "78 cm"
          - id: l1-c2
            type: text_input
            text: "1 m − 25 cm = _ cm"
            say: "Ein Meter minus fünfundzwanzig Zentimeter."
            answer: "75"
          - id: l1-c3
            type: multiple_choice
            text: "1 m + 10 cm = _"
            say: "Ein Meter plus zehn Zentimeter."
            options: ["110 cm", "11 cm", "20 cm"]
            answer: "110 cm"
          - id: l1-c4
            type: text_input
            text: "60 cm − 24 cm = _ cm"
            say: "Sechzig Zentimeter minus vierundzwanzig Zentimeter."
            answer: "36"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? 45 cm + 55 cm = 1 m"
            say: "Fünfundvierzig Zentimeter plus fünfundfünfzig Zentimeter ist ein Meter. Stimmt das?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "1 m − 50 cm = _"
            say: "Ein Meter minus fünfzig Zentimeter."
            options: ["50 cm", "49 cm", "150 cm"]
            answer: "50 cm"

  - n: 2
    title: { de: "Sachaufgaben mit Längen", en: "Length word problems" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "1 m − 30 cm = _ cm"
            say: "Ein Meter minus dreißig Zentimeter."
            answer: "70"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "40 cm + 60 cm = _"
            say: "Vierzig Zentimeter plus sechzig Zentimeter."
            options: ["1 m", "10 cm"]
            answer: "1 m"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Tim springt 85 cm, Lea 1 m. Wie viel weiter springt Lea?"
            say: "Beim Weitsprung springt Tim fünfundachtzig Zentimeter, Lea einen Meter. Wie viel weiter springt Lea? Du vergleichst: Das ist eine Minusaufgabe."
          - text: "100 cm − 85 cm = 15 cm"
            say: "Ein Meter sind hundert Zentimeter. Hundert minus fünfundachtzig sind fünfzehn. Antwort: Lea springt fünfzehn Zentimeter weiter."
          - text: "Wie viel weiter? Wie viel länger? → minus"
            say: "Bei Fragen wie: Wie viel weiter? Wie viel länger? Wie viel fehlt noch? rechnest du minus. Bei der Frage: Wie lang sind beide zusammen? rechnest du plus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Brett ist 45 cm lang, ein anderes 50 cm. Wie lang sind beide zusammen?"
                say: "Opa hat zwei Bretter. Eins ist fünfundvierzig Zentimeter lang, das andere fünfzig. Wie lang sind beide zusammen?"
                options: ["95 cm", "5 cm", "1 m"]
                answer: "95 cm"
                hints:
                  - "Zusammen heißt plus."
                  - "45 + 50."
                  - "95 cm."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Mias Schal ist 80 cm lang, Bens Schal 65 cm. Wie viel länger ist Mias Schal?"
                say: "Mias Schal ist achtzig Zentimeter lang, Bens Schal fünfundsechzig Zentimeter. Wie viel länger ist Mias Schal?"
                options: ["15 cm", "145 cm", "25 cm"]
                answer: "15 cm"
                feedback:
                  "145 cm": "Das sind beide Schals zusammen. Gefragt ist, wie viel länger einer ist."
                hints:
                  - "Bei „Wie viel länger?“ vergleichst du. Das ist eine Minusaufgabe."
                  - "80 − 65."
                  - "15 cm."
              - id: l2-f3
                type: text_input
                text: "Ein Seil ist 1 m lang. Lisa schneidet 35 cm ab. Wie viele cm bleiben übrig?"
                say: "Ein Seil ist einen Meter lang. Lisa schneidet fünfunddreißig Zentimeter ab. Wie viele Zentimeter bleiben übrig?"
                answer: "65"
                hints:
                  - "1 m sind 100 cm."
                  - "100 − 35."
                  - "65 cm."
              - id: l2-f4
                type: multiple_choice
                text: "Ali ist 1 m 20 cm groß. Sein Papa ist 60 cm größer. Wie groß ist Papa?"
                say: "Ali ist einen Meter zwanzig groß. Sein Papa ist sechzig Zentimeter größer. Wie groß ist Papa?"
                options: ["1 m 80 cm", "60 cm", "1 m 60 cm"]
                answer: "1 m 80 cm"
                hints:
                  - "Größer heißt: plus."
                  - "20 cm + 60 cm = 80 cm, der Meter bleibt."
                  - "1 m 80 cm."
              - id: l2-f5
                type: true_false
                text: "Ein Turm aus Klötzen ist 70 cm hoch. Bis 1 m fehlen noch 30 cm."
                say: "Ein Turm aus Klötzen ist siebzig Zentimeter hoch. Stimmt das: Bis zu einem Meter fehlen noch dreißig Zentimeter?"
                answer: true
                hints:
                  - "1 m sind 100 cm."
                  - "70 + 30 = 100."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ein Band ist 38 cm lang, ein anderes 40 cm. Wie lang sind beide zusammen?"
                say: "Lena hat zwei Bänder. Eins ist achtunddreißig Zentimeter lang, das andere vierzig. Wie lang sind beide zusammen?"
                options: ["78 cm", "2 cm", "1 m"]
                answer: "78 cm"
                hints: ["Zusammen heißt plus."]
              - id: l2-s2
                type: multiple_choice
                text: "Tims Zug ist 90 cm lang, Pauls Zug 55 cm. Wie viel länger ist Tims Zug?"
                say: "Tims Spielzeugzug ist neunzig Zentimeter lang, Pauls Zug fünfundfünfzig Zentimeter. Wie viel länger ist Tims Zug?"
                options: ["35 cm", "145 cm", "45 cm"]
                answer: "35 cm"
                hints: ["Bei „Wie viel länger?“ rechnest du minus."]
              - id: l2-s3
                type: text_input
                text: "Eine Stange ist 1 m lang. Papa sägt 45 cm ab. Wie viele cm bleiben übrig?"
                say: "Eine Holzstange ist einen Meter lang. Papa sägt fünfundvierzig Zentimeter ab. Wie viele Zentimeter bleiben übrig?"
                answer: "55"
                hints: ["100 − 45."]
              - id: l2-s4
                type: multiple_choice
                text: "Lea springt 1 m 10 cm. Jan springt 25 cm weiter. Wie weit springt Jan?"
                say: "Lea springt einen Meter zehn weit. Jan springt fünfundzwanzig Zentimeter weiter. Wie weit springt Jan?"
                options: ["1 m 35 cm", "35 cm", "1 m 25 cm"]
                answer: "1 m 35 cm"
                hints: ["10 cm + 25 cm, der Meter bleibt."]
              - id: l2-s5
                type: true_false
                text: "Die Pflanze ist 85 cm hoch. Bis 1 m fehlen noch 25 cm."
                say: "Die Pflanze ist fünfundachtzig Zentimeter hoch. Stimmt das: Bis zu einem Meter fehlen noch fünfundzwanzig Zentimeter?"
                answer: false
                hints: ["85 + wie viel = 100?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Stück Stoff ist 52 cm lang, ein anderes 35 cm. Wie lang sind beide zusammen?"
                say: "Oma hat zwei Stücke Stoff. Eins ist zweiundfünfzig Zentimeter lang, das andere fünfunddreißig. Wie lang sind beide zusammen?"
                options: ["87 cm", "17 cm", "1 m"]
                answer: "87 cm"
              - id: l2-n2
                type: multiple_choice
                text: "Der Tisch ist 75 cm hoch, der Stuhl 45 cm. Wie viel höher ist der Tisch?"
                say: "Der Tisch ist fünfundsiebzig Zentimeter hoch, der Stuhl fünfundvierzig Zentimeter. Wie viel höher ist der Tisch?"
                options: ["30 cm", "120 cm", "20 cm"]
                answer: "30 cm"
              - id: l2-n3
                type: text_input
                text: "Ein Band ist 1 m lang. Mia schneidet 72 cm ab. Wie viele cm bleiben übrig?"
                say: "Ein Geschenkband ist einen Meter lang. Mia schneidet zweiundsiebzig Zentimeter ab. Wie viele Zentimeter bleiben übrig?"
                answer: "28"
              - id: l2-n4
                type: multiple_choice
                text: "Ben ist 1 m 30 cm groß. Seine Schwester ist 15 cm kleiner. Wie groß ist sie?"
                say: "Ben ist einen Meter dreißig groß. Seine Schwester ist fünfzehn Zentimeter kleiner. Wie groß ist sie?"
                options: ["1 m 15 cm", "1 m 45 cm", "15 cm"]
                answer: "1 m 15 cm"
              - id: l2-n5
                type: true_false
                text: "Ein Hund ist 60 cm hoch. Bis 1 m fehlen noch 40 cm."
                say: "Ein Hund ist sechzig Zentimeter hoch. Stimmt das: Bis zu einem Meter fehlen noch vierzig Zentimeter?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: cm
            type: multiple_choice
            text: "36 cm + 50 cm = _"
            say: "Sechsunddreißig Zentimeter plus fünfzig Zentimeter."
            options: ["86 cm", "86 m", "14 cm"]
            answer: "86 cm"
          - id: l2-c2
            part: compare
            type: multiple_choice
            text: "Lisas Puppe ist 40 cm groß, Mias Puppe 28 cm. Wie viel größer ist Lisas Puppe?"
            say: "Lisas Puppe ist vierzig Zentimeter groß, Mias Puppe achtundzwanzig Zentimeter. Wie viel größer ist Lisas Puppe?"
            options: ["12 cm", "68 cm", "22 cm"]
            answer: "12 cm"
          - id: l2-c3
            part: story
            type: text_input
            text: "Eine Schnur ist 1 m lang. Tom schneidet 55 cm ab. Wie viele cm bleiben übrig?"
            say: "Eine Schnur ist einen Meter lang. Tom schneidet fünfundfünfzig Zentimeter ab. Wie viele Zentimeter bleiben übrig?"
            answer: "45"
          - id: l2-c4
            part: m-cm
            type: multiple_choice
            text: "1 m + 40 cm = _"
            say: "Ein Meter plus vierzig Zentimeter."
            options: ["140 cm", "41 cm", "50 cm"]
            answer: "140 cm"
          - id: l2-c5
            part: story
            type: true_false
            text: "Ein Kind springt 90 cm. Bis 1 m fehlen noch 10 cm."
            say: "Ein Kind springt neunzig Zentimeter weit. Stimmt das: Bis zu einem Meter fehlen noch zehn Zentimeter?"
            answer: true
          - id: l2-c6
            part: cm
            type: text_input
            text: "54 cm + 23 cm = _ cm"
            say: "Vierundfünfzig Zentimeter plus dreiundzwanzig Zentimeter."
            answer: "77"
          - id: l2-c7
            part: cm
            type: multiple_choice
            text: "95 cm − 40 cm = _"
            say: "Fünfundneunzig Zentimeter minus vierzig Zentimeter."
            options: ["55 cm", "55 m", "135 cm"]
            answer: "55 cm"
          - id: l2-c8
            part: cm
            type: true_false
            text: "Stimmt das? 26 cm + 34 cm = 60 cm"
            say: "Sechsundzwanzig Zentimeter plus vierunddreißig Zentimeter ist sechzig Zentimeter. Stimmt das?"
            answer: true
          - id: l2-c9
            part: cm
            type: text_input
            text: "82 cm − 47 cm = _ cm"
            say: "Zweiundachtzig Zentimeter minus siebenundvierzig Zentimeter."
            answer: "35"
          - id: l2-c10
            part: m-cm
            type: multiple_choice
            text: "1 m − 80 cm = _"
            say: "Ein Meter minus achtzig Zentimeter."
            options: ["20 cm", "79 cm", "30 cm"]
            answer: "20 cm"
          - id: l2-c11
            part: m-cm
            type: text_input
            text: "1 m + 5 cm = _ cm"
            say: "Ein Meter plus fünf Zentimeter."
            answer: "105"
          - id: l2-c12
            part: m-cm
            type: true_false
            text: "Stimmt das? 1 m + 30 cm = 31 cm"
            say: "Ein Meter plus dreißig Zentimeter ist einunddreißig Zentimeter. Stimmt das?"
            answer: false
          - id: l2-c13
            part: m-cm
            type: multiple_choice
            text: "25 cm + 75 cm = _"
            say: "Fünfundzwanzig Zentimeter plus fünfundsiebzig Zentimeter."
            options: ["1 m", "90 cm", "10 cm"]
            answer: "1 m"
          - id: l2-c14
            part: compare
            type: multiple_choice
            text: "Der Bleistift ist 17 cm lang, der kurze Buntstift nur 9 cm. Wie viel länger ist der Bleistift?"
            say: "Der Bleistift ist siebzehn Zentimeter lang, der kurze Buntstift nur neun Zentimeter. Wie viel länger ist der Bleistift?"
            options: ["8 cm", "26 cm", "12 cm"]
            answer: "8 cm"
          - id: l2-c15
            part: compare
            type: text_input
            text: "Mia springt 1 m weit, Lars 78 cm. Wie viele cm weiter springt Mia?"
            say: "Mia springt einen Meter weit, Lars achtundsiebzig Zentimeter. Wie viele Zentimeter weiter springt Mia?"
            answer: "22"
          - id: l2-c16
            part: compare
            type: multiple_choice
            text: "Ein Lineal ist 30 cm lang, ein Stift 14 cm. Wie viel kürzer ist der Stift?"
            say: "Ein Lineal ist dreißig Zentimeter lang, ein Stift vierzehn Zentimeter. Wie viel kürzer ist der Stift?"
            options: ["16 cm", "44 cm", "14 cm"]
            answer: "16 cm"
          - id: l2-c17
            part: compare
            type: true_false
            text: "Die Sonnenblume ist 95 cm hoch, die Tulpe 40 cm. Die Sonnenblume ist 45 cm höher."
            say: "Die Sonnenblume ist fünfundneunzig Zentimeter hoch, die Tulpe vierzig Zentimeter. Stimmt das: Die Sonnenblume ist fünfundvierzig Zentimeter höher?"
            answer: false
          - id: l2-c18
            part: story
            type: multiple_choice
            text: "Ein Stück Schnur ist 44 cm lang, ein anderes 56 cm. Wie lang sind beide zusammen?"
            say: "Ein Stück Schnur ist vierundvierzig Zentimeter lang, ein anderes sechsundfünfzig Zentimeter. Wie lang sind beide zusammen?"
            options: ["1 m", "90 cm", "12 cm"]
            answer: "1 m"
          - id: l2-c19
            part: story
            type: text_input
            text: "Ein Turm ist 65 cm hoch. Wie viele cm fehlen noch bis 1 m?"
            say: "Ein Turm aus Bausteinen ist fünfundsechzig Zentimeter hoch. Wie viele Zentimeter fehlen noch bis zu einem Meter?"
            answer: "35"
          - id: l2-c20
            part: story
            type: multiple_choice
            text: "Emma ist 1 m 25 cm groß. Ihr Bruder ist 20 cm kleiner. Wie groß ist ihr Bruder?"
            say: "Emma ist einen Meter fünfundzwanzig groß. Ihr Bruder ist zwanzig Zentimeter kleiner. Wie groß ist ihr Bruder?"
            options: ["1 m 5 cm", "1 m 45 cm", "20 cm"]
            answer: "1 m 5 cm"
