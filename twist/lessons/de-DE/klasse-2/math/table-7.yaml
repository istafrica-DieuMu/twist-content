            answer: "35"
          - id: l2-c19
            part: in-context
            type: multiple_choice
            text: "Ein Zug hat 8 Wagen. In jedem Wagen sitzen 7 Kinder. Wie viele Kinder sitzen im Zug?"
            say: "Ein Zug hat acht Wagen. In jedem Wagen sitzen sieben Kinder. Wie viele Kinder sitzen im Zug?"
            options: ["56", "54", "15"]
            answer: "56"
          - id: l2-c20
            part: in-context
            type: text_input
            text: "Tom hat 2 Wochen Ferien. Wie viele Tage sind das?"
            say: "Tom hat zwei Wochen Ferien. Wie viele Tage sind das?"
            answer: "14"
