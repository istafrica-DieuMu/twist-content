            say: "Vier mal sieben ist zwei mal sieben plus zwei mal sieben. Stimmt das?"
            answer: true
          - id: l2-c17
            part: in-context
            type: text_input
            text: "In einer Packung sind 7 Kekse. Wie viele Kekse sind in 4 Packungen?"
            say: "In einer Packung sind sieben Kekse. Wie viele Kekse sind in vier Packungen?"
