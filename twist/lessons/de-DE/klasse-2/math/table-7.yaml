# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.table-7
skill: math.mult-div.table-7
curriculum: de-DE
language: de
title:
  de: Die Siebenerreihe
  en: The 7 times table
summary: >
  The Einmaleinsreihe of 7, the one with the fewest helpers. Lesson 1
  builds it from fünf mal sieben (6 · 7 is 5 · 7 and one more 7);
  lesson 2 uses Tauschaufgaben, the Zehnerreihe and the two facts to
  learn by heart (7 · 7 and 7 · 8), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.derive-facts]
  also_practises: [math.mult-div.derive-facts, math.mult-div.commutative]
  vocabulary: { de: [Siebenerreihe, Tauschaufgabe, Zehnerreihe, Kernaufgabe] }
  forms: [drawn, text, audio]
  drawn: [dots]
  facets: []
  parts:
    - { id: facts, what: { de: die Aufgaben der Siebenerreihe, en: the 7 times table facts } }
    - { id: count, what: { de: in Siebenerschritten zählen und die Zahlen der Reihe erkennen, en: counting in sevens and spotting multiples of 7 } }
    - { id: helpers, what: { de: mit Hilfsaufgaben rechnen, en: working out a fact from a helper fact } }
    - { id: in-context, what: { de: Sachaufgaben mit der Siebenerreihe, en: word problems with the 7 times table } }
  misconceptions:
    - id: add-the-factor
      what: Adds the first factor instead of one more 7 when going on from 5 · 7 (6 · 7 = 35 + 6 = 41)
      addressed: lesson 1 Learn shows 6 · 7 as five red rows and one blue row of seven; l1-f2 has 6 and 41 as chips, l1-f4 asks whether 6 · 7 is 41
    - id: seven-eight
      what: Mixes up 7 · 8 with the facts next to it (54, 58)
      addressed: lesson 2 Learn gives the Merksatz "fünf, sechs, sieben, acht"; l1-f5 has 54 with feedback, l1-n4 asks whether 8 · 7 is 54, 7 · 8 or 8 · 7 comes in every stage of lesson 2 (l2-f4, l2-s2, l2-n1, l2-n5), and l2-c19 (8 Wagen mit je 7 Kindern) has 54 as an option
    - id: ten-minus-one
      what: Takes away 1 instead of 7 when using the Zehnerreihe (9 · 7 = 70 − 1)
      addressed: lesson 2 Learn takes one row of seven from ten; l2-f2 has 1 and 69 as chips and l2-s2 has 2 and 68 (two taken away instead of two sevens)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Mit fünf mal sieben", en: "From five sevens" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "35 + 7 = _"
            say: "Fünfunddreißig plus sieben."
            answer: "42"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "14 + 14 = _"
            say: "Vierzehn plus vierzehn."
            answer: "28"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7, 14, 21, 28, 35, 42, 49, 56, 63, 70"
            say: "Das ist die Siebenerreihe. Du zählst immer sieben weiter: sieben, vierzehn, einundzwanzig und so weiter bis siebzig."
          - text: "5 · 7 = 35 | 6 · 7 = 35 + 7 = 42"
            say: "Fünf mal sieben ist fünfunddreißig. Sechs mal sieben ist eine Reihe mehr, also noch eine Sieben: fünfunddreißig plus sieben ist zweiundvierzig."
            show: { drawn: dots, array: [6, 7], split_rows: 5 }
          - text: "8 · 7 = 5 · 7 + 3 · 7 = 35 + 21 = 56"
            say: "Acht mal sieben zerlegst du in fünf mal sieben und drei mal sieben. Fünfunddreißig plus einundzwanzig ist sechsundfünfzig."
            show: { drawn: dots, array: [8, 7], split_rows: 5 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Siebenerreihe. Welche Zahl fehlt?"
                frame: "14, 21, _, 35"
                options: ["28", "27", "29"]
                answer: ["28"]
                hints:
                  - "Immer sieben weiter."
                  - "Einundzwanzig und sieben."
                  - "28."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Fünf mal sieben hilft."
                say: "Sechs mal sieben. Fünf mal sieben ist fünfunddreißig. Wie viel kommt dazu?"
                frame: "6 · 7 = 35 + _ = _"
                options: ["7", "6", "42", "41"]
                answer: ["7", "42"]
                hints:
                  - "Sechs mal sieben ist eine Reihe mehr als fünf mal sieben."
                  - "Eine Reihe hat sieben Punkte. Fünfunddreißig plus sieben."
                  - "7 und 42."
              - id: l1-f3
                type: text_input
                text: "7 · 7 = _"
                say: "Sieben mal sieben."
                answer: "49"
                hints:
                  - "Fünf mal sieben und zwei mal sieben."
                  - "35 + 14."
                  - "49."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 6 · 7 = 41"
                say: "Sechs mal sieben ist einundvierzig. Stimmt das?"
                answer: false
                hints:
                  - "Fünf mal sieben ist fünfunddreißig."
                  - "Dann kommt noch eine Sieben dazu, keine Sechs."
                  - "Nein. 6 · 7 = 42."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl gehört zur Siebenerreihe?"
                say: "Welche Zahl gehört zur Siebenerreihe?"
                options: ["54", "56", "58"]
                answer: "56"
                feedback:
                  "54": "54 ist sechs mal neun. Acht mal sieben ist 56."
                hints:
                  - "Zähle in Siebenerschritten."
                  - "Acht mal sieben."
                  - "56."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Siebenerreihe. Welche Zahl fehlt?"
                frame: "42, _, 56, 63"
                options: ["48", "49", "50"]
                answer: ["49"]
                hints: ["Wie viel kommt jedes Mal dazu?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Fünf mal sieben hilft."
                say: "Rechne fünf mal sieben und vier mal sieben. Dann neun mal sieben."
                frame: "5 · 7 = _ | 4 · 7 = _ | 9 · 7 = _"
                options: ["35", "28", "63", "62"]
                answer: ["35", "28", "63"]
                hints: ["Neun mal sieben ist fünf mal sieben und vier mal sieben zusammen."]
              - id: l1-s3
                type: text_input
                text: "6 · 7 = _"
                say: "Sechs mal sieben."
                answer: "42"
                hints: ["Fünf mal sieben und noch eine Sieben."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 4 · 7 = 28"
                say: "Vier mal sieben ist achtundzwanzig. Stimmt das?"
                answer: true
                hints: ["Zwei mal sieben ist vierzehn. Verdopple."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl gehört zur Siebenerreihe?"
                say: "Welche Zahl gehört zur Siebenerreihe?"
                options: ["34", "35", "36"]
                answer: "35"
                hints: ["Fünf mal sieben."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle in der Siebenerreihe. Welche Zahl fehlt?"
                frame: "7, 14, _, 28"
                options: ["20", "21", "22"]
                answer: ["21"]
              - id: l1-n2
                type: fill_in_blank
                text: "Fünf mal sieben hilft."
                say: "Sieben mal sieben. Fünf mal sieben ist fünfunddreißig. Wie viel kommt dazu?"
                frame: "7 · 7 = 35 + _ = _"
                options: ["14", "7", "49", "42"]
                answer: ["14", "49"]
              - id: l1-n3
                type: text_input
                text: "9 · 7 = _"
                say: "Neun mal sieben."
                answer: "63"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 8 · 7 = 54"
                say: "Acht mal sieben ist vierundfünfzig. Stimmt das?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahl gehört zur Siebenerreihe?"
                say: "Welche Zahl gehört zur Siebenerreihe?"
                options: ["24", "27", "28"]
                answer: "28"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "4 · 7 = _"
            say: "Vier mal sieben."
            answer: "28"
          - id: l1-c2
            type: fill_in_blank
            text: "Fünf mal sieben hilft."
            say: "Acht mal sieben. Fünf mal sieben ist fünfunddreißig. Wie viel kommt dazu?"
            frame: "8 · 7 = 35 + _ = _"
            options: ["21", "14", "56", "54"]
            answer: ["21", "56"]
          - id: l1-c3
            type: true_false
            text: "Gehört 45 zur Siebenerreihe?"
            say: "Gehört fünfundvierzig zur Siebenerreihe?"
            answer: false
          - id: l1-c4
            type: text_input
            text: "2 · 7 = _"
            say: "Zwei mal sieben."
            answer: "14"
          - id: l1-c5
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Siebenerreihe. Welche Zahl fehlt?"
            frame: "28, 35, _, 49"
            options: ["42", "41", "43"]
            answer: ["42"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 4 · 7 = 24"
            say: "Vier mal sieben ist vierundzwanzig. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Tauschen und merken", en: "Swap and remember" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Siebenerreihe. Welche Zahl fehlt?"
            frame: "35, 42, _, 56"
            options: ["49", "48", "50"]
            answer: ["49"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Verdopple."
            say: "Rechne zuerst fünf mal sieben, dann zehn mal sieben."
            frame: "5 · 7 = _ | 10 · 7 = _"
            options: ["35", "70", "75"]
            answer: ["35", "70"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "7 · 3 = 3 · 7 = 21"
            say: "Viele Aufgaben der Siebenerreihe kennst du schon aus anderen Reihen. Sieben mal drei ist das Gleiche wie drei mal sieben: einundzwanzig."
            show: { drawn: dots, array: [3, 7] }
          - text: "10 · 7 = 70 | 9 · 7 = 70 − 7 = 63"
            say: "Neun mal sieben ist eine Reihe weniger als zehn mal sieben. Nimm also eine Sieben weg: siebzig minus sieben ist dreiundsechzig."
            show: { drawn: dots, array: [9, 7] }
          - text: "7 · 7 = 49 | 56 = 7 · 8"
            say: "Zwei Aufgaben merkst du dir am besten. Sieben mal sieben ist neunundvierzig. Und für sieben mal acht gibt es einen Merksatz: fünf, sechs, sieben, acht. Sechsundfünfzig ist sieben mal acht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "7 · 4: Welche Tauschaufgabe hilft?"
                say: "Sieben mal vier. Welche Tauschaufgabe hilft dir?"
                options: ["4 · 7", "7 · 7", "4 + 7"]
                answer: "4 · 7"
                feedback:
                  "4 + 7": "Das ist eine Plusaufgabe. Tausche nur die beiden Zahlen."
                hints:
                  - "Bei der Tauschaufgabe tauschen die Zahlen den Platz."
                  - "Aus sieben mal vier wird vier mal sieben."
                  - "4 · 7."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Die Zehnerreihe hilft."
                say: "Neun mal sieben. Zehn mal sieben ist siebzig. Wie viel nimmst du weg?"
                frame: "9 · 7 = 70 − _ = _"
                options: ["7", "1", "63", "69"]
                answer: ["7", "63"]
                hints:
                  - "Neun mal sieben ist eine Reihe weniger als zehn mal sieben."
                  - "Eine Reihe hat sieben Punkte. Siebzig minus sieben."
                  - "7 und 63."
              - id: l2-f3
                type: fill_in_blank
                text: "Die Tauschaufgabe hilft."
                say: "Sieben mal sechs. Tausche die Zahlen und rechne."
                frame: "7 · 6 = _ · 7 = _"
                options: ["6", "7", "42", "49"]
                answer: ["6", "42"]
                hints:
                  - "Bei der Tauschaufgabe tauschen die Zahlen den Platz."
                  - "Aus sieben mal sechs wird sechs mal sieben. Das ist fünf mal sieben und noch eine Sieben."
                  - "6 und 42."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 7 · 8 = 56"
                say: "Sieben mal acht ist sechsundfünfzig. Stimmt das?"
                answer: true
                hints:
                  - "Denk an den Merksatz: fünf, sechs, sieben, acht."
                  - "Sechsundfünfzig ist sieben mal acht."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle rückwärts in der Siebenerreihe. Welche Zahl fehlt?"
                frame: "63, 56, _, 42"
                options: ["49", "48", "50"]
                answer: ["49"]
                hints:
                  - "Immer sieben zurück."
                  - "Sechsundfünfzig minus sieben."
                  - "49."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "7 · 9: Welche Tauschaufgabe hilft?"
                say: "Sieben mal neun. Welche Tauschaufgabe hilft dir?"
                options: ["9 · 7", "9 + 7", "7 · 7"]
                answer: "9 · 7"
                hints: ["Tausche die beiden Zahlen."]
              - id: l2-s2
                type: fill_in_blank
                text: "Die Zehnerreihe hilft."
                say: "Acht mal sieben. Zehn mal sieben ist siebzig. Wie viel nimmst du weg?"
                frame: "8 · 7 = 70 − _ = _"
                options: ["14", "2", "56", "68"]
                answer: ["14", "56"]
                hints: ["Acht mal sieben ist zwei Reihen weniger als zehn mal sieben. Zwei mal sieben ist vierzehn."]
              - id: l2-s3
                type: text_input
                text: "7 · 4 = _"
                say: "Sieben mal vier."
                answer: "28"
                hints: ["Tausche: vier mal sieben."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 7 · 7 = 47"
                say: "Sieben mal sieben ist siebenundvierzig. Stimmt das?"
                answer: false
                hints: ["Fünf mal sieben und zwei mal sieben."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welche Zahl fehlt?"
                say: "Zähle rückwärts in der Siebenerreihe. Welche Zahl fehlt?"
                frame: "70, 63, _, 49"
                options: ["54", "56", "57"]
                answer: ["56"]
                hints: ["Immer sieben zurück."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "7 · 8: Welche Tauschaufgabe hilft?"
                say: "Sieben mal acht. Welche Tauschaufgabe hilft dir?"
                options: ["8 · 7", "8 + 7", "7 · 7"]
                answer: "8 · 7"
              - id: l2-n2
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst drei mal sieben, dann sechs mal sieben."
                frame: "3 · 7 = _ | 6 · 7 = _"
                options: ["21", "42", "24", "36"]
                answer: ["21", "42"]
              - id: l2-n3
                type: text_input
                text: "Eine Woche hat 7 Tage. Wie viele Tage haben 9 Wochen?"
                say: "Eine Woche hat sieben Tage. Wie viele Tage haben neun Wochen?"
                answer: "63"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 7 · 6 = 49"
                say: "Sieben mal sechs ist neunundvierzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Diese zwei Aufgaben kannst du auswendig."
                say: "Rechne sieben mal acht und sieben mal sieben."
                frame: "7 · 8 = _ | 7 · 7 = _"
                options: ["56", "49", "54", "47"]
                answer: ["56", "49"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: facts
            type: text_input
            text: "7 · 6 = _"
            say: "Sieben mal sechs."
            answer: "42"
          - id: l2-c2
            part: in-context
            type: text_input
            text: "Eine Woche hat 7 Tage. Wie viele Tage haben 6 Wochen?"
            say: "Eine Woche hat sieben Tage. Wie viele Tage haben sechs Wochen?"
            answer: "42"
          - id: l2-c3
            part: count
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle in der Siebenerreihe. Welche Zahl fehlt?"
            frame: "21, 28, _, 42"
            options: ["35", "34", "36"]
            answer: ["35"]
          - id: l2-c4
            part: facts
            type: true_false
            text: "Stimmt das? 7 · 10 = 77"
            say: "Sieben mal zehn ist siebenundsiebzig. Stimmt das?"
            answer: false
          - id: l2-c5
            part: count
            type: true_false
            text: "Gehört 48 zur Siebenerreihe?"
            say: "Gehört achtundvierzig zur Siebenerreihe?"
            answer: false
          - id: l2-c6
            part: facts
            type: text_input
            text: "7 · 5 = _"
            say: "Sieben mal fünf."
            answer: "35"
          - id: l2-c7
            part: facts
            type: text_input
            text: "7 · 9 = _"
            say: "Sieben mal neun."
            answer: "63"
          - id: l2-c8
            part: facts
            type: multiple_choice
            text: "_ · 7 = 56"
            say: "Wie viel mal sieben ist sechsundfünfzig?"
            options: ["8", "7", "9"]
            answer: "8"
          - id: l2-c9
            part: count
            type: multiple_choice
            text: "Welche Zahl gehört zur Siebenerreihe?"
            say: "Welche Zahl gehört zur Siebenerreihe?"
            options: ["27", "42", "48"]
            answer: "42"
          - id: l2-c10
            part: count
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Zähle rückwärts in der Siebenerreihe. Welche Zahl fehlt?"
            frame: "49, 42, _, 28"
            options: ["35", "36", "34"]
            answer: ["35"]
          - id: l2-c11
            part: count
            type: true_false
            text: "Gehört 63 zur Siebenerreihe?"
            say: "Gehört dreiundsechzig zur Siebenerreihe?"
            answer: true
          - id: l2-c12
            part: helpers
            type: fill_in_blank
            text: "Fünf mal sieben hilft."
            say: "Neun mal sieben. Fünf mal sieben ist fünfunddreißig. Wie viel kommt dazu?"
            frame: "9 · 7 = 35 + _ = _"
            options: ["28", "35", "63", "56"]
            answer: ["28", "63"]
          - id: l2-c13
            part: helpers
            type: fill_in_blank
            text: "Die Zehnerreihe hilft."
            say: "Rechne zuerst zehn mal sieben, dann neun mal sieben."
            frame: "10 · 7 = _ | 9 · 7 = _"
            options: ["70", "63", "69", "77"]
            answer: ["70", "63"]
          - id: l2-c14
            part: helpers
            type: fill_in_blank
            text: "Die Tauschaufgabe hilft."
            say: "Sieben mal fünf. Die Tauschaufgabe hilft."
            frame: "7 · 5 = _ · 7 = _"
            options: ["5", "35", "12", "57"]
            answer: ["5", "35"]
          - id: l2-c15
            part: helpers
            type: multiple_choice
            text: "7 · 2: Welche Tauschaufgabe hilft?"
            say: "Sieben mal zwei. Welche Tauschaufgabe hilft dir?"
            options: ["2 · 7", "7 · 3", "2 + 7"]
            answer: "2 · 7"
          - id: l2-c16
            part: helpers
