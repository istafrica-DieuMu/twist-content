# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.time-quarter
skill: math.time.quarter-hours
curriculum: de-DE
language: de
title:
  de: Viertelstunden
  en: Quarter hours
summary: >
  Reading quarter hours. Lesson 1 reads Viertel nach (long hand on the 3,
  3:15) and Viertel vor (long hand on the 9, 3:45 is Viertel vor vier);
  lesson 2 mixes all four positions of the long hand with the digital
  time, mentions Dreiviertel as the regional word, and ends with the
  skill check. Every practise stage and both checks also ask the child to
  set the hands to a quarter hour (clock_hands_drag).
metadata:
  year: klasse-2
  topic: { de: Uhrzeit, en: Time }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.time.full-half-hour]
  also_practises: [math.time.full-half-hour]
  vocabulary: { de: [Viertel nach, Viertel vor, halb, Dreiviertel, Viertelstunde, Minute] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  misconceptions:
    - id: viertel-vor-past-hour
      what: Names the hour that has passed for Viertel vor (3:45 as Viertel vor drei)
      addressed: lesson 1 Learn reads 3:45 as Viertel vor vier; the Viertel-vor readings l1-f2, l1-s2, l1-n2, l1-c2, l2-n1 and l2-c2 offer the past hour, with feedback in l1-f2; setting Viertel vor in l1-s5 and l1-c3 gives feedback for the hour after
    - id: three-means-three-minutes
      what: Reads the long hand on the 3 as 3 minutes (3:03)
      addressed: lesson 1 Learn says the long hand on the 3 means fifteen minutes; l1-f3 and l1-n3 offer the :03 time, with feedback in l1-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Viertel nach und Viertel vor", en: "Quarter past and quarter to" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 7, minute: 30 }
            options: ["halb 8", "halb 7", "7 Uhr"]
            answer: "halb 8"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "5 + 5 + 5 = _"
            say: "Fünf plus fünf plus fünf."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Viertel nach 3 | 3:15"
            say: "Der große Zeiger zeigt auf die Drei. Er ist eine Viertelrunde gelaufen, das sind fünfzehn Minuten. Der kleine Zeiger ist kurz nach der Drei. Es ist Viertel nach drei."
            show: { drawn: clock, hour: 3, minute: 15, digital: true }
          - text: "Viertel vor 4 | 3:45"
            say: "Jetzt zeigt der große Zeiger auf die Neun. Bis zur vollen Stunde fehlt noch eine Viertelrunde. Der kleine Zeiger ist fast bei der Vier. Es ist Viertel vor vier."
            show: { drawn: clock, hour: 3, minute: 45, digital: true }
          - text: "Uhr | Viertel nach | halb | Viertel vor"
            say: "Der große Zeiger auf der Zwölf: volle Stunde. Auf der Drei: Viertel nach. Auf der Sechs: halb. Auf der Neun: Viertel vor."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 6, minute: 15 }
                options: ["Viertel nach 6", "Viertel vor 6", "halb 7"]
                answer: "Viertel nach 6"
                hints:
                  - "Wohin zeigt der große Zeiger?"
                  - "Auf die Drei. Das heißt Viertel nach."
                  - "Viertel nach 6."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 8, minute: 45 }
                options: ["Viertel vor 9", "Viertel vor 8", "Viertel nach 9"]
                answer: "Viertel vor 9"
                feedback:
                  "Viertel vor 8": "Der kleine Zeiger ist schon fast bei der Neun. Bis neun Uhr fehlt nur noch eine Viertelstunde."
                hints:
                  - "Der große Zeiger zeigt auf die Neun. Das heißt Viertel vor."
                  - "Zu welcher Zahl läuft der kleine Zeiger?"
                  - "Viertel vor 9."
              - id: l1-f3
                type: multiple_choice
                text: "Viertel nach 2. Welche Digitalzeit passt?"
                say: "Viertel nach zwei. Welche Zeit zeigt die Digitaluhr?"
                options: ["2:15", "2:03", "2:45"]
                answer: "2:15"
                feedback:
                  "2:03": "Der große Zeiger auf der Drei bedeutet fünfzehn Minuten, nicht drei."
                hints:
                  - "Eine Viertelstunde hat fünfzehn Minuten."
                  - "Zwei Uhr und fünfzehn Minuten."
                  - "2:15."
              - id: l1-f4
                type: true_false
                text: "Ist es Viertel vor 12?"
                say: "Ist es Viertel vor zwölf?"
                show: { drawn: clock, hour: 11, minute: 45 }
                answer: true
                hints:
                  - "Zeigt der große Zeiger auf die Neun?"
                  - "Er zeigt auf die Neun. Zu welcher Zahl läuft der kleine Zeiger?"
                  - "Ja, es ist Viertel vor 12."
              - id: l1-f5
                type: clock_hands_drag
                text: "Stell die Uhr auf Viertel nach 10."
                say: "Stell die Uhr auf Viertel nach zehn. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "10:15"
                feedback:
                  "10:45": "Das ist Viertel vor elf. Bei Viertel nach zeigt der große Zeiger auf die Drei."
                  "9:45": "Das ist Viertel vor zehn. Viertel nach zehn ist nach zehn Uhr: Der große Zeiger zeigt auf die Drei."
                hints:
                  - "Bei Viertel nach zeigt der große Zeiger auf die Drei."
                  - "Der kleine Zeiger ist dann kurz nach der Zehn."
                  - "Zieh den großen Zeiger auf die Drei und den kleinen Zeiger auf die Zehn."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 1, minute: 15 }
                options: ["Viertel nach 1", "Viertel vor 1", "Viertel nach 3"]
                answer: "Viertel nach 1"
                hints: ["Wohin zeigt der große Zeiger?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 4, minute: 45 }
                options: ["Viertel vor 5", "Viertel vor 4", "Viertel nach 5"]
                answer: "Viertel vor 5"
                hints: ["Zu welcher Zahl läuft der kleine Zeiger?"]
              - id: l1-s3
                type: multiple_choice
                text: "Viertel vor 7. Welche Digitalzeit passt?"
                say: "Viertel vor sieben. Welche Zeit zeigt die Digitaluhr?"
                options: ["6:45", "7:45", "7:09"]
                answer: "6:45"
                hints: ["Viertel vor sieben ist noch vor sieben Uhr."]
              - id: l1-s4
                type: true_false
                text: "Ist es Viertel nach 5?"
                say: "Ist es Viertel nach fünf?"
                show: { drawn: clock, hour: 4, minute: 45 }
                answer: false
                hints: ["Wohin zeigt der große Zeiger?"]
              - id: l1-s5
                type: clock_hands_drag
                text: "Stell die Uhr auf Viertel vor 3."
                say: "Stell die Uhr auf Viertel vor drei. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "2:45"
                feedback:
                  "3:45": "Das ist Viertel vor vier. Viertel vor drei ist noch vor drei Uhr: Zieh den kleinen Zeiger auf die Zwei. Er steht dann fast bei der Drei."
                  "3:15": "Das ist Viertel nach drei. Bei Viertel vor zeigt der große Zeiger auf die Neun."
                hints: ["Bei Viertel vor zeigt der große Zeiger auf die Neun. Viertel vor drei ist noch vor drei Uhr."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 9, minute: 15 }
                options: ["Viertel nach 9", "Viertel vor 9", "halb 10"]
                answer: "Viertel nach 9"
              - id: l1-n2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 12, minute: 45 }
                options: ["Viertel vor 1", "Viertel vor 12", "Viertel nach 1"]
                answer: "Viertel vor 1"
              - id: l1-n3
                type: multiple_choice
                text: "Viertel nach 11. Welche Digitalzeit passt?"
                say: "Viertel nach elf. Welche Zeit zeigt die Digitaluhr?"
                options: ["11:15", "11:03", "10:45"]
                answer: "11:15"
              - id: l1-n4
                type: true_false
                text: "Ist es Viertel vor 8?"
                say: "Ist es Viertel vor acht?"
                show: { drawn: clock, hour: 7, minute: 45 }
                answer: true
              - id: l1-n5
                type: clock_hands_drag
                text: "Stell die Uhr auf Viertel nach 7."
                say: "Stell die Uhr auf Viertel nach sieben. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "7:15"
                feedback:
                  "7:45": "Das ist Viertel vor acht. Bei Viertel nach zeigt der große Zeiger auf die Drei."

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 2, minute: 15 }
            options: ["Viertel nach 2", "Viertel vor 2", "Viertel nach 3"]
            answer: "Viertel nach 2"
          - id: l1-c2
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 5, minute: 45 }
            options: ["Viertel vor 6", "Viertel vor 5", "Viertel nach 6"]
            answer: "Viertel vor 6"
          - id: l1-c3
            type: clock_hands_drag
            text: "Stell die Uhr auf Viertel vor 10."
            say: "Stell die Uhr auf Viertel vor zehn. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 15
            answer: "9:45"
            feedback:
              "10:45": "Das ist Viertel vor elf. Viertel vor zehn ist noch vor zehn Uhr: Der kleine Zeiger steht kurz vor der Zehn."

  - n: 2
    title: { de: "Alle Viertel", en: "All the quarters" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 5, minute: 15 }
            options: ["Viertel nach 5", "Viertel vor 5", "halb 6"]
            answer: "Viertel nach 5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wohin zeigt der große Zeiger bei Viertel vor?"
            say: "Wohin zeigt der große Zeiger bei Viertel vor?"
            options: ["auf die 9", "auf die 3", "auf die 6"]
            answer: "auf die 9"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4:00 | 4:15 | 4:30 | 4:45"
            say: "In einer Stunde läuft der große Zeiger einmal rundherum: vier Uhr, Viertel nach vier, halb fünf, Viertel vor fünf. Dann ist es fünf Uhr."
            show: { drawn: clock, hour: 4, minute: 45, digital: true }
          - text: "15 | 30 | 45 Minuten"
            say: "Viertel nach heißt fünfzehn Minuten nach der vollen Stunde, halb heißt dreißig Minuten, Viertel vor heißt fünfundvierzig Minuten."
          - text: "Viertel vor 5 = Dreiviertel 5"
            say: "In manchen Gegenden sagt man statt Viertel vor fünf auch Dreiviertel fünf. Das bedeutet dasselbe: Drei Viertel der Stunde bis fünf Uhr sind um."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 10, minute: 45 }
                options: ["Viertel vor 11", "Viertel nach 10", "halb 11"]
                answer: "Viertel vor 11"
                hints:
                  - "Wohin zeigt der große Zeiger?"
                  - "Auf die Neun. Zu welcher Zahl läuft der kleine Zeiger?"
                  - "Viertel vor 11."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Uhrzeit mit der Digitalzeit."
                pairs:
                  - { left: { text: "Viertel nach 1" }, right: { text: "1:15" } }
                  - { left: { text: "halb 2" }, right: { text: "1:30" } }
                  - { left: { text: "Viertel vor 2" }, right: { text: "1:45" } }
                  - { left: { text: "2 Uhr" }, right: { text: "2:00" } }
                hints:
                  - "Viertel nach, halb und Viertel vor: fünfzehn, dreißig und fünfundvierzig Minuten."
                  - "Halb zwei: Es ist dreißig Minuten nach ein Uhr. Welche Digitalzeit ist das?"
                  - "1:15, 1:30, 1:45 und 2:00."
              - id: l2-f3
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt sieben Uhr fünfundvierzig. Wie sagst du dazu?"
                show: { drawn: clock, hour: 7, minute: 45, digital: true }
                options: ["Viertel vor 8", "Viertel nach 7", "Viertel vor 7"]
                answer: "Viertel vor 8"
                hints:
                  - "Fünfundvierzig Minuten sind drei Viertelstunden."
                  - "Bis acht Uhr fehlen noch fünfzehn Minuten."
                  - "Viertel vor 8."
              - id: l2-f4
                type: true_false
                text: "Ist Dreiviertel 3 dasselbe wie Viertel vor 3?"
                say: "Ist Dreiviertel drei dasselbe wie Viertel vor drei?"
                answer: true
                hints:
                  - "Dreiviertel drei heißt: Drei Viertel der Stunde bis drei Uhr sind um."
                  - "Wie viel fehlt dann noch bis drei Uhr?"
                  - "Ja. Beides heißt 2:45."
              - id: l2-f5
                type: clock_hands_drag
                text: "Stell die Uhr auf 9:15."
                say: "Stell die Uhr auf neun Uhr fünfzehn. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "9:15"
                feedback:
                  "3:45": "Du hast die Zeiger vertauscht. Der große Zeiger zeigt die Minuten: Er gehört auf die Drei. Der kleine Zeiger zeigt die Stunde: Er gehört auf die Neun."
                  "9:45": "Das ist 9:45. Fünfzehn Minuten: Der große Zeiger zeigt auf die Drei."
                hints:
                  - "Fünfzehn Minuten: Der große Zeiger zeigt auf die Drei."
                  - "Der kleine Zeiger zeigt die Stunde. Er steht kurz nach der Neun."
                  - "Zieh den großen Zeiger auf die Drei und den kleinen Zeiger auf die Neun."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 11, minute: 15 }
                options: ["Viertel nach 11", "Viertel vor 11", "Viertel nach 12"]
                answer: "Viertel nach 11"
                hints: ["Wohin zeigt der große Zeiger?"]
              - id: l2-s2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Uhrzeit mit der Digitalzeit."
                pairs:
                  - { left: { text: "Viertel nach 6" }, right: { text: "6:15" } }
                  - { left: { text: "halb 7" }, right: { text: "6:30" } }
                  - { left: { text: "Viertel vor 7" }, right: { text: "6:45" } }
                hints: ["Fünfzehn, dreißig, fünfundvierzig."]
              - id: l2-s3
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt zwölf Uhr fünfzehn. Wie sagst du dazu?"
                show: { drawn: clock, hour: 12, minute: 15, digital: true }
                options: ["Viertel nach 12", "Viertel vor 12", "Viertel vor 1"]
                answer: "Viertel nach 12"
                hints: ["Fünfzehn Minuten nach der vollen Stunde."]
              - id: l2-s4
                type: true_false
                text: "Ist es halb 5?"
                say: "Ist es halb fünf?"
                show: { drawn: clock, hour: 4, minute: 45 }
                answer: false
                hints: ["Wohin zeigt der große Zeiger?"]
              - id: l2-s5
                type: clock_hands_drag
                text: "Stell die Uhr auf 5:45."
                say: "Stell die Uhr auf fünf Uhr fünfundvierzig. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 15
                answer: "5:45"
                feedback:
                  "5:15": "Das ist 5:15. Fünfundvierzig Minuten: Der große Zeiger zeigt auf die Neun."
                  "6:45": "Das ist 6:45. Bei 5:45 ist es noch vor sechs Uhr: Zieh den kleinen Zeiger auf die Fünf."
                hints: ["Fünfundvierzig Minuten: Der große Zeiger zeigt auf die Neun. Der kleine Zeiger steht kurz vor der Sechs."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 1, minute: 45 }
                options: ["Viertel vor 2", "Viertel vor 1", "Viertel nach 2"]
                answer: "Viertel vor 2"
              - id: l2-n2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Uhrzeit mit der Digitalzeit."
                pairs:
                  - { left: { text: "Viertel vor 4" }, right: { text: "3:45" } }
                  - { left: { text: "Viertel nach 4" }, right: { text: "4:15" } }
                  - { left: { text: "halb 4" }, right: { text: "3:30" } }
                  - { left: { text: "4 Uhr" }, right: { text: "4:00" } }
              - id: l2-n3
                type: multiple_choice
                text: "Was zeigt die Digitaluhr?"
                say: "Die Digitaluhr zeigt neun Uhr fünfundvierzig. Wie sagst du dazu?"
                show: { drawn: clock, hour: 9, minute: 45, digital: true }
                options: ["Viertel vor 10", "Viertel vor 9", "Viertel nach 9"]
                answer: "Viertel vor 10"
              - id: l2-n4
                type: true_false
                text: "Ist es Viertel nach 8?"
                say: "Ist es Viertel nach acht?"
                show: { drawn: clock, hour: 8, minute: 15 }
                answer: true
              - id: l2-n5
                type: clock_hands_drag
                text: "Stell die Uhr auf 12:45."
                say: "Stell die Uhr auf zwölf Uhr fünfundvierzig. Zieh die Zeiger."
                show: { drawn: clock, hour: 6, minute: 0 }
                step: 15
                answer: "12:45"
                feedback:
                  "12:15": "Das ist 12:15. Fünfundvierzig Minuten: Der große Zeiger zeigt auf die Neun."
                  "1:45": "Das ist 1:45. Bei 12:45 ist es noch vor ein Uhr: Zieh den kleinen Zeiger auf die Zwölf."

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 7, minute: 15 }
            options: ["Viertel nach 7", "Viertel vor 7", "halb 8"]
            answer: "Viertel nach 7"
          - id: l2-c2
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 2, minute: 45 }
            options: ["Viertel vor 3", "Viertel vor 2", "Viertel nach 3"]
            answer: "Viertel vor 3"
          - id: l2-c3
            type: multiple_choice
            text: "Viertel vor 11. Welche Digitalzeit passt?"
            say: "Viertel vor elf. Welche Zeit zeigt die Digitaluhr?"
            options: ["10:45", "11:45", "11:15"]
            answer: "10:45"
          - id: l2-c4
            type: clock_hands_drag
            text: "Stell die Uhr auf Viertel nach 4."
            say: "Stell die Uhr auf Viertel nach vier. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 15
            answer: "4:15"
            feedback:
              "4:45": "Das ist Viertel vor fünf. Bei Viertel nach zeigt der große Zeiger auf die Drei."
              "3:45": "Das ist Viertel vor vier. Viertel nach vier ist nach vier Uhr."
          - id: l2-c5
            type: true_false
            text: "Ist es Viertel vor 6?"
            say: "Ist es Viertel vor sechs?"
            show: { drawn: clock, hour: 6, minute: 15 }
            answer: false
