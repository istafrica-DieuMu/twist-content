          - text: "+2"
            say: "Prüfe die Regel bei allen Zahlen: fünfundzwanzig und zwei sind siebenundzwanzig, siebenundzwanzig und zwei sind neunundzwanzig. Die Regel stimmt."
          - text: "50, 40, _, 20"
            say: "Hier fehlt eine Zahl. Die Zahlen werden kleiner, immer zehn weniger. Nach vierzig kommt dreißig. Dreißig fehlt."

