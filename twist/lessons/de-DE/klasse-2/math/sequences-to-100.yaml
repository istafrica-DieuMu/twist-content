# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.sequences-to-100
skill: math.numbers-to-100.sequences
curriculum: de-DE
language: de
title:
  de: Zahlenfolgen bis 100
  en: Number sequences to 100
summary: >
  Counting in steps of 2, 5 and 10 from any start, forwards and
  backwards, and finding the rule of a sequence. Lesson 1 continues
  sequences with a given step; lesson 2 finds the rule and the missing
  number, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.tens]
  also_practises: [math.numbers-to-100.hundred-square]
  vocabulary: { de: [Zahlenfolge, Schritt, Regel, vorwärts, rückwärts, Zweierschritte, Fünferschritte] }
  forms: [drawn, text, audio]
  drawn: [number-line, hundred-square]
  facets: []
  parts:
    - { id: forward, what: { de: "in Schritten vorwärts zählen, von jeder Zahl aus", en: "counting on in steps from any number" } }
    - { id: backward, what: { de: in Schritten rückwärts zählen, en: counting back in steps } }
    - { id: rule, what: { de: die Regel einer Zahlenfolge finden, en: finding the rule of a sequence } }
    - { id: missing, what: { de: eine fehlende Zahl in einer Folge finden, en: finding a missing number in a sequence } }
  misconceptions:
    - id: only-from-zero
      what: Can count in tens from 0 but not from 7 (7, 17, 27)
      addressed: lesson 1 starts most sequences away from a ten; the hundred square shows tens steps as a column
    - id: step-is-one
      what: Continues 35, 40, 45 with 46
      addressed: Learn names the step of every sequence; feedback on 26 for 15, 20, 25 names the step
    - id: backwards-up
      what: Counts on when the sequence goes down
      addressed: lesson 2 mixes falling sequences in; hints ask "Werden die Zahlen größer oder kleiner?"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: In Schritten zählen, en: Counting in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "20, 30, 40, _"
            say: "Zähl weiter: zwanzig, dreißig, vierzig. Was kommt dann?"
            options: ["41", "50", "60"]
            answer: "50"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "2, 4, 6, _"
            say: "Zähl weiter: zwei, vier, sechs. Was kommt dann?"
            options: ["7", "8", "10"]
            answer: "8"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "7, 17, 27, 37"
            say: "In Zehnerschritten kannst du von jeder Zahl aus zählen. Von sieben: siebzehn, siebenundzwanzig, siebenunddreißig. Die Einer bleiben sieben, die Zehner werden immer eins mehr."
            show: { drawn: hundred-square, highlight: [7, 17, 27, 37] }
          - text: "35, 40, 45, 50"
            say: "In Fünferschritten: fünfunddreißig, vierzig, fünfundvierzig, fünfzig. Jeder Sprung ist fünf."
            show: { drawn: number-line, from: 30, to: 50, labels: tens, jumps: [[35, 5], [40, 5], [45, 5]] }
          - text: "62, 60, 58, 56"
            say: "Rückwärts in Zweierschritten: zweiundsechzig, sechzig, achtundfünfzig, sechsundfünfzig. Jeder Schritt ist zwei weniger."

