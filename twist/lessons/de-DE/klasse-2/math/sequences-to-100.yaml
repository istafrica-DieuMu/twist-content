                  - "46 und 2 sind 48."
                  - "48, dann 50."
              - id: l1-f4
                type: multiple_choice
                text: "90, 80, 70, _"
                say: "Zähl rückwärts in Zehnerschritten: neunzig, achtzig, siebzig. Was kommt dann?"
