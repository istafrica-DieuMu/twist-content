                show: { drawn: hundred-square, highlight: [4, 14, 24] }
                options: ["25", "34", "44"]
                answer: "34"
                feedback:
                  "25": "Der Schritt ist zehn, nicht eins. Geh auf der Tafel eine Zeile nach unten."
                hints:
                  - "Jeder Schritt ist zehn mehr."
                  - "Die Einer bleiben 4, die Zehner werden 3."
                  - "Nach 24 kommt 34."
                difficulty: easy
              - id: l1-f2
