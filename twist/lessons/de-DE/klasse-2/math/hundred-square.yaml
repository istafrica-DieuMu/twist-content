# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.hundred-square
skill: math.numbers-to-100.hundred-square
curriculum: de-DE
language: de
title:
  de: Die Hundertertafel
  en: The hundred square
summary: >
  Finding the way on the Hundertertafel: one step right is one more, one
  row down is ten more. Lesson 1 finds hidden numbers next to and under a
  number; lesson 2 follows moves and spots column patterns (every number
  in a column ends with the same digit), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.read-write]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [Hundertertafel, Zeile, Spalte, rechts, links, oben, unten] }
  forms: [drawn, text, audio]
  drawn: [hundred-square]
  facets: []
  parts:
    - { id: neighbours, what: { de: "die Nachbarn links, rechts, oben und unten finden", en: "finding the numbers left, right, above and below" } }
    - { id: moves, what: { de: Wegen auf der Hundertertafel folgen, en: following moves on the hundred square } }
    - { id: patterns, what: { de: Muster in Zeilen und Spalten erkennen, en: spotting patterns in rows and columns } }
  misconceptions:
    - id: down-is-one
      what: Thinks the number under 34 is 35
      addressed: Learn shows that each row starts ten further on; hints say "eine Zeile tiefer ist zehn mehr"
    - id: row-end
      what: Thinks the number after 40 is on the same row
      addressed: tasks ask for the number after 30, 60 and 90, which start the next row
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Nachbarn auf der Tafel, en: Neighbours on the square }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "Hör zu und schreib die Zahl."
            say: "Dreiundvierzig. Schreib die Zahl."
            answer: "43"
            difficulty: easy
          - id: l1-w2
            type: fill_in_blank
            text: "_ , 27, _"
            say: "Welche Zahlen sind die Nachbarn von siebenundzwanzig?"
            frame: "_ , 27, _"
            options: ["26", "28", "17", "37"]
            answer: ["26", "28"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "1 bis 100"
            say: "Das ist die Hundertertafel. Jede Zeile hat zehn Zahlen. Oben links steht eins, unten rechts steht hundert."
            show: { drawn: hundred-square }
          - text: "34 → 35"
            say: "Ein Schritt nach rechts ist eins mehr. Rechts neben vierunddreißig steht fünfunddreißig."
            show: { drawn: hundred-square, highlight: [34, 35] }
          - text: "34 → 44"
            say: "Eine Zeile tiefer ist zehn mehr. Unter vierunddreißig steht vierundvierzig. Die Einer bleiben gleich, die Zehner werden eins mehr."
            show: { drawn: hundred-square, highlight: [34, 44] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                show: { drawn: hundred-square, hide: [23] }
                options: ["22", "23", "33"]
                answer: "23"
                hints:
                  - "Schau links und rechts daneben."
                  - "Links steht 22, rechts steht 24."
                  - "Dazwischen ist 23."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist unter sechsundvierzig. Welche ist es?"
                show: { drawn: hundred-square, highlight: [46], hide: [56] }
                options: ["47", "56", "66"]
                answer: "56"
                feedback:
                  "47": "47 steht rechts daneben. Eine Zeile tiefer ist zehn mehr."
                hints:
                  - "Eine Zeile tiefer ist zehn mehr."
                  - "Die Einer bleiben 6. Aus 4 Zehnern werden 5 Zehner."
                  - "Unter 46 steht 56."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Zahl ist versteckt?"
                say: "Die versteckte Zahl ist über zweiundsiebzig. Welche ist es?"
                show: { drawn: hundred-square, highlight: [72], hide: [62] }
                options: ["62", "71", "82"]
                answer: "62"
                hints:
                  - "Eine Zeile höher ist zehn weniger."
                  - "Die Einer bleiben 2. Aus 7 Zehnern werden 6 Zehner."
                  - "Über 72 steht 62."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 31 steht in derselben Zeile wie 30."
                say: "Nach dreißig kommt einunddreißig. Steht einunddreißig in derselben Zeile wie dreißig?"
                show: { drawn: hundred-square, highlight: [30, 31] }
                answer: false
                hints:
                  - "Wo steht die 30? Ganz rechts."
                  - "Nach dem rechten Rand geht es in der nächsten Zeile weiter."
                  - "Nein, 31 steht vorne in der nächsten Zeile."
              - id: l1-f5
                type: fill_in_blank
                text: "Welche Zahlen stehen links und rechts?"
                say: "Welche Zahlen stehen links und rechts neben achtundfünfzig?"
