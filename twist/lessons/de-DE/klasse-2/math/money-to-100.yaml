# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.money-to-100
skill: math.money.amounts-to-100
curriculum: de-DE
language: de
title:
  de: Geldbeträge bis 100 €
  en: Amounts up to 100 euros
summary: >
  Lesson 1 adds up Scheine and Münzen to an amount (50 € + 20 € + 5 € =
  75 €), starting with the biggest; lesson 2 puts an amount together in
  different ways, finds the way with the fewest pieces, compares amounts,
  and ends with the skill check. Laying coins by dragging waits for
  drag_and_drop.
metadata:
  year: klasse-2
  topic: { de: Geld, en: Money }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.money.amounts-to-20, math.numbers-to-100.place-value]
  also_practises: [math.add-sub-to-100.tens-to-two-digit, math.numbers-to-100.place-value]
  vocabulary: { de: [Schein, Münze, Euro, Betrag, wenigsten] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: add-up, what: { de: Scheine und Münzen zu einem Betrag zusammenzählen, en: adding up notes and coins to an amount } }
    - { id: ways, what: { de: einen Betrag auf verschiedene Arten legen, en: making an amount in different ways } }
    - { id: compare, what: { de: Geldbeträge vergleichen, en: comparing amounts of money } }
  misconceptions:
    - id: count-pieces
      what: Counts the pieces instead of their values (three notes = 3 €)
      addressed: lesson 1 Learn adds the values; l1-f2 and l1-s2 offer the number of pieces, with feedback in l1-f2
    - id: one-way-only
      what: Thinks an amount can be laid in only one way
      addressed: lesson 2 Learn lays 40 € in three ways; every stage of lesson 2 asks for another way or the fewest pieces
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Beträge zusammenzählen", en: "Adding up amounts" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "50 + 20 = _"
            say: "Fünfzig plus zwanzig."
            answer: "70"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "70 + 5 = _"
            say: "Siebzig plus fünf."
            answer: "75"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Scheine: 5 €, 10 €, 20 €, 50 €, 100 € · Münzen: 1 €, 2 €"
            say: "Es gibt Scheine für fünf, zehn, zwanzig, fünfzig und hundert Euro. Für einen und zwei Euro gibt es Münzen."
          - text: "50 € + 20 € + 5 € = 75 €"
            say: "Lena hat einen Fünfziger, einen Zwanziger und einen Fünfer. Fang mit dem größten Schein an: fünfzig, siebzig, fünfundsiebzig. Zusammen sind es fünfundsiebzig Euro."
          - text: "20 € + 20 € + 2 € + 1 € = 43 €"
            say: "Bei gleichen Scheinen zählst du weiter: zwanzig, vierzig. Dann die Münzen: zweiundvierzig, dreiundvierzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "20 € + 10 € + 5 € = _ €"
                say: "Ein Zwanziger, ein Zehner und ein Fünfer. Wie viel Geld ist das?"
                answer: "35"
                hints:
                  - "Fang mit dem größten Schein an."
                  - "Zwanzig, dreißig, dann noch fünf."
                  - "35 €."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Tim hat 3 Scheine: 50 €, 10 € und 5 €. Wie viel Geld hat er?"
                say: "Tim hat drei Scheine: fünfzig Euro, zehn Euro und fünf Euro. Wie viel Geld hat er?"
                options: ["65 €", "3 €", "55 €"]
                answer: "65 €"
                feedback:
                  "3 €": "Drei ist die Zahl der Scheine. Zähle ihren Wert zusammen."
                hints:
                  - "Zähle den Wert der Scheine, nicht die Scheine."
                  - "Fünfzig, sechzig, fünfundsechzig."
                  - "65 €."
              - id: l1-f3
                type: text_input
                text: "50 € + 20 € + 20 € + 2 € = _ €"
                say: "Ein Fünfziger, zwei Zwanziger und eine Zwei-Euro-Münze. Wie viel Geld ist das?"
                answer: "92"
                hints:
                  - "Fang mit dem Fünfziger an."
                  - "Fünfzig, siebzig, neunzig, dann noch zwei."
                  - "92 €."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 10 € + 10 € + 10 € + 1 € = 31 €"
                say: "Drei Zehner und eine Ein-Euro-Münze sind einunddreißig Euro. Stimmt das?"
                answer: true
                hints:
                  - "Zähle die Zehner: zehn, zwanzig, dreißig."
                  - "Dann noch ein Euro."
                  - "Ja, 31 €."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Scheine ergeben 25 €?"
                say: "Welche Scheine ergeben zusammen fünfundzwanzig Euro?"
                options: ["20 € + 5 €", "20 € + 10 €", "10 € + 5 €"]
                answer: "20 € + 5 €"
                hints:
                  - "Rechne jede Möglichkeit aus."
                  - "Zwanzig plus fünf."
                  - "20 € + 5 €."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "50 € + 10 € + 2 € = _ €"
                say: "Ein Fünfziger, ein Zehner und eine Zwei-Euro-Münze. Wie viel Geld ist das?"
                answer: "62"
                hints: ["Fang mit dem größten Schein an."]
              - id: l1-s2
                type: multiple_choice
                text: "Mia hat 4 Scheine: 20 €, 20 €, 5 € und 5 €. Wie viel Geld hat sie?"
                say: "Mia hat vier Scheine: zwanzig, zwanzig, fünf und fünf Euro. Wie viel Geld hat sie?"
                options: ["50 €", "4 €", "45 €"]
                answer: "50 €"
                hints: ["Zähle den Wert der Scheine."]
              - id: l1-s3
                type: text_input
                text: "20 € + 20 € + 20 € + 1 € = _ €"
                say: "Drei Zwanziger und eine Ein-Euro-Münze. Wie viel Geld ist das?"
                answer: "61"
                hints: ["Zwanzig, vierzig, sechzig."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 50 € + 5 € + 2 € = 75 €"
                say: "Ein Fünfziger, ein Fünfer und eine Zwei-Euro-Münze sind fünfundsiebzig Euro. Stimmt das?"
                answer: false
                hints: ["Zähle ab fünfzig weiter."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Scheine ergeben 60 €?"
                say: "Welche Scheine ergeben zusammen sechzig Euro?"
                options: ["50 € + 10 €", "50 € + 5 €", "20 € + 20 €"]
                answer: "50 € + 10 €"
                hints: ["Rechne jede Möglichkeit aus."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "50 € + 20 € + 10 € + 5 € = _ €"
                say: "Ein Fünfziger, ein Zwanziger, ein Zehner und ein Fünfer. Wie viel Geld ist das?"
                answer: "85"
              - id: l1-n2
                type: multiple_choice
                text: "Ben hat 5 Münzen: 2 €, 2 €, 2 €, 1 € und 1 €. Wie viel Geld hat er?"
                say: "Ben hat fünf Münzen: drei Zwei-Euro-Münzen und zwei Ein-Euro-Münzen. Wie viel Geld hat er?"
                options: ["8 €", "5 €", "7 €"]
                answer: "8 €"
              - id: l1-n3
                type: text_input
                text: "20 € + 10 € + 10 € + 2 € + 1 € = _ €"
                say: "Ein Zwanziger, zwei Zehner, eine Zwei-Euro-Münze und eine Ein-Euro-Münze. Wie viel Geld ist das?"
                answer: "43"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 50 € + 20 € + 20 € + 5 € + 2 € = 97 €"
                say: "Ein Fünfziger, zwei Zwanziger, ein Fünfer und eine Zwei-Euro-Münze sind siebenundneunzig Euro. Stimmt das?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Welche Scheine ergeben 70 €?"
                say: "Welche Scheine ergeben zusammen siebzig Euro?"
                options: ["50 € + 20 €", "50 € + 10 €", "20 € + 20 € + 20 €"]
                answer: "50 € + 20 €"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "20 € + 5 € + 2 € = _ €"
            say: "Ein Zwanziger, ein Fünfer und eine Zwei-Euro-Münze. Wie viel Geld ist das?"
            answer: "27"
          - id: l1-c2
            type: text_input
            text: "50 € + 20 € + 20 € = _ €"
            say: "Ein Fünfziger und zwei Zwanziger. Wie viel Geld ist das?"
            answer: "90"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 10 € + 5 € + 5 € = 20 €"
            say: "Ein Zehner und zwei Fünfer sind zwanzig Euro. Stimmt das?"
            answer: true
          - id: l1-c4
            type: text_input
            text: "50 € + 10 € + 5 € + 2 € + 1 € = _ €"
            say: "Ein Fünfziger, ein Zehner, ein Fünfer, eine Zwei-Euro-Münze und eine Ein-Euro-Münze. Wie viel Geld ist das?"
            answer: "68"
          - id: l1-c5
            type: multiple_choice
            text: "Eva hat 3 Scheine: 20 €, 20 € und 10 €. Wie viel Geld hat sie?"
            say: "Eva hat drei Scheine: zwanzig Euro, zwanzig Euro und zehn Euro. Wie viel Geld hat sie?"
            options: ["50 €", "3 €", "40 €"]
            answer: "50 €"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 20 € + 10 € + 2 € = 22 €"
            say: "Ein Zwanziger, ein Zehner und eine Zwei-Euro-Münze sind zweiundzwanzig Euro. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Auf verschiedene Arten legen", en: "Making amounts in different ways" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "50 € + 10 € + 5 € + 1 € = _ €"
            say: "Ein Fünfziger, ein Zehner, ein Fünfer und eine Ein-Euro-Münze. Wie viel Geld ist das?"
            answer: "66"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was ist mehr: 37 € oder 73 €?"
            say: "Was ist mehr: siebenunddreißig Euro oder dreiundsiebzig Euro?"
            options: ["73 €", "37 €"]
            answer: "73 €"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "40 € = 20 € + 20 € = 10 € + 10 € + 20 € = 5 € + 5 € + 10 € + 20 €"
            say: "Vierzig Euro kannst du auf verschiedene Arten legen: mit zwei Zwanzigern, mit zwei Zehnern und einem Zwanziger, oder mit zwei Fünfern, einem Zehner und einem Zwanziger."
          - text: "40 € = 20 € + 20 €"
            say: "Mit den wenigsten Scheinen geht es so: zwei Zwanziger. Fang immer mit dem größten Schein an, der passt."
          - text: "45 € > 40 €"
            say: "Zum Vergleichen schaust du zuerst auf die Zehner. Sind sie gleich, entscheiden die Einer. Fünfundvierzig Euro sind mehr als vierzig Euro."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie legst du 30 € mit den wenigsten Scheinen?"
                say: "Wie legst du dreißig Euro mit den wenigsten Scheinen?"
                options: ["20 € + 10 €", "10 € + 10 € + 10 €", "20 € + 5 € + 5 €"]
                answer: "20 € + 10 €"
                hints:
                  - "Fang mit dem größten Schein an, der passt."
                  - "Ein Zwanziger passt. Was fehlt noch?"
                  - "20 € + 10 €."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Scheine ergeben auch 50 €?"
                say: "Fünfzig Euro sind ein Fünfziger. Welche Scheine ergeben auch fünfzig Euro?"
                options: ["20 € + 20 € + 10 €", "20 € + 20 € + 5 €", "10 € + 10 € + 20 € + 20 €"]
                answer: "20 € + 20 € + 10 €"
                hints:
                  - "Rechne jede Möglichkeit aus."
                  - "Zwanzig, vierzig, fünfzig."
                  - "20 € + 20 € + 10 €."
              - id: l2-f3
                type: text_input
                text: "Wie viele 5-€-Scheine sind 20 €?"
                say: "Wie viele Fünf-Euro-Scheine sind zwanzig Euro?"
                answer: "4"
                hints:
                  - "Zähle in Fünferschritten bis zwanzig."
                  - "Fünf, zehn, fünfzehn, zwanzig."
                  - "4 Scheine."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 10 € + 10 € + 5 € ist dasselbe wie 20 € + 5 €."
                say: "Zwei Zehner und ein Fünfer sind dasselbe wie ein Zwanziger und ein Fünfer. Stimmt das?"
                answer: true
                hints:
                  - "Rechne beide Beträge aus."
                  - "Beide Male sind es fünfundzwanzig Euro."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Anna hat 20 € + 5 €. Paul hat 10 € + 10 € + 10 €. Wer hat mehr Geld?"
                say: "Anna hat einen Zwanziger und einen Fünfer. Paul hat drei Zehner. Wer hat mehr Geld?"
                options: ["Paul", "Anna", "beide gleich viel"]
                answer: "Paul"
                hints:
                  - "Rechne aus, wie viel jedes Kind hat."
                  - "Anna hat fünfundzwanzig Euro, Paul dreißig."
                  - "Paul."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie legst du 65 € mit den wenigsten Scheinen?"
                say: "Wie legst du fünfundsechzig Euro mit den wenigsten Scheinen?"
                options: ["50 € + 10 € + 5 €", "20 € + 20 € + 20 € + 5 €", "50 € + 5 € + 5 € + 5 €"]
                answer: "50 € + 10 € + 5 €"
                hints: ["Fang mit dem größten Schein an, der passt."]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Münzen ergeben auch 5 €?"
                say: "Fünf Euro sind ein Fünfer. Welche Münzen ergeben auch fünf Euro?"
                options: ["2 € + 2 € + 1 €", "2 € + 2 € + 2 €", "1 € + 1 € + 2 €"]
                answer: "2 € + 2 € + 1 €"
                hints: ["Rechne jede Möglichkeit aus."]
              - id: l2-s3
                type: text_input
                text: "Wie viele 10-€-Scheine sind 70 €?"
                say: "Wie viele Zehn-Euro-Scheine sind siebzig Euro?"
                answer: "7"
                hints: ["Zähle in Zehnerschritten."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 50 € + 5 € ist dasselbe wie 20 € + 20 € + 10 €."
                say: "Ein Fünfziger und ein Fünfer sind dasselbe wie zwei Zwanziger und ein Zehner. Stimmt das?"
                answer: false
                hints: ["Rechne beide Beträge aus."]
              - id: l2-s5
                type: multiple_choice
                text: "Lea hat 50 €. Ben hat 20 € + 20 € + 5 €. Wer hat mehr Geld?"
                say: "Lea hat einen Fünfziger. Ben hat zwei Zwanziger und einen Fünfer. Wer hat mehr Geld?"
                options: ["Lea", "Ben", "beide gleich viel"]
                answer: "Lea"
                hints: ["Ben hat fünfundvierzig Euro."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie legst du 80 € mit den wenigsten Scheinen?"
                say: "Wie legst du achtzig Euro mit den wenigsten Scheinen?"
                options: ["50 € + 20 € + 10 €", "20 € + 20 € + 20 € + 20 €", "50 € + 10 € + 10 € + 10 €"]
                answer: "50 € + 20 € + 10 €"
              - id: l2-n2
                type: multiple_choice
                text: "Welche Scheine ergeben auch 100 €?"
                say: "Hundert Euro sind ein Hunderter. Welche Scheine ergeben auch hundert Euro?"
                options: ["50 € + 20 € + 20 € + 10 €", "50 € + 20 € + 20 €", "50 € + 50 € + 10 €"]
                answer: "50 € + 20 € + 20 € + 10 €"
              - id: l2-n3
                type: text_input
                text: "Wie viele 20-€-Scheine sind 100 €?"
                say: "Wie viele Zwanzig-Euro-Scheine sind hundert Euro?"
                answer: "5"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 20 € + 20 € + 2 € ist dasselbe wie 10 € + 10 € + 10 € + 10 € + 2 €."
                say: "Zwei Zwanziger und eine Zwei-Euro-Münze sind dasselbe wie vier Zehner und eine Zwei-Euro-Münze. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Tom hat 20 € + 20 € + 20 €. Mia hat 50 € + 5 €. Wer hat mehr Geld?"
                say: "Tom hat drei Zwanziger. Mia hat einen Fünfziger und einen Fünfer. Wer hat mehr Geld?"
                options: ["Tom", "Mia", "beide gleich viel"]
                answer: "Tom"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: add-up
            type: text_input
            text: "50 € + 20 € + 5 € + 2 € = _ €"
            say: "Ein Fünfziger, ein Zwanziger, ein Fünfer und eine Zwei-Euro-Münze. Wie viel Geld ist das?"
            answer: "77"
          - id: l2-c2
            part: ways
            type: multiple_choice
            text: "Wie legst du 35 € mit den wenigsten Scheinen?"
            say: "Wie legst du fünfunddreißig Euro mit den wenigsten Scheinen?"
            options: ["20 € + 10 € + 5 €", "10 € + 10 € + 10 € + 5 €", "20 € + 5 € + 5 € + 5 €"]
            answer: "20 € + 10 € + 5 €"
          - id: l2-c3
            part: ways
            type: text_input
            text: "Wie viele 5-€-Scheine sind 30 €?"
            say: "Wie viele Fünf-Euro-Scheine sind dreißig Euro?"
            answer: "6"
          - id: l2-c4
            part: compare
            type: multiple_choice
            text: "Ali hat 20 € + 10 € + 10 €. Sara hat 50 €. Wer hat mehr Geld?"
            say: "Ali hat einen Zwanziger und zwei Zehner. Sara hat einen Fünfziger. Wer hat mehr Geld?"
            options: ["Sara", "Ali", "beide gleich viel"]
            answer: "Sara"
          - id: l2-c5
            part: add-up
            type: true_false
            text: "Stimmt das? 20 € + 10 € + 10 € + 1 € = 41 €"
            say: "Ein Zwanziger, zwei Zehner und eine Ein-Euro-Münze sind einundvierzig Euro. Stimmt das?"
            answer: true
          - id: l2-c6
            part: add-up
            type: text_input
            text: "50 € + 10 € + 10 € + 5 € + 1 € = _ €"
            say: "Ein Fünfziger, zwei Zehner, ein Fünfer und eine Ein-Euro-Münze. Wie viel Geld ist das?"
            answer: "76"
          - id: l2-c7
            part: add-up
            type: multiple_choice
            text: "Lars hat 4 Scheine: 20 €, 10 €, 10 € und 5 €. Wie viel Geld hat er?"
            say: "Lars hat vier Scheine: zwanzig Euro, zehn Euro, zehn Euro und fünf Euro. Wie viel Geld hat er?"
            options: ["45 €", "4 €", "35 €"]
            answer: "45 €"
          - id: l2-c8
            part: add-up
            type: true_false
            text: "Stimmt das? 50 € + 20 € + 10 € + 2 € = 72 €"
            say: "Ein Fünfziger, ein Zwanziger, ein Zehner und eine Zwei-Euro-Münze sind zweiundsiebzig Euro. Stimmt das?"
            answer: false
          - id: l2-c9
            part: add-up
            type: text_input
            text: "20 € + 20 € + 20 € + 20 € + 10 € = _ €"
            say: "Vier Zwanziger und ein Zehner. Wie viel Geld ist das?"
            answer: "90"
          - id: l2-c10
            part: add-up
            type: text_input
            text: "5 € + 5 € + 2 € + 2 € + 1 € = _ €"
            say: "Zwei Fünfer, zwei Zwei-Euro-Münzen und eine Ein-Euro-Münze. Wie viel Geld ist das?"
            answer: "15"
          - id: l2-c11
            part: ways
            type: multiple_choice
            text: "Wie legst du 57 € mit den wenigsten Scheinen und Münzen?"
            say: "Wie legst du siebenundfünfzig Euro mit den wenigsten Scheinen und Münzen?"
            options: ["50 € + 5 € + 2 €", "20 € + 20 € + 10 € + 5 € + 2 €", "50 € + 5 € + 1 € + 1 €"]
            answer: "50 € + 5 € + 2 €"
          - id: l2-c12
            part: ways
            type: multiple_choice
            text: "Welche Scheine ergeben auch 20 €?"
            say: "Zwanzig Euro sind ein Zwanziger. Welche Scheine ergeben auch zwanzig Euro?"
            options: ["10 € + 5 € + 5 €", "10 € + 5 €", "5 € + 5 € + 5 €"]
            answer: "10 € + 5 € + 5 €"
          - id: l2-c13
            part: ways
            type: text_input
            text: "Wie viele 2-€-Münzen sind 10 €?"
            say: "Wie viele Zwei-Euro-Münzen sind zehn Euro?"
            answer: "5"
          - id: l2-c14
            part: ways
            type: true_false
            text: "Stimmt das? 50 € + 20 € + 5 € ist dasselbe wie 20 € + 20 € + 20 € + 10 € + 5 €."
            say: "Ein Fünfziger, ein Zwanziger und ein Fünfer sind dasselbe wie drei Zwanziger, ein Zehner und ein Fünfer. Stimmt das?"
            answer: true
          - id: l2-c15
            part: ways
            type: multiple_choice
            text: "Wie legst du 90 € mit den wenigsten Scheinen?"
            say: "Wie legst du neunzig Euro mit den wenigsten Scheinen?"
            options: ["50 € + 20 € + 20 €", "50 € + 20 € + 10 € + 10 €", "20 € + 20 € + 20 € + 20 € + 10 €"]
            answer: "50 € + 20 € + 20 €"
          - id: l2-c16
            part: compare
            type: multiple_choice
            text: "Was ist weniger: 64 € oder 46 €?"
            say: "Was ist weniger: vierundsechzig Euro oder sechsundvierzig Euro?"
            options: ["64 €", "46 €"]
            answer: "46 €"
          - id: l2-c17
            part: compare
            type: multiple_choice
            text: "Jana hat 50 € + 2 €. Kai hat 20 € + 20 € + 10 € + 1 € + 1 €. Wer hat mehr Geld?"
            say: "Jana hat einen Fünfziger und eine Zwei-Euro-Münze. Kai hat zwei Zwanziger, einen Zehner und zwei Ein-Euro-Münzen. Wer hat mehr Geld?"
            options: ["beide gleich viel", "Jana", "Kai"]
            answer: "beide gleich viel"
          - id: l2-c18
            part: compare
            type: true_false
            text: "Stimmt das? 20 € + 10 € + 5 € ist mehr als 20 € + 20 €."
            say: "Ein Zwanziger, ein Zehner und ein Fünfer sind mehr als zwei Zwanziger. Stimmt das?"
            answer: false
          - id: l2-c19
            part: compare
            type: multiple_choice
            text: "Welcher Betrag ist am größten?"
            say: "Welcher Betrag ist am größten?"
            options: ["50 € + 10 €", "20 € + 20 € + 20 € + 5 €", "50 € + 5 € + 2 €"]
            answer: "20 € + 20 € + 20 € + 5 €"
          - id: l2-c20
            part: compare
            type: fill_in_blank
