      - activity: learn
        mode: demonstration
        screens:
          - text: "■ □ │ □ ■\n■ ■ │ ■ ■\n□ ■ │ ■ □"
            say: "Diese Figur hat drei Reihen. Du spiegelst jede Reihe für sich an der Achse: oben, in der Mitte und unten. Jetzt ist die ganze Figur symmetrisch."
          - text: "■ ■ □\n□ ■ □\n─────\n□ ■ □\n■ ■ □"
            say: "Die Achse kann auch waagerecht liegen. Dann spiegelst du nach unten. Die Reihe direkt über der Achse kommt direkt unter die Achse. Die oberste Reihe kommt ganz nach unten."
          - text: "■ □ │ □ ■\n■ ■ │ ■ □"
            say: "Prüf jede Reihe. Oben stimmt es. Unten fehlt rechts ganz außen ein ausgemaltes Kästchen. Diese Figur ist noch nicht symmetrisch."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Ergänze die untere Reihe.\n□ ■ ■ │ ■ ■ □\n■ ■ □ │ ? ? ?"
                say: "Die obere Reihe ist schon fertig. Ergänze die untere Reihe."
                frame: "■ ■ □ │ _ _ _"
                options: ["■", "□"]
                answer: ["□", "■", "■"]
                option_audio: false
                hints:
                  - "Spiegle nur die untere Reihe. Fang an der Achse an."
                  - "Links neben der Achse ist leer, dann zwei ausgemalte."
                  - "□ ■ ■."
              - id: l2-f2
                type: multiple_choice
                text: "In welcher Reihe ist ein Fehler?\n■ □ │ □ ■\n□ ■ │ □ ■\n■ ■ │ ■ ■"
                say: "In welcher Reihe ist die Figur nicht richtig gespiegelt?"
                options: ["oben", "in der Mitte", "unten"]
                answer: "in der Mitte"
                keep_order: true
                hints:
                  - "Prüf jede Reihe für sich."
                  - "In der Mitte ist links neben der Achse ausgemalt. Und rechts daneben?"
                  - "In der Mitte."
              - id: l2-f3
                type: true_false
                text: "Ist die Figur symmetrisch?\n□ ■ │ ■ □\n■ ■ │ ■ ■"
                say: "Ist diese Figur symmetrisch zur Achse?"
                answer: true
                hints:
                  - "Prüf zuerst die obere, dann die untere Reihe."
                  - "Oben: leer, ausgemalt │ ausgemalt, leer. Unten ist alles ausgemalt."
                  - "Ja, die Figur ist symmetrisch."
                difficulty: easy
              - id: l2-f4
                type: multiple_choice
                text: "Welche Reihe kommt direkt unter die Achse?\n■ □ □\n□ ■ ■\n─────"
                say: "Die Achse liegt waagerecht. Welche Reihe kommt direkt unter die Achse?"
                options: ["□ ■ ■", "■ □ □", "■ ■ □"]
                answer: "□ ■ ■"
                option_audio: false
                feedback:
                  "■ □ □": "Das ist die oberste Reihe. Sie kommt ganz nach unten. Direkt unter die Achse kommt die Reihe direkt über der Achse."
                  "■ ■ □": "Bei einer waagerechten Achse bleibt links links. Die Reihe dreht sich nicht um."
                hints:
                  - "Was direkt über der Achse ist, kommt direkt unter die Achse."
                  - "Bei einer waagerechten Achse bleibt links links und rechts rechts."
                  - "□ ■ ■."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze die linke Seite.\n? ? ? │ □ ■ ■"
                say: "Diesmal ist die rechte Seite fertig. Ergänze die linke Seite."
                frame: "_ _ _ │ □ ■ ■"
                options: ["■", "□"]
