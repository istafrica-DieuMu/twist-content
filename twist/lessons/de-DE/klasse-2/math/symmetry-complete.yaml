# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.symmetry-complete
skill: math.symmetry.complete
curriculum: de-DE
language: de
title:
  de: Figuren symmetrisch ergänzen
  en: Completing symmetrical figures
summary: >
  Lesson 1 mirrors one row of Kästchen at a senkrechte Spiegelachse,
  starting next to the axis, and tells mirroring from copying (■ □ □ │
  □ □ ■, not ■ □ □ │ ■ □ □); lesson 2 completes and checks figures of
  two and three rows, mirrors to the left and across a waagerechte
  Achse, finds the row with a mistake, and ends with the skill check.
  The figures are rows of Kästchen in the task text, so the child fills
  each mirrored Kästchen from a chip. Colouring Kästchen on squared paper
  and drawing the mirror half of a picture wait for a drawing task.
metadata:
  year: klasse-2
  topic: { de: Symmetrie, en: Symmetry }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.symmetry.identify, math.shapes.draw-freehand-ruler]
  also_practises: [math.symmetry.identify]
  vocabulary: { de: [Spiegelachse, spiegeln, symmetrisch, ergänzen, Kästchen, senkrecht, waagerecht] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: row, what: { de: eine Reihe an einer senkrechten Achse spiegeln, en: reflecting a row in a vertical line } }
    - { id: check, what: { de: "prüfen, ob eine Figur symmetrisch ist, und den Fehler finden", en: "checking whether a figure is symmetrical and finding the mistake" } }
    - { id: figure, what: { de: "Figuren mit mehreren Reihen ergänzen, auch an einer waagerechten Achse", en: "completing figures of several rows, also in a horizontal line" } }
  misconceptions:
    - id: copies-not-mirrors
      what: Copies the half again instead of mirroring it (■ □ □ │ ■ □ □)
      addressed: lesson 1 Learn sets a copied row beside a mirrored one; l1-f2 (with feedback), l1-s2, l1-n2 and l1-c2 offer the copied half; l1-f5, l1-s5, l1-n5 and l2-s3 ask whether a copied row is symmetrisch
    - id: horizontal-axis-flips-sideways
      what: At a waagerechte Achse, turns the row round left to right or puts the top row next to the axis
      addressed: lesson 2 Learn mirrors downwards row by row; l2-f4 (with feedback), l2-s4, l2-n4 and l2-c4 offer the top row and the row turned round
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Eine Reihe spiegeln", en: "Mirroring a row" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Ist der Buchstabe symmetrisch?"
            say: "Stell dir vor, du faltest den Buchstaben in der Mitte. Ist er symmetrisch?"
            show: { drawn: letter-card, text: "A" }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie liegt die Symmetrieachse beim T?"
            say: "Wie liegt die Symmetrieachse beim Buchstaben T?"
            show: { drawn: letter-card, text: "T" }
            options: ["senkrecht", "waagerecht"]
            answer: "senkrecht"
            keep_order: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "■ □ □ │ □ □ ■"
            say: "Der Strich in der Mitte ist die Spiegelachse. Was links ist, siehst du rechts wie im Spiegel. Links ist das Kästchen ganz außen ausgemalt. Darum ist rechts auch das Kästchen ganz außen ausgemalt."
          - text: "■ ■ □ │ ? ? ?\n■ ■ □ │ □ ■ ■"
            say: "So ergänzt du: Fang direkt an der Achse an. Links neben der Achse ist leer, also ist rechts neben der Achse auch leer. Dann kommen zwei ausgemalte Kästchen."
          - text: "falsch: ■ □ □ │ ■ □ □\nrichtig: ■ □ □ │ □ □ ■"
            say: "Spiegeln heißt nicht abschreiben. Schreibst du die linke Seite einfach noch einmal hin, ist sie nicht gespiegelt. Im Spiegel steht alles umgekehrt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Spiegle an der Achse."
                say: "Spiegle die Kästchen an der Achse. Fang direkt an der Achse an."
                frame: "■ □ │ _ _"
                options: ["■", "□"]
                answer: ["□", "■"]
                option_audio: false
                hints:
                  - "Fang direkt an der Achse an."
                  - "Neben der Achse ist links leer. Ganz außen ist ausgemalt."
                  - "□ ■."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche rechte Seite passt?\n■ ■ □ □ │ ? ? ? ?"
                say: "Welche rechte Seite macht die Reihe symmetrisch?"
                options: ["□ □ ■ ■", "■ ■ □ □", "□ ■ ■ □"]
                answer: "□ □ ■ ■"
                option_audio: false
                feedback:
                  "■ ■ □ □": "Das ist abgeschrieben, nicht gespiegelt. Im Spiegel steht alles umgekehrt."
                hints:
                  - "Fang an der Achse an und geh nach außen."
                  - "Neben der Achse sind links zwei leere Kästchen, außen zwei ausgemalte."
                  - "□ □ ■ ■."
              - id: l1-f3
                type: true_false
                text: "Ist die Reihe symmetrisch?\n□ ■ □ │ □ ■ □"
                say: "Ist diese Reihe symmetrisch zur Achse?"
                answer: true
                hints:
                  - "Vergleiche die Kästchen direkt neben der Achse, dann die nächsten."
                  - "Neben der Achse: leer und leer. Dann: ausgemalt und ausgemalt."
                  - "Ja, sie ist symmetrisch."
              - id: l1-f4
                type: fill_in_blank
                text: "Spiegle an der Achse."
                say: "Spiegle die Kästchen an der Achse."
                frame: "□ ■ ■ │ _ _ _"
                options: ["■", "□"]
                answer: ["■", "■", "□"]
                option_audio: false
                hints:
                  - "Fang direkt an der Achse an."
                  - "Neben der Achse ist links ausgemalt, dann wieder ausgemalt, dann leer."
                  - "■ ■ □."
              - id: l1-f5
                type: true_false
                text: "Ist die Reihe symmetrisch?\n■ □ □ │ ■ □ □"
                say: "Ist diese Reihe symmetrisch zur Achse?"
                answer: false
                hints:
                  - "Vergleiche die Kästchen direkt neben der Achse."
                  - "Links neben der Achse ist leer, rechts daneben ist ausgemalt."
                  - "Nein, die linke Seite ist nur abgeschrieben."

