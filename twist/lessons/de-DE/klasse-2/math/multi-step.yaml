# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.multi-step
skill: math.word-problems.multi-step
curriculum: de-DE
language: de
title:
  de: Sachaufgaben mit zwei Schritten
  en: Two-step word problems
summary: >
  Lesson 1 solves stories with two plus or minus steps and says what each
  step means (Erst steigen 12 ein, dann 8 aus); lesson 2 mixes a mal or
  geteilt step with a plus or minus step (3 Packungen mit je 6 Eiern, 4
  gehen kaputt), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.word-problems.sketches, math.mult-div.div-inverse]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit, math.mult-div.core-facts]
  vocabulary: { de: [Schritt, zuerst, dann, zum Schluss, Zwischenergebnis] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: first-step, what: { de: den ersten Rechenschritt finden, en: finding the first step } }
    - { id: add-sub, what: { de: Sachaufgaben mit zwei Plus- und Minusschritten lösen, en: solving two-step problems with adding and subtracting } }
    - { id: mult-step, what: { de: Sachaufgaben mit einem Mal- oder Geteiltschritt lösen, en: solving two-step problems with a multiplication or division step } }
    - { id: meaning, what: { de: "sagen, was ein Zwischenergebnis in der Sache bedeutet", en: saying what a step result means in the story } }
  misconceptions:
    - id: stops-after-step-one
      what: Gives the result of the first step as the answer
      addressed: lesson 1 Learn names the Zwischenergebnis and goes on; every stage has a two-step story that offers the first-step result, with feedback in l1-f2 and l2-f2
    - id: step-not-linked
      what: Calculates the steps but cannot say what each number means in the story
      addressed: l1-f3, l1-s3 and l1-n3 ask what a step result means in the story; lesson 2 Learn names each step
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zwei Schritte mit Plus und Minus", en: "Two steps with plus and minus" }
    goal:
      de: "Löse Rechengeschichten in zwei Schritten, so wie erst steigen 12 in den Bus ein und dann 8 aus."
      en: "Solve stories in two steps, like first 12 people get on the bus and then 8 get off."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "30 + 12 = _"
            say: "Dreißig plus zwölf."
            answer: "42"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "42 − 8 = _"
            say: "Zweiundvierzig minus acht."
            answer: "34"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "30 Leute im Bus. 12 steigen ein, 8 steigen aus. Mehr oder weniger?"
            say: "Im Bus sitzen dreißig Leute. An der Haltestelle steigen zwölf ein und acht aus. Was glaubst du: Sitzen danach mehr oder weniger Leute im Bus als vorher?"
            show: { object: bus }
          - text: "Im Bus sitzen 30 Leute. An der Haltestelle steigen 12 ein und 8 aus. Wie viele sitzen jetzt im Bus?"
            say: "Mehr, denn es steigen mehr ein als aus. Aber wie viele genau? Hier passieren zwei Dinge. Du rechnest in zwei Schritten."
          - text: "1. 30 + 12 = 42 (nach dem Einsteigen)"
            say: "Erster Schritt: Zwölf steigen ein. Dreißig plus zwölf sind zweiundvierzig. So viele sitzen nach dem Einsteigen im Bus. Das ist ein Zwischenergebnis, noch nicht die Antwort."
          - text: "2. 42 − 8 = 34\nAntwort: Jetzt sitzen 34 Leute im Bus."
            say: "Zweiter Schritt: Acht steigen aus. Zweiundvierzig minus acht sind vierunddreißig. Antwort: Jetzt sitzen vierunddreißig Leute im Bus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Lea hat 25 Sticker. Sie bekommt 10 geschenkt und klebt 6 ins Heft. Was rechnest du zuerst?"
                say: "Lea hat fünfundzwanzig Sticker. Sie bekommt zehn geschenkt und klebt dann sechs ins Heft. Was rechnest du zuerst?"
                options: ["25 + 10", "25 − 6", "10 − 6"]
                answer: "25 + 10"
                hints:
                  - "Was passiert zuerst in der Geschichte?"
                  - "Zuerst bekommt sie Sticker geschenkt."
                  - "25 + 10."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Lea hat 25 Sticker. Sie bekommt 10 geschenkt und klebt 6 ins Heft. Wie viele hat sie noch?"
                say: "Lea hat fünfundzwanzig Sticker. Sie bekommt zehn geschenkt und klebt sechs ins Heft. Wie viele Sticker hat sie noch?"
                options: ["29", "35", "41"]
                answer: "29"
                feedback:
                  "35": "Das ist das Zwischenergebnis nach dem Schenken. Sie klebt aber noch 6 ins Heft."
                  "41": "Die 6 Sticker klebt sie weg. Es werden weniger."
                hints:
                  - "Erster Schritt: 25 + 10 = 35."
                  - "Zweiter Schritt: 35 − 6."
                  - "29."
              - id: l1-f3
                type: multiple_choice
                text: "Im Bus sitzen 40 Kinder. 15 steigen aus, dann 7 ein. 1. Schritt: 40 − 15 = 25. Was bedeutet die 25?"
                say: "Im Bus sitzen vierzig Kinder. Fünfzehn steigen aus, dann steigen sieben ein. Der erste Schritt ist vierzig minus fünfzehn gleich fünfundzwanzig. Was bedeutet die fünfundzwanzig?"
                options: ["So viele Kinder sind nach dem Aussteigen im Bus.", "So viele Kinder sind am Ende im Bus.", "So viele Kinder steigen aus."]
                answer: "So viele Kinder sind nach dem Aussteigen im Bus."
                hints:
                  - "Es ist das Ergebnis nach dem ersten Schritt."
                  - "Danach steigen noch Kinder ein."
                  - "So viele Kinder sind nach dem Aussteigen im Bus."
              - id: l1-f4
                type: text_input
                text: "Im Bus sitzen 40 Kinder. 15 steigen aus, dann 7 ein. Wie viele sitzen jetzt im Bus?"
                say: "Im Bus sitzen vierzig Kinder. Fünfzehn steigen aus, dann steigen sieben ein. Wie viele Kinder sitzen jetzt im Bus?"
                answer: "32"
                hints:
                  - "Erst 40 − 15 = 25."
                  - "Dann 25 + 7."
                  - "32."
              - id: l1-f5
                type: true_false
                text: "Ben hat 50 Cent. Er kauft einen Lolli für 20 Cent und Kaugummi für 10 Cent. Er hat noch 20 Cent. Stimmt das?"
                say: "Ben hat fünfzig Cent. Er kauft einen Lolli für zwanzig Cent und Kaugummi für zehn Cent. Er hat noch zwanzig Cent. Stimmt das?"
                answer: true
                hints:
                  - "Zieh beide Preise ab."
                  - "50 − 20 = 30, dann 30 − 10."
                  - "Ja, 20 Cent."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Auf dem Baum sitzen 18 Vögel. 9 kommen dazu, dann fliegen 5 weg. Was rechnest du zuerst?"
                say: "Auf dem Baum sitzen achtzehn Vögel. Neun kommen dazu, dann fliegen fünf weg. Was rechnest du zuerst?"
                options: ["18 + 9", "18 − 5", "9 − 5"]
                answer: "18 + 9"
                hints: ["Was passiert zuerst?"]
              - id: l1-s2
                type: multiple_choice
                text: "Auf dem Baum sitzen 18 Vögel. 9 kommen dazu, dann fliegen 5 weg. Wie viele sitzen jetzt dort?"
                say: "Auf dem Baum sitzen achtzehn Vögel. Neun kommen dazu, dann fliegen fünf weg. Wie viele Vögel sitzen jetzt auf dem Baum?"
                show: { object: bird, count: 18 }
                options: ["22", "27", "32"]
                answer: "22"
                hints: ["Das Zwischenergebnis ist 27. Jetzt fliegen noch 5 weg."]
              - id: l1-s3
                type: multiple_choice
                text: "Tim hat 60 Euro. Er kauft Schuhe für 35 Euro und Socken für 5 Euro. 1. Schritt: 60 − 35 = 25. Was bedeutet die 25?"
                say: "Tim hat sechzig Euro. Er kauft Schuhe für fünfunddreißig Euro und Socken für fünf Euro. Der erste Schritt ist sechzig minus fünfunddreißig gleich fünfundzwanzig. Was bedeutet die fünfundzwanzig?"
                options: ["So viel Geld hat Tim nach den Schuhen.", "So viel Geld hat Tim am Ende.", "So viel kosten die Schuhe."]
                answer: "So viel Geld hat Tim nach den Schuhen."
                hints: ["Die Socken kommen erst danach."]
              - id: l1-s4
                type: text_input
                text: "Tim hat 60 Euro. Er kauft Schuhe für 35 Euro und Socken für 5 Euro. Wie viel Geld hat er noch?"
                say: "Tim hat sechzig Euro. Er kauft Schuhe für fünfunddreißig Euro und Socken für fünf Euro. Wie viel Geld hat er noch?"
                answer: "20"
                hints: ["Nach den Schuhen hat er noch 25 Euro."]
              - id: l1-s5
                type: true_false
                text: "Im Regal stehen 34 Bücher. Mia stellt 6 dazu und nimmt 10 heraus. Jetzt stehen 40 Bücher im Regal. Stimmt das?"
                say: "Im Regal stehen vierunddreißig Bücher. Mia stellt sechs dazu und nimmt dann zehn heraus. Jetzt stehen vierzig Bücher im Regal. Stimmt das?"
                answer: false
                hints: ["Vierzig ist erst das Zwischenergebnis."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Im Zug sitzen 55 Leute. 20 steigen aus, dann 13 ein. Was rechnest du zuerst?"
                say: "Im Zug sitzen fünfundfünfzig Leute. Zwanzig steigen aus, dann dreizehn ein. Was rechnest du zuerst?"
                options: ["55 − 20", "55 + 13", "20 + 13"]
                answer: "55 − 20"
              - id: l1-n2
                type: multiple_choice
                text: "Im Zug sitzen 55 Leute. 20 steigen aus, dann 13 ein. Wie viele sitzen jetzt im Zug?"
                say: "Im Zug sitzen fünfundfünfzig Leute. Zwanzig steigen aus, dann steigen dreizehn ein. Wie viele Leute sitzen jetzt im Zug?"
                options: ["48", "35", "88"]
                answer: "48"
                feedback:
                  "88": "Achtundachtzig? Dann wären es mehr Leute, obwohl zwanzig ausgestiegen sind! Aussteigen heißt minus."
              - id: l1-n3
                type: multiple_choice
                text: "Oma backt 36 Kekse. Die Kinder essen 12, dann backt sie 20 dazu. 1. Schritt: 36 − 12 = 24. Was bedeutet die 24?"
                say: "Oma backt sechsunddreißig Kekse. Die Kinder essen zwölf, dann backt Oma zwanzig dazu. Der erste Schritt ist sechsunddreißig minus zwölf gleich vierundzwanzig. Was bedeutet die vierundzwanzig?"
                options: ["So viele Kekse sind nach dem Essen übrig.", "So viele Kekse sind am Ende da.", "So viele Kekse essen die Kinder."]
                answer: "So viele Kekse sind nach dem Essen übrig."
              - id: l1-n4
                type: text_input
                text: "Oma backt 36 Kekse. Die Kinder essen 12, dann backt sie 20 dazu. Wie viele Kekse sind jetzt da?"
                say: "Oma backt sechsunddreißig Kekse. Die Kinder essen zwölf, dann backt Oma zwanzig dazu. Wie viele Kekse sind jetzt da?"
                answer: "44"
              - id: l1-n5
                type: true_false
                text: "Lisa hat 80 Cent. Sie kauft ein Brötchen für 45 Cent und bekommt von Oma 20 Cent. Sie hat jetzt 55 Cent. Stimmt das?"
                say: "Lisa hat achtzig Cent. Sie kauft ein Brötchen für fünfundvierzig Cent und bekommt dann von Oma zwanzig Cent. Sie hat jetzt fünfundfünfzig Cent. Stimmt das?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Im Schwimmbad sind 44 Kinder. 16 gehen nach Hause, dann kommen 10 neue. Wie viele Kinder sind jetzt da?"
            say: "Im Schwimmbad sind vierundvierzig Kinder. Sechzehn gehen nach Hause, dann kommen zehn neue. Wie viele Kinder sind jetzt da?"
            options: ["38", "28", "18"]
            answer: "38"
          - id: l1-c2
            type: text_input
            text: "Paul hat 70 Euro. Er kauft ein Spiel für 40 Euro und ein Buch für 12 Euro. Wie viel hat er noch?"
            say: "Paul hat siebzig Euro. Er kauft ein Spiel für vierzig Euro und ein Buch für zwölf Euro. Wie viel Geld hat er noch?"
            answer: "18"
          - id: l1-c3
            type: true_false
            text: "Im Korb sind 20 Äpfel. Mama legt 15 dazu, dann essen alle zusammen 5. Jetzt sind 35 Äpfel im Korb. Stimmt das?"
            say: "Im Korb sind zwanzig Äpfel. Mama legt fünfzehn dazu, dann essen alle zusammen fünf. Jetzt sind fünfunddreißig Äpfel im Korb. Stimmt das?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Im Hof spielen 32 Kinder. 12 gehen ins Haus, dann kommen 5 heraus. Was rechnest du zuerst?"
            say: "Im Hof spielen zweiunddreißig Kinder. Zwölf gehen ins Haus, dann kommen fünf heraus. Was rechnest du zuerst?"
            options: ["32 − 12", "12 + 5", "32 + 12"]
            answer: "32 − 12"
          - id: l1-c5
            type: text_input
            text: "Tom hat 45 Sticker. Er bekommt 20 dazu und schenkt Lea 8. Wie viele hat er jetzt?"
            say: "Tom hat fünfundvierzig Sticker. Er bekommt zwanzig dazu und schenkt Lea dann acht. Wie viele Sticker hat er jetzt?"
            answer: "57"
          - id: l1-c6
            type: multiple_choice
            text: "Im Glas sind 30 Bonbons. Mia isst 6, dann füllt Mama 10 nach. 1. Schritt: 30 − 6 = 24. Was bedeutet die 24?"
            say: "Im Glas sind dreißig Bonbons. Mia isst sechs, dann füllt Mama zehn nach. Der erste Schritt ist dreißig minus sechs gleich vierundzwanzig. Was bedeutet die vierundzwanzig?"
            options: ["So viele Bonbons sind nach dem Essen im Glas.", "So viele Bonbons sind am Ende im Glas.", "So viele Bonbons isst Mia."]
            answer: "So viele Bonbons sind nach dem Essen im Glas."

  - n: 2
    title: { de: "Mal, geteilt und noch ein Schritt", en: "Times, divide and one more step" }
    goal:
      de: "Rechne erst mal oder geteilt und dann plus oder minus, so wie bei 3 Packungen Eier, von denen 4 kaputtgehen."
      en: "Do the times or divide step first and then plus or minus, like 3 boxes of eggs where 4 break."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "3 · 6 = _"
            say: "Drei mal sechs."
            answer: "18"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "Im Bus sitzen 20 Leute. 6 steigen ein, dann 4 aus. Wie viele sitzen jetzt im Bus?"
            say: "Im Bus sitzen zwanzig Leute. Sechs steigen ein, dann vier aus. Wie viele sitzen jetzt im Bus?"
            show: { object: bus }
            answer: "22"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "3 Packungen mit je 6 Eiern. 4 gehen kaputt. Mehr als 10 heil?"
            say: "Mia kauft drei Packungen mit je sechs Eiern. Auf dem Heimweg gehen vier Eier kaputt. Was glaubst du: Sind noch mehr als zehn Eier heil?"
            show: { object: egg, count: 18 }
          - text: "Mia kauft 3 Packungen mit je 6 Eiern. 4 Eier gehen kaputt. Wie viele Eier sind noch heil?"
            say: "Mia kauft drei Packungen mit je sechs Eiern. Vier Eier gehen kaputt. Wie viele Eier sind noch heil? Auch hier rechnest du in zwei Schritten."
          - text: "1. 3 · 6 = 18 (alle Eier)"
            say: "Erster Schritt: Wie viele Eier sind es zusammen? Drei Packungen mit je sechs: drei mal sechs sind achtzehn."
          - text: "2. 18 − 4 = 14\nAntwort: 14 Eier sind noch heil."
            say: "Zweiter Schritt: Vier gehen kaputt. Achtzehn minus vier sind vierzehn. Antwort: Vierzehn Eier sind noch heil. Das sind mehr als zehn."
          - text: "Wusstest du? Ein Huhn legt fast nie mehr als 1 Ei am Tag. Für eine Packung mit 6 Eiern braucht es fast eine Woche."
            say: "Wusstest du? Ein Huhn legt fast nie mehr als ein Ei am Tag. Für eine Packung mit sechs Eiern braucht ein Huhn also fast eine ganze Woche. Für Mias drei Packungen bräuchte es fast drei Wochen!"
            show: { object: hen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tim hat 4 Tüten mit je 5 Murmeln. Er schenkt Lea 3 Murmeln. Was rechnest du zuerst?"
                say: "Tim hat vier Tüten mit je fünf Murmeln. Er schenkt Lea drei Murmeln. Was rechnest du zuerst?"
                options: ["4 · 5", "5 − 3", "4 + 5"]
                answer: "4 · 5"
                hints:
                  - "Zuerst musst du wissen, wie viele Murmeln Tim hat."
                  - "Vier Tüten mit je fünf: Das ist mal."
                  - "4 · 5."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tim hat 4 Tüten mit je 5 Murmeln. Er schenkt Lea 3 Murmeln. Wie viele hat er noch?"
                say: "Tim hat vier Tüten mit je fünf Murmeln. Er schenkt Lea drei Murmeln. Wie viele Murmeln hat er noch?"
                options: ["17", "20", "23"]
                answer: "17"
                feedback:
                  "20": "So viele Murmeln hat Tim am Anfang. Er schenkt aber noch 3 weg."
                hints:
                  - "Erster Schritt: 4 · 5 = 20."
                  - "Zweiter Schritt: 20 − 3."
                  - "17."
              - id: l2-f3
                type: multiple_choice
                text: "20 Kekse werden gerecht an 4 Kinder verteilt. Jedes Kind isst 2. 1. Schritt: 20 : 4 = 5. Was bedeutet die 5?"
                say: "Zwanzig Kekse werden gerecht an vier Kinder verteilt. Dann isst jedes Kind zwei Kekse. Der erste Schritt ist zwanzig geteilt durch vier gleich fünf. Was bedeutet die fünf?"
                options: ["So viele Kekse bekommt jedes Kind.", "So viele Kekse hat jedes Kind am Ende.", "So viele Kinder sind es."]
                answer: "So viele Kekse bekommt jedes Kind."
                hints:
                  - "Es ist das Ergebnis vom Verteilen."
                  - "Gegessen wird erst danach."
                  - "So viele Kekse bekommt jedes Kind."
              - id: l2-f4
                type: text_input
                text: "20 Kekse werden gerecht an 4 Kinder verteilt. Jedes Kind isst 2. Wie viele hat jedes Kind noch?"
                say: "Zwanzig Kekse werden gerecht an vier Kinder verteilt. Dann isst jedes Kind zwei Kekse. Wie viele Kekse hat jedes Kind noch?"
                answer: "3"
                hints:
                  - "Jedes Kind bekommt 5 Kekse."
                  - "Dann 5 − 2."
                  - "3."
              - id: l2-f5
                type: true_false
                text: "Ein Heft kostet 2 Euro. Ben kauft 5 Hefte und bezahlt mit 20 Euro. Er bekommt 10 Euro zurück. Stimmt das?"
                say: "Ein Heft kostet zwei Euro. Ben kauft fünf Hefte und bezahlt mit zwanzig Euro. Er bekommt zehn Euro zurück. Stimmt das?"
                answer: true
                hints:
                  - "Was kosten 5 Hefte?"
                  - "5 · 2 = 10, dann 20 − 10."
                  - "Ja, 10 Euro."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Im Kino gibt es 6 Reihen mit je 10 Plätzen. 8 Plätze sind noch frei. Wie viele Plätze sind besetzt? Was rechnest du zuerst?"
                say: "Im Kino gibt es sechs Reihen mit je zehn Plätzen. Acht Plätze sind noch frei. Wie viele Plätze sind besetzt? Was rechnest du zuerst?"
                options: ["6 · 10", "10 − 8", "6 + 10"]
                answer: "6 · 10"
                hints: ["Zuerst: Wie viele Plätze gibt es?"]
              - id: l2-s2
                type: multiple_choice
                text: "Im Kino gibt es 6 Reihen mit je 10 Plätzen. 8 Plätze sind frei. Wie viele sind besetzt?"
                say: "Im Kino gibt es sechs Reihen mit je zehn Plätzen. Acht Plätze sind noch frei. Wie viele Plätze sind besetzt?"
                options: ["52", "60", "68"]
                answer: "52"
                hints: ["Es gibt 60 Plätze. Davon sind 8 frei."]
              - id: l2-s3
                type: multiple_choice
                text: "Oma hat 18 Bonbons. Sie verteilt sie gerecht an 3 Enkel. Jeder bekommt dann noch 2 dazu. 1. Schritt: 18 : 3 = 6. Was bedeutet die 6?"
                say: "Oma hat achtzehn Bonbons. Sie verteilt sie gerecht an drei Enkel. Dann bekommt jeder noch zwei dazu. Der erste Schritt ist achtzehn geteilt durch drei gleich sechs. Was bedeutet die sechs?"
                options: ["So viele Bonbons bekommt jeder Enkel beim Verteilen.", "So viele Bonbons hat jeder Enkel am Ende.", "So viele Enkel hat Oma."]
                answer: "So viele Bonbons bekommt jeder Enkel beim Verteilen."
                hints: ["Die 2 dazu kommen erst danach."]
              - id: l2-s4
                type: text_input
                text: "Oma verteilt 18 Bonbons gerecht an 3 Enkel. Jeder bekommt dann noch 2 dazu. Wie viele hat jeder?"
                say: "Oma verteilt achtzehn Bonbons gerecht an drei Enkel. Dann bekommt jeder noch zwei dazu. Wie viele Bonbons hat jeder Enkel?"
                answer: "8"
                hints: ["Beim Verteilen bekommt jeder 6."]
              - id: l2-s5
                type: true_false
                text: "Ein Eis kostet 2 Euro. Lisa hat 10 Euro und kauft 3 Eis. Sie hat dann noch 6 Euro. Stimmt das?"
                say: "Ein Eis kostet zwei Euro. Lisa hat zehn Euro und kauft drei Eis. Sie hat dann noch sechs Euro. Stimmt das?"
                answer: false
                hints: ["Drei Eis kosten 6 Euro. Was bleibt von 10 Euro?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "5 Kinder haben je 4 Sticker. Zusammen kaufen sie 10 dazu. Wie viele Sticker haben sie jetzt? Was rechnest du zuerst?"
                say: "Fünf Kinder haben je vier Sticker. Zusammen kaufen sie zehn dazu. Wie viele Sticker haben sie jetzt? Was rechnest du zuerst?"
                options: ["5 · 4", "4 + 10", "5 + 4"]
                answer: "5 · 4"
              - id: l2-n2
                type: multiple_choice
                text: "5 Kinder haben je 4 Sticker. Sie kaufen zusammen 10 dazu. Wie viele haben sie jetzt?"
                say: "Fünf Kinder haben je vier Sticker. Zusammen kaufen sie zehn dazu. Wie viele Sticker haben sie jetzt?"
                options: ["30", "20", "19"]
                answer: "30"
              - id: l2-n3
                type: multiple_choice
                text: "24 Äpfel werden gerecht in 4 Körbe gelegt. Aus jedem Korb wird 1 gegessen. 1. Schritt: 24 : 4 = 6. Was bedeutet die 6?"
                say: "Vierundzwanzig Äpfel werden gerecht in vier Körbe gelegt. Dann wird aus jedem Korb ein Apfel gegessen. Der erste Schritt ist vierundzwanzig geteilt durch vier gleich sechs. Was bedeutet die sechs?"
                options: ["So viele Äpfel liegen zuerst in jedem Korb.", "So viele Äpfel liegen am Ende in jedem Korb.", "So viele Körbe sind es."]
                answer: "So viele Äpfel liegen zuerst in jedem Korb."
              - id: l2-n4
                type: text_input
                text: "24 Äpfel werden gerecht in 4 Körbe gelegt. Aus jedem Korb wird 1 gegessen. Wie viele sind noch in jedem Korb?"
                say: "Vierundzwanzig Äpfel werden gerecht in vier Körbe gelegt. Dann wird aus jedem Korb ein Apfel gegessen. Wie viele Äpfel sind noch in jedem Korb?"
                answer: "5"
