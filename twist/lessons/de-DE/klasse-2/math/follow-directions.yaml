# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.follow-directions
skill: math.space.follow-directions
curriculum: de-DE
language: de
title:
  de: Wege auf dem Gitter
  en: Routes on a grid
summary: >
  Lesson 1 follows arrows on a 3 by 3 Gitter of lettered Felder (von G
  zweimal nach oben und einmal nach rechts: B) and picks the arrows for
  a route; lesson 2 works on a 4 by 4 Gitter, describes routes in words
  (2 nach rechts, 1 nach unten), finds the shortest route and the way
  back, and ends with the skill check. Following directions on a map and
  walking a route with a finger wait for a map and a drag task.
metadata:
  year: klasse-2
  topic: { de: Orientierung, en: Position and direction }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.space.position-words]
  also_practises: [math.space.position-words]
  vocabulary: { de: [Gitter, Feld, Pfeil, Weg, nach oben, nach unten, nach links, nach rechts, zurück, kürzester Weg] }
  forms: [text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: follow, what: { de: einem Weg mit Pfeilen oder Worten folgen, en: following a route given in arrows or words } }
    - { id: describe, what: { de: einen Weg mit Pfeilen oder Worten beschreiben, en: describing a route in arrows or words } }
    - { id: back, what: { de: denselben Weg zurückgehen, en: going the same route back } }
    - { id: shortest, what: { de: den kürzesten Weg finden, en: finding the shortest route } }
  misconceptions:
    - id: left-right-swap
      what: Goes right for a Pfeil nach links, or the other way round
      addressed: lesson 1 Learn names each arrow; l1-f2 (with feedback), l1-s2 and l1-c2 offer the field on the wrong side; l2-f3 (with feedback) offers links for rechts
    - id: way-back-same-arrows
      what: Uses the same arrows for the way back, or turns them round without reversing their order
      addressed: lesson 2 Learn walks a route backwards and turns each arrow; l2-f4 (with feedback), l2-s3, l2-n3 and l2-c4 offer the way there as the way back
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Pfeilen folgen", en: "Following arrows" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist ganz rechts?"
            say: "Welche Form ist ganz rechts?"
            show: { drawn: shape, row: [circle, square, triangle], colours: [red, blue, green] }
            options: ["das Dreieck", "der Kreis", "das Quadrat"]
            answer: "das Dreieck"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist oben?"
            say: "Welche Form ist oben?"
            show: { drawn: shape, column: [square, circle], colours: [yellow, purple] }
            options: ["das Quadrat", "der Kreis"]
            answer: "das Quadrat"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "↑ nach oben\n↓ nach unten\n← nach links\n→ nach rechts"
            say: "Pfeile zeigen dir den Weg. Dieser Pfeil zeigt nach oben, dieser nach unten, dieser nach links und dieser nach rechts."
          - text: "A B C\nD E F\nG H I\nStart: E · Weg: →"
            say: "Das ist ein Gitter mit neun Feldern. Du stehst auf E. Der Pfeil nach rechts heißt: ein Feld nach rechts. Jetzt stehst du auf F."
          - text: "A B C\nD E F\nG H I\nStart: G · Weg: ↑ ↑ →"
            say: "Jetzt gehst du von G los. Nach oben: D. Noch einmal nach oben: A. Dann nach rechts: B. Du kommst bei B an."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: E · Weg: ↑"
                say: "Du stehst auf E. Geh ein Feld nach oben. Wo kommst du an?"
                options: ["B", "H", "D"]
                answer: "B"
                hints:
                  - "Der Pfeil zeigt nach oben."
                  - "Welcher Buchstabe steht über dem E?"
                  - "B."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: E · Weg: ←"
                say: "Du stehst auf E. Geh ein Feld nach links. Wo kommst du an?"
                options: ["D", "F", "B"]
                answer: "D"
                feedback:
                  "F": "F liegt rechts von E. Der Pfeil zeigt nach links."
                hints:
                  - "Links ist die Seite, an der du beim Lesen anfängst."
                  - "Welcher Buchstabe steht links neben dem E?"
                  - "D."
              - id: l1-f3
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: A · Weg: → → ↓"
                say: "Du stehst auf A. Geh zwei Felder nach rechts und dann ein Feld nach unten. Wo kommst du an?"
                options: ["F", "C", "D"]
                answer: "F"
                hints:
                  - "Geh Pfeil für Pfeil, ein Feld nach dem anderen."
                  - "Von A nach rechts: B, C. Dann nach unten."
                  - "F."
              - id: l1-f4
                type: true_false
                text: "A B C\nD E F\nG H I\nStart: I · Weg: ↑ ←\nDu kommst bei E an."
                say: "Du stehst auf I. Ein Feld nach oben, dann ein Feld nach links. Stimmt das: Du kommst bei E an?"
                answer: true
                hints:
                  - "Geh zuerst nach oben."
                  - "Über I steht F. Links neben F steht ..."
                  - "Ja, du kommst bei E an."
              - id: l1-f5
                type: multiple_choice
                text: "Welcher Weg führt von G nach C?\nA B C\nD E F\nG H I"
                say: "Welcher Weg führt von G nach C?"
                options: ["↑ ↑ → →", "→ → ↓ ↓", "↑ → →"]
                answer: "↑ ↑ → →"
                option_audio: false
                hints:
                  - "C liegt oben rechts, G unten links."
                  - "Du musst zwei Felder nach oben und zwei nach rechts."
                  - "↑ ↑ → →."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: E · Weg: ↓"
                say: "Du stehst auf E. Geh ein Feld nach unten. Wo kommst du an?"
                options: ["H", "B", "F"]
                answer: "H"
                hints: ["Welcher Buchstabe steht unter dem E?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: B · Weg: ←"
                say: "Du stehst auf B. Geh ein Feld nach links. Wo kommst du an?"
                options: ["A", "C", "E"]
                answer: "A"
                hints: ["Links ist die Seite, an der du beim Lesen anfängst."]
              - id: l1-s3
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: C · Weg: ↓ ↓ ←"
                say: "Du stehst auf C. Geh zwei Felder nach unten und dann ein Feld nach links. Wo kommst du an?"
                options: ["H", "G", "E"]
                answer: "H"
                hints: ["Von C nach unten: F, I. Dann nach links."]
              - id: l1-s4
                type: true_false
                text: "A B C\nD E F\nG H I\nStart: H · Weg: ↑ ↑\nDu kommst bei E an."
                say: "Du stehst auf H. Zwei Felder nach oben. Stimmt das: Du kommst bei E an?"
                answer: false
                hints: ["Es sind zwei Pfeile. Geh beide Felder."]
              - id: l1-s5
                type: multiple_choice
                text: "Welcher Weg führt von A nach I?\nA B C\nD E F\nG H I"
                say: "Welcher Weg führt von A nach I?"
                options: ["→ → ↓ ↓", "← ← ↓ ↓", "→ ↓"]
                answer: "→ → ↓ ↓"
                option_audio: false
                hints: ["I liegt unten rechts. Wie viele Felder nach rechts, wie viele nach unten?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: E · Weg: →"
                say: "Du stehst auf E. Geh ein Feld nach rechts. Wo kommst du an?"
                options: ["F", "D", "B"]
                answer: "F"
              - id: l1-n2
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: F · Weg: ↑ ←"
                say: "Du stehst auf F. Ein Feld nach oben, dann ein Feld nach links. Wo kommst du an?"
                options: ["B", "A", "E"]
                answer: "B"
              - id: l1-n3
                type: multiple_choice
                text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: G · Weg: → ↑ →"
                say: "Du stehst auf G. Nach rechts, nach oben, nach rechts. Wo kommst du an?"
                options: ["F", "E", "I"]
                answer: "F"
              - id: l1-n4
                type: true_false
                text: "A B C\nD E F\nG H I\nStart: A · Weg: ↓ →\nDu kommst bei E an."
                say: "Du stehst auf A. Ein Feld nach unten, dann ein Feld nach rechts. Stimmt das: Du kommst bei E an?"
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Welcher Weg führt von I nach A?\nA B C\nD E F\nG H I"
                say: "Welcher Weg führt von I nach A?"
                options: ["← ← ↑ ↑", "→ → ↑ ↑", "↑ ↑ → →"]
                answer: "← ← ↑ ↑"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: B · Weg: ↓ ↓"
            say: "Du stehst auf B. Geh zwei Felder nach unten. Wo kommst du an?"
            options: ["H", "E", "C"]
            answer: "H"
          - id: l1-c2
            type: multiple_choice
            text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: E · Weg: ← ↑"
            say: "Du stehst auf E. Ein Feld nach links, dann ein Feld nach oben. Wo kommst du an?"
            options: ["A", "C", "G"]
            answer: "A"
          - id: l1-c3
            type: multiple_choice
            text: "Welcher Weg führt von C nach G?\nA B C\nD E F\nG H I"
            say: "Welcher Weg führt von C nach G?"
            options: ["← ← ↓ ↓", "→ → ↓ ↓", "↓ ↓"]
            answer: "← ← ↓ ↓"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: I · Weg: ← ← ↑"
            say: "Du stehst auf I. Zwei Felder nach links, dann ein Feld nach oben. Wo kommst du an?"
            options: ["D", "F", "A"]
            answer: "D"
          - id: l1-c5
            type: true_false
            text: "A B C\nD E F\nG H I\nStart: C · Weg: ← ↓\nDu kommst bei E an."
            say: "Du stehst auf C. Ein Feld nach links, dann ein Feld nach unten. Stimmt das: Du kommst bei E an?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Welcher Weg führt von H nach B?\nA B C\nD E F\nG H I"
            say: "Welcher Weg führt von H nach B?"
            options: ["↑ ↑", "↓ ↓", "↑ →"]
            answer: "↑ ↑"
            option_audio: false

  - n: 2
    title: { de: "Wege beschreiben", en: "Describing routes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo kommst du an?\nA B C\nD E F\nG H I\nStart: D · Weg: → ↑"
            say: "Du stehst auf D. Ein Feld nach rechts, dann ein Feld nach oben. Wo kommst du an?"
            options: ["B", "F", "H"]
            answer: "B"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Pfeil zeigt nach links?"
            say: "Welcher Pfeil zeigt nach links?"
            options: ["←", "→", "↑"]
            answer: "←"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "A B C D\nE F G H\nI J K L\nM N O P\nStart: F · 2 nach rechts, 1 nach unten"
            say: "Einen Weg kann man auch mit Worten beschreiben. Von F zwei Felder nach rechts: G, H. Dann ein Feld nach unten: L."
          - text: "Von F nach L: → → ↓"
            say: "Mit Pfeilen schreibst du denselben Weg so: rechts, rechts, unten."
          - text: "Zurück von L nach F: ↑ ← ←"
            say: "Und wie geht derselbe Weg zurück? Du gehst ihn rückwärts. Der letzte Pfeil kommt zuerst, und jeder Pfeil dreht sich um: zuerst nach oben, dann zweimal nach links."
          - text: "A B C D\nE F G H\nI J K L\nM N O P\nVon B nach G: → ↓ (2 Schritte)\nOder: ↓ ↓ → ↑ (4 Schritte)"
            say: "Oft führen mehrere Wege zum selben Feld. Jeder Pfeil ist ein Schritt. Von B nach G kommst du mit zwei Schritten: nach rechts, nach unten. Der andere Weg braucht vier Schritte. Der kürzeste Weg ist der mit den wenigsten Schritten."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wo kommst du an?\nA B C D\nE F G H\nI J K L\nM N O P\nStart: A · 3 nach rechts"
                say: "Du stehst auf A. Geh drei Felder nach rechts. Wo kommst du an?"
                options: ["D", "C", "M"]
                answer: "D"
                hints:
                  - "Zähl die Felder: eins, zwei, drei."
                  - "B, C, ..."
                  - "D."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wo kommst du an?\nA B C D\nE F G H\nI J K L\nM N O P\nStart: P · 2 nach oben, 1 nach links"
                say: "Du stehst auf P. Geh zwei Felder nach oben und dann ein Feld nach links. Wo kommst du an?"
                options: ["G", "H", "K"]
                answer: "G"
                hints:
                  - "Zuerst nach oben, dann nach links."
                  - "Von P nach oben: L, H. Dann eins nach links."
                  - "G."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Beschreibung passt zum Weg von E nach K?\nA B C D\nE F G H\nI J K L\nM N O P"
                say: "Welche Beschreibung passt zum Weg von E nach K?"
                options: ["2 nach rechts, 1 nach unten", "2 nach links, 1 nach unten", "1 nach rechts, 2 nach unten"]
                answer: "2 nach rechts, 1 nach unten"
                feedback:
                  "2 nach links, 1 nach unten": "Links von E gibt es kein Feld mehr. K liegt rechts von E."
                hints:
                  - "Liegt K links oder rechts von E? Höher oder tiefer?"
                  - "K liegt zwei Spalten weiter rechts und eine Zeile tiefer."
                  - "2 nach rechts, 1 nach unten."
              - id: l2-f4
                type: multiple_choice
                text: "Der Weg von L nach F ist: ← ← ↑\nWie gehst du denselben Weg zurück?"
                say: "Der Weg von L nach F ist: zweimal nach links, dann nach oben. Wie gehst du denselben Weg zurück nach L?"
                options: ["↓ → →", "← ← ↑", "↑ ← ←"]
                answer: "↓ → →"
                option_audio: false
                feedback:
                  "← ← ↑": "Das ist der Weg hin. Zurück gehst du rückwärts, und jeder Pfeil dreht sich um."
                hints:
                  - "Der letzte Pfeil kommt zuerst, und er dreht sich um."
                  - "Aus ↑ wird ↓, aus ← wird →."
                  - "↓ → →."
              - id: l2-f5
                type: true_false
                text: "A B C D\nE F G H\nI J K L\nM N O P\nStart: M · Weg: ↑ ↑ → →\nDu kommst bei G an."
                say: "Du stehst auf M. Zweimal nach oben, dann zweimal nach rechts. Stimmt das: Du kommst bei G an?"
                answer: true
                hints:
                  - "Geh Pfeil für Pfeil."
                  - "Von M nach oben: I, E. Dann nach rechts: F, ..."
                  - "Ja, du kommst bei G an."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wo kommst du an?\nA B C D\nE F G H\nI J K L\nM N O P\nStart: N · 2 nach oben"
                say: "Du stehst auf N. Geh zwei Felder nach oben. Wo kommst du an?"
                options: ["F", "B", "O"]
                answer: "F"
                hints: ["Von N nach oben: J, ..."]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Beschreibung passt zum Weg von B nach H?\nA B C D\nE F G H\nI J K L\nM N O P"
                say: "Welche Beschreibung passt zum Weg von B nach H?"
                options: ["2 nach rechts, 1 nach unten", "1 nach rechts, 2 nach unten", "2 nach rechts, 1 nach oben"]
                answer: "2 nach rechts, 1 nach unten"
                hints: ["H liegt eine Zeile tiefer als B. Wie viele Spalten weiter rechts?"]
              - id: l2-s3
                type: multiple_choice
                text: "Der Weg hin ist: → → ↓\nWie gehst du denselben Weg zurück?"
                say: "Der Weg hin ist: zweimal nach rechts, dann nach unten. Wie gehst du denselben Weg zurück?"
                options: ["↑ ← ←", "→ → ↓", "↓ → →"]
                answer: "↑ ← ←"
                option_audio: false
                hints: ["Fang mit dem letzten Pfeil an und dreh ihn um."]
              - id: l2-s4
                type: true_false
                text: "A B C D\nE F G H\nI J K L\nM N O P\nStart: D · Weg: ↓ ← ←\nDu kommst bei G an."
                say: "Du stehst auf D. Ein Feld nach unten, dann zwei Felder nach links. Stimmt das: Du kommst bei G an?"
                answer: false
                hints: ["Es sind zwei Pfeile nach links. Geh beide Felder."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Weg von A nach F ist am kürzesten?\nA B C D\nE F G H\nI J K L\nM N O P"
                say: "Alle drei Wege führen von A nach F. Welcher ist am kürzesten?"
                options: ["→ ↓", "→ → ↓ ←", "↓ ↓ → ↑"]
                answer: "→ ↓"
                option_audio: false
                hints: ["Zähl die Pfeile. Der kürzeste Weg hat die wenigsten Schritte."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wo kommst du an?\nA B C D\nE F G H\nI J K L\nM N O P\nStart: K · 1 nach oben, 2 nach links"
                say: "Du stehst auf K. Geh ein Feld nach oben und dann zwei Felder nach links. Wo kommst du an?"
                options: ["E", "H", "J"]
                answer: "E"
              - id: l2-n2
                type: multiple_choice
                text: "Welche Beschreibung passt zum Weg von M nach F?\nA B C D\nE F G H\nI J K L\nM N O P"
                say: "Welche Beschreibung passt zum Weg von M nach F?"
                options: ["2 nach oben, 1 nach rechts", "2 nach unten, 1 nach rechts", "1 nach oben, 2 nach rechts"]
                answer: "2 nach oben, 1 nach rechts"
              - id: l2-n3
                type: multiple_choice
                text: "Der Weg hin ist: ↑ ↑ ←\nWie gehst du denselben Weg zurück?"
                say: "Der Weg hin ist: zweimal nach oben, dann nach links. Wie gehst du denselben Weg zurück?"
                options: ["→ ↓ ↓", "↑ ↑ ←", "↑ ↑ →"]
                answer: "→ ↓ ↓"
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "A B C D\nE F G H\nI J K L\nM N O P\nStart: P · Weg: ← ← ← ↑\nDu kommst bei I an."
                say: "Du stehst auf P. Dreimal nach links, dann einmal nach oben. Stimmt das: Du kommst bei I an?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Weg von P nach K ist am kürzesten?\nA B C D\nE F G H\nI J K L\nM N O P"
                say: "Alle drei Wege führen von P nach K. Welcher ist am kürzesten?"
                options: ["↑ ←", "← ← ↑ →", "↑ ↑ ← ↓"]
                answer: "↑ ←"
                option_audio: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: follow
            type: multiple_choice
            text: "Wo kommst du an?\nA B C D\nE F G H\nI J K L\nM N O P\nStart: E · 2 nach rechts, 2 nach unten"
            say: "Du stehst auf E. Geh zwei Felder nach rechts und dann zwei Felder nach unten. Wo kommst du an?"
            options: ["O", "K", "N"]
            answer: "O"
          - id: l2-c2
            part: follow
            type: multiple_choice
            text: "Wo kommst du an?\nA B C D\nE F G H\nI J K L\nM N O P\nStart: C · Weg: ↓ ← ↓"
            say: "Du stehst auf C. Nach unten, nach links, nach unten. Wo kommst du an?"
            options: ["J", "K", "B"]
            answer: "J"
          - id: l2-c3
            part: describe
            type: multiple_choice
            text: "Welche Beschreibung passt zum Weg von I nach C?\nA B C D\nE F G H\nI J K L\nM N O P"
            say: "Welche Beschreibung passt zum Weg von I nach C?"
            options: ["2 nach oben, 2 nach rechts", "2 nach unten, 2 nach rechts", "2 nach oben, 2 nach links"]
            answer: "2 nach oben, 2 nach rechts"
          - id: l2-c4
            part: back
            type: multiple_choice
            text: "Der Weg hin ist: ↓ →\nWie gehst du denselben Weg zurück?"
            say: "Der Weg hin ist: nach unten, dann nach rechts. Wie gehst du denselben Weg zurück?"
            options: ["← ↑", "↓ →", "→ ↓"]
            answer: "← ↑"
            option_audio: false
          - id: l2-c5
            part: follow
            type: true_false
            text: "A B C D\nE F G H\nI J K L\nM N O P\nStart: J · Weg: ↑ ↑ →\nDu kommst bei G an."
            say: "Du stehst auf J. Zweimal nach oben, dann einmal nach rechts. Stimmt das: Du kommst bei G an?"
            answer: false
          - id: l2-c6
            part: follow
            type: multiple_choice
