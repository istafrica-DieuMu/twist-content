# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.length-compare
skill: math.length.compare
curriculum: de-DE
language: de
title:
  de: Längen vergleichen
  en: Comparing lengths
summary: >
  Lesson 1 compares two things directly (länger, kürzer, gleich lang) and
  learns that you line them up at one end; lesson 2 orders three or more
  lengths, from the shortest to the longest, uses größer and kleiner for
  heights, and ends with the skill check. The lengths are everyday
  things and sentences; measuring with a ruler comes in a later skill.
metadata:
  year: klasse-2
  topic: { de: Längen, en: Length }
  ages: [6-7]
  lesson_minutes: 10
  builds_on: []
  also_practises: []
  vocabulary: { de: [lang, länger, am längsten, kurz, kürzer, gleich lang, hoch, größer, kleiner] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: two, what: { de: zwei Längen vergleichen, en: comparing two lengths } }
    - { id: line-up, what: { de: beim Vergleichen am gleichen Anfang anlegen, en: lining things up at one end to compare } }
    - { id: order, what: { de: drei oder mehr Dinge der Länge nach ordnen, en: putting three or more things in order of length } }
    - { id: two-facts, what: { de: "aus zwei Sätzen schließen, was am längsten oder kürzesten ist", en: working out the longest or shortest from two sentences } }
  misconceptions:
    - id: ends-not-lined-up
      what: Compares two lengths without lining them up at one end and picks the one that sticks out further
      addressed: lesson 1 Learn lines up two pencils at one end; l1-f3, l1-s3 and l1-n3 ask how to compare fairly
    - id: longer-one-wins-all
      what: Thinks that when A is longer than B, it is also longer than everything else in the list
      addressed: lesson 2 Learn orders three strings from two sentences; l2-f4, l2-s3, l2-n2 and l2-n3 give a wrong answer from the first sentence alone
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Länger, kürzer, gleich lang", en: "Longer, shorter, the same" }
    new_content: true
    activities:
      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Bus ist länger als das Auto."
            say: "Ein Bus und ein Auto. Der Bus ist länger als das Auto. Das Auto ist kürzer als der Bus."
          - text: "Gleicher Anfang!"
            say: "Zwei Stifte willst du vergleichen. Leg sie mit einem Ende genau nebeneinander, an den gleichen Anfang. Dann siehst du am anderen Ende, welcher länger ist."
          - text: "Die zwei Schnüre sind gleich lang."
            say: "Wenn beide Enden genau gleich weit gehen, sind sie gleich lang."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist länger: ein Zug oder ein Fahrrad?"
                say: "Was ist länger: ein Zug oder ein Fahrrad?"
                options: ["ein Zug", "ein Fahrrad", "beide gleich lang"]
                answer: "ein Zug"
                hints:
                  - "Denk an einen Zug am Bahnhof."
                  - "Ein Zug hat viele Wagen hintereinander."
                  - "Ein Zug ist länger."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Was ist kürzer: ein Bleistift oder ein Besen?"
                say: "Was ist kürzer: ein Bleistift oder ein Besen?"
                options: ["ein Bleistift", "ein Besen", "beide gleich lang"]
                answer: "ein Bleistift"
                hints:
                  - "Kürzer heißt: weniger lang."
                  - "Einen Bleistift kannst du in einer Hand halten."
                  - "Ein Bleistift ist kürzer."
              - id: l1-f3
                type: multiple_choice
                text: "Lea will zwei Stifte vergleichen. Was muss sie tun?"
                say: "Lea will wissen, welcher von zwei Stiften länger ist. Was muss sie tun?"
                options: ["Die Stifte an einem Ende genau nebeneinanderlegen.", "Die Stifte irgendwie hinlegen.", "Den dickeren Stift nehmen."]
                answer: "Die Stifte an einem Ende genau nebeneinanderlegen."
                feedback:
                  "Den dickeren Stift nehmen.": "Dick heißt nicht lang. Ein dicker Stift kann kurz sein."
                hints:
                  - "Beim Vergleichen brauchen beide den gleichen Anfang."
                  - "Dann siehst du am anderen Ende, welcher weiter geht."
                  - "Die Stifte an einem Ende genau nebeneinanderlegen."
              - id: l1-f4
                type: true_false
                text: "Ein Löffel ist länger als ein Tisch."
                say: "Stimmt das? Ein Löffel ist länger als ein Tisch."
                answer: false
                hints:
                  - "Stell dir beides nebeneinander vor."
                  - "Auf einen Tisch passen viele Löffel hintereinander."
                  - "Nein, der Tisch ist länger."
              - id: l1-f5
                type: multiple_choice
                text: "Tim und Mia legen ihre Schnüre am gleichen Anfang hin. Tims Schnur reicht genauso weit wie Mias. Was stimmt?"
                say: "Tim und Mia legen ihre Schnüre am gleichen Anfang nebeneinander. Tims Schnur reicht genauso weit wie Mias Schnur. Was stimmt?"
                options: ["Die Schnüre sind gleich lang.", "Tims Schnur ist länger.", "Mias Schnur ist länger."]
                answer: "Die Schnüre sind gleich lang."
                hints:
                  - "Beide haben den gleichen Anfang."
                  - "Und beide hören an der gleichen Stelle auf."
                  - "Die Schnüre sind gleich lang."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist meistens länger: eine Schlange oder ein Regenwurm?"
                say: "Was ist meistens länger: eine Schlange oder ein Regenwurm?"
                options: ["eine Schlange", "ein Regenwurm", "beide gleich lang"]
                answer: "eine Schlange"
                hints: ["Stell dir beide nebeneinander vor."]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist kürzer: dein Finger oder dein Arm?"
                say: "Was ist kürzer: dein Finger oder dein Arm?"
                options: ["mein Finger", "mein Arm", "beide gleich lang"]
                answer: "mein Finger"
                hints: ["Halte deinen Finger an deinen Arm."]
              - id: l1-s3
                type: true_false
                text: "Ben legt zwei Bänder hin. Eins fängt weiter links an, eins weiter rechts. So kann er gut sehen, welches länger ist."
                say: "Ben legt zwei Bänder hin. Eins fängt weiter links an, eins weiter rechts. Kann er so gut sehen, welches länger ist?"
                answer: false
                hints: ["Die Bänder haben nicht den gleichen Anfang."]
              - id: l1-s4
                type: true_false
                text: "Ein Lineal ist kürzer als eine Tür."
                say: "Stimmt das? Ein Lineal ist kürzer als eine Tür."
                answer: true
                hints: ["Eine Tür ist größer als du."]
              - id: l1-s5
                type: multiple_choice
                text: "Die grüne Schnur ist länger als die rote. Was stimmt dann auch?"
                say: "Die grüne Schnur ist länger als die rote. Was stimmt dann auch?"
                options: ["Die rote Schnur ist kürzer als die grüne.", "Die rote Schnur ist länger als die grüne.", "Beide sind gleich lang."]
                answer: "Die rote Schnur ist kürzer als die grüne."
                hints: ["Dreh den Satz um: Länger wird zu kürzer."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was ist länger: ein Schulbus oder ein Roller?"
                say: "Was ist länger: ein Schulbus oder ein Roller?"
                options: ["ein Schulbus", "ein Roller", "beide gleich lang"]
                answer: "ein Schulbus"
              - id: l1-n2
                type: multiple_choice
                text: "Was ist kürzer: eine Büroklammer oder ein Heft?"
                say: "Was ist kürzer: eine Büroklammer oder ein Heft?"
                options: ["eine Büroklammer", "ein Heft", "beide gleich lang"]
                answer: "eine Büroklammer"
              - id: l1-n3
                type: multiple_choice
                text: "Wie vergleichst du zwei Bänder richtig?"
                say: "Wie vergleichst du zwei Bänder richtig?"
                options: ["Am gleichen Anfang nebeneinanderlegen.", "Das hellere nehmen.", "Beide zusammenknüllen."]
                answer: "Am gleichen Anfang nebeneinanderlegen."
              - id: l1-n4
                type: true_false
                text: "Ein Bett ist länger als ein Kissen."
                say: "Stimmt das? Ein Bett ist länger als ein Kissen."
                answer: true
              - id: l1-n5
                type: multiple_choice
                text: "Das Seil ist kürzer als der Schal. Was stimmt dann auch?"
                say: "Das Seil ist kürzer als der Schal. Was stimmt dann auch?"
                options: ["Der Schal ist länger als das Seil.", "Der Schal ist kürzer als das Seil.", "Beide sind gleich lang."]
                answer: "Der Schal ist länger als das Seil."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist länger: ein Flugzeug oder ein Auto?"
            say: "Was ist länger: ein Flugzeug oder ein Auto?"
            options: ["ein Flugzeug", "ein Auto", "beide gleich lang"]
            answer: "ein Flugzeug"
          - id: l1-c2
            type: true_false
            text: "Ein Radiergummi ist länger als ein Lineal."
            say: "Stimmt das? Ein Radiergummi ist länger als ein Lineal."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Der Stock ist länger als der Ast. Was stimmt dann auch?"
            say: "Der Stock ist länger als der Ast. Was stimmt dann auch?"
            options: ["Der Ast ist kürzer als der Stock.", "Der Ast ist länger als der Stock.", "Beide sind gleich lang."]
            answer: "Der Ast ist kürzer als der Stock."
          - id: l1-c4
            type: multiple_choice
            text: "Was ist kürzer: eine Maus oder ein Pferd?"
            say: "Was ist kürzer: eine Maus oder ein Pferd?"
            options: ["eine Maus", "ein Pferd", "beide gleich lang"]
            answer: "eine Maus"
          - id: l1-c5
            type: true_false
            text: "Zwei Bänder liegen am gleichen Anfang. Beide hören an der gleichen Stelle auf. Sie sind gleich lang."
            say: "Zwei Bänder liegen am gleichen Anfang. Beide hören an der gleichen Stelle auf. Stimmt das: Sie sind gleich lang?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "Die Hose ist länger als die Socke. Was stimmt dann auch?"
            say: "Die Hose ist länger als die Socke. Was stimmt dann auch?"
            options: ["Die Socke ist kürzer als die Hose.", "Die Socke ist länger als die Hose.", "Beide sind gleich lang."]
            answer: "Die Socke ist kürzer als die Hose."

  - n: 2
    title: { de: "Der Länge nach ordnen", en: "Putting lengths in order" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was ist kürzer: ein Schuh oder ein Sofa?"
            say: "Was ist kürzer: ein Schuh oder ein Sofa?"
            options: ["ein Schuh", "ein Sofa"]
            answer: "ein Schuh"
            difficulty: easy
          - id: l2-w2
            type: ordering
            text: "Ordne von klein nach groß."
            say: "Ordne die Zahlen von klein nach groß."
            options: ["35", "12", "50"]
            slot_count: 3
            answer: ["12", "35", "50"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Stift, Lineal, Besen"
            say: "Drei Dinge: ein Stift, ein Lineal, ein Besen. Der Stift ist kürzer als das Lineal. Das Lineal ist kürzer als der Besen. Also ist der Stift am kürzesten und der Besen am längsten."
          - text: "Die rote Schnur ist länger als die blaue. Die blaue ist länger als die gelbe."
            say: "Die rote Schnur ist länger als die blaue. Die blaue ist länger als die gelbe. Dann ist die rote die längste und die gelbe die kürzeste. Du brauchst beide Sätze, um zu ordnen."
          - text: "Lena ist größer als Ben."
            say: "Bei Menschen und Bäumen sagen wir oft groß und klein. Lena ist größer als Ben. Das heißt: Von den Füßen bis zum Kopf ist Lena länger."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Ordne vom kürzesten zum längsten."
                say: "Ordne vom kürzesten zum längsten: Auto, Bleistift, Zug."
                options: ["Auto", "Bleistift", "Zug"]
                slot_count: 3
                answer: ["Bleistift", "Auto", "Zug"]
                hints:
                  - "Was ist am kürzesten?"
                  - "Der Bleistift passt in deine Hand. Der Zug hat viele Wagen."
                  - "Bleistift, Auto, Zug."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die rote Schnur ist länger als die blaue. Die blaue ist länger als die grüne. Welche ist am längsten?"
                say: "Die rote Schnur ist länger als die blaue. Die blaue ist länger als die grüne. Welche Schnur ist am längsten?"
                options: ["die rote", "die blaue", "die grüne"]
                answer: "die rote"
                hints:
                  - "Die rote ist länger als die blaue."
                  - "Und die blaue ist schon länger als die grüne."
                  - "Die rote Schnur ist am längsten."
              - id: l2-f3
                type: multiple_choice
                text: "Tim ist größer als Ali. Ali ist größer als Mia. Wer ist am kleinsten?"
                say: "Tim ist größer als Ali. Ali ist größer als Mia. Wer ist am kleinsten?"
                options: ["Mia", "Ali", "Tim"]
                answer: "Mia"
                hints:
                  - "Wer ist kleiner als Ali?"
                  - "Mia ist kleiner als Ali, und Ali ist kleiner als Tim."
                  - "Mia."
              - id: l2-f4
                type: true_false
                text: "Das Heft ist länger als der Radiergummi. Das Buch ist länger als das Heft. Also ist das Buch am längsten."
                say: "Das Heft ist länger als der Radiergummi. Das Buch ist länger als das Heft. Ist das Buch am längsten?"
                answer: true
                hints:
                  - "Ordne: erst Radiergummi, dann Heft."
                  - "Das Buch ist noch länger als das Heft."
                  - "Ja, das Buch ist am längsten."
              - id: l2-f5
                type: ordering
                text: "Ordne vom kleinsten zum größten."
                say: "Ordne vom kleinsten zum größten: Haus, Katze, Kind."
                options: ["Haus", "Katze", "Kind"]
                slot_count: 3
                answer: ["Katze", "Kind", "Haus"]
                hints:
                  - "Was ist am kleinsten?"
                  - "Die Katze. Ein Kind ist größer als eine Katze, aber viel kleiner als ein Haus."
                  - "Katze, Kind, Haus."

          - support: some
            tasks:
              - id: l2-s1
                type: ordering
                text: "Ordne vom kürzesten zum längsten."
                say: "Ordne vom kürzesten zum längsten: Gabel, Ameise, Bett."
                options: ["Gabel", "Ameise", "Bett"]
                slot_count: 3
                answer: ["Ameise", "Gabel", "Bett"]
                hints: ["Fang mit dem Kürzesten an."]
              - id: l2-s2
                type: multiple_choice
                text: "Der gelbe Stift ist kürzer als der rote. Der rote ist kürzer als der blaue. Welcher ist am kürzesten?"
                say: "Der gelbe Stift ist kürzer als der rote. Der rote ist kürzer als der blaue. Welcher Stift ist am kürzesten?"
                options: ["der gelbe", "der rote", "der blaue"]
                answer: "der gelbe"
                hints: ["Der gelbe ist kürzer als der rote, und der rote ist kürzer als der blaue."]
              - id: l2-s3
                type: multiple_choice
                text: "Oma ist größer als Lena. Papa ist größer als Oma. Wer ist am größten?"
                say: "Oma ist größer als Lena. Papa ist größer als Oma. Wer ist am größten?"
                options: ["Papa", "Oma", "Lena"]
                answer: "Papa"
                hints: ["Ordne zuerst Lena und Oma."]
              - id: l2-s4
                type: true_false
                text: "Der Wal ist länger als das Boot. Das Boot ist länger als der Fisch. Also ist der Fisch am längsten."
                say: "Der Wal ist länger als das Boot. Das Boot ist länger als der Fisch. Ist der Fisch am längsten?"
                answer: false
                hints: ["Der Fisch ist kürzer als das Boot."]
              - id: l2-s5
                type: ordering
                text: "Ordne vom kleinsten zum größten."
                say: "Ordne vom kleinsten zum größten: Giraffe, Hase, Pferd."
                options: ["Giraffe", "Hase", "Pferd"]
                slot_count: 3
                answer: ["Hase", "Pferd", "Giraffe"]
                hints: ["Die Giraffe hat einen sehr langen Hals."]

          - support: none
            tasks:
              - id: l2-n1
                type: ordering
                text: "Ordne vom kürzesten zum längsten."
                say: "Ordne vom kürzesten zum längsten: Brücke, Schuh, Auto."
                options: ["Brücke", "Schuh", "Auto"]
                slot_count: 3
                answer: ["Schuh", "Auto", "Brücke"]
              - id: l2-n2
                type: multiple_choice
                text: "Das grüne Band ist länger als das rote. Das gelbe ist länger als das grüne. Welches ist am längsten?"
                say: "Das grüne Band ist länger als das rote. Das gelbe ist länger als das grüne. Welches Band ist am längsten?"
                options: ["das gelbe", "das grüne", "das rote"]
                answer: "das gelbe"
              - id: l2-n3
                type: multiple_choice
                text: "Jan ist kleiner als Paul. Lisa ist kleiner als Jan. Wer ist am kleinsten?"
                say: "Jan ist kleiner als Paul. Lisa ist kleiner als Jan. Wer ist am kleinsten?"
                options: ["Lisa", "Jan", "Paul"]
                answer: "Lisa"
              - id: l2-n4
                type: true_false
                text: "Der Schal ist länger als die Socke. Die Socke ist länger als der Ring. Also ist der Ring am kürzesten."
                say: "Der Schal ist länger als die Socke. Die Socke ist länger als der Ring. Ist der Ring am kürzesten?"
                answer: true
              - id: l2-n5
                type: ordering
                text: "Ordne vom kürzesten zum längsten."
                say: "Ordne vom kürzesten zum längsten: Löffel, Finger, Tisch, Zug."
                options: ["Löffel", "Finger", "Tisch", "Zug"]
                slot_count: 4
                answer: ["Finger", "Löffel", "Tisch", "Zug"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: two
            type: multiple_choice
            text: "Was ist länger: ein Lastwagen oder ein Fahrrad?"
            say: "Was ist länger: ein Lastwagen oder ein Fahrrad?"
            options: ["ein Lastwagen", "ein Fahrrad", "beide gleich lang"]
            answer: "ein Lastwagen"
          - id: l2-c2
            part: line-up
            type: multiple_choice
            text: "Wie vergleichst du zwei Stöcke richtig?"
            say: "Wie vergleichst du zwei Stöcke richtig?"
            options: ["Am gleichen Anfang nebeneinanderlegen.", "Den dickeren nehmen.", "Den schwereren nehmen."]
            answer: "Am gleichen Anfang nebeneinanderlegen."
          - id: l2-c3
            part: order
            type: ordering
            text: "Ordne vom kleinsten zum größten."
            say: "Ordne vom kleinsten zum größten: Haus, Maus, Hund."
            options: ["Haus", "Maus", "Hund"]
            slot_count: 3
            answer: ["Maus", "Hund", "Haus"]
          - id: l2-c4
            part: two-facts
            type: multiple_choice
            text: "Die blaue Kette ist länger als die rote. Die rote ist länger als die weiße. Welche ist am kürzesten?"
            say: "Die blaue Kette ist länger als die rote. Die rote ist länger als die weiße. Welche Kette ist am kürzesten?"
            options: ["die weiße", "die rote", "die blaue"]
            answer: "die weiße"
          - id: l2-c5
            part: two
            type: true_false
            text: "Ein Kind ist meistens größer als ein Erwachsener."
            say: "Ein Kind ist meistens größer als ein Erwachsener. Stimmt das?"
            answer: false
          - id: l2-c6
            part: two
            type: multiple_choice
            text: "Was ist kürzer: ein Teelöffel oder eine Schaufel?"
            say: "Was ist kürzer: ein Teelöffel oder eine Schaufel?"
            options: ["ein Teelöffel", "eine Schaufel", "beide gleich lang"]
            answer: "ein Teelöffel"
          - id: l2-c7
            part: two
            type: true_false
            text: "Ein Zug ist kürzer als ein Auto."
            say: "Stimmt das? Ein Zug ist kürzer als ein Auto."
            answer: false
          - id: l2-c8
            part: two
            type: multiple_choice
            text: "Der Gürtel ist kürzer als der Schal. Was stimmt dann auch?"
            say: "Der Gürtel ist kürzer als der Schal. Was stimmt dann auch?"
            options: ["Der Schal ist länger als der Gürtel.", "Der Schal ist kürzer als der Gürtel.", "Beide sind gleich lang."]
            answer: "Der Schal ist länger als der Gürtel."
          - id: l2-c9
            part: two
            type: multiple_choice
            text: "Mia und Ole legen ihre Bänder am gleichen Anfang hin. Mias Band hört früher auf. Was stimmt?"
            say: "Mia und Ole legen ihre Bänder am gleichen Anfang nebeneinander. Mias Band hört früher auf. Was stimmt?"
            options: ["Mias Band ist kürzer.", "Mias Band ist länger.", "Die Bänder sind gleich lang."]
            answer: "Mias Band ist kürzer."
          - id: l2-c10
            part: line-up
            type: true_false
            text: "Lea legt zwei Stifte am gleichen Anfang nebeneinander. So sieht sie, welcher länger ist."
            say: "Lea legt zwei Stifte am gleichen Anfang nebeneinander. Kann sie so sehen, welcher länger ist?"
            answer: true
          - id: l2-c11
            part: line-up
            type: multiple_choice
            text: "Zwei Stifte liegen am gleichen Anfang. Wo siehst du, welcher länger ist?"
            say: "Zwei Stifte liegen am gleichen Anfang nebeneinander. Wo siehst du, welcher länger ist?"
            options: ["am anderen Ende", "am Anfang", "an der Farbe"]
            answer: "am anderen Ende"
          - id: l2-c12
            part: line-up
            type: true_false
            text: "Ole vergleicht zwei Schnüre. Eine fängt weiter vorne an. Die Schnur, die weiter reicht, ist sicher länger."
            say: "Ole vergleicht zwei Schnüre. Eine fängt weiter vorne an. Ist die Schnur, die weiter reicht, sicher länger?"
            answer: false
          - id: l2-c13
            part: order
            type: ordering
            text: "Ordne vom kürzesten zum längsten."
            say: "Ordne vom kürzesten zum längsten: Bus, Ameise, Hund."
            options: ["Bus", "Ameise", "Hund"]
            slot_count: 3
            answer: ["Ameise", "Hund", "Bus"]
          - id: l2-c14
            part: order
            type: ordering
            text: "Ordne vom kleinsten zum größten."
            say: "Ordne vom kleinsten zum größten: Katze, Elefant, Ameise."
            options: ["Katze", "Elefant", "Ameise"]
            slot_count: 3
            answer: ["Ameise", "Katze", "Elefant"]
          - id: l2-c15
            part: order
