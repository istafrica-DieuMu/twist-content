# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.equations-to-100
skill: math.add-sub-to-100.equations
curriculum: de-DE
language: de
title:
  de: Gleichungen und Ungleichungen bis 100
  en: Equations and inequalities to 100
summary: >
  Finding the number in a Platzhalter and comparing calculations with <, >
  and =. Lesson 1 finds a missing number by ergänzen or with the
  Umkehraufgabe (45 + _ = 72, _ − 20 = 35); lesson 2 sets signs between
  calculations, finds which numbers make a Ungleichung true, and ends with
  the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.sub-two-digit, math.add-sub-to-20.equations]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { de: [Platzhalter, Gleichung, Ungleichung, kleiner als, größer als, gleich] }
  forms: [text, audio]
  drawn: []
  facets: []
  misconceptions:
    - id: gap-gets-visible-result
      what: Works out the two numbers that are shown and writes that into the gap (_ − 30 = 42 answered 12)
      addressed: Learn finds the first number with the Umkehraufgabe; hints point to it; 12 is a wrong option in the full stage
    - id: sign-from-first-number
      what: Compares the first numbers and ignores the calculation (48 + 30 _ 80 judged by 48 < 80)
      addressed: Learn works out each side first; hints say "Rechne erst"; l2-s1 (48 + 40 _ 80) and l2-n1 (75 − 20 _ 60) give the wrong sign if only the first numbers are compared
    - id: equals-means-answer
      what: Reads = as "the answer comes next" and rejects calculations on both sides
      addressed: Learn shows 35 + 20 = 60 − 5; true/false and sign tasks with calculations on both sides
    - id: boundary-counts
      what: Lets the boundary number count for < (30 + 4 < 34)
      addressed: Learn screen 4 and feedback on l2-f5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Der Platzhalter, en: The missing number }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "38 + 25 = _"
            answer: "63"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "70 − 34 = _"
            answer: "36"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "45 + _ = 72"
            say: "Hier fehlt eine Zahl. 45 plus wie viel gleich 72? Du kannst ergänzen: Von 45 bis 50 sind es 5, von 50 bis 72 sind es 22. Zusammen 27."
          - text: "45 + 27 = 72"
            say: "Prüfe: 45 plus 27 ist 72. In den Platzhalter gehört 27."
          - text: "_ − 20 = 35"
            say: "Hier fehlt die erste Zahl. Von ihr werden 20 weggenommen, und es bleiben 35. Die Umkehraufgabe hilft: 35 plus 20 gleich 55."
          - text: "55 − 20 = 35"
            say: "Prüfe: 55 minus 20 ist 35. Die gesuchte Zahl ist 55."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "36 + _ = 50"
                say: "36 plus wie viel gleich 50?"
                answer: "14"
                hints:
                  - "Ergänze erst bis 40."
                  - "Von 36 bis 40 sind es 4, von 40 bis 50 sind es 10."
                  - "4 + 10 = 14."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Zahl passt? _ − 30 = 42"
                options: ["12", "62", "72"]
                answer: "72"
                feedback:
                  "12": "42 − 30 ist 12. Gesucht ist aber die Zahl, von der 30 weggenommen werden: 42 + 30."
                hints:
                  - "Rechne die Umkehraufgabe: 42 + 30."
                  - "Von der gesuchten Zahl werden 30 weggenommen, und 42 bleiben."
                  - "42 + 30 = 72."
              - id: l1-f3
                type: text_input
                text: "64 − _ = 60"
                answer: "4"
                hints:
                  - "Wie viel musst du von 64 wegnehmen, damit 60 bleibt?"
                  - "Nur die Einer müssen weg."
                  - "4."
              - id: l1-f4
                type: text_input
                text: "_ + 25 = 80"
                answer: "55"
                hints:
                  - "Rechne die Umkehraufgabe: 80 − 25."
                  - "80 − 20 = 60, dann noch 5 weg."
                  - "55."
              - id: l1-f5
                type: true_false
                text: "Passt 17 in den Platzhalter? 53 + _ = 70"
                say: "Passt 17 in den Platzhalter? 53 plus wie viel gleich 70?"
                answer: true
                hints:
                  - "Rechne 53 + 17."
                  - "53 + 7 = 60, dann noch 10 dazu."
                  - "Ja, 53 + 17 = 70."
              - id: l1-f6
                type: multiple_choice
                text: "Welche Zahl passt? 90 − _ = 54"
                options: ["36", "44", "46"]
                answer: "36"
                feedback:
                  "44": "90 − 44 ist 46, nicht 54."
                hints:
                  - "Ergänze von 54 bis 90."
                  - "Von 54 bis 60 sind es 6, von 60 bis 90 sind es 30."
                  - "36."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "27 + _ = 60"
                answer: "33"
                hints: ["Ergänze erst bis zum nächsten Zehner."]
              - id: l1-s2
                type: text_input
                text: "_ − 40 = 23"
                answer: "63"
                hints: ["Rechne die Umkehraufgabe."]
              - id: l1-s3
                type: text_input
                text: "75 − _ = 70"
                answer: "5"
                hints: ["Was muss weg, damit ein voller Zehner bleibt?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welche Zahl passt? _ + 18 = 50"
                options: ["32", "42", "68"]
                answer: "32"
                hints: ["Rechne die Umkehraufgabe mit minus."]
              - id: l1-s5
                type: true_false
                text: "Passt 26 in den Platzhalter? 81 − _ = 55"
                say: "Passt 26 in den Platzhalter? 81 minus wie viel gleich 55?"
                answer: true
                hints: ["Setz die Zahl ein und rechne nach."]
              - id: l1-s6
                type: text_input
                text: "52 + _ = 100"
                answer: "48"
                hints: ["Ergänze erst bis 60, dann bis 100."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "44 + _ = 70"
                answer: "26"
              - id: l1-n2
                type: text_input
                text: "_ − 25 = 50"
                answer: "75"
              - id: l1-n3
                type: multiple_choice
                text: "Welche Zahl passt? 83 − _ = 48"
                options: ["25", "35", "45"]
                answer: "35"
              - id: l1-n4
                type: text_input
                text: "_ + 37 = 90"
                answer: "53"
              - id: l1-n5
                type: true_false
                text: "Passt 19 in den Platzhalter? 46 + _ = 75"
                say: "Passt 19 in den Platzhalter? 46 plus wie viel gleich 75?"
                answer: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "58 + _ = 80"
            answer: "22"
          - id: l1-c2
            type: text_input
            text: "_ − 50 = 17"
            answer: "67"
          - id: l1-c3
            type: multiple_choice
            text: "Welche Zahl passt? 72 − _ = 39"
            options: ["23", "33", "43"]
            answer: "33"

  - n: 2
    title: { de: "Größer, kleiner oder gleich?", en: "Greater, less or equal?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "63 + _ = 90"
            answer: "27"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            frame: "45 _ 54"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "48 + 30 _ 80"
            say: "Hier fehlt kein Ergebnis, sondern ein Zeichen. Rechne erst die linke Seite: 48 plus 30 ist 78. 78 ist kleiner als 80."
          - text: "48 + 30 < 80"
            say: "Also passt das Kleiner-Zeichen. Die Spitze zeigt zur kleineren Seite. So eine Aufgabe heißt Ungleichung."
          - text: "35 + 20 = 60 − 5"
            say: "Auf beiden Seiten kann eine Rechnung stehen. 35 plus 20 ist 55, 60 minus 5 ist auch 55. Beide Seiten sind gleich groß: Das ist eine Gleichung."
          - text: "40 + _ < 45"
            say: "Welche Zahlen passen hier? 40 plus 4 ist 44, das ist kleiner als 45. 40 plus 5 ist 45, das ist gleich, nicht kleiner. Es passen 0, 1, 2, 3 und 4."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "56 + 20 _ 80"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints:
                  - "Rechne erst 56 + 20."
                  - "56 + 20 = 76. Ist 76 kleiner oder größer als 80?"
                  - "76 < 80."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "70 − 15 _ 50"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Rechne erst 70 − 15."
                  - "70 − 15 = 55. 55 ist größer als 50."
                  - "70 − 15 > 50."
              - id: l2-f3
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "40 + 25 _ 70 − 5"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints:
                  - "Rechne beide Seiten aus."
                  - "Links 65, rechts auch 65."
                  - "Beide Seiten sind gleich: =."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 33 + 40 = 80 − 7"
                say: "Stimmt das? 33 plus 40 gleich 80 minus 7."
                answer: true
                feedback:
                  "false": "Auf beiden Seiten darf eine Rechnung stehen. 33 + 40 = 73 und 80 − 7 = 73."
                hints:
                  - "Rechne beide Seiten aus."
                  - "33 + 40 = 73, 80 − 7 = 73."
                  - "Ja."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Zahl passt? 30 + _ < 34"
                options: ["3", "4", "5"]
                answer: "3"
                feedback:
                  "4": "30 + 4 = 34. Das ist gleich 34, nicht kleiner."
                hints:
                  - "Probier die Zahlen aus."
                  - "30 + 4 = 34 ist gleich, nicht kleiner."
                  - "3."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 62 − 30 > 30"
                say: "Stimmt das? 62 minus 30 ist größer als 30."
                answer: true
                hints:
                  - "Rechne erst 62 − 30."
                  - "32 ist größer als 30."
                  - "Ja."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "48 + 40 _ 80"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints: ["Rechne erst die linke Seite."]
              - id: l2-s2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "90 − 25 _ 60 + 5"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
                hints: ["Rechne beide Seiten aus."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Zahl passt? 50 − _ > 46"
                options: ["3", "4", "5"]
                answer: "3"
                hints: ["Probier die Zahlen aus und vergleiche jedes Ergebnis mit 46."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 27 + 30 < 55"
                say: "Stimmt das? 27 plus 30 ist kleiner als 55."
                answer: false
                hints: ["Rechne erst 27 + 30."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "45 + 9 _ 45 + 10"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                hints: ["Beide fangen mit 45 an. Vergleiche, was dazukommt."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "75 − 20 _ 60"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
              - id: l2-n2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "50 + 18 _ 70 − 2"
                options: ["<", ">", "="]
                answer: ["="]
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Welche Zahl passt? 20 + _ < 23"
                options: ["2", "3", "4"]
                answer: "2"
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 81 − 40 = 40 + 1"
                say: "Stimmt das? 81 minus 40 gleich 40 plus 1."
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                frame: "72 − 9 _ 72 − 10"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: text_input
            text: "29 + _ = 70"
            answer: "41"
          - id: l2-c2
            type: text_input
            text: "_ − 35 = 40"
            answer: "75"
          - id: l2-c3
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            frame: "57 + 30 _ 90"
            options: ["<", ">", "="]
            answer: ["<"]
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            frame: "100 − 45 _ 50 + 5"
            options: ["<", ">", "="]
            answer: ["="]
            option_audio: false
          - id: l2-c5
            type: multiple_choice
            text: "Welche Zahl passt? 60 − _ > 57"
            options: ["2", "3", "4"]
            answer: "2"
