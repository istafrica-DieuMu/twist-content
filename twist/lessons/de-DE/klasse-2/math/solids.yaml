# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.solids
skill: math.solids.cube-cuboid-sphere
curriculum: de-DE
language: de
title:
  de: Würfel, Quader und Kugel
  en: Cube, cuboid and sphere
summary: >
  Lesson 1 tells the three Körper apart and names them, in drawings and
  in things around us (ein Ball ist eine Kugel, ein Buch ist ein Quader),
  and keeps the Körper apart from the flat shapes (Kugel, nicht Kreis);
  lesson 2 counts Flächen, Ecken and Kanten (Würfel and Quader: 6, 8,
  12; Kugel: keine Ecke, keine Kante), sorts what rolls and what does not,
  and ends with the skill check. Feeling and building real solids waits
  for a hands-on task.
metadata:
  year: klasse-2
  topic: { de: Körper, en: 3D shapes }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.basic-shapes]
  also_practises: [math.shapes.basic-shapes]
  vocabulary: { de: [Körper, Würfel, Quader, Kugel, Fläche, Ecke, Kante, rollen] }
  forms: [picture, text, audio, drawn]
  drawn: [shape]
  facets: []
  parts:
    - { id: name, what: { de: "Würfel, Quader und Kugel erkennen und benennen", en: "recognising and naming cubes, cuboids and spheres" } }
    - { id: around, what: { de: die Körper in der Umwelt finden, en: finding the solids around us } }
    - { id: props, what: { de: "Flächen, Ecken und Kanten zählen und beschreiben", en: "counting and describing faces, corners and edges" } }
  misconceptions:
    - id: flat-name-for-solid
      what: Calls a Körper by the name of a flat shape (die Kugel ein Kreis, der Würfel ein Quadrat)
      addressed: lesson 1 Learn says a Körper can be held in the hand; l1-f2 (with feedback), l1-s2 and l1-n2 offer the flat name for the solid
    - id: every-box-a-cube
      what: Calls every box a Würfel without checking that all Flächen are gleich große Quadrate
      addressed: lesson 1 Learn sets Würfel and Quader side by side; l1-f4, l1-c2 and l2-s5 ask whether the Flächen are gleich große Quadrate
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Körper erkennen", en: "Spotting solids" }
    goal:
      de: "Erkenne Würfel, Quader und Kugel, auch in Dingen um dich herum, so wie ein Ball ist eine Kugel."
      en: "Spot cubes, cuboids and spheres, also in things around you, like a ball is a sphere."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form?"
            show: { drawn: shape, kind: square, colour: orange }
            options: ["Quadrat", "Rechteck", "Kreis"]
            answer: "Quadrat"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie heißt diese Form?"
            say: "Wie heißt diese Form?"
            show: { drawn: shape, kind: circle, colour: green }
            options: ["Kreis", "Dreieck"]
            answer: "Kreis"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Würfel"
            say: "Das ist ein Würfel. Er ist kein flaches Bild, sondern ein Körper: Du kannst ihn in die Hand nehmen. Alle seine Flächen sind gleich große Quadrate."
            show: { drawn: shape, kind: cube, colour: red }
          - text: "Quader"
            say: "Das ist ein Quader. Er sieht aus wie eine Schachtel oder ein Buch. Seine Flächen sind Rechtecke."
            show: { drawn: shape, kind: cuboid, colour: blue }
          - text: "Kugel"
            say: "Das ist eine Kugel. Sie ist rundherum rund und hat keine Ecken. Ein Ball ist eine Kugel."
            show: { drawn: shape, kind: sphere, colour: yellow }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wo ist der Würfel?"
                say: "Wo ist der Würfel?"
                options:
                  - { drawn: shape, kind: cuboid, colour: green }
                  - { drawn: shape, kind: cube, colour: green }
                  - { drawn: shape, kind: sphere, colour: green }
                answer: cube
                option_audio: false
                hints:
                  - "Ein Würfel hat lauter gleich große Quadrate als Flächen."
                  - "Der Quader ist länger als hoch. Die Kugel ist rund."
                  - "Der Würfel ist nicht rund und nicht länger als hoch."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie heißt dieser Körper?"
                say: "Wie heißt dieser Körper?"
                show: { drawn: shape, kind: sphere, colour: red }
                options: ["Kugel", "Kreis", "Würfel"]
                answer: "Kugel"
                feedback:
                  "Kreis": "Ein Kreis ist flach wie ein Bild auf Papier. Die Kugel ist rundherum rund, wie ein Ball."
                hints:
                  - "Ist das flach oder kannst du es in die Hand nehmen?"
                  - "Es ist rund wie ein Ball."
                  - "Kugel."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Form hat der Ball?"
                say: "Welche Form hat der Ball?"
                show: { object: ball }
                options: ["Kugel", "Würfel", "Quader"]
                answer: "Kugel"
                hints:
                  - "Hat der Ball Ecken?"
                  - "Er ist rundherum rund und hat keine Ecken."
                  - "Kugel."
              - id: l1-f4
                type: true_false
                text: "Das ist ein Würfel."
                say: "Stimmt das? Das ist ein Würfel."
                show: { drawn: shape, kind: cuboid, colour: orange }
                answer: false
                hints:
                  - "Bei einem Würfel sind alle Flächen gleich große Quadrate."
                  - "Ist dieser Körper genauso hoch wie lang?"
                  - "Nein, das ist ein Quader."
              - id: l1-f5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jeden Körper mit seinem Namen."
                pairs:
                  - { left: { drawn: shape, kind: cube, colour: purple }, right: { text: "Würfel" } }
                  - { left: { drawn: shape, kind: cuboid, colour: purple }, right: { text: "Quader" } }
                  - { left: { drawn: shape, kind: sphere, colour: purple }, right: { text: "Kugel" } }
                hints:
                  - "Fang mit dem runden Körper an."
                  - "Lang wie eine Schachtel: Quader. Gleich lang in alle Richtungen: Würfel."
                  - "Rund: Kugel. Lang: Quader. In alle Richtungen gleich lang: Würfel."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo ist die Kugel?"
                say: "Wo ist die Kugel?"
                options:
                  - { drawn: shape, kind: cube, colour: blue }
                  - { drawn: shape, kind: sphere, colour: blue }
                  - { drawn: shape, kind: cylinder, colour: blue }
                answer: sphere
                option_audio: false
                hints: ["Die Kugel ist rundherum rund, wie ein Ball."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie heißt dieser Körper?"
                say: "Wie heißt dieser Körper?"
                show: { drawn: shape, kind: cube, colour: yellow }
                options: ["Würfel", "Quadrat", "Kugel"]
                answer: "Würfel"
                hints: ["Ein Quadrat ist flach. Das hier kannst du in die Hand nehmen."]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Form hat das Buch?"
                say: "Welche Form hat das Buch?"
                show: { object: book }
                options: ["Quader", "Kugel", "Würfel"]
                answer: "Quader"
                hints: ["Das Buch hat Ecken, und es ist nicht gleich lang in alle Richtungen."]
              - id: l1-s4
                type: true_false
                text: "Die Orange hat die Form einer Kugel."
                say: "Stimmt das? Die Orange hat die Form einer Kugel."
                show: { object: orange }
                answer: true
                hints: ["Hat die Orange Ecken?"]
              - id: l1-s5
                type: matching
                text: "Welche Form hat das?"
                say: "Verbinde jedes Ding mit seiner Form."
                pairs:
                  - { left: { object: ball }, right: { text: "Kugel" } }
                  - { left: { object: book }, right: { text: "Quader" } }
                  - { left: { object: cube }, right: { text: "Würfel" } }
                option_audio: false
                hints: ["Rund ist eine Kugel. Lang wie eine Schachtel ist ein Quader."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Wo ist der Quader?"
                say: "Wo ist der Quader?"
                options:
                  - { drawn: shape, kind: sphere, colour: red }
                  - { drawn: shape, kind: pyramid, colour: red }
                  - { drawn: shape, kind: cuboid, colour: red }
                answer: cuboid
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Wie heißt dieser Körper?"
                say: "Wie heißt dieser Körper?"
                show: { drawn: shape, kind: cuboid, colour: green }
                options: ["Quader", "Rechteck", "Kugel"]
                answer: "Quader"
              - id: l1-n3
                type: image_multiple_choice
                text: "Was hat die Form eines Würfels?"
                say: "Was hat die Form eines Würfels?"
                options:
                  - { object: ball }
                  - { object: cube }
                  - { object: book }
                answer: cube
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Die Murmel hat die Form eines Würfels."
                say: "Stimmt das? Die Murmel hat die Form eines Würfels."
                show: { object: marble }
                answer: false
              - id: l1-n5
                type: matching
                text: "Was gehört zusammen?"
                say: "Verbinde jeden Körper mit seinem Namen."
                pairs:
                  - { left: { drawn: shape, kind: sphere, colour: green }, right: { text: "Kugel" } }
                  - { left: { drawn: shape, kind: cube, colour: orange }, right: { text: "Würfel" } }
                  - { left: { drawn: shape, kind: cuboid, colour: pink }, right: { text: "Quader" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo ist die Kugel?"
            say: "Wo ist die Kugel?"
            options:
              - { drawn: shape, kind: cuboid, colour: purple }
              - { drawn: shape, kind: sphere, colour: purple }
              - { drawn: shape, kind: cube, colour: purple }
            answer: sphere
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Ist das ein Würfel oder ein Quader?"
            say: "Ist das ein Würfel oder ein Quader?"
            show: { drawn: shape, kind: cuboid, colour: yellow }
            options: ["Quader", "Würfel"]
            answer: "Quader"
          - id: l1-c3
            type: true_false
            text: "Das hat die Form eines Würfels."
            say: "Stimmt das? Das hat die Form eines Würfels."
            show: { object: cube }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Wie heißt dieser Körper?"
            say: "Wie heißt dieser Körper?"
            show: { drawn: shape, kind: cuboid, colour: orange }
            options: ["Quader", "Rechteck", "Würfel"]
            answer: "Quader"
          - id: l1-c5
            type: image_multiple_choice
            text: "Was hat die Form einer Kugel?"
            say: "Was hat die Form einer Kugel?"
            options:
              - { object: cube }
              - { object: beach-ball }
              - { object: book }
            answer: beach-ball
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Das ist ein Kreis."
            say: "Stimmt das? Das ist ein Kreis."
            show: { drawn: shape, kind: sphere, colour: red }
            answer: false

  - n: 2
    title: { de: "Flächen, Ecken und Kanten", en: "Faces, corners and edges" }
    goal:
      de: "Zähl Flächen, Ecken und Kanten, so wie ein Würfel hat 8 Ecken, und finde heraus, was rollen kann."
      en: "Count faces, corners and edges, like a cube has 8 corners, and find out what can roll."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Wo ist der Würfel?"
            say: "Wo ist der Würfel?"
            options:
              - { drawn: shape, kind: cylinder, colour: orange }
              - { drawn: shape, kind: cube, colour: orange }
              - { drawn: shape, kind: sphere, colour: orange }
            answer: cube
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie heißt dieser Körper?"
            say: "Wie heißt dieser Körper?"
            show: { drawn: shape, kind: sphere, colour: blue }
            options: ["Kugel", "Würfel"]
            answer: "Kugel"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Würfel: 6 Flächen, 12 Kanten, 8 Ecken"
            say: "Ein Würfel hat sechs Flächen, alle gleich große Quadrate. Wo zwei Flächen zusammenstoßen, ist eine Kante. Der Würfel hat zwölf Kanten und acht Ecken. Drei Flächen siehst du hier nicht, sie sind hinten."
            show: { drawn: shape, kind: cube, colour: red }
          - text: "Quader: 6 Flächen, 12 Kanten, 8 Ecken"
            say: "Auch der Quader hat sechs Flächen, zwölf Kanten und acht Ecken. Seine Flächen sind Rechtecke, und sie sind nicht alle gleich groß."
            show: { drawn: shape, kind: cuboid, colour: blue }
          - text: "Kugel: keine Ecke, keine Kante"
            say: "Die Kugel hat keine Ecke und keine Kante. Sie ist rundherum rund. Darum rollt sie. Würfel und Quader rollen nicht, du kannst sie nur kippen."
            show: { drawn: shape, kind: sphere, colour: yellow }
          - text: "Pyramide: unten ein Quadrat, an den Seiten Dreiecke"
            say: "Es gibt noch mehr Körper. Das ist eine Pyramide. Unten hat sie ein Quadrat, an den Seiten Dreiecke. Oben laufen alle Kanten in einer Spitze zusammen."
            show: { drawn: shape, kind: pyramid, colour: green }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie viele Flächen hat ein Würfel?"
                say: "Wie viele Flächen hat ein Würfel?"
                show: { drawn: shape, kind: cube, colour: green }
                options: ["6", "3", "4"]
                answer: "6"
                feedback:
                  "3": "Auf dem Bild siehst du nur 3 Flächen. Hinten, unten und an der anderen Seite sind noch 3."
                hints:
                  - "Denk an einen Spielwürfel: Er hat die Zahlen 1 bis 6."
                  - "Oben und unten, vorne und hinten, links und rechts."
                  - "6 Flächen."
              - id: l2-f2
                type: true_false
                text: "Eine Kugel hat keine Ecke."
                say: "Stimmt das? Eine Kugel hat keine Ecke."
                answer: true
                hints:
                  - "Denk an einen Ball."
                  - "Gibt es an einem Ball eine Stelle, die spitz ist?"
                  - "Ja, das stimmt. Eine Kugel hat keine Ecke."
                difficulty: easy
              - id: l2-f3
                type: image_multiple_choice
                text: "Welcher Körper kann rollen?"
                say: "Welcher Körper kann in jede Richtung rollen?"
                options:
                  - { drawn: shape, kind: cube, colour: red }
                  - { drawn: shape, kind: sphere, colour: red }
                  - { drawn: shape, kind: cuboid, colour: red }
                answer: sphere
                option_audio: false
                hints:
                  - "Ecken und Kanten halten einen Körper fest."
                  - "Welcher Körper hat keine Ecken und Kanten?"
                  - "Die Kugel."
              - id: l2-f4
                type: multiple_choice
                text: "Wie viele Ecken hat ein Quader?"
                say: "Wie viele Ecken hat ein Quader?"
                show: { drawn: shape, kind: cuboid, colour: purple }
                options: ["8", "4", "6"]
                answer: "8"
                hints:
                  - "Zähl zuerst die Ecken oben, dann die Ecken unten."
                  - "Oben sind 4 Ecken, unten auch 4."
                  - "8 Ecken."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Körper hat 6 gleich große Quadrate als Flächen?"
                say: "Welcher Körper hat sechs gleich große Quadrate als Flächen?"
                options: ["Würfel", "Pyramide", "Kugel"]
                answer: "Würfel"
                feedback:
                  "Pyramide": "Eine Pyramide hat unten ein Quadrat. Ihre anderen Flächen sind Dreiecke."
                hints:
                  - "Die Kugel ist rund und hat keine Ecken."
                  - "Bei welchem Körper sind alle Flächen gleich große Quadrate?"
                  - "Beim Würfel."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie viele Flächen hat ein Quader?"
                say: "Wie viele Flächen hat ein Quader?"
                show: { drawn: shape, kind: cuboid, colour: brown }
                options: ["6", "3", "5"]
                answer: "6"
                hints: ["Oben und unten, vorne und hinten, links und rechts."]
              - id: l2-s2
                type: true_false
                text: "Ein Würfel kann gut rollen."
                say: "Stimmt das? Ein Würfel kann gut rollen."
                answer: false
                hints: ["Hat ein Würfel Ecken und Kanten?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie viele Ecken hat ein Würfel?"
                say: "Wie viele Ecken hat ein Würfel?"
                show: { drawn: shape, kind: cube, colour: yellow }
                options: ["8", "6", "4"]
                answer: "8"
                hints: ["Oben 4 Ecken, unten ..."]
              - id: l2-s4
                type: multiple_choice
                text: "Ich habe keine Ecke und keine Kante. Wer bin ich?"
                say: "Ein Rätsel: Ich habe keine Ecke und keine Kante. Wer bin ich?"
                options: ["Kugel", "Würfel", "Quader"]
                answer: "Kugel"
                hints: ["Welcher Körper ist rundherum rund?"]
              - id: l2-s5
                type: multiple_choice
                text: "Ich habe 6 Flächen. Sie sind Rechtecke und nicht alle gleich groß. Wer bin ich?"
                say: "Ein Rätsel: Ich habe sechs Flächen. Sie sind Rechtecke und nicht alle gleich groß. Wer bin ich?"
                options: ["Quader", "Würfel", "Kugel"]
                answer: "Quader"
                hints: ["Beim Würfel sind alle Flächen gleich groß."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie viele Kanten hat ein Würfel?"
                say: "Wie viele Kanten hat ein Würfel?"
                show: { drawn: shape, kind: cube, colour: blue }
                options: ["12", "8", "6"]
                answer: "12"
              - id: l2-n2
                type: true_false
                text: "Ein Quader hat 8 Ecken."
                say: "Stimmt das? Ein Quader hat acht Ecken."
                answer: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Welcher Körper hat keine Ecke?"
                say: "Welcher Körper hat keine Ecke?"
                options:
                  - { drawn: shape, kind: pyramid, colour: green }
                  - { drawn: shape, kind: sphere, colour: green }
                  - { drawn: shape, kind: cube, colour: green }
                answer: sphere
                option_audio: false
              - id: l2-n4
                type: multiple_choice
                text: "Ich habe 6 gleich große Quadrate als Flächen. Wer bin ich?"
                say: "Ein Rätsel: Ich habe sechs gleich große Quadrate als Flächen. Wer bin ich?"
                options: ["Würfel", "Pyramide", "Kugel"]
                answer: "Würfel"
              - id: l2-n5
                type: sorting
                text: "Rollt es oder nicht?"
                say: "Sortiere: Was rollt, und was rollt nicht?"
                bins:
                  - { id: rolls, show: { text: "rollt" }, say: "rollt" }
                  - { id: stays, show: { text: "rollt nicht" }, say: "rollt nicht" }
                options:
                  - { object: ball, bin: rolls }
                  - { object: book, bin: stays }
                  - { object: marble, bin: rolls }
                  - { object: cube, bin: stays }
                  - { object: orange, bin: rolls }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: props
            type: fill_in_blank
            text: "Zähl die Flächen und die Ecken."
            say: "Wie viele Flächen und wie viele Ecken hat ein Quader?"
            show: { drawn: shape, kind: cuboid, colour: red }
            frame: "_ Flächen und _ Ecken"
            options: ["4", "6", "8", "12"]
            answer: ["6", "8"]
          - id: l2-c2
            part: name
            type: image_multiple_choice
            text: "Tipp auf den Quader."
            say: "Tipp auf den Quader."
            options:
              - { drawn: shape, kind: pyramid, colour: blue }
              - { drawn: shape, kind: cylinder, colour: blue }
              - { drawn: shape, kind: cuboid, colour: blue }
            answer: cuboid
            option_audio: false
          - id: l2-c3
            part: around
            type: multiple_choice
            text: "Welche Form hat die Murmel?"
            say: "Welche Form hat die Murmel?"
            show: { object: marble }
            options: ["Kugel", "Würfel", "Quader"]
            answer: "Kugel"
          - id: l2-c4
            part: props
            type: true_false
            text: "Eine Kugel hat 6 Flächen."
            say: "Stimmt das? Eine Kugel hat sechs Flächen."
            answer: false
          - id: l2-c5
            part: name
            type: multiple_choice
            text: "Ich habe 8 Ecken und 12 Kanten. Alle meine Flächen sind gleich groß. Wer bin ich?"
            say: "Ein Rätsel: Ich habe acht Ecken und zwölf Kanten. Alle meine Flächen sind gleich groß. Wer bin ich?"
            options: ["Quader", "Würfel", "Kugel"]
            answer: "Würfel"
          - id: l2-c6
            part: name
            type: multiple_choice
            text: "Welcher Körper ist das?"
            say: "Welcher Körper ist das?"
            show: { drawn: shape, kind: cube, colour: pink }
            options: ["Würfel", "Quadrat", "Quader"]
            answer: "Würfel"
          - id: l2-c7
            part: name
            type: image_multiple_choice
            text: "Welcher Körper ist ein Würfel?"
            say: "Welcher Körper ist ein Würfel?"
            options:
              - { drawn: shape, kind: cuboid, colour: orange }
              - { drawn: shape, kind: pyramid, colour: orange }
              - { drawn: shape, kind: cube, colour: orange }
            answer: cube
            option_audio: false
          - id: l2-c8
            part: name
            type: true_false
            text: "Das ist eine Kugel."
            say: "Stimmt das? Das ist eine Kugel."
            show: { drawn: shape, kind: sphere, colour: brown }
            answer: true
          - id: l2-c9
            part: name
            type: true_false
            text: "Das ist ein Quadrat."
            say: "Stimmt das? Das ist ein Quadrat."
            show: { drawn: shape, kind: cube, colour: blue }
            answer: false
          - id: l2-c10
            part: name
            type: multiple_choice
            text: "Ist das ein Würfel oder ein Quader?"
            say: "Ist das ein Würfel oder ein Quader?"
            show: { drawn: shape, kind: cube, colour: green }
            options: ["Würfel", "Quader"]
            answer: "Würfel"
          - id: l2-c11
            part: around
            type: multiple_choice
            text: "Welche Form hat die Müslipackung?"
            say: "Welche Form hat die Müslipackung?"
            show: { object: cereal-box }
            options: ["Quader", "Würfel", "Kugel"]
            answer: "Quader"
          - id: l2-c12
            part: around
            type: multiple_choice
            text: "Welche Form hat der Wasserball?"
            say: "Welche Form hat der Wasserball?"
            show: { object: beach-ball }
