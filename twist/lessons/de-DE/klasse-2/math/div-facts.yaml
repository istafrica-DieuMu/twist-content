# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.div-facts
skill: math.mult-div.div-facts
curriculum: de-DE
language: de
title:
  de: Alle Geteiltaufgaben
  en: All the division facts
summary: >
  Every division fact of the kleines Einmaleins. Lesson 1 takes two
  divisions from each multiplication, divides by 2, 3, 4, 5 and 10, and
  learns the rules for dividing by itself and by one; lesson 2 divides by
  6, 7, 8 and 9 and checks each result with the Probe, and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Geteiltaufgaben, en: Division }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.div-inverse, math.mult-div.all-tables]
  also_practises: [math.mult-div.div-inverse, math.mult-div.all-tables]
  vocabulary: { de: [geteilt durch, Probe, Umkehraufgabe, Geteiltaufgabe] }
  forms: [text, audio]
  drawn: []
  facets: [operation-signs]
  parts:
    - { id: small, what: { de: "durch 2, 3, 4, 5 und 10 teilen", en: "dividing by 2, 3, 4, 5 and 10" } }
    - { id: big, what: { de: "durch 6, 7, 8 und 9 teilen", en: "dividing by 6, 7, 8 and 9" } }
    - { id: rules, what: { de: durch 1 und durch die Zahl selbst teilen, en: dividing by 1 and by the number itself } }
    - { id: probe, what: { de: mit der Malaufgabe die Probe machen, en: checking a division with a multiplication } }
  misconceptions:
    - id: divide-by-itself-zero
      what: "Thinks a number divided by itself is 0 or the number (8 : 8 = 0), or that dividing by 1 gives 1"
      addressed: "lesson 1 Learn gives both rules; l1-f3, l1-s3 and l1-n3 ask n : n or n : 1 with the wrong rule as options, with feedback in l1-f3 and l1-s3; l1-c3 asks whether 5 : 5 is 0"
    - id: probe-wrong-operation
      what: Checks a division with a plus or minus task
      addressed: "every stage of lesson 2 has a \"Welche Probe passt?\" task offering the plus and minus tasks; l2-f3 and l2-n3 need the Probe to find the error"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Zwei Geteiltaufgaben aus einer Malaufgabe", en: "Two divisions from one multiplication" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Welche Zahl fehlt in der Malaufgabe?"
            frame: "_ · 4 = 28"
            options: ["7", "6", "8"]
            answer: ["7"]
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "12 : 2 = _"
            say: "Zwölf geteilt durch zwei."
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "5 · 6 = 30 | 30 : 5 = 6 | 30 : 6 = 5"
            say: "Zu jeder Malaufgabe gehören zwei Geteiltaufgaben. Aus fünf mal sechs gleich dreißig werden dreißig geteilt durch fünf und dreißig geteilt durch sechs."
          - text: "40 : 10 = 4 | 18 : 2 = 9 | 25 : 5 = 5"
            say: "Geteilt durch zehn, zwei und fünf geht schnell. Die Zehner-, die Zweier- und die Fünferreihe kennst du gut."
          - text: "7 : 7 = 1 | 7 : 1 = 7"
            say: "Zwei Regeln helfen dir. Eine Zahl geteilt durch sich selbst ist eins. Teilst du eine Zahl durch eins, bleibt sie gleich."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: text_input
                text: "70 : 10 = _"
                say: "Siebzig geteilt durch zehn."
                answer: "7"
                hints:
                  - "Zehn mal wie viel ist siebzig?"
                  - "Zehn mal sieben ist siebzig."
                  - "7."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Rechne die beiden Geteiltaufgaben aus."
                say: "Fünf mal neun ist fünfundvierzig. Rechne die beiden Geteiltaufgaben aus."
                frame: "5 · 9 = 45 | 45 : 5 = _ | 45 : 9 = _"
                options: ["9", "5", "40"]
                answer: ["9", "5"]
                hints:
                  - "Fünfundvierzig geteilt durch fünf: Fünf mal wie viel ist fünfundvierzig?"
                  - "In allen drei Aufgaben kommen nur die Zahlen fünf, neun und fünfundvierzig vor."
                  - "9 und 5."
              - id: l1-f3
                type: multiple_choice
                text: "8 : 8 = _"
                say: "Acht geteilt durch acht."
                options: ["1", "0", "8"]
                answer: "1"
                feedback:
                  "0": "Wie oft passt die 8 in die 8? Genau einmal."
                  "8": "Das wäre acht geteilt durch eins."
                hints:
                  - "Wie oft passt die 8 in die 8?"
                  - "Genau einmal."
                  - "1."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? 36 : 4 = 8"
                say: "Sechsunddreißig geteilt durch vier ist acht. Stimmt das?"
                answer: false
                hints:
                  - "Mach die Probe: vier mal acht."
                  - "Vier mal acht ist zweiunddreißig, nicht sechsunddreißig. Vier mal neun ist sechsunddreißig."
                  - "Nein. 36 : 4 = 9."
              - id: l1-f5
                type: text_input
                text: "30 : 3 = _"
                say: "Dreißig geteilt durch drei."
                answer: "10"
                hints:
                  - "Drei mal wie viel ist dreißig?"
                  - "Drei mal zehn ist dreißig."
                  - "10."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                text: "90 : 10 = _"
                say: "Neunzig geteilt durch zehn."
                answer: "9"
                hints: ["Zehn mal wie viel ist neunzig?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Rechne die beiden Geteiltaufgaben aus."
                say: "Vier mal sieben ist achtundzwanzig. Rechne die beiden Geteiltaufgaben aus."
                frame: "4 · 7 = 28 | 28 : 4 = _ | 28 : 7 = _"
                options: ["7", "4", "24"]
                answer: ["7", "4"]
                hints: ["In allen drei Aufgaben kommen nur die Zahlen vier, sieben und achtundzwanzig vor."]
              - id: l1-s3
                type: multiple_choice
                text: "6 : 1 = _"
                say: "Sechs geteilt durch eins."
                options: ["6", "1", "0"]
                answer: "6"
                feedback:
                  "1": "Das wäre sechs geteilt durch sechs. Teilst du durch eins, bleibt die Zahl gleich."
                hints: ["Wie oft passt die 1 in die 6?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 14 : 2 = 6"
                say: "Vierzehn geteilt durch zwei ist sechs. Stimmt das?"
                answer: false
                hints: ["Mach die Probe: Zwei mal sechs ist zwölf."]
              - id: l1-s5
                type: text_input
                text: "27 : 3 = _"
                say: "Siebenundzwanzig geteilt durch drei."
                answer: "9"
                hints: ["Drei mal wie viel ist siebenundzwanzig?"]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                text: "80 : 10 = _"
                say: "Achtzig geteilt durch zehn."
                answer: "8"
              - id: l1-n2
                type: fill_in_blank
                text: "Rechne die beiden Geteiltaufgaben aus."
                say: "Drei mal acht ist vierundzwanzig. Rechne die beiden Geteiltaufgaben aus."
                frame: "3 · 8 = 24 | 24 : 3 = _ | 24 : 8 = _"
                options: ["8", "3", "21"]
                answer: ["8", "3"]
              - id: l1-n3
                type: multiple_choice
                text: "9 : 9 = _"
                say: "Neun geteilt durch neun."
                options: ["1", "9", "0"]
                answer: "1"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 35 : 5 = 7"
                say: "Fünfunddreißig geteilt durch fünf ist sieben. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "16 : 4 = _"
                say: "Sechzehn geteilt durch vier."
                answer: "4"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "20 : 4 = _"
            say: "Zwanzig geteilt durch vier."
            answer: "5"
          - id: l1-c2
            type: text_input
            text: "100 : 10 = _"
            say: "Hundert geteilt durch zehn."
            answer: "10"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? 5 : 5 = 0"
            say: "Fünf geteilt durch fünf ist null. Stimmt das?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Rechne die beiden Geteiltaufgaben aus."
            say: "Zwei mal acht ist sechzehn. Rechne die beiden Geteiltaufgaben aus."
            frame: "2 · 8 = 16 | 16 : 2 = _ | 16 : 8 = _"
            options: ["8", "2", "14"]
            answer: ["8", "2"]
          - id: l1-c5
            type: multiple_choice
            text: "10 : 1 = _"
            say: "Zehn geteilt durch eins."
            options: ["10", "1", "0"]
            answer: "10"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 24 : 3 = 8"
            say: "Vierundzwanzig geteilt durch drei ist acht. Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Geteiltaufgaben mit Probe", en: "Dividing and checking" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: text_input
            text: "50 : 10 = _"
            say: "Fünfzig geteilt durch zehn."
            answer: "5"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "4 : 1 = _"
            say: "Vier geteilt durch eins."
            options: ["4", "1", "0"]
            answer: "4"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "56 : 7 = _ | 7 · 8 = 56 | 56 : 7 = 8"
            say: "Sechsundfünfzig geteilt durch sieben. Welche Aufgabe der Siebenerreihe ergibt sechsundfünfzig? Sieben mal acht. Also ist das Ergebnis acht."
          - text: "63 : 9 = 7 | Probe: 9 · 7 = 63"
            say: "Mach die Probe mit der Malaufgabe. Neun mal sieben ist dreiundsechzig. Das Ergebnis stimmt."
          - text: "48 : 6 = 7? | Probe: 6 · 7 = 42"
            say: "Hier ist ein Fehler. Die Probe zeigt: Sechs mal sieben ist zweiundvierzig, nicht achtundvierzig. Richtig ist acht, denn sechs mal acht ist achtundvierzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Rechne und mach die Probe."
                say: "Zweiundvierzig geteilt durch sieben. Mach dann die Probe."
                frame: "42 : 7 = _ | 7 · _ = 42"
                options: ["6", "7", "5"]
                answer: ["6", "6"]
                hints:
                  - "Welche Aufgabe der Siebenerreihe ergibt zweiundvierzig?"
                  - "Sieben mal sechs ist zweiundvierzig."
                  - "6 und 6."
                difficulty: easy
              - id: l2-f2
                type: text_input
                text: "72 : 8 = _"
                say: "Zweiundsiebzig geteilt durch acht."
                answer: "9"
                hints:
                  - "Acht mal wie viel ist zweiundsiebzig?"
                  - "Acht mal neun ist zweiundsiebzig."
                  - "9."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? 54 : 9 = 7"
                say: "Vierundfünfzig geteilt durch neun ist sieben. Stimmt das?"
                answer: false
                hints:
                  - "Mach die Probe: neun mal sieben."
                  - "Neun mal sieben ist dreiundsechzig, nicht vierundfünfzig."
                  - "Nein. 54 : 9 = 6."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Probe passt zu 36 : 6 = 6?"
                say: "Sechsunddreißig geteilt durch sechs ist sechs. Welche Probe passt?"
                options: ["6 · 6 = 36", "6 + 6 = 12", "36 − 6 = 30"]
                answer: "6 · 6 = 36"
                hints:
                  - "Die Probe ist die Malaufgabe."
                  - "Nimm das Ergebnis mal die Zahl, durch die du geteilt hast."
                  - "6 · 6 = 36."
              - id: l2-f5
                type: text_input
                text: "49 : 7 = _"
                say: "Neunundvierzig geteilt durch sieben."
                answer: "7"
                hints:
                  - "Sieben mal wie viel ist neunundvierzig?"
                  - "Sieben mal sieben ist neunundvierzig."
                  - "7."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Rechne und mach die Probe."
                say: "Vierundsechzig geteilt durch acht. Mach dann die Probe."
                frame: "64 : 8 = _ | 8 · _ = 64"
                options: ["8", "7", "9"]
                answer: ["8", "8"]
                hints: ["Acht mal wie viel ist vierundsechzig?"]
              - id: l2-s2
                type: text_input
                text: "81 : 9 = _"
                say: "Einundachtzig geteilt durch neun."
                answer: "9"
                hints: ["Neun mal wie viel ist einundachtzig?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? 56 : 8 = 7"
                say: "Sechsundfünfzig geteilt durch acht ist sieben. Stimmt das?"
                answer: true
                hints: ["Mach die Probe: acht mal sieben."]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Probe passt zu 45 : 9 = 5?"
                say: "Fünfundvierzig geteilt durch neun ist fünf. Welche Probe passt?"
                options: ["9 · 5 = 45", "45 − 9 = 36", "9 + 5 = 14"]
                answer: "9 · 5 = 45"
                hints: ["Die Probe ist die Malaufgabe."]
              - id: l2-s5
                type: text_input
                text: "28 : 7 = _"
                say: "Achtundzwanzig geteilt durch sieben."
                answer: "4"
                hints: ["Sieben mal wie viel ist achtundzwanzig?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Rechne und mach die Probe."
                say: "Dreiundsechzig geteilt durch sieben. Mach dann die Probe."
                frame: "63 : 7 = _ | 7 · _ = 63"
                options: ["9", "8", "7"]
                answer: ["9", "9"]
              - id: l2-n2
                type: text_input
                text: "24 : 8 = _"
                say: "Vierundzwanzig geteilt durch acht."
                answer: "3"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? 72 : 9 = 9"
                say: "Zweiundsiebzig geteilt durch neun ist neun. Stimmt das?"
                answer: false
              - id: l2-n4
                type: multiple_choice
                text: "Welche Probe passt zu 48 : 8 = 6?"
                say: "Achtundvierzig geteilt durch acht ist sechs. Welche Probe passt?"
                options: ["8 · 6 = 48", "48 − 8 = 40", "8 + 6 = 14"]
                answer: "8 · 6 = 48"
              - id: l2-n5
                type: text_input
                text: "36 : 9 = _"
                say: "Sechsunddreißig geteilt durch neun."
                answer: "4"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: big
            type: text_input
            text: "54 : 6 = _"
            say: "Vierundfünfzig geteilt durch sechs."
            answer: "9"
          - id: l2-c2
            part: big
            type: text_input
            text: "32 : 8 = _"
            say: "Zweiunddreißig geteilt durch acht."
            answer: "4"
          - id: l2-c3
            part: probe
            type: fill_in_blank
            text: "Rechne und mach die Probe."
            say: "Zweiundvierzig geteilt durch sechs. Mach dann die Probe."
            frame: "42 : 6 = _ | 6 · _ = 42"
            options: ["7", "6", "8"]
            answer: ["7", "7"]
          - id: l2-c4
            part: probe
            type: true_false
            text: "Stimmt das? 64 : 8 = 9"
            say: "Vierundsechzig geteilt durch acht ist neun. Stimmt das?"
            answer: false
          - id: l2-c5
            part: probe
            type: multiple_choice
            text: "Welche Probe passt zu 28 : 4 = 7?"
            say: "Achtundzwanzig geteilt durch vier ist sieben. Welche Probe passt?"
            options: ["4 · 7 = 28", "28 − 4 = 24", "4 + 7 = 11"]
            answer: "4 · 7 = 28"
          - id: l2-c6
            part: big
            type: text_input
            text: "35 : 7 = _"
            say: "Fünfunddreißig geteilt durch sieben."
            answer: "5"
          - id: l2-c7
            part: big
            type: multiple_choice
            text: "48 : 6 = _"
            say: "Achtundvierzig geteilt durch sechs."
            options: ["8", "7", "9"]
            answer: "8"
          - id: l2-c8
            part: big
            type: fill_in_blank
            text: "Rechne die beiden Geteiltaufgaben aus."
            say: "Sieben mal acht ist sechsundfünfzig. Rechne die beiden Geteiltaufgaben aus."
            frame: "7 · 8 = 56 | 56 : 7 = _ | 56 : 8 = _"
            options: ["8", "7", "49"]
            answer: ["8", "7"]
          - id: l2-c9
            part: small
            type: text_input
            text: "18 : 3 = _"
            say: "Achtzehn geteilt durch drei."
            answer: "6"
          - id: l2-c10
            part: small
            type: text_input
            text: "45 : 5 = _"
            say: "Fünfundvierzig geteilt durch fünf."
            answer: "9"
          - id: l2-c11
            part: small
            type: true_false
            text: "Stimmt das? 32 : 4 = 8"
            say: "Zweiunddreißig geteilt durch vier ist acht. Stimmt das?"
            answer: true
          - id: l2-c12
            part: small
            type: multiple_choice
            text: "60 : 10 = _"
            say: "Sechzig geteilt durch zehn."
            options: ["6", "5", "10"]
            answer: "6"
          - id: l2-c13
            part: small
            type: fill_in_blank
            text: "Rechne die beiden Geteiltaufgaben aus."
            say: "Drei mal sieben ist einundzwanzig. Rechne die beiden Geteiltaufgaben aus."
            frame: "3 · 7 = 21 | 21 : 3 = _ | 21 : 7 = _"
            options: ["7", "3", "18"]
            answer: ["7", "3"]
          - id: l2-c14
            part: rules
            type: multiple_choice
            text: "6 : 6 = _"
            say: "Sechs geteilt durch sechs."
            options: ["1", "0", "6"]
            answer: "1"
          - id: l2-c15
            part: rules
            type: text_input
            text: "9 : 1 = _"
            say: "Neun geteilt durch eins."
            answer: "9"
          - id: l2-c16
            part: rules
            type: true_false
            text: "Stimmt das? 8 : 1 = 8"
            say: "Acht geteilt durch eins ist acht. Stimmt das?"
            answer: true
          - id: l2-c17
            part: rules
            type: true_false
            text: "Stimmt das? 4 : 4 = 4"
            say: "Vier geteilt durch vier ist vier. Stimmt das?"
            answer: false
          - id: l2-c18
            part: rules
            type: fill_in_blank
            text: "Welche Zahl fehlt?"
            say: "Drei geteilt durch wie viel ist eins?"
            frame: "3 : _ = 1"
            options: ["1", "3", "0"]
            answer: ["3"]
          - id: l2-c19
            part: probe
            type: multiple_choice
            text: "Welche Probe passt zu 40 : 8 = 5?"
            say: "Vierzig geteilt durch acht ist fünf. Welche Probe passt?"
            options: ["8 · 5 = 40", "40 − 8 = 32", "8 + 5 = 13"]
            answer: "8 · 5 = 40"
          - id: l2-c20
            part: probe
            type: multiple_choice
            text: "Ben rechnet 27 : 3 = 8. Seine Probe: 3 · 8 = 24. Was stimmt?"
            say: "Ben rechnet siebenundzwanzig geteilt durch drei ist acht. Seine Probe: drei mal acht ist vierundzwanzig. Was stimmt?"
            options: ["Bens Ergebnis ist falsch.", "Bens Ergebnis ist richtig."]
            answer: "Bens Ergebnis ist falsch."
            keep_order: true
