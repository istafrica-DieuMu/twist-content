# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.check
skill: math.add-sub-to-100.check
curriculum: de-DE
language: de
title:
  de: Rechnungen prüfen
  en: Checking calculations
summary: >
  Checking a result with the Umkehraufgabe and with an estimate
  (Überschlag), then
  finding and explaining mistakes in worked calculations. Lesson 1 checks
  minus with plus and estimates by rounding to tens; lesson 2 finds the
  forgotten ten, wrongly added ones, the swapped ones, a ten not taken
  away and the wrong operation, puts them right,
  and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.sub-two-digit]
  also_practises: [math.add-sub-to-100.add-two-digit]
  vocabulary: { de: [prüfen, Umkehraufgabe, Überschlag, ungefähr, Fehler] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: inverse, what: { de: mit der Umkehraufgabe prüfen, en: checking with the inverse } }
    - { id: estimate, what: { de: mit einem Überschlag prüfen, en: checking with an estimate } }
    - { id: mistakes, what: { de: Fehler in Rechnungen finden und erklären, en: finding and explaining mistakes in calculations } }
  misconceptions:
    - id: inverse-wrong-start
      what: Builds the inverse from the first number (64 + 28 to check 64 − 28 = 36)
      addressed: Learn starts the Umkehraufgabe from the result; full-stage feedback and hints say so
    - id: trusts-any-result
      what: Does not notice a result that is far off
      addressed: Überschlag tasks in lesson 1; "Welche Rechnung ist falsch?" in each stage of lesson 2
    - id: forgets-carried-ten
      what: Adds tens and ones separately and drops the new ten from the ones (36 + 47 = 73)
      addressed: lesson 2 Learn works it through stellenweise; error tasks in the full stage and the skill check name it
    - id: swaps-ones
      what: Subtracts the smaller ones digit from the larger (72 − 35 = 43)
      addressed: lesson 2 Learn shows it and the right steps; error tasks in the full and none stages
    - id: ten-not-taken-away
      what: Takes away the ones across the ten but leaves a ten too many (64 − 28 = 46)
      addressed: lesson 2 Learn works it in steps; an error task in the some stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Umkehraufgabe und Überschlag, en: Inverse and estimate }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "45 + 30 = _"
            answer: "75"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "72 − 30 = _"
            answer: "42"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "72 − 35 = 37"
            say: "Lina rechnet zweiundsiebzig minus fünfunddreißig und bekommt siebenunddreißig. Stimmt das? Mit der Umkehraufgabe kannst du es prüfen."
          - text: "37 + 35 = 72"
            say: "Die Umkehraufgabe von minus ist plus, und sie fängt mit dem Ergebnis an: siebenunddreißig plus fünfunddreißig. Kommt wieder zweiundsiebzig heraus, war die Rechnung richtig. Eine Plusaufgabe prüfst du genauso mit minus."
          - text: "48 + 29 ≈ 50 + 30 = 80"
            say: "Ein Überschlag ist schnelles Ungefähr-Rechnen. Achtundvierzig ist ungefähr fünfzig, neunundzwanzig ist ungefähr dreißig. Das Ergebnis muss also in der Nähe von achtzig liegen."
          - text: "48 + 29 = 77"
            say: "Genau sind es siebenundsiebzig. Das liegt nahe bei achtzig, also passt es. Stünde da siebenundfünfzig, wüsstest du sofort: Da stimmt etwas nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Umkehraufgabe prüft 64 − 28 = 36?"
                options: ["36 + 28 = 64", "64 + 28 = 92", "36 − 28 = 8"]
                answer: "36 + 28 = 64"
                feedback:
                  "64 + 28 = 92": "Die Umkehraufgabe fängt mit dem Ergebnis an: 36 + 28."
                  "36 − 28 = 8": "Die Umkehraufgabe von minus ist plus."
                hints:
                  - "Die Umkehraufgabe von minus ist plus."
                  - "Fang mit dem Ergebnis 36 an."
                  - "36 + 28 = 64."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Prüfe mit der Umkehraufgabe."
                say: "Ben rechnet dreiundfünfzig minus siebenundzwanzig gleich sechsundzwanzig. Prüfe mit der Umkehraufgabe."
                frame: "26 + 27 = _"
                options: ["43", "53", "63"]
                answer: ["53"]
                hints:
                  - "Rechne 26 plus 27."
                  - "26 + 20 = 46, dann noch 7 dazu."
                  - "53. Bens Rechnung stimmt."
              - id: l1-f3
                type: true_false
                text: "Stimmt 81 − 46 = 45?"
                say: "Mia rechnet einundachtzig minus sechsundvierzig gleich fünfundvierzig. Prüfe mit der Umkehraufgabe fünfundvierzig plus sechsundvierzig. Stimmt Mias Rechnung?"
                answer: false
                hints:
                  - "Rechne 45 + 46."
                  - "45 + 46 = 91, nicht 81."
                  - "Nein, die Rechnung stimmt nicht."
              - id: l1-f4
                type: multiple_choice
                text: "Ungefähr wie viel ist 39 + 42?"
                options: ["60", "80", "100"]
                answer: "80"
                hints:
                  - "39 ist ungefähr 40."
                  - "42 ist auch ungefähr 40."
                  - "40 + 40 = 80."
              - id: l1-f5
                type: multiple_choice
                text: "Mach einen Überschlag. Welches Ergebnis kann stimmen? 61 + 28"
                say: "Mach einen Überschlag. Welches Ergebnis kann für einundsechzig plus achtundzwanzig stimmen?"
                options: ["69", "89", "99"]
                answer: "89"
                feedback:
                  "69": "61 + 28 ist ungefähr 60 + 30, also 90. 69 ist zu klein."
                hints:
                  - "61 ist ungefähr 60, 28 ist ungefähr 30."
                  - "Das Ergebnis liegt in der Nähe von 90."
                  - "89."
              - id: l1-f6
                type: multiple_choice
                text: "Welche Umkehraufgabe prüft 38 + 45 = 83?"
                options: ["83 − 45 = 38", "45 − 38 = 7", "83 + 45 = 128"]
                answer: "83 − 45 = 38"
                feedback:
                  "83 + 45 = 128": "Die Umkehraufgabe von plus ist minus."
                  "45 − 38 = 7": "Die Umkehraufgabe fängt mit dem Ergebnis an: 83 − 45."
                hints:
                  - "Die Umkehraufgabe von plus ist minus."
                  - "Fang mit dem Ergebnis 83 an."
                  - "83 − 45 = 38."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Umkehraufgabe prüft 90 − 34 = 56?"
                options: ["56 + 34 = 90", "90 + 34 = 124", "56 − 34 = 22"]
                answer: "56 + 34 = 90"
                hints: ["Fang mit dem Ergebnis an."]
              - id: l1-s2
                type: fill_in_blank
                text: "Prüfe mit der Umkehraufgabe."
                say: "Ali rechnet fünfundsiebzig minus achtunddreißig gleich siebenunddreißig. Prüfe mit der Umkehraufgabe."
                frame: "37 + 38 = _"
                options: ["65", "75", "85"]
                answer: ["75"]
                hints: ["Erst 37 + 30, dann noch 8 dazu."]
              - id: l1-s3
                type: true_false
                text: "Prüfe mit der Umkehraufgabe. Stimmt 62 − 25 = 47?"
                say: "Prüfe mit der Umkehraufgabe. Stimmt zweiundsechzig minus fünfundzwanzig gleich siebenundvierzig?"
                answer: false
                hints: ["Rechne 47 + 25 und vergleiche mit 62."]
              - id: l1-s4
                type: multiple_choice
                text: "Ungefähr wie viel ist 71 − 29?"
                options: ["30", "40", "50"]
                answer: "40"
                hints: ["Runde beide Zahlen auf den nächsten Zehner."]
              - id: l1-s5
                type: multiple_choice
                text: "Mach einen Überschlag. Welches Ergebnis kann stimmen? 47 + 33"
                say: "Mach einen Überschlag. Welches Ergebnis kann für siebenundvierzig plus dreiunddreißig stimmen?"
                options: ["68", "80", "96"]
                answer: "80"
                hints: ["47 ist ungefähr 50, 33 ist ungefähr 30."]
              - id: l1-s6
                type: true_false
                text: "Mach einen Überschlag. Kann 88 − 41 = 47 stimmen?"
                say: "Mach einen Überschlag. Kann achtundachtzig minus einundvierzig gleich siebenundvierzig stimmen?"
                answer: true
                hints: ["88 ist ungefähr 90, 41 ist ungefähr 40."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Umkehraufgabe prüft 45 + 37 = 82?"
                options: ["82 − 37 = 45", "45 − 37 = 8", "82 + 37 = 119"]
                answer: "82 − 37 = 45"
              - id: l1-n2
                type: fill_in_blank
                text: "Prüfe mit der Umkehraufgabe."
                say: "Tom rechnet vierundneunzig minus sechsundfünfzig gleich achtunddreißig. Prüfe mit der Umkehraufgabe."
                frame: "38 + 56 = _"
                options: ["84", "94", "104"]
                answer: ["94"]
              - id: l1-n3
                type: multiple_choice
                text: "Ungefähr wie viel ist 58 + 31?"
                options: ["70", "90", "110"]
                answer: "90"
              - id: l1-n4
                type: true_false
                text: "Mach einen Überschlag. Kann 69 + 22 = 61 stimmen?"
                say: "Mach einen Überschlag. Kann neunundsechzig plus zweiundzwanzig gleich einundsechzig stimmen?"
                answer: false
              - id: l1-n5
                type: true_false
                text: "Prüfe mit der Umkehraufgabe. Stimmt 83 − 47 = 36?"
                say: "Prüfe mit der Umkehraufgabe. Stimmt dreiundachtzig minus siebenundvierzig gleich sechsunddreißig?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Umkehraufgabe prüft 70 − 26 = 44?"
            say: "Welche Umkehraufgabe prüft siebzig minus sechsundzwanzig gleich vierundvierzig?"
            options: ["44 + 26 = 70", "70 + 26 = 96", "44 − 26 = 18"]
            answer: "44 + 26 = 70"
          - id: l1-c2
            type: multiple_choice
            text: "Ungefähr wie viel ist 49 + 18?"
            say: "Ungefähr wie viel ist neunundvierzig plus achtzehn?"
            options: ["50", "70", "90"]
            answer: "70"
          - id: l1-c3
            type: true_false
            text: "Stimmt 91 − 55 = 46?"
            say: "Stimmt einundneunzig minus fünfundfünfzig gleich sechsundvierzig?"
            answer: false
          - id: l1-c4
            type: fill_in_blank
            text: "Jana rechnet 65 − 29 = 36. Prüfe mit der Umkehraufgabe."
            say: "Jana rechnet fünfundsechzig minus neunundzwanzig gleich sechsunddreißig. Prüfe mit der Umkehraufgabe."
            frame: "36 + 29 = _"
            options: ["55", "65", "75"]
            answer: ["65"]
          - id: l1-c5
            type: multiple_choice
            text: "Ungefähr wie viel ist 68 + 21?"
            say: "Ungefähr wie viel ist achtundsechzig plus einundzwanzig?"
            options: ["50", "70", "90"]
            answer: "90"
          - id: l1-c6
            type: true_false
            text: "Kann 79 − 41 = 38 stimmen?"
            say: "Kann neunundsiebzig minus einundvierzig gleich achtunddreißig stimmen?"
            answer: true

  - n: 2
    title: { de: Fehler finden, en: Finding mistakes }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ungefähr wie viel ist 38 + 41?"
            options: ["60", "80", "100"]
            answer: "80"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt 54 − 18 = 36?"
            say: "Stimmt vierundfünfzig minus achtzehn gleich sechsunddreißig?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "45 + 38 = 73"
            say: "Tim hat fünfundvierzig plus achtunddreißig gerechnet. Hier stimmt etwas nicht. Überschlag: ungefähr fünfzig plus vierzig, also neunzig. Dreiundsiebzig ist zu klein. Stellenweise: vierzig plus dreißig gleich siebzig, fünf plus acht gleich dreizehn, zusammen dreiundachtzig. Aus den Einern ist ein neuer Zehner entstanden. Den hat Tim vergessen."
          - text: "72 − 35 = 43"
            say: "Und hier? Tim hat bei den Einern fünf minus zwei gerechnet. Er muss aber fünf von zweiundvierzig wegnehmen: erst zwei bis vierzig, dann noch drei. Richtig ist: zweiundsiebzig minus dreißig gleich zweiundvierzig, minus fünf gleich siebenunddreißig."
          - text: "64 − 28 = 46"
            say: "Und hier? In Schritten: vierundsechzig minus zwanzig gleich vierundvierzig, minus acht gleich sechsunddreißig. Bei sechsundvierzig hat Tim einen Zehner zu wenig abgezogen."
          - text: "63 − 8 = 71"
            say: "Und hier hat Tim plus statt minus gerechnet. Bei minus muss das Ergebnis kleiner werden. Richtig ist fünfundfünfzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was ist der Fehler? 36 + 47 = 73"
                options: ["Der Zehner aus den Einern fehlt.", "Es wurde minus statt plus gerechnet.", "Die Einer sind falsch addiert."]
                answer: "Der Zehner aus den Einern fehlt."
                feedback:
                  "Es wurde minus statt plus gerechnet.": "Bei minus wäre das Ergebnis viel kleiner als 73. Schau auf die Einer: 6 + 7 = 13."
                  "Die Einer sind falsch addiert.": "6 + 7 = 13, und hinten steht eine 3. Die Einer stimmen; der Zehner aus der 13 fehlt."
                hints:
                  - "Rechne stellenweise: 30 + 40 und 6 + 7."
                  - "6 + 7 = 13: Das ist ein neuer Zehner."
                  - "Der Zehner aus den Einern fehlt. Richtig ist 83."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was ist der Fehler? 84 − 27 = 63"
                options: ["Bei den Einern wurde 7 − 4 gerechnet.", "Es wurde plus statt minus gerechnet.", "Ein Zehner wurde zu wenig abgezogen."]
                answer: "Bei den Einern wurde 7 − 4 gerechnet."
                hints:
                  - "Rechne in Schritten: 84 − 20 = 64, dann noch 7 weg."
                  - "64 − 7 ist 57, nicht 63."
                  - "Bei den Einern wurde 7 − 4 gerechnet. Du musst aber 7 von 64 wegnehmen: erst 4 bis 60, dann noch 3. Richtig ist 57."
              - id: l2-f3
                type: fill_in_blank
                text: "Rechne richtig: 36 + 47"
                say: "Rechne sechsunddreißig plus siebenundvierzig noch einmal, stellenweise."
                frame: "30 + 40 = _ | 6 + 7 = _ | 36 + 47 = _"
                options: ["70", "13", "73", "83"]
                answer: ["70", "13", "83"]
                hints:
                  - "Erst die Zehner, dann die Einer."
                  - "70 und 13."
                  - "70 + 13 = 83."
              - id: l2-f4
                type: true_false
                text: "Stimmt 55 − 9 = 64?"
                say: "Stimmt fünfundfünfzig minus neun gleich vierundsechzig?"
                answer: false
                feedback:
                  "true": "Bei minus wird es weniger. 64 ist mehr als 55."
                hints:
                  - "Wird es bei minus mehr oder weniger?"
                  - "64 ist größer als 55."
                  - "Nein, hier wurde plus statt minus gerechnet. 55 − 9 = 46."
              - id: l2-f5
                type: multiple_choice
                text: "Welche Rechnung ist falsch?"
                options: ["58 + 24 = 72", "46 + 13 = 59", "70 − 25 = 45"]
                answer: "58 + 24 = 72"
                hints:
                  - "Mach für jede Rechnung einen Überschlag."
                  - "58 + 24 ist ungefähr 60 + 20."
                  - "58 + 24 = 82, nicht 72."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was ist der Fehler? 35 + 24 = 58"
                options: ["Der Zehner aus den Einern fehlt.", "Es wurde minus statt plus gerechnet.", "Die Einer sind falsch addiert."]
                answer: "Die Einer sind falsch addiert."
                hints: ["Rechne Zehner und Einer getrennt nach."]
              - id: l2-s2
                type: multiple_choice
                text: "Was ist der Fehler? 73 − 36 = 47"
                options: ["Bei den Einern wurde 6 − 3 gerechnet.", "Es wurde plus statt minus gerechnet.", "Ein Zehner wurde zu wenig abgezogen."]
                answer: "Ein Zehner wurde zu wenig abgezogen."
                hints: ["Rechne in Schritten: erst minus 30, dann minus 6."]
              - id: l2-s3
                type: text_input
                text: "Rechne richtig: 73 − 36 = _"
                answer: "37"
                hints: ["Erst 73 − 30, dann noch 6 weg."]
              - id: l2-s4
                type: true_false
                text: "Stimmt 47 − 6 = 53?"
                say: "Stimmt siebenundvierzig minus sechs gleich dreiundfünfzig?"
                answer: false
                hints: ["Wird es bei minus mehr oder weniger?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welche Rechnung ist falsch?"
                options: ["39 + 26 = 65", "73 − 28 = 55", "50 + 34 = 84"]
                answer: "73 − 28 = 55"
                hints: ["Prüf jede Rechnung mit Überschlag oder Umkehraufgabe."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Was ist der Fehler? 36 + 7 = 29"
                options: ["Der Zehner aus den Einern fehlt.", "Es wurde minus statt plus gerechnet.", "Die Einer sind falsch addiert."]
                answer: "Es wurde minus statt plus gerechnet."
              - id: l2-n2
                type: multiple_choice
                text: "Was ist der Fehler? 92 − 47 = 55"
                options: ["Bei den Einern wurde 7 − 2 gerechnet.", "Es wurde plus statt minus gerechnet.", "Ein Zehner wurde zu wenig abgezogen."]
                answer: "Bei den Einern wurde 7 − 2 gerechnet."
              - id: l2-n3
                type: text_input
                text: "Rechne richtig: 92 − 47 = _"
                answer: "45"
              - id: l2-n4
                type: true_false
                text: "Stimmt 72 + 8 = 64?"
                say: "Stimmt zweiundsiebzig plus acht gleich vierundsechzig?"
                answer: false
              - id: l2-n5
                type: multiple_choice
                text: "Welche Rechnung ist falsch?"
                options: ["66 + 17 = 73", "44 + 38 = 82", "90 − 36 = 54"]
                answer: "66 + 17 = 73"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: inverse
            type: multiple_choice
            text: "Welche Umkehraufgabe prüft 85 − 49 = 36?"
            say: "Welche Umkehraufgabe prüft fünfundachtzig minus neunundvierzig gleich sechsunddreißig?"
            options: ["36 + 49 = 85", "85 + 49 = 134", "49 − 36 = 13"]
            answer: "36 + 49 = 85"
          - id: l2-c2
            part: estimate
            type: multiple_choice
            text: "Ungefähr wie viel ist 62 + 27?"
            say: "Ungefähr wie viel ist zweiundsechzig plus siebenundzwanzig?"
            options: ["70", "90", "110"]
            answer: "90"
          - id: l2-c3
            part: mistakes
            type: multiple_choice
            text: "Was ist der Fehler? 48 + 36 = 74"
            say: "Achtundvierzig plus sechsunddreißig gleich vierundsiebzig. Was ist der Fehler?"
            options: ["Der Zehner aus den Einern fehlt.", "Es wurde minus statt plus gerechnet.", "Die Einer sind falsch addiert."]
            answer: "Der Zehner aus den Einern fehlt."
          - id: l2-c4
            part: mistakes
            type: multiple_choice
            text: "Was ist der Fehler? 53 − 6 = 59"
            say: "Dreiundfünfzig minus sechs gleich neunundfünfzig. Was ist der Fehler?"
            options: ["Bei den Einern wurde 6 − 3 gerechnet.", "Es wurde plus statt minus gerechnet.", "Ein Zehner wurde zu wenig abgezogen."]
            answer: "Es wurde plus statt minus gerechnet."
          - id: l2-c5
            part: inverse
            type: true_false
            text: "Stimmt 100 − 63 = 37?"
            say: "Stimmt hundert minus dreiundsechzig gleich siebenunddreißig?"
            answer: true
          - id: l2-c6
            part: inverse
            type: multiple_choice
            text: "Welche Umkehraufgabe prüft 61 − 34 = 27?"
            say: "Welche Umkehraufgabe prüft einundsechzig minus vierunddreißig gleich siebenundzwanzig?"
            options: ["27 + 34 = 61", "61 + 34 = 95", "34 − 27 = 7"]
            answer: "27 + 34 = 61"
          - id: l2-c7
            part: inverse
            type: multiple_choice
            text: "Welche Umkehraufgabe prüft 29 + 54 = 83?"
            say: "Welche Umkehraufgabe prüft neunundzwanzig plus vierundfünfzig gleich dreiundachtzig?"
            options: ["83 − 54 = 29", "54 − 29 = 25", "83 + 54 = 137"]
            answer: "83 − 54 = 29"
          - id: l2-c8
            part: inverse
            type: fill_in_blank
            text: "Emma rechnet 80 − 47 = 33. Prüfe mit der Umkehraufgabe."
            say: "Emma rechnet achtzig minus siebenundvierzig gleich dreiunddreißig. Prüfe mit der Umkehraufgabe."
            frame: "33 + 47 = _"
            options: ["70", "80", "90"]
            answer: ["80"]
          - id: l2-c9
            part: inverse
            type: true_false
            text: "Stimmt 76 − 39 = 37?"
            say: "Stimmt sechsundsiebzig minus neununddreißig gleich siebenunddreißig?"
            answer: true
          - id: l2-c10
            part: inverse
            type: true_false
            text: "Stimmt 95 − 58 = 47?"
            say: "Stimmt fünfundneunzig minus achtundfünfzig gleich siebenundvierzig?"
            answer: false
          - id: l2-c11
            part: estimate
            type: multiple_choice
            text: "Ungefähr wie viel ist 51 + 38?"
            say: "Ungefähr wie viel ist einundfünfzig plus achtunddreißig?"
            options: ["50", "70", "90"]
            answer: "90"
          - id: l2-c12
            part: estimate
            type: multiple_choice
            text: "Ungefähr wie viel ist 82 − 39?"
            say: "Ungefähr wie viel ist zweiundachtzig minus neununddreißig?"
            options: ["20", "40", "60"]
            answer: "40"
          - id: l2-c13
            part: estimate
            type: multiple_choice
            text: "Welches Ergebnis kann stimmen? 38 + 43"
            say: "Welches Ergebnis kann für achtunddreißig plus dreiundvierzig stimmen?"
            options: ["41", "61", "81"]
            answer: "81"
          - id: l2-c14
            part: estimate
            type: true_false
            text: "Kann 47 + 48 = 75 stimmen?"
            say: "Kann siebenundvierzig plus achtundvierzig gleich fünfundsiebzig stimmen?"
            answer: false
          - id: l2-c15
            part: estimate
            type: true_false
