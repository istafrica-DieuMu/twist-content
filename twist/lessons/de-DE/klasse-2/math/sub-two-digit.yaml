# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.sub-two-digit
skill: math.add-sub-to-100.sub-two-digit
curriculum: de-DE
language: de
title:
  de: Zweistellige Zahlen subtrahieren
  en: Subtracting two-digit numbers
summary: >
  Subtracting a two-digit number from another in two ways. Lesson 1 takes
  away in steps on the Rechenstrich: first the tens, then the ones, across
  a ten when needed. Lesson 2 counts up from the smaller number (ergänzen),
  says when that is the quicker way, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.complement]
  also_practises: [math.add-sub-to-100.complement]
  vocabulary: { de: [abziehen, schrittweise, ergänzen, Rechenweg, Zehnerübergang, Abstand] }
  forms: [drawn, text, audio]
  drawn: [rechenstrich]
  facets: []
  parts:
    - { id: result, what: { de: "zweistellige Zahlen subtrahieren, auch über den Zehner", en: "subtracting two-digit numbers, also across a ten" } }
    - { id: steps, what: { de: "schrittweise abziehen: erst die Zehner, dann die Einer", en: "taking away in steps: tens first, then ones" } }
    - { id: complement, what: { de: durch Ergänzen subtrahieren, en: subtracting by counting up } }
    - { id: choose, what: { de: den passenden Rechenweg wählen, en: choosing a good way to work it out } }
  misconceptions:
    - id: smaller-from-larger-digit
      what: Takes the smaller ones digit from the larger, whichever number it belongs to (81 − 46 = 45)
      addressed: lesson 1 Learn says the ones are taken from the whole number, not digit from digit; 45-type answers are options with feedback in the full stage
    - id: stops-at-ten
      what: Takes the ones only down to the ten and stops (63 − 27 as 43 − 3 = 40)
      addressed: full-stage hints split the ones across the ten (erst bis 40, dann noch 4)
    - id: ergaenzen-answer
      what: When counting up, gives the end number instead of the distance (81 − 76 = 81)
      addressed: lesson 2 Learn adds the jumps and says the answer is how far it is; full-stage frames write the jumps down before the result
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Abziehen in Schritten, en: Taking away in steps }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: text_input
            text: "72 − 30 = _"
            say: "Zweiundsiebzig minus dreißig."
            answer: "42"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "43 − 6 = _"
            say: "Dreiundvierzig minus sechs."
            answer: "37"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "72 − 35"
            say: "Zweiundsiebzig minus fünfunddreißig. Wir ziehen schrittweise ab: erst die Zehner, dann die Einer."
            show: { drawn: rechenstrich, start: 72, jumps: [-30, -5] }
          - text: "72 − 30 = 42"
            say: "Erst springen wir drei Zehner zurück. Zweiundsiebzig minus dreißig ist zweiundvierzig."
          - text: "42 − 5 = 37"
            say: "Dann die Einer: zweiundvierzig minus fünf. Erst zwei weg bis vierzig, dann noch drei: siebenunddreißig."
          - text: "72 − 35 = 37"
            say: "Pass auf: Rechne bei den Einern nicht fünf minus zwei. Du nimmst fünf von zweiundvierzig weg."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Zieh schrittweise ab."
                say: "Sechsundachtzig minus vierundzwanzig. Erst die Zehner, dann die Einer."
                frame: "86 − 24 | 86 − 20 = _ | _ − 4 = _"
                options: ["62", "66", "60"]
                answer: ["66", "66", "62"]
                hints:
                  - "Erst die Zehner: 86 − 20 = 66."
                  - "Dann noch die 4 Einer weg."
                  - "66 − 4 = 62."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "63 − 27 = ?"
                say: "Dreiundsechzig minus siebenundzwanzig."
                show: { drawn: rechenstrich, start: 63, jumps: [-20, -7] }
                options: ["36", "44", "40"]
                answer: "36"
                feedback:
                  "44": "Du hast bei den Einern 7 − 3 gerechnet. Nimm 7 von 43 weg: erst 3 bis 40, dann noch 4."
                  "40": "Du bist bei 40 stehen geblieben. Von den 7 Einern fehlen noch 4."
                hints:
                  - "Erst 63 − 20."
                  - "43 − 7: erst 3 bis 40, dann noch 4."
                  - "36."
              - id: l1-f3
                type: fill_in_blank
                text: "Zieh schrittweise ab."
                frame: "54 − 28 | 54 − 20 = _ | _ − 8 = _"
                options: ["26", "34", "36"]
                answer: ["34", "34", "26"]
                hints:
                  - "54 − 20 = 34."
                  - "34 − 8: erst 4 bis 30, dann noch 4."
                  - "26."
              - id: l1-f4
                type: text_input
                text: "95 − 43 = _"
                say: "Fünfundneunzig minus dreiundvierzig."
                answer: "52"
                hints:
                  - "95 − 40 = 55."
                  - "55 − 3."
                  - "52."
              - id: l1-f5
                type: multiple_choice
                text: "81 − 46 = ?"
                say: "Einundachtzig minus sechsundvierzig."
                options: ["35", "45", "25"]
                answer: "35"
                feedback:
                  "45": "Bei den Einern hast du 6 − 1 gerechnet. Nimm 6 von 41 weg: erst 1 bis 40, dann noch 5."
                hints:
                  - "81 − 40 = 41."
                  - "41 − 6: erst 1 bis 40, dann noch 5."
                  - "35."
              - id: l1-f6
                type: true_false
                text: "Stimmt das? 70 − 26 = 44"
                say: "Siebzig minus sechsundzwanzig gleich vierundvierzig. Stimmt das?"
                answer: true
                hints:
                  - "70 − 20 = 50."
                  - "50 − 6."
                  - "Ja, 44."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Zieh schrittweise ab."
                frame: "67 − 35 | 67 − 30 = _ | _ − 5 = _"
                options: ["32", "37", "42"]
                answer: ["37", "37", "32"]
                hints: ["Erst die Zehner weg, dann die Einer."]
              - id: l1-s2
                type: multiple_choice
                text: "52 − 17 = ?"
                options: ["35", "45", "25"]
                answer: "35"
                hints: ["52 − 10 = 42. Bei 42 − 7 musst du über die 40 zurück."]
              - id: l1-s3
                type: text_input
                text: "78 − 52 = _"
                answer: "26"
                hints: ["Nimm zuerst die Zehner weg."]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? 64 − 29 = 45"
                say: "Vierundsechzig minus neunundzwanzig gleich fünfundvierzig. Stimmt das?"
                answer: false
                hints: ["Rechne 64 − 20, dann die Einer."]
              - id: l1-s5
                type: multiple_choice
                text: "91 − 45: Welcher Sprung kommt zuerst?"
                say: "Du rechnest einundneunzig minus fünfundvierzig schrittweise, erst die Zehner. Welcher Sprung kommt zuerst?"
                options: ["−40", "−5", "−4"]
                answer: "−40"
                hints: ["Schrittweise heißt: erst die Zehner."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Zieh schrittweise ab."
                frame: "93 − 57 | 93 − 50 = _ | _ − 7 = _"
                options: ["36", "43", "46"]
                answer: ["43", "43", "36"]
              - id: l1-n2
                type: text_input
                text: "48 − 23 = _"
                answer: "25"
              - id: l1-n3
                type: multiple_choice
                text: "75 − 38 = ?"
                options: ["37", "43", "47"]
                answer: "37"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? 60 − 34 = 26"
                say: "Sechzig minus vierunddreißig gleich sechsundzwanzig. Stimmt das?"
                answer: true
              - id: l1-n5
                type: text_input
                text: "82 − 65 = _"
                answer: "17"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            text: "89 − 46 = _"
            answer: "43"
          - id: l1-c2
            type: multiple_choice
            text: "71 − 25 = ?"
            options: ["46", "54", "56"]
            answer: "46"
          - id: l1-c3
            type: fill_in_blank
            text: "Zieh schrittweise ab."
            frame: "56 − 39 | 56 − 30 = _ | _ − 9 = _"
            options: ["17", "26", "23"]
            answer: ["26", "26", "17"]
          - id: l1-c4
            type: text_input
            text: "65 − 32 = _"
            say: "Fünfundsechzig minus zweiunddreißig."
            answer: "33"
          - id: l1-c5
            type: multiple_choice
            text: "93 − 48 = ?"
            say: "Dreiundneunzig minus achtundvierzig."
            options: ["45", "55", "50"]
            answer: "45"
          - id: l1-c6
            type: true_false
            text: "Stimmt das? 80 − 47 = 33"
            say: "Achtzig minus siebenundvierzig gleich dreiunddreißig. Stimmt das?"
            answer: true

  - n: 2
    title: { de: Ergänzen, en: Counting up }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l2-w1
            type: text_input
            text: "37 + _ = 40"
            answer: "3"
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "64 + _ = 100"
            answer: "36"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "72 − 65"
            say: "Zweiundsiebzig minus fünfundsechzig. Die Zahlen liegen nah beieinander. Da ist Ergänzen leichter: Wie viel fehlt von fünfundsechzig bis zweiundsiebzig?"
            show: { drawn: rechenstrich, start: 65, jumps: [5, 2] }
          - text: "65 + 5 = 70\n70 + 2 = 72"
            say: "Von fünfundsechzig bis siebzig sind es fünf, von siebzig bis zweiundsiebzig noch zwei. Zusammen sind das sieben."
          - text: "72 − 65 = 7"
            say: "Also ist zweiundsiebzig minus fünfundsechzig gleich sieben. Die Antwort ist der Abstand, nicht die Zahl, bei der du ankommst."
          - text: "35 + _ = 72"
            say: "Es geht auch bei größerem Abstand: Von fünfunddreißig bis vierzig sind es fünf, von vierzig bis zweiundsiebzig noch zweiunddreißig. Zusammen siebenunddreißig."
            show: { drawn: rechenstrich, start: 35, jumps: [5, 32] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Ergänze: 53 − 48"
                say: "Dreiundfünfzig minus achtundvierzig. Ergänze von achtundvierzig bis dreiundfünfzig."
                frame: "48 + _ = 50 | 50 + _ = 53 | 53 − 48 = _"
                options: ["2", "3", "5", "1"]
                answer: ["2", "3", "5"]
                hints:
                  - "Von 48 bis 50."
                  - "Von 50 bis 53."
                  - "2 und 3 sind 5."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "81 − 76 = ?"
                say: "Einundachtzig minus sechsundsiebzig. Ergänze von sechsundsiebzig bis einundachtzig."
                show: { drawn: rechenstrich, start: 76, jumps: [4, 1] }
                options: ["5", "15", "81"]
                answer: "5"
                feedback:
                  "81": "Bei 81 kommst du an. Die Antwort ist aber der Abstand: 4 + 1."
                  "15": "Zähl die Sprünge: 76 bis 80 sind 4, bis 81 noch 1."
                hints:
                  - "Von 76 bis 80."
                  - "Dann bis 81."
                  - "4 + 1 = 5."
              - id: l2-f3
                type: text_input
                text: "42 + _ = 61"
                say: "Zweiundvierzig plus wie viel gleich einundsechzig?"
                answer: "19"
                hints:
                  - "Von 42 bis 50 sind es 8."
                  - "Von 50 bis 61 sind es 11."
                  - "8 + 11 = 19."
              - id: l2-f4
                type: multiple_choice
                text: "Welcher Weg geht bei 92 − 89 schneller?"
                options: ["ergänzen", "abziehen in Schritten"]
                answer: "ergänzen"
                feedback:
                  "abziehen in Schritten": "Das geht auch. Aber 89 ist ganz nah an 92: Ergänzen geht schneller, 89 + 3 = 92."
                hints:
                  - "Wie weit liegen 89 und 92 auseinander?"
                  - "Sie liegen ganz nah beieinander."
                  - "Ergänzen."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze: 73 − 58"
                frame: "58 + _ = 60 | 60 + _ = 73 | 73 − 58 = _"
                options: ["2", "13", "15", "12", "3"]
                answer: ["2", "13", "15"]
                hints:
                  - "Von 58 bis 60."
                  - "Von 60 bis 73."
                  - "2 + 13 = 15."
              - id: l2-f6
                type: true_false
                text: "Stimmt das? 63 − 58 = 5"
                say: "Dreiundsechzig minus achtundfünfzig gleich fünf. Stimmt das?"
                answer: true
                hints:
                  - "Ergänze von 58 bis 60."
                  - "Dann bis 63."
                  - "2 + 3 = 5, ja."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Ergänze: 74 − 67"
                frame: "67 + _ = 70 | 70 + _ = 74 | 74 − 67 = _"
                options: ["3", "4", "7", "6"]
                answer: ["3", "4", "7"]
                hints: ["Ergänze erst bis zum nächsten Zehner."]
              - id: l2-s2
                type: text_input
                text: "56 + _ = 80"
                answer: "24"
                hints: ["Ergänze erst bis 60, dann bis 80."]
              - id: l2-s3
                type: multiple_choice
                text: "50 − 47 = ?"
                options: ["3", "13", "7"]
                answer: "3"
                hints: ["Ergänze von 47 bis 50."]
              - id: l2-s4
                type: multiple_choice
                text: "Welcher Weg geht bei 85 − 21 schneller?"
                options: ["abziehen in Schritten", "ergänzen"]
                answer: "abziehen in Schritten"
                hints: ["Liegen die beiden Zahlen nah beieinander?"]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? 100 − 94 = 16"
                say: "Hundert minus vierundneunzig gleich sechzehn. Stimmt das?"
                answer: false
                hints: ["Ergänze von 94 bis 100."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Ergänze: 62 − 57"
                frame: "57 + _ = 60 | 60 + _ = 62 | 62 − 57 = _"
                options: ["3", "2", "5", "15"]
                answer: ["3", "2", "5"]
              - id: l2-n2
                type: text_input
                text: "28 + _ = 75"
                answer: "47"
              - id: l2-n3
                type: multiple_choice
                text: "91 − 88 = ?"
                options: ["3", "13", "7"]
                answer: "3"
              - id: l2-n4
                type: text_input
                text: "70 − 66 = _"
                answer: "4"
              - id: l2-n5
                type: true_false
                text: "Stimmt das? 44 + 29 = 73, also ist 73 − 44 = 29."
                say: "Vierundvierzig plus neunundzwanzig gleich dreiundsiebzig. Also ist dreiundsiebzig minus vierundvierzig gleich neunundzwanzig. Stimmt das?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: result
            type: text_input
            text: "96 − 52 = _"
            answer: "44"
          - id: l2-c2
            part: result
            type: multiple_choice
            text: "83 − 47 = ?"
            options: ["36", "44", "46"]
            answer: "36"
          - id: l2-c3
            part: complement
            type: text_input
            text: "52 − 49 = _"
            answer: "3"
          - id: l2-c4
            part: complement
            type: fill_in_blank
            text: "Ergänze: 62 − 47"
            frame: "47 + _ = 50 | 50 + _ = 62 | 62 − 47 = _"
            options: ["3", "12", "15", "13", "2"]
            answer: ["3", "12", "15"]
          - id: l2-c5
            part: steps
            type: fill_in_blank
            text: "Zieh schrittweise ab."
            frame: "64 − 37 | 64 − 30 = _ | _ − 7 = _"
            options: ["27", "34", "33"]
            answer: ["34", "34", "27"]
          - id: l2-c6
            part: result
            type: text_input
            text: "74 − 38 = _"
            say: "Vierundsiebzig minus achtunddreißig."
            answer: "36"
          - id: l2-c7
            part: result
            type: multiple_choice
            text: "92 − 67 = ?"
            say: "Zweiundneunzig minus siebenundsechzig."
            options: ["25", "35", "30"]
            answer: "25"
          - id: l2-c8
            part: result
            type: true_false
            text: "Stimmt das? 85 − 39 = 54"
            say: "Fünfundachtzig minus neununddreißig gleich vierundfünfzig. Stimmt das?"
            answer: false
          - id: l2-c9
            part: steps
            type: fill_in_blank
            text: "Zieh schrittweise ab."
            frame: "77 − 42 | 77 − 40 = _ | _ − 2 = _"
            options: ["35", "37", "33"]
            answer: ["37", "37", "35"]
          - id: l2-c10
            part: steps
            type: fill_in_blank
            text: "Zieh schrittweise ab."
            frame: "61 − 28 | 61 − 20 = _ | _ − 8 = _"
            options: ["33", "41", "47"]
            answer: ["41", "41", "33"]
          - id: l2-c11
            part: steps
            type: multiple_choice
            text: "84 − 36: Welche Schritte passen?"
            say: "Vierundachtzig minus sechsunddreißig. Welche Schritte passen?"
            options: ["84 − 30 − 6", "84 − 30 − 4", "84 − 6 − 3"]
            answer: "84 − 30 − 6"
          - id: l2-c12
            part: steps
            type: true_false
            text: "Stimmt das? 58 − 23 = 58 − 20 − 3"
            say: "Achtundfünfzig minus dreiundzwanzig ist das Gleiche wie achtundfünfzig minus zwanzig minus drei. Stimmt das?"
            answer: true
          - id: l2-c13
            part: complement
            type: fill_in_blank
            text: "Ergänze: 84 − 79"
            say: "Vierundachtzig minus neunundsiebzig. Ergänze von neunundsiebzig bis vierundachtzig."
            frame: "79 + _ = 80 | 80 + _ = 84 | 84 − 79 = _"
            options: ["1", "4", "5", "6"]
            answer: ["1", "4", "5"]
          - id: l2-c14
            part: complement
            type: text_input
            text: "37 + _ = 62"
            say: "Siebenunddreißig plus wie viel gleich zweiundsechzig?"
            answer: "25"
          - id: l2-c15
            part: complement
            type: multiple_choice
            text: "80 − 73 = ?"
            say: "Achtzig minus dreiundsiebzig."
            options: ["7", "17", "13"]
            answer: "7"
          - id: l2-c16
            part: complement
            type: true_false
            text: "Stimmt das? 91 − 86 = 15"
            say: "Einundneunzig minus sechsundachtzig gleich fünfzehn. Stimmt das?"
            answer: false
          - id: l2-c17
            part: choose
            type: multiple_choice
            text: "Welcher Weg geht bei 71 − 68 schneller?"
            options: ["ergänzen", "abziehen in Schritten"]
            answer: "ergänzen"
          - id: l2-c18
            part: choose
            type: multiple_choice
            text: "Welcher Weg geht bei 97 − 12 schneller?"
            options: ["ergänzen", "abziehen in Schritten"]
            answer: "abziehen in Schritten"
          - id: l2-c19
            part: choose
            type: true_false
            text: "Bei 53 − 49 geht Ergänzen schnell."
            say: "Stimmt das? Bei dreiundfünfzig minus neunundvierzig geht Ergänzen schnell."
            answer: true
          - id: l2-c20
            part: choose
            type: true_false
            text: "Bei 78 − 13 geht Ergänzen schnell."
            say: "Stimmt das? Bei achtundsiebzig minus dreizehn geht Ergänzen schnell."
            answer: false
