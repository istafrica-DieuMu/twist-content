# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.sketches
skill: math.word-problems.sketches
curriculum: de-DE
language: de
title:
  de: Sachaufgaben mit Rechenstrich und Tabelle
  en: Word problems with number lines and tables
summary: >
  Lesson 1 draws a story on the Rechenstrich: dazu, weg and ergänzen (Wie
  viele fehlen noch bis 60?), and reads which story a Rechenstrich shows;
  lesson 2 puts a story that grows step by step into a table (jede Woche
  5 € mehr) and reads facts from it, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.word-problems.question-calc-answer]
  also_practises: [math.add-sub-to-100.complement, math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { de: [Skizze, Rechenstrich, Tabelle, Sprung, ergänzen, fehlen] }
  forms: [text, audio, drawn]
  drawn: [rechenstrich, number-line, table]
  facets: []
  parts:
    - { id: line, what: { de: eine Geschichte mit dazu oder weg am Rechenstrich lösen, en: solving a story about more or fewer on an empty number line } }
    - { id: complement, what: { de: "am Rechenstrich ergänzen: Wie viele fehlen noch?", en: "counting up on an empty number line: how many are still missing?" } }
    - { id: match, what: { de: "erkennen, welche Geschichte zu einem Rechenstrich passt", en: telling which story an empty number line shows } }
    - { id: table, what: { de: eine Sachaufgabe Schritt für Schritt mit einer Tabelle lösen, en: solving a word problem step by step with a table } }
  misconceptions:
    - id: missing-is-plus
      what: Adds the two numbers when the story asks how many are still missing (48 Seiten gelesen, 60 Seiten im Buch, rechnet 48 + 60)
      addressed: lesson 1 Learn draws the ergänzen story as jumps from 48 to 60; l1-f3, l1-s3 and l1-n3 are ergänzen stories offering the sum, with feedback in l1-f3
    - id: table-row-skipped
      what: Jumps to a later row of a table without going step by step (says Woche 4 when the table only reaches Woche 3)
      addressed: lesson 2 Learn fills the table one row at a time; l2-f2 and l2-s2 ask for the next row, with hints that count the steps
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Geschichten am Rechenstrich", en: "Stories on the number line" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wo landest du?"
            say: "Du startest bei dreißig und springst zwanzig weiter. Wo landest du?"
            show: { drawn: rechenstrich, start: 30, jumps: [20] }
            options: ["50", "10", "32"]
            answer: "50"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "48 + _ = 50"
            say: "Achtundvierzig plus wie viel ist fünfzig?"
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lena hat 35 Murmeln. Sie bekommt 20 dazu."
            say: "Lena hat fünfunddreißig Murmeln. Sie bekommt zwanzig dazu. Eine Skizze hilft. Am Rechenstrich startest du bei fünfunddreißig und springst zwanzig weiter. Du landest bei fünfundfünfzig."
            show: { drawn: rechenstrich, start: 35, jumps: [20] }
          - text: "Tim hat 50 Cent. Er gibt 15 Cent aus."
            say: "Tim hat fünfzig Cent. Er gibt fünfzehn Cent aus. Jetzt springst du zurück: zuerst zehn, dann fünf. Du landest bei fünfunddreißig."
            show: { drawn: rechenstrich, start: 50, jumps: [-10, -5] }
          - text: "Das Buch hat 60 Seiten. Mia hat 48 gelesen. Wie viele fehlen noch?"
            say: "Das Buch hat sechzig Seiten. Mia hat achtundvierzig gelesen. Wie viele Seiten fehlen noch? Du startest bei achtundvierzig und springst bis sechzig: erst zwei bis fünfzig, dann zehn. Zusammen fehlen zwölf Seiten."
            show: { drawn: rechenstrich, start: 48, jumps: [2, 10] }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ben hat 42 Sticker. Er bekommt 30 dazu. Wie viele hat er jetzt?"
                say: "Ben hat zweiundvierzig Sticker. Er bekommt dreißig dazu. Schau auf den Rechenstrich. Wie viele Sticker hat er jetzt?"
                show: { drawn: rechenstrich, start: 42, jumps: [30] }
                options: ["72", "12", "45"]
                answer: "72"
                option_audio: false
                hints:
                  - "Du startest bei 42 und springst 30 weiter."
                  - "Zweiundvierzig, zweiundfünfzig, zweiundsechzig, zweiundsiebzig."
                  - "72."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Geschichte passt zu diesem Rechenstrich?"
                say: "Der Rechenstrich startet bei fünfundsechzig und springt zwanzig zurück. Welche Geschichte passt?"
                show: { drawn: rechenstrich, start: 65, jumps: [-20] }
                options: ["Im Bus sitzen 65 Leute. 20 steigen aus.", "Im Bus sitzen 65 Leute. 20 steigen ein.", "Im Bus sitzen 20 Leute. 65 steigen aus."]
                answer: "Im Bus sitzen 65 Leute. 20 steigen aus."
                hints:
                  - "Der Sprung geht zurück. Werden es mehr oder weniger?"
                  - "Weniger: Es steigen Leute aus."
                  - "Im Bus sitzen 65 Leute. 20 steigen aus."
              - id: l1-f3
                type: multiple_choice
                text: "Ein Puzzle hat 50 Teile. Ali hat schon 37 gelegt. Wie viele Teile fehlen noch?"
                say: "Ein Puzzle hat fünfzig Teile. Ali hat schon siebenunddreißig gelegt. Wie viele Teile fehlen noch?"
                show: { drawn: rechenstrich, start: 37, jumps: [3, 10] }
                options: ["13", "87", "17"]
                answer: "13"
                feedback:
                  "87": "Das wären alle Teile zusammengezählt. Gefragt ist, wie viele bis 50 noch fehlen."
                hints:
                  - "Spring von 37 bis 50."
                  - "Erst 3 bis 40, dann 10 bis 50."
                  - "13."
              - id: l1-f4
                type: point_on_line
                text: "Lisa hat 24 Euro gespart. Sie bekommt 6 Euro dazu. Wo landest du?"
                say: "Lisa hat vierundzwanzig Euro gespart. Sie bekommt sechs Euro dazu. Tippe, wo du auf dem Zahlenstrahl landest."
                show: { drawn: number-line, from: 20, to: 40, labels: tens, jumps: [[24, 6]] }
                answer: 30
                hints:
                  - "Starte bei 24."
                  - "Sechs Schritte weiter."
                  - "Bei 30."
              - id: l1-f5
                type: true_false
                text: "Im Glas sind 80 Bonbons. Die Kinder essen 25. Stimmt der Rechenstrich?"
                say: "Im Glas sind achtzig Bonbons. Die Kinder essen fünfundzwanzig. Der Rechenstrich startet bei achtzig und springt zwanzig und fünf zurück. Stimmt das?"
                show: { drawn: rechenstrich, start: 80, jumps: [-20, -5] }
                answer: true
                hints:
                  - "Essen heißt: Es werden weniger."
                  - "Zwanzig und fünf sind zusammen fünfundzwanzig."
                  - "Ja, er stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Im Zug sitzen 56 Leute. 30 steigen aus. Wie viele sitzen noch im Zug?"
                say: "Im Zug sitzen sechsundfünfzig Leute. Dreißig steigen aus. Wie viele sitzen noch im Zug?"
                show: { drawn: rechenstrich, start: 56, jumps: [-30] }
                options: ["26", "86", "36"]
                answer: "26"
                option_audio: false
                hints: ["Spring in Zehnern zurück."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Geschichte passt zu diesem Rechenstrich?"
                say: "Der Rechenstrich startet bei achtunddreißig und springt zwei und dann zehn weiter. Welche Geschichte passt?"
                show: { drawn: rechenstrich, start: 38, jumps: [2, 10] }
                options: ["Paul hat 38 Karten. Er bekommt 12 dazu.", "Paul hat 38 Karten. Er verschenkt 12.", "Paul hat 12 Karten. Er bekommt 2 dazu."]
                answer: "Paul hat 38 Karten. Er bekommt 12 dazu."
                hints: ["Zwei und zehn sind zusammen zwölf."]
              - id: l1-s3
                type: multiple_choice
                text: "Ein Weg ist 70 Meter lang. Jan ist schon 45 Meter gelaufen. Wie viele Meter fehlen noch?"
                say: "Ein Weg ist siebzig Meter lang. Jan ist schon fünfundvierzig Meter gelaufen. Wie viele Meter fehlen noch?"
                show: { drawn: rechenstrich, start: 45, jumps: [5, 20] }
                options: ["25", "115", "35"]
                answer: "25"
                hints: ["Spring von 45 bis 70."]
              - id: l1-s4
                type: point_on_line
                text: "Mila hat 36 Perlen. Sie verliert 6. Wo landest du?"
                say: "Mila hat sechsunddreißig Perlen. Sie verliert sechs. Tippe, wo du landest."
                show: { drawn: number-line, from: 20, to: 40, labels: tens, jumps: [[36, -6]] }
                answer: 30
                hints: ["Starte bei 36 und geh sechs zurück."]
              - id: l1-s5
                type: true_false
                text: "Oma hat 40 Eier. Sie kauft 24 dazu. Passt dieser Rechenstrich?"
                say: "Oma hat vierzig Eier. Sie kauft vierundzwanzig dazu. Der Rechenstrich startet bei vierzig und springt vierundzwanzig zurück. Passt das?"
                show: { drawn: rechenstrich, start: 40, jumps: [-24] }
                answer: false
                hints: ["Dazukaufen heißt: Es werden mehr."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Tom hat 27 Euro. Er bekommt 40 Euro dazu. Wie viel hat er jetzt?"
                say: "Tom hat siebenundzwanzig Euro. Er bekommt vierzig Euro dazu. Wie viel Geld hat er jetzt?"
                show: { drawn: rechenstrich, start: 27, jumps: [] }
                options: ["67", "13", "31"]
                answer: "67"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Welche Geschichte passt zu diesem Rechenstrich?"
                say: "Der Rechenstrich startet bei zweiundsiebzig und springt zwei und dann zehn zurück. Welche Geschichte passt?"
                show: { drawn: rechenstrich, start: 72, jumps: [-2, -10] }
                options: ["Im Korb sind 72 Äpfel. 12 werden gegessen.", "Im Korb sind 72 Äpfel. 12 kommen dazu.", "Im Korb sind 12 Äpfel. 72 werden gegessen."]
                answer: "Im Korb sind 72 Äpfel. 12 werden gegessen."
              - id: l1-n3
                type: multiple_choice
                text: "Ein Kino hat 90 Plätze. 66 sind besetzt. Wie viele Plätze sind noch frei?"
                say: "Ein Kino hat neunzig Plätze. Sechsundsechzig sind besetzt. Wie viele Plätze sind noch frei?"
                show: { drawn: rechenstrich, start: 66, jumps: [] }
                options: ["24", "156", "34"]
                answer: "24"
              - id: l1-n4
                type: point_on_line
                text: "Ein Baum ist 23 Jahre alt. Wie alt ist er in 7 Jahren?"
                say: "Ein Baum ist dreiundzwanzig Jahre alt. Wie alt ist er in sieben Jahren? Tippe, wo du landest."
                show: { drawn: number-line, from: 20, to: 40, labels: tens }
                answer: 30
              - id: l1-n5
                type: text_input
                text: "Ein Heft hat 40 Seiten. Lea hat 28 beschrieben. Wie viele Seiten sind noch frei?"
                say: "Ein Heft hat vierzig Seiten. Lea hat achtundzwanzig beschrieben. Wie viele Seiten sind noch frei?"
                answer: "12"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Im Bus sitzen 47 Kinder. 20 steigen aus. Wie viele sitzen noch im Bus?"
            say: "Im Bus sitzen siebenundvierzig Kinder. Zwanzig steigen aus. Wie viele sitzen noch im Bus?"
            show: { drawn: rechenstrich, start: 47, jumps: [], back: true }
            options: ["27", "67", "45"]
            answer: "27"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Eine Kiste hat Platz für 60 Flaschen. 54 sind schon drin. Wie viele fehlen noch?"
            say: "Eine Kiste hat Platz für sechzig Flaschen. Vierundfünfzig sind schon drin. Wie viele fehlen noch?"
            options: ["6", "114", "16"]
            answer: "6"
          - id: l1-c3
            type: true_false
            text: "Mia hat 18 Euro. Sie bekommt 20 dazu. Passt dieser Rechenstrich?"
            say: "Mia hat achtzehn Euro. Sie bekommt zwanzig dazu. Der Rechenstrich startet bei achtzehn und springt zwanzig weiter. Passt das?"
            show: { drawn: rechenstrich, start: 18, jumps: [20] }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Ein Bus hat 50 Plätze. 38 sind besetzt. Wie viele Plätze sind noch frei?"
            say: "Ein Bus hat fünfzig Plätze. Achtunddreißig sind besetzt. Wie viele Plätze sind noch frei?"
            show: { drawn: rechenstrich, start: 38, jumps: [] }
            options: ["12", "88", "22"]
            answer: "12"
          - id: l1-c5
            type: multiple_choice
            text: "Welche Geschichte passt zu diesem Rechenstrich?"
            say: "Der Rechenstrich startet bei einundachtzig und springt vierzig zurück. Welche Geschichte passt?"
            show: { drawn: rechenstrich, start: 81, jumps: [-40] }
            options: ["Auf dem Dach sitzen 81 Tauben. 40 fliegen weg.", "Auf dem Dach sitzen 81 Tauben. 40 kommen dazu.", "Auf dem Dach sitzen 40 Tauben. 81 fliegen weg."]
            answer: "Auf dem Dach sitzen 81 Tauben. 40 fliegen weg."
          - id: l1-c6
            type: point_on_line
            text: "Finn hat 32 Euro. Er gibt 2 Euro aus. Wo landest du?"
            say: "Finn hat zweiunddreißig Euro. Er gibt zwei Euro aus. Tippe, wo du auf dem Zahlenstrahl landest."
            show: { drawn: number-line, from: 20, to: 40, labels: tens }
            answer: 30

  - n: 2
    title: { de: "Tabellen helfen", en: "Tables help" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Ein Buch hat 50 Seiten. Ben hat 46 gelesen. Wie viele fehlen noch?"
            say: "Ein Buch hat fünfzig Seiten. Ben hat sechsundvierzig gelesen. Wie viele Seiten fehlen noch?"
            options: ["4", "96", "14"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "5, 10, 15, _"
            say: "Fünf, zehn, fünfzehn. Welche Zahl kommt als Nächstes?"
            options: ["20", "16", "25"]
            answer: "20"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lena spart jede Woche 5 €. Wie viel hat sie nach 4 Wochen?"
            say: "Lena spart jede Woche fünf Euro. Wie viel Geld hat sie nach vier Wochen? Eine Tabelle hilft dir, Schritt für Schritt zu rechnen."
          - text: "Woche für Woche"
            show: { drawn: table, rows: [[Woche, Geld], ["1", "5 €"], ["2", "10 €"], ["3", "15 €"], ["4", "20 €"]] }
            say: "In jeder Zeile kommt eine Woche dazu und fünf Euro mehr. Woche eins: fünf Euro. Woche zwei: zehn Euro. Woche drei: fünfzehn Euro. Woche vier: zwanzig Euro."
          - text: "Antwort: Nach 4 Wochen hat Lena 20 €."
            show: { drawn: table, rows: [[Woche, Geld], ["1", "5 €"], ["2", "10 €"], ["3", "15 €"], ["4", "20 €"]], mark: [[4, 0], [4, 1]] }
            say: "In der letzten Zeile steht die Antwort: Nach vier Wochen hat Lena zwanzig Euro. Geh Zeile für Zeile, dann vergisst du keine Woche."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Tim legt jeden Tag 2 Steine in sein Glas.\nWie viele Steine sind es an Tag 3?"
                show: { drawn: table, rows: [[Tag, Steine], ["1", "2"], ["2", "4"], ["3", "6"]] }
                say: "Tim legt jeden Tag zwei Steine in sein Glas. Schau in die Tabelle. Wie viele Steine sind es an Tag drei?"
                options: ["6", "3", "4"]
                answer: "6"
                hints:
                  - "Such die Zeile mit Tag 3."
                  - "Dort steht die Zahl der Steine."
                  - "6 Steine."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tim legt jeden Tag 2 Steine dazu. Wie viele Steine sind es an Tag 4?"
                show: { drawn: table, rows: [[Tag, Steine], ["1", "2"], ["2", "4"], ["3", "6"], ["4", "?"]] }
                say: "Tim legt jeden Tag zwei Steine dazu. Wie viele Steine sind es an Tag vier?"
                options: ["8", "7", "10"]
                answer: "8"
                hints:
                  - "Jeden Tag kommen 2 Steine dazu."
                  - "Sechs und zwei."
                  - "8 Steine."
              - id: l2-f3
                type: fill_in_blank
                text: "Ein Ticket kostet 3 €. Ergänze die Tabelle."
                say: "Ein Ticket kostet drei Euro. Wie viel kosten zwei Tickets, wie viel drei? Ergänze die Tabelle."
                show: { drawn: table, rows: [[Tickets, Preis], ["1", "3 €"], ["2", "?"], ["3", "?"]] }
                frame: "2 Tickets: _ €, 3 Tickets: _ €"
                options: ["6", "9", "5", "12"]
                answer: ["6", "9"]
                hints:
                  - "Mit jedem Ticket kommen 3 € dazu."
                  - "Drei plus drei, dann noch einmal drei."
                  - "6 € und 9 €."
              - id: l2-f4
                type: true_false
                text: "Jede Woche wächst die Pflanze 3 cm.\nNach 3 Wochen ist sie 9 cm gewachsen. Stimmt das?"
                show: { drawn: table, rows: [[Woche, gewachsen], ["1", "3 cm"], ["2", "6 cm"], ["3", "9 cm"]] }
                say: "Jede Woche wächst die Pflanze drei Zentimeter. Schau in die Tabelle. Nach drei Wochen ist sie neun Zentimeter gewachsen. Stimmt das?"
                answer: true
                hints:
                  - "Such die Zeile mit Woche 3."
                  - "Dort steht 9 cm."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Mia liest jeden Tag 10 Seiten.\nNach wie vielen Tagen hat sie 50 Seiten gelesen?"
                show: { drawn: table, rows: [[Tag, Seiten], ["1", "10"], ["2", "20"], ["3", "30"]] }
                say: "Mia liest jeden Tag zehn Seiten. Nach wie vielen Tagen hat sie fünfzig Seiten gelesen? Mach die Tabelle in Gedanken weiter."
                options: ["5", "4", "50"]
                answer: "5"
                hints:
                  - "Mach weiter: Tag 4, Tag 5."
                  - "Tag 4: 40 Seiten, Tag 5: 50 Seiten."
                  - "Nach 5 Tagen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Ben spart jede Woche 4 €.\nWie viel hat er nach Woche 2?"
                show: { drawn: table, rows: [[Woche, gespart], ["1", "4 €"], ["2", "8 €"], ["3", "12 €"]] }
                say: "Ben spart jede Woche vier Euro. Schau in die Tabelle. Wie viel Geld hat er nach Woche zwei?"
                options: ["8 €", "4 €", "12 €"]
                answer: "8 €"
                hints: ["Such die Zeile mit Woche 2."]
              - id: l2-s2
                type: multiple_choice
                text: "Ben spart jede Woche 4 €. Wie viel hat er nach Woche 4?"
                show: { drawn: table, rows: [[Woche, gespart], ["1", "4 €"], ["2", "8 €"], ["3", "12 €"], ["4", "?"]] }
                say: "Ben spart jede Woche vier Euro. Wie viel hat er nach Woche vier?"
                options: ["16 €", "13 €", "20 €"]
                answer: "16 €"
                hints: ["Jede Woche kommen 4 € dazu."]
              - id: l2-s3
                type: fill_in_blank
                text: "Ein Fahrrad hat 2 Räder. Ergänze die Tabelle."
                say: "Ein Fahrrad hat zwei Räder. Wie viele Räder haben drei Fahrräder, wie viele vier? Ergänze die Tabelle."
                show: { drawn: table, rows: [[Fahrräder, Räder], ["1", "2"], ["2", "4"], ["3", "?"], ["4", "?"]] }
                frame: "3 Fahrräder: _ Räder, 4 Fahrräder: _ Räder"
                options: ["6", "8", "5", "10"]
                answer: ["6", "8"]
                hints: ["Mit jedem Fahrrad kommen 2 Räder dazu."]
              - id: l2-s4
                type: true_false
                text: "Eine Kerze wird jede Stunde 2 cm kürzer.\nNach 3 Stunden ist sie 15 cm lang. Stimmt das?"
                show: { drawn: table, rows: [[Zeit, Länge], [Start, "20 cm"], [nach 1 Stunde, "18 cm"], [nach 2 Stunden, "16 cm"]] }
                say: "Eine Kerze wird jede Stunde zwei Zentimeter kürzer. Schau in die Tabelle. Nach drei Stunden ist sie fünfzehn Zentimeter lang. Stimmt das?"
                answer: false
                hints: ["Von 16 geht es 2 cm weiter nach unten."]
              - id: l2-s5
                type: multiple_choice
                text: "Ein Kuchen kostet 5 €.\nWie viele Kuchen bekommst du für 25 €?"
                show: { drawn: table, rows: [[Kuchen, Preis], ["1", "5 €"], ["2", "10 €"], ["3", "15 €"]] }
                say: "Ein Kuchen kostet fünf Euro. Wie viele Kuchen bekommst du für fünfundzwanzig Euro? Mach die Tabelle weiter."
                options: ["5", "4", "25"]
                answer: "5"
                hints: ["4 Kuchen: 20 €. Und dann?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Auto hat 4 Räder.\nWie viele Räder haben 3 Autos?"
                show: { drawn: table, rows: [[Autos, Räder], ["1", "4"], ["2", "8"], ["3", "12"]] }
                say: "Ein Auto hat vier Räder. Schau in die Tabelle. Wie viele Räder haben drei Autos?"
                options: ["12", "3", "8"]
                answer: "12"
              - id: l2-n2
                type: multiple_choice
                text: "Ein Auto hat 4 Räder. Wie viele Räder haben 4 Autos?"
                show: { drawn: table, rows: [[Autos, Räder], ["1", "4"], ["2", "8"], ["3", "12"], ["4", "?"]] }
                say: "Ein Auto hat vier Räder. Wie viele Räder haben vier Autos?"
                options: ["16", "13", "20"]
                answer: "16"
              - id: l2-n3
                type: fill_in_blank
                text: "Ein Eis kostet 2 €. Ergänze die Tabelle."
                say: "Ein Eis kostet zwei Euro. Wie viel kosten drei Eis, wie viel fünf? Ergänze die Tabelle."
                show: { drawn: table, rows: [[Eis, Preis], ["1", "2 €"], ["2", "4 €"], ["3", "?"], ["4", "8 €"], ["5", "?"]] }
                frame: "3 Eis: _ €, 5 Eis: _ €"
                options: ["6", "10", "5", "9"]
                answer: ["6", "10"]
              - id: l2-n4
                type: true_false
