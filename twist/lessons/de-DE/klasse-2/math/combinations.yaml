# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.combinations
skill: math.chance.combinations
curriculum: de-DE
language: de
title:
  de: Wie viele Möglichkeiten?
  en: How many ways?
summary: >
  Lesson 1 combines clothes and food systematically: take one T-Shirt
  and go through every Hose, then the next T-Shirt (rot → blau, grau;
  gelb → blau, grau: 4 Möglichkeiten), so nothing is missed, and sees
  that 2 T-Shirts and 3 Hosen make 3 + 3 = 6, not 5; lesson 2 lays
  two-digit numbers from Ziffernkarten in order (1 vorne, 2 vorne, 3
  vorne), counts games when everyone plays everyone (Lea gegen Tim is
  the same game as Tim gegen Lea), and ends with the skill check.
  Drawing the tree or dressing a figure by dragging waits for a drawing
  or drag task.
metadata:
  year: klasse-2
  topic: { de: Kombinatorik, en: Combinations }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.sort-classify]
  also_practises: [math.data.sort-classify, math.numbers-to-100.place-value]
  vocabulary: { de: [Möglichkeit, kombinieren, der Reihe nach, Ziffernkarte, jeder gegen jeden] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: count, what: { de: Möglichkeiten beim Kombinieren zählen, en: counting the ways to combine two kinds of things } }
    - { id: in-order, what: { de: der Reihe nach vorgehen und fehlende Möglichkeiten finden, en: working in order and finding a missing possibility } }
    - { id: numbers, what: { de: zweistellige Zahlen aus Ziffernkarten legen, en: making two-digit numbers from digit cards } }
    - { id: games, what: { de: Spiele jeder gegen jeden zählen, en: counting games when everyone plays everyone } }
  misconceptions:
    - id: adds-the-things
      what: Adds the things instead of combining them (2 T-Shirts and 3 Hosen give 5 Möglichkeiten)
      addressed: lesson 1 Learn goes through every Hose for each T-Shirt; l1-f1 (with feedback), l1-f5, l1-s1, l1-n1, l1-n4, l1-c1 and l2-c1 offer the sum of the things
    - id: unsystematic
      what: Lists combinations at random and misses some or counts one twice
      addressed: both Learns go through the choices in a fixed order; the Welche Möglichkeit fehlt and Welche Zahl fehlt tasks in every stage (with feedback in l2-f2) and l2-f4 and l2-s4 on games counted twice
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Kleidung kombinieren", en: "Combining clothes" }
    goal:
      de: "Finde der Reihe nach alle Möglichkeiten, T-Shirts und Hosen zu kombinieren, damit keine fehlt."
      en: "Find every way to match T-shirts and trousers, in order, so that none is missing."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was passt nicht dazu?\nHose, Rock, Apfel, Pullover"
            say: "Hose, Rock, Apfel, Pullover. Was passt nicht dazu?"
            options: ["Apfel", "Rock", "Hose"]
            answer: "Apfel"
            difficulty: easy
          - id: l1-w2
            type: sorting
            text: "Kleidung oder Obst?"
            say: "Sortiere: Ist es Kleidung oder Obst?"
            bins:
              - { id: clothes, show: { text: "Kleidung" }, say: "Kleidung" }
              - { id: fruit, show: { text: "Obst" }, say: "Obst" }
            options:
              - { text: "Jacke", bin: clothes }
              - { text: "Banane", bin: fruit }
              - { text: "Mütze", bin: clothes }
              - { text: "Birne", bin: fruit }
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "T-Shirts: rot, gelb\nHosen: blau, grau"
            say: "Mila hat zwei T-Shirts, ein rotes und ein gelbes. Und sie hat zwei Hosen, eine blaue und eine graue. Wie viele Möglichkeiten hat sie, sich anzuziehen?"
          - text: "rot → blau, grau\ngelb → blau, grau"
            say: "Geh der Reihe nach vor. Zuerst das rote T-Shirt: mit der blauen Hose, dann mit der grauen. Dann das gelbe T-Shirt: mit der blauen Hose, dann mit der grauen. So vergisst du keine Möglichkeit."
          - text: "2 + 2 = 4 Möglichkeiten"
            say: "Zu jedem T-Shirt passen zwei Hosen. Zweimal zwei Möglichkeiten: Das sind vier."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Ben hat 2 T-Shirts: weiß und grün.\nEr hat 3 Hosen: blau, schwarz und braun.\nWie viele Möglichkeiten hat er?"
                say: "Ben hat zwei T-Shirts, ein weißes und ein grünes. Er hat drei Hosen: eine blaue, eine schwarze und eine braune. Wie viele Möglichkeiten hat er, sich anzuziehen?"
                options: ["6", "5", "3"]
                answer: "6"
                feedback:
                  "5": "2 + 3 zählt nur die Sachen. Zu jedem T-Shirt passen 3 Hosen: 3 + 3 = 6."
                hints:
                  - "Nimm zuerst das weiße T-Shirt. Mit welchen Hosen geht es?"
                  - "Weiß passt zu 3 Hosen, grün auch zu 3 Hosen."
                  - "3 + 3 = 6 Möglichkeiten."
              - id: l1-f2
                type: multiple_choice
                text: "Welche Möglichkeit fehlt noch?\nrot → blau, grau\ngelb → blau"
                say: "Mila schreibt ihre Möglichkeiten auf. Eine fehlt noch. Welche?"
                options: ["gelb mit grau", "rot mit blau", "gelb mit blau"]
                answer: "gelb mit grau"
                hints:
                  - "Zum roten T-Shirt stehen beide Hosen da. Und beim gelben?"
                  - "Beim gelben T-Shirt fehlt eine Hose."
                  - "Gelb mit grau."
                difficulty: easy
              - id: l1-f3
                type: fill_in_blank
                text: "Ben hat 2 T-Shirts und 3 Hosen."
                say: "Ben hat zwei T-Shirts und drei Hosen. Wie viele Hosen passen zu jedem T-Shirt, und wie viele Möglichkeiten sind es zusammen?"
                frame: "weiß → _ Hosen · grün → _ Hosen · zusammen _"
                options: ["2", "3", "5", "6"]
                answer: ["3", "3", "6"]
                hints:
                  - "Jede Hose passt zu jedem T-Shirt."
                  - "Zum weißen T-Shirt passen alle 3 Hosen, zum grünen auch."
                  - "3, 3 und zusammen 6."
              - id: l1-f4
                type: true_false
                text: "Lea hat 3 Röcke und 1 Pullover.\nSie hat 3 Möglichkeiten."
                say: "Lea hat drei Röcke und einen Pullover. Stimmt das: Sie hat drei Möglichkeiten, sich anzuziehen?"
                answer: true
                hints:
                  - "Es gibt nur einen Pullover."
                  - "Der Pullover passt zu jedem der 3 Röcke."
                  - "Ja, das sind 3 Möglichkeiten."
              - id: l1-f5
                type: multiple_choice
                text: "Mia hat 3 Mützen und 3 Schals.\nWie viele Möglichkeiten hat sie?"
                say: "Mia hat drei Mützen und drei Schals. Wie viele Möglichkeiten hat sie, eine Mütze und einen Schal zu tragen?"
                options: ["9", "6", "3"]
                answer: "9"
                hints:
                  - "Nimm eine Mütze. Mit wie vielen Schals geht sie?"
                  - "Jede Mütze passt zu 3 Schals: 3 + 3 + 3."
                  - "9 Möglichkeiten."
                difficulty: stretch

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Tom hat 2 Pullover und 4 Hosen.\nWie viele Möglichkeiten hat er?"
                say: "Tom hat zwei Pullover und vier Hosen. Wie viele Möglichkeiten hat er, sich anzuziehen?"
                options: ["8", "6", "4"]
                answer: "8"
                hints: ["Jeder Pullover passt zu 4 Hosen."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Möglichkeit fehlt noch?\nrote Mütze → blauer Schal, weißer Schal\ngrüne Mütze → weißer Schal"
                say: "Can schreibt auf, wie er Mützen und Schals tragen kann. Eine Möglichkeit fehlt noch. Welche?"
                options: ["grüne Mütze mit blauem Schal", "rote Mütze mit weißem Schal", "grüne Mütze mit weißem Schal"]
                answer: "grüne Mütze mit blauem Schal"
                hints: ["Schau, welcher Schal bei der grünen Mütze noch fehlt."]
              - id: l1-s3
                type: fill_in_blank
                text: "Ella hat 2 Kleider und 3 Paar Schuhe."
                say: "Ella hat zwei Kleider und drei Paar Schuhe. Wie viele Paar Schuhe passen zu jedem Kleid, und wie viele Möglichkeiten sind es zusammen?"
                frame: "1. Kleid → _ | 2. Kleid → _ | zusammen _"
                options: ["2", "3", "5", "6"]
                answer: ["3", "3", "6"]
                hints: ["Jedes Paar Schuhe passt zu jedem Kleid."]
              - id: l1-s4
                type: true_false
                text: "Can hat 2 Jacken und 2 Mützen.\nEr hat 2 Möglichkeiten."
                say: "Can hat zwei Jacken und zwei Mützen. Stimmt das: Er hat zwei Möglichkeiten?"
                answer: false
                hints: ["Nimm die erste Jacke. Mit wie vielen Mützen geht sie?"]
              - id: l1-s5
                type: multiple_choice
                text: "Ein Brot mit Käse oder mit Wurst.\nDazu Saft oder Milch.\nWie viele Möglichkeiten gibt es?"
                say: "Zum Frühstück gibt es ein Brot mit Käse oder mit Wurst. Dazu gibt es Saft oder Milch. Wie viele Möglichkeiten gibt es?"
                options: ["4", "2", "3"]
                answer: "4"
                hints: ["Käsebrot mit Saft, Käsebrot mit Milch, und dann?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lina hat 3 T-Shirts und 2 Hosen.\nWie viele Möglichkeiten hat sie?"
                say: "Lina hat drei T-Shirts und zwei Hosen. Wie viele Möglichkeiten hat sie, sich anzuziehen?"
                options: ["6", "5", "3"]
                answer: "6"
              - id: l1-n2
                type: multiple_choice
                text: "Welche Möglichkeit fehlt noch?\nPizza → Saft, Wasser\nNudeln → Saft"
                say: "Zum Mittagessen gibt es Pizza oder Nudeln, dazu Saft oder Wasser. Paul schreibt alle Möglichkeiten auf. Welche fehlt noch?"
                options: ["Nudeln mit Wasser", "Pizza mit Saft", "Nudeln mit Saft"]
                answer: "Nudeln mit Wasser"
              - id: l1-n3
                type: multiple_choice
                text: "Paul hat 4 T-Shirts und 2 Hosen.\nWie viele Möglichkeiten hat er?"
                say: "Paul hat vier T-Shirts und zwei Hosen. Wie viele Möglichkeiten hat er, sich anzuziehen?"
                options: ["8", "6", "2"]
                answer: "8"
              - id: l1-n4
                type: true_false
                text: "Emma hat 2 Mützen und 3 Schals.\nSie hat 5 Möglichkeiten."
                say: "Emma hat zwei Mützen und drei Schals. Stimmt das: Sie hat fünf Möglichkeiten, eine Mütze und einen Schal zu tragen?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Sara hat 2 Blusen und 3 Röcke."
                say: "Sara hat zwei Blusen und drei Röcke. Wie viele Röcke passen zu jeder Bluse, und wie viele Möglichkeiten sind es zusammen?"
                frame: "1. Bluse → _ | 2. Bluse → _ | zusammen _"
                options: ["2", "3", "5", "6"]
                answer: ["3", "3", "6"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Jonas hat 2 Mützen und 4 Schals.\nWie viele Möglichkeiten hat er?"
            say: "Jonas hat zwei Mützen und vier Schals. Wie viele Möglichkeiten hat er, eine Mütze und einen Schal zu tragen?"
            options: ["8", "6", "2"]
            answer: "8"
          - id: l1-c2
            type: multiple_choice
            text: "Welche Möglichkeit fehlt noch?\nblaues T-Shirt → rote, gelbe, grüne Hose\nweißes T-Shirt → rote, grüne Hose"
            say: "Ida schreibt auf, wie sie T-Shirts und Hosen anziehen kann. Eine Möglichkeit fehlt noch. Welche?"
            options: ["weißes T-Shirt mit gelber Hose", "blaues T-Shirt mit gelber Hose", "weißes T-Shirt mit roter Hose"]
            answer: "weißes T-Shirt mit gelber Hose"
          - id: l1-c3
            type: true_false
            text: "Noah hat 1 T-Shirt und 4 Hosen.\nEr hat 4 Möglichkeiten."
            say: "Noah hat ein T-Shirt und vier Hosen. Stimmt das: Er hat vier Möglichkeiten, sich anzuziehen?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Hanna hat 3 Röcke und 2 Pullover.\nWie viele Möglichkeiten hat sie?"
            say: "Hanna hat drei Röcke und zwei Pullover. Wie viele Möglichkeiten hat sie, sich anzuziehen?"
            options: ["6", "5", "2"]
            answer: "6"
          - id: l1-c5
            type: multiple_choice
            text: "Welche Möglichkeit fehlt noch?\nWurst → Brötchen, Toast\nKäse → Toast"
            say: "Es gibt Wurst oder Käse, dazu ein Brötchen oder Toast. Welche Möglichkeit fehlt noch?"
            options: ["Käse mit Brötchen", "Wurst mit Toast", "Käse mit Toast"]
            answer: "Käse mit Brötchen"
          - id: l1-c6
            type: true_false
            text: "Finn hat 2 Jacken und 4 Mützen.\nEr hat 6 Möglichkeiten."
            say: "Finn hat zwei Jacken und vier Mützen. Stimmt das: Er hat sechs Möglichkeiten, eine Jacke und eine Mütze zu tragen?"
            answer: false

  - n: 2
    title: { de: "Zahlen legen und Spiele zählen", en: "Making numbers and counting games" }
    goal:
      de: "Leg mit Zahlenkarten alle zweistelligen Zahlen, so wie 12 und 13, und zähl die Spiele, wenn jeder gegen jeden spielt."
      en: "Make every two-digit number from cards, like 12 and 13, and count the games when everyone plays everyone."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "2 T-Shirts und 2 Hosen.\nWie viele Möglichkeiten?"
            say: "Zwei T-Shirts und zwei Hosen. Wie viele Möglichkeiten gibt es, sich anzuziehen?"
            options: ["4", "2"]
            answer: "4"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welche Möglichkeit fehlt noch?\nKakao → Brezel, Brötchen\nTee → Brötchen"
            say: "Es gibt Kakao oder Tee, dazu eine Brezel oder ein Brötchen. Welche Möglichkeit fehlt noch?"
            options: ["Tee mit Brezel", "Kakao mit Brezel"]
            answer: "Tee mit Brezel"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Karten: 1, 2, 3\n1 vorne: 12, 13"
            say: "Mit den Karten eins, zwei und drei legst du zweistellige Zahlen. Jede Karte gibt es nur einmal. Fang mit der Eins vorne an: zwölf und dreizehn."
          - text: "1 vorne: 12, 13\n2 vorne: 21, 23\n3 vorne: 31, 32"
            say: "Dann die Zwei vorne: einundzwanzig, dreiundzwanzig. Dann die Drei vorne: einunddreißig, zweiunddreißig. Mit jeder Karte vorne gibt es zwei Zahlen. Das sind sechs Zahlen."
          - text: "Lea gegen Tim\nLea gegen Mia\nTim gegen Mia"
            say: "Lea, Tim und Mia spielen jeder gegen jeden. Lea gegen Tim ist dasselbe Spiel wie Tim gegen Lea. Du zählst es nur einmal. Darum gibt es drei Spiele."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Karten: 4, 5\nWelche Zahlen kannst du legen?"
                say: "Du hast die Karten vier und fünf. Jede gibt es nur einmal. Welche zweistelligen Zahlen kannst du legen?"
                options: ["45 und 54", "45 und 44", "nur 45"]
                answer: "45 und 54"
                hints:
                  - "Jede Karte darf einmal vorne liegen."
                  - "Erst die 4 vorne, dann die 5 vorne."
                  - "45 und 54."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Karten: 2, 5, 7\nWie viele zweistellige Zahlen kannst du legen?"
                say: "Du hast die Karten zwei, fünf und sieben. Jede gibt es nur einmal. Wie viele zweistellige Zahlen kannst du legen?"
                options: ["6", "3", "9"]
                answer: "6"
                feedback:
                  "3": "Mit jeder Karte vorne kannst du 2 Zahlen legen: 25, 27, 52, 57, 72, 75."
                  "9": "Jede Karte gibt es nur einmal. 22, 55 und 77 gehen nicht."
                hints:
                  - "Geh der Reihe nach: erst die 2 vorne, dann die 5, dann die 7."
                  - "2 vorne: 25, 27. 5 vorne: 52, 57. 7 vorne: ..."
                  - "6 Zahlen."
              - id: l2-f3
                type: multiple_choice
                text: "Karten: 3, 6, 8\n36, 38, 63, 68, 83\nWelche Zahl fehlt?"
                say: "Mit den Karten drei, sechs und acht hat Tim diese Zahlen gelegt. Eine fehlt noch. Welche?"
                options: ["86", "66", "88"]
                answer: "86"
                hints:
                  - "Mit jeder Karte vorne gibt es 2 Zahlen."
                  - "Mit der 8 vorne steht nur 83 da."
                  - "86."
              - id: l2-f4
                type: true_false
                text: "Ben, Ida und Ole spielen jeder gegen jeden.\nDas sind 6 Spiele."
                say: "Ben, Ida und Ole spielen jeder gegen jeden. Stimmt das: Das sind sechs Spiele?"
                answer: false
                hints:
                  - "Ben gegen Ida ist dasselbe Spiel wie Ida gegen Ben."
                  - "Ben gegen Ida, Ben gegen Ole, Ida gegen Ole."
                  - "Nein, das sind nur 3 Spiele."
              - id: l2-f5
                type: multiple_choice
                text: "Karten: 1, 4, 9\nWelche ist die größte zweistellige Zahl, die du legen kannst?"
                say: "Du hast die Karten eins, vier und neun. Welche ist die größte zweistellige Zahl, die du legen kannst?"
                options: ["94", "91", "49"]
                answer: "94"
                hints:
                  - "Die größte Karte kommt nach vorne."
                  - "9 vorne. Welche Karte ist dann die größte, die noch übrig ist?"
                  - "94."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Karten: 6, 8\nWelche Zahlen kannst du legen?"
                say: "Du hast die Karten sechs und acht. Jede gibt es nur einmal. Welche zweistelligen Zahlen kannst du legen?"
                options: ["68 und 86", "68 und 66", "nur 86"]
                answer: "68 und 86"
                hints: ["Jede Karte darf einmal vorne liegen."]
              - id: l2-s2
                type: multiple_choice
                text: "Karten: 1, 3, 5\nWie viele zweistellige Zahlen kannst du legen?"
                say: "Du hast die Karten eins, drei und fünf. Jede gibt es nur einmal. Wie viele zweistellige Zahlen kannst du legen?"
                options: ["6", "3", "5"]
                answer: "6"
                hints: ["Mit jeder Karte vorne gibt es 2 Zahlen."]
              - id: l2-s3
                type: multiple_choice
                text: "Karten: 2, 4, 9\n24, 29, 42, 49, 94\nWelche Zahl fehlt?"
                say: "Mit den Karten zwei, vier und neun hat Ida diese Zahlen gelegt. Eine fehlt noch. Welche?"
                options: ["92", "22", "44"]
                answer: "92"
                hints: ["Schau bei der 9 vorne."]
              - id: l2-s4
                type: multiple_choice
                text: "Lea, Tim, Mia und Ben spielen jeder gegen jeden.\nWie viele Spiele sind das?"
                say: "Lea, Tim, Mia und Ben spielen jeder gegen jeden. Wie viele Spiele sind das?"
                options: ["6", "12", "4"]
                answer: "6"
                hints: ["Lea spielt 3 Spiele. Tim hat gegen Lea schon gespielt, er braucht noch 2. Mia noch 1."]
                difficulty: stretch
              - id: l2-s5
                type: multiple_choice
                text: "Karten: 3, 5, 7\nWelche ist die kleinste zweistellige Zahl, die du legen kannst?"
                say: "Du hast die Karten drei, fünf und sieben. Welche ist die kleinste zweistellige Zahl, die du legen kannst?"
                options: ["35", "53", "37"]
                answer: "35"
                hints: ["Die kleinste Karte kommt nach vorne."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Karten: 2, 9\nWelche Zahlen kannst du legen?"
                say: "Du hast die Karten zwei und neun. Jede gibt es nur einmal. Welche zweistelligen Zahlen kannst du legen?"
                options: ["29 und 92", "29 und 99", "nur 92"]
                answer: "29 und 92"
              - id: l2-n2
                type: multiple_choice
                text: "Karten: 4, 6, 7\nWie viele zweistellige Zahlen kannst du legen?"
                say: "Du hast die Karten vier, sechs und sieben. Jede gibt es nur einmal. Wie viele zweistellige Zahlen kannst du legen?"
                options: ["6", "3", "7"]
                answer: "6"
              - id: l2-n3
                type: multiple_choice
                text: "Karten: 1, 5, 8\n15, 18, 51, 81, 85\nWelche Zahl fehlt?"
                say: "Mit den Karten eins, fünf und acht hat Ole diese Zahlen gelegt. Eine fehlt noch. Welche?"
                options: ["58", "55", "11"]
                answer: "58"
              - id: l2-n4
                type: true_false
                text: "Emil, Nora und Can spielen jeder gegen jeden.\nDas sind 3 Spiele."
                say: "Emil, Nora und Can spielen jeder gegen jeden. Stimmt das: Das sind drei Spiele?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Karten: 2, 6, 8\nWelche ist die größte zweistellige Zahl, die du legen kannst?"
                say: "Du hast die Karten zwei, sechs und acht. Welche ist die größte zweistellige Zahl, die du legen kannst?"
                options: ["86", "82", "68"]
                answer: "86"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: count
            type: multiple_choice
            text: "Lukas hat 3 Pullover und 4 Hosen.\nWie viele Möglichkeiten hat er?"
            say: "Lukas hat drei Pullover und vier Hosen. Wie viele Möglichkeiten hat er, sich anzuziehen?"
            options: ["12", "7", "4"]
            answer: "12"
          - id: l2-c2
            part: in-order
            type: multiple_choice
            text: "Welche Möglichkeit fehlt noch?\nNudeln → Tomatensoße, Käsesoße\nReis → Käsesoße"
            say: "Es gibt Nudeln oder Reis, dazu Tomatensoße oder Käsesoße. Welche Möglichkeit fehlt noch?"
            options: ["Reis mit Tomatensoße", "Nudeln mit Käsesoße", "Reis mit Käsesoße"]
            answer: "Reis mit Tomatensoße"
          - id: l2-c3
            part: numbers
            type: multiple_choice
            text: "Karten: 3, 4, 6\nWie viele zweistellige Zahlen kannst du legen?"
            say: "Du hast die Karten drei, vier und sechs. Jede gibt es nur einmal. Wie viele zweistellige Zahlen kannst du legen?"
            options: ["6", "3", "9"]
            answer: "6"
          - id: l2-c4
