# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.order-compare-to-100
skill: math.numbers-to-100.order-compare
curriculum: de-DE
language: de
title:
  de: Ordnen und vergleichen bis 100
  en: Ordering and comparing to 100
summary: >
  Comparing two-digit numbers by looking at the tens first, then the
  ones. Lesson 1 compares and orders numbers with <, > and =; lesson 2
  finds Nachbarzahlen and Nachbarzehner (the tens before and after a
  number), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Zahlen bis 100, en: Numbers to 100 }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.numbers-to-100.number-line]
  also_practises: [math.numbers-to-100.place-value]
  vocabulary: { de: [größer als, kleiner als, gleich, Nachbarzahl, Nachbarzehner, Vorgänger, Nachfolger] }
  forms: [drawn, text, audio]
  drawn: [base-ten, number-line]
  facets: [operation-signs]
  parts:
    - { id: compare, what: { de: "Zahlen bis 100 mit <, > und = vergleichen", en: "comparing numbers to 100 with <, > and =" } }
    - { id: order, what: { de: Zahlen bis 100 ordnen, en: ordering numbers to 100 } }
    - { id: neighbours, what: { de: Nachbarzahlen bestimmen, en: finding the numbers just before and after } }
    - { id: neighbour-tens, what: { de: Nachbarzehner bestimmen, en: finding the tens before and after } }
  misconceptions:
    - id: ones-first
      what: Compares the ones digit first (thinks 29 > 41 because 9 > 1)
      addressed: Learn compares with base-ten blocks, tens first; feedback on 29 > 41 names the tens
    - id: sign-direction
      what: Writes the sign the wrong way round
      addressed: Learn says "Die offene Seite zeigt zur größeren Zahl"; the voice reads each sign as größer als or kleiner als
    - id: neighbour-ten-is-number
      what: Gives 47 and 49 as the Nachbarzehner of 48
      addressed: lesson 2 uses the number line with only tens labelled and says "Nachbarzehner sind Zehnerzahlen"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Zehner zuerst vergleichen, en: Compare the tens first }
    goal:
      de: "Vergleich Zahlen und schau zuerst auf die Zehner, so wie 41 ist größer als 29."
      en: "Compare numbers by looking at the tens first, like 41 is bigger than 29."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Welches Zeichen passt?"
            say: "Welches Zeichen passt zwischen sieben und vier?"
            frame: "7 _ 4"
            options: ["<", ">", "="]
            answer: [">"]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Zehner hat 63?"
            options: ["3", "6", "63"]
            answer: "6"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "41 und 29"
            say: "Welche Zahl ist größer, einundvierzig oder neunundzwanzig? Schau zuerst auf die Zehner."
            show: { drawn: base-ten, tens: 4, ones: 1 }
          - text: "41 > 29"
            say: "Hier ist neunundzwanzig. Einundvierzig hat vier Zehner, neunundzwanzig hat nur zwei. Vier Zehner sind mehr. Also ist einundvierzig größer, auch wenn neun mehr Einer sind als eins."
            show: { drawn: base-ten, tens: 2, ones: 9 }
          - text: "56 < 58"
            say: "Sind die Zehner gleich, schauen wir auf die Einer. Sechsundfünfzig und achtundfünfzig haben beide fünf Zehner. Sechs ist kleiner als acht. Die offene Seite des Zeichens zeigt zur größeren Zahl."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Zahl ist größer?"
                say: "Welche Zahl ist größer, zweiunddreißig oder dreiundzwanzig?"
                options: ["32", "23"]
                answer: "32"
                option_audio: false
                hints:
                  - "Schau zuerst auf die Zehner."
                  - "32 hat 3 Zehner, 23 hat 2 Zehner."
                  - "32 ist größer."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen neunundzwanzig und einundvierzig?"
                frame: "29 _ 41"
                options: ["<", ">", "="]
                answer: ["<"]
                option_audio: false
                feedback:
                  ">": "Die 9 Einer sind viele, aber 41 hat mehr Zehner. Schau zuerst auf die Zehner."
                hints:
                  - "Welche Zahl hat mehr Zehner?"
                  - "41 hat 4 Zehner, 29 nur 2. 29 ist kleiner."
                  - "29 < 41"
              - id: l1-f3
                type: fill_in_blank
                text: "Welches Zeichen passt?"
                say: "Welches Zeichen passt zwischen siebenundsechzig und vierundsechzig?"
                frame: "67 _ 64"
                options: ["<", ">", "="]
                answer: [">"]
                option_audio: false
                hints:
                  - "Die Zehner sind gleich. Schau auf die Einer."
                  - "7 ist mehr als 4."
                  - "67 > 64"
              - id: l1-f4
                type: ordering
                text: "Ordne die Zahlen. Die kleinste zuerst."
                options: ["45", "18", "81", "54"]
                slot_count: 4
                answer: ["18", "45", "54", "81"]
                hints:
                  - "Welche Zahl hat die wenigsten Zehner?"
                  - "18 hat nur einen Zehner. Dann kommt 45."
                  - "18, 45, 54, 81."
              - id: l1-f5
                type: true_false
                text: "Stimmt das? 70 > 69"
                say: "Siebzig ist größer als neunundsechzig. Stimmt das?"
                answer: true
                hints:
                  - "Vergleiche die Zehner."
                  - "70 hat 7 Zehner, 69 hat 6 Zehner."
                  - "Ja, 70 ist größer."
              - id: l1-f6
                type: multiple_choice
