                say: "Welche Zahl ist am größten?"
                options: ["39", "93", "88"]
                answer: "93"
                hints:
                  - "Welche Zahl hat die meisten Zehner?"
                  - "93 hat 9 Zehner."
                  - "93 ist am größten."

          - support: some
