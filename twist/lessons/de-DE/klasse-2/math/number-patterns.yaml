# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.number-patterns
skill: math.patterns.number-patterns
curriculum: de-DE
language: de
title:
  de: Zahlenmuster und schöne Päckchen
  en: Number patterns and calculation patterns
summary: >
  Lesson 1 continues number sequences, names the rule (immer 5 mehr,
  immer 3 weniger) and finds the number that breaks it; lesson 2 works on
  schöne Päckchen, rows of sums that change in steps (12 + 5, 13 + 5, 14 +
  5), continues them, explains why the result changes, finds the wrong
  one, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Muster, en: Patterns }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.patterns.repeating, math.add-sub-to-20.fluency-to-20]
  also_practises: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.sub-two-digit]
  vocabulary: { de: [Muster, Regel, fortsetzen, schönes Päckchen, immer, mehr, weniger] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: continue, what: { de: Zahlenfolgen und schöne Päckchen fortsetzen, en: continuing number sequences and calculation patterns } }
    - { id: rule, what: { de: die Regel eines Musters finden und prüfen, en: finding and checking the rule of a pattern } }
    - { id: explain, what: { de: "erklären, warum sich das Ergebnis im Päckchen so ändert", en: explaining why the results in a calculation pattern change as they do } }
    - { id: mistake, what: { de: Fehler im Muster finden, en: finding the mistake in a pattern } }
  misconceptions:
    - id: rule-from-two
      what: Guesses the rule from the first two numbers only and misses that the step changes (2, 4, 8, 16 read as immer 2 mehr)
      addressed: lesson 1 Learn checks the rule on every step; l1-f4 and l1-n4 have a sequence whose step is not constant, l1-f4 with hints that check each step
    - id: paeckchen-each-alone
      what: Works out every sum of a schönes Päckchen alone and does not use the pattern to spot the wrong result
      addressed: lesson 2 Learn says how the results must change; every stage of lesson 2 has a Päckchen with one wrong result to find, with feedback in l2-f3
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Zahlenfolgen fortsetzen", en: "Continuing number sequences" }
    goal:
      de: "Setze Zahlenfolgen fort und finde die Regel, so wie immer 5 mehr bei 5, 10, 15, 20."
      en: "Continue number patterns and find the rule, like 5 more each time in 5, 10, 15, 20."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "2, 4, 6, 8, _"
            say: "Zwei, vier, sechs, acht. Welche Zahl kommt als Nächstes?"
            options: ["10", "9", "12"]
            answer: "10"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "25 + 5 = _"
            say: "Fünfundzwanzig plus fünf."
            answer: "30"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5, 10, 15, 20, 25"
            say: "Schau dir die Zahlen an: fünf, zehn, fünfzehn, zwanzig, fünfundzwanzig. Von einer Zahl zur nächsten kommen immer fünf dazu. Das ist die Regel: immer fünf mehr."
          - text: "40, 37, 34, 31, _"
            say: "Hier wird es weniger: vierzig, siebenunddreißig, vierunddreißig, einunddreißig. Die Regel ist: immer drei weniger. Als Nächstes kommt achtundzwanzig."
          - text: "1, 2, 4, 8, 16"
            say: "Prüf die Regel bei jedem Schritt. Eins, zwei, vier, acht, sechzehn: Hier kommen nicht immer gleich viele dazu. Jede Zahl wird verdoppelt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "10, 20, 30, 40, _"
                say: "Zehn, zwanzig, dreißig, vierzig. Welche Zahl kommt als Nächstes?"
                options: ["50", "41", "45"]
                answer: "50"
                option_audio: false
                hints:
                  - "Was kommt von einer Zahl zur nächsten dazu?"
                  - "Immer zehn mehr."
                  - "50."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Regel hat das Muster? 50, 46, 42, 38"
                say: "Fünfzig, sechsundvierzig, zweiundvierzig, achtunddreißig. Welche Regel hat das Muster?"
                options: ["immer 4 weniger", "immer 4 mehr", "immer 2 weniger"]
                answer: "immer 4 weniger"
                hints:
                  - "Werden die Zahlen größer oder kleiner?"
                  - "Von 50 bis 46 sind es 4."
                  - "immer 4 weniger."
              - id: l1-f3
                type: fill_in_blank
                text: "Setze das Muster fort."
                say: "Drei, sechs, neun, zwölf. Setze das Muster fort."
                frame: "3, 6, 9, 12, _, _"
                options: ["15", "18", "14", "16"]
                answer: ["15", "18"]
                hints:
                  - "Immer 3 mehr."
                  - "12 + 3, dann noch einmal + 3."
                  - "15 und 18."
              - id: l1-f4
                type: true_false
                text: "3, 5, 9, 17\nStimmt die Regel „immer 2 mehr“?"
                say: "Drei, fünf, neun, siebzehn. Stimmt die Regel: immer zwei mehr?"
                answer: false
                hints:
                  - "Prüf jeden Schritt, nicht nur den ersten."
                  - "Von 3 zu 5 sind es 2, von 5 zu 9 aber 4."
                  - "Nein, die Regel stimmt nicht."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Zahl passt nicht ins Muster? 15, 20, 25, 31, 35"
                say: "Fünfzehn, zwanzig, fünfundzwanzig, einunddreißig, fünfunddreißig. Welche Zahl passt nicht ins Muster?"
                options: ["31", "25", "35"]
                answer: "31"
                hints:
                  - "Die Regel ist: immer 5 mehr."
                  - "Nach 25 müsste 30 kommen."
                  - "31."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "64, 54, 44, 34, _"
                say: "Vierundsechzig, vierundfünfzig, vierundvierzig, vierunddreißig. Welche Zahl kommt als Nächstes?"
                options: ["24", "33", "30"]
                answer: "24"
                option_audio: false
                hints: ["Schau auf die Zehner."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Regel hat das Muster? 7, 13, 19, 25"
                say: "Sieben, dreizehn, neunzehn, fünfundzwanzig. Welche Regel hat das Muster?"
                options: ["immer 6 mehr", "immer 7 mehr", "immer 6 weniger"]
                answer: "immer 6 mehr"
                hints: ["Wie viele sind es von 7 bis 13?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Setze das Muster fort."
                say: "Neunzig, fünfundachtzig, achtzig, fünfundsiebzig. Setze das Muster fort."
                frame: "90, 85, 80, 75, _, _"
                options: ["70", "65", "60", "72"]
                answer: ["70", "65"]
                hints: ["Immer 5 weniger."]
              - id: l1-s4
                type: true_false
                text: "5, 15, 25, 35\nStimmt die Regel „immer 10 mehr“?"
                say: "Fünf, fünfzehn, fünfundzwanzig, fünfunddreißig. Stimmt die Regel: immer zehn mehr?"
                answer: true
                hints: ["Prüf jeden Schritt."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Zahl passt nicht ins Muster? 80, 72, 64, 58, 48"
                say: "Achtzig, zweiundsiebzig, vierundsechzig, achtundfünfzig, achtundvierzig. Welche Zahl passt nicht ins Muster?"
                options: ["58", "64", "48"]
                answer: "58"
                hints: ["Die Regel ist: immer 8 weniger."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "11, 22, 33, 44, _"
                say: "Elf, zweiundzwanzig, dreiunddreißig, vierundvierzig. Welche Zahl kommt als Nächstes?"
                options: ["55", "45", "54"]
                answer: "55"
                option_audio: false
              - id: l1-n2
                type: multiple_choice
                text: "Welche Regel hat das Muster? 100, 91, 82, 73"
                say: "Hundert, einundneunzig, zweiundachtzig, dreiundsiebzig. Welche Regel hat das Muster?"
                options: ["immer 9 weniger", "immer 10 weniger", "immer 9 mehr"]
                answer: "immer 9 weniger"
              - id: l1-n3
                type: fill_in_blank
                text: "Setze das Muster fort."
                say: "Vier, acht, zwölf, sechzehn. Setze das Muster fort."
                frame: "4, 8, 12, 16, _, _"
                options: ["20", "24", "18", "32"]
                answer: ["20", "24"]
              - id: l1-n4
                type: true_false
                text: "2, 5, 8, 12\nStimmt die Regel „immer 3 mehr“?"
                say: "Zwei, fünf, acht, zwölf. Stimmt die Regel: immer drei mehr?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welche Zahl passt nicht ins Muster? 6, 12, 18, 24, 28, 36"
                say: "Sechs, zwölf, achtzehn, vierundzwanzig, achtundzwanzig, sechsunddreißig. Welche Zahl passt nicht ins Muster?"
                options: ["28", "24", "36"]
                answer: "28"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "35, 40, 45, 50, _"
            say: "Fünfunddreißig, vierzig, fünfundvierzig, fünfzig. Welche Zahl kommt als Nächstes?"
            options: ["55", "51", "60"]
            answer: "55"
            option_audio: false
          - id: l1-c2
            type: multiple_choice
            text: "Welche Regel hat das Muster? 60, 53, 46, 39"
            say: "Sechzig, dreiundfünfzig, sechsundvierzig, neununddreißig. Welche Regel hat das Muster?"
            options: ["immer 7 weniger", "immer 7 mehr", "immer 3 weniger"]
            answer: "immer 7 weniger"
          - id: l1-c3
            type: multiple_choice
            text: "Welche Zahl passt nicht ins Muster? 20, 30, 40, 55, 60"
            say: "Zwanzig, dreißig, vierzig, fünfundfünfzig, sechzig. Welche Zahl passt nicht ins Muster?"
            options: ["55", "40", "60"]
            answer: "55"
          - id: l1-c4
            type: fill_in_blank
            text: "Setze das Muster fort."
            say: "Fünf, neun, dreizehn, siebzehn. Setze das Muster fort."
            frame: "5, 9, 13, 17, _, _"
            options: ["21", "25", "20", "22"]
            answer: ["21", "25"]
          - id: l1-c5
            type: true_false
            text: "48, 42, 36, 30\nStimmt die Regel „immer 6 weniger“?"
            say: "Achtundvierzig, zweiundvierzig, sechsunddreißig, dreißig. Stimmt die Regel: immer sechs weniger?"
            answer: true
          - id: l1-c6
            type: multiple_choice
            text: "99, 89, 79, 69, _"
            say: "Neunundneunzig, neunundachtzig, neunundsiebzig, neunundsechzig. Welche Zahl kommt als Nächstes?"
            options: ["59", "68", "60"]
            answer: "59"
            option_audio: false

  - n: 2
    title: { de: "Schöne Päckchen", en: "Calculation patterns" }
    goal:
      de: "Setze schöne Päckchen fort und sag, warum sich das Ergebnis ändert, so wie bei 12 + 5 und 13 + 5."
      en: "Continue patterns of sums and say why the answer changes, like 12 + 5 and 13 + 5."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "12, 15, 18, 21, _"
            say: "Zwölf, fünfzehn, achtzehn, einundzwanzig. Welche Zahl kommt als Nächstes?"
            options: ["24", "22", "23"]
            answer: "24"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "14 + 5 = _"
            say: "Vierzehn plus fünf."
            answer: "19"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "12 + 5 = 17\n13 + 5 = 18\n14 + 5 = 19"
            say: "Das ist ein schönes Päckchen. Die erste Zahl wird immer um eins größer, die zweite bleibt gleich. Darum wird auch das Ergebnis immer um eins größer."
          - text: "15 + 5 = 20"
            say: "So kannst du das Päckchen fortsetzen, ohne neu zu rechnen: Fünfzehn plus fünf ist zwanzig. Das Ergebnis ist wieder eins größer."
          - text: "30 − 4 = 26\n30 − 5 = 25\n30 − 6 = 23"
            say: "Hier ziehst du immer eins mehr ab. Dann wird das Ergebnis immer eins kleiner. Nach fünfundzwanzig muss vierundzwanzig kommen. Die dreiundzwanzig ist falsch. Das Muster hilft dir, Fehler zu finden."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie geht das Päckchen weiter?\n20 + 3 = 23\n20 + 4 = 24\n20 + 5 = 25\n20 + 6 = _"
                say: "Schau dir das Päckchen an. Wie geht es weiter? Wie viel ist zwanzig plus sechs?"
                options: ["26", "25", "30"]
                answer: "26"
                hints:
                  - "Die zweite Zahl wird immer um eins größer."
                  - "Dann wird auch das Ergebnis um eins größer."
                  - "26."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Warum wird das Ergebnis immer 1 größer?\n31 + 4 = 35\n32 + 4 = 36\n33 + 4 = 37"
                say: "Warum wird das Ergebnis immer um eins größer?"
                options: ["Die erste Zahl wird immer 1 größer.", "Die zweite Zahl wird immer 1 größer.", "Beide Zahlen bleiben gleich."]
                answer: "Die erste Zahl wird immer 1 größer."
                hints:
                  - "Welche Zahl ändert sich, welche bleibt gleich?"
                  - "Die 4 bleibt immer gleich."
                  - "Die erste Zahl wird immer 1 größer."
              - id: l2-f3
                type: multiple_choice
                text: "Welches Ergebnis ist falsch?\n40 − 2 = 38\n40 − 4 = 36\n40 − 6 = 35\n40 − 8 = 32"
                say: "In diesem Päckchen ist ein Ergebnis falsch. Welches?"
                options: ["35", "36", "32"]
                answer: "35"
                feedback:
                  "36": "Von 38 zu 36 sind es 2 weniger. Das passt."
                  "32": "40 − 8 = 32 stimmt. Schau auf das Ergebnis davor."
                hints:
                  - "Du ziehst immer 2 mehr ab."
                  - "Dann wird das Ergebnis immer 2 kleiner: 38, 36, ..."
                  - "35 ist falsch. Richtig wäre 34."
              - id: l2-f4
                type: fill_in_blank
                text: "Setze das Päckchen fort.\n5 + 5 = 10\n15 + 5 = 20\n25 + 5 = 30"
                say: "Fünf plus fünf ist zehn. Fünfzehn plus fünf ist zwanzig. Fünfundzwanzig plus fünf ist dreißig. Setze das Päckchen fort."
                frame: "_ + 5 = _"
                options: ["35", "40", "30", "45"]
                answer: ["35", "40"]
                hints:
                  - "Die erste Zahl wird immer 10 größer."
                  - "Nach 25 kommt 35."
                  - "35 + 5 = 40."
              - id: l2-f5
                type: true_false
                text: "Ist das ein schönes Päckchen?\n10 + 10 = 20\n11 + 9 = 20\n12 + 8 = 20\n13 + 7 = 20"
                say: "Ist das ein schönes Päckchen?"
                answer: true
                hints:
                  - "Gibt es eine Regel, die immer gilt?"
                  - "Eine Zahl wird 1 größer, die andere 1 kleiner. Das Ergebnis bleibt gleich."
                  - "Ja, das ist ein schönes Päckchen."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie geht das Päckchen weiter?\n50 − 10 = 40\n50 − 11 = 39\n50 − 12 = 38\n50 − 13 = _"
                say: "Wie geht das Päckchen weiter? Wie viel ist fünfzig minus dreizehn?"
                options: ["37", "39", "36"]
                answer: "37"
                hints: ["Du ziehst immer eins mehr ab."]
              - id: l2-s2
                type: multiple_choice
                text: "Warum bleibt das Ergebnis gleich?\n30 + 20 = 50\n31 + 19 = 50\n32 + 18 = 50"
                say: "Warum bleibt das Ergebnis immer gleich?"
                options: ["Eine Zahl wird 1 größer, die andere 1 kleiner.", "Beide Zahlen werden größer.", "Beide Zahlen bleiben gleich."]
                answer: "Eine Zahl wird 1 größer, die andere 1 kleiner."
                hints: ["Schau auf beide Zahlen."]
              - id: l2-s3
                type: multiple_choice
                text: "Welches Ergebnis ist falsch?\n23 + 10 = 33\n23 + 20 = 43\n23 + 30 = 53\n23 + 40 = 64"
                say: "In diesem Päckchen ist ein Ergebnis falsch. Welches?"
                options: ["64", "53", "43"]
                answer: "64"
                hints: ["Das Ergebnis wird immer 10 größer."]
              - id: l2-s4
                type: fill_in_blank
                text: "Setze das Päckchen fort.\n60 − 5 = 55\n50 − 5 = 45\n40 − 5 = 35"
                say: "Sechzig minus fünf ist fünfundfünfzig. Fünfzig minus fünf ist fünfundvierzig. Vierzig minus fünf ist fünfunddreißig. Setze das Päckchen fort."
                frame: "_ − 5 = _"
                options: ["30", "25", "35", "20"]
                answer: ["30", "25"]
                hints: ["Die erste Zahl wird immer 10 kleiner."]
              - id: l2-s5
                type: true_false
                text: "Ist das ein schönes Päckchen?\n14 + 3 = 17\n8 + 6 = 14\n20 + 1 = 21"
                say: "Ist das ein schönes Päckchen?"
                answer: false
                hints: ["Gibt es eine Regel, wie sich die Zahlen ändern?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie geht das Päckchen weiter?\n45 + 2 = 47\n45 + 4 = 49\n45 + 6 = 51\n45 + 8 = _"
                say: "Wie geht das Päckchen weiter? Wie viel ist fünfundvierzig plus acht?"
                options: ["53", "52", "55"]
                answer: "53"
              - id: l2-n2
                type: multiple_choice
                text: "Warum wird das Ergebnis immer 10 kleiner?\n90 − 20 = 70\n80 − 20 = 60\n70 − 20 = 50"
                say: "Warum wird das Ergebnis immer um zehn kleiner?"
                options: ["Die erste Zahl wird immer 10 kleiner.", "Die zweite Zahl wird immer 10 größer.", "Beide Zahlen bleiben gleich."]
                answer: "Die erste Zahl wird immer 10 kleiner."
              - id: l2-n3
                type: multiple_choice
                text: "Welches Ergebnis ist falsch?\n60 − 3 = 57\n60 − 6 = 54\n60 − 9 = 52\n60 − 12 = 48"
                say: "In diesem Päckchen ist ein Ergebnis falsch. Welches?"
                options: ["52", "54", "48"]
                answer: "52"
              - id: l2-n4
                type: fill_in_blank
                text: "Setze das Päckchen fort.\n12 + 12 = 24\n13 + 11 = 24\n14 + 10 = 24"
                say: "Zwölf plus zwölf ist vierundzwanzig. Dreizehn plus elf ist vierundzwanzig. Vierzehn plus zehn ist vierundzwanzig. Setze das Päckchen fort."
                frame: "15 + _ = _"
                options: ["9", "24", "11", "25"]
                answer: ["9", "24"]
              - id: l2-n5
                type: true_false
                text: "Ist das ein schönes Päckchen?\n70 − 7 = 63\n70 − 17 = 53\n70 − 27 = 43"
                say: "Ist das ein schönes Päckchen?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: continue
            type: fill_in_blank
            text: "Setze das Muster fort."
            say: "Achtundachtzig, achtundsiebzig, achtundsechzig, achtundfünfzig. Setze das Muster fort."
            frame: "88, 78, 68, 58, _, _"
            options: ["48", "38", "57", "47"]
            answer: ["48", "38"]
          - id: l2-c2
            part: rule
            type: true_false
            text: "10, 15, 20, 30\nStimmt die Regel „immer 5 mehr“?"
            say: "Zehn, fünfzehn, zwanzig, dreißig. Stimmt die Regel: immer fünf mehr?"
            answer: false
          - id: l2-c3
            part: continue
            type: multiple_choice
            text: "Wie geht das Päckchen weiter?\n16 + 3 = 19\n26 + 3 = 29\n36 + 3 = 39\n46 + 3 = _"
            say: "Wie geht das Päckchen weiter? Wie viel ist sechsundvierzig plus drei?"
            options: ["49", "40", "59"]
            answer: "49"
          - id: l2-c4
            part: mistake
            type: multiple_choice
            text: "Welches Ergebnis ist falsch?\n25 + 5 = 30\n25 + 10 = 35\n25 + 15 = 45\n25 + 20 = 45"
            say: "In diesem Päckchen ist ein Ergebnis falsch. Welches?"
            options: ["25 + 15 = 45", "25 + 10 = 35", "25 + 20 = 45"]
            answer: "25 + 15 = 45"
          - id: l2-c5
            part: explain
            type: multiple_choice
            text: "Warum wird das Ergebnis immer 2 größer?\n20 + 1 = 21\n20 + 3 = 23\n20 + 5 = 25"
            say: "Warum wird das Ergebnis immer um zwei größer?"
            options: ["Die zweite Zahl wird immer 2 größer.", "Die erste Zahl wird immer 2 größer.", "Beide Zahlen werden 1 größer."]
            answer: "Die zweite Zahl wird immer 2 größer."
          - id: l2-c6
            part: continue
            type: multiple_choice
            text: "27, 32, 37, 42, _"
            say: "Siebenundzwanzig, zweiunddreißig, siebenunddreißig, zweiundvierzig. Welche Zahl kommt als Nächstes?"
            options: ["47", "43", "52"]
            answer: "47"
            option_audio: false
          - id: l2-c7
            part: continue
            type: fill_in_blank
            text: "Setze das Muster fort."
            say: "Zweiundsiebzig, neunundsechzig, sechsundsechzig, dreiundsechzig. Setze das Muster fort."
            frame: "72, 69, 66, 63, _, _"
            options: ["60", "57", "61", "59"]
            answer: ["60", "57"]
          - id: l2-c8
            part: continue
            type: fill_in_blank
            text: "Setze das Päckchen fort.\n40 + 7 = 47\n41 + 7 = 48\n42 + 7 = 49"
            say: "Vierzig plus sieben ist siebenundvierzig. Einundvierzig plus sieben ist achtundvierzig. Zweiundvierzig plus sieben ist neunundvierzig. Setze das Päckchen fort."
            frame: "_ + 7 = _"
            options: ["43", "50", "51", "44"]
            answer: ["43", "50"]
          - id: l2-c9
            part: rule
            type: multiple_choice
            text: "Welche Regel hat das Muster? 18, 26, 34, 42"
            say: "Achtzehn, sechsundzwanzig, vierunddreißig, zweiundvierzig. Welche Regel hat das Muster?"
            options: ["immer 8 mehr", "immer 6 mehr", "immer 8 weniger"]
            answer: "immer 8 mehr"
          - id: l2-c10
