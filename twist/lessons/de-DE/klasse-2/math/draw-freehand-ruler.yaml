# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.draw-freehand-ruler
skill: math.shapes.draw-freehand-ruler
curriculum: de-DE
language: de
title:
  de: Zeichnen mit Lineal und frei Hand
  en: Drawing with a ruler and freehand
summary: >
  Lesson 1 chooses the tool (frei Hand for a Wellenlinie or a Baum, das
  Lineal for straight lines, die Schablone for a Kreis), says how to hold
  the ruler, and counts how many Kästchen long a line on Karopapier is;
  lesson 2 picks the right drawing of a Quadrat or Rechteck of given
  size, finds what is wrong with a drawing (a corner open, a side
  slanted, sides not equal), continues line patterns and ends with the
  skill check. The child cannot draw in the app yet, so every task asks
  which drawing, which tool or what is wrong; drawing on the grid with a
  finger waits for a drawing task.
metadata:
  year: klasse-2
  topic: { de: Formen, en: Shapes }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.shapes.properties]
  also_practises: []
  vocabulary: { de: [Lineal, frei Hand, Schablone, Karopapier, Kästchen, Linie, Wellenlinie, Muster, Quadrat, Rechteck, Ecke, Seite] }
  forms: [picture, text, audio, drawn]
  drawn: [shape, grid]
  facets: []
  misconceptions:
    - id: counts-points
      what: Counts the grid lines or points along a line instead of the Kästchen between its ends, so a line 3 Kästchen long is called 4
      addressed: lesson 1 Learn counts the Kästchen from one end to the other; l1-f2 has feedback on the extra one, l1-s1, l1-n2 and l2-c1 offer one too many
    - id: ruler-held-loosely
      what: Holds the ruler loosely or with the fingers at the drawing edge, so it slips and the line goes crooked
      addressed: lesson 1 Learn shows how to hold the ruler; l1-f3 has feedback on both wrong ways, l1-s3, l1-s5 and l1-c3 ask about a slipping ruler
    - id: figure-not-closed
      what: Takes a drawing as finished when a corner is open, a side is slanted or the sides of a square are not equal
      addressed: lesson 2 Learn says the corners meet and every line runs on the Kästchenlinien; l2-f2 and l2-s2 have feedback, l2-s4, l2-n2 and l2-c4 ask what is wrong
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Lineal oder frei Hand?", en: "Ruler or freehand?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Ecken hat ein Rechteck?"
            say: "Wie viele Ecken hat ein Rechteck?"
            show: { drawn: shape, kind: rectangle, colour: green }
            options: ["4", "3", "2"]
            answer: "4"
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Wo sind alle Seiten gleich lang?"
            say: "Bei welcher Form sind alle Seiten gleich lang?"
            options:
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: square, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
            answer: square
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Frei Hand oder mit dem Lineal?"
            say: "Manches zeichnest du frei Hand, also ohne Hilfsmittel: eine Wellenlinie, einen Baum oder eine Blume. Gerade Linien zeichnest du mit dem Lineal."
            show: { object: ruler }
          - text: "Lineal gut festhalten"
            say: "Leg das Lineal flach auf das Papier und halte es mit einer Hand gut fest. Deine Finger liegen in der Mitte, nicht an der Kante. Dann fährst du mit dem gespitzten Bleistift an der Kante entlang."
          - text: "Diese Linie ist 4 Kästchen lang."
            say: "Auf Karopapier zeichnest du auf den Kästchenlinien. Wie lang ist diese Linie? Zähl die Kästchen von einem Ende bis zum anderen: eins, zwei, drei, vier. Sie ist vier Kästchen lang."
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 5, 1]] }
          - text: "Kreise mit der Schablone"
            say: "Einen Kreis zeichnest du mit einer Schablone. Du fährst mit dem Stift innen am Rand vom Loch entlang. So wird der Kreis schön rund."
            show: { drawn: shape, kind: circle, colour: blue }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was zeichnest du mit dem Lineal?"
                say: "Was zeichnest du mit dem Lineal?"
                options: ["eine gerade Linie", "eine Wellenlinie", "eine Blume"]
                answer: "eine gerade Linie"
                hints:
                  - "Das Lineal hat eine gerade Kante."
                  - "Am Lineal entlang wird die Linie gerade."
                  - "Eine gerade Linie."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie viele Kästchen lang ist die Linie?"
                say: "Wie viele Kästchen lang ist die Linie?"
                show: { drawn: grid, cols: 5, rows: 2, lines: [[1, 1, 4, 1]] }
                options: ["3", "4", "2"]
                answer: "3"
                feedback:
                  "4": "Du hast die Striche gezählt. Zähl die Kästchen zwischen dem Anfang und dem Ende."
                hints:
                  - "Zähl die Kästchen, an denen die Linie entlangläuft."
                  - "Fang am linken Ende an: eins, zwei, ..."
                  - "3 Kästchen."
              - id: l1-f3
                type: multiple_choice
                text: "Wie hältst du das Lineal richtig?"
                say: "Wie hältst du das Lineal richtig?"
                options: ["mit einer Hand gut fest, die Finger in der Mitte", "ganz locker, es darf rutschen", "mit den Fingern an der Kante, wo der Stift fährt"]
                answer: "mit einer Hand gut fest, die Finger in der Mitte"
                feedback:
                  "ganz locker, es darf rutschen": "Rutscht das Lineal, wird die Linie krumm. Halte es gut fest."
                  "mit den Fingern an der Kante, wo der Stift fährt": "Dann stößt der Stift an deine Finger. Die Finger gehören in die Mitte."
                hints:
                  - "Das Lineal darf nicht rutschen."
                  - "Der Stift braucht an der Kante Platz."
                  - "Gut festhalten, die Finger in der Mitte."
              - id: l1-f4
                type: true_false
                text: "Eine Blume zeichnest du frei Hand."
                say: "Stimmt das? Eine Blume zeichnest du frei Hand."
                answer: true
                hints:
                  - "Hat eine Blume gerade Linien?"
                  - "Die Blüten sind rund und geschwungen."
                  - "Ja, frei Hand."
              - id: l1-f5
                type: multiple_choice
                text: "Womit zeichnest du einen schönen runden Kreis?"
                say: "Womit zeichnest du einen schönen runden Kreis?"
                options: ["mit der Schablone", "mit dem Lineal", "mit der Schere"]
                answer: "mit der Schablone"
                hints:
                  - "Ein Kreis hat keine geraden Linien."
                  - "Du fährst mit dem Stift innen an einem runden Loch entlang."
                  - "Mit der Schablone."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Kästchen lang ist die Linie?"
                say: "Wie viele Kästchen lang ist die Linie?"
                show: { drawn: grid, cols: 4, rows: 5, lines: [[2, 0, 2, 5]] }
                options: ["5", "6", "4"]
                answer: "5"
                hints: ["Zähl die Kästchen von oben nach unten, nicht die Striche."]
              - id: l1-s2
                type: sorting
                text: "Mit dem Lineal oder frei Hand?"
                say: "Was zeichnest du mit dem Lineal, was frei Hand? Sortiere."
                bins:
                  - { id: ruler, show: { text: "mit dem Lineal" }, say: "mit dem Lineal" }
                  - { id: free, show: { text: "frei Hand" }, say: "frei Hand" }
                options:
                  - { text: "die Seiten von einem Quadrat", bin: ruler }
                  - { text: "eine Wellenlinie", bin: free }
                  - { text: "einen Baum", bin: free }
                  - { text: "eine lange gerade Linie", bin: ruler }
                hints: ["Gerade Linien mit dem Lineal, geschwungene frei Hand."]
              - id: l1-s3
                type: true_false
                text: "Beim Zeichnen darf das Lineal ein bisschen rutschen."
                say: "Stimmt das? Beim Zeichnen darf das Lineal ein bisschen rutschen."
                answer: false
                hints: ["Was passiert mit der Linie, wenn das Lineal rutscht?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Welche Linie ist 4 Kästchen lang?"
                say: "Welche Linie ist vier Kästchen lang?"
                options:
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 3, 1]], key: "2" }
                  - { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 5, 1]], key: "4" }
                  - { drawn: grid, cols: 6, rows: 2, lines: [[0, 1, 5, 1]], key: "5" }
                answer: "4"
                hints: ["Zähl bei jeder Linie die Kästchen von Ende zu Ende."]
              - id: l1-s5
                type: multiple_choice
                text: "Tim zeichnet mit dem Lineal. Seine Linie ist krumm. Was ist passiert?"
                say: "Tim zeichnet mit dem Lineal. Trotzdem ist seine Linie krumm geworden. Was ist passiert?"
                options: ["Das Lineal ist verrutscht.", "Das Papier ist kariert.", "Der Bleistift ist gelb."]
                answer: "Das Lineal ist verrutscht."
                hints: ["Am Lineal entlang wird eine Linie gerade, wenn es still liegt."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was zeichnest du frei Hand?"
                say: "Was zeichnest du frei Hand?"
                options: ["eine Wellenlinie", "die Seiten von einem Rechteck", "eine gerade Linie, 6 Kästchen lang"]
                answer: "eine Wellenlinie"
              - id: l1-n2
                type: multiple_choice
                text: "Wie viele Kästchen lang ist die Linie?"
                say: "Wie viele Kästchen lang ist die Linie?"
                show: { drawn: grid, cols: 8, rows: 2, lines: [[0, 1, 7, 1]] }
                options: ["7", "8", "6"]
                answer: "7"
              - id: l1-n3
                type: true_false
                text: "Mit einer Schablone kannst du einen Kreis zeichnen."
                say: "Stimmt das? Mit einer Schablone kannst du einen Kreis zeichnen."
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Welche Linie ist 3 Kästchen lang?"
                say: "Welche Linie ist drei Kästchen lang?"
                options:
                  - { drawn: grid, cols: 3, rows: 5, lines: [[1, 1, 1, 5]], key: "4" }
                  - { drawn: grid, cols: 3, rows: 5, lines: [[1, 1, 1, 4]], key: "3" }
                  - { drawn: grid, cols: 3, rows: 5, lines: [[1, 2, 1, 4]], key: "2" }
                answer: "3"
              - id: l1-n5
                type: multiple_choice
                text: "Lea will eine gerade Linie zeichnen, 5 Kästchen lang. Was nimmt sie?"
                say: "Lea will eine gerade Linie zeichnen, fünf Kästchen lang. Was nimmt sie?"
                options: ["das Lineal", "die Schablone", "nichts, sie zeichnet frei Hand"]
                answer: "das Lineal"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Kästchen lang ist die Linie?"
            say: "Wie viele Kästchen lang ist die Linie?"
            show: { drawn: grid, cols: 8, rows: 2, lines: [[1, 1, 7, 1]] }
            options: ["6", "7", "5"]
            answer: "6"
          - id: l1-c2
            type: multiple_choice
            text: "Womit wird eine lange Linie schön gerade?"
            say: "Womit wird eine lange Linie schön gerade?"
            options: ["mit dem Lineal", "frei Hand", "mit der Schablone"]
            answer: "mit dem Lineal"
          - id: l1-c3
            type: true_false
            text: "Beim Zeichnen hältst du das Lineal gut fest."
            say: "Stimmt das? Beim Zeichnen hältst du das Lineal gut fest."
            answer: true

  - n: 2
    title: { de: "Figuren und Muster auf Karopapier", en: "Shapes and patterns on squared paper" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Kästchen lang ist die Linie?"
            say: "Wie viele Kästchen lang ist die Linie?"
            show: { drawn: grid, cols: 6, rows: 2, lines: [[1, 1, 3, 1]] }
            options: ["2", "3", "1"]
            answer: "2"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Was zeichnest du frei Hand?"
            say: "Was zeichnest du frei Hand?"
            options: ["eine Schlange", "ein Rechteck", "eine gerade Linie"]
            answer: "eine Schlange"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Ein Quadrat: jede Seite 3 Kästchen lang"
            say: "Das ist ein Quadrat auf Karopapier. Jede Seite ist drei Kästchen lang. Du zeichnest mit dem Lineal genau auf den Kästchenlinien. An jeder Ecke treffen sich zwei Linien."
            show: { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 0], [4, 0, 4, 3], [4, 3, 1, 3], [1, 3, 1, 0]] }
          - text: "Ein Rechteck: 4 Kästchen lang, 2 Kästchen hoch"
            say: "Das ist ein Rechteck. Es ist vier Kästchen lang und zwei Kästchen hoch. Die Seiten gegenüber sind gleich lang."
            show: { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 5, 0], [5, 0, 5, 2], [5, 2, 1, 2], [1, 2, 1, 0]] }
          - text: "Muster: schräg hoch, schräg runter"
            say: "Bei einem Muster wiederholt sich etwas immer wieder. Diese Linie geht schräg durch ein Kästchen nach oben, dann schräg durch das nächste nach unten. Und immer so weiter."
            show: { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 4, 1]] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Bei welchem Quadrat ist jede Seite 2 Kästchen lang?"
                say: "Bei welchem Quadrat ist jede Seite zwei Kästchen lang?"
                options:
                  - { drawn: grid, cols: 5, rows: 4, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 1, 3], [1, 3, 1, 1]], key: "2x2" }
                  - { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 0], [4, 0, 4, 3], [4, 3, 1, 3], [1, 3, 1, 0]], key: "3x3" }
                  - { drawn: grid, cols: 5, rows: 4, lines: [[1, 1, 4, 1], [4, 1, 4, 3], [4, 3, 1, 3], [1, 3, 1, 1]], key: "3x2" }
                answer: "2x2"
                feedback:
                  "3x2": "Hier ist die Figur oben 3 Kästchen lang und an der Seite nur 2. Das ist ein Rechteck."
                hints:
                  - "Zähl bei jeder Figur die Kästchen oben und an der Seite."
                  - "Beide müssen 2 Kästchen lang sein."
                  - "Es ist die kleinste Figur."
              - id: l2-f2
                type: multiple_choice
                text: "Was ist an dieser Zeichnung falsch?"
                say: "Hier sollte ein Rechteck entstehen. Was ist an der Zeichnung falsch?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 2]] }
                options: ["Eine Linie ist zu kurz, eine Ecke ist offen.", "Die Linien sind nicht gerade.", "Es ist alles richtig."]
                answer: "Eine Linie ist zu kurz, eine Ecke ist offen."
                feedback:
                  "Es ist alles richtig.": "Schau links oben in die Ecke. Treffen sich dort die Linien?"
                hints:
                  - "Fahr mit dem Finger einmal um die Figur herum."
                  - "Links oben bleibt eine Lücke."
                  - "Die linke Linie ist zu kurz, die Ecke ist offen."
              - id: l2-f3
                type: multiple_choice
                text: "Wie geht das Muster weiter?"
                say: "Wie geht die Linie im Muster als Nächstes weiter?"
                show: { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0]] }
                options: ["schräg nach unten", "schräg nach oben", "gerade nach rechts"]
                answer: "schräg nach unten"
                hints:
                  - "Schau, wie die Linien abwechseln."
                  - "Hoch, runter, hoch. Was kommt jetzt?"
                  - "Schräg nach unten."
              - id: l2-f4
                type: true_false
                text: "Das Rechteck ist 4 Kästchen lang und 2 Kästchen hoch."
                say: "Stimmt das? Das Rechteck ist vier Kästchen lang und zwei Kästchen hoch."
                show: { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 5, 0], [5, 0, 5, 2], [5, 2, 1, 2], [1, 2, 1, 0]] }
                answer: true
                hints:
                  - "Zähl zuerst oben, dann an der Seite."
                  - "Oben 4 Kästchen, an der Seite 2 Kästchen."
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "Wie viele Kästchen lang ist eine Seite von diesem Quadrat?"
                say: "Wie viele Kästchen lang ist eine Seite von diesem Quadrat?"
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 0, 5, 0], [5, 0, 5, 4], [5, 4, 1, 4], [1, 4, 1, 0]] }
                options: ["4", "16", "5"]
                answer: "4"
                feedback:
                  "16": "16 sind alle Kästchen innen. Gefragt ist nur eine Seite."
                hints:
                  - "Nimm eine Seite, zum Beispiel oben."
                  - "Zähl die Kästchen an der oberen Seite."
                  - "4 Kästchen."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welches Rechteck ist 3 Kästchen lang und 1 Kästchen hoch?"
                say: "Welches Rechteck ist drei Kästchen lang und ein Kästchen hoch?"
                options:
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 1, 5, 1], [5, 1, 5, 2], [5, 2, 1, 2], [1, 2, 1, 1]], key: "4x1" }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 1, 4, 1], [4, 1, 4, 2], [4, 2, 1, 2], [1, 2, 1, 1]], key: "3x1" }
                  - { drawn: grid, cols: 6, rows: 3, lines: [[1, 0, 4, 0], [4, 0, 4, 2], [4, 2, 1, 2], [1, 2, 1, 0]], key: "3x2" }
                answer: "3x1"
                hints: ["Zähl bei jedem Rechteck die Kästchen oben und an der Seite."]
              - id: l2-s2
                type: multiple_choice
                text: "Ole wollte ein Quadrat zeichnen. Was ist falsch?"
                say: "Ole wollte ein Quadrat zeichnen. Was ist an seiner Zeichnung falsch?"
                show: { drawn: grid, cols: 5, rows: 3, lines: [[1, 0, 4, 0], [4, 0, 4, 2], [4, 2, 1, 2], [1, 2, 1, 0]] }
                options: ["Die Seiten sind nicht gleich lang.", "Eine Ecke ist offen.", "Es ist alles richtig."]
                answer: "Die Seiten sind nicht gleich lang."
                feedback:
                  "Es ist alles richtig.": "Oben sind es 3 Kästchen, an der Seite nur 2. Beim Quadrat sind alle Seiten gleich lang."
                hints: ["Beim Quadrat sind alle Seiten gleich lang. Zähl oben und an der Seite."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welche Zeichnung setzt das Muster richtig fort?"
                say: "So fängt das Muster an. Welche Zeichnung setzt es richtig fort?"
                show: { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0]] }
                options:
                  - { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 4, 1], [4, 1, 6, 1]], key: flach }
                  - { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 4, 1], [4, 1, 5, 0], [5, 0, 6, 1]], key: richtig }
                  - { drawn: grid, cols: 6, rows: 1, lines: [[0, 1, 1, 0], [1, 0, 2, 1], [2, 1, 3, 0], [3, 0, 5, 0], [5, 0, 6, 1]], key: oben }
                answer: richtig
                hints: ["Hoch, runter, hoch, runter: Prüf jede Zeichnung bis zum Ende."]
              - id: l2-s4
                type: true_false
                text: "Das ist ein Quadrat."
                say: "Stimmt das? Das ist ein Quadrat."
                show: { drawn: grid, cols: 6, rows: 4, lines: [[1, 0, 5, 0], [5, 0, 5, 3], [5, 3, 1, 3], [1, 3, 1, 0]] }
                answer: false
                hints: ["Zähl die Kästchen oben und an der Seite. Sind es gleich viele?"]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Kästchen malst du als Nächstes aus?"
                say: "Die blauen Kästchen sind ein Muster. Welches Kästchen malst du als Nächstes aus?"
                show: { drawn: grid, cols: 5, rows: 4, cells: [[0, 3, blue], [1, 2, blue], [2, 1, blue]] }
                options: ["eins nach rechts und eins nach oben", "eins nach rechts", "eins nach oben"]
                answer: "eins nach rechts und eins nach oben"
                hints: ["Schau, wie du vom ersten zum zweiten blauen Kästchen kommst."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Paula zeichnet ein Rechteck: 5 Kästchen lang, 2 Kästchen hoch. Welches ist ihres?"
                say: "Paula zeichnet ein Rechteck. Es ist fünf Kästchen lang und zwei Kästchen hoch. Welche Zeichnung ist ihre?"
                options:
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 5, 1], [5, 1, 5, 3], [5, 3, 1, 3], [1, 3, 1, 1]], key: "4x2" }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 0, 6, 0], [6, 0, 6, 3], [6, 3, 1, 3], [1, 3, 1, 0]], key: "5x3" }
                  - { drawn: grid, cols: 7, rows: 4, lines: [[1, 1, 6, 1], [6, 1, 6, 3], [6, 3, 1, 3], [1, 3, 1, 1]], key: "5x2" }
                answer: "5x2"
              - id: l2-n2
                type: multiple_choice
                text: "Jonas wollte ein Quadrat zeichnen. Was ist falsch?"
                say: "Jonas wollte ein Quadrat zeichnen. Was ist an seiner Zeichnung falsch?"
                show: { drawn: grid, cols: 5, rows: 4, lines: [[1, 0, 4, 1], [4, 1, 4, 3], [4, 3, 1, 3], [1, 3, 1, 0]] }
                options: ["Eine Linie ist schief.", "Eine Ecke ist offen.", "Es ist alles richtig."]
                answer: "Eine Linie ist schief."
              - id: l2-n3
                type: true_false
                text: "Finns Rechteck ist 6 Kästchen lang und 1 Kästchen hoch."
                say: "Finn hat ein Rechteck gezeichnet. Stimmt das? Es ist sechs Kästchen lang und ein Kästchen hoch."
                show: { drawn: grid, cols: 8, rows: 3, lines: [[1, 1, 7, 1], [7, 1, 7, 2], [7, 2, 1, 2], [1, 2, 1, 1]] }
