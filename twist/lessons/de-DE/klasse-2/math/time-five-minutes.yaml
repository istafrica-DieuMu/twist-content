# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.time-five-minutes
skill: math.time.five-minutes
curriculum: de-DE
language: de
title:
  de: Uhrzeit auf fünf Minuten genau
  en: Time to five minutes
summary: >
  Reading the clock in steps of five minutes. Lesson 1 counts the long
  hand in Fünferschritten (on the 4 it is 20 minutes) and says nach and
  vor (zehn nach drei, zehn vor vier); lesson 2 reads the times around
  halb (fünf vor halb vier, fünf nach halb vier), learns that an hour has
  60 minutes and a day 24 hours, and ends with the skill check. Every
  practise stage and both checks also ask the child to set the hands to
  five minutes (clock_hands_drag).
metadata:
  year: klasse-2
  topic: { de: Uhrzeit, en: Time }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.time.quarter-hours, math.mult-div.table-5-10]
  also_practises: [math.mult-div.table-5-10, math.time.quarter-hours]
  vocabulary: { de: [Minute, Stunde, nach, vor, fünf vor halb, fünf nach halb, Tag] }
  forms: [drawn, text, audio]
  drawn: [clock]
  facets: []
  parts:
    - { id: read, what: { de: die Uhrzeit auf fünf Minuten genau ablesen, en: reading the time to five minutes } }
    - { id: halb, what: { de: "Zeiten um halb ablesen: fünf vor halb, fünf nach halb", en: "reading times around half past: 25 past and 25 to" } }
    - { id: set, what: { de: die Zeiger auf fünf Minuten genau stellen, en: setting the hands to five minutes } }
    - { id: units, what: { de: "wissen, dass eine Stunde 60 Minuten und ein Tag 24 Stunden hat", en: knowing that an hour has 60 minutes and a day 24 hours } }
  misconceptions:
    - id: number-is-minutes
      what: Reads the number the long hand points to as the minutes (on the 4 it is 4 minutes)
      addressed: lesson 1 Learn counts in fives; "Wie viele Minuten?" in every stage of lesson 1 offers the plain number, with feedback in l1-f1
    - id: halb-reference
      what: Gets lost around halb (3:25 as fünf vor halb drei)
      addressed: lesson 2 Learn reads 3:25 and 3:35 against halb vier; every stage of lesson 2 has a fünf-vor-halb or fünf-nach-halb task offering the wrong hour
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Nach und vor", en: "Past and to" }
    goal:
      de: "Lies die Uhr in Fünferschritten und sag nach oder vor, so wie zehn nach drei oder zehn vor vier."
      en: "Read the clock in steps of five and say past or to, like ten past three or ten to four."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "Zähle in Fünferschritten."
            say: "Zähle in Fünferschritten. Welche Zahl fehlt?"
            frame: "5, 10, 15, _, 25"
            options: ["20", "16", "30"]
            answer: ["20"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 6, minute: 45 }
            options: ["Viertel vor 7", "Viertel nach 6", "halb 7"]
            answer: "Viertel vor 7"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5, 10, 15, 20"
            say: "Von einer Zahl zur nächsten läuft der große Zeiger fünf Minuten. Zeigt er auf die Vier, zählst du: fünf, zehn, fünfzehn, zwanzig. Es sind zwanzig Minuten nach der vollen Stunde."
            show: { drawn: clock, hour: 3, minute: 20 }
          - text: "10 nach 3 | 3:10"
            say: "Der große Zeiger zeigt auf die Zwei: zehn Minuten nach drei. Man sagt: zehn nach drei."
            show: { drawn: clock, hour: 3, minute: 10, digital: true }
          - text: "10 vor 4 | 3:50"
            say: "Jetzt zeigt der große Zeiger auf die Zehn. Bis zur vollen Stunde fehlen noch zehn Minuten. Man sagt: zehn vor vier."
            show: { drawn: clock, hour: 3, minute: 50, digital: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Minuten nach der vollen Stunde?"
                say: "Der große Zeiger zeigt auf die Fünf. Wie viele Minuten sind es nach der vollen Stunde?"
                show: { drawn: clock, hour: 8, minute: 25 }
                options: ["25", "5", "50"]
                answer: "25"
                feedback:
                  "5": "Zeigt der große Zeiger auf die Fünf, zählst du in Fünferschritten bis dorthin."
                hints:
                  - "Zähle in Fünferschritten bis zur Fünf."
                  - "Bei der Eins sind es fünf Minuten, bei der Zwei zehn. Zähl weiter bis zur Fünf."
                  - "25."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 2, minute: 5 }
                options: ["5 nach 2", "5 vor 2", "10 nach 2"]
                answer: "5 nach 2"
                hints:
                  - "Wohin zeigt der große Zeiger?"
                  - "Er zeigt auf die Eins. Wie viele Minuten sind das?"
                  - "5 nach 2."
              - id: l1-f3
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 5, minute: 50 }
                options: ["10 vor 6", "10 nach 5", "10 vor 5"]
                answer: "10 vor 6"
                hints:
                  - "Der große Zeiger zeigt auf die Zehn. Wie viele Minuten fehlen bis zur vollen Stunde?"
                  - "Zehn Minuten fehlen. Zu welcher Zahl läuft der kleine Zeiger?"
                  - "10 vor 6."
              - id: l1-f4
                type: true_false
                text: "Ist es 20 nach 9?"
                say: "Ist es zwanzig nach neun?"
                show: { drawn: clock, hour: 9, minute: 20 }
                answer: true
                hints:
                  - "Zähle in Fünferschritten bis zum großen Zeiger."
                  - "Er zeigt auf die Vier. Wie viele Fünferschritte sind das?"
                  - "Ja, es ist 20 nach 9."
              - id: l1-f5
                type: clock_hands_drag
                text: "Stell die Uhr auf 10 nach 7."
                say: "Stell die Uhr auf zehn nach sieben. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "7:10"
                feedback:
                  "6:50": "Das ist zehn vor sieben. Nach heißt: nach der vollen Stunde. Der große Zeiger zeigt auf die Zwei."
                  "2:35": "Du hast die Zeiger vertauscht. Der kleine Zeiger zeigt die Stunde: Er gehört auf die Sieben."
                hints:
                  - "Nach heißt: nach der vollen Stunde."
                  - "Zehn Minuten: Zähle fünf, zehn. Der große Zeiger zeigt auf die Zwei."
                  - "Zieh den großen Zeiger auf die Zwei und den kleinen Zeiger auf die Sieben."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Minuten nach der vollen Stunde?"
                say: "Der große Zeiger zeigt auf die Acht. Wie viele Minuten sind es nach der vollen Stunde?"
                show: { drawn: clock, hour: 4, minute: 40 }
                options: ["40", "8", "45"]
                answer: "40"
                hints: ["Zähle in Fünferschritten bis zur Acht."]
              - id: l1-s2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 11, minute: 10 }
                options: ["10 nach 11", "10 vor 11", "2 nach 11"]
                answer: "10 nach 11"
                hints: ["Der große Zeiger zeigt auf die Zwei."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 1, minute: 55 }
                options: ["5 vor 2", "5 nach 2", "5 vor 1"]
                answer: "5 vor 2"
                hints: ["Wie viele Minuten fehlen bis zur vollen Stunde?"]
              - id: l1-s4
                type: true_false
                text: "Ist es 20 vor 4?"
                say: "Ist es zwanzig vor vier?"
                show: { drawn: clock, hour: 4, minute: 20 }
                answer: false
                hints: ["Ist die volle Stunde schon vorbei?"]
              - id: l1-s5
                type: clock_hands_drag
                text: "Stell die Uhr auf 5 vor 9."
                say: "Stell die Uhr auf fünf vor neun. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "8:55"
                feedback:
                  "9:05": "Das ist fünf nach neun. Fünf vor neun ist noch vor neun Uhr: Der große Zeiger zeigt auf die Elf."
                  "9:55": "Das ist fünf vor zehn. Zieh den kleinen Zeiger auf die Acht. Er steht dann fast bei der Neun."
                hints: ["Fünf vor neun ist noch vor neun Uhr. Der große Zeiger zeigt auf die Elf."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Minuten nach der vollen Stunde?"
                say: "Wie viele Minuten sind es nach der vollen Stunde?"
                show: { drawn: clock, hour: 10, minute: 35 }
                options: ["35", "7", "30"]
                answer: "35"
              - id: l1-n2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 6, minute: 20 }
                options: ["20 nach 6", "20 vor 6", "4 nach 6"]
                answer: "20 nach 6"
              - id: l1-n3
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 7, minute: 40 }
                options: ["20 vor 8", "20 nach 7", "20 vor 7"]
                answer: "20 vor 8"
              - id: l1-n4
                type: true_false
                text: "Ist es 5 nach 12?"
                say: "Ist es fünf nach zwölf?"
                show: { drawn: clock, hour: 12, minute: 5 }
                answer: true
              - id: l1-n5
                type: clock_hands_drag
                text: "Stell die Uhr auf 10 vor 3."
                say: "Stell die Uhr auf zehn vor drei. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "2:50"
                feedback:
                  "3:10": "Das ist zehn nach drei. Zehn vor drei ist noch vor drei Uhr: Der große Zeiger zeigt auf die Zehn."
                  "3:50": "Das ist zehn vor vier. Zieh den kleinen Zeiger auf die Zwei. Er steht dann fast bei der Drei."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 9, minute: 10 }
            options: ["10 nach 9", "10 vor 9", "2 nach 9"]
            answer: "10 nach 9"
          - id: l1-c2
            type: clock_hands_drag
            text: "Stell die Uhr auf 5 vor 4."
            say: "Stell die Uhr auf fünf vor vier. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 5
            answer: "3:55"
            feedback:
              "4:05": "Das ist fünf nach vier. Fünf vor vier ist noch vor vier Uhr: Der große Zeiger zeigt auf die Elf."
              "4:55": "Das ist fünf vor fünf. Der kleine Zeiger steht kurz vor der Vier."
          - id: l1-c3
            type: multiple_choice
            text: "Wie viele Minuten nach der vollen Stunde?"
            say: "Wie viele Minuten sind es nach der vollen Stunde?"
            show: { drawn: clock, hour: 5, minute: 55 }
            options: ["55", "11", "50"]
            answer: "55"
          - id: l1-c4
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 12, minute: 40 }
            options: ["20 vor 1", "20 nach 12", "20 vor 12"]
            answer: "20 vor 1"
          - id: l1-c5
            type: multiple_choice
            text: "Wie viele Minuten nach der vollen Stunde?"
            say: "Wie viele Minuten sind es nach der vollen Stunde?"
            show: { drawn: clock, hour: 6, minute: 45 }
            options: ["45", "9", "40"]
            answer: "45"
          - id: l1-c6
            type: clock_hands_drag
            text: "Stell die Uhr auf 20 nach 5."
            say: "Stell die Uhr auf zwanzig nach fünf. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 5
            answer: "5:20"
            feedback:
              "4:40": "Das ist zwanzig vor fünf. Nach heißt: nach der vollen Stunde. Der große Zeiger zeigt auf die Vier."

  - n: 2
    title: { de: "Um halb herum", en: "Around half past" }
    goal:
      de: "Lies die Uhrzeiten um halb herum, so wie fünf vor halb vier, und stell sie auf der Uhr ein."
      en: "Read the times around half past, like twenty-five past three, and set them on the clock."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 8, minute: 5 }
            options: ["5 nach 8", "5 vor 8", "1 nach 8"]
            answer: "5 nach 8"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 4, minute: 30 }
            options: ["halb 5", "halb 4", "4 Uhr"]
            answer: "halb 5"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "5 vor halb 4 | 3:25"
            say: "Der große Zeiger zeigt auf die Fünf. Bis halb vier fehlen noch fünf Minuten. Man sagt: fünf vor halb vier. Auf der Digitaluhr steht drei, Doppelpunkt, fünfundzwanzig."
            show: { drawn: clock, hour: 3, minute: 25, digital: true }
          - text: "5 nach halb 4 | 3:35"
            say: "Zeigt der große Zeiger auf die Sieben, ist halb vier seit fünf Minuten vorbei: fünf nach halb vier, also drei Uhr fünfunddreißig."
            show: { drawn: clock, hour: 3, minute: 35, digital: true }
          - text: "1 Stunde = 60 Minuten | 1 Tag = 24 Stunden"
            say: "Läuft der große Zeiger einmal ganz herum, ist eine Stunde vergangen. Das sind sechzig Minuten. Ein ganzer Tag hat vierundzwanzig Stunden."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 6, minute: 25 }
                options: ["5 vor halb 7", "5 vor halb 6", "5 nach halb 7"]
                answer: "5 vor halb 7"
                feedback:
                  "5 vor halb 6": "Halb sechs war schon um fünf Uhr dreißig. Hier geht es auf halb sieben zu."
                hints:
                  - "Der große Zeiger zeigt auf die Fünf. Es ist kurz vor halb."
                  - "Welche halbe Stunde kommt gleich? Zu welcher Zahl läuft der kleine Zeiger?"
                  - "5 vor halb 7."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 9, minute: 35 }
                options: ["5 nach halb 10", "5 nach halb 9", "5 vor halb 10"]
                answer: "5 nach halb 10"
                hints:
                  - "Der große Zeiger zeigt auf die Sieben. Ist halb schon vorbei?"
                  - "Halb ist seit fünf Minuten vorbei. Zu welcher Zahl läuft der kleine Zeiger?"
                  - "5 nach halb 10."
              - id: l2-f3
                type: multiple_choice
                text: "Es ist 5 vor halb 2. Was zeigt die Digitaluhr?"
                say: "Es ist fünf vor halb zwei. Was zeigt die Digitaluhr?"
                options: ["1:25", "2:25", "1:35"]
                answer: "1:25"
                hints:
                  - "Halb zwei ist ein Uhr dreißig."
                  - "Fünf Minuten früher."
                  - "1:25."
              - id: l2-f4
                type: true_false
                text: "Hat eine Stunde 60 Minuten?"
                say: "Hat eine Stunde sechzig Minuten?"
                answer: true
                hints:
                  - "Wie oft zählst du in Fünferschritten, bis der große Zeiger einmal herum ist?"
                  - "Zwölfmal fünf Minuten."
                  - "Ja, 60 Minuten."
              - id: l2-f5
                type: clock_hands_drag
                text: "Stell die Uhr auf 5 nach halb 8."
                say: "Stell die Uhr auf fünf nach halb acht. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "7:35"
                feedback:
                  "8:35": "Das ist fünf nach halb neun. Halb acht ist sieben Uhr dreißig: Zieh den kleinen Zeiger auf die Sieben."
                  "7:25": "Das ist fünf vor halb acht. Fünf nach halb: Der große Zeiger zeigt auf die Sieben."
                hints:
                  - "Halb acht ist sieben Uhr dreißig."
                  - "Fünf Minuten später zeigt der große Zeiger auf die Sieben."
                  - "Zieh beide Zeiger auf die Sieben. Der kleine Zeiger rückt dann ein Stück weiter, zwischen Sieben und Acht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 11, minute: 25 }
                options: ["5 vor halb 12", "5 vor halb 11", "5 nach halb 12"]
                answer: "5 vor halb 12"
                hints: ["Welche halbe Stunde kommt gleich?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 2, minute: 35 }
                options: ["5 nach halb 3", "5 nach halb 2", "5 vor halb 3"]
                answer: "5 nach halb 3"
                hints: ["Welche halbe Stunde war gerade?"]
              - id: l2-s3
                type: multiple_choice
                text: "Es ist 5 nach halb 6. Was zeigt die Digitaluhr?"
                say: "Es ist fünf nach halb sechs. Was zeigt die Digitaluhr?"
                options: ["5:35", "6:35", "5:25"]
                answer: "5:35"
                hints: ["Halb sechs ist fünf Uhr dreißig."]
              - id: l2-s4
                type: true_false
                text: "Hat ein Tag 12 Stunden?"
                say: "Hat ein Tag zwölf Stunden?"
                answer: false
                hints: ["Der kleine Zeiger läuft an einem Tag zweimal herum."]
              - id: l2-s5
                type: clock_hands_drag
                text: "Stell die Uhr auf 5 vor halb 9."
                say: "Stell die Uhr auf fünf vor halb neun. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "8:25"
                feedback:
                  "9:25": "Das ist fünf vor halb zehn. Halb neun ist acht Uhr dreißig: Zieh den kleinen Zeiger auf die Acht."
                  "8:35": "Das ist fünf nach halb neun. Fünf vor halb: Der große Zeiger zeigt auf die Fünf."
                hints: ["Halb neun ist acht Uhr dreißig. Fünf Minuten früher zeigt der große Zeiger auf die Fünf."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 4, minute: 25 }
                options: ["5 vor halb 5", "5 vor halb 4", "5 nach halb 5"]
                answer: "5 vor halb 5"
              - id: l2-n2
                type: multiple_choice
                text: "Wie spät ist es?"
                say: "Wie spät ist es?"
                show: { drawn: clock, hour: 12, minute: 35 }
                options: ["5 nach halb 1", "5 nach halb 12", "5 vor halb 1"]
                answer: "5 nach halb 1"
              - id: l2-n3
                type: multiple_choice
                text: "Es ist 5 vor halb 11. Was zeigt die Digitaluhr?"
                say: "Es ist fünf vor halb elf. Was zeigt die Digitaluhr?"
                options: ["10:25", "11:25", "10:35"]
                answer: "10:25"
              - id: l2-n4
                type: text_input
                text: "Wie viele Minuten hat eine Stunde?"
                say: "Wie viele Minuten hat eine Stunde?"
                answer: "60"
              - id: l2-n5
                type: clock_hands_drag
                text: "Stell die Uhr auf 20 vor 6."
                say: "Stell die Uhr auf zwanzig vor sechs. Zieh die Zeiger."
                show: { drawn: clock, hour: 12, minute: 0 }
                step: 5
                answer: "5:40"
                feedback:
                  "6:20": "Das ist zwanzig nach sechs. Zwanzig vor sechs ist noch vor sechs Uhr: Der große Zeiger zeigt auf die Acht."
                  "6:40": "Das ist zwanzig vor sieben. Zieh den kleinen Zeiger auf die Fünf."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: read
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 1, minute: 20 }
            options: ["20 nach 1", "20 vor 1", "4 nach 1"]
            answer: "20 nach 1"
          - id: l2-c2
            part: halb
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 7, minute: 25 }
            options: ["5 vor halb 8", "5 vor halb 7", "5 nach halb 8"]
            answer: "5 vor halb 8"
          - id: l2-c3
            part: read
            type: multiple_choice
            text: "Es ist 10 vor 12. Was zeigt die Digitaluhr?"
            say: "Es ist zehn vor zwölf. Was zeigt die Digitaluhr?"
            options: ["11:50", "12:10", "12:50"]
            answer: "11:50"
          - id: l2-c4
            part: set
            type: clock_hands_drag
            text: "Stell die Uhr auf 5 nach halb 7."
            say: "Stell die Uhr auf fünf nach halb sieben. Zieh die Zeiger."
            show: { drawn: clock, hour: 12, minute: 0 }
            step: 5
            answer: "6:35"
            feedback:
              "7:35": "Das ist fünf nach halb acht. Halb sieben ist sechs Uhr dreißig: Zieh den kleinen Zeiger auf die Sechs."
              "6:25": "Das ist fünf vor halb sieben. Fünf nach halb: Der große Zeiger zeigt auf die Sieben."
          - id: l2-c5
            part: units
            type: text_input
            text: "Wie viele Stunden hat ein Tag?"
            say: "Wie viele Stunden hat ein Tag?"
            answer: "24"
          - id: l2-c6
            part: read
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 10, minute: 5 }
            options: ["5 nach 10", "5 vor 10", "1 nach 10"]
            answer: "5 nach 10"
          - id: l2-c7
            part: read
            type: multiple_choice
            text: "Wie spät ist es?"
            say: "Wie spät ist es?"
            show: { drawn: clock, hour: 2, minute: 40 }
            options: ["20 vor 3", "20 nach 2", "20 vor 2"]
            answer: "20 vor 3"
          - id: l2-c8
            part: read
            type: true_false
            text: "Ist es 10 vor 7?"
            say: "Ist es zehn vor sieben?"
            show: { drawn: clock, hour: 6, minute: 50 }
            answer: true
          - id: l2-c9
            part: halb
