# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.squares
skill: math.mult-div.squares
curriculum: de-DE
language: de
title:
  de: Quadratzahlen
  en: Square numbers
summary: >
  Square numbers to 10 · 10. Lesson 1 sees them as square Punktefelder
  (as many rows as dots in a row) and tells them from fields that are
  longer than wide; lesson 2 learns all ten, works out a square from
  the fact next to it (7 · 7 is 6 · 7 and one more 7), and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Einmaleins, en: Times tables }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.mult-div.arrays]
  also_practises: [math.mult-div.arrays, math.mult-div.core-facts]
  vocabulary: { de: [Quadratzahl, Quadrat, Punktefeld, Reihe] }
  forms: [drawn, text, audio]
  drawn: [dots, hundred-field]
  facets: []
  misconceptions:
    - id: square-as-double
      what: Adds the number to itself instead of multiplying (6 · 6 = 12, 9 · 9 = 18)
      addressed: l1-f5 and l1-s5 have the double as an option with feedback; l2-f4 asks whether 9 · 9 is 18; l2-c2 has the doubles 14 and 18 as chips
    - id: any-array-is-square
      what: Calls every Punktefeld a square, or any product a square number
      addressed: lesson 1 Learn shows a 3 by 5 field that is not a square; every stage of lesson 1, its quick check and the skill check have a "Welches Punktefeld ist ein Quadrat?" task; from the some stage on, a wrong field is only one row or one column off the square
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Quadrate im Punktefeld", en: "Squares in an array" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Punkte sind es?"
            say: "Drei Reihen mit je vier Punkten. Wie viele Punkte sind es?"
            show: { drawn: dots, array: [3, 4] }
            options: ["12", "7", "14"]
            answer: "12"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "4 · 6 = _"
            say: "Vier mal sechs."
            answer: "24"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "4 · 4 = 16"
            say: "Dieses Punktefeld hat vier Reihen mit je vier Punkten. Es ist so lang wie breit, also ein Quadrat. Vier mal vier ist sechzehn. Sechzehn ist eine Quadratzahl."
            show: { drawn: dots, array: [4, 4] }
          - text: "3 · 5 = 15"
            say: "Hier sind es drei Reihen mit je fünf Punkten. Das Feld ist länger als breit. Es ist kein Quadrat."
            show: { drawn: dots, array: [3, 5] }
          - text: "1 · 1 = 1 | 2 · 2 = 4 | 3 · 3 = 9 | 4 · 4 = 16 | 5 · 5 = 25"
            say: "Rechnest du eine Zahl mal die gleiche Zahl, bekommst du eine Quadratzahl: eins, vier, neun, sechzehn, fünfundzwanzig."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Punktefeld ist ein Quadrat?"
                say: "Welches Punktefeld ist ein Quadrat?"
                options:
                  - { drawn: dots, array: [2, 5] }
                  - { drawn: dots, array: [3, 3] }
                  - { drawn: dots, array: [2, 4] }
                answer: "3x3"
                hints:
                  - "Bei einem Quadrat gibt es so viele Reihen, wie in einer Reihe Punkte sind."
                  - "Zähle die Reihen. Zähle dann die Punkte in einer Reihe."
                  - "Das Feld mit drei mal drei Punkten."
                difficulty: easy
              - id: l1-f2
                type: text_input
                text: "Wie viele Punkte sind es?"
                say: "Wie viele Punkte hat dieses Quadrat?"
                show: { drawn: dots, array: [5, 5] }
                answer: "25"
                hints:
                  - "Fünf Reihen mit je fünf Punkten."
                  - "Fünf mal fünf."
                  - "25."
              - id: l1-f3
                type: true_false
                text: "Ist 9 eine Quadratzahl?"
                say: "Ist neun eine Quadratzahl?"
                answer: true
                hints:
                  - "Gibt es eine Zahl, die mal die gleiche Zahl neun ergibt?"
                  - "Denk an drei mal drei."
                  - "Ja. 3 · 3 = 9."
              - id: l1-f4
                type: fill_in_blank
                text: "Welche Quadratzahl fehlt?"
                say: "Welche Quadratzahl fehlt?"
                frame: "1, 4, 9, _, 25"
                options: ["16", "12", "15"]
                answer: ["16"]
                hints:
                  - "Eins mal eins, zwei mal zwei, drei mal drei. Was kommt dann?"
                  - "Vier mal vier."
                  - "16."
              - id: l1-f5
                type: multiple_choice
                text: "Welche Quadratzahl gehört zu 6 · 6?"
                say: "Welche Quadratzahl gehört zu sechs mal sechs?"
                options: ["36", "12", "32"]
                answer: "36"
                feedback:
                  "12": "Das ist sechs plus sechs. Rechne sechs mal sechs."
                hints:
                  - "Fünf mal sechs ist dreißig."
                  - "Dazu kommt noch eine Sechs."
                  - "36."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Welches Punktefeld ist ein Quadrat?"
                say: "Welches Punktefeld ist ein Quadrat?"
                options:
                  - { drawn: dots, array: [4, 5] }
                  - { drawn: dots, array: [4, 4] }
                  - { drawn: dots, array: [3, 4] }
                answer: "4x4"
                hints: ["So viele Reihen, wie in einer Reihe Punkte sind."]
              - id: l1-s2
                type: text_input
                text: "Wie viele Punkte sind es?"
                say: "Wie viele Punkte hat dieses Quadrat?"
                show: { drawn: dots, array: [7, 7] }
                answer: "49"
                hints: ["Sieben Reihen mit je sieben Punkten."]
              - id: l1-s3
                type: true_false
                text: "Ist 12 eine Quadratzahl?"
                say: "Ist zwölf eine Quadratzahl?"
                answer: false
                hints: ["Drei mal drei ist neun, vier mal vier ist sechzehn. Was liegt dazwischen?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Quadratzahl fehlt?"
                say: "Welche Quadratzahl fehlt?"
                frame: "16, 25, _, 49"
                options: ["36", "30", "35"]
                answer: ["36"]
                hints: ["Nach fünf mal fünf kommt sechs mal sechs."]
              - id: l1-s5
                type: multiple_choice
                text: "Welche Quadratzahl gehört zu 8 · 8?"
                say: "Welche Quadratzahl gehört zu acht mal acht?"
                options: ["64", "16", "56"]
                answer: "64"
                feedback:
                  "16": "Das ist acht plus acht. Rechne acht mal acht."
                hints: ["Verdopple vier mal acht."]

          - support: none
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Welches Punktefeld ist ein Quadrat?"
                say: "Welches Punktefeld ist ein Quadrat?"
                options:
                  - { drawn: dots, array: [5, 5] }
                  - { drawn: dots, array: [5, 6] }
                  - { drawn: dots, array: [6, 5] }
                answer: "5x5"
              - id: l1-n2
                type: text_input
                text: "Wie viele Punkte sind es?"
                say: "Wie viele Punkte hat dieses Quadrat?"
                show: { drawn: dots, array: [6, 6] }
                answer: "36"
              - id: l1-n3
                type: true_false
                text: "Ist 50 eine Quadratzahl?"
                say: "Ist fünfzig eine Quadratzahl?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Welche Quadratzahl fehlt?"
                say: "Welche Quadratzahl fehlt?"
                frame: "_, 64, 81, 100"
                options: ["49", "56", "48"]
                answer: ["49"]
              - id: l1-n5
                type: fill_in_blank
                text: "81 ist eine Quadratzahl. Welche Aufgabe gehört dazu?"
                say: "Einundachtzig ist eine Quadratzahl. Welche Zahl mal die gleiche Zahl ergibt einundachtzig?"
                frame: "_ · _ = 81"
                options: ["9", "8", "10"]
                answer: ["9", "9"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: text_input
            text: "Wie viele Punkte sind es?"
            say: "Wie viele Punkte hat dieses Quadrat?"
            show: { drawn: dots, array: [8, 8] }
            answer: "64"
          - id: l1-c2
            type: true_false
            text: "Ist 20 eine Quadratzahl?"
            say: "Ist zwanzig eine Quadratzahl?"
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Welches Punktefeld ist ein Quadrat?"
            say: "Welches Punktefeld ist ein Quadrat?"
            options:
              - { drawn: dots, array: [2, 2] }
              - { drawn: dots, array: [2, 3] }
              - { drawn: dots, array: [1, 3] }
            answer: "2x2"

  - n: 2
    title: { de: "Alle Quadratzahlen bis 100", en: "All square numbers to 100" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Welche Quadratzahl fehlt?"
            say: "Welche Quadratzahl fehlt?"
            frame: "9, 16, _, 36"
            options: ["25", "20", "24"]
            answer: ["25"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist 25 eine Quadratzahl?"
            say: "Ist fünfundzwanzig eine Quadratzahl?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "1, 4, 9, 16, 25, 36, 49, 64, 81, 100"
            say: "Das sind alle Quadratzahlen bis hundert. Die erste ist eins mal eins, die letzte ist zehn mal zehn."
          - text: "7 · 7 = 6 · 7 + 7 = 42 + 7 = 49"
            say: "Das ist das Quadrat mit sieben mal sieben Punkten. Die roten Punkte sind sechs Reihen mit je sieben: Sechs mal sieben ist zweiundvierzig. Die blaue Reihe hat noch einmal sieben Punkte. Zweiundvierzig plus sieben ist neunundvierzig."
            show: { drawn: dots, array: [7, 7], split_rows: 6 }
          - text: "9 · 9 = 81 | 10 · 10 = 100"
            say: "Neun mal neun ist einundachtzig. Zehn mal zehn ist hundert. Auch das Hunderterfeld ist ein Quadrat."
            show: { drawn: hundred-field, filled: 100 }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Malaufgabe mit ihrer Quadratzahl."
                pairs:
                  - { left: { text: "3 · 3" }, right: { text: "9" } }
                  - { left: { text: "6 · 6" }, right: { text: "36" } }
                  - { left: { text: "8 · 8" }, right: { text: "64" } }
                  - { left: { text: "10 · 10" }, right: { text: "100" } }
                hints:
                  - "Rechne jede Malaufgabe aus."
                  - "Sechs mal sechs ist sechsunddreißig."
                  - "3 · 3 = 9, 6 · 6 = 36, 8 · 8 = 64, 10 · 10 = 100."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welche Zahl ist eine Quadratzahl?"
                say: "Welche Zahl ist eine Quadratzahl?"
                options: ["18", "27", "81"]
                answer: "81"
                hints:
                  - "Eine Quadratzahl ist eine Zahl mal die gleiche Zahl."
                  - "Denk an neun mal neun."
                  - "81."
              - id: l2-f3
                type: fill_in_blank
                text: "Fünf mal sechs hilft."
                say: "Sechs mal sechs. Rechne mit fünf mal sechs und noch einer Reihe."
                frame: "6 · 6 = 5 · 6 + _ = _"
                options: ["6", "5", "36", "35"]
                answer: ["6", "36"]
                hints:
                  - "Sechs mal sechs ist fünf mal sechs und noch eine Reihe mit sechs."
                  - "Fünf mal sechs ist dreißig. Dreißig plus sechs."
                  - "6 und 36."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? 9 · 9 = 18"
                say: "Neun mal neun ist achtzehn. Stimmt das?"
                answer: false
                hints:
                  - "Neun plus neun ist achtzehn. Hier steht aber mal."
                  - "Zehn mal neun ist neunzig. Neun mal neun ist eine Neun weniger."
                  - "Nein. 9 · 9 = 81."
              - id: l2-f5
                type: fill_in_blank
                text: "Welche Quadratzahl fehlt?"
                say: "Welche Quadratzahl fehlt?"
                frame: "49, _, 81, 100"
                options: ["64", "72", "63"]
                answer: ["64"]
                hints:
                  - "Nach sieben mal sieben kommt acht mal acht."
                  - "Vier mal acht ist zweiunddreißig. Acht mal acht ist das Doppelte."
                  - "64."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Malaufgabe mit ihrer Quadratzahl."
                pairs:
                  - { left: { text: "2 · 2" }, right: { text: "4" } }
                  - { left: { text: "5 · 5" }, right: { text: "25" } }
                  - { left: { text: "7 · 7" }, right: { text: "49" } }
                  - { left: { text: "9 · 9" }, right: { text: "81" } }
                hints: ["Rechne jede Malaufgabe aus."]
              - id: l2-s2
                type: multiple_choice
                text: "Welche Zahl ist eine Quadratzahl?"
                say: "Welche Zahl ist eine Quadratzahl?"
                options: ["24", "36", "42"]
                answer: "36"
                hints: ["Denk an sechs mal sechs."]
              - id: l2-s3
                type: fill_in_blank
                text: "Verdopple."
                say: "Rechne zuerst vier mal acht, dann acht mal acht."
                frame: "4 · 8 = _ | 8 · 8 = _"
                options: ["32", "64", "16", "56"]
                answer: ["32", "64"]
                hints: ["Acht mal acht ist das Doppelte von vier mal acht."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? 6 · 6 = 36"
                say: "Sechs mal sechs ist sechsunddreißig. Stimmt das?"
                answer: true
                hints: ["Fünf mal sechs ist dreißig, dazu noch sechs."]
              - id: l2-s5
                type: fill_in_blank
                text: "Welche Quadratzahl fehlt?"
                say: "Welche Quadratzahl fehlt?"
                frame: "36, 49, 64, _, 100"
                options: ["81", "80", "72"]
                answer: ["81"]
                hints: ["Nach acht mal acht kommt neun mal neun."]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Malaufgabe mit ihrer Quadratzahl."
                pairs:
                  - { left: { text: "4 · 4" }, right: { text: "16" } }
                  - { left: { text: "6 · 6" }, right: { text: "36" } }
                  - { left: { text: "8 · 8" }, right: { text: "64" } }
                  - { left: { text: "1 · 1" }, right: { text: "1" } }
              - id: l2-n2
                type: multiple_choice
                text: "Welche Zahl ist keine Quadratzahl?"
                say: "Welche Zahl ist keine Quadratzahl?"
                options: ["49", "64", "60"]
                answer: "60"
              - id: l2-n3
                type: fill_in_blank
                text: "Zehn mal neun hilft."
                say: "Neun mal neun. Zehn mal neun ist neunzig. Wie viel nimmst du weg?"
                frame: "9 · 9 = 90 − _ = _"
                options: ["9", "1", "81", "89"]
                answer: ["9", "81"]
              - id: l2-n4
                type: true_false
                text: "Stimmt das? 8 · 8 = 62"
                say: "Acht mal acht ist zweiundsechzig. Stimmt das?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Welche Quadratzahl fehlt?"
                say: "Welche Quadratzahl fehlt?"
                frame: "_, 49, 64, 81"
                options: ["36", "40", "42"]
                answer: ["36"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "36 ist eine Quadratzahl. Welche Aufgabe gehört dazu?"
            say: "Sechsunddreißig ist eine Quadratzahl. Welche Zahl mal die gleiche Zahl ergibt sechsunddreißig?"
            frame: "_ · _ = 36"
            options: ["6", "5", "7"]
            answer: ["6", "6"]
          - id: l2-c2
            type: fill_in_blank
            text: "Rechne beide Aufgaben."
            say: "Rechne sieben mal sieben und neun mal neun."
            frame: "7 · 7 = _ | 9 · 9 = _"
            options: ["49", "81", "14", "18"]
            answer: ["49", "81"]
          - id: l2-c3
            type: multiple_choice
            text: "Welche Zahl ist eine Quadratzahl?"
            say: "Welche Zahl ist eine Quadratzahl?"
            options: ["32", "48", "64"]
            answer: "64"
          - id: l2-c4
            type: image_multiple_choice
            text: "Welches Punktefeld ist ein Quadrat?"
            say: "Welches Punktefeld ist ein Quadrat?"
            options:
              - { drawn: dots, array: [3, 6] }
              - { drawn: dots, array: [6, 6] }
              - { drawn: dots, array: [5, 6] }
            answer: "6x6"
          - id: l2-c5
            type: true_false
            text: "Ist 30 eine Quadratzahl?"
            say: "Ist dreißig eine Quadratzahl?"
            answer: false
