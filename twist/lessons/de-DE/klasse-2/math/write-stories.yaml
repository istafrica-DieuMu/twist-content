# Lesson set: Mathe, Klasse 2. Hand-authored draft.
id: de-DE.math.write-stories
skill: math.word-problems.write-stories
curriculum: de-DE
language: de
title:
  de: Rechengeschichten erfinden
  en: Making up number stories
summary: >
  Lesson 1 picks and builds stories that fit a plus or minus calculation
  (Zu 40 − 15 passt: Im Bus sitzen 40 Leute, 15 steigen aus); lesson 2
  builds a story from its parts (Anfang, was passiert, Frage) for a mal or
  geteilt calculation and spots stories that do not fit, and ends with
  the skill check.
metadata:
  year: klasse-2
  topic: { de: Sachaufgaben, en: Word problems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [math.word-problems.question-calc-answer]
  also_practises: [math.mult-div.mult-meaning, math.mult-div.div-meaning]
  vocabulary: { de: [Rechengeschichte, erfinden, passen, dazu, weg, verteilen] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: plus-minus, what: { de: zu einer Plus- oder Minusaufgabe die passende Geschichte finden, en: finding the story that fits a plus or minus calculation } }
    - { id: mal-geteilt, what: { de: zu einer Mal- oder Geteiltaufgabe die passende Geschichte finden, en: finding the story that fits a times or divide calculation } }
    - { id: build, what: { de: "eine Rechengeschichte aus Anfang, Handlung und Frage bauen", en: "building a number story from a start, what happens and a question" } }
    - { id: check, what: { de: "prüfen, ob eine Geschichte zu einer Rechnung passt", en: checking whether a story fits a calculation } }
  misconceptions:
    - id: numbers-fit-action-not
      what: Accepts a story with the right numbers but the wrong action (zu 40 − 15 eine Geschichte, in der 15 einsteigen)
      addressed: lesson 1 Learn checks the action as well as the numbers; every stage of lesson 1 offers a story with the right numbers and the wrong action, with feedback in l1-f1
    - id: story-without-question
      what: Writes a story that ends without a question
      addressed: lesson 2 Learn names the three parts; l2-f2, l2-s2 and l2-n2 ask for the missing question part
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Geschichten zu Plus und Minus", en: "Stories for plus and minus" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Im Bus sitzen 20 Leute. 5 steigen aus. Welche Rechnung passt?"
            say: "Im Bus sitzen zwanzig Leute. Fünf steigen aus. Welche Rechnung passt?"
            options: ["20 − 5", "20 + 5", "15 − 5"]
            answer: "20 − 5"
            difficulty: easy
          - id: l1-w2
            type: text_input
            text: "40 − 15 = _"
            say: "Vierzig minus fünfzehn."
            answer: "25"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "40 − 15"
            say: "Jetzt drehen wir es um. Du hast eine Rechnung und erfindest eine Geschichte dazu. Zu vierzig minus fünfzehn: Am Anfang sind es vierzig. Fünfzehn gehen weg."
          - text: "Im Bus sitzen 40 Leute. 15 steigen aus. Wie viele sitzen noch im Bus?"
            say: "Eine Geschichte: Im Bus sitzen vierzig Leute. Fünfzehn steigen aus. Wie viele sitzen noch im Bus? Die Zahlen passen und es werden weniger. Das passt zu minus."
          - text: "Im Bus sitzen 40 Leute. 15 steigen ein. Passt nicht!"
            say: "Aber Vorsicht: Im Bus sitzen vierzig Leute, fünfzehn steigen ein. Die Zahlen stimmen, aber es werden mehr. Das passt zu vierzig plus fünfzehn, nicht zu minus."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Geschichte passt zu 30 − 12?"
                say: "Welche Geschichte passt zu dreißig minus zwölf?"
                options: ["Ben hat 30 Karten. Er verschenkt 12.", "Ben hat 30 Karten. Er bekommt 12 dazu.", "Ben hat 12 Karten. Er verschenkt 3."]
                answer: "Ben hat 30 Karten. Er verschenkt 12."
                feedback:
                  "Ben hat 30 Karten. Er bekommt 12 dazu.": "Die Zahlen stimmen, aber es werden mehr. Das passt zu plus."
                  "Ben hat 12 Karten. Er verschenkt 3.": "Hier stimmen die Zahlen nicht. Am Anfang müssen es 30 sein."
                hints:
                  - "Am Anfang sind es 30, dann gehen 12 weg."
                  - "Weggehen heißt: Es werden weniger."
                  - "Ben hat 30 Karten. Er verschenkt 12."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welche Geschichte passt zu 25 + 10?"
                say: "Welche Geschichte passt zu fünfundzwanzig plus zehn?"
                options: ["Im Korb sind 25 Äpfel. Mama legt 10 dazu.", "Im Korb sind 25 Äpfel. 10 werden gegessen.", "Im Korb sind 10 Äpfel. Mama legt 2 dazu."]
                answer: "Im Korb sind 25 Äpfel. Mama legt 10 dazu."
                hints:
                  - "Plus heißt: Es werden mehr."
                  - "Am Anfang sind es 25, dann kommen 10 dazu."
                  - "Im Korb sind 25 Äpfel. Mama legt 10 dazu."
              - id: l1-f3
                type: ordering
                text: "Bau eine Geschichte zu 50 − 20."
                say: "Bau eine Geschichte zu fünfzig minus zwanzig. Was kommt zuerst, was danach, was zum Schluss?"
                options: ["Wie viel Geld hat sie noch?", "Lisa hat 50 Cent.", "Sie kauft einen Lolli für 20 Cent."]
                slot_count: 3
                answer: ["Lisa hat 50 Cent.", "Sie kauft einen Lolli für 20 Cent.", "Wie viel Geld hat sie noch?"]
                option_audio: false
                hints:
                  - "Zuerst sagst du, was am Anfang da ist."
                  - "Dann, was passiert. Zum Schluss kommt die Frage."
                  - "50 Cent, der Lolli, dann die Frage."
              - id: l1-f4
                type: true_false
                text: "Passt diese Geschichte zu 18 + 7? Im Teich schwimmen 18 Enten. 7 fliegen weg."
                say: "Passt diese Geschichte zu achtzehn plus sieben? Im Teich schwimmen achtzehn Enten. Sieben fliegen weg."
                answer: false
                hints:
                  - "Werden es mehr oder weniger Enten?"
                  - "Wegfliegen heißt weniger. Das ist minus."
                  - "Nein, sie passt nicht."
              - id: l1-f5
                type: multiple_choice
                text: "Zu welcher Rechnung passt die Geschichte? Mia hat 34 Perlen. Sie kauft 20 dazu."
                say: "Mia hat vierunddreißig Perlen. Sie kauft zwanzig dazu. Zu welcher Rechnung passt diese Geschichte?"
                options: ["34 + 20", "34 − 20", "34 + 2"]
                answer: "34 + 20"
                hints:
                  - "Dazukaufen heißt: Es werden mehr."
                  - "Am Anfang 34, dann 20 dazu."
                  - "34 + 20."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Geschichte passt zu 60 − 25?"
                say: "Welche Geschichte passt zu sechzig minus fünfundzwanzig?"
                options: ["Im Kino sind 60 Leute. 25 gehen nach Hause.", "Im Kino sind 60 Leute. 25 kommen dazu.", "Im Kino sind 25 Leute. 6 gehen nach Hause."]
                answer: "Im Kino sind 60 Leute. 25 gehen nach Hause."
                hints: ["Achte auf die Zahlen und darauf, ob es weniger werden."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Geschichte passt zu 45 + 30?"
                say: "Welche Geschichte passt zu fünfundvierzig plus dreißig?"
                options: ["Tim hat 45 Euro. Er bekommt 30 Euro geschenkt.", "Tim hat 45 Euro. Er gibt 30 Euro aus.", "Tim hat 30 Euro. Er bekommt 4 Euro."]
                answer: "Tim hat 45 Euro. Er bekommt 30 Euro geschenkt."
                hints: ["Plus heißt: Es werden mehr."]
              - id: l1-s3
                type: ordering
                text: "Bau eine Geschichte zu 24 + 12."
                say: "Bau eine Geschichte zu vierundzwanzig plus zwölf."
                options: ["An der Haltestelle steigen 12 ein.", "Wie viele Kinder sitzen jetzt im Bus?", "Im Bus sitzen 24 Kinder."]
                slot_count: 3
                answer: ["Im Bus sitzen 24 Kinder.", "An der Haltestelle steigen 12 ein.", "Wie viele Kinder sitzen jetzt im Bus?"]
                option_audio: false
                hints: ["Anfang, was passiert, Frage."]
              - id: l1-s4
                type: true_false
                text: "Passt diese Geschichte zu 70 − 30? Auf dem Parkplatz stehen 70 Autos. 30 fahren weg."
                say: "Passt diese Geschichte zu siebzig minus dreißig? Auf dem Parkplatz stehen siebzig Autos. Dreißig fahren weg."
                answer: true
                hints: ["Stimmen die Zahlen? Werden es weniger?"]
              - id: l1-s5
                type: multiple_choice
                text: "Zu welcher Rechnung passt die Geschichte? Oma hat 52 Eier. Sie backt einen Kuchen mit 6 Eiern."
                say: "Oma hat zweiundfünfzig Eier. Sie backt einen Kuchen mit sechs Eiern. Zu welcher Rechnung passt diese Geschichte?"
                options: ["52 − 6", "52 + 6", "62 − 6"]
                answer: "52 − 6"
                hints: ["Für den Kuchen braucht sie Eier. Werden es mehr oder weniger?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Geschichte passt zu 80 − 35?"
                say: "Welche Geschichte passt zu achtzig minus fünfunddreißig?"
                options: ["Ein Bäcker hat 80 Brötchen. Er verkauft 35.", "Ein Bäcker hat 80 Brötchen. Er backt 35 dazu.", "Ein Bäcker hat 35 Brötchen. Er verkauft 8."]
                answer: "Ein Bäcker hat 80 Brötchen. Er verkauft 35."
              - id: l1-n2
                type: multiple_choice
                text: "Welche Geschichte passt zu 36 + 40?"
                say: "Welche Geschichte passt zu sechsunddreißig plus vierzig?"
                options: ["Lea hat 36 Sticker. Sie bekommt 40 dazu.", "Lea hat 36 Sticker. Sie verliert 40.", "Lea hat 40 Sticker. Sie bekommt 3 dazu."]
                answer: "Lea hat 36 Sticker. Sie bekommt 40 dazu."
              - id: l1-n3
                type: ordering
                text: "Bau eine Geschichte zu 90 − 45."
                say: "Bau eine Geschichte zu neunzig minus fünfundvierzig."
                options: ["Wie viele Seiten muss er noch lesen?", "Jan liest ein Buch mit 90 Seiten.", "Er hat schon 45 Seiten gelesen."]
                slot_count: 3
                answer: ["Jan liest ein Buch mit 90 Seiten.", "Er hat schon 45 Seiten gelesen.", "Wie viele Seiten muss er noch lesen?"]
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Passt diese Geschichte zu 55 + 20? Im Zug sitzen 55 Leute. 20 steigen aus."
                say: "Passt diese Geschichte zu fünfundfünfzig plus zwanzig? Im Zug sitzen fünfundfünfzig Leute. Zwanzig steigen aus."
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Zu welcher Rechnung passt die Geschichte? Im Glas sind 63 Murmeln. Paul legt 9 dazu."
                say: "Im Glas sind dreiundsechzig Murmeln. Paul legt neun dazu. Zu welcher Rechnung passt diese Geschichte?"
                options: ["63 + 9", "63 − 9", "36 + 9"]
                answer: "63 + 9"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Geschichte passt zu 40 − 18?"
            say: "Welche Geschichte passt zu vierzig minus achtzehn?"
            options: ["Im Regal stehen 40 Bücher. 18 werden ausgeliehen.", "Im Regal stehen 40 Bücher. 18 kommen dazu.", "Im Regal stehen 18 Bücher. 4 werden ausgeliehen."]
            answer: "Im Regal stehen 40 Bücher. 18 werden ausgeliehen."
          - id: l1-c2
            type: true_false
            text: "Passt diese Geschichte zu 27 + 13? Ali hat 27 Murmeln. Er gewinnt 13 dazu."
            say: "Passt diese Geschichte zu siebenundzwanzig plus dreizehn? Ali hat siebenundzwanzig Murmeln. Er gewinnt dreizehn dazu."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Zu welcher Rechnung passt die Geschichte? Am Baum hängen 48 Äpfel. 16 fallen herunter."
            say: "Am Baum hängen achtundvierzig Äpfel. Sechzehn fallen herunter. Zu welcher Rechnung passt diese Geschichte?"
            options: ["48 − 16", "48 + 16", "84 − 16"]
            answer: "48 − 16"
          - id: l1-c4
            type: multiple_choice
            text: "Welche Geschichte passt zu 52 + 25?"
            say: "Welche Geschichte passt zu zweiundfünfzig plus fünfundzwanzig?"
            options: ["Im Stall sind 52 Hühner. Der Bauer kauft 25 dazu.", "Im Stall sind 52 Hühner. Der Bauer verkauft 25.", "Im Stall sind 25 Hühner. Der Bauer kauft 5 dazu."]
            answer: "Im Stall sind 52 Hühner. Der Bauer kauft 25 dazu."
          - id: l1-c5
            type: ordering
            text: "Bau eine Geschichte zu 75 − 40."
            say: "Bau eine Geschichte zu fünfundsiebzig minus vierzig."
            options: ["Er gibt 40 Euro für ein Fahrrad aus.", "Wie viel Geld hat er noch?", "Opa hat 75 Euro."]
            slot_count: 3
            answer: ["Opa hat 75 Euro.", "Er gibt 40 Euro für ein Fahrrad aus.", "Wie viel Geld hat er noch?"]
            option_audio: false
          - id: l1-c6
            type: true_false
            text: "Passt diese Geschichte zu 38 − 8? Im Glas sind 38 Gummibärchen. Lena legt 8 dazu."
            say: "Passt diese Geschichte zu achtunddreißig minus acht? Im Glas sind achtunddreißig Gummibärchen. Lena legt acht dazu."
            answer: false

  - n: 2
    title: { de: "Geschichten zu Mal und Geteilt", en: "Stories for times and divide" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Geschichte passt zu 20 + 6?"
            say: "Welche Geschichte passt zu zwanzig plus sechs?"
            options: ["Im Bus sitzen 20 Leute. 6 steigen ein.", "Im Bus sitzen 20 Leute. 6 steigen aus."]
            answer: "Im Bus sitzen 20 Leute. 6 steigen ein."
            difficulty: easy
          - id: l2-w2
            type: text_input
            text: "3 · 5 = _"
            say: "Drei mal fünf."
            answer: "15"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Anfang · Was passiert · Frage"
            say: "Eine Rechengeschichte hat drei Teile. Der Anfang sagt, was da ist. Dann passiert etwas. Zum Schluss kommt eine Frage, sonst gibt es nichts zu rechnen."
          - text: "3 · 5 → Tim hat 3 Tüten mit je 5 Bonbons. Wie viele Bonbons sind es?"
            say: "Zu drei mal fünf: Tim hat drei Tüten mit je fünf Bonbons. Wie viele Bonbons sind es zusammen? Mal heißt: gleich viele, mehrmals."
          - text: "12 : 3 → 12 Kekse werden gerecht an 3 Kinder verteilt. Wie viele bekommt jedes Kind?"
            say: "Zu zwölf geteilt durch drei: Zwölf Kekse werden gerecht an drei Kinder verteilt. Wie viele Kekse bekommt jedes Kind? Geteilt heißt: gerecht verteilen."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Geschichte passt zu 4 · 3?"
                say: "Welche Geschichte passt zu vier mal drei?"
                options: ["Auf 4 Tellern liegen je 3 Kekse.", "Auf 4 Tellern liegen zusammen 3 Kekse.", "4 Kinder essen 3 Kekse."]
                answer: "Auf 4 Tellern liegen je 3 Kekse."
                feedback:
                  "Auf 4 Tellern liegen zusammen 3 Kekse.": "Hier liegen nur 3 Kekse auf allen Tellern. Bei mal liegen auf jedem Teller gleich viele."
                hints:
                  - "Mal heißt: mehrmals gleich viele."
                  - "Das Wort „je“ zeigt: auf jedem Teller 3."
                  - "Auf 4 Tellern liegen je 3 Kekse."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Tim hat 5 Kisten. In jeder Kiste sind 4 Bälle. Was fehlt noch?"
                say: "Tim hat fünf Kisten. In jeder Kiste sind vier Bälle. Was fehlt noch, damit es eine Rechengeschichte wird?"
                options: ["Wie viele Bälle sind es zusammen?", "Die Kisten sind braun.", "Tim spielt gern Fußball."]
                answer: "Wie viele Bälle sind es zusammen?"
                hints:
                  - "Eine Rechengeschichte hat drei Teile."
                  - "Am Ende fehlt die Frage."
                  - "Wie viele Bälle sind es zusammen?"
              - id: l2-f3
                type: multiple_choice
                text: "Welche Geschichte passt zu 15 : 5?"
                say: "Welche Geschichte passt zu fünfzehn geteilt durch fünf?"
                options: ["15 Stifte werden gerecht an 5 Kinder verteilt.", "15 Kinder bekommen je 5 Stifte.", "Lea hat 15 Stifte und kauft 5 dazu."]
                answer: "15 Stifte werden gerecht an 5 Kinder verteilt."
                hints:
                  - "Geteilt heißt: gerecht verteilen."
                  - "Am Anfang sind es 15 Stifte."
                  - "15 Stifte werden gerecht an 5 Kinder verteilt."
              - id: l2-f4
                type: ordering
                text: "Bau eine Geschichte zu 2 · 6."
                say: "Bau eine Geschichte zu zwei mal sechs."
                options: ["In jeder Packung sind 6 Eier.", "Wie viele Eier hat sie?", "Mia kauft 2 Packungen Eier."]
                slot_count: 3
                answer: ["Mia kauft 2 Packungen Eier.", "In jeder Packung sind 6 Eier.", "Wie viele Eier hat sie?"]
                option_audio: false
                hints:
                  - "Anfang, was passiert, Frage."
                  - "Die Frage kommt zum Schluss."
                  - "Packungen, Eier in jeder Packung, dann die Frage."
              - id: l2-f5
                type: true_false
                text: "Passt diese Geschichte zu 20 : 4? 20 Äpfel werden gerecht in 4 Körbe gelegt. Wie viele sind in jedem Korb?"
                say: "Passt diese Geschichte zu zwanzig geteilt durch vier? Zwanzig Äpfel werden gerecht in vier Körbe gelegt. Wie viele sind in jedem Korb?"
                answer: true
                hints:
                  - "Werden die Äpfel gerecht verteilt?"
                  - "Zwanzig Äpfel, vier Körbe."
                  - "Ja, sie passt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Geschichte passt zu 3 · 10?"
                say: "Welche Geschichte passt zu drei mal zehn?"
                options: ["3 Kinder haben je 10 Murmeln.", "3 Kinder haben zusammen 10 Murmeln.", "10 Kinder haben 3 Murmeln."]
                answer: "3 Kinder haben je 10 Murmeln."
                hints: ["Achte auf das Wort „je“."]
              - id: l2-s2
                type: multiple_choice
                text: "18 Kekse werden an 3 Kinder verteilt. Was fehlt noch?"
                say: "Achtzehn Kekse werden gerecht an drei Kinder verteilt. Was fehlt noch, damit es eine Rechengeschichte wird?"
                options: ["Wie viele Kekse bekommt jedes Kind?", "Die Kekse sind lecker.", "Die Kinder heißen Ben, Lea und Ali."]
                answer: "Wie viele Kekse bekommt jedes Kind?"
                hints: ["Am Ende fehlt ein Teil."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Geschichte passt zu 24 : 6?"
                say: "Welche Geschichte passt zu vierundzwanzig geteilt durch sechs?"
                options: ["24 Sticker werden gerecht an 6 Kinder verteilt.", "6 Kinder haben je 24 Sticker.", "Ben hat 24 Sticker und verschenkt 6."]
                answer: "24 Sticker werden gerecht an 6 Kinder verteilt."
                hints: ["Geteilt heißt: gerecht verteilen."]
              - id: l2-s4
                type: ordering
                text: "Bau eine Geschichte zu 10 : 2."
                say: "Bau eine Geschichte zu zehn geteilt durch zwei."
                options: ["Wie viele bekommt jeder?", "Oma hat 10 Bonbons.", "Sie verteilt sie gerecht an 2 Enkel."]
                slot_count: 3
                answer: ["Oma hat 10 Bonbons.", "Sie verteilt sie gerecht an 2 Enkel.", "Wie viele bekommt jeder?"]
                option_audio: false
                hints: ["Anfang, was passiert, Frage."]
              - id: l2-s5
                type: true_false
                text: "Passt diese Geschichte zu 5 · 2? Im Stall stehen 5 Pferde. 2 laufen weg."
                say: "Passt diese Geschichte zu fünf mal zwei? Im Stall stehen fünf Pferde. Zwei laufen weg."
                answer: false
                hints: ["Weglaufen heißt weniger. Ist das mal?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Geschichte passt zu 6 · 2?"
                say: "Welche Geschichte passt zu sechs mal zwei?"
                options: ["6 Kinder haben je 2 Luftballons.", "6 Kinder haben zusammen 2 Luftballons.", "2 Kinder essen 6 Äpfel."]
                answer: "6 Kinder haben je 2 Luftballons."
              - id: l2-n2
                type: multiple_choice
                text: "Ein Tisch hat 4 Beine. Im Zimmer stehen 3 Tische. Was fehlt noch?"
                say: "Ein Tisch hat vier Beine. Im Zimmer stehen drei Tische. Was fehlt noch, damit es eine Rechengeschichte wird?"
                options: ["Wie viele Tischbeine sind es?", "Die Tische sind aus Holz.", "Das Zimmer ist groß."]
                answer: "Wie viele Tischbeine sind es?"
              - id: l2-n3
                type: multiple_choice
                text: "Welche Geschichte passt zu 30 : 10?"
                say: "Welche Geschichte passt zu dreißig geteilt durch zehn?"
                options: ["30 Eier werden gerecht in 10 Kartons gepackt.", "In 10 Kartons sind je 30 Eier.", "Im Karton sind 30 Eier, 10 gehen kaputt."]
                answer: "30 Eier werden gerecht in 10 Kartons gepackt."
              - id: l2-n4
                type: ordering
                text: "Bau eine Geschichte zu 4 · 5."
                say: "Bau eine Geschichte zu vier mal fünf."
                options: ["In jedem Topf blühen 5 Blumen.", "Wie viele Blumen blühen?", "Lisa hat 4 Blumentöpfe."]
                slot_count: 3
                answer: ["Lisa hat 4 Blumentöpfe.", "In jedem Topf blühen 5 Blumen.", "Wie viele Blumen blühen?"]
                option_audio: false
              - id: l2-n5
                type: true_false
                text: "Passt diese Geschichte zu 16 : 2? 16 Socken werden zu Paaren gelegt. Wie viele Paare sind es?"
                say: "Passt diese Geschichte zu sechzehn geteilt durch zwei? Sechzehn Socken werden zu Paaren gelegt. Wie viele Paare sind es?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: plus-minus
            type: multiple_choice
            text: "Welche Geschichte passt zu 50 − 30?"
            say: "Welche Geschichte passt zu fünfzig minus dreißig?"
            options: ["Im Schwimmbad sind 50 Kinder. 30 gehen nach Hause.", "Im Schwimmbad sind 50 Kinder. 30 kommen dazu.", "Im Schwimmbad sind 30 Kinder. 5 gehen nach Hause."]
            answer: "Im Schwimmbad sind 50 Kinder. 30 gehen nach Hause."
          - id: l2-c2
            part: mal-geteilt
            type: multiple_choice
            text: "Welche Geschichte passt zu 5 · 4?"
            say: "Welche Geschichte passt zu fünf mal vier?"
            options: ["5 Hasen haben je 4 Möhren.", "5 Hasen haben zusammen 4 Möhren.", "4 Hasen essen 5 Möhren."]
            answer: "5 Hasen haben je 4 Möhren."
          - id: l2-c3
            part: mal-geteilt
            type: multiple_choice
            text: "Welche Geschichte passt zu 21 : 3?"
            say: "Welche Geschichte passt zu einundzwanzig geteilt durch drei?"
            options: ["21 Murmeln werden gerecht an 3 Kinder verteilt.", "3 Kinder haben je 21 Murmeln.", "Tom hat 21 Murmeln und verliert 3."]
            answer: "21 Murmeln werden gerecht an 3 Kinder verteilt."
          - id: l2-c4
            part: build
            type: ordering
            text: "Bau eine Geschichte zu 35 + 20."
            say: "Bau eine Geschichte zu fünfunddreißig plus zwanzig."
