# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.then-now
skill: world.time.then-now
curriculum: de-DE
language: de
title:
  de: Früher und heute
  en: Then and now
summary: >
  A time trip with Ella's Oma Greta, who was a child about 60 years ago.
  Lesson 1 compares things then and now: no mobile phones (a phone had a
  cable and stood at home, many families had none, letters for friends
  far away), toys of wood or tin, marbles, skipping ropes and yo-yos, no
  tablet games, television mostly in black and white. Not everything
  changed: children still play with marbles and balls. Lesson 2 compares
  travel (on foot or by bike to school, far fewer cars, long journeys by
  train, some still pulled by steam engines; today electric cars, fast
  electric trains, many people fly on holiday), says that nobody knows
  for sure what tomorrow brings, and tells a Sachbuch (shows how it
  really was, real photos and dates) from a made-up story (witches fly,
  animals talk), even one set in the past. It ends with the skill check.
  Story children have grandparents; no task assumes the child does.
metadata:
  year: klasse-2
  topic: { de: Früher und heute, en: Then and now }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.time.my-life-story]
  also_practises: []
  vocabulary: { de: [früher, heute, morgen, damals, Dampflok, Brief, Sachbuch, Geschichte, erfunden] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: things, what: { de: "Spielzeug und Geräte von früher und heute vergleichen", en: "comparing toys and devices then and now" } }
    - { id: travel, what: { de: "Unterwegssein früher und heute vergleichen", en: "comparing ways of travelling then and now" } }
    - { id: sort, what: { de: "Dinge früher, heute und morgen zuordnen und sagen, warum", en: "placing things in the past, present or future and saying why" } }
    - { id: fiction, what: { de: "ein Sachbuch von einer erfundenen Geschichte unterscheiden", en: "telling a non-fiction book from a made-up story" } }
  misconceptions:
    - id: everything-was-different
      what: Thinks that in the past everything was different, or that people had nothing to play with
      addressed: "lesson 1 Learn shows Oma's toys and says some things stayed the same; l1-s1, l1-n3, l2-c12, l2-c13 and l2-c15"
    - id: always-had-phones
      what: Thinks phones, tablets and colour television have always been there
      addressed: "lesson 1 Learn opens with the guess whether Oma had a mobile phone; l1-f1, l1-f3, l1-n1, l2-c1, l2-c2 and l2-c5"
    - id: old-story-is-true
      what: Thinks a book set in the past shows how it really was, even with magic in it
      addressed: "lesson 2 Learn compares the two books and says made-up stories can be set in the past too; l2-f4, l2-s4, l2-n1, l2-n3 and l2-c16 to l2-c20"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Als Oma ein Kind war", en: "When Grandma was a child" }
    goal:
      de: "Vergleiche, wie Kinder früher und heute gespielt und telefoniert haben. Früher gab es noch keine Handys."
      en: "Compare how children played and phoned people long ago and today. Long ago there were no mobile phones."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wo steht auf einer Zeitleiste, was am längsten her ist?"
            say: "Wo steht auf einer Zeitleiste, was am längsten her ist?"
            options: ["ganz links", "ganz rechts", "in der Mitte"]
            answer: "ganz links"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Wer 2019 geboren wurde, war 2021 schon 2 Jahre alt."
            say: "Stimmt das? Wer 2019 geboren wurde, war 2021 schon 2 Jahre alt."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Hatte Oma als Kind ein Handy?"
            say: "Ella besucht ihre Oma Greta. Oma zeigt ein altes Foto: Das bin ich mit 8 Jahren, vor ungefähr 60 Jahren. Ella fragt: Hattest du damals ein Handy? Was glaubst du?"
            show: { object: grandma }
          - text: "Damals gab es noch keine Handys."
            say: "Nein! Damals gab es noch keine Handys. Viele Familien hatten gar kein Telefon. Wer eins hatte, hatte ein Telefon mit Kabel, das zu Hause stand. Freunden, die weit weg wohnten, schrieb man einen Brief."
            show: { object: telephone }
          - text: "Spielzeug früher: Murmeln, Springseil, Jo-Jo"
            say: "Womit hat Oma gespielt? Mit Murmeln, mit dem Springseil und mit dem Jo-Jo. Viel Spielzeug war aus Holz oder Blech. Spiele auf dem Tablet gab es noch nicht."
            show: { objects: [marble, yo-yo] }
          - text: "Fernsehen war meistens schwarz-weiß."
            say: "Fernsehen gab es schon. Aber die Bilder waren meistens schwarz-weiß, und es gab nur wenige Sender. Heute schauen viele Menschen bunte Filme auf großen Bildschirmen, auf dem Tablet oder auf dem Handy."
            show: { objects: [old-tv, tablet] }
          - text: "Manches ist gleich geblieben."
            say: "Aber nicht alles ist anders. Kinder spielen heute noch mit Murmeln und Bällen, und Briefe schreibt man auch heute noch. Früher und heute haben vieles gemeinsam."
            show: { object: ball }
          - text: "Wusstest du? Die ersten Handys waren so groß wie ein Ziegelstein."
            say: "Wusstest du? Die ersten Handys waren so groß wie ein Ziegelstein und ganz schön schwer. Sie konnten nur telefonieren. Fotos machen oder spielen ging damit noch nicht."
            show: { object: mobile-phone }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Womit hat man früher telefoniert, als Oma Greta ein Kind war?"
                say: "Womit hat man früher telefoniert, als Oma Greta ein Kind war?"
                options: [{ object: telephone }, { object: mobile-phone }, { object: banana }]
                answer: telephone
                feedback:
                  banana: "Mit einer Banane telefonieren? Das spielen Kinder gern, aber es klingelt leider nie. Früher gab es das Telefon mit Kabel."
                hints:
                  - "Denk daran, was es vor 60 Jahren noch nicht gab."
                  - "Handys gab es damals noch nicht. Das Telefon hatte ein Kabel."
                  - "Das Telefon mit Kabel."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Gab es das schon, als Oma Greta ein Kind war?"
                say: "Sortiere. Was gab es schon, als Oma Greta ein Kind war, was gibt es erst heute?"
                bins:
                  - { id: frueher, show: { text: "gab es schon früher" }, say: "gab es schon früher" }
                  - { id: heute, show: { text: "gibt es erst heute" }, say: "gibt es erst heute" }
                options:
                  - { object: marble, bin: frueher }
                  - { object: mobile-phone, bin: heute }
                  - { object: yo-yo, bin: frueher }
                  - { object: tablet, say: "Spiele auf dem Tablet", bin: heute }
                hints:
                  - "Frag dich bei jedem Ding: Hat Oma damit gespielt?"
                  - "Oma hatte Murmeln und ein Jo-Jo. Handy und Tablet gab es noch nicht."
                  - "Murmeln und Jo-Jo gab es schon früher. Handy und Tablet gibt es erst heute."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Als Oma Greta ein Kind war, gab es schon Handys."
                say: "Stimmt das? Als Oma Greta ein Kind war, gab es schon Handys."
                answer: false
                hints:
                  - "Was hat Oma auf Ellas Frage geantwortet?"
                  - "Wer damals ein Telefon hatte, hatte eins mit Kabel."
                  - "Nein. Handys gab es damals noch nicht."
              - id: l1-f4
                type: multiple_choice
                text: "Wie sahen die Bilder im Fernsehen damals meistens aus?"
                say: "Wie sahen die Bilder im Fernsehen damals meistens aus?"
                options: ["schwarz-weiß", "bunt", "lila mit gelben Punkten"]
                answer: "schwarz-weiß"
                feedback:
                  "lila mit gelben Punkten": "Das wäre lustig! Aber die Bilder waren meistens schwarz-weiß."
                hints:
                  - "Bunte Filme schaut man heute."
                  - "Damals hatte das Fernsehbild meistens nur zwei Farben."
                  - "Schwarz-weiß."
              - id: l1-f5
                type: fill_in_blank
                text: "Telefon früher und heute"
                say: "Setz die passenden Wörter ein."
                show: { object: telephone }
                frame: "Früher hing das Telefon an einem _. Heute haben viele Menschen ein _."
                options: ["Kabel", "Handy", "Buch"]
                answer: ["Kabel", "Handy"]
                hints:
                  - "Lies erst den ganzen Satz."
                  - "Das alte Telefon stand zu Hause. Das neue passt in die Tasche."
                  - "Früher ein Kabel, heute ein Handy."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Murmeln gab es schon früher, und Kinder spielen heute noch damit."
                say: "Stimmt das? Murmeln gab es schon früher, und Kinder spielen heute noch damit."
                answer: true
                hints: ["Nicht alles ist anders als früher."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Mit welchem Spielzeug hat Oma Greta als Kind gespielt?"
                say: "Mit welchem Spielzeug hat Oma Greta als Kind gespielt?"
                options: [{ object: yo-yo }, { object: mobile-phone }]
                answer: yo-yo
                hints: ["Damals gab es noch keine Spiele auf dem Bildschirm."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie hat man früher Freunden etwas erzählt, die weit weg wohnten?"
                say: "Wie hat man früher Freunden etwas erzählt, die weit weg wohnten?"
                options: ["mit einem Brief", "mit einer Nachricht auf dem Handy", "mit einem Video auf dem Tablet"]
                answer: "mit einem Brief"
                hints: ["Handy und Tablet gab es damals noch nicht."]
              - id: l1-s4
                type: matching
                text: "Was war früher, was ist heute?"
                say: "Verbinde, was früher war, mit dem, was es heute gibt."
                pairs:
                  - { left: { object: telephone, say: "das Telefon mit Kabel" }, right: { object: mobile-phone } }
                  - { left: { object: old-tv, say: "Fernsehen in Schwarz-Weiß" }, right: { text: "bunte Filme auf dem Tablet" } }
                  - { left: { object: tin-toy, say: "Spielzeug aus Blech" }, right: { text: "Spiele auf dem Tablet" } }
                hints: ["Fang mit dem Telefon an. Was hat man heute statt des Kabeltelefons?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Woraus war Omas Spielzeug?"
                say: "Setz das passende Wort ein."
                frame: "Viel Spielzeug war früher aus _ oder Blech."
                options: ["Holz", "Glas", "Schokolade"]
                answer: ["Holz"]
                hints: ["Daraus macht man auch Tische und Stühle."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ella will Oma Greta etwas über früher fragen. Welche Frage passt?"
                say: "Ella will Oma Greta etwas über früher fragen. Welche Frage passt?"
                options: ["Womit hast du als Kind gespielt?", "Welches Handy hattest du in der Schule?", "Welches Tablet war dein liebstes?"]
                answer: "Womit hast du als Kind gespielt?"
              - id: l1-n2
                type: image_multiple_choice
                text: "Ella findet in einer alten Kiste Omas Spielzeug. Was liegt darin?"
                say: "Ella findet in einer alten Kiste Omas Spielzeug. Was liegt darin?"
                options: [{ object: marble }, { object: mobile-phone }]
                answer: marble
              - id: l1-n3
                type: true_false
                text: "Ella sagt: „Früher war alles anders als heute.“ Stimmt das?"
                say: "Ella sagt: Früher war alles anders als heute. Stimmt das?"
                answer: false
              - id: l1-n4
                type: sorting
                text: "Ella macht ein Plakat. Gab es das schon früher, oder gibt es das erst heute?"
                say: "Ella macht ein Plakat. Gab es das schon früher, oder gibt es das erst heute? Sortiere."
                bins:
                  - { id: frueher, show: { text: "gab es schon früher" }, say: "gab es schon früher" }
                  - { id: heute, show: { text: "gibt es erst heute" }, say: "gibt es erst heute" }
                options:
                  - { object: telephone, say: "Telefon mit Kabel", bin: frueher }
                  - { object: mobile-phone, bin: heute }
                  - { object: letter, bin: frueher }
                  - { object: tablet, say: "Filme auf dem Tablet", bin: heute }
              - id: l1-n5
                type: fill_in_blank
                text: "Oma Greta erzählt von früher."
                say: "Oma Greta erzählt von früher. Setz die passenden Wörter ein."
                frame: "Als ich klein war, gab es noch kein _. Ich habe mit dem _ gespielt."
                options: ["Handy", "Jo-Jo", "Brief"]
                answer: ["Handy", "Jo-Jo"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was gab es schon, als Oma Greta ein Kind war?"
            say: "Was gab es schon, als Oma Greta ein Kind war?"
            options: [{ object: yo-yo }, { object: mobile-phone }]
            answer: yo-yo
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Früher war das Fernsehen meistens schwarz-weiß."
            say: "Stimmt das? Früher war das Fernsehen meistens schwarz-weiß."
            show: { object: old-tv }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was gab es früher noch nicht?"
            say: "Was gab es früher noch nicht?"
            options: ["Spiele auf dem Tablet", "Murmeln", "Briefe"]
            answer: "Spiele auf dem Tablet"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Oma Greta hat als Kind auf dem Handy gespielt."
            say: "Stimmt das? Oma Greta hat als Kind auf dem Handy gespielt."
            answer: false
          - id: l1-c5
            type: fill_in_blank
            text: "Was schrieb man früher?"
            say: "Setz das passende Wort ein."
            frame: "Freunden, die weit weg wohnten, schrieb man einen _."
            options: ["Brief", "Murmel", "Fernseher"]
            answer: ["Brief"]
          - id: l1-c6
            type: multiple_choice
            text: "Was ist gleich geblieben?"
            say: "Was ist von früher bis heute gleich geblieben?"
            options: ["Kinder spielen mit Bällen.", "Alle Fernsehbilder sind schwarz-weiß.", "Niemand hat ein Handy."]
            answer: "Kinder spielen mit Bällen."

  - n: 2
    title: { de: "Unterwegs früher und ein Buch über früher", en: "Travelling long ago, and a book about long ago" }
    goal:
      de: "Vergleiche, wie Menschen früher und heute unterwegs waren, und erkenne, ob ein Buch zeigt, wie es wirklich war. Früher zog eine Dampflok den Zug."
      en: "Compare how people travelled long ago and today, and tell whether a book shows how it really was. Long ago a steam engine pulled the train."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Womit hat Oma Greta als Kind gespielt?"
            say: "Womit hat Oma Greta als Kind gespielt?"
            options: ["mit Murmeln und dem Springseil", "mit dem Tablet", "mit dem Handy"]
            answer: "mit Murmeln und dem Springseil"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Früher waren die Bilder im Fernsehen meistens bunt."
            say: "Stimmt das? Früher waren die Bilder im Fernsehen meistens bunt."
            show: { object: old-tv }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie ist Oma zur Schule gekommen?"
            say: "Oma Greta erzählt weiter: Als ich klein war, hatte unsere Familie kein Auto. Was glaubst du: Wie bin ich zur Schule gekommen?"
            show: { object: grandma }
          - text: "Zu Fuß oder mit dem Fahrrad"
            say: "Zu Fuß! Viele Kinder gingen damals zu Fuß oder fuhren mit dem Fahrrad. Es gab viel weniger Autos als heute. Weite Reisen machte man mit dem Zug. Manche Züge zog noch eine Dampflok."
            show: { objects: [bike, steam-train] }
          - text: "Heute: Elektroauto, schneller Zug, Flugzeug"
            say: "Heute haben viele Familien ein Auto, manche ein Elektroauto. Schnelle Züge fahren mit Strom. Viele Menschen fliegen mit dem Flugzeug in den Urlaub. Damals konnten das nur wenige."
            show: { objects: [electric-car, aeroplane] }
          - text: "Und morgen?"
            say: "Wie wird es morgen sein, in vielen Jahren? Das weiß niemand ganz sicher. Vielleicht fahren dann mehr Autos ganz allein, ohne Fahrerin oder Fahrer. Menschen denken sich Ideen für morgen aus und probieren sie aus."
            show: { object: bike }
          - text: "Welches Buch zeigt, wie es wirklich war?"
            say: "Ella hat zwei Bücher über früher. Im ersten sind echte Fotos von Dampfloks und Murmeln. Im zweiten fliegt eine Hexe auf ihrem Besen durch Omas Kinderzeit. Was glaubst du: Welches Buch zeigt, wie es wirklich war?"
            show: { objects: [book, witch] }
          - text: "Das Sachbuch erzählt, wie es wirklich war. Die Geschichte ist erfunden."
            say: "Das erste Buch! Es ist ein Sachbuch. Ein Sachbuch erzählt, wie es wirklich war, oft mit echten Fotos und Jahreszahlen. Das zweite Buch erzählt eine Geschichte. Sie ist erfunden: Da fliegen Hexen, Drachen spucken Feuer, Gespenster spuken, und Tiere sprechen. Auch eine erfundene Geschichte kann früher spielen."
            show: { object: book-open }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Womit sind viele Kinder früher zur Schule gefahren?"
                say: "Womit sind viele Kinder früher zur Schule gefahren?"
                options: [{ object: bike }, { object: ship }, { object: crocodile }]
                answer: bike
                feedback:
                  crocodile: "Auf dem Krokodil zur Schule reiten? Da hätte die Lehrerin aber gestaunt! Viele Kinder fuhren mit dem Fahrrad."
                hints:
                  - "Oma Greta hatte kein Auto. Wie kam sie zur Schule?"
                  - "Viele Kinder gingen zu Fuß oder fuhren mit etwas mit zwei Rädern."
                  - "Mit dem Fahrrad."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Früher oder heute?"
                say: "Sortiere. Was war früher, was ist heute?"
                bins:
                  - { id: frueher, show: { text: "früher" }, say: "früher" }
                  - { id: heute, show: { text: "heute" }, say: "heute" }
                options:
                  - { text: "Eine Dampflok zieht den Zug.", bin: frueher }
                  - { text: "Viele Familien fahren ein Elektroauto.", bin: heute }
                  - { text: "Es gibt viel weniger Autos.", bin: frueher }
                  - { text: "Viele Menschen fliegen in den Urlaub.", bin: heute }
                hints:
                  - "Denk an Oma Gretas Kinderzeit."
                  - "Damals gab es Dampfloks und wenige Autos."
                  - "Dampflok und wenige Autos früher, Elektroauto und Flugreisen heute."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Ein Sachbuch erzählt, wie es wirklich war."
                say: "Stimmt das? Ein Sachbuch erzählt, wie es wirklich war."
                show: { object: book }
                answer: true
                hints:
                  - "Denk an Ellas erstes Buch mit den echten Fotos."
                  - "Ein Sachbuch hat oft echte Fotos und Jahreszahlen."
                  - "Ja. Ein Sachbuch zeigt, wie es wirklich war."
              - id: l2-f4
                type: multiple_choice
                text: "Woran erkennst du eine erfundene Geschichte?"
                say: "Woran erkennst du eine erfundene Geschichte?"
                options: ["Eine Hexe fliegt auf dem Besen.", "Es gibt echte Fotos.", "Es stehen Jahreszahlen darin."]
                answer: "Eine Hexe fliegt auf dem Besen."
                hints:
                  - "Was kann es in Wirklichkeit nicht geben?"
                  - "Echte Fotos und Jahreszahlen stehen im Sachbuch."
                  - "Hexen fliegen nur in erfundenen Geschichten."
              - id: l2-f5
                type: fill_in_blank
                text: "Züge früher und heute"
                say: "Setz die passenden Wörter ein."
                frame: "Früher zog eine _ den Zug. Heute fahren schnelle Züge mit _."
                options: ["Dampflok", "Strom", "Kerze"]
                answer: ["Dampflok", "Strom"]
                hints:
                  - "Lies erst den ganzen Satz."
                  - "Die alte Lok macht viel Dampf. Die neuen Züge brauchen Strom."
                  - "Früher eine Dampflok, heute Strom."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Welches Bild gehört in eine erfundene Geschichte?"
                say: "Welches Bild gehört in eine erfundene Geschichte?"
                options: [{ object: witch }, { object: train }, { object: bike }]
                answer: witch
                hints: ["Was gibt es in Wirklichkeit nicht?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Wie das Leben in vielen Jahren sein wird, weiß niemand ganz sicher."
                say: "Stimmt das? Wie das Leben in vielen Jahren sein wird, weiß niemand ganz sicher."
                answer: true
                hints: ["Kann jemand in die Zukunft schauen?"]
              - id: l2-s3
                type: multiple_choice
                text: "Wie reiste man früher oft weit weg?"
                say: "Wie reiste man früher oft weit weg?"
                options: ["mit dem Zug", "mit dem Tablet", "mit dem Jo-Jo"]
                answer: "mit dem Zug"
                hints: ["Manche Züge zog damals noch eine Dampflok."]
              - id: l2-s4
                type: sorting
                text: "Sachbuch oder erfundene Geschichte?"
                say: "Sortiere. Was gehört in ein Sachbuch, was in eine erfundene Geschichte?"
                bins:
                  - { id: sach, show: { text: "Sachbuch" }, say: "Sachbuch" }
                  - { id: erfunden, show: { text: "erfundene Geschichte" }, say: "erfundene Geschichte" }
                options:
                  - { text: "echte Fotos von früher", bin: sach }
                  - { text: "ein sprechender Hund", bin: erfunden }
                  - { text: "Jahreszahlen", bin: sach }
                  - { text: "eine fliegende Hexe", bin: erfunden }
                hints: ["Frag dich: Kann es das wirklich geben?"]
              - id: l2-s5
                type: ordering
                text: "Züge von früher bis morgen"
                say: "Leg die Karten in die richtige Reihenfolge, von früher bis morgen."
                options: ["heute: schnelle Züge mit Strom", "morgen: vielleicht noch schnellere Züge", "früher: eine Dampflok zieht den Zug"]
                slot_count: 3
                answer: ["früher: eine Dampflok zieht den Zug", "heute: schnelle Züge mit Strom", "morgen: vielleicht noch schnellere Züge"]
                hints: ["Früher, dann heute, dann morgen."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
