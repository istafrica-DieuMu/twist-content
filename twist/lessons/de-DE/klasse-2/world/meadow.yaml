# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.meadow
skill: world.nature.meadow
curriculum: de-DE
language: de
title:
  de: Lebensraum Wiese
  en: The meadow as a habitat
summary: >
  Lena goes to the meadow behind the village with Opa Karl and a magnifying
  pot. Lesson 1 opens with the guess whether a meadow is only grass, then
  names its plants (Gras, Löwenzahn, Gänseblümchen, Klee) and its animals
  (Biene, Schmetterling, Marienkäfer, Grashüpfer, Ameise, Schnecke,
  Spinne, Regenwurm, Maulwurf, Feldmaus, Feldhase), sets them apart from
  animals of other habitats and says what a Lebensraum is: the place where
  an animal finds food and shelter. Lesson 2 finds where each animal lives
  (under the soil, on the ground, on the flowers) and what it eats there,
  and that the animals and plants depend on each other: bees need the
  flowers, many flowers need the bees, and a meadow mown all at once
  leaves the bees without food. It ends with the skill check. Meadow
  plants, Grashüpfer and Maulwurf have no pictures yet, so they are text
  cards.
metadata:
  year: klasse-2
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.plant-parts, world.nature.living-nonliving]
  also_practises: []
  vocabulary: { de: [Wiese, Lebensraum, Löwenzahn, Gänseblümchen, Klee, Grashüpfer, Maulwurf, Regenwurm, Nektar, mähen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: plants, what: { de: "Pflanzen der Wiese nennen", en: naming meadow plants } }
    - { id: animals, what: { de: "Tiere der Wiese nennen und von Tieren anderer Lebensräume unterscheiden", en: naming meadow animals and telling them from animals of other habitats } }
    - { id: where, what: { de: "sagen, wo ein Tier auf der Wiese lebt", en: saying where on the meadow an animal lives } }
    - { id: food, what: { de: "sagen, was Tiere auf der Wiese fressen und wie Tiere und Pflanzen voneinander abhängen", en: saying what meadow animals eat and how animals and plants depend on each other } }
  misconceptions:
    - id: meadow-only-grass
      what: Thinks a meadow is only grass and nothing much lives there
      addressed: lesson 1 Learn opens with the guess and shows the plants and animals Lena finds; l1-f3, l1-s3 and l1-n3; l2-c4 in the skill check
    - id: mole-eats-roots
      what: Thinks the mole eats roots and carrots
      addressed: lesson 2 Learn says the mole eats earthworms and insect larvae; l2-f4 and l2-n4, with feedback; l2-c18 in the skill check
    - id: flowers-need-no-animals
      what: Thinks the flowers do not need the animals, only the other way round
      addressed: lesson 2 Learn says many flowers need the bees to make seeds; l2-s4 and l2-n5; l2-c20 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wer wohnt auf der Wiese?", en: "Who lives on the meadow?" }
    goal:
      de: "Finde heraus, welche Pflanzen und Tiere auf der Wiese leben, so wie der Löwenzahn und die Biene."
      en: "Find out which plants and animals live on the meadow, like the dandelion and the bee."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was davon ist ein Lebewesen?"
            say: "Was davon ist ein Lebewesen?"
            options: [{ object: snail }, { object: stone }, { object: ball }]
            answer: snail
            feedback:
              ball: "Ein Ball rollt, aber er wächst nicht und frisst nichts. Die Schnecke ist ein Lebewesen."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Teil der Blume ist oft bunt und duftet?"
            say: "Welcher Teil der Blume ist oft bunt und duftet?"
            options: ["die Blüte", "die Wurzel", "der Stängel"]
            answer: "die Blüte"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ist auf der Wiese nur Gras?"
            say: "Lena geht mit Opa Karl auf die große Wiese hinter dem Dorf. Sie hat eine Becherlupe dabei. Von weitem sieht die Wiese ganz grün aus. Was glaubst du: Wächst auf der Wiese nur Gras?"
            show: { object: flower }
          - text: "Auf der Wiese wachsen viele Pflanzen."
            say: "Nein! Lena schaut genau hin. Zwischen dem Gras wachsen viele Blumen und Kräuter: gelber Löwenzahn, der später zur Pusteblume wird, weiße Gänseblümchen und Klee mit drei runden Blättchen."
            show: { objects: [flower, leaf] }
          - text: "Auf der Wiese leben viele Tiere."
            say: "Und überall krabbelt und summt es. Eine Biene fliegt von Blüte zu Blüte. Ein Schmetterling sitzt auf dem Löwenzahn. Ein Marienkäfer krabbelt an einem Stängel hoch. Ein Grashüpfer springt durch das Gras."
            show: { objects: [bee, butterfly] }
          - text: "Am Boden und unter der Erde"
            say: "Am Boden laufen Ameisen, und eine Schnecke kriecht langsam übers Blatt. Zwischen den Halmen hat eine Spinne ihr Netz gebaut. Unter der Erde wohnen der Regenwurm und der Maulwurf. Und manchmal hoppelt ein Feldhase vorbei."
            show: { objects: [ant, worm] }
          - text: "Die Wiese ist ein Lebensraum."
            say: "Opa Karl erklärt: Die Wiese ist ein Lebensraum. Ein Lebensraum ist ein Ort, an dem Tiere und Pflanzen alles finden, was sie brauchen: Futter, Wasser und ein Versteck. Ein Fisch findet das im Wasser, eine Biene auf der Wiese."
            show: { objects: [bee, fish] }
          - text: "Wusstest du? Eine Biene hat fünf Augen."
            say: "Wusstest du? Eine Biene hat fünf Augen. Zwei große Augen sitzen an den Seiten vom Kopf. Und oben auf dem Kopf hat sie noch drei ganz kleine Augen."
            show: { object: bee }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Tier lebt auf der Wiese?"
                say: "Welches Tier lebt auf der Wiese?"
                options: [{ object: butterfly }, { object: shark }, { object: octopus }]
                answer: butterfly
                feedback:
                  shark: "Ein Hai auf der Wiese? Der würde im Gras ganz schön zappeln! Der Hai lebt im Meer. Der Schmetterling lebt auf der Wiese."
                hints:
                  - "Denk an die Tiere, die Lena mit der Becherlupe findet."
                  - "Hai und Oktopus brauchen Wasser zum Leben."
                  - "Der Schmetterling lebt auf der Wiese."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Pflanze oder Tier?"
                say: "Lena malt auf, was sie gefunden hat. Sortiere: Was ist eine Pflanze, was ist ein Tier?"
                bins:
                  - { id: pflanze, show: { text: "Pflanze" }, say: "Pflanze" }
                  - { id: tier, show: { text: "Tier" }, say: "Tier" }
                options:
                  - { object: ladybird, bin: tier }
                  - { text: "Löwenzahn", bin: pflanze }
                  - { object: snail, bin: tier }
                  - { text: "Klee", bin: pflanze }
                hints:
                  - "Was kann sich von allein bewegen? Was hat Wurzeln?"
                  - "Löwenzahn und Klee wachsen mit Wurzeln in der Erde."
                  - "Löwenzahn und Klee sind Pflanzen. Marienkäfer und Schnecke sind Tiere."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Auf der Wiese wächst nur Gras."
                say: "Stimmt das? Auf der Wiese wächst nur Gras."
                answer: false
                hints:
                  - "Denk daran, was Lena zwischen dem Gras entdeckt."
                  - "Da wachsen auch gelbe und weiße Blumen."
                  - "Nein. Auf der Wiese wachsen auch Löwenzahn, Gänseblümchen und Klee."
              - id: l1-f4
                type: multiple_choice
                text: "Was ist ein Lebensraum?"
                say: "Was ist ein Lebensraum?"
                options: ["ein Ort, an dem Tiere und Pflanzen alles finden, was sie brauchen", "ein Zimmer, in dem man wohnt", "ein Raum im Zoo"]
                answer: "ein Ort, an dem Tiere und Pflanzen alles finden, was sie brauchen"
                hints:
                  - "Was braucht ein Tier zum Leben?"
                  - "Ein Tier braucht Futter, Wasser und ein Versteck."
                  - "Ein Lebensraum ist ein Ort, an dem Tiere und Pflanzen alles finden, was sie brauchen."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wer fliegt auf der Wiese von Blüte zu Blüte?"
                say: "Wer fliegt auf der Wiese von Blüte zu Blüte?"
                options: [{ object: bee }, { object: worm }, { object: snail }]
                answer: bee
                hints:
                  - "Welches Tier hier hat Flügel?"
                  - "Regenwurm und Schnecke kriechen am Boden."
                  - "Die Biene fliegt von Blüte zu Blüte."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Wo lebt das Tier?"
                say: "Verbinde jedes Tier mit seinem Lebensraum."
                pairs:
                  - { left: { object: ladybird }, right: { text: "Wiese" } }
                  - { left: { object: fish }, right: { text: "Teich" } }
                  - { left: { object: whale }, right: { text: "Meer" } }
                hints: ["Der Wal ist das größte Tier hier. Er braucht viel Platz im Wasser."]
              - id: l1-s2
                type: multiple_choice
                text: "Welche Pflanze wächst auf der Wiese?"
                say: "Welche Pflanze wächst auf der Wiese?"
                options: ["das Gänseblümchen", "die Seerose", "der Kaktus"]
                answer: "das Gänseblümchen"
                feedback:
                  "der Kaktus": "Ein Kaktus wächst in der Wüste, wo es sehr trocken ist. Auf der Wiese wächst das Gänseblümchen."
                hints: ["Welche kleine weiße Blume hat Lena zwischen dem Gras gefunden?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Auf der Wiese leben viele kleine Tiere."
                say: "Stimmt das? Auf der Wiese leben viele kleine Tiere."
                answer: true
                hints: ["Was krabbelt, summt und springt durch das Gras?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Welches Tier passt nicht auf die Wiese?"
                say: "Welches Tier passt nicht auf die Wiese?"
                options: [{ object: ant }, { object: crocodile }, { object: ladybird }]
                answer: crocodile
                hints: ["Welches Tier lebt in Flüssen in warmen Ländern?"]
              - id: l1-s5
                type: sorting
                text: "Lebt das Tier auf der Wiese oder im Wasser?"
                say: "Sortiere die Tiere. Welche leben auf der Wiese, welche im Wasser?"
                bins:
                  - { id: wiese, show: { text: "auf der Wiese" }, say: "auf der Wiese" }
                  - { id: wasser, show: { text: "im Wasser" }, say: "im Wasser" }
                options:
                  - { object: spider, bin: wiese }
                  - { object: jellyfish, bin: wasser }
                  - { object: butterfly, bin: wiese }
                  - { object: fish, bin: wasser }
                hints: ["Qualle und Fisch brauchen Wasser um sich herum."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Lena schaut in ihre Becherlupe. Ein kleiner roter Käfer mit schwarzen Punkten! Welcher ist es?"
                say: "Lena schaut in ihre Becherlupe. Ein kleiner roter Käfer mit schwarzen Punkten! Welcher ist es?"
                options: [{ object: ladybird }, { object: bee }, { object: ant }]
                answer: ladybird
              - id: l1-n2
                type: multiple_choice
                text: "Etwas Grünes springt mit langen Beinen durchs Gras. Was ist das?"
                say: "Etwas Grünes springt mit langen Beinen durchs Gras. Was ist das?"
                options: ["ein Grashüpfer", "ein Regenwurm", "eine Schnecke"]
                answer: "ein Grashüpfer"
              - id: l1-n3
                type: true_false
                text: "Lenas Freund Tim sagt: „Auf der Wiese gibt es nichts zu sehen, nur Gras.“ Stimmt das?"
                say: "Lenas Freund Tim sagt: Auf der Wiese gibt es nichts zu sehen, nur Gras. Stimmt das?"
                answer: false
              - id: l1-n4
                type: fill_in_blank
                text: "Lena schreibt in ihr Wiesenheft."
                say: "Lena schreibt in ihr Wiesenheft. Setz die passenden Wörter ein."
                frame: "Der Löwenzahn ist eine _. Der Grashüpfer ist ein _."
                options: ["Pflanze", "Tier", "Stein"]
                answer: ["Pflanze", "Tier"]
              - id: l1-n5
                type: image_multiple_choice
                text: "Opa Karl zeigt auf die Erde. Darunter wohnt ein Tier, das lang und rosa ist. Welches?"
                say: "Opa Karl zeigt auf die Erde. Darunter wohnt ein Tier, das lang und rosa ist. Welches?"
                options: [{ object: worm }, { object: bee }, { object: butterfly }]
                answer: worm

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Tier lebt auf der Wiese?"
            say: "Welches Tier lebt auf der Wiese?"
            options: [{ object: snail }, { object: whale }, { object: shark }]
            answer: snail
          - id: l1-c2
            type: multiple_choice
            text: "Welche Pflanze findest du auf der Wiese?"
            say: "Welche Pflanze findest du auf der Wiese?"
            options: ["den Löwenzahn", "die Palme", "die Seerose"]
            answer: "den Löwenzahn"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Die Wiese ist ein Lebensraum für Tiere und Pflanzen."
            say: "Stimmt das? Die Wiese ist ein Lebensraum für Tiere und Pflanzen."
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Tier passt nicht auf die Wiese?"
            say: "Welches Tier passt nicht auf die Wiese?"
            options: [{ object: octopus }, { object: butterfly }, { object: spider }]
            answer: octopus
          - id: l1-c5
            type: fill_in_blank
            text: "Was wächst auf der Wiese?"
            say: "Setz das passende Wort ein."
            frame: "Auf der Wiese wächst weißer _."
            options: ["Klee", "Sand", "Schnee"]
            answer: ["Klee"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Der Hai lebt auf der Wiese."
            say: "Stimmt das? Der Hai lebt auf der Wiese."
            show: { object: shark }
            answer: false

  - n: 2
    title: { de: "Wohnen und Fressen auf der Wiese", en: "Living and eating on the meadow" }
    goal:
      de: "Finde heraus, wo die Tiere auf der Wiese wohnen und was sie dort fressen, so wie die Biene, die den Saft der Blüten trinkt."
      en: "Find out where the animals live on the meadow and what they eat there, like the bee that drinks from the flowers."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Welches Tier hat Lena auf der Wiese gefunden?"
            say: "Welches Tier hat Lena auf der Wiese gefunden?"
            options: [{ object: ladybird }, { object: jellyfish }, { object: crocodile }]
            answer: ladybird
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Löwenzahn und Gänseblümchen wachsen auf der Wiese."
            say: "Stimmt das? Löwenzahn und Gänseblümchen wachsen auf der Wiese."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wo wohnt der Regenwurm?"
            say: "Heute legt sich Lena ins Gras und schaut ganz genau. Die Wiese hat Stockwerke, wie ein Haus. Was glaubst du: Wo wohnt der Regenwurm?"
            show: { object: worm }
          - text: "Unter der Erde: Regenwurm und Maulwurf"
            say: "Unter der Erde! Der Regenwurm gräbt Gänge und frisst welke Blätter. Auch der Maulwurf wohnt unter der Erde. Er frisst keine Wurzeln, sondern Regenwürmer und Käferlarven. Seine Erdhaufen siehst du oben auf der Wiese."
            show: { object: worm }
          - text: "Am Boden: Schnecke, Ameise, Feldmaus"
            say: "Am Boden zwischen den Halmen kriechen Schnecken. Sie fressen Blätter. Ameisen laufen hin und her. Die Feldmaus knabbert Samen und Gras. Und der Feldhase frisst Gras und Kräuter."
            show: { objects: [snail, mouse] }
          - text: "Auf den Blüten: Biene und Schmetterling"
            say: "Auf den Blüten sitzen Bienen und Schmetterlinge. Sie trinken den süßen Saft der Blüten. Er heißt Nektar. Der Marienkäfer klettert an den Stängeln hoch und frisst kleine Blattläuse. Die Spinne fängt Fliegen und Mücken in ihrem Netz."
            show: { objects: [bee, ladybird] }
          - text: "Tiere und Pflanzen brauchen einander."
            say: "Die Biene braucht die Blüten, weil sie dort Futter findet. Und viele Blumen brauchen die Bienen: Die Biene trägt Blütenstaub von Blüte zu Blüte. Nur so können diese Blumen Samen machen."
            show: { objects: [bee, flower] }
          - text: "Nicht alles auf einmal mähen"
            say: "Opa Karl mäht die Wiese nie ganz auf einmal. Er lässt immer einen Streifen mit Blumen stehen. So finden die Bienen und Schmetterlinge weiter Futter und ein Versteck."
            show: { object: flower }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Wo wohnt das Tier auf der Wiese?"
                say: "Sortiere die Tiere. Wer wohnt unter der Erde, wer auf den Blüten?"
                bins:
                  - { id: erde, show: { text: "unter der Erde" }, say: "unter der Erde" }
                  - { id: bluete, show: { text: "auf den Blüten" }, say: "auf den Blüten" }
                options:
                  - { object: worm, bin: erde }
                  - { object: bee, bin: bluete }
                  - { text: "Maulwurf", bin: erde }
                  - { object: butterfly, bin: bluete }
                hints:
                  - "Wer kann fliegen? Wer gräbt Gänge?"
                  - "Biene und Schmetterling trinken Nektar aus den Blüten."
                  - "Regenwurm und Maulwurf wohnen unter der Erde, Biene und Schmetterling auf den Blüten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was trinkt die Biene aus der Blüte?"
                say: "Was trinkt die Biene aus der Blüte?"
                options: ["Nektar", "Milch", "Regenwasser aus der Pfütze"]
                answer: "Nektar"
                hints:
                  - "Es ist süß und steckt in der Blüte."
                  - "Er hat einen besonderen Namen."
                  - "Die Biene trinkt Nektar."
              - id: l2-f3
                type: matching
                text: "Wer frisst was?"
                say: "Verbinde jedes Tier mit seinem Futter."
                pairs:
                  - { left: { object: ladybird }, right: { text: "Blattläuse" } }
                  - { left: { object: spider }, right: { object: fly } }
                  - { left: { object: rabbit }, right: { text: "Gras und Kräuter" } }
                hints:
                  - "Fang mit dem Tier an, das ein Netz baut."
                  - "Die Spinne fängt Fliegen. Der Marienkäfer frisst ganz kleine Tiere an den Stängeln."
                  - "Marienkäfer und Blattläuse, Spinne und Fliege, Hase und Gras."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Der Maulwurf frisst Wurzeln und Möhren."
                say: "Stimmt das? Der Maulwurf frisst Wurzeln und Möhren."
                answer: false
                hints:
                  - "Der Maulwurf wohnt unter der Erde. Welches Tier wohnt dort auch?"
                  - "Er jagt Tiere, die unter der Erde Gänge graben."
                  - "Nein. Der Maulwurf frisst Regenwürmer und Käferlarven."
              - id: l2-f5
                type: image_multiple_choice
                text: "Wer frisst die welken Blätter unter der Erde?"
                say: "Wer frisst die welken Blätter unter der Erde?"
                options: [{ object: worm }, { object: butterfly }, { object: spider }]
                answer: worm
                hints:
                  - "Welches Tier hier wohnt unter der Erde?"
                  - "Der Schmetterling trinkt Nektar. Die Spinne fängt Fliegen."
                  - "Der Regenwurm frisst welke Blätter."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wer wohnt am Boden zwischen den Halmen und frisst Blätter?"
                say: "Wer wohnt am Boden zwischen den Halmen und frisst Blätter?"
                options: [{ object: snail }, { object: bee }, { object: shark }]
                answer: snail
                hints: ["Das Tier ist langsam und trägt sein Haus auf dem Rücken."]
              - id: l2-s2
                type: fill_in_blank
                text: "Wer frisst was?"
                say: "Setz die passenden Wörter ein."
                frame: "Die Spinne fängt _. Der Schmetterling trinkt _."
                options: ["Fliegen", "Nektar", "Steine"]
                answer: ["Fliegen", "Nektar"]
                hints: ["Die Spinne baut ein Netz. Der Schmetterling sitzt auf der Blüte."]
              - id: l2-s3
                type: sorting
                text: "Wo wohnt das Tier?"
                say: "Sortiere die Tiere. Wer wohnt am Boden, wer auf den Blüten?"
                bins:
                  - { id: boden, show: { text: "am Boden" }, say: "am Boden" }
                  - { id: bluete, show: { text: "auf den Blüten" }, say: "auf den Blüten" }
                options:
                  - { object: snail, bin: boden }
                  - { object: butterfly, bin: bluete }
                  - { object: mouse, bin: boden }
                  - { object: bee, bin: bluete }
                hints: ["Wer kann fliegen und Nektar trinken?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Viele Blumen brauchen die Bienen, damit sie Samen machen können."
                say: "Stimmt das? Viele Blumen brauchen die Bienen, damit sie Samen machen können."
                show: { object: bee }
                answer: true
                hints: ["Was trägt die Biene von Blüte zu Blüte?"]
              - id: l2-s5
                type: multiple_choice
                text: "Warum fliegt die Biene auf die Wiese?"
                say: "Warum fliegt die Biene auf die Wiese?"
                options: ["Dort findet sie Futter in den Blüten.", "Dort will sie schwimmen.", "Dort gräbt sie Gänge in die Erde."]
                answer: "Dort findet sie Futter in den Blüten."
                hints: ["Was trinkt die Biene?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: image_multiple_choice
                text: "Lena entdeckt ein Netz zwischen zwei Halmen. Darin hängt eine Fliege. Wer hat das Netz gebaut?"
                say: "Lena entdeckt ein Netz zwischen zwei Halmen. Darin hängt eine Fliege. Wer hat das Netz gebaut?"
                options: [{ object: spider }, { object: snail }, { object: worm }]
                answer: spider
              - id: l2-n2
                type: sorting
                text: "Lena malt eine Wiese mit drei Stockwerken. Wohin gehört das Tier?"
                say: "Lena malt eine Wiese mit drei Stockwerken. Wohin gehört das Tier? Sortiere."
