# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.magnets
skill: world.nature.magnets
curriculum: de-DE
language: de
title:
  de: Magnete
  en: Magnets
summary: >
  Emil helps Oma Ruth in her sewing room. Lesson 1 opens with spilled pins
  and a magnet: a magnet attracts things made of iron, and steel has iron
  in it (pins, paper clips, nails, screws), but not wood, glass, plastic,
  paper or cloth, and not every metal either (a gold ring, foil, the 10
  cent coin). A safe test at home with a fridge magnet. Lesson 2 adds the
  two poles (like poles push apart, north and south pull together, as on a
  wooden toy train), that the pull works through paper, card and water,
  and that it is stronger the nearer the magnet is; a paper fishing game
  to make at home. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.materials-sort]
  also_practises: []
  vocabulary: { de: [Magnet, anziehen, abstoßen, Eisen, Stahl, Metall, Nordpol, Südpol, Magnetkraft] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: iron, what: { de: "vorhersagen, dass ein Magnet Dinge aus Eisen und Stahl anzieht", en: predicting that a magnet attracts things made of iron and steel } }
    - { id: not-magnetic, what: { de: "Stoffe nennen, die ein Magnet nicht anzieht, auch manche Metalle", en: "naming materials a magnet does not attract, some metals too" } }
    - { id: poles, what: { de: "wissen, dass gleiche Pole sich abstoßen und verschiedene sich anziehen", en: knowing that like poles push apart and unlike poles pull together } }
    - { id: through, what: { de: "wissen, dass die Magnetkraft durch Papier und Wasser wirkt und aus der Nähe stärker ist", en: knowing that the pull works through paper and water and is stronger close up } }
  misconceptions:
    - id: all-metals
      what: Thinks a magnet attracts every metal
      addressed: lesson 1 Learn shows the gold ring and the foil, and the cent coins on the Wusstest du screen; l1-s1, l1-s2, l1-s5, l1-n3, l1-c4; l2-w1, l2-c7, l2-c8 and l2-c9 in the skill check
    - id: attracts-everything
      what: Thinks a magnet picks up anything small and light
      addressed: lesson 1 Learn sorts rubber, pencil, marble and sock out; l1-f1 feedback on the feather, l1-f3, l1-n4, l1-c2; l2-c10
    - id: paper-blocks
      what: Thinks paper, card or water stop the pull of a magnet
      addressed: lesson 2 Learn hangs the drawing on the fridge and pulls the paper clip out of the water; l2-f3, l2-s2, l2-s4, l2-n4; l2-c16, l2-c17 and l2-c20
    - id: magnets-always-stick
      what: Thinks two magnets always pull together
      addressed: lesson 2 Learn opens with the guess and shows two like poles pushing apart; l2-f1, l2-s1, l2-n1; l2-c12 and l2-c15
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was hält der Magnet fest?", en: "What does the magnet hold?" }
    goal:
      de: "Finde heraus, welche Dinge ein Magnet anzieht. Eine Büroklammer bleibt zum Beispiel hängen, ein Radiergummi nicht."
      en: "Find out which things a magnet pulls. A paper clip sticks to it, for example, but a rubber does not."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was ist aus Glas?"
            say: "Was ist aus Glas?"
            options: [{ object: marble }, { object: rubber }, { object: sock }]
            answer: marble
            feedback:
              sock: "Eine Socke aus Glas? Die würde beim ersten Schritt klirren! Die Socke ist aus Stoff. Die Murmel ist aus Glas."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Woraus ist eine Büroklammer?"
            say: "Woraus ist eine Büroklammer?"
            show: { object: paper-clip }
            options: ["aus Metall", "aus Holz", "aus Glas"]
            answer: "aus Metall"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was passiert mit den Nadeln?"
            say: "Emil hilft Oma Ruth beim Nähen. Da fällt die Dose mit den Stecknadeln herunter. Überall auf dem Teppich liegen Nadeln! Oma holt einen Magneten und hält ihn über den Teppich. Was glaubst du: Was passiert?"
            show: { text: "Magnet" }
          - text: "Der Magnet zieht Dinge aus Eisen an."
            say: "Schwupp! Die Stecknadeln springen an den Magneten. Ein Magnet zieht Dinge aus Eisen an. Die Nadeln sind aus Stahl, und im Stahl steckt Eisen. Auch Büroklammern, Nägel und Schrauben aus Eisen bleiben am Magneten hängen."
            show: { object: paper-clip }
          - text: "Holz, Glas, Kunststoff, Papier und Stoff bleiben liegen."
            say: "Emil probiert noch mehr aus. Den Radiergummi, den Bleistift, die Glasmurmel und die Socke zieht der Magnet nicht an. Holz, Glas, Kunststoff, Papier und Stoff sind kein Eisen. Sie bleiben einfach liegen."
            show: { objects: [rubber, marble] }
          - text: "Nicht jedes Metall bleibt hängen."
            say: "Und Metall? Oma hält den Magneten an ihren Goldring. Nichts passiert. Auch Alufolie bleibt liegen. Gold und Aluminium sind Metalle, aber kein Eisen. Ein Magnet zieht also nicht jedes Metall an."
            show: { object: ring }
          - text: "Probier's aus, mit einem Erwachsenen!"
            say: "Probier's aus, mit Mama, Papa oder einem anderen Erwachsenen. Nehmt einen Magneten vom Kühlschrank. An vielen Kühlschranktüren hält er, denn sie sind aus Stahl. Sag vorher, was du glaubst: Was bleibt am Magneten hängen? Dann probiert es mit Dingen aus der Küche und dem Kinderzimmer. Wichtig: Magnete gehören nie in den Mund."
            show: { object: fridge }
          - text: "Wusstest du? Die 1-, 2- und 5-Cent-Münzen bleiben am Magneten hängen."
            say: "Wusstest du? Die kleinen Münzen mit 1, 2 und 5 Cent bleiben an einem Magneten hängen. Sie sehen aus wie Kupfer, aber innen sind sie aus Stahl. Die Münzen mit 10, 20 und 50 Cent bleiben nicht hängen. Probier es mit deinem Taschengeld aus!"
            show: { text: "1 Cent, 2 Cent, 5 Cent" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was zieht der Magnet an?"
                say: "Was zieht der Magnet an?"
                options: [{ object: paper-clip }, { object: rubber }, { object: feather }]
                answer: paper-clip
                feedback:
                  feather: "Die Feder ist leicht, aber sie ist nicht aus Eisen. Der Magnet lässt sie liegen. Die Büroklammer springt an den Magneten."
                hints:
                  - "Der Magnet zieht nur Dinge aus einem bestimmten Stoff an."
                  - "Der Radiergummi ist aus Kunststoff, die Feder kommt von einem Vogel. Was ist aus Eisen?"
                  - "Die Büroklammer ist aus Eisen. Der Magnet zieht sie an."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Bleibt es am Magneten hängen?"
                say: "Sortiere. Was bleibt am Magneten hängen, was nicht?"
                bins:
                  - { id: ja, show: { text: "bleibt hängen" }, say: "bleibt hängen" }
                  - { id: nein, show: { text: "bleibt nicht hängen" }, say: "bleibt nicht hängen" }
                options:
                  - { object: paper-clip, bin: ja }
                  - { object: pencil, bin: nein }
                  - { text: "Nagel", bin: ja }
                  - { object: marble, bin: nein }
                hints:
                  - "Frag dich bei jedem Ding: Ist es aus Eisen?"
                  - "Der Bleistift ist aus Holz, die Murmel aus Glas."
                  - "Büroklammer und Nagel bleiben hängen. Bleistift und Murmel nicht."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Der Magnet zieht den Radiergummi an."
                say: "Stimmt das? Der Magnet zieht den Radiergummi an."
                show: { object: rubber }
                answer: false
                hints:
                  - "Woraus ist ein Radiergummi?"
                  - "Ein Radiergummi ist weich und aus Kunststoff. Kunststoff ist kein Eisen."
                  - "Nein. Der Radiergummi bleibt liegen."
              - id: l1-f4
                type: multiple_choice
                text: "Woraus muss ein Ding sein, damit der Magnet es anzieht?"
                say: "Woraus muss ein Ding sein, damit der Magnet es anzieht?"
                options: ["aus Eisen", "aus Holz", "aus Glas"]
                answer: "aus Eisen"
                feedback:
                  "aus Holz": "Holz bleibt liegen, wie Emils Bleistift. Der Magnet zieht Dinge aus Eisen an."
                hints:
                  - "Denk an die Stecknadeln, die auf dem Teppich lagen."
                  - "Die Nadeln sind aus Stahl. Was steckt im Stahl?"
                  - "Aus Eisen. Der Magnet zieht Dinge aus Eisen an."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was bleibt nicht am Magneten hängen?"
                say: "Was bleibt nicht am Magneten hängen?"
                options: [{ object: sock }, { object: paper-clip }, { object: anchor }]
                answer: sock
                hints:
                  - "Zwei Dinge hier sind aus Eisen, eins ist aus Stoff."
                  - "Der Anker eines Schiffs ist aus Eisen, die Büroklammer auch."
                  - "Die Socke ist aus Stoff. Sie bleibt nicht hängen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Ein Magnet zieht alle Metalle an."
                say: "Stimmt das? Ein Magnet zieht alle Metalle an."
                answer: false
                hints: ["Was ist mit Omas Goldring passiert?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Alle drei Dinge sind aus Metall. Welches zieht der Magnet nicht an?"
                say: "Alle drei Dinge sind aus Metall. Welches zieht der Magnet nicht an?"
                options: [{ object: ring }, { object: paper-clip }, { object: anchor }]
                answer: ring
                hints: ["Gold ist ein Metall, aber ist es Eisen?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Warum hält die Büroklammer am Magneten?"
                say: "Setz die passenden Wörter ein."
                frame: "Die Büroklammer ist aus _. Darum zieht der Magnet sie _."
                options: ["Eisen", "Holz", "an", "nicht an"]
                answer: ["Eisen", "an"]
                hints: ["Woraus sind Dinge, die am Magneten hängen bleiben?"]
              - id: l1-s4
                type: sorting
                text: "Was zieht der Magnet an?"
                say: "Emil räumt Omas Nähkästchen auf. Sortiere. Was zieht der Magnet an, was nicht?"
                bins:
                  - { id: ja, show: { text: "zieht er an" }, say: "zieht er an" }
                  - { id: nein, show: { text: "zieht er nicht an" }, say: "zieht er nicht an" }
                options:
                  - { text: "Stecknadel", bin: ja }
                  - { object: ruler, bin: nein }
                  - { object: crayon, bin: nein }
                  - { text: "Schraube aus Eisen", bin: ja }
                hints: ["Nur Dinge aus Eisen oder Stahl bleiben hängen."]
              - id: l1-s5
                type: multiple_choice
                text: "Emil hält den Magneten an Alufolie. Was passiert?"
                say: "Emil hält den Magneten an Alufolie. Was passiert?"
                options: ["Nichts, die Alufolie bleibt liegen.", "Die Alufolie springt an den Magneten.", "Die Alufolie wird bunt."]
                answer: "Nichts, die Alufolie bleibt liegen."
                hints: ["Alufolie ist aus Aluminium. Ist das Eisen?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Unter Omas Sessel liegen drei Dinge. Was holt der Magnet heraus?"
                say: "Unter Omas Sessel liegen drei Dinge. Was holt der Magnet heraus?"
                options: [{ object: paper-clip }, { object: marble }, { object: crayon }]
                answer: paper-clip
              - id: l1-n2
                type: true_false
                text: "Emils Magnet bleibt an der Kühlschranktür hängen. Stimmt das? In der Tür steckt Eisen."
                say: "Emils Magnet bleibt an der Kühlschranktür hängen. Stimmt das? In der Tür steckt Eisen."
                show: { object: fridge }
                answer: true
              - id: l1-n3
                type: sorting
                text: "Emil prüft die Münzen in seinem Portemonnaie. Welche bleiben hängen?"
                say: "Emil prüft die Münzen in seinem Portemonnaie. Sortiere. Welche bleiben am Magneten hängen?"
                bins:
                  - { id: ja, show: { text: "bleibt hängen" }, say: "bleibt hängen" }
                  - { id: nein, show: { text: "bleibt nicht hängen" }, say: "bleibt nicht hängen" }
                options:
                  - { text: "1 Cent", bin: ja }
                  - { text: "10 Cent", bin: nein }
                  - { text: "5 Cent", bin: ja }
                  - { text: "50 Cent", bin: nein }
              - id: l1-n4
                type: multiple_choice
                text: "Emil will seine Holzperlen mit dem Magneten aufsammeln. Klappt das?"
                say: "Emil will seine Holzperlen mit dem Magneten aufsammeln. Klappt das?"
                options: ["Nein, Holz bleibt nicht am Magneten.", "Ja, kleine Dinge bleiben immer hängen.", "Ja, aber nur die roten Perlen."]
                answer: "Nein, Holz bleibt nicht am Magneten."
              - id: l1-n5
                type: fill_in_blank
                text: "Emil erklärt Oma, warum der Magnet die Nadeln aufsammelt."
                say: "Emil erklärt Oma, warum der Magnet die Nadeln aufsammelt. Setz die passenden Wörter ein."
                frame: "Die Nadeln sind aus _. Den Wollfaden zieht der Magnet _ an."
                options: ["Stahl", "nicht", "Gold"]
                answer: ["Stahl", "nicht"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was zieht der Magnet an?"
            say: "Was zieht der Magnet an?"
            options: [{ object: paper-clip }, { object: leaf }, { object: cup }]
            answer: paper-clip
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Der Magnet zieht Holz an."
            say: "Stimmt das? Der Magnet zieht Holz an."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was bleibt am Magneten hängen?"
            say: "Was bleibt am Magneten hängen?"
            options: ["ein Nagel", "ein Bleistift", "ein Blatt Papier"]
            answer: "ein Nagel"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Eine 1-Cent-Münze bleibt am Magneten hängen."
            say: "Stimmt das? Eine 1-Cent-Münze bleibt am Magneten hängen."
            answer: true
          - id: l1-c5
            type: sorting
            text: "Bleibt es am Magneten hängen?"
            say: "Sortiere. Was bleibt am Magneten hängen, was nicht?"
            bins:
              - { id: ja, show: { text: "bleibt hängen" }, say: "bleibt hängen" }
              - { id: nein, show: { text: "bleibt nicht hängen" }, say: "bleibt nicht hängen" }
            options:
              - { object: pencil, bin: nein }
              - { object: paper-clip, bin: ja }
              - { object: glass, bin: nein }
              - { text: "Schraube aus Eisen", bin: ja }
          - id: l1-c6
            type: fill_in_blank
            text: "Was zieht ein Magnet an?"
            say: "Setz das passende Wort ein."
            frame: "Ein Magnet zieht Dinge aus _ an."
            options: ["Eisen", "Glas", "Holz"]
            answer: ["Eisen"]

  - n: 2
    title: { de: "Anziehen und abstoßen", en: "Pulling and pushing" }
    goal:
      de: "Finde heraus, was zwei Magnete miteinander machen. Zwei Nordpole schieben sich zum Beispiel weg."
      en: "Find out what two magnets do to each other. Two north poles, for example, push each other away."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Der Magnet zieht Omas Goldring an."
            say: "Stimmt das? Der Magnet zieht Omas Goldring an."
            show: { object: ring }
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Woraus sind Dinge, die am Magneten hängen bleiben?"
            say: "Woraus sind Dinge, die am Magneten hängen bleiben?"
            options: ["aus Eisen oder Stahl", "aus Kunststoff", "aus Papier"]
            answer: "aus Eisen oder Stahl"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was passiert, wenn zwei Magnete sich treffen?"
            say: "Emil hat zwei Stabmagnete. Jeder hat ein rotes und ein grünes Ende. Er schiebt die beiden roten Enden langsam aufeinander zu. Was glaubst du: Was passiert?"
            show: { text: "rot und rot" }
          - text: "Gleiche Pole stoßen sich ab."
            say: "Die Magnete schieben sich weg! Jeder Magnet hat zwei Enden. Sie heißen Nordpol und Südpol. Bei Emils Magneten ist der Nordpol rot und der Südpol grün. Zwei Nordpole schieben sich weg, zwei Südpole auch. Man sagt: Gleiche Pole stoßen sich ab."
            show: { text: "Nordpol und Nordpol: abstoßen" }
          - text: "Nordpol und Südpol ziehen sich an."
            say: "Jetzt dreht Emil einen Magneten um. Klack, schon hängen sie zusammen! Ein Nordpol und ein Südpol ziehen sich an. So halten auch die Wagen einer Holzeisenbahn zusammen: An ihren Enden sind Magnete. Stoßen sich zwei Wagen ab, dreht man einen um."
            show: { text: "Nordpol und Südpol: anziehen" }
          - text: "Die Magnetkraft geht durch Papier und Wasser."
            say: "Emil hängt sein Bild mit einem Magneten an den Kühlschrank. Das Papier ist dazwischen, und trotzdem hält der Magnet. Die Magnetkraft geht durch Papier, Pappe und Stoff. Sie geht sogar durch Wasser: Eine Büroklammer in einem Glas Wasser kann Emil mit dem Magneten außen am Glas nach oben ziehen."
            show: { objects: [fridge, glass] }
          - text: "Je näher, desto stärker."
            say: "Hält Emil den Magneten weit weg, bleibt die Büroklammer liegen. Kommt er näher, springt sie plötzlich hoch. Je näher der Magnet ist, desto stärker zieht er."
            show: { object: paper-clip }
          - text: "Probier's aus, mit einem Erwachsenen! Ein Angelspiel"
            say: "Probier's aus, mit einem Erwachsenen. Schneidet Fische aus Papier aus und steckt an jeden Fisch eine Büroklammer. Bindet einen Magneten an eine Schnur und die Schnur an einen Stock. Jetzt kannst du die Fische angeln! Und denk daran: Magnete gehören nie in den Mund."
            show: { object: fish }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Zwei Nordpole kommen zusammen. Was passiert?"
                say: "Zwei Nordpole kommen zusammen. Was passiert?"
                options: ["Sie stoßen sich ab.", "Sie ziehen sich an.", "Sie werden heiß."]
                answer: "Sie stoßen sich ab."
                feedback:
                  "Sie werden heiß.": "Heiß werden sie nicht, keine Sorge! Zwei Nordpole schieben sich weg. Sie stoßen sich ab."
                hints:
                  - "Denk an Emils zwei rote Enden."
                  - "Zwei gleiche Pole treffen sich. Mögen sie sich?"
                  - "Gleiche Pole stoßen sich ab."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Ziehen sie sich an oder stoßen sie sich ab?"
                say: "Sortiere. Welche Pole ziehen sich an, welche stoßen sich ab?"
                bins:
                  - { id: an, show: { text: "ziehen sich an" }, say: "ziehen sich an" }
                  - { id: ab, show: { text: "stoßen sich ab" }, say: "stoßen sich ab" }
                options:
                  - { text: "Nordpol und Südpol", bin: an }
                  - { text: "Nordpol und Nordpol", bin: ab }
                  - { text: "Südpol und Südpol", bin: ab }
                  - { text: "Südpol und Nordpol", bin: an }
                hints:
                  - "Schau, ob die beiden Pole gleich sind oder verschieden."
                  - "Gleiche Pole schieben sich weg. Verschiedene Pole hängen zusammen."
                  - "Nordpol und Südpol ziehen sich an. Zwei gleiche stoßen sich ab."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Der Magnet hält Emils Bild am Kühlschrank, obwohl Papier dazwischen ist."
                say: "Stimmt das? Der Magnet hält Emils Bild am Kühlschrank, obwohl Papier dazwischen ist."
                show: { object: fridge }
                answer: true
                hints:
                  - "Wie hängen bei euch Bilder am Kühlschrank?"
                  - "Die Magnetkraft geht durch dünne Dinge hindurch."
                  - "Ja. Die Kraft geht durch das Papier."
              - id: l2-f4
                type: multiple_choice
                text: "Wo zieht der Magnet die Büroklammer am stärksten an?"
                say: "Wo zieht der Magnet die Büroklammer am stärksten an?"
                options: ["ganz nah an der Klammer", "weit weg von der Klammer", "in einem anderen Zimmer"]
                answer: "ganz nah an der Klammer"
                hints:
                  - "Wann ist die Büroklammer hochgesprungen?"
                  - "Weit weg blieb sie liegen. Dann kam der Magnet näher."
                  - "Ganz nah zieht der Magnet am stärksten."
              - id: l2-f5
                type: fill_in_blank
                text: "Was machen die Pole?"
                say: "Setz die passenden Wörter ein."
                frame: "Gleiche Pole stoßen sich _. Verschiedene Pole ziehen sich _."
                options: ["ab", "an", "um"]
                answer: ["ab", "an"]
                hints:
                  - "Ein Wort heißt wegschieben, eins heißt zusammenhalten."
                  - "Zwei Nordpole schieben sich weg. Nordpol und Südpol halten zusammen."
                  - "Gleiche Pole stoßen sich ab, verschiedene ziehen sich an."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Ein Südpol und noch ein Südpol ziehen sich an."
                say: "Stimmt das? Ein Südpol und noch ein Südpol ziehen sich an."
                answer: false
                hints: ["Sind die beiden Pole gleich oder verschieden?"]
              - id: l2-s2
                type: multiple_choice
                text: "Emil legt ein Blatt Papier zwischen Magnet und Büroklammer. Was passiert?"
                say: "Emil legt ein Blatt Papier zwischen Magnet und Büroklammer. Was passiert?"
                options: ["Der Magnet zieht die Klammer trotzdem an.", "Die Klammer verschwindet.", "Der Magnet zieht sie nicht mehr an."]
                answer: "Der Magnet zieht die Klammer trotzdem an."
                hints: ["Denk an das Bild am Kühlschrank."]
              - id: l2-s3
                type: ordering
                text: "Wie baut Emil das Angelspiel?"
                say: "Wie baut Emil das Angelspiel? Leg die Karten in die richtige Reihenfolge."
                options: ["Er angelt die Fische mit dem Magneten.", "Er schneidet Fische aus Papier aus.", "Er steckt an jeden Fisch eine Büroklammer."]
                slot_count: 3
                answer: ["Er schneidet Fische aus Papier aus.", "Er steckt an jeden Fisch eine Büroklammer.", "Er angelt die Fische mit dem Magneten."]
                hints: ["Ohne Fische kann man nicht angeln."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Eine Büroklammer liegt in einem Glas Wasser. Ein Magnet außen am Glas kann sie hochziehen."
                say: "Stimmt das? Eine Büroklammer liegt in einem Glas Wasser. Ein Magnet außen am Glas kann sie hochziehen."
                show: { object: glass }
                answer: true
