# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.town-country
skill: world.space.town-country
curriculum: de-DE
language: de
title:
  de: Stadt und Land
  en: Town and countryside
summary: >
  Lotta lives in a town and spends the holidays with her cousin Finn, who
  lives in a village. Lesson 1 names what is typical of each: in the town
  many people live close together in tall houses, with shops, a station, a
  hospital and a lot of traffic; in the countryside there are few houses,
  fields, meadows, farms and animals, less traffic and a bus that comes
  less often. Lesson 2 compares life in both: short ways and many places
  to go in the town but noise and traffic, quiet and nature in the
  countryside but long ways by car or school bus; in both, people live,
  work, shop and have free time. Both have good sides. It ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Pläne und Orte, en: Plans and places }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: []
  vocabulary: { de: [Stadt, Land, Dorf, Hochhaus, Feld, Wiese, Bauernhof, Verkehr, Weg, Freizeit] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: town, what: { de: Merkmale der Stadt nennen, en: naming features of a town } }
    - { id: country, what: { de: Merkmale des Landes nennen, en: naming features of the countryside } }
    - { id: compare, what: { de: "Leben in Stadt und Land vergleichen", en: comparing life in town and countryside } }
  misconceptions:
    - id: one-is-better
      what: Thinks town or countryside is simply better
      addressed: lesson 2 Learn opens with the argument and answers that both have good sides and drawbacks; l2-f1, l2-f2, l2-s4, l2-n2; l2-c16 to l2-c18 in the skill check
    - id: country-empty
      what: Thinks the countryside is empty, with nothing to do and no animals or people
      addressed: lesson 2 Learn names the sports club and nature; l2-n2; l2-c12 in the skill check
    - id: bus-same-everywhere
      what: Thinks the bus runs as often in the countryside as in the town
      addressed: lesson 1 Learn says the bus comes less often in the countryside; l1-s2, l1-f4; l2-c11 and l2-c13 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Stadt oder Land?", en: "Town or countryside?" }
    goal:
      de: "Finde heraus, was typisch für die Stadt ist und was für das Land. In der Stadt gibt es Hochhäuser, auf dem Land Felder und Bauernhöfe."
      en: "Find out what is typical of the town and what of the countryside. The town has tall buildings, the countryside fields and farms."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was sieht Lotta bei Finn?"
            say: "Lotta wohnt in einer Stadt. In den Ferien fährt sie mit dem Zug zu ihrem Cousin Finn. Finn wohnt auf dem Land, in einem Dorf. Was glaubst du: Was sieht Lotta bei Finn, was sie in der Stadt nur selten sieht?"
            show: { object: train }
          - text: "Auf dem Land: Felder, Wiesen und Bauernhöfe"
            say: "Felder, Wiesen und Bauernhöfe! Im Dorf stehen nur wenige Häuser, oft mit einem großen Garten. Auf den Wiesen grasen Kühe und Schafe, und auf den Feldern wächst zum Beispiel Weizen. Die Bäuerin und der Bauer arbeiten auf dem Hof."
            show: { objects: [farm, cow] }
          - text: "In der Stadt: viele Menschen und hohe Häuser"
            say: "In Lottas Stadt wohnen viele Menschen dicht beieinander. Die Häuser sind hoch. Manche sind Hochhäuser mit vielen Wohnungen. Es gibt viele Geschäfte, ein Kino, einen Bahnhof und ein Krankenhaus. Im Krankenhaus arbeiten Ärztinnen und Ärzte."
            show: { objects: [tower-block, station] }
          - text: "Viel Verkehr in der Stadt, wenig auf dem Land"
            say: "In der Stadt fahren viele Autos und Busse, oft auch Straßenbahnen. An vielen Kreuzungen stehen Ampeln. Auf dem Land ist weniger Verkehr. Der Bus kommt nicht so oft, darum fahren viele Menschen mit dem Auto."
            show: { objects: [bus, traffic-light] }
          - text: "Wusstest du? In Berlin wohnen mehr als drei Millionen Menschen."
            say: "Wusstest du? Berlin ist die größte Stadt in Deutschland. Dort wohnen mehr als drei Millionen Menschen. In manchen Dörfern wohnen nur ein paar Hundert."
            show: { object: house }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was siehst du eher auf dem Land?"
                say: "Was siehst du eher auf dem Land?"
                options: [{ object: taxi }, { object: cow }, { object: hospital }]
                answer: cow
                feedback:
                  taxi: "Ein Taxi auf der Kuhweide? Taxis fahren vor allem in der Stadt. Auf dem Land grasen Kühe."
                hints:
                  - "Auf dem Land gibt es viele Wiesen. Wer lebt dort?"
                  - "Ein Krankenhaus steht meistens in der Stadt, Taxis fahren meist in der Stadt."
                  - "Die Kuh grast auf der Wiese auf dem Land."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "In der Stadt wohnen viele Menschen dicht beieinander."
                say: "In der Stadt wohnen viele Menschen dicht beieinander. Stimmt das?"
                show: { object: station }
                answer: true
                hints:
                  - "Denk an die hohen Häuser in Lottas Stadt."
                  - "In einem Hochhaus gibt es viele Wohnungen übereinander."
                  - "Ja, das stimmt."
              - id: l1-f3
                type: sorting
                text: "Ist das typisch für die Stadt oder für das Land?"
                say: "Ist das typisch für die Stadt oder für das Land? Sortiere."
                bins:
                  - { id: stadt, show: { text: "typisch Stadt" }, say: "typisch Stadt" }
                  - { id: land, show: { text: "typisch Land" }, say: "typisch Land" }
                options:
                  - { object: hospital, bin: stadt }
                  - { object: wheat, bin: land }
                  - { object: tower-block, bin: stadt }
                  - { object: cow, bin: land }
                hints:
                  - "Wo gibt es Felder und Wiesen, wo viele hohe Häuser?"
                  - "Weizen wächst auf dem Feld. Ein Hochhaus hat viele Wohnungen."
                  - "Krankenhaus und Hochhaus zur Stadt, Weizen und Kuh zum Land."
              - id: l1-f4
                type: multiple_choice
                text: "Wie kommen auf dem Land viele Menschen zum Einkaufen?"
                say: "Wie kommen auf dem Land viele Menschen zum Einkaufen?"
                options: ["mit dem Auto", "mit der U-Bahn", "mit dem Schiff"]
                answer: "mit dem Auto"
                feedback:
                  "mit der U-Bahn": "Eine U-Bahn gibt es nur in großen Städten. Auf dem Land fahren viele mit dem Auto."
                hints:
                  - "Wie oft kommt der Bus auf dem Land?"
                  - "Der Bus kommt nicht so oft. Darum nehmen viele etwas anderes."
                  - "Mit dem Auto."
              - id: l1-f5
                type: fill_in_blank
                text: "Wie sind die Häuser?"
                say: "Setz die passenden Wörter ein."
                frame: "In der Stadt sind die Häuser oft _. Auf dem Land haben viele Häuser einen großen _."
                options: ["hoch", "Garten", "Bahnhof"]
                answer: ["hoch", "Garten"]
                hints:
                  - "Denk an die Hochhäuser in der Stadt."
                  - "Im Dorf stehen wenige Häuser, mit viel Platz drumherum."
                  - "Hoch und Garten."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was gibt es eher in der Stadt?"
                say: "Was gibt es eher in der Stadt?"
                options: [{ object: sheep }, { object: wheat }, { object: hospital }]
                answer: hospital
                hints: ["Schafe und Weizen findest du auf Wiesen und Feldern."]
              - id: l1-s2
                type: true_false
                text: "Auf dem Land fährt der Bus genauso oft wie in der Stadt."
                say: "Auf dem Land fährt der Bus genauso oft wie in der Stadt. Stimmt das?"
                show: { object: bus }
                answer: false
                hints: ["Warum fahren auf dem Land viele Menschen mit dem Auto?"]
              - id: l1-s3
                type: matching
                text: "Wer arbeitet wo?"
                say: "Verbinde jeden Menschen mit dem Ort, wo er arbeitet."
                pairs:
                  - { left: { object: farmer }, right: { object: farm, say: "auf dem Bauernhof" } }
                  - { left: { object: doctor }, right: { object: hospital, say: "im Krankenhaus" } }
                  - { left: { object: teacher }, right: { object: school, say: "in der Schule" } }
                hints: ["Wer kümmert sich um Kühe, wer um Kranke, wer um Schulkinder?"]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist typisch für ein Dorf?"
                say: "Was ist typisch für ein Dorf?"
                show: { object: village }
                options: ["wenige Häuser und viele Felder", "viele Hochhäuser", "eine U-Bahn"]
                answer: "wenige Häuser und viele Felder"
                hints: ["Im Dorf stehen nur wenige Häuser."]
              - id: l1-s5
                type: sorting
                text: "Gehört das eher zur Stadt oder zum Land?"
                say: "Gehört das eher zur Stadt oder zum Land? Sortiere."
                bins:
                  - { id: stadt, show: { text: "typisch Stadt" }, say: "typisch Stadt" }
                  - { id: land, show: { text: "typisch Land" }, say: "typisch Land" }
                options:
                  - { text: "viel Verkehr", bin: stadt }
                  - { object: farm, bin: land }
                  - { object: tram, bin: stadt }
                  - { object: sheep, say: "Weide mit Schafen", bin: land }
                hints: ["Wo fahren viele Autos, Busse und Bahnen?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lotta wacht bei Finn im Dorf auf. Was hört sie dort eher?"
                say: "Lotta wacht bei Finn im Dorf auf. Was hört sie dort eher?"
                options: ["einen Hahn", "eine Straßenbahn", "viele hupende Autos"]
                answer: "einen Hahn"
              - id: l1-n2
                type: image_multiple_choice
                text: "Finn zeigt Lotta, was auf dem Feld wächst. Was ist es?"
                say: "Finn zeigt Lotta, was auf dem Feld wächst. Was ist es?"
                options: [{ object: pizza }, { object: wheat }, { object: ice-cream }]
                answer: wheat
                feedback:
                  pizza: "Pizza wächst leider nicht auf dem Feld! Aber aus Weizen macht man Mehl, und aus Mehl Pizzateig."
              - id: l1-n3
                type: true_false
                text: "Finn sagt: „In unserem Dorf gibt es kein Krankenhaus.“ Kann das stimmen?"
                say: "Finn sagt: In unserem Dorf gibt es kein Krankenhaus. Kann das stimmen?"
                show: { object: hospital }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Finn besucht Lotta in der Stadt. Was sieht er dort öfter als im Dorf?"
                say: "Finn besucht Lotta in der Stadt. Was sieht er dort öfter als im Dorf?"
                options: ["Hochhäuser", "Kühe", "Felder"]
                answer: "Hochhäuser"
              - id: l1-n5
                type: sorting
                text: "Lotta malt ein Bild von der Stadt und eins vom Dorf. Was malt sie wohin?"
                say: "Lotta malt ein Bild von der Stadt und eins vom Dorf. Was malt sie wohin? Sortiere."
                bins:
                  - { id: stadt, show: { text: "Bild von der Stadt" }, say: "Bild von der Stadt" }
                  - { id: land, show: { text: "Bild vom Dorf" }, say: "Bild vom Dorf" }
                options:
                  - { object: sheep, bin: land }
                  - { object: taxi, bin: stadt }
                  - { object: farmer, bin: land }
                  - { object: hospital, bin: stadt }
              - id: l1-n6
                type: fill_in_blank
                text: "Lotta schreibt eine Karte an Mama."
                say: "Lotta schreibt eine Karte an Mama. Setz das passende Wort ein."
                frame: "Im Dorf gibt es viele Felder und wenig _."
                options: ["Verkehr", "Kühe", "Wiesen"]
                answer: ["Verkehr"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was ist typisch für die Stadt?"
            say: "Was ist typisch für die Stadt?"
            options: [{ object: cow }, { object: taxi }, { object: wheat }]
            answer: taxi
          - id: l1-c2
            type: true_false
            text: "Auf dem Land gibt es viele Felder und Wiesen."
            say: "Auf dem Land gibt es viele Felder und Wiesen. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wo wohnen viele Menschen dicht beieinander?"
            say: "Wo wohnen viele Menschen dicht beieinander?"
            options: ["in der Stadt", "auf dem Land", "auf dem Feld"]
            answer: "in der Stadt"
          - id: l1-c4
            type: true_false
            text: "In einem Dorf stehen viele Hochhäuser."
            say: "In einem Dorf stehen viele Hochhäuser. Stimmt das?"
            show: { object: village }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Was siehst du eher auf dem Land?"
            say: "Was siehst du eher auf dem Land?"
            options: [{ object: hospital }, { object: sheep }, { object: taxi }]
            answer: sheep
          - id: l1-c6
            type: fill_in_blank
            text: "Was gibt es in der Stadt viel?"
            say: "Setz das passende Wort ein."
            frame: "In der Stadt gibt es viel _."
            options: ["Verkehr", "Weizen", "Ruhe"]
            answer: ["Verkehr"]

  - n: 2
    title: { de: "Leben in Stadt und Dorf", en: "Life in town and village" }
    goal:
      de: "Vergleiche das Leben in der Stadt und auf dem Land. In der Stadt sind die Wege kurz, auf dem Land ist es ruhig."
      en: "Compare life in the town and in the countryside. In the town the ways are short, in the countryside it is quiet."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was siehst du eher auf dem Land?"
            say: "Was siehst du eher auf dem Land?"
            options: [{ object: station }, { object: hen }, { object: traffic-light }]
            answer: hen
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "In der Stadt sind die Häuser oft hoch."
            say: "In der Stadt sind die Häuser oft hoch. Stimmt das?"
            show: { object: tower-block }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wer hat recht?"
            say: "Lotta sagt: In der Stadt ist es viel besser! Finn sagt: Nein, auf dem Land ist es besser! Was glaubst du: Wer hat recht?"
            show: { objects: [girl, boy] }
          - text: "Beide haben gute Gründe."
            say: "Beide haben gute Gründe! Stadt und Land haben gute Seiten, und beide haben auch Nachteile. Es kommt darauf an, was dir wichtig ist."
            show: { objects: [girl, boy] }
          - text: "In der Stadt sind die Wege kurz."
            say: "In der Stadt sind Schule, Geschäfte, Kino und Schwimmbad oft nah. Lotta kann zu Fuß gehen, und der Bus kommt alle paar Minuten. Aber in der Stadt ist es oft laut, und es gibt viel Verkehr."
            show: { objects: [shop, bus] }
          - text: "Auf dem Land ist es ruhig."
            say: "Auf dem Land ist es ruhiger, und die Natur ist ganz nah. Finn spielt im Wald und auf der Wiese. Aber die Wege sind oft weit. Zur Schule im nächsten Ort fährt Finn mit dem Schulbus, und zum Einkaufen fährt die Familie meistens mit dem Auto."
            show: { objects: [tree, car] }
          - text: "Wohnen, arbeiten, einkaufen und Freizeit"
            say: "In der Stadt und auf dem Land machen Menschen das Gleiche: Sie wohnen, arbeiten, kaufen ein und haben Freizeit. In der Stadt arbeiten viele in Geschäften, Büros und Krankenhäusern, auf dem Land manche auf dem Bauernhof. In der Freizeit geht Lotta in die Bücherei oder ins Schwimmbad. Finn spielt im Dorf im Sportverein Fußball, mit vielen anderen Kindern."
            show: { objects: [library, farmer] }
          - text: "Wusstest du? Düsseldorf ist eine große Stadt, aber ihr Name endet auf Dorf."
            say: "Wusstest du? Düsseldorf ist eine große Stadt. Trotzdem endet ihr Name auf Dorf. Vor langer Zeit war Düsseldorf nämlich ein kleines Dorf an dem Bach Düssel."
            show: { object: house }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was ist gut am Leben in der Stadt?"
                say: "Was ist gut am Leben in der Stadt?"
                options: ["Schule und Geschäfte sind oft nah.", "Es ist immer ganz still.", "Überall sind Felder."]
                answer: "Schule und Geschäfte sind oft nah."
                hints:
                  - "Denk an Lottas Weg zur Schule."
                  - "In der Stadt ist es oft laut, und Felder gibt es auf dem Land."
                  - "Schule und Geschäfte sind oft nah."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Was ist gut an der Stadt, was am Land?"
                say: "Was ist gut an der Stadt, was ist gut am Land? Sortiere."
                bins:
                  - { id: stadt, show: { text: "gut an der Stadt" }, say: "gut an der Stadt" }
                  - { id: land, show: { text: "gut am Land" }, say: "gut am Land" }
                options:
                  - { text: "kurze Wege", bin: stadt }
                  - { text: "viel Natur", bin: land }
                  - { text: "viele Geschäfte", bin: stadt }
                  - { text: "es ist ruhig", bin: land }
                hints:
                  - "Wo kann Lotta zu Fuß gehen? Wo spielt Finn im Wald?"
                  - "In der Stadt ist vieles nah. Auf dem Land ist es still und grün."
                  - "Kurze Wege und viele Geschäfte zur Stadt, viel Natur und Ruhe zum Land."
              - id: l2-f3
                type: true_false
                text: "Auf dem Land sind die Wege zum Einkaufen oft weit."
                say: "Auf dem Land sind die Wege zum Einkaufen oft weit. Stimmt das?"
                show: { object: car }
                answer: true
                hints:
                  - "Womit fährt Finns Familie zum Einkaufen?"
                  - "Sie fährt mit dem Auto in den nächsten Ort."
                  - "Ja, das stimmt."
              - id: l2-f4
                type: matching
                text: "Wohin geht Lotta in ihrer Freizeit?"
                say: "Wohin geht Lotta in ihrer Freizeit? Verbinde."
                pairs:
                  - { left: { text: "schwimmen" }, right: { object: swimming-pool } }
                  - { left: { text: "Bücher ausleihen" }, right: { object: library } }
                  - { left: { text: "einkaufen" }, right: { object: supermarket } }
                hints:
                  - "Fang mit dem an, was du am besten kennst."
                  - "Bücher gibt es in der Bücherei. Schwimmen kannst du im Schwimmbad."
                  - "Schwimmen im Schwimmbad, Bücher in der Bücherei, einkaufen im Supermarkt."
              - id: l2-f5
                type: multiple_choice
                text: "Wie kommt Finn vom Dorf zur Schule im nächsten Ort?"
                say: "Wie kommt Finn vom Dorf zur Schule im nächsten Ort?"
                options: ["mit dem Schulbus", "mit der U-Bahn", "mit der Kutsche"]
                answer: "mit dem Schulbus"
                feedback:
                  "mit der Kutsche": "Mit Pferd und Kutsche? Das wäre lustig, aber Finn fährt mit dem Schulbus."
                hints:
                  - "Die Schule ist nicht in Finns Dorf. Der Weg ist weit."
                  - "Eine U-Bahn gibt es nur in großen Städten."
                  - "Mit dem Schulbus."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "In der Stadt ist es oft leiser als auf dem Land."
                say: "In der Stadt ist es oft leiser als auf dem Land. Stimmt das?"
                answer: false
                hints: ["Wo fahren viele Autos, Busse und Bahnen?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Finns Familie kauft im nächsten Ort ein. Womit fährt sie meistens?"
                say: "Finns Familie kauft im nächsten Ort ein. Womit fährt sie meistens?"
                options: [{ object: horse }, { object: car }, { object: boat }]
                answer: car
                feedback:
                  horse: "Mit dem Pferd zum Supermarkt? Das wäre lustig! Meistens fährt Finns Familie mit dem Auto."
                hints: ["Der Weg ist weit, und der Bus kommt nicht oft."]
              - id: l2-s3
                type: sorting
                text: "Arbeiten oder Freizeit?"
                say: "Arbeiten die Menschen hier, oder haben sie Freizeit? Sortiere."
                bins:
                  - { id: arbeit, show: { text: "arbeiten" }, say: "arbeiten" }
                  - { id: frei, show: { text: "Freizeit" }, say: "Freizeit" }
                options:
                  - { text: "Der Bauer melkt die Kühe.", bin: arbeit }
                  - { text: "Lotta schwimmt im Schwimmbad.", bin: frei }
                  - { text: "Die Ärztin hilft im Krankenhaus.", bin: arbeit }
                  - { text: "Finn spielt Fußball im Verein.", bin: frei }
                hints: ["Wer verdient damit Geld, wer macht es zum Spaß?"]
              - id: l2-s4
                type: multiple_choice
                text: "Was ist ein Nachteil auf dem Land?"
                say: "Was ist ein Nachteil auf dem Land?"
                options: ["Die Wege sind oft weit.", "Es gibt zu viele Hochhäuser.", "Es fahren zu viele Straßenbahnen."]
                answer: "Die Wege sind oft weit."
                hints: ["Hochhäuser und Straßenbahnen gibt es vor allem in der Stadt."]
              - id: l2-s5
                type: fill_in_blank
                text: "Was ist gut an Stadt und Land?"
                say: "Setz die passenden Wörter ein."
                frame: "In der Stadt sind die Wege _. Auf dem Land ist es _."
                options: ["kurz", "ruhig", "laut"]
                answer: ["kurz", "ruhig"]
                hints: ["In der Stadt ist vieles nah. Auf dem Land fahren wenige Autos."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Lotta und Finn wollen ins Kino. Wo ist das Kino wahrscheinlich näher?"
                say: "Lotta und Finn wollen ins Kino. Wo ist das Kino wahrscheinlich näher?"
                options: ["in Lottas Stadt", "in Finns Dorf"]
                answer: "in Lottas Stadt"
              - id: l2-n2
                type: true_false
                text: "Finn sagt: „Im Dorf kann ich nie etwas mit anderen Kindern machen.“ Stimmt das?"
                say: "Finn sagt: Im Dorf kann ich nie etwas mit anderen Kindern machen. Stimmt das?"
                answer: false
              - id: l2-n3
                type: sorting
                text: "Lotta und Finn schreiben auf, was ihnen gefällt. Wer schreibt was?"
                say: "Lotta und Finn schreiben auf, was ihnen gefällt. Wer schreibt was? Sortiere."
                bins:
                  - { id: lotta, show: { text: "Lotta aus der Stadt" }, say: "Lotta aus der Stadt" }
                  - { id: finn, show: { text: "Finn vom Dorf" }, say: "Finn vom Dorf" }
                options:
                  - { text: "Ich gehe zu Fuß zum Schwimmbad.", bin: lotta }
                  - { text: "Ich sehe jeden Tag Kühe.", bin: finn }
                  - { text: "Mein Bus kommt alle paar Minuten.", bin: lotta }
                  - { text: "Ich spiele im Wald.", bin: finn }
              - id: l2-n4
                type: multiple_choice
                text: "Finns Oma muss ins Krankenhaus. Wohin fährt sie?"
                say: "Finns Oma muss ins Krankenhaus. Wohin fährt sie?"
                show: { object: hospital }
                options: ["in die Stadt", "aufs Feld", "in den Wald"]
                answer: "in die Stadt"
