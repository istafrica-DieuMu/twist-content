# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.food-origin
skill: world.nature.food-origin
curriculum: de-DE
language: de
title:
  de: Woher kommt unser Essen?
  en: Where does our food come from?
summary: >
  Emil and his Papa pack a picnic and later shop at the Wochenmarkt, at
  Frau Yilmaz's vegetable stall. Lesson 1 asks whether pasta grows on a
  tree: pasta and bread are made from ground wheat, chips from potatoes,
  sugar here mostly from sugar beet, ketchup from tomatoes; cheese, eggs
  and honey come from animals. Lesson 2 opens in December with no
  strawberries at the stall: seasonal means fruit and vegetables at the
  time they ripen here (asparagus in spring, strawberries and cherries in
  summer, apples and pumpkins in autumn, cabbage, carrots and stored
  apples in winter); local means from nearby. Bananas, pineapples, oranges
  and cocoa beans need warmth all year and come from far away, often by
  ship. Local and seasonal food travels less and needs no heated
  greenhouse, which saves energy; bananas are still fine to eat. It ends
  with the skill check.
metadata:
  year: klasse-2
  topic: { de: Vom Hof auf den Tisch, en: From farm to table }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.farm-animals, world.nature.plant-growth]
  also_practises: []
  vocabulary: { de: [Lebensmittel, Getreide, Weizen, Mehl, Zuckerrübe, regional, saisonal, Jahreszeit, Wochenmarkt, Gewächshaus] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: origin, what: { de: "sagen, von welcher Pflanze oder welchem Tier ein Lebensmittel kommt", en: saying which plant or animal a food comes from } }
    - { id: regional, what: { de: "erklären, was regional heißt und warum es gut für die Umwelt ist", en: explaining what local means and why it is good for the environment } }
    - { id: seasonal, what: { de: "erklären, was saisonal heißt, und Obst und Gemüse der Jahreszeit zuordnen", en: explaining what seasonal means and matching fruit and vegetables to their season } }
  misconceptions:
    - id: food-made-in-shop
      what: Thinks foods like pasta, bread or sugar are made in the shop or factory from nothing, not from plants
      addressed: lesson 1 Learn opens with the guess whether pasta grows on a tree; l1-f3, l1-f5, l1-n4, l1-c6, l2-c2 and l2-c4
    - id: everything-grows-here
      what: Thinks bananas, pineapples and oranges grow in Germany
      addressed: lesson 2 Learn says they need warmth all year; l2-f2, l2-f4, l2-n5, l2-c9, l2-c11 and l2-c14
    - id: always-in-season
      what: Thinks every fruit grows here all year because the shop always has it
      addressed: lesson 2 Learn opens with no strawberries in December; l2-f3, l2-n1, l2-c15 and l2-c20
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Von der Pflanze oder vom Tier?", en: "From a plant or from an animal?" }
    goal:
      de: "Finde heraus, woher dein Essen kommt. Nudeln macht man zum Beispiel aus Weizen, Käse aus Milch."
      en: "Find out where your food comes from. Pasta, for example, is made from wheat, cheese from milk."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Von welchem Tier kommen die Eier?"
            say: "Von welchem Tier kommen die Eier?"
            options: [{ object: hen }, { object: cow }, { object: pig }]
            answer: hen
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Eine Pflanze braucht Licht, Wasser, Wärme und Erde."
            say: "Stimmt das? Eine Pflanze braucht Licht, Wasser, Wärme und Erde."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wachsen Nudeln am Baum?"
            say: "Emil packt mit Papa einen Picknickkorb: Brot, Käse, Äpfel, Saft und kalten Nudelsalat. Emil fragt: Woher kommen eigentlich die Nudeln? Was glaubst du: Wachsen Nudeln an einem Baum?"
            show: { object: pasta }
          - text: "Nudeln macht man aus Weizen."
            say: "Nein, Nudeln wachsen nicht am Baum. Man macht sie aus gemahlenem Weizen. Weizen ist ein Getreide und wächst auf dem Feld. Auch Brot backt man aus Mehl, und Mehl ist gemahlenes Getreide."
            show: { objects: [wheat, bread] }
          - text: "Viele Lebensmittel kommen von Pflanzen."
            say: "Äpfel und Apfelsaft kommen vom Apfelbaum. Möhren und Salat sind Gemüse. Pommes macht man aus Kartoffeln. Und den Zucker macht man bei uns meist aus der Zuckerrübe, die auf dem Feld wächst."
            show: { objects: [apple, carrot] }
          - text: "Andere Lebensmittel kommen von Tieren."
            say: "Käse macht man aus Milch, und die Milch gibt zum Beispiel die Kuh. Eier legt das Huhn, und den Honig machen die Bienen."
            show: { objects: [cheese, honeycomb] }
          - text: "Wusstest du? Ketchup ist aus Tomaten."
            say: "Wusstest du? Ketchup macht man aus Tomaten. Und die Tomate wächst aus einer Blüte und hat innen Samen, genau wie ein Apfel."
            show: { objects: [ketchup, tomato] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Woraus macht man Brot?"
                say: "Woraus macht man Brot?"
                options: [{ object: wheat }, { object: fish }, { object: stone }]
                answer: wheat
                feedback:
                  stone: "Ein Brot aus Stein? Da würdest du dir die Zähne ausbeißen! Brot macht man aus Getreide wie Weizen."
                hints:
                  - "Brot backt man aus Mehl."
                  - "Mehl ist gemahlenes Getreide, das auf dem Feld wächst."
                  - "Brot macht man aus Weizen."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Von der Pflanze oder vom Tier?"
                say: "Sortiere. Was kommt von einer Pflanze, was von einem Tier?"
                bins:
                  - { id: pflanze, show: { text: "von einer Pflanze" }, say: "von einer Pflanze" }
                  - { id: tier, show: { text: "von einem Tier" }, say: "von einem Tier" }
                options:
                  - { object: apple, bin: pflanze }
                  - { object: cheese, bin: tier }
                  - { object: bread, bin: pflanze }
                  - { object: egg, bin: tier }
                hints:
                  - "Frag bei jedem: Wächst es, oder gibt es ein Tier?"
                  - "Der Apfel wächst am Baum, Brot ist aus Weizen. Käse ist aus Milch."
                  - "Apfel und Brot von der Pflanze, Käse und Ei vom Tier."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Nudeln wachsen an einem Nudelbaum."
                say: "Stimmt das? Nudeln wachsen an einem Nudelbaum."
                show: { object: pasta }
                answer: false
                hints:
                  - "Woraus macht man Nudeln?"
                  - "Nudeln macht man aus gemahlenem Weizen. Weizen wächst auf dem Feld."
                  - "Nein. Einen Nudelbaum gibt es nicht."
              - id: l1-f4
                type: matching
                text: "Woraus ist das gemacht?"
                say: "Verbinde jedes Lebensmittel mit dem, woraus man es macht."
                pairs:
                  - { left: { object: bread }, right: { object: wheat } }
                  - { left: { object: cheese }, right: { object: milk } }
                  - { left: { object: chips }, right: { object: potato } }
                  - { left: { object: ketchup }, right: { object: tomato } }
                hints:
                  - "Fang mit dem Brot an. Was wächst auf dem Feld?"
                  - "Käse kommt von der Kuh. Pommes macht man aus einem Gemüse unter der Erde."
                  - "Brot und Weizen, Käse und Milch, Pommes und Kartoffeln, Ketchup und Tomate."
              - id: l1-f5
                type: multiple_choice
                text: "Woraus macht man bei uns meist den Zucker?"
                say: "Woraus macht man bei uns meist den Zucker?"
                show: { object: bag-of-sugar }
                options: ["aus der Zuckerrübe", "aus Salz", "aus Milch"]
                answer: "aus der Zuckerrübe"
                hints:
                  - "Zucker kommt von einer Pflanze."
                  - "Die Pflanze wächst bei uns auf dem Feld und hat Zucker im Namen."
                  - "Aus der Zuckerrübe."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Was ist ein Getreide?"
                say: "Was ist ein Getreide?"
                options: ["Weizen", "Möhre", "Käse"]
                answer: "Weizen"
                hints: ["Aus Getreide macht man Mehl."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Honig kommt von den Bienen."
                say: "Stimmt das? Honig kommt von den Bienen."
                show: { object: honeycomb }
                answer: true
                hints: ["Wer fliegt von Blüte zu Blüte und baut Waben?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was kommt von einer Pflanze?"
                say: "Was kommt von einer Pflanze?"
                options: [{ object: carrot }, { object: egg }, { object: cheese }]
                answer: carrot
                hints: ["Ei und Käse kommen von Tieren."]
              - id: l1-s4
                type: fill_in_blank
                text: "Woraus ist das?"
                say: "Setz die passenden Wörter ein."
                frame: "Pommes macht man aus _. Käse macht man aus _."
                options: ["Kartoffeln", "Milch", "Weizen"]
                answer: ["Kartoffeln", "Milch"]
                hints: ["Das eine wächst unter der Erde, das andere gibt die Kuh."]
              - id: l1-s5
                type: sorting
                text: "Aus Getreide oder aus Milch?"
                say: "Sortiere. Was ist aus Getreide, was aus Milch?"
                bins:
                  - { id: getreide, show: { object: wheat }, say: "aus Getreide" }
                  - { id: milch, show: { object: milk }, say: "aus Milch" }
                options:
                  - { object: bread, bin: getreide }
                  - { object: pasta, bin: getreide }
                  - { object: cheese, bin: milch }
                  - { object: yoghurt, bin: milch }
                hints: ["Brot und Nudeln macht man aus Mehl."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Emil isst ein Käsebrot. Woher kommen Käse und Brot?"
                say: "Emil isst ein Käsebrot. Woher kommen Käse und Brot?"
                show: { objects: [cheese, bread] }
                options: ["der Käse von der Kuh, das Brot vom Weizen", "der Käse vom Weizen, das Brot von der Kuh", "beides vom Huhn"]
                answer: "der Käse von der Kuh, das Brot vom Weizen"
              - id: l1-n2
                type: true_false
                text: "Emils Freundin Ida sagt: „Ketchup ist aus Tomaten.“ Stimmt das?"
                say: "Emils Freundin Ida sagt: Ketchup ist aus Tomaten. Stimmt das?"
                show: { object: ketchup }
                answer: true
              - id: l1-n3
                type: sorting
                text: "Emil packt den Picknickkorb aus. Von der Pflanze oder vom Tier?"
                say: "Emil packt den Picknickkorb aus. Sortiere. Was kommt von einer Pflanze, was von einem Tier?"
                bins:
                  - { id: pflanze, show: { text: "von einer Pflanze" }, say: "von einer Pflanze" }
                  - { id: tier, show: { text: "von einem Tier" }, say: "von einem Tier" }
                options:
                  - { object: juice, bin: pflanze }
                  - { object: honeycomb, bin: tier }
                  - { object: strawberry, bin: pflanze }
                  - { object: milk, bin: tier }
              - id: l1-n4
                type: multiple_choice
                text: "Im Supermarkt fragt Emil: „Woraus ist das Mehl?“"
                say: "Im Supermarkt fragt Emil: Woraus ist das Mehl?"
                show: { object: flour }
                options: ["aus gemahlenen Weizenkörnern", "aus Kreide", "aus Wolken"]
                answer: "aus gemahlenen Weizenkörnern"
              - id: l1-n5
                type: multiple_choice
                text: "Papa macht Pommes. Was braucht er dafür?"
                say: "Papa macht Pommes. Was braucht er dafür?"
                show: { object: chips }
                options: ["Kartoffeln", "Äpfel", "Eier"]
                answer: "Kartoffeln"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was kommt von einem Tier?"
            say: "Was kommt von einem Tier?"
            options: [{ object: egg }, { object: apple }, { object: bread }]
            answer: egg
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Mehl ist gemahlenes Getreide."
            say: "Stimmt das? Mehl ist gemahlenes Getreide."
            show: { object: flour }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Woraus macht man Ketchup?"
            say: "Woraus macht man Ketchup?"
            show: { object: ketchup }
            options: ["aus Tomaten", "aus Möhren", "aus Milch"]
            answer: "aus Tomaten"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Äpfel kommen von der Kuh."
            say: "Stimmt das? Äpfel kommen von der Kuh."
            show: { object: apple }
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was macht man aus Milch?"
            say: "Was macht man aus Milch?"
            show: { object: milk }
            options: ["Käse", "Brot", "Saft"]
            answer: "Käse"
          - id: l1-c6
            type: fill_in_blank
            text: "Woraus sind Nudeln?"
            say: "Setz das passende Wort ein."
            show: { object: pasta }
            frame: "Nudeln macht man aus _."
            options: ["Weizen", "Honig", "Wolle"]
            answer: ["Weizen"]

  - n: 2
    title: { de: "Aus der Nähe und zur richtigen Zeit", en: "From nearby and at the right time" }
    goal:
      de: "Finde heraus, was regional und saisonal heißt. Erdbeeren wachsen bei uns zum Beispiel im Sommer, nicht im Winter."
      en: "Find out what local and seasonal mean. Here, for example, strawberries grow in summer, not in winter."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Woraus backt man Brot?"
            say: "Woraus backt man Brot?"
            show: { object: bread }
            options: ["aus Mehl von Getreide", "aus Käse", "aus Honig"]
            answer: "aus Mehl von Getreide"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Käse kommt von einer Pflanze."
            say: "Stimmt das? Käse kommt von einer Pflanze."
            show: { object: cheese }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Warum gibt es keine Erdbeeren?"
            say: "Im Dezember geht Emil mit Papa auf den Wochenmarkt. Am Stand von Frau Yilmaz sucht er Erdbeeren, aber es gibt keine. Was glaubst du: Warum nicht?"
            show: { object: strawberry }
          - text: "Erdbeeren reifen bei uns im Sommer."
            say: "Frau Yilmaz lacht: Bei uns reifen die Erdbeeren draußen erst im Sommer. Im Winter ist es zu kalt. Erdbeeren im Winter kommen von weit her oder aus geheizten Gewächshäusern. Ich verkaufe, was gerade hier reif ist. Das heißt saisonal: Obst und Gemüse zu der Jahreszeit, in der es bei uns reif wird."
            show: { objects: [strawberry, sun] }
          - text: "Jede Jahreszeit hat ihr Obst und Gemüse."
            say: "Im Frühling gibt es Spargel. Im Sommer Erdbeeren, Kirschen und Tomaten. Im Herbst Äpfel und Kürbisse. Und im Winter Kohl, Möhren, Kartoffeln und Äpfel aus dem kühlen Lager."
            show: { objects: [apple, carrot] }
          - text: "Regional heißt: aus der Nähe."
            say: "Die Möhren von Frau Yilmaz kommen von einem Hof ganz in der Nähe. Das heißt regional. Der Weg zum Markt ist kurz, und das Gemüse ist frisch."
            show: { objects: [carrot, farmer] }
          - text: "Bananen kommen von weit her."
            say: "Bananen, Orangen und Ananas brauchen das ganze Jahr Wärme. Darum wachsen sie bei uns nicht draußen. Sie kommen aus warmen Ländern weit weg, oft mit dem Schiff. Auch die Kakaobohnen für Schokolade kommen von dort."
            show: { objects: [banana, ship] }
          - text: "Regional und saisonal spart Energie."
            say: "Essen aus der Nähe muss nicht weit fahren. Essen, das zur Jahreszeit passt, braucht kein geheiztes Gewächshaus. Das spart Energie und schont die Umwelt. Eine Banane darfst du natürlich trotzdem essen."
            show: { object: lorry }
          - text: "Wusstest du? Bananen werden grün geerntet."
            say: "Wusstest du? Bananen werden grün geerntet. Sie reisen grün über das Meer. Erst bei uns werden sie in besonderen warmen Räumen gelb."
            show: { object: banana }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Was heißt saisonal?"
                say: "Was heißt saisonal?"
                options: ["Obst und Gemüse zu der Jahreszeit, in der es bei uns reif wird", "Obst, das man nur im Supermarkt kauft", "Gemüse, das immer gleich schmeckt"]
                answer: "Obst und Gemüse zu der Jahreszeit, in der es bei uns reif wird"
                hints:
                  - "Saison ist ein anderes Wort für eine Zeit im Jahr."
                  - "Frau Yilmaz verkauft im Dezember keine Erdbeeren. Warum?"
                  - "Saisonal heißt: zu der Jahreszeit, in der es bei uns reif wird."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Wächst das bei uns, oder kommt es von weit her?"
                say: "Sortiere. Was wächst bei uns, was kommt von weit her?"
                bins:
                  - { id: hier, show: { text: "wächst bei uns" }, say: "wächst bei uns" }
                  - { id: weit, show: { object: ship }, say: "kommt von weit her" }
                options:
                  - { object: apple, bin: hier }
                  - { object: banana, bin: weit }
                  - { object: carrot, bin: hier }
                  - { object: pineapple, bin: weit }
                hints:
                  - "Was braucht das ganze Jahr Wärme?"
                  - "Bananen und Ananas wachsen in warmen Ländern. Äpfel und Möhren wachsen bei uns."
                  - "Apfel und Möhre wachsen bei uns, Banane und Ananas kommen mit dem Schiff."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Bei uns wachsen im Dezember Erdbeeren draußen auf dem Feld."
                say: "Stimmt das? Bei uns wachsen im Dezember Erdbeeren draußen auf dem Feld."
                show: { object: snow }
                answer: false
                hints:
                  - "Wie ist das Wetter im Dezember?"
                  - "Im Winter ist es bei uns zu kalt für Erdbeeren."
                  - "Nein. Erdbeeren reifen bei uns im Sommer."
              - id: l2-f4
                type: image_multiple_choice
                text: "Was wächst bei uns in Deutschland draußen?"
                say: "Was wächst bei uns in Deutschland draußen?"
                options: [{ object: apple }, { object: banana }, { object: pineapple }]
                answer: apple
                feedback:
                  pineapple: "Eine Ananas braucht das ganze Jahr Wärme. Bei uns wachsen draußen Äpfel."
                hints:
                  - "Zwei davon brauchen das ganze Jahr Wärme."
                  - "Banane und Ananas kommen mit dem Schiff aus warmen Ländern."
                  - "Der Apfel wächst bei uns."
              - id: l2-f5
                type: matching
                text: "Was gibt es wann?"
                say: "Verbinde jede Jahreszeit mit dem, was dann bei uns reif ist."
                pairs:
                  - { left: { text: "Frühling" }, right: { object: asparagus } }
                  - { left: { text: "Sommer" }, right: { object: strawberry } }
                  - { left: { text: "Herbst" }, right: { object: apple } }
                  - { left: { text: "Winter" }, right: { object: cabbage } }
                hints:
                  - "Fang mit den Erdbeeren an."
                  - "Erdbeeren im Sommer. Äpfel erntet man, wenn die Blätter bunt werden."
                  - "Frühling und Spargel, Sommer und Erdbeeren, Herbst und Äpfel, Winter und Kohl."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was heißt regional?"
                say: "Was heißt regional?"
                options: ["aus der Nähe", "aus einem fernen Land", "aus dem Kühlschrank"]
                answer: "aus der Nähe"
                hints: ["Denk an die Möhren vom Hof nebenan."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Bananen kommen oft mit dem Schiff zu uns."
                say: "Stimmt das? Bananen kommen oft mit dem Schiff zu uns."
                show: { object: banana }
                answer: true
                hints: ["Bananen wachsen in warmen Ländern weit weg, hinter dem Meer."]
              - id: l2-s3
                type: fill_in_blank
                text: "Wann ist was reif?"
                say: "Setz die passenden Wörter ein."
                frame: "Erdbeeren gibt es bei uns im _. Äpfel erntet man im _."
                options: ["Sommer", "Herbst", "Winter"]
                answer: ["Sommer", "Herbst"]
                hints: ["Im Winter ist es für beide zu kalt."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Womit kommen Bananen meist zu uns?"
                say: "Womit kommen Bananen meist zu uns?"
                options: [{ object: ship }, { object: bike }, { object: horse }]
                answer: ship
                hints: ["Sie kommen von weit her, über das Meer."]
              - id: l2-s5
                type: multiple_choice
                text: "Warum ist regionales Essen gut für die Umwelt?"
                say: "Warum ist regionales Essen gut für die Umwelt?"
                options: ["Es hat nur einen kurzen Weg.", "Es ist bunter.", "Es ist immer billiger."]
                answer: "Es hat nur einen kurzen Weg."
                hints: ["Ein langer Weg mit Lastwagen oder Schiff braucht viel Energie."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Im Januar will Emil Obst aus der Region kaufen. Was nimmt er?"
                say: "Im Januar will Emil Obst aus der Region kaufen. Was nimmt er?"
                options: ["Äpfel aus dem Lager", "frische Erdbeeren vom Feld", "Bananen"]
                answer: "Äpfel aus dem Lager"
              - id: l2-n2
                type: true_false
                text: "Frau Yilmaz sagt: „Meine Möhren kommen vom Hof nebenan. Sie sind regional.“ Stimmt das?"
                say: "Frau Yilmaz sagt: Meine Möhren kommen vom Hof nebenan. Sie sind regional. Stimmt das?"
                answer: true
              - id: l2-n3
                type: sorting
                text: "Emil malt einen Erntekalender. Sommer oder Herbst?"
                say: "Emil malt einen Erntekalender. Sortiere. Was ist bei uns im Sommer reif, was im Herbst?"
                bins:
                  - { id: sommer, show: { text: "Sommer" }, say: "Sommer" }
                  - { id: herbst, show: { text: "Herbst" }, say: "Herbst" }
                options:
                  - { object: strawberry, bin: sommer }
                  - { object: pumpkin, bin: herbst }
                  - { object: cherries, bin: sommer }
                  - { object: apple, bin: herbst }
              - id: l2-n4
                type: multiple_choice
                text: "Ida backt im Oktober einen Kuchen. Er soll gut für die Umwelt sein. Was nimmt sie?"
                say: "Ida backt im Oktober einen Kuchen. Er soll gut für die Umwelt sein. Was nimmt sie?"
                options: ["Äpfel vom Hof nebenan", "Erdbeeren aus einem fernen Land", "Ananas, die weit gereist ist"]
                answer: "Äpfel vom Hof nebenan"
