# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.air
skill: world.nature.air
curriculum: de-DE
language: de
title:
  de: Luft
  en: Air
summary: >
  Nele and her big brother Ben get ready for Nele's birthday and then fly
  a kite. Lesson 1 opens with an "empty" bottle: air is everywhere, cannot
  be seen but can be felt, and takes up space (a balloon gets bigger,
  bubbles rise from a bottle tipped under water, a tissue stays dry in a
  glass pushed into water, as a safe test at home). Lesson 2 shows that
  moving air has force: wind lifts the kite and pushes the sailing boat,
  air rushing out sends a balloon flying, and people use it in wind
  turbines, parachutes and tyres. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.materials-sort]
  also_practises: []
  vocabulary: { de: [Luft, Platz, Luftblase, Wind, Kraft, Segel, Windrad, Fallschirm, Luftpumpe] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: everywhere, what: { de: "wissen, dass Luft überall ist, auch in leeren Gefäßen, und dass man sie spürt, aber nicht sieht", en: "knowing that air is everywhere, in empty containers too, and can be felt but not seen" } }
    - { id: space, what: { de: "zeigen, dass Luft Platz braucht (Luftballon, Glas unter Wasser)", en: "showing that air takes up space (a balloon, a glass under water)" } }
    - { id: force, what: { de: "zeigen, dass bewegte Luft Kraft hat (Wind, Drachen, Segel)", en: "showing that moving air has force (wind, a kite, a sail)" } }
    - { id: uses, what: { de: "sagen, wo Menschen die Luft nutzen", en: saying where people make use of air } }
  misconceptions:
    - id: empty-is-nothing
      what: Thinks an empty bottle or glass has nothing in it
      addressed: lesson 1 Learn opens with the empty bottle; l1-f1, l1-s1, l1-n2, l1-c2; l2-w1, l2-c1 and l2-c5 in the skill check
    - id: air-takes-no-space
      what: Thinks air takes up no room, so water can go anywhere air is
      addressed: lesson 1 Learn with the balloon, the bubbles and the dry tissue; l1-s2, l1-s4, l1-n3, l1-n4, l1-c5, l1-c6; l2-c6 to l2-c10
    - id: air-too-light
      what: Thinks air is too light to push or move anything
      addressed: lesson 2 Learn opens with the kite and shows the sail and the balloon flying off; l2-f1, l2-f4, l2-s1, l2-n5; l2-c12 and l2-c14
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Luft braucht Platz", en: "Air takes up space" }
    goal:
      de: "Finde heraus, dass überall Luft ist und dass Luft Platz braucht. Pustest du Luft in einen Luftballon, wird er zum Beispiel dick."
      en: "Find out that air is everywhere and takes up space. When you blow air into a balloon, for example, it gets bigger."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was ist durchsichtig?"
            say: "Was ist durchsichtig? Man kann hindurchschauen."
            options: [{ object: glass }, { object: box }, { object: sock }]
            answer: glass
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist weich?"
            say: "Was ist weich?"
            options: ["ein Kissen", "ein Stein", "ein Löffel"]
            answer: "ein Kissen"
            feedback:
              "ein Stein": "Auf einem Stein schläft es sich nicht so gut! Ein Stein ist hart. Das Kissen ist weich."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ist die Flasche wirklich leer?"
            say: "Nele und ihr großer Bruder Ben bereiten Neles Geburtstag vor. Ben trinkt seine Wasserflasche aus und sagt: Jetzt ist sie leer. Was glaubst du: Ist wirklich gar nichts mehr in der Flasche?"
            show: { object: empty-bottle }
          - text: "In der leeren Flasche ist Luft."
            say: "In der Flasche ist Luft! Luft ist überall um uns herum. Sie ist auch in Flaschen, Gläsern und Kisten, die leer aussehen. Sehen kann man Luft nicht. Aber man kann sie spüren. Puste dir einmal auf die Hand!"
            show: { object: hand }
          - text: "Luft braucht Platz."
            say: "Nele pustet Luft in einen Luftballon. Der Ballon wird immer dicker. Die Luft braucht Platz, darum wird der Ballon größer. Lässt Nele die Luft wieder heraus, wird der Ballon klein."
            show: { object: balloon }
          - text: "Blubb! Luftblasen steigen auf."
            say: "Ben drückt die leere Flasche mit der Öffnung nach unten ins Spülbecken. Dann kippt er sie. Blubb, blubb! Luftblasen steigen auf. Die Luft geht hinaus, und das Wasser fließt hinein. Wo Luft ist, kann nicht gleichzeitig Wasser sein."
            show: { object: water }
          - text: "Probier's aus, mit einem Erwachsenen! Das trockene Taschentuch"
            say: "Probier's aus, mit einem Erwachsenen. Stopft ein Taschentuch fest unten in ein Glas. Dreht das Glas um und drückt es gerade nach unten in eine Schüssel mit Wasser. Sag vorher, was du glaubst: Wird das Taschentuch nass? Dann zieht das Glas gerade wieder heraus. Das Taschentuch bleibt trocken! Die Luft im Glas braucht Platz, darum kommt das Wasser nicht hinein."
            show: { object: glass }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist in einer leeren Flasche?"
                say: "Was ist in einer leeren Flasche?"
                show: { object: empty-bottle }
                options: ["Luft", "gar nichts", "Saft"]
                answer: "Luft"
                feedback:
                  "gar nichts": "Sie sieht leer aus, aber sie ist voll Luft. Luft kann man nur nicht sehen."
                hints:
                  - "Denk an Bens Flasche im Spülbecken. Was ist da herausgeblubbert?"
                  - "Luft ist überall, auch dort, wo es leer aussieht."
                  - "In der leeren Flasche ist Luft."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Man kann Luft sehen."
                say: "Stimmt das? Man kann Luft sehen."
                answer: false
                hints:
                  - "Schau dich im Zimmer um. Siehst du die Luft zwischen dir und der Wand?"
                  - "Die Luft ist da, aber sie ist unsichtbar. Du kannst sie spüren, wenn du pustest."
                  - "Nein. Luft kann man nicht sehen."
              - id: l1-f3
                type: image_multiple_choice
                text: "Nele pustet Luft hinein, und es wird dick. Was ist es?"
                say: "Nele pustet Luft hinein, und es wird dick. Was ist es?"
                options: [{ object: balloon }, { object: dice }, { object: book-open }]
                answer: balloon
                feedback:
                  dice: "Einen Würfel kann man nicht aufpusten, er ist fest. Der Luftballon wird dick."
                hints:
                  - "Was hängt man bei einem Geburtstag auf?"
                  - "Es ist aus dünnem Gummi und hat eine Schnur."
                  - "Der Luftballon wird dick, wenn Nele Luft hineinpustet."
              - id: l1-f4
                type: ordering
                text: "Was passiert mit dem Luftballon?"
                say: "Was passiert mit dem Luftballon? Leg die Karten in die richtige Reihenfolge."
                options: ["Der Ballon wird dick.", "Nele lässt die Luft heraus, der Ballon wird klein.", "Nele pustet in den Ballon."]
                slot_count: 3
                answer: ["Nele pustet in den Ballon.", "Der Ballon wird dick.", "Nele lässt die Luft heraus, der Ballon wird klein."]
                hints:
                  - "Am Anfang ist der Ballon schlapp und klein."
                  - "Erst muss Luft hinein, dann kann sie wieder heraus."
                  - "Pusten, dick werden, Luft heraus."
              - id: l1-f5
                type: fill_in_blank
                text: "Puste dir auf die Hand."
                say: "Puste dir auf die Hand. Setz das passende Wort ein."
                frame: "Ich kann die Luft auf meiner Hand _."
                options: ["spüren", "sehen", "schmecken"]
                answer: ["spüren"]
                hints:
                  - "Welcher Sinn merkt, dass etwas deine Haut berührt?"
                  - "Sehen kann man Luft nicht. Aber die Hand merkt etwas."
                  - "Du kannst die Luft spüren."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? In einem leeren Glas ist Luft."
                say: "Stimmt das? In einem leeren Glas ist Luft."
                show: { object: cup }
                answer: true
                hints: ["Wo überall ist Luft?"]
              - id: l1-s2
                type: multiple_choice
                text: "Ben kippt die leere Flasche unter Wasser. Was steigt auf?"
                say: "Ben kippt die leere Flasche unter Wasser. Was steigt auf?"
                show: { object: empty-bottle }
                options: ["Luftblasen", "kleine Steine", "Saft"]
                answer: "Luftblasen"
                hints: ["Was war vorher in der Flasche?"]
              - id: l1-s3
                type: matching
                text: "Was passiert dann?"
                say: "Verbinde. Was passiert dann?"
                pairs:
                  - { left: { text: "Nele pustet in den Ballon." }, right: { text: "Er wird dick." } }
                  - { left: { text: "Nele lässt die Luft heraus." }, right: { text: "Er wird klein." } }
                  - { left: { text: "Ben kippt die Flasche unter Wasser." }, right: { text: "Luftblasen steigen auf." } }
                hints: ["Kommt Luft hinein oder geht sie hinaus?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? Drückt man ein umgedrehtes Glas mit einem Taschentuch gerade ins Wasser, wird das Taschentuch nass."
                say: "Stimmt das? Drückt man ein umgedrehtes Glas mit einem Taschentuch gerade ins Wasser, wird das Taschentuch nass."
                show: { object: glass }
                answer: false
                hints: ["Was ist im Glas und braucht dort Platz?"]
              - id: l1-s5
                type: image_multiple_choice
                text: "Was wird größer, wenn man Luft hineinpustet?"
                say: "Was wird größer, wenn man Luft hineinpustet?"
                options: [{ object: beach-ball }, { object: stone }, { object: cup }]
                answer: beach-ball
                hints: ["Was nimmt man mit ins Schwimmbad und pustet es auf?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Nele hat einen schlappen Luftballon. Was muss sie tun, damit er dick wird?"
                say: "Nele hat einen schlappen Luftballon. Was muss sie tun, damit er dick wird?"
                options: ["Luft hineinpusten", "ihn in den Kühlschrank legen", "ihn anmalen"]
                answer: "Luft hineinpusten"
              - id: l1-n2
                type: true_false
                text: "Ben sagt: „Die Saftkanne ist leer. Da ist gar nichts mehr drin.“ Stimmt das?"
                say: "Ben sagt: Die Saftkanne ist leer. Da ist gar nichts mehr drin. Stimmt das?"
                show: { object: jug }
                answer: false
              - id: l1-n3
                type: ordering
                text: "Nele zeigt ihren Gästen den Trick mit dem trockenen Taschentuch. Was macht sie der Reihe nach?"
                say: "Nele zeigt ihren Gästen den Trick mit dem trockenen Taschentuch. Leg die Karten in die richtige Reihenfolge."
                options: ["Sie zieht das Glas heraus: Das Taschentuch ist trocken.", "Sie stopft ein Taschentuch in das Glas.", "Sie dreht das Glas um und drückt es gerade ins Wasser."]
                slot_count: 3
                answer: ["Sie stopft ein Taschentuch in das Glas.", "Sie dreht das Glas um und drückt es gerade ins Wasser.", "Sie zieht das Glas heraus: Das Taschentuch ist trocken."]
              - id: l1-n4
                type: fill_in_blank
                text: "Ein Gast fragt, warum das Taschentuch trocken bleibt. Nele erklärt es."
                say: "Ein Gast fragt, warum das Taschentuch trocken bleibt. Nele erklärt es. Setz die passenden Wörter ein."
                frame: "Im Glas ist _. Sie braucht _, darum kommt das Wasser nicht hinein."
                options: ["Luft", "Platz", "Saft"]
                answer: ["Luft", "Platz"]
              - id: l1-n5
                type: image_multiple_choice
                text: "Nele will noch etwas für die Party aufpusten. Was kann sie mit Luft aufpusten?"
                say: "Nele will noch etwas für die Party aufpusten. Was kann sie mit Luft aufpusten?"
                options: [{ object: beach-ball }, { object: cake }, { object: sticker }]
                answer: beach-ball
                feedback:
                  cake: "Einen Kuchen aufpusten? Dann fliegen nur die Krümel! Den Wasserball kann Nele aufpusten."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Stimmt das? Luft braucht Platz."
            say: "Stimmt das? Luft braucht Platz."
            answer: true
          - id: l1-c2
            type: multiple_choice
            text: "Was ist in einem Glas, das leer aussieht?"
            say: "Was ist in einem Glas, das leer aussieht?"
            options: ["Luft", "gar nichts", "Wasser"]
            answer: "Luft"
          - id: l1-c3
            type: image_multiple_choice
            text: "Was pustet man mit Luft auf?"
            say: "Was pustet man mit Luft auf?"
            options: [{ object: balloon }, { object: apple }, { object: book }]
            answer: balloon
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Luft kann man sehen, wie einen Ball."
            say: "Stimmt das? Luft kann man sehen, wie einen Ball."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Ben kippt eine leere Flasche unter Wasser. Was passiert?"
            say: "Ben kippt eine leere Flasche unter Wasser. Was passiert?"
            show: { object: empty-bottle }
            options: ["Luftblasen steigen auf.", "Die Flasche wird heiß.", "Gar nichts."]
            answer: "Luftblasen steigen auf."
          - id: l1-c6
            type: fill_in_blank
            text: "Warum wird der Ballon dick?"
            say: "Setz das passende Wort ein."
            frame: "Die Luft im Ballon braucht _, darum wird er dick."
            options: ["Platz", "Farbe", "Zeit"]
            answer: ["Platz"]

  - n: 2
    title: { de: "Luft hat Kraft", en: "Air can push" }
    goal:
      de: "Finde heraus, dass Luft Kraft hat, wenn sie sich bewegt. Der Wind trägt zum Beispiel einen Drachen hoch in den Himmel."
      en: "Find out that moving air can push. The wind, for example, carries a kite high into the sky."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Eine leere Flasche ist voll Luft."
            say: "Stimmt das? Eine leere Flasche ist voll Luft."
            show: { object: empty-bottle }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was wird dick, wenn man Luft hineinpustet?"
            say: "Was wird dick, wenn man Luft hineinpustet?"
            options: [{ object: balloon }, { object: spoon }, { object: cube }]
            answer: balloon
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Kann Luft einen Drachen hochheben?"
            say: "Nach dem Geburtstag gehen Nele und Ben mit ihrem neuen Drachen auf das Feld. Es ist windig. Was glaubst du: Kann Luft einen Drachen hoch in den Himmel heben?"
            show: { object: kite }
          - text: "Wind ist Luft, die sich bewegt."
            say: "Ja! Wind ist Luft, die sich bewegt. Der Wind drückt gegen den Drachen und trägt ihn hoch. Luft hat Kraft. Auch wenn du pustest, schiebst du Luft. Puste eine Feder an, und sie fliegt weg."
            show: { objects: [kite, wind] }
          - text: "Der Wind schiebt das Segelboot."
            say: "Am See sehen Nele und Ben ein Segelboot. Der Wind drückt gegen das Segel und schiebt das Boot über das Wasser. Bei Sturm ist der Wind so stark, dass er Äste abbricht und Regenschirme umklappt."
            show: { objects: [boat, umbrella] }
          - text: "Der offene Luftballon saust davon."
            say: "Nele bläst einen Luftballon auf und lässt ihn los, ohne ihn zuzubinden. Die Luft strömt hinten heraus und schiebt den Ballon. Er saust kreuz und quer durch die Luft!"
            show: { object: balloon }
          - text: "Menschen nutzen die Luft."
            say: "Menschen nutzen die Luft. Ein Windrad macht aus Wind Strom. Ein Fallschirm bremst mit Luft, damit man langsam landet. Und mit einer Luftpumpe pumpt Ben Luft in seine Fahrradreifen. Die Luft im Reifen trägt ihn und sein Fahrrad."
            show: { objects: [wind-turbine, parachute] }
          - text: "Wusstest du? Die Luft in den Reifen trägt ein ganzes Auto."
            say: "Wusstest du? Auch in Autoreifen ist Luft. Sie ist darin ganz fest zusammengedrückt. So kann die Luft ein ganzes schweres Auto tragen!"
            show: { object: car }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was kann der Wind hoch in den Himmel tragen?"
                say: "Was kann der Wind hoch in den Himmel tragen?"
                options: [{ object: kite }, { object: house }, { object: stone }]
                answer: kite
                feedback:
                  house: "Ein fliegendes Haus? Das wäre ein Abenteuer! Ein Haus ist viel zu schwer. Den Drachen trägt der Wind."
                hints:
                  - "Was haben Nele und Ben auf das Feld mitgenommen?"
                  - "Es ist leicht und hat eine lange Schnur."
                  - "Der Wind trägt den Drachen hoch."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Wind ist Luft, die sich bewegt."
                say: "Stimmt das? Wind ist Luft, die sich bewegt."
                show: { object: wind }
                answer: true
                hints:
                  - "Was spürst du im Gesicht, wenn es windig ist?"
                  - "Beim Pusten bewegst du Luft. Der Wind macht das draußen."
                  - "Ja. Wind ist bewegte Luft."
              - id: l2-f3
                type: sorting
                text: "Braucht es Wind?"
                say: "Sortiere. Was braucht Wind, was braucht keinen Wind?"
                bins:
                  - { id: wind, show: { object: wind }, say: "braucht Wind" }
                  - { id: ohne, show: { text: "braucht keinen Wind" }, say: "braucht keinen Wind" }
                options:
                  - { object: kite, bin: wind }
                  - { object: boat, bin: wind }
                  - { object: bike, bin: ohne }
                  - { object: wind-turbine, bin: wind }
                  - { object: car, bin: ohne }
                hints:
                  - "Frag bei jedem Ding: Wer schiebt es an?"
                  - "Fahrrad und Auto fahren auch, wenn es windstill ist."
                  - "Drachen, Segelboot und Windrad brauchen Wind."
              - id: l2-f4
                type: multiple_choice
                text: "Warum saust der offene Luftballon davon?"
                say: "Warum saust der offene Luftballon davon?"
                options: ["Die Luft strömt heraus und schiebt ihn.", "Er hat einen kleinen Motor.", "Er hat Angst."]
                answer: "Die Luft strömt heraus und schiebt ihn."
                feedback:
                  "Er hat Angst.": "Ein Luftballon hat keine Angst, er ist ja kein Tier! Die Luft strömt heraus und schiebt ihn."
                hints:
                  - "Was kommt hinten aus dem Ballon heraus?"
                  - "Die Luft hat Kraft, wenn sie sich bewegt."
                  - "Die ausströmende Luft schiebt den Ballon."
              - id: l2-f5
                type: fill_in_blank
                text: "Was zeigt das Segelboot?"
                say: "Der Wind schiebt das Segelboot. Setz das passende Wort ein."
                show: { object: boat }
                frame: "Bewegte Luft hat _."
                options: ["Kraft", "Farbe", "Hunger"]
                answer: ["Kraft"]
                hints:
                  - "Der Wind kann ein ganzes Boot schieben."
                  - "Wer etwas schieben kann, ist stark."
                  - "Bewegte Luft hat Kraft."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Luft ist so leicht, dass sie gar nichts bewegen kann."
                say: "Stimmt das? Luft ist so leicht, dass sie gar nichts bewegen kann."
                answer: false
                hints: ["Was macht der Wind mit dem Segelboot?"]
              - id: l2-s2
                type: matching
                text: "Wie nutzen Menschen die Luft?"
                say: "Verbinde. Wie nutzen Menschen die Luft?"
                pairs:
                  - { left: { object: wind-turbine }, right: { text: "macht Strom" } }
                  - { left: { object: parachute }, right: { text: "bremst beim Fallen" } }
                  - { left: { object: bicycle-pump }, right: { text: "füllt Reifen mit Luft" } }
                hints: ["Fang mit dem Windrad an. Was macht es aus dem Wind?"]
              - id: l2-s3
                type: multiple_choice
                text: "Was kann bei einem Sturm passieren?"
                say: "Was kann bei einem Sturm passieren?"
                show: { object: wind }
                options: ["Der Wind bricht Äste ab.", "Die Luft verschwindet.", "Die Bäume werden blau."]
                answer: "Der Wind bricht Äste ab."
                hints: ["Ein Sturm ist ein sehr starker Wind."]
              - id: l2-s4
                type: ordering
                text: "Der Luftballon saust davon. Was passiert der Reihe nach?"
                say: "Der Luftballon saust davon. Leg die Karten in die richtige Reihenfolge."
                options: ["Die Luft strömt heraus, der Ballon saust davon.", "Nele bläst den Ballon auf.", "Nele lässt ihn offen los."]
                slot_count: 3
                answer: ["Nele bläst den Ballon auf.", "Nele lässt ihn offen los.", "Die Luft strömt heraus, der Ballon saust davon."]
                hints: ["Zuerst muss Luft in den Ballon."]
              - id: l2-s5
                type: true_false
                text: "Stimmt das? Ein Windrad dreht sich, wenn der Wind weht."
                say: "Stimmt das? Ein Windrad dreht sich, wenn der Wind weht."
                show: { object: wind-turbine }
                answer: true
                hints: ["Wer schiebt die Flügel des Windrads an?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Plötzlich ist es auf dem Feld ganz windstill. Was passiert mit dem Drachen?"
                say: "Plötzlich ist es auf dem Feld ganz windstill. Was passiert mit dem Drachen?"
                show: { object: kite }
                options: ["Er sinkt nach unten.", "Er fliegt noch höher.", "Er fliegt allein nach Hause."]
                answer: "Er sinkt nach unten."
              - id: l2-n2
                type: image_multiple_choice
                text: "Ein Windstoß kommt. Was weht der Wind am leichtesten weg?"
                say: "Ein Windstoß kommt. Was weht der Wind am leichtesten weg?"
                options: [{ object: leaf }, { object: stone }, { object: bike }]
                answer: leaf
              - id: l2-n3
                type: true_false
                text: "Auf dem Heimweg klappt Neles Regenschirm im Sturm um. Stimmt das? Der Wind hat ihn umgedrückt."
                say: "Auf dem Heimweg klappt Neles Regenschirm im Sturm um. Stimmt das? Der Wind hat ihn umgedrückt."
                show: { object: umbrella }
                answer: true
              - id: l2-n4
                type: fill_in_blank
                text: "Ben pumpt zu Hause sein Fahrrad auf."
                say: "Ben pumpt zu Hause sein Fahrrad auf. Setz die passenden Wörter ein."
                show: { object: bicycle-pump }
                frame: "In meine Reifen kommt _. Sie trägt mich und mein _."
