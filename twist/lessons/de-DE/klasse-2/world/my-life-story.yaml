# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.my-life-story
skill: world.time.my-life-story
curriculum: de-DE
language: de
title:
  de: Meine Zeitleiste
  en: My timeline
summary: >
  Jule's class makes timelines of their lives. Lesson 1 orders events from
  long ago to today on a line, with what is longest ago on the left and
  today on the right, and reads a timeline marked in years of age (born,
  first steps at 1, Kindergarten at 3, school at 6). Every life story is
  different: Malik moved house at 4, Ben got a sister at 5, Pia came to
  her family at 2. Lesson 2 shows that every year takes the same space on
  the line, links age and year (born 2019, three years old in 2022) and
  how to find out about your early years: ask people who knew you then,
  look at photos or things from back then, or draw a picture when there
  is no photo. No task assumes the child's own family, photos or
  Kindergarten; the events belong to story children. It ends with the
  skill check. The timeline is shown with the number line until a
  timeline drawing exists.
metadata:
  year: klasse-2
  topic: { de: Früher und heute, en: Then and now }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.time.months-seasons, math.time.calendar]
  also_practises: []
  vocabulary: { de: [Zeitleiste, Lebensgeschichte, früher, heute, Jahr, Jahreszahl, Alter, Geburt, Erinnerung] }
  forms: [text, audio, picture, drawn]
  drawn: [number-line]
  sounds: []
  facets: []
  parts:
    - { id: order, what: { de: "Ereignisse von früher bis heute ordnen", en: "putting events in order from long ago to today" } }
    - { id: read, what: { de: "eine Zeitleiste lesen: was früher und was später war", en: "reading a timeline: what came earlier and what came later" } }
    - { id: years, what: { de: "Alter und Jahreszahl verbinden; jedes Jahr ist gleich lang", en: "linking age and year; every year takes the same space" } }
    - { id: sources, what: { de: "sagen, wie man etwas über die eigene Lebensgeschichte herausfindet", en: "saying how to find out about your own life story" } }
  misconceptions:
    - id: today-on-the-left
      what: Puts today at the start of the timeline, or reads it from right to left
      addressed: "lesson 1 Learn says the longest ago is on the left and today on the right; l1-f2, l1-f3, l1-s4, l1-c1, l1-c6, l2-w1, l2-w2 and l2-c5"
    - id: uneven-years
      what: Spaces events as they come, not by the years between them
      addressed: "lesson 2 Learn opens with Noah's squeezed cards and says every year is equally long; l2-f1, l2-s4 and l2-c12"
    - id: one-story-for-all
      what: Thinks every timeline must have the same events (baby photo, Kindergarten, one family from birth)
      addressed: "lesson 1 Learn shows Malik, Ben and Pia; lesson 2 Learn says not every child has photos; l1-s2, l1-n3, l2-s2, l2-c16 and l2-c20"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Von früher bis heute", en: "From long ago to today" }
    goal:
      de: "Ordne, was in einem Leben passiert ist, auf einer Zeitleiste. Zuerst war Jule ein Baby, heute geht sie in die Schule."
      en: "Put what happened in a life in order on a timeline. First Jule was a baby, today she goes to school."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Monate hat ein Jahr?"
            say: "Wie viele Monate hat ein Jahr?"
            options: ["12", "7", "4"]
            answer: "12"
            feedback:
              "7": "7 Tage hat eine Woche. Ein Jahr hat 12 Monate."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Nach Dezember fängt ein neues Jahr an."
            say: "Stimmt das? Nach Dezember fängt ein neues Jahr an."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was war zuerst?"
            say: "Jules Klasse macht heute Zeitleisten. Jule hat drei Karten: Ich gehe in die Schule. Ich bin ein Baby. Ich gehe in den Kindergarten. Was glaubst du: Welche Karte kommt zuerst?"
            show: { objects: [baby, school] }
          - text: "Zuerst war Jule ein Baby."
            say: "Zuerst war Jule ein Baby. Dann ging sie in den Kindergarten. Heute geht sie in die Schule. Jeder Mensch war einmal ein Baby."
            show: { object: baby }
          - text: "Eine Zeitleiste: links früher, rechts heute"
            say: "Auf einer Zeitleiste ordnest du, was passiert ist. Sie ist eine lange Linie. Ganz links steht, was am längsten her ist. Ganz rechts steht heute. Auf Jules Zeitleiste stehen Zahlen. Sie sagen, wie alt Jule war."
            show: { drawn: number-line, from: 0, to: 7, labels: all }
          - text: "Geburt, 1 Jahr: erste Schritte, 3 Jahre: Kindergarten, 6 Jahre: Schule"
            say: "Bei der Null klebt Jule ihre Geburt hin. Mit 1 Jahr hat sie ihre ersten Schritte gemacht. Mit 3 Jahren kam sie in den Kindergarten. Mit 6 Jahren kam sie in die Schule. Heute ist sie 7 Jahre alt."
            show: { drawn: number-line, from: 0, to: 7, labels: all, mark: 6 }
          - text: "Jede Lebensgeschichte ist anders."
            say: "Jede Zeitleiste sieht anders aus, denn jedes Kind erlebt andere Dinge. Malik ist mit 4 Jahren in eine neue Stadt gezogen. Ben hat mit 5 Jahren eine kleine Schwester bekommen. Pia ist mit 2 Jahren in ihre Familie gekommen. Alles, was für dich wichtig ist, darf auf deine Zeitleiste."
            show: { object: child }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: ordering
                text: "Leg Jules Karten von früher bis heute."
                say: "Leg Jules Karten in die richtige Reihenfolge, von früher bis heute."
                options: ["Jule geht in die Schule.", "Jule ist ein Baby.", "Jule geht in den Kindergarten."]
                slot_count: 3
                answer: ["Jule ist ein Baby.", "Jule geht in den Kindergarten.", "Jule geht in die Schule."]
                hints:
                  - "Frag dich: Was ist am längsten her?"
                  - "Jeder Mensch war zuerst ein Baby."
                  - "Baby, dann Kindergarten, dann Schule."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo steht auf der Zeitleiste, was am längsten her ist?"
                say: "Wo steht auf der Zeitleiste, was am längsten her ist?"
                options: ["ganz links", "ganz rechts", "in der Mitte"]
                answer: "ganz links"
                hints:
                  - "Wo steht heute?"
                  - "Heute steht ganz rechts. Was lange her ist, steht auf der anderen Seite."
                  - "Ganz links."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Auf der Zeitleiste steht heute ganz rechts."
                say: "Stimmt das? Auf der Zeitleiste steht heute ganz rechts."
                answer: true
                hints:
                  - "Wo hat Jule ihre Geburt hingeklebt?"
                  - "Die Geburt steht bei der Null, ganz links."
                  - "Ja. Links ist früher, rechts ist heute."
              - id: l1-f4
                type: multiple_choice
                text: "Der Pfeil zeigt auf Jules Zeitleiste. Was ist da passiert?"
                say: "Der Pfeil zeigt auf Jules Zeitleiste. Was ist da passiert?"
                show: { drawn: number-line, from: 0, to: 7, labels: all, mark: 3 }
                options: ["Jule kommt in den Kindergarten.", "Jule kommt in die Schule.", "Jule wird geboren."]
                answer: "Jule kommt in den Kindergarten."
                hints:
                  - "Lies die Zahl unter dem Pfeil. So alt war Jule."
                  - "Der Pfeil zeigt auf die 3. Was hat Jule mit 3 Jahren gemacht?"
                  - "Mit 3 Jahren kam Jule in den Kindergarten."
              - id: l1-f5
                type: sorting
                text: "War das bei Jule früher, oder ist es heute?"
                say: "Sortiere. Was war bei Jule früher, was ist heute?"
                bins:
                  - { id: frueher, show: { text: "früher" }, say: "früher" }
                  - { id: heute, show: { text: "heute" }, say: "heute" }
                options:
                  - { text: "Jule trinkt aus der Babyflasche.", bin: frueher }
                  - { text: "Jule ist in Klasse 2.", bin: heute }
                  - { text: "Jule lernt laufen.", bin: frueher }
                  - { text: "Jule liest ein Buch.", bin: heute }
                hints:
                  - "Was macht ein Baby, was ein Schulkind?"
                  - "Laufen lernen und die Babyflasche gehören zum Baby."
                  - "Babyflasche und laufen lernen sind früher, Klasse 2 und lesen sind heute."

          - support: some
            tasks:
              - id: l1-s1
                type: ordering
                text: "Leg Jules vier Karten von früher bis heute."
                say: "Leg Jules vier Karten in die richtige Reihenfolge, von früher bis heute."
                options: ["Jule kommt in die Schule.", "Jule wird geboren.", "Jule kommt in den Kindergarten.", "Jule macht ihre ersten Schritte."]
                slot_count: 4
                answer: ["Jule wird geboren.", "Jule macht ihre ersten Schritte.", "Jule kommt in den Kindergarten.", "Jule kommt in die Schule."]
                hints: ["Mit 0, mit 1, mit 3 und mit 6 Jahren."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Alle Zeitleisten sehen gleich aus."
                say: "Stimmt das? Alle Zeitleisten sehen gleich aus."
                answer: false
                hints: ["Denk an Malik, Ben und Pia."]
              - id: l1-s3
                type: multiple_choice
                text: "Jule war mit 3 Jahren im Kindergarten und mit 6 Jahren in der Schule. Was steht weiter links?"
                say: "Jule war mit 3 Jahren im Kindergarten und mit 6 Jahren in der Schule. Was steht auf der Zeitleiste weiter links?"
                options: ["der Kindergarten", "die Schule"]
                answer: "der Kindergarten"
                hints: ["Was früher war, steht weiter links."]
              - id: l1-s4
                type: fill_in_blank
                text: "Was steht wo?"
                say: "Setz die passenden Wörter ein."
                frame: "Links auf der Zeitleiste steht _. Rechts steht _."
                options: ["früher", "heute", "nie"]
                answer: ["früher", "heute"]
                hints: ["Die Geburt steht ganz links."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Bild gehört ganz nach rechts auf Jules Zeitleiste, zu heute?"
                say: "Welches Bild gehört ganz nach rechts auf Jules Zeitleiste, zu heute?"
                options: [{ object: schoolbag }, { object: baby }]
                answer: schoolbag
                hints: ["Heute geht Jule in die Schule."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Malik ist mit 4 Jahren umgezogen und mit 6 Jahren in die Schule gekommen. Was steht auf seiner Zeitleiste weiter links?"
                say: "Malik ist mit 4 Jahren umgezogen und mit 6 Jahren in die Schule gekommen. Was steht auf seiner Zeitleiste weiter links?"
                options: ["der Umzug", "der Schulanfang"]
                answer: "der Umzug"
              - id: l1-n2
                type: ordering
                text: "Ben legt seine Zeitleiste."
                say: "Ben legt seine Zeitleiste. Leg die Karten in die richtige Reihenfolge, von früher bis heute."
                options: ["Mit 6 Jahren kommt Ben in die Schule.", "Ben wird geboren.", "Mit 5 Jahren bekommt Ben eine Schwester."]
                slot_count: 3
                answer: ["Ben wird geboren.", "Mit 5 Jahren bekommt Ben eine Schwester.", "Mit 6 Jahren kommt Ben in die Schule."]
              - id: l1-n3
                type: true_false
                text: "Pia ist mit 2 Jahren in ihre Familie gekommen. Darf das auf ihre Zeitleiste?"
                say: "Pia ist mit 2 Jahren in ihre Familie gekommen. Darf das auf ihre Zeitleiste?"
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Jule erzählt der Klasse von ihrer Zeitleiste."
                say: "Jule erzählt der Klasse von ihrer Zeitleiste. Setz die passenden Wörter ein."
                frame: "Zuerst war ich ein _. Heute gehe ich in die _."
                options: ["Baby", "Schule", "Oma"]
                answer: ["Baby", "Schule"]
              - id: l1-n5
                type: image_multiple_choice
                text: "Noah hat ein Babybild, ein Bild von seinem Fahrrad mit 5 Jahren und eins von seinem Schulranzen mit 6 Jahren. Welches klebt er ganz links hin?"
                say: "Noah hat ein Babybild, ein Bild von seinem Fahrrad mit 5 Jahren und eins von seinem Schulranzen mit 6 Jahren. Welches klebt er ganz links hin?"
                options: [{ object: bike }, { object: schoolbag }, { object: baby }]
                answer: baby

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was steht ganz links auf einer Zeitleiste?"
            say: "Was steht ganz links auf einer Zeitleiste?"
            options: ["was am längsten her ist", "was heute ist", "was morgen sein wird"]
            answer: "was am längsten her ist"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Auf einer Zeitleiste steht die Geburt ganz rechts."
            say: "Stimmt das? Auf einer Zeitleiste steht die Geburt ganz rechts."
            answer: false
          - id: l1-c3
            type: ordering
            text: "Leo legt seine Zeitleiste von früher bis heute."
            say: "Leo legt seine Zeitleiste. Leg die Karten in die richtige Reihenfolge, von früher bis heute."
            options: ["Leo geht in die Schule.", "Leo wird geboren.", "Leo lernt laufen."]
            slot_count: 3
            answer: ["Leo wird geboren.", "Leo lernt laufen.", "Leo geht in die Schule."]
          - id: l1-c4
            type: multiple_choice
            text: "Der Pfeil zeigt auf Jules Zeitleiste. Was ist da passiert?"
            say: "Der Pfeil zeigt auf Jules Zeitleiste. Was ist da passiert?"
            show: { drawn: number-line, from: 0, to: 7, labels: all, mark: 1 }
            options: ["Jule macht ihre ersten Schritte.", "Jule kommt in die Schule.", "Jule kommt in den Kindergarten."]
            answer: "Jule macht ihre ersten Schritte."
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Jedes Kind darf auf seine Zeitleiste kleben, was für es wichtig war."
            say: "Stimmt das? Jedes Kind darf auf seine Zeitleiste kleben, was für es wichtig war."
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Wo steht heute?"
            say: "Setz das passende Wort ein."
            frame: "Auf der Zeitleiste steht heute ganz _."
            options: ["rechts", "links", "unten"]
            answer: ["rechts"]

  - n: 2
    title: { de: "Jahr für Jahr", en: "Year by year" }
    goal:
      de: "Mach jedes Jahr auf der Zeitleiste gleich lang und finde heraus, was du über früher erfahren kannst. Jule ist 2019 geboren, 2022 war sie 3 Jahre alt."
      en: "Make every year on the timeline the same length and find out what you can learn about your early years. Jule was born in 2019, in 2022 she was 3."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo steht auf der Zeitleiste heute?"
            say: "Wo steht auf der Zeitleiste heute?"
            options: ["ganz rechts", "ganz links", "ganz oben"]
            answer: "ganz rechts"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Das Baby steht auf der Zeitleiste ganz rechts."
            say: "Stimmt das? Das Baby steht auf der Zeitleiste ganz rechts."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ist Noahs Zeitleiste richtig?"
            say: "Noah klebt seine Karten auf. Zwischen seiner Geburt und seinem Schulanfang mit 6 Jahren lässt er fast keinen Platz. Zwischen Schulanfang und heute lässt er ganz viel Platz. Was glaubst du: Ist das richtig so?"
            show: { object: ruler }
          - text: "Auf der Zeitleiste ist jedes Jahr gleich lang."
            say: "Nicht ganz! Auf einer Zeitleiste ist jedes Jahr gleich lang, wie die Abstände auf einem Lineal. Von der Geburt bis zum Schulanfang mit 6 Jahren sind es 6 gleich lange Stücke. Vom Schulanfang bis heute, mit 7 Jahren, ist es nur ein Stück."
            show: { drawn: number-line, from: 0, to: 8, labels: all }
          - text: "2019: geboren. 2020: 1 Jahr alt. 2022: 3 Jahre alt."
            say: "Jule wurde im Jahr 2019 geboren. Ein Jahr später, 2020, war sie 1 Jahr alt. 2022 war sie 3 Jahre alt. Mit jedem Jahr wird die Jahreszahl um eins größer, und Jule wird ein Jahr älter."
            show: { drawn: number-line, from: 2019, to: 2026, labels: all }
          - text: "Woher weißt du, was früher war?"
            say: "Woher weiß Jule, wann sie ihre ersten Schritte gemacht hat? Sie war ja noch so klein! Sie kann Menschen fragen, die sie damals kannten. Sie kann Fotos anschauen oder Dinge von damals, zum Beispiel ihre ersten kleinen Schuhe."
            show: { object: shoe }
          - text: "Kein Foto? Mal ein Bild!"
            say: "Nicht jedes Kind hat Fotos von früher. Das ist ganz normal. Dann kannst du ein Bild malen oder etwas aufschreiben. Und was du selbst noch weißt, gehört auch dazu, zum Beispiel dein erster Schultag."
            show: { object: crayon }
          - text: "Wusstest du? Ein neugeborenes Baby sieht nur ganz nah scharf."
            say: "Wusstest du? Ein neugeborenes Baby sieht nur ganz nah scharf, ungefähr so weit wie bis zum Gesicht von Mama oder Papa, wenn sie es im Arm halten. Erst nach und nach sieht es auch weit weg gut."
            show: { object: baby }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie lang ist jedes Jahr auf der Zeitleiste?"
                say: "Wie lang ist jedes Jahr auf der Zeitleiste?"
                options: ["immer gleich lang", "jedes Jahr länger", "ganz egal"]
                answer: "immer gleich lang"
                hints:
                  - "Denk an die Abstände auf einem Lineal."
                  - "Auf dem Lineal ist jeder Zentimeter gleich lang. So ist es auch mit den Jahren."
                  - "Jedes Jahr ist gleich lang."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Jule wurde 2019 geboren. Wie alt war sie?"
                say: "Jule wurde 2019 geboren. Setz die passenden Zahlen ein."
                frame: "2020 war Jule _ Jahr alt. 2022 war sie _ Jahre alt."
                options: ["1", "3", "5"]
                answer: ["1", "3"]
                hints:
                  - "Zähl von 2019 aus die Jahre weiter."
                  - "2019 bis 2020 ist ein Jahr. 2019 bis 2022 sind drei Jahre."
                  - "2020 war sie 1 Jahr alt, 2022 war sie 3."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Wenn du kein Foto von früher hast, kannst du ein Bild malen."
                say: "Stimmt das? Wenn du kein Foto von früher hast, kannst du ein Bild malen."
                answer: true
                hints:
                  - "Muss auf einer Zeitleiste ein Foto kleben?"
                  - "Nicht jedes Kind hat Fotos. Ein Bild oder ein Satz geht auch."
                  - "Ja. Ein gemaltes Bild ist genauso gut."
              - id: l2-f4
                type: sorting
                text: "Woher kann Jule erfahren, wie sie als Baby war?"
                say: "Sortiere. Was hilft Jule, etwas über ihre Babyzeit herauszufinden?"
                bins:
                  - { id: hilft, show: { text: "hilft" }, say: "hilft" }
                  - { id: nicht, show: { text: "hilft nicht" }, say: "hilft nicht" }
                options:
                  - { text: "ein Foto von damals", bin: hilft }
                  - { text: "jemanden fragen, der sie damals kannte", bin: hilft }
                  - { text: "der Wetterbericht von heute", bin: nicht }
                  - { text: "ihre ersten kleinen Schuhe", bin: hilft }
                hints:
                  - "Frag dich: Erzählt mir das etwas über früher?"
                  - "Der Wetterbericht ist von heute."
                  - "Foto, Fragen und die kleinen Schuhe helfen. Der Wetterbericht hilft nicht."
              - id: l2-f5
                type: ordering
                text: "Ordne die Jahre von früher bis heute."
                say: "Ordne die Jahreszahlen, von früher bis heute."
                options: ["2022", "2019", "2025", "2020"]
                slot_count: 4
                answer: ["2019", "2020", "2022", "2025"]
                hints:
                  - "Je kleiner die Jahreszahl, desto länger ist es her."
                  - "Alle Jahreszahlen fangen mit 20 an. Vergleich die letzten zwei Ziffern: 19 ist die kleinste."
                  - "2019, 2020, 2022, 2025."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Noah wurde 2018 geboren. In welchem Jahr war er 2 Jahre alt?"
                say: "Noah wurde 2018 geboren. In welchem Jahr war er 2 Jahre alt?"
                options: ["2020", "2016", "2019"]
                answer: "2020"
                hints: ["Jedes Jahr wird die Jahreszahl um eins größer. Zähl zwei Jahre weiter."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Jedes Kind hat Fotos von früher."
                say: "Stimmt das? Jedes Kind hat Fotos von früher."
                answer: false
                hints: ["Was kann ein Kind machen, das kein Foto hat?"]
              - id: l2-s3
                type: ordering
                text: "Noah legt seine Karten von früher bis heute."
                say: "Noah legt seine Karten. Leg sie in die richtige Reihenfolge, von früher bis heute."
                options: ["Mit 6 Jahren kommt Noah in die Schule.", "Mit 5 Jahren lernt Noah Rad fahren.", "Noah wird geboren."]
                slot_count: 3
                answer: ["Noah wird geboren.", "Mit 5 Jahren lernt Noah Rad fahren.", "Mit 6 Jahren kommt Noah in die Schule."]
                hints: ["Je kleiner das Alter, desto weiter vorne."]
              - id: l2-s4
                type: fill_in_blank
                text: "Was gilt für jedes Jahr?"
                say: "Setz das passende Wort ein."
                frame: "Auf der Zeitleiste ist jedes Jahr gleich _."
                options: ["lang", "bunt", "laut"]
                answer: ["lang"]
                hints: ["Denk an die Abstände auf dem Lineal."]
              - id: l2-s5
                type: image_multiple_choice
                text: "Jule hat kein Foto von ihrem ersten Schultag. Sie malt ein Bild. Was malt sie?"
                say: "Jule hat kein Foto von ihrem ersten Schultag. Sie malt ein Bild. Was malt sie?"
                options: [{ object: schoolbag }, { object: snowman }, { object: crown }]
                answer: schoolbag
                hints: ["Was hatte Jule am ersten Schultag auf dem Rücken?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Pia wurde 2019 geboren und kam 2021 in ihre Familie. Wie alt war sie da?"
                say: "Pia wurde 2019 geboren und kam 2021 in ihre Familie. Wie alt war sie da?"
                options: ["2 Jahre", "1 Jahr", "5 Jahre"]
                answer: "2 Jahre"
              - id: l2-n2
                type: true_false
                text: "Ben klebt seinen Schulanfang mit 6 Jahren links neben seine Geburt. Ist das richtig?"
                say: "Ben klebt seinen Schulanfang mit 6 Jahren links neben seine Geburt. Ist das richtig?"
                answer: false
              - id: l2-n3
                type: ordering
                text: "Malik ordnet seine Karten mit Jahreszahlen."
                say: "Malik ordnet seine Karten mit Jahreszahlen. Leg sie in die richtige Reihenfolge, von früher bis heute."
