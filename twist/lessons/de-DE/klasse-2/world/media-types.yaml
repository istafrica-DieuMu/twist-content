# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.media-types
skill: world.society.media-types
curriculum: de-DE
language: de
title:
  de: Medien und wofür wir sie nutzen
  en: Media and what we use them for
summary: >
  Finn is a media detective for a day and looks at what his family uses.
  Lesson 1 says what a medium is (something that brings us news,
  knowledge and stories, or passes them on), that a book is one just as
  much as a phone, and sorts media by how we take them in: read with the
  eyes (book, newspaper, letter), heard with the ears (radio, audiobook),
  seen and heard together (television, film, computer, tablet, phone).
  Lesson 2 asks what media are for: to find things out (a Sachbuch on
  hedgehogs, the news, the weather forecast), to have fun (a film, an
  Hörspiel, a game), and to keep in touch (telephone, letter, a message);
  one device such as a phone can do several of these. Finn picks the
  right medium for a task and takes a break after screen time; how long
  he may use a screen he agrees with his parents. It ends with the skill
  check. No brands or real programmes.
metadata:
  year: klasse-2
  topic: { de: Medien, en: Media }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: []
  vocabulary: { de: [Medium, Medien, Buch, Zeitung, Brief, Radio, Hörbuch, Hörspiel, Fernseher, Computer, Tablet, Telefon, Handy, Sachbuch, Wetterbericht, Nachrichten, informieren, unterhalten, Bildschirm, Pause] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: name, what: { de: "Medien erkennen und sagen, ob man sie liest, hört oder sieht und hört", en: "recognising media and saying whether we read them, hear them or see and hear them" } }
    - { id: use, what: { de: "sagen, wofür man Medien nutzt: sich informieren, Spaß haben, mit anderen in Kontakt bleiben", en: "saying what media are used for: finding things out, having fun, keeping in touch" } }
    - { id: choose, what: { de: "für eine Aufgabe das passende Medium wählen und an Pausen vom Bildschirm denken", en: "choosing the right medium for a task and remembering breaks from the screen" } }
  misconceptions:
    - id: only-screens
      what: Thinks only devices with a screen are media, not a book, a newspaper or a letter
      addressed: lesson 1 Learn opens with the guess whether a book is a medium; l1-f1, l1-f3, l1-s2, l1-s3 and l1-c4; l2-c1, l2-c2, l2-c5 and l2-c7 in the skill check
    - id: one-use-each
      what: Thinks each medium has only one use (a phone is only for phoning)
      addressed: lesson 2 Learn shows what a phone can do; l2-f3, l2-f5; l2-c9 and l2-c13 in the skill check
    - id: screen-time-no-matter
      what: Thinks it does not matter how long one sits at a screen
      addressed: lesson 2 Learn says a break does good and screen time is agreed with the parents; l2-s2, l2-n2; l2-c17 and l2-c18 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Lesen, hören, sehen", en: "Reading, hearing, watching" }
    goal:
      de: "Finde heraus, was Medien sind. Manche liest du, manche hörst du, und manche siehst und hörst du, so wie einen Film."
      en: "Find out what media are. Some you read, some you hear, and some you see and hear, like a film."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Finn ist heute Medien-Detektiv. Ist ein Buch auch ein Medium?"
            say: "Finn ist heute Medien-Detektiv. Er will herausfinden, welche Medien seine Familie an einem Tag nutzt. Was glaubst du: Ist ein Buch auch ein Medium?"
            show: { object: book }
          - text: "Ja! Medien bringen uns Nachrichten, Wissen und Geschichten."
            say: "Ja! Medien sind Dinge, mit denen wir Nachrichten, Wissen und Geschichten bekommen oder weitergeben. Ein Buch ist ein Medium, genau wie die Zeitung, das Radio, der Fernseher, das Telefon und der Computer."
            show: { objects: [book, telephone] }
          - text: "Manche Medien liest man: Buch, Zeitung, Brief."
            say: "Am Morgen liest Papa die Zeitung. Finn liest einen Brief von Oma. Buch, Zeitung und Brief liest man mit den Augen."
            show: { objects: [book-open, eye] }
          - text: "Manche Medien hört man: Radio, Hörbuch."
            say: "Im Auto hört Mama Radio. Abends hört Finn ein Hörbuch zum Einschlafen. Radio und Hörbuch hört man mit den Ohren."
            show: { object: ear }
          - text: "Manche Medien sieht und hört man zugleich: Fernseher, Computer, Tablet, Handy."
            say: "Beim Fernsehen sieht und hört man zugleich, zum Beispiel einen Film. Auch am Computer, am Tablet und am Handy kann man sehen und hören."
            show: { object: mobile-phone }
          - text: "Wusstest du? Früher hat man Bücher mit der Hand abgeschrieben."
            say: "Wusstest du? Früher haben Menschen in Europa Bücher meistens mit der Hand abgeschrieben. Vor mehr als 550 Jahren baute Johannes Gutenberg in Mainz eine Druckmaschine. Damit konnte man viele Bücher viel schneller herstellen."
            show: { object: book-open }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Ding ist ein Medium?"
                say: "Welches Ding ist ein Medium?"
                options: [{ object: book }, { object: spoon }, { object: shoe }]
                answer: book
                feedback:
                  spoon: "Ein Löffel bringt dir Suppe, aber keine Geschichten. Das Buch ist ein Medium."
                hints:
                  - "Ein Medium bringt dir Nachrichten, Wissen oder Geschichten."
                  - "Mit Löffel und Schuh erfährst du nichts Neues."
                  - "Das Buch ist ein Medium."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Liest oder hörst du das?"
                say: "Sortiere. Welche Medien liest du, welche hörst du?"
                bins:
                  - { id: lesen, show: { object: eye }, say: "lesen" }
                  - { id: hoeren, show: { object: ear }, say: "hören" }
                options:
                  - { text: "Zeitung", bin: lesen }
                  - { text: "Radio", bin: hoeren }
                  - { text: "Brief", bin: lesen }
                  - { text: "Hörbuch", bin: hoeren }
                hints:
                  - "Frag dich bei jeder Karte: Brauche ich die Augen oder die Ohren?"
                  - "In einem Hörbuch steckt schon das Wort hören."
                  - "Zeitung und Brief liest man, Radio und Hörbuch hört man."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Nur Dinge mit Bildschirm sind Medien."
                say: "Stimmt das? Nur Dinge mit Bildschirm sind Medien."
                answer: false
                hints:
                  - "Hat ein Buch einen Bildschirm?"
                  - "Auch Buch, Zeitung und Brief bringen uns Nachrichten und Geschichten."
                  - "Nein. Auch ein Buch ist ein Medium."
              - id: l1-f4
                type: multiple_choice
                text: "Womit sieht und hört man zugleich?"
                say: "Womit sieht und hört man zugleich?"
                options: ["mit dem Fernseher", "mit der Zeitung", "mit dem Radio"]
                answer: "mit dem Fernseher"
                hints:
                  - "Bei diesem Medium brauchst du Augen und Ohren."
                  - "Die Zeitung liest man nur. Das Radio hört man nur."
                  - "Mit dem Fernseher."
              - id: l1-f5
                type: fill_in_blank
                text: "Zeitung und Radio"
                say: "Setz die passenden Wörter ein."
                frame: "Die Zeitung _ man. Das Radio _ man."
                options: ["liest", "hört", "isst"]
                answer: ["liest", "hört"]
                hints:
                  - "Eine Zeitung ist aus Papier mit Buchstaben."
                  - "Aus dem Radio kommen Stimmen und Musik."
                  - "Die Zeitung liest man, das Radio hört man."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Mit welchem Medium kann Finn Oma hören?"
                say: "Mit welchem Medium kann Finn Oma hören?"
                options: [{ object: telephone }, { object: book-open }, { object: crayon }]
                answer: telephone
                hints: ["Oma ist weit weg, aber Finn will ihre Stimme hören."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Ein Brief ist ein Medium."
                say: "Stimmt das? Ein Brief ist ein Medium."
                answer: true
                hints: ["Ein Brief bringt dir eine Nachricht."]
              - id: l1-s3
                type: sorting
                text: "Medium oder kein Medium?"
                say: "Sortiere. Was ist ein Medium, was nicht?"
                bins:
                  - { id: medium, show: { text: "Medium" }, say: "Medium" }
                  - { id: kein, show: { text: "kein Medium" }, say: "kein Medium" }
                options:
                  - { object: book, bin: medium }
                  - { object: apple, bin: kein }
                  - { object: mobile-phone, bin: medium }
                  - { object: chair, bin: kein }
                hints: ["Was bringt dir Nachrichten oder Geschichten?"]
              - id: l1-s4
                type: multiple_choice
                text: "Was ist kein Medium?"
                say: "Was ist kein Medium?"
                options: ["ein Kissen", "eine Zeitung", "ein Radio"]
                answer: "ein Kissen"
                hints: ["Von einem davon erfährst du nichts Neues."]
              - id: l1-s5
                type: fill_in_blank
                text: "Augen und Ohren"
                say: "Setz die passenden Wörter ein."
                frame: "Ein Hörbuch hört man mit den _. Ein Buch liest man mit den _."
                options: ["Ohren", "Augen", "Füßen"]
                answer: ["Ohren", "Augen"]
                hints: ["Zum Hören und zum Lesen brauchst du verschiedene Sinne."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Am Frühstückstisch liest Papa, was in der Stadt passiert ist. Welches Medium hält er in der Hand?"
                say: "Am Frühstückstisch liest Papa, was in der Stadt passiert ist. Welches Medium hält er in der Hand?"
                options: ["die Zeitung", "das Radio", "das Hörbuch"]
                answer: "die Zeitung"
              - id: l1-n2
                type: sorting
                text: "Finns Liste: Was hat seine Familie heute gelesen, gehört oder gesehen und gehört?"
                say: "Finn schreibt eine Liste. Was hat seine Familie heute gelesen, was gehört, und was gesehen und gehört? Sortiere."
                bins:
                  - { id: lesen, show: { text: "gelesen" }, say: "gelesen" }
                  - { id: hoeren, show: { text: "gehört" }, say: "gehört" }
                  - { id: beides, show: { text: "gesehen und gehört" }, say: "gesehen und gehört" }
                options:
                  - { text: "der Brief von Oma", bin: lesen }
                  - { text: "das Radio im Auto", bin: hoeren }
                  - { text: "der Film am Abend", bin: beides }
                  - { text: "das Hörbuch zum Einschlafen", bin: hoeren }
              - id: l1-n3
                type: true_false
                text: "Oma ruft an, und Finn spricht mit ihr. Ist das Telefon ein Medium?"
                say: "Oma ruft an, und Finn spricht mit ihr. Ist das Telefon ein Medium?"
                show: { object: telephone }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Finn will vor dem Schlafen selbst eine Geschichte lesen. Was nimmt er?"
                say: "Finn will vor dem Schlafen selbst eine Geschichte lesen. Was nimmt er?"
                options: [{ object: book }, { object: telephone }, { object: spoon }]
                answer: book
              - id: l1-n5
                type: multiple_choice
                text: "Mama hört im Auto, wie das Wetter wird. Welches Medium ist an?"
                say: "Mama hört im Auto, wie das Wetter wird. Welches Medium ist an?"
                options: ["das Radio", "die Zeitung", "ein Brief"]
                answer: "das Radio"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Ding ist ein Medium?"
            say: "Welches Ding ist ein Medium?"
            options: [{ object: mobile-phone }, { object: shoe }, { object: apple }]
            answer: mobile-phone
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Radio hört man mit den Ohren."
            say: "Stimmt das? Ein Radio hört man mit den Ohren."
            show: { object: ear }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was liest man?"
            say: "Was liest man?"
            options: ["eine Zeitung", "ein Hörbuch", "das Radio"]
            answer: "eine Zeitung"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Ein Buch ist kein Medium."
            say: "Stimmt das? Ein Buch ist kein Medium."
            show: { object: book }
            answer: false
          - id: l1-c5
            type: sorting
            text: "Hören oder lesen?"
            say: "Sortiere. Was hört man, was liest man?"
            bins:
              - { id: hoeren, show: { object: ear }, say: "hören" }
              - { id: lesen, show: { object: eye }, say: "lesen" }
            options:
              - { text: "Hörspiel", bin: hoeren }
              - { text: "Buch", bin: lesen }
              - { text: "Radio", bin: hoeren }
              - { text: "Brief", bin: lesen }
          - id: l1-c6
            type: multiple_choice
            text: "Wobei sieht und hört man zugleich?"
            say: "Wobei sieht und hört man zugleich?"
            options: ["bei einem Film", "bei einem Brief", "bei einem Buch"]
            answer: "bei einem Film"

  - n: 2
    title: { de: "Wofür nutzen wir Medien?", en: "What do we use media for?" }
    goal:
      de: "Finde heraus, wofür wir Medien nutzen: um Neues zu erfahren, um Spaß zu haben und um mit anderen in Kontakt zu bleiben. Such dir für jede Aufgabe das passende Medium aus."
      en: "Find out what we use media for: to learn something new, to have fun and to keep in touch with others. Pick the right medium for each job."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Medium hört man?"
            say: "Welches Medium hört man?"
            options: ["das Radio", "die Zeitung", "den Brief"]
            answer: "das Radio"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Eine Zeitung ist kein Medium."
            say: "Stimmt das? Eine Zeitung ist kein Medium."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Finn soll herausfinden, was Igel im Winter machen. Welches Medium hilft ihm?"
            say: "Finn soll für die Schule herausfinden, was Igel im Winter machen. Was glaubst du: Welches Medium hilft ihm dabei? Ein Sachbuch über Tiere, ein Märchenbuch oder das Telefon?"
            show: { object: hedgehog }
          - text: "Mit Medien informieren wir uns: Sachbuch, Nachrichten, Wetterbericht."
            say: "Im Sachbuch über Tiere findet Finn die Antwort: Igel halten einen Winterschlaf. Mit Medien informieren wir uns. Wir erfahren Neues aus einem Sachbuch, aus den Nachrichten oder aus dem Wetterbericht."
            show: { objects: [book, hedgehog] }
          - text: "Mit Medien haben wir Spaß: Film, Hörspiel, Spiel, Märchenbuch."
            say: "Am Abend schaut die Familie einen lustigen Film. Mit Medien unterhalten wir uns, wir haben also Spaß. Das geht mit Filmen, Hörspielen, Spielen und Märchenbüchern."
            show: { object: book-open }
          - text: "Mit Medien bleiben wir in Kontakt: Telefon, Brief, Nachricht."
            say: "Finn ruft Oma an und erzählt ihr vom Igel. Mit dem Telefon, mit einem Brief oder mit einer Nachricht auf dem Handy bleiben wir mit anderen in Kontakt."
            show: { object: telephone }
          - text: "Ein Handy kann vieles."
            say: "Manche Medien können vieles. Mit einem Handy kann man telefonieren, Nachrichten schreiben, Fotos machen, Musik hören und spielen."
            show: { object: mobile-phone }
          - text: "Nach dem Bildschirm: Pause!"
            say: "Finn denkt nach: Wie lange war ich heute am Bildschirm? Nach Fernseher, Tablet oder Handy tut eine Pause gut. Dann spielt Finn draußen Ball oder malt etwas. Wie lange er am Bildschirm sein darf, bespricht er mit seinen Eltern."
            show: { object: ball }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Wofür nutzt man das?"
                say: "Sortiere. Wofür nutzt man das: um sich zu informieren, um Spaß zu haben oder um mit anderen in Kontakt zu bleiben?"
                bins:
                  - { id: info, show: { text: "sich informieren" }, say: "sich informieren" }
                  - { id: spass, show: { text: "Spaß haben" }, say: "Spaß haben" }
                  - { id: kontakt, show: { text: "in Kontakt bleiben" }, say: "in Kontakt bleiben" }
                options:
                  - { text: "der Wetterbericht", bin: info }
                  - { text: "ein lustiger Film", bin: spass }
                  - { text: "ein Anruf bei Oma", bin: kontakt }
                  - { text: "ein Sachbuch über Vögel", bin: info }
                hints:
                  - "Frag dich bei jeder Karte: Erfahre ich etwas Neues, lache ich, oder spreche ich mit jemandem?"
                  - "Wetterbericht und Sachbuch erklären etwas. Mit Oma sprichst du."
                  - "Wetterbericht und Sachbuch zu informieren, der Film zu Spaß, der Anruf zu Kontakt."
              - id: l2-f2
                type: multiple_choice
                text: "Finn will wissen, ob es morgen regnet. Was hilft ihm?"
                say: "Finn will wissen, ob es morgen regnet. Was hilft ihm?"
                options: ["der Wetterbericht", "ein Märchenbuch", "ein Hörspiel über Piraten"]
                answer: "der Wetterbericht"
                feedback:
                  "ein Märchenbuch": "Im Märchenbuch regnet es vielleicht Gold, aber wie das Wetter morgen wird, steht da nicht. Der Wetterbericht hilft."
                hints:
                  - "Finn will sich informieren."
                  - "Märchen und Piraten sind zum Spaß."
                  - "Der Wetterbericht."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Mit einem Handy kann man nur telefonieren."
                say: "Stimmt das? Mit einem Handy kann man nur telefonieren."
                show: { object: mobile-phone }
                answer: false
                hints:
                  - "Was kann man mit einem Handy noch machen?"
                  - "Man kann damit auch Fotos machen und Musik hören."
                  - "Nein. Ein Handy kann vieles."
              - id: l2-f4
                type: matching
                text: "Welches Medium passt?"
                say: "Verbinde jede Aufgabe mit dem passenden Medium."
                pairs:
                  - { left: { text: "Ich will Oma etwas erzählen." }, right: { object: telephone } }
                  - { left: { text: "Ich will etwas über Igel lernen." }, right: { object: book } }
                  - { left: { text: "Ich will im Auto Musik hören." }, right: { text: "Radio" } }
                hints:
                  - "Fang mit der Aufgabe an, die du am leichtesten findest."
                  - "Mit Oma spricht man. Etwas Neues steht im Sachbuch."
                  - "Oma und Telefon, Igel und Buch, Musik im Auto und Radio."
              - id: l2-f5
                type: image_multiple_choice
                text: "Womit kann Finn seinem Freund schnell eine Nachricht schreiben?"
                say: "Womit kann Finn seinem Freund schnell eine Nachricht schreiben?"
                options: [{ object: mobile-phone }, { object: book }, { object: ball }]
                answer: mobile-phone
                hints:
                  - "Es soll schnell beim Freund ankommen."
                  - "In ein Buch schreibt man keine Nachrichten an Freunde."
                  - "Mit dem Handy."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Wozu hört man meistens ein Hörspiel?"
                say: "Wozu hört man meistens ein Hörspiel?"
                options: ["um Spaß zu haben", "um Oma anzurufen", "um zu erfahren, wie das Wetter wird"]
                answer: "um Spaß zu haben"
                hints: ["In einem Hörspiel wird eine Geschichte erzählt."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Nach langer Zeit am Bildschirm tut eine Pause gut."
                say: "Stimmt das? Nach langer Zeit am Bildschirm tut eine Pause gut."
                answer: true
                hints: ["Was macht Finn nach dem Bildschirm?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Wofür nutzt Finn die Medien?"
                say: "Setz die passenden Wörter ein."
                frame: "Mit dem Wetterbericht _ ich mich. Mit dem Telefon _ ich mit Oma."
                options: ["informiere", "spreche", "esse"]
                answer: ["informiere", "spreche"]
                hints: ["Beim Wetterbericht erfährst du etwas Neues."]
              - id: l2-s4
                type: sorting
                text: "Neues erfahren oder Spaß haben?"
                say: "Sortiere. Womit erfährst du etwas Neues, womit hast du Spaß?"
                bins:
                  - { id: info, show: { text: "Neues erfahren" }, say: "Neues erfahren" }
                  - { id: spass, show: { text: "Spaß haben" }, say: "Spaß haben" }
                options:
                  - { text: "die Nachrichten", bin: info }
                  - { text: "ein Zeichentrickfilm", bin: spass }
                  - { text: "ein Sachbuch über Vulkane", bin: info }
                  - { text: "ein Spiel auf dem Tablet", bin: spass }
                hints: ["Was erklärt etwas, und was erzählt eine lustige Geschichte?"]
              - id: l2-s5
                type: image_multiple_choice
                text: "Womit kann Lena ihre Oma anrufen?"
                say: "Womit kann Lena ihre Oma anrufen?"
                options: [{ object: telephone }, { object: book }, { object: crayon }]
                answer: telephone
                hints: ["Beim Anrufen hört man die Stimme des anderen."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Finn soll herausfinden, wie viele Beine eine Spinne hat. Welches Medium passt am besten?"
                say: "Finn soll herausfinden, wie viele Beine eine Spinne hat. Welches Medium passt am besten?"
                options: ["ein Sachbuch über Tiere", "ein Märchenbuch", "ein Hörspiel über Piraten"]
                answer: "ein Sachbuch über Tiere"
              - id: l2-n2
                type: true_false
                text: "Finn hat lange Filme geschaut. Jetzt sagt er: „Ich geh raus spielen.“ Ist das eine gute Idee?"
                say: "Finn hat lange Filme geschaut. Jetzt sagt er: Ich geh raus spielen. Ist das eine gute Idee?"
                answer: true
              - id: l2-n3
                type: sorting
                text: "Familie Becker am Sonntag. Wofür nutzen sie die Medien?"
                say: "Familie Becker am Sonntag. Wofür nutzen sie die Medien? Sortiere."
                bins:
                  - { id: info, show: { text: "sich informieren" }, say: "sich informieren" }
                  - { id: spass, show: { text: "Spaß haben" }, say: "Spaß haben" }
                  - { id: kontakt, show: { text: "in Kontakt bleiben" }, say: "in Kontakt bleiben" }
                options:
                  - { text: "Papa liest die Nachrichten.", bin: info }
                  - { text: "Mia schaut einen Zeichentrickfilm.", bin: spass }
                  - { text: "Mama schreibt Opa einen Brief.", bin: kontakt }
                  - { text: "Finn hört ein lustiges Hörspiel.", bin: spass }
              - id: l2-n4
                type: multiple_choice
                text: "Mia feiert Geburtstag. Ihre Freundin wohnt weit weg. Wie kann Mia sie einladen?"
                say: "Mia feiert Geburtstag. Ihre Freundin wohnt weit weg. Wie kann Mia sie einladen?"
                options: ["mit einem Brief oder einem Anruf", "mit dem Wetterbericht", "mit einem Sachbuch"]
                answer: "mit einem Brief oder einem Anruf"
              - id: l2-n5
                type: fill_in_blank
