# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.light-shadow
skill: world.nature.light-shadow
curriculum: de-DE
language: de
title:
  de: Licht und Schatten
  en: Light and shadow
summary: >
  Ben and his sister Lotta play shadow tag in the garden and shadow
  theatre in their room. Lesson 1 opens with the guess what a shadow
  needs: light and something in its way. Light goes straight on; behind
  the thing it cannot get through, so it is darker there. No light, no
  shadow. A shadow shows the outline but no colours, a clear glass lets
  most light through and makes only a faint shadow, and the shadow always
  lies on the side away from the light. Lesson 2 moves the light: when it
  moves, the shadow moves to the other side; a low sun (morning, evening)
  or a low lamp makes a long shadow, a high sun at midday a short one; a
  hand close to the lamp makes a big shadow on the wall, far away a small
  one. It offers shadow theatre with a torch at home with a grown-up and
  ends with the skill check. The real experiment stays in class. There is
  no drawing of a light, an object and its shadow yet, so the tasks
  describe the scene in words.
metadata:
  year: klasse-2
  topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: []
  vocabulary: { de: [Licht, Schatten, Lichtquelle, Umriss, durchsichtig, Taschenlampe, Schattentheater] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: forms, what: { de: "erklären, wie ein Schatten entsteht", en: explaining how a shadow forms } }
    - { id: side, what: { de: "sagen, auf welcher Seite der Schatten liegt und wohin er wandert", en: saying which side the shadow falls on and where it moves } }
    - { id: length, what: { de: "vorhersagen, wann ein Schatten lang und wann er kurz ist", en: predicting when a shadow is long and when it is short } }
    - { id: size, what: { de: "vorhersagen, wann ein Schatten an der Wand groß und wann er klein ist", en: predicting when a shadow on the wall is big and when it is small } }
  misconceptions:
    - id: shadow-is-thing
      what: Thinks a shadow is a thing of its own, a dark copy that is always there, even without light
      addressed: lesson 1 Learn says a shadow is the place the light cannot reach and that there is no shadow without light; l1-f3, l1-s2 and l1-n2; l2-c3 in the skill check
    - id: shadow-has-colours
      what: Thinks a shadow shows the colours and the face of the thing
      addressed: lesson 1 Learn says the shadow shows only the outline; l1-f4 and l1-n4; l2-c5 in the skill check
    - id: shadow-towards-light
      what: Thinks the shadow falls towards the light or on any side
      addressed: lesson 1 Learn says the shadow lies on the side away from the light; l1-f5, l1-s4 and l1-n3; lesson 2 moves the light, l2-f1 and l2-n1; l2-c6 to l2-c10 in the skill check
    - id: high-sun-long-shadow
      what: Thinks the shadow is longest when the sun is highest
      addressed: lesson 2 Learn compares morning and midday; l2-f2, l2-s2 and l2-n2; l2-c11 to l2-c15 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wie entsteht ein Schatten?", en: "How does a shadow form?" }
    goal:
      de: "Finde heraus, wie ein Schatten entsteht. Du brauchst Licht und etwas, das dem Licht im Weg steht."
      en: "Find out how a shadow forms. You need light and something that stands in its way."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was braucht man für einen Schatten?"
            say: "Ben und Lotta spielen im Garten Schattenfangen. Die Sonne scheint. Ben springt, und ein dunkler Ben springt auf dem Rasen mit. Was glaubst du: Was braucht man für einen Schatten?"
            show: { objects: [sun, boy] }
          - text: "Licht und etwas, das im Weg steht"
            say: "Man braucht Licht und etwas, das dem Licht im Weg steht. Das Licht der Sonne geht geradeaus. Ben steht im Weg. Hinter Ben kommt das Licht nicht an. Dort ist es dunkler. Das ist sein Schatten."
            show: { objects: [sun, boy] }
          - text: "Ohne Licht kein Schatten"
            say: "Am Abend macht Lotta im Kinderzimmer das Licht aus. Es ist ganz dunkel. Jetzt sieht sie keinen Schatten. Ohne Licht gibt es keinen Schatten. Macht sie die Lampe an, ist ihr Schatten wieder da."
            show: { object: lamp }
          - text: "Der Schatten zeigt nur den Umriss."
            say: "Ben hält seinen Teddy vor die Lampe. Der Schatten an der Wand hat die Form vom Teddy. Aber er ist nur dunkel. Er zeigt keine Farben und kein Gesicht, nur den Umriss."
            show: { objects: [teddy, lamp] }
          - text: "Durch Glas geht das Licht."
            say: "Jetzt hält Ben ein Buch vor die Lampe. Das Buch lässt kein Licht durch. Sein Schatten ist ganz dunkel. Dann ein Trinkglas. Das Glas ist durchsichtig und lässt das meiste Licht durch. Sein Schatten ist nur ganz blass."
            show: { objects: [book, glass] }
          - text: "Der Schatten liegt gegenüber vom Licht."
            say: "Die Lampe steht links vom Teddy. Der Schatten fällt nach rechts, auf die andere Seite. Der Schatten liegt immer auf der Seite, die vom Licht weg zeigt."
            show: { objects: [lamp, teddy] }
          - text: "Wusstest du? Licht ist unglaublich schnell."
            say: "Wusstest du? Licht ist das Schnellste, was es gibt. In einer einzigen Sekunde könnte das Licht mehr als siebenmal um die ganze Erde sausen."
            show: { object: light-bulb }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was braucht man für einen Schatten?"
                say: "Was braucht man für einen Schatten?"
                options: ["Licht und etwas, das im Weg steht", "nur Wasser", "nur Wind"]
                answer: "Licht und etwas, das im Weg steht"
                hints:
                  - "Denk an Ben im Garten. Was scheint auf ihn?"
                  - "Das Licht der Sonne kommt nicht durch Ben hindurch."
                  - "Man braucht Licht und etwas, das im Weg steht."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Was gibt Licht, damit ein Schatten entstehen kann?"
                say: "Was gibt Licht, damit ein Schatten entstehen kann?"
                options: [{ object: lamp }, { object: teddy }, { object: book }]
                answer: lamp
                hints:
                  - "Was kann man an- und ausmachen?"
                  - "Teddy und Buch leuchten nicht."
                  - "Die Lampe gibt Licht."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Im ganz dunklen Zimmer hat Lotta einen Schatten."
                say: "Stimmt das? Im ganz dunklen Zimmer hat Lotta einen Schatten."
                answer: false
                hints:
                  - "Was braucht man zuerst für einen Schatten?"
                  - "Im dunklen Zimmer gibt es kein Licht."
                  - "Nein. Ohne Licht gibt es keinen Schatten."
              - id: l1-f4
                type: multiple_choice
                text: "Ben hält seinen braunen Teddy mit roter Schleife vor die Lampe. Wie sieht der Schatten aus?"
                say: "Ben hält seinen braunen Teddy mit roter Schleife vor die Lampe. Wie sieht der Schatten aus?"
                show: { object: teddy }
                options: ["dunkel, mit der Form vom Teddy", "braun und rot wie der Teddy", "mit einem lachenden Gesicht"]
                answer: "dunkel, mit der Form vom Teddy"
                hints:
                  - "Zeigt ein Schatten Farben?"
                  - "Der Schatten ist dort, wo kein Licht hinkommt."
                  - "Der Schatten ist dunkel und hat nur die Form vom Teddy."
              - id: l1-f5
                type: multiple_choice
                text: "Die Lampe steht links vom Teddy. Wo ist der Schatten?"
                say: "Die Lampe steht links vom Teddy. Wo ist der Schatten?"
                show: { objects: [lamp, teddy] }
                options: ["rechts vom Teddy", "links vom Teddy", "auf der Lampe"]
                answer: "rechts vom Teddy"
                feedback:
                  "auf der Lampe": "Auf der Lampe ist es ganz hell. Der Schatten liegt auf der anderen Seite, rechts vom Teddy."
                hints:
                  - "Der Schatten liegt auf der Seite, die vom Licht weg zeigt."
                  - "Das Licht kommt von links. Wohin kommt es nicht?"
                  - "Der Schatten ist rechts vom Teddy."

          - support: some
            tasks:
              - id: l1-s1
                type: sorting
                text: "Gibt das Licht oder nicht?"
                say: "Sortiere: Was gibt Licht, was gibt kein Licht?"
                bins:
                  - { id: licht, show: { text: "gibt Licht" }, say: "gibt Licht" }
                  - { id: kein, show: { text: "gibt kein Licht" }, say: "gibt kein Licht" }
                options:
                  - { object: sun, bin: licht }
                  - { object: teddy, bin: kein }
                  - { object: candle, bin: licht }
                  - { object: stone, bin: kein }
                hints: ["Was leuchtet von selbst, was braucht Licht, um gesehen zu werden?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Ein Schatten ist dort, wo das Licht nicht hinkommt."
                say: "Stimmt das? Ein Schatten ist dort, wo das Licht nicht hinkommt."
                answer: true
                hints: ["Hinter Ben kommt das Licht der Sonne nicht an."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was macht vor der Lampe den dunkelsten Schatten?"
                say: "Was macht vor der Lampe den dunkelsten Schatten?"
                options: [{ object: book }, { object: glass }, { object: bottle }]
                answer: book
                hints: ["Durch welches Ding kommt gar kein Licht?"]
              - id: l1-s4
                type: multiple_choice
                text: "Die Sonne scheint Lotta von vorne ins Gesicht. Wo ist ihr Schatten?"
                say: "Die Sonne scheint Lotta von vorne ins Gesicht. Wo ist ihr Schatten?"
                show: { object: sun }
                options: ["hinter ihr", "vor ihr", "auf der Sonne"]
                answer: "hinter ihr"
                hints: ["Der Schatten liegt auf der Seite, die vom Licht weg zeigt."]
              - id: l1-s5
                type: fill_in_blank
                text: "Wie entsteht ein Schatten?"
                say: "Setz die passenden Wörter ein."
                frame: "Für einen Schatten braucht man _ und etwas, das im _ steht."
                options: ["Licht", "Weg", "Wasser"]
                answer: ["Licht", "Weg"]
                hints: ["Was scheint auf Ben, und wo steht Ben?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Ben will an der Wand einen Schatten machen. Was muss er dafür anschalten?"
                say: "Ben will an der Wand einen Schatten machen. Was muss er dafür anschalten?"
                options: [{ object: lamp }, { object: mobile-phone }, { object: kettle }]
                answer: lamp
                feedback:
                  kettle: "Der Wasserkocher macht Wasser heiß, aber kein Licht. Ben braucht die Lampe."
              - id: l1-n2
                type: true_false
                text: "Lotta sagt: „Mein Schatten ist immer bei mir, auch nachts im dunklen Zimmer.“ Stimmt das?"
                say: "Lotta sagt: Mein Schatten ist immer bei mir, auch nachts im dunklen Zimmer. Stimmt das?"
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Eine Kerze steht rechts von Lottas Puppe. Wohin fällt der Schatten der Puppe?"
                say: "Eine Kerze steht rechts von Lottas Puppe. Wohin fällt der Schatten der Puppe?"
                show: { object: candle }
                options: ["nach links", "nach rechts", "auf die Kerze"]
                answer: "nach links"
              - id: l1-n4
                type: true_false
                text: "Ben hält seinen roten Ball vor die Lampe. Er sagt: „Der Schatten ist rot.“ Stimmt das?"
                say: "Ben hält seinen roten Ball vor die Lampe. Er sagt: Der Schatten ist rot. Stimmt das?"
                show: { object: ball }
                answer: false
              - id: l1-n5
                type: sorting
                text: "Ben hält Dinge vor die Lampe. Welcher Schatten ist dunkel, welcher nur blass?"
                say: "Ben hält Dinge vor die Lampe. Welcher Schatten ist dunkel, welcher nur ganz blass? Sortiere."
                bins:
                  - { id: dunkel, show: { text: "dunkler Schatten" }, say: "dunkler Schatten" }
                  - { id: blass, show: { text: "blasser Schatten" }, say: "blasser Schatten" }
                options:
                  - { object: book, bin: dunkel }
                  - { object: glass, bin: blass }
                  - { object: teddy, bin: dunkel }
                  - { object: bottle, bin: blass }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was braucht man für einen Schatten?"
            say: "Was braucht man für einen Schatten?"
            options: ["Licht und ein Ding, das im Weg steht", "nur ein Ding", "nur Dunkelheit"]
            answer: "Licht und ein Ding, das im Weg steht"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ohne Licht gibt es keinen Schatten."
            say: "Stimmt das? Ohne Licht gibt es keinen Schatten."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Die Lampe steht rechts vom Ball. Wo ist der Schatten?"
            say: "Die Lampe steht rechts vom Ball. Wo ist der Schatten?"
            show: { objects: [lamp, ball] }
            options: ["links vom Ball", "rechts vom Ball", "auf der Lampe"]
            answer: "links vom Ball"
          - id: l1-c4
            type: image_multiple_choice
            text: "Was macht vor der Lampe nur einen ganz blassen Schatten?"
            say: "Was macht vor der Lampe nur einen ganz blassen Schatten?"
            options: [{ object: glass }, { object: book }, { object: teddy }]
            answer: glass
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Der Schatten zeigt die Farben des Dings."
            say: "Stimmt das? Der Schatten zeigt die Farben des Dings."
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Was gibt Licht?"
            say: "Was gibt Licht?"
            options: [{ object: sun }, { object: stone }, { object: ball }]
            answer: sun

  - n: 2
    title: { de: "Wenn das Licht wandert", en: "When the light moves" }
    goal:
      de: "Sag voraus, wie sich ein Schatten verändert, wenn das Licht wandert. Steht die Sonne tief, ist dein Schatten lang."
      en: "Predict how a shadow changes when the light moves. When the sun is low, your shadow is long."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was gibt Licht für einen Schatten?"
            say: "Was gibt Licht für einen Schatten?"
            options: [{ object: candle }, { object: book }, { object: teddy }]
            answer: candle
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Schatten liegt auf der Seite, die vom Licht weg zeigt."
            say: "Stimmt das? Der Schatten liegt auf der Seite, die vom Licht weg zeigt."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Morgens ist Bens Schatten lang. Und mittags?"
            say: "Früh am Morgen geht Ben in den Garten. Die Sonne steht noch tief, und sein Schatten ist lang wie ein Riese. Was glaubst du: Wie ist sein Schatten am Mittag?"
            show: { object: sun }
          - text: "Tiefe Sonne: langer Schatten. Hohe Sonne: kurzer Schatten."
            say: "Am Mittag steht die Sonne hoch am Himmel. Jetzt ist Bens Schatten kurz. Am Abend steht die Sonne wieder tief, und der Schatten wird wieder lang. Tiefes Licht macht einen langen Schatten, hohes Licht einen kurzen."
            show: { objects: [sun, boy] }
          - text: "Wandert das Licht, wandert der Schatten."
            say: "Die Sonne wandert über den Tag über den Himmel. Darum wandert auch der Schatten vom Baum. Er liegt immer gegenüber der Sonne. Im Zimmer ist es genauso: Trägt Lotta die Lampe von links nach rechts, wandert der Schatten vom Teddy von rechts nach links."
            show: { objects: [sun, tree] }
          - text: "Nah an der Lampe: großer Schatten"
            say: "Ben und Lotta spielen Schattentheater. Lotta hält ihre Hand nah an die Lampe. Der Schatten an der Wand ist riesig. Dann hält sie die Hand weit weg von der Lampe, nah an die Wand. Jetzt ist der Schatten klein."
            show: { objects: [hand, lamp] }
          - text: "Probier's aus, mit einem Erwachsenen!"
            say: "Probier's aus, mit Mama, Papa oder einem anderen Erwachsenen. Macht das Zimmer dunkel und leuchtet mit einer Taschenlampe auf eine Wand. Haltet eure Hände dazwischen und macht Tiere. Geht mit der Hand nah an die Lampe und dann weit weg. Was passiert mit dem Schatten?"
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lotta trägt die Lampe von links nach rechts. Wohin wandert der Schatten vom Teddy?"
                say: "Lotta trägt die Lampe von links nach rechts. Wohin wandert der Schatten vom Teddy?"
                show: { objects: [lamp, teddy] }
                options: ["von rechts nach links", "auch von links nach rechts", "er bleibt, wo er ist"]
                answer: "von rechts nach links"
                hints:
                  - "Der Schatten liegt immer gegenüber vom Licht."
                  - "Am Anfang ist die Lampe links, der Schatten also rechts. Am Ende ist die Lampe rechts."
                  - "Der Schatten wandert von rechts nach links."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Am Mittag ist Bens Schatten am längsten."
                say: "Stimmt das? Am Mittag ist Bens Schatten am längsten."
                show: { object: sun }
                answer: false
                hints:
                  - "Wie hoch steht die Sonne am Mittag?"
                  - "Hohes Licht macht einen kurzen Schatten."
                  - "Nein. Am Mittag ist der Schatten kurz. Morgens und abends ist er lang."
              - id: l2-f3
                type: sorting
                text: "Langer oder kurzer Schatten?"
                say: "Sortiere. Wann ist Bens Schatten lang, wann ist er kurz?"
                bins:
                  - { id: lang, show: { text: "langer Schatten" }, say: "langer Schatten" }
                  - { id: kurz, show: { text: "kurzer Schatten" }, say: "kurzer Schatten" }
                options:
                  - { text: "früh am Morgen", bin: lang }
                  - { text: "am Mittag", bin: kurz }
                  - { text: "am Abend", bin: lang }
                  - { text: "Die Lampe hängt hoch an der Decke.", bin: kurz }
                hints:
                  - "Steht das Licht tief oder hoch?"
                  - "Morgens und abends steht die Sonne tief. Mittags und an der Decke ist das Licht hoch."
                  - "Morgen und Abend zum langen Schatten, Mittag und Decke zum kurzen."
              - id: l2-f4
                type: image_multiple_choice
                text: "Lotta macht Schattentheater. Was hält sie zwischen Lampe und Wand?"
                say: "Lotta macht Schattentheater. Was hält sie zwischen Lampe und Wand, damit ein Hase an der Wand erscheint?"
                options: [{ object: hand }, { object: sun }, { object: candle }]
                answer: hand
                hints:
                  - "Was braucht man außer Licht noch für einen Schatten?"
                  - "Etwas muss dem Licht im Weg stehen."
                  - "Lotta hält ihre Hand dazwischen."
              - id: l2-f5
                type: multiple_choice
                text: "Lotta hält ihre Hand ganz nah an die Lampe. Wie ist der Schatten an der Wand?"
                say: "Lotta hält ihre Hand ganz nah an die Lampe. Wie ist der Schatten an der Wand?"
                show: { objects: [hand, lamp] }
                options: ["groß", "klein", "gar nicht da"]
                answer: "groß"
                hints:
                  - "Denk an das Schattentheater von Ben und Lotta."
                  - "Die Hand nah an der Lampe hält viel Licht auf."
                  - "Nah an der Lampe ist der Schatten groß."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Wie ist der Schatten?"
                say: "Setz die passenden Wörter ein."
                frame: "Steht die Sonne tief, ist der Schatten _. Steht sie hoch, ist er _."
                options: ["lang", "kurz", "bunt"]
                answer: ["lang", "kurz"]
                hints: ["Denk an Ben am Morgen und am Mittag."]
              - id: l2-s2
                type: multiple_choice
                text: "Wann ist dein Schatten auf dem Schulhof am kürzesten?"
                say: "Wann ist dein Schatten auf dem Schulhof am kürzesten?"
                options: ["um die Mittagszeit", "früh am Morgen", "am Abend"]
                answer: "um die Mittagszeit"
                hints: ["Wann steht die Sonne am höchsten?"]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Wenn die Sonne wandert, wandert auch der Schatten vom Baum."
                say: "Stimmt das? Wenn die Sonne wandert, wandert auch der Schatten vom Baum."
                show: { object: tree }
                answer: true
                hints: ["Der Schatten liegt immer gegenüber vom Licht."]
              - id: l2-s4
                type: sorting
                text: "Großer oder kleiner Schatten an der Wand?"
                say: "Sortiere. Wann ist der Schatten der Hand groß, wann ist er klein?"
                bins:
                  - { id: gross, show: { text: "großer Schatten" }, say: "großer Schatten" }
                  - { id: klein, show: { text: "kleiner Schatten" }, say: "kleiner Schatten" }
                options:
                  - { text: "Hand nah an der Lampe", bin: gross }
                  - { text: "Hand nah an der Wand", bin: klein }
                  - { text: "Hand weit weg von der Lampe", bin: klein }
                  - { text: "Hand dicht vor der Lampe", bin: gross }
                hints: ["Je näher die Hand an der Lampe ist, desto größer wird der Schatten."]
              - id: l2-s5
                type: multiple_choice
                text: "Ben legt die Lampe auf den Boden neben seinen Teddy. Wie wird der Schatten auf dem Boden?"
                say: "Ben legt die Lampe auf den Boden neben seinen Teddy. Wie wird der Schatten auf dem Boden?"
                show: { objects: [lamp, teddy] }
                options: ["lang", "kurz", "bunt"]
                answer: "lang"
                hints: ["Steht das Licht jetzt tief oder hoch?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Am Morgen steht die Sonne links vom Baum. Am Abend steht sie rechts vom Baum. Wo liegt der Schatten am Abend?"
                say: "Am Morgen steht die Sonne links vom Baum. Am Abend steht sie rechts vom Baum. Wo liegt der Schatten am Abend?"
                show: { object: tree }
                options: ["links vom Baum", "rechts vom Baum", "auf der Sonne"]
                answer: "links vom Baum"
              - id: l2-n2
                type: true_false
                text: "Ben sagt am Abend: „Die Sonne steht schon tief. Mein Schatten ist jetzt lang.“ Stimmt das?"
                say: "Ben sagt am Abend: Die Sonne steht schon tief. Mein Schatten ist jetzt lang. Stimmt das?"
                answer: true
              - id: l2-n3
                type: multiple_choice
                text: "Beim Schattentheater soll der Hase an der Wand riesig werden. Was macht Lotta?"
                say: "Beim Schattentheater soll der Hase an der Wand riesig werden. Was macht Lotta?"
                show: { objects: [hand, lamp] }
                options: ["Sie hält die Hand nah an die Lampe.", "Sie hält die Hand nah an die Wand.", "Sie macht die Lampe aus."]
                answer: "Sie hält die Hand nah an die Lampe."
                feedback:
                  "Sie macht die Lampe aus.": "Ohne Licht ist der Hase ganz weg! Lotta hält die Hand nah an die Lampe."
              - id: l2-n4
                type: image_multiple_choice
                text: "Am Mittag ist es heiß. Ben will im Schatten spielen. Wo findet er Schatten?"
                say: "Am Mittag ist es heiß. Ben will im Schatten spielen. Wo findet er Schatten?"
                options: [{ object: tree }, { object: sun }, { object: lamp }]
                answer: tree
              - id: l2-n5
                type: fill_in_blank
                text: "Lotta schreibt ins Forscherheft."
                say: "Lotta schreibt ins Forscherheft. Setz die passenden Wörter ein."
                frame: "Hand nah an der Lampe: Schatten _. Hand weit weg: Schatten _."
