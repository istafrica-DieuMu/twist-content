# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.jobs
skill: world.technology.jobs
curriculum: de-DE
language: de
title:
  de: Berufe und ihre Werkzeuge
  en: Jobs and their tools
summary: >
  Class 2b walks through town with Lina and Malik and visits people at
  work. Lesson 1 matches jobs to their tools and workplaces: firefighter
  Jana with helmet, hose and fire engine at the fire station, baker Tim
  with the oven in the bakery, doctor Dr. Aydin with the stethoscope in
  the practice or hospital, the teacher with chalk in school, the cook
  with spoon and knife in the kitchen, the bus driver in the bus. Lesson 2
  starts with Lina wanting to be a carpenter and Malik a nurse: every job
  is open to everyone. It groups jobs into fields of work (health, food,
  building, safety), shows machines with a small computer at work (the
  scanner at the till, the parcel scanner) and how to find out more about
  a job, and ends with the skill check. Examples mix women and men in
  every kind of job without comment.
metadata:
  year: klasse-2
  topic: { de: Bauen und Berufe, en: Building and jobs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.technology.tools-household]
  also_practises: []
  vocabulary: { de: [Beruf, Arbeitsort, Werkzeug, Gerät, Arbeitsfeld, Feuerwache, Bäckerei, Praxis, Krankenhaus, Scanner, Strichcode] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: tools, what: { de: "Berufe ihren Werkzeugen und Geräten zuordnen, auch solchen mit Computer", en: "matching jobs to their tools and machines, including ones with a computer" } }
    - { id: places, what: { de: Berufe ihren Arbeitsorten zuordnen, en: matching jobs to their workplaces } }
    - { id: fields, what: { de: "Berufe Arbeitsfeldern zuordnen (Gesundheit, Essen, Bauen, Sicherheit)", en: "sorting jobs into fields of work (health, food, building, safety)" } }
    - { id: open, what: { de: "wissen, dass jeder Beruf für alle offen ist", en: knowing that every job is open to everyone } }
  misconceptions:
    - id: jobs-by-gender
      what: Thinks some jobs are only for men (firefighter, carpenter) and others only for women (nurse)
      addressed: "examples mix women and men throughout; lesson 2 Learn opens with Lina and Malik's wishes and says every job is open to everyone; l2-f2, l2-s2, l2-n2, l2-c16 to l2-c20"
    - id: workplace-is-a-building
      what: Thinks a workplace is always a building, so a bus or a van is not one
      addressed: "lesson 1 Learn says the bus is the bus driver's workplace; l1-n4 and l1-c6; lesson 2 Learn adds the parcel van; l2-n4 and l2-c5"
    - id: computers-only-in-offices
      what: Does not notice the machines with a computer in everyday jobs
      addressed: "lesson 2 Learn shows the scanner at the till and the parcel scanner; l2-f3, l2-s4, l2-s5 and l2-c3"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wer arbeitet hier?", en: "Who works here?" }
    goal:
      de: "Finde heraus, welche Werkzeuge ein Beruf braucht und wo man arbeitet. Der Bäcker backt das Brot im Ofen in der Bäckerei."
      en: "Find out which tools a job needs and where people work. The baker bakes bread in the oven in the bakery."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Womit sägt man Holz?"
            say: "Womit sägt man Holz?"
            options: [{ object: saw }, { object: spoon }, { object: sock }]
            answer: saw
            feedback:
              sock: "Mit einer Socke sägen? Da kommst du nicht weit! Holz sägt man mit der Säge."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie trägst du eine Schere richtig?"
            say: "Wie trägst du eine Schere richtig?"
            options: ["mit der Spitze nach unten", "mit der Spitze nach oben", "offen über dem Kopf"]
            answer: "mit der Spitze nach unten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wer fährt dieses Auto?"
            say: "Die Klasse 2b macht einen Ausflug durch die Stadt. Lina und Malik wollen wissen: Wer arbeitet hier, und was braucht man dafür? Vor einem großen Tor steht ein rotes Auto mit einer langen Leiter. Was glaubst du: Wer fährt damit?"
            show: { object: fire-engine }
          - text: "Feuerwehrfrau Jana fährt das Feuerwehrauto."
            say: "Die Feuerwehr! Feuerwehrfrau Jana zeigt den Kindern ihren Helm und den langen Schlauch. Mit dem Feuerwehrauto fährt sie zum Brand und löscht das Feuer mit Wasser. Ihr Arbeitsort ist die Feuerwache."
            show: { object: firefighter }
          - text: "Bäcker Tim backt das Brot im Ofen."
            say: "Weiter geht es zur Bäckerei. Bäcker Tim fängt sehr früh am Morgen an, wenn du noch schläfst. Er knetet den Teig und backt das Brot im großen Ofen. Die Bäckerei ist sein Arbeitsort."
            show: { objects: [bread, oven] }
          - text: "Die Ärztin hört mit dem Stethoskop ab."
            say: "In der Praxis arbeitet Ärztin Doktor Aydin. Mit dem Stethoskop hört sie, wie dein Herz schlägt und wie du atmest. Ärztinnen und Ärzte arbeiten in einer Praxis oder im Krankenhaus. Im Krankenhaus arbeitet auch Krankenpfleger Herr Weber."
            show: { objects: [doctor, stethoscope] }
          - text: "Jeder Beruf hat Werkzeuge und einen Arbeitsort."
            say: "Jeder Beruf hat seine Werkzeuge und seinen Arbeitsort. Der Lehrer arbeitet in der Schule mit Tafel und Kreide. Die Köchin arbeitet in der Küche mit Kochlöffel und Messer. Und die Busfahrerin? Ihr Arbeitsort ist der Bus."
            show: { objects: [school, kitchen] }
          - text: "Wusstest du? Die meisten Feuerwehrleute in Deutschland haben noch einen anderen Beruf."
            say: "Wusstest du? Die meisten Feuerwehrleute in Deutschland sind bei der Freiwilligen Feuerwehr. Sie haben noch einen anderen Beruf, zum Beispiel Bäckerin oder Lehrer. Brennt es, piept ein kleiner Melder, und sie eilen zur Feuerwache."
            show: { object: fire-engine }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Wer braucht was?"
                say: "Verbinde jeden Beruf mit dem, was er für die Arbeit braucht."
                pairs:
                  - { left: { object: cook, say: "die Köchin" }, right: { object: spoon } }
                  - { left: { object: teacher, say: "der Lehrer" }, right: { object: chalk } }
                  - { left: { object: firefighter, say: "die Feuerwehrfrau" }, right: { object: fire-engine } }
                hints:
                  - "Fang mit dem Beruf an, den du am besten kennst."
                  - "Die Köchin rührt im Topf. Der Lehrer schreibt an die Tafel."
                  - "Köchin und Kochlöffel, Lehrer und Kreide, Feuerwehrfrau und Feuerwehrauto."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wo backt Bäcker Tim das Brot?"
                say: "Wo backt Bäcker Tim das Brot?"
                show: { object: baker }
                options: ["im Ofen", "im Kühlschrank", "in der Badewanne"]
                answer: "im Ofen"
                feedback:
                  "in der Badewanne": "Brot in der Badewanne? Das wäre ganz schön matschig! Tim backt im Ofen."
                hints:
                  - "Zum Backen braucht man Hitze."
                  - "Im Kühlschrank ist es kalt. Im Ofen ist es heiß."
                  - "Tim backt das Brot im Ofen."
              - id: l1-f3
                type: image_multiple_choice
                text: "Wo arbeiten Ärztinnen und Ärzte oft?"
                say: "Wo arbeiten Ärztinnen und Ärzte oft?"
                options: [{ object: hospital }, { object: library }, { object: swimming-pool }]
                answer: hospital
                hints:
                  - "Wohin bringt der Krankenwagen kranke Menschen?"
                  - "In der Bücherei leiht man Bücher. Im Schwimmbad schwimmt man."
                  - "Im Krankenhaus."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Die Feuerwehrfrau löscht das Feuer mit dem Kochlöffel."
                say: "Stimmt das? Die Feuerwehrfrau löscht das Feuer mit dem Kochlöffel."
                answer: false
                hints:
                  - "Was hat Jana den Kindern gezeigt?"
                  - "Jana hat einen Helm und einen langen Schlauch."
                  - "Nein. Sie löscht mit Wasser aus dem Schlauch. Den Kochlöffel braucht die Köchin."
              - id: l1-f5
                type: sorting
                text: "Wo braucht man das?"
                say: "Sortiere. Was braucht man in der Schule, was in der Küche?"
                bins:
                  - { id: schule, show: { object: school }, say: "in der Schule" }
                  - { id: kueche, show: { object: kitchen }, say: "in der Küche" }
                options:
                  - { object: chalk, bin: schule }
                  - { object: spoon, bin: kueche }
                  - { object: ruler, bin: schule }
                  - { object: knife, bin: kueche }
                hints:
                  - "Was brauchst du zum Lernen, was zum Kochen?"
                  - "Mit Kreide und Lineal arbeitet man in der Schule."
                  - "Kreide und Lineal in die Schule, Kochlöffel und Messer in die Küche."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wo arbeitet die Busfahrerin?"
                say: "Wo arbeitet die Busfahrerin?"
                options: [{ object: bus }, { object: boat }, { object: kite }]
                answer: bus
                feedback:
                  kite: "Mit dem Drachen fliegt man auf der Wiese. Die Busfahrerin arbeitet im Bus."
                hints: ["Der Beruf steckt schon im Namen."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Bäcker Tim fängt sehr früh am Morgen an zu arbeiten."
                say: "Stimmt das? Bäcker Tim fängt sehr früh am Morgen an zu arbeiten."
                show: { object: baker }
                answer: true
                hints: ["Das Brot soll zum Frühstück fertig sein."]
              - id: l1-s3
                type: multiple_choice
                text: "Was ist ein Arbeitsort?"
                say: "Was ist ein Arbeitsort?"
                options: ["der Ort, an dem jemand arbeitet", "ein Werkzeug", "ein freier Tag"]
                answer: "der Ort, an dem jemand arbeitet"
                hints: ["Für Bäcker Tim ist es die Bäckerei."]
              - id: l1-s4
                type: matching
                text: "Wer arbeitet wo?"
                say: "Verbinde jeden Beruf mit seinem Arbeitsort."
                pairs:
                  - { left: { object: cook, say: "der Koch" }, right: { object: kitchen } }
                  - { left: { object: doctor, say: "die Ärztin" }, right: { object: hospital } }
                  - { left: { object: teacher, say: "die Lehrerin" }, right: { object: school } }
                hints: ["Wo braucht man einen Herd, wo eine Tafel, wo ein Bett für Kranke?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Wo arbeiten sie?"
                say: "Setz die passenden Wörter ein."
                frame: "Die Feuerwehrfrau arbeitet in der _. Der Bäcker arbeitet in der _."
                options: ["Feuerwache", "Bäckerei", "Bücherei"]
                answer: ["Feuerwache", "Bäckerei"]
                hints: ["Wo steht das Feuerwehrauto, wo der große Ofen?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Malik hat hohes Fieber. Wer kann ihm helfen?"
                say: "Malik hat hohes Fieber. Wer kann ihm helfen?"
                options: ["die Ärztin", "der Bäcker", "die Busfahrerin"]
                answer: "die Ärztin"
              - id: l1-n2
                type: image_multiple_choice
                text: "Lina riecht etwas Leckeres. Was hat Bäcker Tim heute früh gebacken?"
                say: "Lina riecht etwas Leckeres. Was hat Bäcker Tim heute früh gebacken?"
                options: [{ object: bread }, { object: sock }, { object: chalk }]
                answer: bread
              - id: l1-n3
                type: sorting
                text: "Lina sortiert ihre Fotos vom Ausflug. Gehört das zur Feuerwehr oder zur Schule?"
                say: "Lina sortiert ihre Fotos vom Ausflug. Gehört das zur Feuerwehr oder zur Schule?"
                bins:
                  - { id: feuerwehr, show: { text: "Feuerwehr" }, say: "Feuerwehr" }
                  - { id: schule, show: { text: "Schule" }, say: "Schule" }
                options:
                  - { object: fire-engine, bin: feuerwehr }
                  - { object: chalk, bin: schule }
                  - { object: fire-helmet, bin: feuerwehr }
                  - { object: ruler, bin: schule }
              - id: l1-n4
                type: true_false
                text: "Malik sagt: „Der Bus ist der Arbeitsort der Busfahrerin.“ Stimmt das?"
                say: "Malik sagt: Der Bus ist der Arbeitsort der Busfahrerin. Stimmt das?"
                show: { object: bus-driver }
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Lina schreibt in ihr Heft, was sie gesehen hat."
                say: "Lina schreibt in ihr Heft, was sie gesehen hat. Setz die passenden Wörter ein."
                frame: "Die Köchin rührt mit dem _. Der Lehrer schreibt mit _."
                options: ["Kochlöffel", "Kreide", "Ofen"]
                answer: ["Kochlöffel", "Kreide"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wo arbeitet der Lehrer?"
            say: "Wo arbeitet der Lehrer?"
            options: [{ object: school }, { object: kitchen }, { object: hospital }]
            answer: school
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Die Ärztin hört mit dem Stethoskop dein Herz ab."
            say: "Stimmt das? Die Ärztin hört mit dem Stethoskop dein Herz ab."
            show: { object: stethoscope }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Womit löscht die Feuerwehr das Feuer?"
            say: "Womit löscht die Feuerwehr das Feuer?"
            options: ["mit Wasser aus dem Schlauch", "mit Mehl", "mit Kreide"]
            answer: "mit Wasser aus dem Schlauch"
          - id: l1-c4
            type: image_multiple_choice
            text: "Was braucht die Köchin?"
            say: "Was braucht die Köchin?"
            options: [{ object: knife }, { object: chalk }, { object: saw }]
            answer: knife
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Der Bäcker backt das Brot im Kühlschrank."
            say: "Stimmt das? Der Bäcker backt das Brot im Kühlschrank."
            show: { object: baker }
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Wo arbeitet die Busfahrerin?"
            say: "Setz das passende Wort ein."
            frame: "Die Busfahrerin arbeitet im _."
            options: ["Bus", "Ofen", "Heft"]
            answer: ["Bus"]

  - n: 2
    title: { de: "Berufe für alle", en: "Jobs for everyone" }
    goal:
      de: "Finde heraus, welche Berufe zusammengehören und dass alle jeden Beruf lernen können. Ärztin und Krankenpfleger machen Menschen gesund."
      en: "Find out which jobs belong together and that anyone can learn any job. Doctors and nurses make people well."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was braucht der Lehrer an der Tafel?"
            say: "Was braucht der Lehrer an der Tafel?"
            options: [{ object: chalk }, { object: spoon }, { object: saw }]
            answer: chalk
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Die Feuerwehrfrau arbeitet in der Feuerwache."
            say: "Stimmt das? Die Feuerwehrfrau arbeitet in der Feuerwache."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Kann Lina Tischlerin werden und Malik Krankenpfleger?"
            say: "Zurück in der Klasse erzählen die Kinder, was sie einmal werden wollen. Lina sagt: Ich werde Tischlerin und baue Tische aus Holz. Malik sagt: Ich werde Krankenpfleger wie Herr Weber. Was glaubst du: Geht das?"
            show: { objects: [carpenter, nurse] }
          - text: "Jeden Beruf können alle lernen."
            say: "Ja! Jeden Beruf können Frauen und Männer lernen, Mädchen und Jungen. Es gibt Tischlerinnen und Tischler, Krankenpflegerinnen und Krankenpfleger. Wichtig ist, was dir Spaß macht und was du gut kannst."
            show: { object: child }
          - text: "Berufe gehören zu Arbeitsfeldern: Gesundheit, Essen, Bauen, Sicherheit"
            say: "Viele Berufe gehören zusammen, weil sie Ähnliches tun. Sie bilden ein Arbeitsfeld. Ärztin und Krankenpfleger machen Menschen gesund: Gesundheit. Bäcker und Köchin machen unser Essen. Tischlerin und Maurer bauen: Die Tischlerin sägt Holz mit der Säge. Polizei und Feuerwehr sorgen für unsere Sicherheit."
            show: { objects: [hospital, kitchen] }
          - text: "Der Scanner an der Kasse liest den Strichcode."
            say: "Bei vielen Berufen helfen Geräte mit einem kleinen Computer. Der Kassierer im Supermarkt hält die Milch an den Scanner. Der Scanner liest den Strichcode, und die Kasse zeigt sofort den Preis. Auch die Ärztin schreibt am Computer auf, was dir fehlt."
            show: { object: barcode-scanner }
          - text: "Die Paketbotin scannt jedes Paket."
            say: "Mit dem Lieferwagen bringt die Paketbotin Pakete zu den Menschen nach Hause. Jedes Paket scannt sie mit einem kleinen Gerät. So kann man im Internet sehen, wo das Paket gerade ist."
            show: { objects: [delivery-driver, parcel] }
          - text: "Mehr über einen Beruf: fragen, lesen, suchen"
            say: "Willst du mehr über einen Beruf wissen? Frag Menschen, die ihn haben. Lies in einem Sachbuch. Oder such mit einem Erwachsenen auf einer Kinderseite im Internet."
            show: { object: book-open }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Zu welchem Arbeitsfeld gehört der Beruf?"
                say: "Sortiere die Berufe. Gehören sie zur Gesundheit oder zum Essen?"
                bins:
                  - { id: gesundheit, show: { text: "Gesundheit" }, say: "Gesundheit" }
                  - { id: essen, show: { text: "Essen" }, say: "Essen" }
                options:
                  - { object: doctor, say: "die Ärztin", bin: gesundheit }
                  - { object: baker, say: "der Bäcker", bin: essen }
                  - { object: nurse, say: "der Krankenpfleger", bin: gesundheit }
                  - { object: cook, say: "die Köchin", bin: essen }
                hints:
                  - "Frag dich bei jedem Beruf: Macht er Menschen gesund oder macht er Essen?"
                  - "Ärztin und Krankenpfleger arbeiten im Krankenhaus."
                  - "Ärztin und Krankenpfleger zur Gesundheit, Bäcker und Köchin zum Essen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Nur Männer können Tischler werden."
                say: "Stimmt das? Nur Männer können Tischler werden."
                show: { object: carpenter }
                answer: false
                hints:
                  - "Was will Lina werden?"
                  - "Lina will Tischlerin werden. Jeden Beruf können alle lernen."
                  - "Nein. Frauen und Männer können Tischlerin oder Tischler werden."
              - id: l2-f3
                type: multiple_choice
                text: "Was macht der Scanner an der Kasse?"
                say: "Was macht der Scanner an der Kasse?"
                show: { object: barcode-scanner }
                options: ["Er liest den Strichcode, und die Kasse zeigt den Preis.", "Er backt Brot.", "Er löscht Feuer."]
                answer: "Er liest den Strichcode, und die Kasse zeigt den Preis."
                hints:
                  - "Denk an den Kassierer im Supermarkt."
                  - "Der Kassierer hält die Milch an den Scanner."
                  - "Der Scanner liest den Strichcode."
              - id: l2-f4
                type: matching
                text: "Welcher Beruf gehört zu welchem Arbeitsfeld?"
                say: "Verbinde jedes Arbeitsfeld mit einem Beruf."
                pairs:
                  - { left: { text: "Gesundheit" }, right: { object: nurse, say: "die Krankenpflegerin" } }
                  - { left: { text: "Essen" }, right: { object: cook, say: "der Koch" } }
                  - { left: { text: "Bauen" }, right: { object: carpenter, say: "die Tischlerin" } }
                  - { left: { text: "Sicherheit" }, right: { object: firefighter, say: "der Feuerwehrmann" } }
                hints:
                  - "Fang mit dem Arbeitsfeld an, das du am besten kennst."
                  - "Wer sägt Holz? Wer löscht Feuer?"
                  - "Gesundheit und Krankenpflegerin, Essen und Koch, Bauen und Tischlerin, Sicherheit und Feuerwehrmann."
              - id: l2-f5
                type: image_multiple_choice
                text: "Was braucht die Tischlerin für ihre Arbeit?"
                say: "Was braucht die Tischlerin für ihre Arbeit?"
                options: [{ object: saw }, { object: spoon }, { object: chalk }]
                answer: saw
                hints:
                  - "Die Tischlerin baut Tische aus Holz."
                  - "Holz schneidet man nicht mit dem Löffel."
                  - "Sie braucht die Säge."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Berufe sorgen für unsere Sicherheit?"
                say: "Welche Berufe sorgen für unsere Sicherheit?"
                options: ["Polizei und Feuerwehr", "Bäcker und Köchin", "Kassierer und Paketbotin"]
                answer: "Polizei und Feuerwehr"
                hints: ["Wen rufst du, wenn es brennt?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Eine Frau kann Feuerwehrfrau werden und ein Mann Krankenpfleger."
                say: "Stimmt das? Eine Frau kann Feuerwehrfrau werden und ein Mann Krankenpfleger."
                show: { objects: [firefighter, nurse] }
                answer: true
                hints: ["Denk an Jana und an Herrn Weber."]
              - id: l2-s3
                type: fill_in_blank
                text: "Was machen sie?"
                say: "Setz das passende Wort ein."
                frame: "Die Ärztin und der Krankenpfleger machen Menschen _."
                options: ["gesund", "müde", "nass"]
                answer: ["gesund"]
                hints: ["Sie arbeiten im Arbeitsfeld Gesundheit."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Wo arbeitet der Kassierer mit dem Scanner?"
                say: "Wo arbeitet der Kassierer mit dem Scanner?"
                options: [{ object: supermarket }, { object: swimming-pool }, { object: church }]
                answer: supermarket
                hints: ["Wo bezahlst du die Milch?"]
              - id: l2-s5
                type: ordering
                text: "Wie kommt der Preis auf die Kasse?"
                say: "Wie kommt der Preis auf die Kasse? Leg die Karten in die richtige Reihenfolge."
                show: { object: barcode-scanner }
                options: ["Die Kasse zeigt den Preis.", "Der Kassierer hält die Milch an den Scanner.", "Der Scanner liest den Strichcode."]
                slot_count: 3
                answer: ["Der Kassierer hält die Milch an den Scanner.", "Der Scanner liest den Strichcode.", "Die Kasse zeigt den Preis."]
                hints: ["Zuerst muss die Milch zum Scanner."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Lina baut gern Sachen aus Holz. Welcher Beruf passt zu ihr?"
