# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.public-transport
skill: world.space.public-transport
curriculum: de-DE
language: de
title:
  de: Mit Bus und Bahn
  en: By bus and train
summary: >
  Aylin goes to the swimming pool by bus with her big brother Can. Lesson 1
  is the stop and the ride: leave early so as not to run for the bus, wait
  at least a big step back from the kerb, no pushing, get on only when the
  bus has stopped and the doors are open, let people off first, show the
  ticket, put the bag down by your feet, sit or hold on tight because the
  bus can brake suddenly, offer your seat, press the stop button in time.
  Lesson 2 is getting off and going on: stay seated until the bus stops,
  never cross in front of or behind the standing bus but wait until it has
  gone (or use the lights or a zebra crossing), wait behind the white line
  on the platform, do not get on when the door beeps, and read a simple
  timetable. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Sicher unterwegs, en: Getting around safely }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.space.way-to-school]
  also_practises: []
  vocabulary: { de: [Haltestelle, Bordsteinkante, Abstand, Fahrkarte, Halteknopf, Gang, Bahnsteig, weiße Linie, Fahrplan, Abfahrt] }
  forms: [text, audio, picture, drawn]
  drawn: [table]
  sounds: []
  facets: []
  parts:
    - { id: stop, what: { de: "an der Haltestelle und am Bahnsteig sicher warten und einsteigen", en: waiting and getting on safely at the stop and on the platform } }
    - { id: ride, what: { de: "sich in Bus und Bahn richtig verhalten", en: behaving properly on the bus and train } }
    - { id: off, what: { de: "sicher aussteigen und danach sicher über die Straße gehen", en: getting off safely and then crossing the road safely } }
  misconceptions:
    - id: cross-at-bus
      what: Thinks it is fine to cross the road straight in front of or behind the bus after getting off
      addressed: lesson 2 Learn opens with the guess and says why not; l2-f1, l2-f2, l2-s2, l2-n2; l2-c14, l2-c15, l2-c20 in the skill check
    - id: board-moving-bus
      what: Thinks you can get on as soon as the bus slows down or the doors are about to close
      addressed: lesson 1 Learn says wait until it stands and the doors are open; l1-s1, l1-n5; lesson 2 Learn on the beeping door, l2-s4; l2-c4 in the skill check
    - id: no-need-to-hold
      what: Thinks standing on the bus without holding on is safe
      addressed: lesson 1 Learn says the bus can brake suddenly; l1-f3, l1-f5, l2-w2; l2-c10 and l2-c13 in the skill check
    - id: wait-at-edge
      what: Waits right at the kerb or platform edge to be first in
      addressed: lesson 1 Learn says a big step back; l1-f1, l2-w1; lesson 2 Learn on the white line, l2-s1, l2-n1; l2-c1, l2-c6 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "An der Haltestelle und im Bus", en: "At the stop and on the bus" }
    goal:
      de: "Lerne, wie du sicher auf den Bus wartest und im Bus fährst. Du wartest mit Abstand und hältst dich gut fest."
      en: "Learn how to wait for the bus and ride on it safely. You wait a step back and hold on tight."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wo bleibst du stehen, bevor du über die Straße gehst?"
            say: "Wo bleibst du stehen, bevor du über die Straße gehst?"
            options: ["am Bordstein", "mitten auf der Straße", "hinter einem parkenden Auto"]
            answer: "am Bordstein"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Zwischen parkenden Autos über die Straße zu gehen, ist gefährlich."
            say: "Zwischen parkenden Autos über die Straße zu gehen, ist gefährlich. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wo wartet Aylin am besten?"
            say: "Aylin fährt mit ihrem großen Bruder Can mit dem Bus zum Schwimmbad. Sie stehen an der Haltestelle, am Schild mit dem grünen H. Der Bus kommt gleich. Was glaubst du: Wo wartet Aylin am besten, ganz vorne an der Bordsteinkante oder weiter hinten?"
            show: { object: sign-bus-stop }
          - text: "Mit Abstand warten"
            say: "Weiter hinten! Aylin wartet mindestens einen großen Schritt von der Bordsteinkante entfernt, denn der Bus fährt ganz nah an den Bordstein heran. Sie drängelt nicht, schubst nicht und tobt nicht herum. Und weil sie früh genug losgegangen ist, muss sie nicht zum Bus rennen."
            show: { object: sign-bus-stop }
          - text: "Erst wenn der Bus steht, einsteigen."
            say: "Der Bus hält. Aylin wartet, bis er ganz steht und die Türen offen sind. Zuerst lässt sie die Leute aussteigen. Dann steigt sie ein und zeigt ihre Fahrkarte."
            show: { object: bus }
          - text: "Im Bus: hinsetzen oder festhalten"
            say: "Im Bus nimmt Aylin ihren Rucksack ab und stellt ihn vor ihre Füße, nicht in den Gang. Dann setzt sie sich hin. Ist kein Platz frei, hält sie sich gut an einer Stange fest. Der Bus kann nämlich plötzlich bremsen. Im Gang tobt niemand herum."
            show: { object: schoolbag }
          - text: "Platz anbieten und rechtzeitig drücken"
            say: "Ein alter Mann steigt ein. Aylin steht auf und bietet ihm ihren Platz an. Kurz vor dem Schwimmbad drückt Can den Halteknopf. So weiß die Busfahrerin: An der nächsten Haltestelle will jemand aussteigen."
            show: { objects: [grandpa, bus-stop-button] }
          - text: "Wusstest du? Die erste U-Bahn in Deutschland fuhr 1902 in Berlin."
            say: "Wusstest du? Die erste U-Bahn in Deutschland fuhr im Jahr 1902 in Berlin. Sie fährt dort bis heute, unter der Erde und an manchen Stellen sogar hoch über der Straße."
            show: { object: train }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wo wartet Aylin auf den Bus?"
                say: "Wo wartet Aylin auf den Bus?"
                show: { object: sign-bus-stop }
                options: ["einen großen Schritt hinter der Bordsteinkante", "ganz vorne auf der Bordsteinkante", "auf der Straße"]
                answer: "einen großen Schritt hinter der Bordsteinkante"
                feedback:
                  "ganz vorne auf der Bordsteinkante": "Der Bus fährt ganz nah an den Bordstein heran. Darum wartet Aylin einen großen Schritt dahinter."
                hints:
                  - "Wie nah fährt der Bus an den Bordstein heran?"
                  - "Der Bus kommt ganz nah. Aylin braucht Abstand."
                  - "Einen großen Schritt hinter der Bordsteinkante."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Der Bus kommt. Was macht Aylin zuerst?"
                say: "Der Bus kommt. Was macht Aylin zuerst? Leg die Karten in die richtige Reihenfolge."
                options: ["Sie steigt ein und zeigt ihre Fahrkarte.", "Sie wartet, bis der Bus steht.", "Sie lässt die Leute aussteigen."]
                slot_count: 3
                answer: ["Sie wartet, bis der Bus steht.", "Sie lässt die Leute aussteigen.", "Sie steigt ein und zeigt ihre Fahrkarte."]
                hints:
                  - "Darf man in einen fahrenden Bus einsteigen?"
                  - "Erst muss der Bus stehen. Dann kommen die anderen heraus."
                  - "Warten, aussteigen lassen, einsteigen."
              - id: l1-f3
                type: true_false
                text: "Ist kein Sitzplatz frei, hält sich Aylin im Bus gut fest."
                say: "Ist kein Sitzplatz frei, hält sich Aylin im Bus gut fest. Stimmt das?"
                show: { object: bus }
                answer: true
                hints:
                  - "Was passiert, wenn der Bus plötzlich bremst?"
                  - "Wer sich nicht festhält, kann hinfallen."
                  - "Ja, das stimmt."
              - id: l1-f4
                type: sorting
                text: "Richtig oder falsch?"
                say: "Was ist an der Haltestelle und im Bus richtig, was ist falsch? Sortiere."
                bins:
                  - { id: richtig, show: { text: "richtig" }, say: "richtig" }
                  - { id: falsch, show: { text: "falsch" }, say: "falsch" }
                options:
                  - { text: "an der Haltestelle drängeln", bin: falsch }
                  - { text: "mit Abstand zur Bordsteinkante warten", bin: richtig }
                  - { text: "den Rucksack vor die Füße stellen", bin: richtig }
                  - { text: "im Gang herumtoben", bin: falsch }
                hints:
                  - "Was ist sicher für dich und für die anderen?"
                  - "Wer drängelt oder tobt, kann andere umstoßen oder hinfallen."
                  - "Abstand und Rucksack vor die Füße sind richtig, Drängeln und Toben falsch."
              - id: l1-f5
                type: multiple_choice
                text: "Warum hält sich Aylin im Bus fest?"
                say: "Warum hält sich Aylin im Bus fest?"
                options: ["Der Bus kann plötzlich bremsen.", "Sonst wird ihr langweilig.", "Das ist ein Spiel."]
                answer: "Der Bus kann plötzlich bremsen."
                hints:
                  - "Was kann der Bus machen, wenn ein Auto vor ihm hält?"
                  - "Dann bremst der Bus, und wer nicht sitzt, wackelt."
                  - "Der Bus kann plötzlich bremsen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Aylin darf einsteigen, sobald der Bus langsamer wird."
                say: "Aylin darf einsteigen, sobald der Bus langsamer wird. Stimmt das?"
                show: { object: bus }
                answer: false
                hints: ["Wann sind die Türen offen?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Ein Fahrgast braucht einen Sitzplatz. Für wen steht Aylin auf?"
                say: "Ein Fahrgast braucht einen Sitzplatz. Für wen steht Aylin auf?"
                options: [{ object: teddy }, { object: grandpa }, { object: ball }]
                answer: grandpa
                feedback:
                  teddy: "Für einen Teddy? Der kann gut auf Aylins Schoß sitzen! Aylin steht für den alten Mann auf."
                hints: ["Wer kann im Bus nicht so gut stehen?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Was mache ich im Bus?"
                say: "Setz das passende Wort ein."
                frame: "Im Bus setze ich mich hin, oder ich halte mich gut _."
                options: ["fest", "auf", "ab"]
                answer: ["fest"]
                hints: ["An der Stange hältst du dich ..."]
              - id: l1-s4
                type: multiple_choice
                text: "Wie zeigt Aylin im Bus, dass sie aussteigen will?"
                say: "Wie zeigt Aylin im Bus, dass sie aussteigen will?"
                options: ["Sie drückt den Halteknopf.", "Sie klopft ans Fenster.", "Sie winkt einem Auto."]
                answer: "Sie drückt den Halteknopf."
                hints: ["Was drückt Can kurz vor dem Schwimmbad?"]
              - id: l1-s5
                type: matching
                text: "Was macht Aylin dann?"
                say: "Was macht Aylin dann? Verbinde."
                pairs:
                  - { left: { text: "Der Bus ist voll." }, right: { text: "gut festhalten" } }
                  - { left: { text: "Ein alter Mann steigt ein." }, right: { text: "Platz anbieten" } }
                  - { left: { text: "Gleich kommt das Schwimmbad." }, right: { text: "Halteknopf drücken" } }
                hints: ["Fang mit dem alten Mann an: Was braucht er?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Can und Aylin sind spät dran. Der Bus steht schon an der Haltestelle. Was machen sie?"
                say: "Can und Aylin sind spät dran. Der Bus steht schon an der Haltestelle. Was machen sie?"
                show: { object: bus }
                options: ["Sie rennen nicht und nehmen den nächsten Bus.", "Sie rennen schnell über die Straße zum Bus.", "Sie klopfen an die geschlossene Tür."]
                answer: "Sie rennen nicht und nehmen den nächsten Bus."
              - id: l1-n2
                type: true_false
                text: "Aylin stellt ihren Rucksack mitten in den Gang. Ist das gut?"
                say: "Aylin stellt ihren Rucksack mitten in den Gang. Ist das gut?"
                show: { object: schoolbag }
                answer: false
              - id: l1-n3
                type: sorting
                text: "Was macht Aylin an der Haltestelle, was im Bus?"
                say: "Was macht Aylin an der Haltestelle, was im Bus? Sortiere."
                bins:
                  - { id: halt, show: { text: "an der Haltestelle" }, say: "an der Haltestelle" }
                  - { id: bus, show: { text: "im Bus" }, say: "im Bus" }
                options:
                  - { text: "mit Abstand warten", bin: halt }
                  - { text: "den Halteknopf drücken", bin: bus }
                  - { text: "die Leute aussteigen lassen", bin: halt }
                  - { text: "sich an der Stange festhalten", bin: bus }
              - id: l1-n4
                type: image_multiple_choice
                text: "Can fragt: „An welchem Schild ist die Bushaltestelle?“"
                say: "Can fragt: An welchem Schild ist die Bushaltestelle?"
                options: [{ object: sign-cycle-path }, { object: sign-toilet }, { object: sign-bus-stop }]
                answer: sign-bus-stop
                option_audio: false
              - id: l1-n5
                type: fill_in_blank
                text: "Can sagt zu Aylin:"
                say: "Can sagt zu Aylin: Wir steigen erst ein, wenn der Bus steht und die Türen offen sind. Setz das passende Wort ein."
                frame: "Wir steigen erst ein, wenn der Bus _ und die Türen offen sind."
                options: ["steht", "fährt", "hupt"]
                answer: ["steht"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wann steigst du in den Bus ein?"
            say: "Wann steigst du in den Bus ein?"
            options: ["wenn er steht und die Türen offen sind", "wenn er noch fährt", "wenn er hupt"]
            answer: "wenn er steht und die Türen offen sind"
          - id: l1-c2
            type: true_false
            text: "An der Haltestelle darf man schubsen, wenn der Bus kommt."
            say: "An der Haltestelle darf man schubsen, wenn der Bus kommt. Stimmt das?"
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Welches Schild zeigt eine Bushaltestelle?"
            say: "Welches Schild zeigt eine Bushaltestelle?"
            options: [{ object: sign-bus-stop }, { object: traffic-light }, { object: sign-exit }]
            answer: sign-bus-stop
            option_audio: false
          - id: l1-c4
            type: true_false
            text: "Wenn kein Sitzplatz frei ist, halte ich mich im Bus fest."
            say: "Wenn kein Sitzplatz frei ist, halte ich mich im Bus fest. Stimmt das?"
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Wohin stellt Aylin ihren Rucksack im Bus?"
            say: "Wohin stellt Aylin ihren Rucksack im Bus?"
            options: ["vor ihre Füße", "in den Gang", "vor die Tür"]
            answer: "vor ihre Füße"
          - id: l1-c6
            type: fill_in_blank
            text: "Wie zeige ich, dass ich aussteigen will?"
            say: "Setz das passende Wort ein."
            frame: "Mit dem _ zeige ich, dass ich aussteigen will."
            options: ["Halteknopf", "Fahrplan", "Rucksack"]
            answer: ["Halteknopf"]

  - n: 2
    title: { de: "Aussteigen und weiterfahren", en: "Getting off and travelling on" }
    goal:
      de: "Steig sicher aus und geh danach sicher über die Straße. Du wartest, bis der Bus weggefahren ist."
      en: "Get off safely and then cross the road safely. You wait until the bus has driven away."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo wartest du auf den Bus?"
            say: "Wo wartest du auf den Bus?"
            options: ["mit Abstand zur Bordsteinkante", "direkt an der Bordsteinkante", "auf der Fahrbahn"]
            answer: "mit Abstand zur Bordsteinkante"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Im Bus ist es egal, ob ich mich festhalte."
            say: "Im Bus ist es egal, ob ich mich festhalte. Stimmt das?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Gleich vor dem Bus über die Straße?"
            say: "Aylin und Can steigen aus. Das Schwimmbad ist auf der anderen Straßenseite. Der Bus steht noch an der Haltestelle. Was glaubst du: Gehen die beiden gleich vor dem Bus über die Straße?"
            show: { object: bus }
          - text: "Nie vor oder hinter dem Bus über die Straße!"
            say: "Nein! Vor und hinter dem Bus sehen die Autofahrer Aylin nicht, und Aylin sieht die Autos nicht. Darum wartet sie, bis der Bus weggefahren ist. Dann kann sie die Straße gut sehen, schaut links, rechts, links und geht. Noch besser ist eine Ampel oder ein Zebrastreifen in der Nähe."
            show: { object: bus }
          - text: "Sitzen bleiben, bis der Bus hält."
            say: "Beim Aussteigen bleibt Aylin sitzen, bis der Bus hält. Dann steigt sie in Ruhe aus und geht ein paar Schritte vom Bus weg, damit er sicher losfahren kann."
            show: { object: bus }
          - text: "Am Bahnsteig hinter der weißen Linie warten"
            say: "Nach Hause fahren sie mit dem Zug. Am Bahnsteig wartet Aylin hinter der weißen Linie, bis der Zug hält. Auf die Gleise geht sie nie. Piept es an der Tür, steigt sie nicht mehr ein, denn die Türen gehen gleich zu."
            show: { object: station }
          - text: "Der Fahrplan zeigt, wann es losgeht."
            say: "An jeder Haltestelle hängt ein Fahrplan. Er zeigt, wann ein Bus abfährt. Hier fährt die Linie 4 um halb acht und um acht Uhr, die Linie 7 um Viertel vor acht und um Viertel nach acht. Viele Menschen schauen auch auf dem Handy nach, wann der nächste Bus kommt."
            show: { drawn: table, rows: [["Linie", "Abfahrt"], ["4", "7:30"], ["7", "7:45"], ["4", "8:00"], ["7", "8:15"]] }
          - text: "Wusstest du? Ein Gelenkbus ist etwa so lang wie vier Autos hintereinander."
            say: "Wusstest du? Ein langer Gelenkbus ist ungefähr 18 Meter lang, etwa so lang wie vier Autos hintereinander. In der Mitte hat er ein Gelenk, damit er um die Kurve kommt."
            show: { object: bus }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Aylin ist ausgestiegen. Wann geht sie über die Straße?"
                say: "Aylin ist ausgestiegen. Wann geht sie über die Straße?"
                options: ["wenn der Bus weggefahren ist", "sofort vor dem Bus", "sofort hinter dem Bus"]
                answer: "wenn der Bus weggefahren ist"
                hints:
                  - "Kann ein Autofahrer Aylin sehen, wenn sie hinter dem großen Bus hervorkommt?"
                  - "Der Bus versperrt die Sicht. Erst wenn er weg ist, ist alles gut zu sehen."
                  - "Wenn der Bus weggefahren ist."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Vor einem haltenden Bus können die Autofahrer dich gut sehen."
                say: "Vor einem haltenden Bus können die Autofahrer dich gut sehen. Stimmt das?"
                show: { object: bus }
                answer: false
                hints:
                  - "Wie groß ist ein Bus, und wie groß bist du?"
                  - "Der Bus verdeckt dich. Die Autofahrer sehen dich erst ganz spät."
                  - "Nein, das stimmt nicht."
              - id: l2-f3
                type: ordering
                text: "Aylin steigt aus. Was kommt zuerst?"
                say: "Aylin steigt aus. Was kommt zuerst? Leg die Karten in die richtige Reihenfolge."
                options: ["Sie wartet, bis der Bus weggefahren ist.", "Sie bleibt sitzen, bis der Bus hält.", "Sie schaut links, rechts, links und geht.", "Sie steigt aus und geht vom Bus weg."]
                slot_count: 4
                answer: ["Sie bleibt sitzen, bis der Bus hält.", "Sie steigt aus und geht vom Bus weg.", "Sie wartet, bis der Bus weggefahren ist.", "Sie schaut links, rechts, links und geht."]
                hints:
                  - "Was macht Aylin, solange der Bus noch fährt?"
                  - "Erst sitzen bleiben, dann aussteigen. Über die Straße geht sie ganz zum Schluss."
                  - "Sitzen bleiben, aussteigen, warten, schauen und gehen."
              - id: l2-f4
                type: multiple_choice
                text: "Wann fährt die Linie 7 zum ersten Mal?"
                say: "Schau auf den Fahrplan. Wann fährt die Linie 7 zum ersten Mal?"
                show: { drawn: table, rows: [["Linie", "Abfahrt"], ["4", "7:30"], ["7", "7:45"], ["4", "8:00"], ["7", "8:15"]] }
                options: ["7:30", "7:45", "8:15"]
                answer: "7:45"
                hints:
                  - "Such in der Spalte Linie die 7."
                  - "Die erste 7 steht in der zweiten Zeile. Daneben steht die Abfahrt."
                  - "Um 7:45 Uhr."
              - id: l2-f5
                type: sorting
                text: "Am Bahnsteig: sicher oder gefährlich?"
                say: "Am Bahnsteig: Was ist sicher, was ist gefährlich? Sortiere."
                bins:
                  - { id: sicher, show: { text: "sicher" }, say: "sicher" }
                  - { id: gefahr, show: { text: "gefährlich" }, say: "gefährlich" }
                options:
                  - { text: "hinter der weißen Linie warten", bin: sicher }
                  - { text: "über die Gleise laufen", bin: gefahr }
                  - { text: "einsteigen, wenn es an der Tür piept", bin: gefahr }
                  - { text: "warten, bis der Zug hält", bin: sicher }
                hints:
                  - "Wo kann der Zug dich nicht erwischen?"
                  - "Auf den Gleisen fährt der Zug. Wenn es piept, gehen die Türen zu."
                  - "Linie und Warten sind sicher, Gleise und Piepen sind gefährlich."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Am Bahnsteig wartet Aylin hinter der weißen Linie."
                say: "Am Bahnsteig wartet Aylin hinter der weißen Linie. Stimmt das?"
                show: { object: station }
                answer: true
                hints: ["Der Zug fährt nah an der Kante vorbei."]
              - id: l2-s2
                type: multiple_choice
                text: "Wo gehst du nach dem Aussteigen am sichersten über die Straße?"
                say: "Wo gehst du nach dem Aussteigen am sichersten über die Straße?"
                options: ["an der Ampel oder am Zebrastreifen", "direkt vor dem Bus", "hinter dem Bus"]
                answer: "an der Ampel oder am Zebrastreifen"
                hints: ["Wo halten die Autos für dich an?"]
              - id: l2-s3
                type: multiple_choice
                text: "Aylin ist um 7:40 an der Haltestelle. Sie will mit der Linie 4 fahren. Wann fährt ihr Bus?"
                say: "Schau auf den Fahrplan. Aylin ist um 7 Uhr 40 an der Haltestelle. Sie will mit der Linie 4 fahren. Wann fährt ihr Bus?"
                show: { drawn: table, rows: [["Linie", "Abfahrt"], ["4", "7:30"], ["7", "7:45"], ["4", "8:00"], ["7", "8:15"]] }
                options: ["7:30", "8:00", "7:45"]
                answer: "8:00"
                feedback:
                  "7:30": "Um 7:30 Uhr ist der Bus schon weg, Aylin kommt erst um 7:40 Uhr."
                hints: ["Such die Linie 4. Welche Abfahrt ist nach 7:40 Uhr?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Was mache ich, wenn es an der Tür piept?"
                say: "Setz das passende Wort ein."
