# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.seed-dispersal
skill: world.nature.seed-dispersal
curriculum: de-DE
language: de
title:
  de: Wie Samen reisen
  en: How seeds travel
summary: >
  Mia goes for walks with Opa Karl and her dog Bruno. Lesson 1 opens with
  a dandelion growing on the garage roof where nobody planted it: the
  wind carried its seed on a little umbrella. Maple seeds have a wing and
  spin like a helicopter. Seeds travel because under the parent plant
  there is too little light and space; seeds that fly are light. Lesson 2
  starts with the burrs in Bruno's fur: some seeds hook onto animals,
  birds eat berries and drop the seeds far away, squirrels hide acorns and
  forget some, and the coconut floats across the sea. It ends with the
  skill check. There are no pictures of dandelion, maple seed, burr,
  squirrel, acorn or coconut yet, so these are text cards.
metadata:
  year: klasse-2
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.plant-growth]
  also_practises: []
  vocabulary: { de: [Samen, Pusteblume, Löwenzahn, Ahorn, Schirmchen, Flügel, Klette, Haken, Beere, Eichel, Eichhörnchen, Kokosnuss, Mutterpflanze] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: why, what: { de: "erklären, warum Samen an neue Orte reisen", en: explaining why seeds travel to new places } }
    - { id: wind, what: { de: "erklären, wie Samen mit dem Wind reisen (Löwenzahn, Ahorn)", en: "explaining how seeds travel on the wind (dandelion, maple)" } }
    - { id: animals-water, what: { de: "erklären, wie Samen mit Tieren und mit dem Wasser reisen", en: explaining how seeds travel with animals and on water } }
  misconceptions:
    - id: seeds-only-planted
      what: Thinks plants only grow where people plant them
      addressed: lesson 1 Learn opens with the dandelion on the garage roof; l1-s4, l1-n3 and l2-c9
    - id: seeds-fall-straight-down
      what: Thinks seeds simply drop under the plant and grow there
      addressed: lesson 1 Learn says it is too dark and crowded under the parent plant and shows the spinning maple seed; l1-f4, l1-n2, l1-n5, l1-c3, l2-c1, l2-c4 and l2-c11
    - id: eaten-seed-gone
      what: Thinks a seed is gone for good once an animal has eaten it
      addressed: lesson 2 Learn shows the bird and the berry; l2-f3, l2-n3 and l2-c15
    - id: only-wind
      what: Thinks wind is the only way seeds travel
      addressed: lesson 2 Learn adds animals and water; l2-f2, l2-s5, l2-n5 and l2-c18
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Mit dem Wind unterwegs", en: "Travelling on the wind" }
    goal:
      de: "Finde heraus, wie Samen mit dem Wind reisen. Der Löwenzahnsamen fliegt zum Beispiel an einem kleinen Schirmchen."
      en: "Find out how seeds travel on the wind. The dandelion seed, for example, flies on a little umbrella."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was braucht ein Samen, damit er keimt?"
            say: "Was braucht ein Samen, damit er keimt?"
            options: ["Wasser und Wärme", "Schnee und Eis", "eine trockene Dose"]
            answer: "Wasser und Wärme"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Aus den Blüten werden Früchte mit neuen Samen."
            say: "Stimmt das? Aus den Blüten werden Früchte mit neuen Samen."
            show: { object: flower }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie kommt der Löwenzahn aufs Dach?"
            say: "Mia und Opa Karl gehen spazieren. Oben auf dem Garagendach wächst ein gelber Löwenzahn. Niemand hat ihn dort gepflanzt. Was glaubst du: Wie ist sein Samen da hinaufgekommen?"
            show: { object: house }
          - text: "Der Wind hat ihn getragen."
            say: "Mit dem Wind! Aus der gelben Löwenzahnblüte wird eine Pusteblume. Jeder Samen hat ein kleines Schirmchen. Der Wind trägt die Schirmchen weit fort, manchmal bis auf ein Dach. Dort landet der Samen und keimt."
            show: { objects: [dandelion-clock, wind] }
          - text: "Ahornsamen haben einen Flügel."
            say: "Im Herbst fallen vom Ahornbaum Samen mit einem Flügel. Sie drehen sich beim Fallen wie ein kleiner Hubschrauber. So fallen sie langsam, und der Wind kann sie ein Stück vom Baum wegtragen."
            show: { object: maple-seed }
          - text: "Warum reisen Samen?"
            say: "Warum wollen Samen überhaupt weg? Unter der Mutterpflanze ist es eng und schattig. Dort fehlen den jungen Pflanzen Licht und Platz. Weiter weg haben sie mehr davon."
            show: { objects: [tree, sun] }
          - text: "Samen, die fliegen, sind leicht."
            say: "Samen, die mit dem Wind reisen, sind meist sehr leicht. Sie haben Schirmchen, Flügel oder feine Haare. Ein schwerer Samen, rund wie eine Nuss, fliegt nicht weit."
            show: { object: feather }
          - text: "Wusstest du? Ahornsamen heißen auch Nasenzwicker."
            say: "Wusstest du? Viele Kinder spalten die Ahornsamen unten auf und kleben sie sich auf die Nase. Darum nennt man sie auch Nasenzwicker."
            show: { object: nose }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wer trägt die Samen der Pusteblume fort?"
                say: "Wer trägt die Samen der Pusteblume fort?"
                show: { object: dandelion-clock }
                options: ["der Wind", "der Regenwurm", "die Schnecke"]
                answer: "der Wind"
                feedback:
                  "die Schnecke": "Eine Schnecke ist viel zu langsam für so eine Reise! Der Wind trägt die Samen fort."
                hints:
                  - "Denk an den Löwenzahn auf dem Garagendach."
                  - "Die Samen fliegen an kleinen Schirmchen durch die Luft."
                  - "Der Wind trägt sie fort."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Jeder Löwenzahnsamen hat ein kleines Schirmchen."
                say: "Stimmt das? Jeder Löwenzahnsamen hat ein kleines Schirmchen."
                show: { object: dandelion-clock }
                answer: true
                hints:
                  - "Wie fliegt der Samen der Pusteblume?"
                  - "Er schwebt wie ein Fallschirm durch die Luft."
                  - "Ja. Jeder Löwenzahnsamen hat ein Schirmchen."
              - id: l1-f3
                type: sorting
                text: "Löwenzahn oder Ahorn?"
                say: "Sortiere. Was passt zum Löwenzahn, was zum Ahorn?"
                bins:
                  - { id: loewenzahn, show: { object: dandelion-clock }, say: "Löwenzahn" }
                  - { id: ahorn, show: { object: maple-seed }, say: "Ahorn" }
                options:
                  - { text: "schwebt an einem Schirmchen", bin: loewenzahn }
                  - { text: "dreht sich wie ein Hubschrauber", bin: ahorn }
                  - { text: "wächst aus einer gelben Blüte", bin: loewenzahn }
                  - { text: "fällt im Herbst vom Baum", bin: ahorn }
                hints:
                  - "Der Löwenzahn ist eine kleine Blume, der Ahorn ist ein Baum."
                  - "Der Löwenzahnsamen hat ein Schirmchen, der Ahornsamen einen Flügel."
                  - "Schirmchen und gelbe Blüte zum Löwenzahn, Hubschrauber und Baum zum Ahorn."
              - id: l1-f4
                type: multiple_choice
                text: "Warum fliegen Samen von der Mutterpflanze weg?"
                say: "Warum fliegen Samen von der Mutterpflanze weg?"
                options: ["Unter der Mutterpflanze fehlen Licht und Platz.", "Die Mutterpflanze mag sie nicht.", "Sie wollen in den Urlaub."]
                answer: "Unter der Mutterpflanze fehlen Licht und Platz."
                hints:
                  - "Denk daran, was eine junge Pflanze zum Wachsen braucht."
                  - "Unter einem großen Baum ist es schattig und eng."
                  - "Unter der Mutterpflanze fehlen Licht und Platz."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was hilft dem Ahornsamen, weit zu fliegen?"
                say: "Was hilft dem Ahornsamen, weit zu fliegen?"
                options: [{ object: wind }, { object: stone }, { object: snail }]
                answer: wind
                hints:
                  - "Der Ahornsamen dreht sich und fällt langsam."
                  - "Etwas Unsichtbares kann ihn dabei forttragen."
                  - "Der Wind hilft ihm."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Schirmchen und Flügel"
                say: "Setz die passenden Wörter ein."
                frame: "Der Löwenzahn hat Samen mit _. Der Ahorn hat Samen mit einem _."
                options: ["Schirmchen", "Flügel", "Haken"]
                answer: ["Schirmchen", "Flügel"]
                hints: ["Der eine Samen schwebt, der andere dreht sich wie ein Hubschrauber."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Samen, die mit dem Wind reisen, sind schwer wie ein Stein."
                say: "Stimmt das? Samen, die mit dem Wind reisen, sind schwer wie ein Stein."
                show: { object: stone }
                answer: false
                hints: ["Kann der Wind einen Stein forttragen?"]
              - id: l1-s3
                type: multiple_choice
                text: "Wie fällt ein Ahornsamen vom Baum?"
                say: "Wie fällt ein Ahornsamen vom Baum?"
                show: { object: maple-seed }
                options: ["Er dreht sich wie ein Hubschrauber.", "Er fällt gerade wie ein Stein.", "Er hüpft wie ein Frosch."]
                answer: "Er dreht sich wie ein Hubschrauber."
                hints: ["Denk an seinen Flügel."]
              - id: l1-s4
                type: ordering
                text: "Wie kommt der Löwenzahn aufs Dach?"
                say: "Wie kommt der Löwenzahn aufs Dach? Leg die Karten in die richtige Reihenfolge."
                options: ["Der Wind trägt das Schirmchen fort.", "Der Samen landet auf dem Dach und keimt.", "Aus der Blüte wird eine Pusteblume."]
                slot_count: 3
                answer: ["Aus der Blüte wird eine Pusteblume.", "Der Wind trägt das Schirmchen fort.", "Der Samen landet auf dem Dach und keimt."]
                hints: ["Zuerst muss aus der gelben Blüte etwas werden, das fliegen kann."]
              - id: l1-s5
                type: sorting
                text: "Fliegt dieser Samen gut mit dem Wind?"
                say: "Sortiere. Welcher Samen fliegt gut mit dem Wind, welcher nicht?"
                bins:
                  - { id: ja, show: { text: "fliegt gut" }, say: "fliegt gut" }
                  - { id: nein, show: { text: "fliegt nicht gut" }, say: "fliegt nicht gut" }
                options:
                  - { text: "leicht, mit Schirmchen", bin: ja }
                  - { text: "schwer und rund wie eine Nuss", bin: nein }
                  - { text: "leicht, mit einem Flügel", bin: ja }
                  - { text: "groß und schwer wie ein Apfel", bin: nein }
                hints: ["Der Wind trägt nur leichte Samen weit."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Mia pustet eine Pusteblume an. Was fliegt da durch die Luft?"
                say: "Mia pustet eine Pusteblume an. Was fliegt da durch die Luft?"
                show: { object: dandelion-clock }
                options: ["die Samen", "die Blätter", "die Wurzeln"]
                answer: "die Samen"
              - id: l1-n2
                type: true_false
                text: "Opa Karl sagt: „Unter einem großen Ahorn ist es schattig. Da wachsen junge Ahornbäume schlecht.“ Stimmt das?"
                say: "Opa Karl sagt: Unter einem großen Ahorn ist es schattig. Da wachsen junge Ahornbäume schlecht. Stimmt das?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Mia findet einen Löwenzahn in einer Mauerritze. Wie ist er dorthin gekommen?"
                say: "Mia findet einen Löwenzahn in einer Mauerritze. Wie ist er dorthin gekommen?"
                show: { object: dandelion }
                options: ["Der Wind hat den Samen hingeweht.", "Er ist aus dem Stein gewachsen.", "Er ist hingelaufen."]
                answer: "Der Wind hat den Samen hingeweht."
              - id: l1-n4
                type: fill_in_blank
                text: "Mia schreibt in ihr Naturheft."
                say: "Mia schreibt in ihr Naturheft. Setz die passenden Wörter ein."
                frame: "Ahornsamen haben einen _. Sie drehen sich wie ein _."
                options: ["Flügel", "Hubschrauber", "Schirm", "Ball"]
                answer: ["Flügel", "Hubschrauber"]
              - id: l1-n5
                type: true_false
                text: "Mia sagt: „Ein Ahornsamen fällt immer genau unter den Baum.“ Stimmt das?"
                say: "Mia sagt: Ein Ahornsamen fällt immer genau unter den Baum. Stimmt das?"
                show: { object: maple-seed }
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Womit reisen Löwenzahnsamen?"
            say: "Womit reisen Löwenzahnsamen?"
            show: { object: dandelion-clock }
            options: ["mit dem Wind", "mit dem Zug", "mit der Post"]
            answer: "mit dem Wind"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ahornsamen haben einen Flügel."
            say: "Stimmt das? Ahornsamen haben einen Flügel."
            show: { object: maple-seed }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Warum ist es gut, wenn Samen weit fliegen?"
            say: "Warum ist es gut, wenn Samen weit fliegen?"
            options: ["Weiter weg haben die jungen Pflanzen mehr Licht und Platz.", "Dann werden sie schneller rot.", "Dann müssen sie nicht keimen."]
            answer: "Weiter weg haben die jungen Pflanzen mehr Licht und Platz."
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Die Samen der Pusteblume haben Flügel."
            say: "Stimmt das? Die Samen der Pusteblume haben Flügel."
            show: { object: dandelion-clock }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Was trägt die Samen der Pusteblume fort?"
            say: "Was trägt die Samen der Pusteblume fort?"
            options: [{ object: wind }, { object: car }, { object: snail }]
            answer: wind
          - id: l1-c6
            type: fill_in_blank
            text: "Leichte Samen"
            say: "Setz das passende Wort ein."
            frame: "Leichte Samen trägt der _ fort."
            options: ["Wind", "Regenwurm", "Stein"]
            answer: ["Wind"]

  - n: 2
    title: { de: "Mit Tieren und mit dem Wasser", en: "With animals and on water" }
    goal:
      de: "Finde heraus, wie Samen mit Tieren und mit dem Wasser reisen. Kletten halten sich zum Beispiel mit Haken im Fell fest."
      en: "Find out how seeds travel with animals and on water. Burrs, for example, hold on to fur with hooks."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie reist der Löwenzahnsamen?"
            say: "Wie reist der Löwenzahnsamen?"
            show: { object: dandelion-clock }
            options: ["Er schwebt mit dem Wind.", "Er rollt den Berg hinunter.", "Er fährt mit dem Bus."]
            answer: "Er schwebt mit dem Wind."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Ahornsamen drehen sich beim Fallen."
            say: "Stimmt das? Ahornsamen drehen sich beim Fallen."
            show: { object: maple-seed }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was hängt in Brunos Fell?"
            say: "Nach dem Spaziergang hat Mias Hund Bruno lauter kleine Kugeln im Fell. Sie halten fest wie ein Klettverschluss. Was glaubst du: Was sind das für Kugeln?"
            show: { object: dog }
          - text: "Kletten halten sich mit Haken fest."
            say: "Das sind Früchte der Klette mit Samen darin. Sie haben winzige Haken. Damit halten sie sich im Fell von Tieren fest, und auch an Socken und Hosen. Irgendwo fallen sie ab, und dort können die Samen keimen."
            show: { objects: [dog, burdock] }
          - text: "Vögel fressen Beeren."
            say: "Ein Vogel frisst rote Beeren. Die Samen in den Beeren kann er nicht verdauen. Sie kommen später mit seinem Kot wieder heraus, oft weit weg vom Strauch. Dort kann ein neuer Strauch wachsen."
            show: { objects: [bird, berries] }
          - text: "Eichhörnchen verstecken Eicheln."
            say: "Im Herbst versteckt das Eichhörnchen Nüsse und Eicheln in der Erde, als Vorrat für den Winter. Manche findet es nicht wieder. Aus einer vergessenen Eichel kann eine neue Eiche wachsen."
            show: { objects: [squirrel, acorn] }
          - text: "Die Kokosnuss schwimmt."
            say: "Manche Samen reisen mit dem Wasser. Die Kokosnuss hat eine dicke Hülle mit viel Luft darin. Darum schwimmt sie. Sie kann wochenlang im Meer treiben und an einem fernen Strand keimen."
            show: { object: coconut }
          - text: "Wusstest du? Kletten haben den Klettverschluss erfunden."
            say: "Wusstest du? Ein Mann aus der Schweiz kam mit seinem Hund vom Spaziergang. Beide waren voller Kletten. Er hat sich die winzigen Haken genau angeschaut und danach den Klettverschluss erfunden."
            show: { object: shoe }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wie halten sich Kletten im Fell fest?"
                say: "Wie halten sich Kletten im Fell fest?"
                show: { object: burdock }
                options: ["mit winzigen Haken", "mit Kleber", "mit Flügeln"]
                answer: "mit winzigen Haken"
                hints:
                  - "Denk an den Klettverschluss."
                  - "Schau dir die Klette genau an: Sie ist voller kleiner, gebogener Spitzen."
                  - "Kletten halten sich mit winzigen Haken fest."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Mit dem Wind oder mit Tieren?"
                say: "Sortiere. Welche Samen reisen mit dem Wind, welche mit Tieren?"
                bins:
                  - { id: wind, show: { object: wind }, say: "mit dem Wind" }
                  - { id: tiere, show: { text: "mit Tieren" }, say: "mit Tieren" }
                options:
                  - { object: dandelion-clock, bin: wind }
                  - { object: burdock, bin: tiere }
                  - { object: berries, bin: tiere }
                  - { object: maple-seed, bin: wind }
                hints:
                  - "Welche Samen haben Schirmchen oder Flügel?"
                  - "Pusteblume und Ahorn fliegen. Kletten hängen im Fell, Beeren frisst der Vogel."
                  - "Pusteblume und Ahorn zum Wind, Klette und Beeren zu den Tieren."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Ein Vogel frisst Beeren und trägt so Samen an neue Orte."
                say: "Stimmt das? Ein Vogel frisst Beeren und trägt so Samen an neue Orte."
                show: { object: bird }
                answer: true
                hints:
                  - "Was passiert mit den Samen im Bauch des Vogels?"
                  - "Der Vogel kann die Samen nicht verdauen. Sie kommen woanders wieder heraus."
                  - "Ja. So bringt der Vogel Samen an neue Orte."
              - id: l2-f4
                type: image_multiple_choice
                text: "Welches Tier bringt Kletten im Fell mit nach Hause?"
                say: "Welches Tier bringt Kletten im Fell mit nach Hause?"
                options: [{ object: dog }, { object: fish }, { object: snail }]
                answer: dog
                feedback:
                  fish: "Ein Fisch hat kein Fell, nur glatte Schuppen. Da hält keine Klette. Der Hund bringt Kletten mit."
                hints:
                  - "Kletten brauchen Fell, um sich festzuhalten."
                  - "Fisch und Schnecke haben kein Fell."
                  - "Der Hund bringt Kletten mit."
              - id: l2-f5
                type: multiple_choice
                text: "Warum wächst manchmal eine Eiche, wo niemand sie gepflanzt hat?"
                say: "Warum wächst manchmal eine Eiche, wo niemand sie gepflanzt hat?"
                options: ["Ein Eichhörnchen hat eine Eichel versteckt und vergessen.", "Der Regen hat sie gebaut.", "Eine Biene hat sie gepflanzt."]
                answer: "Ein Eichhörnchen hat eine Eichel versteckt und vergessen."
                hints:
                  - "Aus einer Eichel kann eine Eiche wachsen."
                  - "Wer versteckt im Herbst Eicheln als Vorrat in der Erde?"
                  - "Ein Eichhörnchen hat die Eichel versteckt und vergessen."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Wie reist der Samen?"
                say: "Verbinde jeden Samen mit dem, wie er reist."
                pairs:
                  - { left: { object: burdock }, right: { text: "hält sich im Fell fest" } }
                  - { left: { object: berries }, right: { text: "wird von Vögeln gefressen" } }
                  - { left: { object: acorn }, right: { text: "wird vom Eichhörnchen versteckt" } }
                  - { left: { object: coconut }, right: { text: "schwimmt im Meer" } }
                hints: ["Die Klette hat Haken, die Kokosnuss viel Luft in der Hülle."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Die Kokosnuss geht im Wasser sofort unter."
                say: "Stimmt das? Die Kokosnuss geht im Wasser sofort unter."
                show: { object: coconut }
                answer: false
                hints: ["In der dicken Hülle der Kokosnuss ist viel Luft."]
              - id: l2-s3
                type: fill_in_blank
                text: "Haken und Wasser"
                say: "Setz die passenden Wörter ein."
                show: { objects: [burdock, coconut] }
                frame: "Die Klette hat winzige _. Die Kokosnuss kann im Meer _."
                options: ["Haken", "schwimmen", "Flügel", "fliegen"]
                answer: ["Haken", "schwimmen"]
                hints: ["Das eine hält sich fest, das andere treibt auf dem Wasser."]
              - id: l2-s4
                type: image_multiple_choice
                text: "Welches Tier frisst Beeren vom Strauch und fliegt dann weiter?"
                say: "Welches Tier frisst Beeren vom Strauch und fliegt dann weiter?"
                options: [{ object: bird }, { object: fish }, { object: worm }]
                answer: bird
                hints: ["Nur eines dieser Tiere kann fliegen."]
              - id: l2-s5
                type: sorting
                text: "Wind, Tiere oder Wasser?"
                say: "Sortiere. Wie reist der Samen: mit dem Wind, mit Tieren oder mit dem Wasser?"
                bins:
                  - { id: wind, show: { text: "Wind" }, say: "mit dem Wind" }
                  - { id: tiere, show: { text: "Tiere" }, say: "mit Tieren" }
                  - { id: wasser, show: { text: "Wasser" }, say: "mit dem Wasser" }
                options:
                  - { object: maple-seed, bin: wind }
                  - { object: acorn, bin: tiere }
                  - { object: coconut, bin: wasser }
                  - { object: burdock, bin: tiere }
                hints: ["Der Ahorn hat einen Flügel, die Kokosnuss schwimmt."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Mia zupft Bruno die Kletten aus dem Fell und wirft sie am Waldrand auf den Boden. Was kann dort passieren?"
                say: "Mia zupft Bruno die Kletten aus dem Fell und wirft sie am Waldrand auf den Boden. Was kann dort passieren?"
                show: { object: burdock }
