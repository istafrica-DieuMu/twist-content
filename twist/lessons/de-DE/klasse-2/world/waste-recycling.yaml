# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.waste-recycling
skill: world.nature.waste-recycling
curriculum: de-DE
language: de
title:
  de: Müll trennen und vermeiden
  en: Sorting and avoiding rubbish
summary: >
  Aylin helps her family after Sunday breakfast and on a shopping trip.
  Lesson 1 sorts the kitchen rubbish as most German towns do: food scraps
  into the Biomüll (it becomes compost), paper and card into the
  Altpapier, packaging of plastic and metal and drink cartons into the
  Gelber Sack or Gelbe Tonne, the rest into the Restmüll; used tissues do
  not go into the paper. It says that the rules vary a little from town
  to town. Lesson 2 takes Pfand bottles and cans back to the shop, sorts
  glass by colour at the bottle bank (lids into the Gelber Sack), keeps
  batteries and litter out of the bins and out of nature, and shows how
  to make less rubbish: cloth bag, lunch box, refillable bottle, repair
  and give away. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Umwelt schützen, en: Caring for the environment }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.materials-sort]
  also_practises: []
  vocabulary: { de: [Müll, trennen, Biomüll, Altpapier, Gelber Sack, Restmüll, Altglas, Pfand, Verpackung, wiederverwerten, vermeiden] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: sort, what: { de: "Müll in Biomüll, Altpapier, Gelben Sack und Restmüll trennen", en: "sorting rubbish into food waste, paper, packaging and general waste" } }
    - { id: glass-pfand, what: { de: "Glas nach Farben sortieren und Pfandflaschen zurückbringen", en: sorting glass by colour and taking deposit bottles back } }
    - { id: why, what: { de: "erklären, warum man Müll trennt und nicht in die Natur wirft", en: explaining why we sort rubbish and never drop it outside } }
    - { id: avoid, what: { de: "sagen, wie ich weniger Müll mache", en: saying how I can make less rubbish } }
  misconceptions:
    - id: one-bin
      what: Thinks it does not matter which bin rubbish goes into
      addressed: lesson 1 Learn says what becomes of paper and food scraps, and the Wusstest du screen on plastic bottles; l1-s4, l1-n5, l1-c6; l2-c11 to l2-c14
    - id: carton-is-paper
      what: Thinks a drink carton goes into the paper bin
      addressed: lesson 1 Learn names milk cartons with the Gelber Sack; l1-s2, l1-c5; l2-c5
    - id: tissue-is-paper
      what: Thinks used tissues belong in the paper bin
      addressed: lesson 1 Learn says used tissues are dirty and do not go into the paper; l1-s1
    - id: lid-with-glass
      what: Puts the metal lid into the bottle bank with the jar
      addressed: lesson 2 Learn has Aylin take the lid off first; l2-f3, l2-n3, l2-n4, l2-n5; l2-c10
    - id: pfand-in-bin
      what: Throws deposit bottles and cans into the bin
      addressed: lesson 2 Learn opens with the guess about Papa's empty bottles; l2-f1, l2-f5, l2-n1, l2-n5; l2-c6
    - id: litter-disappears
      what: Thinks rubbish left outside just goes away
      addressed: lesson 2 Learn on the can in the park; l2-n2 and l2-c15
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Welche Tonne?", en: "Which bin?" }
    goal:
      de: "Finde heraus, welcher Müll in welche Tonne kommt. Die Bananenschale kommt zum Beispiel in den Biomüll."
      en: "Find out which rubbish goes into which bin. A banana skin, for example, goes into the food waste bin."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was ist aus Pappe?"
            say: "Was ist aus Pappe?"
            options: [{ object: cereal-box }, { object: spoon }, { object: marble }]
            answer: cereal-box
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Woraus ist eine Konservendose?"
            say: "Woraus ist eine Konservendose?"
            options: ["aus Metall", "aus Papier", "aus Holz"]
            answer: "aus Metall"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wohin kommt die Bananenschale?"
            say: "Sonntagsfrühstück bei Familie Kaya. Danach hilft Aylin beim Aufräumen. In der Küche stehen vier Mülleimer. Was glaubst du: Wohin kommt die Bananenschale?"
            show: { object: banana }
          - text: "Biomüll: Reste von Obst und Gemüse"
            say: "In den Biomüll! Dort kommen Reste von Obst und Gemüse, Eierschalen und Kaffeesatz. In vielen Orten ist die Biotonne braun. Aus dem Bioabfall wird später neue Erde, der Kompost."
            show: { objects: [bio-bin, banana] }
          - text: "Altpapier: Papier und Pappe"
            say: "Die leere Müslipackung ist aus Pappe. Sie kommt ins Altpapier, in vielen Orten in die blaue Tonne. Auch Zeitungen, Kartons und alte Hefte gehören dazu. Aus altem Papier macht man neues Papier. Benutzte Taschentücher sind schmutzig, sie gehören nicht ins Altpapier."
            show: { objects: [paper-bin, cereal-box] }
          - text: "Gelber Sack: Verpackungen aus Kunststoff und Metall"
            say: "Der leere Joghurtbecher ist aus Kunststoff. Er kommt in den Gelben Sack oder in die Gelbe Tonne. Dort sammelt man Verpackungen aus Kunststoff und Metall, zum Beispiel Plastikschalen und Konservendosen. Auch leere Milchtüten kommen hinein."
            show: { object: yellow-bag }
          - text: "Restmüll: was übrig bleibt"
            say: "In den Restmüll kommt, was man nicht wiederverwerten kann, zum Beispiel Windeln und Staubsaugerbeutel. Die Restmülltonne ist meist grau oder schwarz. Wie genau getrennt wird, ist von Ort zu Ort ein bisschen verschieden. Frag zu Hause nach, wie es bei euch ist!"
            show: { object: residual-bin }
          - text: "Wusstest du? Aus alten Plastikflaschen kann man Pullover machen."
            say: "Wusstest du? Aus alten Plastikflaschen kann man feine Fäden machen. Daraus wird Stoff, zum Beispiel für weiche Fleece-Pullover. Vielleicht trägst du gerade alte Flaschen!"
            show: { object: jumper }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was kommt in den Biomüll?"
                say: "Was kommt in den Biomüll?"
                options: [{ object: banana }, { object: cereal-box }, { object: box }]
                answer: banana
                hints:
                  - "In den Biomüll kommen Reste von etwas, das man isst."
                  - "Müslipackung und Karton sind aus Pappe. Was ist ein Rest von Obst?"
                  - "Die Bananenschale kommt in den Biomüll."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Biomüll oder Altpapier?"
                say: "Sortiere. Was kommt in den Biomüll, was ins Altpapier?"
                bins:
                  - { id: bio, show: { object: bio-bin }, say: "Biomüll" }
                  - { id: papier, show: { object: paper-bin }, say: "Altpapier" }
                options:
                  - { object: apple-core, bin: bio }
                  - { object: cereal-box, bin: papier }
                  - { object: eggshells, bin: bio }
                  - { object: box, bin: papier }
                hints:
                  - "Frag dich: Ist es ein Essensrest oder ist es aus Papier?"
                  - "Apfelrest und Eierschalen bleiben vom Essen übrig."
                  - "Apfelrest und Eierschalen in den Biomüll, Müslipackung und Karton ins Altpapier."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Der leere Joghurtbecher kommt in den Gelben Sack."
                say: "Stimmt das? Der leere Joghurtbecher kommt in den Gelben Sack."
                show: { object: yoghurt-pot }
                answer: true
                hints:
                  - "Woraus ist ein Joghurtbecher?"
                  - "Er ist eine Verpackung aus Kunststoff."
                  - "Ja. Verpackungen aus Kunststoff kommen in den Gelben Sack."
              - id: l1-f4
                type: multiple_choice
                text: "Wohin kommt die alte Zeitung?"
                say: "Wohin kommt die alte Zeitung?"
                show: { object: newspaper }
                options: ["ins Altpapier", "in den Biomüll", "in den Gelben Sack"]
                answer: "ins Altpapier"
                feedback:
                  "in den Biomüll": "Eine Zeitung kann man nicht essen, auch wenn sie manchmal langweilig ist! Sie kommt ins Altpapier."
                hints:
                  - "Woraus ist eine Zeitung?"
                  - "Sie ist aus Papier, wie die Müslipackung aus Pappe."
                  - "Die Zeitung kommt ins Altpapier."
              - id: l1-f5
                type: matching
                text: "Wohin kommt der Müll?"
                say: "Verbinde jeden Müll mit seiner Tonne."
                pairs:
                  - { left: { object: banana, say: "Bananenschale" }, right: { text: "Biomüll" } }
                  - { left: { object: cereal-box, say: "leere Müslipackung" }, right: { text: "Altpapier" } }
                  - { left: { object: yoghurt-pot }, right: { text: "Gelber Sack" } }
                hints:
                  - "Fang mit dem Rest vom Essen an."
                  - "Die Müslipackung ist aus Pappe, der Becher aus Kunststoff."
                  - "Bananenschale in den Biomüll, Müslipackung ins Altpapier, Joghurtbecher in den Gelben Sack."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Ein benutztes Taschentuch kommt ins Altpapier."
                say: "Stimmt das? Ein benutztes Taschentuch kommt ins Altpapier."
                show: { object: tissue }
                answer: false
                hints: ["Ist ein benutztes Taschentuch sauber?"]
              - id: l1-s2
                type: sorting
                text: "In welche Tonne kommt es?"
                say: "Sortiere. In welche Tonne kommt es?"
                bins:
                  - { id: gelb, show: { object: yellow-bag }, say: "Gelber Sack" }
                  - { id: papier, show: { object: paper-bin }, say: "Altpapier" }
                  - { id: bio, show: { object: bio-bin }, say: "Biomüll" }
                options:
                  - { object: tin-can, bin: gelb }
                  - { object: box, bin: papier }
                  - { object: potato-peel, bin: bio }
                  - { object: milk-carton, bin: gelb }
                hints: ["Verpackungen aus Kunststoff und Metall und Milchtüten kommen in den Gelben Sack."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Was kommt ins Altpapier?"
                say: "Was kommt ins Altpapier?"
                options: [{ object: cereal-box }, { object: banana }, { object: egg }]
                answer: cereal-box
                hints: ["Was ist aus Pappe?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Was wird aus dem Müll?"
                say: "Setz die passenden Wörter ein."
                frame: "Aus altem Papier macht man neues _. Aus Bioabfall wird neue _."
                options: ["Papier", "Erde", "Glas"]
                answer: ["Papier", "Erde"]
                hints: ["Bioabfall wird zu Kompost. Darin wachsen Pflanzen."]
              - id: l1-s5
                type: multiple_choice
                text: "Wohin kommt ein voller Staubsaugerbeutel?"
                say: "Wohin kommt ein voller Staubsaugerbeutel?"
                show: { object: vacuum-bag }
                options: ["in den Restmüll", "ins Altpapier", "in den Biomüll"]
                answer: "in den Restmüll"
                hints: ["Daraus kann man nichts Neues machen. Wohin kommt so ein Müll?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: sorting
                text: "Aylin räumt den Frühstückstisch ab. Wohin kommt der Müll?"
                say: "Aylin räumt den Frühstückstisch ab. Sortiere. Wohin kommt der Müll?"
                bins:
                  - { id: bio, show: { object: bio-bin }, say: "Biomüll" }
                  - { id: papier, show: { object: paper-bin }, say: "Altpapier" }
                  - { id: gelb, show: { object: yellow-bag }, say: "Gelber Sack" }
                  - { id: rest, show: { object: residual-bin }, say: "Restmüll" }
                options:
                  - { object: coffee-grounds, bin: bio }
                  - { object: cereal-box, bin: papier }
                  - { object: yoghurt-pot, bin: gelb }
                  - { object: nappy, say: "Windel vom kleinen Bruder", bin: rest }
              - id: l1-n2
                type: true_false
                text: "Aylin will die Eierschalen in den Gelben Sack werfen. Stimmt das so?"
                say: "Aylin will die Eierschalen in den Gelben Sack werfen. Stimmt das so?"
                show: { object: eggshells }
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Papa hat Erdbeeren in einer Plastikschale gekauft. Wohin kommt die leere Schale?"
                say: "Papa hat Erdbeeren in einer Plastikschale gekauft. Wohin kommt die leere Schale?"
                show: { object: strawberry }
                options: ["in den Gelben Sack", "in den Biomüll", "ins Altpapier"]
                answer: "in den Gelben Sack"
              - id: l1-n4
                type: fill_in_blank
                text: "Aylin erklärt ihrem kleinen Bruder, wohin der Müll kommt."
                say: "Aylin erklärt ihrem kleinen Bruder, wohin der Müll kommt. Setz die passenden Wörter ein."
                frame: "Die Bananenschale kommt in den _. Den Karton bringen wir zum _."
                options: ["Biomüll", "Altpapier", "Gelben Sack"]
                answer: ["Biomüll", "Altpapier"]
              - id: l1-n5
                type: ordering
                text: "Was passiert mit Aylins alter Zeitung?"
                say: "Was passiert mit Aylins alter Zeitung? Leg die Karten in die richtige Reihenfolge."
                show: { object: newspaper }
                options: ["In einer Fabrik wird daraus neues Papier.", "Aylin wirft die Zeitung ins Altpapier.", "Ein Müllauto holt das Altpapier ab."]
                slot_count: 3
                answer: ["Aylin wirft die Zeitung ins Altpapier.", "Ein Müllauto holt das Altpapier ab.", "In einer Fabrik wird daraus neues Papier."]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was kommt in den Biomüll?"
            say: "Was kommt in den Biomüll?"
            options: [{ object: box }, { object: banana }, { object: cereal-box }]
            answer: banana
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Die leere Müslipackung kommt ins Altpapier."
            say: "Stimmt das? Die leere Müslipackung kommt ins Altpapier."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wohin kommt eine leere Konservendose?"
            say: "Wohin kommt eine leere Konservendose?"
            show: { object: tin-can }
            options: ["in den Gelben Sack", "in den Biomüll", "ins Altpapier"]
            answer: "in den Gelben Sack"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Eierschalen kommen ins Altpapier."
            say: "Stimmt das? Eierschalen kommen ins Altpapier."
            show: { object: eggshells }
            answer: false
          - id: l1-c5
            type: sorting
            text: "Biomüll oder Gelber Sack?"
            say: "Sortiere. Was kommt in den Biomüll, was in den Gelben Sack?"
            bins:
              - { id: bio, show: { object: bio-bin }, say: "Biomüll" }
              - { id: gelb, show: { object: yellow-bag }, say: "Gelber Sack" }
            options:
              - { object: banana-peel, bin: bio }
              - { object: yoghurt-pot, bin: gelb }
              - { object: apple-core, bin: bio }
              - { object: milk-carton, bin: gelb }
          - id: l1-c6
            type: fill_in_blank
            text: "Was wird aus Altpapier?"
            say: "Setz das passende Wort ein."
            frame: "Aus altem Papier macht man neues _."
            options: ["Papier", "Brot", "Glas"]
            answer: ["Papier"]

  - n: 2
    title: { de: "Glas, Pfand und weniger Müll", en: "Glass, deposits and less rubbish" }
    goal:
      de: "Finde heraus, wohin Glas und Pfandflaschen kommen und wie du weniger Müll machst. Mit einem Stoffbeutel brauchst du zum Beispiel keine Plastiktüte."
      en: "Find out where glass and deposit bottles go and how you can make less rubbish. With a cloth bag, for example, you need no plastic bag."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wohin kommt die Bananenschale?"
            say: "Wohin kommt die Bananenschale?"
            show: { object: banana }
            options: ["in den Biomüll", "in den Gelben Sack", "ins Altpapier"]
            answer: "in den Biomüll"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Joghurtbecher kommt ins Altpapier."
            say: "Stimmt das? Der Joghurtbecher kommt ins Altpapier."
            show: { object: yoghurt-pot }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was will Papa mit den leeren Flaschen?"
            say: "Aylin und Papa gehen einkaufen. Papa nimmt eine Tasche mit leeren Plastikflaschen und Dosen mit. Was glaubst du: Was will er damit im Supermarkt?"
            show: { objects: [bottle, supermarket] }
          - text: "Pfand: Flaschen und Dosen zurück in den Laden"
            say: "Er bringt sie zurück! Auf vielen Flaschen und Dosen ist ein Pfandzeichen. Beim Kaufen bezahlt man dafür etwas mehr, das Pfand. Gibt man die Flasche oder Dose im Laden am Pfandautomaten zurück, bekommt man das Geld wieder, für viele Plastikflaschen und Dosen 25 Cent. Pfandflaschen gehören also nicht in den Müll."
            show: { object: bottle }
          - text: "Altglas: nach Farben sortiert"
            say: "Leere Gläser ohne Pfand, wie das Marmeladenglas, bringen sie zum Altglascontainer. Dort sortiert man nach Farben: Weißglas, das ist durchsichtiges Glas, Braunglas und Grünglas. Blaues oder rotes Glas kommt zum Grünglas. Den Deckel schraubt Aylin vorher ab, er kommt in den Gelben Sack. Aus dem alten Glas schmilzt man neues Glas."
            show: { object: bottle-bank }
          - text: "Weniger Müll ist noch besser."
            say: "Noch besser als Müll trennen ist: weniger Müll machen. Aylin nimmt einen Stoffbeutel mit statt einer Plastiktüte. In der Schule hat sie eine Brotdose und eine Trinkflasche, die sie immer wieder benutzt. Kaputte Dinge kann man oft reparieren. Und Spielzeug, mit dem Aylin nicht mehr spielt, verschenkt sie an ihren Cousin."
            show: { objects: [cloth-bag, water-bottle] }
          - text: "Müll gehört nicht in die Natur, Batterien nicht in den Hausmüll."
            say: "Auf dem Heimweg liegt eine leere Dose im Park. Müll gehört nie in die Natur. Er verschwindet nicht von allein, und Tiere können sich daran verletzen. Und leere Batterien kommen nie in den Hausmüll. Man bringt sie zu einer Sammelbox, die gibt es in vielen Läden."
            show: { objects: [park, battery] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wohin bringt Papa die leeren Pfandflaschen?"
                say: "Wohin bringt Papa die leeren Pfandflaschen?"
                show: { object: deposit-bottle }
                options: ["zurück in den Laden", "in den Biomüll", "in den Wald"]
                answer: "zurück in den Laden"
                feedback:
                  "in den Wald": "Flaschen im Wald? Da würden sich die Rehe aber wundern! Pfandflaschen bringt man zurück in den Laden."
                hints:
                  - "Auf den Flaschen ist ein Pfandzeichen. Was heißt das?"
                  - "Für Pfandflaschen hat man beim Kaufen etwas mehr bezahlt. Das Geld bekommt man wieder."
                  - "Papa bringt sie zurück in den Laden."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Welche Farbe hat das Glas?"
                say: "Sortiere das Glas in den richtigen Container."
                bins:
                  - { id: weiss, show: { text: "Weißglas" }, say: "Weißglas" }
                  - { id: braun, show: { text: "Braunglas" }, say: "Braunglas" }
                  - { id: gruen, show: { text: "Grünglas" }, say: "Grünglas" }
                options:
                  - { text: "durchsichtiges Marmeladenglas", bin: weiss }
                  - { text: "braune Flasche ohne Pfand", bin: braun }
                  - { text: "grüne Flasche ohne Pfand", bin: gruen }
                  - { text: "blaue Flasche ohne Pfand", bin: gruen }
                hints:
                  - "Schau auf die Farbe des Glases."
                  - "Durchsichtiges Glas heißt Weißglas. Für Blau gibt es keinen eigenen Container."
                  - "Blaues Glas kommt zum Grünglas."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Den Deckel vom Marmeladenglas wirft man mit in den Altglascontainer."
                say: "Stimmt das? Den Deckel vom Marmeladenglas wirft man mit in den Altglascontainer."
                show: { object: jam-jar }
                answer: false
                hints:
                  - "Woraus ist der Deckel?"
                  - "Der Deckel ist aus Metall, und er ist eine Verpackung."
                  - "Nein. Der Deckel kommt in den Gelben Sack."
              - id: l2-f4
                type: multiple_choice
                text: "Was macht weniger Müll?"
                say: "Was macht weniger Müll?"
                options: ["eine Trinkflasche, die man immer wieder füllt", "jeden Tag eine neue Plastikflasche", "jeden Tag ein kleines Saftpäckchen"]
                answer: "eine Trinkflasche, die man immer wieder füllt"
                hints:
                  - "Was wirft man nach einem Tag weg, was nicht?"
                  - "Aylin hat in der Schule eine Flasche, die sie immer wieder benutzt."
                  - "Die Trinkflasche zum Auffüllen macht weniger Müll."
              - id: l2-f5
                type: fill_in_blank
                text: "Was bekommt man für eine Pfandflasche?"
                say: "Setz das passende Wort ein."
                show: { object: deposit-bottle }
                frame: "Für eine Pfandflasche bekommt man im Laden _ zurück."
                options: ["Geld", "Bonbons", "Müll"]
                answer: ["Geld"]
                hints:
                  - "Beim Kaufen hat man für die Flasche etwas mehr bezahlt."
                  - "Das Pfand kommt zurück, wenn man die Flasche zurückbringt."
                  - "Man bekommt Geld zurück."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Leere Batterien kommen in den Restmüll."
                say: "Stimmt das? Leere Batterien kommen in den Restmüll."
                show: { object: battery }
                answer: false
                hints: ["Wohin bringt man Batterien, damit sie nicht im Hausmüll landen?"]
              - id: l2-s2
                type: matching
                text: "Wohin bringt Aylin das?"
                say: "Verbinde. Wohin bringt Aylin das?"
                pairs:
                  - { left: { object: deposit-bottle }, right: { text: "zum Pfandautomaten" } }
                  - { left: { object: jam-jar }, right: { text: "zum Altglascontainer" } }
                  - { left: { object: battery, say: "leere Batterie" }, right: { text: "zur Sammelbox für Batterien" } }
                hints: ["Fang mit der Flasche mit Pfandzeichen an."]
              - id: l2-s3
                type: multiple_choice
                text: "Aylins Fahrradklingel ist kaputt. Was macht am wenigsten Müll?"
