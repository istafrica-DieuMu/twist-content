# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.plant-parts
skill: world.nature.plant-parts
curriculum: de-DE
language: de
title:
  de: Teile einer Pflanze
  en: Parts of a plant
summary: >
  Paul helps Oma Rosi in her garden. Lesson 1 starts with a flower she
  digs up to move it: what is under the soil? It names the parts from the
  bottom up (Wurzel, Stängel, Blätter, Blüte) and shows that a carrot is a
  root. Lesson 2 asks what each part is for when Paul's pot plant droops
  in the heat: the root holds the plant and takes up water, the stem
  carries the water up and holds the plant upright, the leaves make food
  with sunlight, and the flower draws bees and becomes the fruit with the
  seeds, like the apple and its pips. It ends with the skill check. No
  drawn plant exists yet, so the parts are named on text cards.
metadata:
  year: klasse-2
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.living-nonliving]
  also_practises: []
  vocabulary: { de: [Pflanze, Wurzel, Stängel, Blatt, Blüte, Frucht, Samen, Kern] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: names, what: { de: "die Teile einer Pflanze benennen und finden", en: naming and finding the parts of a plant } }
    - { id: root-stem, what: { de: "sagen, wozu Wurzel und Stängel da sind", en: saying what the root and the stem are for } }
    - { id: leaf, what: { de: "sagen, wozu die Blätter da sind", en: saying what the leaves are for } }
    - { id: flower, what: { de: "sagen, wozu die Blüte da ist und was aus ihr wird", en: saying what the flower is for and what it becomes } }
  misconceptions:
    - id: plant-only-above-ground
      what: Thinks a plant is only the part you see above the soil
      addressed: lesson 1 Learn opens with the dug-up flower and the guess what is under the soil; l1-f1, l1-s4, l1-n1 and l2-c1
    - id: carrot-not-a-root
      what: Does not know that a carrot is the root of the plant
      addressed: lesson 1 Learn, the Wusstest du screen; l1-s4, l1-n3, l1-c5 and l2-c5
    - id: root-only-holds
      what: Thinks the root only holds the plant in place and does not take up water
      addressed: lesson 2 Learn shows Paul watering the soil, not the flower; l2-f1, l2-f5, l2-s3, l2-n4, l2-c6 and l2-c10
    - id: flower-only-pretty
      what: Thinks the flower is only there to look pretty
      addressed: lesson 2 Learn says the flower draws bees and becomes the fruit with the seeds; l2-s2, l2-n2, l2-n3, l2-c16 to l2-c20
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Von der Wurzel bis zur Blüte", en: "From root to flower" }
    goal:
      de: "Lerne die Teile einer Pflanze kennen. Unten in der Erde steckt die Wurzel, ganz oben sitzt die Blüte."
      en: "Get to know the parts of a plant. The root is down in the soil, the flower sits right at the top."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was davon ist ein Lebewesen?"
            say: "Was davon ist ein Lebewesen?"
            options: [{ object: tree }, { object: stone }, { object: ball }]
            answer: tree
            feedback:
              stone: "Ein Stein wächst nicht und braucht kein Wasser. Der Baum ist ein Lebewesen."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Eine Blume lebt, auch wenn sie still steht."
            say: "Stimmt das? Eine Blume lebt, auch wenn sie still steht."
            show: { object: flower }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was ist unter der Erde?"
            say: "Paul hilft Oma Rosi im Garten. Oma gräbt eine Blume aus, weil sie an einem anderen Platz wachsen soll. Was glaubst du: Was kommt unter der Erde zum Vorschein?"
            show: { object: plant-with-roots }
          - text: "Unter der Erde ist die Wurzel."
            say: "Die Wurzel! Sie steckt in der Erde und sieht aus wie viele dünne Fäden. Paul staunt: So viel von der Pflanze war versteckt."
            show: { object: plant-with-roots }
          - text: "Der Stängel trägt Blätter und Blüte."
            say: "Über der Erde wächst der Stängel. Er ist lang und dünn. An ihm sitzen die Blätter, und ganz oben trägt er die Blüte. Beim Baum ist der Stängel dick und hart. Er heißt dort Stamm."
            show: { objects: [flower, tree] }
          - text: "Die Blätter sind meist grün und flach."
            say: "Die Blätter wachsen am Stängel. Sie sind meist grün und flach."
            show: { object: leaf }
          - text: "Die Blüte ist oft bunt."
            say: "Ganz oben sitzt die Blüte. Sie ist oft bunt und duftet. Bienen und Schmetterlinge fliegen gern zu ihr."
            show: { objects: [rose, bee] }
          - text: "Von unten nach oben: Wurzel, Stängel, Blätter, Blüte"
            say: "Von unten nach oben hat die Pflanze also eine Wurzel, einen Stängel, Blätter und eine Blüte."
            show: { object: plant-with-roots }
          - text: "Wusstest du? Die Möhre ist eine Wurzel."
            say: "Wusstest du? Die Möhre, die du isst, ist eine Wurzel. Sie wächst unter der Erde. Oben schauen nur die grünen Blätter heraus."
            show: { object: carrot }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welcher Teil der Pflanze steckt in der Erde?"
                say: "Welcher Teil der Pflanze steckt in der Erde?"
                show: { object: plant-with-roots }
                options: ["die Wurzel", "die Blüte", "das Blatt"]
                answer: "die Wurzel"
                feedback:
                  "die Blüte": "Die Blüte sitzt ganz oben, damit die Bienen sie finden. In der Erde steckt die Wurzel."
                hints:
                  - "Denk an die Blume, die Oma Rosi ausgräbt."
                  - "Unter der Erde hängen viele dünne Fäden an der Blume."
                  - "Die Wurzel steckt in der Erde."
                difficulty: easy
              - id: l1-f2
                type: ordering
                text: "Leg die Teile von unten nach oben."
                say: "Leg die Teile der Pflanze von unten nach oben in die richtige Reihenfolge."
                options: ["Blüte", "Wurzel", "Stängel"]
                slot_count: 3
                answer: ["Wurzel", "Stängel", "Blüte"]
                hints:
                  - "Fang mit dem Teil an, der in der Erde steckt."
                  - "Der Stängel wächst aus der Erde nach oben und trägt etwas."
                  - "Wurzel, dann Stängel, dann Blüte."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Die Blüte steckt in der Erde."
                say: "Stimmt das? Die Blüte steckt in der Erde."
                show: { object: rose }
                answer: false
                hints:
                  - "Wohin fliegen die Bienen?"
                  - "Die Bienen fliegen zur Blüte. Unter der Erde könnten sie sie nicht finden."
                  - "Nein. Die Blüte sitzt ganz oben, in der Erde steckt die Wurzel."
              - id: l1-f4
                type: image_multiple_choice
                text: "Welches Bild zeigt ein Blatt?"
                say: "Welches Bild zeigt ein Blatt?"
                options: [{ object: leaf }, { object: rose }, { object: stone }]
                answer: leaf
                hints:
                  - "Ein Blatt ist meist grün."
                  - "Die Rose ist eine Blüte. Ein Stein ist kein Teil einer Pflanze."
                  - "Das grüne, flache Blatt ist richtig."
              - id: l1-f5
                type: matching
                text: "Was passt zu welchem Teil?"
                say: "Verbinde jeden Teil der Pflanze mit dem passenden Satz."
                pairs:
                  - { left: { object: root }, right: { text: "steckt in der Erde" } }
                  - { left: { object: plant-stem }, right: { text: "ist lang und trägt die Blüte" } }
                  - { left: { object: blossom }, right: { text: "ist oft bunt" } }
                hints:
                  - "Fang mit dem Teil an, der ganz unten ist."
                  - "Die Wurzel ist unten. Der Stängel ist in der Mitte."
                  - "Wurzel und Erde, Stängel und lang, Blüte und bunt."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Unten und oben"
                say: "Setz die passenden Wörter ein."
                frame: "Die Pflanze steckt mit der _ in der Erde. Ganz oben sitzt die _."
                options: ["Wurzel", "Blüte", "Stängel"]
                answer: ["Wurzel", "Blüte"]
                hints: ["Unten sind die dünnen Fäden, oben ist der bunte Teil."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Wo siehst du eine Blüte?"
                say: "Wo siehst du eine Blüte?"
                options: [{ object: rose }, { object: leaf }, { object: carrot }]
                answer: rose
                hints: ["Die Blüte ist der bunte Teil ganz oben."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Auch ein Baum hat Wurzeln."
                say: "Stimmt das? Auch ein Baum hat Wurzeln."
                show: { object: tree }
                answer: true
                hints: ["Was hält den großen Baum fest in der Erde?"]
              - id: l1-s4
                type: sorting
                text: "Über oder unter der Erde?"
                say: "Sortiere. Was wächst über der Erde, was unter der Erde?"
                bins:
                  - { id: ueber, show: { text: "über der Erde" }, say: "über der Erde" }
                  - { id: unter, show: { text: "unter der Erde" }, say: "unter der Erde" }
                options:
                  - { object: blossom, bin: ueber }
                  - { object: root, bin: unter }
                  - { object: carrot, bin: unter }
                  - { object: leaf, bin: ueber }
                hints: ["Die Möhre ist eine Wurzel."]
              - id: l1-s5
                type: multiple_choice
                text: "Welcher Teil ist meist grün und flach?"
                say: "Welcher Teil der Pflanze ist meist grün und flach?"
                options: ["das Blatt", "die Wurzel", "die Blüte"]
                answer: "das Blatt"
                hints: ["Er wächst am Stängel, aber er ist nicht bunt."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Oma Rosi zieht ein Unkraut aus dem Beet. Unten hängen dünne Fäden mit Erde dran. Was ist das?"
                say: "Oma Rosi zieht ein Unkraut aus dem Beet. Unten hängen dünne Fäden mit Erde dran. Was ist das?"
                options: ["die Wurzel", "die Blüte", "der Stängel"]
                answer: "die Wurzel"
              - id: l1-n2
                type: true_false
                text: "Paul sagt: „Die Blätter sitzen am Stängel.“ Stimmt das?"
                say: "Paul sagt: Die Blätter sitzen am Stängel. Stimmt das?"
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Oma Rosi zieht eine Möhre aus dem Beet. Welcher Teil der Pflanze ist die Möhre?"
                say: "Oma Rosi zieht eine Möhre aus dem Beet. Welcher Teil der Pflanze ist die Möhre?"
                show: { object: carrot }
                options: ["die Wurzel", "die Blüte", "das Blatt"]
                answer: "die Wurzel"
              - id: l1-n4
                type: sorting
                text: "Paul hat Kärtchen geschrieben. Welche Teile hat eine Pflanze?"
                say: "Paul hat Kärtchen geschrieben. Sortiere. Was ist ein Teil einer Pflanze, was nicht?"
                bins:
                  - { id: ja, show: { text: "Teil einer Pflanze" }, say: "Teil einer Pflanze" }
                  - { id: nein, show: { text: "kein Teil einer Pflanze" }, say: "kein Teil einer Pflanze" }
                options:
                  - { text: "Wurzel", bin: ja }
                  - { text: "Pfote", bin: nein }
                  - { text: "Stängel", bin: ja }
                  - { text: "Flügel", bin: nein }
              - id: l1-n5
                type: image_multiple_choice
                text: "Eine Biene sucht im Garten eine Blüte. Wohin fliegt sie?"
                say: "Eine Biene sucht im Garten eine Blüte. Wohin fliegt sie?"
                options: [{ object: rose }, { object: carrot }, { object: stone }]
                answer: rose
                feedback:
                  stone: "Ein Stein hat keine Blüte. Die Biene fliegt zur Rose."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wo steckt die Wurzel?"
            say: "Wo steckt die Wurzel?"
            options: ["in der Erde", "ganz oben an der Pflanze", "in der Blüte"]
            answer: "in der Erde"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Der Stängel trägt die Blüte."
            say: "Stimmt das? Der Stängel trägt die Blüte."
            answer: true
          - id: l1-c3
            type: image_multiple_choice
            text: "Welches Bild zeigt eine Blüte?"
            say: "Welches Bild zeigt eine Blüte?"
            options: [{ object: rose }, { object: leaf }, { object: tree }]
            answer: rose
          - id: l1-c4
            type: fill_in_blank
            text: "Unten und oben"
            say: "Setz die passenden Wörter ein."
            frame: "Unten ist die _. Oben ist die _."
            options: ["Blüte", "Wurzel", "Kuh"]
            answer: ["Wurzel", "Blüte"]
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Die Möhre ist eine Blüte."
            say: "Stimmt das? Die Möhre ist eine Blüte."
            show: { object: carrot }
            answer: false
          - id: l1-c6
            type: multiple_choice
            text: "Was ist kein Teil einer Pflanze?"
            say: "Was ist kein Teil einer Pflanze?"
            options: ["die Flosse", "die Wurzel", "das Blatt"]
            answer: "die Flosse"

  - n: 2
    title: { de: "Wozu sind die Teile da?", en: "What are the parts for?" }
    goal:
      de: "Finde heraus, wozu jeder Teil der Pflanze da ist. Die Wurzel holt zum Beispiel das Wasser aus der Erde."
      en: "Find out what each part of the plant is for. The root, for example, takes the water from the soil."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Teil der Pflanze sitzt ganz oben?"
            say: "Welcher Teil der Pflanze sitzt ganz oben?"
            options: ["die Blüte", "die Wurzel", "der Stängel"]
            answer: "die Blüte"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Die Wurzel steckt in der Erde."
            say: "Stimmt das? Die Wurzel steckt in der Erde."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was braucht die Blume?"
            say: "Es ist ein heißer Tag. Pauls Blume im Topf lässt Blätter und Blüte hängen. Was glaubst du: Was braucht sie jetzt?"
            show: { object: flower }
          - text: "Die Wurzel nimmt Wasser aus der Erde auf."
            say: "Wasser! Paul gießt die Erde, nicht die Blüte. Denn die Wurzel nimmt das Wasser aus der Erde auf. Außerdem hält sie die Pflanze fest, damit der Wind sie nicht umweht."
            show: { object: watering-can }
          - text: "Der Stängel bringt das Wasser nach oben."
            say: "Im Stängel fließt das Wasser nach oben, bis in die Blätter und die Blüte. Der Stängel hält die Pflanze aufrecht. Bald steht Pauls Blume wieder gerade."
            show: { object: flower }
          - text: "Die Blätter machen mit Sonnenlicht Nahrung."
            say: "Die Blätter fangen das Sonnenlicht ein. Mit dem Licht machen sie Nahrung für die ganze Pflanze. Darum strecken sich Pflanzen am Fenster zum Licht."
            show: { objects: [leaf, sun] }
          - text: "Die Blüte lockt Bienen an."
            say: "Die Blüte lockt mit Farbe und Duft Bienen an. Die Bienen tragen Blütenstaub von Blüte zu Blüte. Erst dann kann aus der Blüte eine Frucht werden."
            show: { objects: [rose, bee] }
          - text: "Aus der Blüte wird die Frucht mit den Samen."
            say: "Im Frühling blüht Omas Apfelbaum. Aus jeder Blüte, die eine Biene besucht hat, kann ein Apfel wachsen. Die Kerne im Apfel sind die Samen. Aus einem Kern kann ein neuer Apfelbaum wachsen."
            show: { objects: [tree, apple] }
          - text: "Wusstest du? Eine Sonnenblume hat Hunderte Blüten."
            say: "Wusstest du? Die große Blüte einer Sonnenblume ist eigentlich ganz viele kleine Blüten. In der Mitte stehen Hunderte winzige Blüten dicht nebeneinander. Aus jeder kann ein Sonnenblumenkern werden."
            show: { object: sunflower }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Wozu hat die Pflanze eine Wurzel?"
                say: "Wozu hat die Pflanze eine Wurzel?"
                options: ["Sie hält die Pflanze fest und nimmt Wasser auf.", "Sie lockt Bienen an.", "Sie fängt das Sonnenlicht ein."]
                answer: "Sie hält die Pflanze fest und nimmt Wasser auf."
                hints:
                  - "Denk daran, wo die Wurzel steckt."
                  - "Die Wurzel ist in der Erde. Paul gießt die Erde, damit die Pflanze trinken kann."
                  - "Die Wurzel hält die Pflanze fest und nimmt Wasser auf."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Wer macht was?"
                say: "Verbinde jeden Teil der Pflanze mit dem, was er tut."
                pairs:
                  - { left: { object: root }, right: { text: "nimmt Wasser auf" } }
                  - { left: { object: leaf, say: "Blätter" }, right: { text: "fangen Sonnenlicht ein" } }
                  - { left: { object: blossom }, right: { text: "lockt Bienen an" } }
                hints:
                  - "Fang mit dem Teil an, der in der Erde steckt."
                  - "In der Erde ist das Wasser. Die Bienen suchen den bunten Teil."
                  - "Wurzel und Wasser, Blätter und Licht, Blüte und Bienen."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Im Stängel fließt das Wasser nach oben."
                say: "Stimmt das? Im Stängel fließt das Wasser nach oben."
                show: { object: flower }
                answer: true
                hints:
                  - "Wie kommt das Wasser von der Wurzel bis in die Blüte?"
                  - "Zwischen Wurzel und Blüte liegt der Stängel."
                  - "Ja. Der Stängel bringt das Wasser nach oben."
              - id: l2-f4
                type: image_multiple_choice
                text: "Was brauchen die Blätter, um Nahrung zu machen?"
                say: "Was brauchen die Blätter, um Nahrung zu machen?"
                options: [{ object: sun }, { object: moon }, { object: snow }]
                answer: sun
                feedback:
                  snow: "Brrr! Schnee ist kalt und macht kein Licht. Die Blätter brauchen das Sonnenlicht."
                hints:
                  - "Warum strecken sich Pflanzen am Fenster?"
                  - "Sie strecken sich zum Licht. Das meiste Licht kommt von der Sonne."
                  - "Die Blätter brauchen die Sonne."
              - id: l2-f5
                type: ordering
                text: "Wie kommt das Wasser in die Blüte?"
                say: "Wie kommt das Wasser in die Blüte? Leg die Karten in die richtige Reihenfolge."
                options: ["Der Stängel bringt das Wasser nach oben.", "Paul gießt die Erde.", "Die Wurzel nimmt das Wasser auf."]
                slot_count: 3
                answer: ["Paul gießt die Erde.", "Die Wurzel nimmt das Wasser auf.", "Der Stängel bringt das Wasser nach oben."]
                hints:
                  - "Zuerst muss Wasser in die Erde kommen."
                  - "Danach geht das Wasser von unten nach oben durch die Pflanze."
                  - "Erst gießen, dann die Wurzel, dann der Stängel."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Wasser und Licht"
                say: "Setz die passenden Wörter ein."
                frame: "Die _ nimmt Wasser auf. Die _ fangen Licht ein."
                options: ["Wurzel", "Blätter", "Blüte"]
                answer: ["Wurzel", "Blätter"]
                hints: ["Der eine Teil steckt in der Erde, die anderen sind grün und flach."]
              - id: l2-s2
                type: multiple_choice
                text: "Woraus wird später die Frucht mit den Samen?"
                say: "Woraus wird später die Frucht mit den Samen?"
                options: ["aus der Blüte", "aus der Wurzel", "aus dem Stängel"]
                answer: "aus der Blüte"
                hints: ["Denk an den Apfelbaum im Frühling."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Die Blüte nimmt das Wasser aus der Erde auf."
                say: "Stimmt das? Die Blüte nimmt das Wasser aus der Erde auf."
                answer: false
                hints: ["Welcher Teil steckt in der Erde?"]
              - id: l2-s4
                type: image_multiple_choice
                text: "Was wächst am Baum aus einer Blüte?"
                say: "Was wächst am Baum aus einer Blüte?"
                options: [{ object: apple }, { object: stone }, { object: ball }]
                answer: apple
                feedback:
                  ball: "Ein Ball am Baum? Den hat bestimmt jemand hochgeworfen! Aus der Blüte wächst der Apfel."
                hints: ["Darin stecken Kerne, also Samen."]
              - id: l2-s5
                type: sorting
                text: "Wurzel oder Blüte?"
                say: "Sortiere. Was macht die Wurzel, was macht die Blüte?"
                bins:
                  - { id: wurzel, show: { object: root }, say: "Wurzel" }
                  - { id: bluete, show: { object: blossom }, say: "Blüte" }
                options:
                  - { text: "hält die Pflanze fest", bin: wurzel }
                  - { text: "lockt Bienen an", bin: bluete }
                  - { text: "nimmt Wasser auf", bin: wurzel }
                  - { text: "wird zur Frucht", bin: bluete }
                hints: ["Ein Teil ist in der Erde, der andere ist bunt."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Pauls Blume am Fenster neigt sich zur Scheibe. Warum?"
                say: "Pauls Blume am Fenster neigt sich zur Scheibe. Warum?"
                show: { object: potted-plant }
                options: ["Die Blätter wollen Licht.", "Die Blume will hinausschauen.", "Die Wurzel ist müde."]
                answer: "Die Blätter wollen Licht."
              - id: l2-n2
                type: true_false
                text: "Oma Rosi sagt: „Ohne Bienen an den Blüten gäbe es weniger Äpfel.“ Stimmt das?"
                say: "Oma Rosi sagt: Ohne Bienen an den Blüten gäbe es weniger Äpfel. Stimmt das?"
                answer: true
              - id: l2-n3
                type: ordering
                text: "Vom Apfelbaum zum Apfel. Was kommt zuerst?"
                say: "Vom Apfelbaum zum Apfel. Leg die Karten in die richtige Reihenfolge."
                options: ["Aus der Blüte wächst ein Apfel.", "Im Frühling blüht der Apfelbaum.", "Bienen fliegen von Blüte zu Blüte."]
                slot_count: 3
                answer: ["Im Frühling blüht der Apfelbaum.", "Bienen fliegen von Blüte zu Blüte.", "Aus der Blüte wächst ein Apfel."]
