# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.bird-view
skill: world.space.bird-view
curriculum: de-DE
language: de
title:
  de: Von oben gesehen
  en: Seen from above
summary: >
  Lotta wonders how her things look to a pigeon flying over the garden.
  Lesson 1 shows that from above you see only the top of things (the
  bird's-eye view): a ball, a glass or a cup is a circle, a dice a square,
  a book lying flat and a table a rectangle, and the table legs are hidden
  under the top. Lesson 2 looks down on cube buildings (a tower of three
  is one square, so height does not show from above), on a town from a
  tower (roofs, round tree tops, heads and shoulders), and draws a desk
  from above: each thing as its outline, in its own place, left stays
  left. That drawing is a plan. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Pläne und Orte, en: Plans and places }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.solids.cube-buildings, math.solids.cube-cuboid-sphere]
  also_practises: []
  vocabulary: { de: [von oben, Vogelperspektive, Umriss, Kreis, Quadrat, Rechteck, Plan] }
  forms: [text, audio, picture, drawn]
  drawn: [cubes, shape]
  facets: []
  parts:
    - { id: shapes, what: { de: "erkennen, wie Dinge von oben aussehen (Kreis, Quadrat, Rechteck)", en: "recognising what things look like from above (circle, square, rectangle)" } }
    - { id: visible, what: { de: "wissen, was man von oben sieht und was versteckt ist", en: knowing what can be seen from above and what is hidden } }
    - { id: cubes, what: { de: Würfelgebäude von oben erkennen, en: recognising cube buildings from above } }
    - { id: drawing, what: { de: "Dinge von oben an ihrer Stelle zeichnen (Plan)", en: "drawing things from above in their places (a plan)" } }
  misconceptions:
    - id: draws-the-side
      what: Draws or expects the side of things (table legs, a house front) in a view from above
      addressed: lesson 1 Learn on Lotta's table; l1-f2, l1-n4, l1-c3; lesson 2 Learn on roofs and doors; l2-f3, l2-n3; l2-c7, l2-c8 and l2-c20 in the skill check
    - id: height-shows
      what: Thinks a view from above shows how tall something is, so a tower shows all its cubes
      addressed: lesson 2 Learn opens with the guess about the tower; l2-f1, l2-f2, l2-s2, l2-n4; l2-c13 and l2-c14
    - id: swaps-sides
      what: Swaps left and right when drawing from above
      addressed: lesson 2 Learn says what lies left is drawn left; l2-n1 and l2-c17
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wie ein Vogel von oben", en: "Like a bird from above" }
    goal:
      de: "Finde heraus, wie Dinge von oben aussehen. Ein Ball sieht von oben zum Beispiel aus wie ein Kreis."
      en: "Find out what things look like from above. A ball, for example, looks like a circle from above."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Würfel sind es?"
            say: "Wie viele Würfel hat Lotta verbaut?"
            show: { drawn: cubes, plan: [[2, 1]], mode: building, colour: blue }
            options: ["3", "2", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welcher Körper ist eine Kugel?"
            say: "Welcher Körper ist eine Kugel?"
            options:
              - { drawn: shape, kind: sphere, colour: red }
              - { drawn: shape, kind: cube, colour: red }
              - { drawn: shape, kind: cylinder, colour: red }
            answer: sphere
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie sieht der Ball für die Taube aus?"
            say: "Lotta liegt im Garten im Gras. Über ihr fliegt eine Taube. Lotta fragt sich: Wie sieht mein Ball für die Taube aus, ganz von oben? Was glaubst du?"
            show: { object: ball }
          - text: "Von oben ist der Ball ein Kreis."
            say: "Von oben sieht der Ball aus wie ein Kreis. Von oben siehst du nur die obere Seite der Dinge. So sieht ein Vogel die Welt. Darum sagt man auch: Vogelperspektive."
            show: { drawn: shape, kind: circle, colour: red }
          - text: "Becher und Glas sind von oben auch ein Kreis."
            say: "Auch ein Glas und ein Becher sehen von oben rund aus, wie ein Kreis. Beim Becher schaut noch der Henkel an der Seite heraus. Von der Seite sieht ein Glas ganz anders aus."
            show: { objects: [glass, cup] }
          - text: "Der Würfel ist von oben ein Quadrat, das Buch ein Rechteck."
            say: "Ein Würfel sieht von oben aus wie ein Quadrat. Ein Buch, das flach auf dem Tisch liegt, sieht von oben aus wie ein Rechteck."
            show: { drawn: shape, row: [square, rectangle], colours: blue }
          - text: "Der Tisch von oben: ein Rechteck ohne Beine"
            say: "Und Lottas rechteckiger Tisch? Von der Seite siehst du die Tischplatte und die Beine. Von oben siehst du nur die Tischplatte, ein Rechteck. Die Beine sind darunter versteckt."
            show: { object: table }
          - text: "Wusstest du? Greifvögel sehen viel schärfer als wir."
            say: "Wusstest du? Greifvögel wie der Mäusebussard sehen viel schärfer als wir Menschen. Hoch oben am Himmel entdecken sie eine kleine Maus im Gras."
            show: { object: mouse }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Wie sieht der Ball von oben aus?"
                say: "Wie sieht der Ball von oben aus?"
                show: { object: ball }
                options:
                  - { drawn: shape, kind: circle, colour: green }
                  - { drawn: shape, kind: square, colour: green }
                  - { drawn: shape, kind: triangle, colour: green }
                answer: circle
                option_audio: false
                hints:
                  - "Stell dir vor, du bist die Taube und schaust auf den Ball hinunter."
                  - "Der Ball ist überall rund. Er hat keine Ecken."
                  - "Von oben ist der Ball ein Kreis."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Von oben siehst du die Beine von Lottas Tisch."
                say: "Stimmt das? Von oben siehst du die Beine von Lottas Tisch."
                show: { object: table }
                answer: false
                hints:
                  - "Was ist ganz oben am Tisch?"
                  - "Die Tischplatte liegt über den Beinen."
                  - "Nein. Die Platte verdeckt die Beine."
              - id: l1-f3
                type: matching
                text: "Wie sieht es von oben aus?"
                say: "Verbinde jedes Ding mit seiner Form von oben."
                pairs:
                  - { left: { object: cube }, right: { drawn: shape, kind: square, colour: orange } }
                  - { left: { object: ball }, right: { drawn: shape, kind: circle, colour: orange } }
                  - { left: { object: book }, right: { drawn: shape, kind: rectangle, colour: orange } }
                hints:
                  - "Fang mit dem Ball an. Er ist überall rund."
                  - "Der Würfel hat vier gleich lange Kanten oben. Das Buch ist länger als breit."
                  - "Würfel und Quadrat, Ball und Kreis, Buch und Rechteck."
              - id: l1-f4
                type: multiple_choice
                text: "Was sieht man, wenn man von oben schaut?"
                say: "Was sieht man, wenn man von oben schaut?"
                options: ["nur die obere Seite", "nur die Unterseite", "alle Seiten auf einmal"]
                answer: "nur die obere Seite"
                feedback:
                  "nur die Unterseite": "Die Unterseite sieht nur ein Käfer, der unter dem Tisch krabbelt! Von oben sieht man die obere Seite."
                hints:
                  - "Denk an die Taube über dem Garten."
                  - "Was ist der Taube am nächsten?"
                  - "Von oben sieht man nur die obere Seite."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welches Ding sieht von oben aus wie ein Quadrat?"
                say: "Welches Ding sieht von oben aus wie ein Quadrat?"
                options: [{ object: dice }, { object: ball }, { object: cup }]
                answer: dice
                hints:
                  - "Ein Quadrat hat vier Ecken und vier gleich lange Seiten."
                  - "Ball und Becher sind von oben rund."
                  - "Der Würfel ist von oben ein Quadrat."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Wie sieht das Glas von oben aus?"
                say: "Wie sieht das Glas von oben aus?"
                show: { object: glass }
                options:
                  - { drawn: shape, kind: rectangle, colour: blue }
                  - { drawn: shape, kind: circle, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                answer: circle
                option_audio: false
                hints: ["Schau auf den Rand oben am Glas. Ist er eckig oder rund?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Ein Buch, das flach auf dem Tisch liegt, sieht von oben aus wie ein Rechteck."
                say: "Stimmt das? Ein Buch, das flach auf dem Tisch liegt, sieht von oben aus wie ein Rechteck."
                show: { object: book }
                answer: true
                hints: ["Das Buch ist länger als breit und hat vier Ecken."]
              - id: l1-s3
                type: sorting
                text: "Rund oder eckig von oben?"
                say: "Sortiere. Was ist von oben ein Kreis, was ein Quadrat?"
                bins:
                  - { id: kreis, show: { drawn: shape, kind: circle, colour: green }, say: "ein Kreis" }
                  - { id: quadrat, show: { drawn: shape, kind: square, colour: green }, say: "ein Quadrat" }
                options:
                  - { object: cup, bin: kreis }
                  - { object: dice, bin: quadrat }
                  - { object: ball, bin: kreis }
                  - { object: cube, bin: quadrat }
                hints: ["Stell dir jedes Ding von oben vor. Hat es Ecken?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Wie heißt der Blick von oben?"
                say: "Setz das passende Wort ein."
                frame: "Der Blick von oben heißt _. So sieht ein Vogel die Welt."
                options: ["Vogelperspektive", "Vorderseite", "Rückseite"]
                answer: ["Vogelperspektive"]
                hints: ["Wer fliegt über den Garten und schaut hinunter?"]
              - id: l1-s5
                type: multiple_choice
                text: "Lotta schaut von oben auf eine Dose. Was sieht sie?"
                say: "Lotta schaut von oben auf eine Dose. Was sieht sie?"
                options: ["einen Kreis", "ein Dreieck", "vier Beine"]
                answer: "einen Kreis"
                hints: ["Eine Dose ist rund, wie ein Glas."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Lotta und Karim spielen ein Ratespiel. Lotta zeigt einen Kreis. Was ist es von oben?"
                say: "Lotta und Karim spielen ein Ratespiel. Lotta zeigt einen Kreis. Welches Ding ist es, von oben gesehen?"
                show: { drawn: shape, kind: circle, colour: red }
                options: [{ object: ball }, { object: book }, { object: dice }]
                answer: ball
              - id: l1-n2
                type: multiple_choice
                text: "Karim malt seinen runden Teller von oben. Welche Form malt er?"
                say: "Karim malt seinen runden Teller von oben. Welche Form malt er?"
                options: ["einen Kreis", "ein Dreieck", "ein Rechteck"]
                answer: "einen Kreis"
              - id: l1-n3
                type: true_false
                text: "Lotta sagt: „Von oben sehe ich bei meinem Becher den runden Rand und den Henkel.“ Stimmt das?"
                say: "Lotta sagt: Von oben sehe ich bei meinem Becher den runden Rand und den Henkel. Stimmt das?"
                show: { object: cup }
                answer: true
              - id: l1-n4
                type: sorting
                text: "Die Taube sitzt auf dem Dach. Was kann sie sehen?"
                say: "Die Taube sitzt auf dem Dach und schaut in den Garten hinunter. Sortiere. Was kann sie sehen, was nicht?"
                bins:
                  - { id: ja, show: { text: "sieht sie" }, say: "sieht sie" }
                  - { id: nein, show: { text: "sieht sie nicht" }, say: "sieht sie nicht" }
                options:
                  - { text: "die Gartentischplatte", bin: ja }
                  - { text: "die Tischbeine unter der Platte", bin: nein }
                  - { text: "das Dach vom Gartenhaus", bin: ja }
                  - { text: "die Unterseite vom Ball", bin: nein }
              - id: l1-n5
                type: image_multiple_choice
                text: "Karim rät: Wie sieht Lottas rechteckiger Tisch von oben aus?"
                say: "Karim rät: Wie sieht Lottas rechteckiger Tisch von oben aus?"
                options:
                  - { drawn: shape, kind: circle, colour: orange }
                  - { drawn: shape, kind: triangle, colour: orange }
                  - { drawn: shape, kind: rectangle, colour: orange }
                answer: rectangle
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Wie sieht der Ball von oben aus?"
            say: "Wie sieht der Ball von oben aus?"
            show: { object: ball }
            options:
              - { drawn: shape, kind: square, colour: red }
              - { drawn: shape, kind: rectangle, colour: red }
              - { drawn: shape, kind: circle, colour: red }
            answer: circle
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Würfel sieht von oben aus wie ein Kreis."
            say: "Stimmt das? Ein Würfel sieht von oben aus wie ein Kreis."
            show: { object: dice }
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was siehst du von oben bei einem Tisch?"
            say: "Was siehst du von oben bei einem Tisch?"
            options: ["die Tischplatte", "die Tischbeine", "den Boden unter dem Tisch"]
            answer: "die Tischplatte"
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Ding ist von oben ein Kreis?"
            say: "Welches Ding ist von oben ein Kreis?"
            options: [{ object: book }, { object: glass }, { object: dice }]
            answer: glass
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Von oben sieht man nur die obere Seite der Dinge."
            say: "Stimmt das? Von oben sieht man nur die obere Seite der Dinge."
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Wie sieht das Buch von oben aus?"
            say: "Setz das passende Wort ein."
            frame: "Ein Buch, das flach auf dem Tisch liegt, ist von oben ein _."
            options: ["Rechteck", "Kreis", "Dreieck"]
            answer: ["Rechteck"]

  - n: 2
    title: { de: "Von oben zeichnen", en: "Drawing from above" }
    goal:
      de: "Finde heraus, wie Gebäude und Dinge von oben aussehen und wie du sie von oben zeichnest. Einen Becher malst du zum Beispiel als Kreis."
      en: "Find out what buildings and things look like from above and how to draw them from above. You draw a cup, for example, as a circle."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Wie sieht der Becher von oben aus?"
            say: "Wie sieht der Becher von oben aus? Schau auf den Rand."
            show: { object: cup }
            options:
              - { drawn: shape, kind: triangle, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
              - { drawn: shape, kind: square, colour: blue }
            answer: circle
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Vogelperspektive heißt: von oben gesehen."
            say: "Stimmt das? Vogelperspektive heißt: von oben gesehen."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie viele Würfel sieht Karim von oben?"
            say: "Lotta baut einen Turm aus drei Würfeln. Karim schaut von ganz oben auf den Turm. Was glaubst du: Wie viele Würfel sieht er?"
            show: { drawn: cubes, plan: [[3]], mode: building, colour: red }
          - text: "Von oben sieht er nur ein Quadrat."
            say: "Nur einen! Karim sieht nur das Quadrat ganz oben. Die Würfel darunter sind versteckt. Von oben sieht man nicht, wie hoch etwas ist."
            show: { drawn: cubes, plan: [[3]], mode: top, colour: red }
          - text: "Ein Quadrat für jeden Stapel"
            say: "Jetzt baut Lotta ein Gebäude mit drei Stapeln, einer davon ist zwei Würfel hoch. Von oben sieht Karim drei Quadrate, eins für jeden Stapel, ganz egal, wie hoch er ist."
            show: { drawn: cubes, plan: [[2, 1], [1, 0]], mode: top, colour: green }
          - text: "Häuser, Bäume und Menschen von oben"
            say: "Mit Oma steigt Lotta auf einen Aussichtsturm und schaut auf die Stadt hinunter. Von den Häusern sieht sie die Dächer, aber keine Türen. Die Bäume sind runde Kronen. Und von den Menschen sieht sie nur Köpfe und Schultern."
            show: { objects: [house, tree] }
          - text: "So zeichnest du von oben: ein Plan"
            say: "Zu Hause zeichnet Lotta ihren Schreibtisch von oben. Für jedes Ding malt sie seine Form von oben: das Heft als Rechteck, den Becher als Kreis. Und sie malt jedes Ding an seine Stelle. Was links liegt, malt sie links. So eine Zeichnung von oben heißt Plan."
            show: { text: "Plan" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Wie sieht der Turm von oben aus?"
                say: "Wie sieht der Turm von oben aus?"
                show: { drawn: cubes, plan: [[3]], mode: building, colour: blue }
                options:
                  - { drawn: cubes, plan: [[1, 1, 1]], mode: top, colour: blue, key: "3" }
                  - { drawn: cubes, plan: [[3]], mode: top, colour: blue, key: "1" }
                  - { drawn: cubes, plan: [[1, 1]], mode: top, colour: blue, key: "2" }
                answer: "1"
                hints:
                  - "Stell dir vor, du schaust von ganz oben auf den Turm."
                  - "Die Würfel stehen aufeinander. Den obersten siehst du, die anderen sind darunter versteckt."
                  - "Von oben siehst du nur ein Quadrat."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Von oben sieht man, wie hoch ein Turm ist."
                say: "Stimmt das? Von oben sieht man, wie hoch ein Turm ist."
                answer: false
                hints:
                  - "Wie viele Würfel hat Karim von oben gesehen?"
                  - "Ein Turm aus drei Würfeln war von oben nur ein Quadrat."
                  - "Nein. Von oben sieht man die Höhe nicht."
              - id: l2-f3
                type: sorting
                text: "Sieht man es von oben?"
                say: "Lotta schaut vom Aussichtsturm auf ein Haus mit Garten. Sortiere. Was sieht sie von oben, was nicht?"
                bins:
                  - { id: ja, show: { text: "sieht man von oben" }, say: "sieht man von oben" }
                  - { id: nein, show: { text: "sieht man von oben nicht" }, say: "sieht man von oben nicht" }
                options:
                  - { text: "das Dach", bin: ja }
                  - { text: "die Haustür", bin: nein }
                  - { text: "die Baumkrone", bin: ja }
                  - { text: "die Fenster in der Hauswand", bin: nein }
                hints:
                  - "Frag dich: Ist es oben oder an der Seite?"
                  - "Tür und Fenster sind an der Wand, also an der Seite."
                  - "Dach und Baumkrone sieht man, Haustür und Fenster nicht."
              - id: l2-f4
                type: multiple_choice
                text: "Lotta zeichnet ihr Heft von oben. Welche Form malt sie?"
                say: "Lotta zeichnet ihr Heft von oben. Welche Form malt sie?"
                options: ["ein Rechteck", "einen Kreis", "ein Dreieck"]
                answer: "ein Rechteck"
                hints:
                  - "Wie sieht ein Buch von oben aus?"
                  - "Ein Heft hat vier Ecken und ist länger als breit."
                  - "Sie malt ein Rechteck."
              - id: l2-f5
                type: image_multiple_choice
                text: "Welches Bild zeigt das Gebäude von oben?"
                say: "Welches Bild zeigt das Gebäude von oben?"
                show: { drawn: cubes, plan: [[2, 1], [1, 0]], mode: building, colour: orange }
                options:
                  - { drawn: cubes, plan: [[1, 1], [1, 1]], mode: top, colour: orange, key: "4" }
                  - { drawn: cubes, plan: [[1, 1]], mode: top, colour: orange, key: "2" }
                  - { drawn: cubes, plan: [[2, 1], [1, 0]], mode: top, colour: orange, key: "3" }
                answer: "3"
                hints:
                  - "Zähl die Stapel. Wie hoch sie sind, ist egal."
                  - "Hinten stehen zwei Stapel, vorne einer."
                  - "Von oben sind es drei Quadrate, zwei hinten und eins vorne links."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Von oben sieht ein Baum aus wie eine runde Krone."
                say: "Stimmt das? Von oben sieht ein Baum aus wie eine runde Krone."
                show: { object: tree }
                answer: true
                hints: ["Was ist ganz oben am Baum, die Blätter oder der Stamm?"]
              - id: l2-s2
                type: multiple_choice
                text: "Wie viele Quadrate siehst du von oben?"
                say: "Wie viele Quadrate siehst du von oben?"
                show: { drawn: cubes, plan: [[1, 3]], mode: building, colour: green }
                options: ["2", "4", "1"]
                answer: "2"
                hints: ["Zähl die Stapel, nicht die Würfel."]
              - id: l2-s3
                type: ordering
                text: "Wie zeichnest du deinen Tisch von oben?"
                say: "Wie zeichnest du deinen Tisch von oben? Leg die Karten in die richtige Reihenfolge."
                options: ["Ich male jede Form an ihre Stelle.", "Ich schaue von oben auf den Tisch.", "Ich überlege, welche Form jedes Ding von oben hat."]
                slot_count: 3
                answer: ["Ich schaue von oben auf den Tisch.", "Ich überlege, welche Form jedes Ding von oben hat.", "Ich male jede Form an ihre Stelle."]
                hints: ["Zuerst musst du gut hinschauen."]
              - id: l2-s4
                type: matching
                text: "Was siehst du vom Turm aus?"
                say: "Verbinde. Was siehst du vom Aussichtsturm aus von oben?"
                pairs:
                  - { left: { object: house, say: "ein Haus" }, right: { text: "das Dach" } }
                  - { left: { object: tree, say: "ein Baum" }, right: { text: "die runde Krone" } }
                  - { left: { object: child, say: "ein Mensch" }, right: { text: "Kopf und Schultern" } }
                hints: ["Was ist bei jedem ganz oben?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Wie heißt eine Zeichnung von oben?"
                say: "Setz das passende Wort ein."
                frame: "Eine Zeichnung von oben heißt _."
                options: ["Plan", "Foto", "Brief"]
                answer: ["Plan"]
                hints: ["Lotta hat so ihren Schreibtisch gezeichnet."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Auf Lottas Schreibtisch liegt links das Heft, rechts steht der Becher. Wo malt sie den Kreis für den Becher in ihren Plan?"
                say: "Auf Lottas Schreibtisch liegt links das Heft, rechts steht der Becher. Wo malt sie den Kreis für den Becher in ihren Plan?"
                options: ["rechts", "links", "ganz unten in die Ecke"]
                answer: "rechts"
