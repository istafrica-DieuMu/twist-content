# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.traffic-signs-basic
skill: world.space.traffic-signs-basic
curriculum: de-DE
language: de
title:
  de: Wichtige Verkehrszeichen
  en: Important road signs
summary: >
  Nele goes on a road-sign rally through her neighbourhood with her Opa.
  Lesson 1 is the signs on a child's way, by their StVO names: Radweg
  (only for bikes, so Nele walks beside it), Gehweg, gemeinsamer Geh- und
  Radweg, Fußgängerüberweg (a zebra crossing is here), Haltestelle and
  verkehrsberuhigter Bereich (children may play in the street, cars at
  walking pace, still look out). Lesson 2 is how shape and colour tell
  what a sign wants: a triangle with a red border warns (Kinder), a round
  sign with a red border forbids (Verbot für Fußgänger, Verbot für
  Fahrzeuge aller Art), a round blue sign says what to do or whom the way
  is for, a square blue sign gives information; the Stoppschild is the
  only octagon (stop completely and let the others go) and Vorfahrt
  gewähren is a triangle standing on its point. It ends with the skill
  check.
metadata:
  year: klasse-2
  topic: { de: Sicher unterwegs, en: Getting around safely }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [world.space.traffic-light-crossing]
  also_practises: []
  vocabulary: { de: [Verkehrszeichen, Radweg, Gehweg, gemeinsamer Geh- und Radweg, Fußgängerüberweg, Haltestelle, verkehrsberuhigter Bereich, Schrittgeschwindigkeit, Stoppschild, Vorfahrt gewähren, Verbot, Warnung, Hinweis] }
  forms: [text, audio, picture, drawn]
  drawn: [shape]
  sounds: []
  facets: []
  parts:
    - { id: paths, what: { de: "Radweg, Gehweg und gemeinsamen Geh- und Radweg erkennen", en: "recognising the cycle path, footpath and shared path signs" } }
    - { id: places, what: { de: "Fußgängerüberweg, Haltestelle und verkehrsberuhigten Bereich erkennen", en: "recognising the zebra crossing, stop and traffic-calmed area signs" } }
    - { id: shapes, what: { de: "an Form und Farbe erkennen, ob ein Schild warnt, verbietet, gebietet oder hinweist", en: "telling from shape and colour whether a sign warns, forbids, instructs or informs" } }
    - { id: stop, what: { de: "Stoppschild und Vorfahrt gewähren erkennen", en: recognising the stop and give way signs } }
  misconceptions:
    - id: walk-on-cycle-path
      what: Thinks pedestrians may walk on a cycle path
      addressed: lesson 1 Learn opens with the guess and answers no; l1-f2, l1-s3, l1-n1, l1-c4; l2-c5 in the skill check
    - id: play-street-no-cars
      what: Thinks no cars can come in a verkehrsberuhigter Bereich, so there is no need to look
      addressed: lesson 1 Learn says cars drive at walking pace and Nele still looks out; l1-s2, l1-n3; l2-c8 in the skill check
    - id: all-red-same
      what: Thinks every red sign means stop, or that the shape does not matter
      addressed: lesson 2 Learn separates triangle, round red border, octagon and the triangle on its point; l2-f3, l2-f5, l2-n3; l2-c11 to l2-c20 in the skill check
    - id: rolling-stop
      what: Thinks you may roll on slowly at a Stoppschild
      addressed: lesson 2 Learn says stop completely; l2-s1, l2-n2; l2-c17 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Schilder auf meinem Weg", en: "Signs on my way" }
    goal:
      de: "Lerne die Schilder kennen, die dir auf deinem Weg zeigen, wo du gehen darfst. Das blaue Schild mit dem Fahrrad heißt Radweg."
      en: "Get to know the signs on your way that show you where you may walk. The blue sign with the bicycle is the cycle path."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Bei welcher Ampel darfst du gehen?"
            say: "Schau dir die Ampeln an. Bei welcher Ampel darfst du gehen?"
            options: [{ object: traffic-light }, { object: traffic-light-green }]
            answer: traffic-light-green
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Am Zebrastreifen gehst du erst los, wenn die Autos stehen."
            say: "Am Zebrastreifen gehst du erst los, wenn die Autos stehen. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Darf Nele hier zu Fuß gehen?"
            say: "Nele macht mit Opa eine Schilder-Rallye durch ihr Viertel. Am ersten Weg steht ein rundes blaues Schild mit einem weißen Fahrrad. Was glaubst du: Darf Nele hier zu Fuß gehen?"
            show: { object: sign-cycle-path }
          - text: "Radweg: Hier fahren Fahrräder."
            say: "Nein! Das Schild heißt Radweg. Dieser Weg ist für Fahrräder. Zu Fuß gehst du hier nicht. Nele geht auf dem Gehweg daneben."
            show: { object: sign-cycle-path }
          - text: "Gehweg: Hier gehst du zu Fuß."
            say: "Auf dem nächsten runden blauen Schild gehen ein Erwachsener und ein Kind an der Hand. Das Schild heißt Gehweg. Dieser Weg ist für Menschen, die zu Fuß gehen."
            show: { text: "Gehweg" }
          - text: "Gemeinsamer Geh- und Radweg"
            say: "Auf diesem runden blauen Schild sind oben ein Erwachsener mit Kind und unten ein Fahrrad, mit einem Strich dazwischen. Es heißt gemeinsamer Geh- und Radweg. Hier gehen Fußgänger, und Radfahrer fahren auf demselben Weg. Alle passen aufeinander auf."
            show: { text: "gemeinsamer Geh- und Radweg" }
          - text: "Fußgängerüberweg: Hier ist ein Zebrastreifen."
            say: "Dieses Schild ist eckig und blau. Darin ist ein weißes Dreieck, und in dem Dreieck geht ein Mensch über einen Zebrastreifen. Das Schild heißt Fußgängerüberweg. Es zeigt: Hier ist ein Zebrastreifen."
            show: { text: "Fußgängerüberweg" }
          - text: "Haltestelle: Hier hält der Bus."
            say: "Das runde gelbe Schild mit dem grünen H heißt Haltestelle. Hier halten Busse oder Straßenbahnen."
            show: { object: sign-bus-stop }
          - text: "Verkehrsberuhigter Bereich"
            say: "Auf diesem eckigen blauen Schild spielt ein Kind mit einem Ball. Daneben sind ein Haus, ein Erwachsener und ein Auto. Das Schild heißt verkehrsberuhigter Bereich, viele sagen Spielstraße dazu. Hier dürfen Kinder auf der Straße spielen. Autos fahren nur Schrittgeschwindigkeit, also so langsam, wie ein Mensch geht. Trotzdem passt Nele auf, denn Autos können kommen."
            show: { text: "verkehrsberuhigter Bereich" }
          - text: "Wusstest du? Es gibt ein Verkehrsschild mit einem springenden Hirsch."
            say: "Wusstest du? Es gibt ein Verkehrsschild mit einem springenden Hirsch. Es warnt die Autofahrer: Hier laufen oft Rehe und Hirsche über die Straße."
            show: { text: "Achtung, Wildwechsel!" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Schild zeigt einen Radweg?"
                say: "Welches Schild zeigt einen Radweg?"
                options: [{ object: sign-bus-stop }, { object: sign-cycle-path }, { object: traffic-light }]
                answer: sign-cycle-path
                option_audio: false
                hints:
                  - "Auf dem Radweg fahren Fahrräder. Was ist auf dem Schild?"
                  - "Such das runde blaue Schild mit dem weißen Fahrrad."
                  - "Das blaue Schild mit dem Fahrrad."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Auf dem Radweg gehst du zu Fuß."
                say: "Auf dem Radweg gehst du zu Fuß. Stimmt das?"
                show: { object: sign-cycle-path }
                answer: false
                hints:
                  - "Für wen ist der Radweg?"
                  - "Der Radweg ist für Fahrräder. Zu Fuß gehst du woanders."
                  - "Nein. Du gehst auf dem Gehweg."
              - id: l1-f3
                type: matching
                text: "Wie sieht das Schild aus? Verbinde."
                say: "Wie sieht das Schild aus? Verbinde jedes Schild mit seinem Namen."
                pairs:
                  - { left: { text: "blauer Kreis, darin ein Erwachsener mit Kind" }, right: { text: "Gehweg" } }
                  - { left: { text: "blaues Viereck, darin ein Mensch auf einem Zebrastreifen" }, right: { text: "Fußgängerüberweg" } }
                  - { left: { text: "gelber Kreis mit grünem H" }, right: { text: "Haltestelle" } }
                hints:
                  - "Was zeigt das Bild auf dem Schild?"
                  - "Auf dem Gehweg gehen Menschen. Ein H steht für Haltestelle."
                  - "Erwachsener mit Kind ist Gehweg, Zebrastreifen ist Fußgängerüberweg, H ist Haltestelle."
              - id: l1-f4
                type: multiple_choice
                text: "Was zeigt das Schild Fußgängerüberweg?"
                say: "Was zeigt das Schild Fußgängerüberweg?"
                options: ["Hier ist ein Zebrastreifen.", "Hier dürfen nur Autos fahren.", "Hier ist ein Spielplatz."]
                answer: "Hier ist ein Zebrastreifen."
                hints:
                  - "Was ist in dem weißen Dreieck auf dem Schild?"
                  - "Ein Mensch geht über Streifen wie bei einem Zebra."
                  - "Hier ist ein Zebrastreifen."
              - id: l1-f5
                type: fill_in_blank
                text: "Für wen ist der Gehweg?"
                say: "Setz das passende Wort ein."
                frame: "Der Gehweg ist für Menschen, die zu _ gehen."
                options: ["Fuß", "Rad", "Auto"]
                answer: ["Fuß"]
                hints:
                  - "Auf dem Schild gehen ein Erwachsener und ein Kind."
                  - "Sie fahren nicht, sie gehen auf ihren Füßen."
                  - "Zu Fuß."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie heißt dieses Schild?"
                say: "Wie heißt dieses Schild?"
                show: { object: sign-bus-stop }
                options: ["Haltestelle", "Radweg", "Gehweg"]
                answer: "Haltestelle"
                hints: ["Das H ist der erste Buchstabe vom Namen."]
              - id: l1-s2
                type: true_false
                text: "Im verkehrsberuhigten Bereich fahren Autos nur Schrittgeschwindigkeit."
                say: "Im verkehrsberuhigten Bereich fahren Autos nur Schrittgeschwindigkeit. Stimmt das?"
                show: { text: "verkehrsberuhigter Bereich" }
                answer: true
                hints: ["Dort spielen Kinder auf der Straße. Wie schnell dürfen Autos da fahren?"]
              - id: l1-s3
                type: sorting
                text: "Darf Nele hier zu Fuß gehen?"
                say: "Darf Nele hier zu Fuß gehen? Sortiere."
                bins:
                  - { id: ja, show: { text: "zu Fuß: ja" }, say: "Hier darf Nele zu Fuß gehen." }
                  - { id: nein, show: { text: "zu Fuß: nein" }, say: "Hier geht Nele nicht zu Fuß." }
                options:
                  - { text: "Gehweg", bin: ja }
                  - { object: sign-cycle-path, bin: nein }
                  - { text: "gemeinsamer Geh- und Radweg", bin: ja }
                  - { text: "Fußgängerüberweg", bin: ja }
                hints: ["Nur ein Weg hier ist allein für Fahrräder."]
              - id: l1-s4
                type: multiple_choice
                text: "Ein blauer Kreis: oben ein Erwachsener mit Kind, unten ein Fahrrad, ein Strich dazwischen. Was heißt das?"
                say: "Ein runder blauer Kreis: oben ein Erwachsener mit Kind, unten ein Fahrrad, ein Strich dazwischen. Was heißt das?"
                options: ["Fußgänger und Radfahrer teilen sich den Weg.", "Hier dürfen nur Fahrräder fahren.", "Hier ist eine Haltestelle."]
                answer: "Fußgänger und Radfahrer teilen sich den Weg."
                hints: ["Auf dem Schild sind Menschen und ein Fahrrad zusammen."]
              - id: l1-s5
                type: fill_in_blank
                text: "Wie sagen viele zum verkehrsberuhigten Bereich?"
                say: "Setz das passende Wort ein."
                frame: "Zum verkehrsberuhigten Bereich sagen viele auch _."
                options: ["Spielstraße", "Autobahn", "Radweg"]
                answer: ["Spielstraße"]
                hints: ["Dort dürfen Kinder auf der Straße spielen."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Nele und Opa kommen an einen Radweg. Opa fragt: „Wo gehen wir jetzt?“"
                say: "Nele und Opa kommen an einen Weg mit diesem Schild. Opa fragt: Wo gehen wir jetzt?"
                show: { object: sign-cycle-path }
                options: ["auf dem Gehweg daneben", "auf dem Radweg", "mitten auf der Straße"]
                answer: "auf dem Gehweg daneben"
              - id: l1-n2
                type: true_false
                text: "Nele sieht das Schild Fußgängerüberweg. Sie sagt: „Hier ist ein Zebrastreifen.“ Stimmt das?"
                say: "Nele sieht das Schild Fußgängerüberweg. Sie sagt: Hier ist ein Zebrastreifen. Stimmt das?"
                show: { text: "Fußgängerüberweg" }
                answer: true
              - id: l1-n3
                type: multiple_choice
                text: "Im verkehrsberuhigten Bereich rollt Neles Ball weg. Ein Auto kommt langsam. Was macht Nele?"
                say: "Im verkehrsberuhigten Bereich rollt Neles Ball weg. Ein Auto kommt langsam angefahren. Was macht Nele?"
                options: ["Sie wartet, bis das Auto vorbei ist.", "Sie rennt sofort hinter dem Ball her.", "Sie legt sich auf die Straße."]
                answer: "Sie wartet, bis das Auto vorbei ist."
              - id: l1-n4
                type: matching
                text: "Welches Schild passt? Verbinde."
                say: "Welches Schild passt? Verbinde."
                pairs:
                  - { left: { text: "Hier wartet Nele auf den Bus." }, right: { object: sign-bus-stop } }
                  - { left: { text: "Hier fährt Opa mit dem Fahrrad." }, right: { object: sign-cycle-path } }
                  - { left: { text: "Hier geht Nele über die Straße." }, right: { text: "Fußgängerüberweg" } }
              - id: l1-n5
                type: fill_in_blank
                text: "Opa erklärt den gemeinsamen Geh- und Radweg."
                say: "Opa erklärt den gemeinsamen Geh- und Radweg. Setz das passende Wort ein."
                frame: "Hier passen Fußgänger und _ aufeinander auf."
                options: ["Radfahrer", "Lastwagen", "Züge"]
                answer: ["Radfahrer"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Schild zeigt eine Haltestelle?"
            say: "Welches Schild zeigt eine Haltestelle?"
            options: [{ object: sign-cycle-path }, { object: sign-toilet }, { object: sign-bus-stop }]
            answer: sign-bus-stop
            option_audio: false
          - id: l1-c2
            type: true_false
            text: "Der Gehweg ist für Menschen, die zu Fuß gehen."
            say: "Der Gehweg ist für Menschen, die zu Fuß gehen. Stimmt das?"
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Ein eckiges blaues Schild, darin ein Mensch auf einem Zebrastreifen. Wie heißt es?"
            say: "Ein eckiges blaues Schild, darin ein Mensch auf einem Zebrastreifen. Wie heißt es?"
            options: ["Fußgängerüberweg", "Radweg", "Haltestelle"]
            answer: "Fußgängerüberweg"
          - id: l1-c4
            type: true_false
            text: "Auf dem Radweg spielen Kinder Fangen."
            say: "Auf dem Radweg spielen Kinder Fangen. Ist das richtig?"
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Wo dürfen Kinder auf der Straße spielen?"
            say: "Wo dürfen Kinder auf der Straße spielen?"
            options: ["im verkehrsberuhigten Bereich", "auf dem Radweg", "an der Haltestelle"]
            answer: "im verkehrsberuhigten Bereich"
          - id: l1-c6
            type: fill_in_blank
            text: "Wie heißt das blaue Schild mit dem weißen Fahrrad?"
            say: "Setz das passende Wort ein."
            frame: "Das blaue Schild mit dem weißen Fahrrad heißt _."
            options: ["Radweg", "Gehweg", "Spielstraße"]
            answer: ["Radweg"]

  - n: 2
    title: { de: "Form und Farbe verraten es", en: "Shape and colour tell you" }
    goal:
      de: "Erkenne an Form und Farbe, was ein Schild will. Ein Dreieck mit rotem Rand warnt, das Stoppschild hat acht Ecken."
      en: "Tell from shape and colour what a sign wants. A triangle with a red border warns, the stop sign has eight corners."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Am Schild Fußgängerüberweg ist ein Zebrastreifen."
            say: "Am Schild Fußgängerüberweg ist ein Zebrastreifen. Stimmt das?"
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wo geht Nele zu Fuß?"
            say: "Wo geht Nele zu Fuß?"
            options: ["auf dem Gehweg", "auf dem Radweg", "mitten auf der Straße"]
            answer: "auf dem Gehweg"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Warum sehen die Schilder so verschieden aus?"
            say: "Auf der Rallye sieht Nele Dreiecke, Kreise und Vierecke, rote und blaue. Was glaubst du: Warum sehen Verkehrsschilder so verschieden aus?"
            show: { drawn: shape, row: [triangle, circle, square, octagon], colours: [white, blue, blue, red] }
          - text: "Form und Farbe verraten, was ein Schild will."
            say: "Form und Farbe verraten dir schon von weitem, was ein Schild will. So weißt du es, bevor du das Bild darauf erkennst."
            show: { drawn: shape, row: [triangle, circle, square, octagon], colours: [white, blue, blue, red] }
          - text: "Dreieck mit rotem Rand: Achtung, Gefahr!"
            say: "Ein Dreieck mit rotem Rand und der Spitze nach oben warnt: Achtung, Gefahr! Das Schild Kinder zeigt zwei laufende Kinder. Es warnt die Autofahrer: Hier können Kinder auf die Straße laufen."
            show: { text: "Achtung, Kinder!" }
          - text: "Kreis mit rotem Rand: Das ist verboten."
            say: "Ein runder Kreis mit rotem Rand verbietet etwas. Ist darin ein Fußgänger, heißt das Schild Verbot für Fußgänger: Hier darfst du nicht zu Fuß gehen. Ist der Kreis innen ganz weiß und leer, heißt das: Verbot für Fahrzeuge aller Art. Dort darf kein Fahrzeug fahren."
            show: { text: "Verbot" }
          - text: "Blauer Kreis: So musst du es machen."
            say: "Ein runder blauer Kreis sagt dir, was du tun musst oder für wen ein Weg ist. Radweg und Gehweg sind solche Schilder."
            show: { object: sign-cycle-path }
          - text: "Eckig und blau: ein Hinweis"
            say: "Eckige blaue Schilder geben dir einen Hinweis, zum Beispiel Fußgängerüberweg oder verkehrsberuhigter Bereich."
            show: { drawn: shape, kind: square, colour: blue }
          - text: "Stoppschild und Vorfahrt gewähren"
            say: "Zwei Schilder haben eine ganz eigene Form. Das Stoppschild ist ein rotes Achteck mit dem Wort Stopp. Wer mit dem Auto oder dem Fahrrad kommt, muss hier ganz anhalten und die anderen vorlassen. Das Schild Vorfahrt gewähren ist ein Dreieck, das auf der Spitze steht. Auch hier lässt man die anderen vor, muss aber nicht immer anhalten."
            show: { drawn: shape, kind: octagon, colour: red }
          - text: "Wusstest du? Das Stoppschild ist das einzige Schild mit acht Ecken."
            say: "Wusstest du? Das Stoppschild ist das einzige Verkehrsschild mit acht Ecken. Darum erkennt man es sogar von hinten, oder wenn Schnee darauf liegt."
            show: { drawn: shape, kind: octagon, colour: red }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Ein Dreieck mit rotem Rand. Was will das Schild?"
                say: "Ein Dreieck mit rotem Rand und der Spitze nach oben. Was will das Schild?"
                options: ["Es warnt: Achtung, Gefahr!", "Es zeigt einen Radweg.", "Es lädt zum Spielen ein."]
                answer: "Es warnt: Achtung, Gefahr!"
                hints:
                  - "Denk an das Schild Kinder. Wen warnt es?"
                  - "Dreiecke mit rotem Rand sagen: Pass auf!"
                  - "Es warnt: Achtung, Gefahr!"
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Welche Form hat das Stoppschild?"
                say: "Welche Form hat das Stoppschild?"
                options:
                  - { drawn: shape, kind: circle, colour: white }
                  - { drawn: shape, kind: octagon, colour: white }
                  - { drawn: shape, kind: triangle, colour: white }
                answer: octagon
                option_audio: false
                hints:
                  - "Zähl die Ecken."
                  - "Das Stoppschild ist das einzige Schild mit acht Ecken."
                  - "Das Achteck."
              - id: l2-f3
                type: sorting
                text: "Warnt das Schild, oder verbietet es etwas?"
                say: "Warnt das Schild, oder verbietet es etwas? Sortiere."
                bins:
                  - { id: warnt, show: { text: "warnt" }, say: "warnt" }
                  - { id: verbietet, show: { text: "verbietet" }, say: "verbietet" }
                options:
                  - { text: "runder Kreis mit rotem Rand", bin: verbietet }
                  - { text: "Dreieck mit rotem Rand", bin: warnt }
                  - { text: "Verbot für Fußgänger", bin: verbietet }
                  - { text: "Achtung, Kinder!", bin: warnt }
                hints:
                  - "Achte auf die Form: Dreieck oder Kreis?"
                  - "Dreiecke warnen, Kreise mit rotem Rand verbieten."
                  - "Kreis und Verbot für Fußgänger verbieten, Dreieck und Kinder warnen."
              - id: l2-f4
                type: true_false
                text: "Ein runder blauer Kreis verbietet etwas."
                say: "Ein runder blauer Kreis verbietet etwas. Stimmt das?"
                show: { drawn: shape, kind: circle, colour: blue }
                answer: false
                hints:
                  - "Welches Schild ist ein blauer Kreis?"
                  - "Der Radweg ist ein blauer Kreis. Er zeigt, für wen der Weg ist."
                  - "Nein. Ein blauer Kreis sagt, was du tun musst."
              - id: l2-f5
                type: matching
                text: "Was will das Schild? Verbinde."
                say: "Was will das Schild? Verbinde jede Form mit ihrer Bedeutung."
                pairs:
                  - { left: { drawn: shape, kind: circle, colour: blue }, right: { text: "So musst du es machen." } }
                  - { left: { drawn: shape, kind: square, colour: blue }, right: { text: "ein Hinweis" } }
                  - { left: { drawn: shape, kind: octagon, colour: red }, right: { text: "anhalten und die anderen vorlassen" } }
                hints:
                  - "Fang mit dem roten Achteck an."
                  - "Das Achteck ist das Stoppschild. Eckig und blau gibt einen Hinweis."
                  - "Kreis: so musst du es machen, Viereck: Hinweis, Achteck: anhalten."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Opa kommt mit dem Fahrrad an ein Stoppschild. Was muss er tun?"
                say: "Opa kommt mit dem Fahrrad an ein Stoppschild. Was muss er tun?"
                options: ["ganz anhalten und die anderen vorlassen", "schneller fahren", "klingeln und weiterfahren"]
                answer: "ganz anhalten und die anderen vorlassen"
