# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.materials-sort
skill: world.nature.materials-sort
curriculum: de-DE
language: de
title:
  de: Woraus ist das?
  en: What is it made of?
summary: >
  Jonas helps Oma Ilse clear the attic for the flea market and sorts
  everything into boxes. Lesson 1 opens with the guess what a spoon is
  made of and names four materials: Holz (from trees), Metall (shiny,
  hard, cool to the touch), Glas (made from sand, breaks easily) and
  Kunststoff, also called Plastik. One kind of thing can be made of
  different materials (a spoon of wood, metal or plastic), and one thing
  can be made of two (the scissors). Lesson 2 sorts the things at the
  flea market stall by their properties: hart or weich, durchsichtig or
  undurchsichtig (a plastic bottle can be see-through too), and says why
  a thing is made of its material (a window of glass to look through, a
  playground bottle of plastic because glass breaks). It ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [math.data.sort-classify]
  also_practises: []
  vocabulary: { de: [Material, Holz, Metall, Glas, Kunststoff, Plastik, hart, weich, durchsichtig, undurchsichtig, zerbrechlich] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: material, what: { de: "erkennen, aus welchem Material ein Ding ist (Holz, Metall, Glas, Kunststoff)", en: "telling what material a thing is made of (wood, metal, glass, plastic)" } }
    - { id: hard-soft, what: { de: "Dinge nach hart und weich ordnen", en: sorting things into hard and soft } }
    - { id: see-through, what: { de: "Dinge nach durchsichtig und undurchsichtig ordnen", en: sorting things into see-through and not see-through } }
    - { id: purpose, what: { de: "sagen, warum ein Ding aus seinem Material gemacht ist", en: saying why a thing is made of its material } }
  misconceptions:
    - id: thing-is-material
      what: Thinks a kind of thing always has one material (a spoon is always metal)
      addressed: lesson 1 Learn shows spoons of wood, metal and plastic and the scissors of metal and plastic; l1-f4, l1-s4 and l1-n4; l2-c5 in the skill check
    - id: shiny-is-metal
      what: Thinks everything that shines is made of metal
      addressed: lesson 1 Learn says glass can shine too; l1-s3 with the glass marble; l2-c4 in the skill check
    - id: only-glass-see-through
      what: Thinks only glass is see-through
      addressed: lesson 2 Learn shows the clear plastic bottle; l2-f3 and l2-n3; l2-c14 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Holz, Metall, Glas und Kunststoff", en: "Wood, metal, glass and plastic" }
    goal:
      de: "Finde heraus, aus welchem Material die Dinge gemacht sind, so wie der Löffel aus Metall."
      en: "Find out what material things are made of, like the spoon made of metal."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was passt nicht zu den anderen?"
            say: "Was passt nicht zu den anderen?"
            options: [{ object: apple }, { object: banana }, { object: car }]
            answer: car
            feedback:
              banana: "Banane und Apfel kann man essen. Das Auto passt nicht dazu."
            difficulty: easy
          - id: l1-w2
            type: sorting
            text: "Rot oder blau?"
            say: "Sortiere die Dinge nach ihrer Farbe. Was ist rot, was ist blau?"
            bins:
              - { id: rot, show: { text: "rot" }, say: "rot" }
              - { id: blau, show: { text: "blau" }, say: "blau" }
            options:
              - { object: ball, bin: rot }
              - { object: cup, bin: blau }
              - { object: woolly-hat, bin: rot }
              - { object: jug, bin: blau }
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Woraus ist der Löffel?"
            say: "Jonas hilft Oma Ilse, den Dachboden aufzuräumen. Am Samstag ist Flohmarkt. In einer Kiste findet Jonas einen silbernen Löffel. Was glaubst du: Woraus ist der Löffel gemacht?"
            show: { object: spoon }
          - text: "Der Löffel ist aus Metall."
            say: "Aus Metall! Woraus ein Ding gemacht ist, heißt sein Material. Metall ist hart, fühlt sich kühl an und glänzt oft. Auch die Gabel, die Büroklammer, die Glocke und der Anker sind aus Metall."
            show: { objects: [spoon, paper-clip] }
          - text: "Holz kommt vom Baum."
            say: "Die Leiter, der Bleistift und der Gartenzaun sind aus Holz. Holz kommt von Bäumen. Man sieht oft feine Streifen darin."
            show: { objects: [ladder, pencil] }
          - text: "Glas geht leicht kaputt."
            say: "Das Trinkglas und das Fenster sind aus Glas. Durch Glas kann man oft hindurchsehen. Glas glänzt auch, aber es ist kein Metall. Auch die Murmel ist aus Glas. Wenn Glas herunterfällt, geht es leicht kaputt."
            show: { objects: [glass, window] }
          - text: "Kunststoff heißt auch Plastik."
            say: "Der Eimer und das Lineal sind aus Kunststoff. Viele sagen dazu Plastik. Kunststoff ist leicht und geht nicht so schnell kaputt wie Glas."
            show: { objects: [bucket, ruler] }
          - text: "Ein Ding, verschiedene Materialien"
            say: "Oma Ilse hat noch mehr Löffel: einen aus Holz zum Kochen und einen aus Kunststoff für das Baby. Ein Löffel kann also aus verschiedenen Materialien sein. Und manche Dinge sind aus zwei Materialien: Bei der Schere ist die Klinge aus Metall und der Griff aus Kunststoff."
            show: { object: scissors }
          - text: "Wusstest du? Glas macht man aus Sand."
            say: "Wusstest du? Glas macht man vor allem aus Sand. Der Sand wird so heiß gemacht, dass er flüssig wird. Wenn er wieder abkühlt, ist daraus Glas geworden."
            show: { object: glass }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was ist aus Holz?"
                say: "Was ist aus Holz?"
                options: [{ object: ladder }, { object: spoon }, { object: bucket }]
                answer: ladder
                feedback:
                  spoon: "Der Löffel glänzt silbern. Er ist aus Metall. Die Leiter ist aus Holz."
                hints:
                  - "Holz kommt von Bäumen."
                  - "Der silberne Löffel ist aus Metall, der rote Eimer aus Kunststoff."
                  - "Die Leiter ist aus Holz."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Holz oder Metall?"
                say: "Jonas packt Kisten für den Flohmarkt. Sortiere: Was ist aus Holz, was aus Metall?"
                bins:
                  - { id: holz, show: { text: "Holz" }, say: "Holz" }
                  - { id: metall, show: { text: "Metall" }, say: "Metall" }
                options:
                  - { object: pencil, bin: holz }
                  - { object: paper-clip, bin: metall }
                  - { object: fence, bin: holz }
                  - { object: fork, bin: metall }
                hints:
                  - "Was glänzt silbern und fühlt sich kühl an?"
                  - "Der Bleistift und der Zaun sind aus dem Material von Bäumen."
                  - "Bleistift und Zaun zu Holz, Büroklammer und Gabel zu Metall."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Das Trinkglas ist aus Glas."
                say: "Stimmt das? Das Trinkglas ist aus Glas."
                show: { object: glass }
                answer: true
                hints:
                  - "Kannst du durch das Trinkglas hindurchsehen?"
                  - "Es geht leicht kaputt, wenn es herunterfällt."
                  - "Ja. Das Trinkglas ist aus Glas."
              - id: l1-f4
                type: multiple_choice
                text: "Woraus kann ein Löffel sein?"
                say: "Woraus kann ein Löffel sein?"
                options: ["aus Metall, Holz oder Kunststoff", "nur aus Metall", "nur aus Holz"]
                answer: "aus Metall, Holz oder Kunststoff"
                hints:
                  - "Denk an die Löffel von Oma Ilse."
                  - "Sie hat einen silbernen, einen zum Kochen und einen für das Baby."
                  - "Ein Löffel kann aus Metall, Holz oder Kunststoff sein."
              - id: l1-f5
                type: matching
                text: "Aus welchem Material ist das?"
                say: "Verbinde jedes Ding mit seinem Material."
                pairs:
                  - { left: { object: ruler }, right: { text: "Kunststoff" } }
                  - { left: { object: window }, right: { text: "Glas" } }
                  - { left: { object: bell }, right: { text: "Metall" } }
                hints:
                  - "Fang mit dem Ding an, durch das man hindurchsehen kann."
                  - "Das Lineal ist leicht und biegt sich ein bisschen. Die Glocke klingt hell."
                  - "Lineal und Kunststoff, Fenster und Glas, Glocke und Metall."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was ist aus Kunststoff?"
                say: "Was ist aus Kunststoff?"
                options: [{ object: bucket }, { object: ladder }, { object: anchor }]
                answer: bucket
                hints: ["Kunststoff heißt auch Plastik."]
              - id: l1-s2
                type: fill_in_blank
                text: "Woraus ist das?"
                say: "Setz die passenden Wörter ein."
                frame: "Der Bleistift ist aus _. Die Gabel ist aus _."
                options: ["Holz", "Metall", "Glas"]
                answer: ["Holz", "Metall"]
                hints: ["Was kommt vom Baum, was glänzt silbern?"]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Die Murmel glänzt, also ist sie aus Metall."
                say: "Stimmt das? Die Murmel glänzt, also ist sie aus Metall."
                show: { object: marble }
                answer: false
                hints: ["Glänzt nur Metall? Oder kann auch Glas glänzen?"]
              - id: l1-s4
                type: multiple_choice
                text: "Bei der Schere ist die Klinge aus Metall. Woraus ist der rote Griff?"
                say: "Bei der Schere ist die Klinge aus Metall. Woraus ist der rote Griff?"
                show: { object: scissors }
                options: ["aus Kunststoff", "aus Glas", "aus Holz"]
                answer: "aus Kunststoff"
                hints: ["Ein Ding kann aus zwei Materialien sein."]
              - id: l1-s5
                type: sorting
                text: "Glas oder Kunststoff?"
                say: "Sortiere: Was ist aus Glas, was aus Kunststoff?"
                bins:
                  - { id: glas, show: { text: "Glas" }, say: "Glas" }
                  - { id: kunststoff, show: { text: "Kunststoff" }, say: "Kunststoff" }
                options:
                  - { object: window, bin: glas }
                  - { object: ruler, bin: kunststoff }
                  - { object: marble, bin: glas }
                  - { object: bucket, bin: kunststoff }
                hints: ["Was geht leicht kaputt, wenn es herunterfällt?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Oma Ilse sucht etwas aus Metall für die Metallkiste. Was gibt Jonas ihr?"
                say: "Oma Ilse sucht etwas aus Metall für die Metallkiste. Was gibt Jonas ihr?"
                options: [{ object: anchor }, { object: pencil }, { object: ruler }]
                answer: anchor
              - id: l1-n2
                type: multiple_choice
                text: "Jonas findet einen alten Holzstuhl. In welche Kiste kommt er?"
                say: "Jonas findet einen alten Holzstuhl. In welche Kiste kommt er?"
                options: ["in die Kiste für Holz", "in die Kiste für Glas", "in die Kiste für Metall"]
                answer: "in die Kiste für Holz"
              - id: l1-n3
                type: sorting
                text: "Jonas räumt die letzten Sachen in die Kisten. Wohin kommt was?"
                say: "Jonas räumt die letzten Sachen in die Kisten. Wohin kommt was? Sortiere."
                bins:
                  - { id: holz, show: { text: "Holz" }, say: "Holz" }
                  - { id: metall, show: { text: "Metall" }, say: "Metall" }
                  - { id: glas, show: { text: "Glas" }, say: "Glas" }
                options:
                  - { object: glass, bin: glas }
                  - { object: ladder, bin: holz }
                  - { object: spoon, bin: metall }
                  - { object: marble, bin: glas }
              - id: l1-n4
                type: true_false
                text: "Jonas sagt: „Ein Löffel ist immer aus Metall.“ Stimmt das?"
                say: "Jonas sagt: Ein Löffel ist immer aus Metall. Stimmt das?"
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Jonas schreibt Schilder für die Kisten."
                say: "Jonas schreibt Schilder für die Kisten. Setz die passenden Wörter ein."
                frame: "Der Eimer ist aus _. Das Fenster ist aus _."
                options: ["Kunststoff", "Glas", "Holz"]
                answer: ["Kunststoff", "Glas"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was ist aus Metall?"
            say: "Was ist aus Metall?"
            options: [{ object: fork }, { object: pencil }, { object: bucket }]
            answer: fork
          - id: l1-c2
            type: multiple_choice
            text: "Woraus ist die Leiter?"
            say: "Woraus ist die Leiter?"
            show: { object: ladder }
            options: ["aus Holz", "aus Glas", "aus Kunststoff"]
            answer: "aus Holz"
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Das Lineal ist aus Kunststoff."
            say: "Stimmt das? Das Lineal ist aus Kunststoff."
            show: { object: ruler }
            answer: true
          - id: l1-c4
            type: image_multiple_choice
            text: "Was ist aus Glas?"
            say: "Was ist aus Glas?"
            options: [{ object: window }, { object: anchor }, { object: fence }]
            answer: window
          - id: l1-c5
            type: fill_in_blank
            text: "Woraus ist das?"
            say: "Setz das passende Wort ein."
            frame: "Die Büroklammer ist aus _."
            options: ["Metall", "Holz", "Glas"]
            answer: ["Metall"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? Holz kommt von Bäumen."
            say: "Stimmt das? Holz kommt von Bäumen."
            answer: true

  - n: 2
    title: { de: "Hart, weich, durchsichtig", en: "Hard, soft, see-through" }
    goal:
      de: "Ordne Dinge danach, wie sie sind: hart oder weich, durchsichtig oder nicht. Ein Stein ist hart, ein Teddy ist weich."
      en: "Sort things by what they are like: hard or soft, see-through or not. A stone is hard, a teddy is soft."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was ist aus Holz?"
            say: "Jonas sucht etwas aus Holz. Was ist aus Holz?"
            options: [{ object: pencil }, { object: glass }, { object: paper-clip }]
            answer: pencil
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Die Gabel ist aus Glas."
            say: "Stimmt das? Die Gabel ist aus Glas."
            show: { object: fork }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was fühlt sich weich an?"
            say: "Am Samstag baut Oma Ilse ihren Flohmarktstand auf. Ein Mädchen sucht etwas Weiches zum Kuscheln. Was glaubst du: Was fühlt sich weich an, der Teddy oder der Stein?"
            show: { objects: [teddy, stone] }
          - text: "Der Teddy ist weich, der Stein ist hart."
            say: "Der Teddy! Drück mit dem Finger darauf: Er gibt nach. Er ist weich. Der Stein gibt nicht nach. Er ist hart. Weich sind auch die Socke und die Feder. Hart sind auch der Löffel und das Glas."
            show: { objects: [teddy, stone] }
          - text: "Durchsichtig: Man kann hindurchsehen."
            say: "Durch das Trinkglas kann Jonas hindurchsehen. Es ist durchsichtig. Auch die Plastikflasche ist durchsichtig, obwohl sie aus Kunststoff ist. Durch das Buch und die Kiste sieht er nichts. Sie sind undurchsichtig."
            show: { objects: [glass, bottle] }
          - text: "Das Material passt zur Aufgabe."
            say: "Warum ist ein Ding aus seinem Material? Das Fenster ist aus Glas, weil es durchsichtig ist. So kommt Licht herein, und du kannst hinausschauen. Der Pullover ist aus Wolle, weil sie weich und warm ist."
            show: { objects: [window, jumper] }
          - text: "Glas zerbricht, Kunststoff nicht so schnell."
            say: "Glas ist zerbrechlich. Darum nimmt Jonas auf den Spielplatz eine Flasche aus Kunststoff mit, keine aus Glas. Die Leiter ist aus Holz, weil Holz hart und fest ist und gut trägt."
            show: { objects: [bottle, ladder] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Hart oder weich?"
                say: "Sortiere: Was ist hart, was ist weich?"
                bins:
                  - { id: hart, show: { text: "hart" }, say: "hart" }
                  - { id: weich, show: { text: "weich" }, say: "weich" }
                options:
                  - { object: stone, bin: hart }
                  - { object: sock, bin: weich }
                  - { object: spoon, bin: hart }
                  - { object: feather, bin: weich }
                hints:
                  - "Stell dir vor, du drückst mit dem Finger darauf."
                  - "Was gibt nach? Was bleibt, wie es ist?"
                  - "Stein und Löffel sind hart, Socke und Feder sind weich."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Durch welches Ding kannst du hindurchsehen?"
                say: "Durch welches Ding kannst du hindurchsehen?"
                options: [{ object: window }, { object: book }, { object: box }]
                answer: window
                hints:
                  - "Durchsichtig heißt: Man kann hindurchsehen."
                  - "Buch und Kiste sind undurchsichtig."
                  - "Durch das Fenster kannst du hindurchsehen."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Nur Glas kann durchsichtig sein."
                say: "Stimmt das? Nur Glas kann durchsichtig sein."
                answer: false
                hints:
                  - "Denk an die Flasche, die Jonas mit auf den Spielplatz nimmt."
                  - "Die Flasche ist aus Kunststoff. Kann man durch sie hindurchsehen?"
                  - "Nein. Auch die Plastikflasche ist durchsichtig."
              - id: l2-f4
                type: multiple_choice
                text: "Warum ist das Fenster aus Glas?"
                say: "Warum ist das Fenster aus Glas?"
                show: { object: window }
                options: ["weil Glas durchsichtig ist", "weil Glas weich ist", "weil Glas nie kaputtgeht"]
                answer: "weil Glas durchsichtig ist"
                feedback:
                  "weil Glas nie kaputtgeht": "Glas geht leider leicht kaputt. Das Fenster ist aus Glas, weil man hindurchsehen kann."
                hints:
                  - "Was willst du durch ein Fenster tun?"
                  - "Du willst hinausschauen, und Licht soll hereinkommen."
                  - "Das Fenster ist aus Glas, weil Glas durchsichtig ist."
              - id: l2-f5
                type: matching
                text: "Wie ist das Ding?"
                say: "Verbinde jedes Ding mit dem passenden Wort."
                pairs:
                  - { left: { object: teddy }, right: { text: "weich" } }
                  - { left: { object: glass }, right: { text: "durchsichtig" } }
                  - { left: { object: stone }, right: { text: "hart" } }
                hints:
                  - "Fang mit dem Ding an, durch das du hindurchsehen kannst."
                  - "Der Teddy gibt nach, wenn du drückst. Der Stein nicht."
                  - "Teddy und weich, Glas und durchsichtig, Stein und hart."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was ist weich?"
                say: "Was ist weich?"
                options: [{ object: woolly-hat }, { object: dice }, { object: anchor }]
                answer: woolly-hat
                hints: ["Was gibt nach, wenn du darauf drückst?"]
              - id: l2-s2
                type: sorting
                text: "Durchsichtig oder undurchsichtig?"
                say: "Sortiere: Was ist durchsichtig, was ist undurchsichtig?"
                bins:
                  - { id: durch, show: { text: "durchsichtig" }, say: "durchsichtig" }
                  - { id: undurch, show: { text: "undurchsichtig" }, say: "undurchsichtig" }
                options:
                  - { object: glass, bin: durch }
                  - { object: book, bin: undurch }
                  - { object: bottle, bin: durch }
                  - { object: teddy, bin: undurch }
                hints: ["Durch welche Dinge kannst du hindurchsehen?"]
              - id: l2-s3
                type: multiple_choice
                text: "Warum ist der Pullover aus Wolle?"
                say: "Warum ist der Pullover aus Wolle?"
                show: { object: jumper }
                options: ["weil Wolle weich und warm ist", "weil Wolle durchsichtig ist", "weil Wolle hart ist"]
                answer: "weil Wolle weich und warm ist"
                hints: ["Wie soll sich ein Pullover auf der Haut anfühlen?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Glas ist zerbrechlich."
                say: "Stimmt das? Glas ist zerbrechlich."
                show: { object: glass }
                answer: true
                hints: ["Was passiert, wenn ein Glas auf den Boden fällt?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Wie ist das?"
                say: "Setz die passenden Wörter ein."
                frame: "Der Stein ist _. Die Feder ist _."
                options: ["hart", "weich", "durchsichtig"]
                answer: ["hart", "weich"]
                hints: ["Was gibt nach, wenn du darauf drückst?"]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ein Junge will auf dem Spielplatz trinken. Welche Flasche passt am besten?"
                say: "Ein Junge will auf dem Spielplatz trinken. Welche Flasche passt am besten?"
                options: ["eine Flasche aus Kunststoff", "eine Flasche aus Glas", "eine Flasche aus Papier"]
                answer: "eine Flasche aus Kunststoff"
                feedback:
                  "eine Flasche aus Papier": "Eine Flasche aus Papier? Die wäre ganz schnell matschig! Kunststoff passt am besten."
              - id: l2-n2
                type: image_multiple_choice
                text: "Ein Baby braucht etwas Weiches zum Kuscheln. Was gibt Oma Ilse ihm?"
                say: "Ein Baby braucht etwas Weiches zum Kuscheln. Was gibt Oma Ilse ihm?"
                options: [{ object: teddy }, { object: stone }, { object: fork }]
                answer: teddy
              - id: l2-n3
                type: true_false
                text: "Ein Mann fragt: „Kann ich durch die Plastikflasche hindurchsehen?“ Oma Ilse sagt: „Ja, sie ist durchsichtig.“ Stimmt das?"
                say: "Ein Mann fragt: Kann ich durch die Plastikflasche hindurchsehen? Oma Ilse sagt: Ja, sie ist durchsichtig. Stimmt das?"
                show: { object: bottle }
                answer: true
              - id: l2-n4
                type: sorting
                text: "Oma Ilse sortiert ihren Stand. Was ist hart, was ist weich?"
                say: "Oma Ilse sortiert ihren Stand. Was ist hart, was ist weich? Sortiere."
                bins:
                  - { id: hart, show: { text: "hart" }, say: "hart" }
                  - { id: weich, show: { text: "weich" }, say: "weich" }
                options:
                  - { object: jumper, bin: weich }
                  - { object: dice, bin: hart }
                  - { object: teddy, bin: weich }
                  - { object: bell, bin: hart }
              - id: l2-n5
                type: multiple_choice
