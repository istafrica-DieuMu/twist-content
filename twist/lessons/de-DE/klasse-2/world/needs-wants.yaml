# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.needs-wants
skill: world.society.needs-wants
curriculum: de-DE
language: de
title:
  de: Brauchen oder wünschen
  en: Needs and wants
summary: >
  Ella goes camping by a lake with her Opa, and not everything fits in
  the suitcase. Lesson 1 tells needs from wants: needs are what every
  person needs to live (water, food, warm clothes, a place to sleep, and
  also people who love you, help when you are ill, learning); wants are
  nice but you can live without them (stickers, chocolate, a beach ball).
  Wanting something very much does not make it a need, and wants are
  fine; they can often wait. Lesson 2 goes shopping with Mama, who has
  little money left: needs come first, a want can wait or be saved for.
  Some needs are met by things you can buy (bread, a jacket, a bed),
  others by people who work for us (the doctor, the teacher, the fire
  brigade). Everyone has the same needs; wants differ from person to
  person. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Wünschen und Kaufen, en: Wanting and buying }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.society.feelings-needs]
  also_practises: []
  vocabulary: { de: [Bedürfnis, Wunsch, brauchen, wünschen, zum Leben, warten, sparen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: needs, what: { de: "Bedürfnisse nennen: was jeder Mensch zum Leben braucht", en: "naming needs: what every person needs to live" } }
    - { id: wants, what: { de: "Wünsche erkennen: was schön ist, aber nicht nötig zum Leben", en: "recognising wants: what is nice but not needed to live" } }
    - { id: choose, what: { de: "Bedürfnisse und Wünsche unterscheiden und sagen, was zuerst kommt und wer oder was ein Bedürfnis erfüllt", en: "telling needs from wants, saying which comes first and who or what meets a need" } }
  misconceptions:
    - id: want-is-need
      what: Thinks something becomes a need because they want it very much ("Ich brauche ein Handy!")
      addressed: lesson 1 Learn says wanting very much does not make a need; l1-f4, l1-s3 and l1-n2; l2-n5 and l2-c19 in the skill check
    - id: needs-only-things
      what: Thinks needs are only things to buy and forgets sleep, love, health and learning, and the people who help
      addressed: lesson 1 Learn names love, health and learning; l1-f3, l1-s4 and l1-s5; lesson 2 Learn shows people who meet needs; l2-f2, l2-f4, l2-s3 and l2-n1; l2-c2, l2-c6 and l2-c17 in the skill check
    - id: wants-are-bad
      what: Thinks wishes are bad or forbidden
      addressed: lesson 1 Learn says wants are fine and can wait; l1-c5; lesson 2 Learn shows saving and birthdays; l2-s1, l2-n2 and l2-c12
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was muss in den Koffer?", en: "What goes in the suitcase?" }
    goal:
      de: "Finde heraus, was du zum Leben brauchst und was du dir nur wünschst. Wasser brauchst du, einen Wasserball wünschst du dir."
      en: "Find out what you need to live and what you only want. You need water; a beach ball is something you want."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Ben gähnt und reibt sich die Augen. Wie fühlt er sich?"
            say: "Ben gähnt und reibt sich die Augen. Wie fühlt er sich?"
            options: [{ object: tired }, { object: happy }, { object: angry }]
            answer: tired
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Lena ist sehr müde. Was braucht sie jetzt?"
            say: "Lena ist sehr müde. Was braucht sie jetzt?"
            show: { object: tired }
            options: ["Schlaf", "ein Eis", "einen Ball"]
            answer: "Schlaf"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ella packt für eine Woche Zelten. Was muss unbedingt mit?"
            say: "Ella fährt mit Opa eine Woche zum Zelten an einen See. In ihren Koffer passt nicht alles. Was glaubst du: Was muss unbedingt mit, und was kann zu Hause bleiben?"
            show: { object: suitcase }
          - text: "Bedürfnisse: Das braucht jeder Mensch zum Leben."
            say: "Opa sagt: Zuerst packen wir, was wir zum Leben brauchen. Wir brauchen Wasser zum Trinken und etwas zu essen. Wir brauchen warme Kleidung und einen Platz zum Schlafen. Das alles heißt Bedürfnisse. Jeder Mensch auf der Welt hat sie."
            show: { objects: [water, jacket] }
          - text: "Auch Liebe, Gesundheit und Lernen sind Bedürfnisse."
            say: "Nicht alle Bedürfnisse kann man in einen Koffer packen. Jeder Mensch braucht auch Menschen, die ihn lieb haben, Hilfe, wenn er krank ist, und die Möglichkeit zu lernen."
            show: { objects: [heart, doctor] }
          - text: "Wünsche: Das ist schön, aber man kann ohne leben."
            say: "Ella möchte auch ihre Sticker, drei Tafeln Schokolade und den großen Wasserball mitnehmen. Das sind Wünsche. Wünsche machen Freude, aber man kann auch ohne sie leben. Wünsche sind in Ordnung. Oft können sie warten."
            show: { objects: [sticker, beach-ball] }
          - text: "Brauche ich das zum Leben, oder wünsche ich es mir nur?"
            say: "So kannst du prüfen: Frag dich, brauche ich das zum Leben, oder wünsche ich es mir nur? Auch wenn du dir etwas ganz doll wünschst, wird es dadurch kein Bedürfnis."
            show: { object: suitcase }
          - text: "Wusstest du? Ohne Essen hält ein Mensch viele Tage aus, ohne Wasser nur wenige."
            say: "Wusstest du? Ohne Essen kann ein Mensch viele Tage aushalten. Ohne Wasser aber nur wenige Tage. Darum packt Opa zuerst genug Wasser ein."
            show: { object: water }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was braucht Ella zum Leben?"
                say: "Was braucht Ella zum Leben?"
                options: [{ object: water }, { object: balloon }, { object: yo-yo }]
                answer: water
                feedback:
                  balloon: "Ein Luftballon macht Spaß, aber zum Leben braucht man ihn nicht. Wasser braucht jeder Mensch."
                hints:
                  - "Frag dich bei jedem Bild: Kann ich ohne das leben?"
                  - "Ohne Luftballon und Jo-Jo kann man leben."
                  - "Ella braucht Wasser."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Bedürfnis oder Wunsch?"
                say: "Sortiere. Was ist ein Bedürfnis, was ist ein Wunsch?"
                bins:
                  - { id: beduerfnis, show: { text: "Bedürfnis" }, say: "Bedürfnis" }
                  - { id: wunsch, show: { text: "Wunsch" }, say: "Wunsch" }
                options:
                  - { object: bread, bin: beduerfnis }
                  - { object: ice-cream, bin: wunsch }
                  - { object: jacket, bin: beduerfnis }
                  - { object: yo-yo, bin: wunsch }
                hints:
                  - "Frag dich bei jedem Bild: Brauche ich das zum Leben?"
                  - "Ohne Essen und warme Kleidung geht es nicht. Eis und Jo-Jo sind schön, aber nicht nötig."
                  - "Brot und Jacke sind Bedürfnisse, Eis und Jo-Jo sind Wünsche."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Schlafen ist ein Bedürfnis."
                say: "Stimmt das? Schlafen ist ein Bedürfnis."
                show: { object: bed }
                answer: true
                hints:
                  - "Wie geht es dir, wenn du nicht geschlafen hast?"
                  - "Jeder Mensch braucht einen Platz zum Schlafen."
                  - "Ja. Schlafen braucht jeder Mensch zum Leben."
              - id: l1-f4
                type: multiple_choice
                text: "Ella sagt: „Ich brauche unbedingt Schokolade!“ Was stimmt?"
                say: "Ella sagt: Ich brauche unbedingt Schokolade! Was stimmt?"
                show: { object: chocolate }
                options: ["Schokolade ist ein Wunsch.", "Ohne Schokolade kann man nicht leben.", "Schokolade ist so wichtig wie Wasser."]
                answer: "Schokolade ist ein Wunsch."
                hints:
                  - "Wünscht sich Ella die Schokolade, oder braucht sie sie zum Leben?"
                  - "Auch wenn man sich etwas ganz doll wünscht, wird es kein Bedürfnis."
                  - "Schokolade ist ein Wunsch."
              - id: l1-f5
                type: matching
                text: "Was hilft wobei?"
                say: "Verbinde jedes Bedürfnis mit dem, was hilft."
                pairs:
                  - { left: { text: "Ich habe Hunger." }, right: { object: bread } }
                  - { left: { text: "Ich habe Durst." }, right: { object: water } }
                  - { left: { text: "Mir ist kalt." }, right: { object: jacket } }
                hints:
                  - "Fang mit dem an, was du am besten kennst."
                  - "Gegen Durst trinkt man etwas. Gegen Kälte zieht man etwas an."
                  - "Hunger und Brot, Durst und Wasser, kalt und Jacke."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was ist ein Wunsch?"
                say: "Was ist ein Wunsch?"
                options: [{ object: balloon }, { object: bread }, { object: water }]
                answer: balloon
                hints: ["Ohne einen Wunsch kann man leben."]
              - id: l1-s2
                type: fill_in_blank
                text: "Wasser und Wasserball"
                say: "Setz die passenden Wörter ein."
                frame: "Wasser ist ein _. Ein Wasserball ist ein _."
                options: ["Bedürfnis", "Wunsch"]
                answer: ["Bedürfnis", "Wunsch"]
                hints: ["Mit einem davon spielt man nur."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Wenn ich mir etwas ganz doll wünsche, ist es ein Bedürfnis."
                say: "Stimmt das? Wenn ich mir etwas ganz doll wünsche, ist es ein Bedürfnis."
                answer: false
                hints: ["Frag dich: Kann ich ohne das leben?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Bedürfnis kann man nicht in einen Koffer packen?"
                say: "Welches Bedürfnis kann man nicht in einen Koffer packen?"
                show: { object: suitcase }
                options: ["Menschen, die mich lieb haben", "eine warme Jacke", "eine Flasche Wasser"]
                answer: "Menschen, die mich lieb haben"
                hints: ["Welches davon ist kein Ding?"]
              - id: l1-s5
                type: sorting
                text: "Braucht das jeder Mensch, oder ist es ein Wunsch?"
                say: "Sortiere. Was braucht jeder Mensch, was ist ein Wunsch?"
                bins:
                  - { id: alle, show: { text: "braucht jeder Mensch" }, say: "braucht jeder Mensch" }
                  - { id: wunsch, show: { text: "Wunsch" }, say: "Wunsch" }
                options:
                  - { object: bed, say: "einen Platz zum Schlafen", bin: alle }
                  - { object: pony, say: "ein eigenes Pony", bin: wunsch }
                  - { object: doctor, say: "Hilfe, wenn man krank ist", bin: alle }
                  - { object: game-controller, say: "ein neues Videospiel", bin: wunsch }
                hints: ["Ohne einen Wunsch kann man gut leben."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Am See wird es abends kalt. Was holt Ella aus dem Koffer?"
                say: "Am See wird es abends kalt. Was holt Ella aus dem Koffer?"
                options: ["ihre warme Jacke", "ihre Sticker", "den Wasserball"]
                answer: "ihre warme Jacke"
              - id: l1-n2
                type: true_false
                text: "Ella sagt: „Ohne Süßigkeiten kann ich nicht leben.“ Stimmt das?"
                say: "Ella sagt: Ohne Süßigkeiten kann ich nicht leben. Stimmt das?"
                show: { object: sweets }
                answer: false
              - id: l1-n3
                type: sorting
                text: "Was muss mit, was kann zu Hause bleiben?"
                say: "Ella packt den Koffer. Was muss mit, was kann zu Hause bleiben? Sortiere."
                bins:
                  - { id: mit, show: { object: suitcase }, say: "muss mit" }
                  - { id: zuhause, show: { object: house }, say: "kann zu Hause bleiben" }
                options:
                  - { object: water, bin: mit }
                  - { object: marble, bin: zuhause }
                  - { object: jacket, bin: mit }
                  - { object: kite, bin: zuhause }
              - id: l1-n4
                type: image_multiple_choice
                text: "Ella hat nach dem Wandern großen Durst. Was braucht sie?"
                say: "Ella hat nach dem Wandern großen Durst. Was braucht sie?"
                options: [{ object: water }, { object: cake }, { object: sticker }]
                answer: water
              - id: l1-n5
                type: fill_in_blank
                text: "Ella schreibt in ihr Ferienheft."
                say: "Ella schreibt in ihr Ferienheft. Setz die passenden Wörter ein."
                frame: "Zum Leben brauche ich Essen, _ und Schlaf. Ein Eis ist nur ein _."
                options: ["Wasser", "Wunsch", "Bedürfnis", "Ball"]
                answer: ["Wasser", "Wunsch"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was ist ein Bedürfnis?"
            say: "Was ist ein Bedürfnis?"
            options: [{ object: bread }, { object: yo-yo }, { object: balloon }]
            answer: bread
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Jo-Jo ist ein Wunsch."
            say: "Stimmt das? Ein Jo-Jo ist ein Wunsch."
            show: { object: yo-yo }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was brauchen alle Menschen zum Leben?"
            say: "Was brauchen alle Menschen zum Leben?"
            options: ["Essen und Trinken", "Spielzeug", "Süßigkeiten"]
            answer: "Essen und Trinken"
          - id: l1-c4
            type: sorting
            text: "Sortiere: Bedürfnis oder Wunsch?"
            say: "Sortiere. Was ist ein Bedürfnis, was ist ein Wunsch?"
            bins:
              - { id: beduerfnis, show: { text: "Bedürfnis" }, say: "Bedürfnis" }
              - { id: wunsch, show: { text: "Wunsch" }, say: "Wunsch" }
            options:
              - { object: water, bin: beduerfnis }
              - { object: marble, bin: wunsch }
              - { object: bed, bin: beduerfnis }
              - { object: kite, bin: wunsch }
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Wünsche sind verboten."
            say: "Stimmt das? Wünsche sind verboten."
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Ella hat Hunger. Was braucht sie?"
            say: "Ella hat Hunger. Was braucht sie?"
            options: [{ object: bread }, { object: balloon }, { object: crayon }]
            answer: bread

  - n: 2
    title: { de: "Zuerst das, was wir brauchen", en: "What we need comes first" }
    goal:
      de: "Lerne, warum Bedürfnisse zuerst kommen und Wünsche warten können. Finde heraus, wer dir bei deinen Bedürfnissen hilft, so wie die Ärztin, wenn du krank bist."
      en: "Learn why needs come first and wants can wait. Find out who helps you with your needs, like the doctor when you are ill."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Was braucht jeder Mensch zum Leben?"
            say: "Was braucht jeder Mensch zum Leben?"
            options: [{ object: water }, { object: sticker }, { object: kite }]
            answer: water
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Ein Wasserball ist ein Bedürfnis."
            say: "Stimmt das? Ein Wasserball ist ein Bedürfnis."
            show: { object: beach-ball }
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Mama hat nur noch wenig Geld. Was kauft sie zuerst?"
            say: "Zurück vom Zelten geht Ella mit Mama einkaufen. Mama hat nur noch wenig Geld. Im Laden gibt es Brot, Milch und einen glitzernden Ball. Was glaubst du: Was kauft Mama zuerst?"
            show: { object: supermarket }
          - text: "Zuerst die Bedürfnisse, dann die Wünsche."
            say: "Mama kauft zuerst Brot und Milch, denn die braucht die Familie zum Leben. Für den Ball reicht das Geld heute nicht. Ella ist ein bisschen traurig. Aber ein Wunsch kann warten. Vielleicht spart Ella dafür, oder sie wünscht sich den Ball zum Geburtstag."
            show: { objects: [bread, milk] }
          - text: "Viele Bedürfnisse erfüllen Dinge: Brot, eine Jacke, ein Bett."
            say: "Viele Bedürfnisse erfüllen Dinge, die man kaufen kann. Brot hilft gegen Hunger, eine Jacke gegen Kälte, und in einem Bett kann man schlafen."
            show: { objects: [jacket, bed] }
          - text: "Andere Bedürfnisse erfüllen Menschen, die für uns arbeiten."
            say: "Andere Bedürfnisse erfüllen Menschen mit ihrer Arbeit. Die Ärztin hilft dir, wenn du krank bist. Die Lehrerin hilft dir beim Lernen. Die Feuerwehr hilft, wenn es brennt."
            show: { objects: [doctor, teacher] }
          - text: "Bedürfnisse haben alle. Wünsche sind bei jedem anders."
            say: "Alle Menschen haben die gleichen Bedürfnisse. Wünsche aber sind bei jedem anders. Ella wünscht sich den Glitzerball, ihr Bruder ein Buch über Dinos, und Opa wünscht sich einfach einen ruhigen Nachmittag."
            show: { objects: [ball, book] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Papa hat nur wenig Geld. Was kauft er zuerst?"
                say: "Papa hat nur wenig Geld. Was kauft er zuerst?"
                options: ["Milch", "eine Spielfigur", "Kaugummi"]
                answer: "Milch"
                feedback:
                  "Kaugummi": "Kaugummi zum Abendessen? Davon wird niemand satt. Papa kauft zuerst Milch."
                hints:
                  - "Was braucht die Familie zum Leben?"
                  - "Spielfigur und Kaugummi sind Wünsche."
                  - "Papa kauft zuerst Milch."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Wer hilft dir?"
                say: "Verbinde jedes Bedürfnis mit dem Menschen, der hilft."
                pairs:
                  - { left: { text: "Ich bin krank." }, right: { object: doctor } }
                  - { left: { text: "Ich will lesen lernen." }, right: { object: teacher } }
                  - { left: { text: "Es brennt!" }, right: { object: firefighter } }
                hints:
                  - "Fang mit dem Bild an, das du am besten kennst."
                  - "Die Feuerwehr löscht. In der Schule lernst du lesen."
                  - "Krank und Ärztin, lesen und Lehrerin, Feuer und Feuerwehr."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Alle Menschen wünschen sich dasselbe."
                say: "Stimmt das? Alle Menschen wünschen sich dasselbe."
                answer: false
                hints:
                  - "Was wünschen sich Ella, ihr Bruder und Opa?"
                  - "Ella will einen Ball, ihr Bruder ein Buch, Opa Ruhe."
                  - "Nein. Wünsche sind bei jedem anders."
              - id: l2-f4
                type: sorting
                text: "Hilft hier ein Ding oder ein Mensch?"
                say: "Sortiere. Hilft hier ein Ding oder ein Mensch, der für uns arbeitet?"
                bins:
                  - { id: ding, show: { text: "ein Ding" }, say: "ein Ding" }
                  - { id: mensch, show: { text: "ein Mensch" }, say: "ein Mensch" }
                options:
                  - { object: bread, say: "Brot gegen Hunger", bin: ding }
                  - { object: doctor, say: "die Ärztin, wenn ich krank bin", bin: mensch }
                  - { object: jacket, say: "eine Jacke gegen Kälte", bin: ding }
                  - { object: teacher, say: "die Lehrerin beim Lernen", bin: mensch }
                hints:
                  - "Kann man es kaufen, oder arbeitet jemand für dich?"
                  - "Brot und Jacke kauft man. Ärztin und Lehrerin arbeiten."
                  - "Brot und Jacke sind Dinge, Ärztin und Lehrerin sind Menschen."
              - id: l2-f5
                type: image_multiple_choice
                text: "Wer hilft dir beim Lernen?"
                say: "Wer hilft dir beim Lernen?"
                options: [{ object: teacher }, { object: clown }, { object: firefighter }]
                answer: teacher
                hints:
                  - "Denk an die Schule."
                  - "Der Clown bringt dich zum Lachen. Die Feuerwehr löscht Feuer."
                  - "Die Lehrerin hilft dir beim Lernen."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Ein Wunsch kann warten, zum Beispiel bis zum Geburtstag."
                say: "Stimmt das? Ein Wunsch kann warten, zum Beispiel bis zum Geburtstag."
                answer: true
                hints: ["Ohne einen Wunsch kann man eine Weile gut leben."]
              - id: l2-s2
                type: multiple_choice
                text: "Was hilft beim Bedürfnis Schlafen?"
                say: "Was hilft beim Bedürfnis Schlafen?"
                options: ["ein Bett", "ein Fernseher", "ein Fußball"]
                answer: "ein Bett"
                hints: ["Wo liegst du nachts?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Es brennt! Wer hilft?"
                say: "Es brennt! Wer hilft?"
                options: [{ object: firefighter }, { object: cook }, { object: teacher }]
                answer: firefighter
                hints: ["Wer kommt mit dem roten Auto und löscht?"]
              - id: l2-s4
                type: fill_in_blank
                text: "Was kommt zuerst?"
                say: "Setz die passenden Wörter ein."
                frame: "Zuerst kauft man, was man _. Dann, was man sich _."
                options: ["braucht", "wünscht", "versteckt"]
                answer: ["braucht", "wünscht"]
                hints: ["Bedürfnisse kommen vor den Wünschen."]
              - id: l2-s5
                type: sorting
                text: "Brauchen das alle, oder ist es bei jedem anders?"
                say: "Sortiere. Brauchen das alle Menschen, oder ist es ein Wunsch, der bei jedem anders ist?"
                bins:
                  - { id: alle, show: { text: "brauchen alle" }, say: "brauchen alle" }
                  - { id: anders, show: { text: "bei jedem anders" }, say: "bei jedem anders" }
                options:
                  - { object: bread, say: "Essen", bin: alle }
                  - { object: book, say: "ein Buch über Dinos", bin: anders }
                  - { object: water, bin: alle }
                  - { object: ball, say: "ein Glitzerball", bin: anders }
                hints: ["Bedürfnisse haben alle Menschen."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Max hat Fieber. Wer hilft ihm, wieder gesund zu werden?"
                say: "Max hat Fieber. Wer hilft ihm, wieder gesund zu werden?"
                options: ["die Ärztin", "der Clown", "der Busfahrer"]
                answer: "die Ärztin"
              - id: l2-n2
                type: true_false
                text: "Ella spart ihr Geld für den Glitzerball. Ist das eine gute Idee für einen Wunsch?"
                say: "Ella spart ihr Geld für den Glitzerball. Ist das eine gute Idee für einen Wunsch?"
                show: { object: ball }
                answer: true
              - id: l2-n3
                type: sorting
                text: "Mama schreibt den Einkaufszettel. Was muss heute sein, was kann warten?"
                say: "Mama schreibt den Einkaufszettel. Was muss heute sein, was kann warten? Sortiere."
                bins:
                  - { id: heute, show: { text: "muss heute sein" }, say: "muss heute sein" }
