# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.sound
skill: world.nature.sound
curriculum: de-DE
language: de
title:
  de: Wie entsteht ein Ton?
  en: How is a sound made?
summary: >
  Noah and his friends get ready for the music party in the courtyard
  with Onkel Tom. Lesson 1 opens with the guess where the "pling" of a
  guitar string comes from: the string vibrates (schwingen), and whatever
  vibrates makes a sound; when it stops, the sound stops. The drum skin,
  the bell and the vocal cords in the throat vibrate too. The vibration
  travels through the air (and through water and walls) to the ear; in
  space there is no air, so nothing can be heard. Lesson 2 sets loud and
  quiet (a strong or a small vibration) apart from high and low (a small
  bell, a short string, a bird: high; a big bell, a long string, a cow:
  low), offers the ruler on the table edge at home with a grown-up, and
  ends with the skill check. The real experiments stay in class. The
  drum, the triangle and recorded sounds are not in the banks yet, so
  they are text cards and the sounds are described.
metadata:
  year: klasse-2
  topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.body.senses]
  also_practises: []
  vocabulary: { de: [Ton, schwingen, Schwingung, Saite, Trommelfell, Stimmbänder, laut, leise, hoch, tief] }
  forms: [text, audio, picture]
  drawn: []
  sounds: []
  facets: []
  parts:
    - { id: vibrate, what: { de: "erklären, dass ein Ton entsteht, wenn etwas schwingt", en: explaining that a sound is made when something vibrates } }
    - { id: travel, what: { de: "erklären, wie der Ton durch die Luft zum Ohr kommt", en: explaining how the sound travels through the air to the ear } }
    - { id: loud-quiet, what: { de: "laute und leise Töne unterscheiden", en: telling loud from quiet sounds } }
    - { id: high-low, what: { de: "hohe und tiefe Töne unterscheiden", en: telling high from low sounds } }
  misconceptions:
    - id: sound-without-vibration
      what: Thinks a sound just comes out of a thing, without anything moving
      addressed: lesson 1 Learn opens with the guitar string and the hand on the throat; l1-f1, l1-f3 and l1-n2; l2-c1 to l2-c5 in the skill check
    - id: sound-needs-nothing
      what: Thinks a sound reaches the ear through nothing, so space would be loud too
      addressed: lesson 1 Learn, the air screen and the Wusstest du screen; l1-s3 and l1-n4; l2-c8 in the skill check
    - id: high-is-loud
      what: Mixes up high with loud and low with quiet
      addressed: lesson 2 Learn says a bird can chirp high and loud; l2-f4, l2-s4 and l2-n5; l2-c20 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Alles schwingt", en: "Everything vibrates" }
    goal:
      de: "Finde heraus, wie ein Ton entsteht. Wenn etwas schwingt, so wie eine Gitarrensaite, hörst du einen Ton."
      en: "Find out how a sound is made. When something vibrates, like a guitar string, you hear a sound."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Womit hörst du?"
            say: "Womit hörst du?"
            options: [{ object: ear }, { object: nose }, { object: eye }]
            answer: ear
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Eine Fahrradklingel klingelt. Welcher Sinn hilft dir?"
            say: "Eine Fahrradklingel klingelt. Welcher Sinn hilft dir?"
            options: ["hören", "riechen", "schmecken"]
            answer: "hören"
            feedback:
              "schmecken": "Eine Klingel schmecken? Das wäre komisch! Du hörst sie mit den Ohren."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Woher kommt der Ton?"
            say: "Am Samstag ist Musikfest im Hof. Noah übt mit Onkel Tom. Onkel Tom zupft an einer Saite seiner Gitarre: Pling! Was glaubst du: Woher kommt der Ton?"
            show: { object: play-guitar }
          - text: "Die Saite schwingt."
            say: "Schau ganz genau hin: Die Saite zittert ganz schnell hin und her. Das heißt schwingen. Wenn etwas schwingt, entsteht ein Ton. Hält Onkel Tom die Saite mit dem Finger fest, hört sie auf zu schwingen. Dann ist der Ton weg."
            show: { object: play-guitar }
          - text: "Auch Trommel und Glocke schwingen."
            say: "Noahs Freundin Ela schlägt auf die Trommel. Das Fell der Trommel schwingt. Und wenn der Klöppel an die Glocke schlägt, schwingt die Glocke. Legst du die Hand auf eine klingende Glocke, kribbelt es an den Fingern."
            show: { object: bell }
          - text: "Deine Stimme schwingt im Hals."
            say: "Leg die Hand vorne an deinen Hals und summe. Spürst du das Kribbeln? In deinem Hals schwingen die Stimmbänder. So entsteht deine Stimme, wenn du sprichst oder singst."
            show: { object: sing }
          - text: "Die Luft trägt den Ton zum Ohr."
            say: "Die Saite bringt die Luft um sich herum zum Schwingen. Die Schwingung wandert durch die Luft bis in dein Ohr. Dann hörst du den Ton. Ein Ton wandert auch durch Wasser und durch Wände. Darum hörst du manchmal die Musik von nebenan."
            show: { object: ear }
          - text: "Wusstest du? Im Weltall ist es ganz still."
            say: "Wusstest du? Im Weltall gibt es keine Luft. Darum kann dort kein Ton zu deinem Ohr wandern. Selbst einen lauten Knall würdest du nicht hören. Astronauten draußen vor der Raumstation sprechen deshalb über Funk miteinander."
            show: { object: star }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie entsteht ein Ton?"
                say: "Wie entsteht ein Ton?"
                options: ["Etwas schwingt hin und her.", "Etwas wird nass.", "Etwas wird ganz still gehalten."]
                answer: "Etwas schwingt hin und her."
                hints:
                  - "Denk an die Saite von Onkel Toms Gitarre."
                  - "Die Saite zittert ganz schnell hin und her."
                  - "Ein Ton entsteht, wenn etwas schwingt."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wer macht hier gerade einen Ton mit einer Saite?"
                say: "Wer macht hier gerade einen Ton mit einer Saite?"
                options: [{ object: play-guitar }, { object: read }, { object: quiet }]
                answer: play-guitar
                hints:
                  - "Eine Saite gibt es an einem Musikinstrument."
                  - "Beim Lesen und beim Leisesein schwingt keine Saite."
                  - "Das Kind spielt Gitarre. Die Saiten schwingen."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Hält man die Saite fest, hört der Ton auf."
                say: "Stimmt das? Hält man die Saite fest, hört der Ton auf."
                answer: true
                hints:
                  - "Was tut die Saite, wenn sie einen Ton macht?"
                  - "Hält man sie fest, kann sie nicht mehr schwingen."
                  - "Ja. Ohne Schwingen gibt es keinen Ton."
              - id: l1-f4
                type: matching
                text: "Was schwingt?"
                say: "Verbinde jedes Bild mit dem, was dabei schwingt."
                pairs:
                  - { left: { object: play-guitar }, right: { text: "die Saite" } }
                  - { left: { text: "Trommel" }, right: { text: "das Fell" } }
                  - { left: { object: sing }, right: { text: "die Stimmbänder" } }
                hints:
                  - "Fang mit der Gitarre an."
                  - "Auf die Trommel schlägt man oben drauf. Beim Singen kribbelt es im Hals."
                  - "Gitarre und Saite, Trommel und Fell, Singen und Stimmbänder."
              - id: l1-f5
                type: multiple_choice
                text: "Wie kommt der Ton von der Gitarre in dein Ohr?"
                say: "Wie kommt der Ton von der Gitarre in dein Ohr?"
                options: ["Er wandert durch die Luft.", "Er fliegt als kleiner Ball.", "Er kommt durch ein Kabel."]
                answer: "Er wandert durch die Luft."
                hints:
                  - "Was ist zwischen der Gitarre und deinem Ohr?"
                  - "Die Saite bringt etwas um sich herum zum Schwingen."
                  - "Der Ton wandert durch die Luft in dein Ohr."

          - support: some
            tasks:
              - id: l1-s1
                type: image_multiple_choice
                text: "Was schwingt, wenn der Klöppel daran schlägt?"
                say: "Was schwingt, wenn der Klöppel daran schlägt?"
                options: [{ object: bell }, { object: teddy }, { object: sock }]
                answer: bell
                hints: ["Was klingt, wenn man daran schlägt?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Wie entsteht ein Ton?"
                say: "Setz die passenden Wörter ein."
                frame: "Wenn etwas _, entsteht ein Ton. Der Ton kommt durch die _ zum Ohr."
                options: ["schwingt", "Luft", "schläft"]
                answer: ["schwingt", "Luft"]
                hints: ["Denk an die Saite und daran, was zwischen Saite und Ohr ist."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Im Weltall kann man einen Knall gut hören."
                say: "Stimmt das? Im Weltall kann man einen Knall gut hören."
                show: { object: star }
                answer: false
                hints: ["Gibt es im Weltall Luft, die den Ton tragen kann?"]
              - id: l1-s4
                type: ordering
                text: "Wie kommt der Ton ins Ohr? Leg die Karten in die richtige Reihenfolge."
                say: "Wie kommt der Ton ins Ohr? Leg die Karten in die richtige Reihenfolge."
                options: ["Die Luft schwingt mit.", "Du hörst den Ton.", "Die Saite schwingt."]
                slot_count: 3
                answer: ["Die Saite schwingt.", "Die Luft schwingt mit.", "Du hörst den Ton."]
                hints: ["Zuerst muss etwas schwingen."]
              - id: l1-s5
                type: multiple_choice
                text: "Leg die Hand an deinen Hals und summe. Was spürst du?"
                say: "Leg die Hand an deinen Hals und summe. Was spürst du?"
                options: ["ein Kribbeln, weil die Stimmbänder schwingen", "gar nichts", "dass der Hals kalt wird"]
                answer: "ein Kribbeln, weil die Stimmbänder schwingen"
                hints: ["Was schwingt in deinem Hals, wenn du singst?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: image_multiple_choice
                text: "Ela will für das Fest üben, wie ihre Stimme klingt. Was macht sie?"
                say: "Ela will für das Fest üben, wie ihre Stimme klingt. Was macht sie?"
                options: [{ object: sing }, { object: read }, { object: quiet }]
                answer: sing
              - id: l1-n2
                type: true_false
                text: "Noah sagt: „Der Ton kommt einfach aus der Glocke. Da bewegt sich nichts.“ Stimmt das?"
                say: "Noah sagt: Der Ton kommt einfach aus der Glocke. Da bewegt sich nichts. Stimmt das?"
                show: { object: bell }
                answer: false
              - id: l1-n3
                type: multiple_choice
                text: "Ela schlägt auf die Trommel. Was schwingt?"
                say: "Ela schlägt auf die Trommel. Was schwingt?"
                options: ["das Fell der Trommel", "Elas Haare", "der Boden unter dem Hof"]
                answer: "das Fell der Trommel"
              - id: l1-n4
                type: true_false
                text: "Noah taucht im Schwimmbad unter. Ela klopft an den Rand. Noah hört es unter Wasser. Kann das stimmen?"
                say: "Noah taucht im Schwimmbad unter. Ela klopft an den Rand. Noah hört es unter Wasser. Kann das stimmen?"
                answer: true
              - id: l1-n5
                type: sorting
                text: "Onkel Tom räumt auf. Was schwingt gerade und macht einen Ton?"
                say: "Onkel Tom räumt auf. Was schwingt gerade und macht einen Ton, was ist still? Sortiere."
                bins:
                  - { id: ton, show: { text: "schwingt, macht einen Ton" }, say: "schwingt, macht einen Ton" }
                  - { id: still, show: { text: "ist still" }, say: "ist still" }
                options:
                  - { text: "eine gezupfte Saite", bin: ton }
                  - { text: "eine Gitarre im Koffer", bin: still }
                  - { text: "eine klingende Glocke", bin: ton }
                  - { text: "eine Trommel, die niemand anfasst", bin: still }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was passiert, wenn ein Ton entsteht?"
            say: "Was passiert, wenn ein Ton entsteht?"
            options: ["Etwas schwingt.", "Etwas schmilzt.", "Etwas wächst."]
            answer: "Etwas schwingt."
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Beim Singen schwingen die Stimmbänder im Hals."
            say: "Stimmt das? Beim Singen schwingen die Stimmbänder im Hals."
            show: { object: sing }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was trägt den Ton zu deinem Ohr?"
            say: "Was trägt den Ton zu deinem Ohr?"
            options: ["die Luft", "das Licht", "ein Faden"]
            answer: "die Luft"
          - id: l1-c4
            type: image_multiple_choice
            text: "Was schwingt, wenn man daran zupft?"
            say: "Was schwingt, wenn man daran zupft?"
            options: [{ object: play-guitar }, { object: book }, { object: stone }]
            answer: play-guitar
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Eine Glocke klingt, ohne zu schwingen."
            say: "Stimmt das? Eine Glocke klingt, ohne zu schwingen."
            answer: false
          - id: l1-c6
            type: image_multiple_choice
            text: "Womit hörst du den Ton von der Gitarre?"
            say: "Womit hörst du den Ton von der Gitarre?"
            options: [{ object: ear }, { object: hand }, { object: nose }]
            answer: ear

  - n: 2
    title: { de: "Laut und leise, hoch und tief", en: "Loud and quiet, high and low" }
    goal:
      de: "Unterscheide laute und leise, hohe und tiefe Töne. Ein Vogel piept hoch, eine Kuh muht tief."
      en: "Tell loud from quiet and high from low sounds. A bird chirps high, a cow moos low."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was macht die Gitarrensaite, wenn sie klingt?"
            say: "Was macht die Gitarrensaite, wenn sie klingt?"
            options: ["Sie schwingt.", "Sie schläft.", "Sie wird bunt."]
            answer: "Sie schwingt."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Der Ton kommt durch die Luft in dein Ohr."
            say: "Stimmt das? Der Ton kommt durch die Luft in dein Ohr."
            show: { object: ear }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wann klingt die Trommel lauter?"
            say: "Ela übt für das Fest. Einmal tippt sie ganz sanft auf die Trommel, einmal schlägt sie ganz fest. Was glaubst du: Wann klingt die Trommel lauter?"
          - text: "Fest schlagen: laut. Sanft tippen: leise."
            say: "Wenn Ela fest schlägt, schwingt das Fell stark. Der Ton ist laut. Wenn sie sanft tippt, schwingt es nur ein bisschen. Der Ton ist leise. Laut sind auch die Sirene vom Feuerwehrauto und ein Feuerwerk. Leise ist das Ticken einer Uhr oder ein Flüstern."
            show: { objects: [fire-engine, clock] }
          - text: "Hohe und tiefe Töne"
            say: "Töne können auch hoch oder tief sein. Ein Vogel piept hoch, eine Maus piepst hoch. Eine Kuh muht tief, und ein Löwe brüllt tief. Hoch und tief ist etwas anderes als laut und leise. Ein Vogel kann ganz laut und trotzdem hoch piepen."
            show: { objects: [bird, cow] }
          - text: "Klein und kurz klingt hoch, groß und lang klingt tief."
            say: "Eine kleine Glocke klingt hoch. Eine große Kirchenglocke klingt tief. Bei der Gitarre ist es genauso: Drückt Onkel Tom die Saite auf, schwingt nur noch ein kurzes Stück. Der Ton wird höher. Ein langes Stück klingt tiefer."
            show: { objects: [bell, play-guitar] }
          - text: "Probier's aus, mit einem Erwachsenen!"
            say: "Probier's aus, mit Mama, Papa oder einem anderen Erwachsenen. Legt ein Lineal auf den Tisch, sodass ein langes Stück über die Kante ragt. Haltet es auf dem Tisch gut fest und schnippt das freie Ende an. Es schwingt und brummt tief. Schiebt es weiter auf den Tisch, sodass nur ein kurzes Stück übersteht. Wie klingt es jetzt?"
            show: { object: ruler }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Laut oder leise?"
                say: "Sortiere: Was ist laut, was ist leise?"
                bins:
                  - { id: laut, show: { text: "laut" }, say: "laut" }
                  - { id: leise, show: { text: "leise" }, say: "leise" }
                options:
                  - { object: fire-engine, bin: laut }
                  - { object: clock, bin: leise }
                  - { object: fireworks, bin: laut }
                  - { text: "Flüstern", bin: leise }
                hints:
                  - "Bei welchem Ton musst du dir vielleicht die Ohren zuhalten?"
                  - "Die Sirene und das Feuerwerk hört man von weit weg."
                  - "Feuerwehrauto und Feuerwerk sind laut, Uhr und Flüstern sind leise."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Ela schlägt ganz fest auf die Trommel. Wie klingt der Ton?"
                say: "Ela schlägt ganz fest auf die Trommel. Wie klingt der Ton?"
                options: ["laut", "leise", "gar nicht"]
                answer: "laut"
                hints:
                  - "Wie stark schwingt das Fell bei einem festen Schlag?"
                  - "Starkes Schwingen macht einen lauten Ton."
                  - "Der Ton ist laut."
              - id: l2-f3
                type: image_multiple_choice
                text: "Welches Tier macht einen hohen Ton?"
                say: "Welches Tier macht einen hohen Ton?"
                options: [{ object: bird }, { object: cow }, { object: lion }]
                answer: bird
                hints:
                  - "Denk an ein kleines Tier, das piept."
                  - "Die Kuh muht tief, der Löwe brüllt tief."
                  - "Der Vogel piept hoch."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Ein hoher Ton ist immer laut."
                say: "Stimmt das? Ein hoher Ton ist immer laut."
                answer: false
                hints:
                  - "Sind hoch und laut dasselbe?"
                  - "Eine kleine Glocke kann ganz leise klingeln und trotzdem hoch."
                  - "Nein. Hoch und tief ist etwas anderes als laut und leise."
              - id: l2-f5
                type: matching
                text: "Wie klingt die Glocke?"
                say: "Verbinde jede Glocke mit ihrem Ton."
                pairs:
                  - { left: { text: "kleine Glocke" }, right: { text: "hoch" } }
                  - { left: { text: "große Kirchenglocke" }, right: { text: "tief" } }
                hints:
                  - "Was klingt hoch: etwas Kleines oder etwas Großes?"
                  - "Klein und kurz klingt hoch."
                  - "Die kleine Glocke klingt hoch, die große Kirchenglocke tief."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was ist leise?"
                say: "Was ist leise?"
                options: [{ object: clock }, { object: ambulance }, { object: fireworks }]
                answer: clock
                hints: ["Was musst du ganz genau anhören, um es zu hören?"]
              - id: l2-s2
                type: sorting
                text: "Hoch oder tief?"
                say: "Sortiere die Tiere: Wer macht einen hohen Ton, wer einen tiefen?"
                bins:
                  - { id: hoch, show: { text: "hoch" }, say: "hoch" }
                  - { id: tief, show: { text: "tief" }, say: "tief" }
                options:
                  - { object: mouse, bin: hoch }
                  - { object: cow, bin: tief }
                  - { object: bird, bin: hoch }
                  - { object: lion, bin: tief }
                hints: ["Die kleinen Tiere hier piepen."]
              - id: l2-s3
                type: multiple_choice
                text: "Onkel Tom drückt die Saite auf, und nur ein kurzes Stück schwingt. Wie wird der Ton?"
                say: "Onkel Tom drückt die Saite auf, und nur ein kurzes Stück schwingt. Wie wird der Ton?"
                options: ["höher", "tiefer", "lauter"]
                answer: "höher"
                hints: ["Klein und kurz klingt hoch."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Ein Vogel kann laut und hoch piepen."
                say: "Stimmt das? Ein Vogel kann laut und hoch piepen."
                show: { object: bird }
                answer: true
                hints: ["Hoch und tief ist etwas anderes als laut und leise."]
              - id: l2-s5
                type: fill_in_blank
                text: "Wie klingt die Trommel?"
                say: "Setz die passenden Wörter ein."
                frame: "Ela schlägt fest: Der Ton ist _. Ela tippt sanft: Der Ton ist _."
                options: ["laut", "leise", "hoch"]
                answer: ["laut", "leise"]
                hints: ["Starkes Schwingen ist laut, schwaches Schwingen ist leise."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Das Baby von nebenan schläft. Wie soll Ela jetzt auf die Trommel schlagen?"
                say: "Das Baby von nebenan schläft. Wie soll Ela jetzt auf die Trommel schlagen?"
                options: ["ganz sanft, damit es leise ist", "ganz fest, damit es laut ist", "mit beiden Füßen"]
                answer: "ganz sanft, damit es leise ist"
              - id: l2-n2
                type: image_multiple_choice
                text: "Beim Fest spielt Noah ein tiefes Tier nach. Welches Tier?"
                say: "Beim Fest spielt Noah ein Tier mit einer tiefen Stimme nach. Welches Tier ist es?"
                options: [{ object: cow }, { object: mouse }, { object: bird }]
                answer: cow
              - id: l2-n3
                type: sorting
                text: "Noah ordnet die Glocken für das Fest. Welche klingen hoch, welche tief?"
                say: "Noah ordnet die Glocken für das Fest. Welche klingen hoch, welche tief? Sortiere."
                bins:
                  - { id: hoch, show: { text: "hoch" }, say: "hoch" }
                  - { id: tief, show: { text: "tief" }, say: "tief" }
                options:
                  - { text: "winzige Glocke", bin: hoch }
                  - { text: "riesige Glocke", bin: tief }
                  - { text: "kleines Glöckchen am Fahrrad", bin: hoch }
                  - { text: "große Kirchenglocke", bin: tief }
              - id: l2-n4
                type: multiple_choice
                text: "Noah schnippt das Lineal an der Tischkante an. Dann lässt er nur ein kurzes Stück überstehen. Wie klingt es jetzt?"
                say: "Noah schnippt das Lineal an der Tischkante an. Dann lässt er nur ein kurzes Stück überstehen. Wie klingt es jetzt?"
                show: { object: ruler }
                options: ["höher", "tiefer", "gar nicht"]
                answer: "höher"
              - id: l2-n5
                type: true_false
                text: "Ela sagt: „Die Kuh muht ganz laut. Also ist ihr Ton hoch.“ Stimmt das?"
                say: "Ela sagt: Die Kuh muht ganz laut. Also ist ihr Ton hoch. Stimmt das?"
                show: { object: cow }
                answer: false
