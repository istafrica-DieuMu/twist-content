# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.room-plan
skill: world.space.room-plan
curriculum: de-DE
language: de
title:
  de: Einen Plan lesen
  en: Reading a plan
summary: >
  Ben has moved house and draws his new room for his Oma. Lesson 1 shows
  what a plan is: the room seen from above, drawn smaller, every piece of
  furniture as a box in the same place as in the room, with letters and a
  line underneath that says what each letter means. The child reads where
  things stand (oben, unten, links, rechts) and picks the plan that fits a
  description. Lesson 2 is Ben's first day in class 2b: he finds his place,
  the board and the reading corner on a plan of the classroom, follows a
  way on it and reads the plan of another classroom. It ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Pläne und Orte, en: Plans and places }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.space.bird-view, world.space.left-right-position]
  also_practises: []
  vocabulary: { de: [Plan, von oben, Kästchen, Buchstabe, oben, unten, links, rechts, Tafel, Pult, Leseecke] }
  forms: [text, audio, picture, drawn]
  drawn: [grid, shape]
  sounds: []
  facets: []
  parts:
    - { id: view, what: { de: "wissen, dass ein Plan ein Zimmer kleiner und von oben zeigt", en: knowing that a plan shows a room smaller and from above } }
    - { id: symbols, what: { de: "Buchstaben und Farben eines Plans mit der Erklärung lesen", en: reading the letters and colours of a plan with its key line } }
    - { id: position, what: { de: "sagen, wo etwas auf dem Plan steht", en: saying where something is on the plan } }
    - { id: compare, what: { de: "Plan und Beschreibung vergleichen und einen Weg finden", en: matching a plan to a description and finding a way on it } }
  misconceptions:
    - id: plan-front-view
      what: Thinks a plan shows the room from the front, like a photo
      addressed: lesson 1 Learn opens with the guess and answers from above; l1-f2, l1-c2, l2-w1; l2-c1 and l2-c5 in the skill check
    - id: plan-real-size
      what: Thinks things on a plan are as big as in the room, or stand somewhere else
      addressed: lesson 1 Learn says everything is smaller but in the same place; l1-s2, l1-c5; l2-c2 and l2-c4 in the skill check
    - id: same-letter-everywhere
      what: Thinks a letter means the same on every plan (B is always Bett)
      addressed: lesson 2 Learn shows B as Bens Platz on the class plan; l2-s5 with feedback; l2-c6, l2-c10 in the skill check
    - id: left-right-on-plan
      what: Mixes up left and right or top and bottom on a plan
      addressed: l1-f1, l1-f5, l1-n2, l2-f3, l2-n5; l2-c11 to l2-c15 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Bens Zimmer von oben", en: "Ben's room from above" }
    goal:
      de: "Lies einen Plan von einem Zimmer. Auf Bens Plan steht das Bett links und der Schrank rechts oben."
      en: "Read a plan of a room. On Ben's plan the bed is on the left and the wardrobe at the top right."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Wie sieht ein Ball von oben aus?"
            say: "Du schaust von oben auf einen Ball. Wie sieht er aus?"
            options:
              - { drawn: shape, kind: circle, colour: orange }
              - { drawn: shape, kind: square, colour: orange }
              - { drawn: shape, kind: triangle, colour: orange }
            answer: circle
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was ist rechts?"
            say: "Schau auf die zwei Bilder. Was ist rechts?"
            show: { objects: [bed, chair] }
            options: ["der Stuhl", "das Bett"]
            answer: "der Stuhl"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Von vorne oder von oben?"
            say: "Ben ist umgezogen. Er will seiner Oma zeigen, wie sein neues Zimmer aussieht, und malt es auf. Was glaubst du: Malt er das Zimmer von vorne oder von oben?"
            show: { object: bedroom }
          - text: "Ein Plan zeigt das Zimmer von oben."
            say: "Von oben! Ben malt einen Plan. Ein Plan zeigt ein Zimmer so, wie ein Vogel es von oben sieht, wenn das Dach weg wäre. Auf dem Plan ist alles viel kleiner. Aber jedes Möbelstück steht an derselben Stelle wie im Zimmer."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
          - text: "Die Möbel werden Kästchen."
            say: "Zuerst schaut Ben sein Zimmer von oben an. Dann malt er den Rand, das sind die Wände. Von oben sieht ein Bett aus wie ein langes Rechteck, ein Schrank und ein Tisch auch. Darum malt Ben die Möbel als Kästchen."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
          - text: "B = Bett, S = Schrank, T = Tisch, K = Kiste"
            say: "In die Kästchen schreibt Ben Buchstaben. Unter den Plan schreibt er, was sie bedeuten: B heißt Bett, S heißt Schrank, T heißt Tisch und K heißt Kiste. Das ist seine Spielzeugkiste."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
          - text: "Oben, unten, links und rechts auf dem Plan"
            say: "Auf dem Plan kannst du sagen, wo etwas steht. Das Bett steht links. Der Schrank steht rechts oben. Der Tisch steht unten in der Mitte, und die Kiste steht rechts unten."
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
          - text: "Wusstest du? Einer der ältesten Stadtpläne ist mehr als 3000 Jahre alt."
            say: "Wusstest du? Einer der ältesten Stadtpläne der Welt ist mehr als 3000 Jahre alt. Jemand hat ihn in eine Tafel aus Ton geritzt."
            show: { object: map }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "B = Bett, S = Schrank, T = Tisch, K = Kiste. Was steht links?"
                say: "Schau auf Bens Plan. Was steht links?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                options: ["das Bett", "der Schrank", "die Kiste"]
                answer: "das Bett"
                hints:
                  - "Links ist die Seite, an der deine linke Hand ist."
                  - "Links steht das lange blaue Kästchen mit dem B."
                  - "B heißt Bett. Links steht das Bett."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Auf einem Plan siehst du das Zimmer von oben."
                say: "Auf einem Plan siehst du das Zimmer von oben. Stimmt das?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                answer: true
                hints:
                  - "Wie sieht ein Vogel das Zimmer, wenn das Dach weg ist?"
                  - "Von oben sieht das Bett aus wie ein langes Kästchen, so wie auf dem Plan."
                  - "Ja, das stimmt."
              - id: l1-f3
                type: matching
                text: "Welcher Buchstabe gehört zu welchem Möbelstück?"
                say: "Auf Bens Plan stehen Buchstaben. Verbinde jeden Buchstaben mit seinem Möbelstück."
                pairs:
                  - { left: { text: "B" }, right: { object: bed } }
                  - { left: { text: "S" }, right: { object: cupboard } }
                  - { left: { text: "T" }, right: { object: table } }
                  - { left: { text: "K" }, right: { object: box } }
                hints:
                  - "Jeder Buchstabe ist der erste Laut von einem Wort."
                  - "Bett fängt mit B an, Schrank mit S."
                  - "B und Bett, S und Schrank, T und Tisch, K und Kiste."
              - id: l1-f4
                type: image_multiple_choice
                text: "Ben sagt: „Mein Bett steht links. Rechts oben steht mein Schrank.“ Welcher Plan passt?"
                say: "Ben sagt: Mein Bett steht links. Rechts oben steht mein Schrank. Welcher Plan passt?"
                options:
                  - { drawn: grid, cols: 6, rows: 5, cells: [[5, 0, blue], [5, 1, blue], [5, 2, blue], [0, 0, brown], [0, 1, brown], [2, 4, yellow], [3, 4, yellow], [0, 4, red]], labels: [[5, 1, "B"], [0, 0, "S"], [2, 4, "T"], [0, 4, "K"]], key: bett-rechts }
                  - { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]], key: bett-links }
                  - { drawn: grid, cols: 6, rows: 5, cells: [[1, 4, blue], [2, 4, blue], [3, 4, blue], [5, 0, brown], [5, 1, brown], [2, 0, yellow], [3, 0, yellow], [0, 0, red]], labels: [[2, 4, "B"], [5, 0, "S"], [2, 0, "T"], [0, 0, "K"]], key: bett-unten }
                answer: bett-links
                option_audio: false
                feedback:
                  bett-rechts: "Auf diesem Plan steht das Bett rechts. Ben sagt aber: Mein Bett steht links."
                hints:
                  - "Such zuerst das Bett, das Kästchen mit dem B."
                  - "Das B muss links sein, das S rechts oben."
                  - "Der Plan mit dem Bett links und dem Schrank rechts oben."
              - id: l1-f5
                type: fill_in_blank
                text: "Wo stehen Schrank und Tisch?"
                say: "Schau auf Bens Plan. Setz die passenden Wörter ein."
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                frame: "Der Schrank steht rechts _. Der Tisch steht _ in der Mitte."
                options: ["oben", "unten", "links"]
                answer: ["oben", "unten"]
                hints:
                  - "S ist der Schrank, T der Tisch."
                  - "Das S ist ganz oben am Rand, das T ganz unten."
                  - "Rechts oben und unten in der Mitte."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "B = Bett, S = Schrank, T = Tisch, K = Kiste. Was steht rechts unten?"
                say: "Schau auf Bens Plan. Was steht rechts unten?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                options: ["die Kiste", "das Bett", "der Schrank"]
                answer: "die Kiste"
                hints: ["Geh mit dem Finger nach rechts und dann ganz nach unten."]
              - id: l1-s2
                type: true_false
                text: "Auf dem Plan ist das Zimmer genauso groß wie in echt."
                say: "Auf dem Plan ist das Zimmer genauso groß wie in echt. Stimmt das?"
                answer: false
                hints: ["Bens ganzes Zimmer passt auf ein Blatt Papier."]
              - id: l1-s3
                type: ordering
                text: "Wie malt Ben seinen Plan?"
                say: "Wie malt Ben seinen Plan? Leg die Karten in die richtige Reihenfolge."
                options: ["Er malt die Möbel als Kästchen.", "Er schaut sein Zimmer von oben an.", "Er schreibt Buchstaben in die Kästchen.", "Er malt den Rand für die Wände."]
                slot_count: 4
                answer: ["Er schaut sein Zimmer von oben an.", "Er malt den Rand für die Wände.", "Er malt die Möbel als Kästchen.", "Er schreibt Buchstaben in die Kästchen."]
                hints: ["Bevor Ben malt, muss er wissen, wie das Zimmer von oben aussieht."]
              - id: l1-s4
                type: fill_in_blank
                text: "Welche Buchstaben stehen auf Bens Plan?"
                say: "Setz die passenden Buchstaben ein."
                frame: "Auf Bens Plan steht _ für den Tisch und _ für die Kiste."
                options: ["T", "K", "S"]
                answer: ["T", "K"]
                hints: ["Hör auf den ersten Laut: Tisch, Kiste."]
              - id: l1-s5
                type: multiple_choice
                text: "Ben geht vom Bett zur Kiste. Wohin geht er auf dem Plan?"
                say: "Schau auf Bens Plan. Ben geht vom Bett zur Kiste. Wohin geht er?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                options: ["nach rechts und nach unten", "nach links und nach oben", "nur nach oben"]
                answer: "nach rechts und nach unten"
                hints: ["Das Bett ist links, die Kiste rechts unten."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Bens Freundin Ida sucht die Spielzeugkiste. Wo steht sie?"
                say: "Bens Freundin Ida kommt zu Besuch. Sie schaut auf den Plan und sucht die Spielzeugkiste. Wo steht sie?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                options: ["rechts unten", "links oben", "in der Mitte"]
                answer: "rechts unten"
              - id: l1-n2
                type: true_false
                text: "Ida sagt: „Der Tisch steht oben.“ Stimmt das?"
                say: "Ida sagt: Der Tisch steht oben. Stimmt das?"
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                answer: false
              - id: l1-n3
                type: sorting
                text: "Was steht auf Bens Plan oben, was unten?"
                say: "Schau auf Bens Plan. Was steht oben, was unten? Sortiere."
                show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
                bins:
                  - { id: oben, show: { text: "oben" }, say: "oben" }
                  - { id: unten, show: { text: "unten" }, say: "unten" }
                options:
                  - { text: "der Tisch", bin: unten }
                  - { text: "der Schrank", bin: oben }
                  - { text: "die Kiste", bin: unten }
              - id: l1-n4
                type: image_multiple_choice
                text: "Ben stellt sein Bett nach unten. Der Schrank bleibt rechts oben. Welcher Plan zeigt das?"
                say: "Ben stellt sein Bett nach unten. Der Schrank bleibt rechts oben. Welcher Plan zeigt das?"
                options:
                  - { drawn: grid, cols: 6, rows: 5, cells: [[1, 4, blue], [2, 4, blue], [3, 4, blue], [5, 0, brown], [5, 1, brown], [2, 0, yellow], [3, 0, yellow], [0, 0, red]], labels: [[2, 4, "B"], [5, 0, "S"], [2, 0, "T"], [0, 0, "K"]], key: bett-unten }
                  - { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]], key: bett-links }
                  - { drawn: grid, cols: 6, rows: 5, cells: [[5, 0, blue], [5, 1, blue], [5, 2, blue], [0, 0, brown], [0, 1, brown], [2, 4, yellow], [3, 4, yellow], [0, 4, red]], labels: [[5, 1, "B"], [0, 0, "S"], [2, 4, "T"], [0, 4, "K"]], key: bett-rechts }
                answer: bett-unten
                option_audio: false
              - id: l1-n5
                type: multiple_choice
                text: "Ben bekommt ein Regal. Welcher Buchstabe passt dafür auf den Plan?"
                say: "Ben bekommt ein Regal. Er malt es auf seinen Plan. Welcher Buchstabe passt dafür?"
                options: ["R", "B", "S"]
                answer: "R"
                feedback:
                  "S": "S steht auf Bens Plan schon für den Schrank. Regal fängt mit R an."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "B = Bett, S = Schrank, T = Tisch, K = Kiste. Was steht rechts oben?"
            say: "Schau auf Bens Plan. Was steht rechts oben?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
            options: ["der Schrank", "der Tisch", "das Bett"]
            answer: "der Schrank"
          - id: l1-c2
            type: true_false
            text: "Ein Plan zeigt ein Zimmer von vorne."
            say: "Ein Plan zeigt ein Zimmer von vorne. Stimmt das?"
            answer: false
          - id: l1-c3
            type: fill_in_blank
            text: "Was heißt B auf Bens Plan?"
            say: "Setz das passende Wort ein."
            frame: "Auf Bens Plan steht B für das _."
            options: ["Bett", "Sofa", "Fenster"]
            answer: ["Bett"]
          - id: l1-c4
            type: multiple_choice
            text: "B = Bett, S = Schrank, T = Tisch, K = Kiste. Wo steht der Tisch?"
            say: "Schau auf Bens Plan. Wo steht der Tisch?"
            show: { drawn: grid, cols: 6, rows: 5, cells: [[0, 0, blue], [0, 1, blue], [0, 2, blue], [5, 0, brown], [5, 1, brown], [2, 4, yellow], [3, 4, yellow], [5, 4, red]], labels: [[0, 1, "B"], [5, 0, "S"], [2, 4, "T"], [5, 4, "K"]] }
            options: ["unten in der Mitte", "links oben", "rechts oben"]
            answer: "unten in der Mitte"
          - id: l1-c5
            type: true_false
            text: "Auf dem Plan steht alles an derselben Stelle wie im Zimmer."
            say: "Auf dem Plan steht alles an derselben Stelle wie im Zimmer. Stimmt das?"
            answer: true
          - id: l1-c6
            type: image_multiple_choice
            text: "Wie sieht ein Bett von oben aus?"
            say: "Du schaust von oben auf ein Bett. Wie sieht es aus?"
            options:
              - { drawn: shape, kind: triangle, colour: blue }
              - { drawn: shape, kind: rectangle, colour: blue }
              - { drawn: shape, kind: circle, colour: blue }
            answer: rectangle
            option_audio: false

  - n: 2
    title: { de: "Unser Klassenzimmer", en: "Our classroom" }
    goal:
      de: "Finde dich mit einem Plan im Klassenzimmer zurecht. Ben findet seinen Platz und den Weg zur Leseecke."
      en: "Find your way round the classroom with a plan. Ben finds his place and the way to the reading corner."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie zeigt ein Plan ein Zimmer?"
            say: "Wie zeigt ein Plan ein Zimmer?"
            options: ["von oben", "von vorne", "von hinten"]
            answer: "von oben"
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Was war das S auf Bens Zimmerplan?"
            say: "Denk an Bens Zimmerplan. Was war das S?"
            options: [{ object: cupboard }, { object: bed }, { object: box }]
            answer: cupboard
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Findet Ben seinen Platz?"
            say: "Ben ist neu in der Klasse 2b. Er kennt das Klassenzimmer noch nicht. Seine Lehrerin, Frau Yilmaz, gibt ihm einen Plan. Was glaubst du: Kann Ben mit dem Plan seinen Platz finden?"
            show: { drawn: grid, cols: 7, rows: 5, cells: [[0, 0, blue], [2, 0, green], [3, 0, green], [4, 0, green], [3, 1, brown], [1, 4, yellow], [2, 4, red], [3, 4, yellow], [6, 3, purple], [6, 4, purple]], labels: [[0, 0, "W"], [3, 0, "T"], [3, 1, "P"], [2, 4, "B"], [6, 4, "L"]] }
          - text: "W = Waschbecken, T = Tafel, P = Pult, L = Leseecke, B = Bens Platz, gelb = Tische"
            say: "Ja! Unter dem Plan steht, was die Buchstaben und Farben bedeuten. W ist das Waschbecken, T die Tafel, P das Pult von Frau Yilmaz und L die Leseecke. Die gelben Kästchen sind Tische. Das rote Kästchen mit dem B ist Bens Platz. Auf diesem Plan heißt B also nicht Bett."
            show: { drawn: grid, cols: 7, rows: 5, cells: [[0, 0, blue], [2, 0, green], [3, 0, green], [4, 0, green], [3, 1, brown], [1, 4, yellow], [2, 4, red], [3, 4, yellow], [6, 3, purple], [6, 4, purple]], labels: [[0, 0, "W"], [3, 0, "T"], [3, 1, "P"], [2, 4, "B"], [6, 4, "L"]] }
          - text: "Die Tafel ist oben in der Mitte."
            say: "Die Tafel ist oben in der Mitte. Direkt darunter steht das Pult. Das Waschbecken ist links oben in der Ecke, und die Leseecke ist rechts unten."
