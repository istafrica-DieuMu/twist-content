# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.advertising
skill: world.society.advertising
curriculum: de-DE
language: de
title:
  de: Werbung erkennen
  en: Spotting adverts
summary: >
  Nele sees a short film for a toy robot, Robo Blitz, and wants it at
  once. Lesson 1 says what advertising is (a firm pays so that people want
  its product and buy it) and where it is: on television and radio, on the
  internet and in phone games, on posters, in leaflets and magazines, and
  on colourful packs in the supermarket. It names the signs: the product
  shown big, happy people, a catchy song, and the words "Werbung" or
  "Anzeige". Lesson 2 shows how adverts make wishes: the product looks
  better than it is (Robo Blitz cannot fly), happy faces and music,
  "Alle haben es!" and "Nur heute!", a favourite character or a free
  sticker. Nele learns to ask "Brauche ich das? Will ich es morgen auch
  noch?" and to sleep on it; wanting things is fine. It ends with the skill
  check. Every product and name is made up; no real brands.
metadata:
  year: klasse-2
  topic: { de: Wünschen und Kaufen, en: Wanting and buying }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.society.needs-wants, world.society.media-types, world.society.pocket-money]
  also_practises: []
  vocabulary: { de: [Werbung, Anzeige, Plakat, Prospekt, Werbefilm, Firma, verkaufen, Trick, Wunsch, überlegen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: recognise, what: { de: "Werbung erkennen und sagen, wo es sie gibt", en: recognising adverts and saying where they are } }
    - { id: purpose, what: { de: "sagen, wozu Werbung da ist", en: saying what adverts are for } }
    - { id: tricks, what: { de: "Tricks nennen, mit denen Werbung Wünsche weckt", en: naming the tricks adverts use to make people want things } }
    - { id: decide, what: { de: "klug mit einem Wunsch aus der Werbung umgehen", en: dealing wisely with a wish that comes from an advert } }
  misconceptions:
    - id: ads-only-tv
      what: Thinks advertising is only the films on television
      addressed: lesson 1 Learn lists radio, internet, games, posters, leaflets and packs; l1-s1, l1-n2, l1-n3, l1-n5 and the check tasks l2-c1 and l2-c2
    - id: ads-just-inform
      what: Thinks an advert only gives useful information and is not trying to sell
      addressed: lesson 1 opens with the guess about the robot film and answers that a firm pays to sell; l1-f1, l1-s3 and l2-c6, l2-c7
    - id: ads-show-reality
      what: Thinks the product is exactly as the advert shows it
      addressed: lesson 2 opens with the guess whether Robo Blitz flies; l2-f3, l2-n2 and l2-c10
    - id: everyone-has-it
      what: Believes "Alle haben es!" means everyone really has it
      addressed: lesson 2 Learn names it as a trick; l2-s1, l2-n3 and l2-c12
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Ist das Werbung?", en: "Is that an advert?" }
    goal:
      de: "Finde Werbung und sag, wozu sie da ist. Ein Plakat für ein neues Eis zum Beispiel will, dass du das Eis kaufst."
      en: "Find adverts and say what they are for. A poster for a new ice cream, for example, wants you to buy the ice cream."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was ist ein Wunsch, kein Bedürfnis?"
            say: "Was ist ein Wunsch und kein Bedürfnis?"
            options: ["ein neues Spielzeugauto", "Wasser zum Trinken", "ein Bett zum Schlafen"]
            answer: "ein neues Spielzeugauto"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Mit welchem Gerät kannst du einen Film sehen und hören?"
            say: "Mit welchem Gerät kannst du einen Film sehen und hören?"
            options: [{ object: mobile-phone }, { object: ball }, { object: spoon }]
            answer: mobile-phone
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Wozu ist dieser kurze Film da?"
            say: "Nele schaut mit ihrem Bruder Mats einen Film auf dem Tablet. Plötzlich kommt ein kurzer Film dazwischen. Ein Roboter fliegt durch ein Kinderzimmer, Kinder lachen und jubeln, und eine Stimme ruft: Robo Blitz! Jetzt im Laden! Was glaubst du: Wozu ist dieser kurze Film da?"
            show: { object: tablet }
          - text: "Das war Werbung. Sie will, dass du etwas kaufst."
            say: "Das war Werbung. Eine Firma bezahlt dafür, dass ihr Roboter gezeigt wird. Sie will, dass viele Kinder den Roboter haben wollen und ihn kaufen. Nele ruft sofort: Den will ich haben!"
            show: { object: toy-robot }
          - text: "Werbung gibt es fast überall."
            say: "Werbung gibt es im Fernsehen und im Radio, im Internet und in Spielen auf dem Handy. Es gibt sie auf großen Plakaten an der Straße, in Zeitschriften und in Prospekten im Briefkasten. Auch eine bunte Packung im Supermarkt macht Werbung für das, was drin ist."
            show: { objects: [billboard, cereal-box] }
          - text: "Daran erkennst du Werbung."
            say: "Werbung zeigt eine Sache ganz groß und sagt ihren Namen oft. Alle Menschen darin sind fröhlich. Oft gibt es ein Lied, das man sich leicht merkt. Und oft steht das Wort Werbung oder Anzeige dabei. In Deutschland muss Werbung als Werbung zu erkennen sein."
            show: { object: happy }
          - text: "Wusstest du? Schon vor fast 2000 Jahren gab es Werbung."
            say: "Wusstest du? Schon vor fast 2000 Jahren gab es Werbung. In der alten Stadt Pompeji in Italien haben die Menschen Werbung an die Hauswände gemalt, zum Beispiel für Kämpfe in der Arena. Man kann sie heute noch sehen."
          - text: "Frag dich: Will mir hier jemand etwas verkaufen?"
            say: "Wenn du etwas siehst oder hörst, frag dich: Will mir hier jemand etwas verkaufen? Dann ist es Werbung."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wozu ist Werbung da?"
                say: "Wozu ist Werbung da?"
                options: ["damit Menschen etwas kaufen", "damit Kinder schneller einschlafen", "damit wir das Wetter kennen"]
                answer: "damit Menschen etwas kaufen"
                hints:
                  - "Denk an den Film von Robo Blitz. Was ruft die Stimme?"
                  - "Die Firma bezahlt die Werbung. Was will sie mit ihrem Roboter?"
                  - "Werbung ist da, damit Menschen etwas kaufen."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Werbung oder keine Werbung?"
                say: "Werbung oder keine Werbung? Sortiere."
                bins:
                  - { id: werbung, show: { text: "Werbung" }, say: "Werbung" }
                  - { id: keine, show: { text: "keine Werbung" }, say: "keine Werbung" }
                options:
                  - { object: billboard, say: "ein Plakat für Limonade", bin: werbung }
                  - { object: book, say: "ein Bilderbuch über Igel", bin: keine }
                  - { text: "ein Film: Robo Blitz, jetzt im Laden!", bin: werbung }
                  - { object: letter, say: "ein Brief von Oma", bin: keine }
                  - { object: leaflet, say: "ein Prospekt mit Spielzeug und Preisen", bin: werbung }
                hints:
                  - "Frag bei jeder Karte: Will mir hier jemand etwas verkaufen?"
                  - "Oma will dir mit ihrem Brief nichts verkaufen."
                  - "Werbung: das Plakat, der Film und der Prospekt."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Auch eine bunte Packung im Supermarkt macht Werbung."
                say: "Stimmt das? Auch eine bunte Packung im Supermarkt macht Werbung."
                show: { object: cereal-box }
                answer: true
                hints:
                  - "Warum ist die Packung so bunt?"
                  - "Die Packung soll dir im Regal auffallen."
                  - "Ja. Die bunte Packung macht Werbung für das, was drin ist."
              - id: l1-f4
                type: image_multiple_choice
                text: "Auf welchem Gerät kommt oft Werbung zwischen Filmen und Spielen?"
                say: "Auf welchem Gerät kommt oft Werbung zwischen Filmen und Spielen?"
                options: [{ object: mobile-phone }, { object: toothbrush }, { object: kettle }]
                answer: mobile-phone
                feedback:
                  kettle: "Ein Wasserkocher mit Werbefilm? Der kocht nur Wasser! Auf dem Handy kommt oft Werbung."
                hints:
                  - "Auf welchem Gerät kann man Filme sehen?"
                  - "Mit der Zahnbürste putzt du Zähne, im Wasserkocher kocht Wasser."
                  - "Auf dem Handy kommt oft Werbung."
              - id: l1-f5
                type: multiple_choice
                text: "Woran erkennst du Werbung oft?"
                say: "Woran erkennst du Werbung oft?"
                options: ["Dort steht „Werbung“ oder „Anzeige“.", "Alle Menschen darin sind traurig.", "Sie ist immer schwarz und weiß."]
                answer: "Dort steht „Werbung“ oder „Anzeige“."
                hints:
                  - "Sind die Menschen in der Werbung froh oder traurig?"
                  - "Werbung muss als Werbung zu erkennen sein. Was steht dabei?"
                  - "Oft steht „Werbung“ oder „Anzeige“ dabei."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Werbung gibt es nur im Fernsehen."
                say: "Stimmt das? Werbung gibt es nur im Fernsehen."
                show: { object: television }
                answer: false
                feedback:
                  "true": "Werbung gibt es auch im Radio, im Internet, auf Plakaten, in Prospekten und auf Packungen."
                hints: ["Denk an die Straße und an deinen Briefkasten."]
              - id: l1-s2
                type: matching
                text: "Wo findest du diese Werbung?"
                say: "Wo findest du diese Werbung? Verbinde."
                pairs:
                  - { left: { object: billboard, say: "ein großes Plakat" }, right: { text: "an der Straße" } }
                  - { left: { object: leaflet, say: "ein Prospekt" }, right: { text: "im Briefkasten" } }
                  - { left: { object: television, say: "ein Werbefilm" }, right: { text: "im Fernsehen oder im Internet" } }
                hints: ["Ein Film braucht einen Bildschirm."]
              - id: l1-s3
                type: multiple_choice
                text: "Wer bezahlt die Werbung für Robo Blitz?"
                say: "Wer bezahlt die Werbung für Robo Blitz?"
                show: { object: toy-robot }
                options: ["die Firma, die den Roboter verkauft", "Nele", "Neles Schule"]
                answer: "die Firma, die den Roboter verkauft"
                hints: ["Wer möchte, dass viele Kinder den Roboter kaufen?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Was macht Werbung?"
                say: "Setz die passenden Wörter ein."
                frame: "Werbung will, dass wir etwas _. Darum zeigt sie die Sache ganz _."
                options: ["kaufen", "groß", "verschenken", "versteckt"]
                answer: ["kaufen", "groß"]
                hints: ["Die Firma will etwas verkaufen. Soll man die Sache gut sehen?"]
              - id: l1-s5
                type: true_false
                text: "Stimmt das? Wenn „Anzeige“ über einem Bild steht, ist es Werbung."
                say: "Stimmt das? Wenn das Wort Anzeige über einem Bild steht, ist es Werbung."
                answer: true
                hints: ["Welche zwei Wörter stehen oft bei Werbung?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Mats spielt ein Spiel auf dem Handy. Plötzlich kommt ein Film über ein anderes Spiel: „Jetzt laden!“ Was ist das?"
                say: "Mats spielt ein Spiel auf dem Handy. Plötzlich kommt ein Film über ein anderes Spiel, und eine Stimme ruft: Jetzt laden! Was ist das?"
                show: { object: mobile-phone }
                options: ["Werbung", "eine Nachricht von Oma", "ein Fehler im Handy"]
                answer: "Werbung"
              - id: l1-n2
                type: sorting
                text: "Nele holt die Post. Was ist Werbung?"
                say: "Nele holt die Post aus dem Briefkasten. Was ist Werbung, was nicht?"
                bins:
                  - { id: werbung, show: { text: "Werbung" }, say: "Werbung" }
                  - { id: keine, show: { text: "keine Werbung" }, say: "keine Werbung" }
                options:
                  - { object: leaflet, say: "ein Prospekt vom Supermarkt", bin: werbung }
                  - { object: postcard, say: "eine Postkarte von Tante Lia", bin: keine }
                  - { text: "ein Zettel: Pizza, heute billiger!", bin: werbung }
                  - { object: invitation, say: "die Einladung zu Ellas Geburtstag", bin: keine }
              - id: l1-n3
                type: true_false
                text: "Nele sagt: „Im Radio gibt es keine Werbung. Da sieht man ja nichts.“ Stimmt das?"
                say: "Nele sagt: Im Radio gibt es keine Werbung. Da sieht man ja nichts. Stimmt das?"
                show: { object: radio }
                answer: false
                feedback:
                  "true": "Werbung kann man auch hören. Im Radio kommt sie zwischen den Liedern."
              - id: l1-n4
                type: multiple_choice
                text: "Auf einem großen Plakat hält ein Kind lachend ein Eis. Darunter steht: „Das neue Eis. Jetzt im Laden!“ Was will das Plakat?"
                say: "Auf einem großen Plakat hält ein Kind lachend ein Eis. Darunter steht: Das neue Eis. Jetzt im Laden! Was will das Plakat?"
                show: { object: ice-cream }
                options: ["dass Menschen das Eis kaufen", "dass Kinder mehr lachen", "dass es draußen kalt wird"]
                answer: "dass Menschen das Eis kaufen"
              - id: l1-n5
                type: multiple_choice
                text: "Ole hört Radio. Zwischen zwei Liedern ruft eine fröhliche Stimme: „Komm in den Spielzeugladen am Markt!“ Was ist das?"
                say: "Ole hört Radio. Zwischen zwei Liedern ruft eine fröhliche Stimme: Komm in den Spielzeugladen am Markt! Was ist das?"
                show: { object: radio }
                options: ["Werbung", "ein Lied", "der Wetterbericht"]
                answer: "Werbung"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was will Werbung?"
            say: "Was will Werbung?"
            options: ["dass wir etwas kaufen", "dass wir schlafen gehen", "dass wir Hausaufgaben machen"]
            answer: "dass wir etwas kaufen"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ein Prospekt mit Preisen ist Werbung."
            say: "Stimmt das? Ein Prospekt mit Preisen ist Werbung."
            show: { object: leaflet }
            answer: true
          - id: l1-c3
            type: sorting
            text: "Werbung oder nicht?"
            say: "Werbung oder nicht? Sortiere."
            bins:
              - { id: werbung, show: { text: "Werbung" }, say: "Werbung" }
              - { id: keine, show: { text: "keine Werbung" }, say: "keine Werbung" }
            options:
              - { object: billboard, say: "ein Plakat für Saft", bin: werbung }
              - { object: letter, say: "ein Brief von Opa", bin: keine }
              - { text: "ein Werbefilm im Internet", bin: werbung }
              - { object: book, say: "ein Sachbuch über Wale", bin: keine }
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Werbung gibt es nur auf Plakaten."
            say: "Stimmt das? Werbung gibt es nur auf Plakaten."
            show: { object: billboard }
            answer: false
          - id: l1-c5
            type: image_multiple_choice
            text: "Was macht im Supermarkt Werbung für das, was drin ist?"
            say: "Was macht im Supermarkt Werbung für das, was drin ist?"
            options: [{ object: cereal-box }, { object: apple }, { object: egg }]
            answer: cereal-box
          - id: l1-c6
            type: multiple_choice
            text: "Welches Wort steht oft bei Werbung?"
            say: "Welches Wort steht oft bei Werbung?"
            options: ["Anzeige", "Rezept", "Pause"]
            answer: "Anzeige"

  - n: 2
    title: { de: "Die Tricks der Werbung", en: "The tricks of adverts" }
    goal:
      de: "Durchschau die Tricks der Werbung. Wenn sie ruft „Nur heute!“, überlegst du trotzdem in Ruhe."
      en: "See through the tricks of adverts. When one says \"Only today!\", you still think it over calmly."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Werbung will, dass wir etwas kaufen."
            say: "Stimmt das? Werbung will, dass wir etwas kaufen."
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wo gibt es Werbung?"
            say: "Wo gibt es Werbung?"
            options: ["im Fernsehen, im Internet und auf Plakaten", "nur im Fernsehen", "nur in der Zeitung"]
            answer: "im Fernsehen, im Internet und auf Plakaten"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Fliegt Robo Blitz bei Nele auch durchs Zimmer?"
            say: "Nele hat sich Robo Blitz zum Geburtstag gewünscht, und sie hat ihn bekommen! Im Werbefilm ist er durch das Kinderzimmer geflogen. Was glaubst du: Fliegt Robo Blitz bei Nele auch durchs Zimmer?"
            show: { object: toy-robot }
          - text: "Nein. Robo Blitz kann nur rollen und blinken."
            say: "Nein. Robo Blitz kann nur rollen und blinken. Im Werbefilm sah es nur so aus, als ob er fliegt. Werbung zeigt eine Sache oft schöner und besser, als sie ist. Das ist ihr erster Trick."
            show: { object: toy-robot }
          - text: "Fröhliche Menschen und Musik"
            say: "Werbung hat noch mehr Tricks, damit wir eine Sache haben wollen. In der Werbung lachen alle, und es läuft fröhliche Musik. Wir sollen denken: Mit dieser Sache bin ich auch so glücklich."
            show: { object: happy }
          - text: "„Alle haben es!“ und „Nur heute!“"
            say: "Manche Werbung ruft: Alle Kinder haben es schon! Oder: Nur heute! Nur noch wenige da! So sollen wir schnell kaufen, ohne lange nachzudenken. Ob das stimmt, sagt die Werbung nicht."
          - text: "Eine Lieblingsfigur oder ein Geschenk dazu"
            say: "Manchmal ist eine bekannte Figur aus einem Kinderfilm auf der Packung. Oder es gibt ein kleines Geschenk dazu, zum Beispiel einen Sticker zum Sammeln. Dann wollen Kinder die Sache wegen der Figur oder wegen des Geschenks."
            show: { object: sticker }
          - text: "Brauche ich das? Will ich es morgen auch noch?"
            say: "Sich etwas zu wünschen ist in Ordnung. Wenn du aber etwas in der Werbung siehst und es sofort haben willst, frag dich: Brauche ich das? Will ich es morgen auch noch? Schlaf eine Nacht darüber und schau dir die Sache im Laden genau an."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum lachen in der Werbung alle?"
                say: "Warum lachen in der Werbung alle?"
                options: ["Wir sollen denken: Mit der Sache bin ich auch glücklich.", "Weil alle Menschen immer lachen.", "Weil sie gerade Pause haben."]
                answer: "Wir sollen denken: Mit der Sache bin ich auch glücklich."
                hints:
                  - "Lachen ist ein Trick der Werbung. Was sollst du dabei fühlen?"
                  - "Die Werbung will, dass du die Sache mit Glück verbindest."
                  - "Du sollst denken: Mit der Sache bin ich auch glücklich."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was will dieser Trick? Verbinde."
                say: "Was will die Werbung mit diesem Trick? Verbinde."
                pairs:
                  - { left: { text: "„Nur heute!“" }, right: { text: "Du sollst schnell kaufen." } }
                  - { left: { text: "„Alle haben es schon!“" }, right: { text: "Du willst nicht als Einzige oder Einziger ohne sein." } }
                  - { left: { text: "ein Sticker gratis dazu" }, right: { text: "Du willst das Geschenk haben." } }
                hints:
                  - "Fang mit dem Sticker an. Was willst du dann haben?"
                  - "„Nur heute“ heißt: Es ist bald zu spät. Was sollst du also tun?"
                  - "Nur heute: schnell kaufen. Alle haben es: nicht ohne sein. Sticker: das Geschenk."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? In der Werbung sieht eine Sache manchmal besser aus, als sie ist."
                say: "Stimmt das? In der Werbung sieht eine Sache manchmal besser aus, als sie ist."
                answer: true
                hints:
                  - "Denk an Robo Blitz."
                  - "Im Werbefilm ist er geflogen. Und bei Nele?"
                  - "Ja. Robo Blitz kann nur rollen, nicht fliegen."
              - id: l2-f4
                type: sorting
                text: "Trick der Werbung oder kluge Frage?"
                say: "Was ist ein Trick der Werbung, was ist eine kluge Frage? Sortiere."
                bins:
                  - { id: trick, show: { text: "Trick der Werbung" }, say: "Trick der Werbung" }
                  - { id: frage, show: { text: "kluge Frage" }, say: "kluge Frage" }
                options:
                  - { text: "Nur heute!", bin: trick }
                  - { text: "Brauche ich das?", bin: frage }
                  - { text: "Alle Kinder haben es!", bin: trick }
                  - { text: "Will ich es morgen auch noch?", bin: frage }
                hints:
                  - "Wer will dir etwas verkaufen, und wer denkt in Ruhe nach?"
                  - "Die Werbung ruft laut. Eine kluge Frage stellst du dir selbst."
                  - "Tricks: Nur heute! und Alle Kinder haben es! Fragen: Brauche ich das? und Will ich es morgen auch noch?"
              - id: l2-f5
                type: multiple_choice
                text: "Nele sieht Werbung für Glitzerschuhe und will sie sofort. Was ist eine gute Idee?"
                say: "Nele sieht Werbung für Glitzerschuhe und will sie sofort. Was ist eine gute Idee?"
                options: ["eine Nacht darüber schlafen", "sofort ihr ganzes Taschengeld ausgeben", "weinen, bis Mama sie kauft"]
                answer: "eine Nacht darüber schlafen"
                feedback:
                  "weinen, bis Mama sie kauft": "Das macht alle traurig, auch Mama! Besser: eine Nacht darüber schlafen."
                hints:
                  - "Will Nele die Schuhe morgen auch noch?"
                  - "Was ist besser: schnell kaufen oder erst überlegen?"
                  - "Eine Nacht darüber schlafen ist eine gute Idee."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Wenn die Werbung sagt „Alle haben es!“, dann haben es wirklich alle."
                say: "Stimmt das? Wenn die Werbung sagt: Alle haben es!, dann haben es wirklich alle."
                answer: false
                feedback:
                  "true": "Das ist ein Trick. Die Werbung will, dass du es auch haben willst. Ob es stimmt, sagt sie nicht."
                hints: ["Wer sagt das, und was will er dir verkaufen?"]
              - id: l2-s2
                type: image_multiple_choice
                text: "Welches kleine Geschenk liegt oft als Trick in einer Packung?"
                say: "Welches kleine Geschenk liegt oft als Trick in einer Packung?"
                options: [{ object: sticker }, { object: bed }, { object: fridge }]
                answer: sticker
                feedback:
                  fridge: "Ein Kühlschrank in der Müslipackung? Der passt nicht hinein! Ein Sticker zum Sammeln schon."
                hints: ["Was ist so klein, dass es in eine Packung passt?"]
              - id: l2-s3
