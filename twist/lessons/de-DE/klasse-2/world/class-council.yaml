# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.class-council
skill: world.society.class-council
curriculum: de-DE
language: de
title:
  de: Der Klassenrat
  en: The class council
summary: >
  The Klasse 2a holds its Klassenrat once a week. Lesson 1 shows what it
  is: all the children sit in a circle and talk over and decide things
  together; during the week anyone can put a topic (a problem, praise or
  an idea) on a slip into the Klassenrat box; children take the roles of
  Leitung (calls up the topics, chooses who speaks), Zeitwächter (watches
  the time) and Protokoll (writes down the decisions), and the roles
  change each week; the talk rules are put your hand up, let the speaker
  finish, listen, nobody is laughed at. Lesson 2 follows Paul's topic
  (the same children always take all the balls at break): Paul explains,
  everyone talks it over and makes suggestions, the class votes by
  raising hands, every child has one vote, the suggestion with the most
  votes has the majority, the decision holds for everyone and is written
  down. It ends with the skill check. Every class, name and vote is
  written for Twist.
metadata:
  year: klasse-2
  topic: { de: Gemeinsam in der Klasse, en: Together in class }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.society.class-rules, world.society.friendship-conflict]
  also_practises: []
  vocabulary: { de: [Klassenrat, Thema, Problem, Lob, Idee, Leitung, Zeitwächter, Protokoll, melden, ausreden, beraten, Vorschlag, abstimmen, Stimme, Mehrheit, Beschluss] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: what, what: { de: "sagen, was der Klassenrat ist und welche Themen dort besprochen werden", en: "saying what the class council is and which topics it talks about" } }
    - { id: rules-roles, what: { de: "die Gesprächsregeln und die Ämter im Klassenrat kennen", en: "knowing the talk rules and the roles in the class council" } }
    - { id: vote, what: { de: "Vorschläge beraten, abstimmen und sagen, was die Mehrheit beschlossen hat", en: "talking over suggestions, voting and saying what the majority decided" } }
  misconceptions:
    - id: teacher-decides
      what: Thinks the teacher alone decides everything in the class
      addressed: lesson 1 Learn opens with the guess and answers that all the children talk over and decide together; l1-f1, l1-c1 and l2-c1
    - id: loudest-wins
      what: Thinks whoever shouts loudest gets their way
      addressed: lesson 1 Learn gives the talk rules; l1-f3, l1-s1, l1-n4; lesson 2 Learn says every child has one vote; l2-s4, l2-c8, l2-c12, l2-c18 and l2-c19
    - id: only-complaints
      what: Thinks the Klassenrat is only for complaints about others
      addressed: lesson 1 Learn names problems, praise and ideas; l1-f4, l1-s2, l1-c5 and l1-c6; l2-c2, l2-c3 and l2-c5 in the skill check
    - id: majority-not-binding
      what: Thinks children who voted for something else need not keep to the decision
      addressed: lesson 2 Learn says the decision holds for everyone; l2-f3, l2-n2 and l2-n5; l2-c15 and l2-c20 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Was ist der Klassenrat?", en: "What is the class council?" }
    goal:
      de: "Finde heraus, was im Klassenrat passiert. Lerne die Ämter und die Gesprächsregeln kennen, so wie: Wer etwas sagen will, meldet sich."
      en: "Find out what happens in the class council. Get to know the roles and the talk rules, like: if you want to say something, put your hand up."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Warum meldest du dich, bevor du in der Klasse sprichst?"
            say: "Warum meldest du dich, bevor du in der Klasse sprichst?"
            options: ["damit nicht alle durcheinanderreden", "damit dein Arm stärker wird", "damit dich niemand hört"]
            answer: "damit nicht alle durcheinanderreden"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Bei einem fairen Streit dürfen beide erzählen, was passiert ist."
            say: "Stimmt das? Bei einem fairen Streit dürfen beide erzählen, was passiert ist."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wer entscheidet in der Klasse, was passiert?"
            say: "In der Klasse 2a gibt es Ärger um die Bälle in der Pause, und Jana hat eine Idee für einen Spieletag. Was glaubst du: Wer entscheidet in der Klasse, was passiert? Die Lehrerin allein, die lautesten Kinder oder alle zusammen?"
            show: { object: school }
          - text: "Im Klassenrat beraten und entscheiden alle Kinder zusammen."
            say: "Alle zusammen! Dafür gibt es in der 2a den Klassenrat. Einmal in der Woche sitzen alle Kinder im Kreis. Sie besprechen, was sie stört, was gut lief und welche Ideen sie haben. Und sie entscheiden gemeinsam."
            show: { object: chair }
          - text: "Die Themen kommen in den Klassenrat-Briefkasten."
            say: "Die ganze Woche über kann jedes Kind ein Thema auf einen Zettel schreiben und in eine Kiste werfen. Das ist der Klassenrat-Briefkasten. Ein Thema kann ein Problem sein, ein Lob für jemanden oder eine Idee."
            show: { object: box }
          - text: "Ämter im Klassenrat: Leitung, Zeitwächter, Protokoll"
            say: "Im Klassenrat haben Kinder Ämter. Die Leitung ruft die Themen auf und nimmt die Kinder dran. Der Zeitwächter passt auf die Uhr auf. Das Kind mit dem Protokoll schreibt auf, was beschlossen wird. Jede Woche sind andere Kinder dran."
            show: { objects: [clock, pencil] }
          - text: "Gesprächsregeln: melden, ausreden lassen, zuhören, niemanden auslachen"
            say: "Damit alle zu Wort kommen, gibt es Gesprächsregeln. Wer etwas sagen will, meldet sich. Wer spricht, darf ausreden. Die anderen hören zu. Und niemand wird ausgelacht."
            show: { object: listen }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist der Klassenrat?"
                say: "Was ist der Klassenrat?"
                options: ["Alle Kinder der Klasse beraten und entscheiden zusammen.", "Die Lehrerin bestimmt allein.", "Ein Rat, wie man schneller rechnet."]
                answer: "Alle Kinder der Klasse beraten und entscheiden zusammen."
                feedback:
                  "Ein Rat, wie man schneller rechnet.": "Das wäre praktisch, aber nein. Im Klassenrat beraten und entscheiden alle Kinder zusammen."
                hints:
                  - "Wer sitzt im Klassenrat im Kreis?"
                  - "Im Klassenrat bestimmt nicht einer allein."
                  - "Alle Kinder beraten und entscheiden zusammen."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Welches Amt macht was?"
                say: "Verbinde jedes Amt mit seiner Aufgabe."
                pairs:
                  - { left: { text: "Leitung" }, right: { text: "ruft die Themen auf und nimmt dran" } }
                  - { left: { text: "Zeitwächter" }, right: { text: "passt auf die Uhr auf" } }
                  - { left: { text: "Protokoll" }, right: { text: "schreibt auf, was beschlossen wird" } }
                hints:
                  - "Fang mit dem Wort an, in dem schon ein Hinweis steckt."
                  - "Im Zeitwächter steckt das Wort Zeit."
                  - "Die Leitung ruft auf, der Zeitwächter schaut auf die Uhr, das Protokoll schreibt auf."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Im Klassenrat redet, wer am lautesten ruft."
                say: "Stimmt das? Im Klassenrat redet, wer am lautesten ruft."
                answer: false
                hints:
                  - "Was machst du, wenn du etwas sagen willst?"
                  - "Wer etwas sagen will, meldet sich, und die Leitung nimmt dran."
                  - "Nein. Wer sich meldet, wird drangenommen."
              - id: l1-f4
                type: sorting
                text: "Problem, Lob oder Idee?"
                say: "Sortiere die Zettel aus dem Briefkasten. Ist das ein Problem, ein Lob oder eine Idee?"
                bins:
                  - { id: problem, show: { text: "Problem" }, say: "Problem" }
                  - { id: lob, show: { text: "Lob" }, say: "Lob" }
                  - { id: idee, show: { text: "Idee" }, say: "Idee" }
                options:
                  - { text: "In der Pause sind die Bälle immer weg.", bin: problem }
                  - { text: "Danke an Paul, er hat mir beim Aufräumen geholfen.", bin: lob }
                  - { text: "Wir könnten einen Spieletag machen.", bin: idee }
                  - { text: "Im Flur wird immer geschubst.", bin: problem }
                hints:
                  - "Lies jeden Zettel und frag dich: Ärgert sich jemand, freut sich jemand oder schlägt jemand etwas vor?"
                  - "Ein Lob sagt Danke oder toll. Eine Idee sagt: Wir könnten ..."
                  - "Bälle weg und Schubsen sind Probleme, Danke an Paul ist ein Lob, der Spieletag ist eine Idee."
              - id: l1-f5
                type: image_multiple_choice
                text: "Wohin wirft Jana ihren Zettel mit dem Thema?"
                say: "Wohin wirft Jana ihren Zettel mit dem Thema?"
                options: [{ object: box }, { object: oven }, { object: bath }]
                answer: box
                feedback:
                  oven: "In den Ofen? Dann wäre Janas Thema verbrannt! Der Zettel kommt in die Kiste, den Klassenrat-Briefkasten."
                hints:
                  - "Die Zettel werden die ganze Woche gesammelt."
                  - "Der Klassenrat-Briefkasten ist eine Kiste."
                  - "In die Kiste."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Jana möchte im Klassenrat etwas sagen. Was macht sie?"
                say: "Jana möchte im Klassenrat etwas sagen. Was macht sie?"
                options: ["Sie meldet sich.", "Sie ruft dazwischen.", "Sie steht auf und geht."]
                answer: "Sie meldet sich."
                hints: ["Denk an die erste Gesprächsregel."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Im Klassenrat kann man auch jemanden loben."
                say: "Stimmt das? Im Klassenrat kann man auch jemanden loben."
                answer: true
                hints: ["Ein Thema kann ein Problem, ein Lob oder eine Idee sein."]
              - id: l1-s3
                type: fill_in_blank
                text: "Die Gesprächsregeln"
                say: "Setz die passenden Wörter ein."
                frame: "Wer etwas sagen will, _ sich. Wer spricht, darf _."
                options: ["meldet", "ausreden", "schreit"]
                answer: ["meldet", "ausreden"]
                hints: ["Man hebt die Hand, und niemand unterbricht."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Was braucht der Zeitwächter?"
                say: "Was braucht der Zeitwächter für sein Amt?"
                options: [{ object: clock }, { object: ball }, { object: cake }]
                answer: clock
                hints: ["Er passt auf, wie viel Zeit noch bleibt."]
              - id: l1-s5
                type: sorting
                text: "Ist das eine Gesprächsregel im Klassenrat?"
                say: "Sortiere. Was ist eine Gesprächsregel, was nicht?"
                bins:
                  - { id: ja, show: { text: "Gesprächsregel" }, say: "Gesprächsregel" }
                  - { id: nein, show: { text: "keine Regel" }, say: "keine Regel" }
                options:
                  - { text: "zuhören", bin: ja }
                  - { text: "auslachen", bin: nein }
                  - { text: "sich melden", bin: ja }
                  - { text: "dazwischenrufen", bin: nein }
                hints: ["Eine Regel hilft, dass alle zu Wort kommen."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paul ärgert sich, weil im Flur immer geschubst wird. Was kann er tun?"
                say: "Paul ärgert sich, weil im Flur immer geschubst wird. Was kann er tun?"
                options: ["Er schreibt es auf einen Zettel für den Klassenrat.", "Er schubst einfach zurück.", "Er sagt nie etwas."]
                answer: "Er schreibt es auf einen Zettel für den Klassenrat."
              - id: l1-n2
                type: true_false
                text: "Mehmet ist diese Woche Zeitwächter. Er schreibt alle Beschlüsse auf. Stimmt das?"
                say: "Mehmet ist diese Woche Zeitwächter. Er schreibt alle Beschlüsse auf. Stimmt das?"
                answer: false
              - id: l1-n3
                type: ordering
                text: "Wie kommt Janas Thema in den Klassenrat?"
                say: "Wie kommt Janas Thema in den Klassenrat? Leg die Karten in die richtige Reihenfolge."
                options: ["Im Klassenrat liest die Leitung den Zettel vor.", "Jana schreibt ihr Thema auf einen Zettel.", "Sie wirft den Zettel in den Briefkasten."]
                slot_count: 3
                answer: ["Jana schreibt ihr Thema auf einen Zettel.", "Sie wirft den Zettel in den Briefkasten.", "Im Klassenrat liest die Leitung den Zettel vor."]
              - id: l1-n4
                type: multiple_choice
                text: "Lena lacht, als Ali im Klassenrat spricht. Welche Regel hat sie vergessen?"
                say: "Lena lacht, als Ali im Klassenrat spricht. Welche Regel hat sie vergessen?"
                options: ["Niemand wird ausgelacht.", "Wir sitzen im Kreis.", "Die Leitung ruft die Themen auf."]
                answer: "Niemand wird ausgelacht."
              - id: l1-n5
                type: matching
                text: "Wer sagt das im Klassenrat?"
                say: "Wer sagt das im Klassenrat? Verbinde jeden Satz mit dem Amt."
                pairs:
                  - { left: { text: "„Jetzt ist Ali dran.“" }, right: { text: "Leitung" } }
                  - { left: { text: "„Wir haben noch fünf Minuten.“" }, right: { text: "Zeitwächter" } }
                  - { left: { text: "„Ich schreibe den Beschluss auf.“" }, right: { text: "Protokoll" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wer entscheidet im Klassenrat?"
            say: "Wer entscheidet im Klassenrat?"
            options: ["alle Kinder zusammen", "nur das lauteste Kind", "nur der Hausmeister"]
            answer: "alle Kinder zusammen"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Im Klassenrat darf jeder ausreden."
            say: "Stimmt das? Im Klassenrat darf jeder ausreden."
            answer: true
          - id: l1-c3
            type: matching
            text: "Was braucht welches Amt?"
            say: "Verbinde jedes Amt mit dem, was es braucht."
            pairs:
              - { left: { text: "Zeitwächter" }, right: { object: clock } }
              - { left: { text: "Protokoll" }, right: { object: pencil } }
          - id: l1-c4
            type: image_multiple_choice
            text: "Wo sammelt die 2a die Themen für den Klassenrat?"
            say: "Wo sammelt die 2a die Themen für den Klassenrat?"
            options: [{ object: box }, { object: fridge }, { object: bucket }]
            answer: box
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Im Klassenrat geht es nur um Streit."
            say: "Stimmt das? Im Klassenrat geht es nur um Streit."
            answer: false
          - id: l1-c6
            type: sorting
            text: "Problem oder Idee?"
            say: "Sortiere die Zettel. Ist das ein Problem oder eine Idee?"
            bins:
              - { id: problem, show: { text: "Problem" }, say: "Problem" }
              - { id: idee, show: { text: "Idee" }, say: "Idee" }
            options:
              - { text: "Die Toilette ist oft schmutzig.", bin: problem }
              - { text: "Wir pflanzen Blumen auf dem Schulhof.", bin: idee }
              - { text: "Beim Anstellen wird gedrängelt.", bin: problem }
              - { text: "Wir machen ein Klassenfest.", bin: idee }

  - n: 2
    title: { de: "Beraten und abstimmen", en: "Talking it over and voting" }
    goal:
      de: "Lerne, wie die Klasse gemeinsam entscheidet. Erst beraten alle, dann stimmt ihr ab, und die Mehrheit entscheidet."
      en: "Learn how the class decides together. First everyone talks it over, then you vote, and the majority decides."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was macht die Leitung im Klassenrat?"
            say: "Was macht die Leitung im Klassenrat?"
            options: ["Sie ruft die Themen auf und nimmt die Kinder dran.", "Sie passt auf die Uhr auf.", "Sie putzt die Tafel."]
            answer: "Sie ruft die Themen auf und nimmt die Kinder dran."
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Im Klassenrat redet immer nur die Lehrerin."
            say: "Stimmt das? Im Klassenrat redet immer nur die Lehrerin."
            answer: false
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Pauls Zettel: „In der Pause nehmen immer dieselben Kinder alle Bälle.“ Was tun?"
            say: "Heute liest die Leitung Pauls Zettel vor: In der Pause nehmen immer dieselben Kinder alle Bälle. Was glaubst du: Wie findet die Klasse eine Lösung, die für alle gilt?"
            show: { object: ball }
          - text: "Erst erklärt Paul sein Problem. Dann beraten alle."
            say: "Zuerst erklärt Paul sein Problem. Dann beraten alle: Die Kinder sagen ihre Meinung und machen Vorschläge. Jana schlägt vor: Jeden Tag ist eine andere Gruppe mit den Bällen dran. Mehmet schlägt vor: Jedes Kind darf nur einen Ball nehmen."
            show: { object: listen }
          - text: "Dann stimmt die Klasse ab. Jedes Kind hat eine Stimme."
            say: "Jetzt stimmt die Klasse ab. Jedes Kind hat eine Stimme und hebt einmal die Hand. Für Janas Vorschlag heben 15 Kinder die Hand. Für Mehmets Vorschlag heben 8 Kinder die Hand."
            show: { object: hand }
          - text: "15 Stimmen sind mehr als 8. Janas Vorschlag hat die Mehrheit."
            say: "15 Stimmen sind mehr als 8 Stimmen. Janas Vorschlag hat die Mehrheit. Die Mehrheit entscheidet, und der Beschluss gilt für alle, auch für die Kinder, die anders abgestimmt haben. Sie dürfen ihre Meinung trotzdem behalten und später eine neue Idee in den Briefkasten werfen."
            show: { object: hand }
          - text: "Das Protokoll schreibt den Beschluss auf."
            say: "Das Kind mit dem Protokoll schreibt den Beschluss auf. So können alle später nachlesen, was beschlossen wurde. Im nächsten Klassenrat schaut die Klasse, ob es geklappt hat."
            show: { object: pencil }
          - text: "Wusstest du? In zwei Gegenden der Schweiz stimmen die Menschen draußen auf einem Platz ab."
            say: "Wusstest du? In zwei Gegenden der Schweiz treffen sich die Menschen einmal im Jahr draußen auf einem großen Platz. Dort stimmen sie über wichtige Dinge ab. Dazu heben sie den Arm, so wie ihr im Klassenrat."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Zoo oder Wald? 12 Kinder sind für den Zoo, 9 Kinder für den Wald. Wohin geht der Ausflug?"
                say: "Die 2a stimmt über ihren Ausflug ab. 12 Kinder sind für den Zoo, 9 Kinder für den Wald. Wohin geht der Ausflug?"
                options: ["in den Zoo", "in den Wald", "nirgendwohin"]
                answer: "in den Zoo"
                hints:
                  - "Die Mehrheit entscheidet."
                  - "Welche Zahl ist größer: 12 oder 9?"
                  - "12 ist mehr als 9. Der Ausflug geht in den Zoo."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "So läuft ein Thema im Klassenrat. Was kommt zuerst?"
                say: "So läuft ein Thema im Klassenrat. Leg die Karten in die richtige Reihenfolge."
                options: ["abstimmen", "das Problem erklären", "den Beschluss aufschreiben", "beraten und Vorschläge machen"]
                slot_count: 4
                answer: ["das Problem erklären", "beraten und Vorschläge machen", "abstimmen", "den Beschluss aufschreiben"]
                hints:
                  - "Bevor alle beraten, müssen sie wissen, worum es geht."
                  - "Abstimmen kann man erst, wenn es Vorschläge gibt."
                  - "Erklären, beraten, abstimmen, aufschreiben."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Nur die Kinder, die dafür gestimmt haben, müssen sich an den Beschluss halten."
                say: "Stimmt das? Nur die Kinder, die dafür gestimmt haben, müssen sich an den Beschluss halten."
                answer: false
                hints:
                  - "Für wen gilt ein Beschluss im Klassenrat?"
                  - "Die Mehrheit entscheidet, und dann gilt es für die ganze Klasse."
                  - "Nein. Der Beschluss gilt für alle Kinder."
              - id: l2-f4
                type: matching
                text: "Was bedeutet das Wort?"
                say: "Verbinde jedes Wort mit seiner Bedeutung."
                pairs:
                  - { left: { text: "abstimmen" }, right: { text: "die Hand heben für einen Vorschlag" } }
                  - { left: { text: "Mehrheit" }, right: { text: "die meisten Stimmen" } }
                  - { left: { text: "Vorschlag" }, right: { text: "eine Idee, was man tun kann" } }
                hints:
                  - "Fang mit dem Wort an, das du am besten kennst."
                  - "In Mehrheit steckt das Wort mehr."
                  - "Abstimmen ist Hand heben, Mehrheit sind die meisten Stimmen, ein Vorschlag ist eine Idee."
              - id: l2-f5
                type: image_multiple_choice
                text: "Was heben die Kinder beim Abstimmen?"
                say: "Was heben die Kinder beim Abstimmen?"
                options: [{ object: hand }, { object: foot }, { object: chair }]
                answer: hand
                feedback:
                  chair: "Den Stuhl hochheben? Das wäre ganz schön schwer. Die Kinder heben die Hand."
                hints:
                  - "Es ist dasselbe wie beim Melden."
                  - "Man hebt es hoch über den Kopf."
                  - "Die Hand."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "7 Kinder sind für Fußball, 14 Kinder sind für Fangen."
                say: "Sieben Kinder sind für Fußball, vierzehn Kinder sind für Fangen. Was hat die Mehrheit?"
                frame: "_ hat die Mehrheit."
                options: ["Fangen", "Fußball"]
                answer: ["Fangen"]
                hints: ["Mehrheit heißt: die meisten Stimmen."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Beim Abstimmen hat jedes Kind eine Stimme."
                say: "Stimmt das? Beim Abstimmen hat jedes Kind eine Stimme."
                answer: true
                hints: ["Wie oft hebt jedes Kind die Hand?"]
              - id: l2-s3
                type: multiple_choice
                text: "Was machen die Kinder beim Beraten?"
                say: "Was machen die Kinder beim Beraten?"
                options: ["Sie sagen ihre Meinung und machen Vorschläge.", "Sie stimmen sofort ab.", "Sie gehen in die Pause."]
                answer: "Sie sagen ihre Meinung und machen Vorschläge."
                hints: ["Beraten kommt vor dem Abstimmen."]
              - id: l2-s4
                type: sorting
                text: "Ist so fair abgestimmt?"
                say: "Sortiere. Ist so fair abgestimmt oder nicht?"
                bins:
                  - { id: fair, show: { text: "fair" }, say: "fair" }
                  - { id: unfair, show: { text: "nicht fair" }, say: "nicht fair" }
                options:
                  - { text: "Jedes Kind hebt einmal die Hand.", bin: fair }
