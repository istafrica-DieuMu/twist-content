# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.healthy-eating
skill: world.body.healthy-eating
curriculum: de-DE
language: de
title:
  de: Gut essen und trinken
  en: Eating and drinking well
summary: >
  Emil brings a food pyramid poster home from school. Lesson 1 climbs the
  pyramid from the bottom: drinks (water best), vegetables and fruit
  ("fünf am Tag", one portion fits in your hand), bread, pasta and
  potatoes, then milk products, then meat, fish and eggs, then oil and
  butter, and sweets and snacks at the top. Nothing is forbidden; what
  matters is how much. Lesson 2 packs Emil's lunchbox for a class trip:
  a good meal takes from several levels, eat colourful, juice and
  lemonade have a lot of sugar (Saftschorle), and every family eats
  differently. No food is called bad and no body is talked about. It ends
  with the skill check.
metadata:
  year: klasse-2
  topic: { de: Gesund leben, en: Healthy living }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: []
  vocabulary: { de: [Ernährungspyramide, Getränk, Portion, Vollkorn, Zucker, Saftschorle, Brotdose] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: pyramid, what: { de: "wissen, wovon die Ernährungspyramide viel und wovon wenig zeigt", en: knowing what the food pyramid shows a lot of and what only a little } }
    - { id: drinks, what: { de: "wissen, dass Wasser den Durst am besten löscht", en: knowing that water is the best drink for thirst } }
    - { id: fruit-veg, what: { de: "Obst und Gemüse als „fünf am Tag“ erklären", en: explaining fruit and vegetables as five a day } }
    - { id: meal, what: { de: "eine gute Mahlzeit oder Brotdose zusammenstellen", en: putting together a good meal or lunchbox } }
  misconceptions:
    - id: sweets-forbidden
      what: Thinks some foods are forbidden or bad, so sweets must never be eaten
      addressed: lesson 1 Learn says nothing is forbidden, it is about how much; l1-s2 and l1-n5; l2-c4 in the skill check
    - id: top-is-most
      what: Reads the pyramid the wrong way up, as if the top showed what to eat most
      addressed: lesson 1 Learn climbs from the bottom; l1-f3, l1-c4; l2-w1, l2-c2 and l2-c8 in the skill check
    - id: juice-like-water
      what: Thinks juice and lemonade quench thirst as well as water
      addressed: lesson 1 Learn, drinks screen; l1-f1 with feedback; lesson 2 Learn on sugar and Saftschorle; l2-s2 and l2-s3; l2-c9 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Die Ernährungspyramide", en: "The food pyramid" }
    goal:
      de: "Lerne die Ernährungspyramide kennen. Finde heraus, wovon du viel brauchst und wovon nur wenig, so wie viel Wasser und wenig Kuchen."
      en: "Get to know the food pyramid. Find out what you need a lot of and what only a little, like lots of water and a little cake."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was glaubst du: Was steht ganz unten in der Pyramide?"
            say: "Emil hat ein Plakat aus der Schule mitgebracht. Darauf ist eine Pyramide aus Essen und Trinken. Unten ist sie breit, oben spitz. Unten steht, wovon du am meisten brauchst. Was glaubst du: Was steht ganz unten?"
            show: { objects: [water, cake] }
          - text: "Ganz unten: Getränke. Am besten Wasser."
            say: "Ganz unten stehen die Getränke. Davon brauchst du am meisten, jeden Tag mehrere Gläser. Den Durst löscht Wasser am besten. Auch Tee ohne Zucker ist gut."
            show: { object: water }
          - text: "Darüber: Gemüse und Obst. Fünf am Tag!"
            say: "Darüber kommen Gemüse und Obst. Davon darfst du viel essen. Eine gute Regel heißt: fünf am Tag. Das sind fünf Portionen Gemüse und Obst, und eine Portion passt in deine Hand."
            show: { objects: [carrot, apple] }
          - text: "Dann: Brot, Nudeln, Kartoffeln, Reis und Müsli."
            say: "Danach kommen Brot, Nudeln, Kartoffeln, Reis und Müsli. Sie geben dir Kraft für den ganzen Tag. Vollkornbrot macht besonders lange satt."
            show: { objects: [bread, pasta] }
          - text: "Weiter oben: Milch und Käse, dann Fleisch, Fisch und Eier."
            say: "Weiter oben stehen Milch, Joghurt und Käse. Noch ein Stück höher stehen Fleisch, Wurst, Fisch und Eier. Davon brauchst du weniger."
            show: { objects: [cheese, egg] }
          - text: "Ganz oben: Öl, Butter und Süßes. Davon ein bisschen."
            say: "In der Spitze stehen Öl und Butter, und ganz oben Süßes und Knabberzeug wie Kuchen, Eis und Chips. Sie schmecken lecker und dürfen auch sein. Davon brauchst du nur wenig. Verboten ist nichts. Es kommt darauf an, wie viel."
            show: { objects: [cake, ice-cream] }
          - text: "Wusstest du? Dein Körper besteht zu mehr als der Hälfte aus Wasser."
            say: "Wusstest du? Dein Körper besteht zu mehr als der Hälfte aus Wasser. Darum musst du jeden Tag trinken, besonders wenn du tobst oder es heiß ist."
            show: { object: glass }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was löscht den Durst am besten?"
                say: "Was löscht den Durst am besten?"
                options: [{ object: water }, { object: juice }, { object: hot-chocolate }]
                answer: water
                feedback:
                  juice: "Saft schmeckt gut, aber er hat viel Zucker. Den Durst löscht Wasser am besten."
                hints:
                  - "Denk an das, was ganz unten in der Pyramide steht."
                  - "Das beste Getränk hat keinen Zucker."
                  - "Wasser löscht den Durst am besten."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Wovon brauchst du viel, wovon wenig?"
                say: "Sortiere. Wovon brauchst du viel, wovon nur wenig?"
                bins:
                  - { id: viel, show: { text: "viel" }, say: "viel" }
                  - { id: wenig, show: { text: "wenig" }, say: "wenig" }
                options:
                  - { object: apple, bin: viel }
                  - { object: cake, bin: wenig }
                  - { object: carrot, bin: viel }
                  - { object: ice-cream, bin: wenig }
                hints:
                  - "Unten in der Pyramide steht, wovon du viel brauchst."
                  - "Obst und Gemüse stehen weit unten. Süßes steht ganz oben."
                  - "Apfel und Karotte zu viel, Kuchen und Eis zu wenig."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? In der Pyramide steht Süßes ganz unten."
                say: "Stimmt das? In der Pyramide steht Süßes ganz unten."
                answer: false
                hints:
                  - "Unten ist die Pyramide breit, oben ist wenig Platz."
                  - "Von Süßem brauchst du nur wenig."
                  - "Nein. Süßes steht ganz oben, ganz unten stehen die Getränke."
              - id: l1-f4
                type: multiple_choice
                text: "Wie viele Portionen Gemüse und Obst sind am Tag gut?"
                say: "Wie viele Portionen Gemüse und Obst sind am Tag gut?"
                options: ["fünf", "eine", "keine"]
                answer: "fünf"
                hints:
                  - "Die Regel heißt: ... am Tag."
                  - "Es sind so viele, wie du Finger an einer Hand hast."
                  - "Fünf am Tag."
              - id: l1-f5
                type: image_multiple_choice
                text: "Was steht in der Pyramide bei Brot und Nudeln?"
                say: "Was steht in der Pyramide bei Brot und Nudeln?"
                options: [{ object: porridge-bowl }, { object: egg }, { object: strawberry }]
                answer: porridge-bowl
                hints:
                  - "Bei Brot und Nudeln stehen Dinge aus Getreide."
                  - "Haferbrei macht man aus Haferflocken, wie Müsli."
                  - "Der Haferbrei."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Wo steht das in der Pyramide?"
                say: "Verbinde jedes Bild mit seinem Platz in der Pyramide."
                pairs:
                  - { left: { object: water }, right: { text: "ganz unten: Getränke" } }
                  - { left: { object: carrot }, right: { text: "weit unten: Gemüse und Obst" } }
                  - { left: { object: cake }, right: { text: "ganz oben: Süßes" } }
                hints: ["Fang ganz unten an: Wovon brauchst du am meisten?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Süßes ist verboten."
                say: "Stimmt das? Süßes ist verboten."
                answer: false
                hints: ["Oben in der Pyramide ist nur wenig Platz, aber Platz ist da."]
              - id: l1-s3
                type: multiple_choice
                text: "Wie groß ist eine Portion Obst?"
                say: "Wie groß ist eine Portion Obst?"
                options: ["so viel, wie in deine Hand passt", "ein ganzer Korb voll", "ein einziger Krümel"]
                answer: "so viel, wie in deine Hand passt"
                hints: ["Schau auf deine Hand. Ein Apfel passt gut hinein."]
              - id: l1-s4
                type: sorting
                text: "Getränke, Milch und Käse, oder Süßes?"
                say: "Sortiere. Wo steht das in der Pyramide?"
                bins:
                  - { id: trinken, show: { text: "Getränke" }, say: "Getränke" }
                  - { id: milch, show: { text: "Milch und Käse" }, say: "Milch und Käse" }
                  - { id: suess, show: { text: "Süßes" }, say: "Süßes" }
                options:
                  - { object: water, bin: trinken }
                  - { object: cheese, bin: milch }
                  - { object: cake, bin: suess }
                  - { object: gummy-bears, bin: suess }
                hints: ["Käse macht man aus Milch."]
              - id: l1-s5
                type: fill_in_blank
                text: "Unten und oben in der Pyramide"
                say: "Setz die passenden Wörter ein."
                frame: "Ganz unten in der Pyramide steht _. Ganz oben steht _."
                options: ["Wasser", "Süßes", "Käse"]
                answer: ["Wasser", "Süßes"]
                hints: ["Unten steht, wovon du am meisten brauchst."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Emil kommt vom Fußball und hat großen Durst. Was trinkt er am besten?"
                say: "Emil kommt vom Fußball und hat großen Durst. Was trinkt er am besten?"
                options: ["ein Glas Wasser", "eine große Limo", "gar nichts"]
                answer: "ein Glas Wasser"
              - id: l1-n2
                type: sorting
                text: "Emil packt den Einkaufskorb aus. Steht das unten oder oben in der Pyramide?"
                say: "Emil packt den Einkaufskorb aus. Sortiere: Steht das unten oder oben in der Pyramide?"
                bins:
                  - { id: unten, show: { text: "unten: davon viel" }, say: "unten, davon viel" }
                  - { id: oben, show: { text: "oben: davon wenig" }, say: "oben, davon wenig" }
                options:
                  - { object: tomato, bin: unten }
                  - { object: cake, bin: oben }
                  - { object: bread, bin: unten }
                  - { object: gummy-bears, bin: oben }
              - id: l1-n3
                type: true_false
                text: "Emils Opa sagt: „Gemüse und Obst darfst du jeden Tag viel essen.“ Stimmt das?"
                say: "Emils Opa sagt: Gemüse und Obst darfst du jeden Tag viel essen. Stimmt das?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Emil hat heute schon 4 Portionen Obst und Gemüse gegessen. Was ist seine fünfte?"
                say: "Emil hat heute schon vier Portionen Obst und Gemüse gegessen. Was ist seine fünfte Portion?"
                options: [{ object: banana }, { object: cake }, { object: ice-cream }]
                answer: banana
              - id: l1-n5
                type: multiple_choice
                text: "Emils Schwester sagt: „Kuchen esse ich nie wieder, der ist schlecht!“ Was stimmt?"
                say: "Emils Schwester sagt: Kuchen esse ich nie wieder, der ist schlecht! Was stimmt?"
                options: ["Kuchen darf sein, nur nicht so viel.", "Kuchen gehört ganz unten in die Pyramide.", "Man darf nur noch Kuchen essen."]
                answer: "Kuchen darf sein, nur nicht so viel."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was steht ganz unten in der Pyramide?"
            say: "Was steht ganz unten in der Pyramide?"
            options: [{ object: water }, { object: cake }, { object: cheese }]
            answer: water
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Von Gemüse und Obst darfst du viel essen."
            say: "Stimmt das? Von Gemüse und Obst darfst du viel essen."
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Wovon brauchst du nur wenig?"
            say: "Wovon brauchst du nur wenig?"
            options: ["von Süßem wie Kuchen", "von Gemüse", "von Wasser"]
            answer: "von Süßem wie Kuchen"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Wasser steht in der Pyramide ganz oben."
            say: "Stimmt das? Wasser steht in der Pyramide ganz oben."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was heißt „fünf am Tag“?"
            say: "Was heißt fünf am Tag?"
            options: ["fünf Portionen Gemüse und Obst", "fünf Stück Kuchen", "fünf Gläser Limo"]
            answer: "fünf Portionen Gemüse und Obst"
          - id: l1-c6
            type: image_multiple_choice
            text: "Was steht in der Pyramide bei Gemüse und Obst?"
            say: "Was steht in der Pyramide bei Gemüse und Obst?"
            options: [{ object: tomato }, { object: cake }, { object: cheese }]
            answer: tomato

  - n: 2
    title: { de: "Emils Brotdose", en: "Emil's lunchbox" }
    goal:
      de: "Stell eine gute Brotdose zusammen, so wie Brot mit Käse, einen Apfel und Wasser."
      en: "Put together a good lunchbox, like bread with cheese, an apple and water."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Süßes steht ganz oben in der Pyramide."
            say: "Stimmt das? Süßes steht ganz oben in der Pyramide."
            answer: true
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Wovon darfst du viel essen?"
            say: "Wovon darfst du viel essen?"
            options: [{ object: carrot }, { object: cake }, { object: ice-cream }]
            answer: carrot
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was soll in Emils Brotdose?"
            say: "Morgen macht Emils Klasse einen Ausflug in den Wald. Emil packt seine Brotdose. Was glaubst du: Was soll hinein, damit er den ganzen Tag Kraft hat?"
            show: { object: lunchbox }
          - text: "Brot mit Käse, Karotten, ein Apfel und eine Flasche Wasser."
            say: "Emil nimmt ein Vollkornbrot mit Käse, ein paar Karottenstücke und einen Apfel. Dazu eine Flasche Wasser. So hat er etwas von unten aus der Pyramide, etwas aus der Mitte und genug zu trinken."
            show: { objects: [bread, bottle] }
          - text: "Iss bunt: viele Farben auf dem Teller."
            say: "Eine gute Regel heißt: Iss bunt. Rote Tomaten, orange Karotten, gelbe Bananen, grüne Gurken. Jede Sorte Obst und Gemüse bringt etwas anderes mit, das dein Körper braucht."
            show: { objects: [tomato, carrot] }
          - text: "In Limo und Saft ist viel Zucker."
            say: "In Limo und Saft ist viel Zucker. Darum trinkt Emil sie nur ab und zu. Wenn er Saft mag, mischt er ihn mit viel Wasser. Das heißt Saftschorle."
            show: { objects: [lemonade, juice] }
          - text: "Frühstück gibt Kraft für den Morgen."
            say: "Vor der Schule frühstückt Emil, zum Beispiel ein Müsli mit Milch und einer Banane. Dann hat er Kraft zum Lernen und Spielen."
            show: { objects: [cereal-box, banana] }
          - text: "Jede Familie isst anders, und das ist in Ordnung."
            say: "Manche Kinder essen kein Fleisch, manche vertragen keine Milch, und in jeder Familie schmeckt es anders. Das ist in Ordnung. Die Pyramide hilft allen, gut auszuwählen."
            show: { object: kitchen }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Was passt am besten in Emils Brotdose?"
                say: "Was passt am besten in Emils Brotdose?"
                options: [{ object: apple }, { object: cake }, { object: ice-cream }]
                answer: apple
                feedback:
                  ice-cream: "Ein Eis in der Brotdose? Bis zur Pause wäre es geschmolzen! Ein Apfel passt besser."
                hints:
                  - "Was hält bis zur Pause und gibt dir Kraft?"
                  - "Obst steht weit unten in der Pyramide."
                  - "Der Apfel passt am besten."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "In welchem Getränk ist viel Zucker?"
                say: "In welchem Getränk ist viel Zucker?"
                options: ["in Limo", "in Wasser", "in Tee ohne Zucker"]
                answer: "in Limo"
                hints:
                  - "Eins der Getränke schmeckt sehr süß."
                  - "Wasser und Tee ohne Zucker sind nicht süß."
                  - "In Limo ist viel Zucker."
              - id: l2-f3
                type: matching
                text: "Iss bunt! Welche Farbe hat das?"
                say: "Verbinde jedes Gemüse und Obst mit seiner Farbe."
                pairs:
                  - { left: { object: tomato }, right: { text: "rot" } }
                  - { left: { object: carrot }, right: { text: "orange" } }
                  - { left: { object: banana }, right: { text: "gelb" } }
                hints:
                  - "Fang mit dem an, das du am besten kennst."
                  - "Die Tomate ist so rot wie eine Ampel, die Banane so gelb wie die Sonne."
                  - "Tomate rot, Karotte orange, Banane gelb."
              - id: l2-f4
                type: true_false
                text: "Stimmt das? Saftschorle ist Saft, gemischt mit viel Wasser."
                say: "Stimmt das? Saftschorle ist Saft, gemischt mit viel Wasser."
                show: { objects: [juice, water] }
                answer: true
                hints:
                  - "Denk daran, wie Emil seinen Saft trinkt."
                  - "Er mischt ihn, damit weniger Zucker drin ist."
                  - "Ja. Saftschorle ist Saft mit viel Wasser."
              - id: l2-f5
                type: fill_in_blank
                text: "Emils Pausenbrot"
                say: "Setz die passenden Wörter ein."
                frame: "Ich esse Brot mit _ und trinke dazu _."
                options: ["Käse", "Wasser", "Kuchen"]
                answer: ["Käse", "Wasser"]
                hints:
                  - "Was kommt auf ein Brot, was trinkt man?"
                  - "Kuchen kann man nicht trinken, und auf ein Pausenbrot kommt er auch nicht."
                  - "Brot mit Käse, dazu Wasser."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Was ist ein gutes Frühstück vor der Schule?"
                say: "Was ist ein gutes Frühstück vor der Schule?"
                options: [{ object: cereal-box }, { object: cake }, { object: ice-cream }]
                answer: cereal-box
                hints: ["Was gibt dir lange Kraft für den Morgen?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Wer Limo mag, trinkt sie am besten statt Wasser."
                say: "Stimmt das? Wer Limo mag, trinkt sie am besten statt Wasser."
                show: { object: lemonade }
                answer: false
                hints: ["Was ist in Limo, und was löscht den Durst am besten?"]
              - id: l2-s3
                type: sorting
                text: "Was trinkst du oft, was nur ab und zu?"
                say: "Sortiere. Was trinkst du oft, was nur ab und zu?"
                bins:
                  - { id: oft, show: { text: "oft" }, say: "oft" }
                  - { id: selten, show: { text: "ab und zu" }, say: "ab und zu" }
                options:
                  - { object: water, bin: oft }
                  - { object: juice, bin: selten }
                  - { object: tea, say: "Tee ohne Zucker", bin: oft }
                  - { object: lemonade, bin: selten }
                hints: ["Getränke mit viel Zucker trinkst du nur ab und zu."]
              - id: l2-s4
                type: multiple_choice
                text: "Lea isst kein Fleisch. Was stimmt?"
                say: "Lea isst kein Fleisch. Was stimmt?"
                options: ["Das ist in Ordnung. Sie wählt anderes aus der Pyramide.", "Dann darf sie gar nichts essen.", "Dann muss sie nur Süßes essen."]
                answer: "Das ist in Ordnung. Sie wählt anderes aus der Pyramide."
                hints: ["In der Pyramide gibt es noch viel mehr als Fleisch."]
              - id: l2-s5
                type: fill_in_blank
                text: "Iss bunt!"
                say: "Setz die passenden Farben ein."
                frame: "Die Gurke ist _. Die Tomate ist _."
                options: ["grün", "rot", "blau"]
                answer: ["grün", "rot"]
                hints: ["Die Gurke hat dieselbe Farbe wie Gras."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: sorting
                text: "Emil und Ida packen für den Ausflug. Wo steht das in der Pyramide?"
                say: "Emil und Ida packen für den Ausflug. Sortiere: Wo steht das in der Pyramide?"
                bins:
                  - { id: unten, show: { text: "unten: viel" }, say: "unten, davon viel" }
                  - { id: mitte, show: { text: "Mitte: etwas" }, say: "in der Mitte, davon etwas" }
                  - { id: oben, show: { text: "oben: wenig" }, say: "oben, davon wenig" }
                options:
                  - { object: bread, bin: unten }
                  - { object: cheese, bin: mitte }
                  - { object: cake, bin: oben }
                  - { object: strawberry, bin: unten }
              - id: l2-n2
                type: multiple_choice
                text: "Ida hat nur Gummibärchen eingepackt. Was fehlt ihr für einen langen Tag im Wald?"
                say: "Ida hat nur Gummibärchen eingepackt. Was fehlt ihr für einen langen Tag im Wald?"
                show: { object: gummy-bears }
                options: ["Brot, Obst und Wasser", "noch mehr Gummibärchen", "nichts, das reicht"]
                answer: "Brot, Obst und Wasser"
              - id: l2-n3
                type: true_false
                text: "Im Wald wird es heiß. Emil sagt: „Ich trinke zwischendurch Wasser.“ Ist das eine gute Idee?"
                say: "Im Wald wird es heiß. Emil sagt: Ich trinke zwischendurch Wasser. Ist das eine gute Idee?"
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Ida mag Saft. Was kann sie trinken, damit nicht so viel Zucker drin ist?"
                say: "Ida mag Saft. Was kann sie trinken, damit nicht so viel Zucker drin ist?"
                show: { object: juice }
                options: ["Saftschorle mit viel Wasser", "zwei Gläser Saft", "eine Limo"]
                answer: "Saftschorle mit viel Wasser"
              - id: l2-n5
