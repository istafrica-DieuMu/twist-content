# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.stable-building
skill: world.technology.stable-building
curriculum: de-DE
language: de
title:
  de: Was hält ein Bauwerk stabil?
  en: What makes a building stand firm?
summary: >
  Ida and Tom build a tower of wooden blocks for the school fete. Lesson 1
  finds out why Tom's tower stays up and Ida's falls: a wide base
  (Grundfläche) and supports set far apart, like a table's legs at the
  corners, and heavy parts at the bottom, light ones on top. The Eiffel
  Tower stands on four wide feet. Lesson 2 adds what stiffens a frame: a
  triangle keeps its shape where a square wobbles, and a diagonal brace
  (Strebe) turns a square into two triangles. Bricks laid offset hold each
  other, and paper folded or rolled carries much more than a flat sheet.
  Twist teaches the idea and the prediction; building real models stays
  in class. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Bauen und Berufe, en: Building and jobs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: []
  also_practises: []
  vocabulary: { de: [stabil, Grundfläche, Stütze, Strebe, Dreieck, Viereck, versetzt, Mauer, falten, rollen] }
  forms: [text, audio, picture, drawn]
  drawn: [cubes, shape, grid]
  sounds: []
  facets: []
  parts:
    - { id: base, what: { de: "sagen, dass eine breite Grundfläche und weit auseinanderstehende Stützen ein Bauwerk stabil machen", en: "saying that a wide base and supports set far apart make a building stand firm" } }
    - { id: heavy, what: { de: "schwere Teile nach unten, leichte nach oben", en: "heavy parts at the bottom, light ones on top" } }
    - { id: brace, what: { de: "erklären, dass Dreiecke und schräge Streben ein Gerüst fest machen", en: "explaining that triangles and diagonal braces make a frame stiff" } }
    - { id: form, what: { de: "versetzte Steine und gefaltetes oder gerolltes Papier als stabile Bauweisen erkennen", en: "recognising offset bricks and folded or rolled paper as strong ways to build" } }
  misconceptions:
    - id: taller-is-better
      what: Thinks a tower stands better the higher or the narrower it is, and adds blocks on top to fix a wobbly tower
      addressed: "lesson 1 Learn opens with Ida's narrow tower falling and Tom's wide one staying up; l1-f1 (feedback), l1-s2, l1-n1 and l2-c3"
    - id: heavy-on-top
      what: Puts heavy parts at the top because they are the most important or the biggest
      addressed: "lesson 1 Learn says heavy at the bottom, light on top; l1-f3, l1-s3, l1-n2, l1-n3, l2-c6 to l2-c10"
    - id: square-is-strong
      what: Thinks a square frame is as stiff as a triangle because it has more sides
      addressed: "lesson 2 Learn opens with the guess which shape wobbles; l2-f1, l2-s3, l2-n3, l2-c11, l2-c12 and l2-c14"
    - id: paper-is-weak
      what: Thinks paper can never carry anything, whatever its shape
      addressed: "lesson 2 Learn shows folded and rolled paper carrying a book; l2-s1, l2-s2, l2-n4, l2-c16, l2-c18 and l2-c19"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Unten breit, oben schmal", en: "Wide at the bottom, narrow at the top" }
    goal:
      de: "Finde heraus, warum ein Turm stehen bleibt. Ein Turm, der unten breit ist, kippt nicht so leicht um."
      en: "Find out why a tower stays up. A tower that is wide at the bottom does not tip over so easily."
    new_content: true
    activities:
      - activity: learn
        mode: worked-examples
        screens:
          - text: "Welcher Turm bleibt stehen?"
            say: "Ida und Tom bauen für das Schulfest einen Turm aus Holzklötzen. Ida stellt einen Klotz genau auf den anderen. Ihr Turm ist ganz schmal. Tom baut unten breit und oben schmal. Dann wackelt der Tisch. Was glaubst du: Welcher Turm bleibt stehen?"
            show: { drawn: cubes, plan: [[5]], mode: front, colour: blue }
          - text: "Toms Turm ist unten breit. Er bleibt stehen."
            say: "Toms Turm bleibt stehen! Idas schmaler Turm fällt um. Ein Bauwerk steht stabil, wenn es unten breit ist. Die Fläche ganz unten heißt Grundfläche. Je breiter die Grundfläche, desto fester steht der Turm."
            show: { drawn: cubes, plan: [[1, 2, 3, 2, 1]], mode: front, colour: orange }
          - text: "Schwere Teile nach unten, leichte nach oben."
            say: "Tom legt die großen, schweren Klötze nach unten und die kleinen, leichten nach oben. Ist ein Turm oben schwer, kippt er leichter um."
            show: { object: cube }
          - text: "Stützen weit auseinander"
            say: "Auch ein Tisch ist gebaut. Seine vier Beine sind Stützen. Sie stehen weit auseinander, an den Ecken. So kippt der Tisch nicht, auch wenn du dich auf eine Ecke stützt."
            show: { object: table }
          - text: "Wusstest du? An heißen Tagen wird der Eiffelturm ein paar Zentimeter größer."
            say: "Wusstest du? Der Eiffelturm in Paris ist aus Eisen. An heißen Tagen dehnt sich das Eisen aus, und der Turm wird ein paar Zentimeter größer. Er steht trotzdem fest, denn unten ist er sehr breit. Seine vier Füße stehen weit auseinander."
            show: { object: eiffel-tower }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welcher Turm bleibt stehen, wenn der Tisch wackelt?"
                say: "Welcher Turm bleibt stehen, wenn der Tisch wackelt?"
                options:
                  - { drawn: cubes, plan: [[5]], mode: front, colour: green, key: "schmal" }
                  - { drawn: cubes, plan: [[1, 2, 3, 2, 1]], mode: front, colour: green, key: "breit" }
                answer: "breit"
                feedback:
                  "schmal": "Der schmale Turm steht unten nur auf einem Klotz. Er kippt schnell um."
                hints:
                  - "Schau dir an, wie breit jeder Turm ganz unten ist."
                  - "Ein Turm steht auf einem Klotz, der andere auf fünf."
                  - "Der Turm, der unten breit ist, bleibt stehen."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Ein Turm steht fester, wenn er unten breit ist."
                say: "Stimmt das? Ein Turm steht fester, wenn er unten breit ist."
                answer: true
                hints:
                  - "Denk an Idas und Toms Turm."
                  - "Toms Turm war unten breit. Er ist stehen geblieben."
                  - "Ja. Eine breite Grundfläche macht den Turm stabil."
              - id: l1-f3
                type: sorting
                text: "Macht das einen Turm stabil oder wackelig?"
                say: "Sortiere. Was macht einen Turm stabil, was macht ihn wackelig?"
                bins:
                  - { id: stabil, show: { text: "stabil" }, say: "stabil" }
                  - { id: wackelig, show: { text: "wackelig" }, say: "wackelig" }
                options:
                  - { text: "unten breit", bin: stabil }
                  - { text: "schwere Klötze oben", bin: wackelig }
                  - { text: "schwere Klötze unten", bin: stabil }
                  - { text: "unten nur ein Klotz", bin: wackelig }
                hints:
                  - "Wie hat Tom seinen Turm gebaut?"
                  - "Tom baut unten breit und legt die schweren Klötze nach unten."
                  - "Unten breit und schwer unten macht stabil. Schwer oben und unten schmal macht wackelig."
              - id: l1-f4
                type: multiple_choice
                text: "Wohin legt Tom die großen, schweren Klötze?"
                say: "Wohin legt Tom die großen, schweren Klötze?"
                options: ["nach unten", "nach oben", "ganz auf die Spitze"]
                answer: "nach unten"
                feedback:
                  "ganz auf die Spitze": "Ein schwerer Klotz ganz oben? Dann schwankt der Turm wie ein Baum im Sturm. Schwere Klötze gehören nach unten."
                hints:
                  - "Wann kippt ein Turm leichter um?"
                  - "Ist ein Turm oben schwer, kippt er leichter um."
                  - "Die schweren Klötze kommen nach unten."
              - id: l1-f5
                type: fill_in_blank
                text: "Toms Bauregel"
                say: "Setz die passenden Wörter ein."
                frame: "Ein Turm steht stabil, wenn er unten _ ist und die schweren Klötze _ liegen."
                options: ["breit", "unten", "schmal", "oben"]
                answer: ["breit", "unten"]
                hints:
                  - "Lies den Satz bis zum Ende, bevor du ein Wort einsetzt."
                  - "Toms Turm war unten breit, und die schweren Klötze lagen ganz unten."
                  - "Unten breit, die schweren Klötze unten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Warum kippt der Tisch nicht um?"
                say: "Warum kippt der Tisch nicht um?"
                show: { object: table }
                options: ["Seine Beine stehen weit auseinander.", "Er ist braun.", "Er ist schon alt."]
                answer: "Seine Beine stehen weit auseinander."
                feedback:
                  "Er ist braun.": "Ein grüner Tisch steht genauso fest. Es kommt auf die Beine an: Sie stehen weit auseinander."
                hints: ["Schau, wo die Beine des Tisches stehen."]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Je schmaler ein Turm unten ist, desto fester steht er."
                say: "Stimmt das? Je schmaler ein Turm unten ist, desto fester steht er."
                answer: false
                hints: ["Welcher Turm ist beim Wackeln umgefallen, der schmale oder der breite?"]
              - id: l1-s3
                type: ordering
                text: "Tom baut einen Turm aus drei Klötzen. Welcher kommt zuerst nach unten?"
                say: "Tom baut einen Turm aus drei Klötzen. Leg die Karten in die richtige Reihenfolge, von unten nach oben."
                options: ["der kleine, leichte Klotz", "der große, schwere Klotz", "der mittlere Klotz"]
                slot_count: 3
                answer: ["der große, schwere Klotz", "der mittlere Klotz", "der kleine, leichte Klotz"]
                hints: ["Schwer nach unten, leicht nach oben."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Welcher Turm kippt nicht so leicht um?"
                say: "Welcher Turm kippt nicht so leicht um?"
                options:
                  - { drawn: cubes, plan: [[4]], mode: front, colour: purple, key: "schmal" }
                  - { drawn: cubes, plan: [[2, 3, 2]], mode: front, colour: purple, key: "breit" }
                answer: "breit"
                hints: ["Zähl, wie viele Klötze ganz unten nebeneinander liegen."]
              - id: l1-s5
                type: fill_in_blank
                text: "Wie heißt die Fläche ganz unten?"
                say: "Setz das passende Wort ein."
                frame: "Die Fläche ganz unten an einem Turm heißt _."
                options: ["Grundfläche", "Spitze", "Fahne"]
                answer: ["Grundfläche"]
                hints: ["Auf dieser Fläche steht der ganze Turm."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Ida baut ihren Turm noch einmal. Was soll sie anders machen?"
                say: "Ida baut ihren Turm noch einmal. Was soll sie anders machen?"
                options: ["unten mehr Klötze nebeneinander legen", "oben noch einen Klotz draufsetzen", "schneller bauen"]
                answer: "unten mehr Klötze nebeneinander legen"
              - id: l1-n2
                type: true_false
                text: "Tom will den schweren Eimer ganz oben auf den Turm stellen. Ist das eine gute Idee?"
                say: "Tom will den schweren Eimer ganz oben auf den Turm stellen. Ist das eine gute Idee?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Ida räumt ein hohes Regal ein. Was kommt nach unten, was nach oben?"
                say: "Ida räumt ein hohes Regal ein. Was kommt nach unten, was nach oben? Sortiere."
                bins:
                  - { id: unten, show: { text: "unten" }, say: "unten" }
                  - { id: oben, show: { text: "oben" }, say: "oben" }
                options:
                  - { text: "schwere Bücher", bin: unten }
                  - { object: teddy, bin: oben }
                  - { text: "ein voller Wassereimer", bin: unten }
                  - { object: woolly-hat, bin: oben }
              - id: l1-n4
                type: image_multiple_choice
                text: "Für das Schulfest baut die Klasse einen hohen Turm. Welcher steht am sichersten?"
                say: "Für das Schulfest baut die Klasse einen hohen Turm. Welcher steht am sichersten?"
                options:
                  - { drawn: cubes, plan: [[6]], mode: front, colour: red, key: "schmal" }
                  - { drawn: cubes, plan: [[1, 2, 3, 4, 3, 2, 1]], mode: front, colour: red, key: "breit" }
                answer: "breit"
              - id: l1-n5
                type: fill_in_blank
                text: "Ida schreibt eine Bauregel für die Klasse auf."
                say: "Ida schreibt eine Bauregel für die Klasse auf. Setz die passenden Wörter ein."
                frame: "Unten _, oben schmal. Schwere Klötze nach _."
                options: ["breit", "unten", "oben"]
                answer: ["breit", "unten"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welcher Turm steht fester?"
            say: "Welcher Turm steht fester?"
            options:
              - { drawn: cubes, plan: [[1, 3, 3, 1]], mode: front, colour: yellow, key: "breit" }
              - { drawn: cubes, plan: [[4]], mode: front, colour: yellow, key: "schmal" }
            answer: "breit"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Schwere Klötze gehören nach oben."
            say: "Stimmt das? Schwere Klötze gehören nach oben."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was hilft einem Turm, fest zu stehen?"
            say: "Was hilft einem Turm, fest zu stehen?"
            options: ["eine breite Grundfläche", "eine bunte Farbe", "eine Fahne oben drauf"]
            answer: "eine breite Grundfläche"
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Ein Tisch steht fest, weil seine Beine weit auseinanderstehen."
            say: "Stimmt das? Ein Tisch steht fest, weil seine Beine weit auseinanderstehen."
            answer: true
          - id: l1-c5
            type: fill_in_blank
            text: "Wann steht ein Turm stabil?"
            say: "Setz das passende Wort ein."
            frame: "Ein Turm steht stabil, wenn er unten _ ist."
            options: ["breit", "schmal", "spitz"]
            answer: ["breit"]
          - id: l1-c6
            type: multiple_choice
            text: "Wo stehen die Beine eines Tisches, damit er nicht kippt?"
            say: "Wo stehen die Beine eines Tisches, damit er nicht kippt?"
            options: ["weit auseinander an den Ecken", "eng zusammen in der Mitte", "alle auf einer Seite"]
            answer: "weit auseinander an den Ecken"

  - n: 2
    title: { de: "Dreiecke, Mauern und Papier", en: "Triangles, walls and paper" }
    goal:
      de: "Finde heraus, welche Formen ein Bauwerk fest machen. Ein Dreieck wackelt nicht, ein Viereck schon."
      en: "Find out which shapes make a building firm. A triangle does not wobble, but a square does."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welcher Turm steht stabiler?"
            say: "Welcher Turm steht stabiler?"
            options: ["unten breit, oben schmal", "unten schmal, oben breit"]
            answer: "unten breit, oben schmal"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Die schweren Klötze gehören nach unten."
            say: "Stimmt das? Die schweren Klötze gehören nach unten."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Welche Form wackelt?"
            say: "Ida baut aus Stäben und Knete ein Viereck und ein Dreieck. Dann drückt sie oben auf eine Ecke. Was glaubst du: Welche Form wackelt?"
            show: { drawn: shape, row: [square, triangle], colours: blue }
          - text: "Das Viereck wird schief. Das Dreieck bleibt fest."
            say: "Das Viereck kippt zur Seite und wird schief. Das Dreieck bleibt, wie es ist. Ein Dreieck ist eine sehr stabile Form. Darum siehst du an Kränen, Dächern und manchen Brücken so viele Dreiecke."
            show: { drawn: shape, kind: triangle, colour: green }
          - text: "Eine schräge Strebe macht das Viereck fest."
            say: "Ida klebt einen Stab schräg von einer Ecke zur anderen. Jetzt besteht das Viereck aus zwei Dreiecken und wackelt nicht mehr. So ein schräger Stab heißt Strebe. Auch ein Gartentor hat oft eine schräge Latte."
            show: { drawn: grid, cols: 4, rows: 4, dots: true, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 1, 3], [1, 3, 1, 1], [1, 1, 3, 3]] }
          - text: "Steine versetzt legen"
            say: "Tom baut eine Mauer aus Klötzen. Er legt jede Reihe versetzt. So liegt ein Stein immer auf zwei Steinen darunter, und die Steine halten einander fest. Echte Mauern aus Ziegelsteinen baut man genauso."
            show: { object: bricks }
          - text: "Gefaltetes oder gerolltes Papier trägt mehr."
            say: "Ein flaches Blatt Papier knickt sofort ein, wenn du ein Buch darauflegst. Faltest du es wie eine Ziehharmonika oder rollst du es zu einer Röhre, trägt es viel mehr. Die Form macht das Papier stabil."
            show: { object: book }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Welche Form wackelt nicht, wenn man auf eine Ecke drückt?"
                say: "Welche Form wackelt nicht, wenn man auf eine Ecke drückt?"
                options:
                  - { drawn: shape, kind: square, colour: blue }
                  - { drawn: shape, kind: triangle, colour: blue }
                  - { drawn: shape, kind: rectangle, colour: blue }
                answer: triangle
                feedback:
                  square: "Ein Viereck aus Stäben kippt zur Seite und wird schief. Das Dreieck bleibt fest."
                hints:
                  - "Denk an Idas Formen aus Stäben und Knete."
                  - "Vierecke werden schief, wenn man auf eine Ecke drückt."
                  - "Das Dreieck wackelt nicht."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Eine schräge Strebe macht ein Viereck fest."
                say: "Stimmt das? Eine schräge Strebe macht ein Viereck fest."
                show: { drawn: grid, cols: 4, rows: 4, dots: true, lines: [[0, 1, 4, 1], [4, 1, 4, 3], [4, 3, 0, 3], [0, 3, 0, 1], [0, 3, 4, 1]] }
                answer: true
                hints:
                  - "Zähl, welche Formen die Strebe aus dem Viereck macht."
                  - "Mit der Strebe besteht das Viereck aus zwei Dreiecken."
                  - "Ja. Dreiecke wackeln nicht, also wird das Viereck fest."
              - id: l2-f3
                type: sorting
                text: "Macht das ein Bauwerk stabil?"
                say: "Sortiere. Was macht ein Bauwerk stabil, was nicht?"
                bins:
                  - { id: ja, show: { text: "macht stabil" }, say: "macht stabil" }
                  - { id: nein, show: { text: "macht nicht stabil" }, say: "macht nicht stabil" }
                options:
                  - { text: "Dreiecke", bin: ja }
                  - { text: "eine bunte Farbe", bin: nein }
                  - { text: "eine schräge Strebe", bin: ja }
                  - { text: "ein Fähnchen oben drauf", bin: nein }
                hints:
                  - "Frag dich bei jeder Karte: Wackelt dann weniger?"
                  - "Farbe und Fähnchen sehen schön aus, aber sie halten nichts fest."
                  - "Dreiecke und Streben machen stabil, Farbe und Fähnchen nicht."
              - id: l2-f4
                type: multiple_choice
                text: "Warum legt Tom die Steine in seiner Mauer versetzt?"
                say: "Warum legt Tom die Steine in seiner Mauer versetzt?"
                options: ["Dann liegt jeder Stein auf zwei Steinen und die Mauer hält besser.", "Dann sieht die Mauer lustiger aus.", "Dann braucht er weniger Steine."]
                answer: "Dann liegt jeder Stein auf zwei Steinen und die Mauer hält besser."
                hints:
                  - "Überleg, worauf ein Stein in der nächsten Reihe liegt."
                  - "Liegt ein Stein auf zwei Steinen, hält er beide zusammen."
                  - "Versetzte Steine halten einander fest."
              - id: l2-f5
                type: fill_in_blank
                text: "Wie heißt der schräge Stab?"
                say: "Setz das passende Wort ein."
                frame: "Ein schräger Stab, der ein Viereck fest macht, heißt _."
                options: ["Strebe", "Fahne", "Kante"]
                answer: ["Strebe"]
                hints:
                  - "Ida hat ihn von einer Ecke zur anderen geklebt."
                  - "Das Wort fängt mit Str an."
                  - "Er heißt Strebe."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was trägt ein Buch am besten?"
                say: "Was trägt ein Buch am besten?"
                options: ["ein Blatt Papier, zu einer Röhre gerollt", "ein flaches Blatt Papier", "ein nasses Blatt Papier"]
                answer: "ein Blatt Papier, zu einer Röhre gerollt"
                hints: ["Nicht das Papier macht den Unterschied, sondern seine Form."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Ein flaches Blatt Papier trägt ein schweres Buch."
                say: "Stimmt das? Ein flaches Blatt Papier trägt ein schweres Buch."
                answer: false
                hints: ["Was passiert mit einem flachen Blatt, wenn du ein Buch darauflegst?"]
              - id: l2-s3
                type: image_multiple_choice
                text: "Welches Viereck aus Stäben wackelt nicht?"
                say: "Welches Viereck aus Stäben wackelt nicht?"
                options:
                  - { drawn: grid, cols: 4, rows: 4, dots: true, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 1, 3], [1, 3, 1, 1]], key: "ohne" }
                  - { drawn: grid, cols: 4, rows: 4, dots: true, lines: [[1, 1, 3, 1], [3, 1, 3, 3], [3, 3, 1, 3], [1, 3, 1, 1], [1, 3, 3, 1]], key: "mit" }
                answer: "mit"
                hints: ["Such das Viereck, das aus zwei Dreiecken besteht."]
              - id: l2-s4
                type: ordering
                text: "Ida macht ein Viereck fest. Was macht sie zuerst?"
                say: "Ida macht ein Viereck fest. Leg die Karten in die richtige Reihenfolge."
                options: ["Sie klebt einen Stab schräg von Ecke zu Ecke.", "Sie drückt auf eine Ecke. Nichts wackelt.", "Sie baut aus vier Stäben ein Viereck."]
                slot_count: 3
                answer: ["Sie baut aus vier Stäben ein Viereck.", "Sie klebt einen Stab schräg von Ecke zu Ecke.", "Sie drückt auf eine Ecke. Nichts wackelt."]
                hints: ["Bevor Ida eine Strebe kleben kann, braucht sie ein Viereck."]
              - id: l2-s5
                type: fill_in_blank
                text: "Was wird aus dem Viereck?"
                say: "Setz das passende Wort ein."
                frame: "Mit der Strebe besteht das Viereck aus zwei _."
