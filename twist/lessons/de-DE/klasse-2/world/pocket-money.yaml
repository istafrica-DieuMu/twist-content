# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.pocket-money
skill: world.society.pocket-money
curriculum: de-DE
language: de
title:
  de: Mein Taschengeld
  en: My pocket money
summary: >
  Lina is seven and gets 2 € pocket money every Saturday. Lesson 1 says
  what pocket money is (money you get regularly and decide about
  yourself), that spent money is gone, how to check whether the money is
  enough for a price, and how saving week by week makes it grow (2 €,
  4 €, 6 €). Lesson 2 is about deciding: ask "Do I need it, or do I only
  want it? Will I still want it tomorrow?", split the money into a part to
  spend and a part to save, compare prices of two equal things, and
  accept that children get different amounts or none. Amounts stay in
  whole euros up to 10 €. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Wünschen und Kaufen, en: Wanting and buying }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.society.needs-wants, math.money.coins-notes]
  also_practises: []
  vocabulary: { de: [Taschengeld, ausgeben, sparen, Preis, übrig, einteilen, Portemonnaie] }
  forms: [text, audio, picture, drawn]
  drawn: [coins]
  facets: []
  parts:
    - { id: own-money, what: { de: "wissen, was Taschengeld ist und wer darüber entscheidet", en: knowing what pocket money is and who decides about it } }
    - { id: enough, what: { de: "prüfen, ob das Geld für einen Preis reicht", en: checking whether the money is enough for a price } }
    - { id: save, what: { de: "für etwas Größeres sparen", en: saving up for something bigger } }
    - { id: choose, what: { de: "überlegt entscheiden, wofür ich mein Geld ausgebe", en: deciding with thought what to spend the money on } }
  misconceptions:
    - id: money-comes-back
      what: Thinks money once spent is still there or comes back by itself
      addressed: lesson 1 Learn shows Lina's empty purse after buying stickers; l1-s1 and l1-n2; l2-c3 and l2-c5 in the skill check
    - id: buy-at-once
      what: Buys the first thing that catches the eye without asking whether it is still wanted tomorrow
      addressed: lesson 2 Learn opens with the glitter pens and the two questions; l2-f1, l2-n3; l2-c16 in the skill check
    - id: dearer-is-better
      what: Thinks the dearer of two equal things is the better choice
      addressed: lesson 2 Learn compares the balls for 6 € and 4 €; l2-f4 and l2-s3; l2-c17 in the skill check
    - id: everyone-same
      what: Thinks every child gets the same pocket money
      addressed: lesson 2 Learn says children get different amounts, some none; l2-s2
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Mein eigenes Geld", en: "My own money" }
    goal:
      de: "Finde heraus, was Taschengeld ist und ob dein Geld reicht, so wie zwei Euro für Sticker."
      en: "Find out what pocket money is and whether your money is enough, like two euros for stickers."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viel Geld ist das?"
            say: "Wie viel Geld ist das?"
            show: { drawn: coins, values: [200, 100] }
            options: ["3 €", "2 €", "4 €"]
            answer: "3 €"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Was brauchst du wirklich zum Leben?"
            say: "Was brauchst du wirklich zum Leben?"
            options: [{ object: water }, { object: yo-yo }, { object: sticker }]
            answer: water
            feedback:
              yo-yo: "Ein Jo-Jo macht Spaß, aber zum Leben brauchst du es nicht. Wasser brauchst du jeden Tag."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was würdest du mit 2 € machen?"
            say: "Lina ist sieben. Jeden Samstag bekommt sie von ihren Eltern zwei Euro. Das ist ihr Taschengeld. Was glaubst du: Was soll Lina mit dem Geld machen?"
            show: { drawn: coins, values: [200] }
          - text: "Taschengeld ist dein eigenes Geld. Du entscheidest, was du damit machst."
            say: "Taschengeld ist Geld, das du regelmäßig bekommst, zum Beispiel jede Woche. Es gehört dir, und du entscheidest selbst, wofür du es ausgibst. Lina kann es ausgeben oder sparen."
            show: { object: purse }
          - text: "Was ausgegeben ist, ist weg."
            say: "Lina kauft für zwei Euro Sticker. Jetzt ist ihr Portemonnaie leer. Was ausgegeben ist, ist weg. Bis zum nächsten Samstag hat sie kein Taschengeld mehr."
            show: { objects: [sticker, purse] }
          - text: "Reicht mein Geld? Ein Jo-Jo kostet 3 €. Lina hat 2 €."
            say: "Bevor Lina etwas kauft, schaut sie: Wie viel Geld habe ich? Wie viel kostet es? Ein Jo-Jo kostet drei Euro. Lina hat zwei Euro. Drei Euro sind mehr als zwei Euro. Das Geld reicht nicht, es fehlt ein Euro."
            show: { object: yo-yo }
          - text: "Sparen: 1 Woche 2 €, 2 Wochen 4 €, 3 Wochen 6 €"
            say: "Wenn Lina spart, wird ihr Geld jede Woche mehr. Nach einer Woche hat sie zwei Euro, nach zwei Wochen vier Euro, nach drei Wochen sechs Euro. Dann kann sie sich auch etwas Größeres kaufen, zum Beispiel einen Ball für sechs Euro."
            show: { objects: [piggy-bank, ball] }
          - text: "Wusstest du? Jede Euro-Münze hat eine Seite mit einem Bild aus dem Land, in dem sie gemacht wurde."
            say: "Wusstest du? Jede Euro-Münze hat zwei Seiten. Eine Seite sieht in allen Euro-Ländern gleich aus. Auf der anderen ist ein Bild aus dem Land, in dem die Münze gemacht wurde. Bezahlen kannst du mit jeder Euro-Münze in allen Euro-Ländern. Schau mal, ob in deinem Portemonnaie eine Münze aus einem anderen Land ist!"
            show: { drawn: coins, values: [100, 200] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was ist Taschengeld?"
                say: "Was ist Taschengeld?"
                show: { object: purse }
                options: ["Geld, das du regelmäßig bekommst und selbst einteilst", "Geld, das nur deine Eltern ausgeben dürfen", "Geld, das in deiner Schultasche wächst"]
                answer: "Geld, das du regelmäßig bekommst und selbst einteilst"
                feedback:
                  "Geld, das in deiner Schultasche wächst": "Schön wär's! Aber Geld wächst nirgends. Taschengeld bekommst du regelmäßig, zum Beispiel jede Woche."
                hints:
                  - "Denk an Lina: Sie bekommt jeden Samstag Geld."
                  - "Das Geld gehört Lina. Wer entscheidet also, was sie damit macht?"
                  - "Taschengeld bekommst du regelmäßig, und du teilst es selbst ein."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Lina hat 2 €. Ein Jo-Jo kostet 3 €. Stimmt das? Ihr Geld reicht."
                say: "Lina hat zwei Euro. Ein Jo-Jo kostet drei Euro. Stimmt das? Ihr Geld reicht."
                show: { object: yo-yo }
                answer: false
                hints:
                  - "Vergleiche: Wie viel Geld hat Lina, wie viel kostet das Jo-Jo?"
                  - "3 € sind mehr als 2 €."
                  - "Nein. Das Jo-Jo kostet mehr, als Lina hat. Es fehlt 1 €."
              - id: l1-f3
                type: multiple_choice
                text: "Lina hat 4 €. Was kann sie sich davon kaufen?"
                say: "Lina hat vier Euro. Was kann sie sich davon kaufen?"
                options: ["ein Jo-Jo für 3 €", "einen Ball für 6 €", "ein Buch für 8 €"]
                answer: "ein Jo-Jo für 3 €"
                hints:
                  - "Schau bei jedem Ding auf den Preis."
                  - "Der Preis darf nicht größer sein als 4 €."
                  - "Nur das Jo-Jo kostet weniger als 4 €."
              - id: l1-f4
                type: sorting
                text: "Lina hat 5 €. Reicht das Geld?"
                say: "Lina hat fünf Euro. Sortiere: Wofür reicht das Geld, wofür nicht?"
                bins:
                  - { id: reicht, show: { text: "reicht" }, say: "reicht" }
                  - { id: nicht, show: { text: "reicht nicht" }, say: "reicht nicht" }
                options:
                  - { text: "Sticker für 2 €", bin: reicht }
                  - { text: "Ball für 6 €", bin: nicht }
                  - { text: "Jo-Jo für 3 €", bin: reicht }
                  - { text: "Buch für 8 €", bin: nicht }
                hints:
                  - "Vergleiche jeden Preis mit 5 €."
                  - "Ist der Preis kleiner als 5 € oder genau 5 €, reicht das Geld."
                  - "Sticker und Jo-Jo reichen. Ball und Buch kosten mehr als 5 €."
              - id: l1-f5
                type: fill_in_blank
                text: "Lina spart jede Woche 2 €."
                say: "Lina spart jede Woche zwei Euro. Setz die passenden Zahlen ein."
                show: { object: piggy-bank }
                frame: "Nach 2 Wochen hat sie _ €. Nach 3 Wochen hat sie _ €."
                options: ["4", "6", "5"]
                answer: ["4", "6"]
                hints:
                  - "Jede Woche kommen 2 € dazu."
                  - "Zähl in Zweierschritten: 2, 4, ..."
                  - "Nach 2 Wochen 4 €, nach 3 Wochen 6 €."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Geld, das ich ausgegeben habe, kann ich noch einmal ausgeben."
                say: "Stimmt das? Geld, das ich ausgegeben habe, kann ich noch einmal ausgeben."
                answer: false
                hints: ["Wie sah Linas Portemonnaie aus, nachdem sie die Sticker gekauft hatte?"]
              - id: l1-s2
                type: multiple_choice
                text: "Lina hat dieses Geld. Reicht es für einen Ball für 6 €?"
                say: "Lina hat dieses Geld. Reicht es für einen Ball für sechs Euro?"
                show: { drawn: coins, values: [200, 200, 100] }
                options: ["Nein, es fehlt 1 €.", "Ja, genau.", "Ja, und 2 € bleiben übrig."]
                answer: "Nein, es fehlt 1 €."
                hints: ["Zähl zuerst das Geld zusammen: 2 € und 2 € und 1 €."]
              - id: l1-s3
                type: ordering
                text: "Lina spart für einen Ball. Was kommt zuerst?"
                say: "Lina spart für einen Ball. Leg die Karten in die richtige Reihenfolge."
                options: ["Sie kauft den Ball.", "Sie legt jede Woche 2 € zur Seite.", "Sie sieht einen Ball für 6 €.", "Nach 3 Wochen hat sie 6 €."]
                slot_count: 4
                answer: ["Sie sieht einen Ball für 6 €.", "Sie legt jede Woche 2 € zur Seite.", "Nach 3 Wochen hat sie 6 €.", "Sie kauft den Ball."]
                hints: ["Zuerst sieht Lina, was sie sich wünscht. Kaufen kommt ganz zum Schluss."]
              - id: l1-s4
                type: image_multiple_choice
                text: "Worin trägt Lina ihr Taschengeld zum Laden?"
                say: "Worin trägt Lina ihr Taschengeld zum Laden?"
                options: [{ object: purse }, { object: bin }, { object: sock }]
                answer: purse
                feedback:
                  bin: "In der Mülltonne? Da wäre das Geld schnell weg! Lina nimmt ihr Portemonnaie."
                hints: ["Worin bewahren Erwachsene ihr Geld auf?"]
              - id: l1-s5
                type: multiple_choice
                text: "Wer entscheidet, wofür Lina ihr Taschengeld ausgibt?"
                say: "Wer entscheidet, wofür Lina ihr Taschengeld ausgibt?"
                options: ["Lina selbst", "der Verkäufer im Laden", "ihre Freundin"]
                answer: "Lina selbst"
                hints: ["Wem gehört das Taschengeld?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lina hat 4 €. Im Schreibwarenladen will sie Sticker für 2 € und einen Stift für 2 €. Reicht das Geld?"
                say: "Lina hat vier Euro. Im Schreibwarenladen will sie Sticker für zwei Euro und einen Stift für zwei Euro. Reicht das Geld?"
                options: ["Ja, genau.", "Nein, es fehlt 1 €.", "Nein, es fehlen 2 €."]
                answer: "Ja, genau."
              - id: l1-n2
                type: true_false
                text: "Lina hat am Samstag alle 2 € für Sticker ausgegeben. Am Sonntag sagt sie: „Ich kaufe mir noch ein Eis von meinem Taschengeld.“ Geht das?"
                say: "Lina hat am Samstag alle zwei Euro für Sticker ausgegeben. Am Sonntag sagt sie: Ich kaufe mir noch ein Eis von meinem Taschengeld. Geht das?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Ben bekommt 3 € Taschengeld. Was kann er sofort kaufen, wofür muss er sparen?"
                say: "Ben bekommt drei Euro Taschengeld. Was kann er sofort kaufen, wofür muss er sparen? Sortiere."
                bins:
                  - { id: sofort, show: { text: "sofort kaufen" }, say: "sofort kaufen" }
                  - { id: sparen, show: { text: "erst sparen" }, say: "erst sparen" }
                options:
                  - { text: "Kreide für 2 €", bin: sofort }
                  - { text: "Ball für 6 €", bin: sparen }
                  - { text: "Jo-Jo für 3 €", bin: sofort }
                  - { text: "Buch für 9 €", bin: sparen }
              - id: l1-n4
                type: fill_in_blank
                text: "Lina wünscht sich ein Buch für 8 €. Sie spart jede Woche 2 €."
                say: "Lina wünscht sich ein Buch für acht Euro. Sie spart jede Woche zwei Euro. Wie viele Wochen muss sie sparen?"
                show: { object: piggy-bank }
                frame: "Sie muss _ Wochen sparen."
                options: ["4", "3", "8"]
                answer: ["4"]
              - id: l1-n5
                type: multiple_choice
                text: "Paul hat 2 € und wünscht sich ein Spiel für 10 €. Was ist eine gute Idee?"
                say: "Paul hat zwei Euro und wünscht sich ein Spiel für zehn Euro. Was ist eine gute Idee?"
                options: ["Er spart ein paar Wochen.", "Er nimmt das Spiel einfach mit.", "Er weint im Laden, bis er es bekommt."]
                answer: "Er spart ein paar Wochen."

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lina hat 3 €. Was kann sie kaufen?"
            say: "Lina hat drei Euro. Was kann sie kaufen?"
            options: ["einen Stift für 2 €", "einen Ball für 6 €", "ein Buch für 8 €"]
            answer: "einen Stift für 2 €"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Mein Taschengeld darf ich selbst einteilen."
            say: "Stimmt das? Mein Taschengeld darf ich selbst einteilen."
            answer: true
          - id: l1-c3
            type: fill_in_blank
            text: "Tom spart jede Woche 1 €."
            say: "Tom spart jede Woche einen Euro. Setz die passende Zahl ein."
            show: { object: piggy-bank }
            frame: "Nach 4 Wochen hat er _ €."
            options: ["4", "5", "1"]
            answer: ["4"]
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Mit 2 € kann ich etwas kaufen, das 5 € kostet."
            say: "Stimmt das? Mit zwei Euro kann ich etwas kaufen, das fünf Euro kostet."
            answer: false
          - id: l1-c5
            type: multiple_choice
            text: "Was heißt sparen?"
            say: "Was heißt sparen?"
            options: ["Geld zur Seite legen, um später etwas zu kaufen", "alles Geld sofort ausgeben", "Geld verlieren"]
            answer: "Geld zur Seite legen, um später etwas zu kaufen"
          - id: l1-c6
            type: multiple_choice
            text: "Reicht dieses Geld für Kreide für 4 €?"
            say: "Reicht dieses Geld für Kreide für vier Euro?"
            show: { drawn: coins, values: [200, 100] }
            options: ["Nein, es fehlt 1 €.", "Ja, genau.", "Ja, und 1 € bleibt übrig."]
            answer: "Nein, es fehlt 1 €."

  - n: 2
    title: { de: "Gut überlegt einkaufen", en: "Thinking before buying" }
    goal:
      de: "Überlege, wofür du dein Geld ausgibst und was du sparst, so wie Lina mit ihrem Ball."
      en: "Think about what you spend your money on and what you save, like Lina with her ball."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Wenn Lina jede Woche 2 € spart, hat sie nach 2 Wochen 4 €."
            say: "Stimmt das? Wenn Lina jede Woche zwei Euro spart, hat sie nach zwei Wochen vier Euro."
            show: { object: piggy-bank }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ben hat 3 €. Was kann er sich sofort kaufen?"
            say: "Ben hat drei Euro. Was kann er sich sofort kaufen?"
            options: ["ein Heft für 1 €", "einen Ball für 6 €", "ein Buch für 9 €"]
            answer: "ein Heft für 1 €"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Ball oder Glitzerstifte? Was würdest du kaufen?"
            say: "Lina hat sechs Euro gespart, genug für den Ball. Im Laden sieht sie bunte Glitzerstifte, auch für sechs Euro. Was glaubst du: Was soll sie kaufen?"
            show: { object: ball }
          - text: "Erst überlegen, dann kaufen: Brauche ich das? Will ich es morgen auch noch?"
            say: "Lina stellt sich zwei Fragen. Brauche ich das, oder wünsche ich es mir nur? Und: Will ich es morgen auch noch haben? Den Ball wünscht sie sich schon lange. Die Stifte hat sie gerade erst gesehen. Sie kauft den Ball."
            show: { objects: [ball, crayon] }
          - text: "Einen Teil ausgeben, einen Teil sparen."
            say: "Lina teilt ihr Taschengeld jetzt ein. Von ihren zwei Euro gibt sie einen Euro aus und spart einen Euro. So kann sie sich jede Woche eine Kleinigkeit kaufen und spart trotzdem für etwas Großes."
            show: { drawn: coins, values: [100, 100] }
          - text: "Preise vergleichen: Ball für 6 € oder Ball für 4 €?"
            say: "Im Laden gibt es zwei Bälle. Der eine kostet sechs Euro, der andere vier Euro. Beide gefallen Lina gleich gut. Nimmt sie den Ball für vier Euro, bleiben ihr zwei Euro übrig."
            show: { object: ball }
          - text: "Jedes Kind überlegt mit dem Geld, das es hat."
            say: "Wie viel ich kaufen kann, hängt davon ab, wie viel Geld ich habe. Kinder bekommen unterschiedlich viel Taschengeld, und manche bekommen keins. Das ist in Ordnung. Jeder überlegt mit dem Geld, das er hat."
            show: { object: purse }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lina sieht einen Glitzerstift und will ihn sofort. Was fragt sie sich zuerst?"
                say: "Lina sieht einen Glitzerstift und will ihn sofort. Was fragt sie sich zuerst?"
                options: ["Will ich das morgen auch noch haben?", "Welche Farbe hat die Kasse?", "Wie heißt die Verkäuferin?"]
                answer: "Will ich das morgen auch noch haben?"
                feedback:
                  "Welche Farbe hat die Kasse?": "Die Farbe der Kasse hilft Lina nicht beim Entscheiden. Sie fragt sich: Will ich das morgen auch noch haben?"
                hints:
                  - "Lina will gut überlegt einkaufen."
                  - "Die Frage soll ihr helfen zu entscheiden, ob sie den Stift wirklich will."
                  - "Sie fragt: Will ich das morgen auch noch haben?"
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Brauche ich das, oder wünsche ich es mir nur?"
                say: "Sortiere. Was brauchst du, was wünschst du dir nur?"
                bins:
                  - { id: brauche, show: { text: "brauche ich" }, say: "brauche ich" }
                  - { id: wunsch, show: { text: "wünsche ich mir" }, say: "wünsche ich mir" }
                options:
                  - { object: water, bin: brauche }
                  - { object: yo-yo, bin: wunsch }
                  - { object: bread, bin: brauche }
                  - { object: sticker, bin: wunsch }
                hints:
                  - "Was brauchst du jeden Tag zum Leben?"
                  - "Essen und Trinken brauchst du. Spielsachen machen Spaß."
                  - "Wasser und Brot brauchst du. Jo-Jo und Sticker wünschst du dir."
              - id: l2-f3
                type: fill_in_blank
                text: "Lina hat 2 €. Sie gibt 1 € aus."
                say: "Lina hat zwei Euro. Sie gibt einen Euro aus. Wie viel kann sie noch sparen?"
                frame: "Sie kann noch _ € sparen."
                options: ["1", "2", "3"]
                answer: ["1"]
                hints:
                  - "Von 2 € geht 1 € weg."
                  - "2 € minus 1 € sind ..."
                  - "Es bleibt 1 € zum Sparen."
              - id: l2-f4
                type: true_false
                text: "Ein Ball kostet 6 €, ein gleich guter Ball 4 €. Stimmt das? Beim Ball für 4 € bleibt mehr Geld übrig."
                say: "Ein Ball kostet sechs Euro, ein gleich guter Ball vier Euro. Stimmt das? Beim Ball für vier Euro bleibt mehr Geld übrig."
                show: { object: ball }
                answer: true
                hints:
                  - "Beide Bälle sind gleich gut. Nur der Preis ist anders."
                  - "Wer weniger bezahlt, hat mehr übrig."
                  - "Ja. Der Ball für 4 € ist billiger, also bleibt mehr Geld übrig."
              - id: l2-f5
                type: multiple_choice
                text: "Ben hat 5 €. Er kauft ein Heft für 2 €. Wie viel Geld hat er noch?"
                say: "Ben hat fünf Euro. Er kauft ein Heft für zwei Euro. Wie viel Geld hat er noch?"
                options: ["3 €", "7 €", "2 €"]
                answer: "3 €"
                feedback:
                  "7 €": "Wenn Ben etwas kauft, wird sein Geld weniger, nicht mehr. 5 € minus 2 € sind 3 €."
                hints:
                  - "Wenn man etwas kauft, wird das Geld weniger."
                  - "Rechne 5 € minus 2 €."
                  - "Ben hat noch 3 €."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit dem, was es bedeutet."
                pairs:
                  - { left: { text: "sparen" }, right: { text: "Geld zur Seite legen" } }
                  - { left: { text: "ausgeben" }, right: { text: "etwas kaufen" } }
                  - { left: { text: "Preise vergleichen" }, right: { text: "schauen, was billiger ist" } }
                hints: ["Fang mit sparen an: Was macht Lina mit dem Geld, das sie spart?"]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Alle Kinder bekommen gleich viel Taschengeld."
                say: "Stimmt das? Alle Kinder bekommen gleich viel Taschengeld."
                answer: false
                hints: ["Manche Kinder bekommen mehr, manche weniger, manche keins."]
              - id: l2-s3
                type: multiple_choice
                text: "Mia braucht ein Heft. Es gibt zwei gleiche Hefte, eins für 1 € und eins für 3 €. Welches ist die bessere Wahl?"
                say: "Mia braucht ein Heft. Es gibt zwei gleiche Hefte, eins für einen Euro und eins für drei Euro. Welches ist die bessere Wahl?"
                options: ["das Heft für 1 €", "das Heft für 3 €", "gar kein Heft"]
                answer: "das Heft für 1 €"
                hints: ["Die Hefte sind gleich. Bei welchem bleibt mehr Geld übrig?"]
              - id: l2-s4
                type: ordering
                text: "Gut überlegt einkaufen. Was kommt zuerst?"
                say: "Gut überlegt einkaufen. Leg die Karten in die richtige Reihenfolge."
                options: ["Ich bezahle an der Kasse.", "Ich sehe etwas, das mir gefällt.", "Ich schaue auf den Preis und zähle mein Geld."]
                slot_count: 3
