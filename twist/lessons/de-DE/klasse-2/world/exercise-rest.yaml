# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.exercise-rest
skill: world.body.exercise-rest
curriculum: de-DE
language: de
title:
  de: Bewegen, ausruhen, schlafen
  en: Moving, resting, sleeping
summary: >
  Paul trains for the school sports day. Lesson 1: when you run, the heart
  beats faster and you breathe faster, because the muscles need more
  power; exercise makes heart, muscles and bones strong and lifts the
  mood; children should move for at least an hour every day; after
  running the body needs a short rest and a drink, after sitting a long
  time it needs to move. Lesson 2: after the sports day Paul is tired.
  In sleep body and head recover; children of his age need about ten
  hours a night, more than adults; before bed, calm things help and
  screens keep you awake; a good day has moving, breaks and enough
  sleep. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Gesund leben, en: Healthy living }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.body.healthy-eating]
  also_practises: []
  vocabulary: { de: [Bewegung, Herz, Muskeln, Pause, sich erholen, Schlaf, aus der Puste] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: move, what: { de: "erklären, warum Bewegung dem Körper guttut", en: explaining why exercise is good for the body } }
    - { id: breaks, what: { de: "wissen, wann der Körper eine Pause oder Bewegung braucht", en: knowing when the body needs a rest or needs to move } }
    - { id: sleep, what: { de: "erklären, warum genug Schlaf wichtig ist und was beim Einschlafen hilft", en: explaining why enough sleep matters and what helps to fall asleep } }
  misconceptions:
    - id: fast-heart-bad
      what: Thinks a fast heartbeat or quick breathing while running means something is wrong
      addressed: lesson 1 Learn opens with the guess and explains that the muscles need more power; l1-f1 with feedback, l1-s2, l1-c2; l2-c3 and l2-c6 in the skill check
    - id: no-rest-needed
      what: Thinks more exercise is always better and rest is wasted time
      addressed: lesson 1 Learn on breaks; l1-s4, l1-n1; l2-c9 and l2-c12 in the skill check
    - id: children-sleep-less
      what: Thinks children need less sleep than adults
      addressed: lesson 2 Learn says about ten hours, more than adults; l2-f3 and l2-f5; l2-c17 in the skill check
    - id: screens-help-sleep
      what: Thinks watching videos or playing on a phone helps to fall asleep
      addressed: lesson 2 Learn on calming down before bed; l2-f2, l2-f4, l2-n1; l2-c15 and l2-c19 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Bewegung und Pausen", en: "Exercise and breaks" }
    goal:
      de: "Finde heraus, warum Bewegung dir guttut und wann du eine Pause brauchst, so wie nach dem Rennen."
      en: "Find out why moving is good for you and when you need a break, like after running."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Was löscht den Durst nach dem Sport am besten?"
            say: "Was löscht den Durst nach dem Sport am besten?"
            options: [{ object: water }, { object: juice }, { object: ice-cream }]
            answer: water
            feedback:
              juice: "Saft hat viel Zucker. Den Durst löscht Wasser am besten."
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Von Gemüse und Obst darfst du viel essen."
            say: "Stimmt das? Von Gemüse und Obst darfst du viel essen."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Schlägt dein Herz beim Rennen schneller oder langsamer?"
            say: "Paul übt für das Sportfest. Er rennt einmal ganz schnell um den Schulhof. Was glaubst du: Schlägt sein Herz beim Rennen schneller oder langsamer als vorher?"
            show: { object: heart }
          - text: "Beim Rennen schlagen das Herz und die Atmung schneller."
            say: "Schneller! Beim Rennen brauchen die Muskeln mehr Kraft. Darum pumpt das Herz schneller, und du atmest schneller. Das ist ganz normal, und es trainiert Herz und Muskeln."
            show: { object: heart }
          - text: "Bewegung macht Herz, Muskeln und Knochen stark und gute Laune."
            say: "Wer sich viel bewegt, bekommt ein starkes Herz, kräftige Muskeln und feste Knochen. Und nach dem Toben fühlen sich viele Kinder richtig froh."
            show: { objects: [jump, happy] }
          - text: "Jeden Tag mindestens 1 Stunde bewegen."
            say: "Kinder sollen sich jeden Tag mindestens eine Stunde bewegen. Das geht beim Fußball, Radfahren, Schwimmen, Tanzen oder Toben auf dem Spielplatz."
            show: { objects: [play-football, swim] }
          - text: "Pausen gehören dazu: nach dem Rennen ausruhen, nach dem Sitzen bewegen."
            say: "Nach dem Rennen ist Paul aus der Puste. Jetzt braucht sein Körper eine kurze Pause: ausruhen und etwas trinken. Wer lange gesessen hat, braucht das Gegenteil: aufstehen, strecken, bewegen."
            show: { objects: [sit-down, stand-up] }
          - text: "Wusstest du? Dein Herz ist ein Muskel, ungefähr so groß wie deine Faust."
            say: "Wusstest du? Dein Herz ist ein Muskel, ungefähr so groß wie deine Faust. Mach mal eine Faust und schau sie dir an. So groß ist dein Herz, und es wächst mit dir mit."
            show: { object: hand }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Was macht dein Herz, wenn du schnell rennst?"
                say: "Was macht dein Herz, wenn du schnell rennst?"
                options: ["Es schlägt schneller.", "Es bleibt stehen.", "Es schläft ein."]
                answer: "Es schlägt schneller."
                feedback:
                  "Es bleibt stehen.": "Keine Sorge, das Herz bleibt beim Rennen nicht stehen. Es schlägt schneller, weil die Muskeln mehr Kraft brauchen."
                hints:
                  - "Denk an Paul auf dem Schulhof."
                  - "Die Muskeln brauchen beim Rennen mehr Kraft. Das Herz muss mehr pumpen."
                  - "Das Herz schlägt schneller."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Bewegung oder Ausruhen?"
                say: "Sortiere. Wobei bewegst du dich, wobei ruhst du dich aus?"
                bins:
                  - { id: bewegen, show: { text: "Bewegung" }, say: "Bewegung" }
                  - { id: ruhen, show: { text: "Ausruhen" }, say: "Ausruhen" }
                options:
                  - { object: play-football, bin: bewegen }
                  - { object: read, bin: ruhen }
                  - { object: ride-bike, bin: bewegen }
                  - { object: sofa, bin: ruhen }
                hints:
                  - "Bei welchem Bild rennt oder fährt jemand?"
                  - "Beim Lesen und auf dem Sofa sitzt man still."
                  - "Fußball und Radfahren sind Bewegung. Lesen und Sofa sind Ausruhen."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Kinder sollen sich jeden Tag mindestens eine Stunde bewegen."
                say: "Stimmt das? Kinder sollen sich jeden Tag mindestens eine Stunde bewegen."
                answer: true
                hints:
                  - "Wie lange dauern etwa zwei Schulstunden ohne Pause?"
                  - "Fußball, Radfahren und Toben zählen alle dazu."
                  - "Ja. Mindestens eine Stunde am Tag."
              - id: l1-f4
                type: image_multiple_choice
                text: "Was macht deine Muskeln stark?"
                say: "Was macht deine Muskeln stark?"
                options: [{ object: swim }, { object: sofa }, { object: mobile-phone }]
                answer: swim
                feedback:
                  sofa: "Auf dem Sofa ruhen sich die Muskeln aus. Stark werden sie, wenn du dich bewegst, zum Beispiel beim Schwimmen."
                hints:
                  - "Muskeln werden stark, wenn sie arbeiten."
                  - "Bei welchem Bild bewegt sich der ganze Körper?"
                  - "Schwimmen macht die Muskeln stark."
              - id: l1-f5
                type: multiple_choice
                text: "Paul hat lange am Tisch gesessen und Hausaufgaben gemacht. Was tut ihm jetzt gut?"
                say: "Paul hat lange am Tisch gesessen und Hausaufgaben gemacht. Was tut ihm jetzt gut?"
                options: ["aufstehen und sich bewegen", "noch länger sitzen", "sich gleich vor den Fernseher setzen"]
                answer: "aufstehen und sich bewegen"
                hints:
                  - "Nach langem Sitzen braucht der Körper das Gegenteil."
                  - "Das Gegenteil von Sitzen ist ..."
                  - "Aufstehen und sich bewegen."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Bewegung ist nur für Sportler wichtig."
                say: "Stimmt das? Bewegung ist nur für Sportler wichtig."
                answer: false
                hints: ["Herz, Muskeln und Knochen hat jeder Mensch."]
              - id: l1-s2
                type: fill_in_blank
                text: "Beim Rennen"
                say: "Setz die passenden Wörter ein."
                frame: "Beim Rennen schlägt mein Herz _, und ich atme _."
                options: ["schneller", "langsamer"]
                answer: ["schneller", "schneller"]
                hints: ["Die Muskeln brauchen mehr Kraft, also muss alles schneller gehen."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Paul ist aus der Puste. Was braucht er jetzt?"
                say: "Paul ist aus der Puste. Was braucht er jetzt?"
                options: [{ object: water }, { object: cake }, { object: mobile-phone }]
                answer: water
                hints: ["Nach dem Rennen ruht man sich kurz aus und trinkt etwas."]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Lage mit dem, was dem Körper dann guttut."
                pairs:
                  - { left: { text: "aus der Puste" }, right: { text: "kurz ausruhen" } }
                  - { left: { text: "lange gesessen" }, right: { text: "aufstehen und strecken" } }
                  - { left: { text: "großer Durst" }, right: { text: "Wasser trinken" } }
                hints: ["Fang mit aus der Puste an: Was macht Paul nach dem Rennen?"]
              - id: l1-s5
                type: multiple_choice
                text: "Was ist auch Bewegung?"
                say: "Was ist auch Bewegung?"
                options: ["die Treppe nehmen statt den Aufzug", "im Auto sitzen", "auf dem Sofa liegen"]
                answer: "die Treppe nehmen statt den Aufzug"
                hints: ["Bei welcher Sache arbeiten deine Beine?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Beim Sportfest rennt Paul um die Wette. Danach ist er ganz aus der Puste. Was macht er jetzt?"
                say: "Beim Sportfest rennt Paul um die Wette. Danach ist er ganz aus der Puste. Was macht er jetzt?"
                options: ["sich kurz ausruhen und Wasser trinken", "sofort noch zehn Runden rennen", "die Luft anhalten"]
                answer: "sich kurz ausruhen und Wasser trinken"
              - id: l1-n2
                type: sorting
                text: "Sportfest: Was ist Bewegung, was ist Pause?"
                say: "Beim Sportfest. Sortiere: Was ist Bewegung, was ist Pause?"
                bins:
                  - { id: bewegen, show: { text: "Bewegung" }, say: "Bewegung" }
                  - { id: pause, show: { text: "Pause" }, say: "Pause" }
                options:
                  - { object: jump, bin: bewegen }
                  - { text: "auf der Bank sitzen und trinken", bin: pause }
                  - { object: dance, bin: bewegen }
                  - { text: "im Schatten ausruhen", bin: pause }
              - id: l1-n3
                type: true_false
                text: "Paul hat heute eine Stunde Fußball gespielt und ist mit dem Rad zur Schule gefahren. Hat er sich heute genug bewegt?"
                say: "Paul hat heute eine Stunde Fußball gespielt und ist mit dem Rad zur Schule gefahren. Hat er sich heute genug bewegt?"
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Pauls Freundin Ida sitzt schon den ganzen Nachmittag vor dem Bildschirm. Was schlägst du ihr vor?"
                say: "Pauls Freundin Ida sitzt schon den ganzen Nachmittag vor dem Bildschirm. Was schlägst du ihr vor?"
                options: [{ object: ride-bike }, { object: mobile-phone }, { object: sofa }]
                answer: ride-bike
              - id: l1-n5
                type: fill_in_blank
                text: "Paul erzählt seiner Oma vom Sportfest."
                say: "Paul erzählt seiner Oma vom Sportfest. Setz die passenden Wörter ein."
                frame: "Beim Laufen hat mein Herz _ geschlagen. Danach habe ich eine _ gemacht."
                options: ["schneller", "Pause", "langsamer"]
                answer: ["schneller", "Pause"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was tut deinem Körper gut?"
            say: "Was tut deinem Körper gut?"
            options: ["jeden Tag toben und spielen", "den ganzen Tag sitzen", "nie etwas trinken"]
            answer: "jeden Tag toben und spielen"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Beim Rennen atmest du langsamer als vorher."
            say: "Stimmt das? Beim Rennen atmest du langsamer als vorher."
            answer: false
          - id: l1-c3
            type: image_multiple_choice
            text: "Wobei bewegst du dich viel?"
            say: "Wobei bewegst du dich viel?"
            options: [{ object: dance }, { object: read }, { object: sofa }]
            answer: dance
          - id: l1-c4
            type: true_false
            text: "Stimmt das? Wer lange gesessen hat, sollte aufstehen und sich strecken."
            say: "Stimmt das? Wer lange gesessen hat, sollte aufstehen und sich strecken."
            answer: true
          - id: l1-c5
            type: multiple_choice
            text: "Wie lange sollen sich Kinder jeden Tag mindestens bewegen?"
            say: "Wie lange sollen sich Kinder jeden Tag mindestens bewegen?"
            options: ["eine Stunde", "eine Minute", "gar nicht"]
            answer: "eine Stunde"
          - id: l1-c6
            type: multiple_choice
            text: "Was macht dein Herz stark?"
            say: "Was macht dein Herz stark?"
            options: ["Rad fahren", "fernsehen", "am Handy spielen"]
            answer: "Rad fahren"

  - n: 2
    title: { de: "Gut schlafen", en: "Sleeping well" }
    goal:
      de: "Finde heraus, warum du genug Schlaf brauchst und was dir beim Einschlafen hilft, so wie ein Buch am Abend."
      en: "Find out why you need enough sleep and what helps you fall asleep, like a book in the evening."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Bewegung macht Herz und Muskeln stark."
            say: "Stimmt das? Bewegung macht Herz und Muskeln stark."
            answer: true
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Wobei bewegst du dich?"
            say: "Wobei bewegst du dich?"
            options: [{ object: play-tennis }, { object: sofa }, { object: read }]
            answer: play-tennis
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Warum müssen wir jede Nacht schlafen?"
            say: "Am Abend nach dem Sportfest gähnt Paul. Er ist müde. Was glaubst du: Warum müssen wir jede Nacht schlafen?"
            show: { object: tired }
          - text: "Im Schlaf erholen sich Körper und Kopf."
            say: "Im Schlaf erholen sich Körper und Kopf. Die Muskeln ruhen sich vom Toben aus, und dein Kopf ordnet, was du am Tag erlebt und gelernt hast. Am nächsten Morgen hast du wieder Kraft."
            show: { object: bed }
          - text: "Kinder brauchen etwa 10 Stunden Schlaf, mehr als Erwachsene."
            say: "Kinder in deinem Alter brauchen jede Nacht ungefähr zehn Stunden Schlaf. Das ist mehr als bei Erwachsenen. Wer zu wenig schläft, ist am nächsten Tag müde und kann sich schlecht konzentrieren."
            show: { objects: [moon, bed] }
          - text: "Vor dem Schlafen ruhig werden: Bildschirm aus, Buch an."
            say: "Vor dem Schlafen hilft es, ruhig zu werden: Zähne putzen, ein Buch anschauen oder sich vorlesen lassen. Handy und Fernseher machen eher wach. Darum schaltet Paul sie vorher aus."
            show: { objects: [book, mobile-phone] }
          - text: "Ein guter Tag: bewegen, ausruhen, schlafen."
            say: "Ein guter Tag hat alles: Zeit zum Toben, Pausen zum Ausruhen und genug Schlaf in der Nacht. Dazu gutes Essen und genug Wasser."
            show: { objects: [ride-bike, bed] }
          - text: "Wusstest du? Im Schlaf macht dein Körper besonders viel von dem Stoff, der dich wachsen lässt."
            say: "Wusstest du? Im Schlaf macht dein Körper besonders viel von einem Stoff, der dich wachsen lässt. Er heißt Wachstumshormon. Du wächst also auch, während du schläfst!"
            show: { object: bed }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Warum schlafen wir jede Nacht?"
                say: "Warum schlafen wir jede Nacht?"
                options: ["Damit Körper und Kopf sich erholen.", "Damit es draußen dunkel wird.", "Weil Schlafen das Spielen verbietet."]
                answer: "Damit Körper und Kopf sich erholen."
                feedback:
                  "Damit es draußen dunkel wird.": "Dunkel wird es auch, wenn du wach bist! Wir schlafen, damit Körper und Kopf sich erholen."
                hints:
                  - "Wie fühlt sich Paul am Abend nach dem Sportfest?"
                  - "Am nächsten Morgen hat er wieder Kraft. Was ist in der Nacht passiert?"
                  - "Im Schlaf erholen sich Körper und Kopf."
                difficulty: easy
              - id: l2-f2
                type: image_multiple_choice
                text: "Was hilft dir beim Einschlafen?"
                say: "Was hilft dir beim Einschlafen?"
                options: [{ object: book }, { object: mobile-phone }, { object: ball }]
                answer: book
                hints:
                  - "Vor dem Schlafen soll man ruhig werden."
                  - "Das Handy macht wach, beim Ball tobst du herum."
                  - "Ein Buch hilft beim Einschlafen."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Kinder brauchen weniger Schlaf als Erwachsene."
                say: "Stimmt das? Kinder brauchen weniger Schlaf als Erwachsene."
                answer: false
                hints:
                  - "Kinder wachsen noch und toben viel."
                  - "Kinder brauchen etwa 10 Stunden Schlaf."
                  - "Nein. Kinder brauchen mehr Schlaf als Erwachsene."
              - id: l2-f4
                type: sorting
                text: "Macht das ruhig oder wach?"
                say: "Sortiere. Was macht dich vor dem Schlafen ruhig, was macht dich wach?"
                bins:
                  - { id: ruhig, show: { text: "macht ruhig" }, say: "macht ruhig" }
                  - { id: wach, show: { text: "macht wach" }, say: "macht wach" }
                options:
                  - { object: book, bin: ruhig }
                  - { object: mobile-phone, bin: wach }
                  - { object: teddy, bin: ruhig }
                  - { text: "wildes Toben", bin: wach }
                hints:
                  - "Was ist leise und gemütlich?"
                  - "Bildschirme und Toben machen munter."
                  - "Buch und Teddy machen ruhig. Handy und Toben machen wach."
              - id: l2-f5
                type: fill_in_blank
                text: "Wie lange schlafen Kinder?"
                say: "Setz die passende Zahl ein."
                frame: "Kinder in meinem Alter brauchen jede Nacht etwa _ Stunden Schlaf."
                options: ["10", "2", "20"]
                answer: ["10"]
                hints:
                  - "Es ist mehr als bei Erwachsenen."
                  - "2 Stunden sind viel zu wenig, 20 Stunden wäre fast der ganze Tag."
                  - "Etwa 10 Stunden."

          - support: some
            tasks:
              - id: l2-s1
                type: image_multiple_choice
                text: "Wie fühlt sich ein Kind, das zu wenig geschlafen hat?"
                say: "Wie fühlt sich ein Kind, das zu wenig geschlafen hat?"
                options: [{ object: tired }, { object: happy }, { object: scared }]
                answer: tired
                hints: ["Paul hat gegähnt. Wie fühlte er sich?"]
              - id: l2-s2
                type: multiple_choice
                text: "Was macht Paul am besten, bevor er schlafen geht?"
                say: "Was macht Paul am besten, bevor er schlafen geht?"
                options: ["sich ein Buch vorlesen lassen", "am Handy spielen", "einen Gruselfilm schauen"]
                answer: "sich ein Buch vorlesen lassen"
                hints: ["Vor dem Schlafen soll man ruhig werden."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Im Schlaf erholen sich die Muskeln vom Toben."
                say: "Stimmt das? Im Schlaf erholen sich die Muskeln vom Toben."
                answer: true
                hints: ["Am nächsten Morgen hat Paul wieder Kraft."]
              - id: l2-s4
                type: ordering
                text: "Pauls Abend. Was kommt zuerst?"
                say: "Pauls Abend. Leg die Karten in die richtige Reihenfolge."
                options: ["Er schläft ein.", "Er isst zu Abend.", "Er putzt die Zähne."]
                slot_count: 3
                answer: ["Er isst zu Abend.", "Er putzt die Zähne.", "Er schläft ein."]
                hints: ["Zähne putzt man nach dem Essen."]
              - id: l2-s5
                type: matching
                text: "Was braucht der Körper wann?"
                say: "Verbinde jede Zeit mit dem, was der Körper dann braucht."
                pairs:
                  - { left: { text: "nach dem Rennen" }, right: { text: "eine Pause" } }
                  - { left: { text: "nach langem Sitzen" }, right: { text: "Bewegung" } }
                  - { left: { text: "in der Nacht" }, right: { text: "Schlaf" } }
                hints: ["Nach dem Sitzen braucht der Körper das Gegenteil von Sitzen."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Paul möchte am Abend noch lange Videos schauen. Morgen ist Schule. Was ist klug?"
                say: "Paul möchte am Abend noch lange Videos schauen. Morgen ist Schule. Was ist klug?"
                options: ["Bildschirm aus und schlafen gehen", "bis Mitternacht weiterschauen", "ohne Schlaf in die Schule gehen"]
                answer: "Bildschirm aus und schlafen gehen"
              - id: l2-n2
                type: true_false
                text: "Paul geht um 8 Uhr abends ins Bett und wacht um 6 Uhr morgens auf. Hat er 10 Stunden geschlafen?"
                say: "Paul geht um acht Uhr abends ins Bett und wacht um sechs Uhr morgens auf. Hat er zehn Stunden geschlafen?"
                answer: true
              - id: l2-n3
                type: image_multiple_choice
                text: "Ida ist morgens in der Schule immer müde. Was hilft ihr?"
                say: "Ida ist morgens in der Schule immer müde. Was hilft ihr?"
                options: [{ object: bed }, { object: cake }, { object: mobile-phone }]
                answer: bed
              - id: l2-n4
                type: fill_in_blank
                text: "Paul plant seinen Nachmittag."
                say: "Paul plant seinen Nachmittag. Setz die passenden Wörter ein."
                frame: "Erst spiele ich Fußball, dann mache ich eine _. Am Abend gehe ich früh ins _."
                options: ["Pause", "Bett", "Handy"]
                answer: ["Pause", "Bett"]
              - id: l2-n5
                type: multiple_choice
                text: "Paul schreibt auf, was zu einem gesunden Tag gehört. Was stimmt?"
