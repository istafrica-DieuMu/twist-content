# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.plant-growth
skill: world.nature.plant-growth
curriculum: de-DE
language: de
title:
  de: Was Pflanzen zum Wachsen brauchen
  en: What plants need to grow
summary: >
  Lena and her brother Tom grow plants on the window sill. Lesson 1 opens
  with Lena's three pots of cress (light and water, dark cupboard with
  water, light without water) and the guess which grows best: plants need
  light, water, warmth and soil, and too much water rots the roots. It
  offers a safe try-at-home version with a grown-up (two pots of cress,
  one in the dark); the experiment stays at home and never counts. Lesson
  2 follows Tom's bean in a glass of soil: it swells and splits, the root
  comes first and grows down, the shoot grows up to the light, the
  seedling lives on the food stored in the seed until its leaves make
  more, then flowers, pods and new seeds. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Tiere und Pflanzen, en: Animals and plants }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.plant-parts]
  also_practises: []
  vocabulary: { de: [Licht, Wasser, Wärme, Erde, Nährstoffe, Samen, keimen, Keimling, Spross, Schote, Kresse] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: needs, what: { de: "sagen, was eine Pflanze zum Wachsen braucht", en: saying what a plant needs to grow } }
    - { id: missing, what: { de: "vorhersagen, was passiert, wenn etwas fehlt oder zu viel ist", en: predicting what happens when something is missing or too much } }
    - { id: germinate, what: { de: "beschreiben, wie ein Samen keimt", en: describing how a seed germinates } }
    - { id: cycle, what: { de: "beschreiben, wie aus der Pflanze neue Samen werden", en: describing how the plant makes new seeds } }
  misconceptions:
    - id: soil-is-food
      what: Thinks the plant eats the soil and needs nothing else
      addressed: lesson 1 Learn says the leaves make food with light and the soil gives hold and nutrients; l1-f4, l1-s4, l1-c3 and l2-c5
    - id: dark-no-difference
      what: Thinks a plant grows just as well in the dark if it gets water
      addressed: lesson 1 Learn opens with the cress in the cupboard; l1-f3, l1-s1, l1-n2, l1-c6 and l2-c6
    - id: more-water-better
      what: Thinks the more water a plant gets, the better
      addressed: lesson 1 Learn says roots rot in standing water; l1-s5, l1-n5 and l2-c8
    - id: leaf-comes-first
      what: Thinks a leaf or a flower comes out of the seed first
      addressed: lesson 2 Learn opens with the guess and shows the root first; l2-f1, l2-f2, l2-n1, l2-n3, l2-c11 and l2-c13
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Licht, Wasser, Wärme und Erde", en: "Light, water, warmth and soil" }
    goal:
      de: "Finde heraus, was eine Pflanze zum Wachsen braucht. Die Kresse am hellen Fenster wächst zum Beispiel grün und kräftig."
      en: "Find out what a plant needs to grow. The cress on the bright window sill, for example, grows green and strong."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welcher Teil der Pflanze nimmt das Wasser aus der Erde auf?"
            say: "Welcher Teil der Pflanze nimmt das Wasser aus der Erde auf?"
            options: ["die Wurzel", "die Blüte", "das Blatt"]
            answer: "die Wurzel"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? Die Blätter machen mit Sonnenlicht Nahrung."
            say: "Stimmt das? Die Blätter machen mit Sonnenlicht Nahrung."
            show: { object: leaf }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Welche Kresse wächst am besten?"
            say: "Lena hat drei Töpfe mit Kressesamen in Erde gesät. Den ersten stellt sie ans helle Fenster und gießt ihn. Den zweiten stellt sie in den dunklen Schrank und gießt ihn auch. Den dritten stellt sie ans Fenster, aber sie gießt ihn nie. Was glaubst du: Welche Kresse wächst am besten?"
            show: { object: cress }
          - text: "Am hellen Fenster, mit Wasser"
            say: "Die Kresse am hellen Fenster, die Lena gießt, wächst grün und kräftig. Im dunklen Schrank wächst die Kresse zwar, aber sie wird lang, dünn und gelb. Und ohne Wasser wächst gar nichts."
            show: { objects: [sun, watering-can] }
          - text: "Pflanzen brauchen Licht, Wasser, Wärme und Erde."
            say: "Eine Pflanze braucht Licht, Wasser, Wärme und Erde. Mit dem Licht machen die Blätter Nahrung. Das Wasser nimmt die Wurzel auf. In der Erde hat die Wurzel Halt und findet Nährstoffe. Und wenn es warm ist, wächst die Pflanze. Bei großer Kälte wächst sie nicht."
            show: { objects: [sun, water] }
          - text: "Zu viel Wasser ist auch nicht gut."
            say: "Aber Vorsicht: Steht eine Pflanze immer im Wasser, dann faulen die Wurzeln. Gieß die Pflanze, wenn die Erde trocken ist."
            show: { object: watering-can }
          - text: "Probier's aus, mit einem Erwachsenen!"
            say: "Probier's aus, mit Mama, Papa oder einem anderen Erwachsenen. Sät Kresse in zwei Töpfe mit Erde. Stellt einen ans helle Fenster und einen in einen dunklen Schrank. Gießt beide. Nach ein paar Tagen seht ihr den Unterschied."
            show: { object: sun }
          - text: "Wusstest du? Kresse kannst du nach etwa einer Woche essen."
            say: "Wusstest du? Kresse wächst so schnell, dass du sie schon nach etwa einer Woche ernten und aufs Brot legen kannst."
            show: { object: bread }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Was braucht eine Pflanze zum Wachsen?"
                say: "Was braucht eine Pflanze zum Wachsen?"
                options: [{ object: water }, { object: ball }, { object: teddy }]
                answer: water
                feedback:
                  teddy: "Ein Teddy zum Kuscheln? Den braucht die Pflanze nicht. Sie braucht Wasser."
                hints:
                  - "Denk an Lenas dritten Topf, den sie nie gießt."
                  - "Ohne Wasser wächst gar nichts."
                  - "Die Pflanze braucht Wasser."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Braucht die Pflanze das zum Wachsen?"
                say: "Sortiere. Was braucht die Pflanze zum Wachsen, was nicht?"
                bins:
                  - { id: ja, show: { text: "braucht sie" }, say: "braucht sie" }
                  - { id: nein, show: { text: "braucht sie nicht" }, say: "braucht sie nicht" }
                options:
                  - { object: sun, bin: ja }
                  - { object: ice-cream, bin: nein }
                  - { object: water, bin: ja }
                  - { object: telephone, bin: nein }
                hints:
                  - "Es sind vier Dinge: Licht, Wasser, Wärme und Erde."
                  - "Die Sonne gibt Licht und Wärme. Eis und Telefon sind für Menschen."
                  - "Sonne und Wasser braucht sie, Eis und Telefon nicht."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Im dunklen Schrank wird die Kresse grün und kräftig."
                say: "Stimmt das? Im dunklen Schrank wird die Kresse grün und kräftig."
                answer: false
                hints:
                  - "Was fehlt im Schrank?"
                  - "Im Schrank ist kein Licht. Ohne Licht können die Blätter keine Nahrung machen."
                  - "Nein. Im Dunkeln wird die Kresse dünn und gelb."
              - id: l1-f4
                type: multiple_choice
                text: "Warum braucht die Pflanze Licht?"
                say: "Warum braucht die Pflanze Licht?"
                options: ["Mit Licht machen die Blätter Nahrung.", "Damit sie die Bienen sehen kann.", "Damit sie nachts schlafen kann."]
                answer: "Mit Licht machen die Blätter Nahrung."
                hints:
                  - "Denk an die grünen Blätter."
                  - "Die Blätter fangen das Sonnenlicht ein. Wozu?"
                  - "Mit Licht machen die Blätter Nahrung."
              - id: l1-f5
                type: fill_in_blank
                text: "Wer braucht was?"
                say: "Setz die passenden Wörter ein."
                frame: "Die Blätter brauchen _. Die Wurzel braucht Wasser und _."
                options: ["Licht", "Erde", "Musik"]
                answer: ["Licht", "Erde"]
                hints:
                  - "Die Blätter sind oben, die Wurzel ist unten."
                  - "Oben fangen die Blätter etwas von der Sonne ein. Unten hat die Wurzel Halt."
                  - "Die Blätter brauchen Licht, die Wurzel braucht Erde."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Kresse wird dünn und gelb?"
                say: "Welche Kresse wird dünn und gelb?"
                show: { object: cress }
                options: ["die Kresse im dunklen Schrank", "die Kresse am hellen Fenster", "die Kresse im Garten im Sommer"]
                answer: "die Kresse im dunklen Schrank"
                hints: ["Wo fehlt das Licht?"]
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Pflanzen brauchen Wärme zum Wachsen."
                say: "Stimmt das? Pflanzen brauchen Wärme zum Wachsen."
                answer: true
                hints: ["Wächst im Schnee etwas?"]
              - id: l1-s3
                type: image_multiple_choice
                text: "Die Erde ist trocken. Womit hilfst du der Pflanze?"
                say: "Die Erde ist trocken. Womit hilfst du der Pflanze?"
                options: [{ object: watering-can }, { object: scissors }, { object: umbrella }]
                answer: watering-can
                hints: ["Die trockene Erde braucht Wasser."]
              - id: l1-s4
                type: matching
                text: "Wozu braucht die Pflanze das?"
                say: "Verbinde jedes Ding mit dem, wozu die Pflanze es braucht."
                pairs:
                  - { left: { text: "Licht" }, right: { text: "Die Blätter machen Nahrung." } }
                  - { left: { text: "Wasser" }, right: { text: "Die Wurzel nimmt es auf." } }
                  - { left: { text: "Erde" }, right: { text: "Die Wurzel hat Halt." } }
                hints: ["Licht gehört zu den Blättern, Wasser und Erde zur Wurzel."]
              - id: l1-s5
                type: multiple_choice
                text: "Was passiert, wenn eine Pflanze immer im Wasser steht?"
                say: "Was passiert, wenn eine Pflanze immer im Wasser steht?"
                options: ["Die Wurzeln faulen.", "Sie wächst bis zum Himmel.", "Sie wird blau."]
                answer: "Die Wurzeln faulen."
                hints: ["Zu viel Wasser ist nicht gut für die Wurzeln."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Lena hat ihre Kresse eine Woche lang vergessen. Die Erde ist trocken, die Kresse hängt. Was fehlt?"
                say: "Lena hat ihre Kresse eine Woche lang vergessen. Die Erde ist trocken, die Kresse hängt. Was fehlt?"
                show: { object: cress }
                options: ["Wasser", "Licht", "Musik"]
                answer: "Wasser"
              - id: l1-n2
                type: true_false
                text: "Tom stellt seinen Topf in den dunklen Keller. Er sagt: „Da wächst die Kresse genauso grün.“ Stimmt das?"
                say: "Tom stellt seinen Topf in den dunklen Keller. Er sagt: Da wächst die Kresse genauso grün. Stimmt das?"
                show: { object: cress }
                answer: false
              - id: l1-n3
                type: sorting
                text: "Wo wächst Toms Kresse gut?"
                say: "Wo wächst Toms Kresse gut, wo schlecht? Sortiere."
                bins:
                  - { id: gut, show: { text: "wächst gut" }, say: "wächst gut" }
                  - { id: schlecht, show: { text: "wächst schlecht" }, say: "wächst schlecht" }
                options:
                  - { text: "am hellen Fenster, gegossen", bin: gut }
                  - { text: "im dunklen Schrank", bin: schlecht }
                  - { text: "im Schnee auf dem Balkon", bin: schlecht }
                  - { text: "in trockener Erde, nie gegossen", bin: schlecht }
              - id: l1-n4
                type: true_false
                text: "Lena sagt: „Im Schnee ist es zu kalt. Da wächst meine Kresse nicht.“ Stimmt das?"
                say: "Lena sagt: Im Schnee ist es zu kalt. Da wächst meine Kresse nicht. Stimmt das?"
                show: { object: snow }
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Lena schreibt einen Zettel für Oma, die die Kresse versorgt."
                say: "Lena schreibt einen Zettel für Oma, die die Kresse versorgt. Setz die passenden Wörter ein."
                frame: "Stell sie ans _. Gieß sie, wenn die Erde _ ist."
                options: ["Fenster", "trocken", "Schrank", "nass"]
                answer: ["Fenster", "trocken"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Was braucht eine Pflanze?"
            say: "Was braucht eine Pflanze?"
            options: [{ object: sun }, { object: sock }, { object: ball }]
            answer: sun
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Pflanzen brauchen keine Wärme."
            say: "Stimmt das? Pflanzen brauchen keine Wärme."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was findet die Wurzel in der Erde?"
            say: "Was findet die Wurzel in der Erde?"
            options: ["Wasser und Nährstoffe", "Licht", "Musik"]
            answer: "Wasser und Nährstoffe"
          - id: l1-c4
            type: multiple_choice
            text: "Wo wächst Kresse am besten?"
            say: "Wo wächst Kresse am besten?"
            options: ["am hellen Fenster, mit Wasser", "im dunklen Schrank", "im Kühlschrank"]
            answer: "am hellen Fenster, mit Wasser"
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Pflanzen brauchen Licht zum Wachsen."
            say: "Stimmt das? Pflanzen brauchen Licht zum Wachsen."
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Die Kresse im Schrank"
            say: "Setz das passende Wort ein."
            frame: "Im Dunkeln wird die Kresse gelb, weil das _ fehlt."
            options: ["Licht", "Wasser", "Erde"]
            answer: ["Licht"]

  - n: 2
    title: { de: "Vom Samen zur Pflanze", en: "From seed to plant" }
    goal:
      de: "Schau zu, wie aus einem Samen eine Pflanze wird. Aus der Bohne wächst zuerst eine kleine Wurzel."
      en: "Watch how a seed becomes a plant. A small root grows out of the bean first."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Was braucht eine Pflanze zum Wachsen?"
            say: "Was braucht eine Pflanze zum Wachsen?"
            options: ["Licht, Wasser, Wärme und Erde", "Dunkelheit und Kälte", "Musik und Schokolade"]
            answer: "Licht, Wasser, Wärme und Erde"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Im Dunkeln wird Kresse dünn und gelb."
            say: "Stimmt das? Im Dunkeln wird Kresse dünn und gelb."
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Was kommt zuerst aus der Bohne?"
            say: "Tom steckt eine Bohne in ein Glas mit feuchter Erde, ganz nah an die Glaswand. So kann er jeden Tag zusehen. Was glaubst du: Was kommt zuerst aus der Bohne heraus, eine Wurzel oder ein Blatt?"
            show: { object: bean }
          - text: "Zuerst wächst die Wurzel nach unten."
            say: "Die Wurzel! Nach ein paar Tagen platzt die Bohne auf. Eine kleine Wurzel wächst nach unten in die Erde. Das nennt man keimen. Damit ein Samen keimt, braucht er Wasser und Wärme."
            show: { object: sprouting-bean }
          - text: "Dann wächst der Spross nach oben."
            say: "Danach wächst ein Spross nach oben zum Licht. Er bekommt die ersten grünen Blätter. Jetzt heißt die kleine Pflanze Keimling."
            show: { object: seedling }
          - text: "Im Samen steckt Nahrung für den Anfang."
            say: "Woher hat der Keimling seine Kraft, bevor er Blätter hat? Im Samen steckt ein kleiner Vorrat an Nahrung. Der reicht für den Anfang. Danach machen die grünen Blätter mit Licht neue Nahrung."
            show: { object: bean }
          - text: "Blüten, Schoten und neue Samen"
            say: "Die Bohnenpflanze wächst und bekommt Blüten. Aus den Blüten werden Bohnenschoten. In jeder Schote stecken neue Bohnen. Das sind die Samen für neue Pflanzen. So geht es immer weiter."
            show: { object: bean-pod }
          - text: "Wusstest du? Ein Samen hat 2000 Jahre gewartet."
            say: "Wusstest du? Manche Samen können sehr lange warten. Forscher haben einen Dattelsamen gepflanzt, der etwa zweitausend Jahre alt war. Er hat gekeimt, und daraus ist eine Dattelpalme gewachsen."
            show: { object: tree }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "Vom Samen zum Keimling. Was kommt zuerst?"
                say: "Vom Samen zum Keimling. Leg die Karten in die richtige Reihenfolge."
                options: ["Der Keimling bekommt Blätter.", "Der Samen liegt in der Erde.", "Eine Wurzel wächst nach unten."]
                slot_count: 3
                answer: ["Der Samen liegt in der Erde.", "Eine Wurzel wächst nach unten.", "Der Keimling bekommt Blätter."]
                hints:
                  - "Am Anfang ist nur der Samen da."
                  - "Was kam bei Toms Bohne zuerst heraus?"
                  - "Samen, dann Wurzel, dann Blätter."
              - id: l2-f2
                type: multiple_choice
                text: "Was wächst zuerst aus der Bohne?"
                say: "Was wächst zuerst aus der Bohne?"
                options: ["eine kleine Wurzel", "eine Blüte", "eine Bohnenschote"]
                answer: "eine kleine Wurzel"
                hints:
                  - "Denk an Toms Glas mit der Bohne."
                  - "Die Bohne platzt auf, und etwas wächst nach unten in die Erde."
                  - "Zuerst wächst eine kleine Wurzel."
                difficulty: easy
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Damit ein Samen keimt, braucht er Wasser."
                say: "Stimmt das? Damit ein Samen keimt, braucht er Wasser."
                answer: true
                hints:
                  - "Tom hat die Erde im Glas feucht gemacht. Warum?"
                  - "Ein Samen braucht Wasser und Wärme, damit er keimt."
                  - "Ja. Ohne Wasser keimt kein Samen."
              - id: l2-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit dem passenden Satz."
                pairs:
                  - { left: { object: bean, say: "Samen" }, right: { text: "liegt in der Erde und wartet" } }
                  - { left: { object: seedling }, right: { text: "kleine Pflanze mit den ersten Blättern" } }
                  - { left: { object: blossom }, right: { text: "daraus wird die Schote" } }
                hints:
                  - "Fang mit dem Samen an, dem Anfang von allem."
                  - "Der Keimling ist noch klein. Die Blüte kommt später."
                  - "Samen und warten, Keimling und erste Blätter, Blüte und Schote."
              - id: l2-f5
                type: multiple_choice
                text: "Wohin wächst der Spross?"
                say: "Wohin wächst der Spross?"
                options: ["nach oben zum Licht", "nach unten in die Erde", "zur Seite ins Glas"]
                answer: "nach oben zum Licht"
                hints:
                  - "Der Spross bekommt die grünen Blätter."
                  - "Die Blätter brauchen Licht, und das Licht kommt von oben."
                  - "Der Spross wächst nach oben zum Licht."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Oben und unten"
                say: "Setz die passenden Wörter ein."
                frame: "Die Wurzel wächst nach _. Der Spross wächst nach _."
                options: ["unten", "oben", "hinten"]
                answer: ["unten", "oben"]
                hints: ["Die Wurzel sucht die Erde, der Spross das Licht."]
              - id: l2-s2
                type: true_false
                text: "Stimmt das? Ein Keimling hat schon große Blüten."
                say: "Stimmt das? Ein Keimling hat schon große Blüten."
                answer: false
                hints: ["Ein Keimling ist eine ganz junge Pflanze."]
              - id: l2-s3
                type: multiple_choice
                text: "Woher hat der Keimling am Anfang seine Nahrung?"
                say: "Woher hat der Keimling am Anfang seine Nahrung?"
                options: ["aus dem Vorrat im Samen", "aus dem Supermarkt", "von den Bienen"]
                answer: "aus dem Vorrat im Samen"
                hints: ["Bevor die Blätter da sind, hilft der Samen selbst."]
              - id: l2-s4
                type: ordering
                text: "Vom Samen zu neuen Samen"
                say: "Vom Samen zu neuen Samen. Leg die Karten in die richtige Reihenfolge."
                options: ["blühende Pflanze", "Keimling", "neue Samen", "Samen"]
                slot_count: 4
                answer: ["Samen", "Keimling", "blühende Pflanze", "neue Samen"]
                hints: ["Die neuen Samen entstehen erst aus den Blüten."]
              - id: l2-s5
                type: multiple_choice
                text: "Was steckt in einer Bohnenschote?"
                say: "Was steckt in einer Bohnenschote?"
                show: { object: bean-pod }
                options: ["neue Bohnen, also Samen", "Wasser", "kleine Blätter"]
                answer: "neue Bohnen, also Samen"
                hints: ["Aus dem, was in der Schote steckt, wachsen neue Pflanzen."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Nach ein paar Tagen ist Toms Bohne aufgeplatzt. Was sieht er zuerst?"
                say: "Nach ein paar Tagen ist Toms Bohne aufgeplatzt. Was sieht er zuerst?"
                show: { object: bean }
                options: ["eine kleine Wurzel", "eine rote Blüte", "eine fertige Schote"]
                answer: "eine kleine Wurzel"
              - id: l2-n2
                type: true_false
                text: "Tom legt eine Bohne in eine trockene Dose. Er sagt: „Die keimt bestimmt bald.“ Stimmt das?"
                say: "Tom legt eine Bohne in eine trockene Dose. Er sagt: Die keimt bestimmt bald. Stimmt das?"
                show: { object: bean }
                answer: false
              - id: l2-n3
                type: ordering
                text: "Toms Bohnen-Tagebuch. Bring die Seiten in die richtige Reihenfolge."
                say: "Toms Bohnen-Tagebuch. Bring die Seiten in die richtige Reihenfolge."
                options: ["Die Pflanze hat Blüten.", "Ich stecke die Bohne in die Erde.", "Ein grüner Spross schaut heraus.", "Die Bohne platzt auf, eine Wurzel wächst."]
                slot_count: 4
                answer: ["Ich stecke die Bohne in die Erde.", "Die Bohne platzt auf, eine Wurzel wächst.", "Ein grüner Spross schaut heraus.", "Die Pflanze hat Blüten."]
              - id: l2-n4
