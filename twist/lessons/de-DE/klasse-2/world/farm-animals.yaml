# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.farm-animals
skill: world.nature.farm-animals
curriculum: de-DE
language: de
title:
  de: Tiere auf dem Bauernhof
  en: Farm animals
summary: >
  Mila spends her holidays on Onkel Jonas's farm. Lesson 1 names the farm
  animals (Kuh, Schwein, Schaf, Ziege, Huhn, Pferd, Biene) and finds out
  where milk and eggs come from: milk from cows, goats and sheep, eggs
  from hens, and the shop only sells them. Lesson 2 adds wool from the
  sheep (shearing does not hurt, the wool grows back), what is made from
  milk and wool, and meat, said plainly: Wurst and Schnitzel are made of
  meat, and meat comes from animals such as the pig, the cow and the hen.
  One animal can give several things. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Vom Hof auf den Tisch, en: From farm to table }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.nature.pets]
  also_practises: []
  vocabulary: { de: [Nutztier, Bauernhof, Stall, melken, scheren, Wolle, Fleisch] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: animals, what: { de: Nutztiere erkennen und nennen, en: recognising and naming farm animals } }
    - { id: milk, what: { de: "wissen, welche Tiere Milch geben und was man aus Milch macht", en: knowing which animals give milk and what is made from it } }
    - { id: eggs-wool, what: { de: "Eier dem Huhn und Wolle dem Schaf zuordnen", en: matching eggs to the hen and wool to the sheep } }
    - { id: meat, what: { de: "wissen, dass Fleisch und Wurst von Tieren kommen", en: knowing that meat and sausage come from animals } }
  misconceptions:
    - id: milk-from-shop
      what: Thinks milk and eggs are made in the supermarket or a factory
      addressed: lesson 1 Learn opens with the guess and answers that the shop only sells milk; l1-s1 and l1-n3 ask where milk comes from, with feedback; l2-c10 in the skill check
    - id: only-cows-milk
      what: Thinks only cows give milk
      addressed: lesson 1 Learn shows goats and sheep being milked too; l1-f5 sorts the sheep and goat into the milk bin, l1-s3 and l1-n2 ask about goats, l2-w2 about sheep, l2-n2 about Schafskäse; l2-c8 in the skill check
    - id: hen-gives-milk
      what: Thinks every farm animal gives milk, the hen too
      addressed: lesson 1 Learn says the hen is a bird and lays eggs but gives no milk; feedback in l1-f1, then l1-f3 and l1-c1
    - id: shearing-hurts
      what: Thinks the sheep is hurt or must die for its wool
      addressed: lesson 2 Learn compares shearing with a haircut and says the wool grows back; l2-f3 and l2-n4
    - id: meat-not-from-animals
      what: Does not know that Wurst, Schinken and Schnitzel are made of meat from animals
      addressed: lesson 2 Learn says it plainly; l2-f4, l2-s1 and l2-n3, with feedback; l2-c16 to l2-c20 in the skill check
    - id: one-product-per-animal
      what: Thinks each animal gives only one thing
      addressed: lesson 2 Learn shows the cow, hen and sheep each giving several things; l2-s4 and l2-c19
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Milch und Eier vom Hof", en: "Milk and eggs from the farm" }
    goal:
      de: "Lerne die Tiere auf dem Bauernhof kennen. Finde heraus, woher Milch und Eier kommen, so wie die Eier vom Huhn."
      en: "Get to know the animals on the farm. Find out where milk and eggs come from, like eggs from the hen."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Welches Tier lebt oft als Haustier bei uns zu Hause?"
            say: "Welches Tier lebt oft als Haustier bei uns zu Hause?"
            options: [{ object: cat }, { object: lion }, { object: crocodile }]
            answer: cat
            feedback:
              crocodile: "Ein Krokodil in der Badewanne? Lieber nicht! Die Katze ist ein Haustier."
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Was braucht ein Hund jeden Tag?"
            say: "Was braucht ein Hund jeden Tag?"
            show: { object: dog }
            options: ["frisches Wasser", "Schokolade", "einen Fernseher"]
            answer: "frisches Wasser"
            feedback:
              "Schokolade": "Schokolade ist für Hunde giftig. Ein Hund braucht frisches Wasser."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Woher kommt die Milch?"
            say: "Mila macht Ferien auf dem Bauernhof von Onkel Jonas. Beim Frühstück trinkt sie ein Glas Milch. Was glaubst du: Woher kommt die Milch?"
            show: { object: milk }
          - text: "Die Milch kommt von der Kuh."
            say: "Von der Kuh! Jeden Morgen melkt Onkel Jonas seine Kühe. Im Supermarkt wird die Milch nur verkauft, gemacht wird sie dort nicht. Aus Milch macht man auch Käse."
            show: { objects: [cow, milk] }
          - text: "Auch Ziegen und Schafe geben Milch."
            say: "Nicht nur Kühe geben Milch. Onkel Jonas kann auch seine Ziegen und Schafe melken. Aus ihrer Milch macht man zum Beispiel Ziegenkäse und Schafskäse."
            show: { objects: [goat, sheep] }
          - text: "Das Huhn legt Eier."
            say: "Das Huhn ist ein Vogel. Es gibt keine Milch, aber es legt Eier. Mila sucht sie jeden Morgen im Stroh."
            show: { objects: [hen, egg] }
          - text: "Nutztiere: Kuh, Ziege, Schaf, Huhn, Schwein, Pferd, Biene"
            say: "Tiere, die Menschen halten, weil sie uns etwas geben, heißen Nutztiere. Auf dem Hof leben Kühe, Ziegen, Schafe, Hühner und Schweine. Auf dem Pferd kann man reiten. Und auch die Biene ist ein Nutztier: Sie macht Honig."
            show: { objects: [pig, bee] }
          - text: "Wusstest du? Braune und weiße Eier schmecken gleich."
            say: "Wusstest du? Braune und weiße Hühnereier schmecken gleich. Welche Farbe die Schale hat, hängt davon ab, welche Hühnerrasse das Ei gelegt hat. Manche Hühner legen sogar grünliche Eier!"
            show: { object: egg }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Tier gibt uns Milch?"
                say: "Welches Tier gibt uns Milch?"
                options: [{ object: cow }, { object: hen }, { object: pig }]
                answer: cow
                feedback:
                  hen: "Das Huhn ist ein Vogel. Es legt Eier, aber es gibt keine Milch."
                hints:
                  - "Denk an das Tier, das Onkel Jonas jeden Morgen melkt."
                  - "Das Huhn legt Eier. Das Schwein melkt man nicht."
                  - "Die Kuh gibt uns Milch."
                difficulty: easy
              - id: l1-f2
                type: matching
                text: "Wer gibt uns was?"
                say: "Verbinde jedes Tier mit dem, was es uns gibt."
                pairs:
                  - { left: { object: hen }, right: { object: egg } }
                  - { left: { object: cow }, right: { object: milk } }
                  - { left: { object: bee }, right: { object: honeycomb } }
                hints:
                  - "Fang mit dem Tier an, das du am besten kennst."
                  - "Das Huhn sitzt im Stroh. Die Biene fliegt von Blüte zu Blüte."
                  - "Huhn und Ei, Kuh und Milch, Biene und Honig."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? Das Huhn gibt uns Milch."
                say: "Stimmt das? Das Huhn gibt uns Milch."
                show: { object: hen }
                answer: false
                hints:
                  - "Was sucht Mila jeden Morgen im Stroh?"
                  - "Das Huhn ist ein Vogel. Vögel legen Eier."
                  - "Nein. Das Huhn legt Eier, Milch gibt es nicht."
              - id: l1-f4
                type: image_multiple_choice
                text: "Welches Tier ist ein Nutztier?"
                say: "Welches Tier lebt als Nutztier auf dem Bauernhof?"
                options: [{ object: goat }, { object: lion }, { object: giraffe }]
                answer: goat
                feedback:
                  lion: "Ein Löwe auf dem Bauernhof? Da würden alle Hühner weglaufen! Die Ziege ist ein Nutztier."
                hints:
                  - "Ein Nutztier gibt uns etwas, zum Beispiel Milch."
                  - "Löwe und Giraffe leben in Afrika, nicht auf dem Hof."
                  - "Die Ziege ist ein Nutztier."
              - id: l1-f5
                type: sorting
                text: "Gibt das Tier uns Milch oder Eier?"
                say: "Sortiere die Tiere. Welche geben uns Milch, welches legt Eier?"
                bins:
                  - { id: milch, show: { object: milk }, say: "Milch" }
                  - { id: eier, show: { object: egg }, say: "Eier" }
                options:
                  - { object: goat, bin: milch }
                  - { object: hen, bin: eier }
                  - { object: cow, bin: milch }
                  - { object: sheep, bin: milch }
                hints:
                  - "Nur ein Tier hier ist ein Vogel."
                  - "Kühe, Ziegen und Schafe kann man melken."
                  - "Kuh, Ziege und Schaf zur Milch, das Huhn zu den Eiern."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Woher kommt die Milch, bevor sie im Supermarkt steht?"
                say: "Woher kommt die Milch, bevor sie im Supermarkt steht?"
                show: { object: milk }
                options: ["von Tieren wie der Kuh", "aus dem Wasserhahn", "von einem Milchbaum"]
                answer: "von Tieren wie der Kuh"
                feedback:
                  "von einem Milchbaum": "Ein Milchbaum? Den gibt es leider nicht. Milch kommt von Tieren wie der Kuh."
                hints: ["Im Supermarkt wird Milch nur verkauft. Wer gibt sie?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Welches Tier legt Eier?"
                say: "Welches Tier legt Eier?"
                options: [{ object: hen }, { object: cow }, { object: goat }]
                answer: hen
                hints: ["Nur ein Tier hier ist ein Vogel."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Auch Ziegen geben Milch."
                say: "Stimmt das? Auch Ziegen geben Milch."
                show: { object: goat }
                answer: true
                hints: ["Woraus macht man Ziegenkäse?"]
              - id: l1-s4
                type: fill_in_blank
                text: "Was geben uns die Tiere?"
                say: "Setz die passenden Wörter ein."
                frame: "Die Kuh gibt uns _. Das Huhn legt _."
                options: ["Milch", "Eier", "Wolle"]
                answer: ["Milch", "Eier"]
                hints: ["Die Kuh wird gemolken. Das Huhn sitzt im Stroh."]
              - id: l1-s5
                type: image_multiple_choice
                text: "Welches Tier lebt nicht auf dem Bauernhof?"
                say: "Welches Tier lebt nicht auf dem Bauernhof?"
                options: [{ object: pig }, { object: sheep }, { object: crocodile }]
                answer: crocodile
                hints: ["Welches Tier lebt im Fluss in warmen Ländern?"]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Mila will Rührei machen. Zu welchem Tier geht sie?"
                say: "Mila will Rührei machen. Zu welchem Tier geht sie?"
                show: { object: egg }
                options: ["zum Huhn", "zur Kuh", "zum Schwein"]
                answer: "zum Huhn"
              - id: l1-n2
                type: image_multiple_choice
                text: "Onkel Jonas melkt nicht nur Kühe. Welches Tier kann er auch melken?"
                say: "Onkel Jonas melkt nicht nur Kühe. Welches Tier kann er auch melken?"
                options: [{ object: goat }, { object: hen }, { object: pig }]
                answer: goat
              - id: l1-n3
                type: true_false
                text: "Mila sagt: „Die Milch wird im Supermarkt gemacht.“ Stimmt das?"
                say: "Mila sagt: Die Milch wird im Supermarkt gemacht. Stimmt das?"
                show: { object: milk }
                answer: false
              - id: l1-n4
                type: sorting
                text: "Mila deckt den Frühstückstisch. Was kommt von der Kuh, was vom Huhn?"
                say: "Mila deckt den Frühstückstisch. Was kommt von der Kuh, was vom Huhn?"
                bins:
                  - { id: kuh, show: { object: cow }, say: "von der Kuh" }
                  - { id: huhn, show: { object: hen }, say: "vom Huhn" }
                options:
                  - { object: cheese, bin: kuh }
                  - { object: egg, bin: huhn }
                  - { object: milk, bin: kuh }
                  - { object: boiled-egg, bin: huhn }
              - id: l1-n5
                type: image_multiple_choice
                text: "Im Stall liegt ein Ei im Stroh. Wer hat es gelegt?"
                say: "Im Stall liegt ein Ei im Stroh. Wer hat es gelegt?"
                options: [{ object: hen }, { object: horse }, { object: cow }]
                answer: hen

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Welches Tier gibt uns Milch?"
            say: "Welches Tier gibt uns Milch?"
            options: [{ object: sheep }, { object: hen }, { object: bee }]
            answer: sheep
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Das Huhn legt Eier."
            say: "Stimmt das? Das Huhn legt Eier."
            show: { object: hen }
            answer: true
          - id: l1-c3
            type: multiple_choice
            text: "Was bekommen wir von der Kuh?"
            say: "Was bekommen wir von der Kuh?"
            show: { object: cow }
            options: ["Milch", "Eier", "Honig"]
            answer: "Milch"
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Tier ist ein Nutztier?"
            say: "Welches Tier ist ein Nutztier?"
            options: [{ object: pig }, { object: whale }, { object: monkey }]
            answer: pig
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Eier werden im Supermarkt gemacht."
            say: "Stimmt das? Eier werden im Supermarkt gemacht."
            show: { object: egg }
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Wer legt Eier?"
            say: "Setz das passende Tier ein."
            frame: "Das _ legt Eier."
            options: ["Huhn", "Schaf", "Schwein"]
            answer: ["Huhn"]

  - n: 2
    title: { de: "Wolle, Käse und Wurst", en: "Wool, cheese and sausage" }
    goal:
      de: "Finde heraus, was wir noch von den Tieren bekommen, so wie die Wolle vom Schaf."
      en: "Find out what else we get from the animals, like wool from the sheep."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Wer hat die Eier für das Frühstück gelegt?"
            say: "Wer hat die Eier für das Frühstück gelegt?"
            options: [{ object: hen }, { object: sheep }, { object: goat }]
            answer: hen
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Stimmt das? Auch Schafe geben Milch."
            say: "Stimmt das? Auch Schafe geben Milch."
            show: { object: sheep }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Woher kommt die Wolle für deinen Pullover?"
            say: "Heute hilft Mila im Hofladen von Onkel Jonas. Dort liegt ein warmer Pullover aus Wolle. Was glaubst du: Von welchem Tier kommt die Wolle?"
            show: { object: jumper }
          - text: "Die Wolle kommt vom Schaf."
            say: "Vom Schaf! Ein Schaf hat ein dickes Fell aus Wolle. Im Frühling schneidet Onkel Jonas die Wolle ab. Das heißt scheren. Es tut dem Schaf nicht weh, so wie Haareschneiden bei dir. Die Wolle wächst wieder nach."
            show: { objects: [sheep, jumper] }
          - text: "Aus Wolle strickt man Pullover, Mützen und Socken."
            say: "Aus der Wolle macht man Garn. Aus dem Garn strickt man Pullover, Mützen und Socken."
            show: { object: woolly-hat }
          - text: "Aus Milch macht man Käse, Butter, Joghurt und Quark."
            say: "Im Hofladen gibt es auch Käse, Butter, Joghurt und Quark. Das alles macht man aus Milch."
            show: { objects: [milk, cheese] }
          - text: "Wurst, Schinken und Schnitzel sind aus Fleisch."
            say: "Manche Nutztiere geben uns auch Fleisch. Wurst, Schinken und Schnitzel sind aus Fleisch. Das Fleisch kommt zum Beispiel vom Schwein, vom Rind oder vom Huhn. Rind sagt man zu Kühen und Stieren. Manche Menschen essen Fleisch, andere essen keins. Beides ist in Ordnung."
            show: { objects: [pig, sausage] }
          - text: "Ein Tier gibt uns oft mehr als eine Sache."
            say: "Ein Tier gibt uns oft mehr als eine Sache. Von der Kuh bekommen wir Milch und Fleisch. Vom Huhn Eier und Fleisch. Und vom Schaf Wolle, Milch und Fleisch."
            show: { objects: [cow, sheep] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: image_multiple_choice
                text: "Von welchem Tier kommt die Wolle für den Pullover?"
                say: "Von welchem Tier kommt die Wolle für den Pullover?"
                show: { object: jumper }
                options: [{ object: sheep }, { object: cow }, { object: pig }]
                answer: sheep
                feedback:
                  pig: "Ein Schwein hat nur kurze Borsten, keine Wolle. Die Wolle kommt vom Schaf."
                hints:
                  - "Welches Tier hat ein dickes, flauschiges Fell?"
                  - "Die Kuh gibt Milch. Das Schwein hat keine Wolle."
                  - "Die Wolle kommt vom Schaf."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Ist das aus Milch oder aus Wolle?"
                say: "Sortiere. Was ist aus Milch gemacht, was aus Wolle?"
                bins:
                  - { id: milch, show: { text: "aus Milch" }, say: "aus Milch" }
                  - { id: wolle, show: { text: "aus Wolle" }, say: "aus Wolle" }
                options:
                  - { object: jumper, bin: wolle }
                  - { object: cheese, bin: milch }
                  - { object: yoghurt, bin: milch }
                  - { object: woolly-hat, bin: wolle }
                hints:
                  - "Was kann man essen? Was kann man anziehen?"
                  - "Käse und Joghurt isst man. Pullover und Mütze zieht man an."
                  - "Käse und Joghurt sind aus Milch, Pullover und Mütze aus Wolle."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Beim Scheren tut es dem Schaf weh."
                say: "Stimmt das? Beim Scheren tut es dem Schaf weh."
                show: { object: sheep }
                answer: false
                hints:
                  - "Denk daran, wie es ist, wenn du zum Friseur gehst."
                  - "Die Wolle ist wie Haar. Sie wächst wieder nach."
                  - "Nein. Scheren ist wie Haareschneiden, es tut nicht weh."
              - id: l2-f4
                type: multiple_choice
                text: "Woraus ist Wurst gemacht?"
                say: "Woraus ist Wurst gemacht?"
                show: { object: sausage }
                options: ["aus Fleisch", "aus Wolle", "aus Honig"]
                answer: "aus Fleisch"
                feedback:
                  "aus Wolle": "Eine Wurst aus Wolle? Die würde ganz schön kratzen! Wurst ist aus Fleisch."
                hints:
                  - "Wurst, Schinken und Schnitzel gehören zusammen."
                  - "Sie kommen von Tieren wie dem Schwein."
                  - "Wurst ist aus Fleisch."
              - id: l2-f5
                type: matching
                text: "Wer gibt uns was?"
                say: "Verbinde jedes Tier mit dem, was es uns gibt."
                pairs:
                  - { left: { object: sheep }, right: { object: jumper } }
                  - { left: { object: hen }, right: { object: egg } }
                  - { left: { object: pig }, right: { object: sausage } }
                hints:
                  - "Fang mit dem Pullover an: Woher kommt die Wolle?"
                  - "Das Huhn legt etwas. Das Schwein gibt uns Fleisch."
                  - "Schaf und Pullover, Huhn und Ei, Schwein und Wurst."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Was bekommen wir vom Schwein?"
                say: "Was bekommen wir vom Schwein?"
                show: { object: pig }
                options: ["Fleisch", "Wolle", "Eier"]
                answer: "Fleisch"
                hints: ["Woraus ist Schinken gemacht?"]
              - id: l2-s2
                type: ordering
                text: "Vom Schaf zur Mütze. Was kommt zuerst?"
                say: "Vom Schaf zur Mütze. Leg die Karten in die richtige Reihenfolge."
                show: { object: sheep }
                options: ["Aus der Wolle macht man Garn.", "Aus dem Garn strickt man eine Mütze.", "Das Schaf wird geschoren."]
                slot_count: 3
                answer: ["Das Schaf wird geschoren.", "Aus der Wolle macht man Garn.", "Aus dem Garn strickt man eine Mütze."]
                hints: ["Zuerst braucht man die Wolle vom Schaf."]
              - id: l2-s3
                type: image_multiple_choice
                text: "Was ist aus Milch gemacht?"
                say: "Was ist aus Milch gemacht?"
                options: [{ object: cheese }, { object: bread }, { object: egg }]
                answer: cheese
                feedback:
                  bread: "Brot backt man aus Mehl. Das Mehl kommt vom Weizen."
                hints: ["Was gibt es im Hofladen neben Butter und Joghurt?"]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Das Huhn gibt uns Eier und Fleisch."
                say: "Stimmt das? Das Huhn gibt uns Eier und Fleisch."
                show: { object: hen }
                answer: true
                hints: ["Ein Tier gibt uns oft mehr als eine Sache."]
              - id: l2-s5
                type: fill_in_blank
                text: "Was macht man daraus?"
                say: "Setz die passenden Wörter ein."
                frame: "Aus Milch macht man _. Aus Wolle macht man _."
                options: ["Käse", "Socken", "Eier"]
                answer: ["Käse", "Socken"]
                hints: ["Das eine isst man, das andere zieht man an."]

          - support: none
            setting: in-context
            tasks:
              - id: l2-n1
                type: sorting
                text: "Mila räumt den Hofladen ein. Von welchem Tier kommt das?"
                say: "Mila räumt den Hofladen ein. Von welchem Tier kommt das? Sortiere."
                bins:
                  - { id: huhn, show: { object: hen }, say: "vom Huhn" }
                  - { id: schaf, show: { object: sheep }, say: "vom Schaf" }
                  - { id: biene, show: { object: bee }, say: "von der Biene" }
                options:
                  - { object: woolly-hat, bin: schaf }
                  - { object: honeycomb, bin: biene }
                  - { object: egg, bin: huhn }
                  - { object: jumper, bin: schaf }
              - id: l2-n2
                type: multiple_choice
                text: "Eine Frau fragt: „Habt ihr Schafskäse?“ Woraus ist Schafskäse gemacht?"
                say: "Eine Frau fragt: Habt ihr Schafskäse? Woraus ist Schafskäse gemacht?"
                show: { object: cheese }
                options: ["aus Schafsmilch", "aus Schafswolle", "aus Hühnereiern"]
                answer: "aus Schafsmilch"
              - id: l2-n3
                type: image_multiple_choice
                text: "Im Hofladen gibt es auch Wurst. Von welchem Tier kann das Fleisch kommen?"
                say: "Im Hofladen gibt es auch Wurst. Von welchem Tier kann das Fleisch kommen?"
                options: [{ object: pig }, { object: bee }, { object: butterfly }]
                answer: pig
                feedback:
                  bee: "Wurst von der Biene? Nein, Bienen machen Honig. Das Fleisch kommt vom Schwein."
              - id: l2-n4
                type: true_false
                text: "Ein Junge fragt: „Muss das Schaf für die Wolle sterben?“ Stimmt das?"
                say: "Ein Junge fragt: Muss das Schaf für die Wolle sterben? Stimmt das?"
                show: { object: sheep }
                answer: false
              - id: l2-n5
                type: fill_in_blank
