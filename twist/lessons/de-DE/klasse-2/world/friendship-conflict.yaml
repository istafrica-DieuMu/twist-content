# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
id: de-DE.world.friendship-conflict
skill: world.society.friendship-conflict
curriculum: de-DE
language: de
title:
  de: Streit fair lösen
  en: Sorting out an argument fairly
summary: >
  Lina and Ben in the Klasse 2b both want the skipping rope at break, and
  the next day both want the ball. Lesson 1 is about the quarrel itself:
  both children feel something strong; first say Stopp and breathe deeply,
  then say what you feel with an Ich-Botschaft ("Ich bin wütend, weil ...")
  instead of a Du-Botschaft ("Du bist gemein!"); hitting, pushing and
  name-calling make it worse. Lesson 2 solves it fairly: calm down, each
  tells their side while the other listens without interrupting, then
  look together for a solution both agree with (take turns, play
  together, share, say sorry). When someone is hit or hurt, fetch an
  adult at once; getting help is not telling tales. It ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Gemeinsam in der Klasse, en: Together in class }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.society.feelings-needs, world.society.class-rules]
  also_practises: []
  vocabulary: { de: [Streit, wütend, traurig, Stopp, Ich-Botschaft, Du-Botschaft, zuhören, ausreden, Lösung, fair, einverstanden, abwechseln, teilen, entschuldigen, Pausenaufsicht, Streitschlichter] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: feelings, what: { de: "Gefühle im Streit erkennen und mit einer Ich-Botschaft sagen", en: "recognising feelings in a quarrel and saying them with an I-message" } }
    - { id: listen, what: { de: "sich beruhigen, beide Seiten erzählen lassen und zuhören", en: "calming down, letting both sides tell their story and listening" } }
    - { id: solution, what: { de: "eine Lösung finden, mit der beide einverstanden sind, und wissen, wann man Hilfe holt", en: "finding a solution both agree with, and knowing when to fetch help" } }
  misconceptions:
    - id: hit-back
      what: Thinks hitting or shouting back is fine when the other child started it
      addressed: lesson 1 Learn says hitting, pushing and name-calling make a quarrel worse; l1-f2, l1-n2 and l1-n4; l2-c6 in the skill check
    - id: du-botschaft
      what: Blames the other child ("Du bist doof!") instead of saying what they feel
      addressed: lesson 1 Learn sets the Ich-Botschaft against the Du-Botschaft; l1-f3, l1-s1, l1-s4, l1-n1 and l1-n5; l2-c2, l2-c3 and l2-c4 in the skill check
    - id: winner-takes-all
      what: Thinks a quarrel is solved when one child wins, or the stronger or louder one gets the thing
      addressed: lesson 2 Learn says a solution is fair when both agree; l2-f2, l2-f4, l2-n3 and l2-n4, with feedback on l2-f2; l2-c13, l2-c14, l2-c17 and l2-c19 in the skill check
    - id: help-is-telling-tales
      what: Thinks fetching an adult is petzen and keeps quiet when someone is hurt
      addressed: lesson 2 Learn says getting help is not telling tales; l2-f5, l2-s5 and l2-n1; l2-c16 and l2-c18 in the skill check
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Wenn es Streit gibt", en: "When there is a quarrel" }
    goal:
      de: "Lerne, was du tun kannst, wenn du im Streit wütend bist. Sag Stopp, atme tief durch und sag dann, wie du dich fühlst."
      en: "Learn what you can do when you are angry in a quarrel. Say stop, take a deep breath and then say how you feel."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Mia lacht und hüpft. Wie fühlt sie sich?"
            say: "Mia lacht und hüpft. Wie fühlt sie sich?"
            options: [{ object: happy }, { object: sad }, { object: angry }]
            answer: happy
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Warum gibt es Regeln in der Klasse?"
            say: "Warum gibt es Regeln in der Klasse?"
            options: ["damit alle gut zusammen lernen und spielen können", "damit es langweilig wird", "damit nur die Großen bestimmen"]
            answer: "damit alle gut zusammen lernen und spielen können"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina und Ben wollen beide das Springseil. Wie geht es weiter?"
            say: "In der Pause wollen Lina und Ben beide mit dem Springseil spielen. Ben reißt Lina das Seil aus der Hand. Lina ruft: Du bist so gemein! Was glaubst du: Wie geht es jetzt weiter?"
            show: { object: rope }
          - text: "Im Streit haben beide starke Gefühle."
            say: "Jetzt streiten die beiden. Lina ist wütend. Ben ist auch wütend, und ein bisschen traurig, weil er so gern springen wollte. In einem Streit fühlen meistens beide etwas Starkes."
            show: { objects: [angry, sad] }
          - text: "Erst Stopp sagen, dann tief durchatmen."
            say: "Wenn die Wut ganz groß ist, sagst du zuerst laut Stopp. Dann atmest du ein paarmal tief ein und aus. So wirst du ruhiger. Hauen, schubsen und beschimpfen machen den Streit nur schlimmer, auch wenn der andere angefangen hat."
            show: { object: hand }
          - text: "Ich-Botschaft: „Ich bin wütend, weil du mir das Seil weggenommen hast.“"
            say: "Danach sagt Lina, wie sie sich fühlt und warum. Ich bin wütend, weil du mir das Seil weggenommen hast. Ein Satz, der mit Ich anfängt und ein Gefühl sagt, heißt Ich-Botschaft. So versteht Ben, was los ist."
            show: { object: angry }
          - text: "Du-Botschaft: „Du bist so gemein!“"
            say: "Du bist so gemein! ist eine Du-Botschaft. Sie schimpft nur über den anderen. Dann wird der andere meistens noch wütender. Also: erst Stopp, dann tief atmen, dann eine Ich-Botschaft."
            show: { object: sad }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Ben hat Lina das Seil weggerissen. Wie fühlt sich Lina?"
                say: "Ben hat Lina das Seil weggerissen. Wie fühlt sich Lina?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
                feedback:
                  happy: "Freut sich Lina, wenn ihr jemand etwas wegreißt? Eher nicht. Sie ist wütend."
                hints:
                  - "Stell dir vor, dir reißt jemand etwas aus der Hand."
                  - "Lina hat nicht gelacht. Sie hat gerufen: Du bist so gemein!"
                  - "Lina ist wütend."
                difficulty: easy
              - id: l1-f2
                type: true_false
                text: "Stimmt das? Wenn ich wütend bin, darf ich hauen."
                say: "Stimmt das? Wenn ich wütend bin, darf ich hauen."
                answer: false
                hints:
                  - "Was passiert mit einem Streit, wenn jemand haut?"
                  - "Hauen tut weh und macht den Streit schlimmer."
                  - "Nein. Auch wenn du wütend bist, haust du nicht."
              - id: l1-f3
                type: sorting
                text: "Ich-Botschaft oder Du-Botschaft?"
                say: "Sortiere die Sätze. Welche sind Ich-Botschaften, welche Du-Botschaften?"
                bins:
                  - { id: ich, show: { text: "Ich-Botschaft" }, say: "Ich-Botschaft" }
                  - { id: du, show: { text: "Du-Botschaft" }, say: "Du-Botschaft" }
                options:
                  - { text: "Ich bin traurig, weil du mich nicht mitspielen lässt.", bin: ich }
                  - { text: "Du bist doof!", bin: du }
                  - { text: "Ich ärgere mich, weil mein Bild kaputt ist.", bin: ich }
                  - { text: "Du machst immer alles kaputt!", bin: du }
                hints:
                  - "Schau, mit welchem Wort der Satz anfängt."
                  - "Eine Ich-Botschaft sagt ein Gefühl und warum. Eine Du-Botschaft schimpft über den anderen."
                  - "Die Sätze mit traurig und ärgere sind Ich-Botschaften, die anderen zwei Du-Botschaften."
              - id: l1-f4
                type: multiple_choice
                text: "Der Streit wird laut. Was macht Lina zuerst?"
                say: "Der Streit wird immer lauter. Was macht Lina zuerst?"
                options: ["Sie sagt Stopp und atmet tief durch.", "Sie schreit noch lauter.", "Sie schubst Ben."]
                answer: "Sie sagt Stopp und atmet tief durch."
                feedback:
                  "Sie schreit noch lauter.": "Dann schreit Ben auch lauter, und am Ende hält sich die ganze Klasse die Ohren zu. Erst Stopp sagen hilft."
                hints:
                  - "Was hilft, damit die Wut kleiner wird?"
                  - "Schreien und schubsen machen den Streit schlimmer."
                  - "Lina sagt Stopp und atmet tief durch."
              - id: l1-f5
                type: fill_in_blank
                text: "Lina sagt eine Ich-Botschaft."
                say: "Hilf Lina bei ihrer Ich-Botschaft. Setz die passenden Wörter ein."
                frame: "_ bin wütend, _ du mir das Seil weggenommen hast."
                options: ["Ich", "weil", "Du"]
                answer: ["Ich", "weil"]
                hints:
                  - "Eine Ich-Botschaft fängt mit einem bestimmten Wort an."
                  - "Erst kommt das Gefühl, dann sagt Lina, warum."
                  - "Ich bin wütend, weil du mir das Seil weggenommen hast."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welcher Satz ist eine Ich-Botschaft?"
                say: "Welcher Satz ist eine Ich-Botschaft?"
                options: ["Ich fühle mich ausgelacht, und das tut mir weh.", "Du lachst immer alle aus!", "Ihr seid alle blöd!"]
                answer: "Ich fühle mich ausgelacht, und das tut mir weh."
                hints: ["Eine Ich-Botschaft sagt, wie ich mich fühle."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Bens Turm ist umgefallen, und Ben weint. Wie fühlt er sich?"
                say: "Bens Turm ist umgefallen, und Ben weint. Wie fühlt er sich?"
                options: [{ object: sad }, { object: happy }, { object: tired }]
                answer: sad
                hints: ["Wer weint, ist oft ..."]
              - id: l1-s3
                type: true_false
                text: "Stimmt das? Bei einem Streit sind oft beide Kinder wütend oder traurig."
                say: "Stimmt das? Bei einem Streit sind oft beide Kinder wütend oder traurig."
                answer: true
                hints: ["Denk an Lina und Ben: Wer hatte starke Gefühle?"]
              - id: l1-s4
                type: sorting
                text: "Macht das den Streit besser oder schlimmer?"
                say: "Sortiere. Was macht den Streit besser, was macht ihn schlimmer?"
                bins:
                  - { id: besser, show: { text: "besser" }, say: "besser" }
                  - { id: schlimmer, show: { text: "schlimmer" }, say: "schlimmer" }
                options:
                  - { text: "Stopp sagen", bin: besser }
                  - { text: "hauen", bin: schlimmer }
                  - { text: "eine Ich-Botschaft sagen", bin: besser }
                  - { text: "beschimpfen", bin: schlimmer }
                hints: ["Was tut niemandem weh?"]
              - id: l1-s5
                type: ordering
                text: "Lina ist wütend. Was macht sie der Reihe nach?"
                say: "Lina ist wütend. Was macht sie zuerst, was danach? Leg die Karten in die richtige Reihenfolge."
                options: ["Sie sagt eine Ich-Botschaft.", "Sie sagt Stopp.", "Sie atmet tief durch."]
                slot_count: 3
                answer: ["Sie sagt Stopp.", "Sie atmet tief durch.", "Sie sagt eine Ich-Botschaft."]
                hints: ["Erst muss die Wut kleiner werden, dann redet Lina."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Paul ruft Emma zu: „Du bist so blöd!“ Was hätte er besser gesagt?"
                say: "Paul ruft Emma zu: Du bist so blöd! Was hätte er besser gesagt?"
                options: ["„Ich bin sauer, weil du meinen Stift genommen hast.“", "„Und du bist noch blöder!“", "gar nichts, und Emma später schubsen"]
                answer: "„Ich bin sauer, weil du meinen Stift genommen hast.“"
              - id: l1-n2
                type: true_false
                text: "Ben hat zuerst geschubst. Darf Lina jetzt zurückschubsen?"
                say: "Ben hat zuerst geschubst. Darf Lina jetzt zurückschubsen?"
                answer: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Lina und Ben haben sich wieder vertragen. Wie fühlen sie sich jetzt?"
                say: "Lina und Ben haben sich wieder vertragen. Wie fühlen sie sich jetzt?"
                options: [{ object: happy }, { object: angry }, { object: scared }]
                answer: happy
              - id: l1-n4
                type: sorting
                text: "Emma und Paul streiten. Was hilft, was macht es schlimmer?"
                say: "Emma und Paul streiten um einen Stift. Was hilft, was macht es schlimmer? Sortiere."
                bins:
                  - { id: hilft, show: { text: "hilft" }, say: "hilft" }
                  - { id: schlimmer, show: { text: "macht es schlimmer" }, say: "macht es schlimmer" }
                options:
                  - { text: "tief durchatmen", bin: hilft }
                  - { text: "den Stift wegwerfen", bin: schlimmer }
                  - { text: "„Ich bin wütend, weil ...“", bin: hilft }
                  - { text: "Emma auslachen", bin: schlimmer }
              - id: l1-n5
                type: fill_in_blank
                text: "Emma schreibt Paul einen Zettel."
                say: "Emma schreibt Paul einen Zettel mit einer Ich-Botschaft. Setz das passende Wort ein."
                frame: "Ich bin _, weil du mich nicht mitspielen lässt."
                options: ["traurig", "fröhlich", "müde"]
                answer: ["traurig"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: image_multiple_choice
            text: "Jemand zerreißt mit Absicht dein Bild. Wie fühlst du dich?"
            say: "Jemand zerreißt mit Absicht dein Bild. Wie fühlst du dich?"
            options: [{ object: angry }, { object: happy }, { object: tired }]
            answer: angry
          - id: l1-c2
            type: true_false
            text: "Stimmt das? „Du bist doof!“ ist eine Ich-Botschaft."
            say: "Stimmt das? Du bist doof, ist eine Ich-Botschaft."
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Was hilft, wenn du sehr wütend bist?"
            say: "Was hilft, wenn du sehr wütend bist?"
            options: ["Stopp sagen und tief durchatmen", "etwas kaputt machen", "den anderen anschreien"]
            answer: "Stopp sagen und tief durchatmen"
          - id: l1-c4
            type: multiple_choice
            text: "Welcher Satz ist eine Ich-Botschaft?"
            say: "Welcher Satz ist eine Ich-Botschaft?"
            options: ["Ich bin traurig, weil du nicht mit mir spielst.", "Du spielst nie mit mir!", "Du bist gemein!"]
            answer: "Ich bin traurig, weil du nicht mit mir spielst."
          - id: l1-c5
            type: true_false
            text: "Stimmt das? Nach einem Streit kann man sich wieder vertragen."
            say: "Stimmt das? Nach einem Streit kann man sich wieder vertragen."
            answer: true
          - id: l1-c6
            type: ordering
            text: "Du bist wütend. Was kommt zuerst?"
            say: "Du bist wütend. Leg die Karten in die richtige Reihenfolge."
            options: ["eine Ich-Botschaft sagen", "tief durchatmen", "Stopp sagen"]
            slot_count: 3
            answer: ["Stopp sagen", "tief durchatmen", "eine Ich-Botschaft sagen"]

  - n: 2
    title: { de: "Gemeinsam eine Lösung finden", en: "Finding a solution together" }
    goal:
      de: "Lerne, wie ihr einen Streit fair löst. Jeder erzählt, der andere hört zu, und dann sucht ihr eine Lösung, mit der beide einverstanden sind."
      en: "Learn how to sort out a quarrel fairly. Each of you tells your side, the other listens, and then you look for a solution you both agree with."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: image_multiple_choice
            text: "Ben hat Linas Turm umgeworfen. Wie fühlt sich Lina?"
            say: "Ben hat Linas Turm mit Absicht umgeworfen. Wie fühlt sich Lina?"
            options: [{ object: angry }, { object: happy }, { object: tired }]
            answer: angry
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Satz ist eine Ich-Botschaft?"
            say: "Welcher Satz ist eine Ich-Botschaft?"
            options: ["Ich bin wütend, weil mein Turm kaputt ist.", "Du machst alles kaputt!", "Du Tollpatsch!"]
            answer: "Ich bin wütend, weil mein Turm kaputt ist."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Lina und Ben wollen beide den Ball. Wie lösen sie den Streit fair?"
            say: "Am nächsten Tag wollen Lina und Ben in der Pause beide den Ball. Diesmal wollen sie es besser machen. Was glaubst du: Wie können sie den Streit fair lösen?"
            show: { object: ball }
          - text: "Erst beruhigen sich beide. Dann erzählt jeder, und der andere hört zu."
            say: "Zuerst beruhigen sich beide. Dann erzählt Lina, was passiert ist und wie sie sich fühlt. Ben hört zu und unterbricht sie nicht. Danach erzählt Ben, und Lina hört zu. So verstehen beide die andere Seite."
            show: { object: listen }
          - text: "Dann suchen beide zusammen eine Lösung."
            say: "Jetzt suchen sie zusammen eine Lösung. Fair ist eine Lösung, wenn beide damit einverstanden sind. Lina und Ben wechseln sich ab: Erst spielt Lina, dann Ben. Sie könnten auch zusammen spielen. Etwas zu essen kann man teilen."
            show: { object: ball }
          - text: "Wer etwas falsch gemacht hat, entschuldigt sich."
            say: "Ben sagt: Entschuldigung, dass ich dir gestern das Seil weggerissen habe. Lina sagt: Okay. Danke. Nach einem Streit kann man sich wieder vertragen."
            show: { object: happy }
          - text: "Wenn jemand verletzt wird: sofort Hilfe holen. Das ist kein Petzen."
            say: "Manchmal klappt es nicht allein. Wenn jemand gehauen oder verletzt wird, holst du sofort einen Erwachsenen, zum Beispiel die Lehrerin oder die Pausenaufsicht. An manchen Schulen helfen auch Streitschlichter, das sind ältere Kinder. Hilfe holen ist kein Petzen."
            show: { object: teacher }
          - text: "Wusstest du? Auch Schimpansen vertragen sich nach einem Streit wieder."
            say: "Wusstest du? Auch Schimpansen vertragen sich nach einem Streit wieder. Sie umarmen sich dann oder geben sich einen Kuss."
            show: { object: monkey }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: ordering
                text: "So löst ihr einen Streit. Was kommt zuerst?"
                say: "So löst ihr einen Streit. Leg die Karten in die richtige Reihenfolge."
                options: ["zusammen eine Lösung suchen", "jeder erzählt, der andere hört zu", "sich beruhigen"]
                slot_count: 3
                answer: ["sich beruhigen", "jeder erzählt, der andere hört zu", "zusammen eine Lösung suchen"]
                hints:
                  - "Wer sehr wütend ist, kann nicht gut zuhören."
                  - "Erst wird die Wut kleiner. Dann muss man wissen, was passiert ist."
                  - "Sich beruhigen, dann erzählen und zuhören, dann eine Lösung suchen."
              - id: l2-f2
                type: multiple_choice
                text: "Lina und Ben wollen beide den Ball. Welche Lösung ist fair?"
                say: "Lina und Ben wollen beide den Ball. Welche Lösung ist fair?"
                options: ["Sie wechseln sich ab: erst Lina, dann Ben.", "Ben bekommt ihn, weil er stärker ist.", "Wer lauter schreit, bekommt ihn."]
                answer: "Sie wechseln sich ab: erst Lina, dann Ben."
                feedback:
                  "Wer lauter schreit, bekommt ihn.": "Dann gewinnt, wer die lauteste Stimme hat, und alle haben Ohrenschmerzen. Fair ist es, wenn beide einverstanden sind."
                hints:
                  - "Fair ist eine Lösung, wenn beide damit einverstanden sind."
                  - "Wäre Lina einverstanden, wenn der Stärkere den Ball bekommt?"
                  - "Sie wechseln sich ab: erst Lina, dann Ben."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? Wenn Ben erzählt, darf Lina ihn unterbrechen."
                say: "Stimmt das? Wenn Ben erzählt, darf Lina ihn unterbrechen."
                answer: false
                hints:
                  - "Wie fühlst du dich, wenn dich jemand beim Erzählen unterbricht?"
                  - "Einer erzählt, der andere hört zu. Danach wird getauscht."
                  - "Nein. Lina hört zu, bis Ben fertig ist."
              - id: l2-f4
                type: sorting
                text: "Fair oder nicht fair?"
                say: "Sortiere die Lösungen. Welche sind fair, welche nicht?"
                bins:
                  - { id: fair, show: { text: "fair" }, say: "fair" }
                  - { id: unfair, show: { text: "nicht fair" }, say: "nicht fair" }
                options:
                  - { text: "zusammen spielen", bin: fair }
                  - { text: "der Stärkere bestimmt", bin: unfair }
                  - { text: "sich abwechseln", bin: fair }
                  - { text: "einfach wegnehmen", bin: unfair }
                hints:
                  - "Frag dich bei jeder Karte: Sind beide Kinder damit einverstanden?"
                  - "Wenn einer bestimmt oder wegnimmt, ist der andere nicht einverstanden."
                  - "Zusammen spielen und sich abwechseln sind fair."
              - id: l2-f5
                type: multiple_choice
                text: "Wann holst du sofort einen Erwachsenen?"
                say: "Wann holst du sofort einen Erwachsenen?"
                options: ["wenn jemand gehauen oder verletzt wird", "wenn ihr euch gut geeinigt habt", "wenn ihr zusammen lacht"]
                answer: "wenn jemand gehauen oder verletzt wird"
                hints:
                  - "Bei manchen Dingen könnt ihr Kinder nicht allein helfen."
                  - "Wenn jemand Schmerzen hat, braucht ihr Hilfe."
                  - "Wenn jemand gehauen oder verletzt wird."

          - support: some
            tasks:
              - id: l2-s1
                type: true_false
                text: "Stimmt das? Eine Lösung ist fair, wenn beide damit einverstanden sind."
                say: "Stimmt das? Eine Lösung ist fair, wenn beide damit einverstanden sind."
                answer: true
                hints: ["Bei einer fairen Lösung ist keiner traurig zurückgelassen."]
              - id: l2-s2
                type: multiple_choice
                text: "Lina erzählt, was passiert ist. Was macht Ben?"
                say: "Lina erzählt, was passiert ist. Was macht Ben?"
                options: ["Er hört zu und lässt sie ausreden.", "Er hält sich die Ohren zu.", "Er ruft dazwischen."]
                answer: "Er hört zu und lässt sie ausreden."
                hints: ["Ben will verstehen, wie es Lina geht."]
              - id: l2-s3
                type: matching
                text: "Welche Lösung passt zu welchem Streit?"
                say: "Verbinde jeden Streit mit einer fairen Lösung."
                pairs:
                  - { left: { text: "Beide wollen zuerst schaukeln." }, right: { text: "Sie wechseln sich ab." } }
                  - { left: { text: "Beide wollen das letzte Stück Kuchen." }, right: { text: "Sie teilen es." } }
                  - { left: { text: "Ben hat Linas Stift kaputt gemacht." }, right: { text: "Er entschuldigt sich und leiht ihr seinen." } }
