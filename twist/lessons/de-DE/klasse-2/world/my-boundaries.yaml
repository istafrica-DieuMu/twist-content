# Lesson set: Sachunterricht, Klasse 2. Hand-authored draft.
# No explicit visuals (docs/lesson-anatomy.md, Authoring checks): this set
# teaches with everyday situations and feelings only. No picture, task or
# line describes or shows touch or undress.
id: de-DE.world.my-boundaries
skill: world.body.my-boundaries
curriculum: de-DE
language: de
title:
  de: Nein sagen und Hilfe holen
  en: Saying no and getting help
summary: >
  Lea and her friends Tarek and Finn meet everyday situations at school
  and on the playground. Lesson 1: a yes feeling is warm and happy, a no
  feeling is a strange feeling in the tummy that says "I don't want
  this"; with a no feeling you may say "Nein! Stopp!" loudly and clearly,
  to adults and people you know too; not feeling like tidying up is not a
  no feeling; and when someone else says stop, you stop at once. Lesson
  2: good secrets (a surprise cake, a present) are fun and come out soon;
  bad secrets make you scared and you may always tell them, even after a
  promise; getting help is not telling tales and it is never your fault;
  tell a trusted adult, and if one does not listen, the next one; the
  Nummer gegen Kummer 116 111 is free. Situations are a diary, a
  nickname, a toy, a photo, a snack taken away; nothing shows or
  describes touch. It ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Mein Körper gehört mir, en: My body belongs to me }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [world.society.feelings-needs]
  also_practises: []
  vocabulary: { de: [Ja-Gefühl, Nein-Gefühl, Grenze, Stopp, Geheimnis, Hilfe holen, vertrauen] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: feelings, what: { de: "Ja-Gefühle und Nein-Gefühle erkennen", en: recognising yes feelings and no feelings } }
    - { id: say-no, what: { de: "laut und deutlich Nein sagen", en: saying no loudly and clearly } }
    - { id: respect, what: { de: "das Nein und Stopp der anderen achten", en: respecting other people's no and stop } }
    - { id: secrets, what: { de: "gute und schlechte Geheimnisse unterscheiden", en: telling good secrets from bad secrets } }
    - { id: help, what: { de: "wissen, wem ich mich anvertrauen kann", en: knowing who I can tell } }
  misconceptions:
    - id: never-no-to-adults
      what: Thinks children may never say no to adults or to people they know
      addressed: lesson 1 Learn on saying no; l1-s1; l2-c8 in the skill check
    - id: no-feeling-is-no-mood
      what: Mixes up a no feeling with not feeling like a chore
      addressed: lesson 1 Learn, last screen; l1-s5
    - id: keep-every-secret
      what: Thinks every secret must be kept, because a promise is a promise
      addressed: lesson 2 Learn on bad secrets; l2-f2, l2-n2; l2-c14 in the skill check
    - id: telling-is-tattling
      what: Thinks telling a bad secret is tattling (petzen)
      addressed: lesson 2 Learn; l2-f5 and l2-s1; l2-c18 in the skill check
    - id: own-fault
      what: Thinks it is their own fault when someone gives them a bad secret
      addressed: lesson 2 Learn says it is never your fault; l2-s5
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-25

lessons:
  - n: 1
    title: { de: "Ja-Gefühl und Nein-Gefühl", en: "Yes feelings and no feelings" }
    goal:
      de: "Hör auf dein Bauchgefühl und sag laut Nein, wenn du etwas nicht willst, so wie Lea bei ihrem Tagebuch."
      en: "Listen to your tummy feeling and say no out loud when you don't want something, like Lea with her diary."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: image_multiple_choice
            text: "Welches Kind ist traurig?"
            say: "Welches Kind ist traurig?"
            options: [{ object: sad }, { object: happy }, { object: angry }]
            answer: sad
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Tom fürchtet sich im Dunkeln. Welches Gefühl hat er?"
            say: "Tom fürchtet sich im Dunkeln. Welches Gefühl hat er?"
            options: ["Angst", "Freude", "Wut"]
            answer: "Angst"
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Wie fühlt sich Lea jetzt?"
            say: "Lea schreibt in ihr neues Tagebuch. Ein Kind aus der Nachbarschaft sagt: Gib her, ich will lesen, was da drinsteht! Lea möchte das nicht. Was glaubst du: Wie fühlt sich Lea jetzt?"
            show: { object: book }
          - text: "Ein Nein-Gefühl sagt: Das will ich nicht."
            say: "Lea hat ein komisches Gefühl im Bauch. Das ist ein Nein-Gefühl. Es sagt: Das will ich nicht. Ein Ja-Gefühl ist warm und froh, zum Beispiel wenn du mit Freunden lachst. Dein Bauchgefühl hilft dir zu merken, was dir guttut."
            show: { objects: [happy, scared] }
          - text: "Du darfst Nein sagen: laut und deutlich."
            say: "Wenn du ein Nein-Gefühl hast, darfst du Nein sagen. Laut und deutlich: Nein! Stopp! Das will ich nicht! Lea sagt: Nein, mein Tagebuch ist privat! Nein sagen darfst du auch zu Erwachsenen und zu Menschen, die du gut kennst."
            show: { object: book }
          - text: "Wer Stopp hört, hört sofort auf."
            say: "Auch andere dürfen Nein sagen. Tarek macht Witze über Finns neue Brille. Finn sagt: Stopp, das mag ich nicht. Da hört Tarek sofort auf. Wer Stopp hört, hört auf. So achten wir die Grenzen der anderen."
            show: { object: glasses }
          - text: "Nein sagen ist mutig. Und wenn es nicht hilft, holst du Hilfe."
            say: "Nein sagen, wenn du ein Nein-Gefühl hast, ist nicht frech. Es ist mutig. Und wenn dein Nein nicht hilft, holst du dir Hilfe bei einem Erwachsenen."
            show: { object: happy }
          - text: "Keine Lust ist kein Nein-Gefühl."
            say: "Aber Achtung: Keine Lust zum Aufräumen oder Zähneputzen ist kein Nein-Gefühl. Das musst du trotzdem machen. Ein Nein-Gefühl kommt, wenn sich etwas falsch oder unheimlich anfühlt."
            show: { object: toothbrush }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: image_multiple_choice
                text: "Welches Kind hat ein Ja-Gefühl?"
                say: "Welches Kind hat ein Ja-Gefühl?"
                options: [{ object: happy }, { object: scared }, { object: sad }]
                answer: happy
                hints:
                  - "Ein Ja-Gefühl ist warm und froh."
                  - "Welches Kind lacht?"
                  - "Das fröhliche Kind hat ein Ja-Gefühl."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Ja-Gefühl oder Nein-Gefühl?"
                say: "Sortiere. Wobei hast du ein Ja-Gefühl, wobei ein Nein-Gefühl?"
                bins:
                  - { id: ja, show: { text: "Ja-Gefühl" }, say: "Ja-Gefühl" }
                  - { id: nein, show: { text: "Nein-Gefühl" }, say: "Nein-Gefühl" }
                options:
                  - { text: "Ich lache mit meinen Freunden.", bin: ja }
                  - { text: "Jemand liest heimlich mein Tagebuch.", bin: nein }
                  - { text: "Ein Kind lacht mich aus.", bin: nein }
                  - { text: "Oma liest mir eine Geschichte vor.", bin: ja }
                hints:
                  - "Frag dich bei jeder Karte: Fühlt sich das warm und froh an?"
                  - "Ausgelacht werden und heimlich gelesen werden fühlt sich komisch an."
                  - "Lachen mit Freunden und Omas Geschichte sind Ja-Gefühle, die anderen zwei Nein-Gefühle."
              - id: l1-f3
                type: multiple_choice
                text: "Was sagst du, wenn du etwas nicht willst?"
                say: "Was sagst du, wenn du etwas nicht willst?"
                options: ["Nein! Stopp! Das will ich nicht.", "Ich sage lieber gar nichts.", "Na gut, vielleicht."]
                answer: "Nein! Stopp! Das will ich nicht."
                hints:
                  - "Denk an Lea und ihr Tagebuch."
                  - "Ein Nein soll laut und deutlich sein, damit der andere es versteht."
                  - "Nein! Stopp! Das will ich nicht."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? Wenn jemand Stopp sagt, höre ich sofort auf."
                say: "Stimmt das? Wenn jemand Stopp sagt, höre ich sofort auf."
                answer: true
                hints:
                  - "Denk an Tarek und Finn."
                  - "Auch andere dürfen Nein sagen."
                  - "Ja. Wer Stopp hört, hört sofort auf."
              - id: l1-f5
                type: multiple_choice
                text: "Tarek will mit Finns neuem Ball spielen. Finn sagt Nein. Was macht Tarek?"
                say: "Tarek will mit Finns neuem Ball spielen. Finn sagt Nein. Was macht Tarek?"
                options: ["Er fragt ein anderes Kind oder wartet.", "Er nimmt sich den Ball trotzdem.", "Er schimpft so lange, bis Finn Ja sagt."]
                answer: "Er fragt ein anderes Kind oder wartet."
                hints:
                  - "Finns Nein gilt, auch wenn Tarek gern spielen möchte."
                  - "Tarek achtet Finns Grenze. Was kann er dann tun?"
                  - "Er fragt ein anderes Kind oder wartet."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Stimmt das? Auch zu Erwachsenen darf ich Nein sagen, wenn ich ein Nein-Gefühl habe."
                say: "Stimmt das? Auch zu Erwachsenen darf ich Nein sagen, wenn ich ein Nein-Gefühl habe."
                answer: true
                hints: ["Ein Nein-Gefühl zählt immer, egal wer etwas von dir will."]
              - id: l1-s2
                type: image_multiple_choice
                text: "Finn hat Stopp gesagt, und Tarek hat sofort aufgehört. Wie fühlt sich Finn jetzt?"
                say: "Finn hat Stopp gesagt, und Tarek hat sofort aufgehört. Wie fühlt sich Finn jetzt?"
                options: [{ object: happy }, { object: scared }, { object: angry }]
                answer: happy
                hints: ["Finns Stopp wurde gehört. Das fühlt sich gut an."]
              - id: l1-s3
                type: sorting
                text: "Achtet das Kind die Grenze?"
                say: "Sortiere. Wer achtet die Grenze des anderen, wer nicht?"
                bins:
                  - { id: ja, show: { text: "achtet die Grenze" }, say: "achtet die Grenze" }
                  - { id: nein, show: { text: "achtet sie nicht" }, say: "achtet sie nicht" }
                options:
                  - { text: "Ella fragt: „Darf ich deinen Stift nehmen?“", bin: ja }
                  - { text: "Jan liest Leas Brief, obwohl sie Nein sagt.", bin: nein }
                  - { text: "Max hört nach dem Stopp sofort auf.", bin: ja }
                  - { text: "Mia ruft weiter Spitznamen, obwohl Ben Stopp sagt.", bin: nein }
                hints: ["Wer fragt oder nach einem Stopp aufhört, achtet die Grenze."]
              - id: l1-s4
                type: fill_in_blank
                text: "Mein Bauchgefühl"
                say: "Setz die passenden Wörter ein."
                frame: "Ein komisches Gefühl im Bauch ist ein _. Dann darf ich _ sagen."
                options: ["Nein-Gefühl", "Nein", "Ja-Gefühl"]
                answer: ["Nein-Gefühl", "Nein"]
                hints: ["Ein Ja-Gefühl ist warm und froh, nicht komisch."]
              - id: l1-s5
                type: multiple_choice
                text: "Lea hat keine Lust, ihr Zimmer aufzuräumen. Ist das ein Nein-Gefühl?"
                say: "Lea hat keine Lust, ihr Zimmer aufzuräumen. Ist das ein Nein-Gefühl?"
                options: ["Nein, das ist nur keine Lust.", "Ja, dann muss sie nie mehr aufräumen.", "Ja, dann räumt ihr Teddy auf."]
                answer: "Nein, das ist nur keine Lust."
                hints: ["Ein Nein-Gefühl kommt, wenn sich etwas falsch oder unheimlich anfühlt."]

          - support: none
            setting: in-context
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "In der Pause ruft ein Kind immer wieder „Brillenschlange“ zu Finn. Was kann Finn tun?"
                say: "In der Pause ruft ein Kind immer wieder Brillenschlange zu Finn. Was kann Finn tun?"
                options: ["laut „Stopp, hör auf!“ sagen und Hilfe holen", "nie mehr in die Pause gehen", "so tun, als ob alles gut ist"]
                answer: "laut „Stopp, hör auf!“ sagen und Hilfe holen"
              - id: l1-n2
                type: true_false
                text: "Tarek möchte Leas Tagebuch lesen. Lea sagt: „Nein!“ Tarek liest trotzdem. Achtet er Leas Grenze?"
                say: "Tarek möchte Leas Tagebuch lesen. Lea sagt: Nein! Tarek liest trotzdem. Achtet er Leas Grenze?"
                answer: false
              - id: l1-n3
                type: sorting
                text: "Was sagst du? Ja oder Nein?"
                say: "Sortiere. Wann sagst du: Ja, gern? Wann sagst du: Nein, das will ich nicht?"
                bins:
                  - { id: ja, show: { text: "Ja, gern!" }, say: "Ja, gern!" }
                  - { id: nein, show: { text: "Nein, das will ich nicht." }, say: "Nein, das will ich nicht." }
                options:
                  - { text: "Deine Freundin fragt: „Spielst du mit uns Fußball?“ Du hast Lust.", bin: ja }
                  - { text: "Ein fremder Mann sagt: „Komm mit, ich zeig dir junge Kätzchen.“", bin: nein }
                  - { text: "Ein Kind will dich mit dem Tablet filmen. Du willst das nicht.", bin: nein }
                  - { text: "Dein Opa fragt: „Malst du mit mir ein Bild?“ Du hast Lust.", bin: ja }
              - id: l1-n4
                type: multiple_choice
                text: "Ein Kind sagt zu Lea: „Gib mir deine Kekse, sonst darfst du nicht mitspielen.“ Was hat Lea wohl für ein Gefühl?"
                say: "Ein Kind sagt zu Lea: Gib mir deine Kekse, sonst darfst du nicht mitspielen. Was hat Lea wohl für ein Gefühl?"
                options: ["ein Nein-Gefühl", "ein Ja-Gefühl", "gar kein Gefühl"]
                answer: "ein Nein-Gefühl"
              - id: l1-n5
                type: fill_in_blank
                text: "Lea sagt laut und deutlich ..."
                say: "Lea sagt laut und deutlich ihre Meinung. Setz das passende Wort ein."
                frame: "„_! Das will ich nicht.“"
                options: ["Stopp", "Danke", "Vielleicht"]
                answer: ["Stopp"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was ist ein Ja-Gefühl?"
            say: "Was ist ein Ja-Gefühl?"
            options: ["ein warmes, frohes Gefühl", "ein komisches Gefühl im Bauch", "ein Gefühl, wenn man sich fürchtet"]
            answer: "ein warmes, frohes Gefühl"
          - id: l1-c2
            type: true_false
            text: "Stimmt das? Ich darf Nein sagen, wenn sich etwas nicht gut anfühlt."
            say: "Stimmt das? Ich darf Nein sagen, wenn sich etwas nicht gut anfühlt."
            answer: true
          - id: l1-c3
            type: true_false
            text: "Stimmt das? Wenn ein Kind Stopp sagt, mache ich einfach weiter."
            say: "Stimmt das? Wenn ein Kind Stopp sagt, mache ich einfach weiter."
            answer: false
          - id: l1-c4
            type: image_multiple_choice
            text: "Welches Kind hat Angst?"
            say: "Welches Kind hat Angst?"
            options: [{ object: scared }, { object: happy }, { object: tired }]
            answer: scared
          - id: l1-c5
            type: multiple_choice
            text: "Wie sagst du Nein?"
            say: "Wie sagst du Nein?"
            options: ["laut und deutlich", "ganz leise in mein Kissen", "gar nicht"]
            answer: "laut und deutlich"
          - id: l1-c6
            type: fill_in_blank
            text: "Die Stopp-Regel"
            say: "Setz das passende Wort ein."
            frame: "Wer _ hört, hört sofort auf."
            options: ["Stopp", "Hallo", "Ja"]
            answer: ["Stopp"]

  - n: 2
    title: { de: "Gute und schlechte Geheimnisse", en: "Good and bad secrets" }
    goal:
      de: "Lerne gute und schlechte Geheimnisse zu unterscheiden. Finde heraus, wem du dich anvertrauen kannst, so wie deiner Lehrerin."
      en: "Learn to tell good secrets from bad secrets. Find out who you can tell, like your teacher."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Stimmt das? Ein komisches Gefühl im Bauch ist ein Ja-Gefühl."
            say: "Stimmt das? Ein komisches Gefühl im Bauch ist ein Ja-Gefühl."
            answer: false
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Ben sagt zu Tarek: „Stopp!“ Was macht Tarek?"
            say: "Ben sagt zu Tarek: Stopp! Was macht Tarek?"
            options: ["Er hört sofort auf.", "Er macht weiter.", "Er lacht Ben aus."]
            answer: "Er hört sofort auf."
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Darf Lea dieses Geheimnis verraten?"
            say: "Lea und ihr Papa haben ein Geheimnis. Sie backen heimlich einen Kuchen für Mamas Geburtstag. Was glaubst du: Darf Lea das Geheimnis verraten?"
            show: { object: cake }
          - text: "Ein gutes Geheimnis macht Freude und wird bald verraten."
            say: "Das ist ein gutes Geheimnis. Es fühlt sich schön und kribbelig an, und bald kommt es heraus: An Mamas Geburtstag freuen sich alle. Gute Geheimnisse sind Überraschungen, wie ein Geschenk oder eine Party."
            show: { object: present }
          - text: "Ein schlechtes Geheimnis macht Angst. Das darfst du immer erzählen."
            say: "Es gibt auch schlechte Geheimnisse. Ein großes Kind nimmt Tarek jeden Tag sein Pausenbrot weg und sagt: Wenn du das jemandem erzählst, passiert was! Tarek hat Angst und ein Nein-Gefühl. Schlechte Geheimnisse darfst du immer erzählen, auch wenn du versprochen hast, nichts zu sagen."
            show: { object: scared }
          - text: "Hilfe holen ist kein Petzen. Und du bist nie schuld."
            say: "Wenn du ein schlechtes Geheimnis erzählst, ist das kein Petzen. Du holst dir Hilfe. Und wenn dir jemand ein schlechtes Geheimnis gibt, bist du nie schuld."
            show: { object: happy }
          - text: "Wem kannst du es erzählen? Einem Erwachsenen, dem du vertraust."
            say: "Erzähl es einem Erwachsenen, dem du vertraust: Mama oder Papa, Oma oder Opa, deiner Lehrerin oder deinem Lehrer. Hört dir jemand nicht zu, erzähl es dem Nächsten, bis dir jemand hilft."
            show: { objects: [mum, teacher] }
          - text: "Wusstest du? Die Nummer gegen Kummer für Kinder ist 116 111. Anrufen kostet nichts."
            say: "Wusstest du? Es gibt ein Telefon nur für Kinder und Jugendliche, die Nummer gegen Kummer. Die Nummer ist eins, eins, sechs, eins, eins, eins. Dort hören dir Menschen zu, wenn du Sorgen hast. Der Anruf kostet nichts, und du musst deinen Namen nicht sagen."
            show: { object: telephone }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Gutes oder schlechtes Geheimnis?"
                say: "Sortiere. Was ist ein gutes Geheimnis, was ein schlechtes?"
                bins:
                  - { id: gut, show: { text: "gutes Geheimnis" }, say: "gutes Geheimnis" }
                  - { id: schlecht, show: { text: "schlechtes Geheimnis" }, say: "schlechtes Geheimnis" }
                options:
                  - { text: "Wir basteln ein Geschenk für Opa.", bin: gut }
                  - { text: "Ein Kind nimmt dir dein Pausenbrot weg und sagt: „Sag das keinem!“", bin: schlecht }
                  - { text: "Wir planen eine Überraschungsparty für Ella.", bin: gut }
                  - { text: "Jemand sagt: „Wenn du das erzählst, passiert was Schlimmes.“", bin: schlecht }
                hints:
                  - "Frag dich: Macht das Geheimnis Freude oder Angst?"
                  - "Ein gutes Geheimnis ist eine Überraschung und kommt bald heraus."
                  - "Geschenk und Party sind gute Geheimnisse, die anderen zwei schlechte."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Stimmt das? Ein schlechtes Geheimnis muss ich für immer für mich behalten."
                say: "Stimmt das? Ein schlechtes Geheimnis muss ich für immer für mich behalten."
                answer: false
                hints:
                  - "Wie fühlt sich ein schlechtes Geheimnis an?"
                  - "Bei Angst und Nein-Gefühl brauchst du Hilfe."
                  - "Nein. Ein schlechtes Geheimnis darfst du immer erzählen."
              - id: l2-f3
                type: image_multiple_choice
                text: "Wem kann Tarek von seinem Pausenbrot erzählen?"
                say: "Wem kann Tarek von seinem Pausenbrot erzählen?"
                options: [{ object: teacher }, { object: teddy }, { object: ball }]
                answer: teacher
                feedback:
                  teddy: "Ein Teddy hört gut zu, aber helfen kann er nicht. Tarek erzählt es einem Erwachsenen, zum Beispiel seiner Lehrerin."
                hints:
                  - "Tarek braucht jemanden, der ihm helfen kann."
                  - "Helfen kann ein Erwachsener, dem er vertraut."
                  - "Er erzählt es seiner Lehrerin."
              - id: l2-f4
                type: multiple_choice
                text: "Wie fühlt sich ein gutes Geheimnis an?"
                say: "Wie fühlt sich ein gutes Geheimnis an?"
                options: ["schön und kribbelig, wie Vorfreude", "schwer, wie ein Stein im Bauch", "unheimlich, wie im Dunkeln"]
                answer: "schön und kribbelig, wie Vorfreude"
                hints:
                  - "Denk an den Kuchen für Mamas Geburtstag."
                  - "Ein gutes Geheimnis ist eine Überraschung, auf die man sich freut."
                  - "Schön und kribbelig, wie Vorfreude."
              - id: l2-f5
                type: fill_in_blank
                text: "Ein schlechtes Geheimnis erzählen"
                say: "Setz die passenden Wörter ein."
                frame: "Ein schlechtes Geheimnis erzählen ist kein _. Ich hole mir _."
                options: ["Petzen", "Hilfe", "Kuchen"]
                answer: ["Petzen", "Hilfe"]
                hints:
                  - "Wer ein schlechtes Geheimnis erzählt, tut nichts Falsches."
                  - "Er braucht jemanden, der ihm hilft."
                  - "Es ist kein Petzen. Ich hole mir Hilfe."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lea hat ihrer Lehrerin ein schlechtes Geheimnis erzählt. Was hat sie gemacht?"
                say: "Lea hat ihrer Lehrerin ein schlechtes Geheimnis erzählt. Was hat sie gemacht?"
                options: ["Sie hat sich Hilfe geholt.", "Sie hat gepetzt.", "Sie hat gelogen."]
                answer: "Sie hat sich Hilfe geholt."
                hints: ["Schlechte Geheimnisse erzählen ist kein Petzen."]
              - id: l2-s2
                type: image_multiple_choice
                text: "Wer kann dir helfen, wenn du ein schlechtes Geheimnis hast?"
                say: "Wer kann dir helfen, wenn du ein schlechtes Geheimnis hast?"
                options: [{ object: grandma }, { object: baby }, { object: teddy }]
                answer: grandma
                hints: ["Helfen kann ein Erwachsener, dem du vertraust."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? Wenn mir ein Erwachsener nicht zuhört, erzähle ich es einem anderen."
                say: "Stimmt das? Wenn mir ein Erwachsener nicht zuhört, erzähle ich es einem anderen."
                answer: true
                hints: ["Du erzählst es so lange weiter, bis dir jemand hilft."]
              - id: l2-s4
                type: matching
                text: "Was passt zusammen?"
