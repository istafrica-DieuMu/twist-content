# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.text-picture
skill: lit-de.texts-media.text-picture
curriculum: de-DE
language: de
title:
  de: Text und Bild
  en: Text and picture
summary: >
  Relating a text to its picture. Lesson 1 checks whether a picture fits
  the text (Lena ist traurig, but the child on the picture laughs) and
  finds the picture for a sentence or a short Sachtext; lesson 2 says
  what the picture adds that the text does not say (a feeling, the
  weather, what an animal looks like), tells Sprechblase, Denkblase and
  Erzählkasten apart in a comic, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.decoding.first-texts]
  also_practises: [lit-de.decoding.first-texts, lit-de.texts-media.text-types]
  vocabulary: { de: [Bilderbuch, Comic, Sachtext, Sprechblase, Denkblase, Erzähler] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: fits, what: { de: "prüfen, ob ein Bild zum Text passt", en: checking whether a picture fits the text } }
    - { id: find-picture, what: { de: das passende Bild zu einem Satz oder Sachtext finden, en: finding the picture for a sentence or an information text } }
    - { id: adds, what: { de: "sagen, was das Bild zusätzlich erzählt", en: saying what the picture adds } }
    - { id: comic, what: { de: "Sprechblase, Denkblase und Erzählkasten im Comic unterscheiden", en: "telling speech bubbles, thought bubbles and caption boxes apart in a comic" } }
  misconceptions:
    - id: picture-repeats-text
      what: Thinks a picture only repeats the text, so for "Was erzählt das Bild zusätzlich?" picks the sentence that is already in the text
      addressed: "lesson 2 Learn shows Tom and the dog and the rain picture; every \"zusätzlich\" task offers the text sentence itself (l2-f1 with feedback, l2-f2, l2-s1, l2-s2, l2-n1, l2-n2, l2-c1, l2-c5); l2-n5 has a picture that adds nothing new"
    - id: bubble-mix-up
      what: Mixes up Sprechblase, Denkblase and Erzählkasten in a comic
      addressed: "lesson 2 Learn names all three; every stage of lesson 2 asks where something stands (l2-f3, l2-s3, l2-n3, l2-c3) and l2-s4 and l2-n4 ask true_false about a bubble"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Passt das Bild zum Text?", en: "Does the picture fit the text?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Katze\nDie Katze ist ein Haustier.\nSie hat ein weiches Fell.\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["ein Lexikoneintrag", "ein Gedicht", "ein Brief"]
            answer: "ein Lexikoneintrag"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Ali hat einen Luftballon in der Hand. Was hat Ali in der Hand?"
            say: "Lies den Satz. Was hat Ali in der Hand? Tippe auf das Bild."
            options: [{ object: balloon }, { object: ball }, { object: kite }]
            answer: balloon
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Igel schläft unter dem Laub."
            say: "In vielen Büchern stehen Text und Bild zusammen. Der Text sagt: Der Igel schläft. Das Bild zeigt den Igel. Text und Bild passen zusammen."
            show: { object: hedgehog }
          - text: "Lena ist heute traurig."
            say: "Hier passt das Bild nicht. Der Text sagt traurig, aber das Kind auf dem Bild lacht. Schau immer: Zeigt das Bild, was im Text steht?"
            show: { object: happy }
          - text: "Bilderbuch | Comic | Sachtext"
            say: "Bilder gibt es im Bilderbuch, im Comic und im Sachtext. Im Bilderbuch erzählen sie die Geschichte mit. Im Comic erzählen sie fast alles. Im Sachtext zeigen sie dir, wie etwas aussieht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: true_false
                text: "Die Sonne scheint hell.\n\nPasst das Bild zum Text?"
                say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
                show: { object: sun }
                answer: true
                hints:
                  - "Was steht im Text? Was zeigt das Bild?"
                  - "Der Text sagt: Sonne. Was siehst du auf dem Bild?"
                  - "Ja, das Bild zeigt die Sonne."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Das Kind ist sehr müde und gähnt. Welches Bild passt?"
                say: "Lies den Satz. Welches Bild passt dazu?"
                options: [{ object: tired }, { object: happy }, { object: angry }]
                answer: tired
                option_audio: false
                hints:
                  - "Welches Wort sagt, wie es dem Kind geht?"
                  - "Müde. Auf welchem Bild gähnt das Kind?"
                  - "Tippe auf das müde Kind."
              - id: l1-f3
                type: true_false
                text: "Draußen schneit es.\n\nPasst das Bild zum Text?"
                say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
                show: { object: rain }
                answer: false
                hints:
                  - "Was steht im Text? Was zeigt das Bild?"
                  - "Der Text sagt „schneit“. Das Bild zeigt Regentropfen."
                  - "Nein, das Bild zeigt Regen, nicht Schnee."
              - id: l1-f4
                type: image_multiple_choice
                text: "Ole ist wütend, weil sein Turm umgefallen ist. Welches Bild passt?"
                say: "Lies den Satz. Welches Bild passt dazu?"
                options: [{ object: angry }, { object: happy }, { object: tired }]
                answer: angry
                option_audio: false
                feedback:
                  happy: "Dieses Kind lacht. Lies noch einmal, wie es Ole geht."
                hints:
                  - "Welches Wort sagt, wie es Ole geht?"
                  - "Ole ist wütend. Wie sieht ein wütendes Gesicht aus?"
                  - "Tippe auf das wütende Kind."
              - id: l1-f5
                type: matching
                text: "Welches Bild passt zu welchem Satz?"
                say: "Lies jeden Satz und verbinde ihn mit dem passenden Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Es regnet." }, right: { object: rain } }
                  - { left: { text: "Es schneit." }, right: { object: snow } }
                  - { left: { text: "Der Wind weht." }, right: { object: wind } }
                hints:
                  - "Lies einen Satz nach dem anderen."
                  - "Schnee ist weiß und fällt in Flocken."
                  - "Regen zum Regen, Schnee zum Schnee, Wind zum Wind."

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Mia hat Angst vor dem Gewitter.\n\nPasst das Bild zum Text?"
                say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
                show: { object: scared }
                answer: true
                hints: ["Wie sieht ein Kind aus, das Angst hat?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Lisa freut sich über ihr Geschenk. Welches Bild passt?"
                say: "Lies den Satz. Welches Bild passt dazu?"
                options: [{ object: happy }, { object: sad }, { object: scared }]
                answer: happy
                option_audio: false
                hints: ["Wer sich freut, der lacht."]
              - id: l1-s3
                type: true_false
                text: "Papa backt einen Kuchen.\n\nPasst das Bild zum Text?"
                say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
                show: { object: bread }
                answer: false
                hints: ["Ist auf dem Bild ein Kuchen?"]
              - id: l1-s4
                type: image_multiple_choice
                text: "Dieses Tier hat einen sehr langen Hals. Es frisst Blätter von hohen Bäumen. Welches Bild gehört zu dem Sachtext?"
                say: "Lies den Sachtext. Welches Bild gehört dazu?"
                options: [{ object: giraffe }, { object: elephant }, { object: zebra }]
                answer: giraffe
                hints: ["Welches Tier hat einen sehr langen Hals?"]
              - id: l1-s5
                type: matching
                text: "Welches Bild passt zu welchem Satz?"
                say: "Lies jeden Satz und verbinde ihn mit dem passenden Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Ben weint." }, right: { object: sad } }
                  - { left: { text: "Ben lacht." }, right: { object: happy } }
                  - { left: { text: "Ben gähnt." }, right: { object: tired } }
                hints: ["Schau auf die Gesichter."]

          - support: none
            tasks:
              - id: l1-n1
                type: true_false
                text: "Der Hund wartet vor der Tür.\n\nPasst das Bild zum Text?"
                say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
                show: { object: cat }
                answer: false
              - id: l1-n2
                type: image_multiple_choice
                text: "Emma zittert. Sie hat Angst im Dunkeln. Welches Bild passt?"
                say: "Lies den Text. Welches Bild passt dazu?"
                options: [{ object: scared }, { object: happy }, { object: angry }]
                answer: scared
                option_audio: false
              - id: l1-n3
                type: true_false
                text: "Im Herbst lassen wir den Drachen steigen.\n\nPasst das Bild zum Text?"
                say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
                show: { object: kite }
                answer: true
              - id: l1-n4
                type: image_multiple_choice
                text: "Dieses Tier hat lange Ohren. Es hoppelt über die Wiese. Welches Bild gehört zu dem Sachtext?"
                say: "Lies den Sachtext. Welches Bild gehört dazu?"
                options: [{ object: rabbit }, { object: mouse }, { object: dog }]
                answer: rabbit
              - id: l1-n5
                type: matching
                text: "Welches Bild passt zu welchem Satz?"
                say: "Lies jeden Satz und verbinde ihn mit dem passenden Bild."
                option_audio: false
                pairs:
                  - { left: { text: "Wir fahren mit dem Bus." }, right: { object: bus } }
                  - { left: { text: "Wir fahren mit dem Boot." }, right: { object: boat } }
                  - { left: { text: "Wir fahren mit dem Fahrrad." }, right: { object: bike } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: true_false
            text: "Lukas ist heute sehr fröhlich.\n\nPasst das Bild zum Text?"
            say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
            show: { object: sad }
            answer: false
          - id: l1-c2
            type: image_multiple_choice
            text: "Am Himmel ziehen dicke graue Wolken auf. Welches Bild passt?"
            say: "Lies den Satz. Welches Bild passt dazu?"
            options: [{ object: cloud }, { object: sun }, { object: star }]
            answer: cloud
            option_audio: false
          - id: l1-c3
            type: matching
            text: "Welches Bild passt zu welchem Satz?"
            say: "Lies jeden Satz und verbinde ihn mit dem passenden Bild."
            option_audio: false
            pairs:
              - { left: { text: "Es ist heiß." }, right: { object: sun } }
              - { left: { text: "Alles ist weiß und kalt." }, right: { object: snow } }
              - { left: { text: "Wir brauchen einen Regenschirm." }, right: { object: rain } }
          - id: l1-c4
            type: true_false
            text: "Die Katze schläft auf dem Sofa.\n\nPasst das Bild zum Text?"
            say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
            show: { object: cat }
            answer: true
          - id: l1-c5
            type: image_multiple_choice
            text: "Dieses Tier hat acht Beine. Es baut ein Netz und fängt darin Fliegen. Welches Bild gehört zu dem Sachtext?"
            say: "Lies den Sachtext. Welches Bild gehört dazu?"
            options: [{ object: spider }, { object: ant }, { object: bee }]
            answer: spider
          - id: l1-c6
            type: image_multiple_choice
            text: "Zum Nachtisch gibt es heute ein großes Eis. Welches Bild passt?"
            say: "Lies den Satz. Welches Bild passt dazu?"
            options: [{ object: ice-cream }, { object: cake }, { object: apple }]
            answer: ice-cream
            option_audio: false

  - n: 2
    title: { de: "Was das Bild dazu erzählt", en: "What the picture adds" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: true_false
            text: "Die Ente schwimmt auf dem Teich.\n\nPasst das Bild zum Text?"
            say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
            show: { object: duck }
            answer: true
            difficulty: easy
          - id: l2-w2
            type: image_multiple_choice
            text: "Paul ist traurig. Welches Bild passt?"
            say: "Lies den Satz. Welches Bild passt dazu?"
            options: [{ object: sad }, { object: happy }, { object: tired }]
            answer: sad
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Tom sieht den großen Hund."
            say: "Der Text sagt nur: Tom sieht den Hund. Das Bild zeigt mehr: Tom hat Angst. Das Bild erzählt etwas dazu, das nicht im Text steht."
            show: { object: scared }
          - text: "Wir gehen nach draußen."
            say: "Hier sagt der Text nicht, wie das Wetter ist. Das Bild zeigt es: Es regnet. Frag dich: Was weiß ich nur durch das Bild?"
            show: { object: rain }
          - text: "Sprechblase: was eine Figur sagt\nDenkblase: was eine Figur denkt\nKasten: was der Erzähler sagt"
            say: "Im Comic erzählen die Bilder fast alles. Was eine Figur sagt, steht in einer Sprechblase. Was sie denkt, steht in einer Denkblase. Die sieht aus wie eine kleine Wolke. Oben im Kasten steht, was der Erzähler sagt, zum Beispiel: Am nächsten Morgen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lea macht die Tür auf.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: happy }
                options: ["Lea freut sich.", "Lea macht die Tür auf.", "Lea hat Angst."]
                answer: "Lea freut sich."
                feedback:
                  "Lea macht die Tür auf.": "Das steht schon im Text. Was zeigt nur das Bild?"
                hints:
                  - "Lies den Text. Schau dann auf das Gesicht auf dem Bild."
                  - "Im Text steht nicht, wie es Lea geht. Das Bild zeigt es."
                  - "Lea freut sich."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wir fahren heute zu Oma.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: snow }
                options: ["Es schneit.", "Wir fahren zu Oma.", "Die Sonne scheint."]
                answer: "Es schneit."
                hints:
                  - "Das Bild zeigt das Wetter."
                  - "Steht im Text etwas über das Wetter?"
                  - "Es schneit."
              - id: l2-f3
                type: multiple_choice
                text: "Im Comic denkt der Hund: „Hoffentlich gibt es gleich Futter!“\n\nWo steht das?"
                say: "Im Comic denkt der Hund etwas. Wo steht das?"
                options: ["in einer Denkblase", "in einer Sprechblase", "im Erzählkasten"]
                answer: "in einer Denkblase"
                hints:
                  - "Sagt der Hund es laut, oder denkt er es nur?"
                  - "Was jemand denkt, steht in der Blase, die wie eine Wolke aussieht."
                  - "In einer Denkblase."
              - id: l2-f4
                type: true_false
                text: "Mia isst ein Eis.\n\nErzählt das Bild etwas, das nicht im Text steht?"
                say: "Lies den Satz und schau auf das Bild. Erzählt das Bild etwas, das nicht im Text steht?"
                show: { object: happy }
                answer: true
                hints:
                  - "Steht im Text, wie es Mia geht?"
                  - "Das Bild zeigt ein lachendes Kind."
                  - "Ja. Das Bild zeigt: Mia freut sich."
              - id: l2-f5
                type: multiple_choice
                text: "Im Lexikon steht: „Der Marienkäfer frisst Blattläuse.“ Daneben ist ein Bild vom Marienkäfer.\n\nWas zeigt dir nur das Bild?"
                say: "Lies den Text. Was zeigt dir nur das Bild?"
                options: ["wie der Marienkäfer aussieht", "was der Marienkäfer frisst", "wie alt er wird"]
                answer: "wie der Marienkäfer aussieht"
                hints:
                  - "Was der Käfer frisst, steht schon im Text."
                  - "Was siehst du auf einem Bild von einem Tier?"
                  - "Wie der Marienkäfer aussieht."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Jonas wartet auf den Bus.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: tired }
                options: ["Jonas ist müde.", "Jonas wartet auf den Bus.", "Jonas ist wütend."]
                answer: "Jonas ist müde."
                hints: ["Was steht schon im Text? Was zeigt nur das Gesicht?"]
              - id: l2-s2
                type: multiple_choice
                text: "Die Kinder spielen draußen.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: wind }
                options: ["Es ist windig.", "Die Kinder spielen draußen.", "Es schneit."]
                answer: "Es ist windig."
                hints: ["Das Bild zeigt das Wetter."]
              - id: l2-s3
                type: multiple_choice
                text: "Im Comic ruft der Junge: „Hallo, Oma!“\n\nWo steht das?"
                say: "Im Comic ruft der Junge etwas. Wo steht das?"
                options: ["in einer Sprechblase", "in einer Denkblase", "im Erzählkasten"]
                answer: "in einer Sprechblase"
                hints: ["Er sagt es laut."]
              - id: l2-s4
                type: true_false
                text: "In einer Denkblase steht, was eine Figur laut sagt. Stimmt das?"
                say: "In einer Denkblase steht, was eine Figur laut sagt. Stimmt das?"
                answer: false
                hints: ["Was steht in der Blase, die wie eine Wolke aussieht?"]
              - id: l2-s5
                type: multiple_choice
                text: "Im Sachtext steht: „Der Elefant trinkt mit dem Rüssel.“ Auf dem Bild siehst du einen Elefanten.\n\nWas zeigt dir das Bild, das nicht im Text steht?"
                say: "Lies den Text. Was zeigt dir das Bild, das nicht im Text steht?"
                options: ["wie groß seine Ohren sind", "dass er mit dem Rüssel trinkt", "wo er nachts schläft"]
                answer: "wie groß seine Ohren sind"
                hints: ["Was siehst du, wenn du einen Elefanten anschaust?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Nina hört ein lautes Geräusch.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: scared }
                options: ["Nina erschrickt.", "Nina hört ein Geräusch.", "Nina lacht."]
                answer: "Nina erschrickt."
              - id: l2-n2
                type: multiple_choice
                text: "Wir packen unsere Taschen.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: sun }
                options: ["Die Sonne scheint.", "Wir packen unsere Taschen.", "Es regnet."]
                answer: "Die Sonne scheint."
              - id: l2-n3
                type: multiple_choice
                text: "Oben im Comic steht in einem Kasten: „Am nächsten Morgen.“\n\nWer sagt das?"
                say: "Oben im Comic steht etwas in einem Kasten. Wer sagt das?"
                options: ["der Erzähler", "eine Figur in der Sprechblase", "der Hund in der Denkblase"]
                answer: "der Erzähler"
              - id: l2-n4
                type: true_false
                text: "In einer Sprechblase steht, was eine Figur sagt. Stimmt das?"
                say: "In einer Sprechblase steht, was eine Figur sagt. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Ali ist wütend.\n\nWas erzählt das Bild dazu?"
                say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
                show: { object: angry }
                options: ["nichts Neues, es zeigt das Gleiche wie der Text", "Ali ist müde.", "Es schneit."]
                answer: "nichts Neues, es zeigt das Gleiche wie der Text"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: adds
            type: multiple_choice
            text: "Max bekommt ein Paket.\n\nWas erzählt das Bild dazu?"
            say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
            show: { object: happy }
            options: ["Max freut sich.", "Max bekommt ein Paket.", "Max ist traurig."]
            answer: "Max freut sich."
          - id: l2-c2
            part: fits
            type: true_false
            text: "Am Abend leuchtet der Mond.\n\nPasst das Bild zum Text?"
            say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
            show: { object: moon }
            answer: true
          - id: l2-c3
            part: comic
            type: multiple_choice
            text: "Im Comic denkt die Prinzessin: „Wo ist nur mein Drache?“\n\nWo steht das?"
            say: "Im Comic denkt die Prinzessin etwas. Wo steht das?"
            options: ["in einer Denkblase", "in einer Sprechblase", "im Erzählkasten"]
            answer: "in einer Denkblase"
          - id: l2-c4
            part: find-picture
            type: image_multiple_choice
            text: "Der Junge ist wütend und stampft mit dem Fuß. Welches Bild passt?"
            say: "Lies den Satz. Welches Bild passt dazu?"
            options: [{ object: angry }, { object: tired }, { object: happy }]
            answer: angry
            option_audio: false
          - id: l2-c5
            part: adds
            type: multiple_choice
            text: "Wir gehen zum Spielplatz.\n\nWas erzählt das Bild dazu?"
            say: "Lies den Satz und schau auf das Bild. Was erzählt das Bild, das nicht im Text steht?"
            show: { object: rain }
            options: ["Es regnet.", "Wir gehen zum Spielplatz.", "Es ist heiß."]
            answer: "Es regnet."
          - id: l2-c6
            part: fits
            type: true_false
            text: "Der Fuchs schleicht leise durch den Wald.\n\nPasst das Bild zum Text?"
            say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
            show: { object: fox }
            answer: true
          - id: l2-c7
            part: fits
            type: true_false
            text: "Im Winter bauen die Kinder einen Schneemann.\n\nPasst das Bild zum Text?"
            say: "Lies den Satz und schau auf das Bild. Passt das Bild zum Text?"
            show: { object: sandcastle }
            answer: false
          - id: l2-c8
            part: fits
            type: true_false
