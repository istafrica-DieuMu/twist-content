# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.listen-understand
skill: lit-de.speaking.listen-understand
curriculum: de-DE
language: de
title:
  de: Zuhören und verstehen
  en: Listening and understanding
summary: >
  Listening to a short Hörtext (a message from the teacher, a Durchsage,
  a child talking about a pet) and taking out what matters. Lesson 1
  listens with the W-Fragen Wer, Was, Wo and Wann and answers them from
  the text; lesson 2 passes the key information on to someone else,
  asks a precise question when something was missed, and ends with the
  skill check. Every Hörtext is spoken; the child answers with short
  sentences, words or pictures. Passing on and asking aloud are
  practised with speak tasks and not marked.
metadata:
  year: klasse-2
  topic: { de: Sprechen und Zuhören, en: Speaking and listening }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.speaking.listen-follow]
  also_practises: [lit-de.speaking.listen-follow]
  vocabulary: { de: [Hörtext, Durchsage, W-Fragen, wer, was, wo, wann, wichtig, weitersagen, nachfragen] }
  forms: [audio, text, picture]
  drawn: []
  facets: []
  parts:
    - { id: who-what, what: { de: "aus einem Hörtext heraushören, wer etwas macht und was", en: hearing who does what in a spoken text } }
    - { id: where-when, what: { de: "aus einem Hörtext heraushören, wo und wann etwas ist", en: hearing where and when something is in a spoken text } }
    - { id: pass-on, what: { de: das Wichtige weitersagen, en: passing on what matters } }
    - { id: ask, what: { de: "genau nachfragen, wenn etwas fehlt", en: asking exactly about what was missed } }
  misconceptions:
    - id: grab-any-detail
      what: Answers with the first number, place or thing heard in the text, not the one the question asks for
      addressed: "lesson 1 Learn asks each W-Frage on its own; Hörtexte name two times, two places or two things, and the other one is always an option (l1-f2 and l1-f4 with feedback, l1-s2, l1-n2, l2-c1, l2-c2)"
    - id: pass-on-incomplete
      what: Passes on only part of a message, or the unimportant details instead of what, when and where
      addressed: "lesson 2 Learn shows a full and a half message; every stage of lesson 2 picks the message that has everything (l2-f1 with feedback, l2-s1, l2-n1, l2-c3) and sorts wichtig from nicht wichtig (l2-f3, l2-s3)"
    - id: vague-question
      what: Says Hä? or Was? instead of asking exactly what was missed, or does not ask at all
      addressed: "lesson 2 Learn says what you missed goes into the question; l2-f4 (with feedback), l2-s4, l2-n4 and l2-c4 pick the precise question; speak tasks l2-f6 and l2-s6"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Was ist wichtig?", en: "What matters?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Was sollst du holen?"
            say: "Hör gut zu. Was sollst du holen?"
            audio: { de: "Hol bitte die Schere aus deinem Mäppchen." }
            options: [{ object: scissors }, { object: pencil-case }, { object: ruler }]
            answer: scissors
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Du hast etwas nicht verstanden. Was machst du?"
            options: ["Ich frage nach.", "Ich rate einfach.", "Ich höre nicht mehr zu."]
            answer: "Ich frage nach."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Wer? Was? Wo? Wann?"
            say: "Wenn du einem Hörtext zuhörst, helfen dir die W-Fragen. Wer? Was? Wo? Wann? Schau die Person an, die spricht, und denk an die Fragen. Wer genau zuhört, kann sie danach beantworten."
            show: { object: listen }
          - text: "Hör zu."
            say: "Frau Berger sagt: Liebe Kinder, morgen gehen wir in den Zoo. Wir treffen uns um acht Uhr am Schultor. Bringt ein Pausenbrot mit."
            show: { object: teacher }
          - text: "Wer? Frau Berger und die Klasse\nWas? ein Ausflug in den Zoo\nWann? morgen um acht Uhr\nWo? am Schultor"
            say: "Jetzt fragst du: Was machen die Kinder? Sie gehen in den Zoo. Wann? Morgen um acht Uhr. Wo treffen sie sich? Am Schultor. Nicht jedes Wort ist wichtig. Die W-Fragen zeigen dir, was du dir merken musst."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Wohin geht der Ausflug?"
                say: "Hör gut zu. Wohin geht der Ausflug?"
                audio: { de: "Liebe Kinder, am Freitag machen wir einen Ausflug in den Wald. Zieht feste Schuhe an." }
                options: ["in den Wald", "in den Zoo", "ins Schwimmbad"]
                answer: "in den Wald"
                hints:
                  - "Hör noch einmal. Die Frage heißt: Wohin?"
                  - "Achte auf die Wörter nach Ausflug."
                  - "Einen Ausflug in den Wald."
                difficulty: easy
              - id: l1-f2
                type: audio_choice
                text: "Wann treffen sich die Kinder?"
                say: "Hör gut zu. Wann treffen sich die Kinder?"
                audio: { de: "Der Bus fährt um neun Uhr los. Wir treffen uns aber schon um halb neun vor der Schule." }
                options: ["um halb neun", "um neun Uhr", "um acht Uhr"]
                answer: "um halb neun"
                feedback:
                  "um neun Uhr": "Um neun Uhr fährt der Bus. Die Kinder treffen sich schon vorher."
                hints:
                  - "Im Text kommen zwei Uhrzeiten vor. Welche gehört zu treffen?"
                  - "Wir treffen uns aber schon um ..."
                  - "Um halb neun treffen sich die Kinder."
              - id: l1-f3
                type: audio_choice
                text: "Was hat Jonas für ein Tier?"
                say: "Hör gut zu. Was hat Jonas für ein Tier?"
                audio: { de: "Ich heiße Jonas. Ich habe einen kleinen Hund. Er heißt Krümel. Am liebsten spielt er mit meinem roten Ball.", speaker: male }
                options: [{ object: dog }, { object: cat }, { object: rabbit }]
                answer: dog
                hints:
                  - "Wer spricht? Jonas erzählt von seinem Tier."
                  - "Ich habe einen kleinen ..."
                  - "Jonas hat einen Hund."
              - id: l1-f4
                type: audio_choice
                text: "Womit spielt Krümel am liebsten?"
                say: "Hör gut zu. Womit spielt Krümel am liebsten?"
                audio: { de: "Krümel schläft gern in seinem Korb. Er kaut auch gern an Papas Socke. Aber am liebsten spielt er mit seinem Ball." }
                options: [{ object: ball }, { object: sock }, { object: shoe }]
                answer: ball
                feedback:
                  sock: "An der Socke kaut Krümel auch gern. Aber was mag er am liebsten?"
                hints:
                  - "Hör auf die Wörter am liebsten."
                  - "Am liebsten spielt er mit seinem ..."
                  - "Mit seinem Ball."
              - id: l1-f5
                type: true_false
                text: "Hat die Klasse 2a heute Sport in der Turnhalle?"
                say: "Hör gut zu. Hat die Klasse 2a heute Sport in der Turnhalle?"
                audio: { de: "Achtung, eine Durchsage: Die Klasse 2a hat heute Sport auf dem Schulhof, nicht in der Turnhalle." }
                answer: false
                hints:
                  - "Wo ist heute Sport?"
                  - "Die Durchsage sagt: auf dem Schulhof, nicht in der Turnhalle."
                  - "Nein. Sport ist heute auf dem Schulhof."
              - id: l1-f6
                type: multiple_choice
                text: "Du willst wissen, um wie viel Uhr das Fest anfängt. Welche W-Frage passt?"
                say: "Du willst wissen, um wie viel Uhr das Fest anfängt. Welche W-Frage passt?"
                options: ["Wann?", "Wo?", "Wer?"]
                answer: "Wann?"
                feedback:
                  "Wo?": "Mit Wo fragst du nach dem Ort. Hier geht es um die Uhrzeit."
                hints:
                  - "Es geht um eine Uhrzeit."
                  - "Mit welcher Frage fragst du nach der Zeit?"
                  - "Wann?"

          - support: some
            tasks:
              - id: l1-s1
                type: audio_choice
                text: "Wer kommt heute in die Klasse?"
                say: "Hör gut zu. Wer kommt heute in die Klasse?"
                audio: { de: "Guten Morgen, Kinder. Heute besucht uns eine Feuerwehrfrau. Sie erzählt euch, wie man einen Brand löscht." }
                options: [{ object: firefighter }, { object: doctor }, { object: police-officer }]
                answer: firefighter
                hints: ["Hör auf das Wort nach besucht uns."]
              - id: l1-s2
                type: audio_choice
                text: "Wo findet das Schulfest statt?"
                say: "Hör gut zu. Wo findet das Schulfest statt?"
                audio: { de: "Wenn es regnet, feiern wir in der Turnhalle. Wenn die Sonne scheint, feiern wir auf der Wiese hinter der Schule. Der Wetterbericht sagt: Morgen scheint die Sonne." }
                options: ["auf der Wiese", "in der Turnhalle", "im Klassenzimmer"]
                answer: "auf der Wiese"
                hints: ["Wie wird das Wetter morgen?"]
              - id: l1-s3
                type: audio_choice
                text: "Was sollen die Kinder mitbringen?"
                say: "Hör gut zu. Was sollen die Kinder mitbringen?"
                audio: { de: "Morgen backen wir Kekse. Bringt bitte alle eine Schürze mit. Mehl und Zucker habe ich schon gekauft." }
                options: ["eine Schürze", "Mehl", "Zucker"]
                answer: "eine Schürze"
                hints: ["Was hat die Lehrerin schon gekauft? Das bringst du nicht mit."]
              - id: l1-s4
                type: true_false
                text: "Heißt Emmas Katze Mimi?"
                say: "Hör gut zu. Heißt Emmas Katze Mimi?"
                audio: { de: "Ich heiße Emma. Meine Katze heißt Mimi. Sie ist schon zehn Jahre alt und schläft gern auf meinem Bett.", speaker: female }
                answer: true
                hints: ["Wie heißt das Mädchen, und wie heißt die Katze?"]
              - id: l1-s5
                type: multiple_choice
                text: "Du willst wissen, an welchem Ort ihr euch trefft. Welche W-Frage passt?"
                say: "Du willst wissen, an welchem Ort ihr euch trefft. Welche W-Frage passt?"
                options: ["Wo?", "Wann?", "Was?"]
                answer: "Wo?"
                hints: ["Es geht um einen Ort."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Was bekommt die Klasse?"
                say: "Hör gut zu. Was bekommt die Klasse?"
                audio: { de: "Gute Nachricht: Unsere Klasse bekommt ein Haustier. Es ist ein Kaninchen. Es wohnt in einem großen Käfig neben der Tafel." }
                options: [{ object: rabbit }, { object: mouse }, { object: fish }]
                answer: rabbit
              - id: l1-n2
                type: audio_choice
                text: "Wann ist der Laternenumzug?"
                say: "Hör gut zu. Wann ist der Laternenumzug?"
                audio: { de: "Am Montag basteln wir unsere Laternen. Der Laternenumzug ist dann am Donnerstag, wenn es dunkel wird." }
                options: ["am Donnerstag", "am Montag", "am Sonntag"]
                answer: "am Donnerstag"
              - id: l1-n3
                type: audio_choice
                text: "Wo ist Ellas Jacke?"
                say: "Hör gut zu. Wo ist Ellas Jacke?"
                audio: { de: "Ella sucht ihre Jacke. Im Schrank ist sie nicht. Unter dem Tisch auch nicht. Endlich findet sie die Jacke auf dem Stuhl." }
                options: [{ object: chair }, { object: table }, { object: bed }]
                answer: chair
              - id: l1-n4
                type: true_false
                text: "Kannst du heute in der Bücherei Bücher ausleihen?"
                say: "Hör gut zu. Kannst du heute in der Bücherei Bücher ausleihen?"
                audio: { de: "Achtung, eine Durchsage: Die Bücherei ist heute geschlossen. Morgen könnt ihr wieder Bücher ausleihen." }
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Du willst wissen, welche Person dich heute abholt. Welche W-Frage passt?"
                say: "Du willst wissen, welche Person dich heute abholt. Welche W-Frage passt?"
                options: ["Wer?", "Wo?", "Wann?"]
                answer: "Wer?"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Was macht die Klasse am Mittwoch?"
            say: "Hör gut zu. Was macht die Klasse am Mittwoch?"
            audio: { de: "Am Dienstag schreiben wir ein Diktat. Am Mittwoch gehen wir ins Theater." }
            options: ["Sie geht ins Theater.", "Sie schreibt ein Diktat.", "Sie hat frei."]
            answer: "Sie geht ins Theater."
          - id: l1-c2
            type: audio_choice
            text: "Was soll Tim kaufen?"
            say: "Hör gut zu. Was soll Tim kaufen?"
            audio: { de: "Tim, geh bitte zum Bäcker und kauf ein Brot. Milch haben wir noch." }
            options: [{ object: bread }, { object: milk }, { object: cake }]
            answer: bread
          - id: l1-c3
            type: multiple_choice
            text: "Du willst wissen, an welchem Tag das Fest ist. Welche W-Frage passt?"
            say: "Du willst wissen, an welchem Tag das Fest ist. Welche W-Frage passt?"
            options: ["Wann?", "Wer?", "Wo?"]
            answer: "Wann?"
          - id: l1-c4
            type: audio_choice
            text: "Wer kommt heute in die Klasse?"
            say: "Hör gut zu. Wer kommt heute in die Klasse?"
            audio: { de: "Letzte Woche hat uns eine Ärztin besucht. Heute kommt ein Polizist. Er übt mit euch den Schulweg." }
            options: [{ object: police-officer }, { object: doctor }, { object: teacher }]
            answer: police-officer
          - id: l1-c5
            type: true_false
            text: "Spielt Mo am Nachmittag Fußball?"
            say: "Hör gut zu. Spielt Mo am Nachmittag Fußball?"
            audio: { de: "Ich heiße Mo. Am Vormittag bin ich in der Schule. Am Nachmittag spiele ich Fußball im Verein.", speaker: male }
            answer: true
          - id: l1-c6
            type: audio_choice
            text: "Wie heißt der neue Junge?"
            say: "Hör gut zu. Wie heißt der neue Junge?"
            audio: { de: "Das ist Luca. Er ist neu in unserer Klasse. Er sitzt ab heute neben Elif." }
            options: ["Luca", "Elif", "Lukas"]
            answer: "Luca"

  - n: 2
    title: { de: "Weitersagen und nachfragen", en: "Passing on and asking" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: audio_choice
            text: "Wohin geht die Klasse?"
            say: "Hör gut zu. Wohin geht die Klasse?"
            audio: { de: "Morgen gehen wir alle zusammen ins Museum. Wir sehen dort echte Dinosaurier-Knochen." }
            options: ["ins Museum", "in den Zoo", "in den Park"]
            answer: "ins Museum"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Du willst wissen, welches Spiel ihr morgen in der Pause spielt. Welche W-Frage passt?"
            say: "Du willst wissen, welches Spiel ihr morgen in der Pause spielt. Welche W-Frage passt?"
            options: ["Was?", "Wo?", "Wer?"]
            answer: "Was?"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Weitersagen"
            say: "Manchmal sollst du etwas weitersagen, zum Beispiel deinen Eltern. Dann sagst du das Wichtigste: was, wann und wo, und was du mitbringen sollst. Kleine Dinge, die nicht wichtig sind, lässt du weg."
            show: { objects: [child, mum] }
          - text: "Frau Berger: Am Freitag ist Elternabend, um sieben Uhr, in der Klasse 2a.\n\nGut: Am Freitag ist Elternabend, um sieben Uhr, in unserer Klasse.\nNicht gut: Es ist irgendwann Elternabend."
            say: "Hör, wie Ali es weitersagt: Am Freitag ist Elternabend, um sieben Uhr, in unserer Klasse. Da ist alles drin: was, wann und wo. Irgendwann Elternabend reicht nicht. Dann weiß Mama nicht, wann sie kommen soll."
          - text: "Um wie viel Uhr treffen wir uns?"
            say: "Hast du etwas nicht verstanden? Dann frag genau nach. Hä? oder Was? hilft nicht viel. Sag, was dir fehlt: Um wie viel Uhr treffen wir uns?"
            show: { object: listen }

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: audio_choice
                text: "Was sagt Lina zu Hause?"
                say: "Hör gut zu. Lina soll es zu Hause weitersagen. Was sagt sie am besten?"
                audio: { de: "Liebe Kinder, am Dienstag haben wir Schwimmunterricht. Wir gehen um zehn Uhr los. Packt eure Badesachen ein." }
                options: ["Am Dienstag um zehn Uhr ist Schwimmen. Ich brauche Badesachen.", "Wir gehen bald schwimmen.", "Ich soll Badesachen einpacken."]
                answer: "Am Dienstag um zehn Uhr ist Schwimmen. Ich brauche Badesachen."
                feedback:
                  "Wir gehen bald schwimmen.": "Das stimmt, aber es fehlt etwas. Wann genau? Und was braucht Lina?"
                  "Ich soll Badesachen einpacken.": "Das stimmt. Aber an welchem Tag ist Schwimmen, und um wie viel Uhr?"
                hints:
                  - "Welche Antwort sagt was, wann und was Lina braucht?"
                  - "Am Dienstag, um zehn Uhr, Badesachen. Wo steht alles drin?"
                  - "Am Dienstag um zehn Uhr ist Schwimmen. Ich brauche Badesachen."
                difficulty: easy
              - id: l2-f2
                type: true_false
                text: "Hat Paul alles Wichtige gesagt?"
                say: "Hör gut zu. Hat Paul alles Wichtige gesagt?"
                audio: { de: "Der Trainer sagt: Das Fußballtraining ist morgen schon um drei Uhr, nicht um vier. Paul sagt zu Mama: Morgen ist Training." }
                answer: false
                hints:
                  - "Was hat sich beim Training geändert?"
                  - "Die Uhrzeit ist neu. Hat Paul die Uhrzeit gesagt?"
                  - "Nein. Paul hat vergessen zu sagen: um drei Uhr."
              - id: l2-f3
                type: sorting
                text: "Was muss Mia zu Hause weitersagen? Sortiere."
                say: "Hör gut zu. Was muss Mia zu Hause weitersagen? Sortiere."
                audio: { de: "Die Lehrerin sagt: Am Montag fahren wir mit dem Bus zum Bauernhof. Wir treffen uns um acht Uhr. Der Bus ist übrigens gelb." }
                bins:
                  - { id: wichtig, show: { text: "wichtig" }, say: "wichtig" }
                  - { id: unwichtig, show: { text: "nicht so wichtig" }, say: "nicht so wichtig" }
                options:
                  - { text: "am Montag", bin: wichtig }
                  - { text: "zum Bauernhof", bin: wichtig }
                  - { text: "um acht Uhr", bin: wichtig }
                  - { text: "Der Bus ist gelb.", bin: unwichtig }
                hints:
                  - "Denk an die W-Fragen: Was? Wann? Wo?"
                  - "Muss Mama wissen, welche Farbe der Bus hat?"
                  - "Der gelbe Bus ist nicht so wichtig. Alles andere ist wichtig."
              - id: l2-f4
                type: multiple_choice
                text: "Es klingelt laut. Du hast die Uhrzeit nicht gehört. Welche Frage stellst du?"
                say: "Hör gut zu. Es klingelt laut, und du hast die Uhrzeit nicht gehört. Welche Frage stellst du?"
                audio: { de: "Die Lehrerin sagt: Wir treffen uns morgen um ... Uhr am Bahnhof." }
                options: ["Um wie viel Uhr treffen wir uns?", "Hä?", "Wo treffen wir uns?"]
                answer: "Um wie viel Uhr treffen wir uns?"
                feedback:
                  "Hä?": "Dann weiß die Lehrerin nicht, was du nicht gehört hast. Frag genau nach der Uhrzeit."
                  "Wo treffen wir uns?": "Den Ort hast du gehört: am Bahnhof. Was fehlt dir?"
                hints:
                  - "Was hast du nicht gehört?"
                  - "Dir fehlt die Uhrzeit. Mit welcher Frage fragst du danach?"
                  - "Um wie viel Uhr treffen wir uns?"
              - id: l2-f5
                type: audio_choice
                text: "Was sagt Ben seinem Freund?"
                say: "Hör gut zu. Ben soll seinem Freund Can etwas ausrichten. Was sagt er?"
                audio: { de: "Ben, sag bitte Can, dass er sein Buch am Mittwoch zurückbringen soll." }
                options: ["Du sollst dein Buch am Mittwoch zurückbringen.", "Du sollst ein Buch lesen.", "Am Mittwoch ist kein Unterricht."]
                answer: "Du sollst dein Buch am Mittwoch zurückbringen."
                hints:
                  - "Was soll Can machen, und wann?"
                  - "Es geht um das Buch und um den Mittwoch."
                  - "Du sollst dein Buch am Mittwoch zurückbringen."
              - id: l2-f6
                type: speak
                text: "Du hast nicht gehört, wo ihr euch trefft. Frag genau nach."
                say: "Du hast nicht gehört, wo ihr euch trefft. Frag genau nach. Sag: Wo treffen wir uns?"
                expected_text: "Wo treffen wir uns?"
                hints:
                  - "Fang mit der W-Frage an."
                  - "Sprich laut und deutlich."
                  - "Wo treffen wir uns?"

          - support: some
            tasks:
              - id: l2-s1
                type: audio_choice
                text: "Was sagt Noah zu Hause?"
                say: "Hör gut zu. Noah soll es zu Hause weitersagen. Was sagt er am besten?"
                audio: { de: "Am Donnerstag ist unser Sportfest. Es beginnt um neun Uhr auf dem Sportplatz. Zieht Turnschuhe an." }
                options: ["Am Donnerstag um neun ist Sportfest auf dem Sportplatz. Ich brauche Turnschuhe.", "Bald ist ein Fest.", "Ich brauche Turnschuhe."]
                answer: "Am Donnerstag um neun ist Sportfest auf dem Sportplatz. Ich brauche Turnschuhe."
                hints: ["Such die Antwort mit was, wann und wo."]
              - id: l2-s2
                type: true_false
                text: "Hat Lea alles Wichtige gesagt?"
                say: "Hör gut zu. Hat Lea alles Wichtige gesagt?"
                audio: { de: "Die Lehrerin sagt: Morgen fällt die erste Stunde aus. Kommt bitte erst um neun Uhr. Lea sagt zu Papa: Morgen muss ich erst um neun Uhr in der Schule sein." }
                answer: true
                hints: ["Was muss Papa wissen? Hat Lea das gesagt?"]
              - id: l2-s3
                type: sorting
                text: "Was muss Finn zu Hause weitersagen? Sortiere."
                say: "Hör gut zu. Was muss Finn zu Hause weitersagen? Sortiere."
                audio: { de: "Die Lehrerin sagt: Am Freitag ist Flohmarkt in der Schule, um zwei Uhr. Ich habe dort letztes Jahr eine Lampe gekauft." }
                bins:
                  - { id: wichtig, show: { text: "wichtig" }, say: "wichtig" }
                  - { id: unwichtig, show: { text: "nicht so wichtig" }, say: "nicht so wichtig" }
                options:
                  - { text: "Flohmarkt in der Schule", bin: wichtig }
                  - { text: "am Freitag", bin: wichtig }
                  - { text: "um zwei Uhr", bin: wichtig }
                  - { text: "Die Lehrerin hat eine Lampe gekauft.", bin: unwichtig }
                hints: ["Was muss die Familie wissen, damit sie hingehen kann?"]
              - id: l2-s4
                type: multiple_choice
                text: "Ein Auto hupt laut. Du hast nicht gehört, was du mitbringen sollst. Welche Frage stellst du?"
                say: "Hör gut zu. Ein Auto hupt laut, und du hast nicht gehört, was du mitbringen sollst. Welche Frage stellst du?"
                audio: { de: "Der Trainer sagt: Bringt zum Training am Samstag eure ... mit." }
                options: ["Was sollen wir mitbringen?", "Wann ist das Training?", "Was?"]
                answer: "Was sollen wir mitbringen?"
                hints: ["Sag in der Frage, was dir fehlt."]
              - id: l2-s5
