# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.lists-cards
skill: lit-de.writing.lists-cards
curriculum: de-DE
language: de
title:
  de: "Zettel, Einladungen und Karten"
  en: "Lists, invitations and cards"
summary: >
  Short everyday texts and what goes into them. Lesson 1 writes a
  Einkaufszettel (one word per line, with the amount, no whole sentences)
  and a short Nachricht on a Zettel (wo bin ich, wann komme ich zurück,
  wer schreibt); lesson 2 checks an Einladung with Wer? Was? Wann? Wo?,
  builds a Glückwunschkarte from Anrede, Glückwunsch and Gruß, picks the
  wish for the occasion, and ends with the skill check. Writing the text
  freely waits for a free text task type; here the child chooses, sorts
  and orders the parts. The skill check marks what a screen can mark:
  what goes on each kind of text, what is missing and the order of the
  parts; writing one is left to Practise once free text arrives.
metadata:
  year: klasse-2
  topic: { de: Texte schreiben, en: Writing texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.writing.words-to-pictures]
  also_practises: [lit-de.writing.words-to-pictures]
  vocabulary: { de: [Einkaufszettel, Nachricht, Einladung, Glückwunschkarte, Anrede, Gruß, "Wer?", "Was?", "Wann?", "Wo?"] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: list, what: { de: "der Einkaufszettel: nur Wörter, jedes mit der Menge", en: "a shopping list: words only, each with its amount" } }
    - { id: message, what: { de: "die kurze Nachricht: wo, wann und wer", en: "a short note: where, when and who" } }
    - { id: invitation, what: { de: "die Einladung mit Wer? Was? Wann? Wo?", en: "an invitation that answers who, what, when and where" } }
    - { id: card, what: { de: "die Glückwunschkarte mit Anrede, Glückwunsch und Gruß", en: "a greeting card with greeting, wish and sign-off" } }
  misconceptions:
    - id: sentence-on-list
      what: Writes whole sentences on a shopping list, or leaves out how many of a thing
      addressed: "lesson 1 Learn shows a list of single words with amounts; l1-f1 (with feedback), l1-s1, l1-n1, l1-c1, l2-w1 and l2-c1 set the word against a sentence; l1-f2, l1-s2 and l1-n2 sort list words from sentences; l1-f3, l1-s3, l1-n3, l1-c2 and l2-c5 add the amount"
    - id: invitation-gaps
      what: Leaves the time or the place out of an invitation, so the guests cannot come
      addressed: "lesson 2 Learn checks an Einladung with Wer? Was? Wann? Wo?; every stage finds what is missing (l2-f1 with feedback, l2-s1, l2-n1, l2-c2) and matches the questions to their answers (l2-f2, l2-s2, l2-n2); l2-n5 shows an invitation with no time and no place"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Einkaufszettel und Nachrichten", en: "Shopping lists and notes" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort passt zum Bild?"
            say: "Was siehst du? Welches Wort ist richtig geschrieben?"
            show: { object: apple }
            options: ["Apfel", "Apel", "Abfel"]
            option_audio: false
            answer: "Apfel"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher Satz passt zum Bild?"
            say: "Schau dir das Bild an. Welcher Satz passt?"
            show: { object: cake }
            options: ["Der Kuchen steht auf dem Tisch.", "Die Katze schläft.", "Der Ball rollt weg."]
            option_audio: false
            answer: "Der Kuchen steht auf dem Tisch."
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Einkaufszettel\n2 Brote\nMilch\n6 Eier\nÄpfel"
            say: "Das ist ein Einkaufszettel. Darauf steht, was du kaufen willst. Du schreibst nur die Wörter, keine ganzen Sätze. Jedes Ding bekommt eine eigene Zeile."
          - text: "6 Eier\n2 Brote\n1 Liter Milch"
            say: "Schreib dazu, wie viel du brauchst. Sonst weiß niemand, ob er ein Ei oder sechs Eier kaufen soll."
          - text: "Liebe Mama,\nich bin bei Ida im Garten.\nUm 6 Uhr bin ich zurück.\nDein Tom"
            say: "Das ist eine kurze Nachricht auf einem Zettel. Sie sagt: Wo bin ich? Wann komme ich zurück? Und unten steht, wer sie geschrieben hat."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Mama will einkaufen. Was schreibt sie auf den Einkaufszettel?"
                say: "Mama will einkaufen. Was schreibt sie auf den Einkaufszettel?"
                options: ["Butter", "Ich möchte heute bitte auch Butter kaufen.", "Butter ist gelb."]
                answer: "Butter"
                feedback:
                  "Ich möchte heute bitte auch Butter kaufen.": "Auf einen Einkaufszettel kommt nur das Wort. Ein ganzer Satz ist zu lang."
                hints:
                  - "Ein Einkaufszettel ist kurz."
                  - "Was musst du im Laden wissen? Nur, was du kaufen sollst."
                  - "Butter."
                difficulty: easy
              - id: l1-f2
                type: sorting
                text: "Was gehört auf den Einkaufszettel?"
                say: "Was gehört auf den Einkaufszettel? Sortiere die Karten."
                bins:
                  - { id: list, show: { text: "auf den Zettel" }, say: "auf den Zettel" }
                  - { id: not, show: { text: "nicht auf den Zettel" }, say: "nicht auf den Zettel" }
                options:
                  - { text: "Brötchen", bin: list }
                  - { text: "Marmelade", bin: list }
                  - { text: "Heute ist Montag.", bin: not }
                  - { text: "Käse", bin: list }
                  - { text: "Ich gehe gern einkaufen.", bin: not }
                option_audio: false
                hints:
                  - "Auf den Zettel kommen Dinge, die man kaufen kann."
                  - "Kann man einen Montag kaufen?"
                  - "Brötchen, Marmelade und Käse kommen auf den Zettel. Die Sätze nicht."
              - id: l1-f3
                type: fill_in_blank
                text: "Mia braucht sechs Eier für den Kuchen. Was schreibt sie?"
                say: "Mia braucht sechs Eier für den Kuchen. Was schreibt sie auf den Zettel?"
                frame: "_ Eier"
                options: ["6", "viele", "ein paar"]
                answer: ["6"]
                feedback:
                  "viele": "Wie viele sind viele? Im Laden weiß das niemand. Schreib die Zahl."
                hints:
                  - "Im Laden muss man wissen, wie viele Eier es sein sollen."
                  - "Mia braucht sechs Eier. Welche Karte sagt das genau?"
                  - "6 Eier."
              - id: l1-f4
                type: multiple_choice
                text: "Auf dem Küchentisch liegt ein Zettel:\nLiebe Mama,\nich bin bei Ida.\nDein Tom\n\nWas fehlt in der Nachricht?"
                say: "Lies den Zettel. Was fehlt in der Nachricht?"
                options: ["wann Tom zurückkommt", "wo Tom ist", "wer den Zettel geschrieben hat"]
                answer: "wann Tom zurückkommt"
                hints:
                  - "Eine Nachricht sagt: Wo bin ich? Wann komme ich zurück? Wer schreibt?"
                  - "Wo Tom ist, steht da: bei Ida. Und unten steht Tom."
                  - "Es fehlt, wann Tom zurückkommt."
              - id: l1-f5
                type: true_false
                text: "Auf einem Einkaufszettel steht jedes Ding in einer eigenen Zeile. Stimmt das?"
                say: "Auf einem Einkaufszettel steht jedes Ding in einer eigenen Zeile. Stimmt das?"
                answer: true
                hints:
                  - "Stehen die Dinge auf dem Zettel nebeneinander oder untereinander?"
                  - "2 Brote, darunter Milch, darunter 6 Eier: Jedes Ding hat seine Zeile."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Papa braucht Nudeln. Was schreibt er auf den Einkaufszettel?"
                say: "Papa braucht Nudeln. Was schreibt er auf den Einkaufszettel?"
                options: ["Nudeln", "Papa braucht heute Nudeln zum Essen.", "Nudeln sind lang."]
                answer: "Nudeln"
                hints: ["Auf den Zettel kommt nur das Wort."]
              - id: l1-s2
                type: sorting
                text: "Was gehört auf den Einkaufszettel?"
                say: "Was gehört auf den Einkaufszettel? Sortiere die Karten."
                bins:
                  - { id: list, show: { text: "auf den Zettel" }, say: "auf den Zettel" }
                  - { id: not, show: { text: "nicht auf den Zettel" }, say: "nicht auf den Zettel" }
                options:
                  - { text: "Tomaten", bin: list }
                  - { text: "Gurke", bin: list }
                  - { text: "Der Laden macht um 8 Uhr auf.", bin: not }
                  - { text: "Reis", bin: list }
                  - { text: "Wir kochen heute zusammen.", bin: not }
                option_audio: false
                hints: ["Was kann man im Laden kaufen?"]
              - id: l1-s3
                type: fill_in_blank
                text: "Opa braucht zwei Liter Milch. Was schreibt er?"
                say: "Opa braucht zwei Liter Milch. Was schreibt er auf den Zettel?"
                frame: "_ Liter Milch"
                options: ["2", "viel", "etwas"]
                answer: ["2"]
                hints: ["Welche Karte sagt genau, wie viel?"]
              - id: l1-s4
                type: multiple_choice
                text: "Auf dem Küchentisch liegt ein Zettel:\nBin beim Fußball.\nUm 5 Uhr bin ich zurück.\n\nWas fehlt in der Nachricht?"
                say: "Lies den Zettel. Was fehlt in der Nachricht?"
                options: ["wer den Zettel geschrieben hat", "wo das Kind ist", "wann das Kind zurückkommt"]
                answer: "wer den Zettel geschrieben hat"
                hints: ["Schau, was ganz unten auf dem Zettel steht."]
              - id: l1-s5
                type: true_false
                text: "Unter eine kurze Nachricht schreibst du deinen Namen. Stimmt das?"
                say: "Unter eine kurze Nachricht schreibst du deinen Namen. Stimmt das?"
                answer: true
                hints: ["Wer den Zettel findet, will wissen, von wem er ist."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Was gehört auf einen Einkaufszettel?"
                say: "Was gehört auf einen Einkaufszettel?"
                options: ["4 Joghurts", "Joghurt schmeckt mir am besten.", "Ich esse gern Joghurt."]
                answer: "4 Joghurts"
              - id: l1-n2
                type: sorting
                text: "Was gehört auf den Einkaufszettel?"
                say: "Was gehört auf den Einkaufszettel? Sortiere die Karten."
                bins:
                  - { id: list, show: { text: "auf den Zettel" }, say: "auf den Zettel" }
                  - { id: not, show: { text: "nicht auf den Zettel" }, say: "nicht auf den Zettel" }
                options:
                  - { text: "Zahnpasta", bin: list }
                  - { text: "Seife", bin: list }
                  - { text: "Morgen ist Schule.", bin: not }
                  - { text: "Kekse", bin: list }
                  - { text: "Oma kommt zu Besuch.", bin: not }
                option_audio: false
              - id: l1-n3
                type: fill_in_blank
                text: "Lena braucht drei Gurken. Was schreibt sie?"
                say: "Lena braucht drei Gurken. Was schreibt sie auf den Zettel?"
                frame: "_ Gurken"
                options: ["3", "viele", "ein paar"]
                answer: ["3"]
              - id: l1-n4
                type: multiple_choice
                text: "An der Haustür hängt ein Zettel:\nLiebe Oma,\nich bin bei Max.\nDeine Pia\n\nWas fehlt in der Nachricht?"
                say: "Lies den Zettel. Was fehlt in der Nachricht?"
                options: ["wann Pia zurückkommt", "wo Pia ist", "wer den Zettel geschrieben hat"]
                answer: "wann Pia zurückkommt"
              - id: l1-n5
                type: true_false
                text: "Auf dem Zettel für Papa steht nur: „Bin weg.“ Weiß Papa jetzt, wo du bist?"
                say: "Auf dem Zettel für Papa steht nur: Bin weg. Weiß Papa jetzt, wo du bist?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Was schreibst du auf den Einkaufszettel?"
            say: "Was schreibst du auf den Einkaufszettel?"
            options: ["Honig", "Ich hätte so gern Honig.", "Honig ist süß."]
            answer: "Honig"
          - id: l1-c2
            type: fill_in_blank
            text: "Du brauchst fünf Äpfel. Was schreibst du?"
            say: "Du brauchst fünf Äpfel. Was schreibst du auf den Zettel?"
            frame: "_ Äpfel"
            options: ["5", "viele", "ein paar"]
            answer: ["5"]
          - id: l1-c3
            type: true_false
            text: "Liebe Mama,\nich bin bei Lukas.\nUm 7 Uhr bin ich zurück.\nDein Jan\n\nSteht alles Wichtige in der Nachricht?"
            say: "Lies den Zettel. Steht alles Wichtige in der Nachricht?"
            answer: true
          - id: l1-c4
            type: sorting
            text: "Kim kauft für das Frühstück ein. Was gehört auf ihren Zettel?"
            say: "Kim kauft für das Frühstück ein. Was gehört auf ihren Zettel? Sortiere die Karten."
            bins:
              - { id: list, show: { text: "auf den Zettel" }, say: "auf den Zettel" }
              - { id: not, show: { text: "nicht auf den Zettel" }, say: "nicht auf den Zettel" }
            options:
              - { text: "Müsli", bin: list }
              - { text: "Kim frühstückt um 7 Uhr.", bin: not }
              - { text: "Bananen", bin: list }
              - { text: "Joghurt", bin: list }
            option_audio: false
          - id: l1-c5
            type: multiple_choice
            text: "An der Tür hängt ein Zettel:\nLiebe Mama,\num 5 Uhr bin ich zurück.\nDein Emil\n\nWas fehlt in der Nachricht?"
            say: "Lies den Zettel. Was fehlt in der Nachricht?"
            options: ["wo Emil ist", "wann Emil zurückkommt", "wer den Zettel geschrieben hat"]
            answer: "wo Emil ist"
          - id: l1-c6
            type: true_false
            text: "Auf einen Einkaufszettel schreibst du ganze Sätze. Stimmt das?"
            say: "Auf einen Einkaufszettel schreibst du ganze Sätze. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Einladungen und Glückwunschkarten", en: "Invitations and greeting cards" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Du brauchst zwei Brote. Was schreibst du auf den Einkaufszettel?"
            say: "Du brauchst zwei Brote. Was schreibst du auf den Einkaufszettel?"
            options: ["2 Brote", "Brot ist lecker.", "Ich kaufe Brot, weil ich Hunger habe."]
            answer: "2 Brote"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Eine Nachricht auf einem Zettel sagt, wo du bist und wann du zurückkommst. Stimmt das?"
            say: "Eine Nachricht auf einem Zettel sagt, wo du bist und wann du zurückkommst. Stimmt das?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Liebe Ella,\nich lade dich zu meinem Geburtstag ein.\nWann? Am Samstag von 14 bis 17 Uhr.\nWo? Bei mir, Gartenweg 3.\nBring bitte Turnschuhe mit!\nDein Paul"
            say: "Das ist eine Einladung. Paul lädt Ella zu seinem Geburtstag ein. Darin steht, wann und wo das Fest ist. Ohne diese Angaben kann Ella nicht kommen."
          - text: "Wer? | Was? | Wann? | Wo?"
            say: "Prüf jede Einladung mit vier Fragen. Wer lädt ein? Was wird gefeiert? Wann ist das Fest? Wo ist das Fest?"
          - text: "Lieber Opa,\nalles Gute zum Geburtstag!\nBleib gesund!\nDeine Emma"
            say: "Das ist eine Glückwunschkarte. Oben steht die Anrede: Lieber Opa. Dann kommt der Glückwunsch. Unten steht der Gruß mit deinem Namen: Deine Emma."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Liebe Jule,\nich lade dich zu meinem Geburtstag ein.\nWo? Bei mir zu Hause.\nDein Finn\n\nWas fehlt in der Einladung?"
                say: "Lies die Einladung. Was fehlt?"
                options: ["wann das Fest ist", "wo das Fest ist", "wer einlädt"]
                answer: "wann das Fest ist"
                feedback:
                  "wo das Fest ist": "Das steht schon da: bei mir zu Hause. Steht auch da, an welchem Tag und um wie viel Uhr?"
                hints:
                  - "Prüf mit den Fragen: Wer? Was? Wann? Wo?"
                  - "Wer: Finn. Was: Geburtstag. Wo: bei Finn. Und wann?"
                  - "Es fehlt, wann das Fest ist."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Angabe aus einer Einladung."
                pairs:
                  - { left: { text: "Wann?" }, right: { text: "am Sonntag um 15 Uhr" } }
                  - { left: { text: "Wo?" }, right: { text: "im Schwimmbad" } }
                  - { left: { text: "Was?" }, right: { text: "mein Geburtstag" } }
                hints:
                  - "Wann fragt nach der Zeit, wo nach dem Ort."
                  - "Ein Tag und eine Uhrzeit sagen, wann."
                  - "Wann: Sonntag um 15 Uhr. Wo: im Schwimmbad. Was: Geburtstag."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Satz passt auf eine Glückwunschkarte?"
                say: "Welcher Satz passt auf eine Glückwunschkarte?"
                options: ["Alles Gute zum Geburtstag!", "Bring bitte Turnschuhe mit!", "Ich bin bei Ida."]
                answer: "Alles Gute zum Geburtstag!"
                hints:
                  - "Auf einer Glückwunschkarte wünschst du jemandem etwas."
                  - "Welcher Satz ist ein Wunsch?"
                  - "Alles Gute zum Geburtstag!"
              - id: l2-f4
                type: ordering
                text: "Leg die Glückwunschkarte in die richtige Reihenfolge."
                say: "Leg die Teile der Glückwunschkarte in die richtige Reihenfolge."
                options: ["Deine Hanna", "Liebe Tante Eva,", "alles Gute zum Geburtstag!"]
                slot_count: 3
                answer: ["Liebe Tante Eva,", "alles Gute zum Geburtstag!", "Deine Hanna"]
                hints:
                  - "Oben steht die Anrede, unten der Name."
                  - "Die Anrede beginnt mit Liebe."
                  - "Liebe Tante Eva, dann der Glückwunsch, dann Deine Hanna."
              - id: l2-f5
                type: true_false
                text: "In einer Einladung muss stehen, wann das Fest ist. Stimmt das?"
                say: "In einer Einladung muss stehen, wann das Fest ist. Stimmt das?"
                answer: true
                hints:
                  - "Denk an die vier Fragen."
                  - "Woher wissen die Gäste sonst, wann sie kommen sollen?"
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Lieber Ali,\nich lade dich zu meinem Fest ein.\nWann? Am Freitag um 16 Uhr.\nDeine Sara\n\nWas fehlt in der Einladung?"
                say: "Lies die Einladung. Was fehlt?"
                options: ["wo das Fest ist", "wann das Fest ist", "wer einlädt"]
                answer: "wo das Fest ist"
                hints: ["Prüf mit den Fragen: Wer? Was? Wann? Wo?"]
              - id: l2-s2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Angabe aus einer Einladung."
                pairs:
                  - { left: { text: "Wer?" }, right: { text: "Mia lädt ein." } }
                  - { left: { text: "Wann?" }, right: { text: "am Montag nach der Schule" } }
                  - { left: { text: "Wo?" }, right: { text: "im Park am Teich" } }
                hints: ["Wer fragt nach einer Person, wann nach der Zeit, wo nach dem Ort."]
              - id: l2-s3
                type: multiple_choice
                text: "Oma hat Geburtstag. Was schreibst du auf die Karte?"
                say: "Oma hat Geburtstag. Was schreibst du auf die Karte?"
                options: ["Liebe Oma, alles Gute zum Geburtstag!", "Liebe Oma, ich bin bei Max.", "2 Brote, Milch, Käse"]
                answer: "Liebe Oma, alles Gute zum Geburtstag!"
                hints: ["Auf eine Glückwunschkarte kommt ein Wunsch."]
              - id: l2-s4
                type: ordering
                text: "Leg die Glückwunschkarte in die richtige Reihenfolge."
                say: "Leg die Teile der Glückwunschkarte in die richtige Reihenfolge."
                options: ["Dein Leon", "Lieber Papa,", "alles Liebe zum Vatertag!"]
                slot_count: 3
                answer: ["Lieber Papa,", "alles Liebe zum Vatertag!", "Dein Leon"]
                hints: ["Zuerst die Anrede, zum Schluss der Name."]
              - id: l2-s5
                type: true_false
                text: "Auf einer Glückwunschkarte steht ganz unten dein Name. Stimmt das?"
                say: "Auf einer Glückwunschkarte steht ganz unten dein Name. Stimmt das?"
                answer: true
                hints: ["Woher weiß man sonst, von wem die Karte ist?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Liebe Klasse 2b,\nich lade euch zum Sommerfest ein.\nWann? Am Freitag um 15 Uhr.\nWo? Auf dem Schulhof.\n\nWas fehlt in der Einladung?"
                say: "Lies die Einladung. Was fehlt?"
                options: ["wer einlädt", "wann das Fest ist", "wo das Fest ist"]
                answer: "wer einlädt"
              - id: l2-n2
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Frage mit der passenden Angabe aus einer Einladung."
                pairs:
                  - { left: { text: "Was?" }, right: { text: "Laternenfest" } }
                  - { left: { text: "Wann?" }, right: { text: "am Dienstag um 17 Uhr" } }
                  - { left: { text: "Wo?" }, right: { text: "vor der Schule" } }
              - id: l2-n3
                type: multiple_choice
                text: "Dein Freund ist krank. Was schreibst du auf die Karte?"
                say: "Dein Freund ist krank. Was schreibst du auf die Karte?"
                options: ["Gute Besserung!", "Frohe Ostern!", "Herzlichen Glückwunsch zum Geburtstag!"]
                answer: "Gute Besserung!"
              - id: l2-n4
                type: ordering
                text: "Leg die Weihnachtskarte in die richtige Reihenfolge."
                say: "Leg die Teile der Weihnachtskarte in die richtige Reihenfolge."
                options: ["frohe Weihnachten!", "Viele Grüße von Lina", "Liebe Frau Kaya,"]
                slot_count: 3
                answer: ["Liebe Frau Kaya,", "frohe Weihnachten!", "Viele Grüße von Lina"]
              - id: l2-n5
                type: true_false
                text: "Auf der Einladung steht nur: „Komm zu meinem Fest! Dein Tim“. Weißt du jetzt, wann und wo das Fest ist?"
