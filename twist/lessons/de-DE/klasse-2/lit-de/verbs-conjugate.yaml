# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.verbs-conjugate
skill: lit-de.verbs.conjugate
curriculum: de-DE
language: de
title:
  de: Verben beugen
  en: Verb forms for each person
summary: >
  Das Verb passt sich an, wer etwas tut: ich spiele, du spielst, er
  spielt. Lesson 1 builds the forms for ich, du and er, sie, es from the
  word stem and its ending; lesson 2 adds wir, ihr and sie, puts the whole
  table together, and ends with the skill check. Only regular verbs whose
  stem does not end in t, d, s or z, so every ending is the plain one.
metadata:
  year: klasse-2
  topic: { de: Verben, en: Verbs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.verbs.recognise, lit-de.nouns.pronouns]
  also_practises: [lit-de.verbs.recognise]
  vocabulary: { de: [Verb, Wortstamm, Endung, ich, du, er, sie, es, wir, ihr, beugen] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: singular, what: { de: "ich, du, er, sie, es: die Endungen e, st und t", en: "I, you, he, she, it: the endings e, st and t" } }
    - { id: plural, what: { de: "wir, ihr, sie: die Endungen en und t", en: "we, you, they: the endings en and t" } }
    - { id: in-sentence, what: { de: "die Form wählen, wenn ein Name oder Nomen die Person ist (Lena, die Kinder)", en: "choosing the form when a name or noun is the person (Lena, the children)" } }
    - { id: table, what: { de: die ganze Reihe eines Verbs bilden, en: building all the forms of a verb } }
  misconceptions:
    - id: du-with-t
      what: Writes the er-form after du (du spielt)
      addressed: lesson 1 Learn sets du spielst and er spielt side by side; feedback on du spielt names the st
    - id: base-form-for-all
      what: Uses the Grundform for every person (ich spielen, er spielen)
      addressed: Learn starts from the stem; hören is an option in l1-f3 with feedback; l1-n4 asks whether ich spielen is right
    - id: ihr-like-wir
      what: Writes ihr with -en like wir (ihr spielen)
      addressed: lesson 2 Learn shows that ihr ends like er; a true/false task in each stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "ich, du, er, sie, es", en: "I, you, he, she, it" }
    goal:
      de: "Häng die passende Endung ans Verb für ich, du und er, so wie ich spiele, du spielst, er spielt."
      en: "Add the right verb ending for ich, du and er, like ich spiele, du spielst, er spielt."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Paul holt den Ball." }
            spans: ["holt"]
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist „kochen“ ein Verb?"
            say: "Lies das Wort auf der Karte. Ist es ein Verb?"
            show: { drawn: letter-card, text: "kochen" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "ich spiele · du spielst · er spielt"
            say: "Hör genau hin: ich spiele, du spielst, er spielt. Ein Teil vom Verb bleibt immer gleich. Was glaubst du: Welcher Teil ist das?"
          - text: "spielen → spiel"
            say: "Spiel bleibt gleich! Das Verb spielen hat einen Wortstamm: spiel. Daran hängen wir eine Endung. Welche Endung kommt, hängt davon ab, wer spielt."
          - text: "ich spiele · du spielst · er, sie, es spielt"
            say: "Ich spiele, mit e. Du spielst, mit st. Er spielt, sie spielt, es spielt, mit t."
          - text: "du spielst · er spielt"
            say: "Pass bei du auf. Zu du gehört immer st: du spielst, du malst. Er, sie und es bekommen nur ein t."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Form passt zu du? du ___"
                say: "Welche Form passt zu du? Lies die Formen."
                options: ["malst", "malt", "male"]
                answer: "malst"
                feedback:
                  "malt": "„Malt“ passt zu „er“, „sie“ oder „es“. Zu „du“ gehört „st“: du malst."
                hints:
                  - "Zu „du“ gehört die Endung „st“."
                  - "„mal“ und „st“."
                  - "du malst."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Setz die Endung ein, die zu ich passt."
                frame: "ich lach_"
                options: ["e", "st", "t"]
                answer: ["e"]
                hints:
                  - "Sprich es laut: ich lach... Was hörst du am Ende?"
                  - "Zu „ich“ gehört die Endung „e“."
                  - "ich lache. Es fehlt „e“."
              - id: l1-f3
                type: multiple_choice
                text: "Lena ___ ein Lied.\n\nWelche Form passt?"
                say: "Lies den Satz. Welche Form passt?"
                options: ["hörst", "hört", "hören"]
                answer: "hört"
                feedback:
                  "hören": "„Hören“ ist die Grundform. Für Lena, also „sie“, brauchst du die Endung „t“."
                hints:
                  - "„Lena“ kannst du durch „sie“ ersetzen."
                  - "Zu „sie“ gehört die Endung „t“."
                  - "Lena hört ein Lied."
              - id: l1-f4
                type: true_false
                text: "Stimmt das? du kochst"
                say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
                show: { drawn: letter-card, text: "du kochst" }
                answer: true
                hints:
                  - "Welche Endung gehört zu „du“?"
                  - "„st“."
                  - "Ja, du kochst."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von fragen."
                pairs:
                  - { left: { text: "ich" }, right: { text: "frage" } }
                  - { left: { text: "du" }, right: { text: "fragst" } }
                  - { left: { text: "es" }, right: { text: "fragt" } }
                hints:
                  - "„ich“ mit „e“, „du“ mit „st“, „es“ mit „t“."
                  - "ich frage."
                  - "ich frage, du fragst, es fragt."
              - id: l1-f6
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Du bau_ einen Turm."
                options: ["e", "st", "t"]
                answer: ["st"]
                hints:
                  - "Wer baut? Du."
                  - "Zu „du“ gehört „st“."
                  - "Du baust einen Turm."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welche Form passt zu er? er ___"
                say: "Welche Form passt zu er? Lies die Formen."
                options: ["sagst", "sage", "sagt"]
                answer: "sagt"
                hints: ["Welche Endung gehört zu „er“?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Setz die Endung ein, die zu ich passt."
                frame: "ich lern_"
                options: ["e", "st", "t"]
                answer: ["e"]
                hints: ["Welche Endung hat „ich“?"]
              - id: l1-s3
                type: multiple_choice
                text: "Du ___ den Hund.\n\nWelche Form passt?"
                say: "Lies den Satz. Welche Form passt?"
                options: ["suchst", "sucht", "suchen"]
                answer: "suchst"
                hints: ["Wer sucht?"]
              - id: l1-s4
                type: true_false
                text: "Stimmt das? du kauft"
                say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
                show: { drawn: letter-card, text: "du kauft" }
                answer: false
                hints: ["Welche Endung gehört zu „du“?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Das Kind wohn_ in Köln."
                options: ["e", "st", "t"]
                answer: ["t"]
                hints: ["Für „das Kind“ kannst du „es“ sagen."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welche Form passt zu ich? ich ___"
                say: "Welche Form passt zu ich? Lies die Formen."
                options: ["zeige", "zeigst", "zeigt"]
                answer: "zeige"
              - id: l1-n2
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Tim hol_ die Post."
                options: ["e", "st", "t"]
                answer: ["t"]
              - id: l1-n3
                type: multiple_choice
                text: "Du ___ sehr gut.\n\nWelche Form passt?"
                say: "Lies den Satz. Welche Form passt?"
                options: ["singst", "singt", "singe"]
                answer: "singst"
              - id: l1-n4
                type: true_false
                text: "Stimmt das? ich spielen"
                say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
                show: { drawn: letter-card, text: "ich spielen" }
                answer: false
                feedback:
                  "true": "Ich spielen? So spricht ein Roboter! Zu ich gehört e: ich spiele."
              - id: l1-n5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von malen."
                pairs:
                  - { left: { text: "du" }, right: { text: "malst" } }
                  - { left: { text: "ich" }, right: { text: "male" } }
                  - { left: { text: "sie" }, right: { text: "malt" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welche Form passt zu du? du ___"
            say: "Welche Form passt zu du? Lies die Formen."
            options: ["lernst", "lernt", "lerne"]
            answer: "lernst"
          - id: l1-c2
            type: fill_in_blank
            text: "Welche Endung passt?"
            say: "Lies den Satz. Setz die Endung ein."
            frame: "Oma koch_ Suppe."
            options: ["e", "st", "t"]
            answer: ["t"]
          - id: l1-c3
            type: true_false
            text: "Stimmt das? ich frage"
            say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
            show: { drawn: letter-card, text: "ich frage" }
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Mein Bruder ___ laut.\n\nWelche Form passt?"
            say: "Lies den Satz. Welche Form passt?"
            options: ["schnarcht", "schnarchst", "schnarche"]
            answer: "schnarcht"
          - id: l1-c5
            type: fill_in_blank
            text: "Welche Endung passt?"
            say: "Lies den Satz. Setz die Endung ein."
            frame: "Du schenk_ Mama eine Blume."
            options: ["e", "st", "t"]
            answer: ["st"]
          - id: l1-c6
            type: true_false
            text: "Stimmt das? ich hörst"
            say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
            show: { drawn: letter-card, text: "ich hörst" }
            answer: false

  - n: 2
    title: { de: "wir, ihr, sie", en: "we, you, they" }
    goal:
      de: "Finde die Formen für wir, ihr und sie, so wie wir spielen, ihr spielt, sie spielen."
      en: "Find the forms for wir, ihr and sie, like wir spielen, ihr spielt, sie spielen."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welche Form passt zu du? du ___"
            say: "Welche Form passt zu du? Lies die Formen."
            options: ["hörst", "hört", "höre"]
            answer: "hörst"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Welche Endung passt?"
            say: "Setz die Endung ein, die zu ich passt."
            frame: "ich sag_"
            options: ["e", "st", "t"]
            answer: ["e"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "ihr spielen oder ihr spielt?"
            say: "Du sprichst mit Tom und Lea. Was glaubst du: Heißt es ihr spielen oder ihr spielt?"
            show: { object: child, count: 2 }
          - text: "wir spielen · ihr spielt · sie spielen"
            say: "Ihr spielt! Bei mehreren heißt es: wir spielen, mit en. Ihr spielt, mit t. Sie spielen, mit en."
          - text: "ihr spielt · er spielt"
            say: "Ihr endet mit t, wie er. Wir und sie enden mit en, wie die Grundform spielen."
          - text: "ich spiele · du spielst · er spielt · wir spielen · ihr spielt · sie spielen"
            say: "Das ist die ganze Reihe: ich spiele, du spielst, er spielt, wir spielen, ihr spielt, sie spielen."
          - text: "Wusstest du? Auf Englisch heißt es: I play, you play, we play, they play."
            say: "Wusstest du? Auf Englisch ändert sich das Verb fast nie. I play, you play, we play, they play. Nur bei he, she und it kommt ein s dazu: he plays. Auf Deutsch hat spielen gleich vier verschiedene Endungen: e, st, t und en."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welche Form passt zu ihr? ihr ___"
                say: "Welche Form passt zu ihr? Lies die Formen."
                options: ["malst", "malt", "malen"]
                answer: "malt"
                feedback:
                  "malen": "„Malen“ passt zu „wir“ oder „sie“. „Ihr“ endet mit „t“: ihr malt."
                hints:
                  - "„Ihr“ endet wie „er“."
                  - "Die Endung ist „t“."
                  - "ihr malt."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Wir lach_ viel."
                options: ["en", "t", "st"]
                answer: ["en"]
                hints:
                  - "„Wir“ endet wie die Grundform „lachen“."
                  - "Zu „wir“ gehört die Endung „en“."
                  - "Wir lachen viel. Es fehlt „en“."
              - id: l2-f3
                type: true_false
                text: "Stimmt das? ihr kochen"
                say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
                show: { drawn: letter-card, text: "ihr kochen" }
                answer: false
                hints:
                  - "Wie endet „ihr“?"
                  - "„Ihr“ endet mit „t“."
                  - "Nein, richtig ist ihr kocht."
              - id: l2-f4
                type: multiple_choice
                text: "Die Kinder ___ Fußball.\n\nWelche Form passt?"
                say: "Lies den Satz. Welche Form passt?"
                show: { object: play-football }
                options: ["spielt", "spielen", "spielst"]
                answer: "spielen"
                hints:
                  - "„Die Kinder“ kannst du durch „sie“ ersetzen."
                  - "Viele Kinder: sie spielen."
                  - "spielen."
              - id: l2-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von bauen."
                pairs:
                  - { left: { text: "wir" }, right: { text: "bauen" } }
                  - { left: { text: "ihr" }, right: { text: "baut" } }
                  - { left: { text: "du" }, right: { text: "baust" } }
                hints:
                  - "„wir“ mit „en“, „ihr“ mit „t“, „du“ mit „st“."
                  - "ihr baut."
                  - "wir bauen, ihr baut, du baust."
              - id: l2-f6
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Ihr hol_ die Stühle."
                options: ["en", "t", "st"]
                answer: ["t"]
                hints:
                  - "Wer holt? Ihr."
                  - "„Ihr“ endet wie „er“."
                  - "Ihr holt die Stühle."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welche Form passt zu wir? wir ___"
                say: "Welche Form passt zu wir? Lies die Formen."
                options: ["fragt", "fragen", "fragst"]
                answer: "fragen"
                hints: ["Wie endet „wir“?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Ihr lern_ lesen."
                options: ["en", "t", "st"]
                answer: ["t"]
                hints: ["„Ihr“ endet wie „er“."]
              - id: l2-s3
                type: true_false
                text: "Stimmt das? sie wohnen"
                say: "Hier sind mehrere gemeint. Ist die Form richtig?"
                show: { drawn: letter-card, text: "sie wohnen" }
                answer: true
                hints: ["Wie endet „sie“, wenn es mehrere sind?"]
              - id: l2-s4
                type: multiple_choice
                text: "Mama und Papa ___ ein Haus.\n\nWelche Form passt?"
                say: "Lies den Satz. Welche Form passt?"
                show: { object: house }
                options: ["kauft", "kaufen", "kaufst"]
                answer: "kaufen"
                hints: ["Welches Pronomen kannst du für Mama und Papa einsetzen?"]
              - id: l2-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Person mit der passenden Form von zeigen."
                pairs:
                  - { left: { text: "ich" }, right: { text: "zeige" } }
                  - { left: { text: "ihr" }, right: { text: "zeigt" } }
                  - { left: { text: "sie (viele)" }, right: { text: "zeigen" } }
                hints: ["Denk an die Reihe ich, du, er, wir, ihr, sie."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welche Form passt zu ihr? ihr ___"
                say: "Welche Form passt zu ihr? Lies die Formen."
                options: ["sucht", "suchen", "suchst"]
                answer: "sucht"
              - id: l2-n2
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Wir sing_ ein Lied."
                options: ["en", "t", "st"]
                answer: ["en"]
              - id: l2-n3
                type: true_false
                text: "Stimmt das? ihr fragt"
                say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
                show: { drawn: letter-card, text: "ihr fragt" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Die Vögel ___ ein Nest.\n\nWelche Form passt?"
                say: "Lies den Satz. Welche Form passt?"
                show: { object: bird, count: 2 }
                options: ["baut", "bauen", "baust"]
                answer: "bauen"
              - id: l2-n5
                type: fill_in_blank
                text: "Welche Endung passt?"
                say: "Lies den Satz. Setz die Endung ein."
                frame: "Du hör_ Musik."
                options: ["en", "t", "st"]
                answer: ["st"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: singular
            type: multiple_choice
            text: "Welche Form passt zu du? du ___"
            say: "Welche Form passt zu du? Lies die Formen."
            options: ["holst", "holt", "hole"]
            answer: "holst"
          - id: l2-c2
            part: plural
            type: fill_in_blank
            text: "Welche Endung passt?"
            say: "Lies den Satz. Setz die Endung ein."
            frame: "Ihr koch_ Nudeln."
            options: ["en", "t", "st"]
            answer: ["t"]
          - id: l2-c3
            part: singular
            type: true_false
            text: "Stimmt das? er lachst"
            say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
            show: { drawn: letter-card, text: "er lachst" }
            answer: false
          - id: l2-c4
            part: in-sentence
            type: multiple_choice
            text: "Lisa und Ben ___ Kuchen.\n\nWelche Form passt?"
            say: "Lies den Satz. Welche Form passt?"
            options: ["backt", "backen", "backst"]
            answer: "backen"
          - id: l2-c5
            part: table
            type: matching
            text: "Was passt zusammen?"
            say: "Verbinde jede Person mit der passenden Form von wohnen."
            pairs:
              - { left: { text: "ich" }, right: { text: "wohne" } }
              - { left: { text: "du" }, right: { text: "wohnst" } }
              - { left: { text: "wir" }, right: { text: "wohnen" } }
              - { left: { text: "ihr" }, right: { text: "wohnt" } }
          - id: l2-c6
            part: singular
            type: fill_in_blank
            text: "Welche Endung passt zu ich?"
            say: "Lies den Satz. Setz die Endung ein."
            frame: "Ich kämm_ mir die Haare."
            options: ["e", "st", "t"]
            answer: ["e"]
          - id: l2-c7
            part: singular
            type: multiple_choice
            text: "Welche Form passt zu er? er ___"
            say: "Welche Form passt zu er? Lies die Formen."
            options: ["winkst", "winke", "winkt"]
            answer: "winkt"
          - id: l2-c8
            part: singular
            type: multiple_choice
            text: "Welcher Satz ist richtig?"
            say: "Lies die drei Sätze. Welcher ist richtig?"
            options: ["Du träumt.", "Du träumst.", "Du träume."]
            answer: "Du träumst."
          - id: l2-c9
            part: plural
            type: multiple_choice
            text: "Welche Form passt zu wir? wir ___"
            say: "Welche Form passt zu wir? Lies die Formen."
            options: ["zählt", "zählst", "zählen"]
            answer: "zählen"
          - id: l2-c10
            part: plural
            type: true_false
            text: "Stimmt das? wir lernt"
            say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
            show: { drawn: letter-card, text: "wir lernt" }
            answer: false
          - id: l2-c11
            part: plural
            type: fill_in_blank
            text: "Welche Endung passt?"
            say: "Lies den Satz. Setz die Endung ein."
            frame: "Wir wünsch_ dir alles Gute."
            options: ["en", "t", "st"]
            answer: ["en"]
          - id: l2-c12
            part: plural
