# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.short-long-vowels
skill: lit-de.spelling.short-long-vowels
curriculum: de-DE
language: de
title:
  de: Kurze und lange Selbstlaute
  en: Short and long vowels
summary: >
  Hearing whether a vowel is short or long. Lesson 1 compares Hase and
  Ball and sorts pictures by the vowel; lesson 2 takes word pairs that
  only differ in the length (Hüte, Hütte; Ofen, offen; Beet, Bett), picks
  the word that fits a sentence, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling.vowels-consonants]
  also_practises: [lit-de.phonological.syllables]
  vocabulary: { de: [Selbstlaut, kurz, lang, dehnen] }
  forms: [picture, audio, text]
  drawn: []
  facets: []
  parts:
    - { id: by-ear, what: { de: "hören, ob ein Selbstlaut kurz oder lang ist", en: hearing whether a vowel is short or long } }
    - { id: pictures, what: { de: Bilder mit kurzem oder langem Selbstlaut finden und sortieren, en: finding and sorting pictures by a short or long vowel } }
    - { id: pairs, what: { de: "Wortpaare unterscheiden, die sich nur in der Länge des Selbstlauts unterscheiden", en: telling apart word pairs that differ only in the length of the vowel } }
  misconceptions:
    - id: length-by-word
      what: Judges the vowel by the length of the word, not the vowel (Kuchen is long, so Schnecke must be long too)
      addressed: lesson 1 Learn says to listen only to the vowel; the sorting tasks in every stage of lesson 1 mix long and short words of one and two syllables
    - id: pairs-sound-same
      what: Hears Hüte and Hütte, Beet and Bett as the same word
      addressed: lesson 2 Learn contrasts Hüte, Hütte and Ofen, offen; every stage of lesson 2 has a sentence where only one word of a pair fits (Ofen, offen; Beet, Bett; Hütte, Hüte; still, Stiel; Mitte, Miete), and the full and some stages give hints that point at the meaning
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Hase oder Ball?", en: "Hase or Ball?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Silben hat Banane?"
            say: "Schwinge das Wort Banane. Wie viele Silben hat es?"
            show: { object: banana }
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: image_multiple_choice
            text: "Welches Wort fängt mit L an?"
            say: "Tippe auf die Bilder und hör die Wörter. Welches Wort fängt mit L an?"
            options:
              - { object: grandpa }
              - { object: grandma }
              - { object: llama }
            answer: llama
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hase"
            say: "Hör genau hin: Hase. Das a klingt lang. Du kannst es ziehen: Haaa-se."
            show: { object: rabbit }
          - text: "Ball"
            say: "Hör genau hin: Ball. Das a ist kurz und schnell vorbei."
            show: { object: ball }
          - text: "lang wie Hase | kurz wie Ball"
            say: "Sprich das Wort langsam und hör nur auf den Selbstlaut. Ist er lang wie in Hase oder kurz wie in Ball?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: audio_choice
                text: "Ist das o kurz oder lang?"
                say: "Hör zu. Ist das o kurz oder lang?"
                audio: { de: "Sonne." }
                options: ["kurz", "lang"]
                keep_order: true
                answer: "kurz"
                hints:
                  - "Sprich das Wort langsam: Son-ne."
                  - "Kannst du das o ziehen? Oder ist es schnell vorbei?"
                  - "Das o ist kurz."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Wo hörst du ein langes a?"
                say: "Tippe auf die Bilder und hör die Wörter. Wo hörst du ein langes a?"
                options:
                  - { object: nose }
                  - { object: cat }
                  - { object: jug }
                answer: nose
                hints:
                  - "Tippe auf jedes Bild und hör genau hin."
                  - "In welchem Wort kannst du das a ziehen?"
                  - "Nase."
              - id: l1-f3
                type: audio_choice
                text: "Ist das i kurz oder lang?"
                say: "Hör zu. Ist das i kurz oder lang?"
                audio: { de: "Igel." }
                options: ["kurz", "lang"]
                keep_order: true
                answer: "lang"
                hints:
                  - "Sprich das Wort langsam: I-gel."
                  - "Versuch, das i zu ziehen: Iii-gel. Klingt das noch richtig?"
                  - "Das i ist lang."
              - id: l1-f4
                type: true_false
                text: "Ist das u in Hund lang?"
                say: "Hund. Ist das u lang?"
                show: { object: dog }
                answer: false
                hints:
                  - "Sprich das Wort langsam."
                  - "Versuch, das u zu ziehen: Huuund. Klingt das noch richtig?"
                  - "Nein, das u ist kurz."
              - id: l1-f5
                type: sorting
                text: "Kurz oder lang?"
                say: "Hör auf den Selbstlaut. Ist er kurz wie in Ball oder lang wie in Hase? Sortiere die Bilder."
                bins:
                  - { id: kurz, show: { object: ball }, say: "Kurz wie in Ball." }
                  - { id: lang, show: { object: rabbit }, say: "Lang wie in Hase." }
                options:
                  - { object: fish, bin: kurz }
                  - { object: goat, bin: lang }
                  - { object: hat, bin: lang }
                  - { object: sock, bin: kurz }
                hints:
                  - "Tippe auf jedes Bild und hör auf den Selbstlaut."
                  - "Fisch: Kannst du das i ziehen, oder ist es schnell vorbei? Mach so mit jedem Bild weiter."
                  - "Kurz: Fisch, Socke. Lang: Ziege, Hut."

