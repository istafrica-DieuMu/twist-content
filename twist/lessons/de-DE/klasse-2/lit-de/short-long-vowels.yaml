                  - { id: lang, show: { object: rabbit }, say: "Lang wie in Hase." }
                options:
                  - { object: snail, bin: kurz }
                  - { object: shoe, bin: lang }
                  - { object: duck, bin: kurz }
                  - { object: oven, bin: lang }
                hints: ["Tippe auf jedes Bild und hör nur auf den Selbstlaut."]

          - support: none
            tasks:
              - id: l1-n1
                type: audio_choice
                text: "Ist das i kurz oder lang?"
                say: "Hör zu. Ist das i kurz oder lang?"
                audio: { de: "Tisch." }
                options: ["kurz", "lang"]
                keep_order: true
                answer: "kurz"
              - id: l1-n2
                type: image_multiple_choice
                text: "Wo hörst du ein langes u?"
                say: "Tippe auf die Bilder und hör die Wörter. Wo hörst du ein langes u?"
                options:
                  - { object: mouth }
                  - { object: cow }
                  - { object: dog }
                answer: cow
              - id: l1-n3
                type: audio_choice
                text: "Ist das o kurz oder lang?"
                say: "Hör zu. Ist das o kurz oder lang?"
                audio: { de: "Hose." }
                options: ["kurz", "lang"]
                keep_order: true
                answer: "lang"
              - id: l1-n4
                type: true_false
                text: "Ist das a in Katze lang?"
                say: "Katze. Ist das a lang?"
                show: { object: cat }
                answer: false
              - id: l1-n5
                type: sorting
