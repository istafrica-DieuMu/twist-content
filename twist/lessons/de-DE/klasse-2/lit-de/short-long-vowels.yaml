                say: "Hör auf den Selbstlaut. Ist er kurz wie in Ball oder lang wie in Hase? Sortiere die Bilder."
                bins:
                  - { id: kurz, show: { object: ball }, say: "Kurz wie in Ball." }
                  - { id: lang, show: { object: rabbit }, say: "Lang wie in Hase." }
                options:
                  - { object: leaf, bin: kurz }
                  - { object: whale, bin: lang }
                  - { object: bee, bin: lang }
                  - { object: cup, bin: kurz }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: audio_choice
            text: "Ist das a kurz oder lang?"
            say: "Hör zu. Ist das a kurz oder lang?"
            audio: { de: "Saft." }
            options: ["kurz", "lang"]
            keep_order: true
