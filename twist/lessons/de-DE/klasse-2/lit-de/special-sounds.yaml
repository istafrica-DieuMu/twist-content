# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.special-sounds
skill: lit-de.spelling.special-sounds
curriculum: de-DE
language: de
title:
  de: Sp, St, Qu, V, X und chs
  en: Sp, St, Qu, V, X and chs
summary: >
  Letters that are not written the way they sound. Lesson 1 takes Sp and
  St (schp and scht are written Sp and St); lesson 2 takes Qu for kw, V
  for f in Merkwörter (Vogel, Vater, viel, vor), and x or chs for ks
  (Hexe, Fuchs, sechs), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Besondere Laute, en: Special sounds }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.letters.c-y-x-aeu-ck-ss]
  also_practises: [lit-de.spelling-strategies.memory-words]
  vocabulary: { de: [Laut, Buchstabe, Merkwort] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-sch
      what: Writes the sch that is heard (Schtern, Schpiel)
      addressed: lesson 1 Learn hears scht and schp and shows St and Sp; every stage of lesson 1 offers the sch spelling, and the full and none stages have a misspelt card (Schtift, Schpaß); the skill check has Schpinne
    - id: f-for-v
      what: Writes f in v words (Fogel, fon)
      addressed: lesson 2 Learn names the v Merkwörter; every stage of lesson 2 has a v choice, three of them in a sentence where only one word fits (l2-f5 viel, l2-s5 vor, l2-n2 von); the skill check has vergessen
    - id: ks-spellings
      what: Writes ks for x or chs (Hekse, Fuks)
      addressed: lesson 2 Learn shows x and chs; every stage of lesson 2 has an x or chs gap with ks as a chip, and l2-f4 shows Hekse
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Sp und St", en: "Sp and St" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Hörst du am Anfang von Stern ein sch?"
            say: "Stern. Hörst du am Anfang ein sch?"
            show: { object: star }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Silben hat Spiegel?"
            say: "Spiegel. Wie viele Silben hat das Wort?"
            show: { object: mirror }
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Stern"
            say: "Hör genau hin: Stern. Am Anfang hörst du scht. Geschrieben wird aber nur St."
            show: { object: star }
          - text: "Spiegel"
            say: "Bei Spiegel hörst du schp. Geschrieben wird Sp."
            show: { object: mirror }
          - text: "St wie Stern | Sp wie Spiegel"
            say: "Merk dir: Hörst du am Anfang scht oder schp, schreibst du St oder Sp. Auch in aufstehen hörst du scht und schreibst st."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Der Stuhl. Was fehlt am Anfang?"
                show: { object: chair }
                frame: "_uhl"
                options: ["St", "Scht", "Sd"]
                answer: ["St"]
                hints:
                  - "Sprich das Wort und hör auf den Anfang."
                  - "Stuhl: Am Anfang höre ich scht. Scht schreibe ich nur mit S und t."
                  - "St."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Spiel. Welches Wort ist richtig geschrieben?"
                options: ["Spiel", "Schpiel", "Sbiel"]
                answer: "Spiel"
                option_audio: false
                feedback:
                  "Schpiel": "Du hörst schp, aber du schreibst nur Sp."
                hints:
                  - "Denk an Spiegel. Wie fängt Spiegel an?"
                  - "Spiel: Am Anfang höre ich schp. Schp schreibe ich nur mit S und p."
                  - "Spiel."
              - id: l1-f3
                type: image_multiple_choice
                text: "Welches Wort fängt mit Sp an?"
                say: "Tippe auf die Bilder und hör die Wörter. Welches Wort fängt mit Sp an?"
                options:
                  - { object: star }
                  - { object: web }
                  - { object: chair }
                answer: web
                hints:
                  - "Sprich jedes Wort und hör auf den Anfang."
                  - "Stern, Spinnennetz, Stuhl. Bei welchem Wort höre ich schp?"
                  - "Tippe auf das Spinnennetz."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Stift. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Schtift" }
                answer: false
                hints:
                  - "Denk an die Regel: Wie schreibst du scht am Anfang?"
                  - "Stift: Am Anfang höre ich scht. Auf der Karte steht Scht, aber man schreibt nur St."
                  - "Nein. Richtig ist Stift."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Die Spinne. Was fehlt am Anfang?"
                frame: "_inne"
                options: ["Sp", "Schp", "Sb"]
                answer: ["Sp"]
                hints:
                  - "Sprich das Wort und hör auf den Anfang."
                  - "Spinne: Am Anfang höre ich schp. Schp schreibe ich nur mit S und p."
                  - "Sp."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Die Straße. Was fehlt am Anfang?"
                frame: "_raße"
                options: ["St", "Scht", "Sd"]
                answer: ["St"]
                hints: ["Scht schreibst du als St."]
              - id: l1-s2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Sport. Welches Wort ist richtig geschrieben?"
                options: ["Sport", "Schport", "Sbort"]
                answer: "Sport"
                option_audio: false
                hints: ["Schp schreibst du als Sp."]
              - id: l1-s3
                type: image_multiple_choice
                text: "Welches Wort fängt mit St an?"
                say: "Tippe auf die Bilder und hör die Wörter. Welches Wort fängt mit St an?"
                options:
                  - { object: mirror }
                  - { object: star }
                  - { object: sun }
                answer: star
                hints: ["Wo hörst du am Anfang scht?"]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Spielen. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "spielen" }
                answer: true
                hints: ["Schp schreibst du als Sp."]
              - id: l1-s5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Der Bleistift. Was fehlt?"
                show: { object: pencil }
                frame: "Blei_ift"
                options: ["st", "scht", "sd"]
                answer: ["st"]
                hints: ["Wie bei aufstehen: Hörst du scht, schreibst du st."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Der Stein. Was fehlt am Anfang?"
                frame: "_ein"
                options: ["St", "Scht", "Sd"]
                answer: ["St"]
              - id: l1-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Springen. Welches Wort ist richtig geschrieben?"
                options: ["springen", "schpringen", "sbringen"]
                answer: "springen"
                option_audio: false
              - id: l1-n3
                type: image_multiple_choice
                text: "Welches Wort fängt mit St an?"
                say: "Tippe auf die Bilder und hör die Wörter. Welches Wort fängt mit St an?"
                options:
                  - { object: bike }
                  - { object: chair }
                  - { object: bus }
                answer: chair
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Spaß. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Schpaß" }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Verstehen. Was fehlt?"
                frame: "ver_ehen"
                options: ["st", "scht", "sd"]
                answer: ["st"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Was fehlt am Anfang?"
            say: "Der Spielplatz. Was fehlt am Anfang?"
            frame: "_ielplatz"
            options: ["Sp", "Schp", "Sb"]
            answer: ["Sp"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Stark. Welches Wort ist richtig geschrieben?"
            options: ["stark", "schtark", "sdark"]
            answer: "stark"
            option_audio: false
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Die Stunde. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Stunde" }
            answer: true

  - n: 2
    title: { de: "Qu, V, X und chs", en: "Qu, V, X and chs" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Was fehlt am Anfang?"
            say: "Die Stadt. Was fehlt am Anfang?"
            frame: "_adt"
            options: ["St", "Scht"]
            answer: ["St"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Spät. Welches Wort ist richtig geschrieben?"
            options: ["spät", "schpät", "sbät"]
            answer: "spät"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Quadrat | quietschen | bequem"
            say: "Hörst du kw, schreibst du Qu: Quadrat, quietschen, bequem. Nach dem Q kommt immer ein u."
          - text: "vier | voll | Vorsicht | verstecken"
            say: "In manchen Wörtern hörst du f und schreibst v: vier, voll, Vorsicht. Auch ver am Anfang schreibst du mit v, wie in verstecken. Das sind Merkwörter."
          - text: "Text | Lachs | Ochse"
            say: "Hörst du ks, schreibst du in manchen Wörtern x wie in Text, in anderen chs wie in Lachs und Ochse. Auch das musst du dir merken."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Die Qualle. Was fehlt am Anfang?"
                frame: "_alle"
                options: ["Qu", "Kw", "Q"]
                answer: ["Qu"]
                hints:
                  - "Sprich das Wort und hör auf den Anfang."
                  - "Qualle: Am Anfang höre ich kw. Kw schreibe ich mit Q, und nach dem Q kommt immer ein u."
                  - "Qu."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Vogel. Welches Wort ist richtig geschrieben?"
                show: { object: bird }
                options: ["Vogel", "Fogel", "Vohgel"]
                answer: "Vogel"
                option_audio: false
                hints:
                  - "Denk an die Merkwörter mit v, wie vier und voll."
                  - "Vogel: Am Anfang höre ich f. Vogel ist aber ein Merkwort mit V."
                  - "Vogel."
              - id: l2-f3
                type: fill_in_blank
                text: "Was fehlt am Ende?"
                say: "Der Fuchs. Was fehlt am Ende?"
                show: { object: fox }
                frame: "Fu_"
                options: ["chs", "x", "ks"]
                answer: ["chs"]
                hints:
                  - "Fuchs ist ein Merkwort. Denk an Lachs: Fuchs endet genauso."
                  - "Fuchs: Am Ende höre ich ks. In Fuchs schreibt man es wie in Lachs."
                  - "chs."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Hexe. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Hekse" }
                answer: false
                hints:
                  - "Schau dir an, wie ks auf der Karte geschrieben ist."
                  - "Hexe: In der Mitte höre ich ks. In Hexe schreibt man es mit x."
                  - "Nein. Richtig ist Hexe."
              - id: l2-f5
                type: multiple_choice
                text: "Ich habe heute … Zeit."
                say: "Ich habe heute viel Zeit. Welches Wort gehört in die Lücke?"
                options: ["viel", "fiel"]
                answer: "viel"
                option_audio: false
                hints:
                  - "Überleg, was der Satz sagen will."
                  - "Fiel kommt von fallen: Der Ball fiel runter. Hier geht es darum, wie viel Zeit ich habe."
                  - "viel."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Der Quark. Was fehlt am Anfang?"
                frame: "_ark"
                options: ["Qu", "Kw", "Q"]
                answer: ["Qu"]
                hints: ["Nach dem Q kommt immer ein u."]
              - id: l2-s2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Vater. Welches Wort ist richtig geschrieben?"
                options: ["Vater", "Fater", "Vahter"]
                answer: "Vater"
                option_audio: false
                hints: ["Vater gehört zu den Merkwörtern wie Vogel."]
              - id: l2-s3
                type: fill_in_blank
                text: "Was fehlt am Ende?"
                say: "Sechs. Was fehlt am Ende?"
                frame: "se_"
                options: ["chs", "ks", "cks"]
                answer: ["chs"]
                hints: ["Sechs endet wie Fuchs."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Das Taxi. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Taxi" }
                answer: true
                hints: ["In Taxi hörst du ks. Wie wird es geschrieben?"]
              - id: l2-s5
                type: multiple_choice
                text: "Der Ball liegt … dem Tor."
                say: "Der Ball liegt vor dem Tor. Welches Wort gehört in die Lücke?"
                options: ["vor", "for"]
                answer: "vor"
                option_audio: false
                hints: ["Vor ist ein Merkwort mit v."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Was fehlt am Anfang?"
                say: "Quaken. Was fehlt am Anfang?"
                frame: "_aken"
                options: ["qu", "kw", "q"]
                answer: ["qu"]
              - id: l2-n2
                type: multiple_choice
                text: "Das ist ein Brief … Oma."
                say: "Das ist ein Brief von Oma. Welches Wort gehört in die Lücke?"
                options: ["von", "fon"]
                answer: "von"
                option_audio: false
              - id: l2-n3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Wachsen. Was fehlt?"
                frame: "wa_en"
                options: ["chs", "x", "ks"]
                answer: ["chs"]
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Quatsch. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Kwatsch" }
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Die Hexe. Was fehlt?"
                frame: "He_e"
                options: ["x", "chs", "ks"]
                answer: ["x"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Was fehlt am Anfang?"
            say: "Der Stiefel. Was fehlt am Anfang?"
            frame: "_iefel"
            options: ["St", "Scht", "Sd"]
            answer: ["St"]
          - id: l2-c2
            type: fill_in_blank
            text: "Was fehlt am Anfang?"
            say: "Die Quelle. Was fehlt am Anfang?"
            frame: "_elle"
            options: ["Qu", "Kw", "Q"]
            answer: ["Qu"]
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Vergessen. Welches Wort ist richtig geschrieben?"
            options: ["vergessen", "fergessen", "wergessen"]
            answer: "vergessen"
            option_audio: false
          - id: l2-c4
            type: fill_in_blank
            text: "Was fehlt am Ende?"
            say: "Der Dachs. Was fehlt am Ende?"
            frame: "Da_"
            options: ["chs", "ks", "cks"]
            answer: ["chs"]
          - id: l2-c5
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Die Spinne. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Schpinne" }
            answer: false
