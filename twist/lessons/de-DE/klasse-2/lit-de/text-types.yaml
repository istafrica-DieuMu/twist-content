# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.text-types
skill: lit-de.texts-media.text-types
curriculum: de-DE
language: de
title:
  de: Textarten
  en: Kinds of text
summary: >
  Telling Geschichte, Gedicht, Anleitung, Lexikoneintrag, Witz and Brief
  apart and knowing what each is for. Lesson 1 recognises each kind by
  its form (Es war einmal, Verse that rhyme, numbered steps, a heading
  word with facts, a punch line, Liebe Oma), also when two texts share a
  topic; lesson 2 says what each kind is for, picks the kind a wish needs
  (Waffeln backen: ein Rezept), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Textarten, en: Kinds of text }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.decoding.first-texts]
  also_practises: [lit-de.decoding.first-texts]
  vocabulary: { de: [Textart, Geschichte, Gedicht, Anleitung, Rezept, Lexikoneintrag, Witz, Brief, Vers] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: literary, what: { de: "Geschichte, Gedicht und Witz an der Form erkennen", en: "recognising a story, a poem and a joke by their form" } }
    - { id: practical, what: { de: "Anleitung, Lexikoneintrag und Brief an der Form erkennen", en: "recognising instructions, an encyclopedia entry and a letter by their form" } }
    - { id: purpose, what: { de: "sagen, wozu eine Textart da ist", en: saying what a kind of text is for } }
    - { id: choose, what: { de: "die Textart wählen, die zu einem Wunsch passt", en: choosing the kind of text a wish needs } }
  misconceptions:
    - id: topic-not-form
      what: Decides the kind of text by its topic, not its form, so every text about a cat or a bear is a Geschichte
      addressed: "lesson 1 Learn shows the kinds side by side; l1-f4 sets a Lexikoneintrag about the cat against Geschichte with feedback; l1-s5 sorts story and Lexikon sentences about the same bear; l2-c3 sorts a joke and Lexikon sentences about the Bagger"
    - id: wrong-kind-for-purpose
      what: Picks a text that is about the right thing but does not do the job (a Geschichte to find out what a Biber eats, a Gedicht to bake Waffeln)
      addressed: "lesson 2 Learn names the job of each kind; \"Welchen Text brauchst du?\" in every stage of lesson 2 (l2-f2, l2-f3, l2-s2, l2-s3, l2-n2, l2-n3, l2-c4), with feedback on l2-f2"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Textarten erkennen", en: "Recognising kinds of text" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Kann das sein? Der Fisch klettert auf den Baum."
            say: "Lies den Satz genau. Kann das so sein?"
            answer: false
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ben hat eine Katze.\nSie heißt Minka.\n\nWie heißt die Katze?"
            say: "Lies den Text und die Frage. Wie heißt die Katze?"
            options: ["Minka", "Ben", "Katze"]
            answer: "Minka"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Es war einmal ein kleiner Igel.\nEr wollte nicht schlafen.\nDa kam die Eule geflogen.\n\nDie Katze liegt im Sonnenschein,\nsie schläft und träumt und ist allein."
            say: "Oben steht eine Geschichte. In einer Geschichte passiert etwas, eins nach dem anderen. Unten steht ein Gedicht. Es hat kurze Zeilen, die heißen Verse. Oft reimen sie sich: Sonnenschein und allein."
          - text: "So faltest du ein Schiff:\n1. Nimm ein Blatt Papier.\n2. Falte es in der Mitte.\n\nKatze\nDie Katze ist ein Haustier.\nSie hat ein weiches Fell."
            say: "Oben steht eine Anleitung. Sie sagt dir Schritt für Schritt, was du tun sollst. Oft haben die Schritte Nummern. Unten steht ein Lexikoneintrag. Er erklärt eine Sache, hier die Katze."
          - text: "Was ist grün und klopft an die Tür?\nEin Klopfsalat!\n\nLiebe Oma,\nwie geht es dir?\nViele Grüße\ndeine Lea"
            say: "Oben steht ein Witz. Am Ende kommt etwas Lustiges. Unten steht ein Brief. Er fängt mit einer Anrede an, Liebe Oma, und hört mit einem Gruß auf."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "So baust du einen Papierflieger:\n1. Nimm ein Blatt Papier.\n2. Falte es der Länge nach.\n3. Knick die Ecken nach innen.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["eine Anleitung", "eine Geschichte", "ein Gedicht"]
                answer: "eine Anleitung"
                hints:
                  - "Schau auf den Anfang jeder Zeile."
                  - "Die Zeilen haben Nummern. Sie sagen dir, was du tun sollst."
                  - "Das ist eine Anleitung."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Der Schnee fällt leise auf das Haus,\ndie Kinder laufen schnell hinaus.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["ein Gedicht", "ein Brief", "ein Lexikoneintrag"]
                answer: "ein Gedicht"
                hints:
                  - "Lies das letzte Wort jeder Zeile."
                  - "Haus und hinaus reimen sich."
                  - "Das ist ein Gedicht."
              - id: l1-f3
                type: true_false
                text: "Lieber Opa,\ndanke für das tolle Buch!\nDein Jonas\n\nIst das ein Brief?"
                say: "Lies den Text. Ist das ein Brief?"
                answer: true
                hints:
                  - "Schau auf den Anfang und das Ende."
                  - "Oben steht Lieber Opa, unten Dein Jonas."
                  - "Ja, das ist ein Brief."
              - id: l1-f4
                type: multiple_choice
                text: "Katze\nDie Katze ist ein Haustier.\nSie hat ein weiches Fell und Schnurrhaare.\nKatzen fressen Fleisch und Fisch.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["ein Lexikoneintrag", "eine Geschichte", "ein Witz"]
                answer: "ein Lexikoneintrag"
                feedback:
                  "eine Geschichte": "In einer Geschichte passiert etwas. Hier passiert nichts. Der Text erklärt, wie Katzen sind."
                hints:
                  - "Passiert in dem Text etwas, oder erklärt er etwas?"
                  - "Der Text erklärt, was eine Katze ist."
                  - "Das ist ein Lexikoneintrag."
              - id: l1-f5
                type: matching
                text: "Wie fängt die Textart an? Was passt zusammen?"
                say: "Verbinde jede Textart mit einem Anfang, der zu ihr passt."
                pairs:
                  - { left: { text: "Geschichte" }, right: { text: "Es war einmal ..." } }
                  - { left: { text: "Brief" }, right: { text: "Liebe Oma, ..." } }
                  - { left: { text: "Anleitung" }, right: { text: "1. Nimm ..." } }
                  - { left: { text: "Witz" }, right: { text: "Was ist grün und klopft an die Tür?" } }
                hints:
                  - "Lies jeden Anfang. Woran erkennst du die Textart?"
                  - "Ein Brief beginnt mit einer Anrede. Eine Anleitung hat Nummern."
                  - "Geschichte: Es war einmal. Brief: Liebe Oma. Anleitung: 1. Nimm. Witz: Was ist grün?"

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Es war einmal ein kleiner Drache.\nEr konnte noch kein Feuer spucken.\nEines Tages flog er zu seiner Oma.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["eine Geschichte", "eine Anleitung", "ein Brief"]
                answer: "eine Geschichte"
                hints: ["Wie fängt der Text an?"]
              - id: l1-s2
                type: multiple_choice
                text: "Was ist gelb und kann nicht schwimmen?\nEin Bagger!\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["ein Witz", "ein Gedicht", "ein Lexikoneintrag"]
                answer: "ein Witz"
                hints: ["Die Antwort am Ende ist lustig."]
              - id: l1-s3
                type: true_false
                text: "Hund\nDer Hund ist ein Haustier.\nEr kann sehr gut riechen.\n\nIst das ein Gedicht?"
                say: "Lies den Text. Ist das ein Gedicht?"
                answer: false
                hints: ["Reimen sich die Zeilen? Oder erklärt der Text etwas?"]
              - id: l1-s4
                type: multiple_choice
                text: "So säst du Kresse:\n1. Leg Watte auf einen Teller.\n2. Mach die Watte nass.\n3. Streu die Samen darauf.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["eine Anleitung", "ein Gedicht", "ein Witz"]
                answer: "eine Anleitung"
                hints: ["Schau auf die Nummern."]
              - id: l1-s5
                type: sorting
                text: "In allen Sätzen geht es um Bären. Sortiere: Geschichte oder Lexikoneintrag?"
                say: "In allen Sätzen geht es um Bären. Kommt der Satz aus einer Geschichte oder aus einem Lexikoneintrag?"
                bins:
                  - { id: geschichte, show: { text: "Geschichte" }, say: "Geschichte" }
                  - { id: lexikon, show: { text: "Lexikoneintrag" }, say: "Lexikoneintrag" }
                options:
                  - { text: "Es war einmal ein Bär, der Honig liebte.", bin: geschichte }
                  - { text: "Bären haben ein dickes Fell.", bin: lexikon }
                  - { text: "Eines Tages traf der Bär einen Hasen.", bin: geschichte }
                  - { text: "Bären fressen Beeren und Fische.", bin: lexikon }
                hints: ["Passiert etwas, oder wird etwas erklärt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Liebe Frau Schulz,\nich bin krank und kann heute nicht kommen.\nViele Grüße\nIhre Mia\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["ein Brief", "eine Geschichte", "eine Anleitung"]
                answer: "ein Brief"
              - id: l1-n2
                type: multiple_choice
                text: "Im Garten steht ein alter Baum,\nich sitz darunter wie im Traum.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["ein Gedicht", "ein Witz", "ein Lexikoneintrag"]
                answer: "ein Gedicht"
              - id: l1-n3
                type: true_false
                text: "So machst du Obstsalat:\n1. Wasch das Obst.\n2. Schneide es klein.\n3. Gib alles in eine Schüssel.\n\nIst das eine Anleitung?"
                say: "Lies den Text. Ist das eine Anleitung?"
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Igel\nDer Igel ist ein Wildtier.\nAuf dem Rücken hat er viele Stacheln.\nIm Winter hält er Winterschlaf.\n\nWas für ein Text ist das?"
                say: "Lies den Text. Was für ein Text ist das?"
                options: ["ein Lexikoneintrag", "ein Brief", "ein Gedicht"]
                answer: "ein Lexikoneintrag"
              - id: l1-n5
                type: sorting
                text: "Sortiere: Gedicht oder Geschichte?"
                say: "Kommt der Text aus einem Gedicht oder aus einer Geschichte?"
                bins:
                  - { id: gedicht, show: { text: "Gedicht" }, say: "Gedicht" }
                  - { id: geschichte, show: { text: "Geschichte" }, say: "Geschichte" }
                options:
                  - { text: "Der Mond scheint hell, der Hund rennt schnell.", bin: gedicht }
                  - { text: "Eines Morgens wachte Tim auf und sah Schnee.", bin: geschichte }
                  - { text: "Die Sonne lacht, der Tag erwacht.", bin: gedicht }
                  - { text: "Da rief Oma: „Komm, wir backen Kekse!“", bin: geschichte }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Der Gast ruft: „Herr Ober, in meiner Suppe schwimmt eine Fliege!“\nDer Ober sagt: „Keine Sorge, die trinkt nicht viel.“\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["ein Witz", "ein Brief", "eine Anleitung"]
            answer: "ein Witz"
          - id: l1-c2
            type: multiple_choice
            text: "Lisa fand im Wald einen kleinen Stein.\nEr glitzerte in der Sonne.\nPlötzlich sagte der Stein: „Hallo!“\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["eine Geschichte", "ein Lexikoneintrag", "eine Anleitung"]
            answer: "eine Geschichte"
          - id: l1-c3
            type: true_false
            text: "Es war einmal ein Pferd.\nEs wollte so gern fliegen.\n\nIst das ein Lexikoneintrag?"
            say: "Lies den Text. Ist das ein Lexikoneintrag?"
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Liebe Klasse 2a,\nich bin in den Ferien am Meer.\nHier ist es sehr warm.\nViele Grüße\neure Frau Kaya\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["ein Brief", "eine Geschichte", "ein Gedicht"]
            answer: "ein Brief"
          - id: l1-c5
            type: true_false
            text: "Mein Ball ist rot und kugelrund,\ner rollt zu meinem kleinen Hund.\n\nIst das ein Gedicht?"
            say: "Lies den Text. Ist das ein Gedicht?"
            answer: true
          - id: l1-c6
            type: sorting
            text: "In allen Sätzen geht es um Pizza. Sortiere: Anleitung oder Lexikoneintrag?"
            say: "In allen Sätzen geht es um Pizza. Kommt der Satz aus einer Anleitung oder aus einem Lexikoneintrag?"
            bins:
              - { id: anleitung, show: { text: "Anleitung" }, say: "Anleitung" }
              - { id: lexikon, show: { text: "Lexikoneintrag" }, say: "Lexikoneintrag" }
            options:
              - { text: "1. Roll den Teig aus.", bin: anleitung }
              - { text: "Die Pizza kommt aus Italien.", bin: lexikon }
              - { text: "2. Leg Tomaten darauf.", bin: anleitung }
              - { text: "Pizza wird in einem heißen Ofen gebacken.", bin: lexikon }

  - n: 2
    title: { de: "Wozu ist der Text da?", en: "What is the text for?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Die Blume blüht im Sonnenlicht,\nsie riecht so gut, vergiss das nicht.\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["ein Gedicht", "ein Brief", "eine Anleitung"]
            answer: "ein Gedicht"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Liebe Mama,\nich habe dich lieb!\nDein Finn\n\nIst das ein Brief?"
            say: "Lies den Text. Ist das ein Brief?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Geschichte: erzählt, was jemand erlebt\nGedicht: klingt schön, oft mit Reimen\nWitz: bringt dich zum Lachen"
            say: "Jede Textart hat eine Aufgabe. Eine Geschichte erzählt, was jemand erlebt. Ein Gedicht klingt schön und reimt sich oft. Ein Witz bringt dich zum Lachen."
          - text: "Anleitung: sagt, wie man etwas macht\nLexikoneintrag: erklärt eine Sache\nBrief: bringt jemandem eine Nachricht"
            say: "Eine Anleitung sagt dir, wie man etwas macht. Ein Rezept ist eine Anleitung zum Kochen und Backen. Ein Lexikoneintrag erklärt eine Sache. Ein Brief bringt jemandem eine Nachricht."
          - text: "Ich will einen Drachen bauen.\nIch brauche: eine Anleitung."
            say: "Überleg zuerst, was du willst. Dann weißt du, welchen Text du brauchst. Willst du einen Drachen bauen, hilft dir keine Geschichte über Drachen. Du brauchst eine Anleitung."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: matching
                text: "Wozu ist die Textart da? Was passt zusammen?"
                say: "Verbinde jede Textart mit ihrer Aufgabe."
                pairs:
                  - { left: { text: "Anleitung" }, right: { text: "sagt, wie man etwas macht" } }
                  - { left: { text: "Lexikoneintrag" }, right: { text: "erklärt eine Sache" } }
                  - { left: { text: "Witz" }, right: { text: "bringt dich zum Lachen" } }
                  - { left: { text: "Brief" }, right: { text: "bringt jemandem eine Nachricht" } }
                hints:
                  - "Denk an einen Text von jeder Art. Was macht er?"
                  - "Ein Witz ist lustig. Ein Brief geht an eine andere Person."
                  - "Anleitung: wie man etwas macht. Lexikoneintrag: erklärt. Witz: Lachen. Brief: Nachricht."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Du willst wissen, was ein Biber frisst. Welchen Text brauchst du?"
                say: "Du willst wissen, was ein Biber frisst. Welchen Text brauchst du?"
                options: ["einen Lexikoneintrag", "eine Geschichte", "einen Witz"]
                answer: "einen Lexikoneintrag"
                feedback:
                  "eine Geschichte": "In einer Geschichte kann ein Biber vorkommen. Aber sie erklärt dir nicht sicher, was er frisst."
                hints:
                  - "Welcher Text erklärt eine Sache?"
                  - "Eine Geschichte erzählt etwas Erlebtes. Ein Witz ist lustig."
                  - "Ein Lexikoneintrag."
              - id: l2-f3
                type: multiple_choice
                text: "Du willst Waffeln backen. Welchen Text brauchst du?"
                say: "Du willst Waffeln backen. Welchen Text brauchst du?"
                options: ["ein Rezept", "ein Gedicht", "einen Brief"]
                answer: "ein Rezept"
                hints:
                  - "Welcher Text sagt dir, wie man etwas macht?"
                  - "Eine Anleitung zum Backen heißt Rezept."
                  - "Ein Rezept."
              - id: l2-f4
                type: true_false
                text: "Ein Witz soll dich zum Lachen bringen. Stimmt das?"
                say: "Ein Witz soll dich zum Lachen bringen. Stimmt das?"
                answer: true
                hints:
                  - "Denk an einen Witz, den du kennst."
                  - "Was passiert am Ende eines Witzes?"
                  - "Ja, das stimmt."
              - id: l2-f5
                type: multiple_choice
                text: "So malst du ein Gesicht:\n1. Mal einen großen Kreis.\n2. Mal zwei Augen hinein.\n3. Mal einen Mund, der lacht.\n\nWozu ist dieser Text da?"
                say: "Lies den Text. Wozu ist er da?"
                options: ["Er sagt, wie man etwas macht.", "Er bringt dich zum Lachen.", "Er erzählt, was jemand erlebt."]
                answer: "Er sagt, wie man etwas macht."
                hints:
                  - "Was für ein Text ist das?"
                  - "Der Text hat Nummern. Es ist eine Anleitung."
                  - "Er sagt, wie man etwas macht."

          - support: some
            tasks:
              - id: l2-s1
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Textart mit dem, was sie macht."
                pairs:
                  - { left: { text: "Geschichte" }, right: { text: "erzählt, was jemand erlebt" } }
                  - { left: { text: "Gedicht" }, right: { text: "hat Verse, die sich oft reimen" } }
                  - { left: { text: "Lexikoneintrag" }, right: { text: "erklärt eine Sache" } }
                  - { left: { text: "Anleitung" }, right: { text: "sagt Schritt für Schritt, was du tun sollst" } }
                hints: ["Ein Gedicht klingt schön. Eine Anleitung hat Schritte."]
              - id: l2-s2
                type: multiple_choice
                text: "Oma wohnt weit weg. Du willst ihr von deinem Urlaub erzählen. Was schreibst du?"
                say: "Oma wohnt weit weg. Du willst ihr von deinem Urlaub erzählen. Was schreibst du?"
                options: ["einen Brief", "eine Anleitung", "einen Lexikoneintrag"]
                answer: "einen Brief"
                hints: ["Welcher Text bringt jemandem eine Nachricht?"]
              - id: l2-s3
                type: multiple_choice
                text: "Du hast ein neues Brettspiel. Du willst wissen, wie es geht. Was liest du?"
                say: "Du hast ein neues Brettspiel. Du willst wissen, wie es geht. Was liest du?"
                options: ["die Spielanleitung", "ein Gedicht", "einen Witz"]
                answer: "die Spielanleitung"
                hints: ["Welcher Text sagt, wie man etwas macht?"]
              - id: l2-s4
                type: true_false
                text: "Ein Lexikoneintrag erzählt eine ausgedachte Geschichte. Stimmt das?"
                say: "Ein Lexikoneintrag erzählt eine ausgedachte Geschichte. Stimmt das?"
                answer: false
                hints: ["Was macht ein Lexikoneintrag?"]
              - id: l2-s5
                type: multiple_choice
                text: "Biene\nDie Biene ist ein Insekt.\nSie sammelt Nektar und macht Honig.\n\nWozu ist dieser Text da?"
                say: "Lies den Text. Wozu ist er da?"
                options: ["Er erklärt eine Sache.", "Er bringt dich zum Lachen.", "Er sagt, wie man etwas macht."]
                answer: "Er erklärt eine Sache."
                hints: ["Was für ein Text ist das?"]

          - support: none
            tasks:
              - id: l2-n1
                type: matching
                text: "Welcher Text passt zu welchem Wunsch?"
                say: "Verbinde jeden Wunsch mit dem Text, der dir hilft."
                pairs:
                  - { left: { text: "Ich will lachen." }, right: { text: "Witz" } }
                  - { left: { text: "Ich will wissen, wie ein Tier lebt." }, right: { text: "Lexikoneintrag" } }
                  - { left: { text: "Ich will etwas basteln." }, right: { text: "Anleitung" } }
                  - { left: { text: "Ich will einer Freundin schreiben." }, right: { text: "Brief" } }
              - id: l2-n2
                type: multiple_choice
                text: "Du willst wissen, wie groß ein Dinosaurier war. Welchen Text brauchst du?"
                say: "Du willst wissen, wie groß ein Dinosaurier war. Welchen Text brauchst du?"
                options: ["einen Lexikoneintrag", "einen Witz", "einen Brief"]
                answer: "einen Lexikoneintrag"
              - id: l2-n3
                type: multiple_choice
                text: "Deine Freundin ist traurig. Du willst sie zum Lachen bringen. Was erzählst du ihr?"
                say: "Deine Freundin ist traurig. Du willst sie zum Lachen bringen. Was erzählst du ihr?"
                options: ["einen Witz", "eine Anleitung", "einen Lexikoneintrag"]
                answer: "einen Witz"
              - id: l2-n4
                type: true_false
                text: "Ein Gedicht hat oft Verse, die sich reimen. Stimmt das?"
                say: "Ein Gedicht hat oft Verse, die sich reimen. Stimmt das?"
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Lieber Ben,\nam Samstag feiere ich Geburtstag.\nKommst du?\nDein Ali\n\nWozu ist dieser Text da?"
                say: "Lies den Text. Wozu ist er da?"
                options: ["Er bringt Ben eine Nachricht.", "Er erklärt eine Sache.", "Er sagt, wie man etwas baut."]
                answer: "Er bringt Ben eine Nachricht."

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: practical
            type: multiple_choice
