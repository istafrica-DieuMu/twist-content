# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.letters-emails
skill: lit-de.writing.letters-emails
curriculum: de-DE
language: de
title:
  de: Brief und E-Mail
  en: Letters and emails
summary: >
  The parts of a letter and an e-mail to someone the child knows. Lesson
  1 names Ort und Datum, Anrede, Text, Gruß and Name, chooses Lieber or
  Liebe with the comma after it, and puts the parts of a letter in order;
  lesson 2 adds what an e-mail has on top (An, Betreff), picks a Betreff
  that says what the e-mail is about, sees that the computer sets the
  date, and ends with the skill check. Writing the letter itself waits
  for a free text task type; here the child chooses and orders the parts.
  The skill check marks what a screen can mark: the Anrede, the names and
  order of the parts and what an e-mail adds; writing a whole letter is
  left to Practise once free text arrives.
metadata:
  year: klasse-2
  topic: { de: Texte schreiben, en: Writing texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.writing.lists-cards]
  also_practises: [lit-de.writing.lists-cards]
  vocabulary: { de: [Brief, E-Mail, Ort, Datum, Anrede, Gruß, Betreff, E-Mail-Adresse, Lieber, Liebe] }
  forms: [text, audio]
  drawn: []
  facets: []
  parts:
    - { id: anrede, what: { de: die Anrede mit Lieber oder Liebe und dem Komma, en: the greeting with Lieber or Liebe and the comma } }
    - { id: part-names, what: { de: "die Teile eines Briefs kennen (Ort und Datum, Anrede, Text, Gruß, Name)", en: "knowing the parts of a letter (place and date, greeting, text, sign-off, name)" } }
    - { id: order, what: { de: die Teile eines Briefs und einer E-Mail in die richtige Reihenfolge bringen, en: putting the parts of a letter and an email in order } }
    - { id: email, what: { de: "was eine E-Mail dazu hat (An, Betreff)", en: "what an email adds (To, Subject)" } }
  misconceptions:
    - id: lieber-liebe
      what: Writes Liebe to a boy or Lieber to a girl, or leaves out the comma after the Anrede
      addressed: "lesson 1 Learn sets Lieber Jonas against Liebe Mila and names the comma; a Lieber or Liebe gap in every stage of lesson 1 (l1-f2 with feedback, l1-s2, l1-n2, l1-c1) and in l2-w1 and l2-c1; l1-s5 shows Liebe Onkel Max; l1-f5 asks for the comma; l2-s2 and l2-n2 choose the Anrede, l2-n2 also by its comma"
    - id: parts-order
      what: Puts the Gruß at the top or the Anrede at the bottom, or takes the Anrede for the Betreff
      addressed: "every stage orders the parts of a letter or an e-mail (l1-f3, l1-s3, l1-n3, l1-c3, l2-f4, l2-s4, l2-n4, l2-c4); l1-f4 (with feedback), l1-s4, l1-n4 and l2-w2 ask where a part goes; every Betreff task offers the Anrede (l2-f1 with feedback, l2-s1, l2-n1, l2-c3)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Der Brief", en: "The letter" }
    goal:
      de: "Finde die Teile eines Briefs, von der Anrede bis zum Gruß, so wie Lieber Jonas."
      en: "Find the parts of a letter, from the greeting to the sign-off, like Lieber Jonas."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Leg die Glückwunschkarte in die richtige Reihenfolge."
            say: "Leg die Teile der Glückwunschkarte in die richtige Reihenfolge."
            options: ["Dein Ben", "Lieber Onkel Jo,", "alles Gute zum Geburtstag!"]
            slot_count: 3
            answer: ["Lieber Onkel Jo,", "alles Gute zum Geburtstag!", "Dein Ben"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Liebe Tara,\nich lade dich zu meinem Fest ein.\nWo? Bei uns im Garten.\nDeine Ruby\n\nWas fehlt in der Einladung?"
            say: "Lies die Einladung. Was fehlt?"
            options: ["wann das Fest ist", "wo das Fest ist", "wer einlädt"]
            answer: "wann das Fest ist"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Berlin, 3. Mai\n\nLieber Jonas,\nwie geht es dir? Bei uns ist es schon warm. Gestern war ich mit Papa im Zoo.\n\nViele Grüße\nDein Karl"
            say: "Das ist ein Brief. Oben rechts stehen der Ort und das Datum. Dann kommt die Anrede: Lieber Jonas. Danach kommt der Text. Unten stehen der Gruß und der Name."
          - text: "Lieber Jonas,\nLiebe Mila,"
            say: "Schreibst du einem Jungen oder einem Mann, heißt die Anrede Lieber. Schreibst du einem Mädchen oder einer Frau, heißt sie Liebe. Nach der Anrede steht ein Komma."
          - text: "Viele Grüße\nLiebe Grüße\nBis bald"
            say: "Am Ende verabschiedest du dich mit einem Gruß, zum Beispiel: Viele Grüße. Darunter schreibst du deinen Namen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: matching
                text: "Wie heißen die Teile des Briefs?"
                say: "Verbinde jeden Teil des Briefs mit seinem Namen."
                pairs:
                  - { left: { text: "Lieber Jonas," }, right: { text: "Anrede" } }
                  - { left: { text: "Viele Grüße" }, right: { text: "Gruß" } }
                  - { left: { text: "Berlin, 3. Mai" }, right: { text: "Ort und Datum" } }
                hints:
                  - "Mit der Anrede sprichst du jemanden an. Mit dem Gruß verabschiedest du dich."
                  - "Berlin ist ein Ort, der 3. Mai ein Datum."
                  - "Lieber Jonas: Anrede. Viele Grüße: Gruß. Berlin, 3. Mai: Ort und Datum."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Du schreibst deinem Freund Paul. Welche Anrede passt?"
                say: "Du schreibst deinem Freund Paul. Welches Wort passt?"
                frame: "_ Paul,"
                options: ["Lieber", "Liebe"]
                answer: ["Lieber"]
                feedback:
                  "Liebe": "Liebe schreibst du einem Mädchen oder einer Frau. Paul ist ein Junge."
                hints:
                  - "Ist Paul ein Junge oder ein Mädchen?"
                  - "Einem Jungen schreibst du Lieber."
                  - "Lieber Paul,"
              - id: l1-f3
                type: ordering
                text: "Leg den Brief in die richtige Reihenfolge."
                say: "Leg die Teile des Briefs in die richtige Reihenfolge."
                options: ["Viele Grüße", "danke für das tolle Buch!", "Deine Ida", "Liebe Oma,"]
                slot_count: 4
                answer: ["Liebe Oma,", "danke für das tolle Buch!", "Viele Grüße", "Deine Ida"]
                hints:
                  - "Ein Brief beginnt mit der Anrede."
                  - "Nach der Anrede kommt der Text. Gruß und Name stehen am Ende."
                  - "Liebe Oma, dann der Dank, dann Viele Grüße, dann Deine Ida."
              - id: l1-f4
                type: multiple_choice
                text: "Wo steht im Brief der Gruß?"
                say: "Wo steht im Brief der Gruß?"
                options: ["unten, vor dem Namen", "ganz oben", "vor der Anrede"]
                answer: "unten, vor dem Namen"
                feedback:
                  "ganz oben": "Oben stehen Ort, Datum und Anrede. Mit dem Gruß verabschiedest du dich, darum steht er am Ende."
                hints:
                  - "Mit dem Gruß verabschiedest du dich."
                  - "Wann verabschiedest du dich: am Anfang oder am Ende?"
                  - "Unten, vor dem Namen."
              - id: l1-f5
                type: true_false
                text: "Nach der Anrede „Liebe Mila“ steht ein Komma. Stimmt das?"
                say: "Nach der Anrede Liebe Mila steht ein Komma. Stimmt das?"
                answer: true
                hints:
                  - "Schau dir die Anrede im Brief an Jonas an."
                  - "Dort steht: Lieber Jonas und dann ein Zeichen."
                  - "Ja, nach der Anrede steht ein Komma."

          - support: some
            tasks:
              - id: l1-s1
                type: matching
                text: "Wie heißen die Teile des Briefs?"
                say: "Verbinde jeden Teil des Briefs mit seinem Namen."
                pairs:
                  - { left: { text: "Deine Ida" }, right: { text: "Name" } }
                  - { left: { text: "Liebe Oma," }, right: { text: "Anrede" } }
                  - { left: { text: "danke für das Buch!" }, right: { text: "Text" } }
                hints: ["Mit der Anrede sprichst du jemanden an. Der Name steht ganz unten."]
              - id: l1-s2
                type: fill_in_blank
                text: "Du schreibst deiner Freundin Emma. Welche Anrede passt?"
                say: "Du schreibst deiner Freundin Emma. Welches Wort passt?"
                frame: "_ Emma,"
                options: ["Lieber", "Liebe"]
                answer: ["Liebe"]
                hints: ["Ist Emma ein Junge oder ein Mädchen?"]
              - id: l1-s3
                type: ordering
                text: "Leg den Brief in die richtige Reihenfolge."
                say: "Leg die Teile des Briefs in die richtige Reihenfolge."
                options: ["Liebe Grüße", "Lieber Opa,", "Dein Anton", "ich freue mich auf die Ferien bei dir."]
                slot_count: 4
                answer: ["Lieber Opa,", "ich freue mich auf die Ferien bei dir.", "Liebe Grüße", "Dein Anton"]
                hints: ["Zuerst die Anrede, zum Schluss der Name."]
              - id: l1-s4
                type: multiple_choice
                text: "Was steht im Brief oben rechts?"
                say: "Was steht im Brief oben rechts?"
                options: ["Ort und Datum", "der Gruß", "der Name"]
                answer: "Ort und Datum"
                hints: ["Denk an den Brief an Jonas: Was stand ganz oben?"]
              - id: l1-s5
                type: true_false
                text: "Ein Brief an Onkel Max beginnt so: „Liebe Onkel Max,“. Ist das richtig?"
                say: "Ein Brief an Onkel Max beginnt so: Liebe Onkel Max. Ist das richtig?"
                answer: false
                hints: ["Onkel Max ist ein Mann. Wie heißt dann die Anrede?"]

          - support: none
            tasks:
              - id: l1-n1
                type: matching
                text: "Wie heißen die Teile des Briefs?"
                say: "Verbinde jeden Teil des Briefs mit seinem Namen."
                pairs:
                  - { left: { text: "Köln, 2. März" }, right: { text: "Ort und Datum" } }
                  - { left: { text: "Bis bald" }, right: { text: "Gruß" } }
                  - { left: { text: "Lieber Herr Brandt," }, right: { text: "Anrede" } }
              - id: l1-n2
                type: fill_in_blank
                text: "Du schreibst deiner Lehrerin Frau Weber. Welche Anrede passt?"
                say: "Du schreibst deiner Lehrerin Frau Weber. Welches Wort passt?"
                frame: "_ Frau Weber,"
                options: ["Lieber", "Liebe"]
                answer: ["Liebe"]
              - id: l1-n3
                type: ordering
                text: "Leg den Brief in die richtige Reihenfolge."
                say: "Leg die Teile des Briefs in die richtige Reihenfolge."
                options: ["Deine Merle", "wir waren gestern am See.", "Liebe Tante Rosi,", "Viele Grüße"]
                slot_count: 4
                answer: ["Liebe Tante Rosi,", "wir waren gestern am See.", "Viele Grüße", "Deine Merle"]
              - id: l1-n4
                type: multiple_choice
                text: "Was kommt im Brief gleich nach Ort und Datum?"
                say: "Was kommt im Brief gleich nach Ort und Datum?"
                options: ["die Anrede", "der Gruß", "der Name"]
                answer: "die Anrede"
              - id: l1-n5
                type: true_false
                text: "Wie geht es dir? Ich habe ein neues Fahrrad.\n\nViele Grüße\nDein Karl\n\nFehlt in diesem Brief die Anrede?"
                say: "Lies den Brief. Fehlt darin die Anrede?"
                answer: true

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Du schreibst deinem Bruder Ben. Welche Anrede passt?"
            say: "Du schreibst deinem Bruder Ben. Welches Wort passt?"
            frame: "_ Ben,"
            options: ["Lieber", "Liebe"]
            answer: ["Lieber"]
          - id: l1-c2
            type: multiple_choice
            text: "Was ist „Viele Grüße“ in einem Brief?"
            say: "Was ist Viele Grüße in einem Brief?"
            options: ["der Gruß", "die Anrede", "das Datum"]
            answer: "der Gruß"
          - id: l1-c3
            type: ordering
            text: "Leg den Brief in die richtige Reihenfolge."
            say: "Leg die Teile des Briefs in die richtige Reihenfolge."
            options: ["Dein Erik", "Lieber Malte,", "Viele Grüße", "kommst du morgen mit zum Fußball?"]
            slot_count: 4
            answer: ["Lieber Malte,", "kommst du morgen mit zum Fußball?", "Viele Grüße", "Dein Erik"]
          - id: l1-c4
            type: multiple_choice
            text: "Was steht im Brief ganz unten?"
            options: ["der Name", "die Anrede", "Ort und Datum"]
            answer: "der Name"
          - id: l1-c5
            type: true_false
            text: "Ein Brief an Frau Klein beginnt so: „Liebe Frau Klein,“. Ist das richtig?"
            say: "Ein Brief an Frau Klein beginnt so: Liebe Frau Klein. Ist das richtig?"
            answer: true
          - id: l1-c6
            type: matching
            text: "Wie heißen die Teile des Briefs?"
            say: "Verbinde jeden Teil des Briefs mit seinem Namen."
            pairs:
              - { left: { text: "Hannover, 1. Juni" }, right: { text: "Ort und Datum" } }
              - { left: { text: "Dein Kai" }, right: { text: "Name" } }
              - { left: { text: "Lieber Herr Ott," }, right: { text: "Anrede" } }

  - n: 2
    title: { de: "Die E-Mail", en: "The email" }
    goal:
      de: "Finde die Teile einer E-Mail und einen Betreff, der kurz sagt, worum es geht."
      en: "Find the parts of an email and a subject line that says in a few words what it is about."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Du schreibst deiner Cousine Leonie. Welche Anrede passt?"
            say: "Du schreibst deiner Cousine Leonie. Welches Wort passt?"
            frame: "_ Leonie,"
            options: ["Lieber", "Liebe"]
            answer: ["Liebe"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Wo steht im Brief die Anrede?"
            say: "Wo steht im Brief die Anrede?"
            options: ["oben, nach Ort und Datum", "ganz unten", "nach dem Gruß"]
            answer: "oben, nach Ort und Datum"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "An: oma.helga@beispiel.de\nBetreff: Mein Zahn ist raus!\n\nLiebe Oma,\nheute ist mein erster Wackelzahn rausgefallen. Ich habe ihn in eine kleine Dose gelegt.\n\nLiebe Grüße\nDeine Lotta"
            say: "Das ist eine E-Mail. Sie hat dieselben Teile wie ein Brief: Anrede, Text, Gruß und Name. Oben kommen zwei Zeilen dazu."
          - text: "An: die E-Mail-Adresse\nBetreff: worum es geht"
            say: "Bei An steht die E-Mail-Adresse. So weiß der Computer, wer die E-Mail bekommt. Beim Betreff schreibst du in wenigen Wörtern, worum es geht."
          - text: "Brief: Ort und Datum oben rechts\nE-Mail: Das Datum setzt der Computer ein."
            say: "Ort und Datum schreibst du bei einer E-Mail nicht selbst. Das Datum setzt der Computer von allein ein."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Lotta schreibt Oma, dass ihr Wackelzahn rausgefallen ist. Welcher Betreff passt?"
                say: "Lotta schreibt Oma, dass ihr Wackelzahn rausgefallen ist. Welcher Betreff passt?"
                options: ["Mein Zahn ist raus!", "Liebe Oma,", "Viele Grüße"]
                answer: "Mein Zahn ist raus!"
                feedback:
                  "Liebe Oma,": "Das ist die Anrede. Der Betreff sagt in wenigen Wörtern, worum es geht."
                hints:
                  - "Der Betreff sagt, worum es in der E-Mail geht."
                  - "Worum geht es in Lottas E-Mail?"
                  - "Mein Zahn ist raus!"
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Was steht wo?"
                say: "Verbinde jeden Teil der E-Mail mit dem, was dort steht."
                pairs:
                  - { left: { text: "An:" }, right: { text: "die E-Mail-Adresse" } }
                  - { left: { text: "Betreff:" }, right: { text: "worum es geht" } }
                  - { left: { text: "Liebe Grüße" }, right: { text: "der Gruß" } }
                hints:
                  - "An sagt, wer die E-Mail bekommt."
                  - "Der Betreff ist wie eine kleine Überschrift."
                  - "An: die Adresse. Betreff: worum es geht. Liebe Grüße: der Gruß."
              - id: l2-f3
                type: multiple_choice
                text: "Was musst du in einer E-Mail nicht selbst schreiben?"
                say: "Was musst du in einer E-Mail nicht selbst schreiben?"
                options: ["das Datum", "die Anrede", "den Gruß"]
                answer: "das Datum"
                hints:
                  - "Was macht der Computer von allein?"
                  - "Im Brief steht es oben rechts, neben dem Ort."
                  - "Das Datum."
              - id: l2-f4
                type: ordering
                text: "Leg die E-Mail in die richtige Reihenfolge."
                say: "Leg die Teile der E-Mail in die richtige Reihenfolge."
                options: ["kommst du mit zum Training?", "Viele Grüße von Jonte", "Betreff: Training am Samstag", "Lieber Noah,"]
                slot_count: 4
                answer: ["Betreff: Training am Samstag", "Lieber Noah,", "kommst du mit zum Training?", "Viele Grüße von Jonte"]
                hints:
                  - "Der Betreff steht ganz oben, noch vor der Anrede."
                  - "Nach der Anrede kommt der Text, dann der Gruß."
                  - "Betreff, Lieber Noah, die Frage, Viele Grüße von Jonte."
              - id: l2-f5
                type: true_false
                text: "Auch eine E-Mail an Opa beginnt mit einer Anrede, zum Beispiel „Lieber Opa,“. Stimmt das?"
                say: "Auch eine E-Mail an Opa beginnt mit einer Anrede, zum Beispiel Lieber Opa. Stimmt das?"
                answer: true
                hints:
                  - "Eine E-Mail hat dieselben Teile wie ein Brief."
                  - "Wie beginnt die E-Mail von Lotta nach dem Betreff?"
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Mats schreibt seiner Lehrerin, dass er krank ist. Welcher Betreff passt?"
                say: "Mats schreibt seiner Lehrerin, dass er krank ist. Welcher Betreff passt?"
                options: ["Ich bin krank", "Liebe Frau Lehmann,", "Bis bald"]
                answer: "Ich bin krank"
                hints: ["Worum geht es in der E-Mail?"]
              - id: l2-s2
                type: multiple_choice
                text: "Du schreibst deiner Freundin Ayla eine E-Mail. Welche Anrede passt?"
                say: "Du schreibst deiner Freundin Ayla eine E-Mail. Welche Anrede passt?"
                options: ["Liebe Ayla,", "Lieber Ayla,", "Viele Grüße"]
                answer: "Liebe Ayla,"
                hints: ["Ayla ist ein Mädchen."]
              - id: l2-s3
                type: matching
                text: "Was steht wo?"
                say: "Verbinde jeden Teil der E-Mail mit dem, was dort steht."
                pairs:
                  - { left: { text: "Adresse" }, right: { text: "papa@beispiel.de" } }
                  - { left: { text: "Betreff" }, right: { text: "Ausflug in den Zoo" } }
                  - { left: { text: "Anrede" }, right: { text: "Lieber Papa," } }
                option_audio: false
                hints: ["Eine E-Mail-Adresse hat das Zeichen @."]
              - id: l2-s4
                type: ordering
                text: "Leg die E-Mail in die richtige Reihenfolge."
                say: "Leg die Teile der E-Mail in die richtige Reihenfolge."
                options: ["danke für die tollen Stifte!", "Liebe Tante Jana,", "Viele Grüße von Elif", "Betreff: Danke!"]
                slot_count: 4
                answer: ["Betreff: Danke!", "Liebe Tante Jana,", "danke für die tollen Stifte!", "Viele Grüße von Elif"]
                hints: ["Der Betreff steht ganz oben."]
              - id: l2-s5
                type: true_false
                text: "In einer E-Mail schreibst du oben rechts Ort und Datum. Stimmt das?"
                say: "In einer E-Mail schreibst du oben rechts Ort und Datum. Stimmt das?"
                answer: false
                hints: ["Wer setzt bei einer E-Mail das Datum ein?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Ella fragt Mia in einer E-Mail, ob sie am Freitag zum Spielen kommt. Welcher Betreff passt?"
                say: "Ella fragt Mia in einer E-Mail, ob sie am Freitag zum Spielen kommt. Welcher Betreff passt?"
                options: ["Spielen am Freitag?", "Liebe Mia,", "Deine Ella"]
                answer: "Spielen am Freitag?"
              - id: l2-n2
                type: multiple_choice
                text: "Du schreibst deinem Opa eine E-Mail. Welche Anrede ist richtig geschrieben?"
                say: "Du schreibst deinem Opa eine E-Mail. Welche Anrede ist richtig geschrieben?"
                options: ["Lieber Opa,", "Liebe Opa,", "Lieber Opa."]
                answer: "Lieber Opa,"
                option_audio: false
              - id: l2-n3
                type: matching
                text: "Was steht wo?"
                say: "Verbinde jeden Teil der E-Mail mit dem, was dort steht."
                pairs:
                  - { left: { text: "Adresse" }, right: { text: "tom@beispiel.de" } }
                  - { left: { text: "Betreff" }, right: { text: "Hausaufgaben" } }
                  - { left: { text: "Gruß" }, right: { text: "Bis morgen" } }
                option_audio: false
              - id: l2-n4
                type: ordering
                text: "Leg die E-Mail in die richtige Reihenfolge."
                say: "Leg die Teile der E-Mail in die richtige Reihenfolge."
                options: ["Liebe Grüße von Lina", "Betreff: Mein neuer Hase", "ich habe einen Hasen bekommen!", "Lieber Onkel Ali,"]
                slot_count: 4
                answer: ["Betreff: Mein neuer Hase", "Lieber Onkel Ali,", "ich habe einen Hasen bekommen!", "Liebe Grüße von Lina"]
              - id: l2-n5
                type: true_false
                text: "Der Betreff sagt in wenigen Wörtern, worum es in der E-Mail geht. Stimmt das?"
                say: "Der Betreff sagt in wenigen Wörtern, worum es in der E-Mail geht. Stimmt das?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: anrede
            type: fill_in_blank
            text: "Du schreibst deinem Nachbarn Herrn Kurz. Welche Anrede passt?"
            say: "Du schreibst deinem Nachbarn Herrn Kurz. Welches Wort passt?"
            frame: "_ Herr Kurz,"
            options: ["Lieber", "Liebe"]
            answer: ["Lieber"]
          - id: l2-c2
            part: part-names
            type: matching
            text: "Was gehört zusammen?"
            say: "Verbinde jeden Teil des Briefs mit seinem Namen."
            pairs:
              - { left: { text: "Bremen, 8. April" }, right: { text: "Ort und Datum" } }
              - { left: { text: "Liebe Ronja," }, right: { text: "Anrede" } }
              - { left: { text: "Viele Grüße" }, right: { text: "Gruß" } }
          - id: l2-c3
