            say: "Welcher Buchstabe bleibt im Erdgeschoss und reicht nicht bis unters Dach?"
            options: ["m", "M", "L"]
            answer: "m"
            option_audio: false
          - id: l2-c7
            part: height
            type: true_false
            text: "Stimmt das? Das große A reicht bis unters Dach."
            say: "Das große A reicht bis unters Dach. Stimmt das?"
            answer: true
          - id: l2-c8
            part: height
            type: multiple_choice
            text: "Mia schreibt das große N nur so hoch wie ein kleines n. Was stimmt?"
            say: "Mia schreibt das große N nur so hoch wie ein kleines n. Was stimmt?"
            options: ["Das N ist zu klein.", "Das N ist zu groß.", "Es ist alles richtig."]
            answer: "Das N ist zu klein."
          - id: l2-c9
            part: height
            type: multiple_choice
