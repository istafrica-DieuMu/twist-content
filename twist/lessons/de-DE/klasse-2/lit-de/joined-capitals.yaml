# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.joined-capitals
skill: lit-de.handwriting.joined-capitals
curriculum: de-DE
language: de
title:
  de: Schreibschrift, große Buchstaben
  en: Joined script, capital letters
summary: >
  Children write the capital letters in Schreibschrift and go on from
  them into the small letters of the word. Lesson 1 sets out where the
  capitals live (from the line up to the Dach) and when a word starts
  with one (Satzanfang, Nomen, Namen); lesson 2 joins a capital to the
  rest of the word, and where a capital is not joined, sets the next
  letter close beside it so the word stays together; it ends with the
  skill check. Every writing-lines task uses `script: joined`, so the
  child sees the model in the school's Ausgangsschrift (SAS, LA, VA or
  Grundschrift, a setting) and can see where a capital joins on. Which
  capitals join differs between these scripts, so the lesson teaches
  only what holds in all of them: some capitals join on and some do
  not, the child follows the model on the lines, and the one capital
  named as not joining is O, which ends at the top in SAS, LA and VA. Word
  options for "which word do you write with a capital" are shown in
  small letters, so the capital does not give the answer away.
metadata:
  year: klasse-2
  topic: { de: Schreibschrift, en: Joined handwriting }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.handwriting.joined-lowercase]
  also_practises: [lit-de.spelling.capital-nouns]
  vocabulary: { de: [großer Buchstabe, Anfangsbuchstabe, Satzanfang, Nomen, Name, verbinden, absetzen, Dach] }
  forms: [drawn, audio]
  drawn: [writing-lines, letter-card, word-card]
  facets: [script]
  misconceptions:
    - id: capital-too-small
      what: Writes a capital only as high as the small letters, so it cannot be told apart from them
      addressed: "lesson 1 Learn shows the capital reaching the Dach; l1-f2 (with feedback), l1-s2, l1-n2 and l2-c1 ask how high a capital goes"
    - id: capitals-inside-word
      what: Writes a second capital inside the word or makes the next letter as big as the capital (MAma)
      addressed: "lesson 2 Learn says only the first letter is big; l2-f2 (with feedback), l2-s2, l2-n2 and l2-c2 pick the word with one capital and small letters after it"
    - id: gap-after-capital
      what: Leaves a wide gap after a capital that is not joined, so the word looks like two words (O ma)
      addressed: "lesson 2 Learn shows the next letter set close beside the capital; l2-f4 (with feedback), l2-s4, l2-n4 and l2-c4"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die großen Buchstaben", en: "The capital letters" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wo geht die Verbindung nach dem o los?"
            say: "Du schreibst das Wort von. Wo geht die Verbindung nach dem o los: oben oder unten?"
            options: ["oben", "unten"]
            keep_order: true
            answer: "oben"
            difficulty: easy
          - id: l1-w2
            type: tracing
            text: "Schreib das Wort ab."
            say: "Schreib das Wort nein ab, in einem Zug."
            show: { drawn: writing-lines, text: "nein", mode: copy, arrows: false, script: joined }
            char: "nein"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "M m"
            say: "Jeder kleine Buchstabe hat einen großen Bruder. Das große M steht auf der Linie und reicht bis unters Dach. Das kleine m bleibt im Erdgeschoss."
            show: { drawn: writing-lines, text: "M", mode: trace, arrows: true, script: joined }
          - text: "Mama ist im Garten."
            say: "Wann brauchst du einen großen Buchstaben? Am Anfang eines Satzes, bei Nomen wie Garten und bei Namen wie Mia."
            show: { drawn: word-card, text: "Mama ist im Garten." }
          - text: "L"
            say: "Auch große Buchstaben fängst du beim grünen Punkt an. Fahr sie langsam nach, dann merkt sich deine Hand den Weg."
            show: { drawn: writing-lines, text: "L", mode: trace, arrows: true, script: joined }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Fahr den Buchstaben nach."
                say: "Fahr das große M nach. Fang beim grünen Punkt an."
                show: { drawn: writing-lines, text: "M", mode: trace, arrows: true, script: joined }
                char: "M"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wie hoch ist ein großer Buchstabe?"
                say: "Wie hoch reicht ein großer Buchstabe in der Schreibschrift?"
                options: ["bis unters Dach", "nur bis zum Erdgeschoss"]
                keep_order: true
                answer: "bis unters Dach"
                feedback:
                  "nur bis zum Erdgeschoss": "So hoch sind die kleinen Buchstaben wie a und m. Die großen reichen bis unters Dach."
                hints:
                  - "Denk an das große M, das du eben nachgefahren bist."
                  - "Große Buchstaben sind höher als die kleinen."
                  - "Bis unters Dach."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort schreibst du groß?"
                say: "Welches Wort schreibst du mit einem großen Anfangsbuchstaben?"
                options: ["igel", "laufen", "klein"]
                answer: "igel"
                option_audio: false
                feedback:
                  laufen: "Das Wort laufen ist ein Verb. Verben schreibst du klein."
                  klein: "Das Wort klein ist ein Adjektiv. Adjektive schreibst du klein."
                hints:
                  - "Welches Wort ist ein Nomen?"
                  - "Vor ein Nomen kannst du der, die oder das setzen."
                  - "Der Igel. Igel schreibst du groß."
              - id: l1-f4
                type: tracing
                text: "Fahr den Buchstaben nach."
                say: "Fahr das große A nach."
                show: { drawn: writing-lines, text: "A", mode: trace, arrows: true, script: joined }
                char: "A"
              - id: l1-f5
                type: true_false
                text: "Stimmt das? Am Satzanfang schreibst du groß."
                say: "Am Anfang eines Satzes schreibst du einen großen Buchstaben. Stimmt das?"
                answer: true
                hints:
                  - "Wie fängt der Satz Mama ist im Garten an?"
                  - "Mit einem großen M."
                  - "Ja. Jeder Satz fängt groß an."
              - id: l1-f6
                type: tracing
                text: "Fahr den Buchstaben nach."
                say: "Fahr das große N nach."
                show: { drawn: writing-lines, text: "N", mode: trace, arrows: true, script: joined }
                char: "N"

          - support: some
            tasks:
              - id: l1-s1
                type: tracing
                text: "Fahr den Buchstaben nach."
                say: "Fahr das große E nach."
                show: { drawn: writing-lines, text: "E", mode: trace, arrows: true, script: joined }
                char: "E"
              - id: l1-s2
                type: true_false
                text: "Stimmt das? Das große L ist genauso hoch wie das kleine a."
                say: "Das große L ist genauso hoch wie das kleine a. Stimmt das?"
                answer: false
                hints: ["Wo wohnt das kleine a? Wohin reicht das große L?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf jedes Wort, das du groß schreibst."
                say: "Hier sind alle Wörter klein geschrieben. Tippe auf jedes Wort, das du groß schreibst."
                show: { drawn: letter-card, text: "der hund schläft im korb." }
                spans: ["der", "hund", "korb"]
                hints: ["Denk an den Satzanfang und an die Nomen."]
              - id: l1-s4
                type: tracing
                text: "Schreib den Buchstaben ab."
                say: "Schreib das große L ab."
                show: { drawn: writing-lines, text: "L", mode: copy, arrows: false, script: joined }
                char: "L"
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort schreibst du groß?"
                say: "Welches Wort schreibst du mit einem großen Anfangsbuchstaben?"
                options: ["nina", "nett", "nimmt"]
                answer: "nina"
                option_audio: false
                hints: ["Namen schreibst du groß."]

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Schreib den Buchstaben ab."
                say: "Schreib das große M ab."
                show: { drawn: writing-lines, text: "M", mode: copy, arrows: false, script: joined }
                char: "M"
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Buchstabe reicht bis unters Dach?"
                say: "Welcher Buchstabe reicht bis unters Dach?"
                options: ["E", "e", "a"]
                answer: "E"
                option_audio: false
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf jedes Wort, das du groß schreibst."
                say: "Hier sind alle Wörter klein geschrieben. Tippe auf jedes Wort, das du groß schreibst."
                show: { drawn: letter-card, text: "emil malt eine sonne." }
                spans: ["emil", "sonne"]
              - id: l1-n4
                type: true_false
                text: "Stimmt das? Namen wie Ali und Lea schreibst du groß."
                say: "Namen wie Ali und Lea schreibst du mit einem großen Buchstaben. Stimmt das?"
                answer: true
              - id: l1-n5
                type: tracing
                text: "Schreib den Buchstaben ab."
                say: "Schreib das große A ab."
                show: { drawn: writing-lines, text: "A", mode: copy, arrows: false, script: joined }
                char: "A"

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie hoch ist ein großer Buchstabe?"
            say: "Du schreibst ein großes N. Wie hoch reicht es?"
            options: ["bis unters Dach", "nur bis zum Erdgeschoss"]
            keep_order: true
            answer: "bis unters Dach"
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort schreibst du groß?"
            say: "Welches Wort schreibst du mit einem großen Anfangsbuchstaben?"
            options: ["esel", "essen", "eng"]
            answer: "esel"
            option_audio: false
          - id: l1-c3
            type: tracing
            text: "Schreib den Buchstaben ab."
            say: "Schreib das große E ab."
            show: { drawn: writing-lines, text: "E", mode: copy, arrows: false, script: joined }
            char: "E"

  - n: 2
    title: { de: "Groß und klein zusammen", en: "Capital and small together" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort schreibst du groß?"
            say: "Welches Wort schreibst du mit einem großen Anfangsbuchstaben?"
            options: ["nase", "nass", "neu"]
            answer: "nase"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Schreib den Buchstaben ab."
            say: "Schreib das große N ab."
            show: { drawn: writing-lines, text: "N", mode: copy, arrows: false, script: joined }
            char: "N"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Mama"
            say: "Nach dem großen Buchstaben geht das Wort klein weiter. Manche großen Buchstaben werden mit dem nächsten Buchstaben verbunden, manche nicht. Schau genau hin, wie es auf den Linien vorgeschrieben ist, und mach es genauso."
            show: { drawn: writing-lines, text: "Mama", mode: trace, arrows: true, script: joined }
          - text: "Oma"
            say: "Das große O hört oben auf und wird nicht verbunden. Hier hebst du kurz ab. Dann setzt du den kleinen Buchstaben ganz dicht daneben an. Sonst sieht das Wort aus wie zwei Wörter."
            show: { drawn: writing-lines, text: "Oma", mode: trace, arrows: true, script: joined }
          - text: "Mama, nicht MAma"
            say: "Nur der erste Buchstabe ist groß. Alle anderen Buchstaben im Wort bleiben klein."
            show: { drawn: word-card, text: "Mama" }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr Mama nach. Schau auf die Linien: Wenn das große M mit dem a verbunden ist, fährst du ohne abzusetzen weiter."
                show: { drawn: writing-lines, text: "Mama", mode: trace, arrows: true, script: joined }
                char: "Mama"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben?"
                options: ["Lama", "LAma", "lama"]
                answer: "Lama"
                option_audio: false
                feedback:
                  LAma: "Hier sind zwei Buchstaben groß. Nur der erste Buchstabe ist groß."
                  lama: "Lama ist ein Nomen. Der erste Buchstabe ist groß."
                hints:
                  - "Wie viele Buchstaben sind am Anfang groß?"
                  - "Nur der erste. Alle anderen sind klein."
                  - "Lama."
              - id: l2-f3
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr Oma nach. Nach dem O setzt du das m dicht daneben an."
                show: { drawn: writing-lines, text: "Oma", mode: trace, arrows: true, script: joined }
                char: "Oma"
              - id: l2-f4
                type: multiple_choice
                text: "Nach dem großen Buchstaben hebst du ab. Wo setzt du den kleinen an?"
                say: "Manche großen Buchstaben werden nicht verbunden. Dann hebst du kurz ab. Wo setzt du den nächsten kleinen Buchstaben an?"
                options: ["dicht neben dem großen Buchstaben", "mit einer großen Lücke", "in der nächsten Zeile"]
                answer: "dicht neben dem großen Buchstaben"
                feedback:
                  "mit einer großen Lücke": "Dann sieht das Wort aus wie zwei Wörter. Die Buchstaben eines Wortes stehen dicht zusammen."
                hints:
                  - "Es ist doch ein Wort."
                  - "Lücken lässt du nur zwischen zwei Wörtern."
                  - "Dicht daneben."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Nach dem großen Buchstaben geht es klein weiter."
                say: "Nach dem großen Buchstaben schreibst du das Wort mit kleinen Buchstaben weiter. Stimmt das?"
                answer: true
                hints:
                  - "Denk an Mama und Oma."
                  - "Nur der erste Buchstabe ist groß."
                  - "Ja. Danach geht es klein weiter."
              - id: l2-f6
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr Nina nach."
                show: { drawn: writing-lines, text: "Nina", mode: trace, arrows: true, script: joined }
                char: "Nina"

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr Esel nach."
                show: { drawn: writing-lines, text: "Esel", mode: trace, arrows: true, script: joined }
                char: "Esel"
              - id: l2-s2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben?"
                options: ["Auto", "AUto", "auto"]
                answer: "Auto"
                option_audio: false
                hints: ["Nur der erste Buchstabe ist groß."]
              - id: l2-s3
                type: true_false
                text: "Tim lässt in Oma nach dem O eine große Lücke. Ist das gut geschrieben?"
                say: "Tim schreibt Oma. Nach dem O lässt er eine große Lücke und schreibt dann ma. Ist das gut geschrieben?"
                answer: false
                hints: ["Wie sieht ein Wort mit einer großen Lücke aus?"]
              - id: l2-s4
                type: multiple_choice
                text: "Warum setzt du den kleinen Buchstaben dicht daneben an?"
                options: ["damit man sieht, dass es ein Wort ist", "damit es schneller geht", "damit das Blatt voll wird"]
                answer: "damit man sieht, dass es ein Wort ist"
                hints: ["Was passiert, wenn mitten im Wort eine Lücke ist?"]
              - id: l2-s5
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Lama ab."
                show: { drawn: writing-lines, text: "Lama", mode: copy, arrows: false, script: joined }
                char: "Lama"

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Igel ab."
                show: { drawn: writing-lines, text: "Igel", mode: copy, arrows: false, script: joined }
                char: "Igel"
              - id: l2-n2
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben?"
                options: ["Uhu", "UHu", "uhu"]
                answer: "Uhu"
                option_audio: false
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Satz ist richtig geschrieben?"
                say: "Welcher Satz ist richtig geschrieben?"
                options: ["Anna malt einen Wal.", "anna malt einen wal.", "ANna malt einen Wal."]
                answer: "Anna malt einen Wal."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Lea hebt nach dem O ab und setzt das m ganz dicht daneben. Ist das gut geschrieben?"
                say: "Lea schreibt Oma. Sie hebt nach dem O kurz ab und setzt das m ganz dicht daneben an. Ist das gut geschrieben?"
                answer: true
              - id: l2-n5
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib Mia ab."
                show: { drawn: writing-lines, text: "Mia", mode: copy, arrows: false, script: joined }
                char: "Mia"

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: true_false
            text: "Stimmt das? Das große E ist genauso hoch wie das kleine e."
            say: "Das große E ist genauso hoch wie das kleine e. Stimmt das?"
            answer: false
          - id: l2-c2
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Welches Wort ist richtig geschrieben?"
            options: ["Nudel", "NUdel", "nudel"]
            answer: "Nudel"
            option_audio: false
          - id: l2-c3
            type: highlight_in_text
            text: "Tippe auf jedes Wort, das du groß schreibst."
            say: "Hier sind alle Wörter klein geschrieben. Tippe auf jedes Wort, das du groß schreibst."
            show: { drawn: letter-card, text: "ute isst eine banane." }
            spans: ["ute", "banane"]
          - id: l2-c4
            type: multiple_choice
            text: "Wo setzt du den kleinen Buchstaben an?"
            say: "Du schreibst Ole. Nach dem O hebst du kurz ab. Wo setzt du das l an?"
            options: ["dicht neben dem O", "weit weg vom O", "unter dem O"]
            answer: "dicht neben dem O"
          - id: l2-c5
            type: multiple_choice
            text: "Wann schreibst du einen großen Buchstaben?"
            options: ["am Satzanfang, bei Nomen und bei Namen", "bei jedem Wort", "nur am Ende eines Satzes"]
            answer: "am Satzanfang, bei Nomen und bei Namen"
