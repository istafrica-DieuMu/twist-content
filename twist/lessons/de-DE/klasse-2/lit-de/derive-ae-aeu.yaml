# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.derive-ae-aeu
skill: lit-de.spelling-strategies.derive-ae-aeu
curriculum: de-DE
language: de
title:
  de: Ableiten bei ä und äu
  en: Deriving ä and äu
summary: >
  ä sounds like e, and äu sounds like eu. Lesson 1 finds a related word
  with a (Hände from Hand, er fährt from fahren) and writes e when there
  is none (Bett); lesson 2 does the same for äu from au (Bäume from Baum)
  against eu (heute), and ends with a mixed skill check.
metadata:
  year: klasse-2
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling-strategies.word-stem]
  also_practises: [lit-de.spelling-strategies.word-stem, lit-de.nouns.plural]
  vocabulary: { de: [ableiten, verwandtes Wort, Umlaut, Wortstamm] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: ae-from-a, what: { de: "ä von einem verwandten Wort mit a ableiten (Hände von Hand)", en: "working out ä from a related word with a" } }
    - { id: aeu-from-au, what: { de: "äu von einem verwandten Wort mit au ableiten (Bäume von Baum)", en: "working out äu from a related word with au" } }
    - { id: e-or-eu, what: { de: "e oder eu schreiben, wenn es kein verwandtes Wort mit a oder au gibt", en: "writing e or eu when there is no related word with a or au" } }
    - { id: helper-word, what: { de: "das verwandte Wort finden, das beim Schreiben hilft", en: "choosing the related word that helps with the spelling" } }
  misconceptions:
    - id: write-e-for-ae
      what: Writes e for ä because they sound alike (Gleser, Bletter)
      addressed: lesson 1 Learn takes Hände and Gläser back to Hand and Glas; misspelt cards in l1-f4 and l1-n4, and an ä gap in every stage of lesson 1
    - id: ae-everywhere
      what: Writes ä or äu where there is no related word with a or au (Bätt, Fräund)
      addressed: lesson 1 Learn shows Bett, lesson 2 Learn shows heute and Leute; every stage has an e or eu gap (Fest, Weg, Hecke, neun, Feuer, Eule), l1-c3 shows Mänsch, and l2-s4 and l2-n4 show a correct eu word (Freund, teuer)
    - id: wrong-relative
      what: Picks a word that only looks or sounds similar as the relative (reden for Räder)
      addressed: "\"Welches Wort hilft dir?\" in every stage offers look-alikes that are not related"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

