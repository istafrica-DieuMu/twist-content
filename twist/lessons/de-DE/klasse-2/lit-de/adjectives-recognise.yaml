            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Heute ist es windig." }
            spans: ["windig"]
          - id: l2-c11
            part: after-ist
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies die zwei Sätze. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Die Jacke ist nass. Sie hängt am Haken." }
            spans: ["nass"]
          - id: l2-c12
