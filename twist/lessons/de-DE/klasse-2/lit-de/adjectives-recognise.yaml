            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der hungrige Fuchs schleicht." }
            spans: ["hungrige"]
          - id: l2-c13
            part: before-noun
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
