          - id: l2-c14
            part: before-noun
            type: multiple_choice
            text: "Welches Wort ist das Adjektiv? das lustige Spiel"
            say: "Das lustige Spiel. Welches Wort ist das Adjektiv?"
            options: ["lustige", "Spiel", "das"]
            answer: "lustige"
          - id: l2-c15
            part: before-noun
            type: true_false
            text: "Ist „bunten“ in diesem Satz ein Adjektiv?"
