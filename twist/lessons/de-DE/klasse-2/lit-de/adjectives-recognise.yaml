# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.adjectives-recognise
skill: lit-de.adjectives.recognise
curriculum: de-DE
language: de
title:
  de: Adjektive erkennen
  en: Recognising adjectives
summary: >
  Adjektive (Wiewörter) say how someone or something is: groß, rot,
  lustig. Lesson 1 finds them with the Wie-Frage ("Wie ist der Ball?") and
  in pictures; lesson 2 finds them in sentences, tells them apart from
  Nomen and Verben, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Adjektive, en: Adjectives }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.nouns.recognise]
  also_practises: [lit-de.verbs.recognise]
  vocabulary: { de: [Adjektiv, Wiewort, wie, Wie-Frage, Nomen, Verb] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: after-ist, what: { de: "Adjektive nach „ist“ finden, mit der Wie-Frage", en: "finding adjectives after ist, with the how question" } }
    - { id: before-noun, what: { de: Adjektive vor dem Nomen finden, en: finding adjectives before a noun } }
    - { id: word-type, what: { de: Adjektive von Nomen und Verben unterscheiden, en: telling adjectives from nouns and verbs } }
  misconceptions:
    - id: adjective-is-the-thing
      what: Picks the noun when asked how something is ("Ball" for "Der Ball ist rot.")
      addressed: Learn asks "Wie ist der Ball?"; feedback on the noun in the full stage
    - id: capital-decides
      what: Decides the word type from the capital letter alone
      addressed: sorting and word-type tasks show the words in small letters, so only the meaning and the Wie-Frage decide
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Wie ist es?", en: "What is it like?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Die Katze schläft." }
            spans: ["schläft"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist ein Nomen?"
            say: "Lies die drei Wörter. Sie sind klein geschrieben. Welches ist ein Nomen?"
            options: ["hund", "laufen", "schnell"]
            answer: "hund"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Ball ist rot."
            say: "Der Ball ist rot. Wie ist der Ball? Rot. Rot sagt, wie der Ball ist. Solche Wörter heißen Adjektive oder Wiewörter."
            show: { object: ball }
          - text: "groß · klein · lustig · weich"
            say: "Adjektive sagen, wie etwas aussieht, wie es sich anfühlt oder wie jemand ist: groß, klein, lustig, weich."
          - text: "Wie ist …?"
            say: "So findest du ein Adjektiv: Stell die Wie-Frage. Der Löwe ist stark. Wie ist der Löwe? Stark. Stark ist das Adjektiv."
            show: { object: lion }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Wort, das sagt, wie der Apfel ist."
                show: { drawn: letter-card, text: "Der Apfel ist süß." }
                spans: ["süß"]
                hints:
                  - "Frag: Wie ist der Apfel?"
                  - "Der Apfel ist …"
                  - "Süß ist das Adjektiv."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Die Maus ist winzig. Welches Wort sagt, wie die Maus ist?"
                say: "Die Maus ist winzig. Welches Wort sagt, wie die Maus ist?"
                show: { object: mouse }
                options: ["winzig", "Maus", "ist"]
                answer: "winzig"
                feedback:
                  "Maus": "Maus ist ein Nomen. Es sagt, wer gemeint ist. Wie ist die Maus?"
                hints:
                  - "Frag: Wie ist die Maus?"
                  - "Die Maus ist … Welches Wort passt hier?"
                  - "Winzig ist das Adjektiv."
              - id: l1-f3
                type: true_false
                text: "Ist „nass“ ein Adjektiv?"
                say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
                show: { drawn: letter-card, text: "nass" }
                answer: true
                hints:
                  - "Passt es in den Satz: Der Hund ist …?"
                  - "Der Hund ist nass."
                  - "Ja, „nass“ sagt, wie der Hund ist."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort ist ein Adjektiv?"
                say: "Lies die drei Wörter. Sie sind klein geschrieben. Welches ist ein Adjektiv?"
                options: ["kalt", "schnee", "rodeln"]
                answer: "kalt"
                hints:
                  - "Stell die Wie-Frage: Wie ist der Tag?"
                  - "Der Tag ist kalt. Der Tag ist schnee? Das passt nicht."
                  - "Kalt ist das Adjektiv."
              - id: l1-f5
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Wort, das sagt, wie der Igel ist."
                show: { drawn: letter-card, text: "Der Igel ist stachelig." }
                spans: ["stachelig"]
                hints:
                  - "Frag: Wie ist der Igel?"
                  - "Der Igel ist …"
                  - "Stachelig ist das Adjektiv."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Die Suppe ist heiß." }
                spans: ["heiß"]
                hints: ["Frag: Wie ist die Suppe?"]
              - id: l1-s2
                type: multiple_choice
                text: "Der Wal ist riesig. Welches Wort sagt, wie der Wal ist?"
                say: "Der Wal ist riesig. Welches Wort sagt, wie der Wal ist?"
                show: { object: whale }
                options: ["riesig", "Wal", "ist"]
                answer: "riesig"
                hints: ["Welches Wort sagt, wie er ist?"]
              - id: l1-s3
                type: true_false
                text: "Ist „springen“ ein Adjektiv?"
                say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
                show: { drawn: letter-card, text: "springen" }
                answer: false
                hints: ["Passt es in den Satz: Der Hund ist …?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort ist ein Adjektiv?"
                say: "Lies die drei Wörter. Sie sind klein geschrieben. Welches ist ein Adjektiv?"
                options: ["blume", "leise", "singen"]
                answer: "leise"
                hints: ["Stell die Wie-Frage."]
              - id: l1-s5
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Das Bett ist bequem." }
                spans: ["bequem"]
                hints: ["Frag: Wie ist das Bett?"]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Der Frosch ist grün." }
                spans: ["grün"]
              - id: l1-n2
                type: multiple_choice
                text: "Die Schlange ist lang. Welches Wort sagt, wie die Schlange ist?"
                say: "Die Schlange ist lang. Welches Wort sagt, wie die Schlange ist?"
                show: { object: snake }
                options: ["lang", "Schlange", "ist"]
                answer: "lang"
              - id: l1-n3
                type: true_false
                text: "Ist „müde“ ein Adjektiv?"
                say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
                show: { drawn: letter-card, text: "müde" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort ist ein Adjektiv?"
                say: "Lies die drei Wörter. Sie sind klein geschrieben. Welches ist ein Adjektiv?"
                options: ["tisch", "malen", "neu"]
                answer: "neu"
              - id: l1-n5
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Der Stein ist hart." }
                spans: ["hart"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Die Banane ist gelb." }
            spans: ["gelb"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort ist ein Adjektiv?"
            say: "Lies die drei Wörter. Sie sind klein geschrieben. Welches ist ein Adjektiv?"
            options: ["dunkel", "nacht", "schlafen"]
            answer: "dunkel"
          - id: l1-c3
            type: true_false
            text: "Ist „rufen“ ein Adjektiv?"
            say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
            show: { drawn: letter-card, text: "rufen" }
            answer: false
          - id: l1-c4
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Die Kerze ist hell." }
            spans: ["hell"]
          - id: l1-c5
            type: multiple_choice
            text: "Das Kissen ist weich. Welches Wort sagt, wie das Kissen ist?"
            say: "Das Kissen ist weich. Welches Wort sagt, wie das Kissen ist?"
            options: ["weich", "Kissen", "ist"]
            answer: "weich"
          - id: l1-c6
            type: true_false
            text: "Ist „glücklich“ ein Adjektiv?"
            say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
            show: { drawn: letter-card, text: "glücklich" }
            answer: true

  - n: 2
    title: { de: "Nomen, Verb oder Adjektiv?", en: "Noun, verb or adjective?" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Das Wasser ist kalt." }
            spans: ["kalt"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist „bunt“ ein Adjektiv?"
            say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
            show: { drawn: letter-card, text: "bunt" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Der kleine Hund bellt."
            say: "Ein Adjektiv kann auch vor dem Nomen stehen. Der kleine Hund bellt. Wie ist der Hund? Klein. Vor dem Nomen bekommt das Adjektiv eine Endung: der kleine Hund."
          - text: "Hund · bellt · klein"
            say: "Drei Wortarten in einem Satz: Hund ist ein Nomen, man kann „der“ davorsetzen. Bellt ist ein Verb, es sagt, was der Hund tut. Klein ist ein Adjektiv, es sagt, wie er ist."
          - text: "der …? ich …? Wie ist …?"
            say: "Mit drei Proben findest du die Wortart: Passt „der, die, das“ davor, ist es ein Nomen. Passt „ich“ davor, ist es ein Verb. Ist es eine Antwort auf die Frage „Wie ist …?“, ist es ein Adjektiv."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv. Es steht vor dem Nomen."
                show: { drawn: letter-card, text: "Die liebe Oma strickt." }
                spans: ["liebe"]
                hints:
                  - "Frag: Wie ist die Oma?"
                  - "Die Oma ist lieb."
                  - "Liebe ist das Adjektiv."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Nomen, Verb oder Adjektiv?"
                say: "Die Wörter sind klein geschrieben. Sortiere sie: Nomen, Verb oder Adjektiv?"
                option_audio: false
                bins:
                  - { id: noun, show: { text: "Nomen" }, say: "Nomen" }
                  - { id: verb, show: { text: "Verb" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv" }, say: "Adjektiv" }
                options:
                  - { text: "baum", bin: noun }
                  - { text: "lachen", bin: verb }
                  - { text: "hoch", bin: adj }
                hints:
                  - "Mach mit jedem Wort die drei Proben."
                  - "Der Baum, ich lache, der Turm ist hoch."
                  - "Baum ist ein Nomen, lachen ein Verb, hoch ein Adjektiv."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Wortart ist „schnell“?"
                say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "schnell" }
                options: ["Adjektiv", "Nomen", "Verb"]
                answer: "Adjektiv"
                feedback:
                  "Verb": "Ich schnell passt nicht. Aber: Das Auto ist schnell. Also ist es ein Adjektiv."
                hints:
                  - "Stell die Wie-Frage: Wie ist das Auto?"
                  - "Das Auto ist schnell. Das passt."
                  - "Schnell ist ein Adjektiv."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Wir essen eine saure Gurke." }
                spans: ["saure"]
                hints:
                  - "Frag: Wie ist die Gurke?"
                  - "Die Gurke ist sauer."
                  - "Saure ist das Adjektiv."
              - id: l2-f5
                type: true_false
                text: "Ist „freude“ ein Adjektiv?"
                say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Ist es ein Adjektiv?"
                show: { drawn: letter-card, text: "freude" }
                answer: false
                hints:
                  - "Passt „die“ davor?"
                  - "Die Freude: Das passt."
                  - "Nein. Freude ist ein Nomen."

          - support: some
            tasks:
              - id: l2-s1
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Der dicke Bär schläft." }
                spans: ["dicke"]
                hints: ["Frag: Wie ist der Bär?"]
              - id: l2-s2
                type: sorting
                text: "Nomen, Verb oder Adjektiv?"
                say: "Die Wörter sind klein geschrieben. Sortiere sie: Nomen, Verb oder Adjektiv?"
                option_audio: false
                bins:
                  - { id: noun, show: { text: "Nomen" }, say: "Nomen" }
                  - { id: verb, show: { text: "Verb" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv" }, say: "Adjektiv" }
                options:
                  - { text: "schule", bin: noun }
                  - { text: "hüpfen", bin: verb }
                  - { text: "sauber", bin: adj }
                hints: ["Mach die drei Proben."]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Wortart ist „lesen“?"
                say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "lesen" }
                options: ["Adjektiv", "Nomen", "Verb"]
                answer: "Verb"
                hints: ["Passt „ich“ davor?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Der warme Pulli kratzt." }
                spans: ["warme"]
                hints: ["Wie ist der Pulli?"]
              - id: l2-s5
                type: true_false
                text: "Ist „leer“ ein Adjektiv?"
                say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
                show: { drawn: letter-card, text: "leer" }
                answer: true
                hints: ["Stell die Wie-Frage."]

          - support: none
            tasks:
              - id: l2-n1
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Die kluge Eule ruft." }
                spans: ["kluge"]
              - id: l2-n2
                type: sorting
                text: "Nomen, Verb oder Adjektiv?"
                say: "Die Wörter sind klein geschrieben. Sortiere sie: Nomen, Verb oder Adjektiv?"
                option_audio: false
                bins:
                  - { id: noun, show: { text: "Nomen" }, say: "Nomen" }
                  - { id: verb, show: { text: "Verb" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv" }, say: "Adjektiv" }
                options:
                  - { text: "garten", bin: noun }
                  - { text: "buddeln", bin: verb }
                  - { text: "tief", bin: adj }
              - id: l2-n3
                type: multiple_choice
                text: "Welche Wortart ist „fenster“?"
                say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "fenster" }
                options: ["Adjektiv", "Nomen", "Verb"]
                answer: "Nomen"
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf das Adjektiv."
                say: "Lies den Satz. Tippe auf das Adjektiv."
                show: { drawn: letter-card, text: "Opa liest ein altes Buch." }
                spans: ["altes"]
              - id: l2-n5
                type: true_false
                text: "Ist „klettern“ ein Adjektiv?"
                say: "Lies das Wort auf der Karte. Ist es ein Adjektiv?"
                show: { drawn: letter-card, text: "klettern" }
                answer: false

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: after-ist
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Das Zimmer ist ordentlich." }
            spans: ["ordentlich"]
          - id: l2-c2
            part: before-noun
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Ein freches Eichhörnchen klettert." }
            spans: ["freches"]
          - id: l2-c3
            part: word-type
            type: sorting
            text: "Nomen, Verb oder Adjektiv?"
            say: "Alle Wörter sind klein geschrieben. Zu welcher Wortart gehört jedes Wort?"
            option_audio: false
            bins:
              - { id: noun, show: { text: "Nomen" }, say: "Nomen" }
              - { id: verb, show: { text: "Verb" }, say: "Verb" }
              - { id: adj, show: { text: "Adjektiv" }, say: "Adjektiv" }
            options:
              - { text: "wolke", bin: noun }
              - { text: "regnen", bin: verb }
              - { text: "grau", bin: adj }
          - id: l2-c4
            part: word-type
            type: multiple_choice
            text: "Welche Wortart ist „traurig“?"
            say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
            show: { drawn: letter-card, text: "traurig" }
            options: ["Adjektiv", "Nomen", "Verb"]
            answer: "Adjektiv"
          - id: l2-c5
            part: word-type
            type: true_false
            text: "Ist „hose“ ein Adjektiv?"
            say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Ist es ein Adjektiv?"
            show: { drawn: letter-card, text: "hose" }
            answer: false
          - id: l2-c6
            part: after-ist
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der Kuchen ist lecker." }
            spans: ["lecker"]
          - id: l2-c7
            part: after-ist
            type: highlight_in_text
