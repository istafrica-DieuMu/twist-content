# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.vowels-consonants
skill: lit-de.spelling.vowels-consonants
curriculum: de-DE
language: de
title:
  de: Selbstlaute, Mitlaute, Umlaute, Zwielaute
  en: Vowels, consonants, umlauts and diphthongs
summary: >
  The kinds of letters and sounds. Lesson 1 tells the Selbstlaute a, e,
  i, o, u from the Mitlaute and shows that every syllable needs a
  Selbstlaut; lesson 2 adds the Umlaute ä, ö, ü and the Zwielaute au, ei,
  eu, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Laute und Buchstaben, en: Sounds and letters }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.letters.umlauts, lit-de.phonological.syllables]
  also_practises: [lit-de.phonological.syllables]
  vocabulary: { de: [Selbstlaut, Mitlaut, Umlaut, Zwielaut, Silbe] }
  forms: [picture, drawn, text, audio]
  drawn: [letter-card, syllable-arcs]
  sounds: [de.a]
  facets: []
  parts:
    - { id: vowel-consonant, what: { de: Selbstlaute und Mitlaute unterscheiden, en: telling vowels and consonants apart } }
    - { id: umlaut-diphthong, what: { de: "Umlaute (ä, ö, ü) und Zwielaute (au, ei, eu) erkennen", en: "recognising umlauts (ä, ö, ü) and diphthongs (au, ei, eu)" } }
    - { id: syllable, what: { de: "wissen, dass jede Silbe einen Selbstlaut braucht", en: knowing that every syllable needs a vowel } }
    - { id: missing, what: { de: "den fehlenden Selbstlaut, Umlaut oder Zwielaut in einem Wort finden", en: "finding the missing vowel, umlaut or diphthong in a word" } }
  misconceptions:
    - id: umlaut-is-diphthong
      what: Calls ä, ö, ü Zwielaute, or au, ei, eu Umlaute
      addressed: lesson 2 Learn separates the two; l2-s4 asks whether ä is a Zwielaut, and every stage of lesson 2 has a sorting task with both kinds
    - id: capital-not-vowel
      what: Does not count a capital E or A as a Selbstlaut
      addressed: l1-c1 has the word Ente with a capital E to find
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Selbstlaute und Mitlaute", en: "Vowels and consonants" }
    goal:
      de: "Finde Selbstlaute und Mitlaute in einem Wort. Jede Silbe braucht einen Selbstlaut, so wie in Banane."
      en: "Find the vowels and consonants in a word. Every syllable needs a vowel, like in Banane."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Wie viele Silben hat Tomate?"
            say: "Schwinge das Wort Tomate. Wie viele Silben hat es?"
            options: ["2", "3", "4"]
            answer: "3"
            difficulty: easy
          - id: l1-w2
            type: audio_choice
            text: "Welcher Buchstabe klingt so?"
            say: "Hör zu. Welcher Buchstabe klingt so?"
            audio: { sound: de.a }
            options: ["A", "M", "L"]
            answer: "A"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "a e i o u"
            say: "Das sind die Selbstlaute: a, e, i, o, u. Sie klingen ganz von selbst."
          - text: "b c d f g h j k l m n p q r s t v w x y z"
            say: "Alle anderen Buchstaben sind Mitlaute. Sie klingen mit, wenn ein Selbstlaut dabei ist."
          - text: "Ba-na-ne"
            say: "Jede Silbe braucht einen Selbstlaut. In Ba-na-ne hat jede Silbe ein a oder ein e."
            show: { drawn: syllable-arcs, word: "Banane", syllables: ["Ba", "na", "ne"] }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf alle Selbstlaute."
                say: "Sonne. Tippe auf alle Selbstlaute."
                show: { drawn: letter-card, text: "S o n n e" }
                spans: ["o", "e"]
                hints:
                  - "Selbstlaute sind a, e, i, o und u."
                  - "Geh Buchstabe für Buchstabe durch. In Sonne sind es zwei."
                  - "o und e."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welcher Buchstabe ist ein Selbstlaut?"
                say: "Welcher Buchstabe ist ein Selbstlaut?"
                options: ["i", "t", "m"]
                answer: "i"
                hints:
                  - "Selbstlaute sind a, e, i, o und u."
                  - "Geh die Buchstaben einzeln durch. Gehört t zu a, e, i, o, u? Und m?"
                  - "Das i."
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf alle Mitlaute."
                say: "Lampe. Tippe auf alle Mitlaute."
                show: { drawn: letter-card, text: "L a m p e" }
                spans: ["L", "m", "p"]
                hints:
                  - "Mitlaute sind alle Buchstaben, die keine Selbstlaute sind."
                  - "Lass a und e weg."
                  - "L, m und p."
              - id: l1-f4
                type: true_false
                text: "Ist „k“ ein Selbstlaut?"
                say: "Ist k ein Selbstlaut?"
                answer: false
                hints:
                  - "Selbstlaute sind a, e, i, o und u."
                  - "Ist „k“ dabei?"
                  - "Nein, „k“ ist ein Mitlaut."
              - id: l1-f5
                type: fill_in_blank
                text: "Welcher Selbstlaut fehlt?"
                say: "Hund. Welcher Selbstlaut fehlt?"
                show: { object: dog }
                frame: "H_nd"
                options: ["u", "o", "a"]
                answer: ["u"]
                hints:
                  - "Sprich das Wort langsam, Laut für Laut."
                  - "Erst hörst du H. Welcher Laut kommt danach, vor dem n?"
                  - "Es fehlt das u."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf alle Selbstlaute."
                say: "Tomate. Tippe auf alle Selbstlaute."
                show: { drawn: letter-card, text: "T o m a t e" }
                spans: ["o", "a", "e"]
                hints: ["Selbstlaute sind a, e, i, o und u."]
              - id: l1-s2
                type: multiple_choice
                text: "Welcher Buchstabe ist ein Mitlaut?"
                say: "Welcher Buchstabe ist ein Mitlaut?"
                options: ["r", "e", "o"]
                answer: "r"
                hints: ["Welcher Buchstabe ist kein Selbstlaut?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf alle Mitlaute."
                say: "Katze. Tippe auf alle Mitlaute."
                show: { drawn: letter-card, text: "K a t z e" }
                spans: ["K", "t", "z"]
                hints: ["Lass die Selbstlaute weg."]
              - id: l1-s4
                type: true_false
                text: "Hat jede Silbe von Tafel einen Selbstlaut?"
                say: "Ta-fel. Hat jede Silbe einen Selbstlaut?"
                show: { drawn: syllable-arcs, word: "Tafel", syllables: ["Ta", "fel"] }
                answer: true
                hints: ["Schau dir jede Silbe an: Ta und fel."]
              - id: l1-s5
                type: fill_in_blank
                text: "Welcher Selbstlaut fehlt?"
                say: "Fisch. Welcher Selbstlaut fehlt?"
                show: { object: fish }
                frame: "F_sch"
                options: ["i", "e", "u"]
                answer: ["i"]
                hints: ["Sprich das Wort langsam."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf alle Selbstlaute."
                say: "Muschel. Tippe auf alle Selbstlaute."
                show: { drawn: letter-card, text: "M u s c h e l" }
                spans: ["u", "e"]
              - id: l1-n2
                type: multiple_choice
                text: "Welcher Buchstabe ist ein Selbstlaut?"
                say: "Welcher Buchstabe ist ein Selbstlaut?"
                options: ["o", "s", "f"]
                answer: "o"
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf alle Mitlaute."
                say: "Nase. Tippe auf alle Mitlaute."
                show: { drawn: letter-card, text: "N a s e" }
                spans: ["N", "s"]
              - id: l1-n4
                type: true_false
                text: "Ist „u“ ein Selbstlaut?"
                say: "Ist u ein Selbstlaut?"
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Welcher Selbstlaut fehlt?"
                say: "Ball. Welcher Selbstlaut fehlt?"
                show: { object: ball }
                frame: "B_ll"
                options: ["a", "e", "o"]
                answer: ["a"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf alle Selbstlaute."
            say: "Ente. Tippe auf alle Selbstlaute."
            show: { drawn: letter-card, text: "E n t e" }
            spans: ["E", "e"]
          - id: l1-c2
            type: multiple_choice
            text: "Welcher Buchstabe ist ein Mitlaut?"
            say: "Welcher Buchstabe ist ein Mitlaut?"
            options: ["n", "a", "i"]
            answer: "n"
          - id: l1-c3
            type: fill_in_blank
            text: "Welcher Selbstlaut fehlt?"
            say: "Rock. Welcher Selbstlaut fehlt?"
            show: { object: skirt }
            frame: "R_ck"
            options: ["o", "u", "a"]
            answer: ["o"]
          - id: l1-c4
            type: highlight_in_text
            text: "Tippe auf alle Selbstlaute."
            say: "Igel. Tippe auf alle Selbstlaute."
            show: { drawn: letter-card, text: "I g e l" }
            spans: ["I", "e"]
          - id: l1-c5
            type: true_false
            text: "Hat jede Silbe von Kerze einen Selbstlaut?"
            say: "Ker-ze. Hat jede Silbe einen Selbstlaut?"
            show: { drawn: syllable-arcs, word: "Kerze", syllables: ["Ker", "ze"] }
            answer: true
          - id: l1-c6
            type: fill_in_blank
            text: "Welcher Selbstlaut fehlt?"
            say: "Socke. Welcher Selbstlaut fehlt?"
            show: { object: sock }
            frame: "S_cke"
            options: ["o", "u", "a"]
            answer: ["o"]

  - n: 2
    title: { de: "Umlaute und Zwielaute", en: "Umlauts and diphthongs" }
    goal:
      de: "Erkenne Umlaute wie in Käse und Zwielaute wie in Auto."
      en: "Spot umlauts like in Käse and double sounds like in Auto."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tippe auf alle Selbstlaute."
            say: "Hose. Tippe auf alle Selbstlaute."
            show: { drawn: letter-card, text: "H o s e" }
            spans: ["o", "e"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welcher Buchstabe ist ein Mitlaut?"
            say: "Welcher Buchstabe ist ein Mitlaut?"
            options: ["b", "u", "e"]
            answer: "b"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "ä ö ü"
            say: "Ä, ö und ü heißen Umlaute. Auch sie sind Selbstlaute, wie in Käse, Löwe und Mütze."
            show: { object: lion }
          - text: "au ei eu"
            say: "Au, ei und eu sind Zwielaute. Zwei Buchstaben klingen zusammen wie ein Laut, wie in Auto, Eis und heute."
            show: { object: car }
          - text: "Au-to | Ei-mer"
            say: "Ein Zwielaut kann auch der Selbstlaut einer Silbe sein: Au-to, Ei-mer."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Laut ist ein Umlaut?"
                say: "Welcher Laut ist ein Umlaut?"
                options: ["ö", "o", "ei"]
                answer: "ö"
                hints:
                  - "Umlaute sind ä, ö und ü."
                  - "Welcher Buchstabe hat zwei Punkte?"
                  - "Das ö."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf das Wort mit einem Zwielaut."
                say: "Tippe auf das Wort mit einem Zwielaut."
                show: { drawn: letter-card, text: "Ball Baum Tisch" }
                spans: ["Baum"]
                hints:
                  - "Zwielaute sind au, ei und eu."
                  - "Lies jedes Wort. Siehst du irgendwo au, ei oder eu?"
                  - "Baum."
              - id: l2-f3
                type: fill_in_blank
                text: "Welcher Laut fehlt?"
                say: "Löwe. Welcher Laut fehlt?"
                show: { object: lion }
                frame: "L_we"
                options: ["ö", "o", "ü"]
                answer: ["ö"]
                hints:
                  - "Hör genau hin: Löwe."
                  - "Klingt es wie o in Ofen oder anders? Es ist ein Umlaut."
                  - "Es fehlt das ö."
              - id: l2-f4
                type: true_false
                text: "Ist „ei“ ein Zwielaut?"
                say: "Ist ei ein Zwielaut?"
                answer: true
                hints:
                  - "Zwielaute sind au, ei und eu."
                  - "Ist „ei“ dabei?"
                  - "Ja, „ei“ ist ein Zwielaut."
              - id: l2-f5
                type: sorting
                text: "Umlaut oder Zwielaut?"
                say: "Hör dir jedes Wort an. Hat es einen Umlaut wie Löwe oder einen Zwielaut wie Auto? Sortiere die Bilder."
                bins:
                  - { id: umlaut, show: { object: lion }, say: "Mit Umlaut, wie Löwe." }
                  - { id: zwielaut, show: { object: car }, say: "Mit Zwielaut, wie Auto." }
                options:
                  - { object: woolly-hat, bin: umlaut }
                  - { object: egg, bin: zwielaut }
                  - { object: cheese, bin: umlaut }
                  - { object: house, bin: zwielaut }
                hints:
                  - "Tippe auf jedes Bild und hör genau hin."
                  - "Mütze: Hörst du ü, ä oder ö? Oder au, ei oder eu? Mach so mit jedem Bild weiter."
                  - "Umlaut: Mütze, Käse. Zwielaut: Ei, Haus."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Laut ist ein Zwielaut?"
                say: "Welcher Laut ist ein Zwielaut?"
                options: ["eu", "ü", "n"]
                answer: "eu"
                hints: ["Zwielaute sind au, ei und eu."]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf das Wort mit einem Umlaut."
                say: "Tippe auf das Wort mit einem Umlaut."
                show: { drawn: letter-card, text: "Rose Möhre Hase" }
                spans: ["Möhre"]
                hints: ["Welches Wort hat einen Buchstaben mit zwei Punkten?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Welcher Laut fehlt?"
                say: "Mütze. Welcher Laut fehlt?"
                show: { object: woolly-hat }
                frame: "M_tze"
                options: ["ü", "u", "i"]
                answer: ["ü"]
                hints: ["Es ist ein Umlaut."]
              - id: l2-s4
                type: true_false
                text: "Ist „ä“ ein Zwielaut?"
                say: "Ist ä ein Zwielaut?"
                answer: false
                hints: ["„Ä“ hat zwei Punkte. Ist es ein Umlaut oder ein Zwielaut?"]
              - id: l2-s5
                type: sorting
                text: "Umlaut oder Zwielaut?"
                say: "Hat das Wort einen Umlaut wie Löwe oder einen Zwielaut wie Auto? Sortiere die Bilder."
                bins:
                  - { id: umlaut, show: { object: lion }, say: "Mit Umlaut, wie Löwe." }
                  - { id: zwielaut, show: { object: car }, say: "Mit Zwielaut, wie Auto." }
                options:
                  - { object: pig, bin: zwielaut }
                  - { object: carrot, bin: umlaut }
                  - { object: mouse, bin: zwielaut }
                  - { object: saw, bin: umlaut }
                hints: ["Tippe auf jedes Bild und hör genau hin."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Laut ist ein Umlaut?"
                say: "Welcher Laut ist ein Umlaut?"
                options: ["ü", "u", "au"]
                answer: "ü"
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf das Wort mit einem Zwielaut."
                say: "Tippe auf das Wort mit einem Zwielaut."
                show: { drawn: letter-card, text: "Leiter Löffel Lampe" }
                spans: ["Leiter"]
              - id: l2-n3
                type: fill_in_blank
                text: "Welcher Laut fehlt?"
                say: "Feuerwehrauto. Welcher Laut fehlt?"
                show: { object: fire-engine }
                frame: "F_erwehrauto"
                options: ["eu", "ei", "au"]
                answer: ["eu"]
              - id: l2-n4
                type: true_false
                text: "Ist „ö“ ein Umlaut?"
                say: "Ist ö ein Umlaut?"
                answer: true
              - id: l2-n5
                type: sorting
                text: "Umlaut oder Zwielaut?"
                say: "Hat das Wort einen Umlaut wie Löwe oder einen Zwielaut wie Auto? Sortiere die Bilder."
                bins:
                  - { id: umlaut, show: { object: lion }, say: "Mit Umlaut, wie Löwe." }
                  - { id: zwielaut, show: { object: car }, say: "Mit Zwielaut, wie Auto." }
                options:
                  - { object: leg, bin: zwielaut }
                  - { object: cube, bin: umlaut }
                  - { object: tree, bin: zwielaut }
                  - { object: queen, bin: umlaut }

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: vowel-consonant
            type: multiple_choice
            text: "Welcher Buchstabe ist ein Selbstlaut?"
            say: "Welcher Buchstabe ist ein Selbstlaut?"
            options: ["e", "k", "r"]
            answer: "e"
          - id: l2-c2
            part: vowel-consonant
            type: highlight_in_text
            text: "Tippe auf alle Selbstlaute."
            say: "Glocke. Tippe auf alle Selbstlaute."
            show: { drawn: letter-card, text: "G l o c k e" }
            spans: ["o", "e"]
          - id: l2-c3
            part: umlaut-diphthong
            type: multiple_choice
            text: "Welcher Laut ist ein Zwielaut?"
            say: "Welcher Laut ist ein Zwielaut?"
            options: ["au", "ä", "s"]
            answer: "au"
          - id: l2-c4
            part: missing
            type: fill_in_blank
            text: "Welcher Laut fehlt?"
            say: "Schwein. Welcher Laut fehlt?"
            show: { object: pig }
            frame: "Schw_n"
            options: ["ei", "ie", "eu"]
            answer: ["ei"]
          - id: l2-c5
            part: syllable
            type: true_false
            text: "Braucht jede Silbe einen Selbstlaut?"
            say: "Braucht jede Silbe einen Selbstlaut?"
            answer: true
          - id: l2-c6
            part: vowel-consonant
            type: highlight_in_text
            text: "Tippe auf alle Mitlaute."
            say: "Gabel. Tippe auf alle Mitlaute."
            show: { drawn: letter-card, text: "G a b e l" }
            spans: ["G", "b", "l"]
          - id: l2-c7
            part: vowel-consonant
            type: true_false
            text: "Im Wort „Brot“ steht nur ein Selbstlaut. Stimmt das?"
            say: "Lies das Wort Brot. Steht darin nur ein Selbstlaut? Stimmt das?"
            answer: true
          - id: l2-c8
            part: vowel-consonant
            type: sorting
            text: "Selbstlaut oder Mitlaut? Sortiere die Buchstaben."
            say: "Ist der Buchstabe ein Selbstlaut oder ein Mitlaut? Sortiere."
            option_audio: false
            bins:
              - { id: selbst, show: { text: "Selbstlaut" }, say: "Selbstlaut" }
              - { id: mit, show: { text: "Mitlaut" }, say: "Mitlaut" }
            options:
              - { text: "a", bin: selbst }
              - { text: "s", bin: mit }
              - { text: "u", bin: selbst }
              - { text: "w", bin: mit }
              - { text: "o", bin: selbst }
              - { text: "d", bin: mit }
          - id: l2-c9
            part: umlaut-diphthong
            type: highlight_in_text
            text: "Tippe auf das Wort mit einem Umlaut."
            say: "Lies die drei Wörter. Tippe auf das Wort mit einem Umlaut."
            show: { drawn: letter-card, text: "Hund Hütte Haus" }
            spans: ["Hütte"]
          - id: l2-c10
            part: umlaut-diphthong
            type: true_false
            text: "Im Wort „Schaukel“ steckt ein Umlaut. Stimmt das?"
            say: "Lies das Wort Schaukel. Steckt darin ein Umlaut? Stimmt das?"
            answer: false
          - id: l2-c11
            part: umlaut-diphthong
            type: sorting
            text: "Sortiere die Bilder: Umlaut oder Zwielaut?"
            say: "Tippe auf jedes Bild und hör das Wort. Hörst du einen Umlaut oder einen Zwielaut? Sortiere."
            bins:
              - { id: umlaut, show: { object: lion }, say: "Mit Umlaut, wie Löwe." }
              - { id: zwielaut, show: { object: car }, say: "Mit Zwielaut, wie Auto." }
            options:
              - { object: spoon, bin: umlaut }
              - { object: chalk, bin: zwielaut }
              - { object: bridge, bin: umlaut }
              - { object: eye, bin: zwielaut }
          - id: l2-c12
            part: umlaut-diphthong
            type: multiple_choice
            text: "Welches Wort hat einen Zwielaut?"
            say: "Lies die drei Wörter. Welches hat einen Zwielaut?"
            options: ["Tür", "Seil", "Topf"]
            answer: "Seil"
          - id: l2-c13
            part: syllable
            type: multiple_choice
            text: "Welche Silbe kann es nicht geben?"
            say: "Lies die drei Silben. Welche Silbe kann es nicht geben?"
            options: ["mo", "brt", "ki"]
            answer: "brt"
            option_audio: false
          - id: l2-c14
            part: syllable
            type: fill_in_blank
            text: "Was fehlt in der zweiten Silbe?"
            say: "Bril-le. Was fehlt in der zweiten Silbe?"
            show: { object: glasses }
            frame: "Bril-l_"
            options: ["n", "e", "r"]
            answer: ["e"]
          - id: l2-c15
            part: syllable
            type: true_false
            text: "Die Silbe „schw“ hat einen Selbstlaut. Stimmt das?"
            say: "Lies die Silbe. Hat sie einen Selbstlaut? Stimmt das?"
            answer: false
          - id: l2-c16
            part: syllable
            type: sorting
            text: "Kann das eine Silbe sein? Sortiere."
            say: "Lies jede Karte. Kann das eine Silbe sein oder nicht? Sortiere."
            option_audio: false
            bins:
              - { id: ja, show: { text: "kann eine Silbe sein" }, say: "kann eine Silbe sein" }
              - { id: nein, show: { text: "kann keine Silbe sein" }, say: "kann keine Silbe sein" }
            options:
              - { text: "ma", bin: ja }
              - { text: "tz", bin: nein }
