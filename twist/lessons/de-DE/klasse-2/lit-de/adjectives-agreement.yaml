        screens:
          - text: "ein große Hund oder ein großer Hund?"
            say: "Jetzt steht ein vor dem Hund, nicht der. Was glaubst du: Heißt es ein große Hund oder ein großer Hund?"
            show: { object: dog }
          - text: "der große Hund · ein großer Hund"
            say: "Ein großer Hund! Nach „ein“ ändert sich die Endung. Der große Hund, aber: ein großer Hund. Hör auf das r am Ende, wie bei „der“."
            show: { object: dog }
          - text: "eine große Katze · ein großes Haus"
            say: "Bei „eine“ bleibt das -e: eine große Katze. Bei „das Haus“ heißt es: ein großes Haus. Hör auf das s, wie bei „das“."
            show: { object: house }
          - text: "die großen Hunde · die großen Häuser"
            say: "In der Mehrzahl mit „die“ endet das Adjektiv auf -en: die großen Hunde, die großen Häuser."
          - text: "Wusstest du? Ein neugeborenes Känguru ist nur etwa 2 cm groß."
            say: "Wusstest du? Ein neugeborenes Känguru ist nur etwa zwei Zentimeter groß, so klein wie ein Gummibärchen. Ein winziges Baby! Hör auf die Endung: das Baby, ein winziges Baby."

