# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.adjectives-agreement
skill: lit-de.adjectives.agreement
curriculum: de-DE
language: de
title:
  de: Adjektive vor dem Nomen
  en: Adjectives before the noun
summary: >
  An adjective before a noun gets an ending that fits the noun: der rote
  Ball, ein roter Ball, die roten Bälle. Lesson 1 uses der, die, das
  (der große Hund, die große Katze, das große Haus: always -e); lesson 2
  uses ein and eine (ein großer Hund, eine große Katze, ein großes Haus)
  and the plural (die großen Hunde), and ends with the skill check. Only
  the Nominativ is used here.
metadata:
  year: klasse-2
  topic: { de: Adjektive, en: Adjectives }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.adjectives.describe, lit-de.nouns.articles]
  also_practises: [lit-de.nouns.plural]
  vocabulary: { de: [Adjektiv, Endung, Begleiter, der, die, das, ein, eine, Mehrzahl] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: after-der, what: { de: "die Endung nach der, die und das (der große Hund)", en: "the ending after der, die and das" } }
    - { id: after-ein, what: { de: "die Endung nach ein und eine (ein großer Hund, ein großes Haus)", en: "the ending after ein and eine" } }
    - { id: plural, what: { de: "die Endung in der Mehrzahl (die großen Hunde)", en: "the ending in the plural" } }
    - { id: in-sentence, what: { de: Adjektive im Satz an das Nomen anpassen, en: making adjectives agree in a sentence } }
  misconceptions:
    - id: no-ending
      what: Leaves the adjective without an ending before the noun (der groß Hund)
      addressed: Learn says an adjective before the noun always gets an ending; the bare form is an option in each lesson 1 stage, with feedback in the full stage
    - id: ein-like-der
      what: Uses the der-ending after ein (ein große Hund)
      addressed: lesson 2 Learn sets der große Hund beside ein großer Hund; options include the -e form, with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "der, die, das: immer -e", en: "der, die, das: always -e" }
    goal:
      de: "Finde die richtige Form vom Adjektiv nach der, die und das, so wie der große Hund und das große Haus."
      en: "Find the right adjective ending after der, die and das, like der große Hund, the big dog."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "der, die oder das? Hund"
            say: "Welcher Begleiter passt zu Hund?"
            options: ["der", "die", "das"]
            answer: "der"
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf das Adjektiv."
            say: "Lies den Satz. Tippe auf das Adjektiv."
            show: { drawn: letter-card, text: "Der Ball ist rot." }
            spans: ["rot"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "der rot Ball oder der rote Ball?"
            say: "Der Ball ist rot. Jetzt soll rot vor dem Ball stehen. Was glaubst du: Heißt es der rot Ball oder der rote Ball?"
            show: { object: ball }
          - text: "Der Ball ist rot. · der rote Ball"
            say: "Der rote Ball! Steht das Adjektiv hinter „ist“, bleibt es, wie es ist: Der Ball ist rot. Steht es vor dem Nomen, bekommt es eine Endung: der rote Ball."
            show: { object: ball }
          - text: "der große Hund · die große Katze · das große Haus"
            say: "Nach der, die und das endet das Adjektiv auf -e: der große Hund, die große Katze, das große Haus."
          - text: "der groß Hund ✗ · der große Hund ✓"
            say: "Ohne Endung klingt es falsch: der groß Hund. Richtig ist: der große Hund."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welche Form passt? der _ Apfel"
                say: "Welche Form passt? Der … Apfel. Das Adjektiv heißt grün."
                options: ["grüne", "grün", "grüner"]
                answer: "grüne"
                feedback:
                  "grün": "Vor dem Nomen braucht das Adjektiv eine Endung: der grüne Apfel."
                hints:
                  - "Vor dem Nomen bekommt das Adjektiv eine Endung."
                  - "Nach „der“ endet es auf -e."
                  - "der grüne Apfel."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: die klein… Maus."
                frame: "die klein_ Maus"
                options: ["e", "er", "es"]
                answer: ["e"]
                hints:
                  - "Nach „die“ endet das Adjektiv auf -e."
                  - "die kleine …"
                  - "Es heißt: die kleine Maus."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? das neu Fahrrad"
                say: "Lies die Karte. Stimmt das so?"
                show: { drawn: letter-card, text: "das neu Fahrrad" }
                answer: false
                feedback:
                  "true": "Das neu Fahrrad? Da fehlt ein Stück, wie bei einem Fahrrad ohne Klingel! Vor dem Nomen braucht das Adjektiv eine Endung: das neue Fahrrad."
                hints:
                  - "Hat das Adjektiv eine Endung?"
                  - "Nach „das“ endet es auf -e."
                  - "Nein, richtig ist: das neue Fahrrad."
              - id: l1-f4
                type: multiple_choice
                text: "Welche Form passt? das _ Buch"
                say: "Welche Form passt? Das … Buch. Das Adjektiv heißt dick."
                options: ["dicke", "dick", "dickes"]
                answer: "dicke"
                hints:
                  - "Nach „das“ endet das Adjektiv auf -e."
                  - "das dicke …"
                  - "Es heißt: das dicke Buch."
              - id: l1-f5
                type: fill_in_blank
                text: "Ergänze die Endung."
                say: "Ergänze die Endung: der lustig… Clown."
                frame: "der lustig_ Clown"
