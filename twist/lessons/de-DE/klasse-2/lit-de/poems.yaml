# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.poems
skill: lit-de.texts-media.poems
curriculum: de-DE
language: de
title:
  de: Gedichte untersuchen
  en: Exploring poems
summary: >
  Looking closely at short poems written for Twist. Lesson 1 finds the
  rhyming words at the ends of the Verse, tells a rhyme from words that
  only start alike (Haus, Hose), and counts the Verse; lesson 2 counts the
  Strophen and the Verse in each, says how a poem sounds (fröhlich,
  traurig, ruhig) and which word shows it, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Geschichten und Gedichte, en: Stories and poems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.texts-media.text-types, lit-de.phonological.rhymes]
  also_practises: [lit-de.phonological.rhymes]
  vocabulary: { de: [Gedicht, Vers, Strophe, Reim, reimen, fröhlich, traurig, ruhig] }
  forms: [text, audio, drawn, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: rhyme, what: { de: Reimwörter erkennen und finden, en: recognising and finding rhyming words } }
    - { id: vers, what: { de: Verse erkennen und zählen, en: recognising and counting lines } }
    - { id: strophe, what: { de: Strophen und ihre Verse erkennen, en: recognising verses and their lines } }
    - { id: mood, what: { de: "sagen, wie ein Gedicht klingt, und das Wort finden, das es zeigt", en: "saying how a poem sounds and finding the word that shows it" } }
  misconceptions:
    - id: same-start-rhyme
      what: Takes words that start alike for a rhyme (Haus and Hose, Mond and Mund, Stern and Stein)
      addressed: "lesson 1 Learn sets Haus and Maus against Haus and Hose; l1-f4 and l1-s4 ask about a pair that starts alike; l1-c2 offers Stein for Stern"
    - id: vers-strophe
      what: Mixes up Vers and Strophe, or counts sentences instead of lines
      addressed: "lesson 1 Learn names each line a Vers; l1-f3 offers the number of sentences, with feedback; every Strophen task in lesson 2 offers the number of Verse (l2-f1 with feedback, l2-s1, l2-n1, l2-c1); l2-f5, l2-s5 and l2-n5 ask for the Verse in each Strophe"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Reime und Verse", en: "Rhymes and lines" }
    goal:
      de: "Finde die Wörter, die sich am Ende der Verse reimen, so wie Haus und Maus."
      en: "Find the words that rhyme at the ends of the lines, like Haus and Maus."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Die Sonne lacht,\nder Tag erwacht.\n\nWas für ein Text ist das?"
            say: "Lies den Text. Was für ein Text ist das?"
            options: ["ein Gedicht", "eine Anleitung", "ein Brief"]
            answer: "ein Gedicht"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Reimt sich das?"
            say: "Haus, Maus. Reimt sich das?"
            show: { objects: [house, mouse] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Wind, der weht so sehr,\ndie Blätter fliegen hin und her.\nSie tanzen rot und gelb und braun\nund landen sacht am Gartenzaun."
            say: "Das ist ein Gedicht. Jede Zeile in einem Gedicht heißt Vers. Dieses Gedicht hat vier Verse."
          - text: "sehr | her\nbraun | Gartenzaun"
            say: "Hör auf das Ende der Verse: sehr und her, braun und Gartenzaun. Sie klingen am Ende gleich. Sie reimen sich."
          - text: "Haus | Maus: reimt sich\nHaus | Hose: reimt sich nicht"
            say: "Pass auf: Haus und Hose fangen gleich an. Aber am Ende klingen sie anders. Ein Reim klingt am Ende gleich, nicht am Anfang."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf die zwei Wörter, die sich reimen."
                say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
                show: { drawn: letter-card, text: "Die Sonne lacht, der Schnee ist fort, die Blumen blühen hier und dort." }
                spans: ["fort", "dort."]
                hints:
                  - "Reimwörter stehen oft am Ende der Verse."
                  - "Das erste Ende ist fort. Welches Wort klingt am Ende gleich?"
                  - "Tippe auf fort und dort."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Setz das Reimwort ein."
                say: "Welches Wort reimt sich und passt in die Lücke?"
                frame: "Im Garten sitzt die kleine Maus, sie läuft ganz schnell zurück ins _."
                options: ["Haus", "Zimmer", "Hose"]
                answer: ["Haus"]
                hints:
                  - "Das Wort muss sich auf Maus reimen."
                  - "Hose fängt an wie Haus, aber reimt sich nicht auf Maus."
                  - "Maus, Haus."
              - id: l1-f3
                type: multiple_choice
                text: "Der Mond steht still am Himmelszelt,\ner schaut ganz leise auf die Welt.\nDie Sterne funkeln klein und fein,\nbald schläft das ganze Dorf schon ein.\n\nWie viele Verse hat das Gedicht?"
                say: "Lies das Gedicht. Wie viele Verse hat es?"
                options: ["vier", "zwei", "eins"]
                answer: "vier"
                feedback:
                  "zwei": "Das Gedicht hat zwei Sätze. Aber jede Zeile ist ein Vers. Zähl die Zeilen."
                hints:
                  - "Ein Vers ist eine Zeile."
                  - "Zähl die Zeilen, nicht die Sätze."
                  - "Es sind vier Verse."
              - id: l1-f4
                type: true_false
                text: "Reimt sich das?"
                say: "Mond, Mund. Reimt sich das?"
                show: { objects: [moon, mouth] }
                answer: false
                hints:
                  - "Hör auf das Ende der Wörter."
                  - "Mond und Mund fangen gleich an. Aber klingen sie am Ende gleich?"
                  - "Nein, Mond und Mund reimen sich nicht."
              - id: l1-f5
                type: matching
                text: "Welche Wörter reimen sich?"
                say: "Verbinde die Wörter, die sich reimen."
                pairs:
                  - { left: { text: "Knie" }, right: { text: "nie" } }
                  - { left: { text: "groß" }, right: { text: "los" } }
                  - { left: { text: "Baum" }, right: { text: "Traum" } }
                hints:
                  - "Sprich jedes Wort leise. Hör auf das Ende."
                  - "Knie und nie klingen beide am Ende wie ie."
                  - "Knie und nie, groß und los, Baum und Traum."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf die zwei Wörter, die sich reimen."
                say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
                show: { drawn: letter-card, text: "Ich schau ihm nach, so lang ich kann, und fange leis zu weinen an." }
                spans: ["kann,", "an."]
                hints: ["Schau auf das Ende der Verse."]
              - id: l1-s2
                type: fill_in_blank
                text: "Setz das Reimwort ein."
                say: "Welches Wort reimt sich und passt in die Lücke?"
                frame: "Der Hund, der bellt den ganzen Tag, weil er die Kinder so gern _."
                options: ["mag", "hat", "sieht"]
                answer: ["mag"]
                hints: ["Das Wort muss sich auf Tag reimen."]
              - id: l1-s3
                type: multiple_choice
                text: "Die Schnecke kriecht ganz langsam fort,\nvon einem Blatt zum nächsten Ort.\nIhr Häuschen hat sie stets dabei,\nund Eile ist ihr einerlei.\n\nWie viele Verse hat das Gedicht?"
                say: "Lies das Gedicht. Wie viele Verse hat es?"
                options: ["vier", "zwei", "acht"]
                answer: "vier"
                hints: ["Zähl die Zeilen."]
              - id: l1-s4
                type: true_false
                text: "Reimt sich das?"
                say: "Haus, Hose. Reimt sich das?"
                show: { objects: [house, trousers] }
                answer: false
                hints: ["Hör auf das Ende, nicht auf den Anfang."]
              - id: l1-s5
                type: matching
                text: "Welche Wörter reimen sich?"
                say: "Verbinde die Wörter, die sich reimen."
                pairs:
                  - { left: { text: "fort" }, right: { text: "Ort" } }
                  - { left: { text: "dabei" }, right: { text: "einerlei" } }
                  - { left: { text: "Zelt" }, right: { text: "Welt" } }
                hints: ["Sprich jedes Wort leise und hör auf das Ende."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf die zwei Wörter, die sich reimen."
                say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
                show: { drawn: letter-card, text: "Die Vögel singen laut im Baum, der Frühling ist ein schöner Traum." }
                spans: ["Baum,", "Traum."]
              - id: l1-n2
                type: fill_in_blank
                text: "Setz das Reimwort ein."
                say: "Welches Wort reimt sich und passt in die Lücke?"
                frame: "Der Tag ist um, das Spiel ist aus, jetzt laufen alle schnell ins _."
                options: ["Haus", "Bett", "Zimmer"]
                answer: ["Haus"]
              - id: l1-n3
                type: multiple_choice
                text: "Es regnet, es regnet, die Pfützen sind groß,\nich springe hinein, und dann geht es los!\nEs spritzt und es platscht bis hoch an mein Knie,\nso lustig war Regen noch nie!\n\nWie viele Verse hat das Gedicht?"
                say: "Lies das Gedicht. Wie viele Verse hat es?"
                options: ["vier", "zwei", "sechs"]
                answer: "vier"
              - id: l1-n4
                type: true_false
                text: "Reimt sich das?"
                say: "Fisch, Tisch. Reimt sich das?"
                show: { objects: [fish, table] }
                answer: true
              - id: l1-n5
                type: matching
                text: "Welche Wörter reimen sich?"
                say: "Verbinde die Wörter, die sich reimen."
                pairs:
                  - { left: { text: "Maus" }, right: { text: "Haus" } }
                  - { left: { text: "Hund" }, right: { text: "rund" } }
                  - { left: { text: "Schnee" }, right: { text: "See" } }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf die zwei Wörter, die sich reimen."
            say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
            show: { drawn: letter-card, text: "Es spritzt und es platscht bis hoch an mein Knie, so lustig war Regen noch nie!" }
            spans: ["Knie,", "nie!"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort reimt sich auf Stern?"
            say: "Welches Wort reimt sich auf Stern?"
            options: ["gern", "Stein", "Sonne"]
            answer: "gern"
          - id: l1-c3
            type: multiple_choice
            text: "Ein Vogel singt im grünen Baum,\nso schön, man glaubt es kaum.\n\nWie viele Verse hat das Gedicht?"
            say: "Lies das Gedicht. Wie viele Verse hat es?"
            options: ["zwei", "eins", "vier"]
            answer: "zwei"
          - id: l1-c4
            type: true_false
            text: "Reimt sich das?"
            say: "Boot, Brot. Reimt sich das?"
            show: { objects: [boat, bread] }
            answer: true
          - id: l1-c5
            type: matching
            text: "Verbinde die Reimwörter."
            say: "Verbinde die Wörter, die am Ende gleich klingen."
            pairs:
              - { left: { text: "Nacht" }, right: { text: "lacht" } }
              - { left: { text: "Hut" }, right: { text: "gut" } }
              - { left: { text: "Tanne" }, right: { text: "Kanne" } }
          - id: l1-c6
            type: fill_in_blank
            text: "Setz das Reimwort ein."
            say: "Welches Wort reimt sich und passt in die Lücke?"
            frame: "Ich male einen bunten Fisch und lege ihn auf meinen _."
            options: ["Tisch", "Teller", "Stuhl"]
            answer: ["Tisch"]

  - n: 2
    title: { de: "Strophen und wie ein Gedicht klingt", en: "Verses and how a poem sounds" }
    goal:
      de: "Zähl die Strophen eines Gedichts und sag, ob es fröhlich, traurig oder ruhig klingt."
      en: "Count the verses of a poem and say whether it sounds happy, sad or calm."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tippe auf die zwei Wörter, die sich reimen."
            say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
            show: { drawn: letter-card, text: "Der Mond steht still am Himmelszelt, er schaut ganz leise auf die Welt." }
            spans: ["Himmelszelt,", "Welt."]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Reimt sich das?"
            say: "Rose, Hose. Reimt sich das?"
            show: { objects: [rose, trousers] }
            answer: true
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Die Sonne lacht, der Schnee ist fort,\ndie Blumen blühen hier und dort.\n\nDie Vögel singen laut im Baum,\nder Frühling ist ein schöner Traum."
            say: "Manche Gedichte haben mehrere Teile. Zwischen den Teilen ist eine Lücke. So ein Teil heißt Strophe. Dieses Gedicht hat zwei Strophen. Jede Strophe hat zwei Verse."
          - text: "Es regnet, es regnet, die Pfützen sind groß,\nich springe hinein, und dann geht es los!\nEs spritzt und es platscht bis hoch an mein Knie,\nso lustig war Regen noch nie!"
            say: "Ein Gedicht kann fröhlich klingen. Hier springt ein Kind in Pfützen. Es spritzt und platscht, und im letzten Vers steht: so lustig. Das Gedicht klingt fröhlich."
          - text: "Mein roter Luftballon ist fort,\ner fliegt zu einem fernen Ort.\nIch schau ihm nach, so lang ich kann,\nund fange leis zu weinen an."
            say: "Dieses Gedicht klingt traurig. Der Ballon ist fort, und das Kind weint. Frag dich beim Lesen: Wie fühlt sich das an? Fröhlich, traurig oder ruhig? Such das Wort, das es zeigt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Der Hase hoppelt übers Feld,\ner ist der schnellste Hase der Welt.\n\nEr frisst den Klee und frisst das Kraut\nund ist dabei ganz still, nicht laut.\n\nWie viele Strophen hat das Gedicht?"
                say: "Lies das Gedicht. Wie viele Strophen hat es?"
                options: ["zwei", "vier", "eins"]
                answer: "zwei"
                feedback:
                  "vier": "Vier ist die Zahl der Verse. Eine Strophe ist ein Teil mit einer Lücke danach."
                hints:
                  - "Eine Strophe ist ein Teil des Gedichts. Zwischen zwei Strophen ist eine Lücke."
                  - "Zähl die Teile, nicht die Zeilen."
                  - "Es sind zwei Strophen."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Es regnet, es regnet, die Pfützen sind groß,\nich springe hinein, und dann geht es los!\nEs spritzt und es platscht bis hoch an mein Knie,\nso lustig war Regen noch nie!\n\nWie klingt das Gedicht?"
                say: "Lies das Gedicht. Wie klingt es?"
                options: ["fröhlich", "traurig", "ängstlich"]
                answer: "fröhlich"
                hints:
                  - "Was macht das Kind im Gedicht?"
                  - "Es springt in Pfützen. Im letzten Vers steht: so lustig."
                  - "Das Gedicht klingt fröhlich."
              - id: l2-f3
                type: true_false
                text: "Mein roter Luftballon ist fort,\ner fliegt zu einem fernen Ort.\nIch schau ihm nach, so lang ich kann,\nund fange leis zu weinen an.\n\nKlingt das Gedicht traurig?"
                say: "Lies das Gedicht. Klingt es traurig?"
                answer: true
                hints:
                  - "Was passiert mit dem Luftballon?"
                  - "Der Ballon fliegt fort, und das Kind fängt an zu weinen."
                  - "Ja, das Gedicht klingt traurig."
              - id: l2-f4
                type: highlight_in_text
                text: "Welches Wort zeigt, wie sich das Kind fühlt? Tippe darauf."
                say: "Lies die Verse. Welches Wort zeigt, wie sich das Kind fühlt? Tippe darauf."
                show: { drawn: letter-card, text: "Ich schau ihm nach, so lang ich kann, und fange leis zu weinen an." }
                spans: ["weinen"]
                hints:
                  - "Was macht das Kind am Ende?"
                  - "Wenn du traurig bist, was machst du dann?"
                  - "Tippe auf weinen."
              - id: l2-f5
                type: multiple_choice
                text: "Der Hase hoppelt übers Feld,\ner ist der schnellste Hase der Welt.\n\nEr frisst den Klee und frisst das Kraut\nund ist dabei ganz still, nicht laut.\n\nWie viele Verse hat jede Strophe?"
                say: "Lies das Gedicht. Wie viele Verse hat jede Strophe?"
                options: ["zwei", "vier", "eins"]
                answer: "zwei"
                hints:
                  - "Schau nur auf die erste Strophe, bis zur Lücke."
                  - "Zähl die Zeilen bis zur Lücke."
                  - "Jede Strophe hat zwei Verse."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Am Morgen kräht der Hahn ganz laut,\nbis jeder aus dem Fenster schaut.\n\nAm Mittag liegt die Katze faul\nund gähnt mit ihrem großen Maul.\n\nAm Abend kommt der Mond heraus,\nund alle schlafen tief im Haus.\n\nWie viele Strophen hat das Gedicht?"
                say: "Lies das Gedicht. Wie viele Strophen hat es?"
                options: ["drei", "sechs", "zwei"]
                answer: "drei"
                hints: ["Zähl die Teile mit einer Lücke dazwischen."]
              - id: l2-s2
                type: multiple_choice
                text: "Der Mond steht still am Himmelszelt,\ner schaut ganz leise auf die Welt.\nDie Sterne funkeln klein und fein,\nbald schläft das ganze Dorf schon ein.\n\nWie klingt das Gedicht?"
                say: "Lies das Gedicht. Wie klingt es?"
                options: ["ruhig", "wütend", "lustig"]
                answer: "ruhig"
                hints: ["Achte auf die Wörter still, leise und schläft."]
              - id: l2-s3
                type: true_false
                text: "Am Morgen kräht der Hahn ganz laut,\nbis jeder aus dem Fenster schaut.\n\nAm Mittag liegt die Katze faul\nund gähnt mit ihrem großen Maul.\n\nIst das Gedicht traurig?"
                say: "Lies das Gedicht. Ist es traurig?"
                answer: false
                hints: ["Weint jemand? Passiert etwas Schlimmes?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Welches Wort sagt, wie der Regen für das Kind ist? Tippe darauf."
                say: "Lies die Verse. Welches Wort sagt, wie der Regen für das Kind ist? Tippe darauf."
                show: { drawn: letter-card, text: "Es spritzt und es platscht bis hoch an mein Knie, so lustig war Regen noch nie!" }
                spans: ["lustig"]
                hints: ["Lies den letzten Vers."]
              - id: l2-s5
                type: multiple_choice
                text: "Am Morgen kräht der Hahn ganz laut,\nbis jeder aus dem Fenster schaut.\n\nAm Mittag liegt die Katze faul\nund gähnt mit ihrem großen Maul.\n\nAm Abend kommt der Mond heraus,\nund alle schlafen tief im Haus.\n\nWie viele Verse hat jede Strophe?"
                say: "Lies das Gedicht. Wie viele Verse hat jede Strophe?"
                options: ["zwei", "drei", "sechs"]
                answer: "zwei"
                hints: ["Zähl die Zeilen bis zur ersten Lücke."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Die Schnecke kriecht ganz langsam fort,\nvon einem Blatt zum nächsten Ort.\nIhr Häuschen hat sie stets dabei,\nund Eile ist ihr einerlei.\n\nKommt dann der Regen, nass und kühl,\nhat sie ein ganz frohes Gefühl.\nSie streckt die Fühler weit hinaus\nund kriecht ein Stück aus ihrem Haus.\n\nWie viele Strophen hat das Gedicht?"
                say: "Lies das Gedicht. Wie viele Strophen hat es?"
                options: ["zwei", "acht", "vier"]
                answer: "zwei"
              - id: l2-n2
                type: multiple_choice
                text: "Die Schnecke kriecht ganz langsam fort,\nvon einem Blatt zum nächsten Ort.\nIhr Häuschen hat sie stets dabei,\nund Eile ist ihr einerlei.\n\nWie klingt das Gedicht?"
                say: "Lies das Gedicht. Wie klingt es?"
                options: ["ruhig und gemütlich", "wild und laut", "traurig"]
                answer: "ruhig und gemütlich"
              - id: l2-n3
                type: true_false
                text: "Der Mond steht still am Himmelszelt,\ner schaut ganz leise auf die Welt.\nDie Sterne funkeln klein und fein,\nbald schläft das ganze Dorf schon ein.\n\nKlingt das Gedicht laut und wild?"
                say: "Lies das Gedicht. Klingt es laut und wild?"
                answer: false
              - id: l2-n4
                type: highlight_in_text
                text: "Welches Wort zeigt, wie sich die Schnecke im Regen fühlt? Tippe darauf."
                say: "Lies die Verse. Welches Wort zeigt, wie sich die Schnecke im Regen fühlt? Tippe darauf."
                show: { drawn: letter-card, text: "Kommt dann der Regen, nass und kühl, hat sie ein ganz frohes Gefühl." }
                spans: ["frohes"]
              - id: l2-n5
                type: multiple_choice
                text: "Die Schnecke kriecht ganz langsam fort,\nvon einem Blatt zum nächsten Ort.\nIhr Häuschen hat sie stets dabei,\nund Eile ist ihr einerlei.\n\nKommt dann der Regen, nass und kühl,\nhat sie ein ganz frohes Gefühl.\nSie streckt die Fühler weit hinaus\nund kriecht ein Stück aus ihrem Haus.\n\nWie viele Verse hat jede Strophe?"
                say: "Lies das Gedicht. Wie viele Verse hat jede Strophe?"
                options: ["vier", "zwei", "acht"]
                answer: "vier"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: strophe
            type: multiple_choice
            text: "Der Winter kommt, es schneit und schneit,\ndie ganze Welt ist weiß und weit.\n\nWir bauen einen Schneemann hier,\nmit Hut und Schal, so groß wie wir.\n\nWie viele Strophen hat das Gedicht?"
            say: "Lies das Gedicht. Wie viele Strophen hat es?"
            options: ["zwei", "vier", "eins"]
            answer: "zwei"
          - id: l2-c2
            part: rhyme
            type: highlight_in_text
            text: "Tippe auf die zwei Wörter, die sich reimen."
            say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
            show: { drawn: letter-card, text: "Wir bauen einen Schneemann hier, mit Hut und Schal, so groß wie wir." }
            spans: ["hier,", "wir."]
          - id: l2-c3
            part: mood
            type: multiple_choice
            text: "Hurra, die Ferien sind endlich da,\nwir hüpfen, tanzen und rufen: Hurra!\n\nWie klingt das Gedicht?"
            say: "Lies das Gedicht. Wie klingt es?"
