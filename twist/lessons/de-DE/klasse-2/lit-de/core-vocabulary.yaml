# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.core-vocabulary
skill: lit-de.spelling.core-vocabulary
curriculum: de-DE
language: de
title:
  de: Wörter, die oft vorkommen
  en: Common core words
summary: >
  The most common words of the Grundwortschatz. Lesson 1 takes small
  words that come in almost every sentence (und, ist, nicht, auch, sehr,
  schon, immer); lesson 2 takes common Verben and Nomen (gehen, sehen,
  heute, wieder, Freund, Schule, nach Hause), finds a misspelt word in a
  sentence, and ends with the skill check. About one task in four is a
  short dictation: the child hears a word and types it on the letter
  keyboard (nicht, ist, sind, immer, Freund, haben, Schule, wieder).
metadata:
  year: klasse-2
  topic: { de: Rechtschreibung üben, en: Spelling practice }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling.dictation-short]
  also_practises: [lit-de.spelling-strategies.memory-words, lit-de.spelling-strategies.lengthen-dt]
  vocabulary: { de: [Wort, Grundwortschatz, Fehler, einprägen] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: small-words, what: { de: "kleine Wörter, die oft vorkommen (und, ist, nicht, sehr)", en: "small words that come up all the time" } }
    - { id: verbs-nouns, what: { de: "häufige Verben und Nomen (gehen, Freund, Schule)", en: "common verbs and nouns" } }
    - { id: in-sentence, what: { de: ein falsch geschriebenes Wort im Satz finden, en: finding a misspelt word in a sentence } }
    - { id: dictation, what: { de: ein Wort nach Diktat schreiben, en: writing a word from dictation } }
  misconceptions:
    - id: write-as-heard
      what: Writes the small words as they sound (unt, nich, ser, gehn)
      addressed: lesson 1 Learn shows und with d and sehr with h; every stage has a misspelt word to find in a sentence and a choice or a typed word with feedback on the as-heard spelling (nich, isd, sint, gehn)
    - id: h-and-double
      what: Leaves out or adds an h or a double letter (schohn, imer, Schuhle)
      addressed: lesson 1 Learn names sehr, schon and immer; a gap in every stage of lesson 1 asks for h, a double letter or a single o (l1-f5 immer, l1-s2 dann, l1-n2 schon, l1-c3 sehr); misspelt cards l1-s3 schohn, l1-n4 imer, l2-s4 Schuhle and l2-c2 komt
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Kleine Wörter", en: "Small words" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Mama. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Mama" }
            answer: true
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Silben hat „immer“?"
            say: "Immer. Wie viele Silben hat das Wort?"
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "und | ist | nicht | auch"
            say: "Manche Wörter kommen in fast jedem Satz vor: und, ist, nicht, auch. Wenn du sie sicher schreiben kannst, hast du schon viel geschafft."
          - text: "und | ist"
            say: "Bei und hörst du am Ende ein t, aber du schreibst d. Bei ist hörst du ein t und schreibst auch t. Präge dir beide Wörter gut ein."
          - text: "sehr | schon | immer"
            say: "Diese Wörter musst du dir auch merken: sehr mit h, schon ohne h und immer mit zwei m. Wenn du ein Nomen tippst, tippst du für den großen Buchstaben zuerst auf den Pfeil."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Und. Welches Wort ist richtig geschrieben?"
                options: ["und", "unt", "undt"]
                answer: "und"
                option_audio: false
                hints:
                  - "Und ist ein Merkwort. Denk daran, wie es aussieht."
                  - "Und: Am Ende höre ich ein t. Aber und schreibt man mit einem anderen Buchstaben."
                  - "und."
                difficulty: easy
              - id: l1-f2
                type: text_input
                keyboard: letters
                text: "Schreib das Wort."
                say: "Nicht. Ich komme nicht mit. Schreib das Wort nicht."
                answer: "nicht"
                feedback:
                  nich: "Sprich bis zum Ende: nich ... t. Nicht endet mit t."
                  Nicht: "Nicht ist kein Nomen. Du schreibst es klein."
                hints:
                  - "Sprich das Wort langsam bis zum Ende."
                  - "Ni, ch, t: In der Mitte höre ich ch wie in ich, am Ende ein t."
                  - "nicht"
              - id: l1-f3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Ich spiele unt lache." }
                spans: ["unt"]
                hints:
                  - "Lies jedes Wort genau."
                  - "Ich, spiele, unt, lache. Bei einem kleinen Wort stimmt der letzte Buchstabe nicht."
                  - "Tippe auf unt. Richtig ist und."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Sehr. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "sehr" }
                answer: true
                hints:
                  - "Lies das Wort langsam und schau dir jeden Buchstaben an."
                  - "Sehr schreibt man mit h nach dem e. Steht das h auf der Karte?"
                  - "Ja, das ist richtig."
              - id: l1-f5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Immer. Was fehlt?"
                frame: "i_er"
                options: ["mm", "m", "hm"]
                answer: ["mm"]
                hints:
                  - "Schwinge das Wort: im, mer."
                  - "Jede Silbe hat ein m."
                  - "mm."

          - support: some
            tasks:
              - id: l1-s1
                type: text_input
                keyboard: letters
                text: "Schreib das Wort."
                say: "Ist. Das Eis ist kalt. Schreib das Wort ist."
                answer: "ist"
                feedback:
                  isd: "Bei ist hörst du ein t und schreibst auch t."
                  is: "Sprich ist ganz deutlich bis zum Ende: is ... t."
                hints: ["Sprich ist ganz deutlich bis zum Ende."]
              - id: l1-s2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Dann. Was fehlt?"
                frame: "da_"
                options: ["nn", "n", "hn"]
                answer: ["nn"]
                hints: ["Das a in dann ist kurz. Was schreibst du nach einem kurzen Selbstlaut?"]
              - id: l1-s3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Wir sind schohn da." }
                spans: ["schohn"]
                hints: ["Schon schreibst du ohne h."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Nicht. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "nich" }
                answer: false
                hints: ["Sprich das Wort bis zum Ende."]
              - id: l1-s5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Mit. Was fehlt?"
                frame: "mi_"
                options: ["t", "d", "tt"]
                answer: ["t"]
                hints: ["Mit ist ein kurzes Wort mit einem t."]

          - support: none
            tasks:
              - id: l1-n1
                type: text_input
                keyboard: letters
                text: "Schreib das Wort."
                say: "Sind. Wir sind im Garten. Schreib das Wort sind."
                answer: "sind"
                feedback:
                  sint: "Du hörst am Ende ein t, aber sind schreibst du mit d, wie und."
              - id: l1-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Schon. Was fehlt?"
                frame: "sch_n"
                options: ["o", "oh", "oo"]
                answer: ["o"]
              - id: l1-n3
                type: highlight_in_text
                text: "Tippe auf das falsch geschriebene Wort."
                say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
                show: { drawn: letter-card, text: "Das ist ser schön." }
                spans: ["ser"]
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Immer. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "imer" }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Wir. Was fehlt?"
                frame: "w_r"
                options: ["i", "ie", "ih"]
                answer: ["i"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: text_input
            keyboard: letters
            text: "Oma ist _ fröhlich. Schreib das fehlende Wort."
            say: "Immer. Oma ist immer fröhlich. Schreib das Wort immer."
            answer: "immer"
            feedback:
              imer: "Immer schreibst du mit zwei m: im, mer."
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
