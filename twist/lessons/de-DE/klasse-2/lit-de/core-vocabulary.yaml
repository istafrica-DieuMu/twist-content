          - id: l1-c5
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Schon. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "schon" }
            answer: true
          - id: l1-c6
            type: highlight_in_text
            text: "Tippe auf das falsch geschriebene Wort."
            say: "Lies den Satz. Ein Wort ist falsch geschrieben. Tippe es an."
            show: { drawn: letter-card, text: "Wir sint im Zoo." }
            spans: ["sint"]

