            text: "Morgen regnet es _. Schreib das fehlende Wort."
            say: "Wieder. Morgen regnet es wieder. Schreib das Wort wieder."
            answer: "wieder"
            feedback:
              wieda: "Am Ende hörst du a, aber du schreibst er: wie, der."
              wider: "Wieder schreibst du mit ie."
          - id: l2-c5
            part: verbs-nouns
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Der Freund. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Freund" }
            answer: true
