          - id: l1-c3
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Sehr. Was fehlt?"
            frame: "se_r"
            options: ["h", "e", "r"]
            answer: ["h"]
          - id: l1-c4
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Mit. Komm mit! Welches Wort ist richtig geschrieben?"
            options: ["mit", "mitt", "mid"]
            answer: "mit"
