                say: "Haben. Wir haben Hunger. Schreib das Wort haben."
                answer: "haben"
                feedback:
                  habn: "Schwinge das Wort: ha, ben. Die zweite Silbe braucht ein e."
                hints: ["Schwinge das Wort: ha, ben."]

          - support: none
            tasks:
              - id: l2-n1
