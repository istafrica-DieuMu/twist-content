      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Der Strand. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
