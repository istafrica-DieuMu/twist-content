                show: { drawn: letter-card, text: "laud" }
                answer: false
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Musik."
                  - "Laute Musik. In laute hörst du ein t."
                  - "Nein. Richtig ist laut."
              - id: l2-f5
                type: fill_in_blank
