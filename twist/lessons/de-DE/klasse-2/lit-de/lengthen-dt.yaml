                options: ["d", "t"]
                answer: ["d", "t"]
                hints:
                  - "Verlängere beide Wörter: das Nomen mit der Mehrzahl, das Adjektiv mit einem Nomen."
                  - "Zwei Hemden, ein altes Hemd. In Hemden hörst du ein d, in altes ein t."
                  - "Hemd mit d, alt mit t."

          - support: some
