# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.lengthen-dt
skill: lit-de.spelling-strategies.lengthen-dt
curriculum: de-DE
language: de
title:
  de: Verlängern bei d und t
  en: Lengthening for d and t
summary: >
  At the end of a word d and t sound the same. Lesson 1 makes a noun
  longer with its plural (Hund, Hunde; Brot, Brote) to hear which letter
  it is; lesson 2 does the same for Adjektive with a noun (rund, ein
  runder Ball; bunt, ein buntes Bild), and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling-strategies.syllable-swinging, lit-de.nouns.plural]
  also_practises: [lit-de.nouns.plural, lit-de.adjectives.recognise]
  vocabulary: { de: [verlängern, Mehrzahl, Adjektiv, Nomen, Endbuchstabe] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: noun, what: { de: "Nomen mit d oder t am Ende, verlängert mit der Mehrzahl", en: "nouns that end in d or t, lengthened with the plural" } }
    - { id: adjective, what: { de: "Adjektive mit d oder t am Ende, verlängert mit einem Nomen", en: "adjectives that end in d or t, lengthened with a noun" } }
    - { id: helper-word, what: { de: "das längere Wort finden, das beim Schreiben hilft", en: "choosing the longer word that shows the end letter" } }
    - { id: in-sentence, what: { de: Nomen und Adjektive im Satz verlängern und richtig schreiben, en: lengthening nouns and adjectives in a sentence to spell them } }
  misconceptions:
    - id: write-what-you-hear
      what: Writes the end letter as it sounds (Hunt for Hund) or guesses the other way (Brod for Brot)
      addressed: lesson 1 Learn hears Hund as t and shows why it is d; a "d oder t?" gap in every stage, a word card to judge in every stage, misspelt in l1-f4, l1-n4, l1-c6, l2-f4, l2-c4 and l2-c20 (Brod, Hemt, Schilt, laud, Pfert, Wint), sound-alike spellings to choose from in l2-c12 and l2-c19, typed words in l1-c5, l2-c8 and l2-c10
    - id: wrong-helper-word
      what: Picks a word that only looks similar instead of the longer form (Kino for Kind, Mond for Mund)
      addressed: "every stage has a \"Welches Wort hilft dir?\" task with look-alike words as options; the checks add l1-c4 (leicht for Licht), l2-c13 (das Licht for leicht), l2-c14 (lang for Land), l2-c15 (hell, Helm for Held) and l2-c16 (der Gurt for gut)"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Hund mit d, Brot mit t", en: "Hund with d, Brot with t" }
    goal:
      de: "Verlängere ein Nomen, dann hörst du, ob am Ende d oder t steht, so wie bei Hund und Hunde."
      en: "Make a noun longer to hear whether it ends in d or t, like Hund and Hunde."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "ein Kind, zwei …"
            say: "Ein Kind, zwei … Wie heißt die Mehrzahl?"
            options: ["Kinder", "Kinde", "Kinds"]
            answer: "Kinder"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie viele Silben hat das Wort Hunde?"
            say: "Schwing das Wort Hunde. Wie viele Silben hat es?"
            options: ["1", "2", "3"]
            answer: "2"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Hund"
            say: "Hör genau hin: Hund. Am Ende hörst du ein t. Geschrieben wird aber ein d. Woher weißt du das?"
            show: { object: dog }
          - text: "Hund → die Hunde"
            say: "Verlängere das Wort: ein Hund, zwei Hunde. In Hunde hörst du das d deutlich. Darum schreibst du Hund mit d."
          - text: "Brot → die Brote"
            say: "Bei Brot verlängerst du auch: ein Brot, zwei Brote. Jetzt hörst du ein t. Also schreibst du Brot mit t."
            show: { object: bread }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Die Hand. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                show: { object: hand }
                frame: "die Han_"
                options: ["d", "t"]
                answer: ["d"]
                hints:
                  - "Verlängere: eine Hand, zwei …"
                  - "Zwei Hände. In Hände hörst du das d."
                  - "Hand schreibt man mit d."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Welches Wort hilft dir bei Kind?"
                say: "Welches Wort hilft dir, wenn du Kind schreiben willst?"
                options: ["Kinder", "Kino", "Kinn"]
                answer: "Kinder"
                feedback:
                  "Kino": "Kino sieht nur ähnlich aus. Mach aus einem Kind mehrere."
                  "Kinn": "Kinn sieht nur ähnlich aus. Mach aus einem Kind mehrere."
                hints:
                  - "Mach aus einem Kind mehrere."
                  - "Ein Kind, zwei …"
                  - "Tippe auf Kinder."
              - id: l1-f3
                type: fill_in_blank
                text: "d oder t? Verlängere."
                say: "Der Hut. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                show: { object: hat }
                frame: "der Hu_"
                options: ["d", "t"]
                answer: ["t"]
                hints:
                  - "Verlängere: ein Hut, zwei …"
                  - "Zwei Hüte. In Hüte hörst du das t."
                  - "Hut schreibt man mit t."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Brod" }
                answer: false
                hints:
                  - "Verlängere das Wort: ein Brot, zwei …"
                  - "Zwei Brote. In Brote hörst du ein t."
                  - "Nein. Richtig ist Brot."
              - id: l1-f5
                type: image_multiple_choice
                text: "Welches Wort schreibt man am Ende mit d?"
                say: "Tippe auf die Bilder und hör die Wörter. Welches Wort schreibt man am Ende mit d?"
                options:
                  - { object: moon }
                  - { object: hat }
                  - { object: bread }
