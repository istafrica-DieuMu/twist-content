# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.find-information
skill: lit-de.comprehension.find-information
curriculum: de-DE
language: de
title:
  de: Informationen im Text finden
  en: Finding information in a text
summary: >
  Finding answers that stand in the text. Lesson 1 reads short stories,
  takes the question word as a guide (Wer, Wo, Wann, Wie viele) and finds
  the sentence with the answer; lesson 2 reads short Sachtexte about
  animals, sorts what the text says from what it does not say, records
  facts in gaps, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.comprehension.read-precisely]
  also_practises: [lit-de.comprehension.read-precisely]
  vocabulary: { de: [Fragewort, Sachtext, Textstelle, steht im Text] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: who-where-when, what: { de: "Namen, Orte und Zeiten finden (Wer? Wo? Wann?)", en: "finding names, places and times (who, where, when)" } }
    - { id: numbers-details, what: { de: "Zahlen und Einzelheiten finden (Wie viele? Was? Womit?)", en: "finding numbers and details (how many, what, with what)" } }
    - { id: in-the-text, what: { de: "prüfen, ob etwas im Text steht", en: checking whether the text says something } }
  misconceptions:
    - id: own-knowledge
      what: Answers from what they already know instead of from the text (Igel trinken Milch, Frösche sind grün, Kaulquappen for the eggs)
      addressed: "lesson 2 Learn sets Milch against the text; every sorting task in lesson 2 (l2-f3, l2-s3, l2-n3, l2-c3, l2-c15) has true facts that the text does not say; l2-c2 offers Kaulquappen"
    - id: wrong-place
      what: Takes a word from the text that sits near the answer but answers another question (Milas Eis for Opas, rot for the colour of the spots)
      addressed: "lesson 1 Learn shows Erdbeere and Schokolade; l1-f1, l1-s1, l1-n1 and l2-s1 offer a word from the wrong sentence; l1-f1 gives feedback on it; in the checks l1-c4, l2-c7, l2-c8, l2-c10, l2-c13, l2-c16 and l2-c20 offer one too"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Die Antwort steht im Text", en: "The answer is in the text" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: true_false
            text: "Kann das sein? Der Hund liest ein Buch."
            say: "Lies den Satz genau. Kann das so sein?"
            answer: false
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf das Wort, das nicht passt."
            say: "Lies den Satz genau. Ein Wort passt nicht. Tippe darauf."
            show: { drawn: letter-card, text: "Ich ziehe im Winter meine dicke Banane an." }
            spans: ["Banane"]
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Mila und ihr Opa gehen in den Park.\nSie füttern die Enten am Teich.\nDanach essen sie ein Eis.\nMila nimmt Erdbeere, Opa nimmt Schokolade."
            say: "Lies die Geschichte. Gleich kommen Fragen dazu. Die Antworten stehen alle im Text."
          - text: "Welches Eis nimmt Opa?\n\nMila nimmt Erdbeere, Opa nimmt Schokolade."
            say: "Lies zuerst die Frage. Sie fragt nach Opa. Such im Text das Wort Opa. Dort steht: Opa nimmt Schokolade. Pass auf: Erdbeere steht auch im Text, aber das ist Milas Eis."
          - text: "Wer? ein Name | Wo? ein Ort | Wann? eine Zeit | Wie viele? eine Zahl"
            say: "Das Fragewort hilft dir. Fragt jemand Wer, suchst du einen Namen. Bei Wo suchst du einen Ort, bei Wann eine Zeit, bei Wie viele eine Zahl."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Paul hat einen Hund.\nDer Hund heißt Bruno.\nBruno ist braun und hat lange Ohren.\nJeden Morgen geht Paul mit Bruno in den Wald.\n\nWie heißt der Hund?"
                say: "Lies den Text und die Frage. Wie heißt der Hund?"
                options: ["Bruno", "Paul", "Bello"]
                answer: "Bruno"
                feedback:
                  "Paul": "Paul ist der Junge. Lies den zweiten Satz noch einmal."
                hints:
                  - "Die Frage fragt nach einem Namen. Welcher Satz sagt, wie der Hund heißt?"
                  - "Lies den zweiten Satz: Der Hund heißt ..."
                  - "Der Hund heißt Bruno."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Paul hat einen Hund.\nDer Hund heißt Bruno.\nBruno ist braun und hat lange Ohren.\nJeden Morgen geht Paul mit Bruno in den Wald.\n\nWelche Farbe hat Bruno?"
                say: "Lies den Text und die Frage. Welche Farbe hat Bruno?"
                options: ["braun", "schwarz", "weiß"]
                answer: "braun"
                hints:
                  - "Such im Text ein Farbwort."
                  - "Lies den dritten Satz."
                  - "Bruno ist braun."
              - id: l1-f3
                type: true_false
                text: "Paul hat einen Hund.\nDer Hund heißt Bruno.\nBruno ist braun und hat lange Ohren.\nJeden Morgen geht Paul mit Bruno in den Wald.\n\nSteht das im Text? Paul geht am Abend mit Bruno in den Wald."
                say: "Lies den Text. Steht das so im Text?"
                answer: false
                hints:
                  - "Such im Text das Wort Wald. Wann gehen sie dorthin?"
                  - "Im letzten Satz steht: Jeden Morgen."
                  - "Nein. Sie gehen am Morgen, nicht am Abend."
              - id: l1-f4
                type: highlight_in_text
                text: "Wohin geht Paul mit Bruno? Tippe auf das Wort."
                say: "Lies den Text. Wohin geht Paul mit Bruno? Tippe auf das Wort, das es sagt."
                show: { drawn: letter-card, text: "Bruno ist braun und hat lange Ohren. Jeden Morgen geht Paul mit Bruno in den Wald." }
                spans: ["Wald."]
                hints:
                  - "Wohin fragt nach einem Ort."
                  - "Lies den Satz mit geht. Wohin geht Paul?"
                  - "Tippe auf Wald."
              - id: l1-f5
                type: fill_in_blank
                text: "Paul hat einen Hund.\nDer Hund heißt Bruno.\nBruno ist braun und hat lange Ohren.\n\nWas ist an Bruno lang? Füll die Lücke."
                say: "Lies den Text. Was ist an Bruno lang? Füll die Lücke."
                frame: "Bruno hat lange _."
                options: ["Ohren", "Beine", "Haare"]
                answer: ["Ohren"]
                hints:
                  - "Such im Text das Wort lange."
                  - "Lies den dritten Satz bis zum Ende."
                  - "Bruno hat lange Ohren."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Heute ist Sportfest.\nLina läuft beim Wettlauf mit.\nSie wird Zweite.\nIhr Freund Can wird Erster.\nAm Ende bekommen alle Kinder eine Urkunde.\n\nWer wird Erster?"
                say: "Lies den Text und die Frage. Wer wird Erster?"
                options: ["Can", "Lina", "alle Kinder"]
                answer: "Can"
                hints: ["Such im Text das Wort Erster."]
              - id: l1-s2
                type: multiple_choice
                text: "Heute ist Sportfest.\nLina läuft beim Wettlauf mit.\nSie wird Zweite.\nIhr Freund Can wird Erster.\n\nWelchen Platz macht Lina?"
                say: "Lies den Text und die Frage. Welchen Platz macht Lina?"
                options: ["den zweiten Platz", "den ersten Platz", "den dritten Platz"]
                answer: "den zweiten Platz"
                hints: ["Lies den dritten Satz. Mit „Sie“ ist Lina gemeint."]
              - id: l1-s3
                type: true_false
                text: "Heute ist Sportfest.\nLina läuft beim Wettlauf mit.\nAm Ende bekommen alle Kinder eine Urkunde.\n\nSteht das im Text? Alle Kinder bekommen eine Urkunde."
                say: "Lies den Text. Steht das so im Text?"
                answer: true
                hints: ["Lies den letzten Satz."]
              - id: l1-s4
                type: highlight_in_text
                text: "Was bekommen alle Kinder? Tippe auf das Wort."
                say: "Lies den Text. Was bekommen alle Kinder am Ende? Tippe auf das Wort."
                show: { drawn: letter-card, text: "Can wird Erster. Am Ende bekommen alle Kinder eine Urkunde." }
                spans: ["Urkunde."]
                hints: ["Such das Wort bekommen. Was steht danach?"]
              - id: l1-s5
                type: multiple_choice
                text: "Heute ist Sportfest.\nLina läuft beim Wettlauf mit.\nSie wird Zweite.\n\nWas ist heute?"
                say: "Lies den Text und die Frage. Was ist heute?"
                options: ["Sportfest", "Geburtstag", "Schwimmfest"]
                answer: "Sportfest"
                hints: ["Lies den ersten Satz."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Am Samstag backen Emma und Mama einen Kuchen.\nSie brauchen sechs Äpfel.\nNach einer Stunde ist der Kuchen fertig.\nEmmas Bruder Max isst das erste Stück.\n\nWer isst das erste Stück?"
                say: "Lies den Text und die Frage. Wer isst das erste Stück?"
                options: ["Max", "Emma", "Mama"]
                answer: "Max"
              - id: l1-n2
                type: multiple_choice
                text: "Am Samstag backen Emma und Mama einen Kuchen.\nSie brauchen sechs Äpfel.\nNach einer Stunde ist der Kuchen fertig.\n\nWie viele Äpfel brauchen sie?"
                say: "Lies den Text und die Frage. Wie viele Äpfel brauchen sie?"
                options: ["sechs", "eins", "zwei"]
                answer: "sechs"
              - id: l1-n3
                type: true_false
                text: "Am Samstag backen Emma und Mama einen Kuchen.\nSie brauchen sechs Äpfel.\n\nSteht das im Text? Emma und Mama backen am Sonntag."
                say: "Lies den Text. Steht das so im Text?"
                answer: false
              - id: l1-n4
                type: highlight_in_text
                text: "Wann backen sie? Tippe auf das Wort."
                say: "Lies den Text. Wann backen Emma und Mama? Tippe auf das Wort."
                show: { drawn: letter-card, text: "Am Samstag backen Emma und Mama einen Kuchen. Sie brauchen sechs Äpfel." }
                spans: ["Samstag"]
              - id: l1-n5
                type: multiple_choice
                text: "Am Samstag backen Emma und Mama einen Kuchen.\nSie brauchen sechs Äpfel.\nNach einer Stunde ist der Kuchen fertig.\n\nWann ist der Kuchen fertig?"
                say: "Lies den Text und die Frage. Wann ist der Kuchen fertig?"
                options: ["nach einer Stunde", "nach sechs Stunden", "am Sonntag"]
                answer: "nach einer Stunde"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Ali wohnt in einem hohen Haus.\nEr wohnt ganz oben im fünften Stock.\nVon seinem Fenster sieht er den Fluss.\n\nIn welchem Stock wohnt Ali?"
            say: "Lies den Text und die Frage. In welchem Stock wohnt Ali?"
            options: ["im fünften Stock", "im ersten Stock", "ganz unten"]
            answer: "im fünften Stock"
          - id: l1-c2
            type: true_false
            text: "Ali wohnt in einem hohen Haus.\nEr wohnt ganz oben im fünften Stock.\nVon seinem Fenster sieht er den Fluss.\n\nSteht das im Text? Ali sieht von seinem Fenster einen Berg."
            say: "Lies den Text. Steht das so im Text?"
            answer: false
          - id: l1-c3
            type: multiple_choice
            text: "Ali wohnt in einem hohen Haus.\nEr wohnt ganz oben im fünften Stock.\nVon seinem Fenster sieht er den Fluss.\n\nWas sieht Ali von seinem Fenster?"
            say: "Lies den Text und die Frage. Was sieht Ali von seinem Fenster?"
            options: ["den Fluss", "den Park", "die Schule"]
            answer: "den Fluss"
          - id: l1-c4
            type: multiple_choice
            text: "Nele hat eine kleine Schwester.\nIhre Schwester heißt Ida.\nIda ist drei Jahre alt.\nAm Sonntag gehen die beiden mit Papa auf den Spielplatz.\n\nWie heißt Neles Schwester?"
            say: "Lies den Text und die Frage. Wie heißt Neles Schwester?"
            options: ["Ida", "Nele", "Lisa"]
            answer: "Ida"
          - id: l1-c5
            type: true_false
            text: "Nele hat eine kleine Schwester.\nIhre Schwester heißt Ida.\nIda ist drei Jahre alt.\n\nSteht das im Text? Ida ist drei Jahre alt."
            say: "Lies den Text. Steht das so im Text?"
            answer: true
          - id: l1-c6
            type: highlight_in_text
            text: "Wann gehen Nele und Ida auf den Spielplatz? Tippe auf das Wort."
            say: "Lies den Text. Wann gehen Nele und Ida auf den Spielplatz? Tippe auf das Wort."
            show: { drawn: letter-card, text: "Ida ist drei Jahre alt. Am Sonntag gehen Nele und Ida mit Papa auf den Spielplatz." }
            spans: ["Sonntag"]

  - n: 2
    title: { de: "Informationen in Sachtexten", en: "Information in non-fiction" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Kim hat eine Katze.\nDie Katze heißt Mausi.\nSie schläft gern in der Sonne.\n\nWie heißt die Katze?"
            say: "Lies den Text und die Frage. Wie heißt die Katze?"
            options: ["Mausi", "Kim", "Sonne"]
            answer: "Mausi"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Kim hat eine Katze.\nSie schläft gern in der Sonne.\n\nSteht das im Text? Die Katze schläft gern im Keller."
            say: "Lies den Text. Steht das so im Text?"
            answer: false
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Igel\nDer Igel hat viele Stacheln.\nEr frisst Käfer, Würmer und Schnecken.\nIm Winter schläft er unter einem Laubhaufen."
            say: "Das ist ein Sachtext. Er erklärt etwas über ein Tier. Auch hier stehen die Antworten im Text."
          - text: "Was frisst der Igel?\n\nEr frisst Käfer, Würmer und Schnecken."
            say: "Vielleicht denkst du: Igel trinken Milch. Aber das steht nicht im Text, und es stimmt auch nicht. Antworte nur mit dem, was im Text steht."
          - text: "steht im Text | steht nicht im Text"
            say: "Manche Fragen kann der Text nicht beantworten. Wie alt wird ein Igel? Davon steht hier nichts. Dann sagst du: Das steht nicht im Text."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Das Eichhörnchen\nDas Eichhörnchen hat einen buschigen Schwanz.\nEs wohnt in einem Nest hoch im Baum.\nDas Nest heißt Kobel.\nIm Herbst versteckt es Nüsse in der Erde.\n\nWie heißt das Nest des Eichhörnchens?"
                say: "Lies den Text und die Frage. Wie heißt das Nest des Eichhörnchens?"
                options: ["Kobel", "Bau", "Höhle"]
                answer: "Kobel"
                hints:
                  - "Such im Text das Wort Nest."
                  - "Lies den Satz, der mit Das Nest anfängt."
                  - "Das Nest heißt Kobel."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Das Eichhörnchen\nDas Eichhörnchen hat einen buschigen Schwanz.\nEs wohnt in einem Nest hoch im Baum.\nDas Nest heißt Kobel.\nIm Herbst versteckt es Nüsse in der Erde.\n\nWas macht das Eichhörnchen im Herbst?"
                say: "Lies den Text und die Frage. Was macht das Eichhörnchen im Herbst?"
                options: ["Es versteckt Nüsse.", "Es schläft im Laub.", "Es baut ein Nest."]
                answer: "Es versteckt Nüsse."
                hints:
                  - "Such im Text das Wort Herbst."
                  - "Lies den letzten Satz."
                  - "Im Herbst versteckt es Nüsse."
              - id: l2-f3
                type: sorting
                text: "Das Eichhörnchen\nDas Eichhörnchen hat einen buschigen Schwanz.\nEs wohnt in einem Nest hoch im Baum.\nIm Herbst versteckt es Nüsse in der Erde.\n\nSteht das im Text?"
                say: "Lies den Text. Sortiere die Sätze: Steht das im Text oder nicht?"
                bins:
                  - { id: ja, show: { text: "steht im Text" }, say: "steht im Text" }
                  - { id: nein, show: { text: "steht nicht im Text" }, say: "steht nicht im Text" }
                options:
                  - { text: "Es hat einen buschigen Schwanz.", bin: ja }
                  - { text: "Es wohnt hoch im Baum.", bin: ja }
                  - { text: "Es hat ein rotes Fell.", bin: nein }
                  - { text: "Es frisst gern Pilze.", bin: nein }
                hints:
                  - "Such jeden Satz im Text. Findest du ihn?"
                  - "Viele Eichhörnchen sind rot. Aber steht das hier im Text?"
                  - "Im Text: Schwanz und Baum. Nicht im Text: rotes Fell und Pilze."
              - id: l2-f4
                type: true_false
                text: "Das Eichhörnchen\nEs wohnt in einem Nest hoch im Baum.\nIm Herbst versteckt es Nüsse in der Erde.\n\nSteht das im Text? Das Eichhörnchen versteckt Nüsse in der Erde."
                say: "Lies den Text. Steht das so im Text?"
                answer: true
                hints:
                  - "Such im Text das Wort Nüsse."
                  - "Lies den Satz mit Nüsse bis zum Ende."
                  - "Ja, das steht im Text."
              - id: l2-f5
                type: highlight_in_text
                text: "Wann versteckt es Nüsse? Tippe auf das Wort."
                say: "Lies den Text. Wann versteckt das Eichhörnchen Nüsse? Tippe auf das Wort."
                show: { drawn: letter-card, text: "Das Eichhörnchen wohnt hoch im Baum. Im Herbst versteckt es Nüsse in der Erde." }
                spans: ["Herbst"]
                hints:
                  - "Wann fragt nach einer Zeit."
                  - "Such eine Jahreszeit."
                  - "Tippe auf Herbst."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Marienkäfer\nDer Marienkäfer ist ein kleiner Käfer.\nEr ist rot und hat schwarze Punkte.\nEr kann fliegen.\nEr frisst Blattläuse.\n\nWelche Farbe haben die Punkte?"
                say: "Lies den Text und die Frage. Welche Farbe haben die Punkte?"
                options: ["schwarz", "rot", "gelb"]
                answer: "schwarz"
                hints: ["Rot ist der Käfer. Welches Farbwort steht vor Punkte?"]
              - id: l2-s2
                type: multiple_choice
                text: "Der Marienkäfer\nDer Marienkäfer ist ein kleiner Käfer.\nEr ist rot und hat schwarze Punkte.\nEr frisst Blattläuse.\n\nWas frisst der Marienkäfer?"
                say: "Lies den Text und die Frage. Was frisst der Marienkäfer?"
                options: ["Blattläuse", "Blätter", "Blumen"]
                answer: "Blattläuse"
                hints: ["Such im Text das Wort frisst."]
              - id: l2-s3
                type: sorting
                text: "Der Marienkäfer\nDer Marienkäfer ist ein kleiner Käfer.\nEr ist rot und hat schwarze Punkte.\nEr kann fliegen.\n\nSteht das im Text?"
                say: "Lies den Text. Sortiere die Sätze: Steht das im Text oder nicht?"
                bins:
                  - { id: ja, show: { text: "steht im Text" }, say: "steht im Text" }
                  - { id: nein, show: { text: "steht nicht im Text" }, say: "steht nicht im Text" }
                options:
                  - { text: "Er kann fliegen.", bin: ja }
                  - { text: "Er ist rot.", bin: ja }
                  - { text: "Er lebt im Garten.", bin: nein }
                  - { text: "Er hat sechs Beine.", bin: nein }
                hints: ["Ein Käfer hat wirklich sechs Beine. Aber steht das im Text?"]
              - id: l2-s4
                type: true_false
                text: "Der Marienkäfer\nDer Marienkäfer ist ein kleiner Käfer.\nEr ist rot und hat schwarze Punkte.\n\nSteht das im Text? Der Marienkäfer ist ein großer Käfer."
                say: "Lies den Text. Steht das so im Text?"
                answer: false
                hints: ["Lies den ersten Satz genau."]
              - id: l2-s5
                type: fill_in_blank
                text: "Der Marienkäfer\nDer Marienkäfer ist ein kleiner Käfer.\nEr ist rot und hat schwarze Punkte.\n\nFüll die Lücken."
                say: "Lies den Text. Welche Farbe hat der Käfer, welche Farbe haben die Punkte?"
                frame: "Käfer: _   Punkte: _"
                options: ["rot", "schwarz", "gelb"]
                answer: ["rot", "schwarz"]
                hints: ["Lies den zweiten Satz. Das erste Farbwort ist der Käfer."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Der Pinguin\nPinguine sind Vögel.\nSie können nicht fliegen, aber sehr gut schwimmen.\nSie fressen Fische.\nViele Pinguine leben am Südpol. Dort ist es sehr kalt.\n\nWas können Pinguine sehr gut?"
                say: "Lies den Text und die Frage. Was können Pinguine sehr gut?"
                options: ["schwimmen", "fliegen", "klettern"]
                answer: "schwimmen"
              - id: l2-n2
                type: multiple_choice
                text: "Der Pinguin\nPinguine sind Vögel.\nSie fressen Fische.\nViele Pinguine leben am Südpol. Dort ist es sehr kalt.\n\nWo leben viele Pinguine?"
                say: "Lies den Text und die Frage. Wo leben viele Pinguine?"
                options: ["am Südpol", "im Wald", "in der Wüste"]
                answer: "am Südpol"
              - id: l2-n3
                type: sorting
                text: "Der Pinguin\nPinguine sind Vögel.\nSie können nicht fliegen, aber sehr gut schwimmen.\nSie fressen Fische.\n\nSteht das im Text?"
                say: "Lies den Text. Sortiere die Sätze: Steht das im Text oder nicht?"
                bins:
                  - { id: ja, show: { text: "steht im Text" }, say: "steht im Text" }
                  - { id: nein, show: { text: "steht nicht im Text" }, say: "steht nicht im Text" }
                options:
                  - { text: "Sie sind Vögel.", bin: ja }
                  - { text: "Sie fressen Fische.", bin: ja }
                  - { text: "Sie sind schwarz und weiß.", bin: nein }
                  - { text: "Sie legen Eier.", bin: nein }
              - id: l2-n4
                type: true_false
                text: "Der Pinguin\nPinguine sind Vögel.\nSie können nicht fliegen, aber sehr gut schwimmen.\n\nSteht das im Text? Pinguine können fliegen."
                say: "Lies den Text. Steht das so im Text?"
                answer: false
              - id: l2-n5
                type: fill_in_blank
                text: "Der Pinguin\nPinguine sind Vögel.\nSie fressen Fische.\n\nFüll die Lücke."
                say: "Lies den Text. Was fressen Pinguine? Füll die Lücke."
                frame: "Pinguine fressen _."
                options: ["Fische", "Nüsse", "Gras"]
                answer: ["Fische"]

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: numbers-details
            type: multiple_choice
            text: "Der Frosch\nDer Frosch lebt am Teich.\nEr hat lange Beine und kann weit springen.\nEr fängt Fliegen mit seiner langen Zunge.\nIm Frühling legt er viele Eier ins Wasser.\nDie Eier heißen Laich.\n\nWomit fängt der Frosch Fliegen?"
            say: "Lies den Text und die Frage. Womit fängt der Frosch Fliegen?"
