# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.skim
skill: lit-de.comprehension.skim
curriculum: de-DE
language: de
title:
  de: Texte überfliegen
  en: Skimming texts
summary: >
  Skimming: seeing quickly what a text is about. Lesson 1 looks at the
  heading and the picture first, names the topic of the whole text (not a
  detail from one sentence) and picks a heading or picture that fits;
  lesson 2 uses paragraphs with small headings to find the one paragraph
  that answers a question, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Texte verstehen, en: Understanding texts }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.comprehension.headings, lit-de.comprehension.find-information]
  also_practises: [lit-de.comprehension.headings, lit-de.comprehension.find-information]
  vocabulary: { de: [überfliegen, Überschrift, Absatz, Thema] }
  forms: [text, audio, picture]
  drawn: []
  facets: []
  parts:
    - { id: topic, what: { de: "erkennen, worum es in einem ganzen Text geht", en: seeing what a whole text is about } }
    - { id: heading-picture, what: { de: eine passende Überschrift oder ein passendes Bild finden, en: choosing a heading or a picture that fits } }
    - { id: paragraph, what: { de: mit kleinen Überschriften den passenden Absatz finden, en: finding the right paragraph by its subheading } }
    - { id: in-paragraph, what: { de: "im passenden Absatz nachlesen, was dort steht", en: reading the right paragraph to see what it says } }
  misconceptions:
    - id: detail-as-topic
      what: Names a detail from one sentence as what the whole text is about (um den Winter for a text about the hedgehog)
      addressed: "lesson 1 Learn sets der Fuchs against die Nacht; every \"Worum geht es?\" task offers a word from one sentence (l1-f1, l1-s1, l1-n1, l1-c1, l2-c1), with feedback on l1-f1; l2-s5 and l2-n5 set a paragraph heading against a heading for the whole text"
    - id: read-all-not-paragraph
      what: Reads the whole text from the top instead of using the small headings to go to the right paragraph, and then takes an answer from the wrong paragraph
      addressed: "lesson 2 Learn goes straight to the paragraph Futter; \"Welchen Absatz liest du?\" in every stage of lesson 2 (l2-f1, l2-s1, l2-n1, l2-c2), with feedback on l2-f1; l2-f4 and l2-n3 ask whether a paragraph holds something it does not"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Worum geht es?", en: "What is it about?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Tom hat einen Hund.\nDer Hund heißt Flocke.\nEr ist ganz weiß.\n\nWelche Überschrift passt?"
            say: "Lies den Text. Welche Überschrift passt?"
            options: ["Toms Hund", "Im Schwimmbad", "Der Winter"]
            answer: "Toms Hund"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Die Sonne scheint.\nLars spielt im Garten.\n\nWo spielt Lars?"
            say: "Lies den Text und die Frage. Wo spielt Lars?"
            options: ["im Garten", "im Haus", "in der Schule"]
            answer: "im Garten"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Der Fuchs\nDer Fuchs hat ein rotes Fell und einen buschigen Schwanz.\nEr lebt im Wald in einem Bau.\nIn der Nacht geht er auf die Jagd."
            say: "Bevor du einen Text liest, schau zuerst auf die Überschrift und das Bild. Hier steht: Der Fuchs. Auf dem Bild ist ein Fuchs. Jetzt weißt du schon: Der Text erklärt etwas über den Fuchs."
            show: { object: fox }
          - text: "Überschrift lesen\nBild ansehen\nschnell über den Text schauen"
            say: "Das heißt überfliegen. Du liest nicht jedes Wort. Du schaust schnell, worum es geht."
          - text: "Worum geht es? Um den Fuchs.\nNicht: um die Nacht."
            say: "Pass auf: Im Text steht auch Nacht. Aber der Text handelt nicht von der Nacht. Das Thema ist das, worüber der ganze Text spricht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Igel\nDer Igel hat viele Stacheln.\nEr frisst Käfer und Würmer.\nIm Winter schläft er.\n\nWorum geht es in dem Text?"
                say: "Überflieg den Text. Schau auf die Überschrift und das Bild. Worum geht es?"
                show: { object: hedgehog }
                options: ["um den Igel", "um den Winter", "um Käfer"]
                answer: "um den Igel"
                feedback:
                  "um den Winter": "„Winter“ steht nur in einem Satz. Schau auf die Überschrift."
                  "um Käfer": "„Käfer“ steht nur in einem Satz. Schau auf die Überschrift."
                hints:
                  - "Lies zuerst die Überschrift. Schau dann auf das Bild."
                  - "„Winter“ und „Käfer“ stehen nur in einem Satz. Worüber spricht der ganze Text?"
                  - "Es geht um den Igel."
                difficulty: easy
              - id: l1-f2
                type: image_multiple_choice
                text: "Mein Drachen\nIm Herbst ist es oft windig.\nDann lasse ich meinen Drachen steigen.\nEr fliegt hoch über die Wiese.\n\nWelches Bild passt zum Text?"
                say: "Überflieg den Text. Welches Bild passt dazu?"
                options: [{ object: kite }, { object: bike }, { object: ball }]
                answer: kite
                hints:
                  - "Lies die Überschrift."
                  - "Die Überschrift heißt: Mein Drachen."
                  - "Tippe auf den Drachen."
              - id: l1-f3
                type: multiple_choice
                text: "Wir bauen eine Sandburg.\nDann holen wir Wasser aus dem Meer.\nDie Wellen sind hoch.\n\nWelche Überschrift passt?"
                say: "Überflieg den Text. Welche Überschrift passt?"
                options: ["Ein Tag am Strand", "Im Wald", "Mein Zimmer"]
                answer: "Ein Tag am Strand"
                hints:
                  - "Such schnell ein paar wichtige Wörter: Sandburg, Meer, Wellen."
                  - "Wo gibt es Sand, Meer und Wellen?"
                  - "Ein Tag am Strand."
              - id: l1-f4
                type: true_false
                text: "Die Schnecke\nDie Schnecke trägt ihr Haus auf dem Rücken.\nSie kriecht ganz langsam.\n\nGeht es in dem Text um einen Hund?"
                say: "Schau auf die Überschrift und das Bild. Geht es in dem Text um einen Hund?"
                show: { object: snail }
                answer: false
                hints:
                  - "Lies nur die Überschrift."
                  - "Die Überschrift heißt: Die Schnecke. Auf dem Bild ist auch eine Schnecke."
                  - "Nein, es geht um die Schnecke."
              - id: l1-f5
                type: sorting
                text: "Hier sind Überschriften. Sortiere: Tiere oder Wetter?"
                say: "Lies die Überschriften. Geht es um Tiere oder um das Wetter?"
                bins:
                  - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
                  - { id: wetter, show: { text: "Wetter" }, say: "Wetter" }
                options:
                  - { text: "Der Fuchs im Wald", bin: tiere }
                  - { text: "Wenn es gewittert", bin: wetter }
                  - { text: "Die Katze und ihre Jungen", bin: tiere }
                  - { text: "Schnee im Winter", bin: wetter }
                hints:
                  - "Lies jede Überschrift. Welches Wort ist das wichtigste?"
                  - "Fuchs und Katze sind Tiere. Gewitter und Schnee sind Wetter."
                  - "Tiere: Fuchs, Katze. Wetter: Gewitter, Schnee."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Die Biene\nBienen fliegen von Blume zu Blume.\nSie sammeln Nektar.\nDaraus machen sie Honig.\n\nWorum geht es in dem Text?"
                say: "Überflieg den Text. Schau auf die Überschrift und das Bild. Worum geht es?"
                show: { object: bee }
                options: ["um die Biene", "um Blumen", "um ein Honigbrot"]
                answer: "um die Biene"
                hints: ["Worüber spricht der ganze Text, nicht nur ein Satz?"]
              - id: l1-s2
                type: image_multiple_choice
                text: "Der Schneemann\nEs hat die ganze Nacht geschneit.\nWir rollen drei große Kugeln.\nOben kommt eine Möhre als Nase hin.\n\nWelches Bild passt zum Text?"
                say: "Überflieg den Text. Welches Bild passt dazu?"
                options: [{ object: snowman }, { object: sun }, { object: carrot }]
                answer: snowman
                hints: ["Die Möhre ist nur die Nase. Lies die Überschrift."]
              - id: l1-s3
                type: multiple_choice
                text: "Leon bekommt heute Gäste.\nEs gibt Kuchen mit Kerzen.\nAlle singen ein Lied für ihn.\nDann packt er die Geschenke aus.\n\nWelche Überschrift passt?"
                say: "Überflieg den Text. Welche Überschrift passt?"
                options: ["Leons Geburtstag", "Leon ist krank", "Ein Tag im Zoo"]
                answer: "Leons Geburtstag"
                hints: ["Kuchen, Kerzen, Lied, Geschenke: Wann gibt es das alles?"]
              - id: l1-s4
                type: true_false
                text: "Am Teich\nAm Teich ist viel los.\nEnten schwimmen, Frösche quaken und Libellen fliegen.\n\nGeht es in dem Text nur um Enten?"
                say: "Überflieg den Text. Geht es in dem Text nur um Enten?"
                answer: false
                hints: ["Lies die Überschrift. Welche Tiere kommen noch vor?"]
              - id: l1-s5
                type: sorting
                text: "Hier sind Überschriften. Sortiere: Schule oder Ferien?"
                say: "Lies die Überschriften. Geht es um die Schule oder um die Ferien?"
                bins:
                  - { id: schule, show: { text: "Schule" }, say: "Schule" }
                  - { id: ferien, show: { text: "Ferien" }, say: "Ferien" }
                options:
                  - { text: "Mein erster Schultag", bin: schule }
                  - { text: "Am Meer mit Oma", bin: ferien }
                  - { text: "Die Mathestunde", bin: schule }
                  - { text: "Zelten im Sommer", bin: ferien }
                hints: ["Wo bist du, wenn das passiert?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Der Wal\nDer Wal lebt im Meer.\nEr ist sehr groß.\nZum Atmen schwimmt er nach oben.\n\nWorum geht es in dem Text?"
                say: "Überflieg den Text. Schau auf die Überschrift und das Bild. Worum geht es?"
                show: { object: whale }
                options: ["um den Wal", "ums Atmen", "um das Meer"]
                answer: "um den Wal"
              - id: l1-n2
                type: image_multiple_choice
                text: "Lecker!\nWir rühren Mehl, Eier und Zucker zusammen.\nDann kommt alles in den Ofen.\nBald duftet die ganze Küche.\n\nWelches Bild passt zum Text?"
                say: "Überflieg den Text. Welches Bild passt dazu?"
                options: [{ object: cake }, { object: ice-cream }, { object: milk }]
                answer: cake
              - id: l1-n3
                type: multiple_choice
                text: "Draußen ist es dunkel.\nDer Himmel ist grau.\nEs blitzt und donnert.\nWir bleiben lieber im Haus.\n\nWelche Überschrift passt?"
                say: "Überflieg den Text. Welche Überschrift passt?"
                options: ["Ein Gewitter", "Ein Sonnentag", "Im Garten"]
                answer: "Ein Gewitter"
              - id: l1-n4
                type: true_false
                text: "Mein Fahrrad\nIch habe ein rotes Fahrrad.\nMit ihm fahre ich zur Schule.\n\nGeht es in dem Text um die Schule?"
                say: "Überflieg den Text. Geht es in dem Text um die Schule?"
                show: { object: bike }
                answer: false
              - id: l1-n5
                type: sorting
                text: "Hier sind Überschriften. Sortiere: Tiere oder Essen?"
                say: "Lies die Überschriften. Geht es um Tiere oder um Essen?"
                bins:
                  - { id: tiere, show: { text: "Tiere" }, say: "Tiere" }
                  - { id: essen, show: { text: "Essen" }, say: "Essen" }
                options:
                  - { text: "Der Hase im Garten", bin: tiere }
                  - { text: "Nudeln mit Soße", bin: essen }
                  - { text: "Das Pferd auf der Weide", bin: tiere }
                  - { text: "Obstsalat für alle", bin: essen }

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Die Giraffe\nDie Giraffe hat einen sehr langen Hals.\nSo kommt sie an die Blätter hoch oben im Baum.\n\nWorum geht es in dem Text?"
            say: "Überflieg den Text. Schau auf die Überschrift und das Bild. Worum geht es?"
            show: { object: giraffe }
            options: ["um die Giraffe", "um Bäume", "um Blätter"]
            answer: "um die Giraffe"
          - id: l1-c2
            type: multiple_choice
            text: "Ich ziehe meine Badehose an.\nDann springe ich ins Becken.\nDas Wasser ist kalt.\n\nWelche Überschrift passt?"
            say: "Überflieg den Text. Welche Überschrift passt?"
            options: ["Im Schwimmbad", "Im Kino", "Beim Bäcker"]
            answer: "Im Schwimmbad"
          - id: l1-c3
            type: image_multiple_choice
            text: "Beim Bäcker\nIch kaufe ein frisches Brot.\nEs ist noch warm.\n\nWelches Bild passt zum Text?"
            say: "Überflieg den Text. Welches Bild passt dazu?"
            options: [{ object: bread }, { object: boat }, { object: book }]
            answer: bread
          - id: l1-c4
            type: multiple_choice
            text: "Der Löwe\nDer Löwe hat eine große Mähne.\nEr lebt in Afrika.\nAm Tag liegt er oft im Schatten.\n\nWorum geht es in dem Text?"
            say: "Überflieg den Text. Schau auf die Überschrift und das Bild. Worum geht es?"
            show: { object: lion }
            options: ["um den Löwen", "um Afrika", "um den Schatten"]
            answer: "um den Löwen"
          - id: l1-c5
            type: true_false
            text: "Mein Zimmer\nIn meinem Zimmer steht ein Bett.\nAm Fenster ist mein Schreibtisch.\nAuf dem Regal sitzt mein Teddy.\n\nErzählt der Text, wie ein Zimmer aussieht?"
            say: "Überflieg den Text. Erzählt der Text, wie ein Zimmer aussieht?"
            answer: true
          - id: l1-c6
            type: sorting
            text: "Hier sind Überschriften. Sortiere: Sport oder Essen?"
            say: "Lies die Überschriften. Geht es um Sport oder um Essen?"
            bins:
              - { id: sport, show: { text: "Sport" }, say: "Sport" }
              - { id: essen, show: { text: "Essen" }, say: "Essen" }
            options:
              - { text: "Unser Fußballspiel", bin: sport }
              - { text: "Pizza backen", bin: essen }
              - { text: "Ich lerne schwimmen", bin: sport }
              - { text: "Suppe bei Oma", bin: essen }

  - n: 2
    title: { de: "Absätze und kleine Überschriften", en: "Paragraphs and subheadings" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Es ist kalt.\nÜberall liegt Schnee.\nWir fahren Schlitten.\n\nWelche Überschrift passt?"
            say: "Überflieg den Text. Welche Überschrift passt?"
            options: ["Im Winter", "Im Sommer", "Am Strand"]
            answer: "Im Winter"
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Der Marienkäfer\nEr ist rot und hat schwarze Punkte.\nEr frisst Blattläuse.\n\nWorum geht es in dem Text?"
            say: "Überflieg den Text. Worum geht es?"
            options: ["um den Marienkäfer", "um Punkte", "um Blattläuse"]
            answer: "um den Marienkäfer"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Das Pferd\n\nAussehen\nPferde haben ein Fell und eine lange Mähne.\n\nFutter\nPferde fressen Gras, Heu und Hafer.\n\nWohnen\nPferde leben auf der Weide und im Stall."
            say: "Dieser Text hat drei Absätze. Jeder Absatz hat eine kleine Überschrift. Sie sagt dir, worum es in dem Absatz geht."
          - text: "Was fressen Pferde?\n\nFutter\nPferde fressen Gras, Heu und Hafer."
            say: "Willst du wissen, was Pferde fressen, liest du nicht den ganzen Text. Du überfliegst die kleinen Überschriften und liest nur den Absatz Futter."
          - text: "1. kleine Überschriften überfliegen\n2. den passenden Absatz genau lesen"
            say: "So findest du schnell, was du suchst: Erst die kleinen Überschriften überfliegen. Dann nur den passenden Absatz genau lesen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Die Katze\n\nAussehen\nKatzen haben ein weiches Fell und lange Schnurrhaare.\n\nFutter\nKatzen fressen Fleisch und Fisch.\n\nSchlafen\nKatzen schlafen bis zu sechzehn Stunden am Tag.\n\nDu willst wissen, was Katzen fressen. Welchen Absatz liest du?"
                say: "Überflieg die kleinen Überschriften. Welchen Absatz liest du?"
                options: ["Futter", "Aussehen", "Schlafen"]
                answer: "Futter"
                feedback:
                  "Aussehen": "Im Absatz „Aussehen“ steht, wie Katzen aussehen. Welche Überschrift passt zu „fressen“?"
                hints:
                  - "Lies nur die kleinen Überschriften."
                  - "Was man frisst, ist das Futter."
                  - "Lies den Absatz „Futter“."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Die Katze\n\nAussehen\nKatzen haben ein weiches Fell und lange Schnurrhaare.\n\nFutter\nKatzen fressen Fleisch und Fisch.\n\nSchlafen\nKatzen schlafen bis zu sechzehn Stunden am Tag.\n\nWie lange schlafen Katzen?"
                say: "Überflieg die kleinen Überschriften. Lies dann den passenden Absatz. Wie lange schlafen Katzen?"
                options: ["bis zu sechzehn Stunden am Tag", "bis zu sechs Stunden am Tag", "nur in der Nacht"]
                answer: "bis zu sechzehn Stunden am Tag"
                hints:
                  - "Welche kleine Überschrift passt zu „schlafen“?"
                  - "Lies den Absatz „Schlafen“ genau."
                  - "Bis zu sechzehn Stunden am Tag."
              - id: l2-f3
                type: multiple_choice
                text: "Die Katze\n\nAussehen\nKatzen haben ein weiches Fell.\n\nFutter\nKatzen fressen Fleisch und Fisch.\n\nSchlafen\nKatzen schlafen sehr viel.\n\nWie viele Absätze hat der Text?"
                say: "Schau auf den Text. Wie viele Absätze hat er?"
                options: ["drei", "einen", "sechs"]
                answer: "drei"
                hints:
                  - "Jeder Absatz hat eine kleine Überschrift."
                  - "Zähl die kleinen Überschriften, nicht die Zeilen."
                  - "Es sind drei Absätze."
              - id: l2-f4
                type: true_false
                text: "Die Katze\n\nAussehen\nKatzen haben ein weiches Fell und lange Schnurrhaare.\n\nFutter\nKatzen fressen Fleisch und Fisch.\n\nSteht im Absatz „Aussehen“, was Katzen fressen?"
                say: "Lies die Frage unten. Steht das im Absatz Aussehen?"
                answer: false
                hints:
                  - "Lies nur den Absatz „Aussehen“."
                  - "Da stehen Fell und Schnurrhaare. Über Futter steht da nichts."
                  - "Nein. Das steht im Absatz „Futter“."
              - id: l2-f5
                type: matching
                text: "Unser Hund: Welcher Satz gehört zu welcher Überschrift?"
                say: "Lies die Sätze. Verbinde jede kleine Überschrift mit dem passenden Satz."
                pairs:
                  - { left: { text: "Aussehen" }, right: { text: "Bello hat braune Flecken." } }
                  - { left: { text: "Futter" }, right: { text: "Er frisst am liebsten Fleisch." } }
                  - { left: { text: "Spielen" }, right: { text: "Er holt gern den Ball." } }
                hints:
                  - "Lies jeden Satz. Worum geht es darin?"
                  - "Flecken sagen, wie Bello aussieht."
                  - "Aussehen: Flecken. Futter: Fleisch. Spielen: Ball."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Der Apfel\n\nWachsen\nÄpfel wachsen an Bäumen.\n\nFarben\nÄpfel können rot, grün oder gelb sein.\n\nEssen\nMan kann Äpfel roh essen oder Apfelkuchen backen.\n\nDu willst wissen, welche Farben Äpfel haben. Welchen Absatz liest du?"
                say: "Überflieg die kleinen Überschriften. Welchen Absatz liest du?"
                options: ["Farben", "Wachsen", "Essen"]
                answer: "Farben"
                hints: ["Lies nur die kleinen Überschriften."]
              - id: l2-s2
                type: multiple_choice
                text: "Der Apfel\n\nWachsen\nÄpfel wachsen an Bäumen.\n\nFarben\nÄpfel können rot, grün oder gelb sein.\n\nWo wachsen Äpfel?"
                say: "Überflieg die kleinen Überschriften. Lies dann den passenden Absatz. Wo wachsen Äpfel?"
                options: ["an Bäumen", "in der Erde", "im Supermarkt"]
                answer: "an Bäumen"
                hints: ["Welche kleine Überschrift passt zu „wachsen“?"]
              - id: l2-s3
                type: true_false
                text: "Der Apfel\n\nFarben\nÄpfel können rot, grün oder gelb sein.\n\nEssen\nMan kann Äpfel roh essen oder Apfelkuchen backen.\n\nSteht im Absatz „Essen“ etwas über Apfelkuchen?"
                say: "Lies die Frage unten. Steht das im Absatz Essen?"
                answer: true
                hints: ["Lies nur den Absatz „Essen“."]
              - id: l2-s4
                type: matching
                text: "Unser Schulfest: Welcher Satz gehört zu welcher Überschrift?"
                say: "Lies die Sätze. Verbinde jede kleine Überschrift mit dem passenden Satz."
                pairs:
                  - { left: { text: "Essen" }, right: { text: "Es gibt Waffeln und Saft." } }
                  - { left: { text: "Spiele" }, right: { text: "Wir machen Sackhüpfen." } }
                  - { left: { text: "Musik" }, right: { text: "Der Chor singt drei Lieder." } }
                hints: ["Waffeln und Saft isst und trinkst du."]
              - id: l2-s5
                type: multiple_choice
                text: "Aussehen\nDer Hase hat lange Ohren.\n\nFutter\nEr frisst Möhren und Kräuter.\n\nWohnen\nEr wohnt in einem Stall im Garten.\n\nWelche Überschrift passt zum ganzen Text?"
                say: "Überflieg den Text. Welche Überschrift passt zum ganzen Text?"
                options: ["Unser Hase", "Futter", "Im Garten"]
                answer: "Unser Hase"
                hints: ["„Futter“ passt nur zu einem Absatz. Worum geht es in allen drei?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Das Fahrrad\n\nTeile\nEin Fahrrad hat zwei Räder, einen Sattel und einen Lenker.\n\nSicherheit\nBeim Fahren trägst du immer einen Helm.\n\nPflege\nDie Kette braucht ab und zu Öl.\n\nDu willst wissen, was du beim Fahren tragen sollst. Welchen Absatz liest du?"
                say: "Überflieg die kleinen Überschriften. Welchen Absatz liest du?"
