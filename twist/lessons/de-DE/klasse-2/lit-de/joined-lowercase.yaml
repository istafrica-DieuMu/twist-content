# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.joined-lowercase
skill: lit-de.handwriting.joined-lowercase
curriculum: de-DE
language: de
title:
  de: Schreibschrift, kleine Buchstaben
  en: Joined script, lowercase letters
summary: >
  Children write the small letters in Schreibschrift and join them, so a
  word is written in one go without lifting the pen. Lesson 1 joins at
  the bottom: most small letters end low and the joining stroke runs up
  into the next letter (im, mein, lila); lesson 2 joins at the top after
  o, w, v and b, sets i-Punkte, Umlaut-Punkte and t-Striche once the word
  is finished, and ends with the skill check. Tracing and copying on
  writing lines teach the joins; choice, sorting and true or false tasks
  check what the child knows about them. No task names one
  Ausgangsschrift: the joins taught (most letters end low, o, w, v and b
  end high) hold for the joined scripts German schools use. The player
  still draws the writing lines in print, so no task says the child can
  see a join; the spoken text describes the movement instead. Writing the
  letters and words themselves is practised in the tracing and copying
  tasks of Practise; the skill check marks what a screen can mark: writing
  a word in one go, where a join starts, and dots and strokes last.
metadata:
  year: klasse-2
  topic: { de: Schreibschrift, en: Joined handwriting }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.handwriting.copy-sentences]
  also_practises: [lit-de.handwriting.print-letters]
  vocabulary: { de: [Schreibschrift, Druckschrift, verbinden, Verbindung, absetzen, Oberlänge, Unterlänge, i-Punkt] }
  forms: [drawn, audio]
  drawn: [writing-lines, letter-card]
  facets: [script]
  parts:
    - { id: one-go, what: { de: ein Wort in einem Zug schreiben, en: writing a word in one go } }
    - { id: join-low, what: { de: die Verbindung unten nach den meisten Buchstaben, en: the join from the bottom after most letters } }
    - { id: join-high, what: { de: "die Verbindung oben nach o, w, v und b", en: "the join from the top after o, w, v and b" } }
    - { id: dots-last, what: { de: "i-Punkte, Umlaut-Punkte und t-Striche zum Schluss", en: "i dots, umlaut dots and t crossbars at the end" } }
  misconceptions:
    - id: lift-after-each-letter
      what: Writes each small letter on its own and lifts the pen after it, as in Druckschrift, so the word falls apart
      addressed: "lesson 1 Learn shows a word written in one go; l1-f2 (with feedback), l1-s1, l1-n4 and l2-c1 ask whether the pen is lifted inside a word"
    - id: join-always-low
      what: Joins every letter at the bottom, also after o, w, v and b, so the o turns into an a and wo looks like wa
      addressed: "lesson 2 Learn shows the high join after o; every stage of lesson 2 asks where the join after o, w, v or b starts (l2-f2 with feedback, l2-s2, l2-n2, l2-c2) and sorts letters by their join (l2-f4, l2-s4, l2-c3)"
    - id: dots-in-the-middle
      what: Stops in the middle of a word to set the i-Punkt or the t-Strich and loses the flow of the word
      addressed: "lesson 2 Learn says dots and strokes come at the end; l2-f5 (with feedback), l2-s5, l2-n5 and l2-c4"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Unten verbunden", en: "Joined at the bottom" }
    goal:
      de: "Verbinde die kleinen Buchstaben unten und schreib ein Wort in einem Zug, so wie mein."
      en: "Join the small letters at the bottom and write a word in one go, like mein."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Was kommt zwischen zwei Wörter?"
            options: ["eine Lücke", "nichts", "ein Punkt"]
            answer: "eine Lücke"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welcher kleine Buchstabe reicht bis unters Dach?"
            say: "Welcher kleine Buchstabe reicht bis unters Dach?"
            options: ["l", "m", "u"]
            answer: "l"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Druckschrift und Schreibschrift"
            say: "Bisher hast du in Druckschrift geschrieben. Da steht jeder Buchstabe für sich. In der Schreibschrift hängen die Buchstaben zusammen. Du schreibst ein ganzes Wort in einem Zug."
            show: { drawn: writing-lines, script: joined, text: "im", mode: copy, arrows: false }
          - text: "i m"
            say: "In der Schreibschrift hört das i unten auf. Von dort führt ein kleiner Bogen nach oben, direkt in das m hinein. Das ist die Verbindung."
            show: { drawn: writing-lines, script: joined, text: "im", mode: trace, arrows: true }
          - text: "mein"
            say: "Bei den meisten kleinen Buchstaben geht die Verbindung unten los. Du hebst den Stift nicht ab, bis das Wort fertig ist. Den i-Punkt setzt du ganz zum Schluss."
            show: { drawn: writing-lines, script: joined, text: "mein", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort im nach. Fang beim grünen Punkt an und heb den Stift erst am Ende ab."
                show: { drawn: writing-lines, script: joined, text: "im", mode: trace, arrows: true }
                char: "im"
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wann hebst du den Stift ab?"
                say: "Du schreibst das Wort um in Schreibschrift. Wann hebst du den Stift ab?"
                show: { drawn: writing-lines, script: joined, text: "um", mode: copy, arrows: false }
                options: ["wenn das Wort fertig ist", "nach jedem Buchstaben"]
                keep_order: true
                answer: "wenn das Wort fertig ist"
                feedback:
                  "nach jedem Buchstaben": "So machst du es in der Druckschrift. In der Schreibschrift hängen die Buchstaben zusammen."
                hints:
                  - "Denk an das Wort im, das du eben nachgefahren hast. Wann war der Stift oben?"
                  - "In der Schreibschrift hängen die Buchstaben zusammen."
                  - "Erst wenn das Wort fertig ist."
              - id: l1-f3
                type: multiple_choice
                text: "Wo hört das kleine u auf?"
                say: "Wo hört das kleine u in der Schreibschrift auf: unten oder oben?"
                show: { drawn: writing-lines, script: joined, text: "u", mode: trace, arrows: true }
                options: ["unten", "oben"]
                keep_order: true
                answer: "unten"
                feedback:
                  oben: "Das u endet unten. Von dort führt ein kleiner Strich nach oben zum nächsten Buchstaben."
                hints:
                  - "Fahr das u in Gedanken nach."
                  - "Der letzte Strich geht nach unten auf die Linie."
                  - "Unten. Von dort geht die Verbindung los."
              - id: l1-f4
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort mein nach. Ein Zug, und den i-Punkt setzt du zum Schluss."
                show: { drawn: writing-lines, script: joined, text: "mein", mode: trace, arrows: true }
                char: "mein"
              - id: l1-f5
                type: true_false
                text: "In der Schreibschrift hängen die Buchstaben eines Wortes zusammen. Stimmt das?"
                say: "In der Schreibschrift hängen die Buchstaben eines Wortes zusammen. Stimmt das?"
                answer: true
                hints:
                  - "Denk an das Wort mein, das du eben geschrieben hast."
                  - "Hast du den Stift zwischen den Buchstaben abgehoben?"
                  - "Ja. Die Buchstaben hängen zusammen."
              - id: l1-f6
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort neun nach. Jeder Buchstabe geht unten in den nächsten über."
                show: { drawn: writing-lines, script: joined, text: "neun", mode: trace, arrows: true }
                char: "neun"

          - support: some
            tasks:
              - id: l1-s1
                type: true_false
                text: "Ben schreibt „nein“ in Schreibschrift. Nach jedem Buchstaben hebt er den Stift ab. Macht Ben das richtig?"
                say: "Ben schreibt nein in Schreibschrift. Nach jedem Buchstaben hebt er den Stift ab. Macht Ben das richtig?"
                answer: false
                hints: ["Wie war das in der Schreibschrift mit dem Abheben?"]
              - id: l1-s2
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort lila nach. Das l reicht bis unters Dach."
                show: { drawn: writing-lines, script: joined, text: "lila", mode: trace, arrows: true }
                char: "lila"
              - id: l1-s3
                type: multiple_choice
                text: "Welcher kleine Buchstabe hat eine Unterlänge? Er reicht in den Keller."
                say: "Welcher kleine Buchstabe reicht in den Keller?"
                options: ["g", "a", "e"]
                answer: "g"
                option_audio: false
                hints: ["Such den Buchstaben mit dem langen Strich nach unten."]
              - id: l1-s4
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib das Wort am ab, in einem Zug."
                show: { drawn: writing-lines, script: joined, text: "am", mode: copy, arrows: false }
                char: "am"
              - id: l1-s5
                type: multiple_choice
                text: "Du schreibst „mein“. Wann setzt du den i-Punkt?"
                say: "Du schreibst das Wort mein. Wann setzt du den i-Punkt?"
                options: ["wenn das Wort fertig ist", "gleich nach dem i"]
                keep_order: true
                answer: "wenn das Wort fertig ist"
                hints: ["Du hebst den Stift erst ab, wenn das Wort fertig ist."]

          - support: none
            tasks:
              - id: l1-n1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib das Wort nein ab, in einem Zug. Den i-Punkt setzt du zum Schluss."
                show: { drawn: writing-lines, script: joined, text: "nein", mode: copy, arrows: false }
                char: "nein"
              - id: l1-n2
                type: multiple_choice
                text: "Wo hört das kleine m auf?"
                say: "Wo hört das kleine m in der Schreibschrift auf: unten oder oben?"
                options: ["unten", "oben"]
                keep_order: true
                answer: "unten"
              - id: l1-n3
                type: multiple_choice
                text: "Welcher kleine Buchstabe hat eine Oberlänge? Er reicht bis unters Dach."
                say: "Welcher kleine Buchstabe reicht bis unters Dach?"
                options: ["h", "n", "u"]
                answer: "h"
                option_audio: false
              - id: l1-n4
                type: true_false
                text: "Lisa schreibt „lila“ in Schreibschrift. Sie hebt den Stift erst ab, wenn das Wort fertig ist. Macht Lisa das richtig?"
                say: "Lisa schreibt lila in Schreibschrift. Sie hebt den Stift erst ab, wenn das Wort fertig ist. Macht Lisa das richtig?"
                answer: true
              - id: l1-n5
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib das Wort eine ab."
                show: { drawn: writing-lines, script: joined, text: "eine", mode: copy, arrows: false }
                char: "eine"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Du schreibst „lila“ in Schreibschrift. Wann hebst du den Stift ab?"
            say: "Du schreibst das Wort lila in Schreibschrift. Wann hebst du den Stift ab?"
            options: ["wenn das Wort fertig ist", "nach jedem Buchstaben"]
            keep_order: true
            answer: "wenn das Wort fertig ist"
          - id: l1-c2
            type: multiple_choice
            text: "Welcher kleine Buchstabe hat eine Unterlänge? Er reicht in den Keller."
            say: "Welcher kleine Buchstabe reicht in den Keller?"
            options: ["j", "i", "n"]
            answer: "j"
            option_audio: false
          - id: l1-c3
            type: tracing
            text: "Schreib das Wort ab."
            say: "Schreib das Wort im ab, in einem Zug."
            show: { drawn: writing-lines, script: joined, text: "im", mode: copy, arrows: false }
            char: "im"
          - id: l1-c4
            type: multiple_choice
            text: "In welchem Wort steht ein Buchstabe mit Unterlänge? Er reicht in den Keller."
            say: "In welchem Wort steht ein Buchstabe, der in den Keller reicht?"
            options: ["gut", "neu", "mal"]
            answer: "gut"
          - id: l1-c5
            type: true_false
            text: "Paul schreibt „nun“ in Schreibschrift. Nach dem n und nach dem u führt er die Verbindung unten los in den nächsten Buchstaben. Macht Paul das richtig?"
            say: "Paul schreibt nun in Schreibschrift. Nach dem n und nach dem u führt er die Verbindung unten los in den nächsten Buchstaben. Macht Paul das richtig?"
            answer: true
          - id: l1-c6
            type: sorting
            text: "Reicht der Buchstabe bis unters Dach oder in den Keller?"
            say: "Reicht der kleine Buchstabe bis unters Dach oder in den Keller? Sortiere."
            bins:
              - { id: dach, show: { text: "bis unters Dach" }, say: "bis unters Dach" }
              - { id: keller, show: { text: "in den Keller" }, say: "in den Keller" }
            options:
              - { text: "d", bin: dach }
              - { text: "p", bin: keller }
              - { text: "l", bin: dach }
              - { text: "g", bin: keller }
            option_audio: false

  - n: 2
    title: { de: "Oben verbunden", en: "Joined at the top" }
    goal:
      de: "Verbinde nach dem o oben, so wie bei wo, und setz Punkte und Striche erst zum Schluss."
      en: "Join at the top after o, like in wo, and add dots and crosses only at the end."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wo hört das kleine n auf?"
            say: "Wo hört das kleine n in der Schreibschrift auf: unten oder oben?"
            options: ["unten", "oben"]
            keep_order: true
            answer: "unten"
            difficulty: easy
          - id: l2-w2
            type: tracing
            text: "Schreib das Wort ab."
            say: "Schreib das Wort mein ab, in einem Zug."
            show: { drawn: writing-lines, script: joined, text: "mein", mode: copy, arrows: false }
            char: "mein"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "o w v b"
            say: "Vier kleine Buchstaben hören oben auf: o, w, v und b. Nach ihnen geht die Verbindung oben weiter, wie eine kleine Brücke zum nächsten Buchstaben."
            show: { drawn: writing-lines, script: joined, text: "on", mode: trace, arrows: true }
          - text: "wo"
            say: "Wenn du nach dem o nach unten fährst, sieht es schnell aus wie ein a. Dann liest man wa statt wo. Darum bleibst du nach dem o oben."
            show: { drawn: writing-lines, script: joined, text: "wo", mode: trace, arrows: true }
          - text: "mit"
            say: "Erst schreibst du das ganze Wort in einem Zug. Danach setzt du den i-Punkt, die Punkte auf ä, ö und ü und den Strich beim t."
            show: { drawn: writing-lines, script: joined, text: "mit", mode: trace, arrows: true }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort ob nach. Nach dem o bleibst du oben."
                show: { drawn: writing-lines, script: joined, text: "ob", mode: trace, arrows: true }
                char: "ob"
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Wo geht die Verbindung nach dem o los?"
                say: "Du schreibst das Wort von. Wo geht die Verbindung nach dem o zum n los: oben oder unten?"
                show: { drawn: writing-lines, script: joined, text: "von", mode: copy, arrows: false }
                options: ["oben", "unten"]
                keep_order: true
                answer: "oben"
                feedback:
                  unten: "Nach dem o bleibst du oben. Gehst du nach unten, sieht das o aus wie ein a."
                hints:
                  - "Wo hört das o auf?"
                  - "Das o, das w, das v und das b hören oben auf."
                  - "Oben. Die Verbindung ist eine kleine Brücke."
              - id: l2-f3
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort wo nach. Nach dem w bleibst du oben und gehst ins o."
                show: { drawn: writing-lines, script: joined, text: "wo", mode: trace, arrows: true }
                char: "wo"
              - id: l2-f4
                type: sorting
                text: "Wo geht die Verbindung los?"
                say: "Wo geht die Verbindung nach diesem Buchstaben los, oben oder unten? Sortiere."
                bins:
                  - { id: oben, show: { text: "oben" }, say: "oben" }
                  - { id: unten, show: { text: "unten" }, say: "unten" }
                options:
                  - { text: "o", bin: oben }
                  - { text: "w", bin: oben }
                  - { text: "m", bin: unten }
                  - { text: "a", bin: unten }
                option_audio: false
                hints:
                  - "Denk an die vier Buchstaben, die oben aufhören."
                  - "Es sind o, w, v und b."
                  - "o und w kommen zu oben, m und a zu unten."
              - id: l2-f5
                type: multiple_choice
                text: "Du schreibst „mit“. Wann setzt du den t-Strich?"
                say: "Du schreibst das Wort mit. Wann machst du den Strich beim t?"
                options: ["wenn das Wort fertig ist", "mitten im Wort, gleich nach dem t"]
                keep_order: true
                answer: "wenn das Wort fertig ist"
                feedback:
                  "mitten im Wort, gleich nach dem t": "Dann musst du den Stift im Wort abheben. Schreib erst das Wort fertig, dann kommen Punkte und Striche."
                hints:
                  - "Wann hebst du den Stift in der Schreibschrift ab?"
                  - "Punkte und Striche kommen, wenn der Stift sowieso oben ist."
                  - "Wenn das Wort fertig ist."
              - id: l2-f6
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort mit nach. Erst das Wort, dann den i-Punkt und den t-Strich."
                show: { drawn: writing-lines, script: joined, text: "mit", mode: trace, arrows: true }
                char: "mit"

          - support: some
            tasks:
              - id: l2-s1
                type: tracing
                text: "Fahr das Wort nach."
                say: "Fahr das Wort oben nach. Nach dem o und nach dem b bleibst du oben."
                show: { drawn: writing-lines, script: joined, text: "oben", mode: trace, arrows: true }
                char: "oben"
              - id: l2-s2
                type: multiple_choice
                text: "Du schreibst „wie“. Wo geht die Verbindung nach dem w los?"
                say: "Du schreibst das Wort wie. Wo geht die Verbindung nach dem w los: oben oder unten?"
                options: ["oben", "unten"]
                keep_order: true
                answer: "oben"
                hints: ["Das w gehört zu den vier Buchstaben, die oben aufhören."]
              - id: l2-s3
                type: true_false
                text: "Ole schreibt „wo“. Nach dem o fährt er nach unten. Jetzt sieht das Wort aus wie „wa“. Ist das richtig verbunden?"
                say: "Ole schreibt wo. Nach dem o fährt er nach unten. Jetzt sieht das Wort aus wie wa. Ist das richtig verbunden?"
                answer: false
                hints: ["Wo geht die Verbindung nach dem o los?"]
              - id: l2-s4
                type: sorting
                text: "Wo geht die Verbindung los?"
                say: "Wo geht die Verbindung nach diesem Buchstaben los, oben oder unten? Sortiere."
                bins:
                  - { id: oben, show: { text: "oben" }, say: "oben" }
                  - { id: unten, show: { text: "unten" }, say: "unten" }
                options:
                  - { text: "b", bin: oben }
                  - { text: "v", bin: oben }
                  - { text: "n", bin: unten }
                  - { text: "e", bin: unten }
                option_audio: false
                hints: ["o, w, v und b hören oben auf."]
              - id: l2-s5
                type: multiple_choice
                text: "Du schreibst „müde“. Was machst du zum Schluss?"
                say: "Du schreibst das Wort müde. Was machst du zum Schluss?"
                options: ["die zwei Punkte auf das ü setzen", "das m schreiben", "das d schreiben"]
                answer: "die zwei Punkte auf das ü setzen"
                hints: ["Punkte und Striche kommen, wenn das Wort fertig ist."]

          - support: none
            tasks:
              - id: l2-n1
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib das Wort vom ab."
                show: { drawn: writing-lines, script: joined, text: "vom", mode: copy, arrows: false }
                char: "vom"
              - id: l2-n2
                type: multiple_choice
                text: "Du schreibst „aber“. Wo geht die Verbindung nach dem b los?"
                say: "Du schreibst das Wort aber. Wo geht die Verbindung nach dem b los: oben oder unten?"
                options: ["oben", "unten"]
                keep_order: true
                answer: "oben"
              - id: l2-n3
                type: highlight_in_text
                text: "Tippe auf jeden Buchstaben, nach dem die Verbindung oben weitergeht."
                say: "Tippe auf jeden Buchstaben, nach dem die Verbindung oben weitergeht."
                show: { drawn: letter-card, text: "o m w i n b" }
                spans: ["o", "w", "b"]
              - id: l2-n4
                type: tracing
                text: "Schreib das Wort ab."
                say: "Schreib das Wort wohnen ab. Nach dem w und dem o bleibst du oben."
                show: { drawn: writing-lines, script: joined, text: "wohnen", mode: copy, arrows: false }
                char: "wohnen"
              - id: l2-n5
                type: true_false
                text: "Mia schreibt „mit“. Sie schreibt erst das ganze Wort und setzt dann den i-Punkt und den t-Strich. Macht Mia das richtig?"
                say: "Mia schreibt mit. Sie schreibt erst das ganze Wort und setzt dann den i-Punkt und den t-Strich. Macht Mia das richtig?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: one-go
            type: true_false
            text: "Can schreibt „eine“ in Schreibschrift. Nach jedem Buchstaben hebt er den Stift ab. Macht Can das richtig?"
            say: "Can schreibt eine in Schreibschrift. Nach jedem Buchstaben hebt er den Stift ab. Macht Can das richtig?"
            answer: false
          - id: l2-c2
            part: join-high
            type: multiple_choice
            text: "Du schreibst „vier“. Wo geht die Verbindung nach dem v los?"
            say: "Du schreibst das Wort vier. Wo geht die Verbindung nach dem v los: oben oder unten?"
            options: ["oben", "unten"]
            keep_order: true
            answer: "oben"
          - id: l2-c3
            part: join-high
            type: sorting
            text: "Nach welchen Buchstaben bleibst du oben?"
            say: "Nach welchen Buchstaben bleibst du oben, nach welchen geht es unten weiter? Sortiere."
            bins:
              - { id: oben, show: { text: "oben" }, say: "oben" }
              - { id: unten, show: { text: "unten" }, say: "unten" }
            options:
              - { text: "o", bin: oben }
              - { text: "b", bin: oben }
              - { text: "i", bin: unten }
              - { text: "u", bin: unten }
            option_audio: false
