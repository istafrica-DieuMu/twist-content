# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.write-poems
skill: lit-de.writing.poems
curriculum: de-DE
language: de
title:
  de: Gedichte schreiben
  en: Writing poems
summary: >
  Writing poems to a pattern. Lesson 1 builds an Elfchen: one, two,
  three, four and one word in five lines, what goes into each line,
  counting words and not letters, and putting the lines in order; lesson
  2 writes Reimgedichte: a Reimwort that both rhymes and makes sense, a
  second Vers that rhymes with the first, rhyme pairs, and ends with the
  skill check across both patterns. All poems are written for Twist.
  Writing a poem freely waits for a free text task type; here the child
  chooses, orders and completes lines.
metadata:
  year: klasse-2
  topic: { de: Gedichte schreiben, en: Writing poems }
  ages: [6-7]
  lesson_minutes: 12
  builds_on: [lit-de.texts-media.poems]
  also_practises: [lit-de.texts-media.poems, lit-de.phonological.rhymes]
  vocabulary: { de: [Gedicht, Elfchen, Zeile, Vers, Wort, Reim, Reimwort, Schlusswort] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: elfchen-form, what: { de: "die Form eines Elfchens kennen (ein, zwei, drei, vier und ein Wort)", en: "knowing the form of an Elfchen (one, two, three, four and one word)" } }
    - { id: elfchen-build, what: { de: "ein Elfchen bauen: Zeilen ergänzen und ordnen", en: "building an Elfchen: completing and ordering its lines" } }
    - { id: rhyme-word, what: { de: "ein Reimwort finden, das sich reimt und zum Sinn passt", en: "finding a rhyme word that rhymes and makes sense" } }
    - { id: rhyme-verse, what: { de: "einen zweiten Vers wählen, der sich auf den ersten reimt", en: "choosing a second line that rhymes with the first" } }
  misconceptions:
    - id: count-letters
      what: Counts letters or syllables instead of words, or puts too many words into a line of an Elfchen
      addressed: "lesson 1 Learn counts the words of ich gehe nach draußen; every missing-line task offers a line with too many or too few words (l1-f2 with feedback, l1-s2, l1-n2, l1-c2, l2-c3); l1-n4 offers the number of letters; l1-f5, l1-n5 and l2-w2 ask whether a poem is a correct Elfchen"
    - id: rhyme-or-sense
      what: Picks a word that rhymes but makes no sense, or one that makes sense but does not rhyme
      addressed: "lesson 2 Learn sets Platz against Nest and Latz; every Reimwort gap offers both kinds (l2-f1 with feedback, l2-s1, l2-n1, l2-c1); the verse tasks offer a verse that fits but does not rhyme (l2-f3, l2-s3, l2-n3, l2-c5); l2-s5 asks about Nest"
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Das Elfchen", en: "The eleven-word poem" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Die Sonne lacht,\nder Tag erwacht.\n\nWelche Wörter reimen sich?"
            say: "Lies die zwei Verse. Welche Wörter reimen sich?"
            options: ["lacht und erwacht", "Sonne und Tag", "die und der"]
            answer: "lacht und erwacht"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ein Käfer krabbelt übers Blatt,\nbald ist er müde und ganz satt.\n\nWie viele Verse hat das Gedicht?"
            say: "Lies das Gedicht. Wie viele Verse hat es?"
            options: ["zwei", "eins", "vier"]
            answer: "zwei"
            difficulty: easy

      - activity: learn
        mode: model-text
        screens:
          - text: "Gelb\ndie Sonne\nsie wärmt mich\nich gehe nach draußen\nSommer"
            say: "Das ist ein Elfchen. Es hat genau elf Wörter in fünf Zeilen. Ein Elfchen muss sich nicht reimen."
          - text: "Zeile 1: 1 Wort, eine Farbe oder Eigenschaft\nZeile 2: 2 Wörter, ein Ding\nZeile 3: 3 Wörter, was es tut oder wo es ist\nZeile 4: 4 Wörter, etwas über dich\nZeile 5: 1 Wort, ein Schlusswort"
            say: "So ist ein Elfchen gebaut. In der ersten Zeile steht ein Wort, in der zweiten zwei, in der dritten drei und in der vierten vier. Die vierte Zeile fängt oft mit ich an. In der letzten Zeile steht ein Schlusswort."
          - text: "ich gehe nach draußen\n1 Wort + 1 Wort + 1 Wort + 1 Wort = 4 Wörter"
            say: "Zähl die Wörter, nicht die Buchstaben. Zwischen zwei Wörtern ist immer eine Lücke. Ich gehe nach draußen sind vier Wörter."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie viele Wörter stehen in der zweiten Zeile eines Elfchens?"
                say: "Wie viele Wörter stehen in der zweiten Zeile eines Elfchens?"
                options: ["zwei", "eins", "vier"]
                answer: "zwei"
                hints:
                  - "Die Zeilen werden von oben nach unten länger, bis zur vierten."
                  - "Zeile 1 hat ein Wort. Und Zeile 2?"
                  - "Zwei Wörter, zum Beispiel: die Sonne."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Grün\nder Frosch\ner sitzt still\n...\nQuak\n\nWelche Zeile fehlt?"
                say: "Lies das Elfchen. Welche Zeile fehlt?"
                options: ["ich höre ihn quaken", "ich mag Frösche sehr gern", "ich"]
                answer: "ich höre ihn quaken"
                feedback:
                  "ich mag Frösche sehr gern": "Zähl die Wörter: Das sind fünf. In der vierten Zeile stehen genau vier."
                hints:
                  - "Es fehlt die vierte Zeile."
                  - "In der vierten Zeile stehen vier Wörter. Zähl die Wörter in jeder Antwort."
                  - "ich höre ihn quaken: vier Wörter."
              - id: l1-f3
                type: ordering
                text: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
                say: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
                options: ["er fällt leise", "Winter", "der Schnee", "ich baue einen Schneemann", "Weiß"]
                slot_count: 5
                answer: ["Weiß", "der Schnee", "er fällt leise", "ich baue einen Schneemann", "Winter"]
                hints:
                  - "Die Zeilen haben ein, zwei, drei, vier und ein Wort."
                  - "Oben steht die Farbe, unten das Schlusswort."
                  - "Weiß, der Schnee, er fällt leise, ich baue einen Schneemann, Winter."
              - id: l1-f4
                type: multiple_choice
                text: "Was steht in der ersten Zeile eines Elfchens?"
                say: "Was steht in der ersten Zeile eines Elfchens?"
                options: ["ein Wort, zum Beispiel eine Farbe", "ein ganzer Satz", "vier Wörter über dich"]
                answer: "ein Wort, zum Beispiel eine Farbe"
                hints:
                  - "Denk an das Elfchen über die Sonne."
                  - "Es fing mit „Gelb“ an."
                  - "Ein Wort, zum Beispiel eine Farbe."
              - id: l1-f5
                type: true_false
                text: "Rot\ndie Erdbeere\nsie ist süß\nich esse sie gern\nLecker\n\nIst das ein richtiges Elfchen?"
                say: "Lies das Gedicht. Ist das ein richtiges Elfchen?"
                answer: true
                hints:
                  - "Zähl die Wörter in jeder Zeile."
                  - "Es müssen ein, zwei, drei, vier und ein Wort sein."
                  - "Ja, es passt genau."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Wie viele Wörter stehen in der vierten Zeile eines Elfchens?"
                say: "Wie viele Wörter stehen in der vierten Zeile eines Elfchens?"
                options: ["vier", "drei", "fünf"]
                answer: "vier"
                hints: ["Zeile 1 hat ein Wort, Zeile 2 zwei Wörter. Und Zeile 4?"]
              - id: l1-s2
                type: multiple_choice
                text: "Blau\n...\nes ist tief\nich schwimme gern darin\nNass\n\nWelche Zeile fehlt?"
                say: "Lies das Elfchen. Welche Zeile fehlt?"
                options: ["das Meer", "das große blaue Meer", "Meer"]
                answer: "das Meer"
                hints: ["Es fehlt die zweite Zeile. Wie viele Wörter stehen dort?"]
              - id: l1-s3
                type: ordering
                text: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
                say: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
                options: ["ich decke ihn zu", "Braun", "Winterschlaf", "der Igel", "er schläft tief"]
                slot_count: 5
                answer: ["Braun", "der Igel", "er schläft tief", "ich decke ihn zu", "Winterschlaf"]
                hints: ["Zähl die Wörter auf jeder Karte."]
              - id: l1-s4
                type: multiple_choice
                text: "Was steht oft in der vierten Zeile eines Elfchens?"
                say: "Was steht oft in der vierten Zeile eines Elfchens?"
                options: ["etwas über dich, mit „ich“", "nur eine Farbe", "ein einziges Wort"]
                answer: "etwas über dich, mit „ich“"
                hints: ["Denk an „ich gehe nach draußen“."]
              - id: l1-s5
                type: true_false
                text: "Ein Elfchen muss sich reimen. Stimmt das?"
                say: "Ein Elfchen muss sich reimen. Stimmt das?"
                answer: false
                hints: ["Denk an das Elfchen über die Sonne. Hat es sich gereimt?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Wie viele Wörter hat ein Elfchen zusammen?"
                say: "Wie viele Wörter hat ein Elfchen zusammen?"
                options: ["elf", "fünf", "zehn"]
                answer: "elf"
              - id: l1-n2
                type: multiple_choice
                text: "Gelb\ndie Banane\n...\nich schäle sie langsam\nFrühstück\n\nWelche Zeile fehlt?"
                say: "Lies das Elfchen. Welche Zeile fehlt?"
                options: ["sie ist krumm", "sie ist so schön krumm", "krumm"]
                answer: "sie ist krumm"
              - id: l1-n3
                type: ordering
                text: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
                say: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
                options: ["Herbst", "sie leuchten hell", "Orange", "ich schnitze ein Gesicht", "die Kürbisse"]
                slot_count: 5
                answer: ["Orange", "die Kürbisse", "sie leuchten hell", "ich schnitze ein Gesicht", "Herbst"]
              - id: l1-n4
                type: multiple_choice
                text: "„ich spiele im Garten“\n\nWie viele Wörter sind das?"
                say: "Lies die Zeile. Wie viele Wörter sind das?"
                options: ["vier", "siebzehn", "zwei"]
                answer: "vier"
              - id: l1-n5
                type: true_false
                text: "Weiß\nder Schnee\ner fällt\nich baue einen Schneemann\nWinter\n\nIst das ein richtiges Elfchen?"
                say: "Lies das Gedicht. Ist das ein richtiges Elfchen?"
                answer: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Wie viele Wörter stehen in der dritten Zeile eines Elfchens?"
            say: "Wie viele Wörter stehen in der dritten Zeile eines Elfchens?"
            options: ["drei", "zwei", "fünf"]
            answer: "drei"
          - id: l1-c2
            type: multiple_choice
            text: "Grau\ndie Wolke\nsie zieht vorbei\n...\nRegen\n\nWelche Zeile fehlt?"
            say: "Lies das Elfchen. Welche Zeile fehlt?"
            options: ["ich hole meinen Schirm", "ich hole schnell meinen großen Schirm", "Schirm"]
            answer: "ich hole meinen Schirm"
          - id: l1-c3
            type: true_false
            text: "Ein Elfchen hat fünf Zeilen. Stimmt das?"
            say: "Ein Elfchen hat fünf Zeilen. Stimmt das?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Schwarz\ndie Nacht\n...\nich kann nicht schlafen\nStill\n\nWelche Zeile fehlt?"
            say: "Lies das Elfchen. Welche Zeile fehlt?"
            options: ["sie ist so dunkel und still", "sie ist dunkel", "dunkel"]
            answer: "sie ist dunkel"
          - id: l1-c5
            type: ordering
            text: "Bring die Zeilen des Elfchens in die richtige Reihenfolge."
            say: "Lies die Karten. Bring die Zeilen des Elfchens in die richtige Reihenfolge."
            options: ["es wälzt sich", "Matsch", "ich lache laut los", "Rosa", "das Schwein"]
            slot_count: 5
            answer: ["Rosa", "das Schwein", "es wälzt sich", "ich lache laut los", "Matsch"]
          - id: l1-c6
            type: true_false
            text: "In der vierten Zeile eines Elfchens steht nur ein Wort. Stimmt das?"
            say: "In der vierten Zeile eines Elfchens steht nur ein Wort. Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Reime schreiben", en: "Writing rhymes" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wie viele Wörter stehen in der letzten Zeile eines Elfchens?"
            say: "Wie viele Wörter stehen in der letzten Zeile eines Elfchens?"
            options: ["eins", "vier", "drei"]
            answer: "eins"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Rot\nder Apfel\ner hängt oben\nich pflücke ihn mir\nKnackig\n\nIst das ein richtiges Elfchen?"
            say: "Lies das Gedicht. Ist das ein richtiges Elfchen?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Im Garten sitzt ein kleiner Spatz,\ner sucht sich einen guten Platz."
            say: "In einem Reimgedicht reimen sich oft zwei Verse am Ende. Spatz und Platz klingen am Ende gleich. Und Platz passt auch zum Sinn: Der Spatz sucht sich einen Platz."
          - text: "Spatz | Platz: reimt sich und passt\nSpatz | Nest: passt, reimt sich aber nicht\nSpatz | Latz: reimt sich, passt aber nicht"
            say: "Ein gutes Reimwort kann zwei Dinge. Es reimt sich, und es passt zum Sinn. Ein Nest passt zum Spatz, reimt sich aber nicht. Latz reimt sich, aber ein Spatz sucht sich keinen Latz."
          - text: "Spatz, Platz, Satz, Latz"
            say: "So findest du Reimwörter. Sag das letzte Wort laut und tausch den Anfang aus: Spatz, Platz, Satz, Latz. Dann prüfst du: Welches Wort passt in das Gedicht?"

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Welches Reimwort passt?"
                say: "Lies die Verse. Welches Wort reimt sich und passt in die Lücke?"
                frame: "Im Winter fällt der weiße Schnee, und Eis liegt auf dem großen _."
                options: ["See", "Teich", "Tee"]
                answer: ["See"]
                feedback:
                  "Teich": "„Teich“ passt zum Sinn, reimt sich aber nicht auf „Schnee“."
                  "Tee": "„Tee“ reimt sich, aber Eis auf einem großen Tee passt nicht."
                hints:
                  - "Das Wort muss sich auf „Schnee“ reimen und zum Sinn passen."
                  - "Worauf liegt im Winter Eis?"
                  - "Schnee, See."
                difficulty: easy
              - id: l2-f2
                type: matching
                text: "Welche Wörter reimen sich?"
                say: "Verbinde die Wörter, die sich reimen."
                pairs:
                  - { left: { text: "Kuchen" }, right: { text: "suchen" } }
                  - { left: { text: "Nacht" }, right: { text: "lacht" } }
                  - { left: { text: "Hut" }, right: { text: "gut" } }
                hints:
                  - "Sprich jedes Wort leise. Hör auf das Ende."
                  - "„Kuchen“ endet auf „uchen“. Welches Wort auch?"
                  - "Kuchen und suchen, Nacht und lacht, Hut und gut."
              - id: l2-f3
                type: multiple_choice
                text: "Ein Frosch sitzt still am Teich,\n...\n\nWelcher Vers passt als Reim?"
                say: "Lies den ersten Vers. Welcher Vers passt als Reim dazu?"
                options: ["er springt ins Wasser gleich.", "er springt dann in das Wasser.", "er fängt sich eine Fliege."]
                answer: "er springt ins Wasser gleich."
                hints:
                  - "Das letzte Wort muss sich auf „Teich“ reimen."
                  - "Schau auf das letzte Wort jedes Verses."
                  - "Teich, gleich."
              - id: l2-f4
                type: highlight_in_text
                text: "Tippe auf die zwei Wörter, die sich reimen."
                say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
                show: { drawn: letter-card, text: "Ein kleiner Wurm kroch durch den Sand, bis er ein grünes Blättchen fand." }
                spans: ["Sand,", "fand."]
                hints:
                  - "Reimwörter stehen am Ende der Verse."
                  - "Der erste Vers endet mit „Sand“."
                  - "Sand und fand."
              - id: l2-f5
                type: true_false
                text: "Ein gutes Reimwort reimt sich und passt zum Sinn. Stimmt das?"
                say: "Ein gutes Reimwort reimt sich und passt zum Sinn. Stimmt das?"
                answer: true
                hints:
                  - "Denk an den Spatz."
                  - "„Nest“ passt, reimt sich aber nicht. „Latz“ reimt sich, passt aber nicht."
                  - "Ja, das stimmt."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Welches Reimwort passt?"
                say: "Lies die Verse. Welches Wort reimt sich und passt in die Lücke?"
                frame: "Mein Teddy ist schon ziemlich alt, er wärmt mich, wird es draußen _."
                options: ["kalt", "dunkel", "Wald"]
                answer: ["kalt"]
                hints: ["Reimt es sich auf „alt“, und passt es zum Wärmen?"]
              - id: l2-s2
                type: matching
                text: "Welche Wörter reimen sich?"
                say: "Verbinde die Wörter, die sich reimen."
                pairs:
                  - { left: { text: "Stein" }, right: { text: "klein" } }
                  - { left: { text: "Topf" }, right: { text: "Kopf" } }
                  - { left: { text: "Ball" }, right: { text: "Stall" } }
                hints: ["Hör auf das Ende jedes Wortes."]
              - id: l2-s3
                type: multiple_choice
                text: "Die Ente schwimmt im Bach,\n...\n\nWelcher Vers passt als Reim?"
                say: "Lies den ersten Vers. Welcher Vers passt als Reim dazu?"
                options: ["die Kinder schauen ihr nach.", "sie schwimmt dann immer weiter.", "sie mag gern Brot."]
                answer: "die Kinder schauen ihr nach."
                hints: ["Welches letzte Wort reimt sich auf „Bach“?"]
              - id: l2-s4
                type: highlight_in_text
                text: "Tippe auf die zwei Wörter, die sich reimen."
                say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
                show: { drawn: letter-card, text: "Der Igel sucht sich warmes Moos, sein Winterschlaf geht bald schon los." }
                spans: ["Moos,", "los."]
                hints: ["Schau auf das Ende der Verse."]
              - id: l2-s5
                type: true_false
                text: "„Nest“ ist ein gutes Reimwort auf „Spatz“. Stimmt das?"
                say: "Nest ist ein gutes Reimwort auf Spatz. Stimmt das?"
                answer: false
                hints: ["Klingen „Spatz“ und „Nest“ am Ende gleich?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Welches Reimwort passt?"
                say: "Lies die Verse. Welches Wort reimt sich und passt in die Lücke?"
                frame: "Die Raupe frisst ein grünes Blatt, danach ist sie ganz rund und _."
                options: ["satt", "dick", "Stadt"]
                answer: ["satt"]
              - id: l2-n2
                type: matching
                text: "Welche Wörter reimen sich?"
                say: "Verbinde die Wörter, die sich reimen."
                pairs:
                  - { left: { text: "Zug" }, right: { text: "klug" } }
                  - { left: { text: "Bein" }, right: { text: "Schwein" } }
                  - { left: { text: "Hand" }, right: { text: "Strand" } }
              - id: l2-n3
                type: multiple_choice
                text: "Der Mond scheint hell in dieser Nacht,\n...\n\nWelcher Vers passt als Reim?"
                say: "Lies den ersten Vers. Welcher Vers passt als Reim dazu?"
                options: ["der kleine Uhu ist erwacht.", "die Sterne leuchten auch dabei.", "ich schlafe tief in meinem Bett."]
                answer: "der kleine Uhu ist erwacht."
              - id: l2-n4
                type: highlight_in_text
                text: "Tippe auf die zwei Wörter, die sich reimen."
                say: "Lies die zwei Verse. Tippe auf die zwei Wörter, die sich reimen."
                show: { drawn: letter-card, text: "Die Maus läuft schnell zum Käse hin, sie hat nur Futter noch im Sinn." }
                spans: ["hin,", "Sinn."]
              - id: l2-n5
                type: true_false
                text: "„Wald“ und „kalt“ reimen sich. Stimmt das?"
                say: "Wald und kalt. Reimen sich die beiden Wörter?"
                answer: true

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: rhyme-word
            type: fill_in_blank
            text: "Welches Reimwort passt?"
            say: "Lies die Verse. Welches Wort reimt sich und passt in die Lücke?"
            frame: "Die Kinder graben auf dem Platz, sie suchen einen alten _."
            options: ["Schatz", "Ring", "Spatz"]
            answer: ["Schatz"]
          - id: l2-c2
            part: elfchen-form
            type: multiple_choice
            text: "Wie viele Wörter stehen in der ersten Zeile eines Elfchens?"
            say: "Wie viele Wörter stehen in der ersten Zeile eines Elfchens?"
            options: ["eins", "zwei", "vier"]
            answer: "eins"
          - id: l2-c3
            part: elfchen-build
            type: multiple_choice
            text: "Bunt\nder Regenbogen\n...\nich staune über dich\nWunderschön\n\nWelche Zeile fehlt?"
            say: "Lies das Elfchen. Welche Zeile fehlt?"
            options: ["er leuchtet hell", "er leuchtet so hell am Himmel", "hell"]
            answer: "er leuchtet hell"
          - id: l2-c4
            part: rhyme-word
            type: matching
            text: "Was reimt sich?"
            say: "Verbinde jedes Wort mit seinem Reimwort."
            pairs:
              - { left: { text: "Tanne" }, right: { text: "Kanne" } }
              - { left: { text: "Nase" }, right: { text: "Hase" } }
              - { left: { text: "Licht" }, right: { text: "Gedicht" } }
          - id: l2-c5
            part: rhyme-verse
            type: multiple_choice
            text: "Im Herbst, da tanzt das bunte Laub,\n...\n\nWelcher Vers passt als Reim?"
            say: "Lies den ersten Vers. Welcher Vers passt als Reim dazu?"
            options: ["der Wind, der wirbelt es wie Staub.", "die Blätter fallen nach unten.", "ich trinke heißen Tee."]
            answer: "der Wind, der wirbelt es wie Staub."
          - id: l2-c6
