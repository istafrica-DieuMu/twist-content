# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.word-fields
skill: lit-de.vocabulary.word-fields
curriculum: de-DE
language: de
title:
  de: Wortfelder
  en: Word fields
summary: >
  A Wortfeld holds words with a similar meaning. Lesson 1 collects the
  Wortfeld gehen (laufen, rennen, schleichen, hüpfen) and tells its words
  from words that are only about the same topic (Schuh, Weg); lesson 2
  adds the Wortfeld sagen (rufen, flüstern, fragen, antworten), picks the
  word that fits a sentence best, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Wortschatz, en: Vocabulary }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.vocabulary.categories, lit-de.verbs.recognise]
  also_practises: [lit-de.verbs.recognise]
  vocabulary: { de: [Wortfeld, treffend, ähnlich] }
  forms: [text, audio, drawn]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: collect, what: { de: "Wörter eines Wortfelds erkennen und sammeln (gehen, sagen)", en: "recognising and collecting the words of a word field (walk, say)" } }
    - { id: not-in-field, what: { de: "Wörter zum gleichen Thema vom Wortfeld trennen (Schuh, Weg)", en: "keeping words that are only about the same topic out of the word field (shoe, path)" } }
    - { id: meaning, what: { de: "sagen, was ein Wort genau bedeutet (rennen: ganz schnell)", en: "saying exactly what a word means (rennen: very fast)" } }
    - { id: precise, what: { de: das treffende Wort für einen Satz wählen, en: choosing the most precise word for a sentence } }
  misconceptions:
    - id: topic-not-meaning
      what: Puts words that only belong to the same topic into the Wortfeld (Schuh or Weg for gehen, Mund for sagen)
      addressed: lesson 1 Learn sets gehen against Schuh; l1-f1, l1-s1, l1-n1, l2-f2 and l2-c2 have topic words among the cards; l1-f4 and l2-c4 ask about one directly
    - id: general-word
      what: Keeps the plain word (gehen, sagen) where a sentence asks for a more precise one, and misses the clue in the sentence (leise, schnell, ganz laut)
      addressed: lesson 2 Learn shows the clue words; every stage has a sentence with a clue and gehen or sagen as a distractor (l1-f3, l1-s3, l2-f3, l2-s3, l2-n3, l2-c3); l2-f3 gives feedback on sagt
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-14

lessons:
  - n: 1
    title: { de: "Das Wortfeld gehen", en: "The word field walk" }
    goal:
      de: "Sammle Wörter, die so ähnlich wie gehen sind, so wie rennen, schleichen und hüpfen."
      en: "Collect words that are like walk, such as run, creep and hop."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Apfel, Birne, Banane: Welcher Oberbegriff passt?"
            say: "Apfel, Birne, Banane. Welcher Oberbegriff passt?"
            options: ["Obst", "Tiere", "Möbel"]
            answer: "Obst"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Welches Wort ist ein Verb?"
            say: "Welches Wort ist ein Verb?"
            options: ["laufen", "der Weg", "schnell"]
            answer: "laufen"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "gehen | laufen | rennen | schleichen | hüpfen"
            say: "Alle diese Wörter sagen, wie man sich auf den Beinen fortbewegt. Sie haben eine ähnliche Bedeutung. Zusammen sind sie ein Wortfeld: das Wortfeld gehen."
          - text: "rennen: ganz schnell | schleichen: ganz leise | hüpfen: mit Sprüngen"
            say: "Jedes Wort sagt etwas mehr als gehen. Wer rennt, ist ganz schnell. Wer schleicht, ist ganz leise. Wer hüpft, macht kleine Sprünge."
          - text: "gehen | der Schuh | der Weg"
            say: "Pass auf: Der Schuh und der Weg haben auch mit gehen zu tun. Aber sie bedeuten nicht gehen. Sie gehören nicht ins Wortfeld."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: highlight_in_text
                text: "Tippe auf die Wörter aus dem Wortfeld gehen."
                say: "Tippe auf alle Wörter, die zum Wortfeld gehen gehören."
                show: { drawn: letter-card, text: "rennen Schuh schleichen Bein hüpfen" }
                spans: ["rennen", "schleichen", "hüpfen"]
                hints:
                  - "Frage bei jedem Wort: Kann ich das statt gehen sagen?"
                  - "Schuh und Bein haben mit gehen zu tun, aber sie sind Nomen, keine Verben."
                  - "Tippe auf rennen, schleichen und hüpfen."
                difficulty: easy
              - id: l1-f2
                type: multiple_choice
                text: "Wer ganz schnell ist, der ..."
                say: "Wer ganz schnell ist, der ... Welches Wort passt?"
                options: ["rennt", "schleicht", "hüpft"]
                answer: "rennt"
                hints:
                  - "Welches Wort sagt: sehr schnell?"
                  - "Wer schleicht, ist leise und langsam."
                  - "Wer ganz schnell ist, der rennt."
              - id: l1-f3
                type: multiple_choice
                text: "Die Katze will die Maus nicht wecken. Sie _ ganz leise zum Loch."
                say: "Die Katze will die Maus nicht wecken. Wie bewegt sie sich zum Loch?"
                options: ["schleicht", "geht", "rennt"]
                answer: "schleicht"
                feedback:
                  "geht": "Gehen passt, aber es sagt nicht, wie leise sie ist. Es gibt ein besseres Wort."
                  "rennt": "Wer rennt, ist schnell und oft laut. Die Katze will leise sein."
                hints:
                  - "Lies noch einmal: ganz leise. Welches Wort sagt leise?"
                  - "Geht passt, aber es sagt nichts über leise. Wer rennt, ist schnell und oft laut."
                  - "Sie schleicht."
              - id: l1-f4
                type: true_false
                text: "Gehört Straße zum Wortfeld gehen?"
                say: "Gehört das Wort Straße zum Wortfeld gehen?"
                answer: false
                hints:
                  - "Kannst du Straße statt gehen sagen?"
                  - "Auf der Straße kann man gehen. Aber Straße ist ein Nomen, kein Verb."
                  - "Nein, Straße gehört nicht dazu."
              - id: l1-f5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit dem, was es bedeutet."
                pairs:
                  - { left: { text: "rennen" }, right: { text: "ganz schnell" } }
                  - { left: { text: "schleichen" }, right: { text: "ganz leise" } }
                  - { left: { text: "hüpfen" }, right: { text: "mit kleinen Sprüngen" } }
                hints:
                  - "Stell dir jedes Wort vor. Wie sieht das aus?"
                  - "Ein Hase hüpft. Ein Dieb schleicht."
                  - "Rennen: ganz schnell. Schleichen: ganz leise. Hüpfen: mit kleinen Sprüngen."

          - support: some
            tasks:
              - id: l1-s1
                type: highlight_in_text
                text: "Tippe auf die Wörter aus dem Wortfeld gehen."
                say: "Tippe auf alle Wörter, die zum Wortfeld gehen gehören."
                show: { drawn: letter-card, text: "Fuß laufen Weg spazieren stapfen" }
                spans: ["laufen", "spazieren", "stapfen"]
                hints: ["Kannst du das Wort statt gehen sagen?"]
              - id: l1-s2
                type: multiple_choice
                text: "Wer langsam und gemütlich geht, der ..."
                say: "Wer langsam und gemütlich geht, der ... Welches Wort passt?"
                options: ["spaziert", "rennt", "springt"]
                answer: "spaziert"
                hints: ["Welches Wort sagt: langsam und gemütlich?"]
              - id: l1-s3
                type: multiple_choice
                text: "Der Bus fährt gleich ab. Tim _ zur Haltestelle."
                say: "Der Bus fährt gleich ab. Wie kommt Tim zur Haltestelle?"
                options: ["rennt", "geht", "schleicht"]
                answer: "rennt"
                hints: ["Tim hat es eilig. Welches Wort ist das schnellste?"]
              - id: l1-s4
                type: true_false
                text: "Gehört marschieren zum Wortfeld gehen?"
                say: "Gehört das Wort marschieren zum Wortfeld gehen?"
                answer: true
                hints: ["Kannst du marschieren statt gehen sagen?"]
              - id: l1-s5
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Wort mit dem, was es bedeutet."
                pairs:
                  - { left: { text: "spazieren" }, right: { text: "langsam und gemütlich" } }
                  - { left: { text: "stapfen" }, right: { text: "mit schweren Schritten" } }
                  - { left: { text: "rennen" }, right: { text: "ganz schnell" } }
                hints: ["Im tiefen Schnee stapfst du."]

          - support: none
            tasks:
              - id: l1-n1
                type: highlight_in_text
                text: "Tippe auf die Wörter aus dem Wortfeld gehen."
                say: "Tippe auf alle Wörter, die zum Wortfeld gehen gehören."
                show: { drawn: letter-card, text: "schlendern Socke hüpfen Treppe flitzen" }
                spans: ["schlendern", "hüpfen", "flitzen"]
              - id: l1-n2
                type: multiple_choice
                text: "Wer auf einem Bein springt, der ..."
                say: "Wer auf einem Bein springt, der ... Welches Wort passt?"
                options: ["hüpft", "schleicht", "spaziert"]
                answer: "hüpft"
              - id: l1-n3
                type: multiple_choice
                text: "Im Garten liegt viel Schnee. Opa _ mit schweren Stiefeln durch den Garten."
                say: "Im Garten liegt viel Schnee. Wie geht Opa mit seinen schweren Stiefeln?"
                options: ["stapft", "flitzt", "hüpft"]
                answer: "stapft"
              - id: l1-n4
                type: true_false
                text: "Gehört Stiefel zum Wortfeld gehen?"
                say: "Gehört das Wort Stiefel zum Wortfeld gehen?"
                answer: false
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort gehört nicht ins Wortfeld gehen?"
                say: "Welches Wort gehört nicht ins Wortfeld gehen?"
                options: ["der Fuß", "flitzen", "schlendern"]
                answer: "der Fuß"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Lisa will niemanden wecken. Sie _ in die Küche."
            say: "Lisa will niemanden wecken. Wie geht sie in die Küche?"
            options: ["schleicht", "stapft", "rennt"]
            answer: "schleicht"
          - id: l1-c2
            type: highlight_in_text
            text: "Tippe auf die Wörter aus dem Wortfeld gehen."
            say: "Tippe auf alle Wörter, die zum Wortfeld gehen gehören."
            show: { drawn: letter-card, text: "Weg rennen spazieren Hose stapfen" }
            spans: ["rennen", "spazieren", "stapfen"]
          - id: l1-c3
            type: true_false
            text: "Gehört flitzen zum Wortfeld gehen?"
            say: "Gehört das Wort flitzen zum Wortfeld gehen?"
            answer: true
          - id: l1-c4
            type: multiple_choice
            text: "Wer langsam und ohne Eile durch die Stadt geht, der ..."
            say: "Wer langsam und ohne Eile durch die Stadt geht, der ... Welches Wort passt?"
            options: ["schlendert", "rennt", "stapft"]
            answer: "schlendert"
          - id: l1-c5
            type: multiple_choice
            text: "Die Kinder spielen Känguru. Sie _ über die Wiese."
            say: "Die Kinder spielen Känguru. Wie bewegen sie sich über die Wiese?"
            options: ["schleichen", "hüpfen", "stapfen"]
            answer: "hüpfen"
          - id: l1-c6
            type: true_false
            text: "Rennen, flitzen und Schuh gehören alle zum Wortfeld gehen. Stimmt das?"
            say: "Lies die drei Wörter. Gehören sie alle zum Wortfeld gehen? Stimmt das?"
            answer: false

  - n: 2
    title: { de: "Das treffende Wort", en: "The precise word" }
    goal:
      de: "Wähl das Wort, das am besten passt, so wie flüstern, wenn Mama ganz leise spricht."
      en: "Pick the word that fits best, like whisper when Mum speaks very quietly."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Wer ganz leise geht, der ..."
            say: "Wer ganz leise geht, der ... Welches Wort passt?"
            options: ["schleicht", "rennt", "stapft"]
            answer: "schleicht"
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Gehört hüpfen zum Wortfeld gehen?"
            say: "Gehört das Wort hüpfen zum Wortfeld gehen?"
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "sagen | rufen | flüstern | fragen | antworten | schreien"
            say: "Auch sagen hat ein Wortfeld. Wer ruft, ist laut. Wer flüstert, ist ganz leise. Wer fragt, will etwas wissen. Wer antwortet, sagt etwas auf eine Frage."
          - text: "„Psst, das Baby schläft“, sagt Mama. | „Psst, das Baby schläft“, flüstert Mama."
            say: "Lies beide Sätze. Im zweiten Satz weißt du sofort: Mama spricht ganz leise. Flüstert ist das treffende Wort. Es sagt genau, wie Mama spricht."
          - text: "leise: flüstern | laut: rufen, schreien | eine Frage: fragen"
            say: "Oft steht im Satz ein Hinweis. Steht da leise, passt flüstern. Ist jemand weit weg, passt rufen. Steht da ein Fragezeichen, passt fragen. Such den Hinweis, dann wähle das Wort."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Sortiere: Wortfeld gehen oder Wortfeld sagen?"
                say: "Sortiere die Wörter. Gehören sie zum Wortfeld gehen oder zum Wortfeld sagen?"
                bins:
                  - { id: gehen, show: { text: "gehen" }, say: "gehen" }
                  - { id: sagen, show: { text: "sagen" }, say: "sagen" }
                options:
                  - { text: "rennen", bin: gehen }
                  - { text: "rufen", bin: sagen }
                  - { text: "flüstern", bin: sagen }
                  - { text: "schleichen", bin: gehen }
                hints:
                  - "Frage bei jedem Wort: Mache ich das mit den Beinen oder mit dem Mund?"
                  - "Rennen und schleichen machst du mit den Beinen."
                  - "Gehen: rennen, schleichen. Sagen: rufen, flüstern."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf die Wörter aus dem Wortfeld sagen."
                say: "Tippe auf alle Wörter, die zum Wortfeld sagen gehören."
                show: { drawn: letter-card, text: "flüstern Mund fragen Zunge antworten" }
                spans: ["flüstern", "fragen", "antworten"]
                hints:
                  - "Kannst du das Wort statt sagen benutzen?"
                  - "Mund und Zunge brauchst du zum Sprechen. Aber sie sind Körperteile."
                  - "Tippe auf flüstern, fragen und antworten."
              - id: l2-f3
                type: multiple_choice
                text: "Ben steht weit weg am Zaun. „Komm her!“, _ Mia ganz laut."
                say: "Ben steht weit weg am Zaun. Mia will, dass er sie hört. Welches Wort passt am besten?"
                options: ["ruft", "sagt", "flüstert"]
                answer: "ruft"
                feedback:
                  "sagt": "Sagt passt, aber es sagt nicht, wie laut Mia ist. Es gibt ein besseres Wort."
                  "flüstert": "Wer flüstert, ist ganz leise. Ben ist weit weg."
                hints:
                  - "Such den Hinweis im Satz: weit weg, ganz laut."
                  - "Sagt passt, aber es sagt nicht, dass Mia laut ist."
                  - "Mia ruft."
              - id: l2-f4
                type: multiple_choice
                text: "„Wie spät ist es?“, _ Tom."
                say: "Tom will die Uhrzeit wissen. Welches Wort passt am besten?"
                options: ["fragt", "antwortet", "schreit"]
                answer: "fragt"
                hints:
                  - "Schau auf das Satzzeichen am Ende der wörtlichen Rede."
                  - "Da steht ein Fragezeichen. Tom will etwas wissen."
                  - "Tom fragt."
              - id: l2-f5
                type: multiple_choice
                text: "Welches Wort gehört nicht ins Wortfeld sagen?"
                say: "Welches Wort gehört nicht ins Wortfeld sagen?"
                options: ["laufen", "erzählen", "rufen"]
                answer: "laufen"
                hints:
                  - "Mache ich das mit dem Mund?"
                  - "Erzählen und rufen machst du mit dem Mund."
                  - "Laufen gehört nicht dazu. Es gehört zum Wortfeld gehen."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Sortiere: Wortfeld gehen oder Wortfeld sagen?"
                say: "Sortiere die Wörter. Gehören sie zum Wortfeld gehen oder zum Wortfeld sagen?"
                bins:
                  - { id: gehen, show: { text: "gehen" }, say: "gehen" }
                  - { id: sagen, show: { text: "sagen" }, say: "sagen" }
                options:
                  - { text: "hüpfen", bin: gehen }
                  - { text: "fragen", bin: sagen }
                  - { text: "spazieren", bin: gehen }
                  - { text: "schreien", bin: sagen }
                hints: ["Beine oder Mund?"]
              - id: l2-s2
                type: true_false
                text: "Gehört erzählen zum Wortfeld sagen?"
                say: "Gehört das Wort erzählen zum Wortfeld sagen?"
                answer: true
                hints: ["Kannst du erzählen statt sagen benutzen?"]
              - id: l2-s3
                type: multiple_choice
                text: "In der Bücherei ist es still. „Hast du ein Buch?“, _ Ali leise."
                say: "In der Bücherei ist es still. Ali spricht ganz leise. Welches Wort passt am besten?"
                options: ["flüstert", "sagt", "ruft"]
                answer: "flüstert"
                hints: ["Such den Hinweis: leise."]
              - id: l2-s4
                type: multiple_choice
                text: "„Wo ist mein Ball?“, fragt Lea. „Unter dem Bett“, _ Papa."
                say: "Lea fragt etwas. Papa sagt etwas darauf. Welches Wort passt am besten?"
                options: ["antwortet", "fragt", "flüstert"]
                answer: "antwortet"
                hints: ["Papa sagt etwas auf Leas Frage."]
              - id: l2-s5
                type: multiple_choice
                text: "Die Schnecke ist sehr langsam. Sie _ über das Blatt."
                say: "Die Schnecke ist sehr langsam. Wie bewegt sie sich über das Blatt?"
                options: ["kriecht", "rennt", "hüpft"]
                answer: "kriecht"
                hints: ["Eine Schnecke hat keine Beine. Sie bewegt sich ganz langsam auf dem Bauch."]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Sortiere: Wortfeld gehen oder Wortfeld sagen?"
                say: "Sortiere die Wörter. Gehören sie zum Wortfeld gehen oder zum Wortfeld sagen?"
                bins:
                  - { id: gehen, show: { text: "gehen" }, say: "gehen" }
                  - { id: sagen, show: { text: "sagen" }, say: "sagen" }
                options:
                  - { text: "stapfen", bin: gehen }
                  - { text: "antworten", bin: sagen }
                  - { text: "erzählen", bin: sagen }
                  - { text: "flitzen", bin: gehen }
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf die Wörter aus dem Wortfeld sagen."
                say: "Tippe auf alle Wörter, die zum Wortfeld sagen gehören."
                show: { drawn: letter-card, text: "rufen Ohr erzählen schreien Lippe" }
                spans: ["rufen", "erzählen", "schreien"]
              - id: l2-n3
                type: multiple_choice
                text: "Der Junge hat sich wehgetan. „Aua!“, _ er laut."
                say: "Der Junge hat sich wehgetan. Er ist ganz laut. Welches Wort passt am besten?"
                options: ["schreit", "sagt", "flüstert"]
                answer: "schreit"
              - id: l2-n4
                type: multiple_choice
                text: "Oma sitzt am Bett. Sie _ eine Geschichte von früher."
                say: "Oma sitzt am Bett und spricht von früher. Welches Wort passt am besten?"
                options: ["erzählt", "fragt", "ruft"]
                answer: "erzählt"
              - id: l2-n5
                type: multiple_choice
                text: "Die Pause ist gleich zu Ende. Die Kinder _ schnell zur Klasse."
                say: "Die Pause ist gleich zu Ende. Wie kommen die Kinder zur Klasse?"
                options: ["flitzen", "schleichen", "kriechen"]
                answer: "flitzen"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: collect
            type: sorting
            text: "Gehen oder sagen? Ordne jedes Wort seinem Wortfeld zu."
            say: "Zu welchem Wortfeld gehört jedes Wort? Zu gehen oder zu sagen?"
            bins:
              - { id: gehen, show: { text: "gehen" }, say: "gehen" }
              - { id: sagen, show: { text: "sagen" }, say: "sagen" }
            options:
              - { text: "schlendern", bin: gehen }
              - { text: "flüstern", bin: sagen }
              - { text: "marschieren", bin: gehen }
              - { text: "fragen", bin: sagen }
          - id: l2-c2
            part: collect
            type: highlight_in_text
            text: "Tippe auf die Wörter aus dem Wortfeld gehen."
            say: "Tippe auf alle Wörter, die zum Wortfeld gehen gehören."
            show: { drawn: letter-card, text: "Schritt flitzen schleichen Schuh kriechen" }
            spans: ["flitzen", "schleichen", "kriechen"]
          - id: l2-c3
            part: precise
            type: multiple_choice
            text: "Lena will Papa etwas Geheimes sagen. Sie _ ihm ins Ohr."
            say: "Lena will Papa etwas Geheimes sagen. Sie ... ihm ins Ohr. Welches Wort passt am besten?"
            options: ["flüstert", "sagt", "schreit"]
            answer: "flüstert"
          - id: l2-c4
            part: not-in-field
            type: true_false
            text: "Ohne Zunge kannst du nicht gut sprechen. Gehört Zunge deshalb ins Wortfeld sagen?"
            say: "Lies die Sätze. Gehört Zunge deshalb ins Wortfeld sagen?"
            answer: false
          - id: l2-c5
            part: precise
            type: multiple_choice
            text: "Der Hase hat Angst vor dem Fuchs. Er _ ganz schnell in seinen Bau."
            say: "Der Hase hat Angst vor dem Fuchs. Wie kommt er in seinen Bau?"
            options: ["flitzt", "schlendert", "spaziert"]
            answer: "flitzt"
          - id: l2-c6
            part: collect
            type: highlight_in_text
            text: "Tippe auf die Wörter aus dem Wortfeld sagen."
            say: "Lies die Wörter. Tippe auf alle, die zum Wortfeld sagen gehören."
            show: { drawn: letter-card, text: "brüllen Nase murmeln Stimme reden" }
            spans: ["brüllen", "murmeln", "reden"]
          - id: l2-c7
            part: collect
