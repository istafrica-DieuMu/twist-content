# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.verbs-base-form
skill: lit-de.verbs.base-form
curriculum: de-DE
language: de
title:
  de: Die Grundform finden
  en: Finding the base form
summary: >
  Zu jeder Verbform gehört eine Grundform, so steht das Verb im
  Wörterbuch: sie spielt, spielen. Lesson 1 finds it with the wir-Probe
  (wir spielen) for regular verbs; lesson 2 does the same for verbs whose
  vowel changes (sie läuft, laufen; du isst, essen; er gibt, geben), and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Verben, en: Verbs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.verbs.conjugate]
  also_practises: [lit-de.verbs.conjugate]
  vocabulary: { de: [Grundform, Verbform, Wörterbuch, wir-Probe, Endung] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: regular, what: { de: "die Grundform von Verben ohne Änderung finden (sie spielt, spielen)", en: "finding the base form of verbs that do not change (she plays, play)" } }
    - { id: vowel-change, what: { de: "die Grundform finden, wenn sich der Selbstlaut ändert (er läuft, laufen)", en: "finding the base form when the vowel changes (he runs, run)" } }
    - { id: in-sentence, what: { de: das Verb im Satz finden und seine Grundform nennen, en: finding the verb in a sentence and giving its base form } }
  misconceptions:
    - id: keep-the-ending
      what: Keeps the person ending and adds en (sie spielt, spielten or spieltn)
      addressed: lesson 1 Learn takes the ending off before adding en; the wir-Probe gives the whole word at once
    - id: keep-changed-vowel
      what: Keeps the changed vowel in the Grundform (er läuft, läufen; du gibst, giben)
      addressed: lesson 2 Learn uses the wir-Probe (wir laufen, wir geben); the changed vowel is an option with feedback in the full stage
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Die wir-Probe, en: The wir test }
    goal:
      de: "Finde die Grundform eines Verbs mit der wir-Probe, so wie bei sie spielt, wir spielen."
      en: "Find the base form of a verb with the wir test, like sie spielt, wir spielen."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welche Form passt zu wir? wir ___"
            say: "Welche Form passt zu wir? Lies die Formen."
            options: ["malt", "malen", "malst"]
            answer: "malen"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Stimmt das? du lachst"
            say: "Lies die Wörter auf der Karte. Ist die Form richtig?"
            show: { drawn: letter-card, text: "du lachst" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "sie spielt"
            say: "Lena spielt. Du willst nachschauen, wie man spielt schreibt, und nimmst ein Wörterbuch. Was glaubst du: Findest du dort das Wort spielt?"
          - text: "sie spielt → spielen"
            say: "Nein, da steht es nicht! Im Satz steht: sie spielt. Im Wörterbuch steht aber spielen. Das ist die Grundform."
          - text: "spielt → spiel → spielen"
            say: "So findest du die Grundform: Nimm die Endung weg, dann bleibt spiel. Häng en an: spielen."
          - text: "wir spielen"
            say: "Noch schneller geht die wir-Probe: Setz wir davor. Wir spielen. Was nach wir steht, ist fast immer die Grundform."
          - text: "Wusstest du? Im großen Duden stehen mehr als 140 000 Wörter."
            say: "Wusstest du? Im großen Wörterbuch Duden stehen mehr als hundertvierzigtausend Wörter. Aber jedes Verb steht dort nur einmal: in der Grundform. Spielt, spielst und spiele suchst du dort vergeblich."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Wie heißt die Grundform? er kocht"
                say: "Lies die Verbform. Welche ist die Grundform?"
                options: ["kochen", "kochten", "kocht"]
                answer: "kochen"
                feedback:
                  "kocht": "Das ist die Verbform aus dem Satz. Mach die wir-Probe: wir kochen."
                hints:
                  - "Mach die wir-Probe."
                  - "Wir kochen."
                  - "kochen."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Finde die Grundform."
                say: "Lies die Verbform. Welche Endung fehlt in der Grundform?"
                frame: "du malst → mal_"
                options: ["en", "st", "t"]
                answer: ["en"]
                hints:
                  - "Die Endung st kommt weg."
                  - "An mal kommt en."
                  - "malen."
              - id: l1-f3
                type: true_false
                text: "Stimmt das? ich lerne → lernen"
                say: "Lies die Karte. Ist das die richtige Grundform?"
                show: { drawn: letter-card, text: "ich lerne → lernen" }
                answer: true
                hints:
                  - "Mach die wir-Probe."
                  - "Wir lernen."
                  - "Ja."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jede Verbform mit ihrer Grundform."
                pairs:
                  - { left: { text: "sie hört" }, right: { text: "hören" } }
                  - { left: { text: "du baust" }, right: { text: "bauen" } }
                  - { left: { text: "ich frage" }, right: { text: "fragen" } }
                hints:
                  - "Mach mit jeder Form die wir-Probe."
                  - "Wir hören, wir bauen."
                  - "sie hört: hören. du baust: bauen. ich frage: fragen."
              - id: l1-f5
