            answer: ["en"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "sie läuft → läufen oder laufen?"
            say: "Sie läuft. Was glaubst du: Was steht im Wörterbuch, läufen oder laufen?"
          - text: "sie läuft → wir laufen → laufen"
            say: "Laufen! Manche Verben ändern sich mehr: sie läuft. Aus au wird äu. Die wir-Probe hilft: wir laufen. Die Grundform ist laufen, ohne Pünktchen."
          - text: "du isst → wir essen → essen"
            say: "Du isst. Hier wird aus e ein i. Wir essen: Die Grundform ist essen."
          - text: "er fährt → fahren · sie liest → lesen"
            say: "Er fährt, wir fahren: fahren. Sie liest, wir lesen: lesen. Im Wörterbuch steht immer die Grundform. Mit der wir-Probe findest du sie."

