# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.lengthen-bp-gk
skill: lit-de.spelling-strategies.lengthen-bp-gk
curriculum: de-DE
language: de
title:
  de: Verlängern bei b und p, g und k
  en: Lengthening for b and p, g and k
summary: >
  Verlängern works for b and p and for g and k too. Lesson 1 takes nouns
  (Korb, Körbe; Berg, Berge; Schrank, Schränke); lesson 2 takes Adjektive
  (gelb, gelbe; klug, kluge; stark, starke) and mixes all three letter
  pairs with d and t, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Rechtschreibstrategien, en: Spelling strategies }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling-strategies.lengthen-dt]
  also_practises: [lit-de.spelling-strategies.lengthen-dt, lit-de.nouns.plural]
  vocabulary: { de: [verlängern, Mehrzahl, Adjektiv, Endbuchstabe] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-what-you-hear
      what: Writes the end letter as it sounds (Korp for Korb, Tak for Tag)
      addressed: lesson 1 Learn hears Korb with p and Berg with k and shows why; a gap in every stage and misspelt word cards in l1-f4, l1-n4, l2-f4, l2-s4 and l2-c4 (Tak, Diep, gelp, Zwerk, Schrang)
    - id: always-soft
      what: After learning the rule, writes b or g everywhere, also where the long form has p or k (Schrang for Schrank)
      addressed: lesson 1 Learn shows Schrank, Schränke; l1-f5, l1-s4, l1-s5, l1-c3, l2-f2, l2-s5 and l2-n2 keep the k, and l2-c4 asks whether Schrang is right
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Korb und Berg", en: "Korb and Berg" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: fill_in_blank
            text: "d oder t? Verlängere."
            say: "Das Hemd. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "das Hem_"
            options: ["d", "t"]
            answer: ["d"]
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "ein Baum, zwei …"
            say: "Ein Baum, zwei … Wie heißt die Mehrzahl?"
            options: ["Bäume", "Baume", "Bäumen"]
            answer: "Bäume"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Korb → die Körbe"
            say: "Am Ende von Korb hörst du ein p. Verlängere: zwei Körbe. Jetzt hörst du das b. Korb schreibst du mit b."
          - text: "Berg → die Berge"
            say: "Bei Berg hörst du am Ende ein k. Verlängere: viele Berge. Du hörst ein g. Berg schreibst du mit g."
          - text: "Schrank → die Schränke"
            say: "Manchmal hörst du auch nach dem Verlängern ein k. Dann bleibt es beim k: der Schrank, die Schränke."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "b oder p? Verlängere."
                say: "Der Dieb. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Die_"
                options: ["b", "p"]
                answer: ["b"]
                hints:
                  - "Verlängere: ein Dieb, zwei …"
                  - "Zwei Diebe. In Diebe hörst du das b."
                  - "Dieb schreibt man mit b."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Der Weg. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der We_"
                options: ["g", "k"]
                answer: ["g"]
                hints:
                  - "Verlängere: ein Weg, viele …"
                  - "Viele Wege. In Wege hörst du ein g."
                  - "Weg schreibt man mit g."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort hilft dir bei Zwerg?"
                say: "Welches Wort hilft dir, wenn du Zwerg schreiben willst?"
                options: ["Zwerge", "zwei", "die Zwiebel"]
                answer: "Zwerge"
                feedback:
                  "zwei": "Zwei sieht nur ähnlich aus. Mach aus einem Zwerg mehrere."
                  "die Zwiebel": "Zwiebel sieht nur ähnlich aus. Mach aus einem Zwerg mehrere."
                hints:
                  - "Mach aus einem Zwerg mehrere."
                  - "Schneewittchen und die sieben … Da hörst du das g."
                  - "Tippe auf Zwerge."
              - id: l1-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Tak" }
                answer: false
                hints:
                  - "Verlängere das Wort: ein Tag, viele …"
                  - "Viele Tage. In Tage hörst du ein g."
                  - "Nein. Richtig ist Tag."
              - id: l1-f5
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Die Bank. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "die Ban_"
                options: ["g", "k"]
                answer: ["k"]
                hints:
                  - "Verlängere: eine Bank, zwei …"
                  - "Zwei Bänke. In Bänke hörst du ein k."
                  - "Bank schreibt man mit k."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "b oder p? Verlängere."
                say: "Der Zauberstab. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Zaubersta_"
                options: ["b", "p"]
                answer: ["b"]
                hints: ["Verlängere: ein Zauberstab, zwei …"]
              - id: l1-s2
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Die Burg. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "die Bur_"
                options: ["g", "k"]
                answer: ["g"]
                hints: ["Verlängere: eine Burg, zwei …"]
              - id: l1-s3
                type: multiple_choice
                text: "Welches Wort hilft dir bei Kalb?"
                say: "Welches Wort hilft dir, wenn du Kalb schreiben willst?"
                options: ["Kälber", "Kakao", "kalt"]
                answer: "Kälber"
                hints: ["Mach aus einem Kalb mehrere."]
              - id: l1-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Getränk" }
                answer: true
                hints: ["Verlängere: viele Getränke."]
              - id: l1-s5
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Das Geschenk. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "das Geschen_"
                options: ["g", "k"]
                answer: ["k"]
                hints: ["Verlängere: viele Geschenke."]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "b oder p? Verlängere."
                say: "Der Papierkorb. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Papierkor_"
                options: ["b", "p"]
                answer: ["b"]
              - id: l1-n2
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Der Schulweg. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Schulwe_"
                options: ["g", "k"]
                answer: ["g"]
              - id: l1-n3
                type: multiple_choice
                text: "Welches Wort hilft dir bei Zug?"
                say: "Welches Wort hilft dir, wenn du Zug schreiben willst?"
                options: ["Züge", "der Zucker", "zu"]
                answer: "Züge"
              - id: l1-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Diep" }
                answer: false
              - id: l1-n5
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Der Flug. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Flu_"
                options: ["g", "k"]
                answer: ["g"]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "g oder k? Verlängere."
            say: "Der Zweig. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "der Zwei_"
            options: ["g", "k"]
            answer: ["g"]
          - id: l1-c2
            type: fill_in_blank
            text: "b oder p? Verlängere."
            say: "Das Kalb. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "das Kal_"
            options: ["b", "p"]
            answer: ["b"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Park" }
            answer: true

  - n: 2
    title: { de: "Gelb, klug und stark", en: "Gelb, klug and stark" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "g oder k? Verlängere."
            say: "Der Berg. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "der Ber_"
            options: ["g", "k"]
            answer: ["g"]
            difficulty: easy
          - id: l2-w2
            type: multiple_choice
            text: "Welches Wort hilft dir bei Tag?"
            say: "Welches Wort hilft dir, wenn du Tag schreiben willst?"
            options: ["Tage", "die Tante", "die Tasse"]
            answer: "Tage"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "gelb → ein gelber Ball"
            say: "Auch bei Adjektiven hilft das Verlängern. Gelb: ein gelber Ball. Jetzt hörst du das b."
            show: { object: ball, colour: yellow }
          - text: "klug → ein kluges Kind"
            say: "Klug: ein kluges Kind. Du hörst ein g."
          - text: "stark → starke Arme"
            say: "Stark: starke Arme. Hier bleibt es beim k."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "b oder p? Verlängere das Adjektiv."
                say: "Die Katze ist lieb. Welcher Buchstabe fehlt am Ende von lieb? Verlängere das Adjektiv mit einem Nomen."
                frame: "lie_"
                options: ["b", "p"]
                answer: ["b"]
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Katze."
                  - "Eine liebe Katze. In liebe hörst du das b."
                  - "Lieb schreibt man mit b."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "g oder k? Verlängere das Adjektiv."
                say: "Das Kind ist krank. Welcher Buchstabe fehlt am Ende von krank? Verlängere das Adjektiv mit einem Nomen."
                frame: "kran_"
                options: ["g", "k"]
                answer: ["k"]
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Kind."
                  - "Ein krankes Kind. In krankes hörst du ein k."
                  - "Krank schreibt man mit k."
              - id: l2-f3
                type: multiple_choice
                text: "Was hilft dir bei halb?"
                say: "Was hilft dir, wenn du halb schreiben willst?"
                options: ["eine halbe Stunde", "der Hals", "hallo"]
                answer: "eine halbe Stunde"
                feedback:
                  "der Hals": "Hals sieht nur ähnlich aus. Setz zu halb ein Nomen dazu."
                  "hallo": "Hallo sieht nur ähnlich aus. Setz zu halb ein Nomen dazu."
                hints:
                  - "Setz zu halb ein Nomen dazu."
                  - "Eine halbe Stunde. In halbe hörst du das b."
                  - "Tippe auf eine halbe Stunde."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "gelp" }
                answer: false
                hints:
                  - "Setz ein Nomen dazu, zum Beispiel Ball."
                  - "Der gelbe Ball. In gelbe hörst du ein b."
                  - "Nein. Richtig ist gelb."
              - id: l2-f5
                type: fill_in_blank
                text: "Setz die Buchstaben ein."
                say: "Der Zwerg ist klug. Welche Buchstaben fehlen? Verlängere beide Wörter."
                frame: "Der Zwer_ ist klu_."
                options: ["g", "k"]
                answer: ["g", "g"]
                hints:
                  - "Verlängere beide Wörter: das Nomen mit der Mehrzahl, das Adjektiv mit einem Nomen."
                  - "Zwei Zwerge, ein kluger Zwerg. In beiden Wörtern hörst du ein g."
                  - "Zwerg mit g, klug mit g."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "g oder k? Verlängere."
                say: "Das Flugzeug. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "das Flugzeu_"
                options: ["g", "k"]
                answer: ["g"]
                hints: ["Verlängere: viele Flugzeuge."]
              - id: l2-s2
                type: multiple_choice
                text: "Was hilft dir bei stark?"
                say: "Was hilft dir, wenn du stark schreiben willst?"
                options: ["ein starkes Pferd", "der Stern", "der Stall"]
                answer: "ein starkes Pferd"
                hints: ["Setz ein Nomen dazu."]
              - id: l2-s3
                type: fill_in_blank
                text: "b oder p? Verlängere."
                say: "Der Korb. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
                frame: "der Kor_"
                options: ["b", "p"]
                answer: ["b"]
                hints: ["Verlängere: zwei Körbe."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Zwerk" }
                answer: false
                hints: ["Verlängere: sieben Zwerge."]
              - id: l2-s5
                type: fill_in_blank
                text: "Setz die Buchstaben ein."
                say: "Das Kalb ist krank. Welche Buchstaben fehlen? Verlängere beide Wörter."
                frame: "Das Kal_ ist kran_."
                options: ["b", "p", "g", "k"]
                answer: ["b", "k"]
                hints: ["Verlängere beide Wörter: Kälber, kranke."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "b oder p? Verlängere das Adjektiv."
                say: "Die Banane ist gelb. Welcher Buchstabe fehlt am Ende von gelb? Verlängere das Adjektiv mit einem Nomen."
                frame: "gel_"
                options: ["b", "p"]
                answer: ["b"]
              - id: l2-n2
                type: fill_in_blank
                text: "g oder k? Verlängere das Adjektiv."
                say: "Der Löwe ist stark. Welcher Buchstabe fehlt am Ende von stark? Verlängere das Adjektiv mit einem Nomen."
                frame: "star_"
                options: ["g", "k"]
                answer: ["k"]
              - id: l2-n3
                type: multiple_choice
                text: "Was hilft dir bei klug?"
                say: "Was hilft dir, wenn du klug schreiben willst?"
                options: ["ein kluger Junge", "die Kugel", "die Klingel"]
                answer: "ein kluger Junge"
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Weg" }
                answer: true
              - id: l2-n5
                type: fill_in_blank
                text: "Setz die Buchstaben ein."
                say: "Der Hund ist lieb. Welche Buchstaben fehlen? Verlängere beide Wörter."
                frame: "Der Hun_ ist lie_."
                options: ["d", "t", "b", "p"]
                answer: ["d", "b"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "g oder k? Verlängere."
            say: "Der Schlafanzug. Welcher Buchstabe fehlt am Ende? Verlängere das Wort."
            frame: "der Schlafanzu_"
            options: ["g", "k"]
            answer: ["g"]
          - id: l2-c2
            type: fill_in_blank
            text: "b oder p? Verlängere das Adjektiv."
            say: "Das Glas ist halb voll. Welcher Buchstabe fehlt am Ende von halb? Verlängere das Adjektiv mit einem Nomen."
            frame: "hal_"
            options: ["b", "p"]
            answer: ["b"]
          - id: l2-c3
            type: multiple_choice
            text: "Welches Wort hilft dir bei Burg?"
            say: "Welches Wort hilft dir, wenn du Burg schreiben willst?"
            options: ["Burgen", "die Bürste", "bunt"]
            answer: "Burgen"
          - id: l2-c4
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Schrang" }
            answer: false
          - id: l2-c5
            type: fill_in_blank
            text: "Setz die Buchstaben ein."
            say: "Der Zug ist gelb. Welche Buchstaben fehlen? Verlängere beide Wörter."
            frame: "Der Zu_ ist gel_."
            options: ["g", "k", "b", "p"]
            answer: ["g", "b"]
