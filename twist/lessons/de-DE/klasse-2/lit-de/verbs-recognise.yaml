# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.verbs-recognise
skill: lit-de.verbs.recognise
curriculum: de-DE
language: de
title:
  de: Verben erkennen
  en: Recognising verbs
summary: >
  Verben sagen, was jemand tut oder was geschieht. Lesson 1 finds the verb
  in short sentences with the question "Was tut …?" and the ich-Probe (ich
  laufe, ich male); lesson 2 adds verbs for things that happen (es regnet,
  das Eis schmilzt), tells verbs from Nomen and Adjektiven, and ends with
  the skill check.
metadata:
  year: klasse-2
  topic: { de: Verben, en: Verbs }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.nouns.recognise]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Verb, Tuwort, tun, geschehen, Nomen, Adjektiv, ich-Probe] }
  forms: [text, audio, picture]
  drawn: [letter-card]
  facets: []
  parts:
    - { id: in-sentence, what: { de: das Verb im Satz finden, en: finding the verb in a sentence } }
    - { id: happening, what: { de: "Verben für das, was geschieht oder was man still tut (es regnet, schlafen)", en: "verbs for what happens or quiet doing (it rains, sleep)" } }
    - { id: word-class, what: { de: Verben von Nomen und Adjektiven unterscheiden, en: telling verbs from nouns and adjectives } }
  misconceptions:
    - id: verb-is-action-word-only
      what: Thinks only movements are verbs, so misses verbs like schlafen, denken, regnen
      addressed: lesson 2 Learn shows verbs for things that happen and for quiet doing (schlafen, denken); tasks ask for them in each stage
    - id: noun-for-the-doing
      what: Picks the noun that does something (der Hund) instead of what it does (bellt)
      addressed: Learn asks "Was tut der Hund?"; feedback on the noun says it names who does it
    - id: adjective-as-verb
      what: Takes a describing word for a verb (schnell, laut)
      addressed: lesson 2 sorts verbs from Adjektiven with the ich-Probe; feedback says "ich schnell" does not work
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Was tut jemand?", en: "What is someone doing?" }
    goal:
      de: "Finde das Verb, das sagt, was jemand tut. Die ich-Probe hilft dir, so wie bei ich male."
      en: "Find the verb that says what someone does. The ich test helps you, like ich male, I paint."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "Welches Wort ist ein Nomen? Alle Wörter sind klein geschrieben."
            say: "Die Wörter sind klein geschrieben. Welches ist ein Nomen?"
            options: ["katze", "schnell", "rennen"]
            answer: "katze"
            difficulty: easy
          - id: l1-w2
            type: true_false
            text: "Ist „Ball“ ein Nomen?"
            say: "Ist das Wort auf der Karte ein Nomen?"
            show: { drawn: letter-card, text: "der Ball" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Was tut der Hund?"
            say: "Schau dir den Hund an. Was glaubst du: Was tut ein Hund, wenn es an der Tür klingelt?"
            show: { object: dog }
          - text: "Der Hund bellt."
            say: "Er bellt! Der Hund bellt. Was tut der Hund? Er bellt. Bellt ist ein Verb. Verben sagen, was jemand tut."
            show: { object: dog }
          - text: "Lina malt ein Bild."
            say: "Lina malt ein Bild. Was tut Lina? Sie malt. Malt ist das Verb. Verben nennt man auch Tuwörter."
            show: { object: paint }
          - text: "ich male · ich laufe · ich Hund?"
            say: "Ein Trick: die ich-Probe. Passt ich davor, ist es oft ein Verb: ich male, ich laufe. Ich Hund geht nicht. Hund ist ein Nomen."
          - text: "Wusstest du? Der Löwe brüllt, das Pferd wiehert, der Esel iaht."
            say: "Wusstest du? Für viele Tierlaute gibt es ein eigenes Verb. Der Löwe brüllt, das Pferd wiehert, der Esel iaht und die Kuh muht. Probier es aus: Wie klingt es, wenn ein Löwe brüllt?"
            show: { object: lion }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Der Vogel singt. Welches Wort ist das Verb?"
                say: "Lies den Satz. Welches Wort ist das Verb?"
                options: ["Der", "Vogel", "singt"]
                answer: "singt"
                feedback:
                  "Vogel": "„Vogel“ ist ein Nomen. Es sagt, wer etwas tut. Was tut der Vogel?"
                hints:
                  - "Frag: Was tut der Vogel?"
                  - "Das Verb sagt, was der Vogel macht."
                  - "Das Verb ist „singt“."
                difficulty: easy
              - id: l1-f2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Tom springt über den Bach." }
                spans: ["springt"]
                hints:
                  - "Frag: Was tut Tom?"
                  - "Mach die ich-Probe mit jedem Wort."
                  - "Das Verb ist „springt“."
              - id: l1-f3
                type: true_false
                text: "Ist „lachen“ ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "lachen" }
                answer: true
                hints:
                  - "Mach die ich-Probe."
                  - "Ich lache: das passt."
                  - "Ja, „lachen“ ist ein Verb."
              - id: l1-f4
                type: multiple_choice
                text: "Welches Wort ist ein Verb?"
                say: "Lies die drei Wörter. Welches ist ein Verb?"
                options: ["schwimmen", "Fisch", "nass"]
                answer: "schwimmen"
                feedback:
                  "nass": "„Nass“ sagt, wie etwas ist. „Ich nass“ passt nicht. Das ist kein Verb."
                hints:
                  - "Welches Wort sagt, was man tut?"
                  - "Mach die ich-Probe: „ich schwimme“, „ich Fisch“, „ich nass“."
                  - "Das Verb ist „schwimmen“."
              - id: l1-f5
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Oma backt einen Kuchen." }
                spans: ["backt"]
                hints:
                  - "Frag: Was tut Oma?"
                  - "„Kuchen“ ist ein Nomen. Du schreibst es groß."
                  - "Das Verb ist „backt“."
              - id: l1-f6
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Lies den Satz. Setz das passende Verb ein."
                frame: "Die Kinder _ im Garten."
                options: ["spielen", "Garten", "laut"]
                answer: ["spielen"]
                feedback:
                  "Garten": "Die Kinder Garten im Garten? Das klingt lustig, sagt aber nichts. Was tun die Kinder?"
                hints:
                  - "Es fehlt, was die Kinder tun."
                  - "„Garten“ ist ein Nomen, „laut“ sagt, wie etwas ist."
                  - "Die Kinder spielen im Garten."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Die Katze schläft. Welches Wort ist das Verb?"
                say: "Lies den Satz. Welches Wort ist das Verb?"
                show: { object: cat }
                options: ["Die", "Katze", "schläft"]
                answer: "schläft"
                hints: ["Frag: Was tut die Katze?"]
              - id: l1-s2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Papa liest die Zeitung." }
                spans: ["liest"]
                hints: ["Was tut Papa?"]
              - id: l1-s3
                type: true_false
                text: "Ist das Wort auf der Karte ein Verb? Es ist klein geschrieben."
                say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Ist es ein Verb?"
                show: { drawn: letter-card, text: "tisch" }
                answer: false
                hints: ["Mach die ich-Probe."]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort ist ein Verb?"
                say: "Lies die drei Wörter. Welches ist ein Verb?"
                options: ["klein", "Bett", "rufen"]
                answer: "rufen"
                hints: ["Welches Wort passt nach „ich“?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Lies den Satz. Setz das passende Verb ein."
                frame: "Ben _ ein Eis."
                options: ["isst", "Eis", "kalt"]
                answer: ["isst"]
                feedback:
                  "Eis": "Ben Eis ein Eis? Da ist ein Eis zu viel! Was tut Ben mit dem Eis?"
                hints: ["Was tut Ben mit dem Eis?"]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Das Baby weint. Welches Wort ist das Verb?"
                say: "Lies den Satz. Welches Wort ist das Verb?"
                show: { object: baby }
                options: ["Das", "Baby", "weint"]
                answer: "weint"
              - id: l1-n2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Mia trinkt warmen Tee." }
                spans: ["trinkt"]
              - id: l1-n3
                type: true_false
                text: "Ist „tanzen“ ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "tanzen" }
                answer: true
              - id: l1-n4
                type: multiple_choice
                text: "Welches Wort ist ein Verb?"
                say: "Lies die drei Wörter. Welches ist ein Verb?"
                options: ["Hose", "bunt", "waschen"]
                answer: "waschen"
              - id: l1-n5
                type: fill_in_blank
                text: "Welches Verb passt?"
                say: "Lies den Satz. Setz das passende Verb ein."
                show: { object: frog }
                frame: "Der Frosch _ ins Wasser."
                options: ["hüpft", "Teich", "grün"]
                answer: ["hüpft"]

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Der Bus hält an der Schule." }
            spans: ["hält"]
          - id: l1-c2
            type: multiple_choice
            text: "Welches Wort ist ein Verb?"
            say: "Lies die drei Wörter. Welches ist ein Verb?"
            options: ["bauen", "Haus", "hoch"]
            answer: "bauen"
          - id: l1-c3
            type: true_false
            text: "Ist „leise“ ein Verb?"
            say: "Lies das Wort auf der Karte. Ist es ein Verb?"
            show: { drawn: letter-card, text: "leise" }
            answer: false
          - id: l1-c4
            type: multiple_choice
            text: "Der Hund buddelt tief im Sand. Welches Wort ist das Verb?"
            say: "Lies den Satz. Welches Wort ist das Verb?"
            options: ["Hund", "buddelt", "tief"]
            answer: "buddelt"
          - id: l1-c5
            type: fill_in_blank
            text: "Welches Verb passt?"
            say: "Lies den Satz. Setz das passende Verb ein."
            frame: "Max _ ein Lied."
            options: ["pfeift", "Lied", "fröhlich"]
            answer: ["pfeift"]
          - id: l1-c6
            type: true_false
            text: "Im Satz „Ida kämmt ihre Puppe.“ ist „kämmt“ das Verb. Stimmt das?"
            say: "Lies den Satz und das Wort. Ist das Wort das Verb? Stimmt das?"
            answer: true

  - n: 2
    title: { de: "Verb, Nomen oder Adjektiv?", en: "Verb, noun or adjective?" }
    goal:
      de: "Finde auch Verben dafür, was geschieht, so wie es regnet, und halte sie von Nomen und Adjektiven auseinander."
      en: "Find verbs for things that happen too, like it is raining, and tell them apart from nouns and adjectives."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Ali kauft Brot." }
            spans: ["kauft"]
            difficulty: easy
          - id: l2-w2
            type: true_false
            text: "Ist „rennen“ ein Verb?"
            say: "Lies das Wort auf der Karte. Ist es ein Verb?"
            show: { drawn: letter-card, text: "rennen" }
            answer: true
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Es regnet."
            say: "Es regnet. Hier tut niemand etwas. Was glaubst du: Ist regnet trotzdem ein Verb?"
            show: { object: rain }
          - text: "Es regnet. · Das Eis schmilzt."
            say: "Ja! Verben sagen auch, was geschieht. Es regnet. Das Eis schmilzt. Regnet und schmilzt sind Verben."
          - text: "schlafen · denken · wohnen"
            say: "Nicht jedes Verb ist laut oder schnell. Schlafen, denken und wohnen sind auch Verben: ich schlafe, ich denke, ich wohne."
          - text: "der Hase · schnell · hoppeln"
            say: "Drei Wortarten: Hase ist ein Nomen, man kann der davor sagen. Schnell ist ein Adjektiv, es sagt, wie etwas ist. Hoppeln ist ein Verb: ich hopple. Ich schnell passt nicht."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: sorting
                text: "Verb oder Adjektiv?"
                say: "Lies die Wörter. Sortiere: Was tut man, oder wie ist etwas?"
                option_audio: false
                bins:
                  - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
                options:
                  - { text: "kochen", bin: verb }
                  - { text: "warm", bin: adj }
                  - { text: "klettern", bin: verb }
                  - { text: "müde", bin: adj }
                hints:
                  - "Mach die ich-Probe mit jedem Wort."
                  - "„Ich koche“, „ich klettere“: Das passt."
                  - "„Kochen“ und „klettern“ sind Verben, „warm“ und „müde“ sind Adjektive."
                difficulty: easy
              - id: l2-f2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Am Morgen scheint die Sonne." }
                spans: ["scheint"]
                hints:
                  - "Was geschieht am Morgen?"
                  - "Die Sonne tut etwas."
                  - "Das Verb ist „scheint“."
              - id: l2-f3
                type: multiple_choice
                text: "Welche Wortart ist „schnell“?"
                say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "schnell" }
                options: ["Verb", "Nomen", "Adjektiv"]
                answer: "Adjektiv"
                feedback:
                  "Verb": "„Ich schnell“ passt nicht. „Schnell“ sagt, wie jemand ist oder läuft."
                hints:
                  - "Passt „ich“ davor? Passt „der“, „die“ oder „das“ davor?"
                  - "„Schnell“ sagt, wie etwas ist."
                  - "„Schnell“ ist ein Adjektiv."
              - id: l2-f4
                type: true_false
                text: "Ist „schmelzen“ ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "schmelzen" }
                answer: true
                hints:
                  - "Sagt das Wort, was geschieht?"
                  - "Der Schnee schmilzt."
                  - "Ja, „schmelzen“ ist ein Verb."
              - id: l2-f5
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Opa denkt an seinen Urlaub." }
                spans: ["denkt"]
                hints:
                  - "Was tut Opa?"
                  - "Auch „denken“ ist etwas, das man tut: ich denke."
                  - "Das Verb ist „denkt“."
              - id: l2-f6
                type: multiple_choice
                text: "Welches Wort ist kein Verb?"
                say: "Lies die drei Wörter. Welches ist kein Verb?"
                options: ["wohnen", "fröhlich", "schlafen"]
                answer: "fröhlich"
                hints:
                  - "Mach mit jedem Wort die ich-Probe."
                  - "„Ich wohne“, „ich schlafe“."
                  - "„Fröhlich“ ist kein Verb. Es ist ein Adjektiv."

          - support: some
            tasks:
              - id: l2-s1
                type: sorting
                text: "Verb oder Adjektiv?"
                say: "Lies die Wörter. Sortiere: Was tut man, oder wie ist etwas?"
                option_audio: false
                bins:
                  - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
                options:
                  - { text: "flüstern", bin: verb }
                  - { text: "dunkel", bin: adj }
                  - { text: "rutschen", bin: verb }
                  - { text: "süß", bin: adj }
                hints: ["Passt „ich“ davor?"]
              - id: l2-s2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Im Winter schneit es oft." }
                spans: ["schneit"]
                hints: ["Was geschieht im Winter?"]
              - id: l2-s3
                type: multiple_choice
                text: "Welche Wortart ist das? Das Wort ist klein geschrieben."
                say: "Lies das Wort auf der Karte. Es ist klein geschrieben. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "wolke" }
                options: ["Verb", "Nomen", "Adjektiv"]
                answer: "Nomen"
                hints: ["Kannst du der, die oder das davor sagen?"]
              - id: l2-s4
                type: true_false
                text: "Ist „laut“ ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "laut" }
                answer: false
                hints: ["Mach die ich-Probe."]
              - id: l2-s5
                type: multiple_choice
                text: "Welches Wort ist kein Verb?"
                say: "Lies die drei Wörter. Welches ist kein Verb?"
                options: ["blühen", "träumen", "nett"]
                answer: "nett"
                hints: ["Welches Wort sagt, wie jemand ist?"]

          - support: none
            tasks:
              - id: l2-n1
                type: sorting
                text: "Verb oder Adjektiv?"
                say: "Lies die Wörter. Sortiere: Was tut man, oder wie ist etwas?"
                option_audio: false
                bins:
                  - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
                  - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
                options:
                  - { text: "schreiben", bin: verb }
                  - { text: "weich", bin: adj }
                  - { text: "hören", bin: verb }
                  - { text: "alt", bin: adj }
              - id: l2-n2
                type: highlight_in_text
                text: "Tippe auf das Verb."
                say: "Lies den Satz. Tippe auf das Verb."
                show: { drawn: letter-card, text: "Der Wind weht über das Feld." }
                spans: ["weht"]
              - id: l2-n3
                type: multiple_choice
                text: "Welche Wortart ist „warten“?"
                say: "Lies das Wort auf der Karte. Welche Wortart ist es?"
                show: { drawn: letter-card, text: "warten" }
                options: ["Verb", "Nomen", "Adjektiv"]
                answer: "Verb"
              - id: l2-n4
                type: true_false
                text: "Ist „regnen“ ein Verb?"
                say: "Lies das Wort auf der Karte. Ist es ein Verb?"
                show: { drawn: letter-card, text: "regnen" }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welches Wort ist kein Verb?"
                say: "Lies die drei Wörter. Welches ist kein Verb?"
                options: ["sitzen", "bequem", "stehen"]
                answer: "bequem"

      - activity: check
        size: skill
        draw: 5
        tasks:
          - id: l2-c1
            part: in-sentence
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Lea füttert die Hühner." }
            spans: ["füttert"]
          - id: l2-c2
            part: happening
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Nachts leuchten die Sterne." }
            spans: ["leuchten"]
          - id: l2-c3
            part: word-class
            type: sorting
            text: "Verb oder Adjektiv?"
            say: "Lies die Wörter. Sortiere sie."
            option_audio: false
            bins:
              - { id: verb, show: { text: "Verb: ich …" }, say: "Verb" }
              - { id: adj, show: { text: "Adjektiv: wie?" }, say: "Adjektiv" }
            options:
              - { text: "pflücken", bin: verb }
              - { text: "rund", bin: adj }
              - { text: "glauben", bin: verb }
              - { text: "spitz", bin: adj }
          - id: l2-c4
            part: word-class
            type: multiple_choice
            text: "Der Clown ist lustig. Welche Wortart ist „lustig“?"
            say: "Lies den Satz auf der Karte. Welche Wortart ist das Wort lustig?"
            show: { drawn: letter-card, text: "Der Clown ist lustig." }
            options: ["Verb", "Nomen", "Adjektiv"]
            answer: "Adjektiv"
          - id: l2-c5
            part: word-class
            type: multiple_choice
            text: "Welches Wort ist ein Verb?"
            say: "Lies die drei Wörter. Welches ist ein Verb?"
            options: ["Blume", "wachsen", "gelb"]
            answer: "wachsen"
          - id: l2-c6
            part: in-sentence
            type: highlight_in_text
            text: "Tippe auf das Verb."
            say: "Lies den Satz. Tippe auf das Verb."
            show: { drawn: letter-card, text: "Der Hahn kräht laut auf dem Zaun." }
            spans: ["kräht"]
          - id: l2-c7
            part: in-sentence
            type: multiple_choice
            text: "Jonas wirft den Ball weit. Welches Wort ist das Verb?"
            say: "Lies den Satz. Welches Wort ist das Verb?"
            options: ["Jonas", "wirft", "weit"]
            answer: "wirft"
          - id: l2-c8
            part: in-sentence
            type: fill_in_blank
            text: "Welches Verb passt in den Satz?"
            say: "Lies den Satz. Welches Verb passt hinein?"
            frame: "Die Kuh _ Gras."
            options: ["frisst", "Wiese", "satt"]
            answer: ["frisst"]
          - id: l2-c9
            part: in-sentence
            type: highlight_in_text
