# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.compound-nouns
skill: lit-de.nouns.compounds
curriculum: de-DE
language: de
title:
  de: Zusammengesetzte Nomen
  en: Compound nouns
summary: >
  Two nouns make a new one: der Baum und das Haus werden das Baumhaus.
  Lesson 1 builds compounds from two pictures; lesson 2 splits them into
  their parts and finds what the word means (ein Baumhaus ist ein Haus);
  lesson 3 finds the article from the last word and ends with the skill
  check. Most compounds have no joining letter; a few have one
  (Kinderzimmer, Sonnenhut), and lesson 3 says so.
metadata:
  year: klasse-2
  topic: { de: Nomen, en: Nouns }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.nouns.articles]
  also_practises: [lit-de.nouns.recognise]
  vocabulary: { de: [Nomen, zusammengesetzt, Bestimmungswort, Grundwort, Artikel, der, die, das] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: build, what: { de: aus zwei Nomen ein zusammengesetztes Nomen bilden, en: building a compound noun from two nouns } }
    - { id: split, what: { de: "zusammengesetzte Nomen zerlegen und verstehen (ein Baumhaus ist ein Haus)", en: "splitting compound nouns and saying what they mean" } }
    - { id: article, what: { de: den Artikel vom letzten Wort bestimmen, en: taking the article from the last word } }
  misconceptions:
    - id: first-word-article
      what: Takes the article of the first word (der Baum, so der Baumhaus)
      addressed: lesson 3 Learn says "Das letzte Wort bestimmt den Artikel" with both articles shown; feedback on der Baumhaus and die Handschuh says so
    - id: meaning-order
      what: Thinks a Baumhaus is a kind of tree
      addressed: lesson 2 asks "Was ist ein Baumhaus?" with both readings as options; Learn says the last word says what it is
    - id: two-capitals
      what: Writes the second part with a capital (BaumHaus)
      addressed: lesson 1 Learn and fill-in tasks show the compound with one capital only
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: Aus zwei Nomen wird eins, en: Two nouns make one }
    goal:
      de: "Setz zwei Nomen zu einem neuen Wort zusammen, so wie Baum und Haus zum Baumhaus."
      en: "Put two nouns together to make a new word, like tree and house make treehouse."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "der, die oder das? Haus"
            say: "Welcher Artikel passt zu Haus?"
            show: { object: house }
            options: ["der", "die", "das"]
            answer: "das"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "der, die oder das? Baum"
            say: "Welcher Artikel passt zu Baum?"
            show: { object: tree }
            options: ["der", "die", "das"]
            answer: "der"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Baum + Haus = ?"
            say: "Hier sind zwei Nomen: der Baum und das Haus. Was glaubst du: Welches neue Wort entsteht, wenn du sie zusammensetzt?"
            show: { objects: [tree, house] }
          - text: "das Baumhaus"
            say: "Wir setzen sie zusammen: das Baumhaus. Aus zwei Nomen wird ein neues Nomen, ein zusammengesetztes Nomen."
            show: { objects: [tree, house] }
          - text: "Baumhaus, nicht BaumHaus"
            say: "Ein Nomen schreibt man groß. Das zusammengesetzte Nomen ist ein Wort, deshalb gibt es nur einen großen Buchstaben, ganz vorne."
          - text: "Wusstest du? Donau + Dampf + Schiff + Fahrt = Donaudampfschifffahrt"
            say: "Wusstest du? Man kann auch mehr als zwei Nomen zusammensetzen. Donau, Dampf, Schiff und Fahrt werden zur Donaudampfschifffahrt. Das ist ein einziges Wort, und es hat sogar drei f hintereinander!"
            show: { object: ship }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort entsteht?"
                say: "Apfel und Baum. Welches Wort entsteht?"
                show: { objects: [apple, tree] }
                options: ["Apfelbaum", "Baumapfel", "Apfelhaus"]
                answer: "Apfelbaum"
                feedback:
                  "Baumapfel": "Ein Baumapfel wäre ein Apfel, in dem ein Baum wächst. Erst Apfel, dann Baum."
                hints:
                  - "Sag beide Wörter nacheinander."
                  - "Erst Apfel, dann Baum."
                  - "Apfel und Baum: Apfelbaum."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Setz zusammen."
                say: "Hand und Schuh. Welches Wort entsteht?"
                show: { objects: [hand, shoe] }
                frame: "Hand + Schuh = _"
                options: ["Handschuh", "Schuhhand", "HandSchuh"]
                option_audio: false
                answer: ["Handschuh"]
                feedback:
                  "HandSchuh": "Das ist ein Wort. Nur der erste Buchstabe ist groß."
                hints:
                  - "Erst Hand, dann Schuh."
                  - "Ein Wort, nur vorne groß."
                  - "Handschuh."
              - id: l1-f3
                type: multiple_choice
                text: "Welches Wort entsteht?"
                say: "Tisch und Lampe. Welches Wort entsteht?"
                show: { objects: [table, lamp] }
                options: ["Tischlampe", "Lampentisch", "Tischbein"]
                answer: "Tischlampe"
                hints:
                  - "Erst Tisch, dann Lampe."
                  - "Sag sie zusammen."
                  - "Tischlampe."
              - id: l1-f4
                type: true_false
                text: "Kuh + Glocke = Kuhglocke. Stimmt das?"
                say: "Kuh und Glocke. Wird daraus die Kuhglocke?"
                show: { objects: [cow, bell] }
                answer: true
                hints:
                  - "Erst Kuh, dann Glocke."
                  - "Zusammen: Kuhglocke."
                  - "Ja."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Wort entsteht?"
                say: "Brot und Messer. Welches Wort entsteht?"
                show: { objects: [bread, knife] }
                options: ["Brotmesser", "Messerbrot", "Brotkorb"]
                answer: "Brotmesser"
                feedback:
                  "Messerbrot": "Ein Brot aus Messern? Autsch! Erst Brot, dann Messer."
                hints:
                  - "Erst Brot, dann Messer."
                  - "Sag sie zusammen."
                  - "Brotmesser."
              - id: l1-f6
                type: matching
                text: "Was passt zusammen?"
                say: "Welches Bild gehört zu welchem Wort? Die Bilder sagen ihr Wort, wenn du sie antippst."
                option_audio: false
                pairs:
                  - { left: { object: tree }, right: { text: "Baumhaus" } }
                  - { left: { object: hand }, right: { text: "Handspiegel" } }
                  - { left: { object: table }, right: { text: "Tischbein" } }
                hints:
                  - "Mit welchem Wort fängt jedes lange Wort an?"
                  - "Baumhaus fängt mit Baum an."
                  - "Baum zu Baumhaus, Hand zu Handspiegel, Tisch zu Tischbein."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort entsteht?"
                say: "Haus und Schuh. Welches Wort entsteht?"
                show: { objects: [house, shoe] }
                options: ["Hausschuh", "Schuhhaus", "Haustür"]
                answer: "Hausschuh"
                hints: ["Erst Haus, dann Schuh."]
              - id: l1-s2
                type: fill_in_blank
                text: "Setz zusammen."
                say: "Tisch und Bein. Welches Wort entsteht?"
                show: { objects: [table, leg] }
                frame: "Tisch + Bein = _"
                options: ["Tischbein", "Beintisch", "TischBein"]
                option_audio: false
                answer: ["Tischbein"]
                hints: ["Ein Wort, nur vorne groß."]
              - id: l1-s3
                type: true_false
                text: "Hand + Spiegel = Spiegelhand. Stimmt das?"
                say: "Hand und Spiegel. Wird daraus Spiegelhand?"
                show: { objects: [hand, mirror] }
                answer: false
                hints: ["Welches Wort kommt zuerst?"]
              - id: l1-s4
                type: multiple_choice
                text: "Welches Wort entsteht?"
                say: "Baum und Haus. Welches Wort entsteht?"
                show: { objects: [tree, house] }
                options: ["Hausbaum", "Baumhaus", "Apfelbaum"]
                answer: "Baumhaus"
                hints: ["Erst Baum, dann Haus."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben? Lies genau."
                options: ["Kuhglocke", "KuhGlocke", "kuhglocke"]
                answer: "Kuhglocke"
                option_audio: false
                hints: ["Nomen schreibt man groß, aber nur vorne."]
              - id: l1-s6
                type: fill_in_blank
                text: "Setz zusammen."
                say: "Apfel und Baum. Welches Wort entsteht?"
                frame: "Apfel + Baum = _"
                options: ["Apfelbaum", "Baumapfel", "ApfelBaum"]
                option_audio: false
                answer: ["Apfelbaum"]
                hints: ["Erst Apfel, dann Baum."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort entsteht?"
                say: "Hand und Spiegel. Welches Wort entsteht?"
                show: { objects: [hand, mirror] }
                options: ["Handspiegel", "Spiegelhand", "Handschuh"]
                answer: "Handspiegel"
              - id: l1-n2
                type: fill_in_blank
                text: "Setz zusammen."
                say: "Brot und Messer. Welches Wort entsteht?"
                frame: "Brot + Messer = _"
                options: ["Brotmesser", "Messerbrot", "BrotMesser"]
                option_audio: false
                answer: ["Brotmesser"]
              - id: l1-n3
                type: true_false
                text: "Tisch + Lampe = Tischlampe. Stimmt das?"
                say: "Tisch und Lampe. Wird daraus die Tischlampe?"
                show: { objects: [table, lamp] }
                answer: true
              - id: l1-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Welches Bild gehört zu welchem Wort? Die Bilder sagen ihr Wort, wenn du sie antippst."
                option_audio: false
                pairs:
                  - { left: { object: apple }, right: { text: "Apfelbaum" } }
                  - { left: { object: cow }, right: { text: "Kuhglocke" } }
                  - { left: { object: bread }, right: { text: "Brotmesser" } }
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Welches Wort ist richtig geschrieben? Lies genau."
                options: ["Hausschuh", "HausSchuh", "hausschuh"]
                answer: "Hausschuh"
                option_audio: false

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort entsteht?"
            say: "Kuh und Glocke. Welches Wort entsteht?"
            show: { objects: [cow, bell] }
            options: ["Kuhglocke", "Glockenkuh", "Kuhstall"]
            answer: "Kuhglocke"
          - id: l1-c2
            type: fill_in_blank
            text: "Setz zusammen."
            say: "Haus und Schuh. Welches Wort entsteht?"
            frame: "Haus + Schuh = _"
            options: ["Hausschuh", "Schuhhaus", "HausSchuh"]
            option_audio: false
            answer: ["Hausschuh"]
          - id: l1-c3
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Welches Wort ist richtig geschrieben? Lies genau."
            options: ["Tischbein", "TischBein", "tischbein"]
            answer: "Tischbein"
            option_audio: false
          - id: l1-c4
            type: multiple_choice
            text: "Welches Wort entsteht?"
            say: "Vogel und Haus. Welches Wort entsteht?"
            show: { objects: [bird, house] }
            options: ["Vogelhaus", "Hausvogel", "Vogelnest"]
            answer: "Vogelhaus"
          - id: l1-c5
            type: true_false
            text: "Hand + Tuch = Tuchhand. Stimmt das?"
            say: "Hand und Tuch. Wird daraus Tuchhand?"
            answer: false
          - id: l1-c6
            type: fill_in_blank
            text: "Setz zusammen."
            say: "Tee und Tasse. Welches Wort entsteht?"
            frame: "Tee + Tasse = _"
            options: ["Teetasse", "Tassentee", "TeeTasse"]
            option_audio: false
            answer: ["Teetasse"]

  - n: 2
    title: { de: Zerlegen und verstehen, en: Splitting and understanding }
    goal:
      de: "Zerlege lange Nomen in zwei Teile und finde heraus, was sie bedeuten. Ein Baumhaus ist ein Haus."
      en: "Split long nouns into two parts and work out what they mean. A treehouse is a house."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort entsteht?"
            say: "Baum und Haus. Welches Wort entsteht?"
            show: { objects: [tree, house] }
            options: ["Baumhaus", "Hausbaum", "Haustür"]
            answer: "Baumhaus"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Setz zusammen."
            say: "Hand und Schuh. Welches Wort entsteht?"
            frame: "Hand + Schuh = _"
            options: ["Handschuh", "Schuhhand", "HandSchuh"]
            option_audio: false
            answer: ["Handschuh"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Baumhaus: ein Baum oder ein Haus?"
            say: "Was glaubst du: Ist ein Baumhaus ein Baum oder ein Haus?"
            show: { objects: [tree, house] }
          - text: "Ein Baumhaus ist ein Haus."
            say: "Das letzte Wort sagt, was es ist. Ein Baumhaus ist ein Haus, und zwar ein Haus im Baum. Es ist kein Baum."
            show: { objects: [tree, house] }
          - text: "Ein Apfelbaum ist ein Baum."
            say: "Ein Apfelbaum ist ein Baum, an dem Äpfel wachsen. Das erste Wort sagt, was für ein Baum es ist."
            show: { objects: [apple, tree] }
          - text: "Haustür = Haus + Tür"
            say: "Man kann zusammengesetzte Nomen auch zerlegen. Haustür besteht aus Haus und Tür."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Schneemann in zwei Nomen."
                show: { object: snowman }
                frame: "Schneemann = _ + _"
                options: ["Schnee", "Mann", "Schne", "Emann"]
                answer: ["Schnee", "Mann"]
                hints:
                  - "Welches Wort hörst du am Anfang?"
                  - "Schnee am Anfang, Mann am Ende."
                  - "Schnee + Mann."
                difficulty: easy
              - id: l2-f2
                type: multiple_choice
                text: "Was ist ein Baumhaus?"
                show: { objects: [tree, house] }
                options: ["ein Haus", "ein Baum"]
                answer: "ein Haus"
                feedback:
                  "ein Baum": "Das letzte Wort sagt, was es ist. Bei Baumhaus ist das letzte Wort Haus."
                hints:
                  - "Das letzte Wort sagt, was es ist."
                  - "Das letzte Wort ist Haus."
                  - "Ein Baumhaus ist ein Haus."
              - id: l2-f3
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Zahnbürste in zwei Nomen."
                show: { object: toothbrush }
                frame: "Zahnbürste = _ + _"
                options: ["Zahn", "Bürste", "Zahnb", "Ürste"]
                answer: ["Zahn", "Bürste"]
                hints:
                  - "Mit welchem Nomen fängt es an?"
                  - "Zahn und Bürste."
                  - "Zahn + Bürste."
              - id: l2-f4
                type: multiple_choice
                text: "Was ist ein Handschuh?"
                options: ["ein Schuh für die Hand", "eine Hand für den Schuh"]
                answer: "ein Schuh für die Hand"
                feedback:
                  "eine Hand für den Schuh": "Eine Hand, die einen Schuh trägt? Lustig, aber das letzte Wort ist Schuh."
                hints:
                  - "Das letzte Wort ist Schuh."
                  - "Es ist eine Art Schuh."
                  - "Ein Schuh für die Hand."
              - id: l2-f5
                type: true_false
                text: "Stimmt das? Eine Kuhglocke ist eine Kuh."
                say: "Eine Kuhglocke ist eine Kuh. Stimmt das?"
                answer: false
                hints:
                  - "Welches Wort steht am Ende?"
                  - "Glocke steht am Ende."
                  - "Nein, eine Kuhglocke ist eine Glocke."
              - id: l2-f6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes lange Wort mit seinem letzten Teil."
                option_audio: false
                pairs:
                  - { left: { text: "Regenschirm" }, right: { text: "Schirm" } }
                  - { left: { text: "Vogelnest" }, right: { text: "Nest" } }
                  - { left: { text: "Haustür" }, right: { text: "Tür" } }
                hints:
                  - "Schau dir bei jedem langen Wort das Ende an."
                  - "Regenschirm endet mit Schirm."
                  - "Schirm, Nest, Tür."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Kinderzimmer in zwei Nomen."
                frame: "Kinderzimmer = _ + _"
                options: ["Kinder", "Zimmer", "Kind", "Erzimmer"]
                answer: ["Kinder", "Zimmer"]
                hints: ["Ein Zimmer für Kinder."]
              - id: l2-s2
                type: multiple_choice
                text: "Was ist ein Apfelbaum?"
                options: ["ein Baum", "ein Apfel"]
                answer: "ein Baum"
                hints: ["Das letzte Wort sagt, was es ist."]
              - id: l2-s3
                type: multiple_choice
                text: "Was ist eine Tischlampe?"
                options: ["eine Lampe für den Tisch", "ein Tisch mit Lampe"]
                answer: "eine Lampe für den Tisch"
                hints: ["Lampe steht am Ende."]
              - id: l2-s4
                type: true_false
                text: "Stimmt das? Ein Brotmesser ist ein Messer."
                say: "Ein Brotmesser ist ein Messer. Stimmt das?"
                answer: true
                hints: ["Welches Wort steht am Ende?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Gartentür in zwei Nomen."
                frame: "Gartentür = _ + _"
                options: ["Garten", "Tür", "Gart", "Entür"]
                answer: ["Garten", "Tür"]
                hints: ["Eine Tür im Garten."]
              - id: l2-s6
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes lange Wort mit seinem letzten Teil."
                option_audio: false
                pairs:
                  - { left: { text: "Schultasche" }, right: { text: "Tasche" } }
                  - { left: { text: "Handspiegel" }, right: { text: "Spiegel" } }
                  - { left: { text: "Schneemann" }, right: { text: "Mann" } }
                hints: ["Schau auf das Ende."]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Regenschirm in zwei Nomen."
                show: { object: umbrella }
                frame: "Regenschirm = _ + _"
                options: ["Regen", "Schirm", "Rege", "Nschirm"]
                answer: ["Regen", "Schirm"]
              - id: l2-n2
                type: multiple_choice
                text: "Was ist ein Hausschuh?"
                options: ["ein Schuh", "ein Haus"]
                answer: "ein Schuh"
              - id: l2-n3
                type: true_false
                text: "Stimmt das? Ein Vogelnest ist ein Vogel."
                say: "Ein Vogelnest ist ein Vogel. Stimmt das?"
                answer: false
              - id: l2-n4
                type: fill_in_blank
                text: "Zerlege das Wort."
                say: "Zerlege das Wort Fußball in zwei Nomen."
                frame: "Fußball = _ + _"
                options: ["Fuß", "Ball", "Fu", "Sball"]
                answer: ["Fuß", "Ball"]
              - id: l2-n5
                type: multiple_choice
                text: "Was ist ein Tischbein?"
                options: ["ein Bein vom Tisch", "ein Tisch mit einem Bein"]
                answer: "ein Bein vom Tisch"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Zerlege das Wort."
            say: "Zerlege das Wort Haustür in zwei Nomen."
            frame: "Haustür = _ + _"
            options: ["Haus", "Tür", "Hau", "Stür"]
            answer: ["Haus", "Tür"]
          - id: l2-c2
            type: multiple_choice
            text: "Was ist ein Handspiegel?"
            options: ["ein Spiegel", "eine Hand"]
            answer: "ein Spiegel"
          - id: l2-c3
            type: true_false
            text: "Stimmt das? Ein Schneemann ist ein Mann aus Schnee."
            say: "Ein Schneemann ist ein Mann aus Schnee. Stimmt das?"
            answer: true
          - id: l2-c4
            type: fill_in_blank
            text: "Zerlege das Wort."
            say: "Zerlege das Wort Ohrring in zwei Nomen."
            frame: "Ohrring = _ + _"
            options: ["Ohr", "Ring", "Oh", "Rring"]
            answer: ["Ohr", "Ring"]
          - id: l2-c5
            type: multiple_choice
            text: "Was ist ein Käsebrot?"
            options: ["ein Brot", "ein Käse"]
            answer: "ein Brot"
          - id: l2-c6
            type: true_false
            text: "Stimmt das? Ein Bücherregal ist ein Buch."
            say: "Ein Bücherregal ist ein Buch. Stimmt das?"
            answer: false

  - n: 3
    title: { de: Das letzte Wort bestimmt den Artikel, en: The last word decides the article }
    goal:
      de: "Nimm den Artikel vom letzten Wort, so wie die Tür, also die Haustür."
      en: "Take the article from the last word, like die Tür, so die Haustür."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l3-w1
            type: multiple_choice
            text: "Was ist ein Baumhaus?"
            show: { objects: [tree, house] }
            options: ["ein Haus", "ein Baum"]
            answer: "ein Haus"
            difficulty: easy
          - id: l3-w2
            type: fill_in_blank
            text: "Zerlege das Wort."
            say: "Zerlege das Wort Apfelbaum in zwei Nomen."
            frame: "Apfelbaum = _ + _"
            options: ["Apfel", "Baum", "Apf", "Elbaum"]
            answer: ["Apfel", "Baum"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "der Baum + das Haus = ? Baumhaus"
            say: "Der Baum und das Haus. Was glaubst du: Heißt es der Baumhaus oder das Baumhaus?"
            show: { objects: [tree, house] }
          - text: "der Baum + das Haus = das Baumhaus"
            say: "Es heißt das Baumhaus. Das letzte Wort bestimmt den Artikel. Das Haus, also das Baumhaus."
            show: { objects: [tree, house] }
          - text: "das Haus + die Tür = die Haustür"
            say: "Bei Haustür ist das letzte Wort die Tür. Also heißt es die Haustür."
