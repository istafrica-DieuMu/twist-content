# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.memory-words
skill: lit-de.spelling-strategies.memory-words
curriculum: de-DE
language: de
title:
  de: Merkwörter
  en: Words to learn by heart
summary: >
  Some spellings cannot be heard or worked out and must be learnt. Lesson
  1 takes words with the Dehnungs-h (Uhr, Kuh, Stuhl) and with a double
  Selbstlaut (Boot, Meer, Haar) and how to learn them; lesson 2 takes the
  Wochentage, the Monate and the Zahlwörter, and ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Merkwörter, en: Words to learn by heart }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.spelling.short-long-vowels]
  also_practises: [lit-de.spelling.short-long-vowels]
  vocabulary: { de: [Merkwort, Dehnungs-h, doppelter Selbstlaut, Wochentag, Monat, Zahlwort, einprägen] }
  forms: [picture, text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: write-as-heard
      what: Leaves out the silent h or the double vowel because it cannot be heard (Ur, Bot, Har)
      addressed: lesson 1 Learn names them as Merkwörter; every stage of lesson 1 has a choice between the right spelling and the as-heard one, and a misspelt card in l1-f3 and l1-s3
    - id: weekday-traps
      what: Misspells the tricky parts of Wochentage and Monate (Dinstag, Sontag, Febuar)
      addressed: lesson 2 Learn names the traps; every stage of lesson 2 has a "Welcher Wochentag ist richtig geschrieben?" task and a Monat task, and the skill check has l2-c3 (Freitag) and l2-c4 (Monate in order)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Uhr und Boot", en: "Uhr and Boot" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: audio_choice
            text: "Ist das u kurz oder lang?"
            say: "Hör zu. Ist das u kurz oder lang?"
            audio: { de: "Kuh." }
            options: ["kurz", "lang"]
            keep_order: true
            answer: "lang"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Wie schwingst du Bohne?"
            say: "Wie schwingst du das Wort Bohne?"
            options: ["Boh-ne", "Bo-hne", "B-ohne"]
            answer: "Boh-ne"
            option_audio: false
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Huhn | Jahr | wohnen"
            say: "Manche Wörter haben ein h, das du nicht hörst. Es steht hinter einem langen Selbstlaut: Huhn, Jahr, wohnen. Diese Wörter musst du dir merken. Sie heißen Merkwörter."
          - text: "See | Fee | Saal"
            say: "Bei anderen Merkwörtern steht der Selbstlaut doppelt: See, Fee, Saal. Auch das hörst du nicht."
          - text: "anschauen | sprechen | schreiben | vergleichen"
            say: "So prägst du dir ein Merkwort ein: Schau es genau an. Sprich es. Schreib es auswendig auf. Vergleiche dann, ob es stimmt."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Die Uhr. Welches Wort ist richtig geschrieben?"
                show: { object: clock }
                options: ["Uhr", "Ur", "Uur"]
                answer: "Uhr"
                option_audio: false
                hints:
                  - "Uhr ist ein Merkwort. Denk daran, wie es aussieht."
                  - "Uhr: Das u ist lang. Dahinter steht ein h, das du nicht hörst."
                  - "Uhr."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Das Boot. Was fehlt?"
                show: { object: boat }
                frame: "B_t"
                options: ["oo", "o", "oh"]
                answer: ["oo"]
                hints:
                  - "Boot ist ein Merkwort. Denk daran, wie es aussieht."
                  - "Boot: Das o ist lang. Es steht zweimal da."
                  - "oo."
              - id: l1-f3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Der Stuhl. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Stul" }
                answer: false
                hints:
                  - "Lies das Wort langsam und schau dir jeden Buchstaben an."
                  - "Stuhl: Hinter dem langen u steht ein h. Auf der Karte fehlt es."
                  - "Nein. Richtig ist Stuhl."
              - id: l1-f4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Der Schnee. Was fehlt?"
                show: { object: snow }
                frame: "Schn_"
                options: ["ee", "e", "eh"]
                answer: ["ee"]
                hints:
                  - "Schnee ist ein Merkwort. Denk daran, wie es aussieht."
                  - "Schnee: Das e am Ende ist lang. Es steht zweimal da."
                  - "ee."
              - id: l1-f5
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Ohr. Welches Wort ist richtig geschrieben?"
                show: { object: ear }
                options: ["Ohr", "Or", "Oor"]
                answer: "Ohr"
                option_audio: false
                hints:
                  - "Ohr ist ein Merkwort wie Uhr."
                  - "Ohr: Das o ist lang. Dahinter steht ein h, das du nicht hörst."
                  - "Ohr."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Die Kuh. Welches Wort ist richtig geschrieben?"
                show: { object: cow }
                options: ["Kuh", "Ku", "Kuu"]
                answer: "Kuh"
                option_audio: false
                hints: ["Kuh ist ein Merkwort mit h."]
              - id: l1-s2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Das Meer. Im Sommer baden wir im Meer. Was fehlt?"
                frame: "M_r"
                options: ["ee", "e", "eh"]
                answer: ["ee"]
                hints: ["Mit h wäre es das Wort mehr. Das Meer, in dem du badest, hat einen doppelten Selbstlaut."]
              - id: l1-s3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Das Haar. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Har" }
                answer: false
                hints: ["Haar hat einen doppelten Selbstlaut."]
              - id: l1-s4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Der Zahn. Was fehlt?"
                frame: "Za_n"
                options: ["h", "a", "e"]
                answer: ["h"]
                hints: ["Hinter dem langen a steht ein Buchstabe, den du nicht hörst."]
              - id: l1-s5
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Zoo. Welches Wort ist richtig geschrieben?"
                options: ["Zoo", "Zo", "Zooh"]
                answer: "Zoo"
                option_audio: false
                hints: ["Zoo hat einen doppelten Selbstlaut."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Der Schuh. Welches Wort ist richtig geschrieben?"
                show: { object: shoe }
                options: ["Schuh", "Schu", "Schuu"]
                answer: "Schuh"
                option_audio: false
              - id: l1-n2
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Der Tee. Was fehlt?"
                frame: "T_"
                options: ["ee", "e", "eh"]
                answer: ["ee"]
              - id: l1-n3
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Die Bohne. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Bohne" }
                answer: true
              - id: l1-n4
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Fahren. Was fehlt?"
                frame: "fa_ren"
                options: ["h", "r", "a"]
                answer: ["h"]
              - id: l1-n5
                type: multiple_choice
                text: "Welches Wort ist richtig geschrieben?"
                say: "Das Moos. Welches Wort ist richtig geschrieben?"
                options: ["Moos", "Mos", "Mohs"]
                answer: "Moos"
                option_audio: false

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Der Stuhl. Welches Wort ist richtig geschrieben?"
            show: { object: chair }
            options: ["Stuhl", "Stul", "Stuul"]
            answer: "Stuhl"
            option_audio: false
          - id: l1-c2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Die Erdbeere. Was fehlt?"
            show: { object: strawberry }
            frame: "Erdb_re"
            options: ["ee", "e", "eh"]
            answer: ["ee"]
          - id: l1-c3
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Die Sahne. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "Sahne" }
            answer: true

  - n: 2
    title: { de: "Wochentage, Monate, Zahlwörter", en: "Days, months and number words" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Das Boot. Wir fahren mit dem Boot. Welches Wort ist richtig geschrieben?"
            options: ["Boot", "Bot", "Boht"]
            answer: "Boot"
            option_audio: false
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Die Uhr. Was fehlt?"
            frame: "U_r"
            options: ["h", "u", "r"]
            answer: ["h"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag"
            say: "Die Wochentage sind Merkwörter. Sie werden großgeschrieben. Pass auf: Dienstag schreibt man mit ie, Mittwoch mit tt, Donnerstag und Sonntag mit nn."
          - text: "Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember"
            say: "Auch die Monate sind Merkwörter. Schau sie dir genau an. Pass bei Februar auf: Nach dem b kommt ein r."
          - text: "zwei, drei, vier, sieben, zwanzig, dreißig"
            say: "Zahlwörter schreibst du klein. Merk dir: vier mit v und ie, sieben mit ie, dreißig mit ß."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welcher Wochentag ist richtig geschrieben?"
                say: "Dienstag. Welcher Wochentag ist richtig geschrieben?"
                options: ["Dienstag", "Dinstag", "Dihnstag"]
                answer: "Dienstag"
                option_audio: false
                hints:
                  - "Dienstag ist ein Merkwort. Denk daran, wie es aussieht."
                  - "Dienstag: Du hörst ein langes i. In Dienstag schreibt man es mit ie."
                  - "Dienstag."
                difficulty: easy
              - id: l2-f2
                type: ordering
                text: "Bring die Wochentage in die richtige Reihenfolge."
                say: "Bring die Wochentage in die richtige Reihenfolge."
                options: ["Mittwoch", "Montag", "Dienstag"]
                slot_count: 3
                answer: ["Montag", "Dienstag", "Mittwoch"]
                hints:
                  - "Sag die Wochentage der Reihe nach auf."
                  - "Nach dem Wochenende fängt die Woche mit Montag an. Danach kommt Dienstag."
                  - "Montag, Dienstag, Mittwoch."
              - id: l2-f3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Mittwoch. Was fehlt?"
                frame: "Mi_woch"
                options: ["tt", "t", "d"]
                answer: ["tt"]
                hints:
                  - "Mittwoch ist die Mitte der Woche. Denk an das Wort Mitte."
                  - "Mitte schreibst du mit tt. Also schreibst du auch Mittwoch mit tt."
                  - "tt."
              - id: l2-f4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Sieben. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "sieben" }
                answer: true
                hints:
                  - "Lies das Wort langsam und schau dir jeden Buchstaben an."
                  - "Sieben: Du hörst ein langes i. In sieben schreibt man es mit ie. Steht das auf der Karte?"
                  - "Ja, das ist richtig."
              - id: l2-f5
                type: multiple_choice
                text: "Welcher Monat ist richtig geschrieben?"
                say: "Februar. Welcher Monat ist richtig geschrieben?"
                options: ["Februar", "Febuar", "Feburar"]
                answer: "Februar"
                option_audio: false
                hints:
                  - "Sprich das Wort ganz deutlich in Silben."
                  - "Fe, bru, ar: In der zweiten Silbe kommt gleich nach dem b ein r."
                  - "Februar."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welcher Wochentag ist richtig geschrieben?"
                say: "Sonntag. Welcher Wochentag ist richtig geschrieben?"
                options: ["Sonntag", "Sontag", "Sonnetag"]
                answer: "Sonntag"
                option_audio: false
                hints: ["Sonntag ist der Tag der Sonne."]
              - id: l2-s2
                type: ordering
                text: "Bring die Wochentage in die richtige Reihenfolge."
                say: "Bring die Wochentage in die richtige Reihenfolge."
                options: ["Freitag", "Donnerstag", "Samstag"]
                slot_count: 3
                answer: ["Donnerstag", "Freitag", "Samstag"]
                hints: ["Welcher Tag kommt nach Mittwoch?"]
              - id: l2-s3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Vier. Was fehlt?"
                frame: "v_r"
                options: ["ie", "i", "ih"]
                answer: ["ie"]
                hints: ["Denk an sieben. Das lange i schreibst du in vier genauso."]
              - id: l2-s4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Dreißig. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "dreisig" }
                answer: false
                hints: ["Dreißig hat ein ß."]
              - id: l2-s5
                type: multiple_choice
                text: "Welcher Monat ist richtig geschrieben?"
                say: "Juli. Welcher Monat ist richtig geschrieben?"
                options: ["Juli", "Julli", "Juhli"]
                answer: "Juli"
                option_audio: false
                hints: ["Juli ist ein kurzes Wort mit nur vier Buchstaben."]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welcher Wochentag ist richtig geschrieben?"
                say: "Donnerstag. Welcher Wochentag ist richtig geschrieben?"
                options: ["Donnerstag", "Donerstag", "Donnastag"]
                answer: "Donnerstag"
                option_audio: false
              - id: l2-n2
                type: ordering
                text: "Bring die Monate in die richtige Reihenfolge."
                say: "Bring die Monate in die richtige Reihenfolge."
                options: ["März", "Januar", "Februar"]
                slot_count: 3
                answer: ["Januar", "Februar", "März"]
              - id: l2-n3
                type: fill_in_blank
                text: "Was fehlt?"
                say: "Zwanzig. Was fehlt?"
                frame: "_wanzig"
                options: ["z", "s", "ts"]
                answer: ["z"]
              - id: l2-n4
                type: true_false
                text: "Ist das Wort richtig geschrieben?"
                say: "Mittwoch. Lies das Wort. Ist es richtig geschrieben?"
                show: { drawn: letter-card, text: "Mittwoch" }
                answer: true
              - id: l2-n5
                type: multiple_choice
                text: "Welcher Monat ist richtig geschrieben?"
                say: "August. Welcher Monat ist richtig geschrieben?"
                options: ["August", "Augusst", "Augst"]
                answer: "August"
                option_audio: false

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: multiple_choice
            text: "Welches Wort ist richtig geschrieben?"
            say: "Der Zahn. Welches Wort ist richtig geschrieben?"
            options: ["Zahn", "Zan", "Zaan"]
            answer: "Zahn"
            option_audio: false
          - id: l2-c2
            type: fill_in_blank
            text: "Was fehlt?"
            say: "Das Haar. Was fehlt?"
            frame: "H_r"
            options: ["aa", "a", "ah"]
            answer: ["aa"]
          - id: l2-c3
            type: multiple_choice
            text: "Welcher Wochentag ist richtig geschrieben?"
            say: "Freitag. Welcher Wochentag ist richtig geschrieben?"
            options: ["Freitag", "Freidag", "Freitak"]
            answer: "Freitag"
            option_audio: false
          - id: l2-c4
            type: ordering
            text: "Bring die Monate in die richtige Reihenfolge."
            say: "Bring die Monate in die richtige Reihenfolge."
            options: ["Mai", "März", "April"]
            slot_count: 3
            answer: ["März", "April", "Mai"]
          - id: l2-c5
            type: true_false
            text: "Ist das Wort richtig geschrieben?"
            say: "Vier. Lies das Wort. Ist es richtig geschrieben?"
            show: { drawn: letter-card, text: "fier" }
            answer: false
