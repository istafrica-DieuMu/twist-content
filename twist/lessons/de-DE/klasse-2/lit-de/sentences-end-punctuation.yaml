# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.sentences-end-punctuation
skill: lit-de.sentences.end-punctuation
curriculum: de-DE
language: de
title:
  de: Punkt, Fragezeichen, Ausrufezeichen
  en: Full stop, question mark, exclamation mark
summary: >
  The three kinds of sentence and the mark at their end. Lesson 1 tells
  Aussagesatz (Punkt) from Fragesatz (Fragezeichen), with and without a
  question word; lesson 2 adds the Ausrufesatz (Ausrufezeichen) for a
  call, a wish or a strong feeling, sorts all three, and ends with the
  skill check.
metadata:
  year: klasse-2
  topic: { de: Satzarten, en: Kinds of sentence }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.sentences.word-gaps]
  also_practises: []
  vocabulary: { de: [Aussagesatz, Fragesatz, Ausrufesatz, Punkt, Fragezeichen, Ausrufezeichen, Satzschlusszeichen] }
  forms: [text, audio]
  drawn: [letter-card]
  facets: []
  misconceptions:
    - id: question-without-word
      what: Sets a Punkt after a question without a question word (Kommst du mit.)
      addressed: lesson 1 Learn shows a question that starts with the verb; every stage of lesson 1 has one, with feedback in l1-f2
    - id: exclamation-everywhere
      what: Puts an Ausrufezeichen after any lively statement
      addressed: lesson 2 Learn says the Ausrufezeichen is for loud calls, warnings, wishes and strong feelings; the sorting task in every stage of lesson 2 sets a plain statement beside a clear exclamation, and l2-s5 and l2-c5 offer ! for a plain statement
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Punkt oder Fragezeichen?", en: "Full stop or question mark?" }
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: ordering
            text: "Bau den Satz."
            say: "Bring die Wörter in die richtige Reihenfolge. Am Ende steht ein Punkt."
            options: ["schläft.", "Der", "Hund"]
            slot_count: 3
            answer: ["Der", "Hund", "schläft."]
            option_audio: false
            difficulty: easy
          - id: l1-w2
            type: highlight_in_text
            text: "Tippe auf das erste Wort des Satzes."
            say: "Lies den Satz. Tippe auf das erste Wort."
            show: { drawn: letter-card, text: "Heute scheint die Sonne." }
            spans: ["Heute"]
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Lina spielt im Garten."
            say: "Ein Satz, der etwas erzählt, heißt Aussagesatz. Am Ende steht ein Punkt."
          - text: "Wo spielt Lina?"
            say: "Ein Satz, der etwas fragt, heißt Fragesatz. Am Ende steht ein Fragezeichen. Oft beginnt die Frage mit einem Fragewort: wo, wer, was, wann, wie."
          - text: "Spielt Lina im Garten?"
            say: "Es gibt auch Fragen ohne Fragewort. Dann steht das Verb ganz vorn: Spielt Lina im Garten? Auch hier steht ein Fragezeichen."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Wann kommt Oma_"
                options: ["?", "."]
                answer: ["?"]
                hints:
                  - "Schau auf das erste Wort."
                  - "Der Satz beginnt mit dem Fragewort „Wann“."
                  - "Ein Fragezeichen."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Kommst du mit_"
                options: [".", "?"]
                answer: ["?"]
                feedback:
                  ".": "Das ist eine Frage, auch ohne Fragewort: Das Verb steht vorn. Am Ende steht ein Fragezeichen."
                hints:
                  - "Wer spricht, will etwas wissen."
                  - "Das Verb „Kommst“ steht ganz vorn."
                  - "Ein Fragezeichen."
              - id: l1-f3
                type: multiple_choice
                text: "Welche Satzart ist das? „Der Bus kommt gleich.“"
                say: "Der Bus kommt gleich. Welche Satzart ist das?"
                options: ["Aussagesatz", "Fragesatz"]
                answer: "Aussagesatz"
                hints:
                  - "Erzählt der Satz etwas oder fragt er?"
                  - "Am Ende steht ein Punkt."
                  - "Aussagesatz."
              - id: l1-f4
                type: true_false
                text: "Ist das Zeichen richtig?"
                say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
                show: { drawn: letter-card, text: "Was isst der Igel?" }
                answer: true
                hints:
                  - "Fragt der Satz etwas?"
                  - "Der Satz beginnt mit dem Fragewort „Was“."
                  - "Ja, das Fragezeichen ist richtig."
              - id: l1-f5
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Wir backen heute einen Kuchen_"
                options: ["?", "."]
                answer: ["."]
                hints:
                  - "Steht vorn ein Fragewort oder das Verb?"
                  - "Er erzählt, was wir heute machen."
                  - "Ein Punkt."

          - support: some
            tasks:
              - id: l1-s1
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Wo wohnt der Fuchs_"
                options: [".", "?"]
                answer: ["?"]
                hints: ["Gibt es ein Fragewort?"]
              - id: l1-s2
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Hast du einen Hund_"
                options: ["?", "."]
                answer: ["?"]
                hints: ["Welches Wort steht ganz vorn?"]
              - id: l1-s3
                type: multiple_choice
                text: "Welche Satzart ist das? „Wer hat meine Mütze?“"
                say: "Wer hat meine Mütze? Welche Satzart ist das?"
                options: ["Fragesatz", "Aussagesatz"]
                answer: "Fragesatz"
                hints: ["Schau auf das erste Wort."]
              - id: l1-s4
                type: true_false
                text: "Ist das Zeichen richtig?"
                say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
                show: { drawn: letter-card, text: "Darf ich mitspielen." }
                answer: false
                hints: ["Will das Kind etwas wissen?"]
              - id: l1-s5
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Meine Katze heißt Mimi_"
                options: [".", "?"]
                answer: ["."]
                hints: ["Steht vorn ein Fragewort oder das Verb?"]

          - support: none
            tasks:
              - id: l1-n1
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Wie alt bist du_"
                options: ["?", "."]
                answer: ["?"]
              - id: l1-n2
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Regnet es draußen_"
                options: [".", "?"]
                answer: ["?"]
              - id: l1-n3
                type: multiple_choice
                text: "Welche Satzart ist das? „Im Herbst fallen die Blätter.“"
                say: "Im Herbst fallen die Blätter. Welche Satzart ist das?"
                options: ["Fragesatz", "Aussagesatz"]
                answer: "Aussagesatz"
              - id: l1-n4
                type: true_false
                text: "Ist das Zeichen richtig?"
                say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
                show: { drawn: letter-card, text: "Papa liest die Zeitung." }
                answer: true
              - id: l1-n5
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
                frame: "Der Zug fährt um acht Uhr ab_"
                options: ["?", "."]
                answer: ["."]

      - activity: check
        size: quick
        tasks:
          - id: l1-c1
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
            frame: "Was malst du da_"
            options: [".", "?"]
            answer: ["?"]
          - id: l1-c2
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
            frame: "Magst du Erdbeeren_"
            options: ["?", "."]
            answer: ["?"]
          - id: l1-c3
            type: multiple_choice
            text: "Welche Satzart ist das? „Die Ente schwimmt auf dem Teich.“"
            say: "Die Ente schwimmt auf dem Teich. Welche Satzart ist das?"
            options: ["Aussagesatz", "Fragesatz"]
            answer: "Aussagesatz"

  - n: 2
    title: { de: "Das Ausrufezeichen", en: "The exclamation mark" }
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
            frame: "Wer klingelt da_"
            options: [".", "?"]
            answer: ["?"]
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas oder fragt er? Welches Zeichen gehört ans Ende?"
            frame: "Ben trinkt einen Kakao_"
            options: ["?", "."]
            answer: ["."]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Komm sofort her!"
            say: "Ruft jemand laut, warnt er oder befiehlt er etwas, steht ein Ausrufezeichen. Komm sofort her! Das ist ein Ausrufesatz."
          - text: "Hurra, wir haben gewonnen!"
            say: "Auch bei einem Wunsch oder einem starken Gefühl steht ein Ausrufezeichen. Hurra, wir haben gewonnen! Viel Glück!"
          - text: ". · ? · !"
            say: "Jetzt kennst du alle drei: Der Punkt erzählt, das Fragezeichen fragt, das Ausrufezeichen ruft."

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
                frame: "Pass auf, ein Auto_"
                options: ["!", ".", "?"]
                answer: ["!"]
                hints:
                  - "Hier ruft jemand eine Warnung."
                  - "Nach einem Ruf steht ein besonderes Zeichen."
                  - "Ein Ausrufezeichen."
                difficulty: easy
              - id: l2-f2
                type: sorting
                text: "Welche Satzart?"
                say: "Sortiere die Sätze: Aussagesatz, Fragesatz oder Ausrufesatz?"
                bins:
                  - { id: stmt, show: { text: "Aussagesatz ." }, say: "Aussagesatz" }
                  - { id: quest, show: { text: "Fragesatz ?" }, say: "Fragesatz" }
                  - { id: excl, show: { text: "Ausrufesatz !" }, say: "Ausrufesatz" }
                options:
                  - { text: "Der Ball ist rot", bin: stmt }
                  - { text: "Wo ist der Ball", bin: quest }
                  - { text: "Hurra, ein Tor", bin: excl }
                option_audio: false
                hints:
                  - "Erzählt, fragt oder ruft der Satz?"
                  - "„Hurra“ ist ein Freudenruf."
                  - "Der Ball ist rot: Aussagesatz. Wo ist der Ball: Fragesatz. Hurra, ein Tor: Ausrufesatz."
              - id: l2-f3
                type: true_false
                text: "Ist das Zeichen richtig?"
                say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
                show: { drawn: letter-card, text: "Alles Gute zum Geburtstag!" }
                answer: true
                hints:
                  - "Ist das ein Wunsch?"
                  - "Nach einem Wunsch steht ein Ausrufezeichen."
                  - "Ja, das ist richtig."
              - id: l2-f4
                type: multiple_choice
                text: "Welche Satzart ist das? „Hör auf damit!“"
                say: "Hör auf damit! Welche Satzart ist das?"
                options: ["Ausrufesatz", "Aussagesatz", "Fragesatz"]
                answer: "Ausrufesatz"
                hints:
                  - "Welches Zeichen steht am Ende?"
                  - "Hier befiehlt jemand: Schluss!"
                  - "Ausrufesatz."
              - id: l2-f5
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
                frame: "Hast du meinen Schal gesehen_"
                options: ["?", "!", "."]
                answer: ["?"]
                hints:
                  - "Will jemand etwas wissen?"
                  - "Das Verb steht vorn."
                  - "Ein Fragezeichen."

          - support: some
            tasks:
              - id: l2-s1
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
                frame: "Au, mein Finger_"
                options: [".", "?", "!"]
                answer: ["!"]
                hints: ["Wie fühlt sich das Kind?"]
              - id: l2-s2
                type: sorting
                text: "Welche Satzart?"
                say: "Sortiere die Sätze: Aussagesatz, Fragesatz oder Ausrufesatz?"
                bins:
                  - { id: stmt, show: { text: "Aussagesatz ." }, say: "Aussagesatz" }
                  - { id: quest, show: { text: "Fragesatz ?" }, say: "Fragesatz" }
                  - { id: excl, show: { text: "Ausrufesatz !" }, say: "Ausrufesatz" }
                options:
                  - { text: "Vorsicht, die Tür klemmt", bin: excl }
                  - { text: "Die Tür ist offen", bin: stmt }
                  - { text: "Ist die Tür offen", bin: quest }
                option_audio: false
                hints: ["Erzählt, fragt oder ruft der Satz?"]
              - id: l2-s3
                type: true_false
                text: "Ist das Zeichen richtig?"
                say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
                show: { drawn: letter-card, text: "Wann beginnt die Schule!" }
                answer: false
                hints: ["Gibt es ein Fragewort?"]
              - id: l2-s4
                type: multiple_choice
                text: "Welche Satzart ist das? „Ich habe einen kleinen Bruder.“"
                say: "Ich habe einen kleinen Bruder. Welche Satzart ist das?"
                options: ["Fragesatz", "Ausrufesatz", "Aussagesatz"]
                answer: "Aussagesatz"
                hints: ["Erzählt der Satz, fragt er oder ruft er?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
                frame: "Das Buch liegt auf dem Tisch_"
                options: ["!", ".", "?"]
                answer: ["."]
                hints: ["Ist das ein Ruf, eine Warnung oder ein starkes Gefühl?"]

          - support: none
            tasks:
              - id: l2-n1
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
                frame: "Hilfe, ich falle_"
                options: ["?", "!", "."]
                answer: ["!"]
              - id: l2-n2
                type: sorting
                text: "Welche Satzart?"
                say: "Sortiere die Sätze: Aussagesatz, Fragesatz oder Ausrufesatz?"
                bins:
                  - { id: stmt, show: { text: "Aussagesatz ." }, say: "Aussagesatz" }
                  - { id: quest, show: { text: "Fragesatz ?" }, say: "Fragesatz" }
                  - { id: excl, show: { text: "Ausrufesatz !" }, say: "Ausrufesatz" }
                options:
                  - { text: "Wer hat Hunger", bin: quest }
                  - { text: "Juhu, es gibt Pizza", bin: excl }
                  - { text: "Der Tisch ist gedeckt", bin: stmt }
                option_audio: false
              - id: l2-n3
                type: true_false
                text: "Ist das Zeichen richtig?"
                say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
                show: { drawn: letter-card, text: "Frohe Weihnachten!" }
                answer: true
              - id: l2-n4
                type: multiple_choice
                text: "Welche Satzart ist das? „Gehst du mit in den Park?“"
                say: "Gehst du mit in den Park? Welche Satzart ist das?"
                options: ["Aussagesatz", "Fragesatz", "Ausrufesatz"]
                answer: "Fragesatz"
              - id: l2-n5
                type: fill_in_blank
                text: "Setz das Zeichen."
                say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
                frame: "Halt, bleib stehen_"
                options: [".", "?", "!"]
                answer: ["!"]

      - activity: check
        size: skill
        tasks:
          - id: l2-c1
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
            frame: "Warum weinst du_"
            options: ["!", "?", "."]
            answer: ["?"]
          - id: l2-c2
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
            frame: "Achtung, der Hund beißt_"
            options: [".", "!", "?"]
            answer: ["!"]
          - id: l2-c3
            type: sorting
            text: "Welche Satzart?"
            say: "Sortiere die Sätze nach ihrer Satzart."
            bins:
              - { id: stmt, show: { text: "Aussagesatz ." }, say: "Aussagesatz" }
              - { id: quest, show: { text: "Fragesatz ?" }, say: "Fragesatz" }
              - { id: excl, show: { text: "Ausrufesatz !" }, say: "Ausrufesatz" }
            options:
              - { text: "Der Vogel singt", bin: stmt }
              - { text: "Hörst du den Vogel", bin: quest }
              - { text: "Toll, der Vogel ist wieder da", bin: excl }
            option_audio: false
          - id: l2-c4
            type: true_false
            text: "Ist das Zeichen richtig?"
            say: "Lies die Karte. Ist das Zeichen am Ende richtig?"
            show: { drawn: letter-card, text: "Darf ich ein Eis haben." }
            answer: false
          - id: l2-c5
            type: fill_in_blank
            text: "Setz das Zeichen."
            say: "Lies den Satz. Erzählt er etwas, fragt er oder ruft er? Welches Zeichen gehört ans Ende?"
            frame: "Mein Bruder ist sieben Jahre alt_"
            options: ["?", ".", "!"]
            answer: ["."]
