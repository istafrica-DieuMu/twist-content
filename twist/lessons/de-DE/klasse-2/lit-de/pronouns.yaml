# Lesson set: Deutsch, Klasse 2. Hand-authored draft.
id: de-DE.lit-de.pronouns
skill: lit-de.nouns.pronouns
curriculum: de-DE
language: de
title:
  de: Pronomen
  en: Pronouns
summary: >
  A pronoun stands for a noun, so a text does not repeat itself: der Hund
  bellt, er bellt laut. Lesson 1 matches er, sie and es to the article
  (der, die, das) and finds who a pronoun means; lesson 2 adds the plural
  sie and the pronouns wir and ihr, chooses the text that repeats less, and
  ends with the skill check.
metadata:
  year: klasse-2
  topic: { de: Pronomen, en: Pronouns }
  ages: [6-7]
  lesson_minutes: 11
  builds_on: [lit-de.nouns.plural]
  also_practises: [lit-de.nouns.articles]
  vocabulary: { de: [Pronomen, Nomen, Artikel, er, sie, es, wir, ihr, Einzahl, Mehrzahl] }
  forms: [picture, text, audio]
  drawn: []
  facets: []
  parts:
    - { id: singular, what: { de: "er, sie oder es, passend zum Artikel", en: "er, sie or es, to match the article" } }
    - { id: plural-we-you, what: { de: "sie in der Mehrzahl, wir und ihr", en: "sie in the plural, wir and ihr" } }
    - { id: who-meant, what: { de: "finden, wen ein Pronomen meint", en: finding who a pronoun means } }
    - { id: no-repeat, what: { de: "Pronomen einsetzen, damit sich ein Text nicht wiederholt", en: using pronouns so a text does not repeat itself } }
  misconceptions:
    - id: pronoun-by-meaning
      what: Picks the pronoun from what the thing is, not from its article (die Sonne, so er)
      addressed: lesson 1 Learn says the pronoun goes with the article; feedback in the full stage names the article
    - id: plural-from-singular
      what: Uses the singular pronoun for a plural (die Äpfel, so er because der Apfel)
      addressed: lesson 2 Learn says the plural always takes sie; feedback on er in l2-f1
    - id: nearest-noun
      what: Takes the noun just before the pronoun as the one it means
      addressed: the who-is-meant tasks put another noun nearer the pronoun and only one noun fits its form (er, es, or the verb ending)
  twist_reuse: []
  status: draft
  version: 1
  authored: 2026-10-13

lessons:
  - n: 1
    title: { de: "Er, sie, es", en: "He, she, it" }
    goal:
      de: "Nimm er, sie oder es statt des Nomens, so wie der Hund bellt, er bellt laut."
      en: "Use er, sie or es instead of the noun, like der Hund bellt, er bellt laut."
    new_content: true
    activities:
      - activity: warm-up
        from: earlier-skills
        tasks:
          - id: l1-w1
            type: multiple_choice
            text: "der, die oder das? Maus"
            say: "Welcher Artikel passt zu Maus?"
            show: { object: mouse }
            options: ["der", "die", "das"]
            answer: "die"
            difficulty: easy
          - id: l1-w2
            type: multiple_choice
            text: "Ein Hund, viele …"
            say: "Ein Hund, viele ... Wie heißt die Mehrzahl?"
            show: { object: dog }
            options: ["die Hunde", "die Hunds", "die Hunden"]
            answer: "die Hunde"
            difficulty: easy

      - activity: learn
        mode: demonstration
        screens:
          - text: "Der Hund bellt. Der Hund rennt. Der Hund springt."
            say: "Hör mal: Der Hund bellt. Der Hund rennt. Der Hund springt. Ganz schön viel Hund! Was glaubst du: Welches kurze Wort kann statt der Hund stehen?"
            show: { object: dog }
          - text: "der Hund → er"
            say: "Das Wort er! Statt ein Nomen immer wieder zu sagen, kannst du ein Pronomen nehmen. Der Hund bellt. Er bellt laut. Mit er ist der Hund gemeint."
            show: { object: dog }
          - text: "die Maus → sie · das Kind → es"
            say: "Bei die nimmst du sie: Die Maus piepst. Sie piepst leise. Bei das nimmst du es: Das Kind lacht. Es lacht laut."
          - text: "der → er · die → sie · das → es"
            say: "Das Pronomen passt zum Artikel, auch bei Dingen. Der Ball ist rot. Er rollt weg. Die Tasse ist voll. Sie ist heiß."
          - text: "Wusstest du? Auf Englisch heißen Löffel, Gabel und Messer alle „it“."
            say: "Wusstest du? Auf Englisch sagt man zu fast allen Dingen it. Der Löffel, die Gabel, das Messer: alles it. Auf Deutsch hört das Pronomen auf den Artikel. Der Löffel ist er, die Gabel ist sie, das Messer ist es."
            show: { object: spoon }

      - activity: practise
        setting: plain
        stages:
          - support: full
            tasks:
              - id: l1-f1
                type: multiple_choice
                text: "Welches Pronomen passt? der Löwe"
                say: "Der Löwe brüllt. Welches Pronomen nimmst du für den Löwen?"
                show: { object: lion }
                options: ["er", "sie", "es"]
                answer: "er"
                feedback:
                  "sie": "Es heißt der Löwe. Zu der passt er."
                  "es": "Es heißt der Löwe. Zu der passt er."
                hints:
                  - "Welcher Artikel gehört zu Löwe?"
                  - "Der Löwe, und zu der passt er."
                  - "Er brüllt."
                difficulty: easy
              - id: l1-f2
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Die Sonne scheint. Welches Pronomen passt in die Lücke?"
                show: { object: sun }
                frame: "Die Sonne scheint. _ ist warm."
                options: ["Er", "Sie", "Es"]
                answer: ["Sie"]
                hints:
                  - "Welcher Artikel gehört zu Sonne?"
                  - "Die Sonne, und zu die passt sie."
                  - "Sie ist warm."
              - id: l1-f3
                type: true_false
                text: "Das Buch ist dick. Er hat viele Seiten.\n\nPasst das Pronomen „er“?"
                say: "Das Buch ist dick. Er hat viele Seiten. Passt das Pronomen er?"
                show: { object: book }
                answer: false
                feedback:
                  "true": "Es heißt das Buch. Zu das passt es: Es hat viele Seiten."
                hints:
                  - "Welcher Artikel gehört zu Buch?"
                  - "Das Buch, und zu das passt es."
                  - "Nein. Richtig ist: Es hat viele Seiten."
              - id: l1-f4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Pronomen."
                pairs:
                  - { left: { text: "der Apfel" }, right: { text: "er" } }
                  - { left: { text: "die Banane" }, right: { text: "sie" } }
                  - { left: { text: "das Ei" }, right: { text: "es" } }
                hints:
                  - "Schau auf den Artikel."
                  - "Zu der passt er, zu die passt sie, zu das passt es."
                  - "Der Apfel: er, die Banane: sie, das Ei: es."
              - id: l1-f5
                type: multiple_choice
                text: "Die Oma backt einen Kuchen. Sie ist fröhlich.\n\nWer ist mit „sie“ gemeint?"
                say: "Die Oma backt einen Kuchen. Sie ist fröhlich. Wer ist mit sie gemeint?"
                options: ["die Oma", "der Kuchen", "das Kind"]
                answer: "die Oma"
                feedback:
                  "der Kuchen": "Ein fröhlicher Kuchen? Lustige Idee! Aber zu der Kuchen würde er passen, nicht sie."
                hints:
                  - "Zu welchem Artikel passt sie?"
                  - "Sie passt zu die."
                  - "Die Oma ist fröhlich."
              - id: l1-f6
                type: sorting
                text: "Sortiere: er, sie oder es?"
                say: "Welches Pronomen passt? Sortiere die Bilder. Die Bilder sagen ihr Wort mit dem Artikel."
                bins:
                  - { id: er, show: { text: "er" }, say: "er" }
                  - { id: sie, show: { text: "sie" }, say: "sie" }
                  - { id: es, show: { text: "es" }, say: "es" }
                options:
                  - { object: tree, bin: er }
                  - { object: lamp, bin: sie }
                  - { object: house, bin: es }
                  - { object: car, bin: es }
                hints:
                  - "Tippe auf jedes Bild und hör auf den Artikel."
                  - "Der Baum, die Lampe, das Haus, das Auto."
                  - "Baum zu er, Lampe zu sie, Haus und Auto zu es."

          - support: some
            tasks:
              - id: l1-s1
                type: multiple_choice
                text: "Welches Pronomen passt? der Wal"
                say: "Der Wal schwimmt. Welches Pronomen nimmst du für den Wal?"
                show: { object: whale }
                options: ["er", "sie", "es"]
                answer: "er"
                hints: ["Denk an den Artikel."]
              - id: l1-s2
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Das Messer ist scharf. Welches Pronomen passt in die Lücke?"
                show: { object: knife }
                frame: "Das Messer ist scharf. _ schneidet gut."
                options: ["Er", "Sie", "Es"]
                answer: ["Es"]
                hints: ["Welcher Artikel steht vor Messer?"]
              - id: l1-s3
                type: true_false
                text: "Die Wolke ist grau. Sie bringt Regen.\n\nPasst das Pronomen „sie“?"
                say: "Die Wolke ist grau. Sie bringt Regen. Passt das Pronomen sie?"
                show: { object: cloud }
                answer: true
                hints: ["Welcher Artikel gehört zu Wolke?"]
              - id: l1-s4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Pronomen."
                pairs:
                  - { left: { text: "der Mond" }, right: { text: "er" } }
                  - { left: { text: "die Säge" }, right: { text: "sie" } }
                  - { left: { text: "das Fahrrad" }, right: { text: "es" } }
                hints: ["Der Artikel verrät das Pronomen."]
              - id: l1-s5
                type: multiple_choice
                text: "Das Mädchen füttert den Vogel. Es lacht.\n\nWer lacht?"
                say: "Das Mädchen füttert den Vogel. Es lacht. Wer lacht?"
                options: ["das Mädchen", "der Vogel", "die Mama"]
                answer: "das Mädchen"
                hints: ["Zu welchem Artikel passt es?"]
              - id: l1-s6
                type: sorting
                text: "Sortiere: er, sie oder es?"
                say: "Welches Pronomen passt? Sortiere die Bilder."
                bins:
                  - { id: er, show: { text: "er" }, say: "er" }
                  - { id: sie, show: { text: "sie" }, say: "sie" }
                  - { id: es, show: { text: "es" }, say: "es" }
                options:
                  - { object: snake, bin: sie }
                  - { object: ladder, bin: sie }
                  - { object: spoon, bin: er }
                  - { object: ear, bin: es }
                hints: ["Hör bei jedem Bild auf den Artikel."]

          - support: none
            tasks:
              - id: l1-n1
                type: multiple_choice
                text: "Welches Pronomen passt? die Ameise"
                say: "Die Ameise krabbelt. Welches Pronomen nimmst du für die Ameise?"
                show: { object: ant }
                options: ["er", "sie", "es"]
                answer: "sie"
              - id: l1-n2
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Der Drachen fliegt hoch. Welches Pronomen passt in die Lücke?"
                show: { object: kite }
                frame: "Der Drachen fliegt hoch. _ ist bunt."
                options: ["Er", "Sie", "Es"]
                answer: ["Er"]
              - id: l1-n3
                type: true_false
                text: "Das Lama frisst Gras. Sie ist hungrig.\n\nPasst das Pronomen „sie“?"
                say: "Das Lama frisst Gras. Sie ist hungrig. Passt das Pronomen sie?"
                show: { object: llama }
                answer: false
              - id: l1-n4
                type: matching
                text: "Was passt zusammen?"
                say: "Verbinde jedes Nomen mit seinem Pronomen."
                pairs:
                  - { left: { text: "der Würfel" }, right: { text: "er" } }
                  - { left: { text: "die Möhre" }, right: { text: "sie" } }
                  - { left: { text: "das Blatt" }, right: { text: "es" } }
              - id: l1-n5
                type: multiple_choice
                text: "Der Hund sucht das Ei. Er schnüffelt.\n\nWer schnüffelt?"
                say: "Der Hund sucht das Ei. Er schnüffelt. Wer schnüffelt?"
                options: ["der Hund", "das Ei", "die Maus"]
                answer: "der Hund"

      - activity: check
        size: quick
        draw: 3
        tasks:
          - id: l1-c1
            type: multiple_choice
            text: "Welches Pronomen passt? das Auto"
            say: "Das Auto ist schnell. Welches Pronomen nimmst du für das Auto?"
            show: { object: car }
            options: ["er", "sie", "es"]
            answer: "es"
          - id: l1-c2
            type: fill_in_blank
            text: "Ergänze das Pronomen."
            say: "Die Banane ist gelb. Welches Pronomen passt in die Lücke?"
            show: { object: banana }
            frame: "Die Banane ist gelb. _ ist süß."
            options: ["Er", "Sie", "Es"]
            answer: ["Sie"]
          - id: l1-c3
            type: true_false
            text: "Der Clown lacht. Er ist lustig.\n\nPasst das Pronomen „er“?"
            say: "Der Clown lacht. Er ist lustig. Passt das Pronomen er?"
            show: { object: clown }
            answer: true
          - id: l1-c4
            type: matching
            text: "Welches Pronomen gehört zu welchem Nomen?"
            say: "Verbinde jedes Nomen mit dem Pronomen, das dazu passt."
            pairs:
              - { left: { text: "der Stuhl" }, right: { text: "er" } }
              - { left: { text: "die Tür" }, right: { text: "sie" } }
              - { left: { text: "das Fenster" }, right: { text: "es" } }
          - id: l1-c5
            type: multiple_choice
            text: "Der Vater liest die Zeitung. Er sitzt auf dem Sofa.\n\nWer sitzt auf dem Sofa?"
            say: "Der Vater liest die Zeitung. Er sitzt auf dem Sofa. Wer sitzt auf dem Sofa?"
            options: ["der Vater", "die Zeitung", "das Sofa"]
            answer: "der Vater"
          - id: l1-c6
            type: true_false
            text: "Die Gitarre klingt schön. Er ist braun.\n\nPasst das Pronomen „er“?"
            say: "Die Gitarre klingt schön. Er ist braun. Passt das Pronomen er?"
            answer: false

  - n: 2
    title: { de: "Wir, ihr, sie", en: "We, you, they" }
    goal:
      de: "Nimm sie, wir und ihr für mehrere, so wie die Kinder spielen, sie spielen Fangen."
      en: "Use sie, wir and ihr for more than one, like the children play, they play tag."
    new_content: true
    activities:
      - activity: warm-up
        from: last-lesson
        tasks:
          - id: l2-w1
            type: multiple_choice
            text: "Welches Pronomen passt? der Kuchen"
            say: "Der Kuchen duftet. Welches Pronomen nimmst du für den Kuchen?"
            show: { object: cake }
            options: ["er", "sie", "es"]
            answer: "er"
            difficulty: easy
          - id: l2-w2
            type: fill_in_blank
            text: "Ergänze das Pronomen."
            say: "Das Ei ist rund. Welches Pronomen passt in die Lücke?"
            show: { object: egg }
            frame: "Das Ei ist rund. _ ist weiß."
            options: ["Er", "Sie", "Es"]
            answer: ["Es"]
            difficulty: easy

      - activity: learn
        mode: worked-examples
        screens:
          - text: "Drei Kinder spielen."
            say: "Hier spielen drei Kinder. Du kennst schon: das Kind, es. Was glaubst du: Welches Pronomen nimmst du für drei Kinder?"
            show: { object: child, count: 3 }
          - text: "die Kinder → sie"
            say: "Nicht es, sondern sie! Auch für mehrere gibt es ein Pronomen. Die Kinder spielen. Sie spielen Fangen. In der Mehrzahl nimmst du immer sie, egal ob es der, die oder das heißt."
            show: { object: child, count: 3 }
          - text: "ich und andere → wir · du und andere → ihr"
            say: "Sprichst du von dir und anderen, sagst du wir: Wir gehen nach Hause. Sprichst du zu mehreren, sagst du ihr: Ihr seid toll."
          - text: "Lena spielt im Garten. Sie lacht laut."
            say: "Ein Text klingt besser, wenn sich die Nomen nicht wiederholen. Lena spielt im Garten. Lena lacht laut. Besser ist: Lena spielt im Garten. Sie lacht laut."

      - activity: practise
        setting: in-context
        stages:
          - support: full
            tasks:
              - id: l2-f1
                type: multiple_choice
                text: "Welches Pronomen passt? die Äpfel"
                say: "Die Äpfel sind reif. Welches Pronomen nimmst du für die Äpfel?"
                show: { object: apple, count: 4 }
                options: ["er", "sie", "es"]
                answer: "sie"
                feedback:
                  "er": "Es heißt der Apfel, aber die Äpfel. In der Mehrzahl heißt es sie."
                hints:
                  - "Ist es ein Apfel oder sind es mehrere?"
                  - "In der Mehrzahl nimmst du immer sie."
                  - "Sie sind reif."
                difficulty: easy
              - id: l2-f2
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Mia und ich gehen ins Kino. Welches Pronomen passt in die Lücke?"
                frame: "Mia und ich gehen ins Kino. _ freuen uns."
                options: ["Wir", "Ihr", "Sie"]
                answer: ["Wir"]
                hints:
                  - "Wer geht ins Kino? Mia und ich, also ich und noch jemand."
                  - "Ich und andere: wir."
                  - "Wir freuen uns."
              - id: l2-f3
                type: multiple_choice
                text: "Welcher Text klingt besser?"
                say: "Welcher Text klingt besser? Lies alle drei."
                options: ["Lea malt ein Bild. Sie malt einen Baum.", "Lea malt ein Bild. Lea malt einen Baum.", "Lea malt ein Bild. Es malt einen Baum."]
                answer: "Lea malt ein Bild. Sie malt einen Baum."
                option_audio: false
                feedback:
                  "Lea malt ein Bild. Lea malt einen Baum.": "Das stimmt, aber Lea kommt zweimal vor. Mit sie klingt es besser."
                  "Lea malt ein Bild. Es malt einen Baum.": "Gemeint ist Lea. Für ein Mädchen mit Namen sagst du sie."
                hints:
                  - "Welcher Text wiederholt nichts?"
                  - "Für Lea passt sie."
                  - "Lea malt ein Bild. Sie malt einen Baum."
              - id: l2-f4
                type: true_false
                text: "Die Kinder lachen. Er hat Spaß.\n\nPasst das Pronomen „er“?"
                say: "Die Kinder lachen. Er hat Spaß. Passt das Pronomen er?"
                answer: false
                feedback:
                  "true": "Die Kinder sind mehrere. In der Mehrzahl heißt es: Sie haben Spaß."
                hints:
                  - "Ist es ein Kind, oder sind es mehrere?"
                  - "Mehrere: sie."
                  - "Nein. Richtig ist: Sie haben Spaß."
              - id: l2-f5
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Mama ruft Tom und Ali etwas zu. Welches Pronomen passt in die Lücke?"
                frame: "Tom und Ali, _ seid schnell!"
                options: ["wir", "ihr", "sie"]
                answer: ["ihr"]
                hints:
                  - "Mama spricht mit Tom und Ali."
                  - "Sprichst du zu mehreren, sagst du ihr."
                  - "Ihr seid schnell!"
              - id: l2-f6
                type: multiple_choice
                text: "Opa und Oma kommen zu Besuch. Sie bringen Kuchen mit.\n\nWer bringt Kuchen mit?"
                say: "Opa und Oma kommen zu Besuch. Sie bringen Kuchen mit. Wer bringt Kuchen mit?"
                options: ["Opa und Oma", "der Kuchen", "der Besuch"]
                answer: "Opa und Oma"
                feedback:
                  "der Kuchen": "Ein Kuchen, der sich selbst mitbringt? Das wäre ein Zauberkuchen! Sie bringen: Das sind mehrere, Opa und Oma."
                hints:
                  - "Es heißt sie bringen. Es sind also mehrere."
                  - "Wer kommt im ersten Satz zu Besuch?"
                  - "Opa und Oma."

          - support: some
            tasks:
              - id: l2-s1
                type: multiple_choice
                text: "Welches Pronomen passt? die Bücher"
                say: "Die Bücher stehen im Regal. Welches Pronomen nimmst du für die Bücher?"
                show: { object: book, count: 3 }
                options: ["er", "sie", "es"]
                answer: "sie"
                hints: ["Ist es ein Buch oder sind es mehrere?"]
              - id: l2-s2
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Mein Bruder und ich spielen Fußball. Welches Pronomen passt in die Lücke?"
                frame: "Mein Bruder und ich spielen Fußball. _ gewinnen."
                options: ["Wir", "Ihr", "Sie"]
                answer: ["Wir"]
                hints: ["Wer spielt? Ich und noch jemand."]
              - id: l2-s3
                type: multiple_choice
                text: "Welcher Text klingt besser?"
                say: "Welcher Text klingt besser? Lies alle drei."
                options: ["Der Vogel singt. Er sitzt im Baum.", "Der Vogel singt. Der Vogel sitzt im Baum.", "Der Vogel singt. Sie sitzt im Baum."]
                answer: "Der Vogel singt. Er sitzt im Baum."
                option_audio: false
                hints: ["Achte darauf, was sich wiederholt, und auf den Artikel."]
              - id: l2-s4
                type: true_false
                text: "Die Mädchen tanzen. Sie tanzen schön.\n\nPasst das Pronomen „sie“?"
                say: "Die Mädchen tanzen. Sie tanzen schön. Passt das Pronomen sie?"
                answer: true
                hints: ["Ein Mädchen oder mehrere?"]
              - id: l2-s5
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Papa fragt Lisa, Ben und Mia. Welches Pronomen passt in die Lücke?"
                frame: "Lisa, Ben und Mia, habt _ Hunger?"
                options: ["wir", "ihr", "sie"]
                answer: ["ihr"]
                hints: ["Mit wem spricht Papa?"]
              - id: l2-s6
                type: multiple_choice
                text: "Die Kinder füttern die Ente. Sie hat Hunger.\n\nWer hat Hunger?"
                say: "Die Kinder füttern die Ente. Sie hat Hunger. Wer hat Hunger?"
                options: ["die Ente", "die Kinder", "der Bauer"]
                answer: "die Ente"
                hints: ["Schau auf das Verb: hat oder haben?"]

          - support: none
            tasks:
              - id: l2-n1
                type: multiple_choice
                text: "Welches Pronomen passt? die Bälle"
                say: "Die Bälle liegen im Garten. Welches Pronomen nimmst du für die Bälle?"
                show: { object: ball, count: 3 }
                options: ["er", "sie", "es"]
                answer: "sie"
              - id: l2-n2
                type: fill_in_blank
                text: "Ergänze das Pronomen."
                say: "Papa und ich kochen. Welches Pronomen passt in die Lücke?"
                frame: "Papa und ich kochen. _ machen Nudeln."
                options: ["Wir", "Ihr", "Sie"]
                answer: ["Wir"]
              - id: l2-n3
                type: multiple_choice
                text: "Welcher Text klingt besser?"
                say: "Welcher Text klingt besser? Lies alle drei."
                options: ["Das Auto ist neu. Es fährt schnell.", "Das Auto ist neu. Das Auto fährt schnell.", "Das Auto ist neu. Er fährt schnell."]
                answer: "Das Auto ist neu. Es fährt schnell."
                option_audio: false
              - id: l2-n4
                type: true_false
                text: "Mama sagt zu Tom und Lea: „Ihr seid laut.“\n\nPasst das Pronomen „ihr“?"
                say: "Mama sagt zu Tom und Lea: Ihr seid laut. Passt das Pronomen ihr?"
                answer: true
