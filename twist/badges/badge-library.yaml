# The badge library: 160 badges in 7 categories. The backend reads this file in the
# Twist import; the counting rule behind each metric is backend code. Order here is the
# order the app shows. A badge's picture is assets/badge-library/<id>.webp, made from the
# designer's file named in art by assets/tools/badge_library.py. threshold: all means every
# year of the subject the child's curriculum has. description is the "you did it" text of an
# earned badge, goal the text a locked badge shows. Inside a category the app shows badges in
# its sets, in the order listed; each badge names its set.
categories:
  - id: consistency
    name: { en: "Consistency", de: "Dranbleiben" }
    sets:
      - id: streaks
        name: { en: "Days in a row", de: "Tage am Stück" }
  - id: mastery
    name: { en: "Mastery", de: "Können" }
    sets:
      - id: perfect-lessons
        name: { en: "Perfect lessons", de: "Alles richtig" }
      - id: perfect-lessons-in-a-subject
        name: { en: "Perfect lessons in a subject", de: "Alles richtig in einem Fach" }
      - id: right-in-a-row
        name: { en: "Right in a row", de: "Richtig hintereinander" }
      - id: right-first-time
        name: { en: "Right first time", de: "Auf Anhieb richtig" }
      - id: school-years-mastered
        name: { en: "School years mastered", de: "Schuljahre gemeistert" }
  - id: effort-growth
    name: { en: "Effort & Growth", de: "Üben & Wachsen" }
    sets:
      - id: lessons-played-again
        name: { en: "Lessons played again", de: "Noch einmal gemacht" }
      - id: better-scores
        name: { en: "Better scores", de: "Besser geworden" }
      - id: mistakes-fixed
        name: { en: "Mistakes fixed", de: "Fehler verbessert" }
  - id: explorer
    name: { en: "Explorer", de: "Entdecken" }
    sets:
      - id: all-subjects-in-a-day
        name: { en: "All subjects in a day", de: "Alle Fächer an einem Tag" }
      - id: all-subjects-in-a-week
        name: { en: "All subjects in a week", de: "Alle Fächer in einer Woche" }
      - id: a-lesson-in-each-subject
        name: { en: "A lesson in each subject", de: "Eine Lektion in jedem Fach" }
  - id: firsts
    name: { en: "Firsts", de: "Erste Male" }
    sets:
      - id: first-steps
        name: { en: "First steps", de: "Erste Schritte" }
      - id: first-in-a-subject
        name: { en: "First in a subject", de: "Zum ersten Mal in einem Fach" }
  - id: star-collector
    name: { en: "Star Collector", de: "Sterne sammeln" }
    sets:
      - id: stars
        name: { en: "Stars", de: "Sterne" }
      - id: stars-in-a-subject
        name: { en: "Stars in a subject", de: "Sterne in einem Fach" }
      - id: stars-in-one-day
        name: { en: "Stars in one day", de: "Sterne an einem Tag" }
  - id: progress
    name: { en: "Progress", de: "Fortschritt" }
    sets:
      - id: lessons
        name: { en: "Lessons", de: "Lektionen" }
      - id: lessons-in-a-subject
        name: { en: "Lessons in a subject", de: "Lektionen in einem Fach" }
      - id: school-years
        name: { en: "School years", de: "Schuljahre" }
      - id: school-years-in-a-subject
        name: { en: "School years in a subject", de: "Schuljahre in einem Fach" }
