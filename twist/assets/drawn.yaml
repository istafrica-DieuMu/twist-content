# Components the app draws from data. No artwork per task: a task names the
# component and passes its data. Facets (currency, number format) change how
# a component looks per curriculum.
# The colours a lesson can name. Swatches and recoloured pictures use the
# same values, so "red" looks the same everywhere.
colours:
  red: "#E53935"
  blue: "#1E88E5"
  yellow: "#FDD835"
  green: "#43A047"
  orange: "#FB8C00"
  purple: "#8E24AA"
  pink: "#F48FB1"
  brown: "#8D6E63"
  black: "#263238"
  white: "#FFFFFF"

components:
  - id: dots
    what: A group of dots, loose or in a dice pattern, for counting and seeing amounts at a glance
    data: "count: 1-20, layout: [scattered, dice, row, five-structure], colour_split: optional, e.g. [3, 2]; or array: [rows, columns] for a Punktefeld, split_rows: n colours the first n rows red and the rest blue; or groups: [a, b] with layout: dice for two dice side by side (the second in blue)"

  - id: ten-frame
    what: A 2 x 5 frame with counters
    data: "filled: 0-10, colour_split: optional, e.g. [6, 2], cross: how many of the last counters are crossed out, cross_from: start crosses the first ones instead (the whole top row for minus 5)"
    names: { de: Zehnerfeld, en: ten-frame }

  - id: zwanzigerfeld
    what: Two ten-frames, one above the other, for numbers to 20 and adding across ten
    data: "filled: '[first, second] counters, e.g. [8, 5]', move: optional counters moved from the second frame to the first"
    names: { de: Zwanzigerfeld, en: twenty-frame }

  - id: number-line
    what: A number line with ticks, labels and jumps
    data: "from: 0, to: 20 (negative numbers allowed), labels: [all, tens, ends, fractions] (fractions names each tick as a fraction, fractions_of: the denominator, e.g. step 0.125 with fractions_of 8), jumps: 'list of [start, size]', step: 1 / 5 / 10, or 0.1 / 0.01 for decimals, mark: a value to point at; decimals print as 0.5 in en-GB and 0,5 in de-DE"
    names: { de: Zahlenstrahl, en: number line }

  - id: rechenstrich
    what: An empty number line with jumps and their sizes written above
    data: "start: 8, jumps: [2, 3]; a minus jump goes left (start: 43, jumps: [-3, -3]); no jumps draws a dashed ? hop, to the left with back: true"
    names: { de: Rechenstrich, en: empty number line }

  - id: equation
    what: A calculation with optional gaps and highlighted parts
    data: "text: '8 + 5 = _', gaps: positions, split: optional '5 = 2 + 3' under a number"
    facets: [operation-signs]

  - id: part-whole
    what: The part-whole model used in England, a whole circle above two part circles joined by lines
    data: "whole: 5, parts: '[2, 3]', null is a gap shown as ?"

  - id: number-house
    what: A number house (Zahlenhaus) showing a number and its parts
    data: "roof: 10, rows: '[[8, 2], [7, 3]]'"
    names: { de: Zahlenhaus, en: number bonds house }
  - id: written-calc
    what: A written column calculation (schriftliches Addieren and Subtrahieren) with the Übertrag
    data: "rows: numbers as strings, op: +, - or × (short multiplication), partials: the partial products of long multiplication (drawn between two lines, the result below), carry: a string of carried digits aligned to the columns (spaces where none), result: string with _ for a gap, above: small digits over the first number (Entbündeln), cross: x under a digit of the first number crosses it out"
    names: { de: schriftliche Rechnung, en: column method }
  - id: number-wall
    what: A number wall (Zahlenmauer); each brick is the sum of the two bricks under it
    data: "rows: bottom row first, e.g. '[[3, 5, 2], [8, 7], [null]]', null is a gap shown as ?"
    names: { de: Zahlenmauer, en: number wall }

  - id: base-ten
    what: Tens rods and ones cubes
    data: "hundreds: 0-9 (optional), tens: 0-9, ones: 0-18 (more than 9 ones before bundling)"

  - id: hundred-field
    what: The Hunderterfeld, a 10 by 10 field of dots with gaps after five in both directions
    data: "filled: 0-100 (fills row by row), colour_split: optional"

  - id: place-value-chart
    what: A place-value chart (Stellentafel), with columns labelled by language (Z E, T O; H Z E, H T O; T H Z E, Th H T O)
    data: "columns: [tens, ones], [hundreds, tens, ones] up to [millions, hundred-thousands, ten-thousands, thousands, hundreds, tens, ones], and after ones the decimal columns tenths, hundredths, thousandths (a decimal point is drawn), values: list with null for a gap"

  - id: hundred-square
    what: A 10 x 10 number square with highlights
    data: "highlight: list, hide: list"

  - id: clock
    what: An analogue clock face, with or without a digital display
    data: "hour: 1-12, minute: 0-59, digital: optional, roman: true for a face with I to XII"
    facets: [time-format]

  - id: ruler
    what: A ruler in centimetres with a coloured strip above it to measure
    data: "to: the ruler's last cm (15 if left out), length: the strip in cm, to the millimetre (3.8), start: where the strip begins (0 if left out), colour: [red, blue, green]"
    names: { de: Lineal, en: ruler }

  - id: coins
    what: Coins and notes of the curriculum's currency, or of the one named (euro coins in en-GB French lessons)
    data: "values: list (in cent or pence), currency: optional, eur or gbp"
    facets: [currency]

  - id: shape
    what: A 2D shape or a 3D solid, outline or filled
    data: "kind: [circle, triangle, square, rectangle, pentagon, hexagon, octagon, parallelogram, trapezoid, cube, cuboid, sphere, cylinder, cone, pyramid], colour: optional; or row: [kinds] / column: [kinds] for a line of shapes (a pattern), with colours: [one per shape] or one colour, '?' for a gap, size: optional"

  - id: letter-card
    what: A letter or a group of letters on a card, upper and lower case
    data: "text: 'Mm', style: [print, highlight-first]"

  - id: syllable-arcs
    what: A word with syllable arcs drawn under it (Silbenbögen)
    data: "word: Lama, syllables: [La, ma]"
    names: { de: Silbenbögen, en: syllable arcs }

  - id: writing-lines
    what: School writing lines with a letter or word to trace or copy, in the curriculum's script
    data: "text: 'l', mode: [trace, copy], arrows: true, script: joined (Schreibschrift in the school's Ausgangsschrift: SAS, LA, VA or Grundschrift, a setting by Land; print if left out)"
    facets: [script]

  - id: sound-chart
    what: An Anlauttabelle, each field a letter with a picture whose word starts with that sound (M wie Maus)
    data: "letters: [m, a, s] (a short chart, or the whole one if left out), pictures: {m: mouse} (else the first drawn picture with that initial), mark: m (highlights a field), gaps: [s] (fields shown as ?), columns: 5"
    names: { de: Anlauttabelle, en: sound chart }

  - id: word-card
    what: A word or short sentence in large print, for reading tasks
    data: "text: 'Mama', syllable_colours: optional"

  - id: colour-swatch
    what: A plain round patch of one colour
    data: "colour: [red, blue, yellow, green, orange, purple, pink, brown, black, white]"

  - id: bar-chart
    what: A bar chart or pictogram from a small table
    data: "rows: '[[label, value]]', step, from: scale start above 0 (cut-off axis), tally: true, pictogram_object: an object id draws a pictogram instead (each row repeats the picture value / key times, half a picture for a remainder), per: what one picture stands for (1 if left out; key is the older name for it, and as an option key is the option's id, so a pictogram option uses per); a label naming a colour (Gelb, Team Grün) draws its bar in that colour, other bars take the palette in order"

  - id: grid
    what: Squared paper (Karopapier) or a dot grid with filled squares, half squares, lines, a mirror line and labels
    data: "cols, rows, cells: [[c, r, colour]], halves: [[c, r, corner tl/tr/bl/br, colour]], lines: [[c1, r1, c2, r2]], axis: c (vertical mirror line), axis_row: r (horizontal mirror line), diagonal: down or up (a dashed mirror line corner to corner, from the top left or bottom left), labels: [[c, r, text]], dots: true; as an option it needs a key"
    names: { de: Karopapier, en: squared paper }

  - id: cubes
    what: A building of cubes from its plan, drawn as a building, as its plan with the heights, or as the view from the front, the right side or the top
    data: "plan: [[2, 1], [1, 0]] (rows back to front, columns left to right, stack heights), mode: [building, plan, front, side, top], colour; a plan names its top row hinten / back and its bottom row vorne / front (sides: false leaves the names out); as an option it needs a key"
    names: { de: Würfelgebäude, en: cube building }

  - id: fraction
    what: A circle, bar or rectangle split into equal parts, some of them coloured
    data: "kind: [circle, bar, rect], parts, shaded, rows (rect only), colour; as an option its key is shaded/parts"

  - id: spinner
    what: A spinner (Glücksrad) with equal sectors and a pointer
    data: "sectors: [red, red, blue], one colour per sector; as an option it needs a key"
    names: { de: Glücksrad, en: spinner }

  - id: table
    what: A table of rows and columns, with a header row, or as a spreadsheet with column letters and row numbers
    data: "rows: [[cells]], header: false, sheet: true, mark: [[r, c]]; '?' is a gap; as an option it needs a key"
    names: { de: Tabelle, en: table }

  - id: angle
    what: An angle between two arms, with its arc and size, a right-angle square at 90°, optionally a protractor laid on it
    data: "degrees: 0 to 360, rotate: turns the whole angle, label: shown text ('?' to ask, false for none, else the degrees), protractor: true (0 to 180 with inner and outer scales)"
    names: { de: Winkel, en: angle }

  - id: circle
    what: A circle with its parts drawn in (centre, radius, diameter, circumference, chord), named or with one coloured red
    data: "parts: list, labels: true, highlight: a part, values: { radius: '4 cm' }"
    names: { de: Kreis, en: circle }

  - id: coordinates
    what: A square grid with numbered x and y axes, in the first quadrant or all four, with points, a shape and a moved copy
    data: "quadrants: 1 or 4, max: 10 (1st) or 6 (4 quadrants), points: [[x, y, 'A']], shape: [[x, y], ...], moved: [[x, y], ...] (dashed, green), mirror: { axis: x or y, at: 0 }"
    names: { de: Koordinatensystem, en: coordinate grid }

  - id: line-graph
    what: A line graph, points joined over labelled positions, with a scale
    data: "rows: [[label, value]], step, ylabel"
    names: { de: Liniendiagramm, en: line graph }

  - id: pie-chart
    what: A pie chart with sectors in proportion and a key; colour words in labels pick their colour
    data: "parts: [[label, value]]"
    names: { de: Kreisdiagramm, en: pie chart }

  - id: thermometer
    what: A thermometer in °C, filled to a temperature, negative temperatures allowed
    data: "from: -10, to: 30, step: 5, value: -3, mark: a value to point at"
    names: { de: Thermometer, en: thermometer }

  - id: short-division
    what: Short division in the bus stop layout, the divisor outside, the quotient on top, carried remainders as small digits
    data: "divisor: 4, dividend: '824', quotient: '206' (spaces for empty places, _ for a gap), carries: small digits before dividend digits, aligned ('  2' puts a 2 before the third digit), remainder: optional"
    names: { de: schriftliche Division, en: short division }
