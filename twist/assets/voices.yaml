# The Twist voice: one character for every spoken line, sound and phrase.
# `brief` goes with every request to a model that takes directions
# (Gemini), so the delivery stays the same across lessons. Models that take
# no directions (ElevenLabs, MAI) keep the character through the voice
# itself.
#
# `chosen` is the voice in use; `assign` gives some activities or phrase
# groups to another voice; `candidates` are the voices kept from the
# 2026-10-13 pilot. A candidate's own `brief` replaces the shared one.
# Lines in a target language (English in Englisch lessons) get `en_note`
# added to the brief; German lines in those lessons get `mixed_note`.
brief: >
  A warm, bright young primary school teacher whom children like. Standard
  German (Hochdeutsch) with no regional accent. Speaks slowly and clearly for
  six-year-olds, with a smile in the voice; encouraging, never babyish, never
  sing-song, never over-excited. A short pause after a question.
en_note: >
  This line is English, said to a German child learning English: clear,
  natural British English, a little slower than usual.
# Lines in a language other than the voice's own get that language's note
# (English lines of a German voice get en_note above).
target_notes:
  fr: >
    This line is French, said to an English child learning French: clear,
    natural standard French from France, a little slower than usual.
# Home-language lines in a foreign-language lesson, by the line's language
# (German lines in English lessons get mixed_note below).
mixed_notes:
  # English lines in DaZ lessons (target German), by "<line language>.<target>".
  en.de: >
    This English line comes from a lesson for a child learning German and
    may contain German words or short German phrases (Hallo, Tschüss, Lama):
    say those in clear standard German, and every English word in British
    English.
  en: >
    This English line comes from a French lesson and may contain French
    words or short French phrases (Écoutez, la banane): say those in clear
    standard French, and every English word in British English.
mixed_note: >
  This German line comes from an English lesson and may contain English
  words or short English phrases (Listen, Stand up, boat): say those in
  clear British English, and every German word in German.
language: de
chosen: gemini-sulafat
# Puck speaks every Check and the phrase that opens it, so the child hears
# that this part counts. Sulafat teaches and practises; she comes back for
# "Geschafft!" at the end.
assign:
  check: gemini-puck
  phrases.check_start: gemini-puck
# A character's line (a task's `audio` with `speaker: male` or `female`) is
# spoken by a voice of that kind, whatever the activity, so a boy called Tom
# never sounds like a woman.
speakers: { male: gemini-puck, female: gemini-sulafat }
# Each curriculum has its own voices with its own brief; the voices above
# (chosen, assign) are de-DE's, and the default.
curricula:
  en-GB:
    language: en
    chosen: gemini-sulafat-en
    assign:
      check: gemini-puck-en
      phrases.check_start: gemini-puck-en
    speakers: { male: gemini-puck-en, female: gemini-sulafat-en }
  # DaZ (curricula/de-DE.yaml tracks.daz): instructions in English by the
  # en-GB voices; the German the child learns goes to the German voices
  # through language_voices below.
  de-DE.daz:
    language: en
    chosen: gemini-sulafat-en
    assign:
      check: gemini-puck-en
      phrases.check_start: gemini-puck-en
    speakers: { male: gemini-puck-en, female: gemini-sulafat-en }
# A line in a language with its own voices goes to that language's voice in
# the same role: French in en-GB French lessons is said by native French
# voices, not the English ones with a note.
language_voices:
  fr: { gemini-sulafat-en: gemini-sulafat-fr, gemini-puck-en: gemini-puck-fr }
  # German in DaZ lessons, whose instructions are English.
  de: { gemini-sulafat-en: gemini-sulafat, gemini-puck-en: gemini-puck }
candidates:
  - { id: gemini-sulafat, model: google/gemini-3.8-flash-tts, voice: Sulafat, note: "female, warm; teaches and practises" }
  - id: gemini-puck
    model: google/gemini-3.8-flash-tts
    voice: Puck
    note: "male; speaks the Checks"
    brief: >
      A calm, friendly young primary school teacher running a short check.
      Standard German (Hochdeutsch) with no regional accent. A little more
      focused and serious than in the lesson: steady, even pace, clear and
      quiet confidence, no jokes, no extra cheer. Still kind; never strict
      or cold. Speaks slowly and clearly for six-year-olds, with a short
      pause after a question. A single letter in a sentence (L, M, O, A) is
      said as its sound (lll, mmm, ooo, aaa), never as its letter name.
  - id: gemini-sulafat-en
    model: google/gemini-3.8-flash-tts
    voice: Sulafat
    language: en
    note: "female, warm; teaches and practises in en-GB"
    brief: >
      A warm, bright young primary school teacher in England whom children
      like, talking to four- and five-year-olds in Reception. Clear, natural
      British English (southern standard), no strong regional accent. Speaks
      slowly and clearly, with a smile in the voice; encouraging, never
      babyish, never sing-song, never over-excited. A short pause after a
      question. When a word is split into its sounds with dots (c ... a ...
      t), say each part as a short pure sound (k, a, t), never as the letter
      name.
  - id: gemini-puck-en
    model: google/gemini-3.8-flash-tts
    voice: Puck
    language: en
    note: "male; speaks the Checks in en-GB"
    brief: >
      A calm, friendly young primary school teacher in England running a
      short check with four- and five-year-olds. Clear, natural British
      English, no strong regional accent. A little more focused and serious
      than in the lesson: steady, even pace, quiet confidence, no jokes, no
      extra cheer. Still kind; never strict or cold. A short pause after a
      question. When a word is split into its sounds with dots (c ... a ...
      t), say each part as a short pure sound (k, a, t), never as the letter
      name.
  - id: gemini-sulafat-fr
    model: google/gemini-3.8-flash-tts
    voice: Sulafat
    language: fr
    note: "female, warm; French words and lines in en-GB French lessons"
    brief: >
      A warm, friendly young primary school teacher from France, a native
      French speaker from the Paris area, talking to a five- to seven-year-old
      English child who is learning French. Clear, natural standard French
      with a true French accent, never an English one. Each word complete to
      its very end, nasal vowels and the French r included. Unhurried: a
      single word is held a moment, as for a beginner repeating after her.
  - id: gemini-puck-fr
    model: google/gemini-3.8-flash-tts
    voice: Puck
    language: fr
    note: "male; French words and lines in the Checks of en-GB French lessons"
    brief: >
      A calm, friendly young primary school teacher from France, a native
      French speaker from the Paris area, running a short check with an
      English child of five to seven who is learning French. Clear, natural
      standard French with a true French accent, never an English one; each
      word complete to its end, nasal vowels and the French r included.
      Steady, even pace, quiet confidence, still kind.
