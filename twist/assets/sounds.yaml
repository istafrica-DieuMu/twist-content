# Recorded sounds. A text-to-speech voice cannot say a bare phoneme
# reliably, so phonemes are recorded once per language and reused. Words and
# sentences are spoken by the curriculum's voice (recorded or text-to-speech)
# and need no entry here: a task writes `say: { text: "Mama" }` and the
# voice team works from the generated narration list.
#
# Phoneme ids: <language>.<sound>. Long vowels carry a colon.
sounds:
  - { id: de.l, what: "German /l/ as in Lama, held: lll", status: needed }
  - { id: de.m, what: "German /m/ as in Mama, held: mmm", status: needed }
  - { id: "de.o:", what: "German long /o:/ as in Oma", status: needed }
  - { id: "de.a:", what: "German long /a:/ as in Ameise", status: needed }
  - { id: de.o, what: "German short /o/ as in offen", status: needed }
  - { id: de.a, what: "German short /a/ as in Affe", status: needed }
  - { id: de.ma, what: "German syllable Ma, as read in Ma-ma", status: needed }
  - { id: de.mo, what: "German syllable Mo", status: needed }
  - { id: de.la, what: "German syllable La", status: needed }
  - { id: de.lo, what: "German syllable Lo", status: needed }
  - { id: de.al, what: "German syllable Al", status: needed }
  - { id: de.om, what: "German syllable Om", status: needed }
