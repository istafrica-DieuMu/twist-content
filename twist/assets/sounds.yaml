# Recorded sounds. A text-to-speech voice cannot say a bare phoneme
# reliably without direction, so phonemes and syllables are made once per
# language and reused. Words and sentences are spoken by the curriculum's
# voice and need no entry here.
#
# Phoneme ids: <language>.<sound>. Long vowels carry a colon; the file name
# writes the colon as "-long" (de.o: is sounds/de.o-long.mp3).
# `say` is the text the voice reads; `how` is the hand-written direction
# for the delivery. Each voice in voices.yaml has its own copy, made by
# tools/narration.py. Status: needed, test (made for the voice pilot),
# recorded (in the chosen voice), checked.
sounds:
  - id: de.l
    what: "German /l/ as in Lama, held: lll"
    say: "lll"
    how: "Only the German consonant sound l, held for about one second, like the start of Lama. Not the letter name El. No vowel before or after it."
    status: recorded
  - id: de.m
    what: "German /m/ as in Mama, held: mmm"
    say: "Mmmm"
    how: "Only the German consonant sound m: lips closed the whole time, one steady hum for about one second, like the start of Mama. Not the letter name Em, not m-hm, no vowel, no second sound."
    status: recorded
  - id: "de.o:"
    what: "German long /o:/ as in Oma"
    say: "Oh"
    how: "Only the long German vowel o (IPA o:) as in Oma, Ofen and Ohr, rounded lips, held for about one second. A pure o, not u, not ou. No h sound and no consonant before or after it."
    status: recorded
  - id: "de.a:"
    what: "German long /a:/ as in Ameise"
    say: "aaa"
    how: "Only the long German vowel a as at the start of Ameise, mouth wide open, held for one second and then stopped. No consonant before or after it."
    status: recorded
  - id: de.o
    what: "German short /o/ as in offen"
    say: "o"
    how: "Only the short German vowel o as at the start of offen, said once, short. No consonant before or after it."
    status: recorded
  - id: de.a
    what: "German short /a/ as in Affe"
    say: "a"
    how: "Only the short German vowel a as at the start of Affe, said once, short. No consonant before or after it."
    status: recorded
  - id: de.ma
    what: "German syllable Ma, as read in Ma-ma"
    say: "Ma"
    how: "Only the German syllable Ma, as the first half of Mama, said once, clearly, with a long open a."
    status: recorded
  - id: de.mo
    what: "German syllable Mo"
    say: "Mo"
    how: "Only the German syllable Mo, as at the start of Mond, said once, clearly, with a long rounded o."
    status: recorded
  - id: de.la
    what: "German syllable La"
    say: "La"
    how: "Only the German syllable La, as the first half of Lama, said once, clearly, with a long open a."
    status: recorded
  - id: de.lo
    what: "German syllable Lo"
    say: "Lo"
    how: "Only the German syllable Lo, as in Lotto, said once, clearly, with a rounded o."
    status: recorded
  - id: de.al
    what: "German syllable Al"
    say: "Al"
    how: "Only the German syllable Al, as at the start of alle: a short open a, then l. Said once, clearly. Not the English name Al."
    status: recorded
  - id: de.om
    what: "German syllable Om"
    say: "Om"
    how: "Only the German syllable Om, as at the start of Omnibus: a rounded o, then m with closed lips. Said once, clearly."
    status: recorded
