# What the app says between tasks, in the Twist voice. Hand-written; the
# app picks one at random from a group so it does not repeat itself.
de:
  correct: ["Richtig!", "Super!", "Genau!", "Toll gemacht!"]
  try_again: ["Fast. Versuch es noch einmal.", "Noch nicht ganz. Schau noch einmal hin."]
  hint: ["Hier ist ein Tipp."]
  show_answer: ["Schau, so geht es."]
  next: ["Weiter geht's."]
  stage_done: ["Prima!", "Super gemacht!", "Toll, weiter so!"]
  warmup_start: ["Wir wärmen uns auf.", "Erst mal aufwärmen!"]
  learn_start: ["Jetzt entdecken wir etwas Neues.", "Schau mal, was heute neu ist."]
  practise_start: ["Jetzt üben wir.", "Auf geht's, wir üben."]
  check_start: ["Jetzt zeigst du, was du kannst."]
  lesson_done: ["Geschafft! Die Lektion ist fertig!"]
  # Drill instructions, one each; practice-rules.mjs (DRILL_TXT) shows the same words.
  drill_hear: ["Welches Wort hörst du?"]
  drill_read: ["Lies schnell!"]
  drill_write: ["Schreib das Wort."]
  drill_colour: ["Welche Farbe hörst du?"]
  drill_number: ["Welche Zahl hörst du?"]
en:
  correct: ["Well done!", "That's right!", "Brilliant!", "Yes, that's it!"]
  try_again: ["Nearly. Have another go.", "Not quite. Look again."]
  hint: ["Here's a hint."]
  show_answer: ["Look, this is how it goes."]
  next: ["On we go."]
  stage_done: ["Great!", "Well done!", "Brilliant, keep going!"]
  warmup_start: ["Let's warm up.", "Time to warm up!"]
  learn_start: ["Let's find out something new.", "Look what's new today."]
  practise_start: ["Now let's practise.", "Off we go, let's practise."]
  check_start: ["Now show me what you can do."]
  lesson_done: ["You did it! That's the end of the lesson."]
  drill_hear: ["Which word do you hear?"]
  drill_read: ["Read it quickly!"]
  drill_write: ["Write the word."]
  drill_colour: ["Which colour do you hear?"]
  drill_number: ["Which number do you hear?"]
