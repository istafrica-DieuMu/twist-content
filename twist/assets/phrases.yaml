# What the app says between tasks, in the Twist voice. Hand-written; the
# app picks one at random from a group so it does not repeat itself.
de:
  correct: ["Richtig!", "Super!", "Genau!", "Toll gemacht!"]
  try_again: ["Fast. Versuch es noch einmal.", "Noch nicht ganz. Schau noch einmal hin."]
  hint: ["Hier ist ein Tipp."]
  show_answer: ["Schau, so geht es."]
  next: ["Weiter geht's."]
  stage_done: ["Prima! Jetzt mit weniger Hilfe."]
  check_start: ["Jetzt zeigst du, was du kannst."]
  lesson_done: ["Geschafft! Die Stunde ist fertig."]
