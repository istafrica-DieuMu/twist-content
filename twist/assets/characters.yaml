# Pip, the Twist mascot: a small purple cat-fox with a lighter belly, big
# eyes, a black mortarboard with a gold tassel and a red pointer stick.
# A few poses, reused everywhere. Pip appears in Learn activities and on
# feedback, not inside task pictures.
characters:
  - id: pip-point
    what: Pip pointing with the red stick, for Learn screens and explanations
    status: needed
  - id: pip-cheer
    what: Pip cheering, thumbs up, for a correct answer and the end of a lesson
    status: needed
  - id: pip-think
    what: Pip thinking, paw on chin, for hints
    status: needed
  - id: pip-listen
    what: Pip with a paw behind the ear, for listening tasks
    status: needed
  - id: pip-speak
    what: Pip with an open mouth and a speech bubble, for speaking tasks
    status: needed
  - id: pip-wave
    what: Pip waving, for greetings and the warm-up
    status: needed
