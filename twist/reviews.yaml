    checked: answers and one right option worked out; pictures and drawn data against the question; the story, numbers and question on screen in every task; tables, plans and pictograms drawn; options in the year's range; native wording; year fit; parts against the I-can line; hints and methods in checks; near repeats
    result: about 560 fixes in all 225 sets. Player fixes from the audit and the reviewers (ordering draws its show, scattered layouts above 12, screens shrink to fit, words and sums fit their tiles, tables fit, a number line hides its last label when that is the answer, frames break at " | ", a repeated frame text gives way to "Was fehlt?", drawn plans name hinten and vorne). Build warnings for options below zero in the early years and for tables written as text in maths. Brief points 10 to 15 from the critic's patterns
