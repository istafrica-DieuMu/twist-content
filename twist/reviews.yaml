open:
  - what: "CVC pictures for Reception and Year 1 phonics: pin, tin, pan, mop, rug, nut, net, peg, hill, doll, log and nest (asked for by the en-GB phonics reviewers, so tasks that now play the word can show a picture)"
    status: open
  - what: A native German speaker reads the screens (a teacher, not a model)
    status: open
  - what: joined-capitals states which letters join; that depends on the school's script (VA, LA, SAS)
    status: done
    how: the lesson names no join that differs between SAS, LA and VA (only O, which does not join in any), and the model is drawn in the school's script
  - what: No Anlauttabelle component; sound-chart lessons show single pictures
    status: done
    how: a sound-chart component in the player; the sound-chart lesson shows it in Learn and on the "which field" tasks
  - what: The player draws print on writing lines, never joined-up script (Schreibschrift)
    status: done
    how: writing-lines takes script joined and draws it in the school's Ausgangsschrift (SAS, LA, VA or Grundschrift, a player setting); the three joined-writing lessons use it
  - what: en-weather teaches "It's rainy"; a native English speaker could weigh it against "It's raining"
    status: done
    how: the Englisch weather sets teach "It's raining" and "It's snowing" for weather now and "It will rain" for tomorrow; "rainy" stays only before a noun or in a description
  - what: "Regional words for a teacher to weigh: Mäppchen or Federtasche (an ä task relies on Mäppchen), Möhre or Karotte (picture-name tasks rely on Möhre), Fasching, Geldbeutel, Brötchen, Pulli"
    status: open
  - what: "Terms that differ by Land or textbook: the carry phrase (now 'Schreib 3, übertrag 1'), entbündeln, Nachbarzehner, Zehnerfreunde, Silbenschwingen, Verbzusatz or Vorsilbe, Wen-Fall or Akkusativ, Viertel vier"
    status: open
  - what: Stop sounds written as single letters in say ("fängt mit b an") may be read as the letter name; listen to a sample
    status: done
    how: the listening model was asked sound or letter name on a sample of 12 clips; 11 were the bare sound, the 12th is a spelling question ("Warum endet Feld mit d"), where the letter name is right
  - what: A native English and a native French speaker read the en-GB screens (people, not a model)
    status: open
    how: a model native pass is done (see the pass of the same name); a native teacher of each language still reads them
  - what: "Year fit beyond the National Curriculum for a teacher to weigh: probability in Years 3 and 4, tonnes in Year 4, km in Year 3, circles with compasses in Year 5 (the NC has Year 6); fair games, codes, complex buildings and digital tools have no NC statement"
    status: done
    how: tonnes left Year 4 (kilograms and grams instead); Year 3 length keeps to mm, cm and m and Year 4 teaches km; circles with compasses moved to Year 6; every placed skill now maps to a standard of its own curriculum or is listed under enrichment with a reason (15 in en-GB, among them probability, codes and digital tools; 3 in de-DE), and the build enforces it
  - what: Joined handwriting says capitals stay unjoined, which is not true in every continuous-cursive scheme
    status: done
    how: the Year 3 and Year 5 sets say many schools do not join capitals and the teacher shows how the school does it; the lessons leave them unjoined
  - what: French prices are written the English way (2.50 euros as €2.50) and euro coins are not drawn in en-GB
    status: done
    how: French text writes 2,50 €, taught once in fr-numbers-to-100 with euro coins (coins take currency eur)
  - what: "Narration to listen to: speaker gender against the voice, and how the voice reads ½, ° and 1/2"
    status: done
    how: the listening check showed fractions misread ("seven take away five" for 7/5); the voice now gets fractions, ½, ×, ÷, °C, cm², %, ratios, remainders and negatives as words. Character lines carry speaker male or female (about 240) and dialogues are turns; the checker asks for a speaker when a character says their name
  - what: "No interaction yet for drawing with a ruler, protractor or compasses, plotting by tapping a grid point, marked free writing or speech, a drag clock, a scene for prepositions, or labelled circle parts; those lessons use choices, ordering and planning instead"
    status: done
    how: clock_hands_drag (8 time sets), point_on_grid (4 coordinate sets) and a circle component with its parts (2 sets) are built and used
  - what: Still no interaction for drawing with a ruler, protractor or compasses, a scene for prepositions, or marked free writing and speech; marking speech and writing is a product decision for the app teams
    status: open
  - what: "Points from the native passes for a teacher: \"I have got\" against \"I've got\" across the Englisch sets; \"a dice\"; \"Fill the gap\" against \"Fill in the gap\"; single quotes for speech in stories while inverted-commas teaches double; Je suis fatigué with a picture of a girl in fr-sentences; first-person lines inside Learn say cannot carry a speaker"
    status: open
  - what: "Phonics hints in Years 1 and 2 segment words for the voice (\"l ... ee ... f\", \"c ... ay ... k\"); listen once narrated whether the voice says sounds, not letter names. Task audio already plays bank sounds in order (audio sounds)"
    status: open
  - what: "Points from the Reception and Year 1 read for a teacher: the coined sound descriptions (hiss, hush, pop of your lips) against the school's phonics scheme; small letter or lower-case letter; magic e; take away or subtract; × and clockwise in Year 1 (NC Year 2); a pencil said to be shorter than a hand span; Year 1 sets carry ages 6-7"
    status: open
  - what: "Check pools, batch 1: write-numerals-to-10 has no tracing in any check, so writing the numerals is never marked (tracing accepts any ink). Some older check tasks keep the story, the numbers or a strategy only in say (add-meaning l2-c2, l2-c4; compare-to-20 l2-c4; commutative l2-c4, whose say is a hint); a lessons-check rule could flag a check task whose say carries numbers its text lacks"
    status: open
  - what: "Narration: the de-DE check voice spells \"ct\" as the letters C T (\"eins C T\", clip a0a37d5def) where the lesson voice says Cent; the listening check passes it. A rule in narration.py spoken() for a number before ct and € (Cent, Euro, ein for one) would change about 62 ct lines and the € lines, which then need new clips in both German voices"
    status: done
    how: narration.py say_money_de() and the player's sayMoneyDe() read a number before € and ct as Euro and Cent (5,70 € as fünf Euro siebzig, one as ein); the money lines are narrated again in both German voices
  - what: "Phase 1 pilots, lesson fixes outside the check pools: split-digraphs Practise true/false tasks say the target word aloud (\"Hop with an e on the end says hope\"); en-food lesson 2 Learn speaks \"Here you are. Thank you!\" but never shows it; blend-cvc Practise l2-s3 uses fizz and fuss (ss, zz) while Learn teaches only ck and ll; en-food checks l1-c2, l1-c3 and l2-c5 use food words from earlier sets"
    status: open
  - what: "table-7 checks: every n · 7 from 5 to 10 is a Learn sum, so l2-c13 asks 7 · 10 and 7 · 9 (the Learn sum turned round, and c7 in the same pool asks 7 · 9), and l1-c2 and l2-c12 now both use 4 · 7, which two other pool tasks ask. A times-table check has to ask the table's facts; decide whether the Learn-example rule should treat a turned-round fact as the same sum in table sets"
    status: done
    how: decided 2026-10-20 that one reuse of a Learn example in a check is fine as long as it stays rare; the build warns from the second in a check. l1-c2 (8 · 7) and l2-c12 (9 · 7) are back to their first versions, so neither pool repeats 4 · 7; l2-c13 keeps 7 · 10 and 7 · 9. 5 checks still reuse two or more, all in sets waiting for pools
  - what: "Phase 1 pilots, format questions for the user before Phases 4 to 6 (practice-content plan): reading checks by passage (2 passages, 2 or 3 questions each) and new texts per pool; phonics parts by sound family, no encoding tasks in reading checks, silent picture options; Reception pools on the set's own letters and about 10 new CVC pictures; Deutsch spelling answer form and dictation with a picture or gap; foreign-language checks on the set's own words with Ja/Nein buttons"
    status: open
