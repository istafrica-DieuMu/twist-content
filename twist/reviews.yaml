# Review passes over the lessons, newest last. Hand-written; tracking.mjs
# renders it into views/tracking.md. A pass names what it read, what it
# checked and where the fixes went. Open points stay listed until closed.
passes:
  - date: 2026-10-14
    name: Full de-DE review
    scope: all 338 de-DE lesson sets drafted at the time (Mathe, Deutsch, Englisch)
    sets: 338
    checked: correct answers and one right option; native German; hints from nudge to answer; Learn teaches what Practise asks; skill checks that do not repeat earlier tasks; year fit; pictures and components that exist
    result: about 220 lesson sets fixed; letter groups chained as prerequisites
    commit: 7d039b19

  - date: 2026-10-14
    name: Review follow-up and authoring checks
    scope: open points of the full review, and the 30 drafts the parallel session left (Deutsch Klasse 4 media and language, Englisch)
    sets: 30
    checked: as above; ballads quotes against Wikisource
    result: Klasse 4 divisors, Klasse 2 Cent range, Nomen/Verb/Adjektiv in every year, timed check for fluency-to-20, new shape kinds and the table component; "Authoring checks" written into docs/lesson-anatomy.md and lessons-check.mjs
    commit: 3d944218

  - date: 2026-10-14
    name: Review of the parallel session's committed sets
    scope: the 67 lesson sets committed by the parallel session (Mathe geometry, data, chance, fractions; Deutsch Klasse 1 to 4)
    sets: 67
    checked: as above, plus every grid, cube, net, spinner, table and bar chart against the player's drawing code
    result: fixes in about 50 sets; bars take the colour their label names; crossed-out pictures for "not allowed" signs; true/false statements on screen
    commit: 0afae4f6

  - date: 2026-10-14
    name: Pictures and narration
    scope: pictures the lessons asked for; narration for every line
    checked: each new picture looked at before it was marked drawn
    result: 45 pictures added and used in 25 lesson sets; 51 204 de-DE clips made, none missing
    commit: dcfe4254

  - date: 2026-10-14
    name: Native German pass
    scope: every screen of all 433 de-DE lesson sets read as a German Grundschule teacher would (what the child sees and hears), about 21 000 screens, then a consistency sweep
    sets: 433
    checked: does each screen make sense on its own; native German, not translated English; school terms; spelling, number and unit formats; options parallel; say matches the screen
    result: about 2 500 small fixes in about 330 sets; house choices for the carry ("Schreib 3, übertrag 1"), "Es ist alles richtig.", "|" for separators; joined-capitals names no join that differs by script
    commit: f20878ae

open:
  - what: A native German speaker reads the screens (a teacher, not a model)
    status: open
  - what: joined-capitals states which letters join; that depends on the school's script (VA, LA, SAS)
    status: done
    how: the lesson names no join that differs between SAS, LA and VA (only O, which does not join in any), and the model is drawn in the school's script
  - what: No Anlauttabelle component; sound-chart lessons show single pictures
    status: done
    how: a sound-chart component in the player; the sound-chart lesson shows it in Learn and on the "which field" tasks
  - what: The player draws print on writing lines, never joined-up script (Schreibschrift)
    status: done
    how: writing-lines takes script joined and draws it in the school's Ausgangsschrift (SAS, LA, VA or Grundschrift, a player setting); the three joined-writing lessons use it
  - what: en-weather teaches "It's rainy"; a native English speaker could weigh it against "It's raining"
    status: open
  - what: "Regional words for a teacher to weigh: Mäppchen or Federtasche (an ä task relies on Mäppchen), Möhre or Karotte (picture-name tasks rely on Möhre), Fasching, Geldbeutel, Brötchen, Pulli"
    status: open
  - what: "Terms that differ by Land or textbook: the carry phrase (now 'Schreib 3, übertrag 1'), entbündeln, Nachbarzehner, Zehnerfreunde, Silbenschwingen, Verbzusatz or Vorsilbe, Wen-Fall or Akkusativ, Viertel vier"
    status: open
  - what: Stop sounds written as single letters in say ("fängt mit b an") may be read as the letter name; listen to a sample
    status: done
    how: the listening model was asked sound or letter name on a sample of 12 clips; 11 were the bare sound, the 12th is a spelling question ("Warum endet Feld mit d"), where the letter name is right
