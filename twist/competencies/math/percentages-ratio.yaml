progression: math.percentages-ratio
title: { de: Prozent und Verhältnisse, en: Percentages and ratio }
order: free
skills:
  - id: math.percentages-ratio.percent-meaning
    topic: { de: Prozent, en: Percentages }
    can_do:
      de: Ich weiß, dass Prozent "von hundert" bedeutet, kenne das Zeichen % und kann Prozente als Brüche mit dem Nenner 100 und als Dezimalzahlen schreiben.
      en: I know that per cent means "out of a hundred", know the % sign, and can write percentages as fractions over 100 and as decimals.
    prerequisites: { hard: [math.decimals.fraction-equivalents] }
    standards: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.11]
    note: Percentages are not in KMK for primary; English National Curriculum, Year 5.

  - id: math.percentages-ratio.equivalences
    topic: { de: Prozent, en: Percentages }
    can_do:
      de: Ich kenne die Prozent- und Dezimalwerte von ½, ¼, ⅕, ⅖, ⅘ und von Brüchen mit dem Nenner 10 oder 25 und nutze sie sicher.
      en: I know the percentage and decimal values of ½, ¼, ⅕, ⅖, ⅘ and of fractions over 10 or 25, and use them confidently.
    prerequisites: { hard: [math.percentages-ratio.percent-meaning] }
    standards: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.12, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.11]
    note: English National Curriculum, Years 5 and 6.

  - id: math.percentages-ratio.percent-of-amount
    topic: { de: Prozent, en: Percentages }
    can_do:
      de: Ich kann Prozente von Größen berechnen (15 % von 360) und Anteile mit Prozenten vergleichen.
      en: I can work out percentages of amounts (15% of 360) and compare proportions using percentages.
    prerequisites: { hard: [math.percentages-ratio.equivalences, math.written-mult-div.mult-multi-digit] }
    standards: [nc-maths-2014.y6.ratio-and-proportion.2]
    note: English National Curriculum, Year 6.

  - id: math.percentages-ratio.relative-size
    topic: { de: Verhältnisse, en: Ratio }
    can_do:
      de: Ich kann Aufgaben lösen, in denen zwei Größen in einem festen Verhältnis stehen, und fehlende Werte mit dem Einmaleins finden (3 rote Perlen auf 2 blaue).
      en: I can solve problems where two quantities are in a fixed ratio and find missing values with multiplication facts (3 red beads for every 2 blue).
    prerequisites: { hard: [math.patterns.proportional] }
    standards: [nc-maths-2014.y6.ratio-and-proportion.1]
    note: English National Curriculum, Year 6.

  - id: math.percentages-ratio.unequal-sharing
    topic: { de: Verhältnisse, en: Ratio }
    can_do:
      de: Ich kann eine Menge ungleich aufteilen, wenn das Verhältnis der Teile bekannt ist.
      en: I can share a quantity unequally when the ratio of the parts is known.
    prerequisites: { hard: [math.percentages-ratio.relative-size, math.fractions.of-quantities] }
    standards: [nc-maths-2014.y6.ratio-and-proportion.4]
    note: English National Curriculum, Year 6.

  - id: math.percentages-ratio.scale-factor
    topic: { de: Verhältnisse, en: Ratio }
    can_do:
      de: Ich kann Aufgaben zu ähnlichen Figuren lösen, wenn der Vergrößerungsfaktor bekannt ist oder gefunden werden kann.
      en: I can solve problems about similar shapes when the scale factor is known or can be found.
    prerequisites: { hard: [math.shapes.scale, math.percentages-ratio.relative-size] }
    standards: [nc-maths-2014.y6.ratio-and-proportion.3]
    note: English National Curriculum, Year 6.
