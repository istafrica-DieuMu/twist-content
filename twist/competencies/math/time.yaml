progression: math.time
title: { de: Zeit, en: Time }
order: free
steps:
  - id: math.time.sequence-of-day
    topic: { de: Zeit, en: Time }
    can_do:
      de: Ich kann Tagesabläufe ordnen und die Wochentage und Monate der Reihe nach nennen.
      en: I can put the events of a day in order and name the days of the week and the months in order.
    objectives: [kmk-mathe-2022.gm.2, nc-maths-2014.y1.measurement.4, nc-maths-2014.y1.measurement.8, nc-maths-2014.y1.measurement.10]

  - id: math.time.full-half-hour
    topic: { de: Uhrzeit, en: Telling the time }
    can_do:
      de: Ich kann volle und halbe Stunden auf der analogen und der digitalen Uhr ablesen und einstellen.
      en: I can read and set o'clock and half past on analogue and digital clocks.
    prerequisites: { hard: [math.numbers-to-20.order-to-20] }
    facets: [time-format]
    objectives: [kmk-mathe-2022.gm.6, nc-maths-2014.y1.measurement.8, nc-maths-2014.y1.measurement.12]

  - id: math.time.quarter-hours
    topic: { de: Uhrzeit, en: Telling the time }
    can_do:
      de: Ich kann Viertelstunden ablesen und einstellen (Viertel nach, Viertel vor, Dreiviertel).
      en: I can read and set quarter past and quarter to.
    prerequisites: { hard: [math.time.full-half-hour] }
    facets: [time-format]
    objectives: [kmk-mathe-2022.gm.4, nc-maths-2014.y2.measurement.7]

  - id: math.time.calendar
    topic: { de: Kalender, en: Calendar }
    can_do:
      de: Ich kann im Kalender ein Datum finden, schreiben und ausrechnen, wie viele Tage oder Wochen zwischen zwei Daten liegen.
      en: I can find and write a date on a calendar and work out how many days or weeks lie between two dates.
    prerequisites: { hard: [math.time.sequence-of-day, math.numbers-to-20.order-to-20] }
    facets: [date-format]
    objectives: [kmk-mathe-2022.gm.2, kmk-mathe-2022.dz.2, nc-maths-2014.y1.measurement.11]


  - id: math.time.five-minutes
    topic: { de: Uhrzeit, en: Telling the time }
    can_do:
      de: Ich kann die Uhrzeit auf fünf Minuten genau ablesen und einstellen, und ich weiß, dass eine Stunde 60 Minuten und ein Tag 24 Stunden hat.
      en: I can read and set the time to five minutes and know there are 60 minutes in an hour and 24 hours in a day.
    prerequisites: { hard: [math.time.quarter-hours, math.mult-div.table-5-10] }
    objectives: [kmk-mathe-2022.gm.6, nc-maths-2014.y2.measurement.7, nc-maths-2014.y2.measurement.8]
    note: English National Curriculum, Year 2.
  - id: math.time.minutes
    topic: { de: Uhrzeit, en: Telling the time }
    can_do:
      de: Ich kann die Uhrzeit auf die Minute genau ablesen und einstellen und die Zeiten am Nachmittag mit 13 bis 24 Uhr angeben.
      en: I can read and set the time to the minute and give afternoon times on a 24-hour clock.
    prerequisites: { hard: [math.time.five-minutes, math.numbers-to-100.sequences] }
    facets: [time-format]
    objectives: [kmk-mathe-2022.gm.6, nc-maths-2014.y3.measurement.4, nc-maths-2014.y3.measurement.5, nc-maths-2014.y4.measurement.5]

  - id: math.time.durations
    topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
    can_do:
      de: Ich kann Zeitpunkte und Zeitspannen unterscheiden und ausrechnen, wie lange etwas dauert oder wann es endet.
      en: I can tell a point in time from a length of time and work out how long something lasts or when it ends.
    prerequisites: { hard: [math.time.five-minutes, math.add-sub-to-100.complement] }
    objectives: [kmk-mathe-2022.gm.1, kmk-mathe-2022.gm.10, nc-maths-2014.y2.measurement.6, nc-maths-2014.y3.measurement.7]

  - id: math.time.units
    topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
    can_do:
      de: Ich kann Zeiteinheiten umrechnen (Sekunde, Minute, Stunde, Tag, Woche, Monat, Jahr) und kenne Zeitspannen aus dem Alltag (eine Schulstunde dauert 45 Minuten).
      en: I can convert units of time and know everyday durations (a lesson lasts about an hour).
    prerequisites: { hard: [math.time.durations] }
    objectives: [kmk-mathe-2022.gm.2, kmk-mathe-2022.gm.3, nc-maths-2014.y3.measurement.5, nc-maths-2014.y3.measurement.6, nc-maths-2014.y4.measurement.1, nc-maths-2014.y4.measurement.6, nc-maths-2014.y5.measurement.6, nc-maths-2014.y6.measurement.2]

  - id: math.time.timetables
    topic: { de: Zeitpunkt und Zeitdauer, en: Time and duration }
    can_do:
      de: Ich kann Fahrpläne und Zeitpläne lesen und damit Sachaufgaben zur Zeit lösen.
      en: I can read timetables and schedules and use them to solve time problems.
    prerequisites: { hard: [math.time.units, math.data.read-tables] }
    objectives: [kmk-mathe-2022.gm.10, nc-maths-2014.y5.statistics.2]
