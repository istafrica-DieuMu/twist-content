progression: math.coordinates
title: { de: Koordinaten und Bewegungen, en: Coordinates and transformations }
steps:
  - id: math.coordinates.first-quadrant
    topic: { de: Koordinaten, en: Coordinates }
    can_do:
      de: Ich kann Punkte im Koordinatensystem mit Koordinaten angeben und eintragen und daraus Vielecke zeichnen.
      en: I can give and plot points as coordinates in the first quadrant and join them to draw polygons.
    prerequisites: { hard: [math.space.plans-maps] }
    objectives: [nc-maths-2014.y4.geometry-position-and-direction.1, nc-maths-2014.y4.geometry-position-and-direction.3]
    note: English National Curriculum, Year 4.

  - id: math.coordinates.translate
    topic: { de: Koordinaten, en: Coordinates }
    can_do:
      de: Ich kann eine Verschiebung beschreiben und ausführen (3 nach rechts, 2 nach oben).
      en: I can describe and carry out a translation (3 right, 2 up).
    prerequisites: { hard: [math.coordinates.first-quadrant] }
    objectives: [nc-maths-2014.y4.geometry-position-and-direction.2]
    note: English National Curriculum, Years 4 and 5.

  - id: math.coordinates.reflect-translate
    topic: { de: Koordinaten, en: Coordinates }
    can_do:
      de: Ich kann die Lage einer Figur nach einer Spiegelung oder Verschiebung angeben und weiß, dass sich die Figur dabei nicht verändert.
      en: I can say where a shape is after a reflection or translation and know that the shape itself does not change.
    prerequisites: { hard: [math.coordinates.translate, math.symmetry.complete] }
    objectives: [nc-maths-2014.y5.geometry-position-and-direction.1]
    note: English National Curriculum, Year 5.

  - id: math.coordinates.four-quadrants
    topic: { de: Koordinaten, en: Coordinates }
    can_do:
      de: Ich kann Punkte in allen vier Quadranten angeben und eintragen und Figuren dort verschieben und an den Achsen spiegeln.
      en: I can give and plot points in all four quadrants and translate shapes and reflect them in the axes.
    prerequisites: { hard: [math.coordinates.reflect-translate, math.large-numbers.negative-numbers] }
    objectives: [nc-maths-2014.y6.geometry-position-and-direction.1, nc-maths-2014.y6.geometry-position-and-direction.2]
    note: English National Curriculum, Year 6.
