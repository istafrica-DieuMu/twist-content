progression: math.mass-capacity
title: { de: Gewichte und Rauminhalte, en: Mass and capacity }
order: free
steps:
  - id: math.mass-capacity.compare-mass
    topic: { de: Gewichte, en: Mass }
    can_do:
      de: Ich kann Gegenstände nach ihrem Gewicht vergleichen und ordnen (schwerer, leichter, gleich schwer), auch mit der Balkenwaage.
      en: I can compare and order objects by mass (heavier, lighter, the same), also with a balance.
    objectives: [kmk-mathe-2022.gm.1, nc-maths-2014.y1.measurement.2, nc-maths-2014.y1.measurement.6, nc-maths-2014.y2.measurement.2]

  - id: math.mass-capacity.g-kg
    topic: { de: Gewichte, en: Mass }
    can_do:
      de: Ich kann Gewichte in Gramm und Kilogramm angeben, an Waagen ablesen und weiß, dass 1 kg = 1000 g sind.
      en: I can give masses in grams and kilograms, read scales, and know that 1 kg = 1000 g.
    prerequisites: { hard: [math.mass-capacity.compare-mass, math.numbers-to-100.number-line] }
    facets: [units]
    objectives: [kmk-mathe-2022.gm.2, kmk-mathe-2022.gm.6, nc-maths-2014.y2.measurement.1, nc-maths-2014.y3.measurement.1]

  - id: math.mass-capacity.estimate-mass
    topic: { de: Gewichte, en: Mass }
    can_do:
      de: Ich kann Gewichte mit Stützpunktvorstellungen schätzen (1 g, 500 g, 1 kg) und weiß, dass 1 t = 1000 kg sind.
      en: I can estimate masses using benchmarks (1 g, 500 g, 1 kg) and know that 1 tonne = 1000 kg.
    prerequisites: { hard: [math.mass-capacity.g-kg] }
    objectives: [kmk-mathe-2022.gm.3, kmk-mathe-2022.gm.8]

  - id: math.mass-capacity.calculate-mass
    topic: { de: Gewichte, en: Mass }
    can_do:
      de: Ich kann mit Gewichten rechnen, Gewichte in verschiedenen Schreibweisen angeben (1,5 kg = 1500 g) und Sachaufgaben dazu lösen.
      en: I can calculate with masses, write them in different ways (1.5 kg = 1500 g) and solve problems with them.
    prerequisites: { hard: [math.mass-capacity.estimate-mass, math.length.notation] }
    facets: [number-format]
    objectives: [kmk-mathe-2022.gm.7, kmk-mathe-2022.gm.10, nc-maths-2014.y5.measurement.1, nc-maths-2014.y6.measurement.2]

  - id: math.mass-capacity.l-ml
    topic: { de: Rauminhalte, en: Capacity }
    can_do:
      de: Ich kann Hohlmaße in Liter und Milliliter angeben, an Messbechern ablesen und weiß, dass 1 l = 1000 ml sind.
      en: I can give capacities in litres and millilitres, read measuring jugs, and know that 1 l = 1000 ml.
    prerequisites: { hard: [math.mass-capacity.compare-capacity, math.numbers-to-100.number-line] }
    facets: [units]
    objectives: [kmk-mathe-2022.gm.2, kmk-mathe-2022.gm.6, nc-maths-2014.y2.measurement.1, nc-maths-2014.y3.measurement.1]

  - id: math.mass-capacity.calculate-capacity
    topic: { de: Rauminhalte, en: Capacity }
    can_do:
      de: Ich kann Rauminhalte schätzen, vergleichen und damit rechnen (Wie viele Gläser füllt eine 1-l-Flasche?).
      en: I can estimate, compare and calculate with capacities (how many glasses does a 1-litre bottle fill?).
    prerequisites: { hard: [math.mass-capacity.l-ml, math.mult-div.div-facts] }
    objectives: [kmk-mathe-2022.gm.1, kmk-mathe-2022.gm.8, kmk-mathe-2022.gm.10, nc-maths-2014.y5.measurement.5]

  - id: math.mass-capacity.data-units
    topic: { de: Datenmengen, en: Data sizes }
    can_do:
      de: Ich kann Datenmengen in Byte, Kilobyte und Megabyte vergleichen und einschätzen, was viel Speicher braucht.
      en: I can compare data sizes in bytes, kilobytes and megabytes and judge what takes a lot of storage.
    prerequisites: { hard: [math.large-numbers.to-million] }
    objectives: []
    enrichment: true
    reason: Not in KMK; a media-literacy extension that some Länder add in Klasse 4.

  - id: math.mass-capacity.temperature
    topic: { de: Temperatur, en: Temperature }
    can_do:
      de: Ich kann Temperaturen in Grad Celsius auf dem Thermometer ablesen und vergleichen.
      en: I can read and compare temperatures in degrees Celsius on a thermometer.
    prerequisites: { hard: [math.numbers-to-100.number-line] }
    objectives: [nc-maths-2014.y2.measurement.1]
    note: English National Curriculum, Year 2.

  - id: math.mass-capacity.compare-capacity
    topic: { de: Rauminhalte, en: Capacity }
    can_do:
      de: Ich kann vergleichen, in welches Gefäß mehr passt, und sagen, ob es voll, halb voll oder leer ist.
      en: I can compare which container holds more and say whether it is full, half full or empty.
    objectives: [kmk-mathe-2022.gm.1, nc-maths-2014.y1.measurement.3, nc-maths-2014.y1.measurement.7, nc-maths-2014.y2.measurement.2]
