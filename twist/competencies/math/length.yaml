progression: math.length
title: { de: Längen, en: Length }
steps:
  - id: math.length.compare
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Längen direkt vergleichen und ordnen (länger, kürzer, gleich lang).
      en: I can compare and order lengths directly (longer, shorter, the same).
    objectives: [kmk-mathe-2022.gm.1, nc-maths-2014.y1.measurement.1, nc-maths-2014.y2.measurement.2]

  - id: math.length.non-standard
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Längen mit Körpermaßen und Gegenständen messen und erklären, warum wir einheitliche Maße brauchen.
      en: I can measure lengths with hand spans, steps or objects and explain why we need standard units.
    prerequisites: { hard: [math.length.compare, math.numbers-to-20.count-to-10] }
    objectives: [kmk-mathe-2022.gm.5, nc-maths-2014.y1.measurement.5]

  - id: math.length.cm-m
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Längen in Zentimetern mit dem Lineal messen und Strecken genau zeichnen, und ich weiß, dass 1 m = 100 cm sind.
      en: I can measure lengths in centimetres with a ruler, draw lines accurately, and know that 1 m = 100 cm.
    prerequisites: { hard: [math.length.non-standard, math.numbers-to-100.number-line] }
    facets: [units]
    objectives: [kmk-mathe-2022.gm.2, kmk-mathe-2022.gm.6, nc-maths-2014.y1.measurement.5, nc-maths-2014.y2.measurement.1]

  - id: math.length.estimate
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Längen mit Stützpunktvorstellungen schätzen (1 cm ist so breit wie mein Finger, 1 m ist ein großer Schritt).
      en: I can estimate lengths using benchmarks (1 cm is about a finger's width, 1 m is a big step).
    prerequisites: { hard: [math.length.cm-m] }
    objectives: [kmk-mathe-2022.gm.3, kmk-mathe-2022.gm.8, nc-maths-2014.y2.measurement.1]

  - id: math.length.calculate
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann mit Längenangaben in m und cm rechnen und Sachaufgaben zu Längen lösen.
      en: I can calculate with lengths in m and cm and solve length problems.
    prerequisites: { hard: [math.length.cm-m, math.add-sub-to-100.sub-two-digit] }
    objectives: [kmk-mathe-2022.gm.10, nc-maths-2014.y3.measurement.1, nc-maths-2014.y4.measurement.4]

  - id: math.length.mm-km
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Millimeter und Kilometer verwenden, zwischen mm, cm, m und km umrechnen und Längen sinnvoll schätzen (1 km ist ein Weg von etwa einer Viertelstunde).
      en: I can use millimetres and kilometres, convert between mm, cm, m and km, and estimate lengths sensibly.
    prerequisites: { hard: [math.length.estimate, math.numbers-to-1000.place-value] }
    facets: [units]
    objectives: [kmk-mathe-2022.gm.2, kmk-mathe-2022.gm.3, nc-maths-2014.y3.measurement.1]

  - id: math.length.notation
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Längen in verschiedenen Schreibweisen angeben, auch mit Komma (2,5 km = 2500 m = 2 km 500 m).
      en: I can write lengths in different ways, also as decimals (2.5 km = 2500 m = 2 km 500 m).
    prerequisites: { hard: [math.length.mm-km, math.money.decimal-notation] }
    facets: [number-format]
    objectives: [kmk-mathe-2022.gm.7, nc-maths-2014.y4.measurement.1, nc-maths-2014.y5.measurement.1, nc-maths-2014.y6.measurement.1, nc-maths-2014.y6.measurement.2]

  - id: math.length.word-problems
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kann Sachaufgaben mit Längen in verschiedenen Einheiten lösen und das Ergebnis auf Plausibilität prüfen.
      en: I can solve problems with lengths in mixed units and check that the answer makes sense.
    prerequisites: { hard: [math.length.notation, math.word-problems.multi-step] }
    objectives: [kmk-mathe-2022.gm.9, kmk-mathe-2022.gm.10, nc-maths-2014.y5.measurement.7]

  - id: math.length.imperial
    topic: { de: Längen, en: Length }
    can_do:
      de: Ich kenne ungefähre Umrechnungen zwischen metrischen und alten englischen Einheiten (Zoll, Pfund, Pint, Meile) und kann Meilen in Kilometer umrechnen.
      en: I know approximate equivalences between metric and imperial units (inches, pounds, pints, miles) and can convert between miles and kilometres.
    prerequisites: { hard: [math.length.notation, math.mass-capacity.calculate-mass] }
    facets: [units]
    objectives: [nc-maths-2014.y5.measurement.2, nc-maths-2014.y6.measurement.3]
    note: English National Curriculum, Years 5 and 6; not used in German schools.
