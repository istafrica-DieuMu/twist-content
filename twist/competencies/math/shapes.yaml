progression: math.shapes
title: { de: Ebene Figuren, en: 2D shapes }
order: free
skills:
  - id: math.shapes.basic-shapes
    topic: { de: Formen, en: Shapes }
    can_do:
      de: Ich kann Kreis, Dreieck, Rechteck und Quadrat erkennen und benennen, auch in meiner Umwelt.
      en: I can recognise and name circles, triangles, rectangles and squares, also around me.
    prerequisites: { soft: [math.numbers-to-20.count-to-5] }
    standards: [kmk-mathe-2022.rf.4, kmk-mathe-2022.rf.5, nc-maths-2014.y1.geometry-properties-of-shapes.1]

  - id: math.shapes.compose
    topic: { de: Formen, en: Shapes }
    can_do:
      de: Ich kann Figuren legen, nachlegen, zerlegen und aus Teilen zusammensetzen (zum Beispiel mit dem Tangram).
      en: I can lay, copy, split and build shapes from pieces (for example with tangrams).
    prerequisites: { hard: [math.shapes.basic-shapes] }
    standards: [kmk-mathe-2022.rf.3, kmk-mathe-2022.rf.6]

  - id: math.shapes.properties
    topic: { de: Formen, en: Shapes }
    can_do:
      de: Ich kann Figuren nach Ecken und Seiten beschreiben und sortieren und erklären, warum ein Quadrat auch ein Rechteck ist.
      en: I can describe and sort shapes by their corners and sides and explain why a square is also a rectangle.
    prerequisites: { hard: [math.shapes.basic-shapes] }
    standards: [kmk-mathe-2022.rf.4, nc-maths-2014.y2.geometry-properties-of-shapes.1, nc-maths-2014.y2.geometry-properties-of-shapes.4]

  - id: math.shapes.draw-freehand-ruler
    topic: { de: Formen, en: Shapes }
    can_do:
      de: Ich kann Linien, Figuren und Muster frei Hand und mit Lineal oder Schablone auf Kästchenpapier zeichnen.
      en: I can draw lines, shapes and patterns freehand and with a ruler or stencil on squared paper.
    prerequisites: { hard: [math.shapes.properties] }
    standards: [kmk-mathe-2022.rf.8, nc-maths-2014.y3.geometry-properties-of-shapes.1]

  - id: math.shapes.lines-segments
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Geraden, Strecken und Linien unterscheiden und Strecken genau messen und zeichnen.
      en: I can tell straight lines, line segments and curves apart and measure and draw line segments accurately.
    prerequisites: { hard: [math.shapes.draw-freehand-ruler, math.length.cm-m] }
    standards: [kmk-mathe-2022.rf.8, kmk-mathe-2022.pk-werkzeuge.4]

  - id: math.shapes.more-shapes
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann weitere Figuren wie Sechseck, Achteck und Parallelogramm erkennen und mit Fachbegriffen beschreiben.
      en: I can recognise more shapes such as hexagons, octagons and parallelograms and describe them with the right terms.
    prerequisites: { hard: [math.shapes.properties] }
    standards: [kmk-mathe-2022.rf.4]

  - id: math.shapes.parallel-perpendicular
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann parallele und senkrechte Linien erkennen und mit dem Geodreieck zeichnen.
      en: I can recognise parallel and perpendicular lines and draw them with a set square.
    prerequisites: { hard: [math.shapes.lines-segments] }
    standards: [kmk-mathe-2022.rf.8, kmk-mathe-2022.pk-werkzeuge.4, nc-maths-2014.y3.geometry-properties-of-shapes.4]

  - id: math.shapes.circles-compass
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann mit dem Zirkel Kreise und Bögen zeichnen und Mittelpunkt und Radius benennen.
      en: I can draw circles and arcs with compasses and name the centre and radius.
    prerequisites: { hard: [math.shapes.lines-segments] }
    standards: [kmk-mathe-2022.pk-werkzeuge.4]

  - id: math.shapes.grid-drawing
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Figuren und Bauwerke in Gitter- und Punkteraster übertragen und zeichnen.
      en: I can copy and draw shapes and buildings on square and dot grids.
    prerequisites: { hard: [math.shapes.parallel-perpendicular] }
    standards: [kmk-mathe-2022.rf.8]

  - id: math.shapes.tessellations
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Bandornamente und Parkettierungen fortsetzen, beschreiben und eigene erfinden.
      en: I can continue, describe and invent frieze patterns and tessellations.
    prerequisites: { hard: [math.patterns.repeating, math.shapes.more-shapes] }
    standards: [kmk-mathe-2022.rf.11, kmk-mathe-2022.msf.2]

  - id: math.shapes.scale
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Figuren auf Gitterpapier maßstäblich vergrößern und verkleinern und einfache Maßstäbe auf Plänen nutzen.
      en: I can enlarge and reduce shapes to scale on squared paper and use simple scales on plans.
    prerequisites: { hard: [math.shapes.grid-drawing, math.mult-div.all-tables] }
    standards: [kmk-mathe-2022.rf.9]

  - id: math.shapes.classify-polygons
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Dreiecke und Vierecke nach ihren Eigenschaften einteilen (gleichseitig, rechtwinklig, Quadrat, Raute, Trapez) und regelmäßige von unregelmäßigen Vielecken unterscheiden.
      en: I can classify triangles and quadrilaterals by their properties and tell regular from irregular polygons.
    prerequisites: { hard: [math.shapes.more-shapes, math.angles.right-angles] }
    standards: [nc-maths-2014.y4.geometry-properties-of-shapes.1, nc-maths-2014.y5.geometry-properties-of-shapes.7, nc-maths-2014.y5.geometry-properties-of-shapes.8, nc-maths-2014.y6.geometry-properties-of-shapes.3]
    note: English National Curriculum, Years 4 and 5.

  - id: math.shapes.circle-parts
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Mittelpunkt, Radius, Durchmesser und Umfang eines Kreises benennen und weiß, dass der Durchmesser doppelt so lang ist wie der Radius.
      en: I can name the centre, radius, diameter and circumference of a circle and know that the diameter is twice the radius.
    prerequisites: { hard: [math.shapes.circles-compass] }
    standards: [nc-maths-2014.y6.geometry-properties-of-shapes.4]
    note: English National Curriculum, Year 6.

  - id: math.shapes.construct
    topic: { de: Geometrie, en: Geometry }
    can_do:
      de: Ich kann Figuren mit vorgegebenen Seitenlängen und Winkeln genau zeichnen.
      en: I can draw shapes accurately from given lengths and angles.
    prerequisites: { hard: [math.angles.measure-draw, math.shapes.grid-drawing] }
    standards: [nc-maths-2014.y6.geometry-properties-of-shapes.1]
    note: English National Curriculum, Year 6.
