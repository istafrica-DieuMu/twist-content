progression: math.fractions
title: { de: Brüche, en: Fractions }
order: free
steps:
  - id: math.fractions.halves-quarters
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann Ganze in Hälften und Viertel teilen und erkennen, ob die Teile gleich groß sind.
      en: I can split a whole into halves and quarters and check whether the parts are equal.
    prerequisites: { hard: [math.numbers-to-20.double-halve-to-20] }
    objectives: [kmk-mathe-2022.gm.4, nc-maths-2014.y1.number-fractions.1, nc-maths-2014.y1.number-fractions.2]

  - id: math.fractions.everyday-measures
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann Brüche aus dem Alltag bei Größen verstehen und in kleinere Einheiten umwandeln (½ m = 50 cm, ¾ h = 45 min, ¼ l = 250 ml).
      en: I can understand everyday fractions of measures and convert them to smaller units (½ m = 50 cm, ¾ hour = 45 minutes, ¼ l = 250 ml).
    prerequisites: { hard: [math.fractions.halves-quarters, math.time.quarter-hours, math.length.cm-m] }
    objectives: [kmk-mathe-2022.gm.4]

  - id: math.fractions.name-fractions
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann einfache Brüche benennen, als Teil eines Ganzen oder einer Menge darstellen und Bild und Bruch zuordnen.
      en: I can name simple fractions, show them as part of a whole or a set, and match pictures to fractions.
    prerequisites: { hard: [math.fractions.halves-quarters, math.mult-div.div-meaning] }
    objectives: [kmk-mathe-2022.gm.4, nc-maths-2014.y2.number-fractions.1]
    note: KMK keeps fractions to everyday measures in primary; the English National Curriculum takes fractions much further from Year 1, and those steps join this progression with the en-GB frameworks.

  - id: math.fractions.of-quantities
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann Bruchteile von Längen, Figuren, Mengen und Größen finden (⅓, ¼, ¾ von 12).
      en: I can find fractions of lengths, shapes, sets and quantities (⅓, ¼, ¾ of 12).
    prerequisites: { hard: [math.fractions.halves-quarters, math.mult-div.div-meaning] }
    objectives: [nc-maths-2014.y2.number-fractions.1, nc-maths-2014.y2.number-fractions.2, nc-maths-2014.y3.number-fractions.2, nc-maths-2014.y3.number-fractions.7, nc-maths-2014.y4.number-fractions-including-decimals.3]
    note: English National Curriculum, Years 2 to 4.

  - id: math.fractions.equivalent-simple
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann gleichwertige Brüche mit kleinen Nennern erkennen und zeigen (2/4 = ½).
      en: I can recognise and show equivalent fractions with small denominators (2/4 = ½).
    prerequisites: { hard: [math.fractions.name-fractions] }
    objectives: [nc-maths-2014.y2.number-fractions.2, nc-maths-2014.y3.number-fractions.4]
    note: English National Curriculum, Years 2 and 3.

  - id: math.fractions.on-number-line
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich verstehe Brüche als Zahlen und kann sie am Zahlenstrahl finden und eintragen.
      en: I understand fractions as numbers and can find and mark them on a number line.
    prerequisites: { hard: [math.fractions.name-fractions, math.numbers-to-100.number-line] }
    objectives: [nc-maths-2014.y3.number-fractions.3]
    note: English National Curriculum, Year 3.

  - id: math.fractions.compare
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann Stammbrüche und Brüche mit gleichem Nenner vergleichen und ordnen.
      en: I can compare and order unit fractions and fractions with the same denominator.
    prerequisites: { hard: [math.fractions.on-number-line] }
    objectives: [nc-maths-2014.y3.number-fractions.6]
    note: English National Curriculum, Year 3.

  - id: math.fractions.add-sub-same-denominator
    topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
    can_do:
      de: Ich kann Brüche mit gleichem Nenner addieren und subtrahieren (5/7 + 1/7 = 6/7).
      en: I can add and subtract fractions with the same denominator (5/7 + 1/7 = 6/7).
    prerequisites: { hard: [math.fractions.compare] }
    objectives: [nc-maths-2014.y3.number-fractions.5, nc-maths-2014.y4.number-fractions-including-decimals.4]
    note: English National Curriculum, Years 3 and 4.

  - id: math.fractions.equivalent-families
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann Familien gleichwertiger Brüche finden und Brüche mit Nennern vergleichen, die Vielfache voneinander sind.
      en: I can find families of equivalent fractions and compare fractions whose denominators are multiples of the same number.
    prerequisites: { hard: [math.fractions.equivalent-simple, math.mult-div.all-tables] }
    objectives: [nc-maths-2014.y4.number-fractions-including-decimals.1, nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.1, nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.2]
    note: English National Curriculum, Years 4 and 5.

  - id: math.fractions.mixed-numbers
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann gemischte Zahlen und unechte Brüche ineinander umwandeln (7/5 = 1 ⅖).
      en: I can convert between mixed numbers and improper fractions (7/5 = 1 ⅖).
    prerequisites: { hard: [math.fractions.equivalent-families] }
    objectives: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.3]
    note: English National Curriculum, Year 5.

  - id: math.fractions.add-sub-related
    topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
    can_do:
      de: Ich kann Brüche addieren und subtrahieren, deren Nenner Vielfache voneinander sind.
      en: I can add and subtract fractions whose denominators are multiples of the same number.
    prerequisites: { hard: [math.fractions.add-sub-same-denominator, math.fractions.equivalent-families] }
    objectives: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.4]
    note: English National Curriculum, Year 5.

  - id: math.fractions.multiply-by-whole
    topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
    can_do:
      de: Ich kann echte Brüche und gemischte Zahlen mit ganzen Zahlen multiplizieren.
      en: I can multiply proper fractions and mixed numbers by whole numbers.
    prerequisites: { hard: [math.fractions.mixed-numbers] }
    objectives: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.5]
    note: English National Curriculum, Year 5.

  - id: math.fractions.simplify
    topic: { de: Brüche, en: Fractions }
    can_do:
      de: Ich kann Brüche kürzen und auf einen gemeinsamen Nenner bringen und Brüche größer als 1 vergleichen.
      en: I can simplify fractions, put them over a common denominator and compare fractions greater than 1.
    prerequisites: { hard: [math.fractions.mixed-numbers, math.mult-div-larger.multiples-divisors] }
    objectives: [nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.1, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.2]
    note: English National Curriculum, Year 6.

  - id: math.fractions.add-sub-different
    topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
    can_do:
      de: Ich kann Brüche mit verschiedenen Nennern und gemischte Zahlen addieren und subtrahieren.
      en: I can add and subtract fractions with different denominators and mixed numbers.
    prerequisites: { hard: [math.fractions.simplify, math.fractions.add-sub-related] }
    objectives: [nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.3]
    note: English National Curriculum, Year 6.

  - id: math.fractions.multiply-divide
    topic: { de: Mit Brüchen rechnen, en: Calculating with fractions }
    can_do:
      de: "Ich kann zwei echte Brüche multiplizieren und einen Bruch durch eine ganze Zahl teilen und das Ergebnis kürzen (¼ · ½ = ⅛, ⅓ : 2 = ⅙)."
      en: I can multiply two proper fractions and divide a fraction by a whole number, giving the answer in its simplest form.
    prerequisites: { hard: [math.fractions.simplify, math.fractions.multiply-by-whole] }
    objectives: [nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.4, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.5]
    note: English National Curriculum, Year 6.
