progression: math.word-problems
title: { de: Sachaufgaben, en: Word problems }
order: free
steps:
  - id: math.word-problems.picture-stories
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann zu Bildern und kurzen Rechengeschichten eine passende Aufgabe finden, lösen und die Antwort sagen.
      en: I can find the calculation for a picture or a short story, solve it and say the answer.
    prerequisites: { hard: [math.add-sub-to-20.sub-to-10] }
    objectives: [kmk-mathe-2022.zo.12, kmk-mathe-2022.pk-modellieren.2, nc-maths-2014.y1.number-addition-and-subtraction.4]

  - id: math.word-problems.question-calc-answer
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann Sachaufgaben mit Frage, Rechnung und Antwort lösen und wichtige von unwichtigen Angaben unterscheiden.
      en: I can solve word problems with a question, a calculation and an answer, and tell important information from unimportant.
    prerequisites: { hard: [math.word-problems.picture-stories, math.add-sub-to-20.fluency-to-20] }
    objectives: [kmk-mathe-2022.zo.12, kmk-mathe-2022.pk-modellieren.1, nc-maths-2014.y2.number-addition-and-subtraction.1]

  - id: math.word-problems.ask-questions
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann zu einer Sachsituation selbst passende Fragen stellen und herausfinden, welche Fragen sich beantworten lassen.
      en: I can ask my own questions about a situation and work out which ones can be answered.
    prerequisites: { hard: [math.word-problems.question-calc-answer] }
    objectives: [kmk-mathe-2022.zo.12, kmk-mathe-2022.pk-modellieren.1]

  - id: math.word-problems.sketches
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann Skizzen, Tabellen und Rechenstriche nutzen, um eine Sachaufgabe zu verstehen und zu lösen.
      en: I can use sketches, tables and empty number lines to understand and solve a word problem.
    prerequisites: { hard: [math.word-problems.question-calc-answer] }
    objectives: [kmk-mathe-2022.pk-darstellen.1, kmk-mathe-2022.pk-probleme.2, nc-maths-2014.y2.number-addition-and-subtraction.2]

  - id: math.word-problems.write-stories
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann zu einer Rechnung oder einem Bild eine passende Rechengeschichte erfinden.
      en: I can make up a story that fits a calculation or a picture.
    prerequisites: { hard: [math.word-problems.question-calc-answer] }
    objectives: [kmk-mathe-2022.pk-modellieren.3]

  - id: math.word-problems.multi-step
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann Sachaufgaben mit mehreren Rechenschritten lösen und jeden Schritt der Sache zuordnen.
      en: I can solve multi-step word problems and link each step to the situation.
    prerequisites: { hard: [math.word-problems.sketches, math.mult-div.div-inverse] }
    objectives: [kmk-mathe-2022.zo.12, kmk-mathe-2022.gm.10, nc-maths-2014.y3.number-addition-and-subtraction.6, nc-maths-2014.y3.number-multiplication-and-division.3, nc-maths-2014.y4.number-addition-and-subtraction.3]

  - id: math.word-problems.estimate-or-exact
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann entscheiden, ob in einer Sachsituation ein Überschlag reicht oder ein genaues Ergebnis nötig ist.
      en: I can decide whether an estimate is enough in a situation or an exact answer is needed.
    prerequisites: { hard: [math.word-problems.multi-step, math.add-sub-to-1000.estimate] }
    objectives: [kmk-mathe-2022.zo.13, kmk-mathe-2022.gm.9, nc-maths-2014.y5.number-addition-and-subtraction.3, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.9]

  - id: math.word-problems.check-plausible
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann prüfen, ob mein Ergebnis zur Sachsituation passt, und meine Lösung sonst verbessern.
      en: I can check whether my answer fits the situation and improve my solution if it does not.
    prerequisites: { hard: [math.word-problems.multi-step] }
    objectives: [kmk-mathe-2022.pk-modellieren.2, kmk-mathe-2022.pk-probleme.3, kmk-mathe-2022.gm.9, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.9]

  - id: math.word-problems.complex
    topic: { de: Sachaufgaben, en: Word problems }
    can_do:
      de: Ich kann komplexe Sachaufgaben mit Informationen aus Texten, Tabellen und Bildern lösen, auch wenn es mehrere Lösungswege gibt.
      en: I can solve complex problems using information from text, tables and pictures, also when there are several ways to solve them.
    prerequisites: { hard: [math.word-problems.estimate-or-exact, math.data.read-charts] }
    objectives: [kmk-mathe-2022.pk-modellieren.1, kmk-mathe-2022.pk-probleme.1, nc-maths-2014.y5.number-addition-and-subtraction.4, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.7, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.8]
