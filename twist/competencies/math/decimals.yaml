progression: math.decimals
title: { de: Dezimalzahlen, en: Decimals }
skills:
  - id: math.decimals.tenths
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann in Zehnteln zählen und weiß, dass ein Zehntel entsteht, wenn man ein Ganzes in 10 gleiche Teile teilt.
      en: I can count in tenths and know that a tenth comes from dividing a whole into 10 equal parts.
    prerequisites: { hard: [math.fractions.name-fractions, math.numbers-to-100.tens] }
    standards: [nc-maths-2014.y3.number-fractions.1]
    note: Decimals beyond money and measures are not in KMK for primary; the English National Curriculum starts tenths in Year 3.

  - id: math.decimals.hundredths
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann in Hundertsteln zählen und Zehntel und Hundertstel als Dezimalzahlen schreiben (0,3 und 0,07).
      en: I can count in hundredths and write tenths and hundredths as decimals (0.3 and 0.07).
    prerequisites: { hard: [math.decimals.tenths] }
    facets: [number-format]
    standards: [nc-maths-2014.y4.number-fractions-including-decimals.2, nc-maths-2014.y4.number-fractions-including-decimals.5]
    note: English National Curriculum, Year 4.

  - id: math.decimals.fraction-equivalents
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann einfache Brüche als Dezimalzahlen schreiben und umgekehrt (¼ = 0,25, ½ = 0,5, 0,71 = 71/100).
      en: I can write simple fractions as decimals and decimals as fractions (¼ = 0.25, ½ = 0.5, 0.71 = 71/100).
    prerequisites: { hard: [math.decimals.hundredths, math.fractions.equivalent-simple] }
    facets: [number-format]
    standards: [nc-maths-2014.y4.number-fractions-including-decimals.6, nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.6]
    note: English National Curriculum, Years 4 and 5.

  - id: math.decimals.divide-by-10-100
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann ganze Zahlen und Dezimalzahlen mit 10, 100 und 1000 multiplizieren und durch sie dividieren und sagen, wie sich die Stellen verschieben.
      en: I can multiply and divide whole numbers and decimals by 10, 100 and 1000 and say how the digits move.
    prerequisites: { hard: [math.decimals.hundredths, math.large-numbers.to-10000] }
    facets: [number-format]
    standards: [nc-maths-2014.y4.number-fractions-including-decimals.7, nc-maths-2014.y5.number-multiplication-and-division.7, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.7]
    note: English National Curriculum, Years 4 to 6.

  - id: math.decimals.compare-round
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann Dezimalzahlen mit bis zu drei Nachkommastellen vergleichen, ordnen und auf Ganze oder Zehntel runden.
      en: I can compare and order decimals with up to three decimal places and round them to the nearest whole or tenth.
    prerequisites: { hard: [math.decimals.hundredths, math.numbers-to-1000.round] }
    facets: [number-format]
    standards: [nc-maths-2014.y4.number-fractions-including-decimals.8, nc-maths-2014.y4.number-fractions-including-decimals.9, nc-maths-2014.y4.number-fractions-including-decimals.10, nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.8, nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.9, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.10]
    note: English National Curriculum, Years 4 to 6.

  - id: math.decimals.thousandths
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann Tausendstel lesen und schreiben, den Wert jeder Stelle nennen und sie mit Zehnteln und Hundertsteln in Beziehung setzen.
      en: I can read and write thousandths, say the value of each digit, and relate them to tenths and hundredths.
    prerequisites: { hard: [math.decimals.compare-round] }
    facets: [number-format]
    standards: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.7, nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.9, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.7]
    note: English National Curriculum, Years 5 and 6.

  - id: math.decimals.calculate
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich kann mit Dezimalzahlen addieren, subtrahieren und sie mit ganzen Zahlen multiplizieren, und ich kann so teilen, dass das Ergebnis bis zu zwei Nachkommastellen hat.
      en: I can add and subtract decimals, multiply them by whole numbers, and divide so that the answer has up to two decimal places.
    prerequisites: { hard: [math.decimals.thousandths, math.written-mult-div.div-one-digit] }
    facets: [number-format]
    standards: [nc-maths-2014.y5.number-fractions-including-decimals-and-percentages.10, nc-maths-2014.y5.measurement.7, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.8, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.9, nc-maths-2014.y6.measurement.1]
    note: English National Curriculum, Years 5 and 6.

  - id: math.decimals.fraction-as-division
    topic: { de: Dezimalzahlen, en: Decimals }
    can_do:
      de: Ich verstehe einen Bruch als Division und kann zu einfachen Brüchen den Dezimalbruch berechnen (3/8 = 0,375).
      en: I understand a fraction as a division and can work out the decimal for a simple fraction (3/8 = 0.375).
    prerequisites: { hard: [math.decimals.calculate] }
    facets: [number-format]
    standards: [nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.6]
    note: English National Curriculum, Year 6.
