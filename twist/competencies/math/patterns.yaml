progression: math.patterns
title: { de: Muster und Zusammenhänge, en: Patterns and relationships }
skills:
  - id: math.patterns.repeating
    topic: { de: Muster, en: Patterns }
    can_do:
      de: Ich kann Muster aus Formen, Farben und Zahlen erkennen, beschreiben und fortsetzen.
      en: I can spot, describe and continue patterns of shapes, colours and numbers.
    standards: [kmk-mathe-2022.msf.2, nc-maths-2014.y2.geometry-position-and-direction.1]

  - id: math.patterns.number-patterns
    topic: { de: Muster, en: Patterns }
    can_do:
      de: Ich kann Zahlenmuster und Aufgabenmuster (schöne Päckchen) fortsetzen, die Regel erklären und Fehler im Muster finden.
      en: I can continue patterns of numbers and calculations, explain the rule and find the odd one out.
    prerequisites: { hard: [math.patterns.repeating, math.add-sub-to-20.fluency-to-20] }
    standards: [kmk-mathe-2022.msf.2, kmk-mathe-2022.pk-argumentieren.2, kmk-mathe-2022.pk-argumentieren.3]

  - id: math.patterns.functional-tables
    topic: { de: Zusammenhänge, en: Relationships }
    can_do:
      de: Ich kann Zusammenhänge wie Menge und Preis in Tabellen darstellen und fehlende Werte ergänzen.
      en: I can show relationships such as quantity and price in tables and fill in missing values.
    prerequisites: { hard: [math.mult-div.all-tables, math.money.amounts-to-100] }
    standards: [kmk-mathe-2022.msf.4, kmk-mathe-2022.msf.5]

  - id: math.patterns.proportional
    topic: { de: Zusammenhänge, en: Relationships }
    can_do:
      de: Ich kann Sachaufgaben mit proportionalen Zusammenhängen lösen, indem ich vom Bekannten auf eins und dann auf die gesuchte Menge schließe.
      en: I can solve problems with proportional relationships by working from what I know to one and then to the amount I need.
    prerequisites: { hard: [math.patterns.functional-tables, math.mult-div.div-facts] }
    standards: [kmk-mathe-2022.msf.6, nc-maths-2014.y4.number-multiplication-and-division.4, nc-maths-2014.y5.number-multiplication-and-division.11]

  - id: math.patterns.codes
    topic: { de: Muster, en: Patterns }
    can_do:
      de: Ich kann Geheimschriften und Codes mit Zahlen entschlüsseln und eigene erfinden.
      en: I can crack and invent codes that use numbers.
    prerequisites: { hard: [math.patterns.number-patterns] }
    standards: [kmk-mathe-2022.msf.2]
