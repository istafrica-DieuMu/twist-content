progression: math.area-volume
title: { de: Flächen und Rauminhalt, en: Area, perimeter and volume }
order: free
skills:
  - id: math.area-volume.compare-area
    topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
    can_do:
      de: Ich kann Flächen durch Auslegen mit Kästchen vergleichen und sagen, welche Fläche größer ist.
      en: I can compare areas by covering them with squares and say which is bigger.
    prerequisites: { hard: [math.shapes.basic-shapes, math.numbers-to-20.count-to-10] }
    standards: [kmk-mathe-2022.gm.1, kmk-mathe-2022.gm.5, kmk-mathe-2022.rf.7]

  - id: math.area-volume.area-unit-squares
    topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
    can_do:
      de: Ich kann den Flächeninhalt von Figuren auf Kästchenpapier bestimmen, auch durch Zerlegen und mit Malaufgaben bei Rechtecken.
      en: I can find the area of shapes on squared paper, also by splitting them and by multiplying for rectangles.
    prerequisites: { hard: [math.area-volume.compare-area, math.mult-div.arrays] }
    standards: [kmk-mathe-2022.gm.5, kmk-mathe-2022.rf.7, nc-maths-2014.y4.measurement.3]

  - id: math.area-volume.perimeter
    topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
    can_do:
      de: Ich kann den Umfang von Figuren messen und berechnen und Umfang und Flächeninhalt unterscheiden.
      en: I can measure and calculate the perimeter of shapes and tell perimeter and area apart.
    prerequisites: { hard: [math.length.calculate, math.shapes.properties] }
    standards: [kmk-mathe-2022.rf.7, nc-maths-2014.y3.measurement.2, nc-maths-2014.y4.measurement.2, nc-maths-2014.y5.measurement.3]

  - id: math.area-volume.volume-cubes
    topic: { de: Rauminhalt, en: Volume }
    can_do:
      de: Ich kann den Rauminhalt von Würfelgebäuden und Quadern mit Einheitswürfeln bestimmen und vergleichen.
      en: I can find and compare the volume of cube buildings and cuboids by counting unit cubes.
    prerequisites: { hard: [math.solids.cube-buildings, math.mult-div.arrays] }
    standards: [kmk-mathe-2022.gm.5, kmk-mathe-2022.rf.7, nc-maths-2014.y5.measurement.5]

  - id: math.area-volume.area-rectangles
    topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
    can_do:
      de: Ich kann den Flächeninhalt von Rechtecken in cm² und m² berechnen und den Flächeninhalt unregelmäßiger Figuren schätzen.
      en: I can calculate the area of rectangles in cm² and m² and estimate the area of irregular shapes.
    prerequisites: { hard: [math.area-volume.area-unit-squares, math.length.calculate] }
    standards: [nc-maths-2014.y5.measurement.4]
    note: English National Curriculum, Year 5.

  - id: math.area-volume.area-perimeter-relation
    topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
    can_do:
      de: Ich weiß, dass Figuren mit gleichem Flächeninhalt verschiedene Umfänge haben können und umgekehrt.
      en: I know that shapes with the same area can have different perimeters, and the other way round.
    prerequisites: { hard: [math.area-volume.area-rectangles, math.area-volume.perimeter] }
    standards: [nc-maths-2014.y6.measurement.4]
    note: English National Curriculum, Year 6.

  - id: math.area-volume.area-triangles
    topic: { de: Flächeninhalt und Umfang, en: Area and perimeter }
    can_do:
      de: Ich kann den Flächeninhalt von Parallelogrammen und Dreiecken berechnen.
      en: I can calculate the area of parallelograms and triangles.
    prerequisites: { hard: [math.area-volume.area-rectangles, math.algebra.formulae] }
    standards: [nc-maths-2014.y6.measurement.6]
    note: English National Curriculum, Year 6.

  - id: math.area-volume.volume-formula
    topic: { de: Rauminhalt, en: Volume }
    can_do:
      de: Ich kann den Rauminhalt von Würfeln und Quadern in cm³ und m³ berechnen, schätzen und vergleichen.
      en: I can calculate, estimate and compare the volume of cubes and cuboids in cm³ and m³.
    prerequisites: { hard: [math.area-volume.volume-cubes, math.area-volume.area-rectangles] }
    standards: [nc-maths-2014.y6.measurement.5, nc-maths-2014.y6.measurement.7]
    note: English National Curriculum, Year 6.
