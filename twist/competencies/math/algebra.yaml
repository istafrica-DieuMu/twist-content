progression: math.algebra
title: { de: Terme und Gleichungen, en: Algebra }
order: free
skills:
  - id: math.algebra.formulae
    topic: { de: Terme und Gleichungen, en: Algebra }
    can_do:
      de: Ich kann einfache Formeln in Worten und mit Buchstaben verwenden (Umfang eines Rechtecks = 2 · (a + b)).
      en: I can use simple formulae in words and with letters (perimeter of a rectangle = 2 × (a + b)).
    prerequisites: { hard: [math.mult-div-larger.order-of-operations, math.area-volume.perimeter] }
    standards: [nc-maths-2014.y6.algebra.1, nc-maths-2014.y6.measurement.5]
    note: English National Curriculum, Year 6.

  - id: math.algebra.linear-sequences
    topic: { de: Terme und Gleichungen, en: Algebra }
    can_do:
      de: Ich kann Zahlenfolgen mit gleichbleibenden Schritten erzeugen und beschreiben und die Regel in Worten oder als Term angeben.
      en: I can generate and describe sequences with a constant step and state the rule in words or as an expression.
    prerequisites: { hard: [math.patterns.number-patterns, math.large-numbers.sequences] }
    standards: [nc-maths-2014.y6.algebra.2]
    note: English National Curriculum, Year 6.

  - id: math.algebra.missing-numbers
    topic: { de: Terme und Gleichungen, en: Algebra }
    can_do:
      de: Ich kann Platzhalteraufgaben mit Buchstaben schreiben und lösen (3 · n + 4 = 19).
      en: I can write and solve missing-number problems with letters (3n + 4 = 19).
    prerequisites: { hard: [math.add-sub-to-100.equations, math.mult-div-larger.order-of-operations] }
    standards: [nc-maths-2014.y6.algebra.3]
    note: English National Curriculum, Year 6.

  - id: math.algebra.two-unknowns
    topic: { de: Terme und Gleichungen, en: Algebra }
    can_do:
      de: Ich kann Zahlenpaare finden, die eine Gleichung mit zwei Unbekannten erfüllen, und alle Möglichkeiten systematisch auflisten.
      en: I can find pairs of numbers that satisfy an equation with two unknowns and list all the possibilities systematically.
    prerequisites: { hard: [math.algebra.missing-numbers, math.chance.combinations] }
    standards: [nc-maths-2014.y6.algebra.4, nc-maths-2014.y6.algebra.5]
    note: English National Curriculum, Year 6.
