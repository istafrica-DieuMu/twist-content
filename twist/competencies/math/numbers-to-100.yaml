progression: math.numbers-to-100
title: { de: Zahlen bis 100, en: Numbers to 100 }
order: free
skills:
  - id: math.numbers-to-100.tens
    topic: { de: Zehnerzahlen, en: Counting in tens }
    can_do:
      de: Ich kann die Zehnerzahlen bis 100 lesen, schreiben, ordnen und in Zehnerschritten zählen.
      en: I can read, write and order the multiples of ten to 100 and count in tens.
    prerequisites: { hard: [math.numbers-to-20.teens] }
    standards: [kmk-mathe-2022.zo.1, nc-maths-2014.y1.number-number-and-place-value.2]

  - id: math.numbers-to-100.bundle-tens
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Dinge zu Zehnern bündeln, Zehner und Einer zählen und große Anzahlen so schätzen und prüfen.
      en: I can group objects into tens, count tens and ones, and use this to estimate and check large amounts.
    prerequisites: { hard: [math.numbers-to-100.tens] }
    standards: [kmk-mathe-2022.zo.1, nc-maths-2014.y2.number-number-and-place-value.3]

  - id: math.numbers-to-100.place-value
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann zweistellige Zahlen in die Stellentafel (Z, E) eintragen und mit Zehnerstangen und Einerwürfeln darstellen.
      en: I can show two-digit numbers in a tens-and-ones chart and with tens rods and ones cubes.
    prerequisites: { hard: [math.numbers-to-100.bundle-tens] }
    standards: [kmk-mathe-2022.zo.1, kmk-mathe-2022.zo.2, nc-maths-2014.y2.number-number-and-place-value.2]

  - id: math.numbers-to-100.read-write
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Zahlen bis 100 lesen und schreiben, auch als Zahlwort, und verwechsle dabei Zehner und Einer nicht (vierundzwanzig ist 24, nicht 42).
      en: I can read and write numbers to 100, also as words, without swapping tens and ones.
    prerequisites: { hard: [math.numbers-to-100.tens] }
    standards: [kmk-mathe-2022.zo.2, nc-maths-2014.y1.number-number-and-place-value.2, nc-maths-2014.y2.number-number-and-place-value.5]

  - id: math.numbers-to-100.hundred-field
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Zahlen am Hunderterfeld darstellen und Anzahlen dort schnell ablesen.
      en: I can show numbers on a hundred-dot field and read amounts from it quickly.
    prerequisites: { hard: [math.numbers-to-100.place-value] }
    standards: [kmk-mathe-2022.msf.1]

  - id: math.numbers-to-100.hundred-square
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann mich auf der Hundertertafel orientieren, Muster darin erkennen und Wege beschreiben (eine Zeile weiter ist zehn mehr).
      en: I can find my way around a hundred square, spot its patterns and describe moves (one row down is ten more).
    prerequisites: { hard: [math.numbers-to-100.read-write] }
    standards: [kmk-mathe-2022.zo.3, kmk-mathe-2022.msf.1]

  - id: math.numbers-to-100.number-line
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Zahlen bis 100 am Zahlenstrahl ablesen und eintragen, auch wenn nur die Zehner markiert sind.
      en: I can read and mark numbers to 100 on a number line, also when only the tens are labelled.
    prerequisites: { hard: [math.numbers-to-100.read-write] }
    standards: [kmk-mathe-2022.zo.2, kmk-mathe-2022.zo.3, nc-maths-2014.y1.number-number-and-place-value.4, nc-maths-2014.y2.number-number-and-place-value.3]

  - id: math.numbers-to-100.order-compare
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Zahlen bis 100 ordnen und vergleichen und Nachbarzahlen und Nachbarzehner bestimmen.
      en: I can order and compare numbers to 100 and find the neighbouring numbers and tens.
    prerequisites: { hard: [math.numbers-to-100.number-line] }
    standards: [kmk-mathe-2022.zo.3, nc-maths-2014.y2.number-number-and-place-value.4]

  - id: math.numbers-to-100.sequences
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann bis 100 in Schritten vorwärts und rückwärts zählen, von jeder Startzahl aus, und die Regel einer Zahlenfolge finden.
      en: I can count forwards and backwards in steps to 100 from any number and find the rule of a number sequence.
    prerequisites: { hard: [math.numbers-to-100.tens] }
    standards: [kmk-mathe-2022.msf.2, nc-maths-2014.y1.number-number-and-place-value.1, nc-maths-2014.y1.number-number-and-place-value.2, nc-maths-2014.y2.number-number-and-place-value.1]

  - id: math.numbers-to-100.double-halve
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Zahlen bis 50 verdoppeln und gerade Zahlen bis 100 halbieren.
      en: I can double numbers to 50 and halve even numbers to 100.
    prerequisites: { hard: [math.numbers-to-20.double-halve-to-20, math.numbers-to-100.place-value] }
    standards: [kmk-mathe-2022.zo.5]

  - id: math.numbers-to-100.number-puzzles
    topic: { de: Zahlen bis 100, en: Numbers to 100 }
    can_do:
      de: Ich kann Zahlenrätsel bis 100 lösen, bei denen ich mehrere Hinweise zu Stellenwerten und Nachbarzahlen kombiniere.
      en: I can solve number riddles to 100 that combine clues about place value and neighbours.
    prerequisites: { hard: [math.numbers-to-100.order-compare] }
    standards: [kmk-mathe-2022.pk-probleme.2, nc-maths-2014.y2.number-number-and-place-value.6]
