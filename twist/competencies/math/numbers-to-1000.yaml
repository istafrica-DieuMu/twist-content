progression: math.numbers-to-1000
title: { de: Zahlen bis 1000, en: Numbers to 1000 }
skills:
  - id: math.numbers-to-1000.hundreds
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann Zehner zu Hundertern bündeln und Zahlen bis 1000 mit Hundertern, Zehnern und Einern darstellen.
      en: I can group tens into hundreds and show numbers to 1000 with hundreds, tens and ones.
    prerequisites: { hard: [math.numbers-to-100.place-value] }
    standards: [kmk-mathe-2022.zo.1, kmk-mathe-2022.zo.2, nc-maths-2014.y3.number-number-and-place-value.4]

  - id: math.numbers-to-1000.place-value
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann dreistellige Zahlen in die Stellentafel (H, Z, E) eintragen und den Wert jeder Ziffer nennen.
      en: I can enter three-digit numbers in a place-value chart and say what each digit is worth.
    prerequisites: { hard: [math.numbers-to-1000.hundreds] }
    standards: [kmk-mathe-2022.zo.1, kmk-mathe-2022.zo.2, nc-maths-2014.y3.number-number-and-place-value.2]

  - id: math.numbers-to-1000.read-write
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann Zahlen bis 1000 lesen und als Ziffern und Zahlwort schreiben.
      en: I can read numbers to 1000 and write them in digits and in words.
    prerequisites: { hard: [math.numbers-to-1000.place-value] }
    standards: [kmk-mathe-2022.zo.2, nc-maths-2014.y3.number-number-and-place-value.5]

  - id: math.numbers-to-1000.number-line
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann Zahlen bis 1000 am Zahlenstrahl und auf der Tausendertafel finden und eintragen.
      en: I can find and mark numbers to 1000 on a number line and a thousand chart.
    prerequisites: { hard: [math.numbers-to-1000.read-write] }
    standards: [kmk-mathe-2022.zo.2, kmk-mathe-2022.zo.3, nc-maths-2014.y3.number-number-and-place-value.4]

  - id: math.numbers-to-1000.order-compare
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann Zahlen bis 1000 ordnen und vergleichen und Nachbarzehner und Nachbarhunderter bestimmen.
      en: I can order and compare numbers to 1000 and find the neighbouring tens and hundreds.
    prerequisites: { hard: [math.numbers-to-1000.number-line] }
    standards: [kmk-mathe-2022.zo.3, nc-maths-2014.y3.number-number-and-place-value.3]

  - id: math.numbers-to-1000.sequences
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann bis 1000 in Schritten zählen und Zahlenfolgen fortsetzen und erklären.
      en: I can count in steps to 1000 and continue and explain number sequences.
    prerequisites: { hard: [math.numbers-to-1000.order-compare] }
    standards: [kmk-mathe-2022.msf.2, nc-maths-2014.y3.number-number-and-place-value.1]

  - id: math.numbers-to-1000.round
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann Zahlen bis 1000 auf Zehner und Hunderter runden.
      en: I can round numbers to 1000 to the nearest ten and hundred.
    prerequisites: { hard: [math.numbers-to-1000.order-compare] }
    standards: [kmk-mathe-2022.zo.13]

  - id: math.numbers-to-1000.number-puzzles
    topic: { de: Zahlen bis 1000, en: Numbers to 1000 }
    can_do:
      de: Ich kann Zahlenrätsel bis 1000 lösen und eigene Rätsel zu Stellenwerten erfinden.
      en: I can solve number riddles to 1000 and make up my own about place value.
    prerequisites: { hard: [math.numbers-to-1000.place-value] }
    standards: [kmk-mathe-2022.pk-probleme.2, nc-maths-2014.y3.number-number-and-place-value.6, nc-maths-2014.y4.number-number-and-place-value.8]
