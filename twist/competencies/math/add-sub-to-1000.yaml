progression: math.add-sub-to-1000
title: { de: Plus und Minus bis 1000 und weiter, en: Adding and subtracting beyond 100 }
steps:
  - id: math.add-sub-to-1000.hundreds
    topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
    can_do:
      de: Ich kann Hunderterzahlen und Zehnerzahlen im Zahlenraum bis 1000 addieren und subtrahieren (300 + 400, 470 − 50).
      en: I can add and subtract hundreds and tens within 1000 (300 + 400, 470 − 50).
    prerequisites: { hard: [math.numbers-to-1000.place-value, math.add-sub-to-100.tens] }
    objectives: [kmk-mathe-2022.zo.6, nc-maths-2014.y3.number-addition-and-subtraction.1, nc-maths-2014.y3.number-addition-and-subtraction.2, nc-maths-2014.y3.number-addition-and-subtraction.3]

  - id: math.add-sub-to-1000.bridging
    topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
    can_do:
      de: Ich kann im Kopf über Zehner und Hunderter hinweg addieren und subtrahieren (380 + 50, 605 − 8).
      en: I can add and subtract mentally across tens and hundreds (380 + 50, 605 − 8).
    prerequisites: { hard: [math.add-sub-to-1000.hundreds, math.add-sub-to-100.ones-bridge] }
    objectives: [kmk-mathe-2022.zo.6, kmk-mathe-2022.zo.7, nc-maths-2014.y3.number-addition-and-subtraction.1, nc-maths-2014.y3.number-addition-and-subtraction.2]

  - id: math.add-sub-to-1000.semi-written
    topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
    can_do:
      de: Ich kann dreistellige Zahlen halbschriftlich addieren und subtrahieren und meine Zwischenschritte notieren.
      en: I can add and subtract three-digit numbers with an informal written method, noting my steps.
    prerequisites: { hard: [math.add-sub-to-1000.bridging, math.add-sub-to-100.sub-two-digit] }
    objectives: [kmk-mathe-2022.zo.7]

  - id: math.add-sub-to-1000.clever
    topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
    can_do:
      de: Ich kann im Zahlenraum bis 1000 vorteilhaft rechnen und für jede Aufgabe einen passenden Weg wählen.
      en: I can calculate efficiently within 1000 and choose a good method for each calculation.
    prerequisites: { hard: [math.add-sub-to-1000.semi-written, math.add-sub-to-100.clever] }
    objectives: [kmk-mathe-2022.zo.7, kmk-mathe-2022.zo.8]

  - id: math.add-sub-to-1000.estimate
    topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
    can_do:
      de: Ich kann vor dem Rechnen überschlagen, wie groß das Ergebnis ungefähr ist, und das Ergebnis damit prüfen.
      en: I can estimate the size of a result before calculating and use it to check my answer.
    prerequisites: { hard: [math.numbers-to-1000.round, math.add-sub-to-1000.semi-written] }
    objectives: [kmk-mathe-2022.zo.11, kmk-mathe-2022.zo.13, nc-maths-2014.y3.number-addition-and-subtraction.5, nc-maths-2014.y5.number-addition-and-subtraction.3]

  - id: math.add-sub-to-1000.vocabulary
    topic: { de: Rechnen bis 1000, en: Adding and subtracting to 1000 }
    can_do:
      de: Ich kann die Fachbegriffe Summe, Differenz, addieren und subtrahieren richtig verwenden.
      en: I can use the terms sum, difference, add and subtract correctly.
    prerequisites: { hard: [math.add-sub-to-1000.semi-written] }
    objectives: [kmk-mathe-2022.pk-werkzeuge.2]

  - id: math.add-sub-to-1000.large-mental
    topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
    can_do:
      de: Ich kann Aufgaben mit großen Zahlen im Kopf lösen, wenn sie zu bekannten Aufgaben passen (7000 + 5000, 250 000 − 50 000).
      en: I can solve calculations with large numbers mentally when they match known facts (7000 + 5000, 250 000 − 50 000).
    prerequisites: { hard: [math.large-numbers.to-million, math.add-sub-to-1000.hundreds] }
    objectives: [kmk-mathe-2022.zo.6, nc-maths-2014.y5.number-addition-and-subtraction.2, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.4]

  - id: math.add-sub-to-1000.large-semi-written
    topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
    can_do:
      de: Ich kann große Zahlen halbschriftlich addieren und subtrahieren und das Ergebnis vorher überschlagen.
      en: I can add and subtract large numbers with an informal written method and estimate first.
    prerequisites: { hard: [math.add-sub-to-1000.large-mental, math.add-sub-to-1000.estimate] }
    objectives: [kmk-mathe-2022.zo.7]
