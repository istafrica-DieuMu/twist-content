progression: math.add-sub-to-100
title: { de: Plus und Minus bis 100, en: Adding and subtracting to 100 }
skills:
  - id: math.add-sub-to-100.tens
    topic: { de: Rechnen mit Zehnern, en: Adding and subtracting tens }
    can_do:
      de: Ich kann Zehnerzahlen addieren und subtrahieren (30 + 40, 90 − 60) und dabei das Einspluseins nutzen.
      en: I can add and subtract multiples of ten (30 + 40, 90 − 60) using facts to 10.
    prerequisites: { hard: [math.numbers-to-100.tens, math.add-sub-to-20.sub-to-10] }
    standards: [kmk-mathe-2022.zo.6, nc-maths-2014.y2.number-addition-and-subtraction.3]

  - id: math.add-sub-to-100.ones-no-bridge
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann Einer zu zweistelligen Zahlen addieren und davon subtrahieren, ohne den Zehner zu überschreiten (34 + 5, 47 − 3).
      en: I can add and subtract ones without crossing a ten (34 + 5, 47 − 3).
    prerequisites: { hard: [math.numbers-to-100.place-value, math.add-sub-to-20.analog-to-20] }
    standards: [kmk-mathe-2022.zo.6, nc-maths-2014.y2.number-addition-and-subtraction.4]

  - id: math.add-sub-to-100.tens-to-two-digit
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann ganze Zehner zu zweistelligen Zahlen addieren und davon subtrahieren (34 + 20, 76 − 40).
      en: I can add and subtract whole tens to and from two-digit numbers (34 + 20, 76 − 40).
    prerequisites: { hard: [math.add-sub-to-100.tens, math.add-sub-to-100.ones-no-bridge] }
    standards: [kmk-mathe-2022.zo.6, nc-maths-2014.y2.number-addition-and-subtraction.5]

  - id: math.add-sub-to-100.ones-bridge
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann Einer mit Zehnerübergang addieren und subtrahieren, schrittweise über den vollen Zehner (38 + 5, 43 − 6).
      en: I can add and subtract ones across a ten, in steps via the next ten (38 + 5, 43 − 6).
    prerequisites: { hard: [math.add-sub-to-100.ones-no-bridge, math.add-sub-to-20.sub-bridge-10] }
    standards: [kmk-mathe-2022.zo.7, nc-maths-2014.y2.number-addition-and-subtraction.4]

  - id: math.add-sub-to-100.complement
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann zum nächsten Zehner und auf 100 ergänzen (37 + _ = 40, 64 + _ = 100).
      en: I can find what to add to reach the next ten and to reach 100 (37 + _ = 40, 64 + _ = 100).
    prerequisites: { hard: [math.add-sub-to-100.ones-bridge] }
    standards: [kmk-mathe-2022.zo.5]

  - id: math.add-sub-to-100.add-two-digit
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann zwei zweistellige Zahlen addieren und dabei einen Rechenweg wählen (schrittweise, stellenweise, mit Hilfsaufgabe).
      en: I can add two two-digit numbers and choose a method (in steps, tens and ones separately, or via an easier sum).
    prerequisites: { hard: [math.add-sub-to-100.tens-to-two-digit, math.add-sub-to-100.ones-bridge] }
    standards: [kmk-mathe-2022.zo.7, nc-maths-2014.y2.number-addition-and-subtraction.6]

  - id: math.add-sub-to-100.sub-two-digit
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann zweistellige Zahlen voneinander subtrahieren, durch Abziehen in Schritten oder durch Ergänzen.
      en: I can subtract a two-digit number from another, by taking away in steps or by counting up.
    prerequisites: { hard: [math.add-sub-to-100.add-two-digit, math.add-sub-to-100.complement] }
    standards: [kmk-mathe-2022.zo.7, nc-maths-2014.y2.number-addition-and-subtraction.6]

  - id: math.add-sub-to-100.clever
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann geschickt rechnen, zum Beispiel mit Nachbaraufgaben (45 + 19 = 45 + 20 − 1) oder durch gleichsinniges Verändern.
      en: I can calculate cleverly, for example by rounding and adjusting (45 + 19 = 45 + 20 − 1).
    prerequisites: { hard: [math.add-sub-to-100.sub-two-digit] }
    standards: [kmk-mathe-2022.zo.7, kmk-mathe-2022.zo.9]

  - id: math.add-sub-to-100.check
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann meine Ergebnisse mit der Umkehraufgabe und durch Überschlagen prüfen und Fehler in Rechnungen finden und erklären.
      en: I can check results with the inverse and by estimating, and find and explain mistakes in calculations.
    prerequisites: { hard: [math.add-sub-to-100.sub-two-digit] }
    standards: [kmk-mathe-2022.zo.8, kmk-mathe-2022.zo.11, nc-maths-2014.y2.number-addition-and-subtraction.9]

  - id: math.add-sub-to-100.describe-methods
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann verschiedene Rechenwege vergleichen, meinen Weg erklären und sagen, welcher Weg zu welcher Aufgabe passt.
      en: I can compare different methods, explain mine, and say which method suits which calculation.
    prerequisites: { hard: [math.add-sub-to-100.clever] }
    standards: [kmk-mathe-2022.zo.8, kmk-mathe-2022.pk-kommunizieren.1]

  - id: math.add-sub-to-100.equations
    topic: { de: Rechnen bis 100, en: Adding and subtracting to 100 }
    can_do:
      de: Ich kann Gleichungen und Ungleichungen bis 100 lösen und Platzhalter in Aufgaben bestimmen.
      en: I can solve equations and inequalities to 100 and find missing numbers in calculations.
    prerequisites: { hard: [math.add-sub-to-100.sub-two-digit, math.add-sub-to-20.equations] }
    standards: [kmk-mathe-2022.msf.3, nc-maths-2014.y2.number-addition-and-subtraction.9, nc-maths-2014.y3.number-addition-and-subtraction.6, nc-maths-2014.y5.number-multiplication-and-division.10]
