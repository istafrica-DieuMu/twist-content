progression: math.chance
title: { de: Kombinatorik und Wahrscheinlichkeit, en: Combinations and chance }
steps:
  - id: math.chance.combinations
    topic: { de: Kombinatorik, en: Combinations }
    can_do:
      de: Ich kann systematisch herausfinden, wie viele Möglichkeiten es gibt (zum Beispiel Kleidung kombinieren), mit Tabelle oder Baumdiagramm.
      en: I can work out systematically how many possibilities there are (for example outfits), using a table or tree diagram.
    prerequisites: { hard: [math.data.sort-classify] }
    objectives: [kmk-mathe-2022.dz.4, kmk-mathe-2022.pk-probleme.2, nc-maths-2014.y3.number-multiplication-and-division.3, nc-maths-2014.y6.algebra.5]

  - id: math.chance.certain-possible-impossible
    topic: { de: Wahrscheinlichkeit, en: Chance }
    can_do:
      de: Ich kann Ereignisse als sicher, wahrscheinlich, unwahrscheinlich oder unmöglich beschreiben.
      en: I can describe events as certain, likely, unlikely or impossible.
    objectives: [kmk-mathe-2022.dz.5]

  - id: math.chance.compare-chances
    topic: { de: Wahrscheinlichkeit, en: Chance }
    can_do:
      de: Ich kann bei Würfel-, Münz- und Glücksradspielen die Chancen vergleichen und meine Vermutung mit Versuchen prüfen.
      en: I can compare chances in dice, coin and spinner games and test my prediction by experiment.
    prerequisites: { hard: [math.chance.certain-possible-impossible, math.data.tally] }
    objectives: [kmk-mathe-2022.dz.6]

  - id: math.chance.fair-games
    topic: { de: Wahrscheinlichkeit, en: Chance }
    can_do:
      de: Ich kann begründen, ob ein Spiel fair ist, indem ich die Möglichkeiten für jeden Spieler zähle.
      en: I can explain whether a game is fair by counting the possibilities for each player.
    prerequisites: { hard: [math.chance.compare-chances, math.chance.combinations] }
    objectives: [kmk-mathe-2022.dz.6, kmk-mathe-2022.pk-argumentieren.3]
