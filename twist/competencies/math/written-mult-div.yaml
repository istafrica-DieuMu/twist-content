progression: math.written-mult-div
title: { de: Schriftliche Multiplikation und Division, en: Written multiplication and division }
order: free
skills:
  - id: math.written-mult-div.mult-one-digit
    topic: { de: Schriftlich malnehmen, en: Written multiplication }
    can_do:
      de: Ich kann mehrstellige Zahlen schriftlich mit einer einstelligen Zahl multiplizieren und den Übertrag erklären.
      en: I can multiply a multi-digit number by a one-digit number in a written method and explain the carrying.
    prerequisites: { hard: [math.mult-div-larger.semi-written-mult, math.written-add-sub.add-carry] }
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y4.number-multiplication-and-division.3]

  - id: math.written-mult-div.mult-multi-digit
    topic: { de: Schriftlich malnehmen, en: Written multiplication }
    can_do:
      de: Ich kann schriftlich mit zwei- und mehrstelligen Zahlen multiplizieren und die Teilprodukte stellengerecht addieren.
      en: I can multiply by two-digit and larger numbers in a written method and add the partial products in the right columns.
    prerequisites: { hard: [math.written-mult-div.mult-one-digit, math.mult-div-larger.large-mental] }
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y5.number-multiplication-and-division.4, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.1]

  - id: math.written-mult-div.mult-money
    topic: { de: Schriftlich malnehmen, en: Written multiplication }
    can_do:
      de: Ich kann Geldbeträge mit Komma schriftlich multiplizieren (3,45 € · 4).
      en: I can multiply money amounts with decimals in a written method (£3.45 × 4).
    prerequisites: { hard: [math.written-mult-div.mult-one-digit, math.money.decimal-notation] }
    facets: [currency, number-format]
    standards: [kmk-mathe-2022.zo.10, kmk-mathe-2022.gm.10, nc-maths-2014.y6.number-fractions-including-decimals-and-percentages.8]

  - id: math.written-mult-div.div-one-digit
    topic: { de: Schriftlich teilen, en: Written division }
    can_do:
      de: Ich kann mehrstellige Zahlen schriftlich durch eine einstellige Zahl teilen und jeden Schritt erklären.
      en: I can divide a multi-digit number by a one-digit number in a written method and explain each step.
    prerequisites: { hard: [math.mult-div-larger.semi-written-div, math.written-add-sub.sub-regroup] }
    standards: [nc-maths-2014.y5.number-multiplication-and-division.6]
    beyond_framework: KMK 2022 lists written addition, subtraction and multiplication only; German primary schools also teach written division by a one-digit divisor in Klasse 4.

  - id: math.written-mult-div.div-remainder-zeros
    topic: { de: Schriftlich teilen, en: Written division }
    can_do:
      de: Ich kann schriftlich mit Rest teilen und Aufgaben lösen, bei denen im Ergebnis eine Null steht.
      en: I can divide in a written method with remainders and with zeros in the answer.
    prerequisites: { hard: [math.written-mult-div.div-one-digit] }
    standards: [nc-maths-2014.y5.number-multiplication-and-division.6]
    beyond_framework: KMK 2022 lists written addition, subtraction and multiplication only; German primary schools also teach written division by a one-digit divisor in Klasse 4.

  - id: math.written-mult-div.check
    topic: { de: Schriftlich teilen, en: Written division }
    can_do:
      de: Ich kann schriftliche Mal- und Geteiltaufgaben mit Überschlag und Umkehraufgabe prüfen.
      en: I can check written multiplications and divisions by estimating and with the inverse.
    prerequisites: { hard: [math.written-mult-div.div-one-digit, math.mult-div-larger.estimate] }
    standards: [kmk-mathe-2022.zo.11]

  - id: math.written-mult-div.divisibility
    topic: { de: Schriftlich teilen, en: Written division }
    can_do:
      de: Ich kann mit Teilbarkeitsregeln prüfen, ob eine Zahl durch 2, 5, 10, 3 oder 9 teilbar ist.
      en: I can use divisibility rules to check whether a number divides by 2, 5, 10, 3 or 9.
    prerequisites: { hard: [math.mult-div-larger.multiples-divisors] }
    enrichment: true
    reason: Not in KMK for primary; a natural extension that fast learners meet, and Klasse 5 starts with it.

  - id: math.written-mult-div.long-division
    topic: { de: Schriftlich teilen, en: Written division }
    can_do:
      de: Ich kann bis zu vierstellige Zahlen schriftlich durch zweistellige Zahlen teilen und den Rest passend angeben, als Rest, Bruch oder Dezimalzahl.
      en: I can divide numbers up to 4 digits by a two-digit number with long or short division and give the remainder as a remainder, fraction or decimal.
    prerequisites: { hard: [math.written-mult-div.div-remainder-zeros, math.written-mult-div.mult-multi-digit] }
    standards: [nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.2, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.3]
    note: English National Curriculum, Year 6.
