progression: math.numbers-to-20
title: { de: Zahlen bis 20, en: Numbers to 20 }
order: free
skills:
  - id: math.numbers-to-20.count-to-5
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann bis zu 5 Dinge sicher abzählen und sagen, wie viele es sind.
      en: I can count up to 5 objects reliably and say how many there are.
    standards: [kmk-mathe-2022.zo.2]

  - id: math.numbers-to-20.count-to-10
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann bis zu 10 Dinge abzählen, auch wenn sie durcheinander liegen.
      en: I can count up to 10 objects, even when they are scattered.
    prerequisites: { hard: [math.numbers-to-20.count-to-5] }
    standards: [kmk-mathe-2022.zo.2, eyfs-2026.elg.number.1]

  - id: math.numbers-to-20.subitize-to-10
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann Anzahlen bis 10 auf einen Blick erkennen, zum Beispiel auf dem Würfel, mit Fingern oder im Zehnerfeld (Kraft der 5).
      en: I can see amounts up to 10 at a glance, on dice, fingers or a ten-frame, using groups of 5.
    prerequisites: { hard: [math.numbers-to-20.count-to-5] }
    standards: [kmk-mathe-2022.msf.1, eyfs-2026.elg.number.2]

  - id: math.numbers-to-20.write-numerals-to-10
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann die Ziffern 0 bis 10 lesen, richtig schreiben und der passenden Anzahl zuordnen.
      en: I can read and write the numerals 0 to 10 and match each to its amount.
    prerequisites: { hard: [math.numbers-to-20.count-to-10] }
    standards: [kmk-mathe-2022.zo.2, nc-maths-2014.y1.number-number-and-place-value.5]

  - id: math.numbers-to-20.order-to-10
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann die Zahlen bis 10 der Reihe nach ordnen und Vorgänger und Nachfolger nennen.
      en: I can put the numbers to 10 in order and name the number before and after.
    prerequisites: { hard: [math.numbers-to-20.count-to-10] }
    standards: [kmk-mathe-2022.zo.3, nc-maths-2014.y1.number-number-and-place-value.3, eyfs-2026.elg.numerical-patterns.1]

  - id: math.numbers-to-20.compare-to-10
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann Anzahlen und Zahlen bis 10 vergleichen und die Zeichen <, > und = richtig setzen.
      en: I can compare amounts and numbers to 10 and use the signs <, > and =.
    prerequisites: { hard: [math.numbers-to-20.count-to-10] }
    standards: [kmk-mathe-2022.zo.3, nc-maths-2014.y1.number-number-and-place-value.4, eyfs-2026.elg.numerical-patterns.2]

  - id: math.numbers-to-20.partition-to-10
    topic: { de: Zahlen bis 10, en: Numbers to 10 }
    can_do:
      de: Ich kann jede Zahl bis 10 auf verschiedene Arten in zwei Teile zerlegen (Zahlenhaus, Partnerzahlen).
      en: I can split any number up to 10 into two parts in different ways (number bonds).
    prerequisites: { hard: [math.numbers-to-20.subitize-to-10] }
    standards: [kmk-mathe-2022.zo.5, kmk-mathe-2022.msf.3, nc-maths-2014.y1.number-addition-and-subtraction.2, eyfs-2026.elg.number.1]

  - id: math.numbers-to-20.teens
    topic: { de: Zahlen bis 20, en: Numbers to 20 }
    can_do:
      de: Ich kann die Zahlen von 11 bis 20 als einen Zehner und Einer verstehen, lesen und schreiben.
      en: I can read and write the numbers 11 to 20 and see each as one ten and some ones.
    prerequisites: { hard: [math.numbers-to-20.partition-to-10] }
    standards: [kmk-mathe-2022.zo.1, nc-maths-2014.y1.number-number-and-place-value.5, eyfs-2026.elg.numerical-patterns.1]

  - id: math.numbers-to-20.order-to-20
    topic: { de: Zahlen bis 20, en: Numbers to 20 }
    can_do:
      de: Ich kann die Zahlen bis 20 ordnen, am Zahlenstrahl finden, vorwärts und rückwärts zählen und Zahlenfolgen fortsetzen.
      en: I can order the numbers to 20, find them on a number line, count on and back, and continue number sequences.
    prerequisites: { hard: [math.numbers-to-20.teens, math.numbers-to-20.order-to-10] }
    standards: [kmk-mathe-2022.zo.3, kmk-mathe-2022.msf.2, nc-maths-2014.y1.number-number-and-place-value.1, nc-maths-2014.y1.number-number-and-place-value.3, eyfs-2026.elg.numerical-patterns.1]

  - id: math.numbers-to-20.compare-to-20
    topic: { de: Zahlen bis 20, en: Numbers to 20 }
    can_do:
      de: Ich kann Zahlen bis 20 vergleichen und sagen, um wie viel eine Zahl größer oder kleiner ist.
      en: I can compare numbers to 20 and say how much bigger or smaller one is.
    prerequisites: { hard: [math.numbers-to-20.teens, math.numbers-to-20.compare-to-10] }
    standards: [kmk-mathe-2022.zo.3, nc-maths-2014.y1.number-number-and-place-value.4]

  - id: math.numbers-to-20.double-halve-to-20
    topic: { de: Zahlen bis 20, en: Numbers to 20 }
    can_do:
      de: Ich kann Zahlen bis 10 verdoppeln und gerade Zahlen bis 20 halbieren.
      en: I can double numbers to 10 and halve even numbers to 20.
    prerequisites: { hard: [math.numbers-to-20.partition-to-10] }
    standards: [kmk-mathe-2022.zo.5, eyfs-2026.elg.numerical-patterns.3]

  - id: math.numbers-to-20.even-odd
    topic: { de: Zahlen bis 20, en: Numbers to 20 }
    can_do:
      de: Ich kann gerade und ungerade Zahlen bis 20 unterscheiden und erklären, woran ich sie erkenne.
      en: I can tell even and odd numbers to 20 apart and explain how I know.
    prerequisites: { hard: [math.numbers-to-20.double-halve-to-20] }
    standards: [kmk-mathe-2022.msf.2, nc-maths-2014.y2.number-multiplication-and-division.1, eyfs-2026.elg.numerical-patterns.3]
