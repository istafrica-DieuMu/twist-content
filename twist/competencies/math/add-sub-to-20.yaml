progression: math.add-sub-to-20
title: { de: Plus und Minus bis 20, en: Adding and subtracting to 20 }
order: free
skills:
  - id: math.add-sub-to-20.add-meaning
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann zu Bildern und Geschichten vom Dazukommen und Zusammenlegen passende Plusaufgaben finden.
      en: I can find the addition that matches a picture or story of putting together or adding more.
    prerequisites: { hard: [math.numbers-to-20.partition-to-10] }
    standards: [kmk-mathe-2022.zo.4]

  - id: math.add-sub-to-20.add-to-10
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann Plusaufgaben bis 10 lösen, zuerst bis 5 und dann bis 10.
      en: I can solve additions to 10, first to 5 and then to 10.
    prerequisites: { hard: [math.add-sub-to-20.add-meaning] }
    standards: [kmk-mathe-2022.zo.5, nc-maths-2014.y1.number-addition-and-subtraction.1, eyfs-2026.elg.number.3]

  - id: math.add-sub-to-20.sub-meaning
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann zu Bildern und Geschichten vom Wegnehmen passende Minusaufgaben finden.
      en: I can find the subtraction that matches a picture or story of taking away.
    prerequisites: { hard: [math.add-sub-to-20.add-meaning] }
    standards: [kmk-mathe-2022.zo.4]

  - id: math.add-sub-to-20.sub-to-10
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann Minusaufgaben bis 10 lösen.
      en: I can solve subtractions within 10.
    prerequisites: { hard: [math.add-sub-to-20.sub-meaning, math.add-sub-to-20.add-to-10] }
    standards: [kmk-mathe-2022.zo.5, nc-maths-2014.y1.number-addition-and-subtraction.1]

  - id: math.add-sub-to-20.missing-addend
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann Ergänzungsaufgaben bis 10 lösen (3 + _ = 8) und zu jeder Zahl die Partnerzahl bis 10 finden.
      en: I can solve missing-number additions to 10 (3 + _ = 8) and find the partner of any number to make 10.
    prerequisites: { hard: [math.add-sub-to-20.add-to-10] }
    standards: [kmk-mathe-2022.zo.5, kmk-mathe-2022.msf.3, nc-maths-2014.y1.number-addition-and-subtraction.2, eyfs-2026.elg.number.3]

  - id: math.add-sub-to-20.commutative
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann Tauschaufgaben finden und nutzen, um mir das Rechnen leichter zu machen.
      en: I can find turnaround additions (3 + 5 = 5 + 3) and use them to make adding easier.
    prerequisites: { hard: [math.add-sub-to-20.add-to-10] }
    standards: [kmk-mathe-2022.zo.9, nc-maths-2014.y2.number-addition-and-subtraction.8]

  - id: math.add-sub-to-20.inverse
    topic: { de: Rechnen bis 10, en: Adding and subtracting to 10 }
    can_do:
      de: Ich kann zu einer Plusaufgabe die Umkehraufgabe finden und Aufgabenfamilien bilden (3 + 5, 5 + 3, 8 − 5, 8 − 3).
      en: I can find the inverse of an addition and write fact families (3 + 5, 5 + 3, 8 − 5, 8 − 3).
    prerequisites: { hard: [math.add-sub-to-20.sub-to-10, math.add-sub-to-20.commutative] }
    standards: [kmk-mathe-2022.zo.4, kmk-mathe-2022.zo.5, nc-maths-2014.y2.number-addition-and-subtraction.9]

  - id: math.add-sub-to-20.neighbour-facts
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann Nachbaraufgaben und Verdopplungsaufgaben nutzen, um schwierige Aufgaben aus leichten abzuleiten (4 + 5 ist eins mehr als 4 + 4).
      en: I can use near facts and doubles to work out harder sums from easier ones (4 + 5 is one more than 4 + 4).
    prerequisites: { hard: [math.add-sub-to-20.add-to-10, math.numbers-to-20.double-halve-to-20] }
    standards: [kmk-mathe-2022.zo.7, kmk-mathe-2022.msf.3]

  - id: math.add-sub-to-20.number-walls
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann Zahlenmauern, Rechenketten und Rechentabellen bis 20 ausfüllen und darin Muster entdecken.
      en: I can complete number walls, number chains and addition tables to 20 and spot patterns in them.
    prerequisites: { hard: [math.add-sub-to-20.inverse] }
    standards: [kmk-mathe-2022.msf.2, kmk-mathe-2022.pk-argumentieren.2]

  - id: math.add-sub-to-20.analog-to-20
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann Aufgaben im zweiten Zehner mit verwandten Aufgaben aus dem ersten Zehner lösen (3 + 4 hilft bei 13 + 4).
      en: I can solve sums in the teens using related facts to 10 (3 + 4 helps with 13 + 4).
    prerequisites: { hard: [math.add-sub-to-20.sub-to-10, math.numbers-to-20.teens] }
    standards: [kmk-mathe-2022.zo.6, kmk-mathe-2022.msf.3, nc-maths-2014.y1.number-addition-and-subtraction.3]

  - id: math.add-sub-to-20.add-bridge-10
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann Plusaufgaben mit Zehnerübergang lösen, indem ich bis zur 10 ergänze und dann weiterrechne (8 + 5 = 8 + 2 + 3).
      en: I can add across ten by making ten first and then adding the rest (8 + 5 = 8 + 2 + 3).
    prerequisites: { hard: [math.add-sub-to-20.missing-addend, math.add-sub-to-20.analog-to-20] }
    standards: [kmk-mathe-2022.zo.7, nc-maths-2014.y1.number-addition-and-subtraction.3]

  - id: math.add-sub-to-20.sub-bridge-10
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann Minusaufgaben mit Zehnerübergang lösen, indem ich zuerst bis zur 10 zurückrechne (13 − 5 = 13 − 3 − 2).
      en: I can subtract across ten by going back to ten first (13 − 5 = 13 − 3 − 2).
    prerequisites: { hard: [math.add-sub-to-20.add-bridge-10] }
    standards: [kmk-mathe-2022.zo.7, nc-maths-2014.y1.number-addition-and-subtraction.3]

  - id: math.add-sub-to-20.fluency-to-20
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann alle Aufgaben des kleinen Einspluseins schnell und sicher aus dem Kopf lösen und ihre Umkehraufgaben ableiten.
      en: I can recall all addition and subtraction facts to 20 quickly and derive the inverse facts.
    prerequisites: { hard: [math.add-sub-to-20.sub-bridge-10] }
    standards: [kmk-mathe-2022.zo.5, nc-maths-2014.y1.number-addition-and-subtraction.2, nc-maths-2014.y2.number-addition-and-subtraction.3, nc-maths-2014.y2.number-addition-and-subtraction.7]

  - id: math.add-sub-to-20.equations
    topic: { de: Rechnen bis 20, en: Adding and subtracting to 20 }
    can_do:
      de: Ich kann Aufgaben und Zahlen mit <, > und = vergleichen und zeigen, dass verschiedene Aufgaben dasselbe Ergebnis haben (7 + 5 = 6 + 6).
      en: I can compare calculations with <, > and = and show that different calculations can have the same result (7 + 5 = 6 + 6).
    prerequisites: { hard: [math.add-sub-to-20.add-bridge-10, math.numbers-to-20.compare-to-20] }
    standards: [kmk-mathe-2022.msf.3, nc-maths-2014.y1.number-addition-and-subtraction.4]
