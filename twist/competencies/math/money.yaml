progression: math.money
title: { de: Geld, en: Money }
skills:
  - id: math.money.coins-notes
    topic: { de: Geld, en: Money }
    can_do:
      de: Ich kann alle Münzen und Scheine erkennen und nach ihrem Wert ordnen.
      en: I can recognise all coins and notes and order them by value.
    prerequisites: { hard: [math.numbers-to-20.compare-to-20] }
    facets: [currency]
    standards: [kmk-mathe-2022.gm.2, nc-maths-2014.y1.measurement.9]

  - id: math.money.amounts-to-20
    topic: { de: Geld, en: Money }
    can_do:
      de: Ich kann Geldbeträge bis 20 € mit Münzen und Scheinen legen und zusammenzählen.
      en: I can make and count amounts up to 20 with coins and notes.
    prerequisites: { hard: [math.money.coins-notes, math.add-sub-to-20.add-bridge-10] }
    facets: [currency]
    standards: [kmk-mathe-2022.gm.1, nc-maths-2014.y2.measurement.3]

  - id: math.money.amounts-to-100
    topic: { de: Geld, en: Money }
    can_do:
      de: Ich kann Geldbeträge bis 100 € legen, vergleichen und auf verschiedene Arten zusammensetzen.
      en: I can make, compare and build amounts up to 100 in different ways.
    prerequisites: { hard: [math.money.amounts-to-20, math.numbers-to-100.place-value] }
    facets: [currency]
    standards: [kmk-mathe-2022.gm.1, nc-maths-2014.y2.measurement.4]

  - id: math.money.shopping
    topic: { de: Geld, en: Money }
    can_do:
      de: Ich kann beim Einkaufen den Preis zusammenrechnen, passend bezahlen und das Rückgeld berechnen.
      en: I can add up prices, pay the right amount and work out the change.
    prerequisites: { hard: [math.money.amounts-to-100, math.add-sub-to-100.complement] }
    facets: [currency]
    standards: [kmk-mathe-2022.gm.10, nc-maths-2014.y2.measurement.5, nc-maths-2014.y3.measurement.3]

  - id: math.money.euro-cent
    topic: { de: Geld, en: Money }
    can_do:
      de: Ich kann Euro und Cent umrechnen (1 € = 100 ct) und Beträge in Euro und Cent angeben.
      en: I can convert between pounds and pence (£1 = 100p) and write amounts in both.
    prerequisites: { hard: [math.money.amounts-to-100] }
    facets: [currency]
    standards: [kmk-mathe-2022.gm.2, kmk-mathe-2022.gm.7, nc-maths-2014.y2.measurement.3]

  - id: math.money.decimal-notation
    topic: { de: Mit Geld rechnen, en: Calculating with money }
    can_do:
      de: Ich kann Geldbeträge mit Komma lesen und schreiben (3,50 € = 3 € 50 ct = 350 ct).
      en: I can read and write money amounts with a decimal point (£3.50 = £3 and 50p = 350p).
    prerequisites: { hard: [math.money.euro-cent] }
    facets: [currency, number-format]
    standards: [kmk-mathe-2022.gm.7, nc-maths-2014.y3.measurement.3, nc-maths-2014.y4.number-fractions-including-decimals.10]

  - id: math.money.calculate
    topic: { de: Mit Geld rechnen, en: Calculating with money }
    can_do:
      de: Ich kann mit Geldbeträgen mit Komma addieren, subtrahieren und sie vervielfachen.
      en: I can add, subtract and multiply money amounts with decimals.
    prerequisites: { hard: [math.money.decimal-notation, math.add-sub-to-1000.semi-written] }
    facets: [currency, number-format]
    standards: [kmk-mathe-2022.gm.10, nc-maths-2014.y3.measurement.3, nc-maths-2014.y4.number-fractions-including-decimals.10, nc-maths-2014.y4.measurement.4]

  - id: math.money.word-problems
    topic: { de: Mit Geld rechnen, en: Calculating with money }
    can_do:
      de: Ich kann Sachaufgaben mit Geld lösen, auch mit Preisvergleichen und Angeboten (Was ist günstiger?).
      en: I can solve money problems, including comparing prices and offers (which is cheaper?).
    prerequisites: { hard: [math.money.calculate, math.word-problems.multi-step] }
    facets: [currency, number-format]
    standards: [kmk-mathe-2022.gm.10, kmk-mathe-2022.msf.4, nc-maths-2014.y5.measurement.7]
