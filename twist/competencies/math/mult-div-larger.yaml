progression: math.mult-div-larger
title: { de: Malnehmen und Teilen mit größeren Zahlen, en: Multiplying and dividing larger numbers }
order: free
skills:
  - id: math.mult-div-larger.tens
    topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
    can_do:
      de: "Ich kann Aufgaben mit Zehnerzahlen auf das Einmaleins zurückführen (3 · 40 = 120, 240 : 6 = 40)."
      en: I can solve calculations with multiples of ten using times-table facts (3 × 40 = 120, 240 ÷ 6 = 40).
    prerequisites: { hard: [math.mult-div.div-inverse, math.numbers-to-1000.place-value] }
    standards: [kmk-mathe-2022.zo.6, nc-maths-2014.y3.number-multiplication-and-division.2]

  - id: math.mult-div-larger.multiples-divisors
    topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
    can_do:
      de: Ich kann Vielfache und Teiler einer Zahl finden.
      en: I can find multiples and factors of a number.
    prerequisites: { hard: [math.mult-div.div-facts] }
    standards: [kmk-mathe-2022.msf.2, nc-maths-2014.y4.number-multiplication-and-division.2, nc-maths-2014.y5.number-multiplication-and-division.1, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.5]

  - id: math.mult-div-larger.order-of-operations
    topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
    can_do:
      de: Ich kann Aufgaben mit mehreren Rechenzeichen in der richtigen Reihenfolge lösen (Klammer zuerst, Punkt vor Strich).
      en: I can solve calculations with several operations in the right order (brackets first, then × and ÷, then + and −).
    prerequisites: { hard: [math.mult-div.div-facts, math.add-sub-to-100.sub-two-digit] }
    standards: [kmk-mathe-2022.zo.9, kmk-mathe-2022.msf.3, nc-maths-2014.y5.number-multiplication-and-division.10, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.6]

  - id: math.mult-div-larger.distributive
    topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
    can_do:
      de: Ich kann Malaufgaben durch Zerlegen lösen und erklären, warum das funktioniert (6 · 14 = 6 · 10 + 6 · 4).
      en: I can multiply by splitting a number and explain why it works (6 × 14 = 6 × 10 + 6 × 4).
    prerequisites: { hard: [math.mult-div-larger.tens, math.mult-div.derive-facts] }
    standards: [kmk-mathe-2022.zo.7, kmk-mathe-2022.zo.9, nc-maths-2014.y4.number-multiplication-and-division.4]

  - id: math.mult-div-larger.semi-written-mult
    topic: { de: Halbschriftlich malnehmen und teilen, en: Informal multiplication and division }
    can_do:
      de: Ich kann zwei- und dreistellige Zahlen halbschriftlich mit einer einstelligen Zahl multiplizieren, auch mit dem Malkreuz.
      en: I can multiply two- and three-digit numbers by a one-digit number with an informal method, including the grid method.
    prerequisites: { hard: [math.mult-div-larger.tens] }
    standards: [kmk-mathe-2022.zo.7, nc-maths-2014.y3.number-multiplication-and-division.2]

  - id: math.mult-div-larger.semi-written-div
    topic: { de: Halbschriftlich malnehmen und teilen, en: Informal multiplication and division }
    can_do:
      de: "Ich kann zwei- und dreistellige Zahlen halbschriftlich durch eine einstellige Zahl teilen, auch mit Rest (96 : 4 = 80 : 4 + 16 : 4)."
      en: I can divide two- and three-digit numbers by a one-digit number with an informal method, also with remainders.
    prerequisites: { hard: [math.mult-div-larger.semi-written-mult, math.mult-div.remainder] }
    standards: [kmk-mathe-2022.zo.7]

  - id: math.mult-div-larger.estimate
    topic: { de: Halbschriftlich malnehmen und teilen, en: Informal multiplication and division }
    can_do:
      de: Ich kann Ergebnisse beim Malnehmen und Teilen überschlagen und meine Rechnung damit prüfen.
      en: I can estimate the results of multiplications and divisions and use this to check my working.
    prerequisites: { hard: [math.mult-div-larger.semi-written-mult, math.numbers-to-1000.round] }
    standards: [kmk-mathe-2022.zo.11, kmk-mathe-2022.zo.13]

  - id: math.mult-div-larger.large-mental
    topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
    can_do:
      de: "Ich kann mit Stufenzahlen im Kopf malnehmen und teilen (40 · 300, 36 000 : 9)."
      en: I can multiply and divide mentally with multiples of 10, 100 and 1000 (40 × 300, 36 000 ÷ 9).
    prerequisites: { hard: [math.mult-div-larger.tens, math.large-numbers.to-million] }
    standards: [kmk-mathe-2022.zo.6, nc-maths-2014.y5.number-multiplication-and-division.5, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.4]

  - id: math.mult-div-larger.multi-digit-semi
    topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
    can_do:
      de: Ich kann mehrstellige Zahlen halbschriftlich miteinander multiplizieren und vierstellige Zahlen schrittweise durch einstellige Zahlen und durch Zehnerzahlen teilen, wenn es aufgeht.
      en: I can multiply multi-digit numbers informally and divide four-digit numbers in steps by one-digit numbers and by multiples of ten, when it divides exactly.
    prerequisites: { hard: [math.mult-div-larger.semi-written-div, math.mult-div-larger.large-mental] }
    standards: [kmk-mathe-2022.zo.7]

  - id: math.mult-div-larger.primes
    topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
    can_do:
      de: Ich kann Primzahlen erkennen, die Primzahlen bis 19 nennen und Zahlen in Primfaktoren zerlegen.
      en: I can recognise prime numbers, name the primes up to 19 and break numbers into prime factors.
    prerequisites: { hard: [math.mult-div-larger.multiples-divisors] }
    standards: [nc-maths-2014.y5.number-multiplication-and-division.2, nc-maths-2014.y5.number-multiplication-and-division.3, nc-maths-2014.y5.number-multiplication-and-division.9, nc-maths-2014.y6.number-addition-subtraction-multiplication-and-division.5]
    note: English National Curriculum, Years 5 and 6.

  - id: math.mult-div-larger.squares-cubes
    topic: { de: Malnehmen und Teilen, en: Multiplying and dividing }
    can_do:
      de: Ich kann Quadratzahlen und Kubikzahlen erkennen und mit der Schreibweise 5² und 2³ umgehen.
      en: I can recognise square and cube numbers and use the notation 5² and 2³.
    prerequisites: { hard: [math.mult-div.squares, math.mult-div-larger.tens] }
    standards: [nc-maths-2014.y5.number-multiplication-and-division.8, nc-maths-2014.y5.number-multiplication-and-division.9]
    note: English National Curriculum, Year 5.
