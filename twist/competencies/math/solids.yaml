progression: math.solids
title: { de: Körper, en: 3D shapes }
order: free
skills:
  - id: math.solids.cube-cuboid-sphere
    topic: { de: Körper, en: 3D shapes }
    can_do:
      de: Ich kann Würfel, Quader und Kugel erkennen, benennen und in meiner Umwelt finden.
      en: I can recognise and name cubes, cuboids and spheres and find them around me.
    prerequisites: { hard: [math.shapes.basic-shapes] }
    standards: [kmk-mathe-2022.rf.4, kmk-mathe-2022.rf.5, nc-maths-2014.y1.geometry-properties-of-shapes.2, nc-maths-2014.y2.geometry-properties-of-shapes.4]

  - id: math.solids.cube-buildings
    topic: { de: Körper, en: 3D shapes }
    can_do:
      de: Ich kann einfache Würfelgebäude nach Bauplan bauen und zu einem Gebäude den Bauplan schreiben.
      en: I can build simple cube buildings from a plan and write the plan for a building.
    prerequisites: { hard: [math.solids.cube-cuboid-sphere, math.numbers-to-20.count-to-10] }
    standards: [kmk-mathe-2022.rf.2, nc-maths-2014.y3.geometry-properties-of-shapes.1]

  - id: math.solids.more-solids
    topic: { de: Körper, en: 3D shapes }
    can_do:
      de: Ich kann Pyramide, Zylinder und Kegel erkennen und Körper nach Ecken, Kanten und Flächen sortieren.
      en: I can recognise pyramids, cylinders and cones and sort solids by vertices, edges and faces.
    prerequisites: { hard: [math.solids.cube-cuboid-sphere, math.shapes.properties] }
    standards: [kmk-mathe-2022.rf.4, nc-maths-2014.y2.geometry-properties-of-shapes.2, nc-maths-2014.y2.geometry-properties-of-shapes.3]

  - id: math.solids.nets
    topic: { de: Körper, en: 3D shapes }
    can_do:
      de: Ich kann Würfelnetze erkennen und prüfen, ob sich ein Netz zu einem Würfel falten lässt.
      en: I can recognise nets of a cube and check whether a net folds into a cube.
    prerequisites: { hard: [math.solids.more-solids] }
    standards: [kmk-mathe-2022.rf.2, kmk-mathe-2022.rf.3, nc-maths-2014.y5.geometry-properties-of-shapes.1, nc-maths-2014.y6.geometry-properties-of-shapes.2]

  - id: math.solids.complex-buildings
    topic: { de: Körper, en: 3D shapes }
    can_do:
      de: Ich kann komplexere Bauwerke nach Plan bauen und Bauwerken ihre Ansichten und Schrägbilder zuordnen.
      en: I can build more complex structures from a plan and match structures to their views and drawings.
    prerequisites: { hard: [math.solids.cube-buildings, math.space.views] }
    standards: [kmk-mathe-2022.rf.2, nc-maths-2014.y5.geometry-properties-of-shapes.1]
