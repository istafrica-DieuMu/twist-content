progression: math.symmetry
title: { de: Symmetrie, en: Symmetry }
skills:
  - id: math.symmetry.identify
    topic: { de: Symmetrie, en: Symmetry }
    can_do:
      de: Ich kann erkennen, ob eine Figur achsensymmetrisch ist, und die Symmetrieachse finden (durch Falten oder mit dem Spiegel).
      en: I can tell whether a shape has a line of symmetry and find it (by folding or with a mirror).
    prerequisites: { hard: [math.shapes.basic-shapes] }
    standards: [kmk-mathe-2022.rf.10, nc-maths-2014.y2.geometry-properties-of-shapes.1]

  - id: math.symmetry.complete
    topic: { de: Symmetrie, en: Symmetry }
    can_do:
      de: Ich kann eine Figur auf Kästchenpapier an einer Achse spiegeln und zu einer symmetrischen Figur ergänzen.
      en: I can reflect a shape in a line on squared paper and complete a symmetrical shape.
    prerequisites: { hard: [math.symmetry.identify, math.shapes.draw-freehand-ruler] }
    standards: [kmk-mathe-2022.rf.9, kmk-mathe-2022.rf.10, nc-maths-2014.y4.geometry-properties-of-shapes.4]

  - id: math.symmetry.several-axes
    topic: { de: Symmetrie, en: Symmetry }
    can_do:
      de: Ich kann Figuren mit mehreren Symmetrieachsen finden und Spiegelbilder auch an schrägen Achsen zeichnen.
      en: I can find shapes with several lines of symmetry and draw reflections in diagonal lines.
    prerequisites: { hard: [math.symmetry.complete, math.shapes.more-shapes] }
    standards: [kmk-mathe-2022.rf.10, nc-maths-2014.y4.geometry-properties-of-shapes.3]

  - id: math.symmetry.in-environment
    topic: { de: Symmetrie, en: Symmetry }
    can_do:
      de: Ich kann Symmetrie und Spiegelungen in meiner Umwelt, in Mustern und in Kunst erkennen und beschreiben.
      en: I can spot and describe symmetry and reflections around me, in patterns and in art.
    prerequisites: { hard: [math.symmetry.identify] }
    standards: [kmk-mathe-2022.rf.11, nc-maths-2014.y5.geometry-position-and-direction.1]

  - id: math.symmetry.point-symmetry
    topic: { de: Symmetrie, en: Symmetry }
    can_do:
      de: Ich kann punktsymmetrische Figuren erkennen, die bei einer halben Drehung gleich aussehen.
      en: I can recognise shapes with rotational symmetry of order 2, which look the same after a half turn.
    prerequisites: { hard: [math.symmetry.several-axes, math.space.mental-moves] }
    enrichment: true
    reason: Not in KMK for primary; taught in Klasse 5 and 6.
