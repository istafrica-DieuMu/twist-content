progression: math.written-add-sub
title: { de: Schriftliche Addition und Subtraktion, en: Column addition and subtraction }
skills:
  - id: math.written-add-sub.add-no-carry
    topic: { de: Schriftlich rechnen, en: Column methods }
    can_do:
      de: Ich kann Zahlen stellengerecht untereinander schreiben und schriftlich ohne Übertrag addieren.
      en: I can line numbers up by place value and add them in columns without carrying.
    prerequisites: { hard: [math.numbers-to-1000.place-value, math.add-sub-to-1000.semi-written] }
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y3.number-addition-and-subtraction.4]

  - id: math.written-add-sub.add-carry
    topic: { de: Schriftlich rechnen, en: Column methods }
    can_do:
      de: Ich kann schriftlich mit Übertrag addieren und erklären, was der Übertrag bedeutet.
      en: I can add in columns with carrying and explain what the carried digit means.
    prerequisites: { hard: [math.written-add-sub.add-no-carry] }
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y3.number-addition-and-subtraction.4, nc-maths-2014.y4.number-addition-and-subtraction.1]

  - id: math.written-add-sub.add-several
    topic: { de: Schriftlich rechnen, en: Column methods }
    can_do:
      de: Ich kann mehr als zwei Zahlen schriftlich addieren, auch mit verschieden vielen Stellen.
      en: I can add more than two numbers in columns, also with different numbers of digits.
    prerequisites: { hard: [math.written-add-sub.add-carry] }
    standards: [kmk-mathe-2022.zo.10]

  - id: math.written-add-sub.sub-no-regroup
    topic: { de: Schriftlich rechnen, en: Column methods }
    can_do:
      de: Ich kann schriftlich subtrahieren, wenn an keiner Stelle entbündelt oder erweitert werden muss.
      en: I can subtract in columns when no exchange is needed.
    prerequisites: { hard: [math.written-add-sub.add-no-carry] }
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y3.number-addition-and-subtraction.4]

  - id: math.written-add-sub.sub-regroup
    topic: { de: Schriftlich rechnen, en: Column methods }
    can_do:
      de: Ich kann schriftlich mit Übertrag subtrahieren, mit dem Verfahren, das an meiner Schule gilt, und jeden Schritt erklären.
      en: I can subtract in columns with exchange, using the method my school uses, and explain each step.
    prerequisites: { hard: [math.written-add-sub.sub-no-regroup] }
    facets: [written-subtraction]
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y3.number-addition-and-subtraction.4, nc-maths-2014.y4.number-addition-and-subtraction.1]
    note: The facet picks the method per market. de-DE uses Abziehen (the method Bayern prescribes and Baden-Württemberg allows); en-GB uses column subtraction with exchange.

  - id: math.written-add-sub.check
    topic: { de: Schriftlich rechnen, en: Column methods }
    can_do:
      de: Ich kann schriftliche Rechnungen mit Überschlag und Umkehraufgabe prüfen und typische Fehler finden.
      en: I can check column calculations by estimating and with the inverse, and spot typical mistakes.
    prerequisites: { hard: [math.written-add-sub.sub-regroup, math.add-sub-to-1000.estimate] }
    standards: [kmk-mathe-2022.zo.8, kmk-mathe-2022.zo.11, nc-maths-2014.y3.number-addition-and-subtraction.5, nc-maths-2014.y4.number-addition-and-subtraction.2]

  - id: math.written-add-sub.large
    topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
    can_do:
      de: Ich kann im Zahlenraum bis 1 000 000 sicher schriftlich addieren und subtrahieren.
      en: I can add and subtract numbers up to 1 000 000 in columns reliably.
    prerequisites: { hard: [math.written-add-sub.check, math.large-numbers.to-10000] }
    standards: [kmk-mathe-2022.zo.10, nc-maths-2014.y4.number-addition-and-subtraction.1, nc-maths-2014.y5.number-addition-and-subtraction.1]

  - id: math.written-add-sub.choose-method
    topic: { de: Rechnen mit großen Zahlen, en: Calculating with large numbers }
    can_do:
      de: Ich kann entscheiden, ob ich eine Aufgabe im Kopf, halbschriftlich oder schriftlich rechne, und meine Wahl begründen.
      en: I can decide whether to calculate mentally, informally or in columns, and give a reason.
    prerequisites: { hard: [math.written-add-sub.large, math.add-sub-to-1000.large-semi-written] }
    standards: [kmk-mathe-2022.zo.8]
