progression: math.large-numbers
title: { de: Große Zahlen, en: Large numbers }
order: free
steps:
  - id: math.large-numbers.to-10000
    topic: { de: Zahlen bis 10 000, en: Numbers to 10 000 }
    can_do:
      de: Ich kann Zahlen bis 10 000 bündeln, in die Stellentafel (T, H, Z, E) eintragen, lesen und schreiben.
      en: I can show numbers to 10 000 in a place-value chart and read and write them.
    prerequisites: { hard: [math.numbers-to-1000.place-value] }
    objectives: [kmk-mathe-2022.zo.1, kmk-mathe-2022.zo.2, nc-maths-2014.y4.number-number-and-place-value.4]

  - id: math.large-numbers.order-to-10000
    topic: { de: Zahlen bis 10 000, en: Numbers to 10 000 }
    can_do:
      de: Ich kann Zahlen bis 10 000 am Zahlenstrahl finden, ordnen, vergleichen und auf Zehner, Hunderter und Tausender runden.
      en: I can place numbers to 10 000 on a number line, order and compare them, and round to tens, hundreds and thousands.
    prerequisites: { hard: [math.large-numbers.to-10000, math.numbers-to-1000.round] }
    objectives: [kmk-mathe-2022.zo.3, kmk-mathe-2022.zo.13, nc-maths-2014.y4.number-number-and-place-value.2, nc-maths-2014.y4.number-number-and-place-value.5, nc-maths-2014.y4.number-number-and-place-value.6, nc-maths-2014.y4.number-number-and-place-value.7]

  - id: math.large-numbers.to-million
    topic: { de: Zahlen bis 1 000 000, en: Numbers to 1 000 000 }
    can_do:
      de: Ich kann Zahlen bis 1 000 000 in der Stellentafel darstellen, lesen und schreiben, mit Punkt als Gliederung (250.000).
      en: I can show, read and write numbers to 1 000 000, grouping the digits in threes.
    prerequisites: { hard: [math.large-numbers.to-10000] }
    objectives: [kmk-mathe-2022.zo.1, kmk-mathe-2022.zo.2, nc-maths-2014.y5.number-number-and-place-value.1]

  - id: math.large-numbers.order-to-million
    topic: { de: Zahlen bis 1 000 000, en: Numbers to 1 000 000 }
    can_do:
      de: Ich kann Zahlen bis 1 000 000 am Zahlenstrahl finden, ordnen, vergleichen und sinnvoll runden.
      en: I can place numbers to 1 000 000 on a number line, order and compare them, and round them sensibly.
    prerequisites: { hard: [math.large-numbers.to-million, math.large-numbers.order-to-10000] }
    objectives: [kmk-mathe-2022.zo.3, kmk-mathe-2022.zo.13, nc-maths-2014.y5.number-number-and-place-value.1, nc-maths-2014.y5.number-number-and-place-value.4, nc-maths-2014.y5.number-number-and-place-value.5, nc-maths-2014.y6.number-number-and-place-value.2]

  - id: math.large-numbers.sequences
    topic: { de: Zahlen bis 1 000 000, en: Numbers to 1 000 000 }
    can_do:
      de: Ich kann im Zahlenraum bis 1 000 000 in großen Schritten zählen und Zahlenfolgen fortsetzen.
      en: I can count in large steps up to 1 000 000 and continue number sequences.
    prerequisites: { hard: [math.large-numbers.to-10000] }
    objectives: [kmk-mathe-2022.msf.2, nc-maths-2014.y4.number-number-and-place-value.1, nc-maths-2014.y5.number-number-and-place-value.2]

  - id: math.large-numbers.roman-numerals
    topic: { de: Zahlen bis 1 000 000, en: Roman numerals }
    can_do:
      de: Ich kann römische Zahlen bis 100 lesen (I bis C), auch auf dem Zifferblatt, und ihr Prinzip mit unserem Stellenwertsystem vergleichen.
      en: I can read Roman numerals to 100 (I to C), also on a clock face, and compare how they work with place value.
    prerequisites: { hard: [math.numbers-to-1000.place-value] }
    objectives: [nc-maths-2014.y3.measurement.4, nc-maths-2014.y4.number-number-and-place-value.9]

  - id: math.large-numbers.binary
    topic: { de: Zahlen bis 1 000 000, en: Binary numbers }
    can_do:
      de: Ich kann kleine Zahlen vom Zehnersystem ins Zweiersystem umwandeln und umgekehrt.
      en: I can convert small numbers between base ten and binary.
    prerequisites: { hard: [math.numbers-to-1000.place-value] }
    objectives: []
    enrichment: true
    reason: Not in KMK; a computing extension that some Länder add in Klasse 4.

  - id: math.large-numbers.negative-numbers
    topic: { de: Negative Zahlen, en: Negative numbers }
    can_do:
      de: Ich kann über die Null hinaus rückwärts zählen und negative Zahlen am Zahlenstrahl und auf dem Thermometer lesen.
      en: I can count back through zero and read negative numbers on a number line and a thermometer.
    prerequisites: { hard: [math.numbers-to-1000.number-line] }
    objectives: [nc-maths-2014.y4.number-number-and-place-value.3]
    note: Negative numbers are not in KMK for primary; English National Curriculum, Year 4.

  - id: math.large-numbers.negative-in-context
    topic: { de: Negative Zahlen, en: Negative numbers }
    can_do:
      de: Ich kann negative Zahlen in Sachsituationen deuten und Abstände über die Null hinweg berechnen (von −4 °C auf 7 °C).
      en: I can interpret negative numbers in context and work out differences across zero (from −4 °C to 7 °C).
    prerequisites: { hard: [math.large-numbers.negative-numbers] }
    objectives: [nc-maths-2014.y5.number-number-and-place-value.3, nc-maths-2014.y6.number-number-and-place-value.3]
    note: English National Curriculum, Years 5 and 6.

  - id: math.large-numbers.to-ten-million
    topic: { de: Zahlen bis 10 000 000, en: Numbers to 10 000 000 }
    can_do:
      de: Ich kann Zahlen bis 10 000 000 lesen, schreiben, ordnen, vergleichen und den Wert jeder Ziffer nennen.
      en: I can read, write, order and compare numbers up to 10 000 000 and give the value of each digit.
    prerequisites: { hard: [math.large-numbers.order-to-million] }
    objectives: [nc-maths-2014.y6.number-number-and-place-value.1, nc-maths-2014.y6.number-number-and-place-value.4]
    note: English National Curriculum, Year 6.

  - id: math.large-numbers.roman-numerals-large
    topic: { de: Römische Zahlen, en: Roman numerals }
    can_do:
      de: Ich kann römische Zahlen bis 1000 (M) lesen und Jahreszahlen in römischen Zahlen erkennen.
      en: I can read Roman numerals to 1000 (M) and recognise years written in Roman numerals.
    prerequisites: { hard: [math.large-numbers.roman-numerals, math.numbers-to-1000.place-value] }
    objectives: [nc-maths-2014.y5.number-number-and-place-value.6]
    note: English National Curriculum, Year 5.
