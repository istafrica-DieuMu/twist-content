progression: math.mult-div
title: { de: Einmaleins und Geteiltaufgaben, en: Times tables and division facts }
order: free
skills:
  - id: math.mult-div.mult-meaning
    topic: { de: Malaufgaben, en: Multiplication }
    can_do:
      de: Ich kann gleich große Gruppen erkennen und eine Plusaufgabe mit gleichen Zahlen als Malaufgabe schreiben (4 + 4 + 4 = 3 · 4).
      en: I can spot equal groups and write a repeated addition as a multiplication (4 + 4 + 4 = 3 × 4).
    prerequisites: { hard: [math.numbers-to-100.sequences, math.add-sub-to-20.fluency-to-20] }
    facets: [operation-signs]
    standards: [kmk-mathe-2022.zo.4, nc-maths-2014.y1.number-multiplication-and-division.1, nc-maths-2014.y2.number-multiplication-and-division.2]

  - id: math.mult-div.arrays
    topic: { de: Malaufgaben, en: Multiplication }
    can_do:
      de: Ich kann Malaufgaben als Punktefelder darstellen und zu Bildern und Geschichten passende Malaufgaben finden.
      en: I can show multiplications as arrays and find the multiplication that matches a picture or story.
    prerequisites: { hard: [math.mult-div.mult-meaning] }
    standards: [kmk-mathe-2022.zo.4, kmk-mathe-2022.msf.1, nc-maths-2014.y2.number-multiplication-and-division.4]

  - id: math.mult-div.commutative
    topic: { de: Malaufgaben, en: Multiplication }
    can_do:
      de: Ich kann Tauschaufgaben beim Malnehmen am Punktefeld zeigen und nutzen (3 · 7 = 7 · 3).
      en: I can show with an array that multiplication can be done in either order and use it (3 × 7 = 7 × 3).
    prerequisites: { hard: [math.mult-div.arrays] }
    standards: [kmk-mathe-2022.zo.9, nc-maths-2014.y2.number-multiplication-and-division.3, nc-maths-2014.y4.number-multiplication-and-division.2]

  - id: math.mult-div.core-facts
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Kernaufgaben des Einmaleins (mal 1, mal 2, mal 5, mal 10) auswendig.
      en: I know the core facts of the times tables (×1, ×2, ×5, ×10) by heart.
    prerequisites: { hard: [math.mult-div.commutative] }
    standards: [kmk-mathe-2022.zo.5, nc-maths-2014.y2.number-multiplication-and-division.1]

  - id: math.mult-div.derive-facts
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann schwierige Einmaleinsaufgaben aus Kernaufgaben ableiten, durch Verdoppeln, Nachbaraufgaben oder Zerlegen (7 · 6 = 5 · 6 + 2 · 6).
      en: I can work out harder facts from core facts by doubling, using a near fact or splitting (7 × 6 = 5 × 6 + 2 × 6).
    prerequisites: { hard: [math.mult-div.core-facts, math.numbers-to-100.double-halve] }
    standards: [kmk-mathe-2022.zo.7, kmk-mathe-2022.zo.9]

  - id: math.mult-div.table-2-4-8
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Einmaleinsreihen der 2, 4 und 8 und sehe, wie sie durch Verdoppeln zusammenhängen.
      en: I know the 2, 4 and 8 times tables and see how they are linked by doubling.
    prerequisites: { hard: [math.mult-div.derive-facts] }
    standards: [kmk-mathe-2022.zo.5, kmk-mathe-2022.msf.2, nc-maths-2014.y2.number-multiplication-and-division.1, nc-maths-2014.y3.number-multiplication-and-division.1]

  - id: math.mult-div.table-5-10
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Einmaleinsreihen der 5 und 10 und sehe, wie sie zusammenhängen.
      en: I know the 5 and 10 times tables and see how they are linked.
    prerequisites: { hard: [math.mult-div.core-facts] }
    standards: [kmk-mathe-2022.zo.5, kmk-mathe-2022.msf.2, nc-maths-2014.y2.number-multiplication-and-division.1]

  - id: math.mult-div.table-3-6-9
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Einmaleinsreihen der 3, 6 und 9.
      en: I know the 3, 6 and 9 times tables.
    prerequisites: { hard: [math.mult-div.derive-facts] }
    standards: [kmk-mathe-2022.zo.5, kmk-mathe-2022.msf.2, nc-maths-2014.y3.number-multiplication-and-division.1, nc-maths-2014.y4.number-number-and-place-value.1]

  - id: math.mult-div.table-7
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Einmaleinsreihe der 7.
      en: I know the 7 times table.
    prerequisites: { hard: [math.mult-div.derive-facts] }
    standards: [kmk-mathe-2022.zo.5, nc-maths-2014.y4.number-number-and-place-value.1]

  - id: math.mult-div.squares
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Quadratzahlen bis 10 · 10 und erkenne sie im Punktefeld als Quadrate.
      en: I know the square numbers to 10 × 10 and see them as squares in an array.
    prerequisites: { hard: [math.mult-div.arrays] }
    standards: [kmk-mathe-2022.msf.2]

  - id: math.mult-div.all-tables
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann alle Aufgaben des kleinen Einmaleins schnell und sicher aus dem Kopf, auch gemischt.
      en: I can recall all times-table facts to 10 × 10 quickly, also in mixed order.
    prerequisites: { hard: [math.mult-div.table-2-4-8, math.mult-div.table-5-10, math.mult-div.table-3-6-9, math.mult-div.table-7] }
    standards: [kmk-mathe-2022.zo.5]

  - id: math.mult-div.div-meaning
    topic: { de: Geteiltaufgaben, en: Division }
    can_do:
      de: Ich kann zu Situationen des Aufteilens und Verteilens passende Geteiltaufgaben finden und lösen.
      en: I can find and solve the division that matches a grouping or sharing situation.
    prerequisites: { hard: [math.numbers-to-20.count-to-10] }
    facets: [operation-signs]
    standards: [kmk-mathe-2022.zo.4, nc-maths-2014.y1.number-multiplication-and-division.1, nc-maths-2014.y2.number-multiplication-and-division.4, eyfs-2026.elg.numerical-patterns.3]

  - id: math.mult-div.div-inverse
    topic: { de: Geteiltaufgaben, en: Division }
    can_do:
      de: "Ich kann Geteiltaufgaben mit der passenden Malaufgabe lösen und Aufgabenfamilien bilden (3 · 4, 4 · 3, 12 : 3, 12 : 4)."
      en: I can solve divisions using the matching multiplication and write fact families (3 × 4, 4 × 3, 12 ÷ 3, 12 ÷ 4).
    prerequisites: { hard: [math.mult-div.div-meaning, math.mult-div.core-facts] }
    standards: [kmk-mathe-2022.zo.4, kmk-mathe-2022.zo.5, nc-maths-2014.y2.number-multiplication-and-division.2]

  - id: math.mult-div.div-facts
    topic: { de: Geteiltaufgaben, en: Division }
    can_do:
      de: Ich kann alle Geteiltaufgaben des kleinen Einmaleins sicher lösen und mit der Malaufgabe kontrollieren.
      en: I can solve all division facts from the times tables and check them with multiplication.
    prerequisites: { hard: [math.mult-div.div-inverse, math.mult-div.all-tables] }
    standards: [kmk-mathe-2022.zo.5, kmk-mathe-2022.zo.11]

  - id: math.mult-div.remainder
    topic: { de: Geteiltaufgaben, en: Division }
    can_do:
      de: "Ich kann Geteiltaufgaben mit Rest lösen und den Rest in einer Sachsituation deuten (17 : 5 = 3 Rest 2)."
      en: I can solve divisions with a remainder and say what the remainder means in a story (17 ÷ 5 = 3 r 2).
    prerequisites: { hard: [math.mult-div.div-facts] }
    standards: [kmk-mathe-2022.zo.4, kmk-mathe-2022.zo.12]

  - id: math.mult-div.vocabulary
    topic: { de: Geteiltaufgaben, en: Division }
    can_do:
      de: Ich kann die Begriffe mal, geteilt, Produkt und Quotient richtig verwenden.
      en: I can use the words times, divided by, product and quotient correctly.
    prerequisites: { hard: [math.mult-div.div-facts] }
    standards: [kmk-mathe-2022.pk-werkzeuge.2]

  - id: math.mult-div.table-11-12
    topic: { de: Einmaleins, en: Times tables }
    can_do:
      de: Ich kann die Einmaleinsreihen der 11 und 12 und alle Malaufgaben bis 12 · 12 schnell und sicher.
      en: I know the 11 and 12 times tables and all multiplication facts up to 12 × 12.
    prerequisites: { hard: [math.mult-div.all-tables] }
    standards: [nc-maths-2014.y4.number-multiplication-and-division.1]
    note: English National Curriculum, Year 4; KMK stops at 10 × 10.
