progression: math.data
title: { de: Daten, en: Data }
order: free
steps:
  - id: math.data.sort-classify
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Dinge nach Merkmalen sortieren und zählen, wie viele in jeder Gruppe sind.
      en: I can sort things by a property and count how many are in each group.
    prerequisites: { hard: [math.numbers-to-20.count-to-10] }
    objectives: [kmk-mathe-2022.dz.1, nc-maths-2014.y2.statistics.2]

  - id: math.data.tally
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Daten mit Strichlisten erfassen und auszählen, zum Beispiel bei einer Umfrage in der Klasse.
      en: I can collect data with tally marks and count it up, for example in a class survey.
    prerequisites: { hard: [math.data.sort-classify, math.numbers-to-20.subitize-to-10] }
    objectives: [kmk-mathe-2022.dz.1, nc-maths-2014.y2.statistics.1]

  - id: math.data.read-tables
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Informationen aus Tabellen und Kalendern ablesen und damit Fragen beantworten.
      en: I can read information from tables and calendars and use it to answer questions.
    prerequisites: { hard: [math.data.tally] }
    objectives: [kmk-mathe-2022.dz.2, nc-maths-2014.y2.statistics.1, nc-maths-2014.y3.statistics.1, nc-maths-2014.y5.statistics.2]

  - id: math.data.pictograms-bar-charts
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Daten in Bilddiagrammen und Säulendiagrammen darstellen und daraus ablesen.
      en: I can show data in pictograms and bar charts and read information from them.
    prerequisites: { hard: [math.data.tally] }
    objectives: [kmk-mathe-2022.dz.2, nc-maths-2014.y2.statistics.1, nc-maths-2014.y2.statistics.3, nc-maths-2014.y3.statistics.1]

  - id: math.data.plan-survey
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann eine einfache Umfrage planen, die Daten in einer Tabelle ordnen und das Ergebnis vorstellen.
      en: I can plan a simple survey, organise the data in a table and present the result.
    prerequisites: { hard: [math.data.pictograms-bar-charts, math.data.read-tables] }
    objectives: [kmk-mathe-2022.dz.1]

  - id: math.data.read-charts
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Diagramme mit größeren Zahlen und Skalen lesen, Werte vergleichen und daraus Schlüsse ziehen.
      en: I can read charts with larger numbers and scales, compare values and draw conclusions.
    prerequisites: { hard: [math.data.pictograms-bar-charts, math.numbers-to-1000.number-line] }
    objectives: [kmk-mathe-2022.dz.2, kmk-mathe-2022.dz.3, nc-maths-2014.y3.statistics.2, nc-maths-2014.y4.statistics.1, nc-maths-2014.y4.statistics.2]

  - id: math.data.critical
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann erkennen, wenn ein Diagramm in die Irre führt, zum Beispiel durch eine abgeschnittene Achse, und es richtig deuten.
      en: I can spot when a chart is misleading, for example because its axis does not start at zero, and read it correctly.
    prerequisites: { hard: [math.data.read-charts] }
    objectives: [kmk-mathe-2022.dz.3]

  - id: math.data.digital-tools
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Daten mit einem digitalen Werkzeug in eine Tabelle eintragen und als Diagramm darstellen lassen.
      en: I can enter data in a table with a digital tool and turn it into a chart.
    prerequisites: { hard: [math.data.plan-survey] }
    objectives: [kmk-mathe-2022.dz.2]

  - id: math.data.line-graphs
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Liniendiagramme und Zeitdiagramme lesen, zeichnen und damit Fragen beantworten.
      en: I can read and draw line graphs and time graphs and use them to answer questions.
    prerequisites: { hard: [math.data.read-charts] }
    objectives: [nc-maths-2014.y4.statistics.1, nc-maths-2014.y5.statistics.1, nc-maths-2014.y6.statistics.1]
    note: English National Curriculum, Years 4 to 6.

  - id: math.data.pie-charts
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann Kreisdiagramme lesen und einfache Kreisdiagramme zeichnen.
      en: I can read pie charts and draw simple ones.
    prerequisites: { hard: [math.data.read-charts, math.fractions.of-quantities, math.angles.angle-facts] }
    objectives: [nc-maths-2014.y6.statistics.1]
    note: English National Curriculum, Year 6.

  - id: math.data.mean
    topic: { de: Daten, en: Data }
    can_do:
      de: Ich kann den Mittelwert als Durchschnitt berechnen und deuten.
      en: I can calculate the mean as an average and interpret it.
    prerequisites: { hard: [math.data.read-tables, math.written-mult-div.div-one-digit] }
    objectives: [nc-maths-2014.y6.statistics.2]
    note: English National Curriculum, Year 6.
