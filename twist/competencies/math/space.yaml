progression: math.space
title: { de: Orientierung im Raum, en: Position and direction }
order: free
skills:
  - id: math.space.position-words
    topic: { de: Orientierung, en: Position and direction }
    can_do:
      de: Ich kann Lagebeziehungen beschreiben und verstehen (rechts, links, oben, unten, vor, hinter, neben, zwischen).
      en: I can describe and understand positions (right, left, above, below, in front of, behind, next to, between).
    standards: [kmk-mathe-2022.rf.1, nc-maths-2014.y1.geometry-position-and-direction.1]

  - id: math.space.follow-directions
    topic: { de: Orientierung, en: Position and direction }
    can_do:
      de: Ich kann Wegbeschreibungen folgen und selbst Wege beschreiben, auch auf einem Gitter mit Pfeilen.
      en: I can follow directions and describe routes myself, also on a grid with arrows.
    prerequisites: { hard: [math.space.position-words] }
    standards: [kmk-mathe-2022.rf.1, nc-maths-2014.y2.geometry-position-and-direction.2]

  - id: math.space.plans-maps
    topic: { de: Orientierung, en: Position and direction }
    can_do:
      de: Ich kann mich mit Plänen und Karten orientieren, Wege einzeichnen und mit Koordinaten wie A3 Felder finden.
      en: I can find my way with plans and maps, draw routes and find squares with grid references like A3.
    prerequisites: { hard: [math.space.follow-directions] }
    standards: [kmk-mathe-2022.rf.1, nc-maths-2014.y4.geometry-position-and-direction.1, nc-maths-2014.y4.geometry-position-and-direction.2]

  - id: math.space.views
    topic: { de: Orientierung, en: Position and direction }
    can_do:
      de: Ich kann Ansichten von Gegenständen und Würfelgebäuden von vorne, von der Seite und von oben zuordnen.
      en: I can match views of objects and cube buildings from the front, the side and above.
    prerequisites: { hard: [math.solids.cube-buildings] }
    standards: [kmk-mathe-2022.rf.1, kmk-mathe-2022.rf.2, nc-maths-2014.y5.geometry-properties-of-shapes.1]

  - id: math.space.mental-moves
    topic: { de: Orientierung, en: Position and direction }
    can_do:
      de: Ich kann mir vorstellen, wie eine Figur oder ein Würfel nach dem Drehen oder Kippen aussieht.
      en: I can imagine how a shape or a dice looks after it is turned or tipped over.
    prerequisites: { hard: [math.space.views, math.solids.nets] }
    standards: [kmk-mathe-2022.rf.3]
