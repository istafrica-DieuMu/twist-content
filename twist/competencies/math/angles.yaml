progression: math.angles
title: { de: Winkel, en: Angles }
steps:
  - id: math.angles.turns
    topic: { de: Drehungen, en: Turns }
    can_do:
      de: Ich kann ganze, halbe, Viertel- und Dreivierteldrehungen ausführen und beschreiben, auch im und gegen den Uhrzeigersinn.
      en: I can make and describe whole, half, quarter and three-quarter turns, clockwise and anticlockwise.
    prerequisites: { hard: [math.space.position-words] }
    objectives: [nc-maths-2014.y1.geometry-position-and-direction.1, nc-maths-2014.y2.geometry-position-and-direction.2]
    note: English National Curriculum, Years 1 and 2; KMK covers turning only through mental moves.

  - id: math.angles.right-angles
    topic: { de: Winkel, en: Angles }
    can_do:
      de: Ich kann rechte Winkel in Figuren und in der Umwelt finden und weiß, dass zwei rechte Winkel eine halbe Drehung sind.
      en: I can find right angles in shapes and around me and know that two right angles make a half turn.
    prerequisites: { hard: [math.angles.turns, math.shapes.properties] }
    objectives: [nc-maths-2014.y3.geometry-properties-of-shapes.2, nc-maths-2014.y3.geometry-properties-of-shapes.3]
    note: English National Curriculum, Year 3.

  - id: math.angles.acute-obtuse
    topic: { de: Winkel, en: Angles }
    can_do:
      de: Ich kann spitze, rechte und stumpfe Winkel unterscheiden und Winkel bis zu zwei rechten Winkeln der Größe nach ordnen.
      en: I can tell acute, right and obtuse angles apart and order angles up to two right angles by size.
    prerequisites: { hard: [math.angles.right-angles] }
    objectives: [nc-maths-2014.y4.geometry-properties-of-shapes.2]
    note: English National Curriculum, Year 4.

  - id: math.angles.measure-draw
    topic: { de: Winkel, en: Angles }
    can_do:
      de: Ich kann Winkel in Grad schätzen, mit dem Geodreieck messen und zeichnen, auch überstumpfe Winkel.
      en: I can estimate angles in degrees and measure and draw them with a protractor, including reflex angles.
    prerequisites: { hard: [math.angles.acute-obtuse, math.shapes.parallel-perpendicular] }
    objectives: [nc-maths-2014.y5.geometry-properties-of-shapes.2, nc-maths-2014.y5.geometry-properties-of-shapes.3]
    note: English National Curriculum, Year 5.

  - id: math.angles.angle-facts
    topic: { de: Winkel, en: Angles }
    can_do:
      de: Ich weiß, dass die Winkel um einen Punkt zusammen 360° und an einer Geraden 180° ergeben, und finde damit fehlende Winkel.
      en: I know that angles at a point make 360° and on a straight line make 180°, and use this to find missing angles.
    prerequisites: { hard: [math.angles.measure-draw] }
    objectives: [nc-maths-2014.y5.geometry-properties-of-shapes.4, nc-maths-2014.y5.geometry-properties-of-shapes.5, nc-maths-2014.y5.geometry-properties-of-shapes.6]
    note: English National Curriculum, Years 5 and 6.

  - id: math.angles.missing-angles
    topic: { de: Winkel, en: Angles }
    can_do:
      de: Ich kann fehlende Winkel in Dreiecken, Vierecken und regelmäßigen Vielecken berechnen und Scheitelwinkel erkennen.
      en: I can calculate missing angles in triangles, quadrilaterals and regular polygons and recognise vertically opposite angles.
    prerequisites: { hard: [math.angles.angle-facts, math.shapes.classify-polygons] }
    objectives: [nc-maths-2014.y6.geometry-properties-of-shapes.3, nc-maths-2014.y6.geometry-properties-of-shapes.5]
    note: English National Curriculum, Year 6.
