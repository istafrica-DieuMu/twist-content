progression: world.nature
title: { de: Natur und Umwelt, en: Nature and the environment }
order: free
skills:
  - id: world.nature.living-nonliving
    topic: { de: Natur um mich, en: Nature around me }
    can_do:
      de: Ich kann Lebewesen und Dinge unterscheiden und sagen, woran ich Lebewesen erkenne (sie wachsen, brauchen Nahrung und bekommen Junge).
      en: I can tell living things from non-living things and say how I know (living things grow, need food and have young).
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.1, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.3]

  - id: world.nature.seasons
    topic: { de: Jahreszeiten und Wetter, en: Seasons and weather }
    can_do:
      de: Ich kann die vier Jahreszeiten in der richtigen Reihenfolge nennen und sagen, wie sich die Natur in jeder Jahreszeit verändert.
      en: I can name the four seasons in order and say how nature changes in each one.
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.1, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.3]

  - id: world.nature.weather
    topic: { de: Jahreszeiten und Wetter, en: Seasons and weather }
    can_do:
      de: Ich kann das Wetter beobachten und es mit Wörtern und Wetterzeichen beschreiben (Sonne, Wolken, Regen, Wind, warm und kalt).
      en: I can observe the weather and describe it with words and weather symbols (sun, clouds, rain, wind, warm and cold).
    prerequisites: { soft: [world.nature.seasons, math.mass-capacity.temperature] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.7]

  - id: world.nature.pets
    topic: { de: Natur um mich, en: Nature around me }
    can_do:
      de: Ich kann Haustiere nennen und beschreiben, was sie zum Leben brauchen und wie man sie richtig pflegt.
      en: I can name pets and describe what they need to live and how to look after them properly.
    prerequisites: { soft: [world.nature.living-nonliving] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.1]

  - id: world.nature.plant-parts
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann die Teile einer Pflanze benennen (Wurzel, Stängel, Blatt, Blüte) und sagen, wozu sie da sind.
      en: I can name the parts of a plant (root, stem, leaf, flower) and say what each one is for.
    prerequisites: { soft: [world.nature.living-nonliving] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.3]

  - id: world.nature.plant-growth
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann beschreiben, was eine Pflanze zum Wachsen braucht (Licht, Wasser, Wärme, Erde) und wie aus einem Samen eine Pflanze wird.
      en: I can describe what a plant needs to grow (light, water, warmth, soil) and how a seed becomes a plant.
    prerequisites: { hard: [world.nature.plant-parts] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.3, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.5]

  - id: world.nature.seed-dispersal
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann erklären, wie Samen an neue Orte reisen, zum Beispiel mit dem Wind wie beim Löwenzahn und Ahorn oder mit Tieren.
      en: I can explain how seeds travel to new places, for example on the wind like dandelion and maple seeds, or with animals.
    prerequisites: { hard: [world.nature.plant-growth] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.3]

  - id: world.nature.farm-animals
    topic: { de: Vom Hof auf den Tisch, en: From farm to table }
    can_do:
      de: Ich kann Nutztiere nennen und ihnen zuordnen, was wir von ihnen bekommen (Milch, Eier, Wolle, Fleisch).
      en: I can name farm animals and match them to what we get from them (milk, eggs, wool, meat).
    prerequisites: { soft: [world.nature.pets] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.1]

  - id: world.nature.food-origin
    topic: { de: Vom Hof auf den Tisch, en: From farm to table }
    can_do:
      de: Ich kann sagen, woher unsere Lebensmittel kommen, und erklären, was regional und saisonal bedeutet.
      en: I can say where our food comes from and explain what local and seasonal food means.
    prerequisites: { soft: [world.nature.farm-animals, world.nature.plant-growth, world.nature.seasons, world.body.healthy-eating] }
    standards: [nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.1, nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.5]

  - id: world.nature.meadow
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann die Wiese als Lebensraum beschreiben und Pflanzen und Tiere nennen, die dort leben.
      en: I can describe a meadow as a habitat and name plants and animals that live there.
    prerequisites: { soft: [world.nature.plant-parts, world.nature.living-nonliving] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.1, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.3, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.5]

  - id: world.nature.materials-sort
    topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
    can_do:
      de: Ich kann Gegenstände nach ihrem Stoff und ihren Eigenschaften ordnen (Holz, Metall, Glas, Kunststoff; hart, weich, durchsichtig).
      en: I can sort objects by their material and its properties (wood, metal, glass, plastic; hard, soft, see-through).
    prerequisites: { soft: [math.data.sort-classify] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.1, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.5]

  - id: world.nature.light-shadow
    topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
    can_do:
      de: Ich kann erklären, wie ein Schatten entsteht, und vorhersagen, wie er sich verändert, wenn das Licht sich bewegt.
      en: I can explain how a shadow forms and predict how it changes when the light moves.
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.7]

  - id: world.nature.sound
    topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
    can_do:
      de: Ich kann erklären, dass ein Ton entsteht, wenn etwas schwingt, und laute und leise, hohe und tiefe Töne unterscheiden.
      en: I can explain that a sound is made when something vibrates, and tell loud from quiet and high from low sounds.
    prerequisites: { soft: [world.body.senses] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.7]

  - id: world.nature.magnets
    topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
    can_do:
      de: Ich kann vorhersagen, welche Gegenstände ein Magnet anzieht, und magnetische von nicht magnetischen Stoffen unterscheiden.
      en: I can predict which objects a magnet attracts and tell magnetic from non-magnetic materials.
    prerequisites: { hard: [world.nature.materials-sort] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.7, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.5]

  - id: world.nature.air
    topic: { de: Stoffe und Naturphänomene, en: Materials and how things work }
    can_do:
      de: Ich kann an Beispielen zeigen, dass Luft Platz braucht und Kraft hat (Luftballon, Wind, ein Glas unter Wasser).
      en: I can show with examples that air takes up space and can push (a balloon, the wind, a glass held under water).
    prerequisites: { soft: [world.nature.materials-sort] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.7, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.5]

  - id: world.nature.waste-recycling
    topic: { de: Umwelt schützen, en: Caring for the environment }
    can_do:
      de: Ich kann Müll richtig trennen und sagen, wie ich weniger Müll mache.
      en: I can sort rubbish into the right bins and say how I can make less rubbish.
    prerequisites: { hard: [world.nature.materials-sort] }
    standards: [nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.5, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.1]

  - id: world.nature.life-cycles
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann Lebenszyklen beschreiben und ordnen, zum Beispiel vom Laich über die Kaulquappe zum Frosch oder von der Raupe zum Schmetterling.
      en: I can describe and order life cycles, for example from frogspawn to tadpole to frog, or from caterpillar to butterfly.
    prerequisites: { soft: [world.nature.living-nonliving, world.nature.plant-growth] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.4]

  - id: world.nature.animal-classes
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann Tiere nach ihren Merkmalen in Klassen ordnen (Säugetiere, Vögel, Fische, Lurche, Kriechtiere).
      en: I can sort animals into groups by their features (mammals, birds, fish, amphibians, reptiles).
    prerequisites: { soft: [world.nature.farm-animals, world.nature.pets] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2]

  - id: world.nature.adaptation
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann an Beispielen erklären, wie Körperbau und Verhalten von Tieren und Pflanzen zu ihrem Lebensraum passen.
      en: I can explain with examples how the bodies and behaviour of animals and plants suit their habitat.
    prerequisites: { soft: [world.nature.meadow, world.nature.animal-classes] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2]

  - id: world.nature.native-birds
    topic: { de: Tiere und Pflanzen, en: Animals and plants }
    can_do:
      de: Ich kann häufige heimische Vögel an Aussehen und Stimme erkennen und sagen, wie sie durch den Winter kommen.
      en: I can recognise common local birds by how they look and sound, and say how they get through the winter.
    prerequisites: { soft: [world.nature.animal-classes, world.nature.adaptation] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2]

  - id: world.nature.trees
    topic: { de: Der Wald, en: The forest }
    can_do:
      de: Ich kann Laubbäume und Nadelbäume unterscheiden und häufige Bäume an Blatt und Frucht erkennen.
      en: I can tell broadleaf trees from conifers and recognise common trees by their leaves and fruit.
    prerequisites: { soft: [world.nature.plant-parts] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.4, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2]

  - id: world.nature.forest
    topic: { de: Der Wald, en: The forest }
    can_do:
      de: Ich kann den Wald als Lebensraum beschreiben, mit seinen Stockwerken und den Tieren und Pflanzen, die dort leben.
      en: I can describe the forest as a habitat, with its layers and the animals and plants that live there.
    prerequisites: { hard: [world.nature.trees], soft: [world.nature.adaptation, world.nature.meadow] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.6]

  - id: world.nature.water-states
    topic: { de: Wasser, en: Water }
    can_do:
      de: Ich kann erklären, dass Wasser fest, flüssig oder gasförmig sein kann, und sagen, wann es gefriert, schmilzt und verdunstet.
      en: I can explain that water can be solid, liquid or gas, and say when it freezes, melts and evaporates.
    prerequisites: { soft: [world.nature.weather, math.mass-capacity.temperature] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.8, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.2]

  - id: world.nature.dissolving
    topic: { de: Wasser, en: Water }
    can_do:
      de: Ich kann vorhersagen, welche Stoffe sich in Wasser lösen (Zucker, Salz) und welche nicht (Sand, Öl).
      en: I can predict which materials dissolve in water (sugar, salt) and which do not (sand, oil).
    prerequisites: { soft: [world.nature.materials-sort, world.nature.water-states] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.4, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.2]

  - id: world.nature.water-cycle
    topic: { de: Wasser, en: Water }
    can_do:
      de: Ich kann den Wasserkreislauf beschreiben, vom Verdunsten über Wolken und Regen bis zurück in Flüsse und Meer.
      en: I can describe the water cycle, from evaporation through clouds and rain back to rivers and the sea.
    prerequisites: { hard: [world.nature.water-states], soft: [world.nature.weather] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.3, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.8]

  - id: world.nature.float-sink
    topic: { de: Wasser, en: Water }
    can_do:
      de: Ich kann vorhersagen, ob ein Gegenstand schwimmt oder sinkt, und meine Vorhersage begründen.
      en: I can predict whether an object floats or sinks and give a reason for my prediction.
    prerequisites: { soft: [world.nature.materials-sort] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.8]

  - id: world.nature.food-chains
    topic: { de: Lebensräume, en: Habitats }
    can_do:
      de: Ich kann Nahrungsketten bilden und erklären, wer wen frisst und warum Tiere und Pflanzen voneinander abhängen.
      en: I can build food chains and explain what eats what and why animals and plants depend on each other.
    prerequisites: { soft: [world.nature.forest, world.nature.meadow, world.nature.adaptation] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.6, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2]

  - id: world.nature.pond
    topic: { de: Lebensräume, en: Habitats }
    can_do:
      de: Ich kann Tiere und Pflanzen am und im Teich nennen und beschreiben, wie sie dort leben.
      en: I can name animals and plants in and around a pond and describe how they live there.
    prerequisites: { soft: [world.nature.life-cycles, world.nature.adaptation, world.nature.food-chains] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.2, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.6]

  - id: world.nature.drinking-water
    topic: { de: Wasser, en: Water }
    can_do:
      de: Ich kann den Weg des Wassers beschreiben, vom Wasserwerk zum Wasserhahn und als Abwasser weiter zur Kläranlage.
      en: I can describe the journey of water from the waterworks to the tap, and on as waste water to the sewage works.
    prerequisites: { soft: [world.nature.water-cycle] }
    standards: [nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.2, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.3]

  - id: world.nature.nature-protection
    topic: { de: Lebensräume, en: Habitats }
    can_do:
      de: Ich kann erklären, wie Menschen Lebensräume verändern, und sagen, wie wir Tiere und Pflanzen schützen können.
      en: I can explain how people change habitats and say how we can protect animals and plants.
    prerequisites: { soft: [world.nature.forest, world.nature.pond, world.nature.food-chains, world.nature.waste-recycling] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.4, nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.6, nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.6]

  - id: world.nature.fire
    topic: { de: Feuer und Strom, en: Fire and electricity }
    can_do:
      de: Ich kann nennen, was ein Feuer zum Brennen braucht (Brennstoff, Luft, Hitze), und daraus erklären, wie man es löscht.
      en: I can name what a fire needs to burn (fuel, air, heat) and use that to explain how to put it out.
    prerequisites: { soft: [world.nature.air] }
    standards: [nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.6, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.4]

  - id: world.nature.electric-circuit
    topic: { de: Feuer und Strom, en: Fire and electricity }
    can_do:
      de: Ich kann erklären, wie ein einfacher Stromkreis aus Batterie, Kabeln, Lämpchen und Schalter funktioniert, und vorhersagen, ob das Lämpchen leuchtet.
      en: I can explain how a simple circuit of battery, wires, bulb and switch works and predict whether the bulb lights up.
    standards: [nrw-sachunterricht-2021.nu.energie-und-ressourcen.1]

  - id: world.nature.conductors
    topic: { de: Feuer und Strom, en: Fire and electricity }
    can_do:
      de: Ich kann vorhersagen, welche Stoffe Strom leiten und welche nicht.
      en: I can predict which materials conduct electricity and which do not.
    prerequisites: { hard: [world.nature.electric-circuit], soft: [world.nature.materials-sort] }
    standards: [nrw-sachunterricht-2021.nu.energie-und-ressourcen.1, nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.8]

  - id: world.nature.electricity-safety
    topic: { de: Feuer und Strom, en: Fire and electricity }
    can_do:
      de: Ich kann Gefahren durch Strom erkennen und die Regeln nennen, die mich davor schützen.
      en: I can recognise dangers from electricity and name the rules that keep me safe.
    prerequisites: { soft: [world.nature.electric-circuit, world.nature.conductors] }
    standards: [nrw-sachunterricht-2021.nu.energie-und-ressourcen.2]

  - id: world.nature.energy-sources
    topic: { de: Energie und Klima, en: Energy and climate }
    can_do:
      de: Ich kann erneuerbare Energiequellen (Sonne, Wind, fließendes Wasser) von endlichen (Kohle, Erdöl, Erdgas) unterscheiden.
      en: I can tell renewable energy sources (sun, wind, flowing water) from ones that run out (coal, oil, gas).
    standards: [nrw-sachunterricht-2021.nu.energie-und-ressourcen.3]

  - id: world.nature.energy-saving
    topic: { de: Energie und Klima, en: Energy and climate }
    can_do:
      de: Ich kann Wege nennen, wie ich zu Hause und in der Schule Energie und Wasser spare.
      en: I can name ways to save energy and water at home and at school.
    prerequisites: { soft: [world.nature.energy-sources, world.nature.drinking-water] }
    standards: [nrw-sachunterricht-2021.nu.energie-und-ressourcen.5, nrw-sachunterricht-2021.nu.energie-und-ressourcen.1]

  - id: world.nature.climate
    topic: { de: Energie und Klima, en: Energy and climate }
    can_do:
      de: Ich kann einfach erklären, warum sich das Klima auf der Erde verändert, und sagen, was ich selbst tun kann.
      en: I can explain simply why the Earth's climate is changing and say what I can do myself.
    prerequisites: { soft: [world.nature.weather, world.nature.energy-sources, world.nature.energy-saving] }
    standards: [nrw-sachunterricht-2021.nu.tiere-pflanzen-lebensraeume.6, nrw-sachunterricht-2021.nu.energie-und-ressourcen.5]

  - id: world.nature.solar-system
    topic: { de: Erde und Weltall, en: Earth and space }
    can_do:
      de: Ich kann Sonne, Erde, Mond und die Planeten beschreiben und erklären, wie Tag und Nacht entstehen.
      en: I can describe the Sun, Earth, Moon and planets and explain how day and night happen.
    prerequisites: { soft: [world.nature.seasons, world.nature.light-shadow] }
    standards: []
    enrichment: true
    reason: No NRW standard asks for the solar system; Berlin/Brandenburg does, children ask about it, and day and night explain the Sonnenstand that NRW uses for orientation.
