progression: world.space
title: { de: Raum und Mobilität, en: Places and getting around }
order: free
skills:
  - id: world.space.left-right-position
    topic: { de: Wo ist was?, en: Where things are }
    can_do:
      de: Ich kann links und rechts sicher unterscheiden und beschreiben, wo etwas liegt (vor, hinter, neben, zwischen).
      en: I can tell left from right and describe where something is (in front of, behind, next to, between).
    prerequisites: { soft: [math.space.position-words] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.1, nrw-sachunterricht-2021.rm.mobilitaet-im-raum.3]

  - id: world.space.way-to-school
    topic: { de: Sicher unterwegs, en: Getting around safely }
    can_do:
      de: Ich kann beschreiben, wie ich meinen Schulweg sicher gehe, und gefährliche Stellen darauf erkennen.
      en: I can describe how I walk safely to school and spot the dangerous places on the way.
    prerequisites: { soft: [world.space.left-right-position] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.1, nrw-sachunterricht-2021.rm.mobilitaet-im-raum.3, nrw-sachunterricht-2021.rm.orientierung-in-raeumen.1]

  - id: world.space.see-be-seen
    topic: { de: Sicher unterwegs, en: Getting around safely }
    can_do:
      de: Ich kann erklären, wie ich im Verkehr gut gesehen werde (helle Kleidung, Reflektoren, Licht).
      en: I can explain how I make sure I am seen in traffic (bright clothes, reflectors, lights).
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.3]

  - id: world.space.traffic-light-crossing
    topic: { de: Sicher unterwegs, en: Getting around safely }
    can_do:
      de: Ich kann sagen, wie ich an der Ampel und am Zebrastreifen richtig über die Straße gehe.
      en: I can say how to cross the road properly at traffic lights and at a zebra crossing.
    prerequisites: { hard: [world.space.left-right-position], soft: [world.space.way-to-school] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.3]

  - id: world.space.bird-view
    topic: { de: Pläne und Orte, en: Plans and places }
    can_do:
      de: Ich kann Gegenstände und Räume von oben betrachten, erkennen, wie sie von oben aussehen, und sie so zeichnen.
      en: I can look at objects and rooms from above, recognise what they look like from above and draw them that way.
    prerequisites: { soft: [math.space.views] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.3, nrw-sachunterricht-2021.rm.orientierung-in-raeumen.1]

  - id: world.space.room-plan
    topic: { de: Pläne und Orte, en: Plans and places }
    can_do:
      de: Ich kann einen einfachen Plan von einem vertrauten Raum lesen und Dinge darauf wiederfinden.
      en: I can read a simple plan of a familiar place and find things on it.
    prerequisites: { hard: [world.space.bird-view], soft: [world.space.left-right-position] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.3]

  - id: world.space.town-country
    topic: { de: Pläne und Orte, en: Plans and places }
    can_do:
      de: Ich kann Stadt und Land vergleichen und typische Merkmale von beiden nennen.
      en: I can compare town and countryside and name typical features of each.
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.5, nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.1, nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.3]

  - id: world.space.public-transport
    topic: { de: Sicher unterwegs, en: Getting around safely }
    can_do:
      de: Ich kann sagen, wie ich mich an der Haltestelle und in Bus und Bahn sicher verhalte.
      en: I can say how to behave safely at the stop and on buses and trains.
    prerequisites: { soft: [world.space.way-to-school] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.1, nrw-sachunterricht-2021.rm.mobilitaet-im-raum.2]

  - id: world.space.traffic-signs-basic
    topic: { de: Sicher unterwegs, en: Getting around safely }
    can_do:
      de: Ich kann wichtige Verkehrszeichen erkennen und sagen, was sie bedeuten.
      en: I can recognise important road signs and say what they mean.
    prerequisites: { soft: [world.space.traffic-light-crossing] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.3]

  - id: world.space.compass
    topic: { de: Karten lesen, en: Reading maps }
    can_do:
      de: Ich kann die vier Himmelsrichtungen mit dem Kompass und mit dem Stand der Sonne bestimmen.
      en: I can find the four compass directions with a compass and from the position of the sun.
    prerequisites: { soft: [world.space.left-right-position] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.2]

  - id: world.space.map-symbols
    topic: { de: Karten lesen, en: Reading maps }
    can_do:
      de: Ich kann Kartenzeichen mit Hilfe der Legende lesen und Orte auf einer Karte finden.
      en: I can read map symbols using the key and find places on a map.
    prerequisites: { hard: [world.space.room-plan] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.2, nrw-sachunterricht-2021.rm.orientierung-in-raeumen.4]

  - id: world.space.map-grid
    topic: { de: Karten lesen, en: Reading maps }
    can_do:
      de: Ich kann Orte auf einer Karte mit dem Planquadrat finden und angeben, zum Beispiel C3.
      en: I can find places on a map with grid squares and give their grid reference, for example C3.
    prerequisites: { hard: [world.space.map-symbols], soft: [math.space.plans-maps] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.2]

  - id: world.space.scale
    topic: { de: Karten lesen, en: Reading maps }
    can_do:
      de: Ich kann mit dem Maßstab einer Karte einfache Entfernungen bestimmen.
      en: I can use the scale of a map to work out simple distances.
    prerequisites: { hard: [world.space.map-symbols, math.length.cm-m], soft: [math.shapes.scale, math.length.mm-km] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.4]

  - id: world.space.germany-map
    topic: { de: Deutschland und die Welt, en: Germany and the world }
    can_do:
      de: Ich kann Deutschland und seine 16 Bundesländer auf der Karte finden und zeigen, wo mein Bundesland liegt.
      en: I can find Germany and its 16 federal states on the map and show where my own state is.
    prerequisites: { hard: [world.space.map-symbols], soft: [world.space.compass] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.6]

  - id: world.space.germany-landscapes
    topic: { de: Deutschland und die Welt, en: Germany and the world }
    can_do:
      de: Ich kann die großen Landschaften Deutschlands auf der Karte zuordnen (Küste, Tiefland, Mittelgebirge, Alpen).
      en: I can place Germany's main landscapes on the map (coast, lowlands, uplands, Alps).
    prerequisites: { hard: [world.space.germany-map] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.6]

  - id: world.space.rivers-mountains
    topic: { de: Deutschland und die Welt, en: Germany and the world }
    can_do:
      de: Ich kann große Flüsse und Gebirge Deutschlands nennen und auf der Karte zeigen.
      en: I can name Germany's big rivers and mountain ranges and show them on the map.
    prerequisites: { hard: [world.space.germany-map], soft: [world.space.germany-landscapes] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.6]

  - id: world.space.continents-oceans
    topic: { de: Deutschland und die Welt, en: Germany and the world }
    can_do:
      de: Ich kann die Kontinente und Ozeane benennen und auf der Weltkarte zeigen.
      en: I can name the continents and oceans and show them on a world map.
    prerequisites: { hard: [world.space.map-symbols], soft: [world.space.compass] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.6]

  - id: world.space.transport-compare
    topic: { de: Verkehr und Umwelt, en: Travel and the environment }
    can_do:
      de: Ich kann Verkehrsmittel danach vergleichen, wie gut sie für die Umwelt und meine Gesundheit sind.
      en: I can compare ways of travelling by how good they are for the environment and for my health.
    prerequisites: { soft: [world.space.public-transport, world.nature.energy-sources, world.technology.vehicles] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.4, nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.4, nrw-sachunterricht-2021.nu.energie-und-ressourcen.1]

  - id: world.space.bike-parts
    topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
    can_do:
      de: Ich kann die Teile eines verkehrssicheren Fahrrads benennen und sagen, wozu sie da sind.
      en: I can name the parts of a roadworthy bike and say what each one is for.
    prerequisites: { soft: [world.space.see-be-seen] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.6, nrw-sachunterricht-2021.rm.mobilitaet-im-raum.4]

  - id: world.space.right-of-way
    topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
    can_do:
      de: Ich kann Vorfahrtsregeln anwenden (rechts vor links, Vorfahrtsschilder).
      en: I can apply right-of-way rules (give way to the right, priority signs).
    prerequisites: { hard: [world.space.traffic-signs-basic, world.space.left-right-position] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.6, nrw-sachunterricht-2021.rm.mobilitaet-im-raum.4]

  - id: world.space.turning-left
    topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
    can_do:
      de: Ich kann die Schritte zum sicheren Linksabbiegen mit dem Fahrrad in der richtigen Reihenfolge nennen.
      en: I can put the steps for turning left safely on a bike in the right order.
    prerequisites: { hard: [world.space.right-of-way] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.6]

  - id: world.space.cycling-test
    topic: { de: Mit dem Fahrrad unterwegs, en: Out on a bike }
    can_do:
      de: Ich kann die Fragen der Fahrradprüfung beantworten.
      en: I can answer the questions of the cycling proficiency test.
    prerequisites: { hard: [world.space.bike-parts, world.space.right-of-way, world.space.turning-left] }
    standards: [nrw-sachunterricht-2021.rm.mobilitaet-im-raum.6]
