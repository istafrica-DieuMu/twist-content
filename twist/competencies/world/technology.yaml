progression: world.technology
title: { de: Technik, digitale Technologie und Arbeit, en: Technology and work }
order: free
skills:
  - id: world.technology.tools-household
    topic: { de: Werkzeuge und Geräte, en: Tools and machines }
    can_do:
      de: Ich kann Werkzeuge und Geräte aus meinem Alltag benennen, sagen, wofür man sie benutzt, wie man sicher damit umgeht und welche Strom brauchen.
      en: I can name tools and machines from everyday life, say what they are for, how to use them safely and which ones need electricity.
    standards: [nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.1, nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.4, nrw-sachunterricht-2021.nu.energie-und-ressourcen.4]

  - id: world.technology.stable-building
    topic: { de: Bauen und Berufe, en: Building and jobs }
    can_do:
      de: Ich kann erklären, warum ein Bauwerk stabil steht, zum Beispiel durch eine breite Grundfläche oder Stützen.
      en: I can explain why a building or tower stands firm, for example because of a wide base or supports.
    standards: [nrw-sachunterricht-2021.tda.bauen-und-konstruieren.2, nrw-sachunterricht-2021.tda.bauen-und-konstruieren.3]

  - id: world.technology.jobs
    topic: { de: Bauen und Berufe, en: Building and jobs }
    can_do:
      de: Ich kann Berufe aus meinem Alltag ihren Werkzeugen und Arbeitsorten zuordnen und weiß, dass jeder Beruf für alle offen ist.
      en: I can match jobs I know from everyday life to their tools and workplaces, and know that any job is open to anyone.
    prerequisites: { soft: [world.technology.tools-household] }
    standards: [nrw-sachunterricht-2021.tda.arbeit-und-beruf.1, nrw-sachunterricht-2021.tda.arbeit-und-beruf.3, nrw-sachunterricht-2021.tda.arbeit-und-beruf.4, nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.4]

  - id: world.technology.lever-wheel
    topic: { de: Wie Technik funktioniert, en: How things work }
    can_do:
      de: Ich kann erklären, wie Hebel, Rolle und Rad uns Kraft sparen.
      en: I can explain how levers, pulleys and wheels help us save effort.
    prerequisites: { soft: [world.technology.tools-household] }
    standards: [nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.2]

  - id: world.technology.bridges
    topic: { de: Wie Technik funktioniert, en: How things work }
    can_do:
      de: Ich kann verschiedene Brückenformen vergleichen und sagen, welche besonders stabil ist und warum.
      en: I can compare different kinds of bridge and say which is especially strong and why.
    prerequisites: { hard: [world.technology.stable-building] }
    standards: [nrw-sachunterricht-2021.tda.bauen-und-konstruieren.3, nrw-sachunterricht-2021.tda.bauen-und-konstruieren.4]

  - id: world.technology.vehicles
    topic: { de: Wie Technik funktioniert, en: How things work }
    can_do:
      de: Ich kann Fahrzeuge vergleichen und sagen, was sie antreibt (Muskelkraft, Motor, Wind, Strom).
      en: I can compare vehicles and say what makes them move (muscle power, engine, wind, electricity).
    prerequisites: { soft: [world.technology.lever-wheel] }
    standards: [nrw-sachunterricht-2021.tda.bauen-und-konstruieren.3, nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.2, nrw-sachunterricht-2021.nu.energie-und-ressourcen.1]

  - id: world.technology.computer-parts
    topic: { de: Wie Technik funktioniert, en: How things work }
    can_do:
      de: Ich kann die Teile eines Computers benennen und sagen, welche etwas eingeben, verarbeiten oder ausgeben.
      en: I can name the parts of a computer and say which ones put information in, process it or put it out.
    prerequisites: { soft: [world.technology.tools-household] }
    standards: [nrw-sachunterricht-2021.tda.bauen-und-konstruieren.5]

  - id: world.technology.algorithms
    topic: { de: Technik verändert die Welt, en: Technology changes the world }
    can_do:
      de: Ich kann eine Folge von Befehlen schreiben, mit der eine Figur ein Ziel erreicht, und so ein kleines Programm bauen.
      en: I can write a sequence of instructions that gets a character to a goal, and so build a small program.
    prerequisites: { soft: [world.technology.computer-parts] }
    standards: [nrw-sachunterricht-2021.tda.bauen-und-konstruieren.7]

  - id: world.technology.inventions
    topic: { de: Technik verändert die Welt, en: Technology changes the world }
    can_do:
      de: Ich kann wichtige Erfindungen beschreiben und sagen, wie sie das Leben der Menschen verändert haben.
      en: I can describe important inventions and say how they changed people's lives.
    prerequisites: { soft: [world.time.timeline] }
    standards: [nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.3, nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.5, nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.6]

  - id: world.technology.work-change
    topic: { de: Technik verändert die Welt, en: Technology changes the world }
    can_do:
      de: Ich kann erklären, wie Maschinen und Computer die Arbeit der Menschen verändern.
      en: I can explain how machines and computers change the way people work.
    prerequisites: { soft: [world.technology.jobs, world.technology.inventions] }
    standards: [nrw-sachunterricht-2021.tda.technische-und-digitale-entwicklungen.3, nrw-sachunterricht-2021.tda.arbeit-und-beruf.2]
