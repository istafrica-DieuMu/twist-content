progression: world.society
title: { de: Demokratie und Gesellschaft, en: Society and democracy }
order: free
skills:
  - id: world.society.feelings-needs
    topic: { de: Ich und die anderen, en: Me and others }
    can_do:
      de: Ich kann meine Gefühle und die Gefühle anderer benennen und sagen, was jemand gerade braucht.
      en: I can name my own feelings and other people's, and say what someone needs.
    prerequisites: { soft: [lit-de.speaking.feelings] }
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.1]

  - id: world.society.class-rules
    topic: { de: Ich und die anderen, en: Me and others }
    can_do:
      de: Ich kann Regeln in der Klasse verstehen und erklären, warum es sie gibt.
      en: I can understand the rules in my class and explain why we have them.
    prerequisites: { soft: [world.society.feelings-needs] }
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.3]

  - id: world.society.families
    topic: { de: Ich und die anderen, en: Me and others }
    can_do:
      de: Ich kann beschreiben, dass Familien ganz verschieden sein können, und sagen, was sie gemeinsam haben.
      en: I can describe how families can be very different and say what they have in common.
    standards: [nrw-sachunterricht-2021.dg.leben-in-vielfalt.4]

  - id: world.society.friendship-conflict
    topic: { de: Gemeinsam in der Klasse, en: Together in class }
    can_do:
      de: Ich kann einen Streit fair lösen, sodass beide Seiten zu Wort kommen.
      en: I can sort out an argument fairly so that both sides are heard.
    prerequisites:
      hard: [world.society.feelings-needs]
      soft: [world.society.class-rules, lit-de.speaking.argue]
    standards:
      - nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.1
      - nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.2

  - id: world.society.class-council
    topic: { de: Gemeinsam in der Klasse, en: Together in class }
    can_do:
      de: Ich kann erklären, wie eine Klasse gemeinsam berät und abstimmt, zum Beispiel im Klassenrat.
      en: I can explain how a class talks things over and votes together, for example in a class council.
    prerequisites:
      hard: [world.society.class-rules]
      soft: [world.society.friendship-conflict, lit-de.speaking.conversation-rules]
    standards:
      - nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.8
      - nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.3

  - id: world.society.needs-wants
    topic: { de: Wünschen und Kaufen, en: Wanting and buying }
    can_do:
      de: Ich kann unterscheiden, was ich zum Leben brauche und was ich mir nur wünsche.
      en: I can tell apart what I need to live and what I only want.
    prerequisites: { soft: [world.society.feelings-needs] }
    standards: [nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.1]

  - id: world.society.media-types
    topic: { de: Medien, en: Media }
    can_do:
      de: Ich kann verschiedene Medien unterscheiden und sagen, wofür man sie nutzt.
      en: I can tell different media apart and say what people use them for.
    standards: [nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.2]

  - id: world.society.pocket-money
    topic: { de: Wünschen und Kaufen, en: Wanting and buying }
    can_do:
      de: Ich kann mein Taschengeld einteilen und entscheiden, wofür ich es ausgebe oder spare.
      en: I can plan my pocket money and decide what to spend it on or save it for.
    prerequisites:
      hard: [world.society.needs-wants, math.money.coins-notes]
      soft: [math.money.amounts-to-20]
    standards: [nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.5]

  - id: world.society.advertising
    topic: { de: Wünschen und Kaufen, en: Wanting and buying }
    can_do:
      de: Ich kann Werbung erkennen und erklären, wie sie Wünsche weckt.
      en: I can recognise adverts and explain how they make people want things.
    prerequisites:
      hard: [world.society.needs-wants]
      soft: [world.society.media-types, world.society.pocket-money]
    standards:
      - nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.3
      - nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.4

  - id: world.society.children-rights
    topic: { de: Rechte und Vielfalt, en: Rights and diversity }
    can_do:
      de: Ich kann Kinderrechte nennen und an Beispielen erklären, was sie für mich bedeuten.
      en: I can name children's rights and explain with examples what they mean for me.
    prerequisites: { soft: [world.society.needs-wants, world.society.class-council] }
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.6]

  - id: world.society.living-diversity
    topic: { de: Rechte und Vielfalt, en: Rights and diversity }
    can_do:
      de: Ich kann verschiedene Lebensweisen vergleichen und Vorurteile und feste Rollenbilder erkennen.
      en: I can compare different ways of life and spot prejudices and stereotypes, including about boys and girls.
    prerequisites: { soft: [world.society.families] }
    standards:
      - nrw-sachunterricht-2021.dg.leben-in-vielfalt.2
      - nrw-sachunterricht-2021.dg.leben-in-vielfalt.3
      - nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.2

  - id: world.society.migration-home
    topic: { de: Rechte und Vielfalt, en: Rights and diversity }
    can_do:
      de: Ich kann erklären, warum Menschen in ein anderes Land oder eine andere Stadt ziehen und was Heimat für jemanden bedeuten kann.
      en: I can explain why people move to another country or town and what home can mean to someone.
    prerequisites: { soft: [world.society.families, world.society.living-diversity] }
    standards:
      - nrw-sachunterricht-2021.dg.leben-in-vielfalt.1
      - nrw-sachunterricht-2021.rm.raeume-nutzen-und-schuetzen.2

  - id: world.society.democracy-vote
    topic: { de: Mitbestimmen, en: Having a say }
    can_do:
      de: Ich kann erklären, wie in einer Demokratie entschieden wird, mit Wahlen und Mehrheit.
      en: I can explain how decisions are made in a democracy, by elections and by majority.
    prerequisites:
      hard: [world.society.class-council]
      soft: [world.society.children-rights]
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.5]

  - id: world.society.municipality
    topic: { de: Mitbestimmen, en: Having a say }
    can_do:
      de: Ich kann sagen, was die Gemeinde für uns tut, zum Beispiel mit Rathaus, Polizei, Feuerwehr und Bussen.
      en: I can say what the local council and public services do for us, such as the town hall, police, fire brigade and buses.
    prerequisites: { soft: [world.society.democracy-vote] }
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.4]

  - id: world.society.germany-eu
    topic: { de: Mitbestimmen, en: Having a say }
    can_do:
      de: Ich kann Deutschland als ein Land mit 16 Bundesländern beschreiben, das zur Europäischen Union gehört.
      en: I can describe Germany as a country of 16 federal states that belongs to the European Union.
    prerequisites: { soft: [world.society.democracy-vote] }
    standards: [nrw-sachunterricht-2021.rm.orientierung-in-raeumen.6]

  - id: world.society.media-reality
    topic: { de: Sicher mit Medien, en: Safe with media }
    can_do:
      de: Ich kann prüfen, ob etwas in den Medien wirklich stimmt oder erfunden oder verändert ist.
      en: I can check whether something in the media is true or made up or changed.
    prerequisites:
      hard: [world.society.media-types]
      soft: [world.society.advertising, lit-de.texts-media.research]
    standards: [nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.6]

  - id: world.society.cyberbullying
    topic: { de: Sicher mit Medien, en: Safe with media }
    can_do:
      de: Ich kann Mobbing und Cybermobbing erkennen und weiß, wer mir und anderen hilft.
      en: I can recognise bullying and cyberbullying and I know who can help me and others.
    prerequisites: { soft: [world.society.friendship-conflict, world.society.media-types] }
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.7]

  - id: world.society.internet-safety
    topic: { de: Sicher mit Medien, en: Safe with media }
    can_do:
      de: Ich kann mich im Internet sicher verhalten und meine persönlichen Daten schützen.
      en: I can stay safe on the internet and protect my personal data.
    prerequisites:
      hard: [world.society.media-types]
      soft: [world.society.cyberbullying]
    standards:
      - nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.7
      - nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.9

  - id: world.society.code-encoding
    topic: { de: Sicher mit Medien, en: Safe with media }
    can_do:
      de: Ich kann erklären, was der Unterschied zwischen Codieren und Verschlüsseln ist.
      en: I can explain the difference between encoding and encrypting.
    prerequisites: { soft: [world.society.internet-safety] }
    standards: [nrw-sachunterricht-2021.dg.zusammenleben-in-der-klasse-in-der-schule-und-in-der-gesellschaft.9]
