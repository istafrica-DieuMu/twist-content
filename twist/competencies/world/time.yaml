progression: world.time
title: { de: Zeit und Wandel, en: Time and change }
order: free
skills:
  - id: world.time.day-week
    topic: { de: Mein Jahr, en: My year }
    can_do:
      de: Ich kann meinen Tag und meine Woche in einem Plan ordnen und Schultage und Wochenende unterscheiden.
      en: I can put my day and my week in order on a plan and tell school days from the weekend.
    prerequisites: { hard: [math.time.sequence-of-day] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.1]

  - id: world.time.months-seasons
    topic: { de: Mein Jahr, en: My year }
    can_do:
      de: Ich kann die Monate im Jahreskreis zeigen und den Jahreszeiten zuordnen.
      en: I can show the months on a year wheel and match them to the seasons.
    prerequisites: { hard: [math.time.sequence-of-day], soft: [world.time.day-week, math.time.calendar, world.nature.seasons] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.1]

  - id: world.time.festivals
    topic: { de: Mein Jahr, en: My year }
    can_do:
      de: Ich kann Feste aus verschiedenen Kulturen den Monaten im Jahr zuordnen.
      en: I can place festivals from different cultures in the months of the year.
    prerequisites: { hard: [world.time.months-seasons] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.1, nrw-sachunterricht-2021.dg.leben-in-vielfalt.1]

  - id: world.time.my-life-story
    topic: { de: Früher und heute, en: Then and now }
    can_do:
      de: Ich kann wichtige Ereignisse aus meinem Leben auf einer Zeitleiste zeigen.
      en: I can show important events from my life on a timeline.
    prerequisites: { soft: [world.time.months-seasons, math.time.calendar] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.5]

  - id: world.time.then-now
    topic: { de: Früher und heute, en: Then and now }
    can_do:
      de: Ich kann das Leben früher, zur Zeit meiner Großeltern, mit dem Leben heute vergleichen, zum Beispiel bei Spielzeug, Werkzeugen und Verkehrsmitteln, und sagen, ob ein Buch zeigt, wie es wirklich war, oder eine erfundene Geschichte erzählt.
      en: I can compare life long ago, when my grandparents were young, with life today, for example toys, tools and ways of travelling, and say whether a book shows how it really was or tells a made-up story.
    prerequisites: { soft: [world.time.my-life-story] }
    standards: [nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.3, nrw-sachunterricht-2021.zw.fakten-und-fiktion.2]

  - id: world.time.timeline
    topic: { de: Geschichte entdecken, en: Exploring history }
    can_do:
      de: Ich kann Ereignisse auf einer Zeitleiste ordnen und mit Jahrzehnt und Jahrhundert beschreiben, wie lange etwas her ist.
      en: I can order events on a timeline and use decade and century to say how long ago something happened.
    prerequisites: { hard: [world.time.my-life-story] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.2, nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.4]

  - id: world.time.sources
    topic: { de: Geschichte entdecken, en: Exploring history }
    can_do:
      de: Ich kann verschiedene Quellen unterscheiden (Foto, Brief, Gegenstand, Erzählung eines Zeitzeugen) und sagen, was sie uns über früher verraten.
      en: I can tell different sources apart (photo, letter, object, an eyewitness's story) and say what they tell us about the past.
    prerequisites: { soft: [world.time.then-now] }
    standards: [nrw-sachunterricht-2021.zw.fakten-und-fiktion.1, nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.2]

  - id: world.time.stone-age
    topic: { de: Geschichte entdecken, en: Exploring history }
    can_do:
      de: Ich kann beschreiben, wie Menschen in der Steinzeit lebten, und es mit heute vergleichen.
      en: I can describe how people lived in the Stone Age and compare it with today.
    prerequisites: { soft: [world.time.timeline] }
    standards: [nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.1, nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.4, nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.6]

  - id: world.time.middle-ages
    topic: { de: Leben in anderen Zeiten, en: Life in other times }
    can_do:
      de: Ich kann beschreiben, wie Ritter, Bauern und Handwerker im Mittelalter lebten und wer damals herrschte.
      en: I can describe how knights, farmers and craftspeople lived in the Middle Ages and who ruled at the time.
    prerequisites: { soft: [world.time.timeline, world.time.stone-age] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.3, nrw-sachunterricht-2021.zw.frueher-heute-und-morgen.1]

  - id: world.time.divided-germany
    topic: { de: Leben in anderen Zeiten, en: Life in other times }
    can_do:
      de: Ich kann erklären, warum Deutschland geteilt war und wie es 1990 wieder vereint wurde.
      en: I can explain why Germany was divided and how it was reunited in 1990.
    prerequisites: { soft: [world.time.timeline, world.time.sources, world.society.democracy-vote] }
    standards: [nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.2, nrw-sachunterricht-2021.zw.orientierung-in-der-zeit.3]
    note: Only Berlin/Brandenburg names it, as Berlin history; NRW asks for historical events in context, which this serves.

  - id: world.time.fact-fiction
    topic: { de: Leben in anderen Zeiten, en: Life in other times }
    can_do:
      de: Ich kann unterscheiden, ob eine Geschichte über früher erfunden ist (Sage, Film, Spiel) oder auf Quellen beruht.
      en: I can tell whether a story about the past is made up (legend, film, game) or based on sources.
    prerequisites: { soft: [world.time.sources, world.society.media-reality] }
    standards: [nrw-sachunterricht-2021.zw.fakten-und-fiktion.1, nrw-sachunterricht-2021.zw.fakten-und-fiktion.3]
