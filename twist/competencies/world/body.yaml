progression: world.body
title: { de: Körper und Gesundheit, en: Body and health }
order: free
skills:
  - id: world.body.body-parts
    topic: { de: Mein Körper, en: My body }
    can_do:
      de: Ich kann die Teile meines Körpers benennen und sagen, wofür sie da sind.
      en: I can name the parts of my body and say what they are for.
    standards: [nrw-sachunterricht-2021.kg.koerper-und-entwicklung.3]

  - id: world.body.senses
    topic: { de: Mein Körper, en: My body }
    can_do:
      de: Ich kann die fünf Sinne nennen und sagen, mit welchem Körperteil ich sehe, höre, rieche, schmecke und fühle.
      en: I can name the five senses and say which part of my body I use to see, hear, smell, taste and touch.
    prerequisites: { soft: [world.body.body-parts] }
    standards: [nrw-sachunterricht-2021.kg.koerper-und-entwicklung.7]

  - id: world.body.hygiene
    topic: { de: Sauber und gesund, en: Clean and healthy }
    can_do:
      de: Ich kann erklären, warum ich mir die Hände wasche, mich pflege und die Zähne putze.
      en: I can explain why I wash my hands, keep clean and brush my teeth.
    standards: [nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.1]

  - id: world.body.teeth
    topic: { de: Sauber und gesund, en: Clean and healthy }
    can_do:
      de: Ich kann erklären, wie Milchzähne ausfallen und neue Zähne wachsen, und wie ich meine Zähne richtig pflege.
      en: I can explain how baby teeth fall out and new teeth grow, and how to look after my teeth.
    prerequisites: { soft: [world.body.hygiene] }
    standards: [nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.1]

  - id: world.body.healthy-eating
    topic: { de: Gesund leben, en: Healthy living }
    can_do:
      de: Ich kann mit der Ernährungspyramide erklären, was zu gesundem Essen und Trinken gehört.
      en: I can use a food pyramid to explain what healthy eating and drinking looks like.
    standards:
      - nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.1
      - nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.3

  - id: world.body.exercise-rest
    topic: { de: Gesund leben, en: Healthy living }
    can_do:
      de: Ich kann erklären, warum Bewegung, Pausen und genug Schlaf meinem Körper guttun.
      en: I can explain why exercise, breaks and enough sleep are good for my body.
    prerequisites: { soft: [world.body.healthy-eating] }
    standards:
      - nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.1
      - nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.3

  - id: world.body.my-boundaries
    topic: { de: Mein Körper gehört mir, en: My body belongs to me }
    can_do:
      de: Ich kann Nein sagen, wenn mir etwas unangenehm ist, die Grenzen anderer achten und weiß, wem ich mich anvertrauen kann.
      en: I can say no when something feels wrong, respect other people's boundaries and I know who I can tell.
    prerequisites: { soft: [world.body.body-parts, world.society.feelings-needs] }
    standards:
      - nrw-sachunterricht-2021.kg.koerper-und-entwicklung.1
      - nrw-sachunterricht-2021.kg.koerper-und-entwicklung.8

  - id: world.body.skeleton-muscles
    topic: { de: Im Inneren des Körpers, en: Inside the body }
    can_do:
      de: Ich kann beschreiben, wie Knochen, Gelenke und Muskeln zusammen meinen Körper halten und bewegen.
      en: I can describe how bones, joints and muscles work together to hold up and move my body.
    prerequisites:
      hard: [world.body.body-parts]
      soft: [world.body.exercise-rest]
    standards: [nrw-sachunterricht-2021.kg.koerper-und-entwicklung.2]

  - id: world.body.digestion
    topic: { de: Im Inneren des Körpers, en: Inside the body }
    can_do:
      de: Ich kann den Weg der Nahrung durch meinen Körper beschreiben, vom Mund bis zum Darm.
      en: I can describe the path food takes through my body, from the mouth to the gut.
    prerequisites:
      hard: [world.body.body-parts]
      soft: [world.body.healthy-eating]
    standards: [nrw-sachunterricht-2021.kg.koerper-und-entwicklung.2]

  - id: world.body.heart-lungs
    topic: { de: Im Inneren des Körpers, en: Inside the body }
    can_do:
      de: Ich kann erklären, wie das Herz das Blut durch den Körper pumpt und wie ich mit der Lunge atme.
      en: I can explain how the heart pumps blood around the body and how I breathe with my lungs.
    prerequisites:
      hard: [world.body.body-parts]
      soft: [world.body.exercise-rest]
    standards:
      - nrw-sachunterricht-2021.kg.koerper-und-entwicklung.2
      - nrw-sachunterricht-2021.nu.stoffe-ihre-umwandlung-und-stoffkreislaeufe.3

  - id: world.body.first-aid
    topic: { de: Helfen im Notfall, en: Helping in an emergency }
    can_do:
      de: Ich kann bei kleinen Verletzungen erste Hilfe leisten und im Notfall die 112 anrufen und sagen, was passiert ist.
      en: I can give first aid for small injuries and, in an emergency, call the emergency number and say what has happened.
    prerequisites: { soft: [world.body.heart-lungs, world.body.skeleton-muscles] }
    enrichment: true
    reason: No NRW standard asks for first aid or the emergency call; kept because schools commonly teach it in Klasse 3 and 4 and it keeps children safe.

  - id: world.body.addiction-prevention
    topic: { de: Gesund bleiben, en: Staying healthy }
    can_do:
      de: Ich kann erklären, warum Rauchen, Alkohol und zu viel Zeit am Bildschirm meiner Gesundheit schaden.
      en: I can explain why smoking, alcohol and too much screen time harm my health.
    prerequisites: { soft: [world.body.heart-lungs, world.body.exercise-rest, world.society.media-types] }
    standards:
      - nrw-sachunterricht-2021.kg.koerper-und-gesunde-lebensfuehrung.4
      - nrw-sachunterricht-2021.dg.leben-in-der-medien-und-konsumgesellschaft.2
