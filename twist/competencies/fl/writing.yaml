progression: fl.writing
title: { de: Schreiben, en: Writing }
skills:
  - id: fl.writing.copy-words
    topic: { de: Schreiben, en: Writing }
    can_do:
      de: Ich kann bekannte Wörter richtig abschreiben und Bilder beschriften.
      en: I can copy familiar words correctly and label pictures.
    prerequisites: { hard: [fl.reading.word-picture] }
    standards: [kmk-fremdsprachen-gs-2013.schreiben, nc-languages-2014.ks2.foreign-language.2]

  - id: fl.writing.words-from-memory
    topic: { de: Schreiben, en: Writing }
    can_do:
      de: Ich kann geübte Wörter aus dem Gedächtnis schreiben und dabei eine Wörterliste zum Nachschauen nutzen.
      en: I can write practised words from memory and check them in a word list.
    prerequisites: { hard: [fl.writing.copy-words, fl.reading.sound-spelling] }
    standards: [kmk-fremdsprachen-gs-2013.schreiben, kmk-fremdsprachen-gs-2013.sprachlernkompetenz, nc-languages-2014.ks2.foreign-language.10]

  - id: fl.writing.complete-sentences
    topic: { de: Schreiben, en: Writing }
    can_do:
      de: Ich kann Sätze nach einem Muster ergänzen und eigene kurze Sätze danach schreiben (I like ... I have got ...).
      en: I can complete sentences from a model and write my own short sentences to the same pattern.
    prerequisites: { hard: [fl.writing.words-from-memory, fl.grammar.chunks] }
    standards: [kmk-fremdsprachen-gs-2013.schreiben, nc-languages-2014.ks2.foreign-language.10]

  - id: fl.writing.short-text
    topic: { de: Schreiben, en: Writing }
    can_do:
      de: Ich kann mit Hilfe eines Mustertextes einen kurzen Text über mich schreiben, zum Beispiel einen Steckbrief, eine Postkarte oder eine Einladung.
      en: I can write a short text about myself from a model, such as a profile, a postcard or an invitation.
    prerequisites: { hard: [fl.writing.complete-sentences, fl.reading.short-texts] }
    standards: [kmk-fremdsprachen-gs-2013.schreiben, nc-languages-2014.ks2.foreign-language.11]
