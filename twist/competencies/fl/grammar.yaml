progression: fl.grammar
title: { de: Sprachliche Mittel, en: Language patterns }
# Primary foreign-language teaching uses grammar as fixed chunks, not as rules.
# Each step means the child can use the pattern, not explain it.
skills:
  - id: fl.grammar.chunks
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich kann feste Satzmuster verwenden, um über mich zu sprechen (I am ..., I have got ..., I like ..., I can ...).
      en: I can use set sentence patterns to talk about myself (I am ..., I have got ..., I like ..., I can ...).
    prerequisites: { hard: [fl.speaking.greet] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, nc-languages-2014.ks2.foreign-language.4]

  - id: fl.grammar.plurals-articles
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich kann Wörter in der Mehrzahl verwenden und den passenden Begleiter wählen (a cat, two cats, the cats).
      en: I can use plural forms and the right article (a cat, two cats, the cats).
    prerequisites: { hard: [fl.grammar.chunks, fl.themes.numbers-to-10] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, nc-languages-2014.ks2.foreign-language.12]

  - id: fl.grammar.questions
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich kann Fragen mit Fragewörtern und Ja-Nein-Fragen bilden und verstehen (What? Where? How many? Do you ...? Can you ...?).
      en: I can form and understand questions with question words and yes/no questions.
    prerequisites: { hard: [fl.grammar.chunks] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.grammar.prepositions
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich kann sagen, wo etwas ist (in, on, under, next to, behind).
      en: I can say where something is (in, on, under, next to, behind).
    prerequisites: { hard: [fl.grammar.questions, fl.themes.home] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.grammar.he-she-it
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich kann über andere Personen sprechen und das Verb dabei anpassen (She likes ..., He has got ...).
      en: I can talk about other people and change the verb to match (She likes ..., He has got ...).
    prerequisites: { hard: [fl.grammar.chunks, fl.themes.family] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.sprachbewusstheit, nc-languages-2014.ks2.foreign-language.12]

  - id: fl.grammar.now-and-routine
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich kann sagen, was jemand gerade tut, und was jemand jeden Tag tut (She is reading. I play football on Mondays.).
      en: I can say what someone is doing now and what someone does every day.
    prerequisites: { hard: [fl.grammar.he-she-it, fl.themes.hobbies] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.grammar.gender-verbs
    topic: { de: Sprachmuster, en: Language patterns }
    can_do:
      de: Ich weiß, dass Nomen in der Fremdsprache ein Geschlecht haben können, wähle den passenden Begleiter und beuge häufige Verben (je suis, tu es, il est).
      en: I know that nouns in the new language can have a gender, choose the matching article and conjugate high-frequency verbs (je suis, tu es, il est).
    prerequisites: { hard: [fl.grammar.plurals-articles, fl.grammar.he-she-it] }
    standards: [nc-languages-2014.ks2.foreign-language.12]
