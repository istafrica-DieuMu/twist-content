progression: fl.themes
title: { de: Themen und Wortschatz, en: Topics and vocabulary }
order: free
# Each theme step means: I understand and say the core words of the theme and
# use them in the language patterns I know. Lessons per target language
# (fl.en.*, fl.fr.*) supply the words.
skills:
  - id: fl.themes.hello
    topic: { de: Hallo, en: Hello }
    can_do:
      de: Ich kann mich begrüßen, vorstellen und verabschieden und kenne Höflichkeitswörter (please, thank you, sorry).
      en: I can greet, introduce myself and say goodbye, and know polite words (please, thank you, sorry).
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.sprechen]

  - id: fl.themes.colours
    topic: { de: Farben, en: Colours }
    can_do:
      de: Ich kenne die Farben und kann sagen, welche Farbe etwas hat und welche Farbe ich mag.
      en: I know the colours and can say what colour something is and which colour I like.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.numbers-to-10
    topic: { de: Zahlen, en: Numbers }
    can_do:
      de: Ich kann bis 10 zählen und Anzahlen bis 10 nennen.
      en: I can count to 10 and say amounts up to 10.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.body
    topic: { de: Körper, en: Body }
    can_do:
      de: Ich kann Körperteile benennen und auf Anweisungen mit Bewegungen reagieren (Touch your nose!).
      en: I can name parts of the body and respond to instructions with movement.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.hoeren]

  - id: fl.themes.family
    topic: { de: Familie, en: Family }
    can_do:
      de: Ich kann Familienmitglieder benennen und meine Familie kurz vorstellen.
      en: I can name family members and introduce my family briefly.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.school
    topic: { de: Schule, en: School }
    can_do:
      de: Ich kann Schulsachen benennen und Sätze aus dem Unterricht verstehen und sagen (Can I have a pencil, please?).
      en: I can name school things and understand and use classroom phrases.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.outside-animals
    topic: { de: Tiere und Natur, en: Animals and nature }
    can_do:
      de: Ich kann Tiere und Dinge in der Natur benennen und sagen, was ein Tier kann.
      en: I can name animals and things in nature and say what an animal can do.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.numbers-to-20
    topic: { de: Zahlen, en: Numbers }
    can_do:
      de: Ich kann bis 20 zählen, Zahlen bis 20 verstehen und nach Alter und Telefonnummer fragen.
      en: I can count to 20, understand numbers to 20 and ask about age and phone numbers.
    prerequisites: { hard: [fl.themes.numbers-to-10] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.clothes
    topic: { de: Kleidung, en: Clothes }
    can_do:
      de: Ich kann Kleidungsstücke benennen und sagen, was jemand trägt.
      en: I can name clothes and say what someone is wearing.
    prerequisites: { hard: [fl.themes.colours] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.home
    topic: { de: Zu Hause, en: At home }
    can_do:
      de: Ich kann Zimmer und Möbel benennen und sagen, wo etwas im Haus ist.
      en: I can name rooms and furniture and say where things are in the house.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.town
    topic: { de: In der Stadt, en: In town }
    can_do:
      de: Ich kann Orte in der Stadt benennen und einfache Wegbeschreibungen verstehen.
      en: I can name places in town and understand simple directions.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.hoeren]

  - id: fl.themes.feelings
    topic: { de: Gefühle, en: Feelings }
    can_do:
      de: Ich kann sagen, wie ich mich fühle, und fragen, wie es anderen geht (I am happy. Are you tired?).
      en: I can say how I feel and ask how others feel.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.sprechen]

  - id: fl.themes.food
    topic: { de: Essen und Trinken, en: Food and drink }
    can_do:
      de: Ich kann Essen und Getränke benennen, sagen, was ich gern esse, und höflich etwas bestellen.
      en: I can name food and drink, say what I like to eat and order politely.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.calendar
    topic: { de: Kalender, en: Calendar }
    can_do:
      de: Ich kann Wochentage, Monate und Jahreszeiten nennen und sagen, wann ich Geburtstag habe.
      en: I can say the days of the week, months and seasons and when my birthday is.
    prerequisites: { hard: [fl.themes.numbers-to-20] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.weather
    topic: { de: Wetter, en: Weather }
    can_do:
      de: Ich kann das Wetter beschreiben und einen einfachen Wetterbericht verstehen.
      en: I can describe the weather and understand a simple weather report.
    prerequisites: { hard: [fl.themes.calendar] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.hoeren]

  - id: fl.themes.numbers-to-100
    topic: { de: Zahlen, en: Numbers }
    can_do:
      de: Ich kann Zahlen bis 100 verstehen und sagen und Preise nennen.
      en: I can understand and say numbers to 100 and give prices.
    prerequisites: { hard: [fl.themes.numbers-to-20] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.time
    topic: { de: Uhrzeit, en: Time }
    can_do:
      de: Ich kann nach der Uhrzeit fragen und volle und halbe Stunden angeben.
      en: I can ask the time and give o'clock and half past.
    prerequisites: { hard: [fl.themes.numbers-to-20] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.hobbies
    topic: { de: Hobbys und Sport, en: Hobbies and sport }
    can_do:
      de: Ich kann Hobbys und Sportarten benennen und sagen, was ich kann und gern mache.
      en: I can name hobbies and sports and say what I can do and like doing.
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.jobs
    topic: { de: Berufe, en: Jobs }
    can_do:
      de: Ich kann Berufe benennen und sagen, was jemand bei der Arbeit macht.
      en: I can name jobs and say what someone does at work.
    prerequisites: { hard: [fl.grammar.he-she-it] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.themes.special-days
    topic: { de: Feste, en: Special days }
    can_do:
      de: Ich kenne Wörter und Bräuche zu Festen wie Geburtstag, Halloween, Weihnachten und Ostern.
      en: I know words and customs for celebrations such as birthdays, Halloween, Christmas and Easter.
    prerequisites: { hard: [fl.themes.calendar] }
    standards: [kmk-fremdsprachen-gs-2013.sprachliche-mittel, kmk-fremdsprachen-gs-2013.interkulturell]
