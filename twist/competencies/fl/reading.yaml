progression: fl.reading
title: { de: Lesen, en: Reading }
skills:
  - id: fl.reading.word-picture
    topic: { de: Lesen, en: Reading }
    can_do:
      de: Ich erkenne bekannte Wörter im Schriftbild wieder und ordne sie Bildern zu.
      en: I recognise familiar words in writing and match them to pictures.
    prerequisites: { hard: [fl.speaking.name-things] }
    standards: [kmk-fremdsprachen-gs-2013.lesen, nc-languages-2014.ks2.foreign-language.7]

  - id: fl.reading.sound-spelling
    topic: { de: Lesen, en: Reading }
    can_do:
      de: Ich weiß, dass man in der Fremdsprache anders schreibt, als man spricht, und erkenne häufige Schreibungen wieder (th, ee, oo).
      en: I know that the new language is not written the way it sounds and recognise common spellings.
    prerequisites: { hard: [fl.reading.word-picture] }
    standards: [kmk-fremdsprachen-gs-2013.lesen, kmk-fremdsprachen-gs-2013.sprachbewusstheit, nc-languages-2014.ks2.foreign-language.2]

  - id: fl.reading.sentences
    topic: { de: Lesen, en: Reading }
    can_do:
      de: Ich kann kurze Sätze mit bekannten Wörtern lesen und verstehen und dem passenden Bild zuordnen.
      en: I can read and understand short sentences with familiar words and match them to pictures.
    prerequisites: { hard: [fl.reading.word-picture] }
    standards: [kmk-fremdsprachen-gs-2013.lesen, nc-languages-2014.ks2.foreign-language.7]

  - id: fl.reading.short-texts
    topic: { de: Lesen, en: Reading }
    can_do:
      de: Ich kann kurze Texte mit Bildern lesen (Bilderbuchseite, Comic, Steckbrief) und das Wesentliche verstehen.
      en: I can read short illustrated texts (a picture-book page, a comic, a profile) and understand the main points.
    prerequisites: { hard: [fl.reading.sentences, fl.reading.sound-spelling] }
    standards: [kmk-fremdsprachen-gs-2013.lesen, nc-languages-2014.ks2.foreign-language.7]

  - id: fl.reading.find-information
    topic: { de: Lesen, en: Reading }
    can_do:
      de: Ich kann einfachen Alltagstexten Informationen entnehmen, zum Beispiel einer Speisekarte, einem Stundenplan oder einer Einladung.
      en: I can find information in simple everyday texts such as a menu, a timetable or an invitation.
    prerequisites: { hard: [fl.reading.short-texts] }
    standards: [kmk-fremdsprachen-gs-2013.lesen, nc-languages-2014.ks2.foreign-language.7]

  - id: fl.reading.read-aloud
    topic: { de: Lesen, en: Reading }
    can_do:
      de: Ich kann einen kurzen bekannten Text so vorlesen, dass andere mich verstehen, mit richtiger Aussprache und Satzmelodie.
      en: I can read a short familiar text aloud so that others understand, with accurate pronunciation and intonation.
    prerequisites: { hard: [fl.reading.short-texts, fl.speaking.imitate] }
    standards: [nc-languages-2014.ks2.foreign-language.5]
