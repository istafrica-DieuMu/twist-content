progression: fl.culture-strategies
title: { de: Kultur, Sprachvergleich und Lernstrategien, en: Culture, language awareness and learning strategies }
order: free
skills:
  - id: fl.culture-strategies.where-spoken
    topic: { de: Die Welt der Sprache, en: Where the language is spoken }
    can_do:
      de: Ich weiß, in welchen Ländern die Fremdsprache gesprochen wird, und kenne einige Orte, Menschen und Dinge von dort.
      en: I know in which countries the language is spoken and know some places, people and things from there.
    standards: [kmk-fremdsprachen-gs-2013.interkulturell]

  - id: fl.culture-strategies.compare-daily-life
    topic: { de: Die Welt der Sprache, en: Where the language is spoken }
    can_do:
      de: Ich kann den Alltag von Kindern in anderen Ländern mit meinem vergleichen (Schule, Essen, Feste) und Gemeinsamkeiten und Unterschiede nennen.
      en: I can compare children's daily lives in other countries with mine (school, food, celebrations) and name what is the same and what differs.
    prerequisites: { hard: [fl.culture-strategies.where-spoken] }
    standards: [kmk-fremdsprachen-gs-2013.interkulturell]

  - id: fl.culture-strategies.compare-languages
    topic: { de: Sprachen vergleichen, en: Comparing languages }
    can_do:
      de: Ich kann Wörter in der Fremdsprache und im Deutschen vergleichen und ähnliche Wörter entdecken (house, Haus).
      en: I can compare words in the new language and in my own and spot similar words.
    standards: [kmk-fremdsprachen-gs-2013.sprachbewusstheit, nc-languages-2014.ks2.foreign-language.2, nc-languages-2014.ks2.foreign-language.12]

  - id: fl.culture-strategies.mediate
    topic: { de: Sprachmittlung, en: Mediation }
    can_do:
      de: Ich kann jemandem auf Deutsch sagen, was auf einem einfachen Schild oder in einem kurzen Satz in der Fremdsprache steht.
      en: I can tell someone in my own language what a simple sign or short sentence in the new language says.
    prerequisites: { hard: [fl.reading.sentences] }
    standards: [kmk-fremdsprachen-gs-2013.sprachmittlung, nc-languages-2014.ks2.foreign-language.7]

  - id: fl.culture-strategies.guess-meaning
    topic: { de: Lernstrategien, en: Learning strategies }
    can_do:
      de: Ich kann die Bedeutung unbekannter Wörter mit Hilfe von Bildern, Gesten und dem Zusammenhang erraten.
      en: I can guess the meaning of unknown words from pictures, gestures and context.
    prerequisites: { hard: [fl.listening.short-dialogues] }
    standards: [kmk-fremdsprachen-gs-2013.sprachlernkompetenz, nc-languages-2014.ks2.foreign-language.9]

  - id: fl.culture-strategies.learn-words
    topic: { de: Lernstrategien, en: Learning strategies }
    can_do:
      de: Ich kenne Wege, mir neue Wörter zu merken (mit Bildern, Bewegungen, Wörterkarten), und nutze ein Bildwörterbuch.
      en: I know ways to remember new words (pictures, movement, word cards) and use a picture dictionary.
    prerequisites: { hard: [fl.reading.word-picture] }
    standards: [kmk-fremdsprachen-gs-2013.sprachlernkompetenz, nc-languages-2014.ks2.foreign-language.9]

  - id: fl.culture-strategies.self-check
    topic: { de: Lernstrategien, en: Learning strategies }
    can_do:
      de: Ich kann einschätzen, was ich in der Fremdsprache schon kann, und mir ein nächstes Ziel setzen.
      en: I can judge what I can already do in the new language and set myself a next goal.
    prerequisites: { hard: [fl.culture-strategies.learn-words] }
    standards: [kmk-fremdsprachen-gs-2013.sprachlernkompetenz]

  - id: fl.culture-strategies.dictionary
    topic: { de: Lernstrategien, en: Learning strategies }
    can_do:
      de: Ich kann ein zweisprachiges Wörterbuch nutzen, um die Bedeutung eines neuen Wortes zu finden.
      en: I can use a bilingual dictionary to find the meaning of a new word.
    prerequisites: { hard: [fl.culture-strategies.learn-words, fl.reading.sentences] }
    standards: [nc-languages-2014.ks2.foreign-language.9]
