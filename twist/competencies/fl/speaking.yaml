progression: fl.speaking
title: { de: Sprechen, en: Speaking }
skills:
  - id: fl.speaking.imitate
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann Wörter und kurze Sätze in der Fremdsprache deutlich nachsprechen und achte dabei auf Aussprache und Betonung.
      en: I can repeat words and short sentences clearly in the new language, paying attention to sounds and stress.
    prerequisites: { hard: [fl.listening.familiar-words] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, kmk-fremdsprachen-gs-2013.sprachliche-mittel, nc-languages-2014.ks2.foreign-language.5]

  - id: fl.speaking.greet
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann jemanden begrüßen und verabschieden, meinen Namen und mein Alter sagen und fragen, wie es jemandem geht.
      en: I can say hello and goodbye, say my name and age, and ask how someone is.
    prerequisites: { hard: [fl.speaking.imitate] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen]

  - id: fl.speaking.name-things
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann Dinge aus bekannten Themen benennen, wenn ich sie sehe (Farben, Zahlen, Tiere, Schulsachen).
      en: I can name things from familiar topics when I see them (colours, numbers, animals, school things).
    prerequisites: { hard: [fl.speaking.imitate] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.speaking.likes
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann sagen, was ich mag und was ich nicht mag, und andere danach fragen.
      en: I can say what I like and do not like and ask others about it.
    prerequisites: { hard: [fl.speaking.name-things, fl.grammar.chunks] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, nc-languages-2014.ks2.foreign-language.3]

  - id: fl.speaking.ask-answer
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann einfache Fragen stellen und beantworten (Have you got a pet? Where is the cat? How many?).
      en: I can ask and answer simple questions (Have you got a pet? Where is the cat? How many?).
    prerequisites: { hard: [fl.speaking.likes, fl.grammar.questions] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, nc-languages-2014.ks2.foreign-language.3]

  - id: fl.speaking.describe
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann eine Person, ein Tier oder ein Ding mit wenigen Sätzen beschreiben (It is big. It has got a long tail.).
      en: I can describe a person, animal or thing in a few sentences.
    prerequisites: { hard: [fl.speaking.ask-answer] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, nc-languages-2014.ks2.foreign-language.4, nc-languages-2014.ks2.foreign-language.11]

  - id: fl.speaking.role-play
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann in kurzen Alltagsgesprächen mitspielen, zum Beispiel beim Einkaufen oder im Café, mit vorgegebenen Redemitteln.
      en: I can take part in short everyday role plays, such as shopping or ordering food, using given phrases.
    prerequisites: { hard: [fl.speaking.ask-answer, fl.themes.food] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, nc-languages-2014.ks2.foreign-language.3]

  - id: fl.speaking.about-me
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann in einigen zusammenhängenden Sätzen über mich erzählen (Familie, Hobbys, was ich gern mache).
      en: I can talk about myself in a few connected sentences (family, hobbies, what I like doing).
    prerequisites: { hard: [fl.speaking.describe, fl.themes.hobbies] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen]

  - id: fl.speaking.present
    topic: { de: Sprechen, en: Speaking }
    can_do:
      de: Ich kann einen kurzen, vorbereiteten Text vortragen, zum Beispiel mein Haustier oder mein Lieblingstier vorstellen.
      en: I can present a short prepared text, for example about my pet or favourite animal.
    prerequisites: { hard: [fl.speaking.about-me] }
    standards: [kmk-fremdsprachen-gs-2013.sprechen, nc-languages-2014.ks2.foreign-language.6]
