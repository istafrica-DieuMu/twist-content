progression: fl.listening
title: { de: Hören und Hörsehen, en: Listening and viewing }
skills:
  - id: fl.listening.classroom-phrases
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich verstehe einfache Aufforderungen in der Fremdsprache und reagiere mit einer Handlung (Stand up! Open your book!).
      en: I understand simple instructions in the new language and respond with an action.
    standards: [kmk-fremdsprachen-gs-2013.hoeren, nc-languages-2014.ks2.foreign-language.1]

  - id: fl.listening.familiar-words
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich erkenne bekannte Wörter, wenn ich sie höre, und zeige auf das passende Bild.
      en: I recognise familiar words when I hear them and point to the matching picture.
    prerequisites: { hard: [fl.listening.classroom-phrases] }
    standards: [kmk-fremdsprachen-gs-2013.hoeren, kmk-fremdsprachen-gs-2013.sprachliche-mittel]

  - id: fl.listening.songs-rhymes
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich verstehe Lieder, Reime und Chants mit Hilfe von Bildern und Bewegungen und singe oder spreche mit.
      en: I understand songs, rhymes and chants with the help of pictures and movement and join in.
    prerequisites: { hard: [fl.listening.familiar-words] }
    standards: [kmk-fremdsprachen-gs-2013.hoeren, kmk-fremdsprachen-gs-2013.sprechen, nc-languages-2014.ks2.foreign-language.1, nc-languages-2014.ks2.foreign-language.2, nc-languages-2014.ks2.foreign-language.8]

  - id: fl.listening.short-dialogues
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich verstehe kurze, langsam gesprochene Gespräche zu bekannten Themen und kann sagen, worum es geht.
      en: I understand short, slowly spoken conversations on familiar topics and can say what they are about.
    prerequisites: { hard: [fl.listening.familiar-words] }
    standards: [kmk-fremdsprachen-gs-2013.hoeren, nc-languages-2014.ks2.foreign-language.1]

  - id: fl.listening.stories
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich verstehe eine vorgelesene Bildergeschichte in groben Zügen und bringe die Bilder in die richtige Reihenfolge.
      en: I understand the gist of a picture story read aloud and put the pictures in order.
    prerequisites: { hard: [fl.listening.short-dialogues] }
    standards: [kmk-fremdsprachen-gs-2013.hoeren, nc-languages-2014.ks2.foreign-language.8]

  - id: fl.listening.details
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich kann aus einem kurzen Hörtext gezielt Einzelheiten heraushören (Zahlen, Farben, Uhrzeiten, Namen).
      en: I can pick out details from a short recording (numbers, colours, times, names).
    prerequisites: { hard: [fl.listening.short-dialogues, fl.themes.numbers-to-20] }
    standards: [kmk-fremdsprachen-gs-2013.hoeren]

  - id: fl.listening.video
    topic: { de: Hören, en: Listening }
    can_do:
      de: Ich verstehe kurze Videos und Animationen zu bekannten Themen mit Hilfe der Bilder.
      en: I understand short videos and cartoons on familiar topics with the help of the pictures.
    prerequisites: { hard: [fl.listening.stories] }
    standards: [kmk-fremdsprachen-gs-2013.hoeren]
