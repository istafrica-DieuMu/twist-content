progression: lit-de.adjectives
title: { de: Adjektive, en: Adjectives }
skills:
  - id: lit-de.adjectives.recognise
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann Adjektive erkennen, die sagen, wie etwas ist (groß, rot, lustig).
      en: I can recognise adjectives, which say what something is like.
    prerequisites: { hard: [lit-de.nouns.recognise] }
    standards: [kmk-deutsch-2022.sp.13]

  - id: lit-de.adjectives.describe
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann mit passenden Adjektiven Menschen, Tiere und Dinge genau beschreiben.
      en: I can use well-chosen adjectives to describe people, animals and things precisely.
    prerequisites: { hard: [lit-de.adjectives.recognise] }
    standards: [kmk-deutsch-2022.sp.10, kmk-deutsch-2022.sch.23]

  - id: lit-de.adjectives.agreement
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann Adjektive an das Nomen anpassen (der rote Ball, ein roter Ball, die roten Bälle).
      en: I can make adjectives agree with the noun.
    prerequisites: { hard: [lit-de.adjectives.describe, lit-de.nouns.articles] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.adjectives.opposites
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann zu Adjektiven das Gegenteil finden (warm, kalt; laut, leise).
      en: I can find the opposite of an adjective.
    prerequisites: { hard: [lit-de.adjectives.recognise] }
    standards: [kmk-deutsch-2022.sp.10]

  - id: lit-de.adjectives.compare
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann mit Adjektiven vergleichen (groß, größer, am größten) und weiß, wann man so ... wie und als sagt.
      en: I can compare with adjectives (big, bigger, biggest) and use "as ... as" and "than" correctly.
    prerequisites: { hard: [lit-de.adjectives.agreement] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.adjectives.suffixes
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann Adjektive mit -ig, -lich, -isch und -bar bilden (Sonne, sonnig; Freund, freundlich).
      en: I can form adjectives with -ig, -lich, -isch and -bar.
    prerequisites: { hard: [lit-de.adjectives.recognise, lit-de.spelling-strategies.word-stem] }
    standards: [kmk-deutsch-2022.sp.9]

  - id: lit-de.adjectives.compounds
    topic: { de: Adjektive, en: Adjectives }
    can_do:
      de: Ich kann zusammengesetzte Adjektive bilden und verstehen (eiskalt, himmelblau, federleicht).
      en: I can form and understand compound adjectives.
    prerequisites: { hard: [lit-de.adjectives.suffixes, lit-de.nouns.compounds] }
    standards: [kmk-deutsch-2022.sp.9, kmk-deutsch-2022.sp.16]
