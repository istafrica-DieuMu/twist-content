progression: lit-de.comprehension
title: { de: Texte verstehen, en: Reading comprehension }
steps:
  - id: lit-de.comprehension.order-story
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann die Teile einer kurzen Geschichte in die richtige Reihenfolge bringen.
      en: I can put the parts of a short story in the right order.
    prerequisites: { hard: [lit-de.decoding.first-texts] }
    objectives: [kmk-deutsch-2022.tm.14]

  - id: lit-de.comprehension.headings
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann zu einem kurzen Text die passende Überschrift finden.
      en: I can find the right heading for a short text.
    prerequisites: { hard: [lit-de.decoding.first-texts] }
    objectives: [kmk-deutsch-2022.les.7, kmk-deutsch-2022.tm.12]

  - id: lit-de.comprehension.read-precisely
    topic: { de: Genau lesen, en: Reading carefully }
    can_do:
      de: Ich kann Sätze und Texte genau lesen und merke, wenn ein Wort nicht passt oder ein Satz unsinnig ist.
      en: I can read sentences and texts carefully and notice when a word does not fit or a sentence makes no sense.
    prerequisites: { hard: [lit-de.decoding.first-texts] }
    objectives: [kmk-deutsch-2022.les.8, kmk-deutsch-2022.les.13]

  - id: lit-de.comprehension.find-information
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann in einem Text gezielt Informationen finden, die direkt im Text stehen.
      en: I can find information that is stated directly in a text.
    prerequisites: { hard: [lit-de.comprehension.read-precisely] }
    objectives: [kmk-deutsch-2022.les.8]

  - id: lit-de.comprehension.key-words
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann Schlüsselwörter in einem Text finden und markieren.
      en: I can find and highlight the key words in a text.
    prerequisites: { hard: [lit-de.comprehension.find-information] }
    objectives: [kmk-deutsch-2022.les.13]

  - id: lit-de.comprehension.skim
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann einen Text überfliegen und mit Überschriften, Bildern und Absätzen schnell erfassen, worum es geht.
      en: I can skim a text and use headings, pictures and paragraphs to see quickly what it is about.
    prerequisites: { hard: [lit-de.comprehension.headings, lit-de.comprehension.find-information] }
    objectives: [kmk-deutsch-2022.les.7, kmk-deutsch-2022.les.12]

  - id: lit-de.comprehension.infer-words
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann die Bedeutung unbekannter Wörter aus dem Text erschließen oder sie nachschlagen.
      en: I can work out unknown words from the text around them or look them up.
    prerequisites: { hard: [lit-de.comprehension.find-information] }
    objectives: [kmk-deutsch-2022.les.13, kmk-deutsch-2022.les.11]

  - id: lit-de.comprehension.infer
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann Informationen aus verschiedenen Textstellen verknüpfen und Schlüsse ziehen, die nicht direkt im Text stehen.
      en: I can link information from different parts of a text and draw conclusions that are not stated directly.
    prerequisites: { hard: [lit-de.comprehension.key-words] }
    objectives: [kmk-deutsch-2022.les.11, kmk-deutsch-2022.tm.12]

  - id: lit-de.comprehension.notes
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann zu einem Sachtext Stichwörter notieren und den Inhalt damit wiedergeben.
      en: I can note key points from an information text and use them to retell its content.
    prerequisites: { hard: [lit-de.comprehension.key-words] }
    objectives: [kmk-deutsch-2022.les.13, kmk-deutsch-2022.les.14, kmk-deutsch-2022.tm.12]

  - id: lit-de.comprehension.strategies
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann vor dem Lesen Fragen an einen Text stellen, beim Lesen prüfen, ob ich alles verstehe, und danach das Wichtigste zusammenfassen.
      en: I can ask questions of a text before reading, check my understanding while reading and sum up the main points afterwards.
    prerequisites: { hard: [lit-de.comprehension.skim, lit-de.comprehension.notes] }
    objectives: [kmk-deutsch-2022.les.12, kmk-deutsch-2022.les.13, kmk-deutsch-2022.les.14]

  - id: lit-de.comprehension.paragraphs
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann Absätze als Orientierung nutzen und jedem Absatz eine Teilüberschrift geben.
      en: I can use paragraphs to find my way and give each paragraph a sub-heading.
    prerequisites: { hard: [lit-de.comprehension.skim] }
    objectives: [kmk-deutsch-2022.les.7]

  - id: lit-de.comprehension.logic-puzzles
    topic: { de: Texte verstehen, en: Understanding texts }
    can_do:
      de: Ich kann Logicals und Texte mit Zahlen und Angaben genau lesen und lösen.
      en: I can read and solve logic puzzles and texts full of numbers and details.
    prerequisites: { hard: [lit-de.comprehension.infer] }
    objectives: [kmk-deutsch-2022.les.11]
