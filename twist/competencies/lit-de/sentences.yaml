progression: lit-de.sentences
title: { de: Sätze, en: Sentences }
skills:
  - id: lit-de.sentences.word-gaps
    topic: { de: Erste Sätze schreiben, en: Writing first sentences }
    can_do:
      de: Ich kann Wortgrenzen erkennen, aus durcheinander geratenen Wörtern einen Satz bilden (Satzsalat) und Lückensätze ergänzen.
      en: I can see where words begin and end, unscramble words into a sentence and complete gap sentences.
    prerequisites: { hard: [lit-de.decoding.first-sentences] }
    standards: [kmk-deutsch-2022.les.4, kmk-deutsch-2022.sp.12]

  - id: lit-de.sentences.end-punctuation
    topic: { de: Satzarten, en: Kinds of sentence }
    can_do:
      de: Ich kann Aussagesätze, Fragesätze und Ausrufesätze unterscheiden und das passende Satzschlusszeichen setzen.
      en: I can tell statements, questions and exclamations apart and end each with the right punctuation mark.
    prerequisites: { hard: [lit-de.sentences.word-gaps] }
    standards: [kmk-deutsch-2022.sch.8, kmk-deutsch-2022.sp.12]

  - id: lit-de.sentences.questions
    topic: { de: Satzarten, en: Kinds of sentence }
    can_do:
      de: Ich kann Fragesätze mit und ohne Fragewort bilden und sehe, wo dann das Verb steht.
      en: I can form questions with and without a question word and see where the verb goes.
    prerequisites: { hard: [lit-de.sentences.end-punctuation, lit-de.verbs.conjugate] }
    standards: [kmk-deutsch-2022.sp.12]

  - id: lit-de.sentences.subject-predicate
    topic: { de: Satzglieder, en: Parts of a sentence }
    can_do:
      de: Ich kann in einem Satz das Prädikat und das Subjekt finden (Wer oder was tut etwas?).
      en: I can find the verb (predicate) and the subject of a sentence.
    prerequisites: { hard: [lit-de.sentences.questions] }
    standards: [kmk-deutsch-2022.sp.12, kmk-deutsch-2022.sp.11]

  - id: lit-de.sentences.move-parts
    topic: { de: Satzglieder, en: Parts of a sentence }
    can_do:
      de: Ich kann Satzglieder durch Umstellen finden und weiß, dass das Verb im Aussagesatz an zweiter Stelle bleibt.
      en: I can find the parts of a sentence by moving them around and know that the verb stays in second place in a statement.
    prerequisites: { hard: [lit-de.sentences.subject-predicate] }
    standards: [kmk-deutsch-2022.sp.12, kmk-deutsch-2022.sp.11]

  - id: lit-de.sentences.direct-speech
    topic: { de: Wörtliche Rede, en: Direct speech }
    can_do:
      de: Ich kann wörtliche Rede mit Anführungszeichen schreiben, wenn der Begleitsatz vorne steht.
      en: I can write direct speech with speech marks when the reporting clause comes first.
    prerequisites: { hard: [lit-de.sentences.end-punctuation] }
    standards: [kmk-deutsch-2022.sch.8]

  - id: lit-de.sentences.direct-speech-positions
    topic: { de: Wörtliche Rede, en: Direct speech }
    can_do:
      de: Ich kann die Zeichen bei wörtlicher Rede setzen, wenn der Begleitsatz in der Mitte oder am Ende steht.
      en: I can punctuate direct speech when the reporting clause is in the middle or at the end.
    prerequisites: { hard: [lit-de.sentences.direct-speech] }
    standards: [kmk-deutsch-2022.sch.8]

  - id: lit-de.sentences.objects
    topic: { de: Satzglieder, en: Parts of a sentence }
    can_do:
      de: Ich kann Dativobjekte (Wem?) und Akkusativobjekte (Wen oder was?) erfragen und bestimmen.
      en: I can find dative and accusative objects with the right questions.
    prerequisites: { hard: [lit-de.sentences.move-parts, lit-de.nouns.cases] }
    standards: [kmk-deutsch-2022.sp.12]

  - id: lit-de.sentences.place-time
    topic: { de: Satzglieder, en: Parts of a sentence }
    can_do:
      de: Ich kann Orts- und Zeitangaben erfragen und bestimmen (Wo? Wann? Wie lange?).
      en: I can find phrases of place and time with the right questions.
    prerequisites: { hard: [lit-de.sentences.move-parts] }
    standards: [kmk-deutsch-2022.sp.12]

  - id: lit-de.sentences.conjunctions
    topic: { de: Sätze verbinden, en: Joining sentences }
    can_do:
      de: Ich kann Sätze mit und, oder, aber, weil, dass und wenn verbinden und setze das Komma richtig.
      en: I can join sentences with and, or, but, because, that and if, with the comma in the right place.
    prerequisites: { hard: [lit-de.sentences.move-parts] }
    standards: [kmk-deutsch-2022.sp.12, kmk-deutsch-2022.sch.18]

  - id: lit-de.sentences.list-commas
    topic: { de: Zeichensetzung, en: Punctuation }
    can_do:
      de: Ich setze bei Aufzählungen Kommas.
      en: I use commas in lists.
    prerequisites: { hard: [lit-de.sentences.end-punctuation] }
    standards: [kmk-deutsch-2022.sch.8]
