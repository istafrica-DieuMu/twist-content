progression: lit-de.letters
title: { de: Buchstaben und Laute, en: Letters and sounds }
# Letters come in groups in a common Fibel order. Each group step means:
# the child knows the sound of each letter (upper and lower case), finds it in
# words, and reads and writes short words with the letters met so far.
skills:
  - id: lit-de.letters.sound-chart
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kann mit einer Anlauttabelle zu einem Laut den passenden Buchstaben finden.
      en: I can use a sound chart to find the letter for a sound.
    prerequisites: { hard: [lit-de.phonological.initial-sound] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sp.17]

  - id: lit-de.letters.l-o-a-m
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne die Buchstaben L, O, A und M mit ihren Lauten und lese erste Silben wie Mo, La, Ma.
      en: I know the letters L, O, A and M with their sounds and read first syllables like Mo, La, Ma.
    prerequisites: { hard: [lit-de.letters.sound-chart] }
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.i-ie-s-t
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne I, ie, S und T mit ihren Lauten und lese Wörter wie Mama, Oma, Tisch nur mit bekannten Buchstaben.
      en: I know I, ie, S and T with their sounds and read words made only of letters I know.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.e-n-d-u
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne E, N, D und U mit ihren Lauten und lese und schreibe Wörter damit.
      en: I know E, N, D and U with their sounds and read and write words with them.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.p-k-b-f
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne P, K, B und F mit ihren Lauten und unterscheide ähnliche Laute wie P und B.
      en: I know P, K, B and F with their sounds and tell similar sounds like P and B apart.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.ei-r-h-w
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne Ei, R, H und W mit ihren Lauten und lese Wörter mit dem Zwielaut ei.
      en: I know Ei, R, H and W with their sounds and read words with the diphthong ei.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.g-au-sch-z
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne G, Au, Sch und Z mit ihren Lauten und weiß, dass sch drei Buchstaben für einen Laut sind.
      en: I know G, Au, Sch and Z with their sounds and know that sch is three letters for one sound.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.eu-ch-j
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne Eu, Ch und J mit ihren Lauten und höre die zwei Aussprachen von ch (ich, Dach).
      en: I know Eu, Ch and J with their sounds and hear the two ways ch is spoken.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.umlauts
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne die Umlaute Ä, Ö und Ü mit ihren Lauten und lese Wörter damit.
      en: I know the umlauts Ä, Ö and Ü with their sounds and read words with them.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.st-sp-pf
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kann St, Sp und Pf am Wortanfang lesen und schreiben und weiß, dass man St wie Scht spricht.
      en: I can read and write St, Sp and Pf at the start of words and know that St is spoken as "sht".
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.ng-nk-qu-v
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne ng, nk, Qu und V mit ihren Lauten und lese Wörter wie Ring, Bank, Qualle, Vogel.
      en: I know ng, nk, Qu and V with their sounds and read words with them.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.c-y-x-aeu-ck-ss
    topic: { de: Buchstaben, en: Letters }
    can_do:
      de: Ich kenne die seltenen Buchstaben C, Y und X sowie äu, ck und ß und lese Wörter damit.
      en: I know the rare letters C, Y and X and also äu, ck and ß, and read words with them.
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.1]

  - id: lit-de.letters.alphabet
    topic: { de: Das ABC, en: The alphabet }
    can_do:
      de: Ich kann das ABC aufsagen, die Buchstaben in die richtige Reihenfolge bringen und Wörter nach dem ersten Buchstaben ordnen.
      en: I can say the alphabet, put letters in order and sort words by their first letter.
    standards: [kmk-deutsch-2022.sch.10, kmk-deutsch-2022.sp.20]

  - id: lit-de.letters.alphabet-order
    topic: { de: Das ABC, en: The alphabet }
    can_do:
      de: Ich kann Wörter auch nach dem zweiten und dritten Buchstaben alphabetisch ordnen.
      en: I can sort words alphabetically by their second and third letters too.
    standards: [kmk-deutsch-2022.sch.10, kmk-deutsch-2022.sp.20]
