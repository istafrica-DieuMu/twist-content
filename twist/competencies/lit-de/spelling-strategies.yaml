progression: lit-de.spelling-strategies
title: { de: Rechtschreibstrategien, en: Spelling strategies }
steps:
  - id: lit-de.spelling-strategies.syllable-swinging
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich kann Wörter in Silben schwingen und dabei jeden Laut mitsprechen, um sie richtig zu schreiben (Silbenschwingen).
      en: I can swing words into syllables, saying every sound, to spell them correctly.
    prerequisites: { hard: [lit-de.phonological.syllables, lit-de.spelling.write-by-sound] }
    objectives: [kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling-strategies.syllable-cores
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich finde in jeder Silbe den Silbenkern und kann offene und geschlossene Silben unterscheiden.
      en: I find the vowel at the core of each syllable and tell open from closed syllables.
    prerequisites: { hard: [lit-de.spelling-strategies.syllable-swinging, lit-de.spelling.vowels-consonants] }
    objectives: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.les.1]

  - id: lit-de.spelling-strategies.lengthen-dt
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich kann Wörter verlängern, um zu hören, ob am Ende d oder t steht (Hund, weil die Hunde).
      en: I can make a word longer to hear whether it ends in d or t.
    prerequisites: { hard: [lit-de.spelling-strategies.syllable-swinging, lit-de.nouns.plural] }
    objectives: [kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling-strategies.lengthen-bp-gk
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich kann mit Verlängern auch b und p, g und k am Wortende unterscheiden (Korb, Berg).
      en: I can use lengthening to tell b from p and g from k at the end of a word.
    prerequisites: { hard: [lit-de.spelling-strategies.lengthen-dt] }
    objectives: [kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling-strategies.word-stem
    topic: { de: Wortstamm und Wortfamilie, en: Word stems and families }
    can_do:
      de: Ich kann den Wortstamm finden und Wörter einer Wortfamilie sammeln (fahren, Fahrer, Fahrrad).
      en: I can find the stem of a word and collect words of the same family.
    prerequisites: { hard: [lit-de.spelling-strategies.syllable-cores] }
    objectives: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sp.9]

  - id: lit-de.spelling-strategies.derive-ae-aeu
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich kann Wörter mit ä und äu von verwandten Wörtern mit a und au ableiten (Bäume von Baum, er fährt von fahren).
      en: I can work out ä and äu from related words with a and au.
    prerequisites: { hard: [lit-de.spelling-strategies.word-stem] }
    objectives: [kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling-strategies.memory-words
    topic: { de: Merkwörter, en: Words to learn by heart }
    can_do:
      de: Ich weiß, dass manche Wörter Merkwörter sind, und präge sie mir ein (Wörter mit Dehnungs-h, doppeltem Selbstlaut, Wochentage, Monate, Zahlwörter).
      en: I know that some words must be learnt by heart and memorise them (silent h, double vowels, days, months, number words).
    prerequisites: { hard: [lit-de.spelling.short-long-vowels] }
    objectives: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling-strategies.lengthen-double
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich kann Verlängern auch für doppelte Mitlaute am Wortende nutzen und auf Verben und Adjektive anwenden (Ball, Bälle; er kommt, kommen).
      en: I can use lengthening for double consonants at the end of words, and for verbs and adjectives too.
    prerequisites: { hard: [lit-de.spelling-strategies.lengthen-bp-gk, lit-de.spelling.double-consonants, lit-de.verbs.conjugate] }
    objectives: [kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling-strategies.choose-strategy
    topic: { de: Rechtschreibstrategien, en: Spelling strategies }
    can_do:
      de: Ich kann bei einem schwierigen Wort entscheiden, welche Strategie hilft (schwingen, verlängern, ableiten, merken), und das Wort so richtig schreiben.
      en: I can decide which strategy helps with a tricky word (syllables, lengthening, deriving, memorising) and spell it correctly.
    prerequisites: { hard: [lit-de.spelling-strategies.lengthen-double, lit-de.spelling-strategies.derive-ae-aeu, lit-de.spelling-strategies.memory-words] }
    objectives: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.9]

  - id: lit-de.spelling-strategies.dictionary
    topic: { de: Wörterbuch, en: Dictionary }
    can_do:
      de: Ich kann ein Wort im Wörterbuch schnell finden, auch wenn ich es erst in die Grundform bringen muss.
      en: I can find a word in the dictionary quickly, even when I first have to change it to its base form.
    prerequisites: { hard: [lit-de.letters.alphabet-order, lit-de.verbs.base-form] }
    objectives: [kmk-deutsch-2022.sch.10, kmk-deutsch-2022.sp.20]

  - id: lit-de.spelling-strategies.correct-errors
    topic: { de: Fehler berichtigen, en: Correcting mistakes }
    can_do:
      de: Ich kann Fehler in meinem Text finden und mit einer passenden Strategie oder dem Wörterbuch berichtigen.
      en: I can find mistakes in my writing and correct them with the right strategy or a dictionary.
    prerequisites: { hard: [lit-de.spelling-strategies.choose-strategy, lit-de.spelling-strategies.dictionary] }
    objectives: [kmk-deutsch-2022.sch.9, kmk-deutsch-2022.sch.11, kmk-deutsch-2022.sch.10]

  - id: lit-de.spelling-strategies.compare-spellings
    topic: { de: Fehler berichtigen, en: Correcting mistakes }
    can_do:
      de: Ich kann Schreibungen vergleichen und erklären, warum ein Wort so geschrieben wird (Raum und Saum, Hund und Hunde).
      en: I can compare spellings and explain why a word is spelt the way it is.
    prerequisites: { hard: [lit-de.spelling-strategies.choose-strategy] }
    objectives: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sp.17, kmk-deutsch-2022.sp.18]
