progression: lit-de.texts-media
title: { de: Texte und Medien, en: Texts and media }
order: free
steps:
  - id: lit-de.texts-media.listen-stories
    topic: { de: Geschichten und Gedichte, en: Stories and poems }
    can_do:
      de: Ich kann einer vorgelesenen Geschichte zuhören und sagen, wer darin vorkommt und was passiert.
      en: I can listen to a story read aloud and say who is in it and what happens.
    objectives: [kmk-deutsch-2022.sz.10, kmk-deutsch-2022.tm.5, kmk-deutsch-2022.tm.14]

  - id: lit-de.texts-media.pictograms
    topic: { de: Bildzeichen und Diagramme, en: Signs and charts }
    can_do:
      de: Ich kann Bildzeichen und Symbole aus meinem Alltag lesen und verstehen.
      en: I can read and understand signs and symbols from everyday life.
    objectives: [kmk-deutsch-2022.tm.22, kmk-deutsch-2022.les.9]

  - id: lit-de.texts-media.tables-charts
    topic: { de: Bildzeichen und Diagramme, en: Signs and charts }
    can_do:
      de: Ich kann einfachen Tabellen, Diagrammen und Plänen Informationen entnehmen.
      en: I can take information from simple tables, charts and plans.
    prerequisites: { hard: [lit-de.texts-media.pictograms, lit-de.decoding.first-texts] }
    objectives: [kmk-deutsch-2022.tm.22]

  - id: lit-de.texts-media.text-types
    topic: { de: Textarten, en: Kinds of text }
    can_do:
      de: Ich kann Textarten unterscheiden (Geschichte, Gedicht, Anleitung, Lexikoneintrag, Witz, Brief) und sagen, wozu sie da sind.
      en: I can tell kinds of text apart (story, poem, instructions, encyclopedia entry, joke, letter) and say what each is for.
    prerequisites: { hard: [lit-de.decoding.first-texts] }
    objectives: [kmk-deutsch-2022.tm.2, kmk-deutsch-2022.tm.3]

  - id: lit-de.texts-media.instructions
    topic: { de: Textarten, en: Kinds of text }
    can_do:
      de: Ich kann Anleitungen und Rezepte lesen und die Schritte in der richtigen Reihenfolge verstehen.
      en: I can read instructions and recipes and follow the steps in order.
    prerequisites: { hard: [lit-de.texts-media.text-types] }
    objectives: [kmk-deutsch-2022.tm.3, kmk-deutsch-2022.les.8]

  - id: lit-de.texts-media.poems
    topic: { de: Geschichten und Gedichte, en: Stories and poems }
    can_do:
      de: Ich kann in Gedichten Reime, Verse und Strophen erkennen und beschreiben, wie ein Gedicht klingt und wirkt.
      en: I can find rhymes, lines and verses in poems and describe how a poem sounds and feels.
    prerequisites: { hard: [lit-de.texts-media.text-types, lit-de.phonological.rhymes] }
    objectives: [kmk-deutsch-2022.tm.17, kmk-deutsch-2022.sp.16]

  - id: lit-de.texts-media.fairy-tales
    topic: { de: Märchen, Fabeln, Sagen, en: Fairy tales, fables, legends }
    can_do:
      de: Ich kann Märchen erkennen, typische Märchenmerkmale nennen (Es war einmal, Zauberei, Gut und Böse) und bekannte Märchen nacherzählen.
      en: I can recognise fairy tales, name their typical features (once upon a time, magic, good and evil) and retell well-known ones.
    prerequisites: { hard: [lit-de.texts-media.text-types] }
    objectives: [kmk-deutsch-2022.tm.4, kmk-deutsch-2022.tm.1]

  - id: lit-de.texts-media.fables-legends
    topic: { de: Märchen, Fabeln, Sagen, en: Fairy tales, fables, legends }
    can_do:
      de: Ich kann Fabeln und Sagen erkennen, die Lehre einer Fabel herausfinden und sie von Märchen unterscheiden.
      en: I can recognise fables and legends, find the moral of a fable and tell them apart from fairy tales.
    prerequisites: { hard: [lit-de.texts-media.fairy-tales, lit-de.comprehension.infer] }
    objectives: [kmk-deutsch-2022.tm.4, kmk-deutsch-2022.tm.19]

  - id: lit-de.texts-media.ballads
    topic: { de: Märchen, Fabeln, Sagen, en: Fairy tales, fables, legends }
    can_do:
      de: Ich kann eine Ballade als Gedicht erkennen, das eine spannende Geschichte erzählt.
      en: I can recognise a ballad as a poem that tells an exciting story.
    prerequisites: { hard: [lit-de.texts-media.poems, lit-de.texts-media.fables-legends] }
    enrichment: true
    reason: Not named in KMK for primary; often met in Klasse 4 and taken up in Klasse 5.

  - id: lit-de.texts-media.story-elements
    topic: { de: Geschichten und Gedichte, en: Stories and poems }
    can_do:
      de: Ich kann in Geschichten Figuren, Ort, Zeit und Handlung benennen und mit den Fachbegriffen beschreiben.
      en: I can name the characters, place, time and plot of a story and describe them with the right terms.
    prerequisites: { hard: [lit-de.comprehension.order-story] }
    objectives: [kmk-deutsch-2022.tm.17, kmk-deutsch-2022.tm.15, kmk-deutsch-2022.tm.14, kmk-deutsch-2022.sp.15]

  - id: lit-de.texts-media.character-perspective
    topic: { de: Geschichten und Gedichte, en: Stories and poems }
    can_do:
      de: Ich kann mich in eine Figur hineinversetzen, sagen, was sie denkt und fühlt, und meine Meinung mit einer Textstelle begründen.
      en: I can put myself in a character's place, say what they think and feel, and back up my view with a line from the text.
    prerequisites: { hard: [lit-de.texts-media.story-elements, lit-de.comprehension.infer] }
    objectives: [kmk-deutsch-2022.tm.16, kmk-deutsch-2022.tm.18, kmk-deutsch-2022.tm.19]

  - id: lit-de.texts-media.text-picture
    topic: { de: Geschichten und Gedichte, en: Stories and poems }
    can_do:
      de: Ich kann Text und Bild in Bilderbüchern, Comics und Sachtexten aufeinander beziehen und sagen, was das Bild zusätzlich erzählt.
      en: I can relate text and pictures in picture books, comics and information texts and say what the picture adds.
    prerequisites: { hard: [lit-de.decoding.first-texts] }
    objectives: [kmk-deutsch-2022.tm.13, kmk-deutsch-2022.les.9, kmk-deutsch-2022.tm.4]

  - id: lit-de.texts-media.compare-texts
    topic: { de: Geschichten und Gedichte, en: Stories and poems }
    can_do:
      de: Ich kann zwei Fassungen einer Geschichte vergleichen, zum Beispiel ein Märchen als Buch und als Film.
      en: I can compare two versions of a story, for example a fairy tale as a book and as a film.
    prerequisites: { hard: [lit-de.texts-media.fairy-tales, lit-de.texts-media.story-elements] }
    objectives: [kmk-deutsch-2022.tm.20]

  - id: lit-de.texts-media.digital-texts
    topic: { de: Medien, en: Media }
    can_do:
      de: Ich kann in digitalen Texten mit Links navigieren und Text, Bild und Ton zusammen verstehen.
      en: I can follow links in digital texts and understand text, pictures and sound together.
    prerequisites: { hard: [lit-de.comprehension.find-information] }
    objectives: [kmk-deutsch-2022.les.10, kmk-deutsch-2022.tm.6, kmk-deutsch-2022.les.9]

  - id: lit-de.texts-media.research
    topic: { de: Medien, en: Media }
    can_do:
      de: Ich kann Informationen zu einer Frage in Kinderlexika und auf Kinderseiten im Internet suchen und prüfen, ob sie verlässlich sind.
      en: I can look for information on a question in children's encyclopedias and websites and check whether it is reliable.
    prerequisites: { hard: [lit-de.texts-media.digital-texts, lit-de.comprehension.notes] }
    objectives: [kmk-deutsch-2022.tm.9, kmk-deutsch-2022.tm.10]

  - id: lit-de.texts-media.media-use
    topic: { de: Medien, en: Media }
    can_do:
      de: Ich kann über meine Erfahrungen mit Hörspielen, Videos, Spielen und Apps sprechen und kritisch darüber nachdenken.
      en: I can talk about my experiences with audio stories, videos, games and apps and think about them critically.
    prerequisites: { hard: [lit-de.texts-media.digital-texts] }
    objectives: [kmk-deutsch-2022.tm.23, kmk-deutsch-2022.tm.24, kmk-deutsch-2022.tm.5, kmk-deutsch-2022.tm.11]

  - id: lit-de.texts-media.recite
    topic: { de: Vortragen, en: Performing }
    can_do:
      de: Ich kann ein kurzes Gedicht auswendig lernen und betont vortragen.
      en: I can learn a short poem by heart and recite it with expression.
    prerequisites: { hard: [lit-de.texts-media.poems] }
    objectives: [kmk-deutsch-2022.tm.27, kmk-deutsch-2022.tm.29, kmk-deutsch-2022.sz.6]

  - id: lit-de.texts-media.book-choice
    topic: { de: Bücher, en: Books }
    can_do:
      de: Ich kann ein Buch nach meinen Interessen auswählen, es kurz vorstellen und sagen, warum es mir gefällt.
      en: I can choose a book that interests me, present it briefly and say why I like it.
    prerequisites: { hard: [lit-de.texts-media.story-elements] }
    objectives: [kmk-deutsch-2022.tm.7, kmk-deutsch-2022.tm.28, kmk-deutsch-2022.tm.1]

  - id: lit-de.texts-media.make-media
    topic: { de: Medien, en: Media }
    can_do:
      de: Ich kann mit einem digitalen Werkzeug ein kleines eigenes Medienprodukt gestalten, zum Beispiel eine Hörgeschichte oder eine Präsentation.
      en: I can make a small media product with a digital tool, such as an audio story or a slideshow.
    prerequisites: { hard: [lit-de.texts-media.media-use] }
    objectives: [kmk-deutsch-2022.tm.25, kmk-deutsch-2022.sz.8]
