progression: lit-de.fluency
title: { de: Flüssig lesen, en: Reading fluently }
steps:
  - id: lit-de.fluency.sight-words-easy
    topic: { de: Blitzlesen, en: Flash reading }
    can_do:
      de: Ich erkenne häufige kurze Wörter auf einen Blick, auch wenn sie nur kurz zu sehen sind (Blitzlesen).
      en: I recognise common short words at a glance, even when they are shown only briefly (flash reading).
    prerequisites: { hard: [lit-de.decoding.one-syllable-words] }
    objectives: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.les.6]

  - id: lit-de.fluency.function-words
    topic: { de: Blitzlesen, en: Flash reading }
    can_do:
      de: Ich erkenne kleine Funktionswörter sofort (und, der, die, das, ist, mit, auf, nicht).
      en: I recognise small function words instantly (and, the, is, with, on, not).
    prerequisites: { hard: [lit-de.fluency.sight-words-easy] }
    objectives: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sch.5]

  - id: lit-de.fluency.sight-words-longer
    topic: { de: Blitzlesen, en: Flash reading }
    can_do:
      de: Ich erkenne auch längere Wörter des Grundwortschatzes schnell und sicher.
      en: I recognise longer core-vocabulary words quickly and reliably.
    prerequisites: { hard: [lit-de.fluency.function-words, lit-de.decoding.longer-words] }
    objectives: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.les.6]

  - id: lit-de.fluency.word-groups
    topic: { de: Blitzlesen, en: Flash reading }
    can_do:
      de: Ich kann Wortgruppen auf einen Blick erfassen (auf dem Tisch, ein kleiner Hund).
      en: I can take in short phrases at a glance (on the table, a little dog).
    prerequisites: { hard: [lit-de.fluency.sight-words-longer] }
    objectives: [kmk-deutsch-2022.les.4, kmk-deutsch-2022.les.6]

  - id: lit-de.fluency.punctuation-reading
    topic: { de: Flüssig lesen, en: Reading fluently }
    can_do:
      de: Ich lese über das Zeilenende hinweg, beachte Punkt, Komma und Fragezeichen und lese einen Satz als Ganzes.
      en: I read on past the end of a line, notice full stops, commas and question marks, and read a sentence as a whole.
    prerequisites: { hard: [lit-de.fluency.word-groups, lit-de.sentences.end-punctuation] }
    objectives: [kmk-deutsch-2022.les.1, kmk-deutsch-2022.les.4]

  - id: lit-de.fluency.read-aloud
    topic: { de: Vorlesen, en: Reading aloud }
    can_do:
      de: Ich kann einen geübten Text betont und in passendem Tempo vorlesen.
      en: I can read a practised text aloud with expression and at a good pace.
    prerequisites: { hard: [lit-de.fluency.punctuation-reading] }
    objectives: [kmk-deutsch-2022.les.5, kmk-deutsch-2022.les.6, kmk-deutsch-2022.tm.26, kmk-deutsch-2022.tm.29, kmk-deutsch-2022.sz.6]
