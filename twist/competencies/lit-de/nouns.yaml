progression: lit-de.nouns
title: { de: Nomen, en: Nouns }
steps:
  - id: lit-de.nouns.recognise
    topic: { de: Nomen, en: Nouns }
    can_do:
      de: Ich kann Nomen erkennen (Menschen, Tiere, Pflanzen, Dinge) und weiß, dass man sie großschreibt.
      en: I can recognise nouns (people, animals, plants, things) and know that German writes them with a capital.
    prerequisites: { hard: [lit-de.decoding.word-picture] }
    objectives: [kmk-deutsch-2022.sp.13, kmk-deutsch-2022.sp.11]

  - id: lit-de.nouns.articles
    topic: { de: Nomen, en: Nouns }
    can_do:
      de: Ich kann zu Nomen den bestimmten Artikel (der, die, das) und den unbestimmten Artikel (ein, eine) finden.
      en: I can give nouns their definite article (der, die, das) and indefinite article (ein, eine).
    prerequisites: { hard: [lit-de.nouns.recognise] }
    objectives: [kmk-deutsch-2022.sp.13]

  - id: lit-de.nouns.plural
    topic: { de: Nomen, en: Nouns }
    can_do:
      de: Ich kann zu Nomen die Mehrzahl bilden und Einzahl und Mehrzahl unterscheiden (der Baum, die Bäume).
      en: I can form the plural of nouns and tell singular from plural.
    prerequisites: { hard: [lit-de.nouns.articles] }
    objectives: [kmk-deutsch-2022.sp.11, kmk-deutsch-2022.sp.13]

  - id: lit-de.nouns.compounds
    topic: { de: Nomen, en: Nouns }
    can_do:
      de: Ich kann zusammengesetzte Nomen bilden und zerlegen und weiß, dass das letzte Wort den Artikel bestimmt (das Haus, die Tür, die Haustür).
      en: I can build and split compound nouns and know that the last part decides the article.
    prerequisites: { hard: [lit-de.nouns.articles] }
    objectives: [kmk-deutsch-2022.sp.9]

  - id: lit-de.nouns.pronouns
    topic: { de: Pronomen, en: Pronouns }
    can_do:
      de: Ich kann Nomen durch Pronomen ersetzen (er, sie, es, wir), damit sich ein Text nicht wiederholt.
      en: I can replace nouns with pronouns so that a text does not repeat itself.
    prerequisites: { hard: [lit-de.nouns.plural] }
    objectives: [kmk-deutsch-2022.sp.13, kmk-deutsch-2022.sch.18]

  - id: lit-de.nouns.endings
    topic: { de: Nomen, en: Nouns }
    can_do:
      de: Ich kann Nomen an den Endungen -ung, -heit, -keit und -nis erkennen und aus Verben und Adjektiven Nomen bilden (hoffen, die Hoffnung).
      en: I can recognise nouns by the endings -ung, -heit, -keit and -nis and form nouns from verbs and adjectives.
    prerequisites: { hard: [lit-de.nouns.compounds, lit-de.verbs.recognise, lit-de.adjectives.recognise] }
    objectives: [kmk-deutsch-2022.sp.9]

  - id: lit-de.nouns.abstract
    topic: { de: Nomen, en: Nouns }
    can_do:
      de: Ich weiß, dass auch Dinge, die man nicht anfassen kann, Nomen sind (die Freude, das Glück).
      en: I know that things you cannot touch are nouns too (joy, luck).
    prerequisites: { hard: [lit-de.nouns.endings] }
    objectives: [kmk-deutsch-2022.sch.7, kmk-deutsch-2022.sp.13]

  - id: lit-de.nouns.cases
    topic: { de: Die vier Fälle, en: The four cases }
    can_do:
      de: Ich kann mit Fragen (Wer oder was? Wessen? Wem? Wen oder was?) den Fall eines Nomens bestimmen und Nomen in die vier Fälle setzen.
      en: I can use case questions to find the case of a noun and put nouns into the four cases.
    prerequisites: { hard: [lit-de.nouns.pronouns, lit-de.sentences.subject-predicate] }
    objectives: [kmk-deutsch-2022.sp.11, kmk-deutsch-2022.sp.13]
