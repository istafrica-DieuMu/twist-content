progression: lit-de.decoding
title: { de: Lesen lernen, en: Learning to read }
skills:
  - id: lit-de.decoding.blend-syllables
    topic: { de: Silben lesen, en: Reading syllables }
    can_do:
      de: Ich kann Laute zu Silben zusammenziehen (M-a wird Ma) und offene Silben lesen.
      en: I can blend sounds into syllables (M-a becomes Ma) and read open syllables.
    prerequisites: { hard: [lit-de.letters.l-o-a-m, lit-de.phonological.syllables] }
    standards: [kmk-deutsch-2022.les.1, kmk-deutsch-2022.les.3]

  - id: lit-de.decoding.one-syllable-words
    topic: { de: Silben lesen, en: Reading syllables }
    can_do:
      de: Ich kann einsilbige Wörter erlesen und dem passenden Bild zuordnen.
      en: I can read one-syllable words and match them to pictures.
    prerequisites: { hard: [lit-de.decoding.blend-syllables, lit-de.letters.e-n-d-u] }
    standards: [kmk-deutsch-2022.les.2]

  - id: lit-de.decoding.two-syllable-words
    topic: { de: Silben lesen, en: Reading syllables }
    can_do:
      de: Ich kann zweisilbige Wörter Silbe für Silbe erlesen (Ro-se, Ta-sche).
      en: I can read two-syllable words syllable by syllable.
    prerequisites: { hard: [lit-de.decoding.one-syllable-words, lit-de.letters.p-k-b-f] }
    standards: [kmk-deutsch-2022.les.1, kmk-deutsch-2022.les.3]

  - id: lit-de.decoding.longer-words
    topic: { de: Silben lesen, en: Reading syllables }
    can_do:
      de: Ich kann lange Wörter mit drei und mehr Silben erlesen, indem ich sie in Silben gliedere.
      en: I can read long words of three or more syllables by splitting them into syllables.
    prerequisites: { hard: [lit-de.decoding.two-syllable-words, lit-de.letters.g-au-sch-z] }
    standards: [kmk-deutsch-2022.les.3]

  - id: lit-de.decoding.word-picture
    topic: { de: Erste Wörter lesen, en: First words }
    can_do:
      de: Ich kann Wörter genau lesen und ähnliche Wörter unterscheiden (Hose, Rose, Dose).
      en: I can read words carefully and tell similar words apart.
    prerequisites: { hard: [lit-de.decoding.two-syllable-words] }
    standards: [kmk-deutsch-2022.les.2]

  - id: lit-de.decoding.word-riddles
    topic: { de: Erste Wörter lesen, en: First words }
    can_do:
      de: Ich kann Wortketten und Worträtsel lesen und lösen.
      en: I can read and solve word chains and word riddles.
    prerequisites: { hard: [lit-de.decoding.word-picture] }
    standards: [kmk-deutsch-2022.les.2, kmk-deutsch-2022.sp.14]

  - id: lit-de.decoding.first-sentences
    topic: { de: Erste Sätze lesen, en: First sentences }
    can_do:
      de: Ich kann kurze Sätze lesen und das passende Bild dazu finden.
      en: I can read short sentences and find the picture that matches.
    prerequisites: { hard: [lit-de.decoding.word-picture, lit-de.fluency.sight-words-easy] }
    standards: [kmk-deutsch-2022.les.4, kmk-deutsch-2022.les.8]

  - id: lit-de.decoding.read-and-do
    topic: { de: Erste Sätze lesen, en: First sentences }
    can_do:
      de: Ich kann kurze Arbeitsanweisungen lesen und ausführen (Male den Ball rot an).
      en: I can read short instructions and carry them out (colour the ball red).
    prerequisites: { hard: [lit-de.decoding.first-sentences] }
    standards: [kmk-deutsch-2022.les.8]

  - id: lit-de.decoding.first-texts
    topic: { de: Erste Texte lesen, en: First texts }
    can_do:
      de: Ich kann einen kurzen Text aus wenigen Sätzen lesen und Fragen dazu beantworten.
      en: I can read a short text of a few sentences and answer questions about it.
    prerequisites: { hard: [lit-de.decoding.read-and-do, lit-de.decoding.longer-words] }
    standards: [kmk-deutsch-2022.les.4, kmk-deutsch-2022.les.8]
