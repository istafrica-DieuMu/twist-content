progression: lit-de.spelling
title: { de: Rechtschreibung, en: Spelling }
order: free
skills:
  - id: lit-de.spelling.write-by-sound
    topic: { de: Erste Wörter schreiben, en: Writing first words }
    can_do:
      de: Ich kann lautgetreue Wörter nach Gehör aufschreiben, indem ich mir jedes Wort langsam vorspreche (Mama, Sofa, Limo).
      en: I can write words that are spelt as they sound by saying them slowly to myself.
    prerequisites: { hard: [lit-de.phonological.sounds-in-words, lit-de.letters.e-n-d-u] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.gap-words
    topic: { de: Erste Wörter schreiben, en: Writing first words }
    can_do:
      de: Ich kann in Lückenwörtern fehlende Buchstaben ergänzen und Wörter aus Silben und Buchstaben bauen.
      en: I can fill in missing letters in words and build words from syllables and letters.
    prerequisites: { hard: [lit-de.spelling.write-by-sound] }
    standards: [kmk-deutsch-2022.sch.5, kmk-deutsch-2022.sp.17]

  - id: lit-de.spelling.dictation-short
    topic: { de: Erste Sätze schreiben, en: Writing first sentences }
    can_do:
      de: Ich kann kurze geübte Sätze nach Diktat schreiben.
      en: I can write short practised sentences from dictation.
    prerequisites: { hard: [lit-de.spelling.gap-words, lit-de.handwriting.copy-sentences] }
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.vowels-consonants
    topic: { de: Laute und Buchstaben, en: Sounds and letters }
    can_do:
      de: Ich kann Selbstlaute, Umlaute, Zwielaute und Mitlaute unterscheiden und weiß, dass jede Silbe einen Selbstlaut braucht.
      en: I can tell vowels, umlauts, diphthongs and consonants apart and know that every syllable needs a vowel.
    prerequisites: { hard: [lit-de.letters.umlauts, lit-de.phonological.syllables] }
    standards: [kmk-deutsch-2022.sp.11, kmk-deutsch-2022.sp.17]

  - id: lit-de.spelling.short-long-vowels
    topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
    can_do:
      de: Ich kann hören, ob ein Selbstlaut kurz oder lang gesprochen wird (Hüte, Hütte).
      en: I can hear whether a vowel is short or long.
    prerequisites: { hard: [lit-de.spelling.vowels-consonants] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sp.17]

  - id: lit-de.spelling.double-consonants
    topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
    can_do:
      de: Ich weiß, dass nach einem kurzen Selbstlaut oft ein doppelter Mitlaut steht, und schreibe Wörter wie Sonne, Ball, Mutter richtig.
      en: I know that a short vowel is often followed by a double consonant and spell such words correctly.
    prerequisites: { hard: [lit-de.spelling.short-long-vowels] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.ck-tz
    topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
    can_do:
      de: Ich schreibe nach kurzem Selbstlaut ck statt kk und tz statt zz (Decke, Katze) und unterscheide k und ck, z und tz.
      en: I write ck and tz after a short vowel, and tell k from ck and z from tz.
    prerequisites: { hard: [lit-de.spelling.double-consonants] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.long-i
    topic: { de: Kurze und lange Selbstlaute, en: Short and long vowels }
    can_do:
      de: Ich weiß, dass das lange i meistens ie geschrieben wird (Biene, Spiel), und kenne Ausnahmen (Tiger, Igel).
      en: I know that a long i is usually spelt ie and know the common exceptions.
    prerequisites: { hard: [lit-de.spelling.short-long-vowels] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.special-sounds
    topic: { de: Besondere Laute, en: Special sounds }
    can_do:
      de: Ich schreibe Wörter mit sp, st, qu, v, x, chs und äu richtig (Spiel, Quark, Vogel, Hexe, Fuchs, Häuser).
      en: I spell words with sp, st, qu, v, x, chs and äu correctly.
    prerequisites: { hard: [lit-de.letters.c-y-x-aeu-ck-ss] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.s-sounds
    topic: { de: Besondere Laute, en: Special sounds }
    can_do:
      de: Ich unterscheide s, ss und ß und schreibe sie richtig (Hose, Wasser, Straße).
      en: I tell s, ss and ß apart and use them correctly.
    prerequisites: { hard: [lit-de.spelling.double-consonants] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.ph-v-foreign
    topic: { de: Besondere Laute, en: Special sounds }
    can_do:
      de: Ich schreibe Wörter mit ph und v richtig und kann häufige Fremdwörter schreiben (Delfin, Vulkan, Melone).
      en: I spell words with ph and v correctly and can write common borrowed words.
    prerequisites: { hard: [lit-de.spelling.special-sounds] }
    standards: [kmk-deutsch-2022.sch.6, kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling.capital-nouns
    topic: { de: Groß- und Kleinschreibung, en: Capital letters }
    can_do:
      de: Ich schreibe Nomen und Satzanfänge groß.
      en: I write nouns and the start of sentences with a capital letter.
    prerequisites: { hard: [lit-de.nouns.recognise] }
    standards: [kmk-deutsch-2022.sch.7]

  - id: lit-de.spelling.capital-advanced
    topic: { de: Groß- und Kleinschreibung, en: Capital letters }
    can_do:
      de: Ich erkenne auch Nomen mit verstecktem Artikel und Wörter, die zu Nomen werden (beim Spielen, das Laufen), und schreibe Eigennamen und Zeitangaben richtig (am Montag, heute Abend).
      en: I recognise nouns with a hidden article and words used as nouns, and write names and time phrases correctly.
    prerequisites: { hard: [lit-de.spelling.capital-nouns, lit-de.nouns.endings] }
    standards: [kmk-deutsch-2022.sch.7]

  - id: lit-de.spelling.syllable-division
    topic: { de: Silben und Trennung, en: Syllables and hyphenation }
    can_do:
      de: Ich kann Wörter nach Silben trennen und kenne die Trennungsregeln für doppelte Mitlaute, ck und tz.
      en: I can split words by syllables at the end of a line and know the rules for double consonants, ck and tz.
    prerequisites: { hard: [lit-de.spelling.ck-tz] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sp.17]

  - id: lit-de.spelling.das-dass
    topic: { de: Besondere Laute, en: Special sounds }
    can_do:
      de: Ich kann das und dass unterscheiden und richtig schreiben.
      en: I can tell das and dass apart and spell them correctly.
    prerequisites: { hard: [lit-de.sentences.conjunctions] }
    standards: [kmk-deutsch-2022.sch.4, kmk-deutsch-2022.sch.5]

  - id: lit-de.spelling.similar-words
    topic: { de: Groß- und Kleinschreibung, en: Capital letters }
    can_do:
      de: Ich unterscheide gleich klingende Wörter mit verschiedener Schreibung und Bedeutung (Wal und Wahl, Lid und Lied).
      en: I tell apart words that sound the same but are spelt differently and mean different things.
    prerequisites: { hard: [lit-de.spelling.long-i] }
    standards: [kmk-deutsch-2022.sch.4]

  - id: lit-de.spelling.core-vocabulary
    topic: { de: Rechtschreibung üben, en: Spelling practice }
    can_do:
      de: Ich kann die häufigsten Wörter des Grundwortschatzes richtig schreiben, auch im Diktat.
      en: I can spell the most common core-vocabulary words correctly, also in dictation.
    prerequisites: { hard: [lit-de.spelling.dictation-short] }
    standards: [kmk-deutsch-2022.sch.5]
