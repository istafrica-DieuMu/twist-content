progression: lit-de.writing
title: { de: Texte schreiben, en: Writing texts }
order: free
steps:
  - id: lit-de.writing.words-to-pictures
    topic: { de: Texte schreiben, en: Writing texts }
    can_do:
      de: Ich kann zu Bildern Wörter und kurze Sätze schreiben.
      en: I can write words and short sentences about pictures.
    prerequisites: { hard: [lit-de.spelling.write-by-sound, lit-de.handwriting.copy-sentences] }
    objectives: [kmk-deutsch-2022.sch.18, kmk-deutsch-2022.sch.21]

  - id: lit-de.writing.lists-cards
    topic: { de: Texte schreiben, en: Writing texts }
    can_do:
      de: Ich kann Listen, kurze Nachrichten, Einladungen und Glückwunschkarten schreiben.
      en: I can write lists, short notes, invitations and greeting cards.
    prerequisites: { hard: [lit-de.writing.words-to-pictures] }
    objectives: [kmk-deutsch-2022.sch.19, kmk-deutsch-2022.sch.20]

  - id: lit-de.writing.letters-emails
    topic: { de: Texte schreiben, en: Writing texts }
    can_do:
      de: Ich kann einen Brief und eine E-Mail mit Anrede, Text und Gruß an eine bekannte Person schreiben.
      en: I can write a letter and an email with a greeting, body and sign-off to someone I know.
    prerequisites: { hard: [lit-de.writing.lists-cards] }
    objectives: [kmk-deutsch-2022.sch.19, kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.14]

  - id: lit-de.writing.describe
    topic: { de: Beschreiben, en: Describing }
    can_do:
      de: Ich kann einen Steckbrief schreiben und Personen, Tiere, Gegenstände oder Bilder genau beschreiben.
      en: I can write a profile and describe people, animals, objects or pictures precisely.
    prerequisites: { hard: [lit-de.adjectives.describe, lit-de.writing.words-to-pictures] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.18]

  - id: lit-de.writing.instructions
    topic: { de: Beschreiben, en: Describing }
    can_do:
      de: Ich kann einen Ablauf in der richtigen Reihenfolge beschreiben, zum Beispiel eine Spielanleitung oder ein Rezept.
      en: I can describe a process in the right order, for example game rules or a recipe.
    prerequisites: { hard: [lit-de.writing.describe, lit-de.texts-media.instructions] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.18]

  - id: lit-de.writing.story-pictures
    topic: { de: Erzählen, en: Telling stories }
    can_do:
      de: Ich kann zu einer Bildergeschichte eine zusammenhängende Geschichte schreiben, mit Anfang, Mitte und Schluss.
      en: I can write a connected story to a picture sequence, with a beginning, middle and end.
    prerequisites: { hard: [lit-de.writing.words-to-pictures, lit-de.comprehension.order-story] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.18, kmk-deutsch-2022.sch.21]

  - id: lit-de.writing.stories
    topic: { de: Erzählen, en: Telling stories }
    can_do:
      de: Ich kann Erlebnis- und Fantasiegeschichten schreiben, spannend erzählen und passende Wörter wählen.
      en: I can write stories about real and imagined events, tell them in an exciting way and choose good words.
    prerequisites: { hard: [lit-de.writing.story-pictures, lit-de.verbs.simple-past] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.23, kmk-deutsch-2022.sch.21]

  - id: lit-de.writing.prompt-stories
    topic: { de: Erzählen, en: Telling stories }
    can_do:
      de: Ich kann eine Geschichte zu Reizwörtern schreiben oder eine Geschichte weiterschreiben und umschreiben.
      en: I can write a story from a few given words, or continue and rewrite a story.
    prerequisites: { hard: [lit-de.writing.stories] }
    objectives: [kmk-deutsch-2022.sch.21, kmk-deutsch-2022.sch.20]

  - id: lit-de.writing.poems
    topic: { de: Gedichte schreiben, en: Writing poems }
    can_do:
      de: Ich kann nach einem Muster eigene Gedichte schreiben, zum Beispiel ein Elfchen, ein Haiku oder ein Reimgedicht.
      en: I can write my own poems to a pattern, for example an eleven-word poem, a haiku or a rhyming poem.
    prerequisites: { hard: [lit-de.texts-media.poems] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.21]

  - id: lit-de.writing.feelings
    topic: { de: Erzählen, en: Telling stories }
    can_do:
      de: Ich kann Gefühle und Gedanken in Worte fassen und in einem Text ausdrücken.
      en: I can put feelings and thoughts into words and express them in writing.
    prerequisites: { hard: [lit-de.writing.stories] }
    objectives: [kmk-deutsch-2022.sch.20]

  - id: lit-de.writing.report
    topic: { de: Berichten, en: Reporting }
    can_do:
      de: Ich kann einen sachlichen Bericht schreiben, der die W-Fragen beantwortet (Wer? Was? Wann? Wo? Wie? Warum?).
      en: I can write a factual report that answers who, what, when, where, how and why.
    prerequisites: { hard: [lit-de.writing.instructions, lit-de.verbs.simple-past] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.18]

  - id: lit-de.writing.opinion
    topic: { de: Berichten, en: Reporting }
    can_do:
      de: Ich kann meine Meinung schriftlich begründen, zum Beispiel in einem Buchtipp oder in einem Brief mit einer Bitte.
      en: I can give reasons for my opinion in writing, for example in a book recommendation or a letter asking for something.
    prerequisites: { hard: [lit-de.writing.letters-emails, lit-de.sentences.conjunctions] }
    objectives: [kmk-deutsch-2022.sch.20, kmk-deutsch-2022.sch.19]

  - id: lit-de.writing.plan
    topic: { de: Texte planen, en: Planning writing }
    can_do:
      de: Ich kann vor dem Schreiben Ideen sammeln, zum Beispiel in einem Cluster, und einen roten Faden planen.
      en: I can collect ideas before writing, for example in a mind map, and plan a clear thread.
    prerequisites: { hard: [lit-de.writing.story-pictures] }
    objectives: [kmk-deutsch-2022.sch.12, kmk-deutsch-2022.sch.13, kmk-deutsch-2022.sch.17]

  - id: lit-de.writing.purpose
    topic: { de: Texte planen, en: Planning writing }
    can_do:
      de: Ich kann klären, für wen und wozu ich schreibe, und die passende Textart wählen.
      en: I can decide who I am writing for and why, and choose the right kind of text.
    prerequisites: { hard: [lit-de.writing.plan, lit-de.texts-media.text-types] }
    objectives: [kmk-deutsch-2022.sch.14, kmk-deutsch-2022.sch.15, kmk-deutsch-2022.sch.19]

  - id: lit-de.writing.revise
    topic: { de: Texte überarbeiten, en: Revising writing }
    can_do:
      de: "Ich kann meinen Text überarbeiten, mit Hilfe einer Checkliste: Wortwahl, Satzanfänge, Reihenfolge, Verständlichkeit."
      en: "I can revise my writing with a checklist: word choice, sentence openings, order, clarity."
    prerequisites: { hard: [lit-de.writing.plan] }
    objectives: [kmk-deutsch-2022.sch.24, kmk-deutsch-2022.sch.25, kmk-deutsch-2022.sch.28]

  - id: lit-de.writing.revise-correctness
    topic: { de: Texte überarbeiten, en: Revising writing }
    can_do:
      de: Ich kann einen Text auf Rechtschreibung und Grammatik prüfen und berichtigen, auch am Computer.
      en: I can check and correct a text for spelling and grammar, also on a computer.
    prerequisites: { hard: [lit-de.writing.revise, lit-de.spelling-strategies.correct-errors] }
    objectives: [kmk-deutsch-2022.sch.11, kmk-deutsch-2022.sch.25, kmk-deutsch-2022.sch.27]
