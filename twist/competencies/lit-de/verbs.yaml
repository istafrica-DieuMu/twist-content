progression: lit-de.verbs
title: { de: Verben, en: Verbs }
skills:
  - id: lit-de.verbs.recognise
    topic: { de: Verben, en: Verbs }
    can_do:
      de: Ich kann Verben erkennen, die sagen, was jemand tut oder was geschieht.
      en: I can recognise verbs, which say what someone does or what happens.
    prerequisites: { hard: [lit-de.nouns.recognise] }
    standards: [kmk-deutsch-2022.sp.13]

  - id: lit-de.verbs.conjugate
    topic: { de: Verben, en: Verbs }
    can_do:
      de: Ich kann Verben zur Person passend beugen (ich spiele, du spielst, er spielt).
      en: I can change verbs to match the person (I play, you play, he plays).
    prerequisites: { hard: [lit-de.verbs.recognise, lit-de.nouns.pronouns] }
    standards: [kmk-deutsch-2022.sp.11, kmk-deutsch-2022.sp.13]

  - id: lit-de.verbs.base-form
    topic: { de: Verben, en: Verbs }
    can_do:
      de: Ich kann zu einer gebeugten Verbform die Grundform finden (sie läuft, laufen).
      en: I can find the base form of a conjugated verb.
    prerequisites: { hard: [lit-de.verbs.conjugate] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.verbs.prefixes
    topic: { de: Verben, en: Verbs }
    can_do:
      de: Ich kann Verben mit Vorsilben bilden (ver-, vor-, ab-, auf-, zer-, ent-, be-) und sagen, wie sich die Bedeutung ändert.
      en: I can build verbs with prefixes and say how the meaning changes.
    prerequisites: { hard: [lit-de.verbs.base-form] }
    standards: [kmk-deutsch-2022.sp.9]

  - id: lit-de.verbs.present
    topic: { de: Zeitformen, en: Tenses }
    can_do:
      de: Ich kann die Gegenwart (Präsens) bilden, auch bei starken Verben, die den Selbstlaut ändern (ich gebe, du gibst).
      en: I can form the present tense, also for strong verbs that change their vowel.
    prerequisites: { hard: [lit-de.verbs.conjugate] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.verbs.simple-past
    topic: { de: Zeitformen, en: Tenses }
    can_do:
      de: Ich kann die Vergangenheit im Präteritum bilden, bei schwachen und starken Verben (spielte, ging).
      en: I can form the simple past of weak and strong verbs.
    prerequisites: { hard: [lit-de.verbs.present] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.verbs.perfect
    topic: { de: Zeitformen, en: Tenses }
    can_do:
      de: Ich kann das Perfekt mit haben und sein bilden (ich habe gespielt, ich bin gelaufen) und weiß, dass man es oft beim Erzählen sagt.
      en: I can form the perfect tense with haben and sein and know that it is often used when speaking.
    prerequisites: { hard: [lit-de.verbs.simple-past] }
    standards: [kmk-deutsch-2022.sp.11, kmk-deutsch-2022.sp.5]

  - id: lit-de.verbs.future
    topic: { de: Zeitformen, en: Tenses }
    can_do:
      de: Ich kann die Zukunft mit werden bilden (ich werde spielen).
      en: I can form the future with werden.
    prerequisites: { hard: [lit-de.verbs.perfect] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.verbs.tenses-mixed
    topic: { de: Zeitformen, en: Tenses }
    can_do:
      de: Ich kann die Zeitformen bestimmen und in einem Text die passende Zeitform durchhalten.
      en: I can name the tenses and keep to the right tense throughout a text.
    prerequisites: { hard: [lit-de.verbs.future] }
    standards: [kmk-deutsch-2022.sp.11, kmk-deutsch-2022.sch.18]

  - id: lit-de.verbs.imperative
    topic: { de: Verben, en: Verbs }
    can_do:
      de: Ich kann Verben in der Aufforderungsform verwenden (Komm! Kommt! Lies!).
      en: I can use verbs in the imperative.
    prerequisites: { hard: [lit-de.verbs.present] }
    standards: [kmk-deutsch-2022.sp.11]

  - id: lit-de.verbs.compound
    topic: { de: Verben, en: Verbs }
    can_do:
      de: Ich kann zusammengesetzte Verben bilden und weiß, dass sich ihr Vorderteil im Satz abtrennen kann (einkaufen, ich kaufe ein).
      en: I can form compound verbs and know that their front part can split off in a sentence.
    prerequisites: { hard: [lit-de.verbs.prefixes] }
    standards: [kmk-deutsch-2022.sp.9, kmk-deutsch-2022.sp.12]
