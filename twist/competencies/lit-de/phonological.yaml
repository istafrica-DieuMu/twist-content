progression: lit-de.phonological
title: { de: Laute hören, en: Hearing sounds }
skills:
  - id: lit-de.phonological.rhymes
    topic: { de: Laute hören, en: Hearing sounds }
    can_do:
      de: Ich kann hören, ob sich zwei Wörter reimen, und selbst Reimwörter finden.
      en: I can hear whether two words rhyme and find rhyming words myself.
    standards: [kmk-deutsch-2022.sp.14, kmk-deutsch-2022.sp.16]

  - id: lit-de.phonological.syllables
    topic: { de: Laute hören, en: Hearing sounds }
    can_do:
      de: Ich kann Wörter in Silben klatschen und sagen, wie viele Silben ein Wort hat.
      en: I can clap words into syllables and say how many syllables a word has.
    standards: [kmk-deutsch-2022.les.1]

  - id: lit-de.phonological.initial-sound
    topic: { de: Laute hören, en: Hearing sounds }
    can_do:
      de: Ich kann den Anlaut eines Wortes hören und Wörter mit gleichem Anlaut finden.
      en: I can hear the first sound of a word and find words that start with the same sound.
    prerequisites: { soft: [lit-de.phonological.rhymes, lit-de.phonological.syllables] }
    standards: [kmk-deutsch-2022.les.1]

  - id: lit-de.phonological.sounds-in-words
    topic: { de: Laute hören, en: Hearing sounds }
    can_do:
      de: Ich kann hören, ob ein Laut am Anfang, in der Mitte oder am Ende eines Wortes steht, und kurze Wörter in ihre Laute zerlegen.
      en: I can hear whether a sound is at the start, middle or end of a word and split short words into their sounds.
    prerequisites: { hard: [lit-de.phonological.initial-sound] }
    standards: [kmk-deutsch-2022.les.1, kmk-deutsch-2022.sch.4]
