progression: lit-de.vocabulary
title: { de: Wortschatz und Sprache untersuchen, en: Vocabulary and language }
order: free
steps:
  - id: lit-de.vocabulary.categories
    topic: { de: Wortschatz, en: Vocabulary }
    can_do:
      de: Ich kann Wörter nach Oberbegriffen ordnen (Obst, Tiere, Möbel) und zu einem Oberbegriff passende Wörter finden.
      en: I can sort words under umbrella terms (fruit, animals, furniture) and find words for a category.
    prerequisites: { hard: [lit-de.decoding.word-picture] }
    objectives: [kmk-deutsch-2022.sp.10, kmk-deutsch-2022.sz.2]

  - id: lit-de.vocabulary.word-fields
    topic: { de: Wortschatz, en: Vocabulary }
    can_do:
      de: Ich kann Wortfelder sammeln (gehen, laufen, rennen, schleichen) und das treffende Wort auswählen.
      en: I can collect words with similar meanings and choose the most precise one.
    prerequisites: { hard: [lit-de.vocabulary.categories, lit-de.verbs.recognise] }
    objectives: [kmk-deutsch-2022.sp.10, kmk-deutsch-2022.sch.13]

  - id: lit-de.vocabulary.idioms
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann Redewendungen verstehen und erklären (jemandem einen Bären aufbinden).
      en: I can understand and explain idioms.
    prerequisites: { hard: [lit-de.comprehension.infer] }
    objectives: [kmk-deutsch-2022.sp.10, kmk-deutsch-2022.sp.16]

  - id: lit-de.vocabulary.foreign-words
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann Fremdwörter im Deutschen erkennen und herausfinden, woher sie kommen und was sie bedeuten.
      en: I can spot borrowed words in German and find out where they come from and what they mean.
    prerequisites: { hard: [lit-de.spelling.ph-v-foreign] }
    objectives: [kmk-deutsch-2022.sch.6, kmk-deutsch-2022.sp.8]

  - id: lit-de.vocabulary.spoken-written
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann Unterschiede zwischen gesprochener und geschriebener Sprache beschreiben und Alltagssprache in Standardsprache umformulieren.
      en: I can describe how spoken and written language differ and rephrase everyday speech in standard German.
    prerequisites: { hard: [lit-de.verbs.perfect] }
    objectives: [kmk-deutsch-2022.sp.5, kmk-deutsch-2022.sp.6, kmk-deutsch-2022.sz.1]

  - id: lit-de.vocabulary.languages
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann Wörter in verschiedenen Sprachen und Dialekten vergleichen und Gemeinsamkeiten und Unterschiede entdecken.
      en: I can compare words in different languages and dialects and spot what is the same and what differs.
    objectives: [kmk-deutsch-2022.sp.7, kmk-deutsch-2022.sp.8]

  - id: lit-de.vocabulary.language-effect
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann untersuchen, wie dieselbe Sache freundlich, unhöflich, sachlich oder werbend gesagt werden kann und wie das wirkt.
      en: I can explore how the same thing can be said politely, rudely, neutrally or persuasively, and what effect it has.
    prerequisites: { hard: [lit-de.comprehension.infer] }
    objectives: [kmk-deutsch-2022.sp.1, kmk-deutsch-2022.sp.2, kmk-deutsch-2022.sp.3]

  - id: lit-de.vocabulary.digital-communication
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann beschreiben, wie Menschen in Nachrichten, Chats und Videoanrufen miteinander sprechen, und welche Regeln dort gelten.
      en: I can describe how people talk in messages, chats and video calls and which rules apply there.
    prerequisites: { hard: [lit-de.vocabulary.spoken-written] }
    objectives: [kmk-deutsch-2022.sp.4, kmk-deutsch-2022.sz.8]

  - id: lit-de.vocabulary.language-play
    topic: { de: Sprache untersuchen, en: Exploring language }
    can_do:
      de: Ich kann mit Sprache spielen, zum Beispiel mit Zungenbrechern, Wortspielen, Unsinnswörtern und Sprachspielereien.
      en: I can play with language, for example with tongue twisters, word games and nonsense words.
    prerequisites: { hard: [lit-de.phonological.rhymes] }
    objectives: [kmk-deutsch-2022.sp.14]
