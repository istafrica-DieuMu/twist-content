progression: lit-de.speaking
title: { de: Sprechen und Zuhören, en: Speaking and listening }
order: free
steps:
  - id: lit-de.speaking.listen-follow
    topic: { de: Sprechen und Zuhören, en: Speaking and listening }
    can_do:
      de: Ich kann genau zuhören und mündliche Anweisungen mit mehreren Schritten ausführen.
      en: I can listen carefully and follow spoken instructions with several steps.
    objectives: [kmk-deutsch-2022.sz.10, kmk-deutsch-2022.sz.11]

  - id: lit-de.speaking.listen-understand
    topic: { de: Sprechen und Zuhören, en: Speaking and listening }
    can_do:
      de: Ich kann einem Hörtext zuhören, wichtige Informationen wiedergeben und nachfragen, wenn ich etwas nicht verstehe.
      en: I can listen to an audio text, pass on the key information and ask when I do not understand.
    prerequisites: { hard: [lit-de.speaking.listen-follow] }
    objectives: [kmk-deutsch-2022.sz.10, kmk-deutsch-2022.sz.9, kmk-deutsch-2022.sz.11]

  - id: lit-de.speaking.tell
    topic: { de: Erzählen, en: Telling stories }
    can_do:
      de: Ich kann ein Erlebnis oder eine Geschichte verständlich und in der richtigen Reihenfolge erzählen.
      en: I can tell about something that happened, or tell a story, clearly and in the right order.
    objectives: [kmk-deutsch-2022.sz.3, kmk-deutsch-2022.sz.5, kmk-deutsch-2022.sz.1]

  - id: lit-de.speaking.describe-explain
    topic: { de: Sprechen und Zuhören, en: Speaking and listening }
    can_do:
      de: Ich kann etwas mündlich beschreiben und erklären, sodass andere es verstehen.
      en: I can describe and explain something aloud so that others understand.
    prerequisites: { hard: [lit-de.speaking.tell] }
    objectives: [kmk-deutsch-2022.sz.3, kmk-deutsch-2022.sz.14]

  - id: lit-de.speaking.feelings
    topic: { de: Sprechen und Zuhören, en: Speaking and listening }
    can_do:
      de: Ich kann Gefühle benennen und sagen, wie es mir oder einer Figur geht.
      en: I can name feelings and say how I, or a character, feel.
    objectives: [kmk-deutsch-2022.sz.2, kmk-deutsch-2022.sz.3]

  - id: lit-de.speaking.rhymes-tongue-twisters
    topic: { de: Sprechen und Zuhören, en: Speaking and listening }
    can_do:
      de: Ich kann Reime, Abzählverse und Zungenbrecher deutlich nachsprechen.
      en: I can say rhymes, counting-out verses and tongue twisters clearly.
    prerequisites: { hard: [lit-de.phonological.rhymes] }
    objectives: [kmk-deutsch-2022.sz.6, kmk-deutsch-2022.sp.19]

  - id: lit-de.speaking.argue
    topic: { de: Sprechen und Zuhören, en: Speaking and listening }
    can_do:
      de: Ich kann meine Meinung sagen und mit einem Grund stützen, und ich kann jemanden höflich um etwas bitten.
      en: I can give my opinion with a reason, and ask someone politely for something.
    prerequisites: { hard: [lit-de.speaking.describe-explain] }
    objectives: [kmk-deutsch-2022.sz.3, kmk-deutsch-2022.sz.14]

  - id: lit-de.speaking.conversation-rules
    topic: { de: Gespräche führen, en: Having conversations }
    can_do:
      de: Ich kenne Gesprächsregeln (zuhören, ausreden lassen, auf andere eingehen) und erkenne, wann sie in einem Gespräch eingehalten werden.
      en: I know conversation rules (listen, let others finish, respond to them) and can tell when a conversation follows them.
    prerequisites: { hard: [lit-de.speaking.listen-understand] }
    objectives: [kmk-deutsch-2022.sz.13, kmk-deutsch-2022.sz.12, kmk-deutsch-2022.sz.17, kmk-deutsch-2022.sp.15]

  - id: lit-de.speaking.short-talk
    topic: { de: Vor anderen sprechen, en: Speaking to an audience }
    can_do:
      de: Ich kann mit einem Stichwortzettel einen kurzen Vortrag zu einem Thema vorbereiten und halten.
      en: I can prepare and give a short talk on a topic with notes on a cue card.
    prerequisites: { hard: [lit-de.speaking.describe-explain, lit-de.comprehension.notes] }
    objectives: [kmk-deutsch-2022.sz.19, kmk-deutsch-2022.sz.4, kmk-deutsch-2022.sz.21, kmk-deutsch-2022.sz.6]

  - id: lit-de.speaking.record-voice
    topic: { de: Vor anderen sprechen, en: Speaking to an audience }
    can_do:
      de: Ich kann meine Stimme aufnehmen, mir zuhören und meine Aussprache, Lautstärke und mein Tempo verbessern.
      en: I can record my voice, listen back and improve my pronunciation, volume and pace.
    prerequisites: { hard: [lit-de.speaking.tell] }
    objectives: [kmk-deutsch-2022.sz.8, kmk-deutsch-2022.sz.6, kmk-deutsch-2022.sp.19]

  - id: lit-de.speaking.interview
    topic: { de: Gespräche führen, en: Having conversations }
    can_do:
      de: Ich kann Fragen für ein Interview vorbereiten und die Antworten festhalten.
      en: I can prepare questions for an interview and note down the answers.
    prerequisites: { hard: [lit-de.speaking.argue, lit-de.sentences.questions] }
    objectives: [kmk-deutsch-2022.sz.16, kmk-deutsch-2022.sz.17]
