progression: lit-de.handwriting
title: { de: Schrift, en: Handwriting }
skills:
  - id: lit-de.handwriting.print-letters
    topic: { de: Schreiben lernen, en: Learning to write }
    can_do:
      de: Ich kann die Buchstaben in Druckschrift in der richtigen Bewegung und Größe zwischen den Linien schreiben.
      en: I can form printed letters with the right movement and size between the lines.
    prerequisites: { hard: [lit-de.letters.l-o-a-m] }
    facets: [script]
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.2]

  - id: lit-de.handwriting.copy-words
    topic: { de: Erste Wörter schreiben, en: Writing first words }
    can_do:
      de: Ich kann Wörter fehlerfrei abschreiben, indem ich mir Silben oder ganze Wörter merke.
      en: I can copy words without mistakes by remembering syllables or whole words.
    prerequisites: { hard: [lit-de.handwriting.print-letters, lit-de.decoding.two-syllable-words] }
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.5]

  - id: lit-de.handwriting.copy-sentences
    topic: { de: Erste Sätze schreiben, en: Writing first sentences }
    can_do:
      de: Ich kann kurze Sätze sauber und fehlerfrei abschreiben, mit Abständen zwischen den Wörtern.
      en: I can copy short sentences neatly and correctly, with spaces between the words.
    prerequisites: { hard: [lit-de.handwriting.copy-words] }
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.3]

  - id: lit-de.handwriting.joined-lowercase
    topic: { de: Schreibschrift, en: Joined handwriting }
    can_do:
      de: Ich kann die kleinen Buchstaben in Schreibschrift schreiben und miteinander verbinden.
      en: I can write the lowercase letters in joined script and link them together.
    prerequisites: { hard: [lit-de.handwriting.copy-sentences] }
    facets: [script]
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.2]

  - id: lit-de.handwriting.joined-capitals
    topic: { de: Schreibschrift, en: Joined handwriting }
    can_do:
      de: Ich kann die großen Buchstaben in Schreibschrift schreiben und an die kleinen anschließen.
      en: I can write the capital letters in joined script and link them to lowercase letters.
    prerequisites: { hard: [lit-de.handwriting.joined-lowercase] }
    facets: [script]
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.2]

  - id: lit-de.handwriting.joined-fluent
    topic: { de: Schreibschrift, en: Joined handwriting }
    can_do:
      de: Ich kann Wörter und Sätze flüssig und gut lesbar in Schreibschrift schreiben.
      en: I can write words and sentences fluently and legibly in joined script.
    prerequisites: { hard: [lit-de.handwriting.joined-capitals] }
    facets: [script]
    standards: [kmk-deutsch-2022.sch.1, kmk-deutsch-2022.sch.2]

  - id: lit-de.handwriting.layout
    topic: { de: Texte gestalten, en: Laying out text }
    can_do:
      de: Ich kann einen Text übersichtlich gestalten, mit Überschrift, Absätzen und Rand, mit der Hand und am Computer.
      en: I can lay out a text clearly, with a heading, paragraphs and margins, by hand and on a computer.
    prerequisites: { hard: [lit-de.handwriting.copy-sentences] }
    standards: [kmk-deutsch-2022.sch.3, kmk-deutsch-2022.sch.22]

  - id: lit-de.handwriting.keyboard
    topic: { de: Texte gestalten, en: Laying out text }
    can_do:
      de: Ich kann kurze Texte auf der Tastatur schreiben, mit Großbuchstaben, Umlauten und Satzzeichen, und sie am Bildschirm verbessern.
      en: I can type short texts on a keyboard, with capitals, umlauts and punctuation, and correct them on screen.
    prerequisites: { hard: [lit-de.handwriting.copy-sentences] }
    standards: [kmk-deutsch-2022.sch.2, kmk-deutsch-2022.sch.27]
