progression: lit-en.spelling
title: { de: Rechtschreibung, en: Spelling }
# Spelling rules and word lists by year are in English Appendix 1 of the National Curriculum.
skills:
  - id: lit-en.spelling.segment-spell
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann Wörter schreiben, indem ich die Laute spreche und für jeden Laut Buchstaben schreibe."
      en: "I can spell words by saying the sounds and writing a letter or letters for each sound."
    prerequisites: { hard: [lit-en.phonological.oral-blending, lit-en.phonics.s-a-t-p] }
    standards: [eyfs-2026.elg.writing.2, nc-english-2014.y1.writing-transcription.spelling.1, nc-english-2014.y2.writing-transcription.spelling.1]

  - id: lit-en.spelling.exception-words-y1
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann die Ausnahmewörter für Year 1 und die Wochentage richtig schreiben."
      en: "I can spell the Year 1 common exception words and the days of the week."
    prerequisites: { hard: [lit-en.spelling.segment-spell, lit-en.word-reading.exception-words-y1] }
    standards: [nc-english-2014.y1.writing-transcription.spelling.2, nc-english-2014.y1.writing-transcription.spelling.3]

  - id: lit-en.spelling.alphabet-names
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann die Buchstabennamen des Alphabets der Reihe nach nennen und damit über Schreibungen desselben Lauts sprechen."
      en: "I can name the letters of the alphabet in order and use letter names to talk about spellings of the same sound."
    prerequisites: { hard: [lit-en.phonics.ear-air-ure-er] }
    standards: [nc-english-2014.y1.writing-transcription.spelling.4, nc-english-2014.y1.writing-transcription.spelling.5]

  - id: lit-en.spelling.plural-s-es
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann -s oder -es anhängen, um Mehrzahl und Verbformen zu bilden (dogs, wishes, he runs)."
      en: "I can add -s or -es to make plurals and verb forms (dogs, wishes, he runs)."
    prerequisites: { hard: [lit-en.spelling.segment-spell] }
    standards: [nc-english-2014.y1.writing-transcription.spelling.6, nc-english-2014.y1.writing-transcription.spelling.9]

  - id: lit-en.spelling.un-ing-ed-er-est
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann un- und die Endungen -ing, -ed, -er und -est anhängen, wenn sich das Grundwort nicht ändert (unkind, helping, quickest)."
      en: "I can add un- and the endings -ing, -ed, -er and -est when the root word does not change (unkind, helping, quickest)."
    prerequisites: { hard: [lit-en.spelling.plural-s-es] }
    standards: [nc-english-2014.y1.writing-transcription.spelling.7, nc-english-2014.y1.writing-transcription.spelling.8, nc-english-2014.y1.writing-transcription.spelling.9]

  - id: lit-en.spelling.dictation-y1
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann einfache diktierte Sätze mit gelernten Lauten und Ausnahmewörtern schreiben."
      en: "I can write simple dictated sentences with the sounds and tricky words I have learnt."
    prerequisites: { hard: [lit-en.spelling.exception-words-y1] }
    standards: [nc-english-2014.y1.writing-transcription.spelling.10, nc-english-2014.y2.writing-transcription.spelling.9, nc-english-2014.y34.writing-transcription.spelling.6]

  - id: lit-en.spelling.alternative-spellings
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kenne verschiedene Schreibungen für denselben Laut (ai, ay, a-e) und lerne Wörter mit jeder Schreibung."
      en: "I know different ways of spelling the same sound (ai, ay, a-e) and learn words with each spelling."
    prerequisites: { hard: [lit-en.spelling.segment-spell, lit-en.phonics.split-digraphs] }
    standards: [nc-english-2014.y2.writing-transcription.spelling.2, nc-english-2014.y2.writing-transcription.spelling.8]

  - id: lit-en.spelling.exception-words-y2
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann die Ausnahmewörter für Year 2 richtig schreiben."
      en: "I can spell the Year 2 common exception words."
    prerequisites: { hard: [lit-en.spelling.exception-words-y1] }
    standards: [nc-english-2014.y2.writing-transcription.spelling.3]

  - id: lit-en.spelling.contractions-possessive
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann Kurzformen schreiben (can't, didn't) und den Apostroph für den Besitz im Singular setzen (the girl's book)."
      en: "I can spell contractions (can't, didn't) and use the apostrophe for singular possession (the girl's book)."
    prerequisites: { hard: [lit-en.word-reading.contractions] }
    standards: [nc-english-2014.y2.writing-transcription.spelling.4, nc-english-2014.y2.writing-transcription.spelling.5]

  - id: lit-en.spelling.homophones
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann gleich klingende Wörter unterscheiden und richtig schreiben (there, their, they're)."
      en: "I can tell apart and spell homophones and near-homophones (there, their, they're; to, too, two)."
    prerequisites: { hard: [lit-en.spelling.exception-words-y2] }
    standards: [nc-english-2014.y2.writing-transcription.spelling.6, nc-english-2014.y34.writing-transcription.spelling.2, nc-english-2014.y56.writing-transcription.spelling.3]

  - id: lit-en.spelling.suffixes-y2
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann die Nachsilben -ment, -ness, -ful, -less und -ly anhängen, um längere Wörter zu schreiben."
      en: "I can add the suffixes -ment, -ness, -ful, -less and -ly to spell longer words."
    prerequisites: { hard: [lit-en.spelling.un-ing-ed-er-est] }
    standards: [nc-english-2014.y2.writing-transcription.spelling.7, nc-english-2014.y2.writing-transcription.spelling.8]

  - id: lit-en.spelling.prefixes-suffixes-ks2
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann weitere Vorsilben und Nachsilben anhängen (dis-, mis-, re-, sub-; -ation, -ous, -tion, -sion) und weiß, wie man sie anfügt."
      en: "I can add further prefixes and suffixes (dis-, mis-, re-, sub-, inter-; -ation, -ous, -tion, -sion, -cian) and know how to add them."
    prerequisites: { hard: [lit-en.spelling.suffixes-y2] }
    standards: [nc-english-2014.y34.writing-transcription.spelling.1]

  - id: lit-en.spelling.word-list-3-4
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann die oft falsch geschriebenen Wörter der Liste für Year 3 und 4 richtig schreiben."
      en: "I can spell the words that are often misspelt from the Year 3 and 4 list."
    prerequisites: { hard: [lit-en.spelling.exception-words-y2] }
    standards: [nc-english-2014.y34.writing-transcription.spelling.3]

  - id: lit-en.spelling.plural-possessive
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann den Apostroph für den Besitz auch im Plural richtig setzen (girls', children's)."
      en: "I can place the possessive apostrophe in regular and irregular plurals (girls', children's)."
    prerequisites: { hard: [lit-en.spelling.contractions-possessive] }
    standards: [nc-english-2014.y34.writing-transcription.spelling.4, nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.8]

  - id: lit-en.spelling.dictionary-ks2
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann eine Schreibung im Wörterbuch mit den ersten zwei oder drei Buchstaben nachschlagen."
      en: "I can check a spelling in a dictionary using the first two or three letters of the word."
    prerequisites: { hard: [lit-en.spelling.alphabet-names] }
    standards: [nc-english-2014.y34.writing-transcription.spelling.5]

  - id: lit-en.spelling.suffixes-ks2-upper
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann weitere Nachsilben verwenden und kenne die Regeln dafür (-cious, -tious, -cial, -ant, -able, -ible)."
      en: "I can use further suffixes and know the guidance for adding them (-cious, -tious, -cial, -tial, -ant, -ent, -able, -ible, -fer)."
    prerequisites: { hard: [lit-en.spelling.prefixes-suffixes-ks2] }
    standards: [nc-english-2014.y56.writing-transcription.spelling.1]

  - id: lit-en.spelling.silent-letters
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann Wörter mit stummen Buchstaben schreiben (knight, psalm, solemn)."
      en: "I can spell words with silent letters (knight, psalm, solemn)."
    prerequisites: { hard: [lit-en.spelling.word-list-3-4] }
    standards: [nc-english-2014.y56.writing-transcription.spelling.2]

  - id: lit-en.spelling.word-list-5-6
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich nutze Wortbausteine und Wortherkunft zum Schreiben und kann die Wörter der Liste für Year 5 und 6."
      en: "I use what I know about word parts and word origins to spell, and I have learnt the words on the Year 5 and 6 list."
    prerequisites: { hard: [lit-en.spelling.suffixes-ks2-upper] }
    standards: [nc-english-2014.y56.writing-transcription.spelling.4]

  - id: lit-en.spelling.dictionary-thesaurus
    topic: { de: "Rechtschreibung", en: "Spelling" }
    can_do:
      de: "Ich kann im Wörterbuch Schreibung und Bedeutung nachschlagen und im Thesaurus passendere Wörter finden."
      en: "I can use a dictionary with the first three or four letters to check spelling and meaning, and use a thesaurus to find better words."
    prerequisites: { hard: [lit-en.spelling.dictionary-ks2] }
    standards: [nc-english-2014.y56.writing-transcription.spelling.5, nc-english-2014.y56.writing-transcription.spelling.6, nc-english-2014.y56.writing-transcription.spelling.7]
