progression: lit-en.grammar
title: { de: Grammatik und Zeichensetzung, en: Grammar and punctuation }
# Content by year from English Appendix 2 of the National Curriculum.
skills:
  - id: lit-en.grammar.finger-spaces
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich lasse beim Schreiben Lücken zwischen den Wörtern."
      en: "I leave spaces between words when I write."
    prerequisites: { hard: [lit-en.handwriting.lowercase] }
    standards: [nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.1]

  - id: lit-en.grammar.sentences-and
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Wörter zu Sätzen verbinden und Wörter und Sätze mit and verbinden."
      en: "I can combine words to make a sentence and join words and clauses with and."
    prerequisites: { hard: [lit-en.grammar.finger-spaces] }
    standards: [nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.2, nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.5]

  - id: lit-en.grammar.sentence-punctuation
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich beginne Sätze groß und beende sie mit Punkt, Fragezeichen oder Ausrufezeichen."
      en: "I start a sentence with a capital letter and end it with a full stop, question mark or exclamation mark."
    prerequisites: { hard: [lit-en.grammar.sentences-and] }
    standards: [nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.3, nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.1]

  - id: lit-en.grammar.capitals-names
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich schreibe Namen von Personen, Orten, Wochentagen und das Wort I groß."
      en: "I use capital letters for names of people, places, days of the week and for I."
    prerequisites: { hard: [lit-en.grammar.sentence-punctuation] }
    standards: [nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.4]

  - id: lit-en.grammar.terms-y1
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kenne und verwende die Fachwörter für Buchstaben, Wörter, Sätze und Satzzeichen."
      en: "I know and use the words letter, capital letter, word, singular, plural, sentence, punctuation, full stop, question mark and exclamation mark."
    prerequisites: { hard: [lit-en.grammar.capitals-names] }
    standards: [nc-english-2014.y1.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.sentence-types
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Aussagesätze, Fragen, Ausrufe und Aufforderungen schreiben und sagen, wozu sie dienen."
      en: "I can write statements, questions, exclamations and commands and say what each is for."
    prerequisites: { hard: [lit-en.grammar.sentence-punctuation] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.2, nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.noun-phrases
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann erweiterte Nominalgruppen zum Beschreiben verwenden (the blue butterfly)."
      en: "I can use expanded noun phrases to describe and specify (the blue butterfly)."
    prerequisites: { hard: [lit-en.grammar.sentences-and] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.3, nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.word-classes
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich erkenne Nomen, Adjektive, Verben und Adverbien und bilde Wörter mit Nachsilben und durch Zusammensetzen."
      en: "I can recognise nouns, adjectives, verbs and adverbs and form words with suffixes and by compounding (-ness, -er, -ful, -less, -ly, whiteboard)."
    prerequisites: { hard: [lit-en.grammar.terms-y1] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.6, nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.8]

  - id: lit-en.grammar.tense-progressive
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende Gegenwart und Vergangenheit richtig und durchgehend, auch die Verlaufsform."
      en: "I use the present and past tense correctly and consistently, including the progressive form (she is drumming, he was shouting)."
    prerequisites: { hard: [lit-en.grammar.word-classes] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.4]

  - id: lit-en.grammar.conjunctions-y2
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Teilsätze mit when, if, that, because und mit or, and, but verbinden."
      en: "I can join clauses with when, if, that and because, and with or, and and but."
    prerequisites: { hard: [lit-en.grammar.sentences-and] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.5]

  - id: lit-en.grammar.standard-english
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende Merkmale des geschriebenen Standardenglisch (we were, nicht we was)."
      en: "I can use features of written Standard English (we were, not we was)."
    prerequisites: { hard: [lit-en.grammar.tense-progressive] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.7]

  - id: lit-en.grammar.commas-lists
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich setze Kommas zwischen Aufzählungen."
      en: "I use commas to separate items in a list."
    prerequisites: { hard: [lit-en.grammar.sentence-punctuation] }
    standards: [nc-english-2014.y2.writing-vocabulary-grammar-and-punctuation.1]

  - id: lit-en.grammar.a-an-word-families
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende a und an richtig und kenne Wortfamilien und Vorsilben, die Nomen bilden (super-, anti-, auto-)."
      en: "I use a or an correctly and know word families and prefixes that form nouns (super-, anti-, auto-)."
    prerequisites: { hard: [lit-en.grammar.word-classes] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.time-cause
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Zeit, Ort und Grund mit Konjunktionen, Adverbien und Präpositionen ausdrücken."
      en: "I can express time, place and cause with conjunctions, adverbs and prepositions (before, after, so, then, because of)."
    prerequisites: { hard: [lit-en.grammar.conjunctions-y2] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.1, nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.4]

  - id: lit-en.grammar.present-perfect
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann das present perfect statt der einfachen Vergangenheit verwenden (He has gone out to play)."
      en: "I can use the present perfect instead of the simple past (He has gone out to play)."
    prerequisites: { hard: [lit-en.grammar.tense-progressive] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.2]

  - id: lit-en.grammar.inverted-commas
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich setze Anführungszeichen bei wörtlicher Rede."
      en: "I use inverted commas to punctuate direct speech."
    prerequisites: { hard: [lit-en.grammar.sentence-punctuation] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.9]

  - id: lit-en.grammar.terms-y3
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kenne und verwende die Fachwörter für Präposition, Konjunktion, Wortfamilie, Teilsatz und wörtliche Rede."
      en: "I know and use the terms preposition, conjunction, word family, prefix, clause, subordinate clause, direct speech, consonant, vowel and inverted commas."
    prerequisites: { hard: [lit-en.grammar.time-cause, lit-en.grammar.inverted-commas] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.10]

  - id: lit-en.grammar.plural-possessive-s
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kenne den Unterschied zwischen Plural-s und Besitz-s."
      en: "I know the difference between plural -s and possessive -s."
    prerequisites: { hard: [lit-en.spelling.contractions-possessive] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.standard-verb-forms
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende die Verbformen des Standardenglisch statt mundartlicher Formen (I did, nicht I done)."
      en: "I use Standard English verb forms instead of local spoken forms (I did, not I done)."
    prerequisites: { hard: [lit-en.grammar.standard-english] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.expanded-noun-phrases
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Nominalgruppen mit Adjektiven, Nomen und Präpositionalgruppen erweitern."
      en: "I can expand noun phrases with adjectives, nouns and prepositional phrases (the strict maths teacher with curly hair)."
    prerequisites: { hard: [lit-en.grammar.noun-phrases] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.fronted-adverbials
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann vorangestellte Adverbiale mit Komma verwenden (Later that day, I heard the news.)."
      en: "I can use fronted adverbials followed by a comma (Later that day, I heard the news.)."
    prerequisites: { hard: [lit-en.grammar.time-cause] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.5, nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.7]

  - id: lit-en.grammar.pronoun-cohesion
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich wähle Pronomen oder Nomen so, dass mein Text klar ist und sich nichts wiederholt, und kenne Begleiter und Possessivpronomen."
      en: "I choose pronouns or nouns to make my writing clear and avoid repetition, and know determiners and possessive pronouns."
    prerequisites: { hard: [lit-en.grammar.word-classes] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.3, nc-english-2014.y34.writing-composition.8]

  - id: lit-en.grammar.direct-speech-full
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich setze bei wörtlicher Rede alle Zeichen richtig, auch das Komma nach dem Begleitsatz."
      en: "I punctuate direct speech fully, with a comma after the reporting clause and end punctuation inside the inverted commas."
    prerequisites: { hard: [lit-en.grammar.inverted-commas, lit-en.grammar.commas-lists] }
    standards: [nc-english-2014.y34.writing-vocabulary-grammar-and-punctuation.9]

  - id: lit-en.grammar.verb-formation
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann aus Nomen und Adjektiven Verben bilden (-ate, -ise, -ify) und Vorsilben für Verben nutzen."
      en: "I can turn nouns or adjectives into verbs with suffixes (-ate, -ise, -ify) and use verb prefixes (dis-, de-, mis-, over-, re-)."
    prerequisites: { hard: [lit-en.grammar.a-an-word-families] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.7]

  - id: lit-en.grammar.relative-clauses
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Relativsätze mit who, which, where, when, whose oder that bilden."
      en: "I can use relative clauses beginning with who, which, where, when, whose or that."
    prerequisites: { hard: [lit-en.grammar.conjunctions-y2] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.6]

  - id: lit-en.grammar.modal-verbs
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann mit Modalverben und Adverbien ausdrücken, wie wahrscheinlich etwas ist."
      en: "I can show how likely something is with modal verbs and adverbs (might, should, perhaps, surely)."
    prerequisites: { hard: [lit-en.grammar.tense-progressive] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.5]

  - id: lit-en.grammar.parenthesis
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Klammern, Gedankenstriche oder Kommas für Einschübe und Kommas zur Klarheit setzen."
      en: "I can use brackets, dashes or commas for parenthesis and commas to make meaning clear."
    prerequisites: { hard: [lit-en.grammar.relative-clauses] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.10, nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.8]

  - id: lit-en.grammar.perfect-forms
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende die Perfektformen, um zeitliche und ursächliche Beziehungen zu zeigen (he had seen her before)."
      en: "I use the perfect forms of verbs to show relationships of time and cause (he had seen her before)."
    prerequisites: { hard: [lit-en.grammar.present-perfect] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.3]

  - id: lit-en.grammar.noun-phrases-concise
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende erweiterte Nominalgruppen, um viele Informationen knapp zu geben."
      en: "I use expanded noun phrases to give complicated information concisely."
    prerequisites: { hard: [lit-en.grammar.expanded-noun-phrases] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.4]

  - id: lit-en.grammar.formal-informal
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kenne den Unterschied zwischen umgangssprachlichem und förmlichem Wortschatz und Satzbau, auch Frageanhängsel und den Konjunktiv (If I were ...)."
      en: "I know the difference between informal and formal vocabulary and structures, including question tags and the subjunctive (If I were ...)."
    prerequisites: { hard: [lit-en.grammar.standard-verb-forms] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.1, nc-english-2014.y56.writing-composition.12]

  - id: lit-en.grammar.synonyms-antonyms
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich weiß, wie Wörter als Synonyme und Gegensätze zusammenhängen."
      en: "I know how words are related as synonyms and antonyms."
    prerequisites: { hard: [lit-en.grammar.word-classes] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.7]

  - id: lit-en.grammar.passive
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann das Passiv verwenden, um Informationen anders darzustellen (The window was broken by me)."
      en: "I can use the passive to change how information is presented (The window was broken by me)."
    prerequisites: { hard: [lit-en.grammar.perfect-forms] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.2]

  - id: lit-en.grammar.semicolons-colons
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich kann Semikolon, Doppelpunkt und Gedankenstrich zwischen Hauptsätzen setzen und einen Doppelpunkt vor einer Liste."
      en: "I can use semicolons, colons and dashes between independent clauses and a colon to introduce a list."
    prerequisites: { hard: [lit-en.grammar.parenthesis] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.11, nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.12]

  - id: lit-en.grammar.bullets-hyphens
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich setze Aufzählungspunkte einheitlich und verwende Bindestriche gegen Mehrdeutigkeit (man-eating shark)."
      en: "I punctuate bullet points consistently and use hyphens to avoid ambiguity (man-eating shark)."
    prerequisites: { hard: [lit-en.grammar.semicolons-colons] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.13, nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.9]

  - id: lit-en.grammar.terms-ks2
    topic: { de: "Grammatik und Zeichensetzung", en: "Grammar and punctuation" }
    can_do:
      de: "Ich verwende grammatische Fachbegriffe sicher, wenn ich über Texte spreche."
      en: "I use grammatical terms accurately when talking about my writing and reading (modal verb, relative clause, parenthesis, cohesion, subject, object, passive)."
    prerequisites: { hard: [lit-en.grammar.terms-y3] }
    standards: [nc-english-2014.y56.writing-vocabulary-grammar-and-punctuation.14]
