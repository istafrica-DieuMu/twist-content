progression: lit-en.comprehension
title: { de: Leseverstehen, en: Reading comprehension }
order: free
skills:
  - id: lit-en.comprehension.retell
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann eine gehörte Geschichte mit eigenen Worten nacherzählen und neue Wörter daraus verwenden."
      en: "I can retell a story I have heard in my own words, using new words from it."
    standards: [eyfs-2026.elg.comprehension.1, eyfs-2026.elg.comprehension.3, nc-english-2014.y1.reading-comprehension.3]

  - id: lit-en.comprehension.anticipate
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann sagen, was in einer Geschichte als Nächstes passieren könnte."
      en: "I can say what might happen next in a story."
    prerequisites: { hard: [lit-en.comprehension.retell] }
    standards: [eyfs-2026.elg.comprehension.2, nc-english-2014.y1.reading-comprehension.11, nc-english-2014.y2.reading-comprehension.13]

  - id: lit-en.comprehension.own-experiences
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann das Gelesene oder Gehörte mit meinem eigenen Leben verbinden."
      en: "I can link what I read or hear to my own life."
    prerequisites: { hard: [lit-en.comprehension.retell] }
    standards: [nc-english-2014.y1.reading-comprehension.2, nc-english-2014.y1.reading-comprehension.7, nc-english-2014.y2.reading-comprehension.9]

  - id: lit-en.comprehension.check-sense
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich prüfe, ob das Gelesene Sinn ergibt, und verbessere mich, wenn nicht."
      en: "I check that what I read makes sense and go back to correct myself when it does not."
    prerequisites: { hard: [lit-en.word-reading.decodable-books] }
    standards: [nc-english-2014.y1.reading-comprehension.8, nc-english-2014.y2.reading-comprehension.10]

  - id: lit-en.comprehension.title-events
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann erklären, warum der Titel und die wichtigsten Ereignisse einer Geschichte wichtig sind."
      en: "I can talk about why the title and the main events of a story matter."
    prerequisites: { hard: [lit-en.comprehension.retell] }
    standards: [nc-english-2014.y1.reading-comprehension.9, nc-english-2014.y1.reading-comprehension.13]

  - id: lit-en.comprehension.simple-inference
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann aus dem, was eine Figur sagt und tut, erschließen, was sie fühlt oder will."
      en: "I can work out what a character feels or wants from what they say and do."
    prerequisites: { hard: [lit-en.comprehension.title-events] }
    standards: [nc-english-2014.y1.reading-comprehension.10, nc-english-2014.y2.reading-comprehension.11]

  - id: lit-en.comprehension.sequence
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann die Ereignisse einer Geschichte ordnen und sagen, wie Informationen zusammenhängen."
      en: "I can put the events of a story in order and say how pieces of information are linked."
    prerequisites: { hard: [lit-en.comprehension.retell] }
    standards: [nc-english-2014.y2.reading-comprehension.2]

  - id: lit-en.comprehension.questions
    topic: { de: "Geschichten verstehen", en: "Understanding stories" }
    can_do:
      de: "Ich kann Fragen zu einem Text beantworten und selbst stellen."
      en: "I can answer and ask questions about what I have read."
    prerequisites: { hard: [lit-en.comprehension.simple-inference] }
    standards: [nc-english-2014.y2.reading-comprehension.12, nc-english-2014.y2.reading-comprehension.15, nc-english-2014.y34.reading-comprehension.10, nc-english-2014.y56.reading-comprehension.10]

  - id: lit-en.comprehension.word-meanings
    topic: { de: "Wörter im Text", en: "Words in texts" }
    can_do:
      de: "Ich kann über die Bedeutung von Wörtern sprechen und neue Wörter mit bekannten verbinden."
      en: "I can talk about what words mean and link new words to words I know."
    prerequisites: { hard: [lit-en.comprehension.retell] }
    standards: [nc-english-2014.y1.reading-comprehension.6, nc-english-2014.y2.reading-comprehension.6, nc-english-2014.y2.reading-comprehension.7]

  - id: lit-en.comprehension.words-in-context
    topic: { de: "Wörter im Text", en: "Words in texts" }
    can_do:
      de: "Ich kann erklären, was ein Wort im Zusammenhang bedeutet, und es im Wörterbuch nachschlagen."
      en: "I can explain what a word means in its context and check it in a dictionary."
    prerequisites: { hard: [lit-en.comprehension.word-meanings, lit-en.spelling.dictionary-ks2] }
    standards: [nc-english-2014.y34.reading-comprehension.3, nc-english-2014.y34.reading-comprehension.9, nc-english-2014.y56.reading-comprehension.9]

  - id: lit-en.comprehension.inference-evidence
    topic: { de: "Zwischen den Zeilen lesen", en: "Reading between the lines" }
    can_do:
      de: "Ich kann Gefühle, Gedanken und Beweggründe von Figuren erschließen und mit Textstellen belegen."
      en: "I can infer characters' feelings, thoughts and motives from their actions and back this up with evidence from the text."
    prerequisites: { hard: [lit-en.comprehension.simple-inference, lit-en.comprehension.questions] }
    standards: [nc-english-2014.y34.reading-comprehension.11, nc-english-2014.y56.reading-comprehension.11]

  - id: lit-en.comprehension.predict-implied
    topic: { de: "Zwischen den Zeilen lesen", en: "Reading between the lines" }
    can_do:
      de: "Ich kann aus ausdrücklichen und angedeuteten Hinweisen vorhersagen, was passieren könnte."
      en: "I can predict what might happen from details that are stated and implied."
    prerequisites: { hard: [lit-en.comprehension.anticipate, lit-en.comprehension.inference-evidence] }
    standards: [nc-english-2014.y34.reading-comprehension.12, nc-english-2014.y56.reading-comprehension.12]

  - id: lit-en.comprehension.main-ideas
    topic: { de: "Zwischen den Zeilen lesen", en: "Reading between the lines" }
    can_do:
      de: "Ich kann die Hauptgedanken über mehrere Absätze finden und zusammenfassen."
      en: "I can find the main ideas across several paragraphs and summarise them."
    prerequisites: { hard: [lit-en.comprehension.sequence] }
    standards: [nc-english-2014.y34.reading-comprehension.13, nc-english-2014.y56.reading-comprehension.13]

  - id: lit-en.comprehension.language-structure
    topic: { de: "Wie Texte wirken", en: "How texts work" }
    can_do:
      de: "Ich kann erklären, wie Sprache, Aufbau und Gestaltung zur Bedeutung beitragen."
      en: "I can say how language, structure and presentation help to make meaning."
    prerequisites: { hard: [lit-en.comprehension.words-in-context] }
    standards: [nc-english-2014.y34.reading-comprehension.14, nc-english-2014.y56.reading-comprehension.14, nc-english-2014.y34.reading-comprehension.7]

  - id: lit-en.comprehension.retrieve
    topic: { de: "Sachtexte", en: "Information texts" }
    can_do:
      de: "Ich kann Informationen in Sachtexten finden und notieren."
      en: "I can find and note information in non-fiction texts."
    prerequisites: { hard: [lit-en.texts.non-fiction-structures] }
    standards: [nc-english-2014.y34.reading-comprehension.15]

  - id: lit-en.comprehension.retrieve-present
    topic: { de: "Sachtexte", en: "Information texts" }
    can_do:
      de: "Ich kann Informationen aus mehreren Sachtexten finden, festhalten und vorstellen."
      en: "I can find, record and present information from several non-fiction texts."
    prerequisites: { hard: [lit-en.comprehension.retrieve, lit-en.comprehension.main-ideas] }
    standards: [nc-english-2014.y56.reading-comprehension.17]

  - id: lit-en.comprehension.fact-opinion
    topic: { de: "Sachtexte", en: "Information texts" }
    can_do:
      de: "Ich kann Tatsachen von Meinungen unterscheiden."
      en: "I can tell statements of fact from opinions."
    prerequisites: { hard: [lit-en.comprehension.retrieve] }
    standards: [nc-english-2014.y56.reading-comprehension.16]

  - id: lit-en.comprehension.figurative-language
    topic: { de: "Wie Texte wirken", en: "How texts work" }
    can_do:
      de: "Ich kann erklären, wie Autorinnen und Autoren Sprache, auch Vergleiche und Metaphern, einsetzen und wie sie wirkt."
      en: "I can explain how authors use language, including similes and metaphors, and its effect on the reader."
    prerequisites: { hard: [lit-en.comprehension.language-structure] }
    standards: [nc-english-2014.y56.reading-comprehension.15]

  - id: lit-en.comprehension.justify-views
    topic: { de: "Wie Texte wirken", en: "How texts work" }
    can_do:
      de: "Ich kann meine Meinung zu einem Text begründen und mit Textstellen stützen."
      en: "I can give reasons for my views about a text and support them with evidence."
    prerequisites: { hard: [lit-en.comprehension.inference-evidence] }
    standards: [nc-english-2014.y56.reading-comprehension.20, nc-english-2014.y56.reading-comprehension.19]

  - id: lit-en.comprehension.compare-books
    topic: { de: "Wie Texte wirken", en: "How texts work" }
    can_do:
      de: "Ich kann Figuren, Themen und Ideen in einem Buch und zwischen Büchern vergleichen."
      en: "I can compare characters, themes and ideas within a book and across books."
    prerequisites: { hard: [lit-en.texts.themes-conventions] }
    standards: [nc-english-2014.y56.reading-comprehension.6, nc-english-2014.y56.reading-comprehension.5]
