progression: lit-en.composition
title: { de: Texte schreiben, en: Writing }
skills:
  - id: lit-en.composition.phrases-sentences
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann einfache Wortgruppen und Sätze schreiben, die andere lesen können."
      en: "I can write simple phrases and sentences that other people can read."
    prerequisites: { hard: [lit-en.spelling.segment-spell, lit-en.handwriting.lowercase] }
    standards: [eyfs-2026.elg.writing.3]

  - id: lit-en.composition.say-then-write
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich sage laut, was ich schreiben will, und forme jeden Satz mündlich, bevor ich ihn schreibe."
      en: "I say out loud what I am going to write and compose each sentence aloud before I write it."
    prerequisites: { hard: [lit-en.composition.phrases-sentences] }
    standards: [nc-english-2014.y1.writing-composition.1, nc-english-2014.y1.writing-composition.2, nc-english-2014.y2.writing-composition.5, nc-english-2014.y2.writing-composition.7]

  - id: lit-en.composition.short-narrative
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann Sätze in eine Reihenfolge bringen und so eine kurze Geschichte erzählen."
      en: "I can put sentences in order to tell a short story."
    prerequisites: { hard: [lit-en.composition.say-then-write] }
    standards: [nc-english-2014.y1.writing-composition.3]

  - id: lit-en.composition.reread-check
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich lese meinen Text noch einmal, um zu prüfen, ob er Sinn ergibt."
      en: "I re-read what I have written to check it makes sense."
    prerequisites: { hard: [lit-en.composition.say-then-write] }
    standards: [nc-english-2014.y1.writing-composition.4, nc-english-2014.y2.writing-composition.9, nc-english-2014.y2.writing-composition.8]

  - id: lit-en.composition.read-own-writing
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich lese meinen Text deutlich und mit passender Betonung vor."
      en: "I read my writing aloud clearly, with intonation that makes the meaning clear."
    prerequisites: { hard: [lit-en.composition.reread-check] }
    standards: [nc-english-2014.y1.writing-composition.6, nc-english-2014.y2.writing-composition.11, nc-english-2014.y34.writing-composition.10]

  - id: lit-en.composition.narratives
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann Geschichten über eigene und fremde Erlebnisse schreiben, wahre und erfundene."
      en: "I can write stories about my own experiences and those of others, real and imagined."
    prerequisites: { hard: [lit-en.composition.short-narrative, lit-en.grammar.tense-progressive] }
    standards: [nc-english-2014.y2.writing-composition.1]

  - id: lit-en.composition.real-events
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann über wirkliche Ereignisse schreiben, zum Beispiel einen Bericht über einen Ausflug."
      en: "I can write about real events, such as a recount of a trip."
    prerequisites: { hard: [lit-en.composition.short-narrative] }
    standards: [nc-english-2014.y2.writing-composition.2]

  - id: lit-en.composition.poetry
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann einfache Gedichte schreiben."
      en: "I can write simple poems."
    prerequisites: { hard: [lit-en.texts.poems-by-heart] }
    standards: [nc-english-2014.y2.writing-composition.3]

  - id: lit-en.composition.purposes
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann für verschiedene Zwecke schreiben, zum Beispiel Anleitungen, Listen, Briefe und Beschriftungen."
      en: "I can write for different purposes, such as instructions, lists, letters and labels."
    prerequisites: { hard: [lit-en.composition.real-events] }
    standards: [nc-english-2014.y2.writing-composition.4]

  - id: lit-en.composition.plan-key-words
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich plane, indem ich Ideen und Schlüsselwörter notiere, auch neue Wörter."
      en: "I plan by noting ideas and key words, including new vocabulary."
    prerequisites: { hard: [lit-en.composition.say-then-write] }
    standards: [nc-english-2014.y2.writing-composition.6, nc-english-2014.y34.writing-composition.2]

  - id: lit-en.composition.proof-read
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich prüfe meinen Text auf Fehler in Rechtschreibung, Grammatik und Zeichensetzung und berichtige sie."
      en: "I proof-read my writing for spelling, grammar and punctuation errors and correct them."
    prerequisites: { hard: [lit-en.composition.reread-check] }
    standards: [nc-english-2014.y2.writing-composition.10, nc-english-2014.y34.writing-composition.9, nc-english-2014.y56.writing-composition.13]

  - id: lit-en.composition.learn-from-models
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich untersuche Mustertexte, um von ihrem Aufbau, Wortschatz und ihrer Grammatik zu lernen."
      en: "I study texts like the one I am going to write to learn from their structure, vocabulary and grammar."
    prerequisites: { hard: [lit-en.composition.plan-key-words] }
    standards: [nc-english-2014.y34.writing-composition.1]

  - id: lit-en.composition.rehearse-sentences
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich probiere Sätze mündlich aus, auch Dialoge, und nutze vielfältigen Wortschatz und Satzbau."
      en: "I rehearse sentences aloud, including dialogue, and build a varied, rich vocabulary and range of sentence structures."
    prerequisites: { hard: [lit-en.composition.say-then-write] }
    standards: [nc-english-2014.y34.writing-composition.3]

  - id: lit-en.composition.paragraphs
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich gliedere meinen Text in Absätze zu einem Thema."
      en: "I organise my writing into paragraphs around a theme."
    prerequisites: { hard: [lit-en.composition.narratives] }
    standards: [nc-english-2014.y34.writing-composition.4]

  - id: lit-en.composition.setting-character-plot
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich gestalte in meinen Geschichten Schauplatz, Figuren und Handlung."
      en: "I create settings, characters and a plot in my stories."
    prerequisites: { hard: [lit-en.composition.narratives] }
    standards: [nc-english-2014.y34.writing-composition.5]

  - id: lit-en.composition.headings
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich gliedere Sachtexte mit Überschriften und Zwischenüberschriften."
      en: "I use headings and sub-headings to organise non-fiction writing."
    prerequisites: { hard: [lit-en.composition.purposes] }
    standards: [nc-english-2014.y34.writing-composition.6]

  - id: lit-en.composition.evaluate-improve
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich beurteile, wie gut mein Text und andere Texte wirken, und schlage Verbesserungen vor."
      en: "I judge how well my writing and other people's writing works and suggest improvements to grammar and vocabulary."
    prerequisites: { hard: [lit-en.composition.proof-read] }
    standards: [nc-english-2014.y34.writing-composition.7, nc-english-2014.y34.writing-composition.8]

  - id: lit-en.composition.audience-purpose
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich wähle Form, Ton und Sprache meines Textes passend zu Leserin, Leser und Zweck."
      en: "I choose the form, tone and language of my writing to fit its audience and purpose."
    prerequisites: { hard: [lit-en.composition.learn-from-models] }
    standards: [nc-english-2014.y56.writing-composition.1, nc-english-2014.y56.writing-composition.4]

  - id: lit-en.composition.research-ideas
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich sammle und entwickle Ideen für meinen Text, auch aus Lektüre und Recherche."
      en: "I note and develop ideas for writing, drawing on reading and research."
    prerequisites: { hard: [lit-en.composition.plan-key-words, lit-en.comprehension.retrieve] }
    standards: [nc-english-2014.y56.writing-composition.2]

  - id: lit-en.composition.characters-atmosphere
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich beschreibe Schauplatz, Figuren und Stimmung und nutze Dialoge, um Figuren zu zeigen und die Handlung voranzubringen."
      en: "I describe settings, characters and atmosphere and use dialogue to show character and move the story on."
    prerequisites: { hard: [lit-en.composition.setting-character-plot, lit-en.grammar.direct-speech-full] }
    standards: [nc-english-2014.y56.writing-composition.3, nc-english-2014.y56.writing-composition.5]

  - id: lit-en.composition.precis
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich kann einen längeren Abschnitt kurz zusammenfassen und dabei die Hauptpunkte behalten."
      en: "I can shorten a longer passage into a précis that keeps its main points."
    prerequisites: { hard: [lit-en.comprehension.main-ideas] }
    standards: [nc-english-2014.y56.writing-composition.6]

  - id: lit-en.composition.cohesion
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich verbinde Gedanken in und zwischen Absätzen mit verschiedenen Mitteln."
      en: "I use a range of devices to link ideas within and across paragraphs (adverbials, pronouns, repetition, ellipsis)."
    prerequisites: { hard: [lit-en.composition.paragraphs, lit-en.grammar.fronted-adverbials] }
    standards: [nc-english-2014.y56.writing-composition.7]

  - id: lit-en.composition.presentational-devices
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich nutze Gestaltungsmittel wie Überschriften, Aufzählungspunkte, Spalten und Tabellen."
      en: "I use layout devices such as headings, bullet points, columns and tables to guide the reader."
    prerequisites: { hard: [lit-en.composition.headings] }
    standards: [nc-english-2014.y56.writing-composition.8]

  - id: lit-en.composition.edit-consistency
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich überarbeite meinen Text für Wirkung und Klarheit, halte die Zeitform durch und achte auf Übereinstimmung von Subjekt und Verb."
      en: "I edit to improve effects and clarity, keep the tense consistent and make subject and verb agree."
    prerequisites: { hard: [lit-en.composition.evaluate-improve] }
    standards: [nc-english-2014.y56.writing-composition.9, nc-english-2014.y56.writing-composition.10, nc-english-2014.y56.writing-composition.11, nc-english-2014.y56.writing-composition.12]

  - id: lit-en.composition.perform-compositions
    topic: { de: "Texte schreiben", en: "Writing" }
    can_do:
      de: "Ich trage meine eigenen Texte mit Betonung, Lautstärke und Bewegung vor."
      en: "I perform my own writing with intonation, volume and movement that make the meaning clear."
    prerequisites: { hard: [lit-en.composition.read-own-writing] }
    standards: [nc-english-2014.y56.writing-composition.14]
