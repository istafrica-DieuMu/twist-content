progression: lit-en.handwriting
title: { de: Handschrift, en: Handwriting }
skills:
  - id: lit-en.handwriting.pencil-grip
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich sitze gut und halte den Stift bequem im Dreipunktgriff."
      en: "I sit well and hold a pencil comfortably with a tripod grip."
    standards: [eyfs-2026.elg.fine-motor-skills.1, nc-english-2014.y1.writing-transcription.handwriting.1]

  - id: lit-en.handwriting.lowercase
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich kann Kleinbuchstaben in der richtigen Richtung schreiben und richtig beginnen und enden."
      en: "I can form lower-case letters in the right direction, starting and finishing in the right place."
    prerequisites: { hard: [lit-en.handwriting.pencil-grip] }
    standards: [eyfs-2026.elg.writing.1, nc-english-2014.y1.writing-transcription.handwriting.2]

  - id: lit-en.handwriting.capitals-digits
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich kann Großbuchstaben und die Ziffern 0 bis 9 schreiben."
      en: "I can form capital letters and the digits 0 to 9."
    prerequisites: { hard: [lit-en.handwriting.lowercase] }
    standards: [nc-english-2014.y1.writing-transcription.handwriting.3, nc-english-2014.y1.writing-transcription.handwriting.4]

  - id: lit-en.handwriting.letter-families
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich kenne die Buchstabenfamilien, die ähnlich geschrieben werden, und übe sie."
      en: "I know the handwriting families of letters that are formed in a similar way and practise them."
    prerequisites: { hard: [lit-en.handwriting.lowercase] }
    standards: [nc-english-2014.y1.writing-transcription.handwriting.5]

  - id: lit-en.handwriting.size-spacing
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich schreibe Buchstaben in passender Größe zueinander, passende Großbuchstaben und Ziffern und lasse passenden Abstand zwischen Wörtern."
      en: "I write letters of the right size compared with each other, capitals and digits that fit, and leave the right space between words."
    prerequisites: { hard: [lit-en.handwriting.capitals-digits] }
    standards: [nc-english-2014.y2.writing-transcription.handwriting.1, nc-english-2014.y2.writing-transcription.handwriting.3, nc-english-2014.y2.writing-transcription.handwriting.4]

  - id: lit-en.handwriting.start-joining
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich kann die schrägen und waagerechten Verbindungsstriche nutzen und weiß, welche Buchstaben man besser nicht verbindet."
      en: "I can use the diagonal and horizontal strokes that join letters and know which letters are best left unjoined."
    prerequisites: { hard: [lit-en.handwriting.letter-families] }
    standards: [nc-english-2014.y2.writing-transcription.handwriting.2, nc-english-2014.y34.writing-transcription.handwriting.1]

  - id: lit-en.handwriting.joined-legible
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich schreibe eine gut lesbare, gleichmäßige verbundene Schrift."
      en: "I write joined handwriting that is legible and consistent, with parallel downstrokes and even spacing."
    prerequisites: { hard: [lit-en.handwriting.start-joining] }
    standards: [nc-english-2014.y34.writing-transcription.handwriting.1, nc-english-2014.y34.writing-transcription.handwriting.2]

  - id: lit-en.handwriting.fluent-speed
    topic: { de: "Handschrift", en: "Handwriting" }
    can_do:
      de: "Ich schreibe lesbar, flüssig und zügig und wähle Buchstabenformen, Verbindungen und den passenden Stift."
      en: "I write legibly, fluently and with speed, choosing letter shapes, when to join and the best pen for the task."
    prerequisites: { hard: [lit-en.handwriting.joined-legible] }
    standards: [nc-english-2014.y56.writing-transcription.handwriting-and-presentation.1, nc-english-2014.y56.writing-transcription.handwriting-and-presentation.2]

  - id: lit-en.handwriting.keyboard
    topic: { de: "Texte gestalten", en: "Presenting writing" }
    can_do:
      de: "Ich kann einen kurzen Text am Computer schreiben und gestalten, mit Großbuchstaben, Satzzeichen und Absätzen."
      en: "I can type and lay out a short text on a computer, with capital letters, punctuation and paragraphs."
    prerequisites: { hard: [lit-en.handwriting.joined-legible] }
    standards: []
    beyond_framework: Typing is not in the National Curriculum for English; schools teach it alongside computing.
