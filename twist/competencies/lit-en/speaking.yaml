progression: lit-en.speaking
title: { de: Sprechen und Zuhören, en: Speaking and listening }
order: free
steps:
  - id: lit-en.speaking.listen-respond
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich höre genau zu und reagiere mit Fragen, Bemerkungen und Handlungen."
      en: "I listen carefully and respond to what I hear with questions, comments and actions."
    objectives: [eyfs-2026.elg.listening-attention-and-understanding.1, eyfs-2026.elg.listening-attention-and-understanding.2, nc-english-2014.y1to6.spoken-language.1]

  - id: lit-en.speaking.follow-instructions
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich kann Anweisungen mit mehreren Teilen befolgen."
      en: "I can follow instructions with several ideas or actions."
    prerequisites: { hard: [lit-en.speaking.listen-respond] }
    objectives: [eyfs-2026.elg.self-regulation.3]

  - id: lit-en.speaking.full-sentences
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich kann in ganzen Sätzen über meine Ideen und Gefühle sprechen und dabei Vergangenheit, Gegenwart, Zukunft und Bindewörter wie because nutzen."
      en: "I can talk about my ideas and feelings in full sentences, using past, present and future and joining words like because."
    objectives: [eyfs-2026.elg.speaking.3, nc-english-2014.y1to6.spoken-language.5]

  - id: lit-en.speaking.explain-why
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich kann erklären, warum etwas passieren könnte, und dabei neue Wörter aus Büchern nutzen."
      en: "I can explain why things might happen, using new words from stories and information books."
    prerequisites: { hard: [lit-en.speaking.full-sentences] }
    objectives: [eyfs-2026.elg.speaking.2, nc-english-2014.y1to6.spoken-language.7]

  - id: lit-en.speaking.ask-questions
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich stelle passende Fragen, um mehr zu verstehen."
      en: "I ask relevant questions to understand more."
    prerequisites: { hard: [lit-en.speaking.listen-respond] }
    objectives: [nc-english-2014.y1to6.spoken-language.2]

  - id: lit-en.speaking.build-vocabulary
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich nutze Strategien, um neue Wörter zu lernen und zu verwenden."
      en: "I use strategies to learn and use new words (asking, guessing from context, word maps)."
    prerequisites: { hard: [lit-en.speaking.ask-questions] }
    objectives: [nc-english-2014.y1to6.spoken-language.3]

  - id: lit-en.speaking.describe-narrate
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich kann beim Sprechen klar aufgebaute Beschreibungen, Erklärungen und Erzählungen geben."
      en: "I can give clear, well-structured descriptions, explanations and stories when I speak."
    prerequisites: { hard: [lit-en.speaking.full-sentences] }
    objectives: [nc-english-2014.y1to6.spoken-language.5]

  - id: lit-en.speaking.justify-opinions
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich kann meine Antworten und Meinungen erklären und begründen."
      en: "I can explain and justify my answers and opinions."
    prerequisites: { hard: [lit-en.speaking.describe-narrate] }
    objectives: [nc-english-2014.y1to6.spoken-language.4]

  - id: lit-en.speaking.standard-english-speech
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich spreche deutlich und flüssig Standardenglisch."
      en: "I speak clearly and fluently in Standard English."
    prerequisites: { hard: [lit-en.speaking.describe-narrate] }
    objectives: [nc-english-2014.y1to6.spoken-language.8]

  - id: lit-en.speaking.engage-listener
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich halte meine Zuhörer aufmerksam und prüfe, ob sie folgen."
      en: "I keep my listener interested and check that they are following."
    prerequisites: { hard: [lit-en.speaking.standard-english-speech] }
    objectives: [nc-english-2014.y1to6.spoken-language.10]

  - id: lit-en.speaking.registers
    topic: { de: "Sprechen und Zuhören", en: "Speaking and listening" }
    can_do:
      de: "Ich wähle eine förmliche oder lockere Sprechweise, passend zur Situation."
      en: "I choose a formal or informal way of speaking to fit the situation."
    prerequisites: { hard: [lit-en.speaking.standard-english-speech, lit-en.grammar.formal-informal] }
    objectives: [nc-english-2014.y1to6.spoken-language.12]
