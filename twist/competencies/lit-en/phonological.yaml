progression: lit-en.phonological
title: { de: Laute hören, en: Hearing sounds }
steps:
  - id: lit-en.phonological.rhymes
    topic: { de: "Laute hören", en: "Hearing sounds" }
    can_do:
      de: "Ich kann hören, ob sich englische Wörter reimen, und ein Reimwort finden."
      en: "I can hear when words rhyme and find a word that rhymes."
    objectives: [nc-english-2014.y1.reading-comprehension.4]

  - id: lit-en.phonological.syllables
    topic: { de: "Laute hören", en: "Hearing sounds" }
    can_do:
      de: "Ich kann die Silben eines Wortes klatschen."
      en: "I can clap the syllables in a word."
    objectives: [nc-english-2014.y1.reading-word-reading.6]

  - id: lit-en.phonological.initial-sounds
    topic: { de: "Laute hören", en: "Hearing sounds" }
    can_do:
      de: "Ich kann den ersten Laut eines Wortes hören und Wörter mit demselben Anfangslaut finden."
      en: "I can hear the first sound in a word and find words that start with the same sound."
    objectives: [eyfs-2026.elg.word-reading.1]

  - id: lit-en.phonological.oral-blending
    topic: { de: "Laute hören", en: "Hearing sounds" }
    can_do:
      de: "Ich kann gesprochene Laute zu einem Wort verbinden (c-a-t, cat) und kurze Wörter in Laute zerlegen."
      en: "I can blend spoken sounds into a word (c-a-t, cat) and split a short word into its sounds."
    prerequisites: { hard: [lit-en.phonological.initial-sounds] }
    objectives: [eyfs-2026.elg.word-reading.2, eyfs-2026.elg.writing.2]
