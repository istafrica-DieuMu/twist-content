progression: lit-en.phonics
title: { de: Laut-Buchstaben-Zuordnung, en: Phonics }
# Graphemes in a common systematic synthetic phonics order. Schools follow a DfE-validated programme; the order inside Reception may differ slightly.
skills:
  - id: lit-en.phonics.s-a-t-p
    topic: { de: "Laute und Buchstaben", en: "Phonics" }
    can_do:
      de: "Ich kenne die Laute zu s, a, t, p und kann einfache Wörter damit lesen und schreiben."
      en: "I know the sounds for s, a, t, p and can read and write simple words with them."
    prerequisites: { hard: [lit-en.phonological.oral-blending] }
    standards: [eyfs-2026.elg.word-reading.1, eyfs-2026.elg.word-reading.2]

  - id: lit-en.phonics.i-n-m-d
