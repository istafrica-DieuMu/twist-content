  - id: lit-en.phonics.adjacent-consonants
    topic: { de: "Laute und Buchstaben", en: "Phonics" }
    can_do:
      de: "Ich kann Wörter mit Konsonantenhäufungen lesen und schreiben (frog, lamp, stamp)."
      en: "I can read and spell words with consonants next to each other (frog, lamp, stamp)."
    standards: [eyfs-2026.elg.word-reading.2, nc-english-2014.y1.reading-word-reading.3]

  - id: lit-en.phonics.new-graphemes
    topic: { de: "Laute und Buchstaben", en: "Phonics" }
    can_do:
      de: "Ich kenne weitere Schreibweisen für Vokallaute (ay, ou, ie, ea, oy, ir, ue, aw, wh, ph, ew, oe, au, ey) und lese Wörter damit."
      en: "I know more ways of writing vowel sounds (ay, ou, ie, ea, oy, ir, ue, aw, wh, ph, ew, oe, au, ey) and read words with them."
    prerequisites: { hard: [lit-en.phonics.adjacent-consonants] }
    standards: [nc-english-2014.y1.reading-word-reading.2, nc-english-2014.y1.reading-word-reading.3]

  - id: lit-en.phonics.split-digraphs
    topic: { de: "Laute und Buchstaben", en: "Phonics" }
    can_do:
      de: "Ich kann Wörter mit getrennten Digraphen lesen (a-e, e-e, i-e, o-e, u-e) wie make, these, like, home, cube."
      en: "I can read words with split digraphs (a-e, e-e, i-e, o-e, u-e) such as make, these, like, home, cube."
    prerequisites: { hard: [lit-en.phonics.new-graphemes] }
    standards: [nc-english-2014.y1.reading-word-reading.2, nc-english-2014.y1.reading-word-reading.3]

  - id: lit-en.phonics.alternative-pronunciations
    topic: { de: "Laute und Buchstaben", en: "Phonics" }
    can_do:
      de: "Ich weiß, dass eine Schreibung verschiedene Laute haben kann (ow in cow und snow), und probiere den anderen Laut, wenn ein Wort keinen Sinn ergibt."
      en: "I know that one spelling can stand for different sounds (ow in cow and snow) and try the other sound if a word does not make sense."
    prerequisites: { hard: [lit-en.phonics.new-graphemes] }
    standards: [nc-english-2014.y1.reading-word-reading.2, nc-english-2014.y2.reading-word-reading.2]
