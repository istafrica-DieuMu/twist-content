progression: lit-en.word-reading
title: { de: Wörter lesen, en: Reading words }
steps:
  - id: lit-en.word-reading.blend-cvc
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann kurze Wörter lesen, indem ich jeden Laut spreche und sie verbinde (cat, sun, chip)."
      en: "I can read short words by saying each sound and blending them (cat, sun, chip)."
    prerequisites: { hard: [lit-en.phonics.s-a-t-p] }
    objectives: [eyfs-2026.elg.word-reading.2, nc-english-2014.y1.reading-word-reading.1, nc-english-2014.y1.reading-word-reading.3]

  - id: lit-en.word-reading.first-tricky-words
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann die ersten \"tricky words\" lesen, die man nicht nach Lauten liest (the, I, to, go ...)."
      en: "I can read the first tricky words that do not follow the sounds (the, I, to, go, no, he, she, we, me, be, was, my, you, they, all, are)."
    prerequisites: { hard: [lit-en.word-reading.blend-cvc] }
    objectives: [eyfs-2026.elg.word-reading.3]

  - id: lit-en.word-reading.first-sentences
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann einfache Sätze und Bücher lesen, die zu den Lauten passen, die ich kenne."
      en: "I can read simple sentences and books that match the sounds I know."
    prerequisites: { hard: [lit-en.word-reading.first-tricky-words, lit-en.phonics.ch-sh-th-ng] }
    objectives: [eyfs-2026.elg.word-reading.3, nc-english-2014.y1.reading-word-reading.8]

  - id: lit-en.word-reading.exception-words-y1
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann die Ausnahmewörter für Year 1 lesen und erkenne, welcher Teil des Wortes ungewöhnlich ist."
      en: "I can read the Year 1 common exception words and notice which part of the word is unusual."
    prerequisites: { hard: [lit-en.word-reading.first-sentences] }
    objectives: [nc-english-2014.y1.reading-word-reading.4]

  - id: lit-en.word-reading.endings
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann Wörter mit den Endungen -s, -es, -ing, -ed, -er und -est lesen."
      en: "I can read words with the endings -s, -es, -ing, -ed, -er and -est."
    prerequisites: { hard: [lit-en.word-reading.blend-cvc, lit-en.phonics.adjacent-consonants] }
    objectives: [nc-english-2014.y1.reading-word-reading.5]

  - id: lit-en.word-reading.longer-words
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann Wörter mit mehreren Silben lesen, die aus bekannten Lauten bestehen (rabbit, sunset)."
      en: "I can read words of more than one syllable that use the sounds I know (rabbit, sunset)."
    prerequisites: { hard: [lit-en.phonological.syllables, lit-en.phonics.adjacent-consonants] }
    objectives: [nc-english-2014.y1.reading-word-reading.6, nc-english-2014.y2.reading-word-reading.3]

  - id: lit-en.word-reading.contractions
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann Kurzformen lesen (I'm, I'll, we'll) und weiß, dass der Apostroph fehlende Buchstaben zeigt."
      en: "I can read contractions (I'm, I'll, we'll) and know that the apostrophe shows missing letters."
    prerequisites: { hard: [lit-en.word-reading.exception-words-y1] }
    objectives: [nc-english-2014.y1.reading-word-reading.7]

  - id: lit-en.word-reading.decodable-books
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann Bücher laut lesen, die zu meinen Lauten passen, und sie so oft lesen, bis ich flüssig lese."
      en: "I can read aloud books that match my phonics and re-read them until I read them fluently."
    prerequisites: { hard: [lit-en.word-reading.first-sentences] }
    objectives: [nc-english-2014.y1.reading-word-reading.8, nc-english-2014.y1.reading-word-reading.9, nc-english-2014.y2.reading-word-reading.7, nc-english-2014.y2.reading-word-reading.8]

  - id: lit-en.word-reading.automatic-decoding
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann Wörter automatisch erlesen, auch mit alternativen Lauten, sodass ich flüssig lese."
      en: "I can decode words automatically, including words with alternative sounds for spellings, so that I read fluently."
    prerequisites: { hard: [lit-en.phonics.alternative-pronunciations, lit-en.word-reading.decodable-books] }
    objectives: [nc-english-2014.y2.reading-word-reading.1, nc-english-2014.y2.reading-word-reading.2]

  - id: lit-en.word-reading.suffixes-y2
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann Wörter mit häufigen Nachsilben lesen (-ment, -ness, -ful, -less, -ly)."
      en: "I can read words with common suffixes (-ment, -ness, -ful, -less, -ly)."
    prerequisites: { hard: [lit-en.word-reading.endings] }
    objectives: [nc-english-2014.y2.reading-word-reading.4]

  - id: lit-en.word-reading.exception-words-y2
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann die Ausnahmewörter für Year 2 lesen."
      en: "I can read the Year 2 common exception words."
    prerequisites: { hard: [lit-en.word-reading.exception-words-y1] }
    objectives: [nc-english-2014.y2.reading-word-reading.5]

  - id: lit-en.word-reading.sight-reading
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich lese die meisten häufigen Wörter schnell und richtig, ohne sie zu erlesen."
      en: "I read most words I have met often quickly and accurately without sounding them out."
    prerequisites: { hard: [lit-en.word-reading.automatic-decoding] }
    objectives: [nc-english-2014.y2.reading-word-reading.6]

  - id: lit-en.word-reading.morphology
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich nutze Wortstämme, Vorsilben und Nachsilben, um neue Wörter zu lesen und zu verstehen."
      en: "I use root words, prefixes and suffixes to read and understand new words (unhappiness, misbehave)."
    prerequisites: { hard: [lit-en.word-reading.suffixes-y2] }
    objectives: [nc-english-2014.y34.reading-word-reading.1, nc-english-2014.y56.reading-word-reading.1]

  - id: lit-en.word-reading.exception-words-ks2
    topic: { de: "Wörter lesen", en: "Reading words" }
    can_do:
      de: "Ich kann weitere Ausnahmewörter lesen und erkenne ihre ungewöhnlichen Schreibungen."
      en: "I can read further exception words and notice the unusual spellings in them."
    prerequisites: { hard: [lit-en.word-reading.exception-words-y2] }
    objectives: [nc-english-2014.y34.reading-word-reading.2]
