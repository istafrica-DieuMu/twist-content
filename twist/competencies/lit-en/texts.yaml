progression: lit-en.texts
title: { de: Geschichten, Gedichte und andere Texte, en: Stories, poems and other texts }
order: free
steps:
  - id: lit-en.texts.listen-range
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich höre gern Geschichten, Gedichte und Sachbücher und spreche darüber."
      en: "I enjoy listening to stories, poems and information books and talking about them."
    objectives: [nc-english-2014.y1.reading-comprehension.1, nc-english-2014.y2.reading-comprehension.1, eyfs-2026.elg.listening-attention-and-understanding.1]

  - id: lit-en.texts.traditional-tales
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich kenne wichtige Geschichten, Märchen und traditionelle Erzählungen, kann sie nacherzählen und sagen, was sie besonders macht."
      en: "I know key stories, fairy tales and traditional tales well, can retell them and say what makes them special."
    prerequisites: { hard: [lit-en.comprehension.retell] }
    objectives: [nc-english-2014.y1.reading-comprehension.3, nc-english-2014.y2.reading-comprehension.3]

  - id: lit-en.texts.predictable-phrases
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich kann bei wiederkehrenden Sätzen in Geschichten und Reimen mitsprechen."
      en: "I can join in with repeated phrases in stories and rhymes."
    prerequisites: { hard: [lit-en.texts.listen-range] }
    objectives: [nc-english-2014.y1.reading-comprehension.4]

  - id: lit-en.texts.poems-by-heart
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich kann Reime und kurze Gedichte auswendig lernen und betont vortragen."
      en: "I can learn rhymes and short poems by heart and recite them with expression."
    prerequisites: { hard: [lit-en.phonological.rhymes] }
    objectives: [nc-english-2014.y1.reading-comprehension.5, nc-english-2014.y2.reading-comprehension.8, nc-english-2014.y56.reading-comprehension.7]

  - id: lit-en.texts.literary-language
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich erkenne Sprache, die in Geschichten und Gedichten immer wiederkehrt (once upon a time)."
      en: "I can spot language that keeps coming back in stories and poems (once upon a time, happily ever after)."
    prerequisites: { hard: [lit-en.texts.traditional-tales] }
    objectives: [nc-english-2014.y2.reading-comprehension.5]

  - id: lit-en.texts.non-fiction-structures
    topic: { de: "Sachtexte", en: "Information texts" }
    can_do:
      de: "Ich weiß, dass Sachbücher unterschiedlich aufgebaut sind, und nutze Inhaltsverzeichnis, Überschriften und Glossar."
      en: "I know that information books are organised in different ways and can use contents pages, headings and glossaries."
    prerequisites: { hard: [lit-en.word-reading.decodable-books] }
    objectives: [nc-english-2014.y2.reading-comprehension.4, nc-english-2014.y34.reading-comprehension.2, nc-english-2014.y56.reading-comprehension.2]

  - id: lit-en.texts.myths-legends
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich kenne Mythen, Sagen und traditionelle Geschichten aus verschiedenen Kulturen und kann einige nacherzählen."
      en: "I know a range of myths, legends and traditional stories from different cultures and can retell some of them."
    prerequisites: { hard: [lit-en.texts.traditional-tales] }
    objectives: [nc-english-2014.y34.reading-comprehension.4, nc-english-2014.y56.reading-comprehension.3, nc-english-2014.y34.reading-comprehension.1, nc-english-2014.y56.reading-comprehension.1]

  - id: lit-en.texts.themes-conventions
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich erkenne Themen (Gut und Böse, Freundschaft) und typische Muster in Büchern."
      en: "I can identify themes (good and evil, friendship) and conventions (the hero's journey, a happy ending) in books."
    prerequisites: { hard: [lit-en.texts.myths-legends] }
    objectives: [nc-english-2014.y34.reading-comprehension.5, nc-english-2014.y56.reading-comprehension.5]

  - id: lit-en.texts.poetry-forms
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich erkenne verschiedene Gedichtformen (freie Verse, erzählende Gedichte, Haiku, Limericks)."
      en: "I can recognise different forms of poetry (free verse, narrative poems, haiku, limericks)."
    prerequisites: { hard: [lit-en.texts.poems-by-heart] }
    objectives: [nc-english-2014.y34.reading-comprehension.8]

  - id: lit-en.texts.perform
    topic: { de: "Texte vortragen", en: "Performing texts" }
    can_do:
      de: "Ich kann ein Gedicht oder eine Szene vorbereiten und mit Betonung, Lautstärke und Bewegung vortragen."
      en: "I can prepare a poem or play script to read aloud or perform, showing meaning through tone, volume and action."
    prerequisites: { hard: [lit-en.texts.poems-by-heart] }
    objectives: [nc-english-2014.y34.reading-comprehension.6, nc-english-2014.y56.reading-comprehension.8]

  - id: lit-en.texts.recommend
    topic: { de: "Geschichten und Gedichte", en: "Stories and poems" }
    can_do:
      de: "Ich kann anderen ein Buch empfehlen und meine Wahl begründen."
      en: "I can recommend a book to others and give reasons for my choice."
    prerequisites: { hard: [lit-en.comprehension.justify-views] }
    objectives: [nc-english-2014.y56.reading-comprehension.4]
