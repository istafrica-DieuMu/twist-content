}},"readme":{"sources":[["Anton (anton.app)","[anton/](anton/)","Phase 1 planned: all of English-GB and German-DE. See [anton/PHASES.md](anton/PHASES.md)."]],"outputs":[["[FINDINGS.md](FINDINGS.md)","What we learned, one row per finding, each linked to evidence and to where it was used."],["[taxonomy.md](taxonomy.md)","Shared names for exercise types and lesson mechanics, mapped to Schoolido's question types."],["[catalogue/](catalogue/)","Every captured curriculum, subject, grade, topic and lesson, generated from source data."],["[anatomy.md](anatomy.md)","Twist and Anton lesson structure side by side: each level, its size, and what each product calls it."],["[crosswalk/](crosswalk/)","Source topics and lessons mapped to Schoolido modules, with match quality."],["[site/](site/)","One interactive page over all of the above. Open `site/index.html` in a browser; it is a standalone file with all data embedded. `node site/build.mjs` regenerates it from the docs, the catalogue and what is on disk."]]},"crosswalkSpec":[{"lead":"Grade alignment","rest":"Which source grade matches which Twist grade, by age. Start from the age table in anton/notes/prior/2026-10-07-anton-curriculum-research.md."},{"lead":"Matched lessons","rest":"Source lesson, Twist module_id, match quality (exact or partial), source grade and Twist grade."},{"lead":"Missing in Twist","rest":"Source lessons with no Twist match, by grade."},{"lead":"Missing in the source","rest":"Twist lessons with no source match, by grade."},{"lead":"Misplaced","rest":"Matched lessons that sit in different grades on the two sides, either way: taught earlier in Twist, or taught earlier in the source. Give the grade gap."}],"crosswalkBuilt":0,"catalogueBuilt":true,"docs":[{"path":"AGENTS.md","md":"# Schoolido R&D\n\nResearch for Schoolido, kept separate from schoolido-learning. This folder is\none git repo.\n\n## Layout\n\n- **Source folders** (`anton/` today): everything captured from one source,\n  isolated in its own folder: raw data, media, screenshots, and notes specific\n  to that source. Nothing from a scrape lives outside its source folder.\n- **Root outputs**: what we make from the captured data. These can draw on\n  more than one source.\n  - README.md: entry point.\n  - FINDINGS.md: the findings register.\n  - taxonomy.md: shared names for exercise types and lesson mechanics.\n  - catalogue/: the content catalogue, generated from source data.\n  - anatomy.md: Twist and each source's lesson structure side by side.\n  - crosswalk/: source content mapped to Schoolido modules.\n  - site/: one interactive page over the docs and captures. index.html is\n    a standalone page, tracked in git; dist/artifact.html is the same page\n    as a fragment for the claude.ai publisher, gitignored. Edit build.mjs or\n    template.html, then run `node site/build.mjs`; never edit the outputs by\n    hand. Rebuild after each capture step.\n  - Add other outputs at the root as needed, and list them here and in\n    README.md.\n\n## Rules for every agent session here\n\n- **Keep everything.** Never delete, move out, overwrite or \"clean up\" any\n  captured file in a source folder. This includes temporary-looking files\n  such as Playwright snapshots and console logs. If disk space or duplicates\n  become a problem, stop and ask.\n- **Generated outputs are rebuilt, never hand-edited.** catalogue/ is built\n  by a script from source data; change the script, not the output.\n- **Every finding links to evidence.** A FINDINGS.md row points at the source\n  files it rests on.\n- **Never write into schoolido-learning.** Reading it for comparison is fine.\n\nSource-specific rules live in each source folder's AGENTS.md.\n"},{"path":"anatomy.md","md":"# Lesson anatomy: Twist vs Anton\n\nHow each product structures content, level by level, and what each calls\nthe parts. Twist from schoolido-learning (`docs/specs/lesson-part.md`,\n`schemas/`); Anton from the course and exercise files (1b, 1c, 1f) and the\nbrowser pass (1d).\n\n**Anton names** are given three ways: the name in Anton's files, the label\nin the German app, and the label in English-GB URLs. Labels marked \"seen\"\nwere read on screen in 1d; the English-GB labels come from URLs only,\nbecause the account ran in the German version.\n\n## Side by side\n\n| level | twist | twist size | anton | anton size | anton labels | note |\n|-------|-------|------------|-------|------------|--------------|------|\n| Language | Language of instruction (LOI): `en`, `de`. One curriculum, written in two languages | 2 LOIs | Language version: `guiLanguages` de, en_gb, en_us, fr, es, pt. Each has its own curricula | 6 versions | DE: language picker \"DE\"; GB: \"EN (UK)\" (seen) | Twist translates one curriculum; Anton runs separate national curricula |\n| Subject | Subject: `english`, `german`, `math` | 3 | Subject code: `natdeu`, `nateng`, `mat`, `sci`, `deu` (DaZ), ... | 15 in German-DE, 12 in English-GB | DE: Fach / Fächer (seen); GB: Subject | Anton also has science, humanities, music, preschool and DaZ |\n| Grade | Grade: `grade-1` to `grade-4` | 4 | Course (`plan`), one per subject and grade or grade band | 121 courses in both curricula | DE: \"1. Klasse\", \"9./10. Klasse\", \"Oberstufe\" (seen); GB: \"Year 1\", \"KS3\" | Anton's course is a subject-grade pair; bands (KS2, Oberstufe) span grades |\n| Unit | Unit (`module_metadata.unit`), a broad domain | a few per subject and grade | Topic | 7 to 22 per primary core course (Deutsch, English, Maths, grades 1 to 6) | DE: section headings on the course page, `thema-03-...` in URLs (seen); GB: `topic-08-...` in URLs | Close match in role |\n| Lesson | Lesson: one topic folder holding its parts and a final assessment | 25 to 43 per subject and grade (en LOI) | Lesson (`block`) | 5,213 in both curricula; 42 to 165 per primary core course | DE: \"Zählen 1 bis 5 · 10 Übungen\", page title \"Übungen - ...\" (seen); GB: `exercises-01-...` in URLs | Anton has 2 to 4 times more lessons per grade; each is smaller |\n| Sitting | Part: one 5 to 15 minute sitting with its own `module_id` | several per lesson (CVC Words has 6: five parts plus a review) | none; the learner picks any exercise in a lesson | | | Twist's part has no Anton counterpart |\n| Step / exercise | Step: 6 or 7 in fixed order: opener, warmup, teach, guided practice, applied practice, challenge, assessment | 6 or 7 per part | Exercise (`level`), free order, no fixed roles; kinds `normal`, `test`, `bulb` | median 6 per lesson (90% have 4 to 8) | DE: \"Übung1: ...\" on the lesson path, \"Übung\" in URLs (seen); GB: `exercise-01` in URLs | Twist steps have teaching roles; Anton exercises are interchangeable drills plus one test |\n| Item | Question with a stable `id` (`wu-1`, `gp-1`, ...) | 25 to 35 per part | Item (`atom`) inside a trainer | about 14 per exercise, about 80 per lesson | none on screen; the progress bar counts them | Similar volume per sitting |\n| Interaction type | Question type: 19 schemas in `schemas/question-types/` | 19 | Trainer, Anton's own name per interaction | 66, grouped into shared types (taxonomy.md) | none on screen | Anton has 9 shared types Twist lacks |\n| Teaching | `teach` step: 3 to 5 worked examples, no interaction, before practice | 1 per part | Teach screens (`content`, `contentCard`) or interactive stories (`contentPlayer`), mixed in where the author puts them | 649 in the 1c sample | DE: none separate; \"Tipp\" button on some (seen) | Twist always teaches first; Anton teaches when a lesson needs it |\n| Hints | 3 tiers per guided-practice question (strategy, metacognitive, direct cue) | 3 per guided question | Hint per exercise on some exercises; a reveal after a mistake | some exercises | DE: \"Tipp\", \"Lösen\" (seen) | Twist scaffolds per item; Anton reveals the answer |\n| Wrong answer | Re-queued later in the part (repeat-on-failure) | | Retry in place; the item stays until right or revealed | | red progress segment (seen) | |\n| Formative check | `assessment` step: exactly 5 questions, no hints | 1 per standard part | Test exercise (`type: test`), about one per lesson | 4,564 | DE: \"Test\", earns trophies (seen) | |\n| Summative check | Final assessment: 8 to 15 skill slots, 2+ items each, one picked per attempt | 1 per lesson, plus grade baseline and grade final | none seen beyond the lesson test | | | Twist has placement and grade-level assessment; Anton does not |\n| Practice | `skill_practice` banks and `practice_set` compositions outside the lesson | per skill | Replay any exercise; no separate practice banks seen | | DE: retry button on the end screen (seen) | |\n| Reward | XP per step (5 to 40) | per step | 3 stars per exercise, trophies for tests, coins for games | | DE: stars, trophies, coins, \"Spiele\" (seen) | Anton's rewards are visible and spendable |\n| Order and locks | Parts in order; prerequisites by `module_id` | | No locks in school courses; preschool puzzles unlock in sequence | | lock icons in preschool (seen) | |\n"},{"path":"FINDINGS.md","md":"# Findings\n\nOne row per finding. Every finding links to the source files it rests on.\nIds are never reused; a rejected finding keeps its row.\n\n- **area**: curriculum, exercise-types, mechanics, media, audio, api, other.\n- **status**: open (recorded, not acted on), applied (fed into Schoolido\n  work), rejected (checked and dropped; say why in the finding).\n- **fed into**: the Schoolido PR, doc or decision it changed.\n\n| id | source | area | finding | evidence | status | fed into |\n|----|--------|------|---------|----------|--------|----------|\n| F-001 | anton | exercise-types | Anton uses 66 distinct trainers (complete capture); fill-gap (1,574 sampled exercises) and choose-one (1,370) lead, then a long tail where 25 of 62 sampled trainers appear in fewer than 20 exercises | `taxonomy.md`, `catalogue/views/anton-trainers.md`, `anton/notes/exercise-types.md` | open | |\n| F-002 | anton | exercise-types | 9 shared Anton types have no Twist question type: teach screens, memory game, tap-on-picture, written-maths grid, colouring, timed reading, geometry transforms, syllable marking, read-a-passage-then-answer | `taxonomy.md` (schoolido column) | open | |\n| F-003 | anton | curriculum | English-GB has 61 courses, 2,582 lessons, 14,563 exercises across 12 subjects; German-DE 71 courses, 2,945 lessons, 18,679 exercises across 15 subjects; both run from preschool to KS3 or Oberstufe | `anton/notes/subjects.md`, `anton/api/plan/` | open | |\n| F-004 | anton | curriculum | Anton's Deutsch has 91 to 135 lessons per grade in Klasse 1 to 3; its UK English has 117 lessons in Year 2 and 165 in Year 1 | `anton/notes/topic-maps.md`, `catalogue/views/` | open | |\n| F-005 | anton | exercise-types | Some Anton interactions check only on a Prüfen button (coins into a purse, column subtraction grid, ordering, mirroring a shape) rather than per tap | `anton/screenshots/1d/b0-dragAndValidate-start.png`, `d0-mathGrid-start.png`, `j0-dragSort-start.png`, `h0-shapeMirror-start.png` | open | |\n| F-006 | anton | curriculum | German literacy trainers absent from Twist: syllable marking (`syllabifier`, 42 exercises so far) and timed reading (`flashRead`, word shown about 2 s) | `anton/screenshots/1d/90-flashRead-start.png`, `91-flashRead-word.png`, `taxonomy.md` | open | |\n| F-007 | anton | mechanics | A wrong answer adds a red progress segment and the learner retries the same item; the item never resets | `anton/screenshots/1d/11-memory-wrong-feedback.png`, `53-dragMatch-wrong.png`, `anton/notes/lesson-mechanics.md` | open | |\n| F-008 | anton | mechanics | After a mistake a Lösen button reveals the answer; revealed items count grey, neither right nor wrong | `anton/screenshots/1d/22-findAll-wrong.png`, `24-findAll-reveal.png` | open | |\n| F-009 | anton | mechanics | Lessons have a median of 6 exercises (90% have 4 to 8, over all 5,213); exercises average about 14 items; tests are separate exercises, 4,564 of 31,804 | `catalogue/catalogue.db` (lesson, exercise tables), `anton/notes/lesson-mechanics.md` | open | |\n| F-010 | anton | mechanics | Rewards: up to 3 stars per exercise, trophies for tests, coins (2 after one exercise) spent on games; no locks in school courses, sequential locks in preschool puzzles | `anton/screenshots/1d/13-exercise-end.png`, `51-lesson-einzahl-mehrzahl.png`, `m2-spiele.png`, `l0-kidColorize-start-course.png` | open | |\n| F-011 | anton | other | A sample spread across courses (4 lessons per course) looked saturated at 62 trainers but missed 4 that live in a few lessons (`syllabifier`, `selectFrom100`, `squareMirror`, `squareShader`), found by the full-text pass | `anton/tools/lists/sample-1c.txt`, `taxonomy.md` | open | |\n| F-012 | anton | media | Most lesson pictures are vector graphics (248 Anton lsg + 194 SVG) rather than bitmaps (98) in 12 sampled lessons; bitmaps are mainly covers and photos in content-heavy subjects | `anton/notes/media.md`, `anton/media/` | open | |\n| F-013 | anton | audio | Every prompt is a separate short clip (603 clips, 2.7 s average) named by voice and text; 28 voice ids in 12 lessons, English mostly on two newer voices (f3_2025, m2_2025: 258 of 352 clips); voice names suggest a mix of synthetic and custom recordings | `anton/notes/media.md`, `anton/media/sound/` | open | |\n"},{"path":"README.md","md":"# Schoolido R&D\n\nResearch for Schoolido, separate from the schoolido-learning content repo.\n\n## Sources\n\n| Source | Folder | Status |\n|--------|--------|--------|\n| Anton (anton.app) | [anton/](anton/) | Phase 1 planned: all of English-GB and German-DE. See [anton/PHASES.md](anton/PHASES.md). |\n\nEach source keeps its raw captures and source-specific notes in its own\nfolder.\n\n## Outputs\n\n| Output | What it holds |\n|--------|---------------|\n| [FINDINGS.md](FINDINGS.md) | What we learned, one row per finding, each linked to evidence and to where it was used. |\n| [taxonomy.md](taxonomy.md) | Shared names for exercise types and lesson mechanics, mapped to Schoolido's question types. |\n| [catalogue/](catalogue/) | Every captured curriculum, subject, grade, topic and lesson, generated from source data. |\n| [anatomy.md](anatomy.md) | Twist and Anton lesson structure side by side: each level, its size, and what each product calls it. |\n| [crosswalk/](crosswalk/) | Source topics and lessons mapped to Schoolido modules, with match quality. |\n| [site/](site/) | One interactive page over all of the above. Open `site/index.html` in a browser; it is a standalone file with all data embedded. `node site/build.mjs` regenerates it from the docs, the catalogue and what is on disk. |\n\nRules for agents working here: [AGENTS.md](AGENTS.md).\n"},{"path":"taxonomy.md","md":"# Taxonomy\n\nShared names used across FINDINGS.md, the catalogue and the crosswalk. Each\nsource's own labels map onto these, so different sources stay comparable.\n\n## Exercise types\n\nVersion 1, 2026-10-09, from the Anton 1c text sample: 2,514 exercise files\nfrom 399 lessons across all 121 courses. All 62 Anton trainers seen are\nmapped below. The sample looked saturated (shuffled, the count of distinct\ntrainers levelled off at 62), but the full-text pass (1f) has since turned up\n4 more trainers that live in a handful of lessons the sample did not reach:\n`syllabifier`, `selectFrom100`, `squareMirror` (German-DE) and `squareShader`\n(English-GB Maths). 66 in all, from the complete capture of 31,804\nexercise files. Counts for the 62 are from the sample; the 4 new ones count\nthe full text.\n\n**schoolido** is the closest file in schoolido-learning/schemas/question-types/,\nor \"none\" when Twist has no equivalent. Mappings come from each trainer's\nitem structure in the JSON, checked in step 1d against screenshots of 20 of\nthe 23 types (anton/notes/1d-log.md); corrections from 1d are marked.\nExercise counts are exercises in the sample that use the trainer; one\nexercise can use several trainers.\n\n| type | description | Anton trainers (exercises in sample) | exercises | schoolido |\n|------|-------------|---------------|-----------|-----------|\n| fill-gap | Complete a sentence, table or diagram label, typed or from buttons | `gapMulti` 707, `gap` 515, `lsg` 231, `table` 118, `flowText` 3 | 1574 | fill-in-blank, text-input |\n| choose-one | Pick one answer from text or picture options | `buttons` 544, `multipleChoice` 392, `imageButtons` 229, `selectCard` 128, `flipButtons` 73, `switchPath` 4 | 1370 | multiple-choice, image-multiple-choice |\n| teach | Explanation screen or narrated walkthrough; `contentPlayer` can be interactive (1d: tap the right character in an audio story) | `content` 432, `contentCard` 118, `contentPlayer` 95, `list` 4 | 649 | none (Twist teach step, not a question type) |\n| match-pairs | Connect items that belong together | `dragMatch` 348, `listMatchVertical` 101, `listMatch` 61, `lineCombineRight` 58, `kidPairs` 31, `dragCard` 15, `drawLines` 13, `lineCombineLeft` 10 | 637 | matching |\n| build-word | Spell or build a word from letters or parts | `wordBuilder` 171, `dragSpell` 110, `dragOrder` 79 | 360 | ordering, text-input |\n| memory | Memory game: turn cards to find pairs; with `chooseMode` it is tap-in-order instead (seen in 1d) | `memory` 358 | 358 | none (pairs game); ordering (tap-in-order) |\n| sort-into-groups | Drag items into named categories | `dragGroup` 205, `kidDragGroup` 89 | 294 | sorting |\n| choose-all | Select every option that fits | `findAll` 203, `findSequence` 29, `kidCards` 18 | 250 | multi-select |\n| find-on-picture | Tap the right place or object in a picture | `findOnImage` 157, `findZone` 9, `findAny` 6 | 172 | none |\n| choose-by-sound | Hear a prompt, pick the matching option | `soundButtons` 171 | 171 | audio-choice |\n| find-in-text | Tap words in a text that meet a condition | `findWordsInText` 129, `gravity` 24 | 153 | highlight-in-text |\n| assemble-from-parts | Put a word or sentence together from given pieces (1d: wordSlice builds \"Baum\" from B, m, au); was \"segment\", renamed | `wordSlice` 73, `sentenceSlice` 65 | 138 | ordering |\n| read-and-answer | Read a passage, then answer questions on it | `multipleChoiceText` 107, `buttonsText` 15 | 122 | multiple-choice (passage not modelled) |\n| label-picture | Drag labels, pieces or objects to zones on a picture, checked with Prüfen (1d: coins into a purse to make an amount) | `dragAndValidate` 84, `dragPunc` 18, `dragPuzzle` 3 | 105 | drag-and-drop, drag-and-drop-count |\n| written-maths | Work a calculation in a grid or formula, typed | `mathGrid` 43, `mathFormula` 41, `mathFreeGrid` 5 | 89 | text-input (no column-arithmetic grid) |\n| put-in-order | Arrange steps, items or sounds in sequence | `dragSort` 59, `kidSoundSequence` 8, `listSort` 3 | 70 | ordering |\n| trace-path | Follow or draw a path | `followPath` 58 | 58 | tracing |\n| colour-in | Colour parts of a picture by rule | `kidColorize` 17 | 17 | none |\n| timed | Answer against a clock or in a race game | `flashRead` 11, `buttonsAnimationTime` 3, `buttonsAnimation` 2 | 16 | none (no timed mode) |\n| odd-one-out | Remove the items that do not belong | `kickItem` 15 | 15 | multi-select |\n| geometry | Move, mirror or transform a shape; `squareMirror` found in 1f | `shapes` 4, `shapeMirror` 2, `squareMirror` 6 (1f so far) | 12 | none |\n| count | Count objects or mark a quantity | `mathFillStripe` 3, `kidCount` 1 | 4 | tap-to-count |\n| set-clock | Set a clock to a given time | `digitalClock` 2 | 2 | clock-hands-drag (analogue only) |\n| mark-syllables | Mark the syllables of a word (German syllable arcs); found in 1f, not in the 1c sample | `syllabifier` 42 (1f so far) | 42 | none |\n| grid-shading | Select or shade squares on a grid: numbers on a hundred square, shaded parts of a grid; found in 1f | `selectFrom100` 13, `squareShader` 8 (1f so far) | 21 | none |\n\nTwist question types with no Anton trainer of their own in the sample:\n`true-false`, `pick-side`, `point-on-line` and `speak`. (`drag-and-drop-count`\nis covered by `dragAndValidate`, seen in 1d.)\nAnton may cover some of these inside general trainers (true/false through\n`buttons`, for example); step 1d checks.\n\nPer-trainer counts, subjects and example exercises:\n[catalogue/views/anton-trainers.md](catalogue/views/anton-trainers.md).\n\n## Lesson mechanics\n\nTerms for lesson structure: sequencing, retries, mastery, hints, feedback,\nrewards and progression. Filled in step 1d; the structure-level terms below\ncome from the course files.\n\n| term | meaning | source labels |\n|------|---------|---------------|\n| course | One subject for one grade or grade band | Anton: plan (`plan/\u003cproject>`) |\n| topic | A unit within a course | Anton: topic |\n| lesson | A unit of exercises: median 6, 90% have 4 to 8, range 2 to 48 (all 5,213 lessons) | Anton: block |\n| exercise | One run of items with one or more trainers | Anton: level |\n| item | One question or task inside an exercise | Anton: atom |\n| end-of-lesson test | An exercise marked as the lesson's test | Anton: level `type: \"test\"` (4,564 of 31,804) |\n| tip exercise | Exercise of kind `bulb` (251 of 31,804); meaning still to confirm | Anton: level `type: \"bulb\"` |\n| stars | 0 to 3 per exercise, shown on the lesson path; three stars with one slip in 24 taps | Anton: end screen |\n| trophies | Tests earn trophies instead of stars | Anton: test row in lesson list |\n| coins | Earned by finishing exercises (2 after one exercise); spent on games | Anton: Spiele page |\n| retry in place | A wrong answer adds a red progress segment; the learner tries again, the item does not reset | Anton: all trainers seen |\n| reveal | After a mistake a Lösen button shows the answer; revealed items count grey, neither right nor wrong | Anton: findAll |\n| check button | Some trainers check only on Prüfen (dragAndValidate, mathGrid, dragSort, shapeMirror) | Anton |\n| hint | A Tipp button with a bulb on some exercises | Anton: contentPlayer |\n| locks | None in school courses seen; preschool puzzle courses unlock tiles in sequence | Anton |\n"},{"path":"anton/AGENTS.md","md":"# Anton source folder\n\nEverything captured from anton.app. The repo-wide rules in ../AGENTS.md apply\nhere too, the keep rule above all.\n\n## Anton-specific rules\n\n- **One browser at a time.** The Playwright profile at\n  ~/.cache/anton-playwright-profile is shared between Claude Code and Codex.\n  Do not run a crawl while another agent has the browser open.\n- **Save before you parse.** Write every API response to api/ on first fetch,\n  so nothing ever needs fetching twice.\n- **Raw data stays here.** Findings go to ../FINDINGS.md, exercise-type names\n  to ../taxonomy.md, and the catalogue and crosswalk are built into\n  ../catalogue/ and ../crosswalk/. Each links back to files in this folder.\n\n## Where to start\n\n- PHASES.md: the phase plan and what each phase delivers.\n- BRIEF.md: the instructions for the current phase (Phase 1).\n- index.md: what has been captured so far (created by the first crawl).\n- notes/prior/: the two notes from the first crawl (2026-10-07), kept as the\n  baseline. Read the header in each for what is outdated.\n"},{"path":"anton/BRIEF.md","md":"# Anton R&D crawl brief: Phase 1 (English-GB and German-DE)\n\nSee PHASES.md for where this phase fits. Phase 1 runs as the layered steps\n1a to 1h listed there, cheapest first; 1f to 1h are optional.\n\nR&D capture of anton.app. Course and exercise content comes from Anton's\npublic content CDN with tools/fetch.mjs (see notes/api.md). The browser pass\n(1d) uses the Playwright MCP with the persistent profile at\n~/.cache/anton-playwright-profile. I'm allowed to view and keep everything\non this account.\n\n## Goal\n\nGather all the information Anton has, as deep and as broad as we can get it,\nand keep all of it organized so we can study it later without re-crawling.\n\n## Scope\n\nPhase 1 covers two curricula completely: English-GB (UK) and German-DE. That\nmeans every subject, every grade or year, every topic, chapter and lesson\nthose two curricula offer. No grade cap: not limited to our G1 to G4 or to\nprimary school. For English-GB that is Reception through KS3 and beyond if\noffered; for German-DE every Klasse offered, plus every DaZ course and level.\n\n## Start from the prior baseline\n\nnotes/prior/2026-10-07-anton-curriculum-research.md survives from the first\ncrawl. It lists the content endpoint, the plan index (list/plans) and plan ids\nsuch as c-nateng-1-gb and c-natdeu-1. Step 1a starts from these instead of\nrediscovering them, and uses its per-grade lesson and exercise counts as a\ncheck on the full crawl. It only covered UK Reception to Year 5 and Deutsch\nKlasse 1 to 4, from sampled pages, so it is a floor, not the full picture.\n\nOut of scope for now, planned as Phase 2: French, English-US, Spanish.\n\n## Output folder\n\n~/ist/b2c/rnd/anton/, the Anton source folder inside the rnd repo. All raw\ncaptures and Anton-specific notes stay in this folder. Findings and shared\nnames go to the rnd root (see \"Root outputs\" below). Never write into\nschoolido-learning.\n\n## Keep rule\n\nNever delete, move out, or overwrite anything you capture. No \"cleanup\". If\ndisk space or duplicates become a problem, stop and ask.\n\n## Layout\n\n    api/          raw JSON responses, one file per call, named by endpoint path\n    media/        spot-downloaded media packs (gitignored, kept on disk)\n    screenshots/  per exercise type and per lesson stage\n    snapshots/    Playwright page snapshots and console logs\n    notes/        analysis docs (below)\n    index.md      what was captured, when, and where it lives. Starts with a\n                  \"## Status\" section, one line per step: \"1a: done\",\n                  \"1b: in progress\", and so on. The R&D page reads these.\n\n## Steps\n\n1. Structure (1b): fetch every course file listed in English-GB or German\n   with `node tools/fetch.mjs plans --include-outdated`, then rebuild the\n   catalogue with `node catalogue/build.mjs` from the rnd root.\n2. Text sample (1c): fetch the list in tools/lists/sample-1c.txt with\n   `node tools/fetch.mjs levels tools/lists/sample-1c.txt`. Rerun the same\n   command to retry failures; existing files are skipped. Rebuild the\n   catalogue, then fill ../taxonomy.md from the trainer counts.\n3. Browser pass (1d): open https://anton.app headed; I sign in. Play one\n   exercise per trainer type in the taxonomy. Screenshot each type's start,\n   interaction and feedback into screenshots/. Record items per lesson,\n   sequencing, retry and mastery rules, hints, feedback, rewards,\n   progression and streaks.\n4. Full text, images, audio (1f to 1h): only when asked, in the priority\n   order in PHASES.md. Record every chunk and media pack in index.md.\n5. Pace: a fixed delay between requests (1 s for exercise files), no\n   parallel requests, no bot-detection workarounds. Stop and tell me on\n   HTTP 403 or 429, a paywall or a captcha.\n\n## Notes to write in notes/\n\n- subjects.md: subject and grade inventory per curriculum\n- topic-maps.md: full tree per subject and grade\n- exercise-types.md: inventory, frequency, how each type works, compared with\n  the schemas in schoolido-learning/schemas/question-types/\n- lesson-mechanics.md: the step 7 findings\n- api.md: endpoint shapes and how content is structured\n- usefulness.md: where each finding can feed Schoolido work\n\n## Root outputs (in ~/ist/b2c/rnd/)\n\n- FINDINGS.md: add one row per finding during 1e, source \"anton\", each with\n  links to the evidence in this folder.\n- taxonomy.md: exercise-type table from the 1c trainer counts; lesson-mechanics\n  table after 1d.\n- catalogue/: built in 1b, rebuilt after every capture step.\n- crosswalk/: built in Phase 3.\n\n## Progress\n\nCommit in the rnd repo after each subject. After each step, update the Status\nlines in index.md and run `node site/build.mjs` from the rnd root. Update me in short lines as you\ngo. Report crawl progress and cost at each subject boundary.\n"},{"path":"anton/index.md","md":"# Anton capture index\n\n## Status\n\n- 1a: done\n- 1b: done\n- 1c: done\n- 1d: done (20 of 23 types; count, set-clock and colour-in not opened, see notes/1d-log.md)\n- 1e: done (notes written; counts from full text to refresh when 1f finishes)\n- 1f: done (all 31,804 exercise files, both curricula; tools/lists/1f/README.md)\n- 1g: done (12 lessons, 540 visual files; notes/media.md)\n- 1h: done (12 lessons, 603 audio clips; notes/media.md)\n\n## Captured\n\n| When | What | Where |\n|------|------|-------|\n| 2026-10-08 | Plan index, all six language versions (293 plans) | `api/list/plans.json` + `.headers.txt` |\n| 2026-10-08 | Full plan, English Year 1 (165 lessons, 929 exercises listed) | `api/plan/c-nateng-1-gb.json` + `.headers.txt` |\n| 2026-10-08 | Full plan, Deutsch Klasse 1 (91 lessons, 564 exercises listed) | `api/plan/c-natdeu-1.json` + `.headers.txt` |\n| 2026-10-09 | Structure pass (1b): every course listed in English-GB or German, outdated included (121 files, 7.6 MB) | `api/plan/*.json` |\n| 2026-10-09 | Text sample (1c): 399 lessons, all 2,514 exercise files listed in `tools/lists/sample-1c.txt` (16.1 MB, 55 minutes, 2 network errors retried) | `api/level/...` |\n| 2026-10-09 | 1f German-DE Deutsch, Mathe, Englisch: all 10,516 listed files (1,844 single downloader, then 8,672 with 3 downloaders at 0.3 s in 27 min, 0 failed, no 403/429). Deutsch and Mathe complete; Englisch complete except its 2 outdated courses (chunk 15) | `api/level/...`, `tools/lists/1f/shards/de-core-*` |\n| 2026-10-09 | 1f German-DE DaZ: complete, 1,079 of 1,079. 3 downloaders at 0.3 s fetched 923 over 3.5 h with 156 `fetch failed` (no response, no 403/429; slow or dropped connection on our side); a single downloader at 1 s fetched the 156 in 4.5 min, 0 failed | `tools/lists/1f/shards/de-daz-*` |\n| 2026-10-09 | 1f German-DE chunks 05 to 15 (science, preschool, music, geography, history, computing, biology, chemistry, physics, foreign languages, outdated): 5,604 files, 3 downloaders at 0.3 s, 15 min, 0 failed. All German-DE chunks complete | `tools/lists/1f/shards/de-rest-*` |\n| 2026-10-09 | 1f English-GB: all 11,036 remaining files, 3 downloaders at 0.3 s. The connection dropped twice (no response from any site, no 403/429); each time the downloaders stopped after 10 errors in a row and a restart resumed. 31,804 of 31,804 exercise files now on disk, all valid JSON | `tools/lists/1f/shards/gb-*` (run1, run2, run logs) |\n| 2026-10-08 | One exercise file, Phonics ay, Find Letter | `api/level/probe/level~c-nateng-1-gb~...~level-01.json` |\n| 2026-10-08 | 404 response from the wrong URL shape, kept as evidence | `api/level/probe/c-nateng-1-gb~...~level-01.json` |\n\nRecon notes: [notes/api.md](notes/api.md). Every request is logged in `api/fetch-log.jsonl`.\n\n## Media packs\n\n12 lessons, 6 per curriculum (list and reasons: `tools/lists/media/lessons.json`). 1g: 540 images and graphics, 8.4 MB. 1h: 603 MP3 clips, 9.9 MB, 27.6 min. All in `media/` (gitignored). Details: [notes/media.md](notes/media.md).\n"},{"path":"anton/PHASES.md","md":"# Anton R&D phases\n\n## Phase 1: capture English-GB and German-DE (done 2026-10-09)\n\nRevised 2026-10-09 after recon. All content is public JSON with a known file\nlist and byte size per file (notes/api.md), so the course structure alone\ngives the full curriculum map, and a sample of exercise files gives the\nexercise types. The capture runs in layers, cheapest first: structure, then\na text sample, then the browser pass. Full text, images and audio come later\nand only where an output needs them.\n\n| Step | What | Done when |\n|------|------|-----------|\n| 1a | Recon. Plan index for every language version, one course file per curriculum, one exercise file, notes/api.md. | API shape known, estimate reported. Done 2026-10-08. |\n| 1b | Structure pass. Every course file listed in English-GB or German, outdated ones included: 121 files, 7.6 MB, 4 minutes. Builds ../catalogue/. | Catalogue lists every course, topic, lesson and exercise title with sizes. |\n| 1c | Text sample. Up to 4 lessons per course spread across its topics, every exercise in each: 2,514 exercise files, 16 MB, about 45 minutes. Text only, no media. Builds ../taxonomy.md from Anton's trainer names. | Taxonomy lists every trainer type seen, with counts and the matching Twist question type. **Gate: if the last part of the sample still turns up new trainer types, extend the sample to the courses where they appeared before moving on.** |\n| 1d | Browser pass. Needs the Playwright MCP and a sign-in. Play one exercise per trainer type and screenshot start, interaction and feedback; record lesson mechanics, rewards and progression. | Every trainer type in the taxonomy has screenshots; lesson-mechanics.md written. |\n| 1e | Notes. subjects.md, topic-maps.md, exercise-types.md, lesson-mechanics.md, usefulness.md in notes/; findings rows in ../FINDINGS.md. | All notes written from captured data, findings filed. |\n| 1f | Full text. Done 2026-10-09: all 31,804 exercise files. The remaining ~29,000 exercise files (about 167 MB), in 27 per-subject chunks (tools/lists/1f/README.md), all German-DE chunks first, then English-GB, run a few at a time. Run only when an output needs item-level data, such as difficulty calibration or the reference set. | Each chunk logged in index.md with captured vs listed counts. |\n| 1g | Images. Done 2026-10-09: 12 lessons, 540 files. Image files for chosen lessons, listed per exercise in mediaFiles. | Lessons and reasons listed in index.md. |\n| 1h | Audio. Done 2026-10-09: 12 lessons, 603 clips. Clips for a few lessons only, to judge voice and pacing. | Lessons listed in index.md. |\n\nThe fetch tool is tools/fetch.mjs: resumable through api/fetch-log.jsonl,\nfixed delay between requests, and it never refetches or overwrites a file.\n\n## Phase 2: other curricula (next)\n\nSame brief and layout, every grade. Steps 1b and 1c only at first (the plan\nindex from 1a already lists every version); the browser pass (1d) only for\ntrainer types not already seen in Phase 1.\n\n- **2a, EU curricula first:** French, Spanish, and any other European\n  versions or country variants found in the Phase 1 plan index. Observed so\n  far: EU countries follow a fairly similar school, subject and lesson\n  structure to English-GB and German-DE, so these should map onto the Phase 1\n  catalogue with little extra work. Phase 2a tests that claim and records\n  where it breaks.\n- **2b, English-US on its own:** its subjects and lesson structure differ\n  from English-GB and German-DE, so it gets its own recon (1a) and its own\n  mapping into the catalogue rather than reusing the EU shape.\n\n## Phase 3: put the data to work\n\nSuggestions, roughly in order of payoff. Outputs land at the rnd root. Any\nchange to Schoolido itself is a separate piece of work in schoolido-learning,\nplanned on its own when we get there.\n\n1. **Catalogue.** Built early, in step 1b: ../catalogue/catalogue.db\n   (SQLite) and Markdown views, rebuilt as more files are captured. Every\n   later step queries it instead of reading raw JSON.\n2. **Exercise-type gap list.** Anton's types vs our\n   schemas/question-types/ and what the app renders. Output: a ranked backlog\n   of item types to add, with screenshots showing how each works. Also covers\n   the item types the app currently drops.\n3. **Lesson mechanics benchmark.** Items per lesson, practice vs test balance,\n   retry and mastery rules, rewards. Compare against our depth contract and\n   practice sets; propose changes for the app's lesson flow.\n4. **Coverage matrix.** Built in ../crosswalk/ (spec in its README): Anton\n   lessons across all grades vs the Twist module catalogues, per LOI and\n   subject. Lists missing lessons on either side and lessons misplaced by\n   grade on either side. Not capped at G1-G4: what Anton teaches above our\n   current grades shows where our progression leads. This is where catalogue\n   suggestions come back, redoing notes/prior/ with full data behind them.\n5. **Difficulty calibration.** Per grade: number ranges, word lengths,\n   sentence lengths, distractor patterns. Feeds the grade-relative rules for\n   authoring and the AI judge.\n6. **Media benchmark.** From the media packs: image style, how counts and\n   option icons are drawn, audio clip lengths and voice style. Compare with\n   our image-gen rules and narration standard.\n7. **Reference set for review.** Pick well-made Anton items as examples of\n   each exercise type for the review app and the deep AI reviewer's gold set.\n8. **German-DE insight for the de/ repair.** How Anton sequences German for\n   German-speaking children, as input to the German en-LOI repair plan.\n\nPhase 3 should learn from Anton's patterns, structure and mechanics. Reusing\nAnton's actual questions, audio or images inside Schoolido content is a\ndifferent matter and needs a legal check first.\n\n## Phase 4: keep it current (optional)\n\nRe-run the 1b structure pass every few months and diff it against the saved\napi/ files. Shows what Anton added or changed, at low cost because only the\nAPI is fetched.\n"},{"path":"catalogue/README.md","md":"# Catalogue\n\nEvery captured lesson in one structure: source, curriculum, subject, grade,\ntopic, lesson. Each lesson row carries its exercise types (named per\n../taxonomy.md), item count, whether media was captured, and the path to its\nraw files in the source folder.\n\nGenerated, never hand-edited:\n\n- catalogue.db: SQLite, the source of truth, built by a script from the\n  source folders' raw data.\n- Markdown views, one per source, curriculum and subject, generated from\n  catalogue.db.\n\nNot built yet. The build script comes after Anton Phase 1 steps 1b and 1c.\n"},{"path":"crosswalk/README.md","md":"# Crosswalk\n\nSource lessons mapped against Twist lessons, to find what is missing or\nmisplaced on either side.\n\n## Inputs\n\n- **Source side:** the catalogue (../catalogue/catalogue.db), built from the\n  source folder's raw data.\n- **Twist side:** the module catalogues in schoolido-learning, read only:\n  `content/{en,de}/grade-{1..4}/{english,german,math}/module-catalog.md`\n  (24 files: two LOIs, four grades, three subjects).\n\n## Files\n\nOne file per source, Twist LOI and subject, for example anton-en-english.md,\nanton-de-german.md, anton-en-math.md.\n\n## What each file holds\n\n1. **Grade alignment.** Which source grade matches which Twist grade, by age.\n   Start from the age table in\n   anton/notes/prior/2026-10-07-anton-curriculum-research.md.\n2. **Matched lessons.** Source lesson, Twist module_id, match quality (exact\n   or partial), source grade and Twist grade.\n3. **Missing in Twist.** Source lessons with no Twist match, by grade.\n4. **Missing in the source.** Twist lessons with no source match, by grade.\n5. **Misplaced.** Matched lessons that sit in different grades on the two\n   sides, either way: taught earlier in Twist, or taught earlier in the\n   source. Give the grade gap.\n\nSource lessons above Twist's G4 are listed under \"Missing in Twist\" with\ntheir grade, as a view of where Twist's progression could lead.\n\nEach row links to the source lesson's raw files and to the Twist catalogue\nline. Findings worth acting on go to ../FINDINGS.md.\n\nNot built yet. Comes after the catalogue exists (Anton Phase 3).\n"},{"path":"anton/notes/1d-log.md","md":"# 1d browser pass: running log\n\nObservations in the order they were made. Screenshots in `screenshots/1d/`.\nRaw Playwright output (same screenshots plus page snapshots) is in\n`schoolido-learning/.playwright-mcp/`, copied here at the end of the pass.\n\n## Session and navigation (2026-10-09)\n\n- Account: the saved research account in the persistent profile, language\n  version Deutsch. Navigating by URL sends the app back to the landing page;\n  clicking the saved account resumes the session on the requested page.\n  Moving around inside the app works.\n- Screenshot `01-subject-list-de.png`: the Fächer (subjects) list.\n\n## Lesson page\n\n- `02-lesson-zahlen-vergleichen.png`: a cover image, then a vertical path of\n  exercise tiles, each with three grey stars. No lock icons; every tile can\n  be opened.\n- `14-lesson-path-after-ex1.png`: after exercise 1 the tile shows three green\n  stars and the learner's avatar moves next to it.\n\n## Exercise frame\n\n- Top bar: close (X), a progress bar, a speaker button (replay instruction)\n  and a chat-bubble button (feedback to Anton).\n- Instruction text with a speaker icon above the task; prompts are read aloud.\n- Progress bar is segmented: each tap or item adds a green (right) or red\n  (wrong) segment.\n\n## Types\n\n### memory (Mathematik 1. Klasse, Zahlen vergleichen, #1 \"Ordne von klein nach groß\")\n\n- `10-memory-start.png`: four number cards; \"Klicke die Zahlen in der\n  Reihenfolge von klein nach groß an.\" So `memory` with a `chooseMode` is a\n  tap-in-order task, not only a pairs game. Taxonomy needs correcting.\n- `11-memory-wrong-feedback.png`: wrong tap gets a red frame and a red\n  progress segment; the item does not reset, the learner carries on.\n- `12-memory-after-item.png`: correct taps get a green frame; tapped cards\n  show their value as a caption.\n- 6 items in the exercise.\n- `13-exercise-end.png`: end screen with the Anton character, \"Geschafft!\n  Sauber abgeliefert.\", three green stars (with one wrong tap out of 24),\n  buttons: retry, Weiter, \"Meine Ergebnisse\". Weiter returns to the lesson\n  path rather than opening the next exercise.\n\n### choose-all, findAll (same lesson, #2 \"Kleiner! Größer?\")\n\n- `21-findAll-start.png`: \"Klicke alle Zahlen an, die größer als 10 sind.\" A\n  drawn 4x3 grid of numbers in a vector image (lsg); the tiles are regions of\n  the picture, not buttons.\n- `22-findAll-wrong.png`, `23-findAll-right.png`: a right tap puts a green\n  tick on the tile. After the first wrong tap a **Lösen** (solve) button with\n  an unlock icon appears.\n- `24-findAll-reveal.png`: Lösen marks the remaining answers with grey ticks;\n  the progress bar adds a grey segment, so a revealed item counts as neither\n  right nor wrong. A Weiter bar appears at the bottom.\n- The exercise has its own URL (`uebung-08`) whose number is the level file\n  number, not the position on the lesson path (#2).\n\n### Leaving an exercise\n\n- `25-after-cancel.png`: the X asks \"Jetzt abbrechen?\" with Nein / Ja.\n\n### choose-one, buttons (#3 \"Größte Zahl\")\n\n- `30-buttons-start.png`: \"Welche der drei Zahlen ist die Größte? Wähle aus.\"\n  Three plain grey text buttons.\n- `31-buttons-wrong.png`: wrong answer adds a red progress segment; the\n  buttons stay for another try.\n\n### fill-gap, gapMulti in a test (#8 \"Test\")\n\n- `40-test-gapMulti-start.png`: \"Setze das passende Vergleichszeichen ein.\"\n  \"15 _ 15\" with the answer buttons \u003c, =, > in a bar at the bottom.\n- `41-test-wrong.png`: in the test a wrong answer is handled as in practice:\n  red segment, try again. No separate test mode visible per item.\n\n### Course picker and list-style lessons\n\n- `50-deutsch-course-picker.png`: clicking a subject opens its grades in\n  place, each with its exercise count (Deutsch: 1. Klasse 564, 2. Klasse 860,\n  3. Klasse 588, ...). These match the catalogue.\n- `51-lesson-einzahl-mehrzahl.png`: this lesson is a list with exercise\n  names, not a path (the `design` field in the course file). The Test row\n  shows **three trophies instead of stars**: tests earn trophies.\n\n### match-pairs, dragMatch (Deutsch 1. Klasse, Einzahl und Mehrzahl, #4 \"Bilder zuordnen\")\n\n- `52-dragMatch-start.png`: \"Ordne zu.\" Pictures and word cards scattered on\n  the screen (\"der Hut\", \"die Hüte\"); the plural ending is highlighted in\n  blue. The child drags a word onto its picture.\n- `53-dragMatch-wrong.png`: a wrong drop sends the card back; red segment.\n- `55-dragMatch-right.png`: a right drop removes the pair; green segment.\n\n### find-in-text, findWordsInText (Deutsch 1, Einzahl und Mehrzahl, #5 \"Mehrzahlsuche\")\n\n- `60-findWordsInText-start.png`: \"Tippe das Wort an, das in der Mehrzahl\n  steht.\" A picture and one sentence; every word is underlined and tappable.\n  The spelling pattern is coloured (\"Erd**bee**ren\").\n\n### sort-into-groups, dragGroup (Deutsch 1, Wortschlangen, #4 \"Zuordnen\")\n\n- `70-dragGroup-start.png`: \"Sortiere die Wortschlangen danach, ob sich in\n  ihnen ein Tiername versteckt oder nicht.\" Letter strings scattered on the\n  screen (fBÖBLöwe, bwbHaseJnseu, ...), two drop bins along the bottom: Tier /\n  kein Wort.\n\n### trace-path, followPath (Deutsch 1, Uu, #1 \"Uu schreiben\")\n\n- `80-followPath-start.png`: \"Schreibe das U/u.\" Letter tracing on a\n  four-line writing grid with a house mnemonic for the zones (roof, house,\n  cellar). A start dot with an arrow shows where to begin. This is\n  handwriting tracing, which matches Twist `tracing`.\n\n### timed, flashRead (Deutsch 1, Blitzlesen schwer, #1 \"Natur\")\n\n- `90-flashRead-start.png`: \"Lies das Wort und wähle das richtige Bild aus.\n  Achtung, du hast nur kurz Zeit!\" and a Start button.\n- `91-flashRead-word.png`, `92-flashRead-choices.png`: after Start the word\n  (\"Blume\") shows for about 2 seconds and fades; the child then picks the\n  picture from memory.\n\n### Navigation note\n\nClicking Fächer opens a side menu whose overlay blocks clicks on the\nsubject list, and grade rows of an open subject stay in the list, so text\nmatching picks the wrong grade. Reliable route: open\n`https://anton.app/de/lernen/\u003cpageUrl>/`, click the saved account to resume,\nthen lesson and exercise by position.\n\n### label-picture, dragAndValidate (Mathematik 1, Mit Geld rechnen, #2)\n\n- `b0-dragAndValidate-start.png`: \"4 Euro und 50 Cent\". Drag coins into a\n  purse, then press **Prüfen** (check). Checked on request, not per drop.\n  This is close to Twist `drag-and-drop-count`; the taxonomy note that Twist\n  `drag-and-drop-count` has no Anton counterpart is wrong.\n\n### teach, contentPlayer (Mathematik 2, Fragen und Antworten finden, #1)\n\n- `c0-contentPlayer-start.png`: \"Ordne die Frage der passenden\n  Rechengeschichte zu. Klicke immer das richtige Kind an. Für diese Übung\n  musst du den Ton anschalten.\" An audio story where the learner taps the\n  right character. Not a passive teach screen. **Tipp** button with a bulb in\n  the top bar: first hint button seen.\n\n### written-maths, mathGrid (Mathematik 3, Schriftliche Subtraktion, #1)\n\n- `d0-mathGrid-start.png`: \"Schreibe die Aufgabe für die schriftliche\n  Subtraktion auf. 415 - 213\". A place-value grid (H Z E) with the minuend\n  given; the learner types digits into the cells, then Prüfen.\n\n### find-on-picture, findOnImage (Deutsch 4, Grafiken verstehen, #3)\n\n- `e0-findOnImage-start.png`: \"Schau dir den Waldpark-Plan an und finde die\n  gesuchten Orte. Klicke die Eisdiele an.\" A drawn park map; tap the place.\n\n### odd-one-out, kickItem (Deutsch 5, Wörter ableiten, #2)\n\n- `f0-kickItem-start.png`: \"Ein Wort gehört nicht zur Wortfamilie. Klicke es\n  an.\" Photo plus four word buttons (tückisch, Stück, Stückchen, stückeln).\n\n### build-word, wordBuilder (Deutsch Oberstufe, Romantik, #8 Test)\n\n- `i0-wordBuilder-start.png`: \"Von wann bis wann dauerte die Romantik? Setze\n  die Zeitspanne der Epoche zusammen.\" Number tiles to build a year span.\n  wordBuilder assembles any answer from tiles, not only words.\n\n### put-in-order, dragSort (Musik, Noten und Notenwerte, #9)\n\n- `j0-dragSort-start.png`: \"Ordne die Notenwerte. Beginne oben mit dem\n  längsten Notenwert.\" Vertical list with drag handles, then Prüfen.\n\n### choose-by-sound, soundButtons (Englisch Stufe 0, My name is, #4)\n\n- `k0-soundButtons-start.png`: options are audio buttons only, each with a\n  tick to choose it. Listen, then pick.\n\n### segment, wordSlice (Deutsch 2, Zwielaute, #5)\n\n- `a0-wordSlice-start.png`: \"Setze die Wörter mit Zwielaut zusammen.\" Photo\n  of a tree; letter tiles B, m, au go into a slot to build \"Baum\".\n  **Taxonomy correction:** wordSlice assembles a word from parts; it does\n  not cut words up. The \"segment\" type needs renaming (assemble from parts)\n  and probably merging with build-word.\n\n### read-and-answer, multipleChoiceText (Deutsch 9/10, Nicht flektierbare Wörter, #4)\n\n- `g0-multipleChoiceText-start.png`: \"Lies den Text und beantworte\n  anschließend die Fragen.\" A text card (\"Adverbien ...\") with Weiter, then\n  the questions.\n\n### geometry, shapeMirror (Mathematik 9/10, Ähnlichkeit, #8 Test)\n\n- `h0-shapeMirror-start.png`: \"Spiegele die Figur vertikal entlang der\n  Mitte.\" Squared grid, a triangle and a red mirror line; the learner places\n  points for the image. Reset (trash) and Prüfen.\n\n### Locks exist in preschool puzzle courses\n\n- `l0-kidColorize-start-course.png`: Vorschule Früchte-Puzzles is a grid of\n  locked tiles that open in sequence; only the first is open. A \"Tipp /\n  Fokus\" toggle sits top right. The earlier \"no locks\" holds for the school\n  courses seen, not for these puzzle courses. colour-in (kidColorize) is in\n  the second, locked tile, so it was not opened.\n\n### Rewards\n\n- `m2-spiele.png`: the Spiele page lists games (Hidden, ANTON Sports:\n  Weitsprung, Astro Bang, Avatar Superstar, Bat Cave, Block Puzzle, City\n  Jumper, Crazy Cobras, ...). The account shows **2 coins** after one\n  finished exercise: exercises earn coins, coins pay for games.\n\n## Not covered in 1d\n\n- count (kidCount) and set-clock (digitalClock): their first-position\n  exercises are only in English-GB courses, and the account is set to the\n  German version, so English-GB URLs redirect. 1 and 2 exercises in the\n  sample. Needs a language switch.\n- colour-in (kidColorize): behind a preschool lock (see above).\n- Meine Ergebnisse (results page) and how a whole lesson completes.\n"},{"path":"anton/notes/api.md","md":"# Anton content API (step 1a recon, 2026-10-08)\n\nAll curriculum content is served as static JSON from Anton's content CDN.\n**No sign-in is needed**: the plan index, plan files and exercise files all\nreturned 200 without cookies or tokens. The browser and sign-in are only\nneeded for things the JSON does not show (how an exercise looks and behaves,\nrewards, progression), which is step 1d.\n\n## Endpoint\n\n    GET https://content.anton.app/files/?fileId=\u003cfileId>&etag=\u003cetag>\n\n- Canonical host in the `link` header: `apis-content.solocode.com`. Mirror:\n  `content-2.anton.app`.\n- `etag` is `\u003chash>-\u003cbytes>`. The byte count matches the response size, so\n  every file's size is known before fetching it.\n- Responses are CDN-cached (`cdn-cache: HIT`). Plan and level files carry\n  `cache-control: public, max-age=2592000` (30 days). The plan index carries\n  `max-age=0, s-maxage=3600` and `etag=latest` works for it.\n- A wrong fileId returns `404 text/plain` (50 bytes). Saved as\n  `api/level/probe/c-nateng-1-gb~...~level-01.json`.\n\n## File types\n\n| fileId | What | Saved as |\n|--------|------|----------|\n| `list/plans` | Index of every course in every language version | `api/list/plans.json` |\n| `plan/\u003cproject>` | One course: topics, lessons (blocks), exercises (levels) | `api/plan/\u003cproject>.json` |\n| `level/\u003cproject>/\u003ctopic>/\u003cblock>/\u003clevel>` | One exercise with all its items | `api/level/...` |\n| `sound/\u003clang>/\u003cvoice>/\u003ctext>` | One audio clip (TTS or custom) | not fetched yet |\n| `.lsg` paths | Images and vector graphics | not fetched yet |\n\n## Plan index (`list/plans`)\n\n293 plans, 272 non-debug. Fields per plan: `project`, `fileId`, `etag`,\n`subject`, `title`, `grades`, `guiLanguages`, `contentLanguagePrimary`,\n`contentLanguageSecondary`, `totalBlocks`, `totalLevels`, `isOutdated`,\n`isNewUntil`, `sortIndex`, `preschoolDifficulty`, `version`, `versionDate`.\n\n- `guiLanguages` decides which language version lists the plan:\n  `de`, `en_gb`, `en_us`, `fr`, `es`, `pt`. Non-debug counts: de 71, en_gb 61,\n  en_us 55, es 54, pt 44, fr 42. This is the Phase 2 list; there are no\n  country variants beyond these six.\n- `totalBlocks` = lessons, `totalLevels` = exercises. They match the prior\n  note: Year 1 English is 165 / 929 here, 164 / 929 in the note.\n- `grades`: 0 = Reception or preschool, 1 to 13 = school years, 99 = not\n  graded (language courses, DaZ, vocabulary).\n- `subject` is a code (`nateng`, `natdeu`, `mat`, `sci`, `geo`, `his`, ...)\n  or, for shared foreign-language courses (`c-mono-*`), an object keyed by\n  language version.\n\n## Plan file (`plan/\u003cproject>`)\n\n    plan: title, project, version, versionDate, totalBlocks, totalLevels, etag\n      topics[]: title, path, puid, tags[], isNewUntil\n        blocks[] (lessons): title, path, puid, design, coverImage {id, etag}, tags[]\n          levels[] (exercises): title, path, puid, type, etag\n\nEvery level carries its own etag, so a full plan gives the exact file list\nand byte size for every exercise in that course.\n\n## Level file (`level/...`)\n\n    title, puid, path, type, keyboardLayout, voiceLang, voice,\n    instruction {voice, speaker, autoplay},\n    trainers[]: trainer, instruction, soundMode, shuffleButtons, atoms[]\n    parentTopic, parentBlock, mediaFiles {sounds[], ...}, etag\n\n- `trainer` is Anton's own exercise-type name (`imageButtons`, `findAll`,\n  ...). The exercise-type inventory for taxonomy.md can be built from these\n  directly, across all 30,889 exercises.\n- `atoms` hold the items: instruction text, the spoken prompt, answer\n  options, and which option is correct.\n- Audio prompts are markup such as `\u003cvoice voiceLang='de' voice='custom'>JJ-phonics-ai-gb\u003c/voice>`.\n  `mediaFiles.sounds` lists every clip as a `sound/...` fileId with its etag,\n  so a lesson's full media pack can be listed without fetching it.\n\n## Scope and estimate for steps 1b and 1c\n\nPlans listed in English-GB or German, excluding 6 marked `isOutdated`:\n\n| | Plans | Lessons | Exercises |\n|---|---|---|---|\n| English-GB or German (union) | 115 | 5,150 | 30,889 |\n\nPer language version: English-GB lists 61 plans (2,582 lessons, 14,563\nexercises); German lists 71 (2,945 lessons, 18,679 exercises). The two\noverlap on shared language courses (`c-mono-*`).\n\n- **Calls:** about 31,000 (115 plan files plus one per exercise).\n- **Size:** about 150 MB of JSON. Sampled average is 4.9 KB per exercise\n  file, from 1,493 exercises in two plans.\n- **Time:** depends on the delay between requests. 3 s gives about 26 hours,\n  1 s about 9 hours, 0.5 s about 4.5 hours. These are CDN-cached static\n  files, but the brief asks for human pace.\n- **Media is not in this estimate.** Audio clips and images are separate\n  files, listed per exercise in `mediaFiles`. Step 1d spot-downloads a few\n  lessons' worth only.\n\n## Open questions for 1b\n\n- Request delay: pick one of the options above.\n- Whether to keep a resumable fetch log (fileId, etag, status, time) so a\n  stopped crawl continues where it left off. Recommended.\n- Whether to also save the six outdated plans' files for completeness.\n"},{"path":"anton/notes/exercise-types.md","md":"# Exercise types\n\nStep 1e note, 2026-10-09. The type table itself is in\n[../../taxonomy.md](../../taxonomy.md); per-trainer counts, subjects and\nexamples are in\n[../../catalogue/views/anton-trainers.md](../../catalogue/views/anton-trainers.md).\nThis note records how the types were found, what was checked, and what the\ninventory says.\n\n## Method\n\n1. **Names from the data.** Every exercise file lists its interactions as\n   `trainers[].trainer`. The 1c text sample (2,514 files, 399 lessons, all\n   121 courses) gave 62 names. They were grouped into 23 shared types by\n   their item fields (`atoms`) and mapped to the closest Twist schema in\n   `schemas/question-types/`.\n2. **Checked in the browser.** Step 1d opened one exercise per type and\n   screenshotted it (20 of 23 types; `notes/1d-log.md`). Four mappings were\n   corrected (see below).\n3. **Widened by the full text.** The complete 1f capture added 4 trainers\n   the sample missed (`syllabifier`, `selectFrom100`, `squareMirror`,\n   `squareShader`). 66 in all.\n\n## What the inventory says\n\n- **Most interaction is gap filling and choosing.** In the sample, fill-gap\n  (1,574 exercises) and choose-one (1,370) are far ahead of the next type,\n  teach screens (649) and match-pairs (637).\n- **A long tail of specialised trainers.** 33 of the 62 sampled trainers\n  appear in fewer than 60 sampled exercises, 25 in fewer than 20. Many belong to one subject: `mathGrid`\n  and `mathFormula` (written maths), `flashRead` (Blitzlesen), `followPath`\n  (handwriting), `syllabifier` (German syllables), `kidSoundSequence`\n  (music).\n- **One exercise mixes trainers.** An exercise file lists 4.2 trainer\n  entries on average; trainer and item are not one-to-one.\n- **Exercises are about 14 items long** on average (1f files so far).\n\n## Corrections from the browser pass\n\n| Was | Is | Evidence |\n|---|---|---|\n| `memory` = pairs game only | also tap-in-order (`chooseMode`) | `screenshots/1d/10-memory-start.png` |\n| segment (cut words up) | assemble-from-parts: `wordSlice` builds \"Baum\" from B, m, au | `screenshots/1d/a0-wordSlice-start.png` |\n| teach = passive | `contentPlayer` can be an interactive audio story with a hint button | `screenshots/1d/c0-contentPlayer-start.png` |\n| Twist `drag-and-drop-count` has no Anton match | `dragAndValidate` counts coins into a purse | `screenshots/1d/b0-dragAndValidate-start.png` |\n\n## Against Twist\n\nAnton types with no Twist question type: teach screens, the memory game,\ntap on a picture, written-maths grids, colouring, timed reading, geometry\ntransforms, syllable marking, the hundred square, and read-a-passage-then-\nanswer (Twist can ask the questions but has no passage).\n\nTwist types with no Anton trainer of their own: `true-false`, `pick-side`,\n`point-on-line`, `speak`.\n\n## Gaps in this note\n\n- count (`kidCount`), set-clock (`digitalClock`) and colour-in\n  (`kidColorize`) were not opened in the browser (English-GB only, or behind\n  a preschool lock).\n- Shares per type will be recounted from the full text when 1f finishes.\n"},{"path":"anton/notes/lesson-mechanics.md","md":"# Lesson mechanics\n\nStep 1e note, 2026-10-09, from the course files (1b) and the browser pass\n(1d, `notes/1d-log.md`). Terms are defined in\n[../../taxonomy.md](../../taxonomy.md#lesson-mechanics).\n\n## Structure\n\n- **Course → topic → lesson → exercise → item.** In Anton's files: plan →\n  topic → block → level → atom.\n- **Lessons are short.** Median 6 exercises per lesson; 90% of the 5,213\n  lessons have 4 to 8; the range is 2 to 48.\n- **Exercises are about 14 items** (1f files so far). The first exercise\n  played had 6 items.\n- **Tests are their own exercises.** 4,564 of 31,804 exercises are marked\n  `test`, roughly one per lesson. 251 are kind `bulb` (meaning not\n  confirmed).\n- **Two lesson layouts.** A vertical path of tiles (`design: map`) or a list\n  of named exercises (`02-lesson-zahlen-vergleichen.png`,\n  `51-lesson-einzahl-mehrzahl.png`).\n\n## Inside an exercise\n\n- **Instruction read aloud.** Every instruction has a speaker icon; the top\n  bar replays it. Some exercises need sound and say so.\n- **Feedback per answer, retry in place.** Right: green frame or tick and a\n  green progress segment. Wrong: red frame and a red segment; the item stays\n  and the learner tries again (`11-memory-wrong-feedback.png`,\n  `53-dragMatch-wrong.png`).\n- **Reveal.** After a mistake a **Lösen** button can show the answer;\n  revealed items show as grey ticks and a grey segment, counted neither right\n  nor wrong (`24-findAll-reveal.png`).\n- **Check on request** for constructive tasks: **Prüfen** in dragAndValidate,\n  mathGrid, dragSort and shapeMirror.\n- **Hints** exist as a **Tipp** button with a bulb on some exercises\n  (`c0-contentPlayer-start.png`), not on every item.\n- **Tests behave like practice per item**: a wrong answer gets the same red\n  segment and a retry (`41-test-wrong.png`).\n- **Quitting asks** \"Jetzt abbrechen?\" (`25-after-cancel.png`).\n\n## Rewards and progression\n\n- **Stars:** up to three per exercise, shown on the lesson path. Three stars\n  after one wrong tap in 24 (`13-exercise-end.png`).\n- **Trophies** instead of stars for tests (`51-lesson-einzahl-mehrzahl.png`).\n- **Coins:** 2 after one finished exercise; spent on games (Hidden, Astro\n  Bang, Block Puzzle, ...) on the Spiele page (`m2-spiele.png`).\n- **End screen:** Anton character, a short cheer (\"Geschafft! Sauber\n  abgeliefert.\"), stars, retry, Weiter, Meine Ergebnisse.\n- **No locks in school courses**; every exercise can be opened directly.\n  **Preschool puzzle courses do lock**: tiles open in sequence\n  (`l0-kidColorize-start-course.png`).\n\n## Not yet seen\n\nThe results page (Meine Ergebnisse), streaks, what a whole finished lesson\nshows, and how teachers assign work.\n"},{"path":"anton/notes/media.md","md":"# Media: images and audio (steps 1g and 1h)\n\n2026-10-09. Media for 12 lessons, 6 per curriculum, spread across subjects\nand grades; lessons played in 1d were reused so the media matches the\nscreenshots. Picked by `tools/pick-media.mjs`; the lesson list with reasons\nis `tools/lists/media/lessons.json`. Files are in `media/` (gitignored, kept\non disk), saved under their Anton file id.\n\n| Curriculum | Course | Lesson | Exercises |\n|---|---|---|---|\n| German-DE | Deutsch 1. Klasse | Einzahl und Mehrzahl (played in 1d) | 6 |\n| German-DE | Mathematik 1. Klasse | Zahlen vergleichen (played in 1d) | 8 |\n| German-DE | DaZ Kurs A1 | Ich wasche mich. | 5 |\n| German-DE | Englisch 3. Klasse | New Zealand | 6 |\n| German-DE | Sachunterricht 1./2. Klasse | Sonne, Mond und Sterne | 5 |\n| German-DE | Vorschule Buchstaben | A und B nachspuren | 4 |\n| English-GB | English Year 1 | Phonics - ay (probed in 1a) | 4 |\n| English-GB | Maths Year 2 | Equivalent Time | 5 |\n| English-GB | Science Year 3-4 | Human Teeth | 5 |\n| English-GB | History KS1 | The Great Fire of London | 5 |\n| English-GB | EAL Alphabet and Phonics | a | 5 |\n| English-GB | Preschool Maths | Logic, Activity Set 2 | 4 |\n\n## How media is listed\n\nEvery exercise file has `mediaFiles` with four lists, each entry a file id\nand an etag (`\u003chash>-\u003cbytes>`): `images` (bitmaps, including the lesson\ncover), `lsgs` (Anton vector graphics), `svgs` and `sounds`. All are served\nby the same content endpoint as the JSON. 66 sound entries carry no etag\n(`isMultiSound`): they are assembled in the app from several clips and have\nno file of their own; they were skipped.\n\n## 1g: images and graphics\n\n540 files, 8.4 MB, fetched in 5 minutes, 0 failed.\n\n| Kind | Files | Format |\n|---|---|---|\n| Bitmaps (`images`) | 98 | 87 JPEG, 11 PNG; e.g. 300 x 300 RGBA |\n| Anton vector graphics (`lsgs`) | 248 | JSON drawing descriptions |\n| SVG (`svgs`) | 194 | SVG |\n\nThe server labels some PNGs as `image/jpeg`; the fetch tool now names files\nby their byte signature. One test file fetched before that fix,\n`media/image/lsg_ea7090d989.jpg`, is a PNG with a `.jpg` name; it is kept\nas fetched.\n\nMost lesson pictures are vector graphics, not bitmaps: bitmaps appear mainly\nas covers and as photos in content-heavy lessons (Englisch, Sachunterricht,\nScience, EAL alphabet).\n\n## 1h: audio\n\n603 MP3 files, 9.9 MB, 27.6 minutes of audio, fetched in 6 minutes, 0\nfailed. 64 kbps mono, 48 kHz. Average clip 2.7 s.\n\nThree sound ids differ only in characters that are replaced in file names,\nso they share a file; 606 ids map to 603 files.\n\n### Voices\n\nSound ids are `sound/\u003clanguage>/\u003cvoice>/\u003ctext>`, so every clip names its\nvoice. 28 voice ids in these 12 lessons:\n\n| Voice id pattern | Examples | Clips | Reading |\n|---|---|---|---|\n| `f…` / `m…` | f5, m3, m7 | most | female / male voices |\n| `…_2025` | en/f3_2025 (133), en/m2_2025 (125), de/f4_2025 | 283 | newer voices; 258 of the 352 English clips (73%) use en/f3_2025 or en/m2_2025 |\n| `…Poly` | de/m1Poly (37), de/f2Poly | 46 | the name suggests a synthetic text-to-speech voice; not confirmed |\n| `…_chirp` | de/f11_chirp, de/m2_chirp | 4 | the name suggests a synthetic voice; not confirmed |\n| `…_override_XX` | de/m1_override_MG, de/f2_override_LM | 55 | likely per-voice corrections; meaning not confirmed |\n| `custom` | daz-phoneme-EE-l, JJ-phonics-ai-gb | 18 | phonics sounds, 0.7 s on average |\n| `…Au` / `…Us` | m1Au, m1Us, m2Us | 12 | accent variants for English |\n\nThe prompt text is the file name, so audio and text can be matched without\nlistening: `sound/de/f1_override_AE/Schreibe die Mehrzahl!` is the spoken\ninstruction \"Schreibe die Mehrzahl!\".\n"},{"path":"anton/notes/subjects.md","md":"# Subjects and grades\n\nGenerated 2026-10-09 by `tools/notes-1e.mjs` from `catalogue/catalogue.db`. Source: all 121 course files (step 1b), so every number here is complete, not sampled.\n\n## English-GB\n\n12 subjects, 61 courses, 2,582 lessons, 14,563 exercises.\n\n| Subject | Courses | Grades | Lessons | Exercises | Outdated courses |\n|---|---|---|---|---|---|\n| Maths | 11 | R, 1, 2, 3, 4, 5, 6, 7, 8, 9 | 792 | 4594 |  |\n| English | 10 | R, 1, 2, 3, 4, 5, 6, 7, 8, 9 | 736 | 3948 |  |\n| Foreign languages | 10 | ungraded | 407 | 2416 |  |\n| English (foreign or additional language) | 8 | 1, 2, ungraded | 186 | 1191 | 2 |\n| Preschool | 7 | R | 152 | 608 |  |\n| Science | 3 | 1, 2, 3, 4, 5, 6 | 123 | 703 |  |\n| History | 2 | 1, 2, 3, 4, 5, 6 | 60 | 323 | of reach: read-a-passage-then-answer,\n  tap-on-picture, written-maths grid, syllable marking (German), timed\n  reading. Next: a ranked backlog in schoolido-learning against\n  `schemas/question-types/` and what the app renders.\n- **F-006 → German literacy.** `syllabifier` (syllable arcs) and `flashRead`\n  (Blitzlesen) are standard in German primary teaching and absent from Twist.\n  Input for the de/ repair and the German en-LOI standard.\n\n## Lesson flow\n\n- **F-007, F-008 → feedback design.** Retry in place, a reveal after a\n  mistake that counts neither right nor wrong, and Prüfen for constructive\n  tasks. Compare with Twist's 3-tier hints and repeat-on-failure.\n- **F-009 → lesson length.** Anton lessons are 4 to 8 exercises of about 14\n  items. A Twist part is one 6 to 7 step sitting of 25 to 35 questions.\n  Input for the depth contract.\n- **F-010 → motivation.** Stars per exercise, trophies for tests, coins for\n  games. Twist has none of these in content; this is an app decision.\n\n## Curriculum and catalogues\n\n- **F-003, F-004 → crosswalk (Phase 3).** Full topic maps for both\n  curricula, every grade, are now in the catalogue. The crosswalk against\n  the 24 Twist catalogues can start once 1f finishes.\n\n## Method\n\n- **F-011 → how future sources are sampled.** Spreading a sample across\n  courses missed 3 trainers that live in a few lessons. For Phase 2, sample\n  by lesson within each course, or fetch structure plus full text for the\n  core subjects straight away.\n"},{"path":"catalogue/views/anton-trainers.md","md":"# Anton trainer types\n\nGenerated by `catalogue/build.mjs`. Do not edit by hand.\n\nFrom 31804 captured exercise files. An exercise can use more than one trainer, so the exercise counts add up to more than the files.\n\n| Trainer | Exercises | Items | Courses | Subjects | Example exercise titles |\n|---|---|---|---|---|---|\n| `gap` | 7529 | 43790 | 95 | Maths 3035, English (foreign or additional language) 1287, English 1239
