<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoolido R&amp;D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: research desk. Sticky tab bar over one working pane per tab; English-GB in cobalt, German-DE in ochre throughout. */
:root {
  --bg: #f2f5f6;
  --surface: #ffffff;
  --sunk: #e8edf0;
  --ink: #15202a;
  --muted: #5b6875;
  --line: #d6dde2;
  --accent: #0e7169;
  --en: #2d5bd0;
  --de: #a96d12;
  --done: #2c7a50;
  --gate: #b4383b;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 36px; --s7: 56px;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #151d25; --sunk: #1b252f; --ink: #e5ebf0; --muted: #92a0ad;
    --line: #26323d; --accent: #3fc0b3; --en: #84a5ff; --de: #e0ac55; --done: #5cc08b; --gate: #f07a7c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #151d25; --sunk: #1b252f; --ink: #e5ebf0; --muted: #92a0ad;
  --line: #26323d; --accent: #3fc0b3; --en: #84a5ff; --de: #e0ac55; --done: #5cc08b; --gate: #f07a7c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; max-width: 68ch; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.eyebrow { font: 600 11px/1 var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header.top { padding-block: var(--s6) var(--s5); display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: var(--s5) var(--s6); align-items: end; }
header.top .intro { display: grid; gap: var(--s3); min-width: 0; }
header.top .sub { color: var(--muted); max-width: 62ch; font-size: 16px; }
header.top h1 .en { color: var(--en); } header.top h1 .de { color: var(--de); }
@media (max-width: 820px) { header.top { grid-template-columns: 1fr; } }
.next { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s2); min-width: 0; }
.next .step-name { font: 700 18px/1.2 var(--display); }
.next .cmd { display: flex; gap: var(--s2); align-items: stretch; min-width: 0; }
.next code { flex: 1; min-width: 0; background: var(--sunk); border-radius: 4px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
.btn { font: 600 12px/1 var(--body); padding: 0 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink); }

/* age ladder */
.ladder-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ladder { min-width: 720px; display: grid; grid-template-columns: 120px repeat(8, minmax(0, 1fr)); position: relative; padding: var(--s4) var(--s4) var(--s3); }
.ladder .band { grid-row: 1 / span 4; position: relative; background: color-mix(in srgb, var(--accent) 9%, transparent); border-inline: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 4px; z-index: 0; }
.ladder .ages, .ladder .rowlab, .ladder .cell { position: relative; z-index: 1; }
.ladder .ages { font: 600 11px var(--mono); color: var(--muted); text-align: center; padding-bottom: var(--s2); }
.ladder .rowlab { display: grid; align-content: center; gap: 2px; padding-right: var(--s3); }
.ladder .rowlab b { font: 700 14px/1.2 var(--display); }
.ladder .rowlab span { font-size: 12px; color: var(--muted); }
.ladder .cell { display: grid; justify-items: center; gap: 4px; padding: 4px 6px; min-width: 0; background: none; border: 0; font: inherit; color: inherit; }
.ladder button.cell { cursor: pointer; border-radius: 4px; }
.ladder button.cell:hover { background: var(--sunk); }
.ladder .uk { align-content: end; height: 150px; }
.ladder .dk { align-content: start; height: 150px; }
.ladder .col { width: 28px; border-radius: 3px 3px 0 0; background: var(--en); }
.ladder .dk .col { border-radius: 0 0 3px 3px; background: var(--de); }
.ladder .cell .v { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.ladder .cell .g { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ladder .tw { padding: 10px 4px; border-block: 1px solid var(--line); }
.ladder .tw .tag { font: 700 15px var(--display); color: var(--accent); }
.ladder .tw .g { white-space: normal; text-align: center; line-height: 1.35; }
.ladder .older .v { font-size: 15px; }
.ladder .older { align-content: center; }
.ladder .none { color: var(--muted); font-size: 12px; opacity: 0.6; align-self: center; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s3); position: relative; }
.pipe::before { content: ""; position: absolute; left: 14px; right: 14px; top: 14px; height: 2px; background: var(--line); }
.node { position: relative; display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.node .pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--mono); background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.node.active .pin { border-color: var(--accent); color: var(--accent); }
.node.done .pin { background: var(--done); border-color: var(--done); color: var(--surface); }
.node .t { font: 700 15px/1.25 var(--display); }
.node .d { font-size: 13px; color: var(--muted); }
.node .gate-flag { justify-self: start; }
@media (max-width: 820px) {
  .pipe { grid-template-columns: 1fr; gap: var(--s4); }
  .pipe::before { left: 14px; right: auto; top: 14px; bottom: 14px; width: 2px; height: auto; }
  .node { grid-template-columns: 30px 1fr; column-gap: var(--s3); }
  .node > :not(.pin) { grid-column: 2; }
  .node .pin { grid-row: 1 / span 4; }
}

/* folder map */
.fmap { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
@media (max-width: 820px) { .fmap { grid-template-columns: 1fr; } }
.fmap dl { margin: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fmap dl > div { display: grid; grid-template-columns: 9.5em 1fr; gap: var(--s3); padding: 10px var(--s4); border-bottom: 1px solid var(--line); }
.fmap dl > div:last-child { border-bottom: 0; }
.fmap dt { font: 600 13px var(--mono); }
.fmap dd { margin: 0; font-size: 14px; color: var(--muted); min-width: 0; }
@media (max-width: 520px) { .fmap dl > div { grid-template-columns: 1fr; gap: 2px; } }

/* phase rail */
.phase { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--s4); }
.phase .no { font: 700 40px/1 var(--display); color: var(--line); }
.phase.current .no { color: var(--accent); }
.phase .body { display: grid; gap: var(--s4); min-width: 0; padding-bottom: var(--s5); border-bottom: 1px solid var(--line); }
.phase:last-child .body { border-bottom: 0; }
@media (max-width: 520px) { .phase { grid-template-columns: 1fr; gap: var(--s2); } .phase .no { font-size: 28px; } }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
nav.tabs .wrap { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; }
nav.tabs button {
  font: 600 14px/1 var(--body); color: var(--muted); background: none; border: 0;
  padding: 14px 12px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font: 600 11px var(--mono); color: var(--muted); margin-left: 4px; }

main { padding-block: var(--s5) var(--s7); }
section.pane { display: grid; gap: var(--s6); }
.block { display: grid; gap: var(--s4); min-width: 0; align-content: start; }
td .chip, .chip { white-space: nowrap; }
section.pane > *, .block > *, .panel > * { min-width: 0; }
.node .chip, .panel .chip { justify-self: start; }
.block-head { display: grid; gap: var(--s2); }

/* chips and status */
.chip {
  display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body);
  padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.todo { color: var(--muted); }
.chip.active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chip.done { color: var(--done); border-color: color-mix(in srgb, var(--done) 45%, var(--line)); }
.chip.gate { color: var(--gate); border-color: color-mix(in srgb, var(--gate) 45%, var(--line)); }
.chip.en { color: var(--en); } .chip.de { color: var(--de); }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* counters */
.counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.counter { padding: var(--s4); display: grid; gap: 4px; border-right: 1px solid var(--line); }
.counter:last-child { border-right: 0; }
.counter b { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.counter.zero b { color: var(--muted); opacity: 0.55; }
.counter span { font-size: 13px; color: var(--muted); }

/* step track */
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s2); }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.step .id { font: 700 20px/1 var(--display); }
.step .what { font-size: 13px; color: var(--muted); }
.step.gated { border-top: 3px solid var(--gate); }
@media (max-width: 760px) { .track { grid-template-columns: 1fr 1fr; } }

/* two-col */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s4); display: grid; gap: var(--s3); align-content: start; min-width: 0; }
.panel.en { border-top: 3px solid var(--en); } .panel.de { border-top: 3px solid var(--de); }

/* bars */
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 15em) 1fr minmax(3.5em, auto); gap: var(--s3); align-items: center; font-size: 13px; }
.bar-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .val { text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { height: 12px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.en .bar i, .bar.en i { background: var(--en); }
.de .bar i, .bar.de i { background: var(--de); }
@media (max-width: 520px) { .bar-row { grid-template-columns: minmax(0, 9em) 1fr 3em; } }

/* curriculum explorer */
.explorer { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: var(--s5); align-items: start; }
@media (max-width: 820px) { .explorer { grid-template-columns: 1fr; } }
.grade-list { display: grid; gap: var(--s4); }
.grade-group { display: grid; gap: 4px; }
.grade-btn {
  display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s2); text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; cursor: pointer; color: var(--ink); font: inherit;
}
.grade-btn:hover { border-color: var(--muted); }
.grade-btn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--cur, var(--ink)); }
.grade-btn .g { font-weight: 600; }
.grade-btn .n { font: 12px var(--mono); color: var(--muted); }
.grade-btn .bar { grid-column: 1 / -1; height: 5px; }
.sec-list { display: grid; gap: 2px; }
details.sec { border-bottom: 1px solid var(--line); }
details.sec summary { list-style: none; cursor: pointer; padding: 8px 0; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec .detail { padding: 0 0 var(--s3); font-size: 14px; color: var(--muted); max-width: 72ch; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px/1.3 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* lists */
ul.items { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s3); }
ul.items li { display: grid; gap: 2px; font-size: 14px; }
ul.items li b { font-weight: 600; }
ul.items li span { color: var(--muted); }
ol.payoff { margin: 0; padding: 0; list-style: none; counter-reset: p; display: grid; gap: var(--s3); }
ol.payoff li { counter-increment: p; display: grid; grid-template-columns: 2.2em 1fr; gap: var(--s2); font-size: 14px; }
ol.payoff li::before { content: counter(p); font: 700 18px/1.2 var(--display); color: var(--accent); }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: var(--s5); display: grid; gap: var(--s2); background: var(--surface); }
.note { font-size: 13px; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
input[type="search"] { font: inherit; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); min-width: 0; flex: 1 1 200px; }

/* docs */
.docs { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: var(--s5); align-items: start; }
@media (max-width: 820px) { .docs { grid-template-columns: 1fr; } }
.doc-list { display: grid; gap: 2px; position: sticky; top: 60px; }
@media (max-width: 820px) { .doc-list { position: static; } }
.doc-list button { text-align: left; font: 13px var(--mono); background: none; border: 0; padding: 6px 8px; border-radius: 4px; color: var(--muted); cursor: pointer; overflow-wrap: anywhere; }
.doc-list button:hover { color: var(--ink); background: var(--sunk); }
.doc-list button[aria-current="true"] { color: var(--ink); background: var(--sunk); font-weight: 600; }
.doc-list .dir { font: 600 11px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; }
.prose { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s5); min-width: 0; overflow-wrap: anywhere; }
.prose > * + * { margin-top: 0.8em; }
.prose h1 { font-size: 26px; } .prose h2 { font-size: 20px; margin-top: 1.4em; } .prose h3 { font-size: 16px; margin-top: 1.2em; }
.prose p, .prose li { max-width: 72ch; }
.prose pre { background: var(--sunk); padding: var(--s3); border-radius: 4px; overflow-x: auto; font-size: 13px; }
.prose table { display: block; overflow-x: auto; }
.prose blockquote { margin: 0; padding: var(--s2) var(--s4); border-left: 3px solid var(--accent); background: var(--sunk); color: var(--muted); }


/* course grid */
.cg-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.cg { display: grid; min-width: 760px; padding: var(--s3) var(--s4) var(--s4); row-gap: 4px; position: relative; }
.cg-h { font: 600 11px var(--mono); color: var(--muted); text-align: center; padding-bottom: 6px; position: relative; z-index: 1; }
.cg-h:first-child { text-align: left; }
.cg-col { z-index: 0; }
.cg-col.tw { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.cg-subj { display: flex; gap: var(--s3); align-items: baseline; padding: var(--s3) 0 2px; border-top: 1px solid var(--line); position: relative; z-index: 1; }
.cg-subj b { font: 700 14px var(--display); }
.cg-subj span { font-size: 12px; color: var(--muted); }
.cg-name { grid-column: 1; font-size: 13px; padding-right: var(--s3); align-self: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: relative; z-index: 1; }
.cg-bar { position: relative; z-index: 1; height: 24px; margin: 0 2px; border-radius: 4px; border: 1px solid color-mix(in srgb, currentColor 40%, transparent); background: color-mix(in srgb, currentColor 10%, var(--surface)); cursor: pointer; overflow: hidden; padding: 0; font: 600 11px var(--mono); text-align: left; }
.cg-bar.en { color: var(--en); } .cg-bar.de { color: var(--de); }
.cg-bar i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: color-mix(in srgb, currentColor 28%, transparent); }
.cg-bar span { position: relative; padding-inline: 6px; white-space: nowrap; color: var(--ink); line-height: 22px; }
.cg-bar:hover, .cg-bar.sel { border-color: currentColor; box-shadow: 0 0 0 1px currentColor; }
.cg-bar.outdated { opacity: 0.5; border-style: dashed; }

/* anatomy */
.anat { display: grid; gap: var(--s3); }
.anat-head, .anat-row { display: grid; grid-template-columns: 9em minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); align-items: stretch; }
.anat-head span { font: 600 11px var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.anat-head .tw { color: var(--accent); } .anat-head .an { color: var(--en); }
.anat-level { font: 700 15px/1.25 var(--display); padding-top: 12px; }
.anat-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s3) var(--s4); display: grid; gap: 6px; align-content: start; min-width: 0; font-size: 14px; }
.anat-card.tw { border-left: 3px solid var(--accent); }
.anat-card.an { border-left: 3px solid var(--en); }
.anat-card .size { font: 600 12px var(--mono); color: var(--muted); }
.anat-card .labels { font-size: 12.5px; color: var(--muted); }
.anat-card.none { background: var(--sunk); border-style: dashed; color: var(--muted); }
.anat-note { grid-column: 2 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
@media (max-width: 760px) {
  .anat-head { display: none; }
  .anat-row { grid-template-columns: 1fr; }
  .anat-level { padding-top: var(--s3); }
  .anat-card.tw::before { content: "Twist"; font: 600 11px var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
  .anat-card.an::before { content: "Anton"; font: 600 11px var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--en); }
  .anat-note { grid-column: 1; }
}
footer { padding-block: var(--s5); border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.4s ease; } }
</style>
</head>
<body>


<header class="top wrap">
  <div class="intro">
    <span class="eyebrow">Schoolido R&amp;D · source: anton.app</span>
    <h1 id="headline">Anton, <span class="en">English-GB</span> and <span class="de">German-DE</span></h1>

tro":"","sections":[{"name":"Vokabel-Training (leicht)","count":null,"exercises":110,"detail":"greetings; colours (3 lessons); numbers 1 to 10 (2); body (2); family (2); school (3); outdoors (town, nature, transport)","summed":false},{"name":"Kurs A1, 14 themes","count":null,"exercises":487,"detail":"greetings and introductions (7); school (10, incl. articles, plurals, haben, possessives, numbers 13 to 20); classroom phrases (3); hobbies (12, incl. verb conjugation and modal verbs); shopping (6, incl. numbers to 100 and money); food (6, incl. comparatives); continents and languages (2); people, clothes and feelings (10); health (3); animals (5); home (6, incl. prepositions with dative); seasons (4); weather (2); time and calendar (1)","summed":false},{"name":"Also listed but not mapped: Alphabetisierung (342), Kurs A2 (216), Vokabel-Training (238)","count":null,"detail":"","summed":false}]}],"types":{"intro":"Each Anton lesson (\"Übung\" in German) holds 3 to 9 named exercises. Each exercise is a run of about 12 items with a progress bar. Types below are inferred from exercise titles in the 33 sampled lessons, about 200 exercises, plus three exercises opened directly. Frequencies are approximate.","rows":[{"type":"Select / choose (Find, Choose, Choose Sound, Yes or No, \"Die richtige ... auswählen\")","share":"about 25%","pct":25,"notes":"Tile grid, often with an audio prompt. Observed as a 2x2 letter grid with \"select the letter that matches the sound\"."},{"type":"Test (end-of-lesson)","share":"about 12% (1 per lesson)","pct":12,"notes":"Present in 24 of 33 sampled lessons. Missing from phonics-sound, reading-text and practice-paper lessons."},{"type":"Reading a named text with questions","share":"about 12%","pct":12,"notes":"Stories, fables, informational texts, haikus, fairy tales. Each text is its own exercise."},{"type":"Match / sort / drag (Match, Sort, Drag Pictures and Sounds, \"zuordnen\", \"sortieren\", Categorising)","share":"about 12%","pct":12,"notes":""},{"type":"Typed production (Spell, Writing Whole Words, \"Wörter hören und schreiben\", \"eintragen\", Converting to the passive, Writing Speech)","share":"about 10%","pct":10,"notes":"Spelling from audio (dictation) is routine from Klasse 1 and Year 1."},{"type":"Fill the gap (\"einsetzen\", Fill in, Adding Commas, \"Wortenden ergänzen\")","share":"about 8%","pct":8,"notes":""},{"type":"Tap or mark in text (Finding Fronted Adverbials, Finding Silent Letters, \"markieren\", \"Störenfriede streichen\")","share":"about 7%","pct":7,"notes":"Observed as tap-the-word in a sentence, with a photo and sentence audio."},{"type":"Learn / explain (\"Learn s\", \"Erklärung\", \"kennenlernen\", \"What is a Haiku?\")","share":"about 6%","pct":6,"notes":"The main teaching surface. It is an exercise in the list, not a separate step. Some drill exercises also open with a narrated animated explainer slide."},{"type":"Build / order (Combine, Building Lists, \"Satz zusammenbauen\", ordering a story, Satzsalat)","share":"about 5%","pct":5,"notes":""},{"type":"Error correction (Correcting Mistakes, Correcting Spellings, \"Fehler berichtigen\")","share":"about 3%","pct":3,"notes":""},{"type":"Handwriting / tracing (\"Write Aa\", Schreibschrift)","share":"small in samples, large in Klasse 2","pct":null,"notes":"60 cursive lessons in Deutsch Klasse 2 alone"},{"type":"Timed reading (Blitzlesen)","share":"4 lessons per grade in Deutsch K1 to K3","pct":null,"notes":"Words flash briefly and the child picks the match"},{"type":"Other (word search, read-and-colour, interviews, practice papers)","share":"about 2%","pct":2,"notes":""}]},"alignment":{"head":["Our grade","Age","UK English","Deutsch"],"rows":[["G1","6 to 7","Year 2 (Year 1 for phonics, see gaps)","Klasse 1"],["G2","7 to 8","Year 3","Klasse 2"],["G3","8 to 9","Year 4","Klasse 3"],["G4","9 to 10","Year 5","Klasse 4"]],"note":"Our G1 English content (CVC words, short vowels, word families) matches UK Reception and Year 1 phonics, one year younger than the age mapping suggests. Both mappings are used below where it matters."},"gaps":{"size":{"head":["","Ours: topics / parts","Anton UK English: lessons","Ours German: topics / parts","Anton Deutsch: lessons"],"rows":[["G1","32 / 116","164 (Y1), 117 (Y2)","26 / 93","91"],["G2","41 / 134","88 (Y3)","29 / 93","69 + 60 handwriting"],["G3","31 topics","70 (Y4)","23 topics","100"],["G4","28 topics","90 (Y5)","25 topics","67"]],"note":"Our units are not the same size as Anton's. One of our parts is a 6 to 7 step sitting of about 25 to 35 questions, while one Anton lesson is 3 to 9 exercises of about 12 items each. By item volume the two are closer than the lesson counts suggest. By distinct topics, Anton has 2 to 4 times more per grade in English, and 2 to 4 times more in German from Klasse 2 on."},"groups":[{"title":"English: Anton has it, we do not","items":[{"lead":"A full synthetic phonics sequence","rest":"Anton teaches about 90 graphemes one lesson each (Reception plus Year 1), in a published order with cumulative reviews. We have CVC, short vowels, word families (G1), and blends, digraphs ch/sh/th/wh, vowel teams oa/ui and silent letters (G2). We do not cover most Phase 3 to 5 graphemes: ai, ee, igh, oa, oo, ar, or, ur, ow, oi, ear, air, ure, er, the alternative spellings (ay, ou, ie, ea, oy, ir, ue, aw, ew, oe, au, ey) or the split digraphs a-e to u-e."},{"lead":"Letter knowledge depth","rest":"Anton has one lesson per letter plus case and ABC order (36 lessons). We cover A to Z in two topics (Letter Recognition and Letter Sounds, 6 parts each), which puts about five letters in each part."},{"lead":"Spelling as its own strand","rest":"Anton has 15 to 32 spelling lessons per year, plus word-list practice tied to the statutory lists, plus typed spelling. Spelling appears in our G2 (`spelling-patterns`), G3 (`spelling-patterns-advanced`) and G4 (`spelling-patterns-and-rules`) at 2 to 3 parts each."},{"lead":"Grammar breadth","rest":"Anton covers word classes we skip: pronoun types (personal, possessive, reflexive, indefinite), determiners and demonstratives, articles, Standard English, formal/informal, relative clauses, passive voice, modal verbs (\"degrees of possibility\"), present perfect, progressive form, paragraph cohesion."},{"lead":"Punctuation breadth","rest":"Anton covers commas in lists, apostrophes (possession and contraction), direct speech, parenthesis, colons, semi-colons, dashes, bullet points and hyphens, 7 to 12 lessons per year. We have capitals, end marks (G1) and quotes and commas (G3, G4)."},{"lead":"Reading volume","rest":"Anton writes a new text for each reading exercise (plays, films, limericks, haikus, fables, informational texts). Our reading topics teach comprehension skills on short passages."},{"lead":"Test prep","rest":"Year 2 has KS1 SATs practice papers. We have no exam-format practice."}],"text":[]},{"title":"English: we have it, Anton does not","items":[{"lead":"Writing as a process","rest":"We cover brainstorm, plan, draft, revise and edit; personal narrative, opinion, informational, research and five-paragraph essays; writing for different purposes (G1 to G4). In the sampled years Anton's writing is sentence-level grammar and punctuation, with no composition strand in UK English up to Year 5."},{"lead":"Speaking, listening, media, digital","rest":"We have communication skills (G1), presentation skills, media literacy, research skills and digital literacy or citizenship (G2 to G4). Anton UK English has none of these in Years 1 to 5."},{"lead":"Fluency instruction","rest":"Our reading fluency topics (accuracy, phrasing, expression, self-correction) have no Anton UK counterpart. Anton's Blitzlesen appears only in German."}],"text":[]},{"title":"German: Anton has it, we do not","items":[{"lead":"Beginning reading (Erstlesen)","rest":"Anton Klasse 1 has 47 letter lessons in Fibel order, syllable reading, then words, sentences and texts. Our G1 German has five phonics topics (alphabet, letter sounds, short vowels, umlauts, basic consonants) and then switches to vocabulary. It has no syllable reading and no word-to-sentence-to-text progression."},{"lead":"Rechtschreibstrategien","rest":"Silbenschwingen, Verlängern, Ableiten and Merkwörter run as a repeated strand in Klasse 2 to 4 with 4 to 12 lessons per year. We have nothing comparable. This is the core of German primary spelling."},{"lead":"Handwriting","rest":"Anton has 60 cursive lessons in three Ausgangsschrift variants. We have 40 `tracing` items in the whole English and German tree."},{"lead":"Dictation and typed production","rest":"\"Wörter hören und schreiben\" appears from Klasse 1. We have 679 `text_input` items across all of English and German G1 to G4, under 2% of items."},{"lead":"Grammar sequence","rest":"Satzglieder, Wortarten with word-formation suffixes, strong and weak verbs, Wörtliche Rede with three speech-tag positions, das/dass. Our G3/G4 German covers gender, cases, conjugation, plurals and Präteritum, but has no Satzglieder topic and no direct-speech topic."},{"lead":"Text types","rest":"Märchen (Grimm, Andersen), Sagen, Balladen, Fabeln, Elfchen and Reizwortgeschichte."}],"text":[]},{"title":"German: we have it, Anton does not","items":[{"lead":null,"rest":"Formal and informal register (du/Sie), regional culture, festivals, notable figures, and literature and geography units (G3, G4)."},{"lead":null,"rest":"Essay structure (Aufsatz), letter writing (formal and informal) and research reporting at G4. Anton K4 has emails, reports and a little planning."},{"lead":null,"rest":"Media literacy at G4."}],"text":[]},{"title":"Our German track is not consistent across grades","items":[],"text":["Our G1/G2 German (numbers, colours, family, body, animals, food, weather, greetings, \"ich bin / ich habe\", question words) lines up almost one to one with DaZ Vokabel-Training (leicht) and the first themes of DaZ Kurs A1. That is by design: `docs/authoring/german-en-loi-standard.md` defines en-LOI German as German for English speakers. But that standard is scoped to `grade-{1,2}` only. Our G3/G4 German (cases, Präteritum, adjective endings, Aufsatz) lines up with Deutsch L1 Klasse 3/4. So the en-LOI learner switches from German as a foreign language to native-speaker German between G2 and G3, with no bridge. Anton keeps DaZ and Deutsch as separate subjects. We need to decide whether G3/G4 en-LOI German continues the foreign-language track (closer to DaZ A1/A2) or is a separate L1 track."]}]},"strengths":[{"title":"Our strengths","items":[{"lead":"Explicit teaching inside every part","rest":"Each part runs opener, warmup (3 prerequisite checks), teach (3 to 5 worked examples), guided practice with 3-tier hints, applied practice, challenge with transfer, and assessment. Anton's teaching is an optional \"Learn\" or \"Erklärung\" exercise or a short animated explainer, and its hints (Year 3 and up only) are one note per exercise. A child who gets an Anton item wrong can retry or reveal the answer. One of ours gets three item-specific hints first."},{"lead":"Assessment design","rest":"We have a baseline assessment per grade, a grade final, lesson finals as slot-based pools, and skill-indexed practice that can target weak skills. Anton has only end-of-lesson Tests (and KS1 papers), with no placement or diagnostic."},{"lead":"Coverage beyond decoding and grammar","rest":"Composition, speaking and listening, presentation, media and digital literacy, research, and culture. Anton UK English stops at grammar, punctuation, spelling and comprehension up to Year 5."},{"lead":"Narration as a designed product","rest":"We have an authored narration standard (speakable sounds, audio tags, deliberate pauses). Anton reads every prompt aloud with a speaker icon. It is functional, but I saw no character voice or pacing design."},{"lead":"One curriculum shipped in two languages of instruction","rest":"Every lesson exists in `en/` and `de/`. Anton keeps each language version separate, and the UK and DE trees share no structure."}]},{"title":"Our weaknesses","items":[{"lead":"Breadth","rest":"Anton has 2 to 4 times more distinct topics per grade in English, and in German from Klasse 2 on. The phonics, spelling and punctuation gaps listed above are the largest."},{"lead":"Few interaction types and almost no production","rest":"Across `content/en/grade-{1..4}/{english,german}` (about 36,900 typed items, practice banks included), 55% are multiple choice and 16% true/false. Typing (`text_input`, 679 items, 1.8%), speaking (107) and tracing (40) are close to absent. Anton has the child write, spell, dictate, build, correct and trace in nearly every skill lesson. Spelling cannot be taught well through multiple choice."},{"lead":"No systematic phonics progression in either language","rest":"Anton follows Letters and Sounds (UK) and the Fibel letter order (DE), with cumulative reviews after every sound set. Our phonics is a set of topics rather than one ordered sequence."},{"lead":"No German spelling strategies and no handwriting","rest":"These are core to German Klasse 1 to 4 and are what teachers and parents check against."},{"lead":"The German track switches from DaZ to L1 at G3","rest":"(see above)."},{"lead":"Thin text library","rest":"Anton gives each reading exercise its own story, play, fable or informational text. Ours reuse short passages per skill."},{"lead":"Curriculum alignment is unlabelled","rest":"Anton names its frameworks: National Curriculum, statutory word lists, KS1 SATs, Letters and Sounds, Ausgangsschrift. Our catalogues do not cite a standard, which makes them harder to sell to schools."}]},{"title":"Suggested follow-ups, in priority order","items":[{"lead":null,"rest":"Extend `german-en-loi-standard.md` to G3/G4, or split L1 German into its own track, before authoring more G3/G4 German."},{"lead":null,"rest":"Add a typed spelling item and a dictation item (audio to typed word) to the item types. Then retrofit the spelling topics."},{"lead":null,"rest":"Draft one ordered phonics sequence for G1 English (graphemes in order with cumulative reviews) and one Erstlesen sequence for G1 German. Map the existing topics into it."},{"lead":null,"rest":"Add the missing English grammar and punctuation topics to the G2 to G4 catalogues, using the Anton lists above as a checklist."},{"lead":null,"rest":"Add a Rechtschreibstrategien strand to German G2 to G4."},{"lead":null,"rest":"Tag each catalogue lesson with the framework objective it serves (for example English NC or Bildungsstandards)."}]}]},"findings":[{"id":"F-001","source":"anton","area":"exercise-types","finding":"Anton uses 66 distinct trainers (complete capture); fill-gap (1,574 sampled exercises) and choose-one (1,370) lead, then a long tail where 25 of 62 sampled trainers appear in fewer than 20 exercises","evidence":"`taxonomy.md`, `catalogue/views/anton-trainers.md`, `anton/notes/exercise-types.md`","status":"open","fedInto":""},{"id":"F-002","source":"anton","area":"exercise-types","finding":"9 shared Anton types have no Twist question type: teach screens, memory game, tap-on-picture, written-maths grid, colouring, timed reading, geometry transforms, syllable marking, read-a-passage-then-answer","evidence":"`taxonomy.md` (schoolido column)","status":"open","fedInto":""},{"id":"F-003","source":"anton","area":"curriculum","finding":"English-GB has 61 courses, 2,582 lessons, 14,563 exercises across 12 subjects; German-DE 71 courses, 2,945 lessons, 18,679 exercises across 15 subjects; both run from preschool to KS3 or Oberstufe","evidence":"`anton/notes/subjects.md`, `anton/api/plan/`","status":"open","fedInto":""},{"id":"F-004","source":"anton","area":"curriculum","finding":"Anton's Deutsch has 91 to 135 lessons per grade in Klasse 1 to 3; its UK English has 117 lessons in Year 2 and 165 in Year 1","evidence":"`anton/notes/topic-maps.md`, `catalogue/views/`","status":"open","fedInto":""},{"id":"F-005","source":"anton","area":"exercise-types","finding":"Some Anton interactions check only on a Prüfen button (coins into a purse, column subtraction grid, ordering, mirroring a shape) rather than per tap","evidence":"`anton/screenshots/1d/b0-dragAndValidate-start.png`, `d0-mathGrid-start.png`, `j0-dragSort-start.png`, `h0-shapeMirror-start.png`","status":"open","fedInto":""},{"id":"F-006","source":"anton","area":"curriculum","finding":"German literacy trainers absent from Twist: syllable marking (`syllabifier`, 42 exercises so far) and timed reading (`flashRead`, word shown about 2 s)","evidence":"`anton/screenshots/1d/90-flashRead-start.png`, `91-flashRead-word.png`, `taxonomy.md`","status":"open","fedInto":""},{"id":"F-007","source":"anton","area":"mechanics","finding":"A wrong answer adds a red progress segment and the learner retries the same item; the item never resets","evidence":"`anton/screenshots/1d/11-memory-wrong-feedback.png`, `53-dragMatch-wrong.png`, `anton/notes/lesson-mechanics.md`","status":"open","fedInto":""},{"id":"F-008","source":"anton","area":"mechanics","finding":"After a mistake a Lösen button reveals the answer; revealed items count grey, neither right nor wrong","evidence":"`anton/screenshots/1d/22-findAll-wrong.png`, `24-findAll-reveal.png`","status":"open","fedInto":""},{"id":"F-009","source":"anton","area":"mechanics","finding":"Lessons have a median of 6 exercises (90% have 4 to 8, over all 5,213); exercises average about 14 items; tests are separate exercises, 4,564 of 31,804","evidence":"`catalogue/catalogue.db` (lesson, exercise tables), `anton/notes/lesson-mechanics.md`","status":"open","fedInto":""},{"id":"F-010","source":"anton","area":"mechanics","finding":"Rewards: up to 3 stars per exercise, trophies for tests, coins (2 after one exercise) spent on games; no locks in school courses, sequential locks in preschool puzzles","evidence":"`anton/screenshots/1d/13-exercise-end.png`, `51-lesson-einzahl-mehrzahl.png`, `m2-spiele.png`, `l0-kidColorize-start-course.png`","status":"open","fedInto":""},{"id":"F-011","source":"anton","area":"other","finding":"A sample spread across courses (4 lessons per course) looked saturated at 62 trainers but missed 4 that live in a few lessons (`syllabifier`, `selectFrom100`, `squareMirror`, `squareShader`), found by the full-text pass","evidence":"`anton/tools/lists/sample-1c.txt`, `taxonomy.md`","status":"open","fedInto":""},{"id":"F-012","source":"anton","area":"media","finding":"Most lesson pictures are vector graphics (248 Anton lsg + 194 SVG) rather than bitmaps (98) in 12 sampled lessons; bitmaps are mainly covers and photos in content-heavy subjects","evidence":"`anton/notes/media.md`, `anton/media/`","status":"open","fedInto":""},{"id":"F-013","source":"anton","area":"audio","finding":"Every prompt is a separate short clip (603 clips, 2.7 s average) named by voice and text; 28 voice ids in 12 lessons, English mostly on two newer voices (f3_2025, m2_2025: 258 of 352 clips); voice names suggest a mix of synthetic and custom recordings","evidence":"`anton/notes/media.md`, `anton/media/sound/`","status":"open","fedInto":""}],"taxonomy":{"types":{"head":["type","description","Anton trainers (exercises in sample)","exercises","schoolido"],"rows":[["fill-gap","Complete a sentence, table or diagram label, typed or from buttons","`gapMulti` 707, `gap` 515, `lsg` 231, `table` 118, `flowText` 3","1574","fill-in-blank, text-input"],["choose-one","Pick one answer from text or picture options","`buttons` 544, `multipleChoice` 392, `imageButtons` 229, `selectCard` 128, `flipButtons` 73, `switchPath` 4","1370","multiple-choice, image-multiple-choice"],["teach","Explanation screen or narrated walkthrough; `contentPlayer` can be interactive (1d: tap the right character in an audio story)","`content` 432, `contentCard` 118, `contentPlayer` 95, `list` 4","649","none (Twist teach step, not a question type)"],["match-pairs","Connect items that belong together","`dragMatch` 348, `listMatchVertical` 1
