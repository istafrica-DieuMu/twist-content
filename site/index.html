research account, browsed by hand at human pace (one tab, pauses of 3 to 8 seconds between navigations). Research only. This note records titles, structure and exercise mechanics. It holds no question text, answers, audio or images. Question-level content would be a separate step and needs IST sign-off first.\n\n## Scope and method\n\n- Anton has no \"English (EU)\" version. The language versions are English (US), English (UK), Deutsch, Français, Español and Português (BR). English (UK) (`/en_gb/`, National Curriculum, Reception to KS3) is used here as the European English track.\n- German means the Deutsch language version (`/de/`): the Deutsch subject (L1, native speakers) and Deutsch Zweitsprache (DaZ, German as a second language). Both matter to us, because our G1/G2 German reads like DaZ and our G3/G4 German reads like Deutsch L1.\n- Covered: UK English Reception to Year 5, Deutsch Klasse 1 to 4, DaZ \"Kurs A1\" and \"Vokabel-Training (leicht)\" at section level. Not covered: UK Year 6, KS3, Deutsch Klasse 5 and up, DaZ Alphabetisierung, A2 and Vokabel-Training.\n- Lesson lists were read from the rendered pages. Exercise lists were read from 33 sampled lessons (24 English, 9 German), about 200 exercises in total. Three exercises were opened to see the interaction. No paywall, captcha or rate limit came up. One page hung on the loading screen after four full reloads in a row. It recovered after a 30-second pause, and from then on I navigated inside the app.\n- The account's language version was switched from English (US) to English (UK) and then to Deutsch. It is still set to Deutsch.\n\n### Age alignment\n\n| Our grade | Age | UK English | Deutsch |\n| --- | --- | --- | --- |\n| G1 | 6 to 7 | Year 2 (Year 1 for phonics, see gaps) | Klasse 1 |\n| G2 | 7 to 8 | Year 3 | Klasse 2 |\n| G3 | 8 to 9 | Year 4 | Klasse 3 |\n| G4 | 9 to 10 | Year 5 | Klasse 4 |\n\nOur G1 English content (CVC words, short vowels, word families) matches UK Reception and Year 1 phonics, one year younger than the age mapping suggests. Both mappings are used below where it matters.\n\n## How the course tree is served\n\nAll curriculum data comes from one static file endpoint on a content CDN. I recorded the URL shapes only. I did not save response bodies.\n\n- **Course tree per grade:** `GET https://content.anton.app/files/?fileId=plan/\u003cplan-id>&etag=\u003chash>-\u003csize>`. There is one JSON file per grade and subject, loaded when the grade page opens. The ETag suffix looks like a byte size (for example `b15f-215543` for Year 1 English, about 215 KB).\n  - UK English: `c-nateng-r-gb` (Reception), `c-nateng-1-gb` to `c-nateng-5-gb`\n  - Deutsch: `c-natdeu-1` to `c-natdeu-4`\n  - DaZ: `c-deu-a1` (Kurs A1), `c-mono-deu-0` (Vokabel-Training leicht)\n  - Maths for comparison: `c-mat-1`\n- **Plan index:** `fileId=list/plans&etag=latest`.\n- **Images:** `fileId=image/lsg_\u003c10-hex hash>&etag=\u003chash>-\u003csize>`, with about 160 thumbnails per grade page.\n- **App code:** `fileId=project/\u003cmodule>!master!\u003cversion>!0`, versioned through `fileId=projectVersions`. Each UI area is its own module (`app01-learn-list`, `app01-trainers`, `lsg2`, and so on).\n- **Mirrors:** `content.anton.app` and `content-2.anton.app`. The client pings both and fails over.\n- **Session traffic** goes to other hosts: `b-apis-db.anton.app` (POST, user actions), `apis-db-logger-s-lb-*.anton.app/apisLogger/subscribe` (GET long-poll with an auth token in the query string) and `logger.anton.app/events` (analytics).\n- **Page URLs** mirror the plan: `/en_gb/learn/uk-english-year-1/topic-08-alphabet/exercises-01-Aa/exercise-01/`, which is grade, then topic, then lesson (\"exercises\" in Anton's words), then exercise. Deep links reload to the landing page and resume after the account name is clicked.\n\n**Takeaway for us:** Anton ships one JSON tree per grade and subject, CDN-cached by ETag. Our per-module JSON layout is finer-grained. A per-grade index file of the same kind would cut app start-up requests, if the app needs that.\n\n## Topic maps\n\nFormat is section, then lesson titles, with lesson counts. The grade header gives Anton's own exercise count. Numbered repeats (for example \"Main Topic (1), (2)\") are folded together.\n\n### UK English, Reception (204 exercises, 51 lessons)\n\nSynthetic phonics in UK \"Letters and Sounds\" order. There are 13 sections, one per sound set, and one lesson per grapheme, 4 exercises each.\n\n- s, a, t, p; i, n, m, d; g, o, c, k; e, u, r; h, b, f, l; j, v, w, x; y, z, qu\n- Digraphs ff, ll, ss, zz, ck; sh, ch, th (hard and soft), ng\n- Digraphs and trigraphs ai, ee, oa, igh; oo (short and long), ar, or; ur, ow, oi, ear; er, air, ure\n\n### UK English, Year 1 (929 exercises, about 164 lessons)\n\n- **Reading, Phonics (22):** Phase 5 alternative graphemes (ay, ou, ie, ea, oy, ir, ue, aw, wh, ph, ew, oe, au, ey) and split digraphs a-e, e-e, i-e, o-e, u-e\n- **Reading, Phonics Review (20):** cumulative review of every sound set from Reception onward, 6 to 10 exercises each\n- **Reading, Words (19):** short-vowel words a/e/i/o/u, silent e, common short words (4 lessons plus practice), suffixes -s/-es and -ing/-ed/-er/-est, contractions, longer words, common exception words\n- **Reading, Texts (6):** Definitions, Fantasy and Reality, Stories, Rhyming Words (2), Categories\n- **VGP, Word (10):** nouns, plural nouns, -s/-es plurals, adjectives, verbs, prefixes, un-, noun/verb/adjective suffixes\n- **VGP, Sentence (5):** Words and Sentences, Types of Sentences (2), Question Words, Connectives\n- **VGP, Text (1):** Sequencing Sentences\n- **VGP, Punctuation (5):** Words and Spaces, Capital Letters, Capital I, Capital Letter Rules, Sentence Punctuation\n- **Spelling (32):** syllables, suffixes, un-, ff/ll/ss/zz/ck, nk, tch, ve, vowel digraph spelling sets (ai/oi/ay/oy, ar, ee/ea, er/ir/ur, oo/ue/ew, ou/ow, ie/igh, or/ore/aw/au, air/ear/are), y endings, ph/wh, k, compound words, common exception words, days of the week, colours\n- **Spelling Practice (8):** word-list drills, 4 words per list\n- **Alphabet (36):** one lesson per letter Aa to Zz, a review every 3 letters, then upper/lower case and alphabetical order\n\n### UK English, Year 2 (654 exercises, about 117 lessons)\n\n- **Reading, Words (16):** decoding (3), blending (2), blending longer words (2), common suffixes (2), common exception words (2), vowel digraphs, alternate vowel sounds, long vowels, consonant blends, consonant digraphs and trigraphs\n- **Reading, Texts (18):** Reading Comprehension (4), Text Types, Text Structure, Book Parts, Main Idea, Setting, Word Detectives, Characters, Events, Poems, Story Structure, Visualising, Analysing, Summarising, Comparing Texts\n- **VGP, Word (20):** nouns (2), plurals (2), compound nouns, adjectives, adverbs, adjectives and adverbs, verbs, personal pronouns (2), indefinite pronouns, possessive determiners, possessive pronouns, articles, demonstratives, noun/verb/adjective suffixes, comparative adjectives\n- **VGP, Sentence (5):** types of sentence, coordinating and subordinating conjunctions, prepositions, noun phrases\n- **VGP, Text (3):** present/past tense, present/past/future, progressive form\n- **VGP, Punctuation (9):** capitals and full stops, capital I, capital rules, sentence punctuation, commas in lists, possessive apostrophes, contractions (2), practice\n- **Spelling (15):** dge/ge/g, soft c, kn/gn, wr, le/el/al/il, ment/ness, ful/less/ly, suffixes, contractions, -tion, homophones, common exception words, syllables, synonyms and antonyms, shades of meaning\n- **Spelling Practice (11):** word lists\n- **KS1 Test Practice, Questions (10) and Spelling (10):** SATs-style practice papers, 4 exercises each\n\n### UK English, Year 3 (467 exercises, 88 lessons)\n\n- **Reading Comprehension, Fiction (14):** Asking Questions, Key Details, Fables (2), Point of View (2), Ordering Events, Problems and Solutions, Describing Pictures, Illustrating Stories, Rhyme, Alliteration, Comparing People, Fairytales\n- **Reading Comprehension, Non-Fiction (11):** Key Details, Main Topic (2), Purpose, Cause and Effect, Comparing (3), Image Information, Series and Steps, Text Features\n- **VGP, Word (20):** nouns, plurals, group nouns, adjectives (2), adverbs, adjectives and adverbs, verbs, verb forms, to be, to have, word families, personal/possessive/indefinite/reflexive pronouns, definite and indefinite articles, determiners, Standard English, nouns with prefixes and suffixes\n- **VGP, Sentence (6):** coordinating and subordinating conjunctions, prepositions, noun phrases, time/place/cause, fronted adverbials\n- **VGP, Text (6):** nouns and pronouns, tenses (2), progressive, present perfect, paragraphs, headings\n- **VGP, Punctuation (7):** capitals, end punctuation, commas, possessive apostrophes, contractions, direct speech, practice\n- **Spelling (16):** vowel suffixes, y, ou, prefixes in/un/mis/dis and re/sub/inter/super/anti/auto, -ation, -ly, -sure/-ture, -ous, -tion/-cian/-sion, ch, root words, sc, homophones, morphology and etymology\n- **Spelling Practice (8):** statutory Year 3/4 word list\n\n### UK English, Year 4 (359 exercises, 70 lessons)\n\n- **Fiction (8):** fables/folktales/myths (2), point of view (2), pictures (2), comparing (2)\n- **Non-Fiction (10):** informational texts, main topic (2), terms and phrases, series and steps (2), pictures (2), comparing (2)\n- **VGP, Word (14):** nouns, plurals, adjectives, adverbs, verbs, word families, pronouns, possession, plural vs possessive s, determiners, Standard English, prefixed and suffixed nouns\n- **VGP, Sentence (6):** conjunctions, prepositions, clauses, noun phrases, time/place/cause, fronted adverbials\n- **VGP, Text (6):** nouns and pronouns, tenses, progressive, present perfect, paragraphs, headings and subheadings\n- **VGP, Punctuation (7):** as in Year 3\n- **Spelling (11):** prefixes, -tion/-cian/-sion, -gue/-que, suffixes, root words, ei/eigh/ey, homophones, context clues, shades of meaning, double meaning, abbreviations\n- **Spelling Practice (8)**\n\n### UK English, Year 5 (500 exercises, 90 lessons)\n\n- **Fiction (10):** reading dramas, a play (2 parts), a film, poems, limericks, haikus, narrator, illustration information (2)\n- **Non-Fiction (9):** non-fiction texts, main topic (2), terms and phrases (2), evidence and reason, interpreting information (2), combining information\n- **VGP, Word (12):** nouns, adjectives, adverbs, verbs, synonyms and antonyms, pronouns, determiners, Standard English, formal and informal, verb prefixes and suffixes\n- **VGP, Sentence (10):** conjunctions, prepositions, clauses, relative clauses (2), noun phrases, fronted adverbials, degrees of possibility, passive voice, formal structures\n- **VGP, Text (7):** nouns and pronouns, tenses, progressive, perfect, paragraph cohesion, linking paragraphs, layout devices\n- **VGP, Punctuation (12):** capitals, end punctuation, commas (2), apostrophes, direct speech, parenthesis, colons/semi-colons/dashes, colons in lists, bullet points, hyphens, practice\n- **Spelling (22):** prefixes (2), hyphenating prefixes, -cious/-tious, -tial/-cial, -ant/-ent families, -able/-ible, suffixes (2), ei/ie, ough, silent letters, unstressed vowels, alternate sounds (2), homophones (4), words in context, sayings and expressions, figures of speech\n- **Spelling Practice (8):** statutory Year 5/6 word list\n\n### Deutsch, Klasse 1 (564 exercises, about 91 lessons)\n\n- **Buchstaben und ihre Laute lernen (1) (31):** letters in the Fibel order L, O, A, M, I, S, T, E, N, D, U, P, K, B, F, Ei, R, H, W, G, Au, Sch, Z, Eu, Ch, J, plus ie and cumulative \"Übungen\" reviews after each new letter\n- **Buchstaben und ihre Laute lernen (2) (16):** Ö, Ü, Ä, St, Sp, Pf, ng, nk, Qu, V, C, Y, X, Äu, ck, ß\n- **Silben lesen (3):** one, two and three syllables\n- **Erste Wörter lesen (6):** ABC order, words and pictures, similar words, singular/plural, word chains, riddles\n- **Erste Sätze lesen (4):** picture-sentence matching, descriptions, key words, \"Malen mit Anton\" (read and colour)\n- **Erste Texte lesen (4):** short texts, ordering a story, finding headings, reading tables\n- **Erste Wörter schreiben (7):** copying words, gap words, building words, word snakes, plurals, capitalisation, suffixes\n- **Erste Sätze schreiben (6):** copying sentences, dictation, articles, shuffled sentences, \"Satzsalat\", gap sentences\n- **Sprechen und Zuhören (10):** rhymes, poems, emotions, play stories, tongue twisters, jokes, theme stories (trees, animals, plants, travel)\n- **Blitzlesen, Grundwortschatz (4):** timed sight-reading, easy/medium/hard/function words\n\n### Deutsch, Klasse 2 (860 exercises, 69 lessons plus 60 handwriting lessons)\n\n- **Grammatik:** Nomen (7: noun basics, compounds, definite/indefinite articles, singular/plural), Verben (3: basics, conjugation, prefixed verbs), Adjektive (3), Satzarten/Satzzeichen (4), Oberbegriffe/Wortfelder (2)\n- **Rechtschreibung:** Silben (3), vowels/umlauts/diphthongs/consonants (5), special sounds Sp/St, Qu, V, tz, chs, x (6), Wortstamm/Wortfamilie (2), strategies (6: Silbenschwingen, lengthening d/t, b/p, g/k, deriving ä and äu), capitalisation (2), ABC (2)\n- **Lesen:** Genau lesen (4), pictograms and diagrams (2), understanding texts (6: key words, skimming, finding information, inferring words, reading riddles, text types)\n- **Schreiben (8):** lists, invitations, letters, poems, writing to pictures, profiles and descriptions, describing a process, revising\n- **Blitzlesen (4)**\n- **Schreibschrift (60):** three cursive scripts (Schulausgangsschrift 18, Vereinfachte Ausgangsschrift 21, Lateinische Ausgangsschrift 21), letter groups traced in order\n\n### Deutsch, Klasse 3 (588 exercises, about 100 lessons)\n\n- **Grammatik:** Nomen (9: incl. pronouns, compounds, -ung/-nis/-heit/-keit), Verben (8: strong/weak in present and past, prefixes ver/vor/ab/zer/auf/ein/aus/...), Adjektive (8: opposites, -ig/-lich, three compound types, comparison), Satzglieder (5: subject, predicate, identifying, building, moving), Satzarten (2), Wörtliche Rede (3: speech tag before, inside and after)\n- **Rechtschreibung:** Silben (4), short and long vowels (5: double consonants, ck, tz, i/ie), special sounds (5), strategies (12: lengthening, Merkwörter for double vowels, long i, Dehnungs-h, ß, deriving ä/äu), capitalisation (3), Wörterbuch (2), correcting errors (2)\n- **Lesen:** Genau lesen (3), pictograms and diagrams (2), understanding texts (4), text types (6: recipes, poems, fairy tales, Andersen, Grimm), books and library (2)\n- **Schreiben:** planning (3), writing (6: dictation, stories, Elfchen, haiku, descriptions, Reizwortgeschichten), revising (2)\n- **Blitzlesen (4)**\n\n### Deutsch, Klasse 4 (408 exercises, 67 lessons)\n\n- **Grammatik:** Nomen (4: incl. the four cases), Verben (7: Präteritum, Perfekt, Futur, imperative, compound verbs), Adjektive (3), Satzglieder (6: dative and accusative objects, place and time adverbials), Satzarten/Satzzeichen (5: das/dass, conjunctions, list commas, direct speech), Sprache erforschen (3: idioms, spoken vs written, loanwords)\n- **Rechtschreibung:** Silben (2), short/long vowels (8), s-sounds, ph, v (3), strategy review (4), capitalisation (4: hidden articles, multi-part proper names)\n- **Lesen:** graphs and tables (2), understanding texts (3), speaking and presenting (4: poem recital, giving a talk with feedback, preparing a presentation, interviews), text types (4: Sagen, Balladen, Fabeln, mixed)\n- **Schreiben:** planning (1), writing (4: emails, reports, describing feelings, dictation)\n\n### DaZ (German as a second language), section level\n\n- **Vokabel-Training (leicht) (110 exercises):** greetings; colours (3 lessons); numbers 1 to 10 (2); body (2); family (2); school (3); outdoors (town, nature, transport)\n- **Kurs A1 (487 exercises), 14 themes:** greetings and introductions (7); school (10, incl. articles, plurals, haben, possessives, numbers 13 to 20); classroom phrases (3); hobbies (12, incl. verb conjugation and modal verbs); shopping (6, incl. numbers to 100 and money); food (6, incl. comparatives); continents and languages (2); people, clothes and feelings (10); health (3); animals (5); home (6, incl. prepositions with dative); seasons (4); weather (2); time and calendar (1)\n- Also listed but not mapped: Alphabetisierung (342), Kurs A2 (216), Vokabel-Training (238)\n\n## Exercise type inventory\n\nEach Anton lesson (\"Übung\" in German) holds 3 to 9 named exercises. Each exercise is a run of about 12 items with a progress bar. Types below are inferred from exercise titles in the 33 sampled lessons, about 200 exercises, plus three exercises opened directly. Frequencies are approximate.\n\n| Type (Anton title pattern) | Rough share | Notes |\n| --- | --- | --- |\n| Select / choose (Find, Choose, Choose Sound, Yes or No, \"Die richtige ... auswählen\") | about 25% | Tile grid, often with an audio prompt. Observed as a 2x2 letter grid with \"select the letter that matches the sound\". |\n| Test (end-of-lesson) | about 12% (1 per lesson) | Present in 24 of 33 sampled lessons. Missing from phonics-sound, reading-text and practice-paper lessons. |\n| Reading a named text with questions | about 12% | Stories, fables, informational texts, haikus, fairy tales. Each text is its own exercise. |\n| Match / sort / drag (Match, Sort, Drag Pictures and Sounds, \"zuordnen\", \"sortieren\", Categorising) | about 12% | |\n| Typed production (Spell, Writing Whole Words, \"Wörter hören und schreiben\", \"eintragen\", Converting to the passive, Writing Speech) | about 10% | Spelling from audio (dictation) is routine from Klasse 1 and Year 1. |\n| Fill the gap (\"einsetzen\", Fill in, Adding Commas, \"Wortenden ergänzen\") | about 8% | |\n| Tap or mark in text (Finding Fronted Adverbials, Finding Silent Letters, \"markieren\", \"Störenfriede streichen\") | about 7% | Observed as tap-the-word in a sentence, with a photo and sentence audio. |\n| Learn / explain (\"Learn s\", \"Erklärung\", \"kennenlernen\", \"What is a Haiku?\") | about 6% | The main teaching surface. It is an exercise in the list, not a separate step. Some drill exercises also open with a narrated animated explainer slide. |\n| Build / order (Combine, Building Lists, \"Satz zusammenbauen\", ordering a story, Satzsalat) | about 5% | |\n| Error correction (Correcting Mistakes, Correcting Spellings, \"Fehler berichtigen\") | about 3% | |\n| Handwriting / tracing (\"Write Aa\", Schreibschrift) | small in samples, large in Klasse 2 | 60 cursive lessons in Deutsch Klasse 2 alone |\n| Timed reading (Blitzlesen) | 4 lessons per grade in Deutsch K1 to K3 | Words flash briefly and the child picks the match |\n| Other (word search, read-and-colour, interviews, practice papers) | about 2% | |\n\nThe landing page claims \"over 200 exercise types\".\n\n## Lesson structure and progression model\n\n- **Hierarchy:** subject, then grade (Year/Klasse), then section (for example \"Vocabulary, Grammar and Punctuation, Sentence\"), then lesson, then 3 to 9 exercises, then about 12 items. Grade pages say \"More topics are coming soon\".\n- **Typical skill lesson:** an optional Learn/Erklärung exercise, then 3 to 7 drills that change the interaction (find, sort, fill, build, correct, write), then a Test. Example: Year 5 \"Silent Letters\" runs Finding, five letter-specific drills, Adding, Spelling, then Test.\n- **Phonics lesson:** a fixed 4-exercise template per grapheme (Find Letter, Choose Sound, Choose Picture and Find Letter in Word, Drag Pictures and Sounds) with no test. Reviews come as separate cumulative lessons after every 2 to 4 graphemes (English) or after every new letter early on (Deutsch).\n- **Reading lessons:** one exercise per text, usually with no test.\n- **Item flow:** phonics and simple drill exercises open straight into a question. Strategy lessons (for example Deutsch Klasse 2 \"Wörter verlängern\") open with a narrated, animated explainer slide inside the first exercise, with replay and \"Weiter\". Every prompt has read-aloud audio. A correct answer gets a green outline and auto-advances. A wrong answer shows \"try again\" or \"reveal\" (the reveal strikes the wrong answer in red and shows the right one). From Year 3 on, some exercises have a \"Hint\" button that shows one narrated strategy note per exercise, not per item.\n- **Progression:** no locks. Every lesson in every grade can be opened directly. The plan file sets the order, and \"Last viewed\" marks where the learner left off.\n- **Rewards:** the profile card shows three counters. The UK landing page says learners \"earn stars and trophies through learning exercises and unlock fun games like puzzles, car races and pixel art\". I did not play a full exercise through to the reward screen.\n- **Assessment:** lesson Tests only, plus KS1 SATs-style practice papers in Year 2. I saw no placement or baseline test.\n\n## Gap comparison against our G1 to G4 catalogues\n\nOur side comes from the canonical catalogues in `content/en/grade-{1..4}/{english,german}` (the `content/pilot` tree is a partial staging copy and leaves out some G1 topics, such as letter recognition and letter sounds), and from `docs/taxonomy.md` for the lesson contract.\n\n### Size\n\n| | Ours: topics / parts | Anton UK English: lessons | Ours German: topics / parts | Anton Deutsch: lessons |\n| --- | --- | --- | --- | --- |\n| G1 | 32 / 116 | 164 (Y1), 117 (Y2) | 26 / 93 | 91 |\n| G2 | 41 / 134 | 88 (Y3) | 29 / 93 | 69 + 60 handwriting |\n| G3 | 31 topics | 70 (Y4) | 23 topics | 100 |\n| G4 | 28 topics | 90 (Y5) | 25 topics | 67 |\n\nOur units are not the same size as Anton's. One of our parts is a 6 to 7 step sitting of about 25 to 35 questions, while one Anton lesson is 3 to 9 exercises of about 12 items each. By item volume the two are closer than the lesson counts suggest. By distinct topics, Anton has 2 to 4 times more per grade in English, and 2 to 4 times more in German from Klasse 2 on.\n\n### English: Anton has it, we do not\n\n- **A full synthetic phonics sequence.** Anton teaches about 90 graphemes one lesson each (Reception plus Year 1), in a published order with cumulative reviews. We have CVC, short vowels, word families (G1), and blends, digraphs ch/sh/th/wh, vowel teams oa/ui and silent letters (G2). We do not cover most Phase 3 to 5 graphemes: ai, ee, igh, oa, oo, ar, or, ur, ow, oi, ear, air, ure, er, the alternative spellings (ay, ou, ie, ea, oy, ir, ue, aw, ew, oe, au, ey) or the split digraphs a-e to u-e.\n- **Letter knowledge depth.** Anton has one lesson per letter plus case and ABC order (36 lessons). We cover A to Z in two topics (Letter Recognition and Letter Sounds, 6 parts each), which puts about five letters in each part.\n- **Spelling as its own strand.** Anton has 15 to 32 spelling lessons per year, plus word-list practice tied to the statutory lists, plus typed spelling. Spelling appears in our G2 (`spelling-patterns`), G3 (`spelling-patterns-advanced`) and G4 (`spelling-patterns-and-rules`) at 2 to 3 parts each.\n- **Grammar breadth.** Anton covers word classes we skip: pronoun types (personal, possessive, reflexive, indefinite), determiners and demonstratives, articles, Standard English, formal/informal, relative clauses, passive voice, modal verbs (\"degrees of possibility\"), present perfect, progressive form, paragraph cohesion.\n- **Punctuation breadth.** Anton covers commas in lists, apostrophes (possession and contraction), direct speech, parenthesis, colons, semi-colons, dashes, bullet points and hyphens, 7 to 12 lessons per year. We have capitals, end marks (G1) and quotes and commas (G3, G4).\n- **Reading volume.** Anton writes a new text for each reading exercise (plays, films, limericks, haikus, fables, informational texts). Our reading topics teach comprehension skills on short passages.\n- **Test prep.** Year 2 has KS1 SATs practice papers. We have no exam-format practice.\n\n### English: we have it, Anton does not\n\n- **Writing as a process.** We cover brainstorm, plan, draft, revise and edit; personal narrative, opinion, informational, research and five-paragraph essays; writing for different purposes (G1 to G4). In the sampled years Anton's writing is sentence-level grammar and punctuation, with no composition strand in UK English up to Year 5.\n- **Speaking, listening, media, digital.** We have communication skills (G1), presentation skills, media literacy, research skills and digital literacy or citizenship (G2 to G4). Anton UK English has none of these in Years 1 to 5.\n- **Fluency instruction.** Our reading fluency topics (accuracy, phrasing, expression, self-correction) have no Anton UK counterpart. Anton's Blitzlesen appears only in German.\n\n### German: Anton has it, we do not\n\n- **Beginning reading (Erstlesen).** Anton Klasse 1 has 47 letter lessons in Fibel order, syllable reading, then words, sentences and texts. Our G1 German has five phonics topics (alphabet, letter sounds, short vowels, umlauts, basic consonants) and then switches to vocabulary. It has no syllable reading and no word-to-sentence-to-text progression.\n- **Rechtschreibstrategien.** Silbenschwingen, Verlängern, Ableiten and Merkwörter run as a repeated strand in Klasse 2 to 4 with 4 to 12 lessons per year. We have nothing comparable. This is the core of German primary spelling.\n- **Handwriting.** Anton has 60 cursive lessons in three Ausgangsschrift variants. We have 40 `tracing` items in the whole English and German tree.\n- **Dictation and typed production.** \"Wörter hören und schreiben\" appears from Klasse 1. We have 679 `text_input` items across all of English and German G1 to G4, under 2% of items.\n- **Grammar sequence.** Satzglieder, Wortarten with word-formation suffixes, strong and weak verbs, Wörtliche Rede with three speech-tag positions, das/dass. Our G3/G4 German covers gender, cases, conjugation, plurals and Präteritum, but has no Satzglieder topic and no direct-speech topic.\n- **Text types.** Märchen (Grimm, Andersen), Sagen, Balladen, Fabeln, Elfchen and Reizwortgeschichte.\n\n### German: we have it, Anton does not\n\n- Formal and informal register (du/Sie), regional culture, festivals, notable figures, and literature and geography units (G3, G4).\n- Essay structure (Aufsatz), letter writing (formal and informal) and research reporting at G4. Anton K4 has emails, reports and a little planning.\n- Media literacy at G4.\n\n### Our German track is not consistent across grades\n\nOur G1/G2 German (numbers, colours, family, body, animals, food, weather, greetings, \"ich bin / ich habe\", question words) lines up almost one to one with DaZ Vokabel-Training (leicht) and the first themes of DaZ Kurs A1. That is by design: `docs/authoring/german-en-loi-standard.md` defines en-LOI German as German for English speakers. But that standard is scoped to `grade-{1,2}` only. Our G3/G4 German (cases, Präteritum, adjective endings, Aufsatz) lines up with Deutsch L1 Klasse 3/4. So the en-LOI learner switches from German as a foreign language to native-speaker German between G2 and G3, with no bridge. Anton keeps DaZ and Deutsch as separate subjects. We need to decide whether G3/G4 en-LOI German continues the foreign-language track (closer to DaZ A1/A2) or is a separate L1 track.\n\n## Strengths and weaknesses against Anton\n\n### Our strengths\n\n1. **Explicit teaching inside every part.** Each part runs opener, warmup (3 prerequisite checks), teach (3 to 5 worked examples), guided practice with 3-tier hints, applied practice, challenge with transfer, and assessment. Anton's teaching is an optional \"Learn\" or \"Erklärung\" exercise or a short animated explainer, and its hints (Year 3 and up only) are one note per exercise. A child who gets an Anton item wrong can retry or reveal the answer. One of ours gets three item-specific hints first.\n2. **Assessment design.** We have a baseline assessment per grade, a grade final, lesson finals as slot-based pools, and skill-indexed practice that can target weak skills. Anton has only end-of-lesson Tests (and KS1 papers), with no placement or diagnostic.\n3. **Coverage beyond decoding and grammar.** Composition, speaking and listening, presentation, media and digital literacy, research, and culture. Anton UK English stops at grammar, punctuation, spelling and comprehension up to Year 5.\n4. **Narration as a designed product.** We have an authored narration standard (speakable sounds, audio tags, deliberate pauses). Anton reads every prompt aloud with a speaker icon. It is functional, but I saw no character voice or pacing design.\n5. **One curriculum shipped in two languages of instruction.** Every lesson exists in `en/` and `de/`. Anton keeps each language version separate, and the UK and DE trees share no structure.\n\n### Our weaknesses\n\n1. **Breadth.** Anton has 2 to 4 times more distinct topics per grade in English, and in German from Klasse 2 on. The phonics, spelling and punctuation gaps listed above are the largest.\n2. **Few interaction types and almost no production.** Across `content/en/grade-{1..4}/{english,german}` (about 36,900 typed items, practice banks included), 55% are multiple choice and 16% true/false. Typing (`text_input`, 679 items, 1.8%), speaking (107) and tracing (40) are close to absent. Anton has the child write, spell, dictate, build, correct and trace in nearly every skill lesson. Spelling cannot be taught well through multiple choice.\n3. **No systematic phonics progression in either language.** Anton follows Letters and Sounds (UK) and the Fibel letter order (DE), with cumulative reviews after every sound set. Our phonics is a set of topics rather than one ordered sequence.\n4. **No German spelling strategies and no handwriting.** These are core to German Klasse 1 to 4 and are what teachers and parents check against.\n5. **The German track switches from DaZ to L1 at G3** (see above).\n6. **Thin text library.** Anton gives each reading exercise its own story, play, fable or informational text. Ours reuse short passages per skill.\n7. **Curriculum alignment is unlabelled.** Anton names its frameworks: National Curriculum, statutory word lists, KS1 SATs, Letters and Sounds, Ausgangsschrift. Our catalogues do not cite a standard, which makes them harder to sell to schools.\n\n### Suggested follow-ups, in priority order\n\n1. Extend `german-en-loi-standard.md` to G3/G4, or split L1 German into its own track, before authoring more G3/G4 German.\n2. Add a typed spelling item and a dictation item (audio to typed word) to the item types. Then retrofit the spelling topics.\n3. Draft one ordered phonics sequence for G1 English (graphemes in order with cumulative reviews) and one Erstlesen sequence for G1 German. Map the existing topics into it.\n4. Add the missing English grammar and punctuation topics to the G2 to G4 catalogues, using the Anton lists above as a checklist.\n5. Add a Rechtschreibstrategien strand to German G2 to G4.\n6. Tag each catalogue lesson with the framework objective it serves (for example English NC or Bildungsstandards).\n"},{"path":"anton/notes/prior/2026-10-07-catalogue-suggestions-from-anton.md","md":"****# Catalogue suggestions from the Anton comparison (en and de)\n\n> **Prior baseline, kept as written.** From the first crawl on 2026-10-07, moved\n> here from schoolido-learning/docs/notes on 2026-10-08. Capped at our G1 to G4\n> and Anton's matching grades, and built on sampled data. Catalogue suggestions\n> are out of scope for Phase 1; this note is input for Phase 3 (coverage\n> matrix), to be redone against the full capture.\n\nDate: 2026-10-07. Status: suggestions only. No catalogue, schema or content file was changed. Builds on [`2026-10-07-anton-curriculum-research.md`](2026-10-07-anton-curriculum-research.md), which has the full Anton topic maps.\n\nSources:\n- Our side: the 16 catalogues at `content/{en,de}/grade-{1..4}/{english,german}/module-catalog.md`, the question-type schemas in `schemas/question-types/`, and `docs/authoring/german-en-loi-standard.md`.\n- Anton side: course trees for UK English (Reception to Year 5), Deutsch (Klasse 1 to 4), DaZ (Vokabel-Training leicht, Kurs A1) and Englisch for German children (Stufe 0, Stufe 1 und 2, Klasse 3, Klasse 4).\n- About 25 Anton exercises opened and screenshotted to learn the mechanics. The screenshots were deleted afterwards and no item content is recorded here.\n\n## 1. Who each catalogue serves, and what to compare it with\n\n| Catalogue | Learner, as the repo states it | Topic list today | Anton counterpart |\n| --- | --- | --- | --- |\n| `en/english` | Native English (implied by `english-standard.md`: US spelling, phoneme notation) | Native English phonics, reading, writing process, grammar, media | UK English Year 1 to Year 5 |\n| `en/german` | German for English speakers (`german-en-loi-standard.md`, scoped to G1 and G2 only) | G1 is beginner vocabulary. G2 to G4 drift into native-speaker content (Aufsatz, Dativ, adjective endings) | DaZ Vokabel-Training and Kurs A1, plus Anton's Englisch for German children as a model for a foreign-language course |\n| `de/english` | English for German-speaking children (stated only in the G1 Letter Sounds note) | Same topic list as `en/english`: native-English CVC families, vowel teams, writing process, media literacy | Englisch Stufe 0, Stufe 1 und 2, Klasse 3, Klasse 4 |\n| `de/german` | German-native (stated only in the G1 Letter Sounds note: \"German-native twin\") | Same topic list as `en/german`: numbers 1 to 20, colours, family words, greetings | Deutsch Klasse 1 to 4 |\n\nAll 8 de/en pairs have identical unit and lesson lists. That is the biggest finding. The de version teaches native-English phonics to German children, and foreign-language beginner vocabulary to native German children. Anton keeps these four audiences as four separate courses with different content.\n\n## 2. Exercise types: Anton against ours\n\nEvery mechanic below was observed in a live Anton exercise. \"Ours\" refers to our 19 question-type schemas.\n\n| # | Anton mechanic (where seen) | Our type | Verdict |\n| --- | --- | --- | --- |\n| 1 | Tap one of 2 to 4 tiles after an audio prompt (Reception \"Find Letter\", DE Klasse 2 \"Störenfriede\") | `multiple_choice`, `audio_choice`, `image_multiple_choice` | Covered |\n| 2 | Tap each picture to hear its word, then drag every matching picture into one drop zone (Reception \"Drag Pictures and Sounds\") | `multi_select` / `drag_and_drop` | **Gap.** The gesture is covered, but no option schema has an audio field. `audio_choice` has one `audio_url` per question, not per option. |\n| 3 | Sort picture-and-word cards into 2 or 4 bins (Year 1 Nouns \"Sort\", the Test) | `sorting` | Covered |\n| 4 | Draw lines from several words to one category (Year 1 Nouns \"Combine\") | `matching` / `multi_select` | Covered. Only the gesture differs. |\n| 5 | Spell a whole word from audio plus a photo, typed letter by letter (Year 1 \"Writing Whole Words\") | `text_input` (has `narration_url`, `image_url`, `pattern`) | The schema supports it, but we use it rarely: 679 items, under 2%. |\n| 6 | Dictation: hear a sentence, type the one missing word into a gap in the printed sentence (DE Klasse 1 \"Wörter hören und schreiben\") | None. `text_input` has no sentence frame, and `fill_in_blank` only takes tiles. | **Gap** |\n| 7 | Transform a sentence by typing a phrase into a gap (Year 3 \"Adding Fronted Adverbials\") | None, for the same reason as 6 | **Gap** |\n| 8 | Fill letter or punctuation tiles into gaps in a sentence (Year 1 \"Fill in\", Year 3 \"Writing Speech\") | `fill_in_blank` with tile distractors | Covered |\n| 9 | Build a sentence from word or clause blocks, with distractor blocks and a Check button (DE \"Satzsalat\", Year 4 \"Building Complex Sentences\") | `ordering` (supports distractors) | Covered |\n| 10 | Tap a word inside a sentence (Year 5 \"Finding Silent Letters\") | `highlight_in_text` | Covered |\n| 11 | Flash reading: tap Start, a word shows for about 5 seconds and hides, then pick the matching picture from 2 (DE \"Blitzlesen\") | None | **Gap** |\n| 12 | Tracing on German four-line paper (Lineatur), with a start dot, an arrow, enforced stroke order and multi-stroke letters, in three cursive scripts (DE Klasse 2 Schreibschrift) | `tracing` (only `char` and `correct_answer`) | **Gap in depth.** There are no lines, no script choice, no stroke order and no words. |\n| 13 | Story as audio clips: drag each clip to the matching picture (Year 1 \"Stories\") | `matching` (text and image only) | **Gap.** No audio-to-picture matching for listening comprehension. |\n| 14 | Syllables coloured alternately black and blue in printed German sentences (DE Klasse 1 dictation) | None | **Gap** for de/german G1 and G2 reading |\n| 15 | Word-search grid with colour-coded target words (Year 1 \"Spelling Practice\") | None | Low priority. It is a motivational activity. |\n| 16 | Narrated animated explainer slide inside the first exercise, with replay (DE \"Wörter verlängern\") | `teach` step: 3 to 5 worked examples | Ours is stronger |\n| 17 | \"Hint\" button, Year 3 and up: one narrated strategy note per exercise | 3-tier hints per item on every guided-practice item | Ours is stronger |\n| 18 | A wrong answer offers \"try again\" or \"reveal\". The reveal strikes the wrong answer in red and shows the right one, then \"Weiter\". | App behaviour, not schema | Ask the app team what happens after tier 3 today. The strike-through reveal is a clear pattern to copy. |\n| 19 | KS1 SATs-format practice papers (Year 2) | None | Only worth adding if a market needs exam prep |\n\n### Schema suggestions, ranked\n\n1. **A typed gap inside a sentence** (rows 6 and 7). Either add an optional `frame` to `text_input`, or add an `input: \"typed\"` mode to `fill_in_blank`. This one change unlocks dictation in both languages and transformation items in grammar.\n2. **Flash display** (row 11). Add an optional `display_ms` to `multiple_choice` and `image_multiple_choice`, so the stem hides after a set time. It serves sight-word fluency (en/english G1, G2) and Blitzlesen (de/german G1 to G3).\n3. **Tracing v2** (row 12). Add `lineature` (none, or four-line), `script` (print, Schulausgangsschrift, Vereinfachte Ausgangsschrift, Lateinische Ausgangsschrift, UK pre-cursive), stroke-order data, and multi-letter words.\n4. **Per-option audio** (rows 2 and 13). Add an optional `audio_url` on options in `multi_select`, `drag_and_drop`, `sorting` and `matching`, so a child can tap a picture to hear its word and can match audio clips to pictures. This serves phonics (which pictures start with /s/), listening comprehension, and both foreign-language catalogues.\n5. **Syllable marking** (row 14). Add an optional syllable-split field on text-bearing items so the app can render alternating colours or arcs. German only.\n\nNo schema change is needed for row 5. Typed spelling is an authoring habit we have not built. Every phonics and spelling lesson final could carry at least one `text_input` spelling slot.\n\n## 3. en version\n\n### en/english (native English, G1 to G4)\n\n**Keep.** Writing as a process, speaking and listening, presentation, media and digital literacy, fluency, and the teach step with 3-tier hints. Anton's UK English has none of these up to Year 5.\n\n**G1**\n- **Move consonant digraphs and the first vowel teams into G1.** We teach sh, ch, th, wh, ai, ee, oa and ui in G2. Anton teaches them in Reception and Year 1, and Common Core puts consonant digraphs, final -e and common vowel teams in grade 1 (RF.1.3a, RF.1.3c). Suggested G1 order: letter sounds, CVC, short vowels, word families, digraphs (sh, ch, th, ck, ng), then magic e, then vowel teams (ai, ee, oa, igh).\n- **Add a cumulative review part after every two or three sound topics.** This mirrors Anton's \"Phonics Review\" lessons. Our mixed-review parts only review their own lesson.\n- **Add a typed spelling slot** to the CVC, short-vowel and word-family finals.\n- **Add \"and\" as a joining word and a question-words part** to the Writing Sentences lessons. Anton Year 1 has Question Words and Connectives. Our G1 has neither.\n\n**G2**\n- Add alternative vowel spellings (ay, ou, ie, ea, oy, ir, ue, aw, ew, oe, au) after the vowel teams.\n- Add suffix spelling rules: -ment, -ness, -ful, -less, -ly. Then contractions with apostrophes, possessive apostrophes and common homophones (there/their/they're, to/too/two).\n- Grammar now covers nouns, verbs, adjectives, adverbs and contractions. Add personal and possessive pronouns, a/an, conjunctions (and, but, because, or, when, if), past and present tense with the progressive form, the four sentence types (statement, question, command, exclamation), and commas in lists.\n\n**G3**\n- Grammar and punctuation: fronted adverbials with the comma, prepositions and conjunctions of time, place and cause, present perfect, paragraphs and headings, and direct speech with inverted commas as its own lesson (it currently sits inside Advanced Punctuation).\n- Word study: prefixes in, il, im, ir, mis, dis, re, sub, super, anti and auto. Suffixes -ation, -ous, -ly, -sure/-ture and -tion/-sion/-cian. Word families.\n- Reading: genre lessons (fables, fairy tales, rhyme and alliteration in poems) and purpose of a text.\n\n**G4 (UK Year 5 by age)**\n- Grammar: relative clauses, modal verbs (Anton calls them \"degrees of possibility\"), formal and informal register, and cohesion across paragraphs.\n- Punctuation: brackets, dashes, hyphens, bullet points and colons in lists. Our Advanced Punctuation covers commas and quotes only.\n- Spelling: -able/-ible, -cious/-tious, -ant/-ent families, ei/ie, ough, silent letters, unstressed vowels.\n- Reading: drama or play scripts. Poetry is covered.\n\n**Cross-grade**\n- **Tag each lesson with one standard.** Our English standard uses US spelling, so Common Core (RF, L, RL, RI, W, SL) fits. None of the 16 catalogues cites a framework today.\n- **Give reading parts their own texts.** Anton writes a new text for each reading exercise (stories, fables, informational texts, plays). One short authored text per reading part, reused across that part's skills, would close most of this gap.\n\n### en/german (German for English speakers)\n\n**G1** matches DaZ starter vocabulary well: numbers, colours, family, body, animals, food, classroom, weather, greetings, ich bin / ich habe, question words, time words and polite phrases. Keep it.\n\n**G2** is the problem year. Today it covers word families (-er, -chen), affixes, word meaning in context, paragraph writing, creative writing, poetry, five culture units, research, and digital and media literacy. Most of that is native-speaker or cross-curricular content. A 7-year-old English speaker in their second year of German cannot work in German at that level. Suggest rebuilding G2 around the next band of DaZ A1 themes, with grammar taught inside each theme:\n- Clothes; home, rooms and furniture; toys; town and transport; nature\n- Hobbies and free time (ich spiele, ich mag, ich kann)\n- Shopping, numbers to 100 and money\n- Feelings (Wie geht es dir?)\n- Days, months and seasons; birthday\n- Grammar threads: der/die/das with plurals, haben and sein, ich/du/er/sie verb forms, kein, mögen and können\n\n**G3 and G4** should continue the foreign-language track (A1 into A2):\n- Daily routine and telling the time; the school day\n- Food, restaurant and ordering; weather and seasons; travel and places\n- Telling what happened (Perfekt with haben and sein)\n- Fixed phrases with prepositions (in der Schule, auf dem Tisch), without teaching the Dativ as a system\n- Describing people; short emails and postcards; short reading texts\n\nMove these to `de/german`, where they belong: Aufsatz, the Dativ grammar unit, adjective endings, research, and presentations held in German.\n\n**Other suggestions**\n- Extend `german-en-loi-standard.md` to G3 and G4 so the \"English for the ask, German for the target\" rule holds through G4.\n- Lean on `speak` (pronunciation), `audio_choice` (listening) and audio-to-picture `matching` (schema suggestion 4). Introduce typed vocabulary spelling (`text_input`) from G2.\n- Keep the culture units. Anton's English course for German children has an \"English speaking world\" unit (UK, London, Ireland, North America, Australia, New Zealand), which supports keeping German culture in a foreign-language course.\n- Anton closes every theme with a \"Review\" lesson. Our mixed-review parts already do this.\n\n## 4. de version\n\n### de/english (English for German-speaking children)\n\nToday the catalogue is the native-English list. Only the G1 Letter Sounds lesson was authored as English for German speakers. Anton's course for this learner is theme-based vocabulary and spoken chunks, with reading and writing coming late:\n- Stufe 0: 7 themes, 15 lessons\n- Stufe 1 und 2: 11 themes, about 29 lessons\n- Klasse 3: 15 themes, about 85 lessons\n- Klasse 4: 10 themes, about 35 lessons\n\nSuggest rebuilding de/english as a foreign-language catalogue:\n\n- **G1:** hello and goodbye, \"my name is\", colours, numbers 1 to 10, body and head, family, school, classroom and schoolbag, toys, pets and farm animals, fruit. Keep Letter Sounds as an \"English sounds\" strand. Mostly listening and speaking (`audio_choice`, `image_multiple_choice`, `speak`), with almost no reading.\n- **G2:** numbers 11 to 20, clothes, the home (rooms and furniture), outside (town, nature, transport), food and drink and meals, feelings, weather, days of the week, birthday. Chunks: I like, I have got, Can I have ...?\n- **G3 (Anton Klasse 3):** age and where I am from, \"What colour is it?\", phone numbers, extended family, wild animals and favourite animal, clothes by season, school and best friends, city life, meals, months and seasons, weather and temperature, and the English-speaking world. Start reading words and short sentences. Start copying words.\n- **G4 (Anton Klasse 4):** numbers to 100 and maths in English, telling the time and daily routine, the five senses, hobbies and sports with can/can't, jobs (\"I want to be ...\"), ordering in a restaurant, directions around the world, water animals and how animals move, special days. Short texts and simple writing (postcard, profile).\n- **Pronunciation for German speakers:** a light strand on the sounds German speakers find hard. These are th, w against v, the short a in cat against e in bed, and final voiced consonants (bed, dog).\n- **Drop from de/english:** CVC word families, vowel teams, silent letters, Greek and Latin roots, the five-paragraph essay, the writing process, and media and digital literacy. Those belong to native-English learners.\n\n### de/german (German for native speakers)\n\nToday the catalogue is the en/german list. G1 is beginner vocabulary that 6-year-old native speakers already know orally, and G3 and G4 mix second-language topics (gender, present-tense conjugation, travel and hobby vocabulary) with native ones. Anton's Deutsch Klasse 1 to 4 is a good checklist.\n\n**G1: replace the vocabulary units with beginning reading (Erstlesen)**\n- Letters and sounds in one fixed order with cumulative reviews. Anton uses the Fibel order L, O, A, M, I, S, T, E, N, D, U, P, K, B, F, Ei, R, H, W, G, Au, Sch, Z, Eu, Ch, J, then Ö, Ü, Ä, St, Sp, Pf, ng, nk, Qu, V, C, Y, X, Äu, ck, ß. Group 3 or 4 sounds per part.\n- Reading syllables (one, two and three syllables), then words, then sentences, then first short texts.\n- Writing: copying words, gap words, dictation (hear and write), capital letters at sentence start, a first look at capitalised nouns, articles, singular and plural.\n- Speaking and listening: rhymes, poems, tongue twisters.\n- Blitzlesen with basic vocabulary (needs schema suggestion 2).\n\n**G2**\n- **Keep:** compound nouns, affixes (they map to Anton's Wortbausteine), articles, verb conjugation, poetry.\n- **Add Rechtschreibstrategien as a named strand** that repeats in G2 to G4: Silbenschwingen, Verlängern (d/t, b/p, g/k), Ableiten (ä, äu) and Merkwörter. Also short and long vowels, Sp/St, Qu, V, tz, chs/x, word stem and word family, and ABC order.\n- **Add text types for writing:** list, invitation, letter, picture story, profile, describing a process, revising a text.\n- **Drop or move:** \"Word Order\" (native speakers produce verb-second order without being taught it), the five culture units (Sachunterricht territory for native speakers), and research, digital and media (move to G3 or G4, or make them cross-curricular).\n\n**G3**\n- **Add:** Satzglieder (subject, predicate, moving parts of a sentence), direct speech with the speech tag before, inside and after, strong and weak verbs in the past, verb prefixes, adjectives with -ig and -lich and comparison, nouns with -ung, -nis, -heit and -keit, using a dictionary, correcting spelling mistakes with the strategies, fairy tales (Grimm, Andersen), Elfchen and haiku, Reizwortgeschichte.\n- **Reframe:** turn \"Noun Gender\" into a short \"Artikel bestimmen\" part, and turn \"Present Conjugation\" into Personalform and Grundform. Native speakers know gender and conjugation and need the labels, not the forms.\n- **Move to en/german:** vocabulary for travel and hobbies.\n- **Keep:** du/Sie register, Perfekt, plurals, punctuation and capitalisation, presentations.\n\n**G4**\n- **Add:** all four cases (we only have a Dativ introduction), Futur, dative and accusative objects as Satzglieder, place and time adverbials, das against dass, commas in lists, s-sounds (s, ss, ß), ph and v, capitalising nouns hidden behind an article and multi-part names, idioms and loanwords, legends, ballads and fables, reciting a poem, giving a talk with feedback, interviews, emails, reports.\n- **Reframe:** turn \"Adjective Endings\" (taught by article type: definite, indefinite) into fitting adjectives into sentences. Anton covers this as \"Adjektive anpassen\" in Klasse 2 and 3 and has no ending-table unit in Klasse 4. Ending tables are how a second-language course teaches it.\n- **Keep:** Aufsatz, letter writing, Präteritum, derivation, compound words, media literacy.\n\n**Item types for de/german:** typed dictation in a sentence (schema suggestion 1), syllable marking (5), Blitzlesen (2), tracing on Lineatur with a choice of Ausgangsschrift (3). Spotting the misspelt word (\"Störenfriede\") already works with `multiple_choice` or `highlight_in_text`.\n\n## 5. What playing whole exercises showed\n\nPlayed end to end or for several items each:\n- Year 1 Nouns: the intro exercise, \"Find\", and the Test\n- Year 5 Haikus: \"The Old Pond\", a reading exercise\n- Englisch Klasse 3 Colours: \"Vokabeln lernen\", \"Vokabeln üben\" and \"Vokabeln buchstabieren\"\n- Two DaZ A1 lesson pages\n\n**Scoring and rewards**\n- Every action is scored on its own. Each card dropped in a sort, and each tap in a \"select every ...\" scene, is one segment of the progress bar.\n- A wrong tap adds a red segment and brings up a \"Solve\" button, but the child carries on with the same item.\n- An exercise ends with 0 to 3 stars, filled in proportion to the score (one wrong tap in 9 left about 2.7 stars). A Test ends with 0 to 3 trophies in the same way. One mistake in 8 cards still passed the Test.\n- The lesson page shows the stars for each exercise and the trophies for the Test. Nothing is locked: the Test can be taken before the drills.\n- \"My results\" keeps a printable history of each attempt, with a timestamp, a score bar and a replay of every item.\n\n**Feedback**\n- A wrong answer gets a generic message plus retry or reveal.\n- In reading exercises, a correct answer is followed by a narrated explanation card giving the reason. Our `explanation` field could do the same.\n- Our item-quality rules already require per-option feedback that names the mistake (\"That's ten more. Count on by just one.\"), which goes further than Anton's generic message. Ask the app team whether `explanation` is shown after correct answers as well as wrong ones.\n\n**Item design**\n- Many Anton items offer only 2 options: Blitzlesen, the Year 5 image choice, the Year 5 word choice. We have no rule on option count. Setting a floor of 3 options for multiple choice outside true/false would keep our guess rate below theirs.\n- In reading exercises the text stays pinned above the questions. Answered questions stay on screen and the next one appears below, so the child never has to remember the text.\n- The intro exercise for a concept is 4 narrated flashcards (picture plus word) that advance on their own. Picture questions on the same words follow immediately. It is a short version of our teach step followed by guided practice.\n\n**The foreign-language lesson template (Englisch Klasse 3)**\n\nEvery vocabulary lesson runs the same five exercises: Vokabeln lernen, Vokabeln üben, Vokabeln abschreiben, Vokabeln buchstabieren, Test.\n- **Lernen:** flashcards with a picture, the English word with audio, and the German translation in italics. The instruction is in German.\n- **Üben:** matching translation pairs by sliding one tile onto the other, plus picture choice.\n- **Buchstabieren:** drag letter tiles into one box per letter, a scaffold before free typing.\n\nThis maps onto our part structure. Learn is the teach step, practise is guided practice, copy and spell are applied practice, and Test is the assessment. Suggest using it as the default part shape for de/english and en/german vocabulary parts. Letter-tile spelling already works with our `ordering` type: letters as options, `slot_count` equal to the word length, extra letters as distractors.\n\n**DaZ lesson tags**\n\nEach DaZ A1 lesson page carries a tag line that names the communicative goal and the grammar points. \"Ich habe einen Stift.\" is tagged: naming things, indefinite articles, accusative object, pronouns, conjugation of haben, statement, question, present tense. Its exercises drill the haben forms, then the pronoun choice, then ein/eine/einen, then complete sentences, then the Test. This is the model for en/german G2 to G4: grammar taught inside a phrase, and a can-do plus grammar tag on every part (see item 6 of the order of work below).\n\n## 6. Suggested order of work\n\n1. **Decide that de/english is a foreign-language course and de/german is a native-speaker course, then rebuild their catalogues.** Today the de version ships the wrong curriculum to both audiences. This matters more than any single topic gap.\n2. **Refocus en/german G2 to G4 on A1/A2 themes,** and extend the en-LOI standard to G4.\n3. **Add the Rechtschreibstrategien strand to de/german G2 to G4,** and Erstlesen to de/german G1.\n4. **Add the phonics spine and the missing grammar and punctuation lessons to en/english.**\n5. **Schema work:** typed gap in a sentence first, then flash display, tracing v2, per-option audio and syllable marking.\n6. **Tag every lesson with a framework objective** (Common Core for en/english, the KMK Bildungsstandards for de/german, CEFR levels for both foreign-language catalogues), so the gaps above can be tracked.\n"},{"path":"anton/tools/lists/1f/README.md","md":"# 1f chunks\n\nGenerated by `tools/chunk-1f.mjs` from files not yet captured. Run one chunk with\n`node tools/fetch.mjs levels tools/lists/1f/\u003cfile> --delay 1` from `anton/`.\nCreate `tools/STOP` to end a run after the file in flight.\n\n| # | Chunk file | Curriculum | Subject | Files | MB | Hours at 1.35 s |\n|---|---|---|---|---|---|---|\n| 1 | `01-de-natdeu.txt` | German-DE | Deutsch | 3918 | 20.4 | 1.5 |\n| 2 | `02-de-mat.txt` | German-DE | Maths | 4054 | 18.7 | 1.5 |\n| 3 | `03-de-deu.txt` | German-DE | Deutsch als Zweitsprache (DaZ) | 1079 | 10.1 | 0.4 |\n| 4 | `04-de-eng.txt` | German-DE | English (foreign or additional language) | 2544 | 16.1 |     const tag = current ? `<span class="chip active"><span class="dot"></span>current</span>` : /\(optional\)/.test(p.title) ? `<span class="chip">optional</span>` : "";
    pane.append(h(`<div class="phase ${current ? "current" : ""}"><span class="no">${idx + 1}</span>
      <div class="body"><div class="block-head"><div class="toolbar"><span class="eyebrow">${esc(name)}</span>${tag}</div><h2>${inl(heading.charAt(0).toUpperCase() + heading.slice(1))}</h2></div>${body}</div></div>`));
  });
}

// ---------- catalogue ----------
const catState = { cur: "en_gb", course: null, q: "" };
const CUR_NAME = { en_gb: "English-GB", de: "German-DE" };
const gLabel = (g, cur) => (g === 0 ? "R" : g === 99 ? "–" : String(g));
function renderCatalogue() {
  const pane = panes.catalogue;
  if (!D.cat) { pane.append(h(`<div class="empty"><b>No catalogue yet.</b><span class="muted">Run <code>node catalogue/build.mjs</code> after the structure pass.</span></div>`)); return; }
  pane.append(h(`
    <div class="block-head">
      <span class="eyebrow">catalogue.db · built from ${fmt(D.captures.plans)} course files</span>
      <h2>Every Anton course, by subject and grade</h2>
      <p class="muted">Each bar spans the grades a course covers. Click a course to see its topics and lessons, with the exercise count per lesson in brackets. Search finds lessons by title across the whole curriculum.</p>
      <div class="toolbar" id="cat-cur">
        ${Object.entries(CUR_NAME).map(([k, v]) => `<button class="chip ${k === "en_gb" ? "en" : "de"}" data-v="${k}" aria-pressed="${k === catState.cur}">${v}</button>`).join("")}
        <input type="search" id="cat-q" placeholder="Search lessons, e.g. fractions, Satzglieder" aria-label="Search lessons">
      </div>
    </div>
    <div id="cat-body" class="block"></div>
  `));
  pane.querySelectorAll("#cat-cur button").forEach((b) => b.addEventListener("click", () => { catState.cur = b.dataset.v; catState.course = null; drawCatalogue(); }));
  pane.querySelector("#cat-q").addEventListener("input", (e) => { catState.q = e.target.value.trim().toLowerCase(); drawCatalogue(); });
  drawCatalogue();
}
function openCourse(cur, id) {
  catState.cur = cur; catState.course = id || null; catState.q = "";
  const q = document.getElementById("cat-q"); if (q) q.value = "";
  show("catalogue", true); drawCatalogue();
  if (id) document.getElementById("cat-detail")?.scrollIntoView({ block: "start" });
}
function drawCatalogue() {
  const cur = catState.cur, L = cur === "en_gb" ? "en" : "de";
  document.querySelectorAll("#cat-cur button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === cur)));
  const courses = D.cat.curricula[cur];
  const body = document.getElementById("cat-body");
  if (catState.q) {
    const hits = [];
    for (const c of courses) for (const t of D.cat.topics[c.id] || []) for (const [title, n] of t.lessons)
      if (title.toLowerCase().includes(catState.q) || t.title.toLowerCase().includes(catState.q)) hits.push({ c, t, title, n });
    body.innerHTML = `<p class="note">${hits.length} lessons match in ${CUR_NAME[cur]}${hits.length > 300 ? ", first 300 shown" : ""}.</p>` +
      (hits.length ? tableHtml(["Lesson", "Topic", "Course", "Grades", "Exercises"], hits.slice(0, 300).map((x) => [x.title, x.t.title, x.c.title + " · " + x.c.subject_name, x.c.grades.map((g) => gLabel(g, cur)).join(", "), String(x.n)]), [4]) : "");
    return;
  }
  const graded = [...new Set(courses.flatMap((c) => c.grades).filter((g) => g !== 99))].sort((a, b) => a - b);
  const cols = [...graded, ...(courses.some((c) => c.grades.includes(99)) ? [99] : [])];
  const colOf = (g) => cols.indexOf(g) + 2;
  const bySubj = {};
  for (const c of courses) (bySubj[c.subject_name] ||= []).push(c);
  const maxL = Math.max(...courses.map((c) => c.lessons), 1);
  let rows = "", r = 2;
  for (const [subj, cs] of Object.entries(bySubj).sort((a, b) => b[1].reduce((s, c) => s + c.lessons, 0) - a[1].reduce((s, c) => s + c.lessons, 0))) {
    const total = cs.reduce((s, c) => s + c.lessons, 0);
    rows += `<div class="cg-subj" style="grid-row:${r};grid-column:1 / -1"><b>${esc(subj)}</b><span>${cs.length} courses · ${fmt(total)} lessons</span></div>`; r++;
    for (const c of cs) {
      const gs = c.grades.filter((g) => cols.includes(g));
      const a = Math.min(...gs.map(colOf)), b = Math.max(...gs.map(colOf));
      rows += `<div class="cg-name" style="grid-row:${r}">${esc(c.title)}</div>
        <button class="cg-bar ${L} ${c.outdated ? "outdated" : ""} ${catState.course === c.id ? "sel" : ""}" style="grid-row:${r};grid-column:${a} / ${b + 1};--w:${Math.max(6, (c.lessons / maxL) * 100)}%" data-id="${esc(c.id)}" type="button" title="${esc(c.title)}: ${c.lessons} lessons, ${c.exercises} exercises">
          <i></i><span>${fmt(c.lessons)}${c.outdated ? " · outdated" : ""}</span></button>`;
      r++;
    }
  }
  body.innerHTML = `
    <div class="cg-scroll"><div class="cg" style="grid-template-columns: minmax(150px, 220px) repeat(${cols.length}, minmax(44px, 1fr))">
      <div class="cg-h" style="grid-row:1;grid-column:1">${cur === "de" ? "Klasse" : "Year"}</div>
      ${cols.map((g) => `<div class="cg-h" style="grid-row:1;grid-column:${colOf(g)}">${g === 99 ? "not graded" : gLabel(g, cur)}</div>`).join("")}
      ${cols.map((g) => `<div class="cg-col ${g >= 1 && g <= 4 ? "tw" : ""}" style="grid-row:2 / ${r};grid-column:${colOf(g)}"></div>`).join("")}
      ${rows}
    </div></div>
    <div class="legend"><span><i style="background:color-mix(in srgb, var(--accent) 25%, transparent)"></i>Grades 1 to 4, Twist's current range</span><span>Bar shading shows lesson count against the largest course.</span></div>
    <div class="panel ${L}" id="cat-detail">${courseDetail(cur)}</div>`;
  body.querySelectorAll(".cg-bar").forEach((b) => b.addEventListener("click", () => {
    catState.course = b.dataset.id; drawCatalogue();
    document.getElementById("cat-detail").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }));
}
function courseDetail(cur) {
  const c = D.cat.curricula[cur].find((x) => x.id === catState.course);
  if (!c) return `<span class="eyebrow">Course detail</span><p class="muted">Pick a course bar above to list its topics and lessons.</p>`;
  const ts = D.cat.topics[c.id] || [];
  return `<span class="eyebrow">${esc(c.subject_name)} · <code>${esc(c.id)}</code></span>
    <h2>${esc(c.title)}</h2>
    <div class="toolbar">
      <span class="chip">${c.grades.map((g) => (g === 99 ? "not graded" : (cur === "de" ? "Klasse " : "Year ") + gLabel(g, cur))).join(", ")}</span>
      <span class="chip">${fmt(ts.length)} topics</span><span class="chip">${fmt(c.lessons)} lessons</span><span class="chip">${fmt(c.exercises)} exercises</span>
      ${c.outdated ? `<span class="chip gate">marked outdated by Anton</span>` : ""}
    </div>
    <div class="sec-list">${ts.map((t) => `<details class="sec"><summary><div class="bar-row"><span class="label" title="${esc(t.title)}">${esc(t.title)}</span><span class="bar"><i style="width:${(t.lessons.length / Math.max(...ts.map((x) => x.lessons.length), 1)) * 100}%"></i></span><span class="val">${t.lessons.length}</span></div></summary>
      <div class="detail">${t.lessons.map(([title, n]) => `${esc(title)} <span class="mono">[${n}]</span>`).join(" · ")}</div></details>`).join("")}</div>`;
}

function listPanel(grp, cls = "") {
  return `<div class="panel ${cls}"><h3>${esc(grp.title)}</h3>
    ${grp.items.length ? `<ul class="items">${grp.items.map((it) => `<li>${it.lead ? `<b>${inl(it.lead)}</b>` : ""}<span>${inl(it.rest)}</span></li>`).join("")}</ul>` : ""}
    ${(grp.text || []).map((t) => `<p class="muted">${inl(t)}</p>`).join("")}</div>`;
}
function drawGaps() {
  const groups = D.prior.gaps.groups.map((x) => ({ ...x, L: /^English/.test(x.title) ? "en" : "de" }));
  const show = groups.filter((x) => gapLang === "all" || x.L === gapLang);

  document.getElementById("gap-body").innerHTML =
    `<div class="cols">${paired.map((x) => listPanel(x, x.L)).join("")}</div>` + notes.map((x) => listPanel(x, x.L)).join("");
}

// ---------- docs ----------
let curDoc = "README.md";
function renderDocs() {
  const pane = panes.docs;
  const byDir = {};
  for (const d of D.docs) { const dir = d.path.includes("/") ? d.path.slice(0, d.path.lastIndexOf("/")) : "rnd"; (byDir[dir] ||= []).push(d); }
  pane.append(h(`<div class="docs">
    <nav class="doc-list" aria-label="Documents">${Object.entries(byDir).map(([dir, ds]) => `<div class="dir">${esc(dir)}</div>${ds.map((d) => `<button data-p="${esc(d.path)}">${esc(d.path.split("/").pop())}</button>`).join("")}`).join("")}</nav>
    <article class="prose" id="doc-body"></article>
  </div>`));
  pane.querySelectorAll(".doc-list button").forEach((b) => b.addEventListener("click", () => openDoc(b.dataset.p, true)));
  pane.querySelector("#doc-body").addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    const href = a.getAttribute("href") || "";
    if (/^[a-z]+:/i.test(href) || href.startsWith("#")) return;
    const target = resolve(curDoc, href.split("#")[0]);
    const hit = D.docs.find((d) => d.path === target || d.path === target.replace(/\/$/, "") + "/README.md");
    e.preventDefault();
    if (hit) openDoc(hit.path, true);
  });
  openDoc(curDoc, false);
}
function resolve(from, rel) {
  const parts = from.split("/").slice(0, -1);
  for (const p of rel.split("/")) { if (p === "..") parts.pop(); else if (p && p !== ".") parts.push(p); }
  return parts.join("/");
}
function openDoc(path, scroll) {
  const d = D.docs.find((x) => x.path === path) || D.docs[0];
  curDoc = d.path;
  document.querySelectorAll(".doc-list button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.p === d.path)));
  const body = document.getElementById("doc-body");
  body.innerHTML = `<p class="eyebrow">${esc(d.path)}</p>` + (window.marked ? marked.parse(d.md) : `<pre>${esc(d.md)}</pre>`);
  if (scroll) body.scrollIntoView({ block: "start", behavior: "smooth" });
}
