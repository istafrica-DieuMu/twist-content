# Twist lesson player in Docker: twist/serve.mjs on node:22, serving this checkout's
# twist/pages/ and twist/assets/ (mounted read-only) to people signed in with
# their own account (twist/docs/feedback.md).
# Only published on 127.0.0.1: the host nginx in front adds HTTPS
# (twist/pages/hosting/index.html).
#
# Settings live in .env.player next to this file (not in git):
#   TWIST_USER=you@ist.com    # the first admin, made while there are no accounts yet
#   TWIST_PASS=a-long-random-password
#   TWIST_API_URL=            # empty: accounts and feedback in .twist-data/ here;
#                             # set: on the IST-B2C backend (twist/docs/feedback-backend.md)
#   PLAYER_PORT=4410          # host port, default 4410
#
#   docker compose -p twist-player -f docker-compose.player.yml --env-file .env.player up -d
#   docker compose -p twist-player -f docker-compose.player.yml --env-file .env.player logs -f
#
# Content updates are a git pull in this checkout; files are read on every request,
# so a restart is only needed when twist/serve.mjs or twist/server/ changes.
# Accounts and feedback (file store) are in ./.twist-data, the one writable mount;
# back it up. Sessions are kept in memory, so a restart signs everyone out.

services:
  player:
    container_name: twist-player
    image: node:22-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "twist/serve.mjs"]
    ports:
      - "127.0.0.1:${PLAYER_PORT:-4410}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TWIST_USER: ${TWIST_USER:-}
      TWIST_PASS: ${TWIST_PASS:-}
      TWIST_API_URL: ${TWIST_API_URL:-}
      TWIST_DATA: /data
      COOKIE_SECURE: "1"
      # The host's nginx is the only way in: read the client's address from its X-Forwarded-For.
      TRUST_PROXY: "1"
    volumes:
      - ./twist:/app/twist:ro
      - ./.twist-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
