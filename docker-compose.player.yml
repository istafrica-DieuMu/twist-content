# Twist lesson player in Docker: twist/serve.mjs on node:22, serving this checkout's
# twist/pages/ and twist/assets/ (mounted read-only) behind basic auth.
# Only published on 127.0.0.1: the host nginx in front adds HTTPS
# (twist/pages/hosting/index.html).
#
# The login lives in .env.player next to this file (not in git):
#   TWIST_USER=twist
#   TWIST_PASS=a-long-random-password
#   PLAYER_PORT=4410          # host port, default 4410
#
#   docker compose -p twist-player -f docker-compose.player.yml --env-file .env.player up -d
#   docker compose -p twist-player -f docker-compose.player.yml --env-file .env.player logs -f
#
# Content updates are a git pull in this checkout; files are read on every request,
# so a restart is only needed when twist/serve.mjs itself changes.

services:
  player:
    container_name: twist-player
    image: node:22-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "twist/serve.mjs"]
    ports:
      - "127.0.0.1:${PLAYER_PORT:-4410}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TWIST_USER: ${TWIST_USER:?set TWIST_USER in .env.player}
      TWIST_PASS: ${TWIST_PASS:?set TWIST_PASS in .env.player}
    volumes:
      - ./twist:/app/twist:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: 0.5
    healthcheck:
      # Without a login the server answers 401: it is up and checking passwords.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
